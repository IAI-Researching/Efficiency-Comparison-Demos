<script id="rampart-strategy">
function createStrategy() {
  var P = {"margin":0.6,"cap":1000,"airFrac":0.35,"H":900,"futureWaves":1,"types":["cannon","cannon","cannon","cannon","cannon","cannon","cannon","cannon","flak","cannon","flak","flak","flak","cannon","flak","cannon"],"gSeq":[0,2,3,1,4,6,0,2,3,3,1,6,4,5,7,9,13,15,0,2,1,4,6,5,15,7,9,13,15,5,7,9,13],"aSeq":[12,12,8,14,10,8,10,11,12,14,10,8,11,14,11],"tg":{"sm":0,"kb":0,"fw":0.3,"lm":0,"fm":0,"ab":1,"mb":10,"tb":[-0.5,1.0,0,-0.5,0,0,-0.5]}};

  var TCOST = [50, 90, 70, 120, 80], TDMG = [26, 60, 10, 180, 40], TPER = [8, 24, 12, 36, 10];
  var TRNG = [300, 260, 240, 360, 320], TSPL = [0, 90, 0, 0, 70], TSLOW = [0, 0, 30, 0, 0];
  var TGND = [1, 1, 1, 1, 0], TAIR = [1, 0, 1, 0, 1];
  var EN = ["grunt", "runner", "wisp", "brute", "splitter", "mender", "splitling"];
  var EHP = [60, 40, 50, 150, 90, 70, 0], ESPD = [10, 20, 12, 6, 8, 8, 12], ELEAK = [1, 1, 2, 3, 2, 2, 1];

  var SX = [], SY = [];
  for (var q = 0; q < 16; q++) { SX.push(SL[q][0] * 100 + 50); SY.push(SL[q][1] * 100 + 50); }
  function route(pts) {
    var X = [], Y = [];
    for (var i = 1; i < pts.length; i++) {
      var x0 = 100 * pts[i - 1][0] + 50, y0 = 100 * pts[i - 1][1] + 50, x1 = 100 * pts[i][0] + 50, y1 = 100 * pts[i][1] + 50;
      var n = Math.abs(x1 - x0) + Math.abs(y1 - y0), sx = Math.sign(x1 - x0), sy = Math.sign(y1 - y0);
      for (var k = 0; k < n; k++) { X.push(x0 + sx * k); Y.push(y0 + sy * k); }
    }
    X.push(100 * pts[pts.length - 1][0] + 50); Y.push(100 * pts[pts.length - 1][1] + 50);

  }
  var RT = [route([[0, 2], [6, 2], [6, 10], [12, 10], [12, 3], [18, 3], [18, 11], [23, 11]]), route([[0, 6], [21, 6], [21, 11], [23, 11]])];
  var MUL = [0, 1000];
  function mul(w) { while (MUL.length <= w) MUL.push(Math.floor(MUL[MUL.length - 1] * 108 / 100)); return MUL[w]; }
  function tdmg(t, tier) { var d = TDMG[t]; for (var i = 1; i < tier; i++) d = Math.floor(d * 16 / 10); return d; }

  // ---- targeting core: cands are internal enemy objects {id,t,hp,maxHp,armor,air,x,y,slow,prog,R} ----
  var TG = P.tg || { sm: 0, kb: 0, fw: 0.001, lm: 0, fm: 0, ab: 1 };
  var TB = TG.tb || null;
  function choose(tt, tier, c) {
    var n = c.length, i, j, best = c[0], bs = -1e18, e, dmg = tdmg(tt, tier), v;
    if (n === 1) return best;
    if (tt === 1 || tt === 4) {
      var r2 = TSPL[tt] * TSPL[tt];
      for (i = 0; i < n; i++) {
        var a = c[i], sc = 0;
        for (j = 0; j < n; j++) {
          e = c[j]; var dx = a.x - e.x, dy = a.y - e.y;
          if (dx * dx + dy * dy <= r2) {
            var d = Math.max(1, dmg - e.armor);
            sc += (TG.sm ? (d < e.hp ? d : e.hp) / dmg : 1) + (d >= e.hp ? TG.kb : 0) + (e.t === 5 ? (TG.mb || 0) : 0) + (TB ? TB[e.t] : 0);
          }
        }
        sc += TG.fw * a.prog / 100;
        if (sc > bs) { bs = sc; best = a; }
      }
      return best;
    }
    if (tt === 3) {
      for (i = 0; i < n; i++) { e = c[i]; v = (TG.lm === 1 ? Math.min(e.hp, dmg) * 1000 : TG.lm === 2 ? e.hp : 0) + e.prog + (e.t === 5 ? (TG.lmb || 0) : 0); if (v > bs) { bs = v; best = e; } }
      return best;
    }
    if (tt === 2) {
      for (i = 0; i < n; i++) { e = c[i]; v = (TG.fm && e.slow > 0 ? 0 : 1e7) + e.prog + (TG.fm === 2 && e.t === 3 ? 3000 : 0); if (v > bs) { bs = v; best = e; } }
      return best;
    }
    for (i = 0; i < n; i++) { e = c[i]; v = (TG.ab && e.air ? 1e7 : 0) + e.prog; if (v > bs) { bs = v; best = e; } }
    return best;
  }

  // ---- internal forward simulation ----
  function simulate(T, w, ens, tur, spawns, nextId0, hpMul, relWave) {
    var enemies = ens.map(function (e) { return { id: e.id, t: e.t, hp: e.hp, maxHp: e.maxHp, armor: e.armor, air: e.air, slow: e.slow, age: e.age, wave: e.wave, prog: e.prog, R: RT[e.air], x: e.x, y: e.y }; });
    var turs = tur.map(function (t) { return { s: t.s, t: t.t, tier: t.tier, cd: 0, dmg: tdmg(t.t, t.tier), r2: Math.pow(TRNG[t.t] + 30 * (t.tier - 1), 2) }; });
    turs.sort(function (a, b) { return a.s - b.s; });
    var nid = nextId0, si = 0, gl = 0, al = 0, relLeft = 0, i, j, e;
    for (i = 0; i < enemies.length; i++) if (enemies[i].wave <= relWave) relLeft++;
    for (i = 0; i < spawns.length; i++) if (spawns[i].wave <= relWave) relLeft++;
    var minRem = 1e9;
    for (var tick = T; tick < T + P.H; tick++) {
      while (si < spawns.length && spawns[si].tick === tick) {
        var sp = spawns[si++], hpv = Math.floor(Math.floor(EHP[sp.t] * mul(sp.wave) / 1000) * hpMul), air = sp.t === 2 ? 1 : 0;
        enemies.push({ id: nid++, t: sp.t, hp: hpv, maxHp: hpv, armor: sp.t === 0 ? Math.floor(sp.wave / 4) : (sp.t === 3 ? 6 + sp.wave : 0), air: air, slow: 0, age: 0, wave: sp.wave, prog: 0, R: RT[air], x: RT[air].X[0], y: RT[air].Y[0] });
      }
      var keep = [];
      for (i = 0; i < enemies.length; i++) {
        e = enemies[i];
        var spd = ESPD[e.t]; e.prog += e.slow > 0 ? Math.floor(spd * 60 / 100) : spd;
        if (e.prog >= e.R.len) {
          if (e.wave <= relWave) { relLeft--; if (e.air) al += ELEAK[e.t]; else gl += ELEAK[e.t]; }
          continue;
        }
        e.x = e.R.X[e.prog]; e.y = e.R.Y[e.prog];
        keep.push(e);
      }
      enemies = keep;
      for (i = 0; i < enemies.length; i++) {
        e = enemies[i]; e.age++;
        if (e.t === 5 && e.age % 20 === 0) for (j = 0; j < enemies.length; j++) { var o = enemies[j], hx = o.x - e.x, hy = o.y - e.y; if (hx * hx + hy * hy <= 22500) o.hp = Math.min(o.maxHp, o.hp + Math.floor(o.maxHp * 8 / 100)); }
      }
      for (var k = 0; k < turs.length; k++) {
        var t = turs[k];
        if (t.cd > 0) { t.cd--; if (t.cd > 0) continue; }
        var tt = t.t, tx = SX[t.s], ty = SY[t.s], c = [];
        for (i = 0; i < enemies.length; i++) { e = enemies[i]; if (e.air ? !TAIR[tt] : !TGND[tt]) continue; var dx = e.x - tx, dy = e.y - ty; if (dx * dx + dy * dy <= t.r2) c.push(e); }
        if (!c.length) continue;
        var tg = choose(tt, t.tier, c), hits;
        if (TSPL[tt]) { hits = []; var s2 = TSPL[tt] * TSPL[tt]; for (i = 0; i < enemies.length; i++) { e = enemies[i]; if (e.air ? !TAIR[tt] : !TGND[tt]) continue; var ex = e.x - tg.x, ey = e.y - tg.y; if (ex * ex + ey * ey <= s2) hits.push(e); } }
        else hits = [tg];
        var dead = false;
        for (i = 0; i < hits.length; i++) { e = hits[i]; e.hp -= tt === 3 ? t.dmg : Math.max(1, t.dmg - e.armor); if (tt === 2) e.slow = 30; if (e.hp <= 0) dead = true; }
        t.cd = TPER[tt];
        if (dead) {
          var surv = [], add = [];
          for (i = 0; i < enemies.length; i++) {
            e = enemies[i];
            if (e.hp > 0) { surv.push(e); continue; }
            if (e.wave <= relWave) relLeft--;
            if (e.t === 4) { var shp = Math.max(1, Math.floor(e.maxHp / 4)); for (j = 0; j < 3; j++) { add.push({ id: nid++, t: 6, hp: shp, maxHp: shp, armor: 0, air: 0, slow: 0, age: 0, wave: e.wave, prog: e.prog, R: RT[0], x: e.x, y: e.y }); if (e.wave <= relWave) relLeft++; } }
          }
          for (i = 0; i < add.length; i++) surv.push(add[i]);
          enemies = surv;
        }
      }
      for (i = 0; i < enemies.length; i++) if (enemies[i].slow > 0) enemies[i].slow--;
      if (relLeft <= 0 && si >= spawns.length) break;
      if (relLeft <= 0 && spawns[si].wave > relWave && tick > T + 200) break;
    }
    return { g: gl, a: al, left: relLeft };
  }

  var comps = { 1: [0, 0, 0, 0] };
  var leaked = 0;
  function nextItem(seq, tiers, types) {
    var cnt = {};
    for (var i = 0; i < seq.length; i++) {
      var s = seq[i]; cnt[s] = (cnt[s] || 0) + 1;
      if (cnt[s] > 3) continue;
      if (tiers[s] >= cnt[s]) continue;
      if (tiers[s] > 0 && types[s] !== P.types[s]) continue;
      var t = TN.indexOf(P.types[s]);
      return { s: s, t: t, cost: tiers[s] === 0 ? TCOST[t] : TCOST[t] * tiers[s], build: tiers[s] === 0 };
    }
    return null;
  }
  return {
    plan: function (st) {
      var w = st.wave, T = st.tick, i, k;
      comps[w + 1] = st.nextWave.map(function (n) { return EN.indexOf(n); });
      if (st.baseHp < 10) leaked = 10 - st.baseHp;
      var ens = [], maxId = 0;
      for (i = 0; i < st.enemies.length; i++) {
        var v = st.enemies[i], t = EN.indexOf(v.type), air = v.air ? 1 : 0, R = RT[air], pr = R.len - v.remaining;
        ens.push({ id: v.id, t: t, hp: v.hp, maxHp: v.maxHp, armor: v.armor, air: air, slow: v.slowed ? 15 : 0, age: 10, wave: w - 1, prog: pr, x: R.X[pr], y: R.Y[pr] });
        if (v.id > maxId) maxId = v.id;

      var spawns = [];

      var c0 = comps[w] || [];
      for (i = 0; i < c0.length; i++) spawns.push({ tick: T + 4 * i, wave: w, idx: i, t: c0[i] });
      var c1 = comps[w + 1];
      for (i = 0; i < c1.length; i++) spawns.push({ tick: T + 40 + 4 * i, wave: w + 1, idx: i, t: c1[i] });

      var tiers = [], types = [], tur = [];
      for (i = 0; i < 16; i++) { var tr = st.slots[i].turret; tiers.push(tr ? tr.tier : 0); types.push(tr ? tr.type : null); }
      function turList() { var L = []; for (var s = 0; s < 16; s++) if (tiers[s] > 0) L.push({ s: s, t: TN.indexOf(types[s]), tier: tiers[s] }); return L; }
      var acts = [], g = st.gold, hpMul = P.margin + 0.05 * leaked;
      function apply(it) { acts.push(it.build ? { op: "build", slot: it.s, type: TN[it.t] } : { op: "upgrade", slot: it.s }); g -= it.cost; tiers[it.s]++; types[it.s] = TN[it.t]; }

      for (var iter = 0; iter < 24 && acts.length < 30; iter++) {
        var r = simulate(T, w, ens, turList(), spawns, maxId + 1, hpMul, relWave);

        if (r.a > 0 && ia && ia.cost <= g) pick = ia;
        else if (r.g > 0 && ig && ig.cost <= g) pick = ig;
        else if (r.a > 0 && ig && ig.cost <= g && r.g > 0) pick = ig;
        if (!pick) break;
        apply(pick);

      for (iter = 0; iter < 30 && acts.length < 30; iter++) {
        var sa = 0, sg = 0;

        var ia2 = nextItem(P.aSeq, tiers, types), ig2 = nextItem(P.gSeq, tiers, types);
        var pk = (ia2 && (!ig2 || sa < P.airFrac * (sa + sg))) ? ia2 : ig2;

        apply(pk);
      }
      return acts;
    },
    target: function (tur, cands) {
      var c = [];
      for (var i = 0; i < cands.length; i++) {
        var v = cands[i], air = v.air ? 1 : 0, R = RT[air], pr = R.len - v.remaining;

    }

}

function rampartSimulate(createStrategy, seed, maxTicks) {
