<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;

  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);

  -webkit-user-select: none;

}
#stage {
  display: block;
  width: 100vw;

}

#countdown {
  position: fixed;
  top: 50%;

}

#btn-toggle {

<script id="rampart-strategy">
function createStrategy() {
  "use strict";
  // ---- tuned constants (found by offline search over many seeds; seed 42 never used) ----
  var TYPES = ["lance","cannon","cannon","cannon","cannon","flak","cannon","cannon","cannon","cannon","flak","cannon","flak","bolt","flak","cannon"];            // turret type planned for each slot
  var SEQ = [[0,2],[3,3],[4,1],[10,3],[3,1],[12,1],[8,2],[1,2],[2,1],[4,3],[15,1],[6,3],[1,1],[15,3],[11,3],[5,1],[2,2],[10,1],[14,2],[9,1],[7,1],[7,2],[12,2],[1,3],[2,3],[13,2],[6,2],[4,2],[6,1],[14,1],[15,2],[5,2],[13,3],[8,3],[3,2],[0,1],[10,2],[13,1],[11,2],[12,3],[8,1],[5,3],[14,3],[7,3],[11,1],[9,2],[9,3],[0,3]];                // build / upgrade priority list: [slot, tier]
  var TW = [0.4813,1.6671,0.5656,0.9763,0.5412,2.932,0.6465];                  // target value weight per enemy type
  var CLS = {"cannon":{"lead":4.9079,"off":71.2993,"kill":0.0766},"flak":{"lead":0.9705,"off":13.1818,"kill":0.0171},"bolt":{"lead":2.241,"off":97.7123,"kill":0.3195},"lance":{"lead":0.9071,"off":80.2263,"kill":0.116},"frost":{"lead":0.39,"off":75.1295,"kill":0.0981}};                // per turret type: urgency (lead, off) and kill bonus
  var SLM = [0.2867,0.5989,0.6601,18.0652,0.4553,3.2626,1.4053,0.2628,3.6244,3.2018,0.6551,3.6896,1.5497,21.088,3.1215,4.4867];                // per slot urgency multiplier
  var ADAPT = {};            // adaptive anti-air parameters

  var COST = { bolt: 50, cannon: 90, frost: 70, lance: 120, flak: 80 };
  var DMG = { bolt: [26, 41, 65], cannon: [60, 96, 153], frost: [10, 16, 25], lance: [180, 288, 460], flak: [40, 64, 102] };
  var SPL2 = { cannon: 8100, flak: 4900 };
  var TI = { grunt: 0, runner: 1, wisp: 2, brute: 3, splitter: 4, mender: 5, splitling: 6 };

  // Route geometry (own copy, used to place candidates from their `remaining` distance).
  function route(pts) {
    var len = 0, i;
    for (i = 1; i < pts.length; i++) len += 100 * (Math.abs(pts[i][0] - pts[i - 1][0]) + Math.abs(pts[i][1] - pts[i - 1][1]));
    var xs = new Int32Array(len + 1), ys = new Int32Array(len + 1), p = 0;
    xs[0] = pts[0][0] * 100 + 50; ys[0] = pts[0][1] * 100 + 50;
    for (i = 1; i < pts.length; i++) {
      var x0 = pts[i - 1][0] * 100 + 50, y0 = pts[i - 1][1] * 100 + 50, x1 = pts[i][0] * 100 + 50, y1 = pts[i][1] * 100 + 50;
      var n = Math.abs(x1 - x0) + Math.abs(y1 - y0), sx = x1 > x0 ? 1 : (x1 < x0 ? -1 : 0), sy = y1 > y0 ? 1 : (y1 < y0 ? -1 : 0);
      for (var k = 1; k <= n; k++) { p++; xs[p] = x0 + sx * k; ys[p] = y0 + sy * k; }
    }
    return { len: len, xs: xs, ys: ys };
  }
  var RG = route([[0, 2], [6, 2], [6, 10], [12, 10], [12, 3], [18, 3], [18, 11], [23, 11]]);
  var RA = route([[0, 6], [21, 6], [21, 11], [23, 11]]);
  var px = new Float64Array(1024), py = new Float64Array(1024), val = new Float64Array(1024);

  function tierOf(s, i) {
    var sl = s && s.slots && s.slots[i];
    return sl && sl.turret ? (sl.turret.tier | 0) : 0;
  }
  function typeOf(s, i) {
    var sl = s && s.slots && s.slots[i];
    return sl && sl.turret ? sl.turret.type : null;
  }

  function plan(s) {
    var g = s.gold, acts = [], tiers = [], i;
    for (i = 0; i < 16; i++) tiers.push(tierOf(s, i));
    // repair: a slot holding a different type than planned is left alone (never happens with this plan)
    for (i = 0; i < SEQ.length && acts.length < 32; i++) {
      var sl = SEQ[i][0], want = SEQ[i][1], typ = TYPES[sl];
      if (tiers[sl] >= want || tiers[sl] !== want - 1) continue;
      if (want > 1 && typeOf(s, sl) !== typ) continue;
      var c = want === 1 ? COST[typ] : COST[typ] * (want - 1);
      if (g < c) break;
      acts.push(want === 1 ? { op: "build", slot: sl, type: typ } : { op: "upgrade", slot: sl });
      g -= c; tiers[sl] = want;
    }
    return acts;
  }

  function target(t, cands) {
    var tp = t && t.type, D = DMG[tp], C = CLS[tp];
    if (!D || !C || !cands || !cands.length) return undefined;
    var dm = D[Math.max(0, Math.min(2, (t.tier | 0) - 1))], n = Math.min(cands.length, 1024), i, j, e, d, best = 0, bs = -1e300;
    var lead = C.lead * (SLM[t.slot] === undefined ? 1 : SLM[t.slot]);
    for (i = 0; i < n; i++) {
      e = cands[i];
      d = tp === "lance" ? dm : (dm - e.armor < 1 ? 1 : dm - e.armor);
      var w = TW[TI[e.type]]; if (w === undefined) w = 1;
      var urg = 1 + lead * 4600 / (Math.max(0, e.remaining) + C.off);
      val[i] = (tp === "frost" ? (e.slowed ? 0.05 : 1) * e.hp : (d >= e.hp ? e.hp + C.kill * e.maxHp : d)) * urg * w;
    }
    if (tp === "cannon" || tp === "flak") {
      var r2 = SPL2[tp];
      for (i = 0; i < n; i++) {
        e = cands[i];
        var rr = e.air ? RA : RG, p = rr.len - e.remaining;
        p = p < 0 ? 0 : (p > rr.len ? rr.len : p);
        px[i] = rr.xs[p]; py[i] = rr.ys[p];
      }
      for (i = 0; i < n; i++) {
        var sc = 0, xi = px[i], yi = py[i];
        for (j = 0; j < n; j++) { var dx = px[j] - xi, dy = py[j] - yi; if (dx * dx + dy * dy <= r2) sc += val[j]; }
        if (sc > bs) { bs = sc; best = i; }
      }
    } else {
      for (i = 0; i < n; i++) if (val[i] > bs) { bs = val[i]; best = i; }
    }
    return cands[best].id;
  }

  return { plan: plan, target: target };
}
</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks, hooks) {
  "use strict";
  // ---- static tables -------------------------------------------------------
  var TT = [
    { name: "bolt",   cost: 50,  dmg: 26,  period: 8,  range: 300, splash: 0,  slow: 0,  pierce: false, ground: true,  air: true  },
    { name: "cannon", cost: 90,  dmg: 60,  period: 24, range: 260, splash: 90, slow: 0,  pierce: false, ground: true,  air: false },
    { name: "frost",  cost: 70,  dmg: 10,  period: 12, range: 240, splash: 0,  slow: 30, pierce: false, ground: true,  air: true  },
    { name: "lance",  cost: 120, dmg: 180, period: 36, range: 360, splash: 0,  slow: 0,  pierce: true,  ground: true,  air: false },
    { name: "flak",   cost: 80,  dmg: 40,  period: 10, range: 320, splash: 70, slow: 0,  pierce: false, ground: false, air: true  }
  ];
  var TT_INDEX = { bolt: 0, cannon: 1, frost: 2, lance: 3, flak: 4 };
  // enemy types: 0 grunt 1 runner 2 wisp 3 brute 4 splitter 5 mender 6 splitling
  var EN = ["grunt", "runner", "wisp", "brute", "splitter", "mender", "splitling"];
  var E_HP = [60, 40, 50, 150, 90, 70, 0];
  var E_SPD = [10, 20, 12, 6, 8, 8, 12];
  var E_BOUNTY = [4, 4, 6, 9, 6, 7, 1];
  var E_LEAK = [1, 1, 2, 3, 2, 2, 1];
  var E_AIR = [0, 0, 1, 0, 0, 0, 0];
  var E_FIRST = [1, 2, 3, 4, 6, 8];
  var E_WEIGHT = [10, 4, 3, 3, 2, 1];
  var SLOTS = [[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],[14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]];
  var GROUND = [[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]];
  var AIRL = [[0,6],[21,6],[21,11],[23,11]];

  function buildRoute(pts) {
    var len = 0, i;
    for (i = 1; i < pts.length; i++) len += 100 * (Math.abs(pts[i][0] - pts[i-1][0]) + Math.abs(pts[i][1] - pts[i-1][1]));
    var xs = new Int32Array(len + 1), ys = new Int32Array(len + 1), p = 0;
    xs[0] = pts[0][0] * 100 + 50; ys[0] = pts[0][1] * 100 + 50;
    for (i = 1; i < pts.length; i++) {
      var x0 = pts[i-1][0] * 100 + 50, y0 = pts[i-1][1] * 100 + 50;
      var x1 = pts[i][0] * 100 + 50, y1 = pts[i][1] * 100 + 50;
      var n = Math.abs(x1 - x0) + Math.abs(y1 - y0), sx = Math.sign(x1 - x0), sy = Math.sign(y1 - y0);
      for (var k = 1; k <= n; k++) { p++; xs[p] = x0 + sx * k; ys[p] = y0 + sy * k; }
    }
    return { len: len, xs: xs, ys: ys };
  }
  var ROUTES = [buildRoute(GROUND), buildRoute(AIRL)];

  function mulberry32(a) { return function () {
    a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return (t ^ (t >>> 14)) >>> 0; }; }

  var rng = mulberry32(seed | 0);
  var mulCache = [0, 1000];
  function mult(w) { while (mulCache.length <= w) { var l = mulCache.length; mulCache.push(Math.floor(mulCache[l - 1] * 108 / 100)); } return mulCache[w]; }
  function genWave(w) {
    var n = 4 + Math.floor(3 * w / 5), out = [], tot = 0, i, j;
    for (j = 0; j < 6; j++) if (E_FIRST[j] <= w) tot += E_WEIGHT[j];
    for (i = 0; i < n; i++) {
      var r = rng() % tot;
      for (j = 0; j < 6; j++) {
        if (E_FIRST[j] > w) continue;
        if (r < E_WEIGHT[j]) break;
        r -= E_WEIGHT[j];
      }
      out.push(j);
    }
    return out;
  }

  // ---- state ----------------------------------------------------------------
  var strat = createStrategy();
  var hasTarget = strat && typeof strat.target === "function";
  var gold = 250, baseHp = 10, wave = 0, nextId = 1, fallTick = -1, endTick = maxTicks;
  var log = [];
  var turrets = new Array(16);
  for (var s0 = 0; s0 < 16; s0++) turrets[s0] = null;
  var enemies = [];          // ascending id
  var queue = [];            // {tick, wave, idx, type}
  var waves = [null, genWave(1)];

  function armorOf(type, w) { return type === 0 ? Math.floor(w / 4) : (type === 3 ? 6 + w : 0); }
  function makeEnemy(type, w, progress, maxHp) {
    var r = ROUTES[E_AIR[type]];
    var e = { id: nextId++, type: type, wave: w, hp: maxHp, maxHp: maxHp, progress: progress,
              air: E_AIR[type], armor: armorOf(type, w), speed: E_SPD[type], slow: 0, age: 0,
              route: r, x: r.xs[progress], y: r.ys[progress] };
    return e;
  }
  function view(e) {
    return { id: e.id, type: EN[e.type], hp: e.hp, maxHp: e.maxHp, x: e.x, y: e.y, air: e.air,
             armor: e.armor, speed: e.speed, slowed: e.slow > 0 ? 1 : 0, remaining: e.route.len - e.progress };
  }
  function tDmg(tt, tier) { var d = tt.dmg; for (var i = 1; i < tier; i++) d = Math.floor(d * 16 / 10); return d; }
  function tRange(tt, tier) { return tt.range + 30 * (tier - 1); }

  function applyActions(acts) {
    if (!Array.isArray(acts)) return;
    var n = Math.min(32, acts.length);
    for (var i = 0; i < n; i++) {
      var a = acts[i];
      if (!a || typeof a !== "object") continue;
      var s = a.slot;
      if (typeof s !== "number" || !(s >= 0 && s < 16) || Math.floor(s) !== s) continue;
      if (a.op === "build") {
        var ti = TT_INDEX.hasOwnProperty(a.type) ? TT_INDEX[a.type] : -1;
        if (ti < 0 || turrets[s] || gold < TT[ti].cost) continue;
        gold -= TT[ti].cost;
        turrets[s] = { slot: s, ti: ti, tier: 1, spent: TT[ti].cost, cd: 0, x: SLOTS[s][0] * 100 + 50, y: SLOTS[s][1] * 100 + 50 };
        log.push([tick, "B", s, ti]);
        if (hooks && hooks.onAction) hooks.onAction(tick, "B", s, ti);
      } else if (a.op === "upgrade") {
        var t = turrets[s];
        if (!t || t.tier >= 3) continue;
        var c = TT[t.ti].cost * (t.tier === 1 ? 1 : 2);
        if (gold < c) continue;
        gold -= c; t.spent += c; t.tier++;
        log.push([tick, "U", s, t.tier]);
        if (hooks && hooks.onAction) hooks.onAction(tick, "U", s, t.tier);
      } else if (a.op === "sell") {
        var t2 = turrets[s];
        if (!t2) continue;
        gold += Math.floor(t2.spent * 70 / 100);
        turrets[s] = null;
        log.push([tick, "S", s, 0]);
        if (hooks && hooks.onAction) hooks.onAction(tick, "S", s, t2.ti);
      }
    }
  }

  function buildState() {
    var sl = [];
    for (var i = 0; i < 16; i++) {
      var t = turrets[i];
      sl.push({ slot: i, x: SLOTS[i][0], y: SLOTS[i][1], turret: t ? { type: TT[t.ti].name, tier: t.tier, spent: t.spent } : null });
    }
    var ev = [];
    for (var j = 0; j < enemies.length; j++) ev.push(view(enemies[j]));
    var nw = [];
    for (var k = 0; k < waves[wave + 1].length; k++) nw.push(EN[waves[wave + 1][k]]);
    return { tick: tick, wave: wave, gold: gold, baseHp: baseHp, slots: sl, enemies: ev, nextWave: nw };
  }

  var tick = 0, fell = false;
  for (tick = 0; tick < maxTicks; tick++) {
    // 1. wave start
    if (tick >= 20 && (tick - 20) % 40 === 0) {
      wave = (tick - 20) / 40 + 1;
      gold += Math.min(50, Math.floor(gold * 5 / 100)) + 10 + 2 * wave;
      waves[wave + 1] = genWave(wave + 1);
      var acts = strat.plan(buildState());
      applyActions(acts);
      var comp = waves[wave];
      for (var qi = 0; qi < comp.length; qi++) queue.push({ tick: tick + 4 * qi, wave: wave, idx: qi, type: comp[qi] });
      queue.sort(function (a, b) { return a.tick - b.tick || a.wave - b.wave || a.idx - b.idx; });
      waves[wave - 1] = null;
      if (hooks && hooks.onWave) hooks.onWave(tick, wave, comp, waves[wave + 1]);
    }
    // 2. spawn
    while (queue.length && queue[0].tick === tick) {
      var q = queue.shift();
      var ne = makeEnemy(q.type, q.wave, 0, Math.floor(E_HP[q.type] * mult(q.wave) / 1000));
      enemies.push(ne);
      if (hooks && hooks.onSpawn) hooks.onSpawn(tick, ne);
    }
    // 3. move
    var i, e;
    for (i = 0; i < enemies.length; i++) {
      e = enemies[i];
      var sp = e.slow > 0 ? Math.floor(e.speed * 60 / 100) : e.speed;
      e.progress += sp;
      if (e.progress >= e.route.len) {
        e.progress = e.route.len;
        e.x = e.route.xs[e.progress]; e.y = e.route.ys[e.progress];
        baseHp -= E_LEAK[e.type];
        log.push([tick, "L", e.id, baseHp]);
        if (hooks && hooks.onLeak) hooks.onLeak(tick, e, baseHp);

    env.gain.setValueAtTime(0.0001, now); env.gain.exponentialRampToValueAtTime(vol, now + 0.005); env.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    s.connect(bq); bq.connect(env); env.connect(g);
    var off = arand() * 1.5; s.start(now, off, dur + 0.05); track(s, now + dur + 0.05);
  }
  function panX(x) { return (x / 24) * 2 - 1; }
  var SHOT_PRIO = [3, 0, 4, 1, 2]; // play order: cannon, lance, flak, bolt, frost  (index = rank)
  var shotTimes = [], killTimes = [];
  function playShot(ti, x, now) {
    var v = 0.6 + arand() * 0.4, pan = panX(x);
    if (ti === 0) { osc("triangle", 1400 * v + 300, 520, 0.07, 0.07, pan, now); noise(0.03, 0.03, pan, now, "highpass", 3000); }
    else if (ti === 1) { osc("sine", 150, 42, 0.22, 0.26, pan, now); noise(0.16, 0.14, pan, now, "lowpass", 700); }
    else if (ti === 2) { osc("sine", 2100, 1500, 0.12, 0.035, pan, now); osc("sine", 2900, 2300, 0.1, 0.025, pan, now); noise(0.12, 0.03, pan, now, "bandpass", 5000, 2); }
    else if (ti === 3) { osc("sawtooth", 220, 1100, 0.16, 0.08, pan, now, 2600); osc("square", 110, 70, 0.14, 0.04, pan, now, 900); }
    else { noise(0.08, 0.12, pan, now, "bandpass", 1500, 1.2); osc("square", 320, 180, 0.06, 0.035, pan, now, 1800); }
  }
  function playKill(x, now) { var v = arand(); osc("sine", 520 + v * 180, 170, 0.07, 0.05, panX(x), now); }
  function playHorn(now) {
    [0, 1].forEach(function (i) { osc("sawtooth", 150 * (i ? 1.5 : 1), 225 * (i ? 1.5 : 1), 0.7, 0.07, 0, now + i * 0.02, 900); });
  }
  function playLeak(now) {
    var pan = panX(KEEP_X); noise(0.12, 0.2, pan, now, "highpass", 1800); noise(0.3, 0.12, pan, now, "lowpass", 400);
    osc("square", 880, 860, 0.16, 0.05, pan, now + 0.03, 3000); osc("square", 660, 650, 0.18, 0.05, pan, now + 0.2, 3000);
  }
  function playFall(now) {
    var pan = panX(KEEP_X);
    noise(2.6, 0.45, pan, now, "lowpass", 320); noise(1.2, 0.2, pan, now, "bandpass", 900, 0.7);
    osc("sine", 62, 26, 3.2, 0.4, pan, now); osc("triangle", 45, 30, 3.0, 0.2, pan, now + 0.1);
  }
  function startWind() {
    if (!actx || windNode) return;
    var s = actx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    var bq = actx.createBiquadFilter(); bq.type = "bandpass"; bq.frequency.value = 380; bq.Q.value = 0.6;
    var g = actx.createGain(); g.gain.value = 0.0001; g.gain.setTargetAtTime(0.07, actx.currentTime, 0.4);
    var lfo = actx.createOscillator(), lg = actx.createGain(); lfo.frequency.value = 0.17; lg.gain.value = 140; lfo.connect(lg); lg.connect(bq.frequency);
    s.connect(bq); bq.connect(g); g.connect(master); s.start(); lfo.start();
    windNode = { s: s, lfo: lfo };
  }
  function stopWind() { if (windNode) { try { windNode.s.stop(); windNode.lfo.stop(); } catch (e) {} windNode = null; } }
  var audioOn = false;
  function setAudible(on) {
    if (!actx) return;
    var now = actx.currentTime;
    master.gain.cancelScheduledValues(now);
    master.gain.setValueAtTime(master.gain.value, now);
    if (on) { master.gain.linearRampToValueAtTime(0.9, now + 0.04); }
    else {
      master.gain.linearRampToValueAtTime(0, now + 0.04);
      if (audioOn) { // stop everything still ringing (after the fade)
        var stopT = now + 0.05;
        active.forEach(function (a) { try { a.n.stop(stopT); } catch (e) {} });
        active = [];
        stopWind();
      }
    }
    audioOn = on;
  }
  function audioAdvance(t0, t1) { // forward playback crossing events in (t0, t1]
    if (!actx || actx.state !== "running") return;
    var now = actx.currentTime + 0.01;
    active = active.filter(function (a) { return a.end > actx.currentTime; });
    var k0 = Math.floor(t0 * TPS + 1e-9) + 1, k1 = Math.floor(t1 * TPS + 1e-9);
    if (k1 - k0 > 40) k0 = k1 - 40;
    var cand = [], wall0 = actx.currentTime;
    killTimes = killTimes.filter(function (x) { return x > wall0 - 1; });
    for (var k = Math.max(0, k0); k <= k1 && k < NT; k++) {
      if (FALL_TICK >= 0 && k > FALL_TICK) break;
      var sl = shotsAt[k]; if (sl) for (var i = 0; i < sl.length; i++) cand.push(sl[i]);
      var kl = killsAt[k]; if (kl) for (var j = 0; j < kl.length && killTimes.length < 8; j++) { playKill(kl[j].x / 100, now); killTimes.push(wall0); }
      var w = R.waves.length && waveStartAt[k]; if (w) playHorn(now);
      var ll = leaksAt[k]; if (ll) for (var l = 0; l < Math.min(2, ll.length); l++) playLeak(now + l * 0.05);
      if (k === FALL_TICK) playFall(now);
    }
    // rate limit: <= 12 shot sounds per rolling second, loudest types first
    var wall = actx.currentTime;
    shotTimes = shotTimes.filter(function (x) { return x > wall - 1; });
    cand.sort(function (a, b) { return SHOT_PRIO.indexOf(a.ti) - SHOT_PRIO.indexOf(b.ti); });
    var played = {};
    for (var c = 0; c < cand.length && shotTimes.length < 12; c++) {
      var key = cand[c].ti + ":" + cand[c].slot; if (played[key]) continue; played[key] = 1;
      playShot(cand[c].ti, SLOT_TILES[cand[c].slot][0] + 0.5, now); shotTimes.push(wall);
    }
    if (FALL_TICK >= 0 && t1 >= FALL_T + 2.5) startWind();
  }
  var waveStartAt = new Uint8Array(NT + 1);
  R.waves.forEach(function (w) { if (w.tick < NT) waveStartAt[w.tick] = 1; });

  // ------------------------------------------------------------------------------------------
  // Playback state machine
  // ------------------------------------------------------------------------------------------
  var cdEl = document.getElementById("countdown"), btnToggle = document.getElementById("btn-toggle"),
      btnRefire = document.getElementById("btn-refire"), scrubber = document.getElementById("scrubber"),
      iconPause = document.getElementById("icon-pause"), iconPlay = document.getElementById("icon-play"),
      pills = Array.prototype.slice.call(document.querySelectorAll(".speed-pill"));
  var state = "INIT", simTime = 0, playbackSpeed = 1.0, countdownElapsed = 0, holdElapsed = 0, lastTs = null, scrubbing = false;
  function showPlayIcon(play) {
    iconPlay.style.display = play ? "" : "none"; iconPause.style.display = play ? "none" : "";
    btnToggle.setAttribute("aria-label", play ? "Play" : "Pause");
  }
  function hideCountdown() { cdEl.style.display = "none"; cdEl.textContent = ""; }
  function setState(s) {
    state = s;
    setAudible(s === "PLAYING" && !scrubbing);
  }
  function enterPlaying() { hideCountdown(); showPlayIcon(false); setState("PLAYING"); }
  function enterPaused() { showPlayIcon(true); setState("PAUSED"); }
  btnToggle.addEventListener("click", function () {
    resumeAudio();
    if (state === "PLAYING") { enterPaused(); }
    else if (state === "COUNTDOWN" || state === "REFIRE_HOLD" || state === "INIT") { hideCountdown(); simTime = 0; scrubber.value = "0"; renderAt(0); enterPaused(); }
    else if (state === "PAUSED") { enterPlaying(); }
    else if (state === "ENDED") { simTime = 0; scrubber.value = "0"; renderAt(0); enterPlaying(); }
  });
  btnRefire.addEventListener("click", function () {
    resumeAudio();
    hideCountdown();
    simTime = 0; scrubber.value = "0";
    renderAt(0);
    showPlayIcon(false);
    holdElapsed = 0;
    setState("REFIRE_HOLD");
  });
  pills.forEach(function (p) {
    p.addEventListener("click", function () {
      playbackSpeed = parseFloat(p.getAttribute("data-speed"));
      pills.forEach(function (q) { var on = q === p; q.classList.toggle("is-active", on); q.setAttribute("aria-checked", on ? "true" : "false"); });
    });
  });
  scrubber.addEventListener("input", function () {
    hideCountdown();
    scrubbing = true;
    simTime = Math.max(0, Math.min(DURATION, parseFloat(scrubber.value) || 0));
    renderAt(simTime);
    enterPaused();
  });
  function endScrub() { if (scrubbing) { scrubbing = false; setAudible(state === "PLAYING"); } }
  scrubber.addEventListener("change", endScrub);
  scrubber.addEventListener("pointerup", endScrub);
  window.addEventListener("pointerup", endScrub);

  function frame(ts) {
    var rawDt = lastTs === null ? 0 : (ts - lastTs) / 1000;
    lastTs = ts;
    var dt = Math.min(Math.max(rawDt, 0), 0.1);
    if (state === "INIT") {
      state = "COUNTDOWN"; countdownElapsed = 0;
      cdEl.style.display = "block"; cdEl.textContent = "3";
      setAudible(false);
    } else if (state === "COUNTDOWN") {
      countdownElapsed += dt;
      if (countdownElapsed >= 3) { enterPlaying(); }
      else { cdEl.style.display = "block"; cdEl.textContent = countdownElapsed < 1 ? "3" : (countdownElapsed < 2 ? "2" : "1"); }
    } else if (state === "REFIRE_HOLD") {
      holdElapsed += dt;
      if (holdElapsed >= 1) enterPlaying();
    } else if (state === "PLAYING") {
      var prev = simTime;
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      audioAdvance(prev, simTime);
      if (simTime >= DURATION) {
        simTime = DURATION; scrubber.value = DURATION.toFixed(3);
        renderAt(simTime);
        showPlayIcon(true); setState("ENDED");
        requestAnimationFrame(frame);
        return;
      }
      scrubber.value = simTime.toFixed(3);
    }
    renderAt(simTime);
    requestAnimationFrame(frame);
  }

  function onResize() {
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    fitCamera(); layoutHud();
    renderAt(simTime);
  }
  window.addEventListener("resize", onResize);

  // ------------------------------------------------------------------------------------------
  // Self report
  // ------------------------------------------------------------------------------------------
  window.BENCH_REPORT = {
    "selfCheck": {
      "vectorA": true,
      "vectorB": true
    },
    "strategy": {
      "summary": "Fixed slot plan (9 cannons, 4 flak, 1 lance, 1 bolt + 1 extra cannon) with a 48-step build/upgrade priority order, spending all gold each wave (interest banking tested and rejected: it always lost waves). Targeting: splash turrets pick the candidate whose splash circle maximises weighted effective damage (damage minus armour, capped at HP, plus a kill bonus); single-target turrets pick the best weighted target. Weights favour runners and menders, discount grunts, brutes and splitters, and add an urgency term growing as remaining distance shrinks, with per-slot multipliers so downstream turrets focus on leaders. All constants were found by hill-climbing on 64-128 training seeds (first on an infinite-gold variant to find the strongest endgame layout, then in the real game) and selected on separate validation seeds; seed 42 was never used for tuning.",
      "seedsTested": 556,
      "meanScoreOnTestedSeeds": 46.75
    },
    "seed42": {
      "score": null,
      "fallTick": null
    },
    "systems": {
      "board": "full",
      "enemiesAndTurrets": "full",
      "combatVisuals": "full",
      "fall": "full",
      "hud": "full",
      "audio": "full"
    },
    "simplifications": [
      "Turret heads turn instantly to face their current (or last) target; no turn-rate animation.",
      "The strategy never builds frost turrets or sells, so the frost-slow tint and the sell-collapse rubble effect are implemented but never appear in the seed-42 replay.",
      "Health bars are drawn without depth testing (always on top) for readability at quarter size.",
      "The keep crumbles by base HP (about four wall chunks per HP lost) and one chunk visibly flies off per leak.",
      "Kill pops are capped at 8 per rolling second and shot sounds at 12 per rolling second (cannon, lance, flak, bolt, frost priority).",
      "HUD digits use the system sans-serif font rendered once into a detached in-memory canvas atlas."
    ],
    "testedInBrowser": true,
    "measuredFps": 60
  };
  window.BENCH_REPORT.seed42 = { score: R.res.score, fallTick: R.res.fallTick };

  fitCamera(); layoutHud();
  renderAt(0);
  requestAnimationFrame(frame);
})();
</script>
