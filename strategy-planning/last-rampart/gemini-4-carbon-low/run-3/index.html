<!DOCTYPE html>
<html lang="en">
<head>

<title>Last Rampart</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);

  display: block;
  width: 100vw;

}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;

#btn-refire {

  padding: 0 10px;
  display: inline-flex;
  align-items: center;

  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {

}

#speed-group {

  font-size: 11px;

  font-variant-numeric: tabular-nums;

}
.speed-pill:hover {
  color: #ffffff;

}
.speed-pill.is-active {

#scrubber {
  width: 157px;

  border-radius: 9999px;
  outline: none;

}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;

  width: 12px;

  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}

<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>

    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>

  <input id="scrubber" type="range" min="0" max="100" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>

<script id="rampart-strategy">
function createStrategy() {
  const COSTS = { bolt: 50, cannon: 90, frost: 70, lance: 120, flak: 80 };
  const STEPS = [
    ["B", 6, "cannon", 1, true],
    ["B", 5, "frost",  2, true],
    ["B", 12, "flak",  3, true],
    ["B", 3, "bolt",   4, true],
    ["B", 8, "cannon", 4, false],
    ["B", 4, "cannon", 5, false],
    ["B", 11, "cannon", 6, false],
    ["B", 10, "frost", 6, false],
    ["B", 13, "cannon", 7, false],
    ["B", 14, "flak",  8, false],
    ["U", 4, 2, 8, false],
    ["U", 8, 2, 8, false],
    ["U", 6, 2, 8, false],
    ["U", 12, 2, 8, false],
    ["U", 13, 2, 9, false],
    ["U", 11, 2, 9, false],
    ["B", 1, "cannon", 9, false],
    ["U", 1, 2, 10, false],
    ["B", 15, "flak",  10, false],
    ["U", 14, 2, 11, false],
    ["U", 15, 2, 11, false],
    ["B", 2, "cannon", 11, false],
    ["B", 7, "cannon", 12, false],
    ["B", 9, "cannon", 12, false],
    ["B", 0, "cannon", 13, false],
    ["U", 2, 2, 13, false],
    ["U", 7, 2, 13, false],
    ["U", 9, 2, 14, false],
    ["U", 0, 2, 14, false],
    ["U", 4, 3, 14, false],
    ["U", 8, 3, 14, false],
    ["U", 6, 3, 15, false],
    ["U", 12, 3, 15, false],
    ["U", 13, 3, 16, false],
    ["U", 11, 3, 16, false],
    ["U", 1, 3, 17, false],
    ["U", 14, 3, 17, false],
    ["U", 2, 3, 18, false],
    ["U", 7, 3, 18, false],
    ["U", 15, 3, 19, false],
    ["U", 0, 3, 19, false],
    ["U", 9, 3, 20, false],
    ["U", 5, 2, 20, false],
    ["U", 10, 2, 20, false],
    ["U", 5, 3, 20, false],
    ["U", 10, 3, 20, false]
  ];

  let seenMap = Object.create(null);
  let prevSlot = 99;
  let virtualTick = 0;

  return {
    plan(s) {
      virtualTick++;
      seenMap = Object.create(null);
      for (let i = 0; i < s.enemies.length; i++) {
        const e = s.enemies[i];
        seenMap[e.id] = {
          id: e.id, x: e.x, y: e.y, hp: e.hp, armor: e.armor,
          air: e.air, type: e.type, speed: e.speed,
          slowed: e.slowed ? 1 : 0, remaining: e.remaining, vt: virtualTick
        };
      }

      const actions = [];
      let g = s.gold;
      const w = s.wave;
      const slots = s.slots.map(function (sl) {
        return {
          slot: sl.slot,
          turret: sl.turret ? { type: sl.turret.type, tier: sl.turret.tier, spent: sl.turret.spent } : null
        };
      });

      function build(slot, type, res) {
        if (slots[slot].turret) return false;
        const c = COSTS[type];
        if (g - c < res) return false;
        g -= c;
        slots[slot].turret = { type: type, tier: 1, spent: c };
        actions.push({ op: "build", slot: slot, type: type });
        return true;
      }
      function upg(slot, maxT, res) {
        const t = slots[slot].turret;
        if (!t || t.tier >= maxT) return false;
        const base = COSTS[t.type];
        const c = t.tier === 1 ? base : base * 2;
        if (g - c < res) return false;
        g -= c;
        t.tier++;
        t.spent += c;
        actions.push({ op: "upgrade", slot: slot });
        return true;
      }
      function sell(slot) {
        const t = slots[slot].turret;
        if (!t) return false;
        g += Math.floor(t.spent * 70 / 100);
        slots[slot].turret = null;
        actions.push({ op: "sell", slot: slot });
        return true;
      }

      let minGndRem = 9999, minAirRem = 9999, airCount = 0;
      for (let i = 0; i < s.enemies.length; i++) {
        const e = s.enemies[i];
        if (e.air) {
          airCount++;
          if (e.remaining < minAirRem) minAirRem = e.remaining;
        } else {
          if (e.remaining < minGndRem) minGndRem = e.remaining;
        }
      }
      let nextAir = 0;
      for (let i = 0; i < s.nextWave.length; i++) {
        if (s.nextWave[i] === "wisp") nextAir++;
      }

      const inDanger = s.baseHp <= 8 || minGndRem < 950 || minAirRem < 750;
      let spentTotal = 0;
      for (let i = 0; i < 16; i++) {
        if (slots[i].turret) spentTotal += slots[i].turret.spent;
      }
      const reqDef = w <= 3 ? 0 : w * 60;
      const res = (!inDanger && w < 30 && spentTotal >= reqDef) ? 1000 : 0;

      if (w >= 12 && slots[3].turret && slots[3].turret.type === "bolt") {
        const ref = Math.floor(slots[3].turret.spent * 70 / 100);
        if (g + ref - 180 >= res) {
          sell(3);
          build(3, "cannon", 0);
          upg(3, 2, 0);
        }
      }
      if (w >= 15 && slots[3].turret && slots[3].turret.type === "cannon") {
        upg(3, 3, res);
      }

      for (let i = 0; i < STEPS.length; i++) {
        const op = STEPS[i][0], slot = STEPS[i][1], arg = STEPS[i][2], minW = STEPS[i][3], urgent = STEPS[i][4];
        if (w < minW) continue;
        let curRes = urgent ? 0 : res;
        if (arg === "flak" && (nextAir >= 3 || airCount >= 4) && w >= 6) curRes = 0;
        if (op === "B") build(slot, arg, curRes);
        else if (op === "U") upg(slot, arg, curRes);
      }

      return actions;
    },

    target(turret, candidates) {
      if (turret.slot <= prevSlot) virtualTick++;
      prevSlot = turret.slot;

      const n = candidates.length;
      for (let i = 0; i < n; i++) {
        const c = candidates[i];
        seenMap[c.id] = {
          id: c.id, x: c.x, y: c.y, hp: c.hp, armor: c.armor,
          air: c.air, type: c.type, speed: c.speed,
          slowed: c.slowed ? 1 : 0, remaining: c.remaining, vt: virtualTick
        };
      }

      if (n === 1) return candidates[0].id;
      const type = turret.type;

      if (type === "frost") {
        let bestId = candidates[0].id, bestSc = -1e12;
        for (let i = 0; i < n; i++) {
          const c = candidates[i];
          const eta = c.remaining / c.speed;
          let sc = -eta * 10;
          if (!c.slowed) {
            sc += 300000;
            if (c.type === "runner") sc += 1200;
            else if (c.air) sc += 800;
            else if (c.type === "mender") sc += 500;
          }
          if (sc > bestSc) { bestSc = sc; bestId = c.id; }
        }
        if (seenMap[bestId]) seenMap[bestId].slowed = 1;
        return bestId;
      }

      if (type === "bolt") {
        let dmg = 26;
        for (let t = 1; t < turret.tier; t++) dmg = Math.floor(dmg * 16 / 10);
        let bestId = candidates[0].id, bestSc = -1e12;
        for (let i = 0; i < n; i++) {
          const c = candidates[i];
          const effSpd = c.slowed ? Math.floor(c.speed * 60 / 100) : c.speed;
          const eta = c.remaining / effSpd;
          const d = Math.max(1, dmg - c.armor);
          let sc = -eta * 20;
          if (eta > 35) {
            if (c.air) sc += 700;
            if (c.type === "runner") sc += 500;
            if (c.hp <= d) sc += 400;
          }
          if (sc > bestSc) { bestSc = sc; bestId = c.id; }
        }
        if (seenMap[bestId]) seenMap[bestId].hp -= Math.max(1, dmg - seenMap[bestId].armor);
        return bestId;
      }

      if (type === "lance") {
        let dmg = 180;
        for (let t = 1; t < turret.tier; t++) dmg = Math.floor(dmg * 16 / 10);
        let bestId = candidates[0].id, bestSc = -1e12;
        for (let i = 0; i < n; i++) {
          const c = candidates[i];
          if (c.remaining < 380) {
            const sc = 1e9 - c.remaining * 2000 + c.hp;
            if (sc > bestSc) { bestSc = sc; bestId = c.id; }
            continue;
          }
          const dealt = c.hp < dmg ? c.hp : dmg;
          let sc = dealt * 10 + c.armor * 70 + (4600 - c.remaining) * 1.2;
          if (c.type === "mender") sc += 2000;
          else if (c.type === "brute") sc += 1500;
          else if (c.type === "splitling") sc -= 3000;
          if (sc > bestSc) { bestSc = sc; bestId = c.id; }
        }
        if (seenMap[bestId]) seenMap[bestId].hp -= dmg;
        return bestId;
      }

      if (type === "cannon" || type === "flak") {
        const sp2 = type === "cannon" ? 8100 : 4900;
        let dmg = type === "cannon" ? 60 : 40;
        for (let t = 1; t < turret.tier; t++) dmg = Math.floor(dmg * 16 / 10);

        const pool = candidates.slice();
        const maxR = turret.range + (type === "cannon" ? 90 : 70);
        const maxR2 = maxR * maxR;
        const wantAir = type === "flak" ? 1 : 0;
        for (const k in seenMap) {
          const o = seenMap[k];
          if (o.vt === virtualTick && o.air === wantAir && o.hp > 0) {
            const dx = o.x - turret.x, dy = o.y - turret.y;
            const d2 = dx * dx + dy * dy;
            if (d2 > turret.range * turret.range && d2 <= maxR2) pool.push(o);
          }
        }
        const pn = pool.length;
        const panicD = (turret.slot === 13 || turret.slot === 14) ? 650 : 380;

        let bestId = candidates[0].id, bestSc = -1e12;
        for (let i = 0; i < n; i++) {
          const c = candidates[i];
          const effSpd = c.slowed ? Math.floor(c.speed * 60 / 100) : c.speed;
          const eta = c.remaining / effSpd;

          if (c.remaining < panicD || eta < 32) {
            let eff = 0;
            for (let j = 0; j < pn; j++) {
              const o = pool[j];
              const dx = o.x - c.x, dy = o.y - c.y;
              if (dx * dx + dy * dy <= sp2) {
                const d = Math.max(1, dmg - o.armor);
                eff += o.hp < d ? o.hp : d;
              }
            }
            const sc = 1e9 - eta * 10000 + eff * 10;
            if (sc > bestSc) { bestSc = sc; bestId = c.id; }
            continue;
          }

          let eff = 0, kills = 0, minEta = eta, minRem = c.remaining;
          for (let j = 0; j < pn; j++) {
            const o = pool[j];
            const dx = o.x - c.x, dy = o.y - c.y;
            if (dx * dx + dy * dy <= sp2) {
              const d = Math.max(1, dmg - o.armor);
              const dealt = o.hp < d ? o.hp : d;
              let wgt = 1.0;
              if (o.type === "mender") wgt = 1.8;
              else if (o.type === "runner") wgt = 1.35;
              else if (o.type === "splitter") wgt = 1.15;
              else if (o.type === "brute") wgt = 1.05;
              eff += dealt * wgt;
              if (o.hp <= d) kills++;
              const oSpd = o.slowed ? Math.floor(o.speed * 60 / 100) : o.speed;
              const oEta = o.remaining / oSpd;
              if (oEta < minEta) minEta = oEta;
              if (o.remaining < minRem) minRem = o.remaining;
            }
          }
          const sc = eff * 16 + kills * 60 + (4600 - minRem) * 5.0 - minEta * 25;
          if (sc > bestSc) { bestSc = sc; bestId = c.id; }
        }

        let chosen = candidates[0];
        for (let i = 0; i < n; i++) {
          if (candidates[i].id === bestId) { chosen = candidates[i]; break; }
        }
        for (let j = 0; j < pn; j++) {
          const o = pool[j];
          const dx = o.x - chosen.x, dy = o.y - chosen.y;
          if (dx * dx + dy * dy <= sp2 && seenMap[o.id]) {
            seenMap[o.id].hp -= Math.max(1, dmg - o.armor);
          }
        }
        return bestId;
      }

      return candidates[0].id;
    }
  };
}
</script>

<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks) {
  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return (t ^ (t >>> 14)) >>> 0;
    };
  }

  const GROUND_PTS = [
    [0, 2], [6, 2], [6, 10], [12, 10], [12, 3], [18, 3], [18, 11], [23, 11]
  ].map(function (p) { return [p[0] * 100 + 50, p[1] * 100 + 50]; });

  const AIR_PTS = [
    [0, 6], [21, 6], [21, 11], [23, 11]
  ].map(function (p) { return [p[0] * 100 + 50, p[1] * 100 + 50]; });

  function buildRoute(pts) {
    const segs = [];
    let total = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const x0 = pts[i][0], y0 = pts[i][1];
      const x1 = pts[i + 1][0], y1 = pts[i + 1][1];
      const dx = x1 - x0, dy = y1 - y0;
      const len = Math.abs(dx) + Math.abs(dy);
      segs.push({ x0: x0, y0: y0, dx: Math.sign(dx), dy: Math.sign(dy), start: total, len: len });
      total += len;
    }
    return { segs: segs, total: total, endX: pts[pts.length - 1][0], endY: pts[pts.length - 1][1] };
  }

  const GROUND_ROUTE = buildRoute(GROUND_PTS);
  const AIR_ROUTE = buildRoute(AIR_PTS);

  function posAt(route, progress) {
    if (progress <= 0) return [route.segs[0].x0, route.segs[0].y0];
    if (progress >= route.total) return [route.endX, route.endY];
    for (let i = 0; i < route.segs.length; i++) {
      const s = route.segs[i];
      if (progress <= s.start + s.len) {
        const d = progress - s.start;
        return [s.x0 + s.dx * d, s.y0 + s.dy * d];
      }
    }
    return [route.endX, route.endY];
  }

  const SLOT_TILES = [
    [3, 3], [5, 5], [7, 4], [7, 8], [9, 9], [10, 5], [11, 8], [13, 8],
    [14, 5], [15, 2], [16, 7], [17, 4], [19, 8], [20, 10], [22, 9], [3, 7]
  ];

  const TURRET_DEFS = {
    bolt:   { idx: 0, cost: 50,  dmg: 26,  period: 8,  range: 300, splash: 0,  slow: 0,  pierce: false, ground: true,  air: true },
    cannon: { idx: 1, cost: 90,  dmg: 60,  period: 24, range: 260, splash: 90, slow: 0,  pierce: false, ground: true,  air: false },
    frost:  { idx: 2, cost: 70,  dmg: 10,  period: 12, range: 240, splash: 0,  slow: 30, pierce: false, ground: true,  air: true },
    lance:  { idx: 3, cost: 120, dmg: 180, period: 36, range: 360, splash: 0,  slow: 0,  pierce: true,  ground: true,  air: false },
    flak:   { idx: 4, cost: 80,  dmg: 40,  period: 10, range: 320, splash: 70, slow: 0,  pierce: false, ground: false, air: true }
  };

  const ENEMY_ORDER = [
    { type: "grunt",    baseHp: 60,  speed: 10, bounty: 4, leak: 1, air: 0, firstWave: 1, weight: 10 },
    { type: "runner",   baseHp: 40,  speed: 20, bounty: 4, leak: 1, air: 0, firstWave: 2, weight: 4 },
    { type: "wisp",     baseHp: 50,  speed: 12, bounty: 6, leak: 2, air: 1, firstWave: 3, weight: 3 },
    { type: "brute",    baseHp: 150, speed: 6,  bounty: 9, leak: 3, air: 0, firstWave: 4, weight: 3 },
    { type: "splitter", baseHp: 90,  speed: 8,  bounty: 6, leak: 2, air: 0, firstWave: 6, weight: 2 },
    { type: "mender",   baseHp: 70,  speed: 8,  bounty: 7, leak: 2, air: 0, firstWave: 8, weight: 1 }
  ];
  const ENEMY_MAP = {};

  }

      const list = [];
      for (let i = 0; i < count; i++) {

    }

    const slots = SLOT_TILES.map(function (t, idx) {
      return { slot: idx, x: t[0] * 100 + 50, y: t[1] * 100 + 50, turret: null, aimYaw: 0 };

    let pendingWaveComp = genWave(1);
    let nextWaveCounts = [4, 0, 0, 0, 0, 0]; // initial preview of wave 1 before tick 20

      tr = Math.max(0, tr - (ev.time - prevT));

    const a = hashInt(i0 * 73 + seedOffset) * 2 - 1;

    const tanHalfX = tanHalfY * camera.aspect;
    const pitch = 55 * Math.PI / 180;
    const sinP = Math.sin(pitch), cosP = Math.cos(pitch);

    const botPx = 96;
    const topPx = Math.min(50, H * 0.08);
    const safeMinNy = -1 + 2 * (botPx / H);
    const safeMaxNy = 1 - 2 * (topPx / H);
    const safeMidNy = 0.5 * (safeMinNy + safeMaxNy);
    const safeHalfH = Math.max(0.2, 0.5 * (safeMaxNy - safeMinNy));

    const boundsPts = [
      [-0.65, 0, -0.65], [24.65, 0, -0.65], [-0.65, 0, 14.65], [24.65, 0, 14.65],
      [-0.65, 1.6, -0.65], [24.65, 1.6, -0.65], [-0.65, 1.6, 14.65], [24.65, 1.6, 14.65]
    ];

    const tx = 12.0;
    let tz = 7.0;
    let dist = 26.0;
    for (let iter = 0; iter < 30; iter++) {
      const cx = tx, cy = dist * sinP, cz = tz + dist * cosP;
      let minNx = 99, maxNx = -99, minNy = 99, maxNy = -99;
      for (let i = 0; i < boundsPts.length; i++) {
        const p = boundsPts[i];
        const dx = p[0] - cx, dy = p[1] - cy, dz = p[2] - cz;
        const camY = dy * cosP - dz * sinP;
        const camZ = -dy * sinP - dz * cosP;
        const nx = dx / (camZ * tanHalfX);
        const ny = camY / (camZ * tanHalfY);
        if (nx < minNx) minNx = nx;
        if (nx > maxNx) maxNx = nx;
        if (ny < minNy) minNy = ny;
        if (ny > maxNy) maxNy = ny;
      }
      const midNy = 0.5 * (minNy + maxNy);
      tz -= (midNy - safeMidNy) * (dist * tanHalfY / sinP) * 0.8;
      const reqScaleX = Math.max(-minNx, maxNx) / 0.955;
      const reqScaleY = (0.5 * (maxNy - minNy)) / safeHalfH;
      dist *= Math.max(reqScaleX, reqScaleY);

    const cx = 0.5 * (s.x0 + s.x1), cz = 0.5 * (s.z0 + s.z1);
    const ang = Math.atan2(s.x1 - s.x0, s.z1 - s.z0);
    const strip = new THREE.Mesh(new THREE.PlaneGeometry(0.28, len), airLaneMat);
    strip.rotation.x = -Math.PI / 2;
    strip.rotation.z = ang;
    strip.position.set(cx, 0.78, cz);
    boardGroup.add(strip);

    // Subtle ground projection line so air corridor also reads against ground
    const gStrip = new THREE.Mesh(new THREE.PlaneGeometry(0.10, len), airLaneMat);
    gStrip.rotation.x = -Math.PI / 2;
    gStrip.rotation.z = ang;

  const chevGeo = new THREE.BufferGeometry();

  // Rough terrain rocks & crags on non-road, non-slot tiles (deterministic from visRng)
  const occupiedTile = Object.create(null);
  function markPathTiles(tiles) {
    for (let i = 0; i < tiles.length - 1; i++) {
      const x0 = tiles[i][0], y0 = tiles[i][1], x1 = tiles[i + 1][0], y1 = tiles[i + 1][1];
      const dx = Math.sign(x1 - x0), dy = Math.sign(y1 - y0);
      let cx = x0, cy = y0;
      occupiedTile[cx + "," + cy] = 1;
      while (cx !== x1 || cy !== y1) {
        cx += dx; cy += dy;
        occupiedTile[cx + "," + cy] = 1;
      }
    }
  }
  markPathTiles(GROUND_TILES);
  for (let i = 0; i < SLOT_TILES.length; i++) {
    occupiedTile[SLOT_TILES[i][0] + "," + SLOT_TILES[i][1]] = 1;

  for (let dx = -1; dx <= 1; dx++) {

  const rockGeo = new THREE.DodecahedronGeometry(0.22, 0);
  const rockMat = registerMat(new THREE.MeshStandardMaterial({ color: 0x383d46, roughness: 0.92, metalness: 0.06, flatShading: true }));
  const shrubGeo = new THREE.ConeGeometry(0.16, 0.34, 5);
  const shrubMat = registerMat(new THREE.MeshStandardMaterial({ color: 0x2d3f2e, roughness: 0.9, metalness: 0.02, flatShading: true }));
  const rocksList = [];

          s: 0.75 + visRng() * 0.55,
          ry: visRng() * Math.PI * 2
        });

    }
  }
  const rockInst = new THREE.InstancedMesh(rockGeo, rockMat, rocksList.length);
  rockInst.castShadow = true;
  rockInst.receiveShadow = true;
  const dummyObj = new THREE.Object3D();
  for (let i = 0; i < rocksList.length; i++) {

  const shrubInst = new THREE.InstancedMesh(shrubGeo, shrubMat, shrubsList.length);

  shrubInst.receiveShadow = true;
  for (let i = 0; i < shrubsList.length; i++) {
    const sh = shrubsList[i];
    dummyObj.position.set(sh.x, 0.16 * sh.s, sh.z);
    dummyObj.rotation.set(0, sh.ry, 0);
    dummyObj.scale.set(sh.s, sh.s, sh.s);
    dummyObj.updateMatrix();
    shrubInst.setMatrixAt(i, dummyObj.matrix);
  }
  boardGroup.add(shrubInst);

  // 16 Build Pads (low stone platforms at the slots)
  const padBaseMat = registerMat(new THREE.MeshStandardMaterial({ color: 0x4b515e, roughness: 0.75, metalness: 0.18 }));
  const padRimMat = registerMat(new THREE.MeshStandardMaterial({ color: 0x677082, roughness: 0.65, metalness: 0.25 }));
  const padGeo = new THREE.CylinderGeometry(0.42, 0.47, 0.09, 8);
  const padInnerGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.105, 8);
  for (let i = 0; i < 16; i++) {

  // =========================================================================
  // WALLED KEEP AT TILE (23, 11) — ~1.5 TILES ACROSS WITH 10 CRUMBLING CHUNKS
  // =========================================================================
  const keepGroup = new THREE.Group();
  keepGroup.position.set(23.5, 0, 11.5);
  scene.add(keepGroup);

  const keepStoneMat = registerMat(new THREE.MeshStandardMaterial({
    color: 0x6a707d,
    emissive: 0x000000,
    roughness: 0.78,
    metalness: 0.15
  }));
  const keepDarkMat = registerMat(new THREE.MeshStandardMaterial({
    color: 0x3b404b,
    emissive: 0x000000,
    roughness: 0.85,
    metalness: 0.2
  }));
  const keepBeaconMat = registerMat(new THREE.MeshStandardMaterial({
    color: 0xffb347,
    emissive: 0xff7722,
    emissiveIntensity: 0.9,
    roughness: 0.3,
    metalness: 0.1
  }));

  const keepIntactGroup = new THREE.Group();
  keepGroup.add(keepIntactGroup);

  // Plinth (1.52 tiles across)
  const keepPlinth = new THREE.Mesh(new THREE.BoxGeometry(1.52, 0.16, 1.52), keepDarkMat);
  keepPlinth.position.y = 0.08;
  keepPlinth.castShadow = true;
  keepPlinth.receiveShadow = true;
  keepIntactGroup.add(keepPlinth);

  // Central citadel tower
  const keepCore = new THREE.Mesh(new THREE.BoxGeometry(0.84, 1.05, 0.84), keepStoneMat);
  keepCore.position.y = 0.60;
  keepCore.castShadow = true;
  keepCore.receiveShadow = true;
  keepIntactGroup.add(keepCore);

  const keepBeacon = new THREE.Mesh(new THREE.OctahedronGeometry(0.20, 0), keepBeaconMat);
  keepBeacon.position.y = 1.30;
  keepIntactGroup.add(keepBeacon);

  // 10 wall/battlement chunks around the keep — each HP point lost knocks off a chunk!
  const keepChunkSpecs = [
    { x: -0.58, y: 0.42, z: -0.58, sx: 0.38, sy: 0.68, sz: 0.38, vx: -2.2, vz: -2.2 }, // 0: NW tower
    { x: -0.58, y: 0.42, z:  0.58, sx: 0.38, sy: 0.68, sz: 0.38, vx: -2.2, vz:  2.2 }, // 1: SW tower
    { x: -0.58, y: 0.34, z:  0.00, sx: 0.28, sy: 0.52, sz: 0.78, vx: -2.6, vz:  0.2 }, // 2: W gatehouse
    { x:  0.00, y: 0.36, z: -0.58, sx: 0.78, sy: 0.56, sz: 0.28, vx:  0.1, vz: -2.5 }, // 3: N wall
    { x:  0.00, y: 0.36, z:  0.58, sx: 0.78, sy: 0.56, sz: 0.28, vx:  0.1, vz:  2.5 }, // 4: S wall
    { x:  0.58, y: 0.42, z: -0.58, sx: 0.38, sy: 0.68, sz: 0.38, vx:  2.2, vz: -2.2 }, // 5: NE tower
    { x:  0.58, y: 0.42, z:  0.58, sx: 0.38, sy: 0.68, sz: 0.38, vx:  2.2, vz:  2.2 }, // 6: SE tower

  // =========================================================================
  // 16 TURRET SLOTS — DISTINCT SILHOUETTES, COLOUR FAMILIES & TIER PIPS
  // =========================================================================
  // Colours (section 1): bolt steel-blue, cannon bronze, frost ice-white, lance crimson, flak teal
  const TURRET_MATS = [
    registerMat(new THREE.MeshStandardMaterial({ color: 0x4b86c8, emissive: 0x0e2240, roughness: 0.38, metalness: 0.55 })), // 0 bolt: steel-blue
    registerMat(new THREE.MeshStandardMaterial({ color: 0xcd843c, emissive: 0x2c1605, roughness: 0.42, metalness: 0.62 })), // 1 cannon: bronze

    registerMat(new THREE.MeshStandardMaterial({ color: 0xd92638, emissive: 0x3b060c, roughness: 0.35, metalness: 0.48 })), // 3 lance: crimson
    registerMat(new THREE.MeshStandardMaterial({ color: 0x20bfa9, emissive: 0x07332c, roughness: 0.36, metalness: 0.50 }))  // 4 flak: teal
  ];
  const turretDarkMat = registerMat(new THREE.MeshStandardMaterial({ color: 0x222730, roughness: 0.6, metalness: 0.5 }));
  const tierPipMat = registerMat(new THREE.MeshBasicMaterial({ color: 0xfff08a }));

  function createTurretModel(typeIdx) {
    const root = new THREE.Group();
    const head = new THREE.Group();
    const mat = TURRET_MATS[typeIdx];

    if (typeIdx === 0) {
      // Bolt: tall sleek steel-blue pedestal + twin rapid repeater rails
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.30, 0.28, 8), mat);
      base.position.y = 0.19;
      base.castShadow = true;
      root.add(base);
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.18, 0.30), mat);
      body.position.y = 0.40;
      body.castShadow = true;
      head.add(body);
      for (let s = -1; s <= 1; s += 2) {
        const brl = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.42, 6), turretDarkMat);
        brl.rotation.x = Math.PI / 2;
        brl.position.set(s * 0.075, 0.41, 0.22);
        head.add(brl);
      }
    } else if (typeIdx === 1) {
      // Cannon: wide heavy bronze mortar bastion + thick flared bombard barrel
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.33, 0.38, 0.22, 8), mat);
      base.position.y = 0.16;
      base.castShadow = true;

      const dome = new THREE.Mesh(new THREE.SphereGeometry(0.26, 10, 8), mat);
      dome.position.y = 0.30;

      dome.castShadow = true;
      head.add(dome);
      const brl = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.10, 0.44, 10), turretDarkMat);
      brl.rotation.x = Math.PI / 2 - 0.32;
      brl.position.set(0, 0.38, 0.20);
      brl.castShadow = true;
      head.add(brl);
      const muzzle = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.14, 0.09, 10), mat);
      muzzle.rotation.x = Math.PI / 2 - 0.32;
      muzzle.position.set(0, 0.44, 0.38);
      head.add(muzzle);
    } else if (typeIdx === 2) {
      // Frost: faceted ice-white crystal obeliskspire with floating cryo ring
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.31, 0.16, 6), mat);
      base.position.y = 0.13;
      base.castShadow = true;
      root.add(base);
      const spire = new THREE.Mesh(new THREE.OctahedronGeometry(0.24, 0), mat);
      spire.position.y = 0.46;
      spire.scale.set(0.82, 1.55, 0.82);
      spire.castShadow = true;
      head.add(spire);
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.24, 0.035, 6, 16), mat);
      ring.rotation.x = Math.PI / 2;
      ring.position.y = 0.42;
      head.add(ring);
    } else if (typeIdx === 3) {
      // Lance: angular crimson sniper prism with extra-long rail lance
      const base = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.20, 0.46), mat);
      base.position.y = 0.15;
      base.rotation.y = Math.PI / 4;
      base.castShadow = true;
      root.add(base);
      const carriage = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.22, 0.44), mat);
      carriage.position.y = 0.36;
      carriage.castShadow = true;
      head.add(carriage);
      const lanceBrl = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.07, 0.68, 8), mat);
      lanceBrl.rotation.x = Math.PI / 2;
      lanceBrl.position.set(0, 0.38, 0.34);
      lanceBrl.castShadow = true;
      head.add(lanceBrl);
    } else {
      // Flak: teal quad-barrel upward-angled AA battery
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.34, 0.20, 6), mat);
      base.position.y = 0.15;
      base.castShadow = true;
      root.add(base);
      const pod = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.22, 0.28), mat);
      pod.position.y = 0.35;
      pod.castShadow = true;
      head.add(pod);
      const offsets = [[-0.09, 0.43], [0.09, 0.43], [-0.09, 0.31], [0.09, 0.31]];

    root.add(head);

    // 1 to 3 bright tier rings/pips around base collar (readable at quarter size!)

      const pipRing = new THREE.Mesh(new THREE.TorusGeometry(0.35 + p * 0.045, 0.026, 6, 20), tierPipMat);

      root.add(pipRing);
      pips.push(pipRing);
    }

    root.visible = false;
    return { root: root, head: head, pips: pips };
  }

  const slotVisuals = [];
  for (let sIdx = 0; sIdx < 16; sIdx++) {
    const grp = new THREE.Group();
    grp.position.set(SLOT_TILES[sIdx][0] + 0.5, 0, SLOT_TILES[sIdx][1] + 0.5);

    const variants = [];
    for (let t = 0; t < 5; t++) {

      grp.add(vm.root);
      variants.push(vm);

    slotVisuals.push({ group: grp, variants: variants, lastYaw: 0 });
  }

  // =========================================================================
  // INSTANCED ENEMIES, HEALTH BARS, WISP SHADOWS & MENDER HALOS
  // =========================================================================
  // Distinct silhouettes & exact colour families (section 1):
  // 0 grunt: grey-green; 1 runner: yellow; 2 wisp: cyan glowing (y=0.8 + shadow);
  // 3 brute: dark iron with orange plates; 4 splitter: purple; 5 mender: white + soft green halo; 6 splitling: small purple
  const MAX_ENEMIES = 256;

  function makeEnemyInst(geo, mat, castShad) {
    const im = new THREE.InstancedMesh(geo, mat, MAX_ENEMIES);
    im.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    im.castShadow = !!castShad;
    im.receiveShadow = false;
    im.count = 0;
    im.frustumCulled = false;
    // Initialize instanceColor to white so frost tint can colorize slowed enemies!
    const white = new THREE.Color(0xffffff);
    for (let i = 0; i < MAX_ENEMIES; i++) im.setColorAt(i, white);
    scene.add(im);
    return im;
  }

  // Grunt: squat rounded pill/shielded infantry (grey-green)
  const gruntGeo = new THREE.CylinderGeometry(0.21, 0.25, 0.42, 8);
  gruntGeo.translate(0, 0.21, 0);
  const gruntMat = registerMat(new THREE.MeshStandardMaterial({ color: 0x7e9c76, roughness: 0.65, metalness: 0.15 }));
  const gruntInst = makeEnemyInst(gruntGeo, gruntMat, true);

  // Runner: sleek forward-leaning yellow dart wedge
  const runnerGeo = new THREE.ConeGeometry(0.20, 0.56, 4);
  runnerGeo.rotateX(Math.PI / 2);
  runnerGeo.translate(0, 0.20, 0);
  const runnerMat = registerMat(new THREE.MeshStandardMaterial({ color: 0xffd426, emissive: 0x332400, roughness: 0.38, metalness: 0.2 }));
  const runnerInst = makeEnemyInst(runnerGeo, runnerMat, true);

  // Build crisp digit glyph atlas (0-9 only, zero words!) on detached helper canvas
  function createDigitAtlas() {
    const cv = document.createElement("canvas");
    cv.width = 640;
    cv.height = 96;
    const ctx = cv.getContext("2d");
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "700 72px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
    for (let d = 0; d < 10; d++) {
      const cx = d * 64 + 32;
      ctx.lineWidth = 6;
      ctx.strokeStyle = "rgba(8, 10, 16, 0.75)";
      ctx.strokeText(String(d), cx, 50);
      ctx.fillStyle = "#ffffff";
      ctx.fillText(String(d), cx, 50);
    }
    const tex = new THREE.CanvasTexture(cv);
    tex.encoding = THREE.sRGBEncoding;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    return tex;
  }

  const digitAtlasTex = createDigitAtlas();

  function makeDigitPool(count, tintHex) {
    const arr = [];
    for (let i = 0; i < count; i++) {
      const geo = new THREE.PlaneGeometry(1, 1);
      const uvs = geo.attributes.uv;
      const mat = new THREE.MeshBasicMaterial({
        map: digitAtlasTex,
        color: tintHex,
        transparent: true,
        depthTest: false,
        depthWrite: false
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.visible = false;
      hudScene.add(mesh);
      arr.push({ mesh: mesh, uvs: uvs, curDigit: -1 });
    }
    return arr;
  }

  function setDigitGlyph(slotObj, d) {
    if (slotObj.curDigit === d) return;
    slotObj.curDigit = d;
    const u0 = (d * 64 + 2) / 640;
    const u1 = ((d + 1) * 64 - 2) / 640;
    const uvs = slotObj.uvs;
    uvs.setXY(0, u0, 1);
    uvs.setXY(1, u1, 1);
    uvs.setXY(2, u0, 0);
    uvs.setXY(3, u1, 0);
    uvs.needsUpdate = true;
  }

  function renderNumberDigits(pool, value, startX, centerY, digitH) {
    const str = String(Math.max(0, Math.floor(value)));
    const digitW = digitH * 0.64;
    for (let i = 0; i < pool.length; i++) {
      if (i < str.length) {
        const d = str.charCodeAt(i) - 48;
        setDigitGlyph(pool[i], d >= 0 && d <= 9 ? d : 0);
        pool[i].mesh.visible = true;
        pool[i].mesh.scale.set(digitW, digitH, 1);
        pool[i].mesh.position.set(startX + i * (digitW * 0.88) + digitW * 0.5, centerY, 0);
      } else {
        pool[i].mesh.visible = false;
      }
    }
    return startX + str.length * (digitW * 0.88);
  }

  function updateHud(frame, simTime) {
    const W = window.innerWidth || 1280;
    const H = window.innerHeight || 720;
    hudCam.left = 0;
    hudCam.right = W;
    hudCam.top = H;
    hudCam.bottom = 0;
    hudCam.updateProjectionMatrix();

    // Wave digits >= 7% of viewport height (section 5: at least 7% of viewport height)
    const waveDigitH = Math.max(46, Math.round(H * 0.076));
    const padX = Math.round(Math.max(18, W * 0.018));
    const topY = H - Math.round(Math.max(14, H * 0.022)) - waveDigitH * 0.5;

    waveIconGroup.scale.set(waveDigitH * 0.72, waveDigitH * 0.72, 1);
    waveIconGroup.position.set(padX + waveDigitH * 0.36, topY, 0);
    renderNumberDigits(waveDigits, frame.wave, padX + waveDigitH * 0.82, topY, waveDigitH);

    // Gold row under wave number
    const goldH = Math.max(26, Math.round(H * 0.040));
    const goldY = topY - waveDigitH * 0.54 - goldH * 0.55;
    coinIconGroup.scale.set(goldH * 0.68, goldH * 0.68, 1);
    coinIconGroup.position.set(padX + goldH * 0.36, goldY, 0);
    renderNumberDigits(goldDigits, frame.gold, padX + goldH * 0.84, goldY, goldH);

    // Next-wave preview under gold
    const prevH = Math.max(20, Math.round(H * 0.030));
    const prevY = goldY - goldH * 0.58 - prevH * 0.58;
    let curX = padX;
    for (let i = 0; i < 6; i++) {
      const cnt = frame.nextWaveCounts[i];
      const badge = previewBadges[i];
      if (cnt > 0) {
        badge.icon.visible = true;
        badge.icon.scale.set(prevH * 0.68, prevH * 0.68, 1);
        badge.icon.position.set(curX + prevH * 0.34, prevY, 0);
        curX = renderNumberDigits(badge.digits, cnt, curX + prevH * 0.72, prevY, prevH) + prevH * 0.45;
      } else {
        badge.icon.visible = false;
        badge.digits[0].mesh.visible = false;
        badge.digits[1].mesh.visible = false;
      }
    }

    // 10 Base HP pips in top-right corner with leak flash
    const pipSize = Math.max(14, Math.round(H * 0.024));
    const pipStep = Math.round(pipSize * 1.48);
    const rightStart = W - padX - pipSize * 0.5;
    const pipY = H - Math.round(Math.max(18, H * 0.032)) - pipSize * 0.5;
    const curTickF = simTime * 20;

    for (let i = 0; i < 10; i++) {
      const hpIdx = i + 1; // pip 0 is HP 1 (leftmost), pip 9 is HP 10 (rightmost)
      const px = rightStart - (9 - i) * pipStep;
      const pip = hpPips[i];
      pip.bg.scale.set(pipSize, pipSize, 1);
      pip.bg.position.set(px, pipY, 0);
      pip.fg.position.set(px, pipY, 0.1);

      const breakT = chunkBreakTick[10 - hpIdx];
      if (hpIdx <= frame.baseHp) {
        pip.fg.visible = true;
        pip.fg.scale.set(pipSize, pipSize, 1);
        pip.fg.material.color.setHex(0xf04858);
        pip.fg.material.opacity = 1.0;
      } else if (curTickF >= breakT && curTickF - breakT < 7.0) {
        const u = (curTickF - breakT) / 7.0;
        pip.fg.visible = true;
        const sc = pipSize * (1 + 0.55 * (1 - u));
        pip.fg.scale.set(sc, sc, 1);
        pip.fg.material.color.setHex(0xffffff);
        pip.fg.material.opacity = 1 - u;
      } else {
        pip.fg.visible = false;
      }
    }
  }

  // =========================================================================
  // SECTION 6: SYNTHESIZED WEB AUDIO SOUND EFFECTS (NO MUSIC)
  // =========================================================================
  let audioCtx = null;
  let masterGain = null;
  let compressor = null;
  let windGain = null;
  let noiseBuffer = null;
  const activeNodes = [];
  const audioShotWindow = []; // wall-clock timestamps of recent shots (<= 12/sec)
  const audioRng = mulberryFloat(4242);

  function initAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      audioCtx = new AC();
      compressor = audioCtx.createDynamicsCompressor();
      compressor.threshold.value = -16;
      compressor.knee.value = 18;
      compressor.ratio.value = 6;
      compressor.attack.value = 0.003;
      compressor.release.value = 0.15;

      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.0;
      masterGain.connect(compressor);
      compressor.connect(audioCtx.destination);

      // Deterministic noise buffer from seed 4242
      const len = audioCtx.sampleRate * 2;
      noiseBuffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = audioRng() * 2 - 1;

      // Continuous post-fall low wind node (muted until PLAYING && simTime >= FALL_TIME)
      const windSrc = audioCtx.createBufferSource();
      windSrc.buffer = noiseBuffer;
      windSrc.loop = true;
      const windFilter = audioCtx.createBiquadFilter();
      windFilter.type = "lowpass";
      windFilter.frequency.value = 210;
      windFilter.Q.value = 1.8;
      windGain = audioCtx.createGain();
      windGain.gain.value = 0.0;
      windSrc.connect(windFilter);
      windFilter.connect(windGain);
      windGain.connect(masterGain);
      windSrc.start();

      audioCtx.resume().catch(function () {});
    } catch (e) {
      audioCtx = null;
    }
  }
  initAudio();

  function resumeAudioOnGesture() {
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume().catch(function () {});
    }
  }
  window.addEventListener("pointerdown", resumeAudioOnGesture, { once: true });
  window.addEventListener("keydown", resumeAudioOnGesture, { once: true });

  function setAudioAudible(audible, inPostFall) {
    if (!audioCtx || !masterGain) return;
    const now = audioCtx.currentTime;
    masterGain.gain.cancelScheduledValues(now);
    masterGain.gain.setValueAtTime(masterGain.gain.value, now);
    if (audible) {
      masterGain.gain.linearRampToValueAtTime(0.65, now + 0.035);
      if (windGain) {
        windGain.gain.cancelScheduledValues(now);
        windGain.gain.setValueAtTime(windGain.gain.value, now);
        windGain.gain.linearRampToValueAtTime(inPostFall ? 0.16 : 0.0, now + 0.08);
      }
    } else {
      masterGain.gain.linearRampToValueAtTime(0.0, now + 0.04);
      if (windGain) {
        windGain.gain.cancelScheduledValues(now);
        windGain.gain.setValueAtTime(0.0, now);
      }
      while (activeNodes.length > 0) {
        const nd = activeNodes.pop();
        try { nd.stop(now + 0.045); } catch (e) {}
      }
      audioShotWindow.length = 0;
    }
  }

  function makePanner(worldX) {
    const panVal = Math.max(-0.9, Math.min(0.9, (worldX - 12) / 12));
    if (audioCtx.createStereoPanner) {
      const p = audioCtx.createStereoPanner();
      p.pan.value = panVal;
      p.connect(masterGain);
      return p;
    }
    return masterGain;
  }

  function trackOneShot(node, stopTime) {
    activeNodes.push(node);
    if (activeNodes.length > 96) activeNodes.shift();
    node.stop(stopTime);
  }

  function playTurretShotSound(typeIdx, worldX) {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const dest = makePanner(worldX);
    const jitter = 0.96 + (audioRng() * 0.08);

    if (typeIdx === 3) {
      // Lance: sharp crimson zap beam
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(720 * jitter, now);
      osc.frequency.exponentialRampToValueAtTime(140, now + 0.14);
      g.gain.setValueAtTime(0.13, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
      osc.connect(g); g.connect(dest);
      osc.start(now); trackOneShot(osc, now + 0.15);
    } else if (typeIdx === 1) {
      // Cannon: punchy bronze thump + short burst
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(155 * jitter, now);
      osc.frequency.exponentialRampToValueAtTime(42, now + 0.13);
      g.gain.setValueAtTime(0.18, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
      osc.connect(g); g.connect(dest);
      osc.start(now); trackOneShot(osc, now + 0.14);
    } else if (typeIdx === 4) {
      // Flak: crisp filtered noise pop
      const src = audioCtx.createBufferSource();
      src.buffer = noiseBuffer;
      const flt = audioCtx.createBiquadFilter();
      flt.type = "bandpass";
      flt.frequency.value = 1100 * jitter;
      flt.Q.value = 2.2;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.14, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
      src.connect(flt); flt.connect(g); g.connect(dest);
      src.start(now, (audioRng() * 1.5)); trackOneShot(src, now + 0.095);
    } else if (typeIdx === 2) {
      // Frost: high crystalline chime
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(1250 * jitter, now);
      osc.frequency.exponentialRampToValueAtTime(1760 * jitter, now + 0.09);
      g.gain.setValueAtTime(0.075, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.095);
      osc.connect(g); g.connect(dest);
      osc.start(now); trackOneShot(osc, now + 0.10);
    } else {
      // Bolt: crisp steel tick
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "square";
      osc.frequency.setValueAtTime(520 * jitter, now);
      osc.frequency.exponentialRampToValueAtTime(220, now + 0.055);
      g.gain.setValueAtTime(0.065, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc.connect(g); g.connect(dest);
      osc.start(now); trackOneShot(osc, now + 0.065);
    }
  }

  function playKillSound(worldX) {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const dest = makePanner(worldX);
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "sine";
    const f0 = 260 + audioRng() * 90;
    osc.frequency.setValueAtTime(f0, now);
    osc.frequency.exponentialRampToValueAtTime(f0 * 1.65, now + 0.065);
    g.gain.setValueAtTime(0.06, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
    osc.connect(g); g.connect(dest);
    osc.start(now); trackOneShot(osc, now + 0.075);
  }

  function playWaveHornSound() {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const dest = makePanner(2.0);
    const freqs = [196, 293.66];
    for (let i = 0; i < 2; i++) {
      const osc = audioCtx.createOscillator();
      const flt = audioCtx.createBiquadFilter();
      const g = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(freqs[i] * 0.92, now);
      osc.frequency.exponentialRampToValueAtTime(freqs[i], now + 0.16);
      osc.frequency.exponentialRampToValueAtTime(freqs[i] * 1.12, now + 0.38);
      flt.type = "lowpass";
      flt.frequency.value = 680;
      g.gain.setValueAtTime(0.001, now);
      g.gain.linearRampToValueAtTime(0.085, now + 0.06);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.42);
      osc.connect(flt); flt.connect(g); g.connect(dest);
      osc.start(now); trackOneShot(osc, now + 0.44);
    }
  }

  function playLeakSound() {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const dest = makePanner(23.5);
    // Stone crack noise
    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuffer;
    const flt = audioCtx.createBiquadFilter();
    flt.type = "bandpass";
    flt.frequency.value = 620;
    const gn = audioCtx.createGain();
    gn.gain.setValueAtTime(0.22, now);
    gn.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
    src.connect(flt); flt.connect(gn); gn.connect(dest);
    src.start(now, audioRng()); trackOneShot(src, now + 0.19);

    // Alarm tone
    const osc = audioCtx.createOscillator();
    const go = audioCtx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(440, now);
    osc.frequency.setValueAtTime(330, now + 0.11);
    go.gain.setValueAtTime(0.14, now);
    go.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
    osc.connect(go); go.connect(dest);
    osc.start(now); trackOneShot(osc, now + 0.27);
  }

  function playFallCollapseSound() {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const dest = makePanner(23.5);
    // Deep rumble noise
    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuffer;
    const flt = audioCtx.createBiquadFilter();
    flt.type = "lowpass";
    flt.frequency.setValueAtTime(420, now);
    flt.frequency.exponentialRampToValueAtTime(85, now + 1.1);
    const gn = audioCtx.createGain();
    gn.gain.setValueAtTime(0.38, now);
    gn.gain.exponentialRampToValueAtTime(0.001, now + 1.25);
    src.connect(flt); flt.connect(gn); gn.connect(dest);
    src.start(now, 0.1); trackOneShot(src, now + 1.28);

    // Sub-bass drop
    const osc = audioCtx.createOscillator();
    const go = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(110, now);
    osc.frequency.exponentialRampToValueAtTime(28, now + 0.95);
    go.gain.setValueAtTime(0.32, now);
    go.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
    osc.connect(go); go.connect(dest);
    osc.start(now); trackOneShot(osc, now + 1.02);
  }

  // Loudness priority for rate-limiting shots (at most 12 shot sounds/sec total, loudest types first):
  // Lance(3) > Cannon(1) > Flak(4) > Bolt(0) > Frost(2)
  const SHOT_PRIORITY = [2, 4, 1, 5, 3];

  function triggerForwardAudioRange(prevSimTime, newSimTime) {
    if (!audioCtx || audioCtx.state !== "running") return;
    const tStart = Math.floor(prevSimTime * 20) + 1;
    const tEnd = Math.min(MAX_TICKS - 1, Math.floor(newSimTime * 20));
    if (tEnd < tStart) return;

    const nowWall = audioCtx.currentTime;
    while (audioShotWindow.length > 0 && nowWall - audioShotWindow[0] > 1.0) {
      audioShotWindow.shift();
    }

    const candShots = [];
    let killTrig = null;

    for (let tk = tStart; tk <= tEnd; tk++) {
      if (FALL_TICK >= 0 && tk > FALL_TICK) break;
      if (wavesAtTick[tk]) playWaveHornSound();
      if (leaksByTick[tk].length > 0) playLeakSound();
      if (tk === FALL_TICK) {
        playFallCollapseSound();
        break;
      }
      const shArr = shotsByTick[tk];
      for (let i = 0; i < shArr.length; i++) candShots.push(shArr[i]);
      const klArr = killsByTick[tk];
      if (klArr.length > 0) killTrig = klArr[0];
    }

    if (killTrig) playKillSound(killTrig.x);

    if (candShots.length > 0 && audioShotWindow.length < 12) {
      candShots.sort(function (a, b) { return SHOT_PRIORITY[b.typeIdx] - SHOT_PRIORITY[a.typeIdx]; });
      const budget = Math.min(candShots.length, 12 - audioShotWindow.length, 3);
      for (let i = 0; i < budget; i++) {
        playTurretShotSound(candShots[i].typeIdx, candShots[i].x0);
        audioShotWindow.push(nowWall);
      }
    }
  }

  // =========================================================================
  // DETERMINISTIC FRAME-EXACT RENDERER OF simTime IN [0, 100]
  // =========================================================================
  const grayColor = new THREE.Color();

  function renderSimTime(simTime) {
    const clampedTime = Math.max(0, Math.min(DURATION, simTime));
    const exactTick = clampedTime * 20;
    const k0 = Math.min(MAX_TICKS - 1, Math.floor(exactTick));
    const k1 = Math.min(MAX_TICKS - 1, k0 + 1);
    const alpha = (FALL_TICK >= 0 && k0 >= FALL_TICK) ? 0 : (exactTick - k0);

    const frame0 = REPLAY.frames[k0];
    const frame1 = REPLAY.frames[k1];

    // 1. Post-fall desaturation (section 1: over the 1.0s after fall tick, desaturate to near-greyscale and hold until 100s)
    let desat = 0;
    if (FALL_TICK >= 0 && clampedTime >= FALL_TIME) {
      desat = Math.min(0.88, (clampedTime - FALL_TIME) * 0.88);
    }
    for (let i = 0; i < trackedMaterials.length; i++) {
      const m = trackedMaterials[i];
      if (m.userData.origColor && m.color) {
        const oc = m.userData.origColor;
        if (desat > 0) {
          const lum = oc.r * 0.299 + oc.g * 0.587 + oc.b * 0.114;
          grayColor.setRGB(lum, lum, lum);
          m.color.copy(oc).lerp(grayColor, desat);
        } else {
          m.color.copy(oc);
        }
      }
      if (m.userData.origEmissive && m.emissive) {
        const oe = m.userData.origEmissive;
        if (desat > 0) {
          const lum = (oe.r * 0.299 + oe.g * 0.587 + oe.b * 0.114) * 0.35;
          grayColor.setRGB(lum, lum, lum);
          m.emissive.copy(oe).lerp(grayColor, desat);
        } else {
          m.emissive.copy(oe);
        }
      }
    }

    // 2. Closed-form trauma camera shake (section 1: trauma^2 * smooth seeded noise up to 0.25 tiles)
    const trauma = getTraumaAt(clampedTime);
    const shakeAmp = trauma * trauma * 0.25;
    const sx = shakeAmp * smoothNoise(clampedTime, 17);
    const sz = shakeAmp * smoothNoise(clampedTime, 53);
    camera.position.set(camBasePos.x + sx, camBasePos.y, camBasePos.z + sz);
    camera.lookAt(camBaseLook.x + sx * 0.7, 0, camBaseLook.z + sz * 0.7);

    // 3. Air corridor pulse driven strictly by simTime
    const animTime = (FALL_TICK >= 0 && clampedTime > FALL_TIME) ? FALL_TIME : clampedTime;
    for (let i = 0; i < airChevrons.length; i++) {
      const ch = airChevrons[i];
      const pulse = 0.65 + 0.35 * Math.sin((animTime * 2.2 - ch.phase * 6.0) * Math.PI * 2);
      ch.mesh.scale.setScalar(0.85 + 0.3 * pulse);
    }

    // 4. Keep state: red leak flash, chunk knocking, and fall collapse + shockwave
    let leakFlash = 0;
    for (let i = 0; i < REPLAY.leaks.length; i++) {
      const dtLeak = clampedTime - REPLAY.leaks[i].tick / 20;
      if (dtLeak >= 0 && dtLeak < 0.28) {
        leakFlash = Math.max(leakFlash, 1 - dtLeak / 0.28);
      }
    }
    if (leakFlash > 0 && desat < 0.5) {
      keepStoneMat.emissive.setRGB(0.75 * leakFlash, 0.08 * leakFlash, 0.06 * leakFlash);
    }

    const postFallDt = (FALL_TICK >= 0 && clampedTime >= FALL_TIME) ? (clampedTime - FALL_TIME) : -1;
    if (postFallDt >= 0) {
      // Collapse intact tower into rubble + ballistic fragments (freezes after 0.9s collapse burst)
      const colT = Math.min(0.85, postFallDt);
      keepCore.scale.y = Math.max(0.18, 1 - colT * 1.1);
      keepCore.position.y = 0.60 * keepCore.scale.y;
      keepBeacon.visible = false;

      for (let i = 0; i < keepFallFragments.length; i++) {
        const fg = keepFallFragments[i];
        fg.mesh.visible = true;
        const yRaw = fg.y0 + fg.vy * colT - 0.5 * 11.5 * colT * colT;
        const yClamped = Math.max(0.11 * fg.s, yRaw);
        const moveT = yRaw > 0.11 * fg.s ? colT : Math.min(colT, (fg.vy + Math.sqrt(fg.vy * fg.vy + 2 * 11.5 * fg.y0)) / 11.5);
        fg.mesh.position.set(fg.x0 + fg.vx * moveT, yClamped, fg.z0 + fg.vz * moveT);
        fg.mesh.rotation.set(fg.rx * moveT, 0.4 * i, fg.rz * moveT);
        fg.mesh.scale.setScalar(fg.s);
      }

      if (postFallDt < 1.1) {
        fallWaveMesh.visible = true;
        const u = postFallDt / 1.1;
        const rad = 0.8 + u * 8.5;
        fallWaveMesh.scale.set(rad, rad, 1);
        fallWaveMat.opacity = (1 - u) * (1 - u) * 0.85;
      } else {
        fallWaveMesh.visible = false;
      }
    } else {
      keepCore.scale.y = 1.0;
      keepCore.position.y = 0.60;
      keepBeacon.visible = true;
      keepBeacon.rotation.y = animTime * 1.8;
      keepBeacon.position.y = 1.30 + Math.sin(animTime * 3.5) * 0.04;
      for (let i = 0; i < keepFallFragments.length; i++) keepFallFragments[i].mesh.visible = false;
      fallWaveMesh.visible = false;
    }

    // Individual keep chunks knocked off at each leak
    for (let i = 0; i < 10; i++) {
      const kc = keepChunks[i];
      const sp = kc.spec;
      const bTick = chunkBreakTick[i];
      if (postFallDt >= 0) {
        kc.mesh.visible = false;
      } else if (exactTick < bTick) {
        kc.mesh.visible = true;
        kc.mesh.position.set(sp.x, sp.y, sp.z);
        kc.mesh.rotation.set(0, 0, 0);
        kc.mesh.scale.set(1, 1, 1);
      } else {
        const dtChunk = Math.min(0.65, (exactTick - bTick) / 20);
        kc.mesh.visible = true;
        const yFall = Math.max(0.12, sp.y + 1.4 * dtChunk - 0.5 * 12.0 * dtChunk * dtChunk);
        kc.mesh.position.set(sp.x + sp.vx * dtChunk * 0.45, yFall, sp.z + sp.vz * dtChunk * 0.45);
        kc.mesh.rotation.set(dtChunk * 2.5, dtChunk * 1.2, dtChunk * 2.1);
        kc.mesh.scale.setScalar(0.72);
      }
    }

    // 5. Turrets on slots (smooth build pop-in, tier pips, recoil/aim)
    for (let sIdx = 0; sIdx < 16; sIdx++) {
      const sv = slotVisuals[sIdx];
      const st = frame0.slots[sIdx];
      for (let v = 0; v < 5; v++) sv.variants[v].root.visible = false;
      if (st) {
        const vm = sv.variants[st.typeIdx];
        vm.root.visible = true;
        vm.head.rotation.y = st.aimYaw;
        for (let p = 0; p < 3; p++) vm.pips[p].visible = (p < st.tier);

        // Check recent build/upgrade on this slot for scale pop
        let popScale = 1.0;
        const minOpTick = Math.max(0, k0 - 7);
        for (let tk = minOpTick; tk <= k0; tk++) {
          const ops = opsByTick[tk];
          for (let oi = 0; oi < ops.length; oi++) {
            if (ops[oi].slot === sIdx && (ops[oi].op === "B" || ops[oi].op === "U")) {
              const u = (exactTick - tk) / 7.0;
              if (u >= 0 && u <= 1) popScale = 0.65 + 0.35 * Math.sin(u * Math.PI * 0.72) / Math.sin(Math.PI * 0.72);
            }
          }
        }
        vm.root.scale.setScalar(popScale);
      }
    }

    // 6. Enemies (instanced, interpolated between k0 and k1, frost-tinted when slowed, health bars above)
    const counts = [0, 0, 0, 0, 0, 0, 0];
    let hbCount = 0;
    const eList = frame0.enemies;
    const nextById = frame1.eById;

    for (let i = 0; i < eList.length && hbCount < MAX_ENEMIES; i++) {
      const e0 = eList[i];
      const e1 = nextById[e0.id];
      const route = e0.air ? AIR_ROUTE : GROUND_ROUTE;
      const p1 = e1 ? e1.progress : Math.min(route.total, e0.progress + (e0.slowed ? 6 : 10));
      const interpProg = e0.progress + (p1 - e0.progress) * alpha;
      const wp = sampleRouteWorld(route, interpProg);

      const tIdx = e0.typeIdx;
      const idxInPool = counts[tIdx]++;
      const bob = e0.air
        ? 0.80 + Math.sin(animTime * 5.0 + e0.id * 1.3) * 0.05
        : Math.abs(Math.sin(interpProg * 0.08 + e0.id)) * 0.035;

      dummyObj.position.set(wp.x, bob, wp.z);
      dummyObj.rotation.set(0, wp.yaw, 0);
      dummyObj.scale.set(1, 1, 1);
      dummyObj.updateMatrix();

      const tint = e0.slowed ? COLOR_FROST_TINT : COLOR_WHITE;

      if (tIdx === 0) {
        gruntInst.setMatrixAt(idxInPool, dummyObj.matrix);
        gruntInst.setColorAt(idxInPool, tint);
      } else if (tIdx === 1) {
        runnerInst.setMatrixAt(idxInPool, dummyObj.matrix);
        runnerInst.setColorAt(idxInPool, tint);
      } else if (tIdx === 2) {
        dummyObj.rotation.set(0, animTime * 2.5 + e0.id, 0);
        dummyObj.updateMatrix();
        wispInst.setMatrixAt(idxInPool, dummyObj.matrix);
        wispInst.setColorAt(idxInPool, tint);

        dummyObj.position.set(wp.x, 0.02, wp.z);
        dummyObj.rotation.set(0, 0, 0);
        dummyObj.scale.set(1, 1, 1);
        dummyObj.updateMatrix();
        wispShadowInst.setMatrixAt(idxInPool, dummyObj.matrix);
      } else if (tIdx === 3) {
        bruteBodyInst.setMatrixAt(idxInPool, dummyObj.matrix);
        bruteBodyInst.setColorAt(idxInPool, tint);
        brutePlateInst.setMatrixAt(idxInPool, dummyObj.matrix);
        brutePlateInst.setColorAt(idxInPool, tint);
      } else if (tIdx === 4) {
        splitterInst.setMatrixAt(idxInPool, dummyObj.matrix);
        splitterInst.setColorAt(idxInPool, tint);
      } else if (tIdx === 5) {
        menderInst.setMatrixAt(idxInPool, dummyObj.matrix);
        menderInst.setColorAt(idxInPool, tint);

        dummyObj.position.set(wp.x, 0.03, wp.z);
        dummyObj.rotation.set(0, 0, 0);
        const hScale = 0.92 + 0.12 * Math.sin(animTime * 4.0 + e0.id);
        dummyObj.scale.set(hScale, hScale, hScale);
        dummyObj.updateMatrix();
        menderHaloInst.setMatrixAt(idxInPool, dummyObj.matrix);
      } else {
        splitlingInst.setMatrixAt(idxInPool, dummyObj.matrix);
        splitlingInst.setColorAt(idxInPool, tint);
      }

      // Billboarded health bar above enemy
      const hpFrac = e1 ? (e0.hpFrac + (e1.hpFrac - e0.hpFrac) * alpha) : e0.hpFrac;
      const barY = e0.air ? 1.18 : (tIdx === 3 ? 0.74 : 0.64);
      dummyObj.position.set(wp.x, barY, wp.z);
      dummyObj.quaternion.copy(camera.quaternion);
      dummyObj.scale.set(1, 1, 1);
      dummyObj.updateMatrix();
      hbBgInst.setMatrixAt(hbCount, dummyObj.matrix);

      dummyObj.position.set(wp.x - 0.22 * camera.matrixWorld.elements[0], barY - 0.22 * camera.matrixWorld.elements[1], wp.z - 0.22 * camera.matrixWorld.elements[2]);
      dummyObj.scale.set(Math.max(0.02, hpFrac), 1, 1);
      dummyObj.updateMatrix();
      hbFgInst.setMatrixAt(hbCount, dummyObj.matrix);
      if (hpFrac > 0.55) tmpColor.setHex(0x49e670);
      else if (hpFrac > 0.25) tmpColor.setHex(0xffc233);
      else tmpColor.setHex(0xf24444);
      hbFgInst.setColorAt(hbCount, tmpColor);
      hbCount++;
    }

    const enemyInstArr = [gruntInst, runnerInst, wispInst, bruteBodyInst, splitterInst, menderInst, splitlingInst];
    for (let t = 0; t < 7; t++) {
      enemyInstArr[t].count = counts[t];
      if (counts[t] > 0) {
        enemyInstArr[t].instanceMatrix.needsUpdate = true;
        if (enemyInstArr[t].instanceColor) enemyInstArr[t].instanceColor.needsUpdate = true;
      }
    }
    brutePlateInst.count = counts[3];
    if (counts[3] > 0) {
      brutePlateInst.instanceMatrix.needsUpdate = true;
      if (brutePlateInst.instanceColor) brutePlateInst.instanceColor.needsUpdate = true;
    }
    wispShadowInst.count = counts[2];
    if (counts[2] > 0) wispShadowInst.instanceMatrix.needsUpdate = true;
    menderHaloInst.count = counts[5];
    if (counts[5] > 0) menderHaloInst.instanceMatrix.needsUpdate = true;

    hbBgInst.count = hbCount;
    hbFgInst.count = hbCount;
    if (hbCount > 0) {
      hbBgInst.instanceMatrix.needsUpdate = true;
      hbFgInst.instanceMatrix.needsUpdate = true;
      hbFgInst.instanceColor.needsUpdate = true;
    }

    // 7. Shots (<= 0.15s = 3.0 ticks!), splash rings, mender heal rings, slot op rings, kill debris
    let beamCount = 0;
    let shellCount = 0;
    let ringCount = 0;
    let debrisCount = 0;

    if (postFallDt < 0) {
      // Shots within [clampedTime - 0.15, clampedTime] (strictly <= 0.15s per section 1!)
      const minShotTick = Math.max(0, Math.floor((clampedTime - 0.15) * 20));
      for (let tk = minShotTick; tk <= k0; tk++) {
        const dtSec = clampedTime - tk / 20;
        if (dtSec < 0 || dtSec > 0.15) continue;
        const u = dtSec / 0.15; // 0..1
        const shArr = shotsByTick[tk];

        for (let i = 0; i < shArr.length; i++) {
          const sh = shArr[i];
          const y0 = 0.42;
          if (sh.typeIdx === 1) {
            // Cannon: arcing shell for first 65% of 0.15s, then bronze splash ring of exact splash radius (0.90 tiles)!
            if (u < 0.65 && shellCount < MAX_SHELLS) {
              const su = u / 0.65;
              const sxPos = sh.x0 + (sh.x1 - sh.x0) * su;
              const szPos = sh.z0 + (sh.z1 - sh.z0) * su;
              const syPos = y0 + (sh.y1 - y0) * su + Math.sin(su * Math.PI) * 0.68;
              dummyObj.position.set(sxPos, syPos, szPos);
              dummyObj.rotation.set(0, 0, 0);
              dummyObj.scale.setScalar(0.9 + 0.25 * sh.tier);
              dummyObj.updateMatrix();
              shellInst.setMatrixAt(shellCount, dummyObj.matrix);
              shellInst.setColorAt(shellCount, SHOT_COLORS[1]);
              shellCount++;
            } else if (u >= 0.45 && ringCount < MAX_RINGS) {
              const ru = (u - 0.45) / 0.55;
              const rad = sh.splash * (0.35 + 0.65 * ru); // expands to exact splash radius 0.90!
              dummyObj.position.set(sh.x1, 0.05, sh.z1);
              dummyObj.rotation.set(0, 0, 0);
              dummyObj.scale.set(rad, rad, 1);
              dummyObj.updateMatrix();
              fxRingInst.setMatrixAt(ringCount, dummyObj.matrix);
              tmpColor.copy(SHOT_COLORS[1]).multiplyScalar(1.2 - 0.7 * ru);
              fxRingInst.setColorAt(ringCount, tmpColor);
              ringCount++;
            }
          } else if (sh.typeIdx === 4) {
            // Flak: thin tracer up + teal ring burst in the air at y=0.85 of exact splash radius (0.70 tiles)!
            if (u < 0.45 && beamCount < MAX_BEAMS) {
              tmpVecA.set(sh.x0, y0, sh.z0);
              tmpVecB.set(sh.x1, sh.y1, sh.z1).sub(tmpVecA);
              const len = tmpVecB.length();
              if (len > 0.01) {
                tmpQuat.setFromUnitVectors(zAxis, tmpVecB.normalize());
                dummyObj.position.copy(tmpVecA);
                dummyObj.quaternion.copy(tmpQuat);
                dummyObj.scale.set(0.035, 0.035, len);
                dummyObj.updateMatrix();
                beamInst.setMatrixAt(beamCount, dummyObj.matrix);
                beamInst.setColorAt(beamCount, SHOT_COLORS[4]);
                beamCount++;
              }
            }
            if (ringCount < MAX_RINGS) {
              const rad = sh.splash * (0.30 + 0.70 * u); // exact 0.70 air burst ring
              dummyObj.position.set(sh.x1, sh.y1, sh.z1);
              dummyObj.rotation.set(0, 0, 0);
              dummyObj.scale.set(rad, rad, 1);
              dummyObj.updateMatrix();
              fxRingInst.setMatrixAt(ringCount, dummyObj.matrix);
              tmpColor.copy(SHOT_COLORS[4]).multiplyScalar(1.2 - 0.65 * u);
              fxRingInst.setColorAt(ringCount, tmpColor);
              ringCount++;
            }
          } else if (beamCount < MAX_BEAMS) {
            // Bolt (thin tracer), Frost (pale beam), Lance (thick crimson beam with flash)
            tmpVecA.set(sh.x0, y0, sh.z0);
            tmpVecB.set(sh.x1, sh.y1, sh.z1).sub(tmpVecA);
            const len = tmpVecB.length();
            if (len > 0.01) {
              tmpQuat.setFromUnitVectors(zAxis, tmpVecB.normalize());
              let thick = 0.038;
              let startFrac = 0, segLen = len;
              if (sh.typeIdx === 0) {
                // Bolt thin tracer darting to target
                thick = 0.035;
                startFrac = u * 0.55;
                segLen = len * 0.45;
              } else if (sh.typeIdx === 2) {
                // Frost pale beam
                thick = 0.055 * (1 - 0.4 * u);
              } else if (sh.typeIdx === 3) {
                // Lance thick crimson beam + target flash ring
                thick = 0.13 * (1 - 0.55 * u);
                if (u < 0.6 && ringCount < MAX_RINGS) {
                  dummyObj.position.set(sh.x1, 0.06, sh.z1);
                  dummyObj.rotation.set(0, 0, 0);
                  const fr = 0.22 + u * 0.45;
                  dummyObj.scale.set(fr, fr, 1);
                  dummyObj.updateMatrix();
                  fxRingInst.setMatrixAt(ringCount, dummyObj.matrix);
                  fxRingInst.setColorAt(ringCount, SHOT_COLORS[3]);
                  ringCount++;
                }
              }
              dummyObj.position.set(
                sh.x0 + tmpVecB.x * len * startFrac,
                y0 + tmpVecB.y * len * startFrac,
                sh.z0 + tmpVecB.z * len * startFrac
              );
              dummyObj.quaternion.copy(tmpQuat);
              dummyObj.scale.set(thick, thick, segLen);
              dummyObj.updateMatrix();
              beamInst.setMatrixAt(beamCount, dummyObj.matrix);
              beamInst.setColorAt(beamCount, SHOT_COLORS[sh.typeIdx]);
              beamCount++;
            }
          }
        }
      }

      // Mender heals: green pulse ring of exact heal radius (1.50 tiles)
      const minHealTick = Math.max(0, Math.floor((clampedTime - 0.45) * 20));
      for (let tk = minHealTick; tk <= k0; tk++) {
        const dtH = clampedTime - tk / 20;
        if (dtH < 0 || dtH > 0.45) continue;
        const u = dtH / 0.45;
        const hArr = healsByTick[tk];
        for (let i = 0; i < hArr.length && ringCount < MAX_RINGS; i++) {
          const hl = hArr[i];
          const rad = 1.50 * (0.2 + 0.8 * u);
          dummyObj.position.set(hl.x, 0.06, hl.z);
          dummyObj.rotation.set(0, 0, 0);
          dummyObj.scale.set(rad, rad, 1);
          dummyObj.updateMatrix();
          fxRingInst.setMatrixAt(ringCount, dummyObj.matrix);
          tmpColor.setHex(0x4dff88).multiplyScalar(1.1 - 0.8 * u);
          fxRingInst.setColorAt(ringCount, tmpColor);
          ringCount++;
        }
      }

      // Builds (rising sparkle), Upgrades (golden ring pulse), Sells (collapse into rubble)
      const minOpFxTick = Math.max(0, Math.floor((clampedTime - 0.55) * 20));
      for (let tk = minOpFxTick; tk <= k0; tk++) {
        const dtOp = clampedTime - tk / 20;
        if (dtOp < 0 || dtOp > 0.55) continue;
        const u = dtOp / 0.55;
        const ops = opsByTick[tk];
        for (let i = 0; i < ops.length; i++) {
          const op = ops[i];
          const sx = SLOT_TILES[op.slot][0] + 0.5;
          const sz = SLOT_TILES[op.slot][1] + 0.5;
          if (op.op === "U" && ringCount < MAX_RINGS) {
            const rad = 0.35 + u * 0.75;
            dummyObj.position.set(sx, 0.08 + u * 0.25, sz);
            dummyObj.rotation.set(0, 0, 0);
            dummyObj.scale.set(rad, rad, 1);
            dummyObj.updateMatrix();
            fxRingInst.setMatrixAt(ringCount, dummyObj.matrix);
            tmpColor.setHex(0xffe066).multiplyScalar(1.2 - u);
            fxRingInst.setColorAt(ringCount, tmpColor);
            ringCount++;
          } else if (op.op === "B") {
            for (let p = 0; p < 5 && debrisCount < MAX_DEBRIS; p++) {
              const ang = p * 1.256 + u * 3.0;
              dummyObj.position.set(sx + Math.cos(ang) * 0.34 * (1 - 0.3 * u), 0.1 + u * 0.85, sz + Math.sin(ang) * 0.34 * (1 - 0.3 * u));
              dummyObj.rotation.set(u * 4, u * 3, 0);
              dummyObj.scale.setScalar((1 - u) * 0.85);
              dummyObj.updateMatrix();
              debrisInst.setMatrixAt(debrisCount, dummyObj.matrix);
              tmpColor.setHex(0x9ee8ff);
              debrisInst.setColorAt(debrisCount, tmpColor);
              debrisCount++;
            }
          } else if (op.op === "S") {
            for (let p = 0; p < 6 && debrisCount < MAX_DEBRIS; p++) {
              const ang = p * 1.047 + 0.3;
              const yRubble = Math.max(0.06, 0.35 - 0.5 * 9.0 * dtOp * dtOp);
              dummyObj.position.set(sx + Math.cos(ang) * (0.15 + u * 0.38), yRubble, sz + Math.sin(ang) * (0.15 + u * 0.38));
              dummyObj.rotation.set(p, u * 2, p);
              dummyObj.scale.setScalar((1 - 0.6 * u) * 1.1);
              dummyObj.updateMatrix();
              debrisInst.setMatrixAt(debrisCount, dummyObj.matrix);
              tmpColor.setHex(0x8a92a3);
              debrisInst.setColorAt(debrisCount, tmpColor);
              debrisCount++;
            }
          }
        }
      }

      // Kills: closed-form seeded ballistic debris + splitter purple burst ring
      const minKillTick = Math.max(0, Math.floor((clampedTime - 0.45) * 20));
      for (let tk = minKillTick; tk <= k0; tk++) {
        const dtK = clampedTime - tk / 20;
        if (dtK < 0 || dtK > 0.45) continue;
        const u = dtK / 0.45;
        const klArr = killsByTick[tk];
        for (let i = 0; i < klArr.length; i++) {
          const kl = klArr[i];
          if (kl.isSplitter && ringCount < MAX_RINGS) {
            const rad = 0.25 + u * 0.85;
            dummyObj.position.set(kl.x, 0.08, kl.z);
            dummyObj.rotation.set(0, 0, 0);
            dummyObj.scale.set(rad, rad, 1);
            dummyObj.updateMatrix();
            fxRingInst.setMatrixAt(ringCount, dummyObj.matrix);
            tmpColor.setHex(0xd47aff).multiplyScalar(1.2 - u);
            fxRingInst.setColorAt(ringCount, tmpColor);
            ringCount++;
          }
          const pieces = kl.isSplitter ? 7 : 4;
          for (let p = 0; p < pieces && debrisCount < MAX_DEBRIS; p++) {
            const seedBase = kl.id * 31 + p * 17;
            const ang = hashInt(seedBase) * Math.PI * 2;
            const spd = 0.8 + hashInt(seedBase + 1) * 1.9;
            const vy = 1.6 + hashInt(seedBase + 2) * 2.2;
            const px = kl.x + Math.cos(ang) * spd * dtK;
            const pz = kl.z + Math.sin(ang) * spd * dtK;
            const py = Math.max(0.05, kl.y + vy * dtK - 0.5 * 13.0 * dtK * dtK);
            dummyObj.position.set(px, py, pz);
            dummyObj.rotation.set(dtK * 8 + p, dtK * 6, p);
            dummyObj.scale.setScalar((1 - u * 0.85) * 1.05);
            dummyObj.updateMatrix();
            debrisInst.setMatrixAt(debrisCount, dummyObj.matrix);
            debrisInst.setColorAt(debrisCount, ENEMY_COLORS[kl.eTypeIdx]);
            debrisCount++;
          }
        }
      }
    }

    beamInst.count = beamCount;
    if (beamCount > 0) {
      beamInst.instanceMatrix.needsUpdate = true;
      beamInst.instanceColor.needsUpdate = true;
    }
    shellInst.count = shellCount;
    if (shellCount > 0) {
      shellInst.instanceMatrix.needsUpdate = true;
      shellInst.instanceColor.needsUpdate = true;
    }
    fxRingInst.count = ringCount;
    if (ringCount > 0) {
      fxRingInst.instanceMatrix.needsUpdate = true;
      fxRingInst.instanceColor.needsUpdate = true;
    }
    debrisInst.count = debrisCount;
    if (debrisCount > 0) {
      debrisInst.instanceMatrix.needsUpdate = true;
      debrisInst.instanceColor.needsUpdate = true;
    }

    // 8. Update HUD & render both passes inside #stage
    updateHud(frame0, clampedTime);

    renderer.clear();
    renderer.render(scene, camera);
    renderer.clearDepth();
    renderer.render(hudScene, hudCam);
  }

  // =========================================================================
  // SECTION 3: 5-STATE PLAYBACK STATE MACHINE & DOCK CONTROLS
  // =========================================================================
  const countdownEl = document.getElementById("countdown");
  const btnRefire = document.getElementById("btn-refire");
  const btnToggle = document.getElementById("btn-toggle");
  const iconPause = document.getElementById("icon-pause");
  const iconPlay = document.getElementById("icon-play");
  const scrubber = document.getElementById("scrubber");
  const speedPills = Array.prototype.slice.call(document.querySelectorAll(".speed-pill"));

  let appState = "COUNTDOWN"; // COUNTDOWN | PLAYING | PAUSED | REFIRE_HOLD | ENDED
  let simTime = 0.000;
  let playbackSpeed = 1.0;
  let countdownElapsed = 0.0;
  let holdElapsed = 0.0;
  let countdownStarted = false;
  let lastWallNow = null;

  function setToggleVisual(isPauseShown) {
    if (isPauseShown) {
      iconPause.style.display = "";
      iconPlay.style.display = "none";
      btnToggle.setAttribute("aria-label", "Pause");
    } else {
      iconPause.style.display = "none";
      iconPlay.style.display = "";
      btnToggle.setAttribute("aria-label", "Play");
    }
  }

  function hideCountdown() {
    countdownEl.style.display = "none";
    countdownEl.textContent = "";
  }

  function syncAudioWithState() {
    const audible = (appState === "PLAYING");
    const postFall = (FALL_TICK >= 0 && simTime >= FALL_TIME);
    setAudioAudible(audible, postFall);
  }

  // Play / Pause toggle (#btn-toggle)
  btnToggle.addEventListener("click", function () {
    resumeAudioOnGesture();
    if (appState === "PLAYING") {
      appState = "PAUSED";
      setToggleVisual(false);
      syncAudioWithState();
    } else if (appState === "COUNTDOWN" || appState === "REFIRE_HOLD") {
      hideCountdown();
      simTime = 0.000;
      scrubber.value = "0";
      appState = "PAUSED";
      setToggleVisual(false);
      syncAudioWithState();
      renderSimTime(0.000);
    } else if (appState === "PAUSED") {
      appState = "PLAYING";
      setToggleVisual(true);
      syncAudioWithState();
    } else if (appState === "ENDED") {
      hideCountdown();
      simTime = 0.000;
      scrubber.value = "0";
      appState = "PLAYING";
      setToggleVisual(true);
      syncAudioWithState();
      renderSimTime(0.000);
    }
  });

  // Silent Re-Fire (#btn-refire -> REFIRE_HOLD)
  btnRefire.addEventListener("click", function () {
    resumeAudioOnGesture();
    hideCountdown();
    simTime = 0.000;
    scrubber.value = "0";
    holdElapsed = 0.0;
    appState = "REFIRE_HOLD";
    setToggleVisual(true);
    syncAudioWithState();
    renderSimTime(0.000);
  });

  // Speed selector pills (.speed-pill)
  for (let i = 0; i < speedPills.length; i++) {
    speedPills[i].addEventListener("click", function (ev) {
      resumeAudioOnGesture();
      const btn = ev.currentTarget;
      const spd = parseFloat(btn.getAttribute("data-speed"));
      if (!isNaN(spd) && spd > 0) playbackSpeed = spd;
      for (let j = 0; j < speedPills.length; j++) {
        const active = speedPills[j] === btn;
        speedPills[j].classList.toggle("is-active", active);
        speedPills[j].setAttribute("aria-checked", active ? "true" : "false");
      }
    });
  }

  // Scrubbing slider (#scrubber)
  scrubber.addEventListener("input", function () {
    resumeAudioOnGesture();
    hideCountdown();
    simTime = Math.max(0, Math.min(DURATION, parseFloat(scrubber.value) || 0));
    appState = "PAUSED";
    setToggleVisual(false);
    syncAudioWithState();
    renderSimTime(simTime);
  });

  window.addEventListener("resize", function () {
    updateCameraFraming();
    renderSimTime(simTime);
  });

  // Initial resting scene render BEFORE first requestAnimationFrame starts countdown!
  updateCameraFraming();
  countdownEl.style.display = "block";
  countdownEl.textContent = "3";
  scrubber.value = "0";
  setToggleVisual(true);
  renderSimTime(0.000);

  function onFrame(nowMs) {
    requestAnimationFrame(onFrame);

    if (!countdownStarted) {
      // First rAF callback after initial resting scene rendered: initialize countdown timer at 0
      countdownStarted = true;
      lastWallNow = nowMs;
      return;
    }

    const rawDt = Math.max(0, (nowMs - lastWallNow) / 1000);
    lastWallNow = nowMs;
    const dt = Math.min(rawDt, 0.1);

    if (appState === "COUNTDOWN") {
      countdownElapsed += dt;
      if (countdownElapsed < 1.000) {
        countdownEl.style.display = "block";
        countdownEl.textContent = "3";
        simTime = 0.000;
        scrubber.value = "0";
      } else if (countdownElapsed < 2.000) {
        countdownEl.style.display = "block";
        countdownEl.textContent = "2";
        simTime = 0.000;
        scrubber.value = "0";
      } else if (countdownElapsed < 3.000) {
        countdownEl.style.display = "block";
        countdownEl.textContent = "1";
        simTime = 0.000;
        scrubber.value = "0";
      } else {
        const overDt = Math.max(0, countdownElapsed - 3.000);
        hideCountdown();
        appState = "PLAYING";
        setToggleVisual(true);
        syncAudioWithState();
        const prevT = 0.000;
        simTime = Math.min(DURATION, overDt * playbackSpeed);
        scrubber.value = simTime.toFixed(3);
        triggerForwardAudioRange(-0.001, simTime);
        renderSimTime(simTime);
      }
    } else if (appState === "REFIRE_HOLD") {
      holdElapsed += dt;
      if (holdElapsed >= 1.000) {
        const overDt = Math.max(0, holdElapsed - 1.000);
        appState = "PLAYING";
        setToggleVisual(true);
        syncAudioWithState();
        simTime = Math.min(DURATION, overDt * playbackSpeed);
        scrubber.value = simTime.toFixed(3);
        triggerForwardAudioRange(-0.001, simTime);
        renderSimTime(simTime);
      }
    } else if (appState === "PLAYING") {
      const prevTime = simTime;
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      scrubber.value = simTime.toFixed(3);
      triggerForwardAudioRange(prevTime, simTime);
      if (windGain && audioCtx && FALL_TICK >= 0 && simTime >= FALL_TIME) {
        windGain.gain.setTargetAtTime(0.16, audioCtx.currentTime, 0.06);
      }
      renderSimTime(simTime);
      if (simTime >= DURATION) {
        simTime = DURATION;
        scrubber.value = DURATION.toFixed(3);
        appState = "ENDED";
        setToggleVisual(false);
        syncAudioWithState();
      }
    }
  }

  requestAnimationFrame(onFrame);
})();
</script>
</body>
</html>
