<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Last Rampart</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;

#scrubber {

  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;

  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>

<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script id="rampart-strategy">
function createStrategy() {
  const COST = { bolt: 50, cannon: 90, frost: 70, lance: 120, flak: 80 };
  const DMG_T = {
    bolt: [0, 26, 41, 65],
    cannon: [0, 60, 96, 153],
    frost: [0, 10, 16, 25],
    lance: [0, 180, 288, 460],
    flak: [0, 40, 64, 102]
  };
  const STEPS = [
    { s: 13, t: "cannon", u: 1, w: 1, must: true },
    { s: 12, t: "flak",   u: 1, w: 3, airOnly: true, forceW: 4, must: true },
    { s: 10, t: "frost",  u: 1, w: 4, must: true },
    { s: 8,  t: "cannon", u: 2, w: 5, must: true },
    { s: 6,  t: "frost",  u: 1, w: 6, must: true },
    { s: 13, t: "cannon", u: 2, w: 6 },
    { s: 3,  t: "cannon", u: 2, w: 6 },
    { s: 12, t: "flak",   u: 2, w: 6 },
    { s: 4,  t: "cannon", u: 3, w: 6 },
    { s: 14, t: "flak",   u: 2, w: 6 },
    { s: 13, t: "cannon", u: 3, w: 6 },
    { s: 11, t: "cannon", u: 2, w: 6 },
    { s: 2,  t: "frost",  u: 2, w: 6 },
    { s: 1,  t: "cannon", u: 3, w: 6 },
    { s: 7,  t: "cannon", u: 2, w: 6 },
    { s: 0,  t: "cannon", u: 3, w: 6 },
    { s: 15, t: "flak",   u: 2, w: 6 },
    { s: 9,  t: "cannon", u: 2, w: 6 },
    { s: 5,  t: "cannon", u: 2, w: 6 },
    { s: 10, t: "frost",  u: 2, w: 6 },
    { s: 6,  t: "frost",  u: 2, w: 6 },
    { s: 8,  t: "cannon", u: 3, w: 6 },
    { s: 3,  t: "cannon", u: 3, w: 6 },
    { s: 12, t: "flak",   u: 3, w: 6 },
    { s: 11, t: "cannon", u: 3, w: 6 },
    { s: 14, t: "flak",   u: 3, w: 6 },
    { s: 7,  t: "cannon", u: 3, w: 6 },
    { s: 9,  t: "cannon", u: 3, w: 6 },
    { s: 5,  t: "cannon", u: 3, w: 6 },
    { s: 15, t: "flak",   u: 3, w: 6 },
    { s: 10, t: "frost",  u: 3, w: 6 },
    { s: 6,  t: "frost",  u: 3, w: 6 },
    { s: 2,  t: "frost",  u: 3, w: 6 }
  ];

  return {
    plan(s) {
      const actions = [];
      let g = s.gold;
      const vs = [];
      for (let i = 0; i < s.slots.length; i++) {
        const tr = s.slots[i].turret;
        vs.push(tr ? { type: tr.type, tier: tr.tier } : null);
      }

      let airNext = 0;
      for (let i = 0; i < s.nextWave.length; i++) {
        if (s.nextWave[i] === "wisp") airNext++;
      }
      let airOnBoard = 0;
      let danger = false;
      for (let i = 0; i < s.enemies.length; i++) {
        const e = s.enemies[i];
        if (e.air) airOnBoard++;
        if (e.remaining < 850) danger = true;
      }
      const reserve = (danger || s.baseHp <= 8 || s.wave > 16) ? 0 : 600;

      let prog = true;
      let iter = 0;
      while (prog && iter++ < 32 && actions.length < 32) {
        prog = false;
        for (let i = 0; i < STEPS.length; i++) {
          const st = STEPS[i];
          if (s.wave < st.w) continue;
          if (st.airOnly && airNext === 0 && airOnBoard === 0 && s.wave < st.forceW) continue;
          const r = st.must ? 0 : reserve;
          const cur = vs[st.s];
          if (!cur) {
            const c = COST[st.t];
            if (g - c >= r) {
              vs[st.s] = { type: st.t, tier: 1 };
              g -= c;
              actions.push({ op: "build", slot: st.s, type: st.t });
              prog = true;
              break;
            }
          } else if (cur.type === st.t && cur.tier < st.u) {
            const c = cur.tier === 1 ? COST[cur.type] : 2 * COST[cur.type];
            if (g - c >= r) {
              cur.tier += 1;
              g -= c;
              actions.push({ op: "upgrade", slot: st.s });
              prog = true;
              break;
            }
          }
        }
      }
      return actions;
    },

    target(turret, candidates) {
      const n = candidates.length;
      if (n === 1) return candidates[0].id;
      const type = turret.type;

      if (type === "frost") {
        let bestId = candidates[0].id;
        let bestScore = -1e15;
        for (let i = 0; i < n; i++) {
          const e = candidates[i];
          const needSlow = (!e.slowed || e.slowed <= 2) ? 1 : 0;
          let sc = needSlow * 500000 - e.remaining * 3 + e.speed * 130;
          if (e.type === "runner" || e.type === "splitling") sc += 2500;
          if (e.air) sc += 1500;
          if (e.type === "mender") sc += 1200;
          if (e.hp <= 12 && needSlow) sc -= 220000;
          if (!needSlow) sc -= e.slowed * 500;
          if (sc > bestScore) { bestScore = sc; bestId = e.id; }
        }
        return bestId;
      }

      if (type === "cannon" || type === "flak") {
        const sr2 = type === "cannon" ? 8100 : 4900;
        const raw = DMG_T[type][turret.tier];
        let minRem = candidates[0].remaining;
        for (let i = 1; i < n; i++) {
          if (candidates[i].remaining < minRem) minRem = candidates[i].remaining;
        }
        let bestId = candidates[0].id;
        let bestScore = -1e15;
        for (let i = 0; i < n; i++) {
          const c = candidates[i];
          let effSum = 0, kills = 0, hitsFront = 0, hitsFast = 0, hitsMender = 0;
          for (let j = 0; j < n; j++) {
            const o = candidates[j];
            const dx = o.x - c.x, dy = o.y - c.y;
            if (dx * dx + dy * dy <= sr2) {
              const d = Math.max(1, raw - o.armor);
              effSum += Math.min(o.hp, d);
              if (o.hp <= d) kills++;
              if (o.remaining <= minRem + 90) hitsFront = 1;
              if (o.type === "runner" || o.type === "splitling") hitsFast++;
              if (o.type === "mender") hitsMender = 1;
            }
          }
          let sc = effSum * 10 + kills * 120 + hitsFast * 100 + hitsMender * 180 + hitsFront * 350 - c.remaining * 0.5;
          if (minRem < 650 && c.remaining <= minRem + 70) sc += 80000;
          if (sc > bestScore) { bestScore = sc; bestId = c.id; }
        }
        return bestId;
      }

      if (type === "lance") {
        const raw = DMG_T.lance[turret.tier];
        let bestId = candidates[0].id;
        let bestScore = -1e15;
        for (let i = 0; i < n; i++) {
          const e = candidates[i];
          if (e.remaining < 450) {
            const sc = 1e9 - e.remaining * 200 + e.hp;
            if (sc > bestScore) { bestScore = sc; bestId = e.id; }
            continue;
          }
          const eff = Math.min(e.hp, raw);
          const armorBypass = Math.min(eff, e.armor * 7);
          let bonus = e.type === "mender" ? 450 : (e.type === "brute" ? 380 : (e.type === "splitter" && e.remaining > 900 ? 250 : (e.type === "splitling" ? -400 : 0)));
          const sc = eff * 3.5 + armorBypass * 3.0 + bonus - e.remaining * 0.3;
          if (sc > bestScore) { bestScore = sc; bestId = e.id; }
        }
        return bestId;
      }

      if (type === "bolt") {
        const raw = DMG_T.bolt[turret.tier];
        let bestId = candidates[0].id;
        let bestScore = -1e15;
        for (let i = 0; i < n; i++) {
          const e = candidates[i];
          const d = Math.max(1, raw - e.armor);
          let sc = Math.min(e.hp, d) * 24 - e.remaining * 1.8;
          if (e.hp <= d) sc += 900;
          if (e.type === "runner" || e.type === "splitling") sc += 650;
          if (e.air) sc += 700;
          if (sc > bestScore) { bestScore = sc; bestId = e.id; }
        }
        return bestId;
      }

      return candidates[0].id;
    }
  };
}
</script>

<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks) {
  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return (t ^ (t >>> 14)) >>> 0;
    };
  }

  const GROUND_PATH = [
    [50, 250], [650, 250], [650, 1050], [1250, 1050],
    [1250, 350], [1850, 350], [1850, 1150], [2350, 1150]
  ];
  const GROUND_LEN = 4600;

  const AIR_PATH = [
    [50, 650], [2150, 650], [2150, 1150], [2350, 1150]
  ];
  const AIR_LEN = 2800;

  function posOnPath(path, progress) {
    let rem = progress;
    for (let i = 0; i < path.length - 1; i++) {
      const x0 = path[i][0], y0 = path[i][1];
      const x1 = path[i + 1][0], y1 = path[i + 1][1];
      const segLen = Math.abs(x1 - x0) + Math.abs(y1 - y0);
      if (rem <= segLen || i === path.length - 2) {
        const clamped = rem < 0 ? 0 : (rem > segLen ? segLen : rem);
        if (x1 > x0) return [x0 + clamped, y0];
        if (x1 < x0) return [x0 - clamped, y0];
        if (y1 > y0) return [x0, y0 + clamped];
        return [x0, y0 - clamped];
      }
      rem -= segLen;
    }
    return [path[path.length - 1][0], path[path.length - 1][1]];
  }

  const SLOT_TILES = [
    [3, 3], [5, 5], [7, 4], [7, 8],
    [9, 9], [10, 5], [11, 8], [13, 8],
    [14, 5], [15, 2], [16, 7], [17, 4],
    [19, 8], [20, 10], [22, 9], [3, 7]
  ];

  const TURRET_DEFS = {
    bolt:   { idx: 0, cost: 50,  damage: 26,  period: 8,  range: 300, splash: 0,  slow: 0,  pierce: false, ground: true,  air: true  },
    cannon: { idx: 1, cost: 90,  damage: 60,  period: 24, range: 260, splash: 90, slow: 0,  pierce: false, ground: true,  air: false },
    frost:  { idx: 2, cost: 70,  damage: 10,  period: 12, range: 240, splash: 0,  slow: 30, pierce: false, ground: true,  air: true  },
    lance:  { idx: 3, cost: 120, damage: 180, period: 36, range: 360, splash: 0,  slow: 0,  pierce: true,  ground: true,  air: false },
    flak:   { idx: 4, cost: 80,  damage: 40,  period: 10, range: 320, splash: 70, slow: 0,  pierce: false, ground: false, air: true  }
  };

  const ENEMY_ORDER = ["grunt", "runner", "wisp", "brute", "splitter", "mender"];
  const ENEMY_DEFS = {
    grunt:     { baseHp: 60,  speed: 10, bounty: 4, leak: 1, air: 0, firstWave: 1, weight: 10 },
    runner:    { baseHp: 40,  speed: 20, bounty: 4, leak: 1, air: 0, firstWave: 2, weight: 4  },
    wisp:      { baseHp: 50,  speed: 12, bounty: 6, leak: 2, air: 1, firstWave: 3, weight: 3  },
    brute:     { baseHp: 150, speed: 6,  bounty: 9, leak: 3, air: 0, firstWave: 4, weight: 3  },
    splitter:  { baseHp: 90,  speed: 8,  bounty: 6, leak: 2, air: 0, firstWave: 6, weight: 2  },
    mender:    { baseHp: 70,  speed: 8,  bounty: 7, leak: 2, air: 0, firstWave: 8, weight: 1  },
    splitling: { baseHp: 0,   speed: 12, bounty: 1, leak: 1, air: 0, firstWave: 999, weight: 0 }
  };

  const rng = mulberry32(seed);
  const strategy = createStrategy();

  const mCache = [0, 1000];
  function getM(w) {
    while (mCache.length <= w) {
      mCache.push(Math.floor(mCache[mCache.length - 1] * 108 / 100));
    }
    return mCache[w];
  }

  function generateWave(w) {
    const count = 4 + Math.floor(3 * w / 5);
    const eligible = [];
    let weightSum = 0;
    for (let i = 0; i < ENEMY_ORDER.length; i++) {
      const t = ENEMY_ORDER[i];
      const def = ENEMY_DEFS[t];
      if (def.firstWave <= w) {
        eligible.push(t);
        weightSum += def.weight;
      }
    }
    const comp = [];
    for (let i = 0; i < count; i++) {
      let r = rng() % weightSum;
      let chosen = eligible[eligible.length - 1];
      for (let j = 0; j < eligible.length; j++) {
        const wgt = ENEMY_DEFS[eligible[j]].weight;
        if (r < wgt) {
          chosen = eligible[j];
          break;
        }
        r -= wgt;
      }
      comp.push(chosen);
    }
    return comp;
  }

  function getArmor(type, wave) {
    if (type === "grunt") return Math.floor(wave / 4);
    if (type === "brute") return 6 + wave;
    return 0;
  }

  function calcTurretStats(type, tier) {
    const def = TURRET_DEFS[type];
    let dmg = def.damage;
    if (tier >= 2) dmg = Math.floor(dmg * 16 / 10);
    if (tier >= 3) dmg = Math.floor(dmg * 16 / 10);
    return { damage: dmg, range: def.range + 30 * (tier - 1) };
  }

  const slots = SLOT_TILES.map(function (tile, idx) {
    return {
      slot: idx,
      tx: tile[0],
      ty: tile[1],
      x: 100 * tile[0] + 50,
      y: 100 * tile[1] + 50,
      turret: null
    };
  });

  let gold = 250;
  let baseHp = 10;
  let currentWave = 0;
  let nextId = 1;
  const enemies = [];
  const spawnQueue = [];
  const log = [];

  let pendingWaveComp = generateWave(1);

  function makeEnemyView(e) {
    return {
      id: e.id,
      type: e.type,
      hp: e.hp,
      maxHp: e.maxHp,
      x: e.x,
      y: e.y,
      air: e.air,
      armor: e.armor,
      speed: e.speed,
      slowed: e.slow,
      remaining: e.routeLen - e.progress
    };
  }

  let fallTick = -1;

  for (let tick = 0; tick < maxTicks; tick++) {
    if (tick >= 20 && (tick - 20) % 40 === 0) {
      const w = 1 + Math.floor((tick - 20) / 40);
      currentWave = w;
      const waveComp = pendingWaveComp;
      gold += Math.min(50, Math.floor(gold * 5 / 100)) + 10 + 2 * w;
      const nextWaveComp = generateWave(w + 1);
      pendingWaveComp = nextWaveComp;

      const stateView = {
        tick: tick,
        wave: w,
        gold: gold,
        baseHp: baseHp,
        slots: slots.map(function (s) {
          return {
            slot: s.slot,
            x: s.x,
            y: s.y,
            turret: s.turret ? { type: s.turret.type, tier: s.turret.tier, spent: s.turret.spent } : null
          };
        }),
        enemies: enemies.map(makeEnemyView),
        nextWave: nextWaveComp.slice()
      };

      const actions = strategy.plan(stateView);
      if (Array.isArray(actions)) {
        const limit = Math.min(32, actions.length);
        for (let i = 0; i < limit; i++) {
          const act = actions[i];
          if (!act || typeof act !== "object") continue;
          const sIdx = act.slot;
          if (typeof sIdx !== "number" || sIdx < 0 || sIdx >= 16 || (sIdx | 0) !== sIdx) continue;
          const sl = slots[sIdx];
          if (act.op === "build") {
            const tDef = TURRET_DEFS[act.type];
            if (!sl.turret && tDef && gold >= tDef.cost) {
              gold -= tDef.cost;
              const st = calcTurretStats(act.type, 1);
              sl.turret = {
                type: act.type,
                tier: 1,
                spent: tDef.cost,
                cooldown: 0,
                damage: st.damage,
                range: st.range
              };
              log.push([tick, "B", sIdx, tDef.idx]);
            }
          } else if (act.op === "upgrade") {
            if (sl.turret && sl.turret.tier < 3) {
              const tDef = TURRET_DEFS[sl.turret.type];
              const upCost = sl.turret.tier === 1 ? tDef.cost : 2 * tDef.cost;

        if (e.type === "mender" && e.age % 20 === 0) {

          const r2 = 150 * 150;
          for (let j = 0; j < enemies.length; j++) {
            const o = enemies[j];
            const dx = o.x - e.x, dy = o.y - e.y;
            if (dx * dx + dy * dy <= r2) {
              o.hp = Math.min(o.maxHp, o.hp + Math.floor(o.maxHp * 8 / 100));
            }
          }
        }
      }

        const sl = slots[sIdx];
        const t = sl.turret;
        if (!t) continue;
        if (t.cooldown > 0) {
          t.cooldown -= 1;
          if (t.cooldown > 0) continue;
        }
        const def = TURRET_DEFS[t.type];
        const r2 = t.range * t.range;
        const candidates = [];
        for (let i = 0; i < enemies.length; i++) {
          const e = enemies[i];
          if (e.air ? !def.air : !def.ground) continue;
          const dx = e.x - sl.x, dy = e.y - sl.y;
          if (dx * dx + dy * dy <= r2) candidates.push(e);
        }
        if (candidates.length === 0) continue;

        let chosen = null;
        if (typeof strategy.target === "function") {
          const tView = { slot: sIdx, type: t.type, tier: t.tier, x: sl.x, y: sl.y, range: t.range };
          const retId = strategy.target(tView, candidates.map(makeEnemyView));
          for (let i = 0; i < candidates.length; i++) {
            if (candidates[i].id === retId) { chosen = candidates[i]; break; }
          }

        if (!chosen) {
          chosen = candidates[0];
          let bestRem = chosen.routeLen - chosen.progress;
          for (let i = 1; i < candidates.length; i++) {
            const rem = candidates[i].routeLen - candidates[i].progress;
            if (rem < bestRem) { bestRem = rem; chosen = candidates[i]; }
          }
        }

        const sx = sl.x / 100, sz = sl.y / 100;
        const tx = chosen.x / 100, tz = chosen.y / 100;
        const ty = chosen.air ? 0.85 : 0.32;
        sl.yaw = Math.atan2(tx - sx, tz - sz);
        shots.push({
          tick,
          slot: sIdx,
          typeIdx: def.idx,
          sx, sz,
          tx, ty, tz,
          splash: def.splash / 100
        });

        if (def.splash > 0) {
          const sr2 = def.splash * def.splash;
          for (let i = 0; i < enemies.length; i++) {
            const e = enemies[i];
            if (e.air ? !def.air : !def.ground) continue;
            const dx = e.x - chosen.x, dy = e.y - chosen.y;
            if (dx * dx + dy * dy <= sr2) {
              const dmg = def.pierce ? t.damage : Math.max(1, t.damage - e.armor);
              e.hp -= dmg;
              if (def.slow > 0) e.slow = def.slow;
            }
          }
        } else {
          const dmg = def.pierce ? t.damage : Math.max(1, t.damage - chosen.armor);
          chosen.hp -= dmg;
          if (def.slow > 0) chosen.slow = def.slow;
        }

        t.cooldown = def.period;

        const newSplitlings = [];
        for (let i = 0; i < enemies.length; i++) {
          const e = enemies[i];
          if (e.hp <= 0) {
            gold += e.bounty;
            verifyLog.push([tick, "K", e.id, sIdx]);
            kills.push({

              typeIdx: ENEMY_DEFS[e.type].idx,
              x: e.x / 100,
              y: e.air ? 0.85 : 0.3,

    let tr = 0;

    // Collect impulses up to time t
    const events = [];
    for (let i = 0; i < replay.leakEvents.length; i++) {
      const et = replay.leakEvents[i].tick / 20;
      if (et <= t) events.push({ t: et, add: 0.3 });
    }
    if (replay.fallTick >= 0) {
      const ft = replay.fallTick / 20;
      if (ft <= t) events.push({ t: ft, add: 1.0 });
    }
    events.sort((a, b) => a.t - b.t);
    for (let i = 0; i < events.length; i++) {
      const dt = events[i].t - prevT;
      tr = Math.max(0, tr - dt * 1.0);
      tr = Math.min(1.0, tr + events[i].add);
      prevT = events[i].t;
    }
    tr = Math.max(0, tr - (t - prevT) * 1.0);
    return Math.min(1.0, tr);

    const w = Math.max(1, window.innerWidth);

    const fovRad = camera.fov * Math.PI / 180;

    // Usable vertical fraction above bottom 90px dock, with top HUD clearance

    // Board spans X: [-0.65, 24.65] (halfW = 12.65 around 12.0), Z: [-0.65, 14.65]
    const reqHalfW = 12.85;
    const reqHalfD = 7.85;

    // At 55 deg elevation, apparent vertical half-span is roughly reqHalfD * sin(55°) + height margin, plus perspective foreshortening
    const sinE = Math.sin(CAM_ELEV);
    const cosE = Math.cos(CAM_ELEV);

    // Binary search minimal distance D along view ray so all 4 padded board corners project cleanly inside [-0.94, 0.94] NDC X and [dockNdcY, 0.90] NDC Y
    const minNdcY = -1 + 2 * (96 / h);
    const maxNdcY = 0.88;
    const maxNdcX = 0.95;

    const testCorners = [
      new THREE.Vector3(-0.65, 0, -0.65),
      new THREE.Vector3(24.65, 0, -0.65),
      new THREE.Vector3(-0.65, 0, 14.65),
      new THREE.Vector3(24.65, 0, 14.65),
      new THREE.Vector3(24.65, 1.8, 12.3) // keep top
    ];

    const shiftZ = 0.55 + dockFrac * 1.4;
    BASE_LOOK.set(12.0, 0.0, 7.0 + shiftZ);

    let lo = 14, hi = 48;
    const tmpV = new THREE.Vector3();
    for (let it = 0; it < 22; it++) {
      const mid = (lo + hi) * 0.5;
      camera.position.set(BASE_LOOK.x, mid * sinE, BASE_LOOK.z + mid * cosE);
      camera.lookAt(BASE_LOOK);
      camera.updateMatrixWorld();
      camera.updateProjectionMatrix();

      let fits = true;
      for (let c = 0; c < testCorners.length; c++) {
        tmpV.copy(testCorners[c]).project(camera);
        if (Math.abs(tmpV.x) > maxNdcX || tmpV.y < minNdcY || tmpV.y > maxNdcY) {
          fits = false;
          break;
        }
      }
      if (fits) hi = mid; else lo = mid;
    }
    camBasePos.set(BASE_LOOK.x, hi * sinE, BASE_LOOK.z + hi * cosE);
    camera.position.copy(camBasePos);
    camera.lookAt(BASE_LOOK);
    camera.updateProjectionMatrix();

    const prng = mulberry32(seedVal);
    ctx.fillStyle = baseHex;
    ctx.fillRect(0, 0, 128, 128);
    for (let i = 0; i < 900; i++) {
      const x = prng() % 128, y = prng() % 128;
      const w = 2 + (prng() % 10), h = 2 + (prng() % 10);
      const v = ((prng() % 100) - 50) * contrast;
      ctx.fillStyle = v > 0 ? `rgba(255,255,255,${(v / 255).toFixed(3)})` : `rgba(0,0,0,${(-v / 255).toFixed(3)})`;
      ctx.fillRect(x, y, w, h);
    }
    const tex = new THREE.CanvasTexture(cv);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  const slotVisuals = [];

  // ==================== INSTANCED ENEMIES, HEALTH BARS & SHADOWS ====================

    (function () { const g = new THREE.ConeGeometry(0.14, 0.30, 4); g.rotateX(Math.PI * 0.5); return g; })()
  ];

  const enemyBaseColors = [
    new THREE.Color(0x74a66a), // grunt grey-green
    new THREE.Color(0xffd426), // runner bright yellow
    new THREE.Color(0x38f3ff), // wisp cyan
    new THREE.Color(0x3e424d), // brute dark iron
    new THREE.Color(0xa842f5), // splitter purple
    new THREE.Color(0xf4f8ff), // mender white

  // Brute orange armor plates (secondary instanced overlay for silhouette + orange plate read!)
  const brutePlateGeo = new THREE.BoxGeometry(0.58, 0.22, 0.34);

  const MAX_DEBRIS = 600;

  scene.add(debrisInst);

  // ==================== WORDLESS ORTHOGRAPHIC HUD (INSIDE #stage) ====================
  const hudScene = new THREE.Scene();
  const hudCam = new THREE.OrthographicCamera(0, window.innerWidth, window.innerHeight, 0, -10, 10);

  // Build digit glyph atlas (0..9 only — strictly zero words/labels!) on a detached canvas
  const digitCanvas = document.createElement("canvas");
  digitCanvas.width = 512;
  digitCanvas.height = 128;
  const dCtx = digitCanvas.getContext("2d");
  dCtx.clearRect(0, 0, 512, 128);
  dCtx.textAlign = "center";
  dCtx.textBaseline = "middle";
  dCtx.font = "700 84px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
  for (let d = 0; d < 10; d++) {
    const cx = d * 51.2 + 25.6;
    dCtx.strokeStyle = "rgba(0,0,0,0.65)";
    dCtx.lineWidth = 8;
    dCtx.strokeText(String(d), cx, 66);
    dCtx.fillStyle = "#ffffff";
    dCtx.fillText(String(d), cx, 66);
  }
  const digitAtlasTex = new THREE.CanvasTexture(digitCanvas);
  digitAtlasTex.encoding = THREE.sRGBEncoding;
  digitAtlasTex.minFilter = THREE.LinearFilter;
  digitAtlasTex.magFilter = THREE.LinearFilter;

  // Create per-digit materials (0..9) for gold and white variants using UV offset/repeat clones
  const digitMatsWhite = [];
  const digitMatsGold = [];
  for (let d = 0; d < 10; d++) {
    const t = digitAtlasTex.clone();
    t.needsUpdate = true;
    t.repeat.set(0.1, 1.0);
    t.offset.set(d * 0.1, 0);
    digitMatsWhite.push(new THREE.MeshBasicMaterial({ map: t, color: 0xf4f7ff, transparent: true, depthTest: false }));
    digitMatsGold.push(new THREE.MeshBasicMaterial({ map: t, color: 0xffd659, transparent: true, depthTest: false }));
  }

  const hudUnitQuad = new THREE.PlaneGeometry(1, 1);

  function createDigitSlotPool(count, mats) {
    const arr = [];
    for (let i = 0; i < count; i++) {
      const m = new THREE.Mesh(hudUnitQuad, mats[0]);
      m.visible = false;
      hudScene.add(m);
      arr.push(m);
    }
    return arr;
  }

  // Wave Icon (crossed blades built from pure geometric quads) + 3 large wave digit slots
  const waveIconGroup = new THREE.Group();
  hudScene.add(waveIconGroup);
  const bladeMat = new THREE.MeshBasicMaterial({ color: 0xdbe6ff, depthTest: false });
  const hiltMat = new THREE.MeshBasicMaterial({ color: 0xffb84d, depthTest: false });
  for (const dir of [-1, 1]) {
    const blade = new THREE.Mesh(new THREE.PlaneGeometry(0.16, 0.95), bladeMat);
    blade.rotation.z = dir * 0.62;
    waveIconGroup.add(blade);
    const guard = new THREE.Mesh(new THREE.PlaneGeometry(0.38, 0.10), hiltMat);
    guard.position.set(dir * 0.14, -0.18, 0.01);
    guard.rotation.z = dir * 0.62;
    waveIconGroup.add(guard);
  }
  const waveDigitMeshes = createDigitSlotPool(3, digitMatsWhite);

  // Coin Icon + 5 gold digit slots
  const coinIconGroup = new THREE.Group();
  hudScene.add(coinIconGroup);
  const coinOuter = new THREE.Mesh(new THREE.CircleGeometry(0.45, 20), new THREE.MeshBasicMaterial({ color: 0xffc933, depthTest: false }));
  const coinInner = new THREE.Mesh(new THREE.RingGeometry(0.24, 0.33, 16), new THREE.MeshBasicMaterial({ color: 0xffe999, depthTest: false }));
  coinInner.position.z = 0.01;
  const coinDiamond = new THREE.Mesh(new THREE.CircleGeometry(0.14, 4), new THREE.MeshBasicMaterial({ color: 0xd98c00, depthTest: false }));
  coinDiamond.position.z = 0.02;
  coinIconGroup.add(coinOuter, coinInner, coinDiamond);
  const goldDigitMeshes = createDigitSlotPool(5, digitMatsGold);

  // Next-Wave Preview: 6 enemy-type silhouette icons + 2 count digits each
  const previewGroups = [];
  const previewColors = [0x74a66a, 0xffd426, 0x38f3ff, 0xff7b1c, 0xa842f5, 0xf4f8ff];
  for (let i = 0; i < 6; i++) {
    const g = new THREE.Group();
    let shapeGeo;
    if (i === 0) shapeGeo = new THREE.CircleGeometry(0.42, 7); // grunt heptagon
    else if (i === 1) { shapeGeo = new THREE.CircleGeometry(0.45, 3); } // runner triangle
    else if (i === 2) { shapeGeo = new THREE.CircleGeometry(0.44, 4); } // wisp diamond
    else if (i === 3) { shapeGeo = new THREE.PlaneGeometry(0.76, 0.76); } // brute square
    else if (i === 4) { shapeGeo = new THREE.CircleGeometry(0.44, 6); } // splitter hex
    else { shapeGeo = new THREE.RingGeometry(0.20, 0.44, 16); } // mender halo

  // Base HP: 10 pips in a row in top-right corner
  const hpPips = [];
  for (let i = 0; i < 10; i++) {
    const bg = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ color: 0x232836, transparent: true, opacity: 0.85, depthTest: false }));
    const fg = new THREE.Mesh(new THREE.PlaneGeometry(0.78, 0.80), new THREE.MeshBasicMaterial({ color: 0x42f58d, depthTest: false }));
    fg.position.z = 0.02;
    const grp = new THREE.Group();
    grp.add(bg, fg);
    hudScene.add(grp);
    hpPips.push({ grp, fg });
  }

  function setHudDigits(pool, mats, numVal, startX, centerY, digitH) {
    const str = String(Math.max(0, Math.floor(numVal)));
    const digitW = digitH * 0.56;
    for (let i = 0; i < pool.length; i++) {
      if (i < str.length) {
        const code = str.charCodeAt(i) - 48;
        const m = pool[i];
        m.material = mats[code >= 0 && code <= 9 ? code : 0];
        m.scale.set(digitW, digitH, 1);
        m.position.set(startX + i * (digitW * 0.88) + digitW * 0.5, centerY, 0);
        m.visible = true;
      } else {
        pool[i].visible = false;
      }
    }
    return startX + str.length * (digitW * 0.88);
  }

  function updateHud(frame, simTime) {
    const W = window.innerWidth;
    const H = window.innerHeight;
    hudCam.right = W;
    hudCam.top = H;
    hudCam.updateProjectionMatrix();

    const padX = Math.max(18, W * 0.02);
    const padTop = Math.max(16, H * 0.025);

    // Wave number: at least 7% of viewport height (use 7.8% for crisp quarter-size legibility)
    const waveH = Math.max(46, H * 0.078);
    const waveY = H - padTop - waveH * 0.5;
    const iconSize = waveH * 0.72;
    waveIconGroup.position.set(padX + iconSize * 0.5, waveY, 0);
    waveIconGroup.scale.set(iconSize, iconSize, 1);
    setHudDigits(waveDigitMeshes, digitMatsWhite, frame.wave, padX + iconSize * 1.12, waveY, waveH);

    // Gold under wave number
    const goldH = waveH * 0.54;
    const goldY = waveY - waveH * 0.62 - goldH * 0.42;
    const coinSize = goldH * 0.78;
    coinIconGroup.position.set(padX + coinSize * 0.55, goldY, 0);
    coinIconGroup.scale.set(coinSize, coinSize, 1);
    setHudDigits(goldDigitMeshes, digitMatsGold, frame.gold, padX + coinSize * 1.25, goldY, goldH);

    // Next-wave preview row under gold (stays well above bottom 90px dock)
    const prevH = Math.max(20, waveH * 0.38);
    const prevY = goldY - goldH * 0.62 - prevH * 0.48;
    let curX = padX;
    for (let i = 0; i < 6; i++) {
      const cnt = frame.nextCounts[i];
      const pg = previewGroups[i];
      if (cnt > 0) {
        const iSz = prevH * 0.78;
        pg.icon.visible = true;
        pg.icon.position.set(curX + iSz * 0.5, prevY, 0);
        pg.icon.scale.set(iSz, iSz, 1);
        curX = setHudDigits(pg.digits, digitMatsWhite, cnt, curX + iSz * 1.02, prevY, prevH) + prevH * 0.42;
      } else {
        pg.icon.visible = false;
        pg.digits[0].visible = false;
        pg.digits[1].visible = false;
      }
    }

    // Base HP: 10 pips in top-right corner with leak flash
    const pipW = Math.max(14, H * 0.024);
    const pipH = Math.max(24, H * 0.042);
    const pipGap = pipW * 0.34;
    const totalPipW = 10 * pipW + 9 * pipGap;
    const startPipX = W - padX - totalPipW + pipW * 0.5;
    const pipY = H - padTop - pipH * 0.55;
    const curTickF = simTime * 20;

    for (let i = 0; i < 10; i++) {
      const hpIdx = i + 1; // pip 1..10 left to right
      const pip = hpPips[i];
      pip.grp.position.set(startPipX + i * (pipW + pipGap), pipY, 0);
      pip.grp.scale.set(pipW, pipH, 1);

      if (hpIdx <= frame.baseHp) {
        pip.fg.visible = true;
        pip.fg.material.color.setHex(frame.baseHp <= 3 ? 0xff4d5a : (frame.baseHp <= 6 ? 0xffbe3b : 0x42f58d));
      } else {
        const lostTick = hpLostAtTick[hpIdx];
        const ageSec = (curTickF - lostTick) / 20;
        if (ageSec >= 0 && ageSec < 0.32) {
          pip.fg.visible = true;
          const fl = 1.0 - ageSec / 0.32;
          pip.fg.material.color.setRGB(1.0, 0.2 + 0.8 * fl, 0.2 + 0.8 * fl);
        } else {
          pip.fg.visible = false;
        }
      }
    }
  }

  // ==================== SYNTHESIZED WEB AUDIO (NO EXTERNAL ASSETS) ====================
  const audioRng = mulberry32(4242);
  let audioCtx = null;
  let masterGain = null;
  let compressor = null;
  let noiseBuf = null;
  let windSource = null;
  let windGain = null;
  const activeNodes = new Set();
  let shotSoundStamps = [];

  function initAudio() {
    if (audioCtx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      audioCtx = new AC();
      compressor = audioCtx.createDynamicsCompressor();
      compressor.threshold.value = -16;
      compressor.knee.value = 18;
      compressor.ratio.value = 6;
      compressor.attack.value = 0.003;
      compressor.release.value = 0.18;

      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.0001;
      masterGain.connect(compressor);
      compressor.connect(audioCtx.destination);

      // Seeded noise buffer (seed 4242)
      const len = audioCtx.sampleRate * 2;
      noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) {
        data[i] = (audioRng() / 2147483648) - 1.0;
      }

      // Continuous low wind node for post-fall atmosphere (silent until fall during PLAYING)
      windSource = audioCtx.createBufferSource();
      windSource.buffer = noiseBuf;
      windSource.loop = true;
      const windFilter = audioCtx.createBiquadFilter();
      windFilter.type = "lowpass";
      windFilter.frequency.value = 210;
      windFilter.Q.value = 2.5;
      windGain = audioCtx.createGain();
      windGain.gain.value = 0.0001;
      windSource.connect(windFilter);
      windFilter.connect(windGain);
      windGain.connect(masterGain);
      windSource.start();

      audioCtx.resume().catch(function () {});
    } catch (_) {}
  }

  function resumeAudio() {
    initAudio();
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume().catch(function () {});
    }
  }

  initAudio();
  window.addEventListener("pointerdown", resumeAudio, { passive: true });
  window.addEventListener("keydown", resumeAudio, { passive: true });

  function setAudioAudible(audible, inPostFall) {
    if (!audioCtx || !masterGain) return;
    const now = audioCtx.currentTime;
    masterGain.gain.cancelScheduledValues(now);
    masterGain.gain.setValueAtTime(masterGain.gain.value, now);
    if (audible) {
      masterGain.gain.linearRampToValueAtTime(0.65, now + 0.035);
      if (windGain) {
        windGain.gain.cancelScheduledValues(now);
        windGain.gain.setValueAtTime(windGain.gain.value, now);
        windGain.gain.linearRampToValueAtTime(inPostFall ? 0.16 : 0.0001, now + 0.12);
      }
    } else {
      masterGain.gain.linearRampToValueAtTime(0.0001, now + 0.04);
      if (windGain) {
        windGain.gain.cancelScheduledValues(now);
        windGain.gain.setValueAtTime(windGain.gain.value, now);
        windGain.gain.linearRampToValueAtTime(0.0001, now + 0.04);
      }
      // Stop every ringing one-shot within 45ms
      for (const n of activeNodes) {
        try { n.stop(now + 0.045); } catch (_) {}
      }
      activeNodes.clear();
      shotSoundStamps.length = 0;
    }
  }

  function makePanner(worldX) {
    const pan = Math.max(-0.9, Math.min(0.9, (worldX - 12) / 12));
    if (audioCtx.createStereoPanner) {
      const p = audioCtx.createStereoPanner();
      p.pan.value = pan;
      p.connect(masterGain);
      return p;
    }
    return masterGain;
  }

  function registerOneShot(src, stopAt) {
    activeNodes.add(src);
    src.onended = function () { activeNodes.delete(src); };
    src.start(audioCtx.currentTime);
    src.stop(stopAt);
  }

  function playShotSound(typeIdx, worldX) {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const dest = makePanner(worldX);
    const jitter = ((audioRng() % 1000) / 1000 - 0.5) * 0.06;

    if (typeIdx === 3) {
      // Lance: sharp crimson zap + sub punch
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(620 * (1 + jitter), now);
      osc.frequency.exponentialRampToValueAtTime(95, now + 0.14);
      g.gain.setValueAtTime(0.16, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      osc.connect(g); g.connect(dest);
      registerOneShot(osc, now + 0.16);
    } else if (typeIdx === 1) {
      // Cannon: low mortar thump + short noise puff
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(165 * (1 + jitter), now);
      osc.frequency.exponentialRampToValueAtTime(42, now + 0.13);
      g.gain.setValueAtTime(0.20, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
      osc.connect(g); g.connect(dest);
      registerOneShot(osc, now + 0.15);
    } else if (typeIdx === 4) {
      // Flak: crisp metallic air-burst noise
      const ns = audioCtx.createBufferSource();
      ns.buffer = noiseBuf;
      const bp = audioCtx.createBiquadFilter();
      bp.type = "bandpass";
      bp.frequency.value = 1350 * (1 + jitter);
      bp.Q.value = 2.2;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.13, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.085);
      ns.connect(bp); bp.connect(g); g.connect(dest);
      activeNodes.add(ns);
      ns.onended = function () { activeNodes.delete(ns); };
      ns.start(now, (audioRng() % 100) * 0.01, 0.09);
    } else if (typeIdx === 2) {
      // Frost: icy high chime
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(1180 * (1 + jitter), now);
      osc.frequency.exponentialRampToValueAtTime(1680, now + 0.09);
      g.gain.setValueAtTime(0.075, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.095);
      osc.connect(g); g.connect(dest);
      registerOneShot(osc, now + 0.10);
    } else {
      // Bolt: quick steel plink
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "square";
      osc.frequency.setValueAtTime(520 * (1 + jitter), now);
      osc.frequency.exponentialRampToValueAtTime(240, now + 0.055);
      g.gain.setValueAtTime(0.07, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc.connect(g); g.connect(dest);
      registerOneShot(osc, now + 0.065);
    }
  }

  function playKillSound(worldX) {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const dest = makePanner(worldX);
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "sine";
    const f0 = 260 + (audioRng() % 90);
    osc.frequency.setValueAtTime(f0, now);
    osc.frequency.exponentialRampToValueAtTime(f0 * 1.65, now + 0.055);
    g.gain.setValueAtTime(0.065, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
    osc.connect(g); g.connect(dest);
    registerOneShot(osc, now + 0.065);
  }

  function playWaveHorn() {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const dest = makePanner(2.0);
    for (const mult of [1.0, 1.498]) {
      const osc = audioCtx.createOscillator();
      const lp = audioCtx.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.value = 680;
      const g = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(146.8 * mult, now);
      osc.frequency.exponentialRampToValueAtTime(196.0 * mult, now + 0.34);
      g.gain.setValueAtTime(0.001, now);
      g.gain.linearRampToValueAtTime(0.085, now + 0.06);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.42);
      osc.connect(lp); lp.connect(g); g.connect(dest);
      registerOneShot(osc, now + 0.44);
    }
  }

  function playLeakAlarm() {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const dest = makePanner(23.0);
    // Stone crack noise
    const ns = audioCtx.createBufferSource();
    ns.buffer = noiseBuf;
    const lp = audioCtx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = 900;
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.24, now);
    ng.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
    ns.connect(lp); lp.connect(ng); ng.connect(dest);
    activeNodes.add(ns);
    ns.onended = function () { activeNodes.delete(ns); };
    ns.start(now, 0.2, 0.17);

    // Alarm tone
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(440, now);
    osc.frequency.setValueAtTime(330, now + 0.11);
    g.gain.setValueAtTime(0.14, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
    osc.connect(g); g.connect(dest);
    registerOneShot(osc, now + 0.27);
  }

  function playFallCollapse() {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const dest = makePanner(23.0);
    // Deep rumble collapse
    const ns = audioCtx.createBufferSource();
    ns.buffer = noiseBuf;
    const lp = audioCtx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.setValueAtTime(480, now);
    lp.frequency.exponentialRampToValueAtTime(85, now + 1.1);
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.38, now);
    ng.gain.exponentialRampToValueAtTime(0.001, now + 1.25);
    ns.connect(lp); lp.connect(ng); ng.connect(dest);
    activeNodes.add(ns);
    ns.onended = function () { activeNodes.delete(ns); };
    ns.start(now, 0, 1.3);

    const sub = audioCtx.createOscillator();
    const sg = audioCtx.createGain();
    sub.type = "sine";
    sub.frequency.setValueAtTime(92, now);
    sub.frequency.exponentialRampToValueAtTime(28, now + 1.1);
    sg.gain.setValueAtTime(0.34, now);
    sg.gain.exponentialRampToValueAtTime(0.001, now + 1.15);
    sub.connect(sg); sg.connect(dest);
    registerOneShot(sub, now + 1.2);
  }

  // Trigger audio events strictly when forward PLAYING crosses integer ticks in (prevSimTime, newSimTime]
  const SHOT_LOUDNESS_PRIORITY = { 3: 5, 1: 4, 4: 3, 2: 2, 0: 1 };
  function triggerAudioRange(t0, t1) {
    if (!audioCtx || audioCtx.state !== "running") return;
    const startTick = Math.floor(t0 * 20) + 1;
    const endTick = Math.min(MAX_TICKS - 1, Math.floor(t1 * 20));
    if (endTick < startTick) return;

    const nowWall = audioCtx.currentTime;
    shotSoundStamps = shotSoundStamps.filter(ts => nowWall - ts < 1.0);

    const candidateShots = [];
    let killsTriggered = 0;

    for (let tk = startTick; tk <= endTick; tk++) {
      if (replay.fallTick >= 0 && tk > replay.fallTick) break;
      if (replay.fallTick === tk) {
        playFallCollapse();
        if (windGain) {
          windGain.gain.cancelScheduledValues(nowWall);
          windGain.gain.setValueAtTime(windGain.gain.value, nowWall);
          windGain.gain.linearRampToValueAtTime(0.16, nowWall + 0.5);
        }
        break;
      }
      if (replay.waveStartSet.has(tk)) playWaveHorn();
      if (replay.leaksByTick[tk] && replay.leaksByTick[tk].length > 0) playLeakAlarm();

      const sList = replay.shotsByTick[tk];
      if (sList) {
        for (let i = 0; i < sList.length; i++) candidateShots.push(sList[i]);
      }
      const kList = replay.killsByTick[tk];
      if (kList && kList.length > 0 && killsTriggered < 3) {
        playKillSound(kList[0].x);
        killsTriggered++;
      }
    }

    // Rate-limit shot sounds to at most 12 per wall-clock second, loudest types first (Lance > Cannon > Flak > Frost > Bolt)
    if (candidateShots.length > 0 && shotSoundStamps.length < 12) {
      candidateShots.sort((a, b) => SHOT_LOUDNESS_PRIORITY[b.typeIdx] - SHOT_LOUDNESS_PRIORITY[a.typeIdx]);
      const budget = Math.min(3, 12 - shotSoundStamps.length, candidateShots.length);
      for (let i = 0; i < budget; i++) {
        playShotSound(candidateShots[i].typeIdx, candidateShots[i].sx);
        shotSoundStamps.push(nowWall);
      }
    }
  }

  // ==================== DETERMINISTIC SCENE RENDER AT ANY simTime ====================
  const tmpObj = new THREE.Object3D();
  const tmpColor = new THREE.Color();
  const tmpVecA = new THREE.Vector3();
  const tmpVecB = new THREE.Vector3();
  const tmpQuat = new THREE.Quaternion();
  const forwardZ = new THREE.Vector3(0, 0, 1);

  const BEAM_COLORS = [
    new THREE.Color(0x7cc0ff), // bolt steel-blue tracer
    new THREE.Color(0xffb259), // cannon
    new THREE.Color(0xbdf2ff), // frost pale beam
    new THREE.Color(0xff2952), // lance thick crimson beam
    new THREE.Color(0x3ff5d4)  // flak teal
  ];

  let prevDesat = -1;
  function applyDesaturation(desat) {
    if (Math.abs(desat - prevDesat) < 0.002) return;
    prevDesat = desat;
    for (let i = 0; i < trackedMaterials.length; i++) {
      const m = trackedMaterials[i];
      if (m.userData.origColor && m.color) {
        const oc = m.userData.origColor;
        const lum = oc.r * 0.299 + oc.g * 0.587 + oc.b * 0.114;
        m.color.setRGB(
          oc.r + (lum * 0.85 - oc.r) * desat,
          oc.g + (lum * 0.85 - oc.g) * desat,
          oc.b + (lum * 0.92 - oc.b) * desat
        );
      }
      if (m.userData.origEmissive && m.emissive) {
        const oe = m.userData.origEmissive;
        m.emissive.setRGB(oe.r * (1 - desat * 0.88), oe.g * (1 - desat * 0.88), oe.b * (1 - desat * 0.88));
      }
    }
  }

  function renderAtSimTime(simTime) {
    const clampedT = Math.max(0, Math.min(DURATION, simTime));
    const fallTime = replay.fallTick >= 0 ? replay.fallTick / 20 : Infinity;
    const effectiveSimTime = Math.min(clampedT, fallTime);

    const exactTick = effectiveSimTime * 20;
    const k = Math.min(MAX_TICKS - 1, Math.floor(exactTick));
    const alpha = (replay.fallTick >= 0 && k >= replay.fallTick) ? 0 : (exactTick - k);

    const frameA = replay.frames[k];
    const frameB = replay.frames[Math.min(MAX_TICKS, k + 1)];

    // 1. Post-fall desaturation (0 -> 0.90 over 1.0s after fallTick, held to 100s)
    const desat = clampedT > fallTime ? Math.min(0.90, (clampedT - fallTime) * 0.90) : 0;
    applyDesaturation(desat);

    // 2. Trauma camera shake (closed-form in simTime)
    const trauma = computeTrauma(clampedT);
    const shakeMag = trauma * trauma * 0.25;
    const sx = smoothNoise1D(clampedT * 29.0, 1) * shakeMag;
    const sy = smoothNoise1D(clampedT * 33.0, 2) * shakeMag * 0.6;
    const sz = smoothNoise1D(clampedT * 31.0, 3) * shakeMag;
    camera.position.set(camBasePos.x + sx, camBasePos.y + sy, camBasePos.z + sz);
    camera.lookAt(BASE_LOOK.x + sx * 0.4, BASE_LOOK.y, BASE_LOOK.z + sz * 0.4);
    camera.updateMatrixWorld();

    // Animate air lane beacons deterministically from effectiveSimTime
    for (let i = 0; i < airBeacons.length; i++) {
      const ab = airBeacons[i];
      ab.mesh.material.opacity = (0.20 + 0.22 * Math.sin(effectiveSimTime * 4.5 - ab.phase)) * (1 - desat * 0.8);
    }

    // 3. Update Turrets + Build/Upgrade animation
    for (let i = 0; i < 16; i++) {
      const sv = slotVisuals[i];
      const stA = frameA.slots[i];
      const stB = frameB.slots[i];
      for (let tIdx = 0; tIdx < 5; tIdx++) sv.byType[tIdx].visible = false;
      for (let r = 0; r < 3; r++) sv.rings[r].visible = false;

      if (stA) {
        const mesh = sv.byType[stA.typeIdx];
        mesh.visible = true;
        // Pop-in scale if recently built
        let buildScale = 1.0;
        for (let eIdx = replay.slotEvents.length - 1; eIdx >= 0; eIdx--) {
          const ev = replay.slotEvents[eIdx];
          if (ev.slot === i && ev.tick <= k) {
            const age = (exactTick - ev.tick) / 20;
            if (ev.op === "B" && age >= 0 && age < 0.28) {
              const u = age / 0.28;
              buildScale = 0.2 + 0.8 * (1 - Math.pow(1 - u, 3));
            } else if (ev.op === "U" && age >= 0 && age < 0.25) {
              buildScale = 1.0 + 0.22 * Math.sin((age / 0.25) * Math.PI);
            }
            break;
          }
        }
        sv.root.scale.setScalar(buildScale);

        // Interpolate turret head yaw cleanly
        let yaw = stA.yaw;
        if (stB && stB.typeIdx === stA.typeIdx) {
          let diff = stB.yaw - stA.yaw;
          while (diff > Math.PI) diff -= Math.PI * 2;
          while (diff < -Math.PI) diff += Math.PI * 2;
          yaw = stA.yaw + diff * alpha;
        }
        if (stA.typeIdx === 2) {
          // Frost crystal slowly spins
          mesh.userData.head.rotation.y = effectiveSimTime * 1.8 + i;
        } else {
          mesh.userData.head.rotation.y = yaw;
        }

        for (let r = 0; r < stA.tier; r++) sv.rings[r].visible = true;
      } else {
        sv.root.scale.setScalar(1.0);
      }
    }

    // 4. Update Instanced Enemies, Shadows, Overlays & Health Bars
    const nextEnemyMap = new Map();
    for (let i = 0; i < frameB.enemies.length; i++) {
      nextEnemyMap.set(frameB.enemies[i].id, frameB.enemies[i]);
    }

    const typeCounts = [0, 0, 0, 0, 0, 0, 0];
    let bruteOverlayCount = 0;
    let menderOverlayCount = 0;
    let wispShadowCount = 0;
    let hpBarCount = 0;

    for (let i = 0; i < frameA.enemies.length; i++) {
      const eA = frameA.enemies[i];
      const eB = nextEnemyMap.get(eA.id);
      const prog = eB ? (eA.progress + (eB.progress - eA.progress) * alpha) : eA.progress;
      const path = eA.air ? AIR_PATH : GROUND_PATH;
      const pd = posAndDirOnPath(path, prog);
      const wx = pd[0] / 100;
      const wz = pd[1] / 100;
      const yaw = Math.atan2(pd[2], pd[3]);

      const tIdx = eA.typeIdx;
      const cIdx = typeCounts[tIdx];
      if (cIdx >= MAX_ENEMIES) continue;
      typeCounts[tIdx]++;

      const bob = eA.air ? Math.sin(effectiveSimTime * 6 + eA.id) * 0.05 : Math.abs(Math.sin(prog * 0.06 + eA.id)) * 0.04;
      const wy = (eA.air ? 0.85 : (tIdx === 3 ? 0.30 : (tIdx === 6 ? 0.20 : 0.25))) + bob;

      tmpObj.position.set(wx, wy, wz);
      tmpObj.rotation.set(0, yaw, 0);
      tmpObj.scale.set(1, 1, 1);
      tmpObj.updateMatrix();

      const im = enemyInstMeshes[tIdx];
      im.setMatrixAt(cIdx, tmpObj.matrix);

      // Tint slowed enemies frost-blue, and apply post-fall desaturation
      tmpColor.copy(enemyBaseColors[tIdx]);
      if (eA.slow) tmpColor.lerp(FROST_TINT, 0.58);
      if (desat > 0) {
        const lum = tmpColor.r * 0.3 + tmpColor.g * 0.59 + tmpColor.b * 0.11;
        tmpColor.lerp(new THREE.Color(lum, lum, lum), desat);
      }
      im.setColorAt(cIdx, tmpColor);

      if (tIdx === 3 && bruteOverlayCount < MAX_ENEMIES) {
        tmpObj.position.set(wx, wy + 0.08, wz);
        tmpObj.rotation.set(0, yaw, 0);
        tmpObj.scale.set(1, 1, 1);
        tmpObj.updateMatrix();
        brutePlateInst.setMatrixAt(bruteOverlayCount++, tmpObj.matrix);
      } else if (tIdx === 5 && menderOverlayCount < MAX_ENEMIES) {
        tmpObj.position.set(wx, 0.11, wz);
        tmpObj.rotation.set(0, 0, 0);
        const hPulse = 0.92 + 0.12 * Math.sin(effectiveSimTime * 5 + eA.id);
        tmpObj.scale.setScalar(hPulse);
        tmpObj.updateMatrix();
        menderHaloInst.setMatrixAt(menderOverlayCount++, tmpObj.matrix);
      } else if (tIdx === 2 && wispShadowCount < MAX_ENEMIES) {
        tmpObj.position.set(wx, 0.08, wz);
        tmpObj.rotation.set(0, 0, 0);
        tmpObj.scale.setScalar(1.0);
        tmpObj.updateMatrix();
        wispShadowInst.setMatrixAt(wispShadowCount++, tmpObj.matrix);
      }

      // Health bar above enemy (facing camera)
      if (hpBarCount < MAX_ENEMIES) {
        const hpRatio = Math.max(0.02, Math.min(1.0, eA.hp / Math.max(1, eA.maxHp)));
        const barY = wy + (tIdx === 3 ? 0.44 : 0.36);

        tmpObj.position.set(wx, barY, wz);
        tmpObj.quaternion.copy(camera.quaternion);
        tmpObj.scale.set(1, 1, 1);
        tmpObj.updateMatrix();
        hpBgInst.setMatrixAt(hpBarCount, tmpObj.matrix);

        // Shift foreground left in camera-right space so bar shrinks toward left
        const shift = -(1 - hpRatio) * 0.22;
        tmpVecA.set(shift, 0, 0.002).applyQuaternion(camera.quaternion);
        tmpObj.position.set(wx + tmpVecA.x, barY + tmpVecA.y, wz + tmpVecA.z);
        tmpObj.scale.set(hpRatio, 1, 1);
        tmpObj.updateMatrix();
        hpFgInst.setMatrixAt(hpBarCount, tmpObj.matrix);

        if (eA.slow) tmpColor.setHex(0x63d8ff);
        else if (hpRatio > 0.55) tmpColor.setHex(0x4bf57c);
        else if (hpRatio > 0.25) tmpColor.setHex(0xffc938);
        else tmpColor.setHex(0xff4255);
        if (desat > 0) tmpColor.lerp(new THREE.Color(0.5, 0.5, 0.5), desat);
        hpFgInst.setColorAt(hpBarCount, tmpColor);

        hpBarCount++;
      }
    }

    for (let t = 0; t < 7; t++) {
      enemyInstMeshes[t].count = typeCounts[t];
      enemyInstMeshes[t].instanceMatrix.needsUpdate = true;
      if (enemyInstMeshes[t].instanceColor) enemyInstMeshes[t].instanceColor.needsUpdate = true;
    }
    brutePlateInst.count = bruteOverlayCount;
    brutePlateInst.instanceMatrix.needsUpdate = true;
    menderHaloInst.count = menderOverlayCount;
    menderHaloInst.instanceMatrix.needsUpdate = true;
    wispShadowInst.count = wispShadowCount;
    wispShadowInst.instanceMatrix.needsUpdate = true;
    hpBgInst.count = hpBarCount;
    hpBgInst.instanceMatrix.needsUpdate = true;
    hpFgInst.count = hpBarCount;
    hpFgInst.instanceMatrix.needsUpdate = true;
    if (hpFgInst.instanceColor) hpFgInst.instanceColor.needsUpdate = true;

    // 5. Keep Leaks, Crumbling Chunks & Catastrophic Fall
    let recentLeakFlash = 0;
    for (let i = 0; i < replay.leakEvents.length; i++) {
      const age = clampedT - replay.leakEvents[i].tick / 20;
      if (age >= 0 && age < 0.25) {
        recentLeakFlash = Math.max(recentLeakFlash, 1.0 - age / 0.25);
      }
    }
    if (recentLeakFlash > 0 && clampedT < fallTime) {
      keepStoneMat.emissive.setRGB(0.85 * recentLeakFlash, 0.08 * recentLeakFlash, 0.08 * recentLeakFlash);
    } else if (desat === 0) {
      keepStoneMat.emissive.setRGB(0, 0, 0);
    }

    const postFallAge = clampedT - fallTime;
    if (postFallAge >= 0) {
      // Collapse keep core & towers into ground
      const cProg = Math.min(1.0, postFallAge * 2.2);
      keepCore.position.y = 0.625 * (1 - cProg * 0.78);
      keepCore.rotation.z = cProg * 0.18;
      keepRoof.position.y = 1.5 - cProg * 1.15;
      keepRoof.rotation.x = cProg * 0.45;
      for (let i = 0; i < 4; i++) {
        keepTowers[i].position.y = 0.54 * (1 - cProg * 0.65);
        keepTowers[i].rotation.z = (i % 2 === 0 ? 1 : -1) * cProg * 0.35;
      }
    } else {
      keepCore.position.y = 0.625;
      keepCore.rotation.z = 0;
      keepRoof.position.y = 1.5;
      keepRoof.rotation.x = 0;
      for (let i = 0; i < 4; i++) {
        keepTowers[i].position.y = 0.54;
        keepTowers[i].rotation.z = 0;
      }
    }

    // 10 Keep Wall Chunks: each knocked off ballistically at its exact leak tick!
    for (let i = 0; i < 10; i++) {
      const hpIdx = 10 - i; // chunk 0 knocked off when HP drops from 10->9, etc.
      const lostTick = hpLostAtTick[hpIdx];
      const ch = keepChunks[i];
      if (clampedT * 20 < lostTick) {
        ch.mesh.visible = true;
        ch.mesh.position.copy(ch.origPos);
        ch.mesh.rotation.set(0, 0, 0);
      } else {
        const dtChunk = Math.min(0.85, clampedT - lostTick / 20);
        const py = Math.max(0.14, ch.origPos.y + ch.vy * dtChunk - 9.8 * dtChunk * dtChunk);
        ch.mesh.visible = true;
        ch.mesh.position.set(
          ch.origPos.x + ch.vx * dtChunk * 0.45,
          py,
          ch.origPos.z + ch.vz * dtChunk * 0.45
        );
        ch.mesh.rotation.set(ch.rx * dtChunk, 0, ch.rz * dtChunk);
      }
    }

    // 6. Combat Shots (<= 0.15s = 3 ticks), Rings, Slot Events & Closed-Form Ballistic Debris
    let beamCount = 0;
    let shellCount = 0;
    let ringCount = 0;
    let debrisCount = 0;

    // Shots in last 0.15s (3 ticks)
    const minShotTick = Math.max(0, Math.floor((effectiveSimTime - 0.15) * 20));
    const maxShotTick = Math.min(MAX_TICKS - 1, Math.floor(effectiveSimTime * 20));
    for (let tk = minShotTick; tk <= maxShotTick; tk++) {
      if (replay.fallTick >= 0 && tk >= replay.fallTick) break;
      const list = replay.shotsByTick[tk];
      for (let i = 0; i < list.length; i++) {
        const sh = list[i];
        const age = effectiveSimTime - sh.tick / 20;
        if (age < 0 || age > 0.15) continue;
        const u = age / 0.15;

        if (sh.typeIdx === 1) {
          // Cannon: parabolic shell arc for first 0.10s, then splash ring of exact splash radius (0.90 tiles) for 0.05..0.15s
          if (u < 0.72 && shellCount < MAX_SHELLS) {
            const su = u / 0.72;
            const cx = sh.sx + (sh.tx - sh.sx) * su;
            const cz = sh.sz + (sh.tz - sh.sz) * su;
            const cy = 0.52 + (sh.ty - 0.52) * su + Math.sin(su * Math.PI) * 0.85;
            tmpObj.position.set(cx, cy, cz);
            tmpObj.rotation.set(0, 0, 0);
            tmpObj.scale.setScalar(1.0);
            tmpObj.updateMatrix();
            shellInst.setMatrixAt(shellCount++, tmpObj.matrix);
          }
          if (u >= 0.45 && ringCount < MAX_RINGS) {
            const ru = (u - 0.45) / 0.55;
            tmpObj.position.set(sh.tx, 0.11, sh.tz);
            tmpObj.rotation.set(0, 0, 0);
            tmpObj.scale.setScalar(sh.splash * (0.35 + 0.65 * ru));
            tmpObj.updateMatrix();
            ringFxInst.setMatrixAt(ringCount, tmpObj.matrix);
            tmpColor.setHex(0xff9d3b).multiplyScalar(1.0 - ru * 0.65);
            ringFxInst.setColorAt(ringCount, tmpColor);
            ringCount++;
          }
        } else if (sh.typeIdx === 4) {
          // Flak: thin tracer + teal air burst ring of splash radius (0.70 tiles) at y=0.85
          if (u < 0.55 && beamCount < MAX_BEAMS) {
            tmpVecA.set(sh.sx, 0.55, sh.sz);
            tmpVecB.set(sh.tx, sh.ty, sh.tz).sub(tmpVecA);
            const len = tmpVecB.length();
            if (len > 0.01) {
              tmpQuat.setFromUnitVectors(forwardZ, tmpVecB.clone().normalize());
              tmpObj.position.copy(tmpVecA);
              tmpObj.quaternion.copy(tmpQuat);
              tmpObj.scale.set(0.022, 0.022, len);
              tmpObj.updateMatrix();
              beamInst.setMatrixAt(beamCount, tmpObj.matrix);
              beamInst.setColorAt(beamCount, BEAM_COLORS[4]);
              beamCount++;
            }
          }
          if (ringCount < MAX_RINGS) {
            tmpObj.position.set(sh.tx, sh.ty, sh.tz);
            tmpObj.rotation.set(0, 0, 0);
            tmpObj.scale.setScalar(sh.splash * (0.3 + 0.7 * u));
            tmpObj.updateMatrix();
            ringFxInst.setMatrixAt(ringCount, tmpObj.matrix);
            tmpColor.setHex(0x3ff5d4).multiplyScalar(1.0 - u * 0.6);
            ringFxInst.setColorAt(ringCount, tmpColor);
            ringCount++;
          }
        } else {
          // Bolt (thin tracer), Frost (pale beam), Lance (thick crimson beam with flash ring)
          if (beamCount < MAX_BEAMS) {
            const startY = sh.typeIdx === 2 ? 0.68 : 0.52;
            tmpVecA.set(sh.sx, startY, sh.sz);
            tmpVecB.set(sh.tx, sh.ty, sh.tz).sub(tmpVecA);
            const len = tmpVecB.length();
            if (len > 0.01) {
              tmpQuat.setFromUnitVectors(forwardZ, tmpVecB.clone().normalize());
              tmpObj.position.copy(tmpVecA);
              tmpObj.quaternion.copy(tmpQuat);
              const thick = sh.typeIdx === 3 ? (0.065 * (1 - u * 0.5)) : (sh.typeIdx === 2 ? 0.034 : 0.020);
              tmpObj.scale.set(thick, thick, len);
              tmpObj.updateMatrix();
              beamInst.setMatrixAt(beamCount, tmpObj.matrix);
              tmpColor.copy(BEAM_COLORS[sh.typeIdx]).multiplyScalar(1.0 - u * 0.45);
              beamInst.setColorAt(beamCount, tmpColor);
              beamCount++;
            }
          }
          if (sh.typeIdx === 3 && u < 0.65 && ringCount < MAX_RINGS) {
            tmpObj.position.set(sh.tx, sh.ty, sh.tz);
            tmpObj.rotation.set(0, 0, 0);
            tmpObj.scale.setScalar(0.45 * (1 - u));
            tmpObj.updateMatrix();
            ringFxInst.setMatrixAt(ringCount, tmpObj.matrix);
            ringFxInst.setColorAt(ringCount, BEAM_COLORS[3]);
            ringCount++;
          }
        }
      }
    }

    // Mender Heal Pulse Rings (1.50 tiles radius, green)
    const minHealTick = Math.max(0, Math.floor((effectiveSimTime - 0.45) * 20));
    for (let tk = minHealTick; tk <= maxShotTick; tk++) {
      const hList = replay.healsByTick[tk];
      for (let i = 0; i < hList.length; i++) {
        const hl = hList[i];
        const age = effectiveSimTime - hl.tick / 20;
        if (age >= 0 && age <= 0.45 && ringCount < MAX_RINGS) {
          const u = age / 0.45;
          tmpObj.position.set(hl.x, 0.12, hl.z);
          tmpObj.rotation.set(0, 0, 0);
          tmpObj.scale.setScalar(1.50 * (0.2 + 0.8 * u));
          tmpObj.updateMatrix();
          ringFxInst.setMatrixAt(ringCount, tmpObj.matrix);
          tmpColor.setHex(0x4bf58c).multiplyScalar(1.0 - u * 0.75);
          ringFxInst.setColorAt(ringCount, tmpColor);
          ringCount++;
        }
      }
    }

    // Build / Upgrade / Sell slot visual effects (rising sparkles, golden ring pulse, or rubble collapse)
    const minSlotEvTick = Math.max(0, Math.floor((effectiveSimTime - 0.6) * 20));
    for (let tk = minSlotEvTick; tk <= maxShotTick; tk++) {
      const evList = replay.slotEventsByTick[tk];
      for (let i = 0; i < evList.length; i++) {
        const ev = evList[i];
        const age = effectiveSimTime - ev.tick / 20;
        if (age < 0 || age > 0.55) continue;
        const u = age / 0.55;
        const [stx, sty] = SLOT_TILES[ev.slot];
        const wx = stx + 0.5, wz = sty + 0.5;

        if (ev.op === "U" && ringCount < MAX_RINGS) {
          tmpObj.position.set(wx, 0.20 + u * 0.5, wz);
          tmpObj.rotation.set(0, 0, 0);
          tmpObj.scale.setScalar(0.35 + u * 0.65);
          tmpObj.updateMatrix();
          ringFxInst.setMatrixAt(ringCount, tmpObj.matrix);
          tmpColor.setHex(0xffe46b).multiplyScalar(1.0 - u);
          ringFxInst.setColorAt(ringCount, tmpColor);
          ringCount++;
        } else if (ev.op === "B") {
          for (let sp = 0; sp < 5 && debrisCount < MAX_DEBRIS; sp++) {
            const ang = sp * 1.256 + ev.slot;
            const rad = 0.34 * (1 - u * 0.4);
            tmpObj.position.set(wx + Math.cos(ang) * rad, 0.18 + u * 0.95, wz + Math.sin(ang) * rad);
            tmpObj.rotation.set(u * 4, ang, 0);
            tmpObj.scale.setScalar((1 - u) * 0.85);
            tmpObj.updateMatrix();
            debrisInst.setMatrixAt(debrisCount, tmpObj.matrix);
            debrisInst.setColorAt(debrisCount, new THREE.Color(0x9ef5ff));
            debrisCount++;
          }
        } else if (ev.op === "S") {
          for (let rb = 0; rb < 6 && debrisCount < MAX_DEBRIS; rb++) {
            const ang = rb * 1.047 + ev.slot;
            const py = Math.max(0.08, 0.38 - 3.2 * age * age);
            tmpObj.position.set(wx + Math.cos(ang) * age * 0.9, py, wz + Math.sin(ang) * age * 0.9);
            tmpObj.rotation.set(age * 5, ang, age * 3);
            tmpObj.scale.setScalar((1 - u) * 1.1);
            tmpObj.updateMatrix();
            debrisInst.setMatrixAt(debrisCount, tmpObj.matrix);
            debrisInst.setColorAt(debrisCount, new THREE.Color(0x7c8496));
            debrisCount++;
          }
        }
      }
    }

    // Kill ballistic debris (seeded, closed-form in time since kill; splitter bursts purple)
    const minKillTick = Math.max(0, Math.floor((effectiveSimTime - 0.55) * 20));
    for (let tk = minKillTick; tk <= maxShotTick; tk++) {
      const kList = replay.killsByTick[tk];
      for (let i = 0; i < kList.length; i++) {
        const kl = kList[i];
        const age = effectiveSimTime - kl.tick / 20;
        if (age < 0 || age > 0.55) continue;
        const u = age / 0.55;
        const pieces = kl.isSplitter ? 7 : 4;
        const baseCol = enemyBaseColors[kl.typeIdx];

        if (kl.isSplitter && age < 0.35 && ringCount < MAX_RINGS) {
          tmpObj.position.set(kl.x, 0.16, kl.z);
          tmpObj.rotation.set(0, 0, 0);
          tmpObj.scale.setScalar(0.25 + (age / 0.35) * 0.75);
          tmpObj.updateMatrix();
          ringFxInst.setMatrixAt(ringCount, tmpObj.matrix);
          ringFxInst.setColorAt(ringCount, enemyBaseColors[4]);
          ringCount++;
        }

        for (let p = 0; p < pieces && debrisCount < MAX_DEBRIS; p++) {
          const seedKey = kl.id * 31 + p * 7;
          const ang = hashFloat(seedKey) * Math.PI * 2;
          const spd = 1.1 + hashFloat(seedKey + 1) * 1.8;
          const vy0 = 2.0 + hashFloat(seedKey + 2) * 1.8;
          const dx = Math.cos(ang) * spd * age;
          const dz = Math.sin(ang) * spd * age;
          const dy = Math.max(0.06, kl.y + vy0 * age - 9.5 * age * age);

          tmpObj.position.set(kl.x + dx, dy, kl.z + dz);
          tmpObj.rotation.set(age * 8 + p, age * 6, 0);
          tmpObj.scale.setScalar((1 - u) * (kl.isSplitter ? 1.25 : 0.95));
          tmpObj.updateMatrix();
          debrisInst.setMatrixAt(debrisCount, tmpObj.matrix);
          tmpColor.copy(baseCol);
          if (desat > 0) tmpColor.lerp(new THREE.Color(0.45, 0.45, 0.45), desat);
          debrisInst.setColorAt(debrisCount, tmpColor);
          debrisCount++;
        }
      }
    }

    // Fall Shockwave Ring & Keep Collapse Debris Burst (closed-form in postFallAge)
    if (postFallAge >= 0) {
      if (postFallAge < 1.1 && ringCount < MAX_RINGS) {
        const u = postFallAge / 1.1;
        tmpObj.position.set(KEEP_X, 0.14, KEEP_Z);
        tmpObj.rotation.set(0, 0, 0);
        tmpObj.scale.setScalar(0.6 + u * 8.5);
        tmpObj.updateMatrix();
        ringFxInst.setMatrixAt(ringCount, tmpObj.matrix);
        tmpColor.setHex(0xff7744).multiplyScalar(1.0 - u);
        ringFxInst.setColorAt(ringCount, tmpColor);
        ringCount++;
      }
      const burstAge = Math.min(1.4, postFallAge);
      for (let p = 0; p < 48 && debrisCount < MAX_DEBRIS; p++) {
        const sk = 9000 + p * 13;
        const ang = hashFloat(sk) * Math.PI * 2;
        const spd = 1.5 + hashFloat(sk + 1) * 3.8;
        const vy0 = 2.6 + hashFloat(sk + 2) * 3.6;
        const py = Math.max(0.09, 0.7 + vy0 * burstAge - 9.2 * burstAge * burstAge);
        const settleTime = (vy0 + Math.sqrt(vy0 * vy0 + 2 * 9.2 * 0.61)) / 9.2;
        const hAge = Math.min(burstAge, settleTime);

        tmpObj.position.set(
          KEEP_X + Math.cos(ang) * spd * hAge,
          py,
          KEEP_Z + Math.sin(ang) * spd * hAge
        );
        tmpObj.rotation.set(hAge * 5 + p, p, hAge * 4);
        tmpObj.scale.setScalar(1.35 + hashFloat(sk + 3) * 0.9);
        tmpObj.updateMatrix();
        debrisInst.setMatrixAt(debrisCount, tmpObj.matrix);
        tmpColor.setHex(p % 5 === 0 ? 0xb56c36 : 0x6b7280);
        if (desat > 0) tmpColor.lerp(new THREE.Color(0.42, 0.42, 0.45), desat);
        debrisInst.setColorAt(debrisCount, tmpColor);
        debrisCount++;
      }
    }

    beamInst.count = beamCount;
    beamInst.instanceMatrix.needsUpdate = true;
    if (beamInst.instanceColor) beamInst.instanceColor.needsUpdate = true;

    shellInst.count = shellCount;
    shellInst.instanceMatrix.needsUpdate = true;

    ringFxInst.count = ringCount;
    ringFxInst.instanceMatrix.needsUpdate = true;
    if (ringFxInst.instanceColor) ringFxInst.instanceColor.needsUpdate = true;

    debrisInst.count = debrisCount;
    debrisInst.instanceMatrix.needsUpdate = true;
    if (debrisInst.instanceColor) debrisInst.instanceColor.needsUpdate = true;

    // 7. Update Orthographic HUD & Render Both Passes Into #stage
    updateHud(frameA, clampedT);

    renderer.clear();
    renderer.render(scene, camera);
    renderer.clearDepth();
    renderer.render(hudScene, hudCam);
  }

  // ==================== 5-STATE PLAYBACK STATE MACHINE & UI CONTROLS ====================
  const elCountdown = document.getElementById("countdown");
  const btnRefire = document.getElementById("btn-refire");
  const btnToggle = document.getElementById("btn-toggle");
  const iconPause = document.getElementById("icon-pause");
  const iconPlay = document.getElementById("icon-play");
  const speedPills = Array.prototype.slice.call(document.querySelectorAll(".speed-pill"));
  const scrubber = document.getElementById("scrubber");

  let state = "INIT"; // transitions to COUNTDOWN on first rAF after initial resting scene has rendered
  let simTime = 0.0;
  let playbackSpeed = 1.0;
  let countdownElapsed = 0.0;
  let holdElapsed = 0.0;
  let lastWallMs = null;

  function setToggleIcon(showPause) {
    if (showPause) {
      iconPause.style.display = "";
      iconPlay.style.display = "none";
      btnToggle.setAttribute("aria-label", "Pause");
    } else {
      iconPause.style.display = "none";
      iconPlay.style.display = "";
      btnToggle.setAttribute("aria-label", "Play");
    }
  }

  function hideCountdown() {
    elCountdown.style.display = "none";
    elCountdown.textContent = "";
  }

  function syncAudioWithState() {
    const inPostFall = replay.fallTick >= 0 && simTime >= replay.fallTick / 20;
    setAudioAudible(state === "PLAYING", inPostFall);
  }

  btnToggle.addEventListener("click", function () {
    resumeAudio();
    if (state === "PLAYING") {
      state = "PAUSED";
      setToggleIcon(false);
      syncAudioWithState();
    } else if (state === "COUNTDOWN" || state === "REFIRE_HOLD" || state === "INIT") {
      hideCountdown();
      simTime = 0.0;
      scrubber.value = "0";
      state = "PAUSED";
      setToggleIcon(false);
      syncAudioWithState();
      renderAtSimTime(0.0);
    } else if (state === "PAUSED") {
      state = "PLAYING";
      setToggleIcon(true);
      syncAudioWithState();
    } else if (state === "ENDED") {
      hideCountdown();
      simTime = 0.0;
      scrubber.value = "0.000";
      state = "PLAYING";
      setToggleIcon(true);
      syncAudioWithState();
      renderAtSimTime(0.0);
    }
  });

  btnRefire.addEventListener("click", function () {
    resumeAudio();
    hideCountdown();
    simTime = 0.0;
    scrubber.value = "0";
    holdElapsed = 0.0;
    state = "REFIRE_HOLD";
    setToggleIcon(true);
    syncAudioWithState();
    renderAtSimTime(0.0);
  });

  for (let i = 0; i < speedPills.length; i++) {
    speedPills[i].addEventListener("click", function () {
      resumeAudio();
      const sp = parseFloat(this.getAttribute("data-speed"));
      if (!isNaN(sp)) playbackSpeed = sp;
      for (let j = 0; j < speedPills.length; j++) {
        const active = speedPills[j] === this;
        speedPills[j].classList.toggle("is-active", active);
        speedPills[j].setAttribute("aria-checked", active ? "true" : "false");
      }
    });
  }

  scrubber.addEventListener("input", function () {
    resumeAudio();
    if (state === "COUNTDOWN" || state === "REFIRE_HOLD" || state === "INIT") {
      hideCountdown();
    }
    simTime = Math.max(0, Math.min(DURATION, parseFloat(scrubber.value) || 0));
    state = "PAUSED";
    setToggleIcon(false);
    syncAudioWithState();
    renderAtSimTime(simTime);
  });

  window.addEventListener("resize", function () {
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    updateCameraFraming();
    renderAtSimTime(simTime);
  });

  // Initial resting render at simTime = 0.000 BEFORE starting COUNTDOWN on first rAF
  updateCameraFraming();
  setToggleIcon(true);
  elCountdown.style.display = "block";
  elCountdown.textContent = "3";
  scrubber.value = "0";
  renderAtSimTime(0.0);

  function onFrame(nowMs) {
    requestAnimationFrame(onFrame);

    if (state === "INIT") {
      state = "COUNTDOWN";
      countdownElapsed = 0.0;
      lastWallMs = nowMs;
      elCountdown.style.display = "block";
      elCountdown.textContent = "3";
      return;
    }

    const rawDt = lastWallMs === null ? 0 : Math.max(0, (nowMs - lastWallMs) * 0.001);
    lastWallMs = nowMs;
    const dt = Math.min(rawDt, 0.1);

    if (state === "COUNTDOWN") {
      countdownElapsed += dt;
      if (countdownElapsed < 3.0) {
        elCountdown.style.display = "block";
        if (countdownElapsed < 1.0) elCountdown.textContent = "3";
        else if (countdownElapsed < 2.0) elCountdown.textContent = "2";
        else elCountdown.textContent = "1";
        simTime = 0.0;
        scrubber.value = "0";
      } else {
        hideCountdown();
        state = "PLAYING";
        setToggleIcon(true);
        syncAudioWithState();
        const overDt = Math.min(dt, countdownElapsed - 3.0);
        const prevT = 0.0;
        simTime = Math.min(DURATION, overDt * playbackSpeed);
        scrubber.value = simTime.toFixed(3);
        triggerAudioRange(prevT, simTime);
        renderAtSimTime(simTime);
      }
    } else if (state === "REFIRE_HOLD") {
      hideCountdown();
      holdElapsed += dt;
      if (holdElapsed >= 1.0) {
        state = "PLAYING";
        setToggleIcon(true);
        syncAudioWithState();
      }
    } else if (state === "PLAYING") {
      const prevT = simTime;
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      scrubber.value = simTime.toFixed(3);
      triggerAudioRange(prevT, simTime);
      renderAtSimTime(simTime);

      if (simTime >= DURATION) {
        simTime = DURATION;
        scrubber.value = DURATION.toFixed(3);
        state = "ENDED";
        setToggleIcon(false);
        syncAudioWithState();
        renderAtSimTime(DURATION);
      }
    }
  }

  requestAnimationFrame(onFrame);
})();
</script>
</body>
</html>
