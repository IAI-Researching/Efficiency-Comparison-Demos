<body>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

<script id="rampart-strategy">
function createStrategy() {
  // Per-slot roles and build/upgrade priorities selected on independent seed batches.
  const p={
    types: ["cannon", "cannon", "cannon", "cannon", "cannon", "flak", "cannon", "flak", "cannon", "cannon", "flak", "cannon", "cannon", "cannon", "flak", "flak"],
    rank: [[0, 2, 16], [-8, 14, 14], [8, 6, 16], [9, 12, 27], [15, 15, 16], [17, 20, 31], [31, 28, 32], [36, 46, 49], [18, 27, 56], [10, 19, 30], [14, 1, 40], [26, 41, 47], [32, 32, 47], [15, 35, 51], [7, 15, 37], [3, 0, 20]],
    pressure: 1.45, runner: 1.8515, mender: 2.9712, ahead: 3.4003, finish: 1, close: 1.8905};
 const damage = {bolt:[26,41,65],cannon:[60,96,153],flak:[40,64,102],lance:[180,288,460],frost:[10,16,25]};
 const cost={bolt:50,cannon:90,flak:80,lance:120,frost:70};
  // Evaluate a late-game redeployment against the army already on the road.
  // Two-tick integration keeps the look-ahead inexpensive. Unseen waves do
  // not enter the forecast. A spending penalty discourages speculative sales.
  const ground=[[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]];
  const air=[[0,6],[21,6],[21,11],[23,11]];
  function track(points) {
    const xs=[],ys=[];
    for(let i=1;i<points.length;i++){
      const [ax,ay]=points[i-1],[bx,by]=points[i],dx=Math.sign(bx-ax),dy=Math.sign(by-ay);
      const d=100*(Math.abs(bx-ax)+Math.abs(by-ay));
      for(let j=0;j<d;j++){xs.push(100*ax+50+j*dx);ys.push(100*ay+50+j*dy);}
    }
    return {xs,ys,length:xs.length};
  }
  const paths=[track(ground),track(air)];
  const kinds=['grunt','runner','wisp','brute','splitter','mender','splitling'];
  const speed=[10,20,12,6,8,8,12],leak=[1,1,2,3,2,2,1],hp0=[60,40,50,150,90,70];
  const positions=[[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],[14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]];
  const period={cannon:24,flak:10,bolt:8,lance:36,frost:12},range={cannon:260,flak:320,bolt:300,lance:360,frost:240};
  let promised=['grunt','grunt','grunt','grunt'],pending=[],mult=1000;
  function forecast(state,towers,spawns) {
    let army=state.enemies.map(e=>{
      const path=paths[e.air],p=path.length-e.remaining;
      return {k:kinds.indexOf(e.type),p,h:e.hp,max:e.maxHp,armor:e.armor,slow:e.slowed?12:0,age:Math.floor(p/e.speed),path,x:e.x,y:e.y};
    });
    const guns=[];
    for(let i=0;i<towers.length;i++) {
      const t=towers[i];if(!t)continue;
      const [x,y]=positions[i],type=t.type,fly=type==='flak';
      const r=range[type]+(t.tier-1)*30;
      guns.push({x:x*100+50,y:y*100+50,type,ground:type!=='flak',air:type!=='cannon'&&type!=='lance',range:r*r,splash:fly?4900:type==='cannon'?8100:0,
        power:damage[type][t.tier-1],delay:((i*7+state.wave*3)%period[type])&~1,period:period[type]});
    }
    const cand=[],weights=[];let cost=0,base=state.baseHp,si=0;
    for(let step=0;step<172;step+=2) {
      while(si<spawns.length && spawns[si].due<=step){
        const s=spawns[si++];army.push({k:s.k,p:0,h:s.hp,max:s.hp,armor:s.armor,age:0,slow:0,path:paths[+(s.k===2)],x:50,y:0});
      }
      let remove=false;
      for(const e of army){
        e.p+=(e.slow?Math.floor(speed[e.k]*.6):speed[e.k])*2;e.age+=2;e.slow=Math.max(0,e.slow-2);
        if(e.p>=e.path.length){
          base-=leak[e.k];cost+=leak[e.k]*(2-step/172);
          if(base<=0)return 65+(172-step)*.27+cost*.12;
          e.h=0;remove=true;continue;
        }
        e.x=e.path.xs[e.p];e.y=e.path.ys[e.p];
      }
      if(remove)army=army.filter(e=>e.h>0);
      for(const e of army)if(e.k===5 && e.age%20<2)for(const b of army){
        const dx=b.x-e.x,dy=b.y-e.y;
        if(dx*dx+dy*dy<=22500)b.h=Math.min(b.max,b.h+Math.floor(b.max*.08));
      }
      for(const g of guns){
        if(g.delay>0){g.delay-=2;if(g.delay>0)continue;}
        cand.length=0;weights.length=0;
        for(const e of army){
          if(e.k===2?!g.air:!g.ground)continue;
          const dx=e.x-g.x,dy=e.y-g.y;if(dx*dx+dy*dy>g.range)continue;
          cand.push(e);
          const prog=e.p/e.path.length,hit=Math.max(1,g.power-(g.type==='lance'?0:e.armor));
          if(g.type==='frost'){
            weights.push((e.slow ? .06 : 1)*(1+leak[e.k])*(1+3*prog*prog));continue;
          }
          weights.push((.65+.35*Math.min(1,e.h/hit))*(1+p.ahead*prog*prog+
            (e.k===1?p.runner:e.k===5?p.mender:0)+((e.path.length-e.p)/speed[e.k]<70?p.close:0)+p.finish*(1-e.h/e.max)));
        }
        if(!cand.length)continue;
        let best=-Infinity,target=cand[0];
        for(let i=0;i<cand.length;i++){
          const a=cand[i];let value=weights[i];
          if(g.splash)for(let j=0;j<cand.length;j++){
            const b=cand[j],dx=a.x-b.x,dy=a.y-b.y;
            if(i!==j&&dx*dx+dy*dy<=g.splash)value+=weights[j];
          }
          if(value>best){best=value;target=a;}
        }
        let killed=false;const children=[];
        for(const b of army){
          if(b.k===2?!g.air:!g.ground)continue;
          const dx=b.x-target.x,dy=b.y-target.y;
          if(g.splash ? dx*dx+dy*dy>g.splash : b!==target)continue;
          b.h-=Math.max(1,g.power-(g.type==='lance'?0:b.armor));if(g.type==='frost')b.slow=30;
          if(b.h<=0){
            killed=true;
            if(b.k===4)for(let j=0;j<3;j++){
              const h=Math.max(1,Math.floor(b.max/4));children.push({...b,k:6,h,max:h,age:0});
            }
          }
        }
        if(killed)army=army.filter(e=>e.h>0).concat(children);
        g.delay=g.period;
      }
    }
    for(const e of army){
      const eta=(e.path.length-e.p)/speed[e.k];
      cost+=leak[e.k]*Math.exp(-eta/48)*(.18+.82*e.h/e.max);
    }
    return cost;
  }
  function redeploy(state,actionList,tiers,cash){
    if(state.wave>1)mult=Math.floor(mult*108/100);
    pending=pending.filter(e=>e.tick>=state.tick);
    function schedule(list,at,w,m) {
      return list.map((name,i)=>{const k=kinds.indexOf(name);return {k,tick:at+4*i,hp:Math.floor(hp0[k]*m/1000),armor:k===0?Math.floor(w/4):k===3?6+w:0};});
    }
    pending.push(...schedule(promised,state.tick,state.wave,mult));promised=state.nextWave.slice();
    if(state.wave<32)return actionList;
    const spawns=pending.concat(schedule(promised,state.tick+40,state.wave+1,Math.floor(mult*108/100)))
      .map(e=>({...e,due:e.tick-state.tick})).sort((a,b)=>a.due-b.due);
    const towers=state.slots.map((s,i)=>tiers[i]?{type:s.turret?s.turret.type:p.types[i],tier:tiers[i]}:null);
    let bestActions=actionList.slice(),cashLeft=cash;
    let baseline=forecast(state,towers,spawns);
    const changed=new Set();
    for(let move=0;move<2 && baseline>1;move++){
      let best=baseline,choice=null;
      for(let i=0;i<16;i++){
        const old=towers[i];
        if(!old || old.tier<2 || changed.has(i))continue;
        const refund=Math.floor(cost[old.type]*(old.tier===3?4:2)*.7);
        const balance=cashLeft+refund;
        for(const type of ['flak','cannon','lance','frost','bolt']){
          if(type===old.type || balance<cost[type])continue;
          if(type==='flak' && Math.abs(positions[i][1]-6)>3 && positions[i][0]<18)continue;
          const tier=balance>=cost[type]*4?3:balance>=cost[type]*2?2:1;
          towers[i]={type,tier};
          const risk=forecast(state,towers,spawns);
          const penalty=.72+(3-tier)*.35;
          if(risk+penalty<best){
            best=risk+penalty;choice={i,type,tier,risk,cash:balance-cost[type]*(tier===3?4:tier)};
          }
          towers[i]=old;
        }
      }
      if(!choice)break;
      const {i,type,tier,risk}=choice;
      bestActions.push({op:'sell',slot:i},{op:'build',slot:i,type});
      for(let j=1;j<tier;j++)bestActions.push({op:'upgrade',slot:i});
      cashLeft=choice.cash;baseline=risk;changed.add(i);towers[i]={type,tier};
    }
    return bestActions;
  }

 return {
 plan(state) {
   const levels=state.slots.map(s=>s.turret?s.turret.tier:0);
   const airDemand=state.enemies.reduce((n,e)=>n+(e.air?e.hp*(1-e.remaining/2800):0),0);
   const airAdjustment=Math.min(12,airDemand/160)*p.pressure;
   let gold=state.gold, out=[];
   for(let n=0;n<32;n++){
     let best=Infinity,slot=-1;
     for(let i=0;i<16;i++){
       if(levels[i]===3)continue;
       const priority=p.rank[i][levels[i]]-(p.types[i]==='flak'?airAdjustment:0);
       if(priority<best){best=priority;slot=i;}
     }
     if(slot<0)break;
     const type=state.slots[slot].turret?.type || p.types[slot],tier=levels[slot],price=cost[type]*(tier===2?2:1);
     if(price>gold)break;
     out.push(tier?{op:'upgrade',slot}:{op:'build',slot,type});
     gold-=price;levels[slot]++;
   }
   return redeploy(state,out,levels,gold);
 },
 target(t,es){
   const r=t.type==='cannon'?90:t.type==='flak'?70:0;
   const power=damage[t.type][t.tier-1];
   const weights=es.map(e=>{
     if(t.type==='frost'){
       const prog=1-e.remaining/(e.air?2800:4600);
       const loss=e.type==='brute'?3:e.type==='grunt'||e.type==='runner'||e.type==='splitling'?1:2;
       return (e.slowed ? .06 : 1)*(1+loss)*(1+3*prog*prog);
     }
     const hit=Math.max(1,power-(t.type==='lance'?0:e.armor));
     const progress=1-e.remaining/(e.air?2800:4600);
     const priority=1+p.ahead*progress*progress + (e.type==='runner'?p.runner:e.type==='mender'?p.mender:0);
     const urgency=e.remaining/e.speed<70?p.close:0;
     return (0.65+0.35*Math.min(1,e.hp/hit))*(priority+urgency+p.finish*(1-e.hp/e.maxHp));
   });
   let best=-Infinity,id=es[0].id;
   for(let i=0;i<es.length;i++){
     let score=weights[i];
     if(r)for(let j=0;j<es.length;j++){
       if(i===j)continue;
       const dx=es[i].x-es[j].x, dy=es[i].y-es[j].y;
       if(dx*dx+dy*dy<=r*r)score+=weights[j];
     }
     if(score>best){best=score;id=es[i].id;}
   }
   return id;
 }
 };
}
</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks) {
  function mulberry32(a) { return function () {
    a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return (t ^ (t >>> 14)) >>> 0; }; }
  const random = mulberry32(seed), strategy = createStrategy(), floor = Math.floor;
  const route = [[[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]],
                 [[0,6],[21,6],[21,11],[23,11]]];
  // Sum each waypoint segment. The published reference vectors include the
  // final 200-centi-tile horizontal approach of the air route.
  const lengths = route.map(points => points.slice(1).reduce((sum,[x,y],i) =>
    sum + 100*(Math.abs(x-points[i][0])+Math.abs(y-points[i][1])),0));
  const coords = [[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],
    [14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]];
  const slots = coords.map(([x,y],slot) => ({slot,x:x*100+50,y:y*100+50,turret:null}));
  const names = ['grunt','runner','wisp','brute','splitter','mender','splitling'];
  const hp = [60,40,50,150,90,70,1], speeds = [10,20,12,6,8,8,12];
  const bounties = [4,4,6,9,6,7,1], leak = [1,1,2,3,2,2,1];
  const first = [1,2,3,4,6,8], weight = [10,4,3,3,2,1];
  const types = ['bolt','cannon','frost','lance','flak'];
  const costs = [50,90,70,120,80], damages = [26,60,10,180,40];
  const periods = [8,24,12,36,10], ranges = [300,260,240,360,320], radii = [0,90,0,0,70];
  const record = rampartSimulate.record;
  const log = [], living = [], queue = new Map(), multipliers = [0,1000];
  let tick = 0, wave = 0, gold = 250, baseHp = 10, fallTick = -1, serial = 0;
  let events = [], nextWave = composition(1);
  function composition(w) {
    let total = 0;
    for (let j=0;j<6;j++) if (first[j]<=w) total += weight[j];
    return Array.from({length:4+floor(3*w/5)}, () => {
      let r = random()%total, j = 0;
      while (r >= weight[j]) r -= weight[j++];
      return j;
    });
  }
  function effect(kind,x,y,info={}) {
    if (record) events.push({kind,x:x/100,z:y/100,...info});
  }
  function position(e) {
    const points = route[e.air];
    let d = e.progress;
    for (let i=1;i<points.length;i++) {
      const [x,y]=points[i-1], dx=points[i][0]-x, dy=points[i][1]-y;
      const l=(Math.abs(dx)+Math.abs(dy))*100;
      if (d<=l || i===points.length-1) {
        e.x=x*100+50+Math.sign(dx)*Math.min(l,d);
        e.y=y*100+50+Math.sign(dy)*Math.min(l,d);
        e.dx=Math.sign(dx); e.dy=Math.sign(dy);
        return;
      }
      d-=l;
    }
  }
  function spawn(kind,w,progress=0,childHp=0) {
    const maxHp=childHp || floor(hp[kind]*multipliers[w]/1000);
    const e={id:++serial,kind,w,progress,air:+(kind===2),hp:maxHp,maxHp,
      armor:kind===0?floor(w/4):kind===3?6+w:0,age:0,slow:0};
    position(e); living.push(e);
  }
  function view(e) {
    return {id:e.id,type:names[e.kind],hp:e.hp,maxHp:e.maxHp,x:e.x,y:e.y,
      air:e.air,armor:e.armor,speed:speeds[e.kind],slowed:e.slow,remaining:lengths[e.air]-e.progress};
  }
  function slotView(s) {
    const t=s.turret;
    return {slot:s.slot,x:s.x,y:s.y,turret:t?{type:types[t.kind],tier:t.tier,spent:t.spent}:null};
  }
  function snapshot() {

    transition('PAUSED');simTime=clamp(parseFloat(scrubber.value),0,DURATION);draw(simTime);
  });
  function resize(){
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    frameCamera();draw(simTime);
  }
  window.addEventListener('resize',resize);
  countdown.style.display='block';frameCamera();draw(0);
  function animate(wall) {
    const dt=previousWall===null?0:clamp((wall-previousWall)/1000,0,.1);previousWall=wall;
    if(state==='COUNTDOWN'){
      countdownElapsed+=dt;
      if(countdownElapsed>=3)transition('PLAYING');
      else countdown.textContent=String(3-Math.floor(countdownElapsed));
    }else if(state==='REFIRE_HOLD'){
      holdElapsed+=dt;
      if(holdElapsed>=1)transition('PLAYING');
    }
    if(state==='PLAYING'){
      const from=simTime;simTime=Math.min(DURATION,simTime+dt*playbackSpeed);
      soundEvents(from,simTime);scrubber.value=simTime.toFixed(3);draw(simTime);
      if(simTime>=DURATION)transition('ENDED');
    }
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
