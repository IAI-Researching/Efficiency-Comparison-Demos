<script id="rampart-strategy">
function createStrategy() {
  var P = {"types":["lance","cannon","cannon","cannon","cannon","flak","cannon","cannon","frost","cannon","flak","cannon","flak","cannon","bolt","flak"],"order":[4,15,7,9,1,3,3,12,10,4,8,1,14,11,2,0,0,6,4,3,2,9,12,1,5,14,0,2,7,11,6,5,9,14,10,15,6,15,7,5,8,10,13,11,12,13,13,8],"urg":236.667,"killB":0.495,"mendW":4.303,"urgW":4.05,"frostTh":9.625,"frostRun":202.343,"frostSpl":1969.332,"lanceArm":2.115,"boltAir":1.374,"runW":2.251,"resMax":600,"resSlope":30,"resEnd":33.329,"dangerRem":1488.165,"airK":737.176,"lanceRun":1.333};

    var acts = [], gold = s.gold, tiers = [], i, w = s.wave, e;
    for (i = 0; i < 16; i++) tiers.push(s.slots[i].turret ? s.slots[i].turret.tier : 0);

    var res = w >= P.resEnd ? 0 : Math.min(P.resMax, P.resSlope * w);
    var airHp = 0;
    for (i = 0; i < s.enemies.length; i++) {
      e = s.enemies[i];
      if (e.air) { airHp += e.hp; if (e.remaining < P.dangerRem * 0.565) res = 0; }
      else if (e.remaining < P.dangerRem) res = 0;
    }
    var nw = 0, nn = 0;
    for (i = 0; i < curWave.length; i++) if (curWave[i] === 'wisp') nw++;
    for (i = 0; i < s.nextWave.length; i++) if (s.nextWave[i] === 'wisp') nn++;
    airHp += nw * Math.floor(50 * mOf(w) / 1000) + nn * Math.floor(50 * mOf(w + 1) / 1000);
    var guard = 0;
    while (acts.length < 32 && guard++ < 100) {
      var airCap = 0;
      for (i = 0; i < 16; i++) if (tiers[i] > 0) {
        var ty0 = TYPES[i];
        if (ty0 === 'flak') airCap += DMG.flak[tiers[i] - 1] / 10; else if (ty0 === 'bolt') airCap += DMG.bolt[tiers[i] - 1] / 16;

      var needAir = airHp > P.airK * airCap, pick = -1, first = -1;
      for (i = 0; i < ORDER.length; i++) {
        if (done[i]) continue;
        if (tiers[ORDER[i]] >= 3) { done[i] = true; continue; }
        if (first < 0) first = i;
        if (!needAir) break;
        if (TYPES[ORDER[i]] === 'flak') { pick = i; break; }
      }
      if (pick < 0) pick = first;
      if (pick < 0) break;
      var sl = ORDER[pick], ty = TYPES[sl], t = tiers[sl];
      var c = t === 0 ? COST[ty] : COST[ty] * t;
      if (gold - c < res) break;
      gold -= c; tiers[sl] = t + 1; done[pick] = true;
      acts.push(t === 0 ? { op: 'build', slot: sl, type: ty } : { op: 'upgrade', slot: sl });
    }
    curWave = s.nextWave.slice();
    return acts;
  }
  function target(tu, c) {
    var n = c.length;
    if (n === 1) return c[0].id;
    var d = DMG[tu.type][tu.tier - 1], best = -1, bs = -1e18, i, j, e, sc, URG = P.urg;
    if (tu.type === 'cannon' || tu.type === 'flak') {
      var r2 = tu.type === 'cannon' ? 8100 : 4900, val = [];
      for (j = 0; j < n; j++) {
        var o = c[j], ef = d - o.armor; if (ef < 1) ef = 1;
        var v = ef < o.hp ? ef : o.hp + P.killB * ef;
        if (o.type === 'mender') v *= P.mendW; else if (o.type === 'runner') v *= P.runW;
        if (o.remaining * 10 < URG * SPD[o.type]) v *= P.urgW;
        val.push(v);

      for (i = 0; i < n; i++) {
        e = c[i]; sc = 0;

          var dx = c[j].x - e.x, dy = c[j].y - e.y;
          if (dx * dx + dy * dy <= r2) sc += val[j];

        if (sc > bs) { bs = sc; best = e.id; }

        if (sc > bs) { bs = sc; best = e.id; }

      return best;
    }
    for (i = 0; i < n; i++) {
      e = c[i];
      var ef2 = tu.type === 'lance' ? d : (d - e.armor < 1 ? 1 : d - e.armor);
      var v2 = ef2 < e.hp ? ef2 : e.hp + P.killB * ef2;
      if (tu.type === 'lance') v2 += e.armor * P.lanceArm;
      if (e.type === 'mender') v2 *= P.mendW; else if (e.type === 'runner') v2 *= (tu.type === 'lance' ? P.lanceRun : P.runW);
      if (tu.type === 'bolt' && e.air) v2 *= P.boltAir;
      if (e.remaining * 10 < URG * SPD[e.type]) v2 *= P.urgW;
      sc = v2 * 10000 - e.remaining;
      if (sc > bs) { bs = sc; best = e.id; }
    }
    return best;
  }
  return {
    plan: function (s) { try { return plan(s); } catch (err) { return []; } },
    target: function (tu, c) { try { return target(tu, c); } catch (err) { return undefined; } }
  };
}

<script id="rampart-sim">

  var TT = {
    bolt:   { i: 0, cost: 50,  dmg: 26,  period: 8,  range: 300, splash: 0,  slow: 0,  pierce: false, g: true,  a: true },
    cannon: { i: 1, cost: 90,  dmg: 60,  period: 24, range: 260, splash: 90, slow: 0,  pierce: false, g: true,  a: false },
    frost:  { i: 2, cost: 70,  dmg: 10,  period: 12, range: 240, splash: 0,  slow: 30, pierce: false, g: true,  a: true },
    lance:  { i: 3, cost: 120, dmg: 180, period: 36, range: 360, splash: 0,  slow: 0,  pierce: true,  g: true,  a: false },
    flak:   { i: 4, cost: 80,  dmg: 40,  period: 10, range: 320, splash: 70, slow: 0,  pierce: false, g: false, a: true }
  };
  var ET = {
    grunt:     { hp: 60,  speed: 10, bounty: 4, leak: 1, air: 0, first: 1, weight: 10 },
    runner:    { hp: 40,  speed: 20, bounty: 4, leak: 1, air: 0, first: 2, weight: 4 },
    wisp:      { hp: 50,  speed: 12, bounty: 6, leak: 2, air: 1, first: 3, weight: 3 },
    brute:     { hp: 150, speed: 6,  bounty: 9, leak: 3, air: 0, first: 4, weight: 3 },
    splitter:  { hp: 90,  speed: 8,  bounty: 6, leak: 2, air: 0, first: 6, weight: 2 },
    mender:    { hp: 70,  speed: 8,  bounty: 7, leak: 2, air: 0, first: 8, weight: 1 },
    splitling: { hp: 0,   speed: 12, bounty: 1, leak: 1, air: 0, first: 9999, weight: 0 }

  var SLOTS = [[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],[14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]];
  function mkRoute(pts) {
    var p = [], cum = [0], i;
    for (i = 0; i < pts.length; i++) p.push([pts[i][0] * 100 + 50, pts[i][1] * 100 + 50]);
    for (i = 1; i < p.length; i++) cum.push(cum[i - 1] + Math.abs(p[i][0] - p[i - 1][0]) + Math.abs(p[i][1] - p[i - 1][1]));

    mkRoute([[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]]),
    mkRoute([[0,6],[21,6],[21,11],[23,11]])

        var a = r.p[i - 1], b = r.p[i], o = d - r.cum[i - 1];
        e.x = a[0] + (b[0] > a[0] ? o : b[0] < a[0] ? -o : 0);

            if (!cur) continue;

            if (hook) hook('S', tick, sl, cur.type);

      debris(77777, 90, KEEP[0], 0.7, KEEP[1], 2.6, 5.5, 0.2, fAge, 1, STONE, true);
      if (fAge < 1) {
        var sv2 = fAge, sf = 1 - sv2;
        ring(KEEP[0], 0.1, KEEP[1], 0.5 + 8 * Math.sqrt(sv2), 2.6 * sf, 1.4 * sf, 0.5 * sf);
        ring(KEEP[0], 0.12, KEEP[1], 0.3 + 5.5 * Math.sqrt(sv2), 1.6 * sf, 0.5 * sf, 0.2 * sf);
        if (fAge < 0.3) spark(KEEP[0], 0.8, KEEP[1], 1.8 * (1 - fAge / 0.3) + 0.3, 2.5, 1.5, 0.6);
      }
    }
    var gs = fAge >= 0 ? Math.min(1, fAge) * 0.93 : 0;
    var filt = gs > 0 ? 'grayscale(' + gs.toFixed(3) + ') brightness(' + (1 - 0.12 * gs).toFixed(3) + ')' : '';
    if (canvas.style.filter !== filt) canvas.style.filter = filt;
    laneMat.opacity = 0.36 + 0.1 * Math.sin(animT * 2.2);

    for (i = 0; i < 7; i++) enemyPools[i].end();
    ringPool.end(); haloPool.end(); beamPool.end(); sparkPool.end(); shadowPool.end(); debrisPool.end(); barBg.end(); barFg.end();

    drawHud(simTime, A);
    renderer.clear();
    renderer.render(scene, camera);
    renderer.clearDepth();
    renderer.render(hudScene, hudCam);
    lastShown = simTime;
  }

  function onResize() {
    var W = window.innerWidth, H = window.innerHeight;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(W, H, false);
    fitCamera();
    hudCam.left = 0; hudCam.right = W; hudCam.top = H; hudCam.bottom = 0; hudCam.updateProjectionMatrix();
  }
  window.addEventListener('resize', function () { onResize(); renderAt(simTime); });

  /* ---------- audio (synthesised, follows playback state) ---------- */
  var AC = window.AudioContext || window.webkitAudioContext, actx = null, master = null, comp = null, noiseBuf = null, windGain = null;
  var live = [], audible = false, arand = mulb(4242), shotTimes = [], popTimes = [];
  function tryResume() { if (actx && actx.state !== 'running') { try { var pr = actx.resume(); if (pr && pr.catch) pr.catch(function () {}); } catch (e) {} } }
  try {
    actx = new AC();
    tryResume();
    master = actx.createGain(); master.gain.value = 0;
    comp = actx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 8; comp.attack.value = 0.003; comp.release.value = 0.15;
    var outG = actx.createGain(); outG.gain.value = 0.7;
    master.connect(comp); comp.connect(outG); outG.connect(actx.destination);
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
    var nd = noiseBuf.getChannelData(0);
    for (i0 = 0; i0 < nd.length; i0++) nd[i0] = arand() * 2 - 1;
    // persistent low wind bed (only audible after the fall while PLAYING)
    var wsrc = actx.createBufferSource(); wsrc.buffer = noiseBuf; wsrc.loop = true;
    var wf = actx.createBiquadFilter(); wf.type = 'bandpass'; wf.frequency.value = 260; wf.Q.value = 0.7;
    var wl = actx.createOscillator(), wlg = actx.createGain(); wl.frequency.value = 0.23; wlg.gain.value = 90;
    wl.connect(wlg); wlg.connect(wf.frequency);
    windGain = actx.createGain(); windGain.gain.value = 0;
    wsrc.connect(wf); wf.connect(windGain); windGain.connect(master);
    wsrc.start(); wl.start();
  } catch (err2) { actx = null; }
  window.addEventListener('pointerdown', tryResume, true);
  window.addEventListener('keydown', tryResume, true);
  function setAudible(on) {
    if (!actx || on === audible) return;
    audible = on;
    var now = actx.currentTime;
    master.gain.cancelScheduledValues(now);
    master.gain.setTargetAtTime(on ? 0.9 : 0, now, 0.011);
    if (!on) {
      for (var i = 0; i < live.length; i++) { try { live[i].stop(now + 0.05); } catch (e) {} }
      live.length = 0;
      windGain.gain.cancelScheduledValues(now); windGain.gain.setTargetAtTime(0, now, 0.011);
    }
  }
  function track(src, stopAt) {
    live.push(src);
    src.onended = function () { var ix = live.indexOf(src); if (ix >= 0) live.splice(ix, 1); };
    src.stop(stopAt);
  }
  function outChain(vol, pan, t0, dur, attack) {
    var g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + (attack || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    if (actx.createStereoPanner) { var pn = actx.createStereoPanner(); pn.pan.value = Math.max(-1, Math.min(1, pan)); g.connect(pn); pn.connect(master); }
    else g.connect(master);
    return g;
  }
  function tone(type, f0, f1, dur, vol, pan, delay, attack) {
    var t0 = actx.currentTime + (delay || 0), o = actx.createOscillator();
    o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
    o.connect(outChain(vol, pan, t0, dur, attack)); o.start(t0); track(o, t0 + dur + 0.02);
  }
  function burst(ftype, f0, f1, q, dur, vol, pan, delay, attack) {
    var t0 = actx.currentTime + (delay || 0), s = actx.createBufferSource(), f = actx.createBiquadFilter();
    s.buffer = noiseBuf; f.type = ftype; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t0); f.frequency.exponentialRampToValueAtTime(Math.max(10, f1), t0 + dur);
    s.connect(f); f.connect(outChain(vol, pan, t0, dur, attack));
    s.start(t0, arand() * 1.2); track(s, t0 + dur + 0.02);
  }
  function panOf(x) { return (x / 24 * 2 - 1) * 0.8; }
  var SHOT_PRI = [4, 1, 3, 0, 2];
  function shotSound(ty, pan) {
    var v = 0.94 + arand() * 0.12;
    if (ty === 0) tone('square', 1250 * v, 420, 0.05, 0.10, pan);
    else if (ty === 1) { tone('sine', 150 * v, 42, 0.26, 0.5, pan); burst('lowpass', 900, 200, 0.7, 0.16, 0.3, pan); }
    else if (ty === 2) { tone('sine', 1900 * v, 2900, 0.12, 0.09, pan); burst('highpass', 5000, 7000, 0.7, 0.1, 0.07, pan); }
    else if (ty === 3) { tone('sawtooth', 240 * v, 1500, 0.2, 0.2, pan); tone('sine', 90, 50, 0.22, 0.3, pan); }
    else { burst('bandpass', 1700 * v, 700, 1.4, 0.11, 0.3, pan); tone('triangle', 520 * v, 180, 0.08, 0.14, pan); }
  }
  function audioEvents(prev, cur) {
    if (!actx || !audible) return;
    var k0 = Math.floor(prev * TPS), k1 = Math.min(NT, Math.floor(cur * TPS)), q, now = actx.currentTime;
    if (k1 <= k0) return;
    if (k1 - k0 > 8) k0 = k1 - 8;
    var a = shotIdx[k0 + 1], b = shotIdx[k1 + 1], cand = [], seen = {};
    for (q = a; q < b; q++) { var s = shots[q]; if (!seen[s.ty]) { seen[s.ty] = 1; cand.push(s); } }
    cand.sort(function (x, y) { return SHOT_PRI[x.ty] - SHOT_PRI[y.ty]; });
    while (shotTimes.length && shotTimes[0] < now - 1) shotTimes.shift();
    for (q = 0; q < cand.length && shotTimes.length < 12; q++) { shotSound(cand[q].ty, panOf(SLOTS[cand[q].slot][0] + 0.5)); shotTimes.push(now); }
    while (popTimes.length && popTimes[0] < now - 1) popTimes.shift();
    for (q = killIdx[k0 + 1]; q < killIdx[k1 + 1] && popTimes.length < 8; q++) { tone('sine', 520 + arand() * 240, 210, 0.07, 0.11, panOf(kills[q].x)); popTimes.push(now); }
    for (q = 0; q < waveStarts.length; q++) {
      var wt = waveStarts[q].tick;
      if (wt > k0 && wt <= k1) { tone('sawtooth', 98, 147, 0.7, 0.16, -0.6, 0, 0.08); tone('sawtooth', 147.5, 221, 0.7, 0.1, -0.6, 0, 0.08); tone('triangle', 196, 294, 0.7, 0.12, -0.6, 0.02, 0.1); }
    }
    for (q = leakIdx[k0 + 1]; q < leakIdx[k1 + 1]; q++) {
      burst('lowpass', 2600, 300, 0.8, 0.22, 0.5, 0.75); burst('bandpass', 900, 500, 3, 0.09, 0.3, 0.75, 0.05);
      tone('square', 880, 880, 0.11, 0.12, 0.6, 0.02); tone('square', 660, 660, 0.14, 0.12, 0.6, 0.14);
    }
    if (fallTick > k0 && fallTick <= k1) {
      tone('sine', 70, 22, 2.2, 0.9, 0.6, 0, 0.02); tone('triangle', 110, 30, 1.2, 0.4, 0.5);
      burst('lowpass', 500, 60, 0.6, 3.0, 0.8, 0.5, 0, 0.03); burst('lowpass', 3000, 200, 0.7, 0.5, 0.6, 0.7);
    }
    var wantWind = cur >= fallTime ? 0.22 * Math.min(1, (cur - fallTime) / 1.5) : 0;
    windGain.gain.setTargetAtTime(wantWind, now, 0.1);
  }

  /* ---------- playback state machine ---------- */
  var COUNTDOWN = 0, PLAYING = 1, PAUSED = 2, REFIRE_HOLD = 3, ENDED = 4;
  var state = COUNTDOWN, simTime = 0, playbackSpeed = 1.0, countdownElapsed = 0, holdElapsed = 0, lastNow = null;
  var elCount = document.getElementById('countdown'), elScrub = document.getElementById('scrubber');
  var elToggle = document.getElementById('btn-toggle'), elRefire = document.getElementById('btn-refire');
  var icoPause = document.getElementById('icon-pause'), icoPlay = document.getElementById('icon-play');
  var pills = document.querySelectorAll('.speed-pill');
  function setIcons(playing) {
    icoPause.style.display = playing ? '' : 'none';
    icoPlay.style.display = playing ? 'none' : '';
    elToggle.setAttribute('aria-label', playing ? 'Pause' : 'Play');
  }
  function hideCountdown() { elCount.style.display = 'none'; elCount.textContent = ''; }
  function showCountdown(n) { var s = String(n); if (elCount.textContent !== s) elCount.textContent = s; if (elCount.style.display !== 'block') elCount.style.display = 'block'; }
  function setState(s) { state = s; setAudible(s === PLAYING); }
  elToggle.addEventListener('click', function () {
    if (state === PLAYING) { setState(PAUSED); setIcons(false); }
    else if (state === COUNTDOWN || state === REFIRE_HOLD) { hideCountdown(); simTime = 0; elScrub.value = '0'; setState(PAUSED); setIcons(false); }
    else if (state === PAUSED) { setState(PLAYING); setIcons(true); }
    else if (state === ENDED) { hideCountdown(); simTime = 0; elScrub.value = '0'; setState(PLAYING); setIcons(true); }
    renderAt(simTime);
  });
  for (i0 = 0; i0 < pills.length; i0++) (function (pill) {
    pill.addEventListener('click', function () {
      playbackSpeed = parseFloat(pill.getAttribute('data-speed'));
      for (var k = 0; k < pills.length; k++) {
        var on = pills[k] === pill;
        pills[k].classList.toggle('is-active', on);
        pills[k].setAttribute('aria-checked', on ? 'true' : 'false');
      }
    });
  })(pills[i0]);
  elScrub.addEventListener('input', function () {
    hideCountdown();
    var v = parseFloat(elScrub.value);
    simTime = isFinite(v) ? Math.max(0, Math.min(DURATION, v)) : 0;
    setState(PAUSED); setIcons(false);
    renderAt(simTime);
  });
  elRefire.addEventListener('click', function () {
    hideCountdown();
    simTime = 0; elScrub.value = '0';
    countdownElapsed = 0; holdElapsed = 0;
    setIcons(true);
    setState(REFIRE_HOLD);
    renderAt(0);
  });
  var fpsAcc = 0, fpsN = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (lastNow === null) lastNow = now;
    var rawDt = (now - lastNow) / 1000; lastNow = now;
    var dt = Math.min(Math.max(rawDt, 0), 0.1);
    if (state === COUNTDOWN) {
      countdownElapsed += dt;
      if (countdownElapsed >= 3) { hideCountdown(); setState(PLAYING); setIcons(true); }
      else showCountdown(3 - Math.floor(countdownElapsed));
    } else if (state === REFIRE_HOLD) {
      holdElapsed += dt;
      if (holdElapsed >= 1) { setState(PLAYING); setIcons(true); }
    } else if (state === PLAYING) {
      var prev = simTime;
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      elScrub.value = simTime.toFixed(3);
      audioEvents(prev, simTime);
      if (simTime >= DURATION) { simTime = DURATION; elScrub.value = DURATION.toFixed(3); setState(ENDED); setIcons(false); }
      if (rawDt > 0) { fpsAcc += rawDt; fpsN++; if (fpsAcc >= 2) { window.__fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; } }
    }
    renderAt(simTime);
  }
  onResize();
  simTime = 0; elScrub.value = '0';
  showCountdown(3);
  renderAt(0);
  requestAnimationFrame(frame);
})();
</script>
