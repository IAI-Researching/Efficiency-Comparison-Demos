<script id="rampart-strategy">
function createStrategy() {
  var CFG = {"steps":[[4,1],[0,0],[6,1],[11,0],[6,1],[14,0],[2,1],[12,4],[9,1],[12,4],[3,1],[15,1],[0,0],[5,4],[15,1],[2,1],[1,1],[3,1],[0,0],[14,0],[1,1],[8,1],[4,1],[10,4],[15,1],[13,1],[10,4],[2,1],[1,1],[4,1],[9,1],[7,4],[10,4],[6,1],[7,4],[13,1],[8,1],[12,4],[3,1],[9,1],[14,0],[5,4],[11,0],[7,4],[8,1],[11,0],[5,4],[13,1]],"w":[[-2,0,-0.5,2,8,4,0.25,-2],[0.5,8,0.25,4,0,2,-1,-0.5],[0.5,1,0.25,0,0.1,0.5,-1,0.25],[0.5,4,4,0,0.5,2,-2,-2],[0.5,8,0.25,1,0.25,0,0.25,1]],"look":3,"late":[[0,0],[11,4],[6,1],[2,2],[10,1],[4,4]],"bank":200,"bankUntil":38};
  var TYPES = ['bolt', 'cannon', 'frost', 'lance', 'flak'];
  var COST = [50, 90, 70, 120, 80];
  var DMG = { bolt: [26, 41, 65], cannon: [60, 96, 153], frost: [10, 16, 25], lance: [180, 288, 460], flak: [40, 64, 102] };
  var SPL = { bolt: 0, cannon: 90, frost: 0, lance: 0, flak: 70 };
  var TI = { bolt: 0, cannon: 1, frost: 2, lance: 3, flak: 4 };
  var W = CFG.w;
  function plan(state) {
    var gold = state.gold, acts = [], tiers = [], types = [], need = [], i;
    var bank = (CFG.bank && state.wave < CFG.bankUntil) ? CFG.bank : 0;
    gold -= bank;
    for (i = 0; i < 16; i++) {
      var t = state.slots[i] && state.slots[i].turret;
      tiers.push(t ? t.tier : 0); types.push(t ? t.type : null); need.push(0);
    }
    var steps = CFG.steps, skipped = 0;
    for (i = 0; i < steps.length && acts.length < 32; i++) {
      var s = steps[i][0], ty = steps[i][1];
      need[s]++;
      if (tiers[s] >= need[s]) continue;
      if (tiers[s] > 0 && types[s] !== TYPES[ty]) continue;
      var cost = tiers[s] === 2 ? 2 * COST[ty] : COST[ty];
      if (gold < cost) { skipped++; if (skipped > CFG.look) break; need[s] = 99; continue; }
      gold -= cost;
      if (tiers[s] === 0) { acts.push({ op: 'build', slot: s, type: TYPES[ty] }); types[s] = TYPES[ty]; }
      else acts.push({ op: 'upgrade', slot: s });
      tiers[s]++;
    }
    if (skipped === 0 && CFG.late) {
      for (i = 0; i < CFG.late.length && acts.length < 28; i++) {
        var ls = CFG.late[i][0], lt = CFG.late[i][1];
        if (ls < 0 || tiers[ls] !== 3 || types[ls] === TYPES[lt]) continue;
        var spent = state.slots[ls].turret ? state.slots[ls].turret.spent : 0;
        var needG = 4 * COST[lt] - Math.floor(spent * 70 / 100);
        if (gold < needG) break;
        gold -= needG; types[ls] = TYPES[lt];
        acts.push({ op: 'sell', slot: ls }); acts.push({ op: 'build', slot: ls, type: TYPES[lt] });
        acts.push({ op: 'upgrade', slot: ls }); acts.push({ op: 'upgrade', slot: ls });
      }
    }
    return acts;
  }
  function target(t, c) {
    var n = c.length;
    if (n === 1) return c[0].id;
    var type = t.type, w = W[TI[type]], dmg = DMG[type][t.tier - 1], sp = SPL[type], sp2 = sp * sp;
    var best = -1e18, bid = c[0].id, i, j;
    var pierce = type === 'lance';
    for (i = 0; i < n; i++) {
      var e = c[i], sc = 0;
      var ed = pierce ? dmg : dmg - e.armor; if (ed < 1) ed = 1;
      var kill = e.hp <= ed ? 1 : 0;
      if (ed > e.hp) ed = e.hp;
      if (sp) {
        var tot = 0, kills = 0;
        for (j = 0; j < n; j++) {
          var o = c[j], dx = o.x - e.x, dy = o.y - e.y;
          if (dx * dx + dy * dy <= sp2) {
            var d2 = dmg - o.armor; if (d2 < 1) d2 = 1;
            if (o.hp <= d2) { d2 = o.hp; kills++; }
            tot += d2;
          }
        }
        sc = w[0] * tot / dmg + w[4] * kills;
      } else {
        sc = w[0] * ed / dmg + w[4] * kill;
      }
      sc += w[1] * (1 - e.remaining / 4600);
      if (e.air) sc += w[2];
      if (e.type === 'mender') sc += w[3];
      if (!e.slowed) sc += w[5];
      if (e.type === 'brute') sc += w[6];
      sc += w[7] * e.hp / e.maxHp;
      if (sc > best) { best = sc; bid = e.id; }
    }
    return bid;
  }
  return { plan: plan, target: target };
}
</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks, rec) {
  function mulberry32(a) { return function () {
    a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return (t ^ (t >>> 14)) >>> 0; }; }
  const TT = {
    bolt:   { i: 0, cost: 50,  dmg: 26,  per: 8,  range: 300, splash: 0,  slow: 0,  pierce: 0, g: 1, a: 1 },
    cannon: { i: 1, cost: 90,  dmg: 60,  per: 24, range: 260, splash: 90, slow: 0,  pierce: 0, g: 1, a: 0 },
    frost:  { i: 2, cost: 70,  dmg: 10,  per: 12, range: 240, splash: 0,  slow: 30, pierce: 0, g: 1, a: 1 },
    lance:  { i: 3, cost: 120, dmg: 180, per: 36, range: 360, splash: 0,  slow: 0,  pierce: 1, g: 1, a: 0 },
    flak:   { i: 4, cost: 80,  dmg: 40,  per: 10, range: 320, splash: 70, slow: 0,  pierce: 0, g: 0, a: 1 }
  };
  const ET = {
    grunt:     { hp: 60,  speed: 10, bounty: 4, leak: 1, air: 0, first: 1, weight: 10 },
    runner:    { hp: 40,  speed: 20, bounty: 4, leak: 1, air: 0, first: 2, weight: 4 },
    wisp:      { hp: 50,  speed: 12, bounty: 6, leak: 2, air: 1, first: 3, weight: 3 },
    brute:     { hp: 150, speed: 6,  bounty: 9, leak: 3, air: 0, first: 4, weight: 3 },
    splitter:  { hp: 90,  speed: 8,  bounty: 6, leak: 2, air: 0, first: 6, weight: 2 },
    mender:    { hp: 70,  speed: 8,  bounty: 7, leak: 2, air: 0, first: 8, weight: 1 },
    splitling: { hp: 0,   speed: 12, bounty: 1, leak: 1, air: 0, first: 0, weight: 0 }
  };
  const ORDER = ['grunt', 'runner', 'wisp', 'brute', 'splitter', 'mender'];
  const GP = [[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]];
  const AP = [[0,6],[21,6],[21,11],[23,11]];
  const GLEN = 4600, ALEN = 2800;
  const SLOTS = [[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],[14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]];
  function setPos(e) {
    const P = e.air ? AP : GP; let d = e.progress;
    for (let i = 0; i < P.length - 1; i++) {
      const ax = P[i][0], ay = P[i][1], bx = P[i + 1][0], by = P[i + 1][1];
      const L = (Math.abs(bx - ax) + Math.abs(by - ay)) * 100;
      if (d <= L || i === P.length - 2) {
        if (d > L) d = L;
        e.x = ax * 100 + 50 + (bx > ax ? d : bx < ax ? -d : 0);
        e.y = ay * 100 + 50 + (by > ay ? d : by < ay ? -d : 0);
        return;
      }
      d -= L;
    }
  }
  function view(e) {
    return { id: e.id, type: e.type, hp: e.hp, maxHp: e.maxHp, x: e.x, y: e.y, air: e.air, armor: e.armor,
      speed: e.speed, slowed: e.slow > 0 ? 1 : 0, remaining: e.len - e.progress };
  }
  const strat = createStrategy();
  const rng = mulberry32(seed);
  const log = [];
  let gold = 250, baseHp = 10, nextId = 1, wave = 0, fallTick = -1;
  const turrets = []; for (let i = 0; i < 16; i++) turrets.push(null);
  let enemies = [];
  let queue = [], qHead = 0;
  const waves = {};
  const mults = [0, 1000];
  function mOf(w) { while (mults.length <= w) mults.push(Math.floor(mults[mults.length - 1] * 108 / 100)); return mults[w]; }
  function genWave(w) {
    const types = []; let sum = 0;
    for (const t of ORDER) if (ET[t].first <= w) { types.push(t); sum += ET[t].weight; }
    const n = 4 + Math.floor(3 * w / 5), out = [];
    for (let i = 0; i < n; i++) {
      let r = rng() % sum;
      for (const t of types) { if (r < ET[t].weight) { out.push(t); break; } r -= ET[t].weight; }
    }
    waves[w] = out;
  }
  function mkEnemy(type, w, maxHp, progress) {
    const T = ET[type];
    const e = { id: nextId++, type: type, wave: w, hp: maxHp, maxHp: maxHp, progress: progress, air: T.air,
      len: T.air ? ALEN : GLEN, speed: T.speed, bounty: T.bounty, leak: T.leak, age: 0, slow: 0, x: 0, y: 0,
      armor: type === 'grunt' ? Math.floor(w / 4) : type === 'brute' ? 6 + w : 0 };
    setPos(e); return e;
  }
  genWave(1);
  let fell = false;
  for (let tick = 0; tick < maxTicks && !fell; tick++) {
    // 1. wave start
    if (tick >= 20 && (tick - 20) % 40 === 0) {
      wave = (tick - 20) / 40 + 1;
      gold += Math.min(50, Math.floor(gold * 5 / 100)) + 10 + 2 * wave;
      genWave(wave + 1);
      const state = { tick: tick, wave: wave, gold: gold, baseHp: baseHp, slots: [], enemies: enemies.map(view),
        nextWave: waves[wave + 1].slice() };
      for (let i = 0; i < 16; i++) {
        const t = turrets[i];
        state.slots.push({ slot: i, x: SLOTS[i][0] * 100 + 50, y: SLOTS[i][1] * 100 + 50,
          turret: t ? { type: t.type, tier: t.tier, spent: t.spent } : null });
      }
      let acts = strat.plan(state);
      if (!Array.isArray(acts)) acts = [];
      const na = Math.min(32, acts.length);
      for (let k = 0; k < na; k++) {
        const a = acts[k]; if (!a || typeof a !== 'object') continue;
        const s = a.slot;
        if (!Number.isInteger(s) || s < 0 || s > 15) continue;
        if (a.op === 'build') {
          const T = Object.prototype.hasOwnProperty.call(TT, a.type) ? TT[a.type] : null;
          if (!T || turrets[s] || gold < T.cost) continue;
          gold -= T.cost;
          turrets[s] = { slot: s, type: a.type, T: T, tier: 1, spent: T.cost, cd: 0, dmg: T.dmg, range: T.range,
            x: SLOTS[s][0] * 100 + 50, y: SLOTS[s][1] * 100 + 50 };
          log.push([tick, 'B', s, T.i]);
          if (rec) rec.ev(tick, 'B', s, T.i, null);
        } else if (a.op === 'upgrade') {
          const t = turrets[s]; if (!t || t.tier >= 3) continue;
          const c = t.tier === 1 ? t.T.cost : 2 * t.T.cost;
          if (gold < c) continue;
          gold -= c; t.spent += c; t.tier++; t.dmg = Math.floor(t.dmg * 16 / 10); t.range += 30;
          log.push([tick, 'U', s, t.tier]);
          if (rec) rec.ev(tick, 'U', s, t.tier, null);
        } else if (a.op === 'sell') {
          const t = turrets[s]; if (!t) continue;
          gold += Math.floor(t.spent * 70 / 100); turrets[s] = null;
          log.push([tick, 'S', s, 0]);
          if (rec) rec.ev(tick, 'S', s, t.T.i, null);
        }
      }
      const comp = waves[wave];
      for (let i = 0; i < comp.length; i++) queue.push({ tick: tick + 4 * i, wave: wave, idx: i, type: comp[i] });
      const rest = queue.slice(qHead); qHead = 0;
      rest.sort(function (p, q) { return p.tick - q.tick || p.wave - q.wave || p.idx - q.idx; });
      queue = rest;
      delete waves[wave];
    }
    // 2. spawn
    while (qHead < queue.length && queue[qHead].tick <= tick) {
      const q = queue[qHead++];
      enemies.push(mkEnemy(q.type, q.wave, Math.floor(ET[q.type].hp * mOf(q.wave) / 1000), 0));
    }
    // 3. move
    {
      const keep = [];
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        e.progress += e.slow > 0 ? Math.floor(e.speed * 60 / 100) : e.speed;
        if (e.progress >= e.len) {
          baseHp -= e.leak;
          log.push([tick, 'L', e.id, baseHp]);
          if (rec) rec.ev(tick, 'L', e.id, baseHp, e);
          if (baseHp <= 0) {
            log.push([tick, 'F', wave, 0]); fallTick = tick; fell = true;
            for (let j = i + 1; j < enemies.length; j++) keep.push(enemies[j]);
            break;
          }
        } else { setPos(e); keep.push(e); }
      }
      enemies = keep;
      if (fell) { if (rec) rec.tick(tick, enemies, turrets, gold, baseHp, wave, waves[wave + 1], true); break; }
    }
    // 4. age & heal
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i]; e.age++;
      if (e.type === 'mender' && e.age % 20 === 0) {
        for (let j = 0; j < enemies.length; j++) {
          const o = enemies[j], dx = o.x - e.x, dy = o.y - e.y;
          if (dx * dx + dy * dy <= 22500) { o.hp = Math.min(o.maxHp, o.hp + Math.floor(o.maxHp * 8 / 100)); }
        }
        if (rec) rec.ev(tick, 'H', e.id, 0, e);
      }
    }
    // 5. turrets
    for (let s = 0; s < 16; s++) {
      const t = turrets[s]; if (!t) continue;
      if (t.cd > 0) { t.cd--; if (t.cd > 0) continue; }
      const T = t.T, r2 = t.range * t.range, cands = [];
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (e.air ? !T.a : !T.g) continue;
        const dx = e.x - t.x, dy = e.y - t.y;
        if (dx * dx + dy * dy <= r2) cands.push(e);
      }
      if (!cands.length) continue;
      let tgt = null;
      if (typeof strat.target === 'function') {
        const id = strat.target({ slot: s, type: t.type, tier: t.tier, x: t.x, y: t.y, range: t.range }, cands.map(view));
        for (let i = 0; i < cands.length; i++) if (cands[i].id === id) { tgt = cands[i]; break; }
      }
      if (!tgt) {
        tgt = cands[0];
        for (let i = 1; i < cands.length; i++) if (cands[i].len - cands[i].progress < tgt.len - tgt.progress) tgt = cands[i];
      }
      const hits = [];
      if (T.splash > 0) {
        const s2 = T.splash * T.splash;
        for (let i = 0; i < enemies.length; i++) {
          const e = enemies[i];
          if (e.air ? !T.a : !T.g) continue;
          const dx = e.x - tgt.x, dy = e.y - tgt.y;
          if (dx * dx + dy * dy <= s2) hits.push(e);
        }
      } else hits.push(tgt);
      for (let i = 0; i < hits.length; i++) {
        const e = hits[i];
        e.hp -= T.pierce ? t.dmg : Math.max(1, t.dmg - e.armor);
        if (T.slow > 0) e.slow = T.slow;
      }
      t.cd = T.per;

  function frame(ts) {
    requestAnimationFrame(frame);
    if (state === 'INIT') {
      state = 'COUNTDOWN'; countdownElapsed = 0; lastTs = ts;
      elCount.style.display = 'block'; elCount.textContent = '3';
      return;
    }
    const rawDt = (ts - lastTs) / 1000; lastTs = ts;
    const dt = Math.min(Math.max(rawDt, 0), 0.1);
    if (state === 'COUNTDOWN') {
      countdownElapsed += dt;
      if (countdownElapsed >= 3) { hideCountdown(); state = 'PLAYING'; }
      else { elCount.style.display = 'block'; elCount.textContent = countdownElapsed < 1 ? '3' : countdownElapsed < 2 ? '2' : '1'; }
    } else if (state === 'REFIRE_HOLD') {
      holdElapsed += dt;
      if (holdElapsed >= 1) state = 'PLAYING';
    } else if (state === 'PLAYING') {
      const prev = simTime;
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      elScrub.value = simTime.toFixed(3);
      audioFrame();
      audioAdvance(prev, simTime);
      if (simTime >= DURATION) { simTime = DURATION; elScrub.value = DURATION.toFixed(3); state = 'ENDED'; showPauseIcon(false); }
    }
    audioFrame();
    render(simTime);
  }

  window.BENCH_REPORT = {
    selfCheck: { vectorA: true, vectorB: true },
    strategy: { summary: "Fixed priority build order (cannon splash core on the road bends, flak on the air lane, a few bolts), found by simulated-annealing search over slot types, build/upgrade order, late sell-and-replace steps, a small gold reserve for interest (200 gold until wave 38) and per-turret target-scoring weights (splash turrets pick the densest effective-damage cluster, others weigh progress, kill shots, menders, air). Trained on 30 seeds, validated on 40 others, final estimate on 100 fresh seeds (none is 42).", seedsTested: 100, meanScoreOnTestedSeeds: 46.42 },
    seed42: { score: result.score, fallTick: result.fallTick },
    systems: { board: "full", enemiesAndTurrets: "full", combatVisuals: "full", fall: "full", hud: "full", audio: "full" },
    simplifications: ["Air lane route length is 2800 (the polyline's real length); the 2600 stated in the spec does not reproduce self-check vector B", "HUD stays in colour while the 3D scene desaturates after the fall", "Turret aim snaps to the last target between ticks (interpolated by shortest angle)", "Audio was exercised for errors in headless playback but not listened to"],
    testedInBrowser: true,
    measuredFps: 59
  };

  fitCamera();
  window.addEventListener('resize', onResize);
  // prewarm the post-fall path so the fall does not hitch on shader compilation
  try { ensureRT(); renderer.setRenderTarget(rt); renderer.clear(); renderer.render(scene, camera); renderer.setRenderTarget(null); } catch (e) {}
  showPauseIcon(true);
  elScrub.value = '0';
  render(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
