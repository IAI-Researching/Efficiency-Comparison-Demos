<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last Rampart</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>

<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script id="rampart-strategy">
function createStrategy() {
  // Build order: [slot, type index] builds a turret, [slot, -1] upgrades it. Bought strictly in order, as soon as affordable.
  // Found by greedy construction + hill-climbing over many seeds (none of them 42): splash cannons on the road's folds,
  // flak along the air lane, two bolts at the keep to mop up leaks of either kind; everything ends at tier 3.
  var NAMES = ["bolt", "cannon", "frost", "lance", "flak"];
  var COST = { bolt: 50, cannon: 90, frost: 70, lance: 120, flak: 80 };
  var DMG = { bolt: [26, 41, 65], cannon: [60, 96, 153], frost: [10, 16, 25], lance: [180, 288, 460], flak: [40, 64, 102] };
  var ORDER = [[13,1],[12,0],[11,1],[14,0],[8,1],[6,1],[10,4],[4,1],[7,1],[3,1],[7,-1],[7,-1],[8,-1],[1,4],[5,4],[15,4],[2,4],[6,-1],[4,-1],[9,1],[4,-1],[3,-1],[6,-1],[8,-1],[1,-1],[3,-1],[10,-1],[13,-1],[9,-1],[14,-1],[14,-1],[10,-1],[9,-1],[11,-1],[0,4],[1,-1],[15,-1],[12,-1],[11,-1],[5,-1],[5,-1],[2,-1],[2,-1],[0,-1],[12,-1],[0,-1],[13,-1],[15,-1]];
  // target weights per enemy type: splash turrets, bolts, lances
  var WS = { grunt: 1, runner: 1, wisp: 1, brute: 1, splitter: 1, mender: 2.56, splitling: 1.6 };
  var WB = { grunt: 1, runner: 1, wisp: 1, brute: 0.96, splitter: 0.6, mender: 0.96, splitling: 0.36 };
  var WL = { grunt: 0.6, runner: 1, wisp: 1, brute: 1, splitter: 1, mender: 1, splitling: 1 };
  var URG_SPLASH = 0.8, URG_SINGLE = 2.048, KILL_BONUS = 4.7, ARMOR_W = 0.02;
  var ptr = 0;

  function plan(state) {
    var acts = [], gold = state.gold, mine = [], i;
    for (i = 0; i < 16; i++) { var t = state.slots[i].turret; mine.push(t ? { type: t.type, tier: t.tier } : null); }
    while (ptr < ORDER.length && acts.length < 32) {
      var it = ORDER[ptr], s = it[0], k = it[1], m = mine[s];
      if (k === -1) {
        if (!m || m.tier >= 3) { ptr++; continue; }
        var uc = COST[m.type] * m.tier;
        if (gold < uc) break;
        gold -= uc; m.tier++; acts.push({ op: "upgrade", slot: s }); ptr++;
      } else {
        if (m) { ptr++; continue; }
        var c = COST[NAMES[k]];
        if (gold < c) break;
        gold -= c; mine[s] = { type: NAMES[k], tier: 1 }; acts.push({ op: "build", slot: s, type: NAMES[k] }); ptr++;
      }
    }
    return acts;
  }

  function target(tur, c) {
    var n = c.length, i, j, e, best = -1, bv = -1e18, v;
    if (n === 1) return c[0].id;
    var type = tur.type, dmg = DMG[type][tur.tier - 1];
    if (type === "cannon" || type === "flak") {
      // maximise useful splash damage (weighted towards menders and enemies close to the keep)
      var r2 = type === "cannon" ? 8100 : 4900;
      var val = new Array(n);
      for (i = 0; i < n; i++) {
        e = c[i];
        var d = dmg - e.armor; if (d < 1) d = 1;
        if (d > e.hp) d = e.hp;
        val[i] = d * (1 + URG_SPLASH * (1 - e.remaining / (e.air ? 2600 : 4600))) * (WS[e.type] || 1);
      }
      for (i = 0; i < n; i++) {
        var a = c[i]; v = 0;
        for (j = 0; j < n; j++) {
          var b = c[j], dx = a.x - b.x, dy = a.y - b.y;
          if (dx * dx + dy * dy <= r2) v += val[j];
        }
        v = v * 100000 - a.remaining;
        if (v > bv) { bv = v; best = a.id; }
      }
      return best;
    }
    if (type === "frost") {
      for (i = 0; i < n; i++) {
        e = c[i];
        v = (e.slowed ? 0 : 1e9) - e.remaining;
        if (v > bv) { bv = v; best = e.id; }
      }
      return best;
    }
    var pierce = type === "lance";
    for (i = 0; i < n; i++) {
      e = c[i];
      var dd = pierce ? dmg : dmg - e.armor; if (dd < 1) dd = 1;
      var kill = dd >= e.hp;
      if (dd > e.hp) dd = e.hp;
      v = dd * (1 + URG_SINGLE * (1 - e.remaining / (e.air ? 2600 : 4600)));
      if (kill) v *= KILL_BONUS;
      v *= ((pierce ? WL : WB)[e.type] || 1);
      if (pierce) v *= (1 + ARMOR_W * e.armor);
      v = v * 100000 - e.remaining;
      if (v > bv) { bv = v; best = e.id; }
    }
    return best;
  }
  return { plan: plan, target: target };
}
</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks) {
  var obs = arguments.length > 3 ? arguments[3] : null;
  function mulberry32(a) { return function () {
    a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return (t ^ (t >>> 14)) >>> 0; }; }
  function mkRoute(pts) {
    var segs = [], len = 0;
    for (var i = 0; i + 1 < pts.length; i++) {
      var ax = pts[i][0] * 100 + 50, ay = pts[i][1] * 100 + 50, bx = pts[i + 1][0] * 100 + 50, by = pts[i + 1][1] * 100 + 50;
      var l = Math.abs(bx - ax) + Math.abs(by - ay);
      segs.push({ x: ax, y: ay, dx: Math.sign(bx - ax), dy: Math.sign(by - ay), start: len, len: l });
      len += l;
    }
    return { segs: segs, len: len };
  }
  var ROUTES = [mkRoute([[0, 2], [6, 2], [6, 10], [12, 10], [12, 3], [18, 3], [18, 11], [23, 11]]),
                mkRoute([[0, 6], [21, 6], [21, 11], [23, 11]])];
  function place(e) {
    var segs = ROUTES[e.air].segs, p = e.progress;
    for (var i = 0; i < segs.length; i++) {
      var s = segs[i];
      if (p <= s.start + s.len || i === segs.length - 1) { e.x = s.x + s.dx * (p - s.start); e.y = s.y + s.dy * (p - s.start); return; }
    }
  }
  var SLOTS = [[3, 3], [5, 5], [7, 4], [7, 8], [9, 9], [10, 5], [11, 8], [13, 8], [14, 5], [15, 2], [16, 7], [17, 4], [19, 8], [20, 10], [22, 9], [3, 7]];
  var TT = {
    bolt: { idx: 0, cost: 50, dmg: 26, period: 8, range: 300, splash: 0, slow: 0, pierce: 0, ground: 1, air: 1 },
    cannon: { idx: 1, cost: 90, dmg: 60, period: 24, range: 260, splash: 90, slow: 0, pierce: 0, ground: 1, air: 0 },
    frost: { idx: 2, cost: 70, dmg: 10, period: 12, range: 240, splash: 0, slow: 30, pierce: 0, ground: 1, air: 1 },
    lance: { idx: 3, cost: 120, dmg: 180, period: 36, range: 360, splash: 0, slow: 0, pierce: 1, ground: 1, air: 0 },
    flak: { idx: 4, cost: 80, dmg: 40, period: 10, range: 320, splash: 70, slow: 0, pierce: 0, ground: 0, air: 1 }
  };
  var ELIST = ["grunt", "runner", "wisp", "brute", "splitter", "mender"];
  var ET = {
    grunt: { hp: 60, speed: 10, bounty: 4, leak: 1, air: 0, first: 1, weight: 10 },
    runner: { hp: 40, speed: 20, bounty: 4, leak: 1, air: 0, first: 2, weight: 4 },
    wisp: { hp: 50, speed: 12, bounty: 6, leak: 2, air: 1, first: 3, weight: 3 },
    brute: { hp: 150, speed: 6, bounty: 9, leak: 3, air: 0, first: 4, weight: 3 },
    splitter: { hp: 90, speed: 8, bounty: 6, leak: 2, air: 0, first: 6, weight: 2 },
    mender: { hp: 70, speed: 8, bounty: 7, leak: 2, air: 0, first: 8, weight: 1 },
    splitling: { hp: 0, speed: 12, bounty: 1, leak: 1, air: 0, first: 0, weight: 0 }
  };
  var rng = mulberry32(seed);
  var mult = [0, 1000];
  function m(w) { while (mult.length <= w) mult.push(Math.floor(mult[mult.length - 1] * 108 / 100)); return mult[w]; }
  function genWave(w) {
    var n = 4 + Math.floor(3 * w / 5), out = [], av = [], sum = 0, i;
    for (i = 0; i < ELIST.length; i++) if (ET[ELIST[i]].first <= w) { av.push(ELIST[i]); sum += ET[ELIST[i]].weight; }
    for (i = 0; i < n; i++) {
      var r = rng() % sum, j = 0;
      while (r >= ET[av[j]].weight) { r -= ET[av[j]].weight; j++; }
      out.push(av[j]);
    }
    return out;
  }
  function view(e) {
    return { id: e.id, type: e.type, hp: e.hp, maxHp: e.maxHp, x: e.x, y: e.y, air: e.air, armor: e.armor, speed: e.speed, slowed: e.slow > 0 ? 1 : 0, remaining: ROUTES[e.air].len - e.progress };
  }
  var strat = createStrategy();
  var hasTarget = strat && typeof strat.target === "function";
  var log = [], gold = 250, baseHp = 10, wave = 0, nextId = 1, fallTick = -1;
  var enemies = [], queue = [], turrets = [];
  for (var si = 0; si < 16; si++) turrets.push(null);
  var nextComp = genWave(1);
  var fx = obs ? [] : null;
  function mkEnemy(type, w, maxHp, progress) {
    var d = ET[type];
    var e = { id: nextId++, type: type, wave: w, hp: maxHp, maxHp: maxHp, progress: progress, age: 0, slow: 0, air: d.air,
      armor: type === "grunt" ? Math.floor(w / 4) : type === "brute" ? 6 + w : 0, speed: d.speed, bounty: d.bounty, leak: d.leak, x: 0, y: 0, gone: false };
    place(e);
    enemies.push(e);
    return e;
  }
  function tstats(t) {
    var d = TT[t.type], dmg = d.dmg;
    for (var k = 1; k < t.tier; k++) dmg = Math.floor(dmg * 16 / 10);
    t.dmg = dmg; t.range = d.range + 30 * (t.tier - 1);
  }
  function alive(z) { return !z.gone; }
  var tick, i, e;
  outer:
  for (tick = 0; tick < maxTicks; tick++) {
    if (tick >= 20 && (tick - 20) % 40 === 0) {
      var w = (tick - 20) / 40 + 1;
      wave = w;
      gold += Math.min(50, Math.floor(gold * 5 / 100)) + 10 + 2 * w;
      var comp = nextComp;
      nextComp = genWave(w + 1);
      var st = { tick: tick, wave: w, gold: gold, baseHp: baseHp, slots: [], enemies: enemies.map(view), nextWave: nextComp.slice() };
      for (i = 0; i < 16; i++) {
        var tt = turrets[i];
        st.slots.push({ slot: i, x: SLOTS[i][0], y: SLOTS[i][1], turret: tt ? { type: tt.type, tier: tt.tier, spent: tt.spent } : null });
      }
      var acts = strat.plan(st);
      if (Array.isArray(acts)) {
        for (i = 0; i < acts.length && i < 32; i++) {
          var a = acts[i];
          if (!a || typeof a !== "object") continue;
          var s = a.slot;
          if (typeof s !== "number" || s !== Math.floor(s) || s < 0 || s > 15) continue;
          var cur = turrets[s];
          if (a.op === "build") {
            if (cur || typeof a.type !== "string" || !Object.prototype.hasOwnProperty.call(TT, a.type)) continue;
            var c = TT[a.type].cost;
            if (gold < c) continue;
            gold -= c;
            cur = turrets[s] = { slot: s, type: a.type, tier: 1, spent: c, cd: 0, x: SLOTS[s][0] * 100 + 50, y: SLOTS[s][1] * 100 + 50, dmg: 0, range: 0 };
            tstats(cur);
            log.push([tick, "B", s, TT[a.type].idx]);
            if (fx) fx.push({ k: "B", slot: s });
          } else if (a.op === "upgrade") {
            if (!cur || cur.tier >= 3) continue;
            var uc = TT[cur.type].cost * cur.tier;
            if (gold < uc) continue;
            gold -= uc; cur.spent += uc; cur.tier++; tstats(cur);
            log.push([tick, "U", s, cur.tier]);
            if (fx) fx.push({ k: "U", slot: s });
          } else if (a.op === "sell") {
            if (!cur) continue;
            gold += Math.floor(cur.spent * 70 / 100);
            turrets[s] = null;
            log.push([tick, "S", s, 0]);
            if (fx) fx.push({ k: "S", slot: s });
          }
        }
      }
      for (i = 0; i < comp.length; i++) queue.push({ tick: tick + 4 * i, wave: w, idx: i, type: comp[i] });
      queue.sort(function (p, q) { return p.tick - q.tick || p.wave - q.wave || p.idx - q.idx; });
    }
    var qn = 0;
    while (qn < queue.length && queue[qn].tick <= tick) {
      var q = queue[qn++];
      mkEnemy(q.type, q.wave, Math.floor(ET[q.type].hp * m(q.wave) / 1000), 0);
    }
    if (qn) queue.splice(0, qn);
    var leaked = false;
    for (i = 0; i < enemies.length; i++) {
      e = enemies[i];
      e.progress += e.slow > 0 ? Math.floor(e.speed * 60 / 100) : e.speed;
      if (e.progress >= ROUTES[e.air].len) {
        baseHp -= e.leak; e.gone = true; leaked = true;
        log.push([tick, "L", e.id, baseHp]);
        if (fx) fx.push({ k: "L", id: e.id });
        if (baseHp <= 0) {
          fallTick = tick;
          log.push([tick, "F", wave, 0]);
          if (obs) obs({ tick: tick, wave: wave, gold: gold, baseHp: baseHp, enemies: enemies.filter(alive), turrets: turrets, fx: fx, nextWave: nextComp, fell: true });
          break outer;
        }
      } else place(e);
    }
    if (leaked) enemies = enemies.filter(alive);
    for (i = 0; i < enemies.length; i++) {
      e = enemies[i];
      e.age++;
      if (e.type === "mender" && e.age % 20 === 0) {
        for (var j = 0; j < enemies.length; j++) {
          var o = enemies[j], hx = o.x - e.x, hy = o.y - e.y;
          if (hx * hx + hy * hy <= 22500) o.hp = Math.min(o.maxHp, o.hp + Math.floor(o.maxHp * 8 / 100));
        }
        if (fx) fx.push({ k: "H", x: e.x, y: e.y });
      }
    }
    for (var ts = 0; ts < 16; ts++) {
      var t = turrets[ts];
      if (!t) continue;
      if (t.cd > 0) { t.cd--; if (t.cd > 0) continue; }
      var d = TT[t.type], r2 = t.range * t.range, cands = [];
      for (i = 0; i < enemies.length; i++) {
        e = enemies[i];
        if (e.air ? !d.air : !d.ground) continue;
        var dx = e.x - t.x, dy = e.y - t.y;
        if (dx * dx + dy * dy <= r2) cands.push(e);
      }
      if (!cands.length) continue;
      var tg = null;
      if (hasTarget) {
        var rid = strat.target({ slot: ts, type: t.type, tier: t.tier, x: t.x, y: t.y, range: t.range }, cands.map(view));
        for (i = 0; i < cands.length; i++) if (cands[i].id === rid) { tg = cands[i]; break; }
      }
      if (!tg) {
        tg = cands[0];
        var br = ROUTES[tg.air].len - tg.progress;
        for (i = 1; i < cands.length; i++) { var rr = ROUTES[cands[i].air].len - cands[i].progress; if (rr < br) { br = rr; tg = cands[i]; } }
      }
      var hits;
      if (d.splash > 0) {
        hits = [];
        var s2 = d.splash * d.splash;
        for (i = 0; i < enemies.length; i++) {
          e = enemies[i];
          if (e.air ? !d.air : !d.ground) continue;
          var sx = e.x - tg.x, sy = e.y - tg.y;
          if (sx * sx + sy * sy <= s2) hits.push(e);
        }
      } else hits = [tg];
      var anyDead = false;

  pills.forEach(function (p) {
    p.addEventListener('click', function () {
      playbackSpeed = parseFloat(p.getAttribute('data-speed'));
      pills.forEach(function (q) { var on = q === p; q.classList.toggle('is-active', on); q.setAttribute('aria-checked', on ? 'true' : 'false'); });
    });
  });
  elScrub.addEventListener('input', function () {
    hideCountdown();
    var v = parseFloat(elScrub.value);
    simTime = isFinite(v) ? Math.max(0, Math.min(DURATION, v)) : 0;
    setState('PAUSED');
    renderAt(simTime);
  });
  elRefire.addEventListener('click', function () {
    hideCountdown();
    simTime = 0; elScrub.value = '0';
    holdElapsed = 0;
    setState('REFIRE_HOLD');
    renderAt(0);
  });
  window.addEventListener('resize', onResize);

  function frame(now) {
    requestAnimationFrame(frame);
    if (lastNow === null) lastNow = now;
    var rawDt = (now - lastNow) / 1000; lastNow = now;
    var dt = Math.min(Math.max(rawDt, 0), 0.1);
    fpsAcc += rawDt; fpsN++;
    if (fpsAcc >= 1) { window.BENCH_REPORT.measuredFps = Math.round(fpsN / fpsAcc * 10) / 10; fpsAcc = 0; fpsN = 0; }
    if (state === 'COUNTDOWN') {
      countdownElapsed += dt;
      if (countdownElapsed >= 3) { hideCountdown(); setState('PLAYING'); }
      else {
        var txt = countdownElapsed < 1 ? '3' : countdownElapsed < 2 ? '2' : '1';
        if (elCount.textContent !== txt) elCount.textContent = txt;
        if (elCount.style.display !== 'block') elCount.style.display = 'block';
      }
      renderAt(0);
    } else if (state === 'REFIRE_HOLD') {
      holdElapsed += dt;
      if (holdElapsed >= 1) setState('PLAYING');
      renderAt(0);
    } else if (state === 'PLAYING') {
      var prev = simTime;
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      audioAdvance(prev, simTime);
      if (simTime >= DURATION) {
        simTime = DURATION; elScrub.value = DURATION.toFixed(3);
        renderAt(simTime); setState('ENDED');
      } else { elScrub.value = simTime.toFixed(3); renderAt(simTime); }
    } else {
      renderAt(simTime);
    }
  }
  var fpsAcc = 0, fpsN = 0;

  window.BENCH_REPORT = {
    selfCheck: { vectorA: true, vectorB: true },
    strategy: { summary: "Fixed build order found offline by greedy construction plus hill-climbing over 24 training seeds (42 excluded), bought strictly in order as soon as affordable: 9 splash cannons on the road's folds, 5 flak along the air lane, 2 bolts beside the keep, all ending at tier 3. target(): splash turrets pick the candidate whose blast does the most useful (hp-capped, armour-aware) damage, weighted towards menders and enemies near the keep; bolts/lances prefer kills and enemies closest to leaking. Uses only type/hp/armor/x/y/air/remaining and the truthiness of slowed.", seedsTested: 60, meanScoreOnTestedSeeds: 44.95 },
    seed42: { score: result.score, fallTick: result.fallTick },
    systems: { board: "full", enemiesAndTurrets: "full", combatVisuals: "full", fall: "full", hud: "full", audio: "full" },
    simplifications: ["NOT run in a real browser this session (headless browser unavailable in the sandbox): page logic was exercised only under JavaScriptCore with the real three.js r128 build and a stubbed WebGL renderer / DOM / AudioContext, so shaders, final look, audio output and frame rate are unverified", "measuredFps is null at load and is filled in at runtime by the page's own rAF timer after one second of frames", "enemies get a small fixed visual offset (up to 0.13 tile; splitlings fan out to 0.34) so stacked enemies stay distinguishable; simulation positions are unchanged", "an enemy killed during tick k+1 is extrapolated along its last heading between ticks k and k+1, then replaced by its debris", "turrets swivel to their most recent shot; shot effects end at the target position recorded when the shot fired"],
    testedInBrowser: false,
    measuredFps: null
  };

  fitCamera();
  elCount.style.display = 'block'; elCount.textContent = '3';
  elScrub.value = '0';
  showPauseIcon(true);
  renderAt(0);
  requestAnimationFrame(frame);
})();
</script>
