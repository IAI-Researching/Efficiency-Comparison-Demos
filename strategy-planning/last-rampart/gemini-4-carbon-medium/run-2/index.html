<script id="rampart-strategy">
function createStrategy() {
  const COST = { bolt: 50, frost: 70, flak: 80, cannon: 90, lance: 120 };
  const DMG = {
    bolt: [0, 26, 41, 65],
    cannon: [0, 60, 96, 153],
    frost: [0, 10, 16, 25],
    lance: [0, 180, 288, 460],
    flak: [0, 40, 64, 102]
  };
  const BASE_SPD = { grunt: 10, runner: 20, wisp: 12, brute: 6, splitter: 8, mender: 8, splitling: 12 };
  const EARLY_BP = {
    0: "cannon", 1: "bolt", 2: "cannon", 3: "cannon",
    4: "cannon", 5: "bolt", 6: "cannon", 7: "cannon",
    8: "cannon", 9: "cannon", 10: "cannon", 11: "cannon",
    12: "flak", 13: "cannon", 14: "flak", 15: "bolt"
  };
  const LATE_BP = {
    0: "cannon", 1: "cannon", 2: "cannon", 3: "cannon",
    4: "cannon", 5: "flak", 6: "cannon", 7: "cannon",
    8: "cannon", 9: "lance", 10: "cannon", 11: "cannon",
    12: "flak", 13: "cannon", 14: "flak", 15: "flak"
  };
  const ORDER = [3, 6, 12, 8, 11, 13, 4, 14, 1, 2, 7, 5, 10, 0, 9, 15];

  return {
    plan(s) {
      const actions = [];
      let gold = s.gold;
      const slots = s.slots.map(function (sl) {
        return {
          slot: sl.slot,
          x: sl.x,
          y: sl.y,
          turret: sl.turret ? { type: sl.turret.type, tier: sl.turret.tier, spent: sl.turret.spent } : null
        };
      });

      function doBuild(sl, tp) {
        if (!slots[sl].turret && gold >= COST[tp] && actions.length < 32) {
          actions.push({ op: "build", slot: sl, type: tp });
          slots[sl].turret = { type: tp, tier: 1, spent: COST[tp] };
          gold -= COST[tp];
          return true;
        }
        return false;
      }
      function doUpg(sl, maxT) {
        const t = slots[sl].turret;
        if (t && t.tier < maxT && actions.length < 32) {
          const c = t.tier === 1 ? COST[t.type] : 2 * COST[t.type];
          if (gold >= c) {
            actions.push({ op: "upgrade", slot: sl });
            gold -= c;
            t.tier += 1;
            t.spent += c;
            return true;
          }
        }
        return false;
      }
      function doSell(sl) {
        const t = slots[sl].turret;
        if (t && actions.length < 32) {
          actions.push({ op: "sell", slot: sl });
          gold += Math.floor(t.spent * 70 / 100);
          slots[sl].turret = null;
          return true;
        }
        return false;
      }

      let danger = false;
      let liveWisps = 0;
      let nextWisps = 0;
      for (let i = 0; i < s.enemies.length; i++) {
        const e = s.enemies[i];
        if (e.air) {
          liveWisps++;
          if (e.remaining < 850) danger = true;
        } else if (e.remaining < 1000) {
          danger = true;
        }
      }
      for (let i = 0; i < s.nextWave.length; i++) {
        if (s.nextWave[i] === "wisp") nextWisps++;
      }

      const reserve = (s.wave >= 8 && s.wave < 43 && s.baseHp >= 9 && !danger)
        ? Math.min(1000, (s.wave - 7) * 95)
        : 0;

      function build(sl, force) {
        const tp = EARLY_BP[sl];
        if (!slots[sl].turret && gold - COST[tp] >= (force ? 0 : reserve)) {
          doBuild(sl, tp);
        }
      }
      function upg(sl, maxT, force) {
        const t = slots[sl].turret;
        if (t && t.tier < maxT) {
          const c = t.tier === 1 ? COST[t.type] : 2 * COST[t.type];
          if (gold - c >= (force ? 0 : reserve)) doUpg(sl, maxT);
        }
      }

      build(3, true);
      build(6, true);
      if (s.wave >= 2) build(12, true);
      if (s.wave >= 3) build(1, true);
      if (s.wave >= 4) build(8, true);
      if (s.wave >= 6) build(11, true);
      if (s.wave >= 7) build(13, true);
      if (s.wave >= 8) upg(12, 2, true);
      if (s.wave >= 9) upg(3, 2, true);

      for (let i = 0; i < ORDER.length; i++) build(ORDER[i], false);
      if (nextWisps >= 4 || liveWisps >= 4) {
        upg(12, 3, false);
        upg(14, 3, false);
      }
      for (let i = 0; i < ORDER.length; i++) {
        const sl = ORDER[i];
        if (slots[sl].turret && slots[sl].turret.type !== "frost") upg(sl, 2, false);
      }
      for (let i = 0; i < ORDER.length; i++) {
        const sl = ORDER[i];
        if (slots[sl].turret && slots[sl].turret.type !== "frost") upg(sl, 3, false);
      }
      for (let i = 0; i < ORDER.length; i++) {
        const sl = ORDER[i];
        if (slots[sl].turret && slots[sl].turret.type === "frost") upg(sl, 3, false);
      }

      let allT3 = true;
      for (let i = 0; i < 16; i++) {
        if (!slots[i].turret || slots[i].turret.tier < 3) {
          allT3 = false;
          break;
        }
      }

      if (allT3) {
        const convSlots = [1, 5, 15, 9];
        for (let i = 0; i < convSlots.length; i++) {
          const sl = convSlots[i];
          const cur = slots[sl].turret;
          let want = LATE_BP[sl];
          if (sl === 5 && nextWisps + liveWisps < 5) want = "cannon";
          if (cur && want && cur.type !== want && actions.length <= 28) {
            const refund = Math.floor(cur.spent * 70 / 100);
            const fullCost = 4 * COST[want];
            if (gold + refund - fullCost >= reserve) {
              doSell(sl);
              doBuild(sl, want);
              doUpg(sl, 2);
              doUpg(sl, 3);
            }
          }
        }

        const candSlots = [];
        for (let sl = 0; sl < 16; sl++) {
          const cur = slots[sl].turret;
          if (!cur || (cur.type !== "cannon" && cur.type !== "flak" && cur.type !== "lance")) continue;
          const refund = Math.floor(cur.spent * 70 / 100);
          const fullCost = 4 * COST[cur.type];
          const netCost = fullCost - refund;
          const r = cur.type === "lance" ? 420 : (cur.type === "flak" ? 380 : 320);
          const r2 = r * r;
          const sx = slots[sl].x, sy = slots[sl].y;
          let cnt = 0;
          for (let k = 0; k < s.enemies.length; k++) {
            const e = s.enemies[k];
            if (cur.type === "flak" ? !e.air : e.air) continue;
            const dx = e.x - sx, dy = e.y - sy;
            if (dx * dx + dy * dy <= r2) cnt++;
          }
          if ((cur.type === "cannon" && cnt >= 5) || (cur.type === "flak" && cnt >= 3) || (cur.type === "lance" && cnt >= 3)) {
            candSlots.push({ sl: sl, type: cur.type, netCost: netCost, score: cnt * (cur.type === "flak" ? 2.0 : 1.0) });
          }
        }
        candSlots.sort(function (a, b) { return b.score - a.score; });
        for (let i = 0; i < candSlots.length; i++) {
          const cs = candSlots[i];
          if (actions.length > 28) break;
          if (gold - cs.netCost >= reserve) {
            doSell(cs.sl);
            doBuild(cs.sl, cs.type);
            doUpg(cs.sl, 2);
            doUpg(cs.sl, 3);
          }
        }
      }

      return actions;
    },

    target(turret, candidates) {
      const n = candidates.length;
      if (n === 1) return candidates[0].id;
      const type = turret.type;
      const dmg = DMG[type][turret.tier];

      if (type === "frost") {
        let best = candidates[0], bestSc = -1e18;
        for (let i = 0; i < n; i++) {
          const c = candidates[i];
          const sc = -c.remaining + (!c.slowed ? 300000 : 0) +
            (c.air ? 2600 : c.type === "brute" ? 2100 : c.type === "splitter" ? 1800 : c.type === "runner" ? 1700 : 0);
          if (sc > bestSc) { bestSc = sc; best = c; }
        }
        return best.id;
      }

      if (type === "bolt") {
        let best = candidates[0], bestSc = -1e18;
        for (let i = 0; i < n; i++) {
          const c = candidates[i];
          const hit = Math.max(1, dmg - c.armor);
          const sc = -c.remaining * 1.5 + (c.remaining < 260 ? 25000 : 0) +
            (c.air ? 5000 : c.type === "mender" ? 3400 + (c.maxHp - c.hp) : (c.type === "runner" || c.type === "splitling") ? 2100 : c.type === "brute" ? -3200 : 0) +
            (hit >= c.hp ? 1300 : 0);
          if (sc > bestSc) { bestSc = sc; best = c; }
        }
        return best.id;
      }

      if (type === "lance") {
        let best = candidates[0], bestVal = -1e18;
        for (let i = 0; i < n; i++) {
          const c = candidates[i];
          let val = 0;
          if (c.remaining < 280) val = 100000 - c.remaining * 50;
          else if (c.type === "mender") val = 28000 + (c.maxHp - c.hp) * 2 + (4600 - c.remaining);
          else val = Math.min(c.hp, dmg) * 2 + c.armor * 14 + (c.type === "brute" ? 1500 : 0) + (4600 - c.remaining) * 0.4;
          if (val > bestVal) { bestVal = val; best = c; }
        }
        return best.id;
      }

      if (type === "cannon" || type === "flak") {
        const splashR2 = type === "cannon" ? 8100 : 4900;
        const maxLen = type === "flak" ? 2800 : 4600;
        let best = candidates[0], bestVal = -1;
        for (let i = 0; i < n; i++) {
          const c = candidates[i];
          let totalDmg = 0;
          for (let j = 0; j < n; j++) {
            const o = candidates[j];
            const dx = o.x - c.x, dy = o.y - c.y;
            if (dx * dx + dy * dy <= splashR2) {
              const eff = Math.min(o.hp, Math.max(1, dmg - o.armor));
              let w = eff * (o.type === "mender" ? 2.6 : o.type === "splitter" ? (o.remaining > 900 ? 1.35 : 0.85) : 1.0);
              if (eff >= o.hp) w *= 1.25;
              const spd = BASE_SPD[o.type] || 10;
              if (o.remaining < spd * 22) w *= 6.8;
              else if (o.remaining < 600) w *= 2.2;
              totalDmg += w;
            }
          }
          const val = totalDmg * (1 + Math.max(0, maxLen - c.remaining) / 3600);
          if (val > bestVal) { bestVal = val; best = c; }
        }
        return best.id;
      }

      return candidates[0].id;
    }
  };
}
</script>

<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks) {
  const rec = arguments.length > 3 ? arguments[3] : null;

  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return (t ^ (t >>> 14)) >>> 0;
    };
  }

  const GROUND_TILES = [[0, 2], [6, 2], [6, 10], [12, 10], [12, 3], [18, 3], [18, 11], [23, 11]];
  const AIR_TILES = [[0, 6], [21, 6], [21, 11], [23, 11]];
  const SLOT_TILES = [
    [3, 3], [5, 5], [7, 4], [7, 8], [9, 9], [10, 5], [11, 8], [13, 8],
    [14, 5], [15, 2], [16, 7], [17, 4], [19, 8], [20, 10], [22, 9], [3, 7]
  ];

  function buildRoute(tiles) {
    const pts = tiles.map(function (p) { return [100 * p[0] + 50, 100 * p[1] + 50]; });
    const segs = [];
    let total = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const dx = pts[i + 1][0] - pts[i][0];
      const dy = pts[i + 1][1] - pts[i][1];
      const len = Math.abs(dx) + Math.abs(dy);
      segs.push({ x0: pts[i][0], y0: pts[i][1], ux: Math.sign(dx), uy: Math.sign(dy), start: total, len: len });
      total += len;
    }
    return { segs: segs, total: total, tiles: tiles };
  }

  function posAt(route, progress) {
    const p = progress < 0 ? 0 : (progress > route.total ? route.total : progress);
    for (let i = 0; i < route.segs.length; i++) {
      const s = route.segs[i];
      if (p <= s.start + s.len || i === route.segs.length - 1) {
        const d = p - s.start;
        return [s.x0 + s.ux * d, s.y0 + s.uy * d, s.ux, s.uy];
      }
    }
    const last = route.segs[route.segs.length - 1];
    return [last.x0 + last.ux * last.len, last.y0 + last.uy * last.len, last.ux, last.uy];
  }

  const GROUND_ROUTE = buildRoute(GROUND_TILES);
  const AIR_ROUTE = buildRoute(AIR_TILES);

  const TURRET_DEFS = {
    bolt:   { idx: 0, cost: 50,  dmg: 26,  period: 8,  range: 300, splash: 0,  slow: 0,  pierce: false, ground: true,  air: true },
    cannon: { idx: 1, cost: 90,  dmg: 60,  period: 24, range: 260, splash: 90, slow: 0,  pierce: false, ground: true,  air: false },
    frost:  { idx: 2, cost: 70,  dmg: 10,  period: 12, range: 240, splash: 0,  slow: 30, pierce: false, ground: true,  air: true },
    lance:  { idx: 3, cost: 120, dmg: 180, period: 36, range: 360, splash: 0,  slow: 0,  pierce: true,  ground: true,  air: false },
    flak:   { idx: 4, cost: 80,  dmg: 40,  period: 10, range: 320, splash: 70, slow: 0,  pierce: false, ground: false, air: true }
  };

  const ENEMY_ORDER = [
    { type: "grunt",    eIdx: 0, baseHp: 60,  speed: 10, bounty: 4, leak: 1, air: 0, firstWave: 1, weight: 10 },
    { type: "runner",   eIdx: 1, baseHp: 40,  speed: 20, bounty: 4, leak: 1, air: 0, firstWave: 2, weight: 4 },
    { type: "wisp",     eIdx: 2, baseHp: 50,  speed: 12, bounty: 6, leak: 2, air: 1, firstWave: 3, weight: 3 },
    { type: "brute",    eIdx: 3, baseHp: 150, speed: 6,  bounty: 9, leak: 3, air: 0, firstWave: 4, weight: 3 },
    { type: "splitter", eIdx: 4, baseHp: 90,  speed: 8,  bounty: 6, leak: 2, air: 0, firstWave: 6, weight: 2 },
    { type: "mender",   eIdx: 5, baseHp: 70,  speed: 8,  bounty: 7, leak: 2, air: 0, firstWave: 8, weight: 1 }
  ];
  const ENEMY_MAP = { splitling: { type: "splitling", eIdx: 6, baseHp: 0, speed: 12, bounty: 1, leak: 1, air: 0 } };
  for (let i = 0; i < ENEMY_ORDER.length; i++) ENEMY_MAP[ENEMY_ORDER[i].type] = ENEMY_ORDER[i];

  function fnv1a(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return (h >>> 0).toString(16).padStart(8, "0");
  }

  const rng = mulberry32(seed);
  const strategy = createStrategy();
  const log = [];

  const hpMultCache = [0, 1000];
  function getHpMult(w) {
    while (hpMultCache.length <= w) {
      hpMultCache.push(Math.floor(hpMultCache[hpMultCache.length - 1] * 108 / 100));
    }
    return hpMultCache[w];
  }

  function genWave(w) {
    const count = 4 + Math.floor(3 * w / 5);
    const elig = [];
    let totalW = 0;
    for (let i = 0; i < ENEMY_ORDER.length; i++) {
      if (ENEMY_ORDER[i].firstWave <= w) {
        elig.push(ENEMY_ORDER[i]);
        totalW += ENEMY_ORDER[i].weight;
      }
    }
    const res = [];
    for (let i = 0; i < count; i++) {
      let r = rng() % totalW;
      for (let j = 0; j < elig.length; j++) {
        if (r < elig[j].weight) {
          res.push(elig[j].type);
          break;
        }
        r -= elig[j].weight;
      }
    }
    return res;
  }

              y: e.y,

      new THREE.Vector3(-0.65, 0, 14.65),
      new THREE.Vector3(24.65, 0, 14.65),
      new THREE.Vector3(-0.65, 1.75, -0.65),
      new THREE.Vector3(24.65, 1.75, -0.65),
      new THREE.Vector3(-0.65, 1.75, 14.65),
      new THREE.Vector3(24.65, 1.75, 14.65)
    ];
    const tmp = new THREE.Vector3();

    function evalDistAndBias(dist, zBias) {
      camera.position.set(12, dist * SIN_EL, 7 + zBias + dist * COS_EL);
      camera.lookAt(12, 0, 7 + zBias);
      camera.updateMatrixWorld(true);
      let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
      for (let i = 0; i < corners.length; i++) {
        tmp.copy(corners[i]).project(camera);
        if (tmp.x < minX) minX = tmp.x;
        if (tmp.x > maxX) maxX = tmp.x;
        if (tmp.y < minY) minY = tmp.y;
        if (tmp.y > maxY) maxY = tmp.y;
      }
      return { maxAbsX: Math.max(-minX, maxX), minY: minY, maxY: maxY };
    }

    let loD = 14, hiD = 60;
    let bestZBias = 0.8;
    for (let it = 0; it < 22; it++) {
      const midD = 0.5 * (loD + hiD);
      let loB = -3.5, hiB = 4.5;
      const targetMidY = 0.5 * (ndcBottomMin + ndcTopMax);
      for (let jb = 0; jb < 14; jb++) {
        const mb = 0.5 * (loB + hiB);
        const r = evalDistAndBias(midD, mb);
        const curMidY = 0.5 * (r.minY + r.maxY);
        if (curMidY < targetMidY) loB = mb;
        else hiB = mb;
      }
      const b = 0.5 * (loB + hiB);
      const r = evalDistAndBias(midD, b);
      bestZBias = b;
      if (r.maxAbsX <= ndcXMax && r.minY >= ndcBottomMin && r.maxY <= ndcTopMax) {
        hiD = midD;
      } else {
        loD = midD;
      }
    }
    baseCamLook.set(12, 0, 7 + bestZBias);
    baseCamPos.set(12, hiD * SIN_EL, 7 + bestZBias + hiD * COS_EL);
    camera.position.copy(baseCamPos);
    camera.lookAt(baseCamLook);
  }

  // =========================================================================
  // Procedural Board, Road, Air Lane, Build Pads & Keep
  // =========================================================================
  function createBoardTexture() {
    const cw = 1536, ch = 896; // 64 px per tile (24x14)
    const cv = document.createElement("canvas");
    cv.width = cw;
    cv.height = ch;
    const ctx = cv.getContext("2d");
    const S = 64;

    // Highland dusk slate terrain
    ctx.fillStyle = "#222630";
    ctx.fillRect(0, 0, cw, ch);

    for (let ty = 0; ty < 14; ty++) {
      for (let tx = 0; tx < 24; tx++) {
        const shade = Math.floor((visRng() - 0.5) * 14);
        const r = 34 + shade, g = 39 + shade, b = 48 + shade;
        ctx.fillStyle = "rgb(" + r + "," + g + "," + b + ")";
        ctx.fillRect(tx * S, ty * S, S, S);
        ctx.strokeStyle = "rgba(255,255,255,0.03)";
        ctx.lineWidth = 1;
        ctx.strokeRect(tx * S + 0.5, ty * S + 0.5, S - 1, S - 1);
      }
    }

    // Seeded grit & moss patches
    for (let i = 0; i < 2400; i++) {
      const px = visRng() * cw;
      const py = visRng() * ch;
      const rad = 1.2 + visRng() * 4.5;
      ctx.fillStyle = visRng() < 0.35 ? "rgba(62,78,64,0.18)" : (visRng() < 0.5 ? "rgba(15,17,22,0.28)" : "rgba(90,96,112,0.12)");
      ctx.beginPath();
      ctx.arc(px, py, rad, 0, Math.PI * 2);
      ctx.fill();
    }

    // Ground path outer stone curb & dark flagstone road
    const gTiles = replay.groundRoute.tiles;
    ctx.lineCap = "square";
    ctx.lineJoin = "miter";

    ctx.strokeStyle = "#454a57";
    ctx.lineWidth = S * 0.90;
    ctx.beginPath();
    for (let i = 0; i < gTiles.length; i++) {
      const x = (gTiles[i][0] + 0.5) * S;
      const y = (gTiles[i][1] + 0.5) * S;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    ctx.strokeStyle = "#191c24";
    ctx.lineWidth = S * 0.74;
    ctx.stroke();

    ctx.strokeStyle = "#262b36";
    ctx.lineWidth = S * 0.68;
    ctx.stroke();

    // Flagstone joints along ground path
    for (let p = 0; p <= replay.groundRoute.total; p += 25) {
      const pt = replay.posAt(replay.groundRoute, p);
      const wx = (pt[0] / 100) * S;
      const wy = (pt[1] / 100) * S;
      ctx.strokeStyle = "rgba(10,12,16,0.55)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      if (pt[2] !== 0) {
        ctx.moveTo(wx, wy - S * 0.34);
        ctx.lineTo(wx, wy + S * 0.34);
      } else {
        ctx.moveTo(wx - S * 0.34, wy);
        ctx.lineTo(wx + S * 0.34, wy);
      }
      ctx.stroke();
    }

    // Subtle ground trace under air lane
    const aTiles = replay.airRoute.tiles;
    ctx.save();
    ctx.strokeStyle = "rgba(38, 240, 255, 0.10)";
    ctx.lineWidth = S * 0.34;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    for (let i = 0; i < aTiles.length; i++) {
      const x = (aTiles[i][0] + 0.5) * S;
      const y = (aTiles[i][1] + 0.5) * S;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.restore();

    const tex = new THREE.CanvasTexture(cv);
    tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = 8;
    return tex;
  }

  // 16 Build Pads (low stone platforms) + Pre-built Turret visual assemblies
  const padStoneMat = applyDesatHook(new THREE.MeshStandardMaterial({ color: 0x4c5364, roughness: 0.76, metalness: 0.18 }));

  const padBaseGeo = new THREE.CylinderGeometry(0.44, 0.49, 0.10, 8);

  const turretPalette = [
    { main: 0x4a8fe7, accent: 0x94c7ff, emissive: 0x163868 }, // 0 bolt: steel-blue
    { main: 0xcd7f32, accent: 0xf0ad5e, emissive: 0x3b1e06 }, // 1 cannon: bronze
    { main: 0xe4f6ff, accent: 0x7be8ff, emissive: 0x2a7699 }, // 2 frost: ice-white
    { main: 0xdc2638, accent: 0xff6675, emissive: 0x520912 }, // 3 lance: crimson

  const turretMats = turretPalette.map(function (p) {

  const pipBrightMat = applyDesatHook(new THREE.MeshBasicMaterial({ color: 0xfff3a6 }));

  // 10 detachable wall/tower chunks (1 per Base HP) so keep visibly crumbles on leaks

  // =========================================================================
  // Instanced Enemy Silhouettes (Baked Vertex Colors + Frost Tint) & Health Bars
  // =========================================================================
  function colorizeGeo(geo, hex) {
    const g = geo.index ? geo.toNonIndexed() : geo.clone();
    const n = g.attributes.position.count;
    const cols = new Float32Array(n * 3);
    const c = new THREE.Color(hex);
    for (let i = 0; i < n; i++) {
      cols[i * 3] = c.r;
      cols[i * 3 + 1] = c.g;
      cols[i * 3 + 2] = c.b;
    }
    g.setAttribute("color", new THREE.BufferAttribute(cols, 3));
    return g;
  }
  function mergeParts(parts) {
    let total = 0;
    for (let i = 0; i < parts.length; i++) total += parts[i].attributes.position.count;
    const pos = new Float32Array(total * 3);
    const nrm = new Float32Array(total * 3);
    const col = new Float32Array(total * 3);
    let off = 0;
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      p.computeVertexNormals();
      pos.set(p.attributes.position.array, off * 3);
      nrm.set(p.attributes.normal.array, off * 3);
      col.set(p.attributes.color.array, off * 3);
      off += p.attributes.position.count;
    }
    const out = new THREE.BufferGeometry();
    out.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    out.setAttribute("normal", new THREE.BufferAttribute(nrm, 3));
    out.setAttribute("color", new THREE.BufferAttribute(col, 3));
    return out;
  }

  // Detached in-memory canvas glyph atlas ONLY for digits 0..9
  function createDigitTextures() {
    const textures = [];
    for (let d = 0; d <= 9; d++) {
      const cv = document.createElement("canvas");
      cv.width = 96;
      cv.height = 128;
      const ctx = cv.getContext("2d");
      ctx.clearRect(0, 0, 96, 128);
      ctx.font = "800 98px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.lineJoin = "round";
      ctx.lineWidth = 12;
      ctx.strokeStyle = "rgba(8, 10, 16, 0.85)";
      ctx.strokeText(String(d), 48, 67);
      ctx.fillStyle = "#ffffff";
      ctx.fillText(String(d), 48, 67);
      const tex = new THREE.CanvasTexture(cv);
      tex.encoding = THREE.sRGBEncoding;
      textures.push(tex);
    }
    return textures;
  }
  const digitTextures = createDigitTextures();

  function makeDigitPool(maxDigits, tintHex) {
    const pool = [];
    const grp = new THREE.Group();
    for (let i = 0; i < maxDigits; i++) {
      const mat = new THREE.MeshBasicMaterial({
        map: digitTextures[0],
        color: tintHex,
        transparent: true,
        depthTest: false,
        depthWrite: false
      });
      const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
      m.visible = false;
      grp.add(m);
      pool.push(m);
    }
    hudScene.add(grp);
    return { group: grp, meshes: pool };
  }

  function layoutDigits(pool, value, leftX, centerY, heightPx) {
    const str = String(Math.max(0, Math.floor(value)));
    const charW = heightPx * 0.64;
    const meshW = heightPx * 0.75;
    for (let i = 0; i < pool.meshes.length; i++) {
      const m = pool.meshes[i];
      if (i < str.length) {
        const code = str.charCodeAt(i) - 48;
        m.visible = true;
        m.material.map = digitTextures[code >= 0 && code <= 9 ? code : 0];
        m.scale.set(meshW, heightPx, 1);
        m.position.set(leftX + i * charW + charW * 0.5, centerY, 1);
      } else {
        m.visible = false;
      }
    }
    return leftX + str.length * charW;
  }

  function updateHud(snap, simTime) {
    const H = viewH;
    const W = viewW;
    const padX = Math.max(16, Math.round(W * 0.018));
    const topY = H - Math.max(14, Math.round(H * 0.024));

    // 1. Wave number (>= 7% of viewport height)
    const waveH = Math.max(46, Math.round(H * 0.078));
    const waveCenterY = topY - waveH * 0.5;
    const waveIconSize = waveH * 0.80;
    waveIconGrp.position.set(padX + waveIconSize * 0.5, waveCenterY, 1);
    waveIconGrp.scale.set(waveIconSize, waveIconSize, 1);
    layoutDigits(waveDigitPool, snap.wave, padX + waveIconSize * 1.12, waveCenterY, waveH);

    // 2. Gold under wave number
    const goldH = Math.max(26, Math.round(H * 0.044));
    const goldCenterY = waveCenterY - waveH * 0.5 - goldH * 0.62;
    const coinSize = goldH * 0.78;
    coinIconGrp.position.set(padX + coinSize * 0.54, goldCenterY, 1);
    coinIconGrp.scale.set(coinSize, coinSize, 1);
    layoutDigits(goldDigitPool, snap.gold, padX + coinSize * 1.22, goldCenterY, goldH);

    // 3. Next-wave preview under gold
    const counts = [0, 0, 0, 0, 0, 0];
    const nw = snap.nextWave;
    for (let i = 0; i < nw.length; i++) {
      const tp = nw[i];
      if (tp === "grunt") counts[0]++;
      else if (tp === "runner") counts[1]++;
      else if (tp === "wisp") counts[2]++;
      else if (tp === "brute") counts[3]++;
      else if (tp === "splitter") counts[4]++;
      else if (tp === "mender") counts[5]++;
    }
    const prevH = Math.max(20, Math.round(H * 0.032));
    const prevY = goldCenterY - goldH * 0.5 - prevH * 0.78;
    let curX = padX + prevH * 0.52;
    for (let i = 0; i < 6; i++) {
      const b = previewBadges[i];
      if (counts[i] > 0) {
        b.icon.visible = true;
        b.icon.position.set(curX, prevY, 1);
        b.icon.scale.set(prevH * 0.92, prevH * 0.92, 1);
        const endX = layoutDigits(b.digits, counts[i], curX + prevH * 0.52, prevY, prevH * 0.88);
        curX = endX + prevH * 0.76;
      } else {
        b.icon.visible = false;
        for (let k = 0; k < b.digits.meshes.length; k++) b.digits.meshes[k].visible = false;
      }
    }

    // 4. 10 Base HP pips in top-right corner
    const pipSize = Math.max(20, Math.round(H * 0.034));
    const pipStep = pipSize * 1.12;
    const rightStart = W - padX - pipSize * 0.5;
    const pipY = topY - pipSize * 0.65;
    for (let i = 0; i < 10; i++) {
      const pip = hpPips[i];
      const idxFromLeft = i;
      pip.group.position.set(rightStart - (9 - idxFromLeft) * pipStep, pipY, 1);
      pip.group.scale.set(pipSize, pipSize, 1);

      if (i < snap.baseHp) {
        pip.fill.visible = true;
        pip.fill.scale.set(1, 1, 1);
        pip.mat.color.setHex(snap.baseHp <= 3 ? 0xff5a4f : (snap.baseHp <= 6 ? 0xffbe3d : 0x43f388));
      } else {
        const dtLoss = simTime - pipLossTime[i];
        if (dtLoss >= 0 && dtLoss < 0.36) {
          const fl = 1 - dtLoss / 0.36;
          pip.fill.visible = true;
          const sc = 1 + fl * 0.42;
          pip.fill.scale.set(sc, sc, 1);
          pip.mat.color.setRGB(1.0, 0.25 + 0.75 * fl, 0.25 + 0.75 * fl);
        } else {
          pip.fill.visible = false;
        }
      }
    }
  }

  function handleResize() {
    viewW = window.innerWidth;
    viewH = window.innerHeight;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(viewW, viewH, false);
    computeCameraFraming(viewW, viewH);
    hudCam.left = 0;
    hudCam.right = viewW;
    hudCam.top = viewH;
    hudCam.bottom = 0;
    hudCam.updateProjectionMatrix();
  }
  window.addEventListener("resize", handleResize);
  handleResize();

  // =========================================================================
  // Deterministic World Render Function (Pure Function of simTime in [0, 100])
  // =========================================================================
  const tmpColor = new THREE.Color();
  const frostTint = new THREE.Color(0x6ad6ff);
  const whiteColor = new THREE.Color(0xffffff);
  const tmpStart = new THREE.Vector3();
  const tmpEnd = new THREE.Vector3();
  const tmpDir = new THREE.Vector3();
  const upZ = new THREE.Vector3(0, 0, 1);
  const tmpQuat = new THREE.Quaternion();
  const tmpScale = new THREE.Vector3();
  const tmpMat4 = new THREE.Matrix4();

  // Map enemy id -> next-tick entry for O(1) interpolation
  const nextEnemyLookup = new Map();

  function renderAtSimTime(t) {
    const clampedT = Math.max(0, Math.min(DURATION, t));
    const exactTick = clampedT * 20;
    let k0 = Math.floor(exactTick);
    let alpha = exactTick - k0;

    if (fallTick >= 0 && exactTick >= fallTick) {
      k0 = fallTick;
      alpha = 0;
    }
    const idx0 = Math.min(k0, lastRecordedTick);
    const idx1 = (fallTick >= 0 && k0 >= fallTick) ? idx0 : Math.min(k0 + 1, lastRecordedTick);
    const snap0 = replay.ticks[idx0];
    const snap1 = replay.ticks[idx1];

    // Desaturation after fall
    const desat = fallTick >= 0 ? Math.max(0, Math.min(1, (clampedT - fallTime) / 1.0)) * 0.92 : 0;
    desatUniform.value = desat;
    keepGlow.intensity = fallTick >= 0 && clampedT >= fallTime ? Math.max(0, 1.8 * (1 - (clampedT - fallTime) * 3)) : 1.8;

    // Closed-form camera trauma shake
    const trauma = getTraumaAt(clampedT);
    const shakeAmp = trauma * trauma * 0.25;
    const sx = shakeAmp * smoothNoise(clampedT * 31.0, 11.3);
    const sy = shakeAmp * 0.6 * smoothNoise(clampedT * 37.0, 47.9);
    const sz = shakeAmp * smoothNoise(clampedT * 29.0, 93.1);
    camera.position.set(baseCamPos.x + sx, baseCamPos.y + sy, baseCamPos.z + sz);
    camera.lookAt(baseCamLook.x + sx * 0.65, baseCamLook.y, baseCamLook.z + sz * 0.65);

    // Air lane chevron flow (freezes at fallTime)
    const animT = fallTick >= 0 ? Math.min(clampedT, fallTime) : clampedT;
    for (let i = 0; i < airChevrons.length; i++) {
      const ac = airChevrons[i];
      const pulse = 0.5 + 0.5 * Math.sin(animT * 5.0 - ac.phase * 12.0);
      ac.mesh.scale.setScalar(0.85 + 0.32 * pulse);
    }

    // Turrets on 16 pads
    const minShotTick = Math.floor((clampedT - 0.15) * 20);
    const maxShotTick = Math.floor(clampedT * 20);
    const sLo = lowerBoundTick(replay.shots, minShotTick);
    const sHi = upperBoundTick(replay.shots, Math.min(maxShotTick, fallTick >= 0 ? fallTick : maxShotTick));

    const slotRecoil = new Float32Array(16);
    for (let i = sLo; i < sHi; i++) {
      const sh = replay.shots[i];
      const dtS = clampedT - sh.tick / 20;
      if (dtS >= 0 && dtS <= 0.14) {
        const rc = 1 - dtS / 0.14;
        if (rc > slotRecoil[sh.slot]) slotRecoil[sh.slot] = rc;
      }
    }

    for (let si = 0; si < 16; si++) {
      const sv = slotVisuals[si];
      const td = snap0.turrets[si];
      const tdNext = snap1.turrets[si];
      for (let v = 0; v < 5; v++) sv.variants[v].root.visible = false;
      if (!td) continue;

      const tIdx = td[0];
      const tier = td[1];
      const variant = sv.variants[tIdx];
      variant.root.visible = true;

      let ax = td[2], ay = td[3];
      if (tdNext && tdNext[0] === tIdx) {
        ax = td[2] + (tdNext[2] - td[2]) * alpha;
        ay = td[3] + (tdNext[3] - td[3]) * alpha;
      }
      if (tIdx === 2) {
        variant.head.rotation.y = animT * 2.4 + si;
        variant.head.position.y = 0.46 + Math.sin(animT * 4.2 + si) * 0.03;
      } else {
        variant.head.rotation.y = Math.atan2(ax, ay);
        const rec = slotRecoil[si] * 0.065;
        variant.head.position.x = -ax * rec;
        variant.head.position.z = -ay * rec;
      }

      for (let r = 0; r < 3; r++) {
        variant.rings[r].visible = r < tier;
        variant.pips[r].visible = r < tier;
      }
    }

    // Keep leak flash, crumbling chunks & collapse
    let leakFlash = 0;
    for (let i = 0; i < replay.leaks.length; i++) {
      const dtL = clampedT - replay.leaks[i].tick / 20;
      if (dtL >= 0 && dtL < 0.28) {
        leakFlash = Math.max(leakFlash, 1 - dtL / 0.28);
      }
    }
    keepWallMat.color.copy(keepBaseColor).lerp(keepFlashColor, leakFlash * 0.85);
    keepWallMat.emissive.setRGB(leakFlash * 0.75, leakFlash * 0.08, leakFlash * 0.04);

    const collapsed = fallTick >= 0 && clampedT >= fallTime;
    if (collapsed) {
      const dtF = clampedT - fallTime;
      const sink = Math.min(1, dtF / 0.45);
      keepCitadel.position.y = -sink * 0.92;
      keepCitadel.rotation.z = sink * 0.24;
      keepCitadel.rotation.x = sink * 0.16;
      brazier.visible = false;
    } else {
      keepCitadel.position.set(0, 0, 0);
      keepCitadel.rotation.set(0, 0, 0);
      brazier.visible = true;
    }

    for (let i = 0; i < 10; i++) {
      const kc = keepChunks[i];
      const tLoss = pipLossTime[i];
      if (clampedT < tLoss) {
        kc.mesh.position.set(kc.ox, kc.oy, kc.oz);
        kc.mesh.rotation.set(0, 0, 0);
      } else {
        const dtC = Math.min(2.2, clampedT - tLoss);
        const px = kc.ox + kc.vx * dtC;
        const pz = kc.oz + kc.vz * dtC;
        let py = kc.oy + kc.vy * dtC - 0.5 * 9.8 * dtC * dtC;
        let rotScale = dtC;
        if (py < kc.halfH) {
          // Deterministic damped ground bounce & settle
          const tHit = (kc.vy + Math.sqrt(kc.vy * kc.vy + 2 * 9.8 * (kc.oy - kc.halfH))) / 9.8;
          const post = dtC - tHit;
          const bVy = kc.vy * 0.32;
          const bounce = Math.max(0, bVy * post - 0.5 * 9.8 * post * post);
          py = kc.halfH + bounce;
          rotScale = tHit + Math.min(0.25, post * 0.35);
          kc.mesh.position.set(kc.ox + kc.vx * Math.min(dtC, tHit + 0.28), py, kc.oz + kc.vz * Math.min(dtC, tHit + 0.28));
        } else {
          kc.mesh.position.set(px, py, pz);
        }
        kc.mesh.rotation.set(kc.spinX * rotScale, rotScale * 1.5, kc.spinZ * rotScale);
      }
    }

    // Living Enemies (smooth route-exact interpolation between k0 and k0+1)
    nextEnemyLookup.clear();
    for (let i = 0; i < snap1.enemies.length; i++) {
      const ne = snap1.enemies[i];
      nextEnemyLookup.set(ne[0], ne);
    }

    const typeCounts = [0, 0, 0, 0, 0, 0, 0];
    let wispShadowCount = 0;
    let menderHaloCount = 0;
    let hbCount = 0;

    for (let i = 0; i < snap0.enemies.length; i++) {
      const e0 = snap0.enemies[i];
      const id = e0[0];
      const eIdx = e0[1];
      const slotInMesh = typeCounts[eIdx];
      if (slotInMesh >= MAX_ENEMIES) continue;

      const route = eIdx === 2 ? replay.airRoute : replay.groundRoute;
      const e1 = nextEnemyLookup.get(id);
      let prog = e0[9];
      let hp = e0[4];
      const maxHp = e0[5];
      const slowed = e0[6];

      if (e1) {
        prog = e0[9] + (e1[9] - e0[9]) * alpha;
        hp = e0[4] + (e1[4] - e0[4]) * alpha;
      } else if (alpha > 0) {
        const effSpd = slowed ? Math.floor(e0[10] * 60 / 100) : e0[10];
        prog = Math.min(route.total, e0[9] + effSpd * alpha);
      }

      const pt = replay.posAt(route, prog);
      const wx = pt[0] / 100;
      const wz = pt[1] / 100;
      const yaw = Math.atan2(pt[2], pt[3]);
      const wy = eIdx === 2 ? (0.80 + 0.05 * Math.sin(animT * 6.0 + id)) : 0;

      dummyObj.position.set(wx, wy, wz);
      if (eIdx === 2) {
        dummyObj.rotation.set(0, animT * 2.5 + id, 0);
      } else {
        dummyObj.rotation.set(0, yaw, 0);
      }
      dummyObj.scale.set(1, 1, 1);
      dummyObj.updateMatrix();

      const im = enemyMeshes[eIdx];
      im.setMatrixAt(slotInMesh, dummyObj.matrix);
      im.setColorAt(slotInMesh, slowed ? frostTint : whiteColor);
      typeCounts[eIdx]++;

      if (eIdx === 2 && wispShadowCount < MAX_ENEMIES) {
        dummyObj.position.set(wx, 0.018, wz);
        dummyObj.rotation.set(0, 0, 0);
        dummyObj.scale.set(1, 1, 1);
        dummyObj.updateMatrix();
        wispShadowMesh.setMatrixAt(wispShadowCount++, dummyObj.matrix);
      } else if (eIdx === 5 && menderHaloCount < MAX_ENEMIES) {
        const hScale = 0.92 + 0.10 * Math.sin(animT * 5.0 + id);
        dummyObj.position.set(wx, 0.03, wz);
        dummyObj.rotation.set(0, 0, 0);
        dummyObj.scale.set(hScale, hScale, hScale);
        dummyObj.updateMatrix();
        menderHaloMesh.setMatrixAt(menderHaloCount++, dummyObj.matrix);
      }

      if (hbCount < MAX_ENEMIES) {
        const barY = eIdx === 2 ? (wy + 0.36) : (eIdx === 3 ? 0.78 : (eIdx === 5 ? 0.82 : 0.58));
        const ratio = Math.max(0.02, Math.min(1, hp / Math.max(1, maxHp)));
        dummyObj.position.set(wx, barY, wz);
        dummyObj.rotation.set(-ELEV_RAD, 0, 0);
        dummyObj.scale.set(1, 1, 1);
        dummyObj.updateMatrix();
        hbBackMesh.setMatrixAt(hbCount, dummyObj.matrix);

        dummyObj.position.set(wx - 0.22, barY, wz + 0.004);
        dummyObj.scale.set(ratio, 1, 1);
        dummyObj.updateMatrix();
        hbFillMesh.setMatrixAt(hbCount, dummyObj.matrix);
        if (ratio > 0.55) tmpColor.setHex(0x4eff7b);
        else if (ratio > 0.25) tmpColor.setHex(0xffc938);
        else tmpColor.setHex(0xff3e3e);
        hbFillMesh.setColorAt(hbCount, tmpColor);
        hbCount++;
      }
    }

    for (let tIdx = 0; tIdx < 7; tIdx++) {
      const im = enemyMeshes[tIdx];
      im.count = typeCounts[tIdx];
      im.instanceMatrix.needsUpdate = true;
      if (im.instanceColor) im.instanceColor.needsUpdate = true;
    }
    wispShadowMesh.count = wispShadowCount;
    wispShadowMesh.instanceMatrix.needsUpdate = true;
    menderHaloMesh.count = menderHaloCount;
    menderHaloMesh.instanceMatrix.needsUpdate = true;
    hbBackMesh.count = hbCount;
    hbBackMesh.instanceMatrix.needsUpdate = true;
    hbFillMesh.count = hbCount;
    hbFillMesh.instanceMatrix.needsUpdate = true;
    if (hbFillMesh.instanceColor) hbFillMesh.instanceColor.needsUpdate = true;

    // Combat Effects: Shots (<= 0.15s), Splash/Heal/Op/Fall Rings, and Debris
    let beamCount = 0;
    let sphereCount = 0;
    let ringCount = 0;
    let debrisCount = 0;

    function pushBeam(x0, y0, z0, x1, y1, z1, radius, color) {
      if (beamCount >= MAX_BEAMS) return;
      tmpStart.set(x0, y0, z0);
      tmpEnd.set(x1, y1, z1);
      tmpDir.subVectors(tmpEnd, tmpStart);
      const len = tmpDir.length();
      if (len < 0.01) return;
      tmpDir.divideScalar(len);
      tmpQuat.setFromUnitVectors(upZ, tmpDir);
      tmpScale.set(radius * 2, radius * 2, len);
      tmpMat4.compose(tmpStart, tmpQuat, tmpScale);
      beamMesh.setMatrixAt(beamCount, tmpMat4);
      beamMesh.setColorAt(beamCount, color);
      beamCount++;
    }

    function pushSphere(x, y, z, rad, color) {
      if (sphereCount >= MAX_SPHERES) return;
      dummyObj.position.set(x, y, z);
      dummyObj.rotation.set(0, 0, 0);
      dummyObj.scale.setScalar(rad);
      dummyObj.updateMatrix();
      flashSphereMesh.setMatrixAt(sphereCount, dummyObj.matrix);
      flashSphereMesh.setColorAt(sphereCount, color);
      sphereCount++;
    }

    function pushRing(x, y, z, rad, color) {
      if (ringCount >= MAX_RINGS || rad <= 0.01) return;
      dummyObj.position.set(x, y, z);
      dummyObj.rotation.set(0, 0, 0);
      dummyObj.scale.setScalar(rad);
      dummyObj.updateMatrix();
      fxRingMesh.setMatrixAt(ringCount, dummyObj.matrix);
      fxRingMesh.setColorAt(ringCount, color);
      ringCount++;
    }

    // 1. Active shots (max duration 0.15s)
    for (let i = sLo; i < sHi; i++) {
      const sh = replay.shots[i];
      const dtS = clampedT - sh.tick / 20;
      const dur = sh.typeIdx === 0 ? 0.11 : (sh.typeIdx === 3 ? 0.15 : 0.14);
      if (dtS < 0 || dtS > dur) continue;
      const u = dtS / dur;
      const sx0 = sh.sx / 100, sz0 = sh.sy / 100;
      const tx1 = sh.tx / 100, tz1 = sh.ty / 100;
      const sy0 = sh.typeIdx === 2 ? 0.56 : 0.36;
      const ty1 = sh.air ? 0.80 : 0.22;
      const col = SHOT_COLORS[sh.typeIdx];

      if (sh.typeIdx === 0) {
        // Bolt: thin steel-blue tracer streak
        const a0 = Math.max(0, u - 0.45);
        const a1 = Math.min(1, u * 1.45);
        pushBeam(
          sx0 + (tx1 - sx0) * a0, sy0 + (ty1 - sy0) * a0, sz0 + (tz1 - sz0) * a0,
          sx0 + (tx1 - sx0) * a1, sy0 + (ty1 - sy0) * a1, sz0 + (tz1 - sz0) * a1,
          0.026, col
        );
      } else if (sh.typeIdx === 1) {
        // Cannon: arcing shell + ground splash ring of exact 0.90 tile radius
        if (u < 0.65) {
          const su = u / 0.65;
          const cx = sx0 + (tx1 - sx0) * su;
          const cz = sz0 + (tz1 - sz0) * su;
          const cy = sy0 + (0.12 - sy0) * su + 3.2 * su * (1 - su);
          pushSphere(cx, cy, cz, 0.11, col);
        }
        if (u >= 0.35) {
          const ru = (u - 0.35) / 0.65;
          tmpColor.copy(col).multiplyScalar(1.3 - 0.7 * ru);
          pushRing(tx1, 0.04, tz1, 0.90 * (0.25 + 0.75 * ru), tmpColor);
        }
      } else if (sh.typeIdx === 2) {
        // Frost: pale beam + chill ring
        pushBeam(sx0, sy0, sz0, tx1, ty1, tz1, 0.032 * (1 - 0.4 * u), col);
        pushRing(tx1, sh.air ? 0.80 : 0.04, tz1, 0.36 * u, col);
      } else if (sh.typeIdx === 3) {
        // Lance: thick crimson beam with flash
        const w = 0.068 * (1 - 0.55 * u);
        pushBeam(sx0, sy0, sz0, tx1, ty1, tz1, w, col);
        pushSphere(sx0 + (tx1 - sx0) * 0.08, sy0, sz0 + (tz1 - sz0) * 0.08, 0.14 * (1 - u), whiteColor);
        pushSphere(tx1, ty1, tz1, 0.18 * (1 - u), col);
      } else if (sh.typeIdx === 4) {
        // Flak: tracer + teal burst ring in air (exact 0.70 tile splash radius)
        if (u < 0.55) {
          pushBeam(sx0, sy0, sz0, tx1, 0.80, tz1, 0.022, col);
        }
        const ru = Math.min(1, u * 1.15);
        pushRing(tx1, 0.80, tz1, 0.70 * (0.2 + 0.8 * ru), col);
      }
    }

    // 2. Mender heal pulse rings (exact 1.50 tile radius)
    const hLo = lowerBoundTick(replay.heals, Math.floor((clampedT - 0.44) * 20));
    const hHi = upperBoundTick(replay.heals, Math.min(maxShotTick, fallTick >= 0 ? fallTick : maxShotTick));
    tmpColor.setHex(0x3dff8b);
    for (let i = hLo; i < hHi; i++) {
      const hl = replay.heals[i];
      const dtH = clampedT - hl.tick / 20;
      if (dtH >= 0 && dtH <= 0.42) {
        const u = dtH / 0.42;
        pushRing(hl.x / 100, 0.05, hl.y / 100, 1.50 * (0.15 + 0.85 * u), tmpColor);
      }
    }

    // 3. Build / Upgrade / Sell visual pulses & sparkles
    const oLo = lowerBoundTick(replay.ops, Math.floor((clampedT - 0.52) * 20));
    const oHi = upperBoundTick(replay.ops, Math.min(maxShotTick, fallTick >= 0 ? fallTick : maxShotTick));
    for (let i = oLo; i < oHi; i++) {
      const op = replay.ops[i];
      const dtO = clampedT - op.tick / 20;
      if (dtO < 0 || dtO > 0.50) continue;
      const u = dtO / 0.50;
      const st = replay.slotTiles[op.slot];
      const ox = st[0] + 0.5, oz = st[1] + 0.5;
      if (op.op === "B") tmpColor.setHex(0x7af5ff);
      else if (op.op === "U") tmpColor.setHex(0xffe46b);
      else tmpColor.setHex(0x8a92a6);
      pushRing(ox, 0.12 + (op.op === "U" ? u * 0.45 : 0), oz, 0.52 * (0.4 + 0.6 * u), tmpColor);

      for (let p = 0; p < op.parts.length && debrisCount < MAX_DEBRIS; p++) {
        const pt = op.parts[p];
        const py = op.op === "S"
          ? Math.max(0.05, 0.35 + pt[1] * dtO - 4.9 * dtO * dtO)
          : 0.12 + pt[1] * dtO;
        dummyObj.position.set(ox + pt[0] * (op.op === "S" ? (1 + dtO * 2) : 1), py, oz + pt[2] * (op.op === "S" ? (1 + dtO * 2) : 1));
        dummyObj.rotation.set(dtO * 5, dtO * 4, 0);
        dummyObj.scale.setScalar(pt[3] * (1 - u * 0.85));
        dummyObj.updateMatrix();
        debrisMesh.setMatrixAt(debrisCount, dummyObj.matrix);
        debrisMesh.setColorAt(debrisCount, tmpColor);
        debrisCount++;
      }
    }

    // 4. Enemy kill ballistic debris & splitter bursts
    const kLo = lowerBoundTick(replay.kills, Math.floor((clampedT - 0.48) * 20));
    const kHi = upperBoundTick(replay.kills, Math.min(maxShotTick, fallTick >= 0 ? fallTick : maxShotTick));
    for (let i = kLo; i < kHi; i++) {
      const kl = replay.kills[i];
      const dtK = clampedT - kl.tick / 20;
      if (dtK < 0 || dtK > 0.46) continue;
      const u = dtK / 0.46;
      const kx = kl.x / 100, kz = kl.y / 100;
      const ky0 = kl.air ? 0.80 : 0.24;
      const dCol = ENEMY_DEATH_COLORS[kl.eIdx];

      if (kl.splitter && dtK <= 0.34) {
        pushRing(kx, 0.06, kz, 0.78 * (dtK / 0.34), dCol);
      }
      for (let p = 0; p < kl.parts.length && debrisCount < MAX_DEBRIS; p++) {
        const pt = kl.parts[p];
        const py = Math.max(0.04, ky0 + pt[1] * dtK - 5.5 * dtK * dtK);
        dummyObj.position.set(kx + pt[0] * dtK, py, kz + pt[2] * dtK);
        dummyObj.rotation.set(pt[4] + dtK * 8, pt[4] + dtK * 6, 0);
        dummyObj.scale.setScalar(pt[3] * (1 - u * 0.78));
        dummyObj.updateMatrix();
        debrisMesh.setMatrixAt(debrisCount, dummyObj.matrix);
        debrisMesh.setColorAt(debrisCount, dCol);
        debrisCount++;
      }
    }

    // 5. Base Fall Shockwave Ring & Debris Collapse
    if (collapsed) {
      const dtF = clampedT - fallTime;
      if (dtF <= 1.35) {
        const u = dtF / 1.35;
        tmpColor.setRGB(1.0, 0.65 * (1 - u) + 0.3, 0.35 * (1 - u) + 0.25);
        pushRing(23.5, 0.08, 11.5, 0.6 + u * 24.0, tmpColor);
        if (dtF <= 0.8) {
          pushRing(23.5, 0.10, 11.5, 0.4 + (dtF / 0.8) * 9.5, whiteColor);
        }
      }
      const bDt = Math.min(2.6, dtF);
      for (let i = 0; i < fallDebrisSeeds.length && debrisCount < MAX_DEBRIS; i++) {
        const fd = fallDebrisSeeds[i];
        let py = 0.75 + fd[1] * bDt - 0.5 * 9.8 * bDt * bDt;
        let moveT = bDt;
        if (py < fd[3] * 0.5) {
          const tHit = (fd[1] + Math.sqrt(fd[1] * fd[1] + 2 * 9.8 * (0.75 - fd[3] * 0.5))) / 9.8;
          const post = bDt - tHit;
          py = fd[3] * 0.5 + Math.max(0, fd[1] * 0.25 * post - 4.9 * post * post);
          moveT = Math.min(bDt, tHit + 0.22);
        }
        dummyObj.position.set(23.5 + fd[0] * moveT, py, 11.5 + fd[2] * moveT);
        dummyObj.rotation.set(fd[4] + moveT * 5, fd[4] + moveT * 3, 0);
        const shrink = fd[5] ? Math.max(0, 1 - dtF * 0.65) : 1.0;
        dummyObj.scale.setScalar(fd[3] * shrink);
        dummyObj.updateMatrix();
        debrisMesh.setMatrixAt(debrisCount, dummyObj.matrix);
        tmpColor.setHex(fd[5] ? 0xff7729 : 0x5c6375);
        debrisMesh.setColorAt(debrisCount, tmpColor);
        debrisCount++;
      }
    }

    beamMesh.count = beamCount;
    beamMesh.instanceMatrix.needsUpdate = true;
    if (beamMesh.instanceColor) beamMesh.instanceColor.needsUpdate = true;

    flashSphereMesh.count = sphereCount;
    flashSphereMesh.instanceMatrix.needsUpdate = true;
    if (flashSphereMesh.instanceColor) flashSphereMesh.instanceColor.needsUpdate = true;

    fxRingMesh.count = ringCount;
    fxRingMesh.instanceMatrix.needsUpdate = true;
    if (fxRingMesh.instanceColor) fxRingMesh.instanceColor.needsUpdate = true;

    debrisMesh.count = debrisCount;
    debrisMesh.instanceMatrix.needsUpdate = true;
    if (debrisMesh.instanceColor) debrisMesh.instanceColor.needsUpdate = true;

    // Update Orthographic HUD
    updateHud(snap0, clampedT);

    // Render 3D scene + HUD pass onto #stage
    renderer.clear();
    renderer.render(scene, camera);
    renderer.clearDepth();
    renderer.render(hudScene, hudCam);
  }

  // =========================================================================
  // Section 6: Synthesized Web Audio API Sound Effects (Seed 4242, No Music)
  // =========================================================================
  const sfxRng = makeFloatRng(4242);
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;
  let masterGain = null;
  let noiseBuf = null;
  const activeOneShots = new Set();
  let windSource = null;
  let windGain = null;
  let audioMutedState = true;
  const recentShotStamps = [];
  const recentKillStamps = [];

  function initAudio() {
    if (!AudioCtx) return;
    try {
      audioCtx = new AudioCtx();
      const comp = audioCtx.createDynamicsCompressor();
      comp.threshold.value = -14;
      comp.knee.value = 12;
      comp.ratio.value = 6;
      comp.attack.value = 0.003;
      comp.release.value = 0.15;

      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0;
      masterGain.connect(comp);
      comp.connect(audioCtx.destination);

      const len = audioCtx.sampleRate * 2;
      noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = sfxRng() * 2 - 1;

      const p = audioCtx.resume();
      if (p && typeof p.catch === "function") p.catch(function () {});
    } catch (e) {
      audioCtx = null;
    }
  }
  initAudio();

  function resumeAudioOnGesture() {
    if (audioCtx && audioCtx.state === "suspended") {
      const p = audioCtx.resume();
      if (p && typeof p.catch === "function") p.catch(function () {});
    }
  }
  window.addEventListener("pointerdown", resumeAudioOnGesture, { passive: true });
  window.addEventListener("keydown", resumeAudioOnGesture, { passive: true });

  function setAudioAudible(audible) {
    if (!audioCtx || !masterGain) return;
    if (audible === !audioMutedState) return;
    audioMutedState = !audible;
    const now = audioCtx.currentTime;
    masterGain.gain.cancelScheduledValues(now);
    masterGain.gain.setValueAtTime(masterGain.gain.value, now);
    if (audible) {
      masterGain.gain.linearRampToValueAtTime(0.75, now + 0.035);
    } else {
      masterGain.gain.linearRampToValueAtTime(0, now + 0.035);
      activeOneShots.forEach(function (src) {
        try { src.stop(now + 0.04); } catch (e) {}
      });
      activeOneShots.clear();
      stopFallWind();
    }
  }

  function makePannedOut(worldX, gainVal) {
    const g = audioCtx.createGain();
    g.gain.value = gainVal;
    if (typeof audioCtx.createStereoPanner === "function") {
      const pan = audioCtx.createStereoPanner();
      pan.pan.value = Math.max(-0.85, Math.min(0.85, (worldX / 24) * 1.6 - 0.8));
      g.connect(pan);
      pan.connect(masterGain);
    } else {
      g.connect(masterGain);
    }
    return g;
  }

  function trackSource(src) {
    activeOneShots.add(src);
    src.onended = function () { activeOneShots.delete(src); };
  }

  function playShotSfx(typeIdx, worldX) {
    if (!audioCtx || audioMutedState || !noiseBuf) return;
    const now = audioCtx.currentTime;
    const jitter = 0.97 + sfxRng() * 0.06;

    if (typeIdx === 3) {
      // Lance: deep crimson zap + harmonic beam snap
      const out = makePannedOut(worldX, 0.22);
      const osc = audioCtx.createOscillator();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(620 * jitter, now);
      osc.frequency.exponentialRampToValueAtTime(110, now + 0.15);
      out.gain.setValueAtTime(0.22, now);
      out.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
      osc.connect(out);
      osc.start(now);
      osc.stop(now + 0.17);
      trackSource(osc);
    } else if (typeIdx === 1) {
      // Cannon: low-mid thump + filtered noise burst
      const out = makePannedOut(worldX, 0.20);
      const osc = audioCtx.createOscillator();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(155 * jitter, now);
      osc.frequency.exponentialRampToValueAtTime(42, now + 0.14);
      out.gain.setValueAtTime(0.22, now);
      out.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      osc.connect(out);
      osc.start(now);
      osc.stop(now + 0.16);
      trackSource(osc);

      const nSrc = audioCtx.createBufferSource();
      nSrc.buffer = noiseBuf;
      const flt = audioCtx.createBiquadFilter();
      flt.type = "lowpass";
      flt.frequency.value = 480;
      const ng = makePannedOut(worldX, 0.12);
      ng.gain.setValueAtTime(0.12, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
      nSrc.connect(flt);
      flt.connect(ng);
      nSrc.start(now, sfxRng() * 1.2, 0.12);
      trackSource(nSrc);
    } else if (typeIdx === 4) {
      // Flak: crisp metallic AA burst
      const nSrc = audioCtx.createBufferSource();
      nSrc.buffer = noiseBuf;
      const flt = audioCtx.createBiquadFilter();
      flt.type = "bandpass";
      flt.frequency.value = 1450 * jitter;
      flt.Q.value = 2.5;
      const out = makePannedOut(worldX, 0.16);
      out.gain.setValueAtTime(0.16, now);
      out.gain.exponentialRampToValueAtTime(0.001, now + 0.085);
      nSrc.connect(flt);
      flt.connect(out);
      nSrc.start(now, sfxRng() * 1.2, 0.09);
      trackSource(nSrc);
    } else if (typeIdx === 2) {
      // Frost: crystalline high shimmer
      const out = makePannedOut(worldX, 0.11);
      const osc = audioCtx.createOscillator();
      osc.type = "sine";
      osc.frequency.setValueAtTime(1320 * jitter, now);
      osc.frequency.exponentialRampToValueAtTime(1960 * jitter, now + 0.09);
      out.gain.setValueAtTime(0.11, now);
      out.gain.exponentialRampToValueAtTime(0.001, now + 0.10);
      osc.connect(out);
      osc.start(now);
      osc.stop(now + 0.11);
      trackSource(osc);
    } else {
      // Bolt: tight pneumatic snap
      const out = makePannedOut(worldX, 0.09);
      const osc = audioCtx.createOscillator();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(840 * jitter, now);
      osc.frequency.exponentialRampToValueAtTime(260, now + 0.055);
      out.gain.setValueAtTime(0.09, now);
      out.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc.connect(out);
      osc.start(now);
      osc.stop(now + 0.065);
      trackSource(osc);
    }
  }

  function playKillSfx(worldX) {
    if (!audioCtx || audioMutedState) return;
    const now = audioCtx.currentTime;
    while (recentKillStamps.length && now - recentKillStamps[0] > 1.0) recentKillStamps.shift();
    if (recentKillStamps.length >= 16) return;
    recentKillStamps.push(now);

    const out = makePannedOut(worldX, 0.075);
    const osc = audioCtx.createOscillator();
    osc.type = "sine";
    const f = 310 + sfxRng() * 120;
    osc.frequency.setValueAtTime(f, now);
    osc.frequency.exponentialRampToValueAtTime(f * 1.65, now + 0.045);
    out.gain.setValueAtTime(0.075, now);
    out.gain.exponentialRampToValueAtTime(0.001, now + 0.055);
    osc.connect(out);
    osc.start(now);
    osc.stop(now + 0.06);
    trackSource(osc);
  }

  function playWaveHornSfx() {
    if (!audioCtx || audioMutedState) return;
    const now = audioCtx.currentTime;
    const out = makePannedOut(2, 0.16);
    const osc = audioCtx.createOscillator();
    osc.type = "sawtooth";
    const flt = audioCtx.createBiquadFilter();
    flt.type = "lowpass";
    flt.frequency.value = 720;
    osc.frequency.setValueAtTime(196, now);
    osc.frequency.exponentialRampToValueAtTime(293.66, now + 0.26);
    out.gain.setValueAtTime(0.001, now);
    out.gain.linearRampToValueAtTime(0.16, now + 0.06);
    out.gain.exponentialRampToValueAtTime(0.001, now + 0.42);
    osc.connect(flt);
    flt.connect(out);
    osc.start(now);
    osc.stop(now + 0.44);
    trackSource(osc);
  }

  function playLeakSfx() {
    if (!audioCtx || audioMutedState || !noiseBuf) return;
    const now = audioCtx.currentTime;
    // Stone crack
    const nSrc = audioCtx.createBufferSource();
    nSrc.buffer = noiseBuf;
    const flt = audioCtx.createBiquadFilter();
    flt.type = "bandpass";
    flt.frequency.value = 900;
    flt.Q.value = 1.4;
    const ng = makePannedOut(23.5, 0.26);
    ng.gain.setValueAtTime(0.26, now);
    ng.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
    nSrc.connect(flt);
    flt.connect(ng);
    nSrc.start(now, sfxRng() * 0.8, 0.19);
    trackSource(nSrc);

    // Alarm tone
    const out = makePannedOut(23.5, 0.18);
    const osc = audioCtx.createOscillator();
    osc.type = "square";
    osc.frequency.setValueAtTime(520, now);
    osc.frequency.setValueAtTime(390, now + 0.09);
    out.gain.setValueAtTime(0.16, now);
    out.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
    osc.connect(out);
    osc.start(now);
    osc.stop(now + 0.23);
    trackSource(osc);
  }

  function startFallWind() {
    if (!audioCtx || audioMutedState || windSource || !noiseBuf) return;
    const now = audioCtx.currentTime;
    windSource = audioCtx.createBufferSource();
    windSource.buffer = noiseBuf;
    windSource.loop = true;
    const flt = audioCtx.createBiquadFilter();
    flt.type = "bandpass";
    flt.frequency.value = 220;
    flt.Q.value = 3.2;
    windGain = audioCtx.createGain();
    windGain.gain.setValueAtTime(0.001, now);
    windGain.gain.linearRampToValueAtTime(0.09, now + 0.6);
    windSource.connect(flt);
    flt.connect(windGain);
    windGain.connect(masterGain);
    windSource.start(now);
  }

  function stopFallWind() {
    if (windSource) {
      try { windSource.stop(); } catch (e) {}
      windSource = null;
      windGain = null;
    }
  }

  function playFallCollapseSfx() {
    if (!audioCtx || audioMutedState || !noiseBuf) return;
    const now = audioCtx.currentTime;
    const out = makePannedOut(23.5, 0.34);
    const osc = audioCtx.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(98, now);
    osc.frequency.exponentialRampToValueAtTime(28, now + 1.15);
    out.gain.setValueAtTime(0.34, now);
    out.gain.exponentialRampToValueAtTime(0.001, now + 1.25);
    osc.connect(out);
    osc.start(now);
    osc.stop(now + 1.28);
    trackSource(osc);

    const nSrc = audioCtx.createBufferSource();
    nSrc.buffer = noiseBuf;
    const flt = audioCtx.createBiquadFilter();
    flt.type = "lowpass";
    flt.frequency.setValueAtTime(620, now);
    flt.frequency.exponentialRampToValueAtTime(130, now + 1.3);
    const ng = makePannedOut(23.5, 0.28);
    ng.gain.setValueAtTime(0.28, now);
    ng.gain.exponentialRampToValueAtTime(0.001, now + 1.35);
    nSrc.connect(flt);
    flt.connect(ng);
    nSrc.start(now, 0, 1.4);
    trackSource(nSrc);

    startFallWind();
  }

  const SHOT_LOUDNESS_PRIO = [0, 3, 1, 4, 2]; //bolt lowest(0), frost(1), flak(2), cannon(3), lance loudest(4)
  function triggerAudioBetween(prevT, curT) {
    if (!audioCtx || audioMutedState || curT <= prevT) return;
    const t0 = Math.floor(prevT * 20);
    const t1 = Math.floor(curT * 20);
    if (t1 <= t0) {
      if (fallTick >= 0 && curT >= fallTime && !windSource) startFallWind();
      return;
    }

    // Fall check
    if (fallTick >= 0 && t0 < fallTick && t1 >= fallTick) {
      playFallCollapseSfx();
    }
    if (fallTick >= 0 && t0 >= fallTick) {
      if (!windSource) startFallWind();
      return;
    }

    const capTick = fallTick >= 0 ? Math.min(t1, fallTick) : t1;

    // Wave horns
    for (let i = 0; i < replay.waves.length; i++) {
      const wv = replay.waves[i].tick;
      if (wv > t0 && wv <= capTick) playWaveHornSfx();
    }

    // Leaks
    for (let i = 0; i < replay.leaks.length; i++) {
      const lk = replay.leaks[i].tick;
      if (lk > t0 && lk <= capTick && lk !== fallTick) playLeakSfx();
    }

    // Rate-limited shots (at most 12 shot sounds per wall-clock second, loudest types first)
    const nowWall = audioCtx.currentTime;
    while (recentShotStamps.length && nowWall - recentShotStamps[0] > 1.0) recentShotStamps.shift();
    let budget = 12 - recentShotStamps.length;
    if (budget > 0) {
      const i0 = upperBoundTick(replay.shots, t0);
      const i1 = upperBoundTick(replay.shots, capTick);
      if (i1 > i0) {
        const batch = [];
        for (let i = i0; i < i1; i++) batch.push(replay.shots[i]);
        batch.sort(function (a, b) {
          return SHOT_LOUDNESS_PRIO[b.typeIdx] - SHOT_LOUDNESS_PRIO[a.typeIdx];
        });
        const count = Math.min(budget, batch.length);
        for (let i = 0; i < count; i++) {
          playShotSfx(batch[i].typeIdx, batch[i].sx / 100);
          recentShotStamps.push(nowWall);
        }
      }
    }

    // Kills
    const k0 = upperBoundTick(replay.kills, t0);
    const k1 = upperBoundTick(replay.kills, capTick);
    const maxK = Math.min(k1, k0 + 2);
    for (let i = k0; i < maxK; i++) {
      playKillSfx(replay.kills[i].x / 100);
    }
  }

  // =========================================================================
  // Section 3: Exact 5-State Timeline & Playback Controls
  // =========================================================================
  const countdownEl = document.getElementById("countdown");
  const btnRefire = document.getElementById("btn-refire");
  const btnToggle = document.getElementById("btn-toggle");
  const iconPause = document.getElementById("icon-pause");
  const iconPlay = document.getElementById("icon-play");
  const speedPills = Array.prototype.slice.call(document.querySelectorAll(".speed-pill"));
  const scrubber = document.getElementById("scrubber");

  let playState = "COUNTDOWN"; // COUNTDOWN | PLAYING | PAUSED | REFIRE_HOLD | ENDED
  let simTime = 0.0;
  let playbackSpeed = 1.0;
  let countdownElapsed = 0.0;
  let holdElapsed = 0.0;
  let scrubbingActive = false;

  function setToggleIcons(showPause) {
    if (showPause) {
      iconPause.style.display = "";
      iconPlay.style.display = "none";
      btnToggle.setAttribute("aria-label", "Pause");
    } else {
      iconPause.style.display = "none";
      iconPlay.style.display = "";
      btnToggle.setAttribute("aria-label", "Play");
    }
  }

  function hideCountdown() {
    countdownEl.style.display = "none";
    countdownEl.textContent = "";
  }

  function syncAudioGate() {
    const shouldHear = playState === "PLAYING" && !scrubbingActive;
    setAudioAudible(shouldHear);
    if (shouldHear && fallTick >= 0 && simTime >= fallTime && !windSource) {
      startFallWind();
    }
  }

  // Play / Pause button
  btnToggle.addEventListener("click", function () {
    resumeAudioOnGesture();
    if (playState === "PLAYING") {
      playState = "PAUSED";
      setToggleIcons(false);
    } else if (playState === "COUNTDOWN" || playState === "REFIRE_HOLD") {
      hideCountdown();
      simTime = 0.0;
      scrubber.value = "0";
      playState = "PAUSED";
      setToggleIcons(false);
      renderAtSimTime(0.0);
    } else if (playState === "PAUSED") {
      playState = "PLAYING";
      setToggleIcons(true);
    } else if (playState === "ENDED") {
      hideCountdown();
      simTime = 0.0;
      scrubber.value = "0";
      stopFallWind();
      playState = "PLAYING";
      setToggleIcons(true);
      renderAtSimTime(0.0);
    }
    syncAudioGate();
  });

  // Silent Re-Fire button -> REFIRE_HOLD (1.000s wall-clock hold, #countdown hidden)
  btnRefire.addEventListener("click", function () {
    resumeAudioOnGesture();
    hideCountdown();
    stopFallWind();
    simTime = 0.0;
    scrubber.value = "0";
    holdElapsed = 0.0;
    playState = "REFIRE_HOLD";
    setToggleIcons(true);
    syncAudioGate();
    renderAtSimTime(0.0);
  });

  // Speed selector pills
  for (let i = 0; i < speedPills.length; i++) {
    speedPills[i].addEventListener("click", function () {
      resumeAudioOnGesture();
      const spd = parseFloat(this.getAttribute("data-speed"));
      if (!isFinite(spd)) return;
      playbackSpeed = spd;
      for (let j = 0; j < speedPills.length; j++) {
        const active = speedPills[j] === this;
        speedPills[j].classList.toggle("is-active", active);
        speedPills[j].setAttribute("aria-checked", active ? "true" : "false");
      }
    });
  }

  // Scrubber slider
  scrubber.addEventListener("pointerdown", function () {
    scrubbingActive = true;
    syncAudioGate();
  });
  window.addEventListener("pointerup", function () {
    if (scrubbingActive) {
      scrubbingActive = false;
      syncAudioGate();
    }
  });
  scrubber.addEventListener("input", function () {
    hideCountdown();
    stopFallWind();
    simTime = Math.max(0, Math.min(DURATION, parseFloat(scrubber.value) || 0));
    playState = "PAUSED";
    setToggleIcons(false);
    syncAudioGate();
    renderAtSimTime(simTime);
  });

  // Render initial resting scene (simTime = 0.000) BEFORE starting COUNTDOWN rAF loop
  countdownEl.style.display = "block";
  countdownEl.textContent = "3";
  scrubber.value = "0";
  setToggleIcons(true);
  renderAtSimTime(0.0);

  let rafStarted = false;
  let lastNow = 0;

  function onFrame(now) {
    requestAnimationFrame(onFrame);
    if (!rafStarted) {
      rafStarted = true;
      lastNow = now;
      countdownElapsed = 0.0;
      return;
    }

    const rawDt = Math.max(0, (now - lastNow) / 1000);
    lastNow = now;
    const dt = Math.min(rawDt, 0.1);

    if (playState === "COUNTDOWN") {
      countdownElapsed += dt;
      if (countdownElapsed < 1.0) {
        countdownEl.style.display = "block";
        countdownEl.textContent = "3";
      } else if (countdownElapsed < 2.0) {
        countdownEl.style.display = "block";
        countdownEl.textContent = "2";
      } else if (countdownElapsed < 3.0) {
        countdownEl.style.display = "block";
        countdownEl.textContent = "1";
      } else {
        hideCountdown();
        playState = "PLAYING";
        syncAudioGate();
        const prevT = simTime;
        simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
        scrubber.value = simTime.toFixed(3);
        triggerAudioBetween(prevT, simTime);
        renderAtSimTime(simTime);
      }
    } else if (playState === "REFIRE_HOLD") {
      holdElapsed += dt;
      if (holdElapsed >= 1.0) {
        playState = "PLAYING";
        syncAudioGate();
      }
    } else if (playState === "PLAYING") {
      const prevT = simTime;
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      if (simTime >= DURATION) {
        simTime = DURATION;
        scrubber.value = DURATION.toFixed(3);
        triggerAudioBetween(prevT, simTime);
        renderAtSimTime(simTime);
        playState = "ENDED";
        setToggleIcons(false);
        syncAudioGate();
      } else {
        scrubber.value = simTime.toFixed(3);
        triggerAudioBetween(prevT, simTime);
        renderAtSimTime(simTime);
      }
    }
  }

  requestAnimationFrame(onFrame);
})();
</script>
</body>
</html>
