<script id="rampart-strategy">
function createStrategy() {
  const TURRET_DMG = {
    bolt: [0, 26, 41, 65],
    cannon: [0, 60, 96, 153],
    frost: [0, 10, 16, 25],
    lance: [0, 180, 288, 460],
    flak: [0, 40, 64, 102]
  };
  const COST = { bolt: 50, cannon: 90, frost: 70, lance: 120, flak: 80 };

  const MID_LAYOUT = [
    "flak", "bolt", "bolt", "cannon", "cannon", "cannon", "cannon", "cannon",
    "cannon", "cannon", "flak", "cannon", "flak", "bolt", "bolt", "bolt"
  ];
  const END_LAYOUT = [
    "cannon", "frost", "frost", "cannon", "cannon", "cannon", "frost", "cannon",
    "cannon", "cannon", "frost", "cannon", "lance", "cannon", "flak", "flak"
  ];
  const BUILD_ORD = [5, 7, 3, 12, 0, 8, 1, 4, 14, 6, 11, 13, 10, 2, 9, 15];
  const REMODEL_ORD = [14, 13, 1, 2, 15, 0, 4, 8, 9, 10, 5, 7, 3, 12, 6, 11];

  const STEPS = [];
  for (let i = 0; i < 6; i++) { const si = BUILD_ORD[i]; STEPS.push([si, MID_LAYOUT[si], 1]); }
  for (let i = 0; i < 4; i++) { const si = BUILD_ORD[i]; if (MID_LAYOUT[si] !== "frost") STEPS.push([si, MID_LAYOUT[si], 2]); }
  for (let i = 6; i < 12; i++) { const si = BUILD_ORD[i]; STEPS.push([si, MID_LAYOUT[si], 1]); }
  for (let i = 4; i < 12; i++) { const si = BUILD_ORD[i]; if (MID_LAYOUT[si] !== "frost") STEPS.push([si, MID_LAYOUT[si], 2]); }
  for (let i = 12; i < 16; i++) { const si = BUILD_ORD[i]; STEPS.push([si, MID_LAYOUT[si], 1]); }
  for (let i = 12; i < 16; i++) { const si = BUILD_ORD[i]; if (MID_LAYOUT[si] !== "frost") STEPS.push([si, MID_LAYOUT[si], 2]); }
  for (let i = 0; i < 16; i++) { const si = BUILD_ORD[i]; if (MID_LAYOUT[si] !== "frost") STEPS.push([si, MID_LAYOUT[si], 3]); }
  for (let i = 0; i < 16; i++) { const si = BUILD_ORD[i]; if (MID_LAYOUT[si] === "frost") { STEPS.push([si, "frost", 2]); STEPS.push([si, "frost", 3]); } }

  return {
    plan(state) {
      const actions = [];
      let gold = state.gold;
      const w = state.wave;
      const slots = [];
      for (let i = 0; i < 16; i++) {
        const s = state.slots[i];
        slots.push({
          slot: s.slot,
          turret: s.turret ? { type: s.turret.type, tier: s.turret.tier, spent: s.turret.spent } : null
        });
      }

      function doBuild(si, tp) {
        const c = COST[tp];
        if (!slots[si].turret && gold >= c && actions.length < 32) {
          gold -= c;
          slots[si].turret = { type: tp, tier: 1, spent: c };
          actions.push({ op: "build", slot: si, type: tp });
          return true;
        }
        return false;
      }

      function doUpgrade(si) {
        const t = slots[si].turret;
        if (t && t.tier < 3 && actions.length < 32) {
          const c = t.tier === 1 ? COST[t.type] : COST[t.type] * 2;
          if (gold >= c) {
            gold -= c;
            t.tier += 1;
            t.spent += c;
            actions.push({ op: "upgrade", slot: si });
            return true;
          }
        }
        return false;
      }

      function doSell(si) {
        const t = slots[si].turret;
        if (t && actions.length < 32) {
          gold += Math.floor((t.spent * 70) / 100);
          slots[si].turret = null;
          actions.push({ op: "sell", slot: si });
          return true;
        }
        return false;
      }

      let bank = 0;
      if (w >= 11 && w < 35 && state.baseHp === 10) {
        bank = Math.min(500, (w - 10) * 90);
      }

      let midDone = true;
      for (let k = 0; k < STEPS.length && actions.length < 32; k++) {
        const step = STEPS[k];
        const si = step[0], tp = step[1], tg = step[2];
        if (tp === "flak" && w < 3) continue;
        const cur = slots[si].turret;
        if (!cur) {
          midDone = false;
          if (gold - COST[tp] >= bank) {
            doBuild(si, tp);
          } else {
            break;
          }
        } else if (cur.type === tp && cur.tier < tg) {
          midDone = false;
          while (cur.tier < tg && actions.length < 32) {
            const c = cur.tier === 1 ? COST[tp] : COST[tp] * 2;
            if (gold - c >= bank) {
              doUpgrade(si);
            } else {
              return actions;
            }
          }
        }
      }

      if (midDone) {
        for (let i = 0; i < REMODEL_ORD.length; i++) {
          const si = REMODEL_ORD[i];
          const cur = slots[si].turret;
          const want = END_LAYOUT[si];
          if (cur && cur.type !== want && actions.length <= 28) {
            const refund = Math.floor((cur.spent * 70) / 100);
            const need = COST[want] * 4;
            if (gold + refund - need >= bank) {
              doSell(si);
              doBuild(si, want);
              doUpgrade(si);
              doUpgrade(si);
            } else {
              break;
            }
          }
        }
      }

      return actions;
    },

    target(turret, candidates) {
      const n = candidates.length;
      if (n === 0) return -1;
      if (n === 1) return candidates[0].id;
      const tp = turret.type;
      const dmg = TURRET_DMG[tp][turret.tier];

      if (tp === "frost") {
        let bestId = candidates[0].id;
        let bestSc = -1e18;
        for (let i = 0; i < n; i++) {
          const c = candidates[i];
          const sl = c.slowed ? 1 : 0;
          let sc = sl ? -200000 : 200000;
          const ml = c.air ? 2800 : 4600;
          sc += ((ml - c.remaining) / ml) * 12000;
          if (!sl) {
            if (c.type === "runner") sc += 2800;
            else if (c.type === "wisp") sc += 2500;
            else if (c.type === "mender") sc += 2600;
            else if (c.type === "brute") sc += 2200;
            else if (c.type === "splitter") sc += 2000;
            else if (c.type === "splitling") sc -= 1200;
          } else if (c.hp <= Math.max(1, dmg - c.armor)) {
            sc += 150000;
          }
          if (sc > bestSc) { bestSc = sc; bestId = c.id; }
        }
        return bestId;
      }

      if (tp === "cannon" || tp === "flak") {
        const sr2 = tp === "cannon" ? 8100 : 4900;
        let minRem = 999999;
        let frontCand = candidates[0];
        for (let i = 0; i < n; i++) {
          if (candidates[i].remaining < minRem) {
            minRem = candidates[i].remaining;
            frontCand = candidates[i];
          }
        }
        const emergency = minRem < 300;
        let bestId = candidates[0].id;
        let bestSc = -1e18;
        for (let i = 0; i < n; i++) {
          const c = candidates[i];
          if (emergency) {
            const dx = c.x - frontCand.x, dy = c.y - frontCand.y;
            if (dx * dx + dy * dy > sr2) continue;
          }
          let tot = 0;
          for (let j = 0; j < n; j++) {
            const o = candidates[j];
            const dx = o.x - c.x, dy = o.y - c.y;
            if (dx * dx + dy * dy <= sr2) {
              const hit = Math.max(1, dmg - o.armor);
              const eff = o.hp <= hit ? o.hp * 1.25 : hit;
              let w = o.type === "mender" ? 2.0 : (o.type === "runner" ? 1.35 : 1.0);
              const ml = o.air ? 2800 : 4600;
              const prog = (ml - o.remaining) / ml;
              w *= (1.0 + 2.2 * prog * prog);
              tot += eff * w;
            }
          }
          if (tot > bestSc) { bestSc = tot; bestId = c.id; }
        }
        return bestId;
      }

      if (tp === "lance") {
        let bestId = candidates[0].id;
        let bestSc = -1e18;
        for (let i = 0; i < n; i++) {
          const c = candidates[i];
          if (c.remaining < 350) {
            const sc = 1e9 - c.remaining * 1000 + Math.min(c.hp, dmg);
            if (sc > bestSc) { bestSc = sc; bestId = c.id; }
            continue;
          }
          const eff = Math.min(c.hp, dmg);
          let m = 1.0;
          if (c.type === "brute") m = 3.0 + c.armor * 0.05;
          else if (c.type === "mender") m = 2.5;
          else if (c.type === "splitling") m = 0.2;
          const sc = eff * m * (1.0 + 2.2 * (4600 - c.remaining) / 4600);
          if (sc > bestSc) { bestSc = sc; bestId = c.id; }
        }
        return bestId;
      }

      let bestId = candidates[0].id;
      let bestSc = -1e18;
      for (let i = 0; i < n; i++) {
        const c = candidates[i];
        const hit = Math.max(1, dmg - c.armor);
        const eff = Math.min(c.hp, hit);
        const ml = c.air ? 2800 : 4600;
        const prog = (ml - c.remaining) / ml;
        let sc = eff * (1.0 + 2.5 * prog * prog) + (c.remaining < 600 ? (600 - c.remaining) * 20 : 0);
        if (c.hp <= hit) sc *= 1.6;
        if (c.type === "wisp") sc *= 1.5;
        else if (c.type === "mender") sc *= 1.8;
        if (sc > bestSc) { bestSc = sc; bestId = c.id; }
      }
      return bestId;
    }
  };
}
</script>

<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks) {
  const rec = arguments.length > 3 ? arguments[3] : null;

  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return (t ^ (t >>> 14)) >>> 0;
    };
  }

  const GROUND_TILES = [[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]];
  const AIR_TILES = [[0,6],[21,6],[21,11],[23,11]];
  const SLOT_TILES = [
    [3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],
    [14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]
  ];

  function buildRoute(tiles) {
    const pts = tiles.map(function (p) { return [p[0] * 100 + 50, p[1] * 100 + 50]; });
    const segs = [];
    let total = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const x0 = pts[i][0], y0 = pts[i][1];
      const x1 = pts[i + 1][0], y1 = pts[i + 1][1];
      const len = Math.abs(x1 - x0) + Math.abs(y1 - y0);
      segs.push({ x0: x0, y0: y0, dx: Math.sign(x1 - x0), dy: Math.sign(y1 - y0), start: total, len: len });
      total += len;
    }
    return { segs: segs, len: total };
  }

  const groundRoute = buildRoute(GROUND_TILES);
  const airRoute = buildRoute(AIR_TILES);

  function posOnRoute(route, progress) {
    for (let i = 0; i < route.segs.length; i++) {
      const s = route.segs[i];
      if (progress <= s.start + s.len || i === route.segs.length - 1) {
        const d = Math.min(s.len, Math.max(0, progress - s.start));
        return [s.x0 + s.dx * d, s.y0 + s.dy * d];
      }
    }
    return [0, 0];
  }

  const TURRET_DEFS = {
    bolt:   { idx: 0, cost: 50,  damage: 26,  period: 8,  range: 300, splash: 0,  slow: 0,  pierce: false, ground: true,  air: true  },
    cannon: { idx: 1, cost: 90,  damage: 60,  period: 24, range: 260, splash: 90, slow: 0,  pierce: false, ground: true,  air: false },
    frost:  { idx: 2, cost: 70,  damage: 10,  period: 12, range: 240, splash: 0,  slow: 30, pierce: false, ground: true,  air: true  },
    lance:  { idx: 3, cost: 120, damage: 180, period: 36, range: 360, splash: 0,  slow: 0,  pierce: true,  ground: true,  air: false },
    flak:   { idx: 4, cost: 80,  damage: 40,  period: 10, range: 320, splash: 70, slow: 0,  pierce: false, ground: false, air: true  }
  };

  const ENEMY_ORDER = ["grunt", "runner", "wisp", "brute", "splitter", "mender"];
  const ENEMY_DEFS = {
    grunt:     { hp: 60,  speed: 10, bounty: 4, leak: 1, air: 0, first: 1, weight: 10 },
    runner:    { hp: 40,  speed: 20, bounty: 4, leak: 1, air: 0, first: 2, weight: 4  },
    wisp:      { hp: 50,  speed: 12, bounty: 6, leak: 2, air: 1, first: 3, weight: 3  },
    brute:     { hp: 150, speed: 6,  bounty: 9, leak: 3, air: 0, first: 4, weight: 3  },
    splitter:  { hp: 90,  speed: 8,  bounty: 6, leak: 2, air: 0, first: 6, weight: 2  },
    mender:    { hp: 70,  speed: 8,  bounty: 7, leak: 2, air: 0, first: 8, weight: 1  },
    splitling: { hp: 0,   speed: 12, bounty: 1, leak: 1, air: 0, first: 999, weight: 0 }
  };

  const rng = mulberry32(seed);
  const hpMults = [0, 1000];
  function getHpMult(w) {
    while (hpMults.length <= w) {
      hpMults.push(Math.floor((hpMults[hpMults.length - 1] * 108) / 100));
    }
    return hpMults[w];
  }

  function genWave(w) {
    const count = 4 + Math.floor((3 * w) / 5);
    const avail = [];
    let wSum = 0;
    for (let i = 0; i < ENEMY_ORDER.length; i++) {
      const name = ENEMY_ORDER[i];
      const d = ENEMY_DEFS[name];
      if (d.first <= w) {
        avail.push(name);
        wSum += d.weight;
      }
    }
    const res = [];
    for (let i = 0; i < count; i++) {
      let r = rng() % wSum;
      let chosen = avail[avail.length - 1];
      for (let j = 0; j < avail.length; j++) {
        const name = avail[j];
        const wt = ENEMY_DEFS[name].weight;
        if (r < wt) { chosen = name; break; }
        r -= wt;
      }
      res.push(chosen);
    }
    return res;
  }

  function turretStats(type, tier) {
    const d = TURRET_DEFS[type];
    let dmg = d.damage;
    for (let t = 2; t <= tier; t++) dmg = Math.floor((dmg * 16) / 10);
    return {
      dmg: dmg,
      range: d.range + 30 * (tier - 1),
      period: d.period,
      splash: d.splash,
      slow: d.slow,
      pierce: d.pierce,
      ground: d.ground,
      air: d.air
    };
  }

  const slots = SLOT_TILES.map(function (p, idx) {
    return { slot: idx, x: p[0] * 100 + 50, y: p[1] * 100 + 50, turret: null };
  });

  const strategy = createStrategy();
  let gold = 250;
  let baseHp = 10;
  let currentWave = 0;
  let nextWaveComp = genWave(1);
  let nextId = 1;
  const spawnQueue = [];
  let enemies = [];
  const log = [];
  let fallTick = -1;

  function makeEnemyObj(type, wave, progress, customMaxHp) {
    const d = ENEMY_DEFS[type];
    const maxHp = customMaxHp !== undefined ? customMaxHp : Math.floor((d.hp * getHpMult(wave)) / 1000);
    let armor = 0;
    if (type === "grunt") armor = Math.floor(wave / 4);
    else if (type === "brute") armor = 6 + wave;
    const route = d.air ? airRoute : groundRoute;
    const pos = posOnRoute(route, progress);
    return {
      id: nextId++,
      type: type,
      wave: wave,
      hp: maxHp,
      maxHp: maxHp,
      speed: d.speed,
      armor: armor,
      bounty: d.bounty,
      leak: d.leak,
      air: d.air,
      route: route,
      progress: progress,
      x: pos[0],
      y: pos[1],
      age: 0,
      slow: 0
    };
  }

  function enemyView(e) {
    return {
      id: e.id,
      type: e.type,
      hp: e.hp,
      maxHp: e.maxHp,
      x: e.x,
      y: e.y,
      air: e.air,
      armor: e.armor,

      slowed: e.slow,

    };
  }

  function recordSnap(tick) {
    if (!rec) return;
    rec.ticks[tick] = {
      tick: tick,
      wave: currentWave,
      gold: gold,
      baseHp: baseHp,
      nextWave: nextWaveComp.slice(),
      slots: slots.map(function (s) {
        return s.turret ? {
          type: s.turret.type,
          tier: s.turret.tier,
          cd: s.turret.cd,
          tx: s.turret.lastTx || 0,
          ty: s.turret.lastTy || 0,
          hasTarget: !!s.turret.hasTarget

      }),
      enemies: enemies.map(function (e) {
        return {
          id: e.id,
          type: e.type,
          hp: e.hp,
          maxHp: e.maxHp,
          x: e.x,
          y: e.y,
          progress: e.progress,
          air: e.air,
          slow: e.slow
        };
      })

  }

  for (let tick = 0; tick < maxTicks; tick++) {
    if (tick >= 20 && (tick - 20) % 40 === 0) {
      const w = 1 + (tick - 20) / 40;
      currentWave = w;
      gold += Math.min(50, Math.floor((gold * 5) / 100)) + 10 + 2 * w;
      const thisWaveComp = nextWaveComp;
      nextWaveComp = genWave(w + 1);
      if (rec) rec.waves.push({ tick: tick, wave: w });

      const state = {
        tick: tick,
        wave: w,
        gold: gold,
        baseHp: baseHp,
        slots: slots.map(function (s) {
          return {
            slot: s.slot,
            x: s.x,
            y: s.y,
            turret: s.turret ? { type: s.turret.type, tier: s.turret.tier, spent: s.turret.spent } : null
          };
        }),
        enemies: enemies.map(enemyView),
        nextWave: nextWaveComp.slice()
      };

      const actions = strategy && typeof strategy.plan === "function" ? strategy.plan(state) : [];
      if (Array.isArray(actions)) {
        const limit = Math.min(32, actions.length);
        for (let i = 0; i < limit; i++) {
          const act = actions[i];
          if (!act || typeof act !== "object") continue;
          const si = act.slot;
          if (!Number.isInteger(si) || si < 0 || si >= 16) continue;
          const sl = slots[si];
          if (act.op === "build") {
            const td = TURRET_DEFS[act.type];
            if (!sl.turret && td && gold >= td.cost) {
              gold -= td.cost;
              sl.turret = { type: act.type, tier: 1, spent: td.cost, cd: 0 };
              log.push([tick, "B", si, td.idx]);
              if (rec) rec.ops.push({ tick: tick, op: "B", slot: si, type: act.type, tier: 1 });
            }
          } else if (act.op === "upgrade") {
            if (sl.turret && sl.turret.tier < 3) {
              const td = TURRET_DEFS[sl.turret.type];
              const upCost = sl.turret.tier === 1 ? td.cost : td.cost * 2;
              if (gold >= upCost) {
                gold -= upCost;
                sl.turret.tier += 1;
                sl.turret.spent += upCost;
                log.push([tick, "U", si, sl.turret.tier]);
                if (rec) rec.ops.push({ tick: tick, op: "U", slot: si, type: sl.turret.type, tier: sl.turret.tier });
              }
            }
          } else if (act.op === "sell") {
            if (sl.turret) {
              const oldType = sl.turret.type;
              gold += Math.floor((sl.turret.spent * 70) / 100);
              sl.turret = null;
              log.push([tick, "S", si, 0]);
              if (rec) rec.ops.push({ tick: tick, op: "S", slot: si, type: oldType, tier: 0 });
            }
          }
        }
      }

      for (let i = 0; i < thisWaveComp.length; i++) {
        spawnQueue.push({ tick: tick + 4 * i, wave: w, idx: i, type: thisWaveComp[i] });
      }
      spawnQueue.sort(function (a, b) {
        return (a.tick - b.tick) || (a.wave - b.wave) || (a.idx - b.idx);
      });
    }

    while (spawnQueue.length > 0 && spawnQueue[0].tick === tick) {
      const sp = spawnQueue.shift();
      enemies.push(makeEnemyObj(sp.type, sp.wave, 0));
    }

    let fell = false;
    const keptAfterMove = [];
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      const moveSpd = e.slow > 0 ? Math.floor((e.speed * 60) / 100) : e.speed;
      e.progress += moveSpd;
      if (e.progress >= e.route.len) {
        const hpBefore = baseHp;
        baseHp -= e.leak;
        log.push([tick, "L", e.id, baseHp]);
        if (rec) rec.leaks.push({ tick: tick, id: e.id, type: e.type, leak: e.leak, hpBefore: hpBefore, hpAfter: baseHp });
        if (baseHp <= 0) {
          log.push([tick, "F", currentWave, 0]);
          fallTick = tick;
          fell = true;
          enemies = keptAfterMove.concat(enemies.slice(i + 1));
          recordSnap(tick);
          break;
        }
      } else {
        const pos = posOnRoute(e.route, e.progress);
        e.x = pos[0];
        e.y = pos[1];
        keptAfterMove.push(e);
      }
    }
    if (fell) break;
    enemies = keptAfterMove;

    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      e.age += 1;
      if (e.type === "mender" && e.age % 20 === 0) {
        if (rec) rec.heals.push({ tick: tick, x: e.x, y: e.y });
        for (let j = 0; j < enemies.length; j++) {
          const o = enemies[j];
          const dx = o.x - e.x, dy = o.y - e.y;
          if (dx * dx + dy * dy <= 22500) {
            o.hp = Math.min(o.maxHp, o.hp + Math.floor((o.maxHp * 8) / 100));
          }
        }
      }
    }

    for (let si = 0; si < 16; si++) {
      const sl = slots[si];
      const t = sl.turret;
      if (!t) continue;
      if (t.cd > 0) {
        t.cd -= 1;
        if (t.cd > 0) continue;
      }
      const st = turretStats(t.type, t.tier);
      const r2 = st.range * st.range;
      const cands = [];
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (e.air ? !st.air : !st.ground) continue;
        const dx = e.x - sl.x, dy = e.y - sl.y;
        if (dx * dx + dy * dy <= r2) cands.push(e);
      }
      if (cands.length === 0) continue;

      let chosen = null;
      if (strategy && typeof strategy.target === "function") {
        const tView = { slot: si, type: t.type, tier: t.tier, x: sl.x, y: sl.y, range: st.range };
        const chosenId = strategy.target(tView, cands.map(enemyView));
        for (let i = 0; i < cands.length; i++) {
          if (cands[i].id === chosenId) { chosen = cands[i]; break; }
        }
      }
      if (!chosen) {
        chosen = cands[0];
        let bestRem = chosen.route.len - chosen.progress;
        for (let i = 1; i < cands.length; i++) {
          const rem = cands[i].route.len - cands[i].progress;
          if (rem < bestRem) {
            bestRem = rem;
            chosen = cands[i];
          }
        }
      }

      if (rec) {
        t.lastTx = chosen.x;
        t.lastTy = chosen.y;
        t.hasTarget = true;
        rec.shots.push({
          tick: tick,
          slot: si,
          type: t.type,
          tier: t.tier,
          sx: sl.x,
          sy: sl.y,
          tx: chosen.x,
          ty: chosen.y,
          tAir: chosen.air,
          splash: st.splash
        });
      }

      if (st.splash > 0) {
        const sr2 = st.splash * st.splash;
        const tx = chosen.x, ty = chosen.y;
        for (let i = 0; i < enemies.length; i++) {
          const e = enemies[i];
          if (e.air ? !st.air : !st.ground) continue;
          const dx = e.x - tx, dy = e.y - ty;
          if (dx * dx + dy * dy <= sr2) {
            const dmg = st.pierce ? st.dmg : Math.max(1, st.dmg - e.armor);
            e.hp -= dmg;
            if (st.slow > 0) e.slow = st.slow;
          }
        }
      } else {
        const dmg = st.pierce ? st.dmg : Math.max(1, st.dmg - chosen.armor);
        chosen.hp -= dmg;
        if (st.slow > 0) chosen.slow = st.slow;
      }

      t.cd = st.period;

      const survivors = [];
      const spawnedSplitlings = [];
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (e.hp <= 0) {
          gold += e.bounty;
          log.push([tick, "K", e.id, si]);
          if (rec) {
            rec.kills.push({ tick: tick, id: e.id, type: e.type, x: e.x, y: e.y, air: e.air });
          }
          if (e.type === "splitter") {
            if (rec) rec.splits.push({ tick: tick, x: e.x, y: e.y });
            const spHp = Math.max(1, Math.floor(e.maxHp / 4));
            for (let k = 0; k < 3; k++) {
              spawnedSplitlings.push(makeEnemyObj("splitling", e.wave, e.progress, spHp));
            }
          }
        } else {
          survivors.push(e);
        }
      }
      enemies = spawnedSplitlings.length > 0 ? survivors.concat(spawnedSplitlings) : survivors;
    }

    for (let i = 0; i < enemies.length; i++) {
      if (enemies[i].slow > 0) enemies[i].slow -= 1;
    }

    recordSnap(tick);
  }

  const endTick = fallTick === -1 ? maxTicks : fallTick;
  const score = Math.round(((endTick - 20) / 40) * 100) / 100;
  const json = JSON.stringify(log);
  let h = 0x811c9dc5;
  for (let i = 0; i < json.length; i++) {
    h ^= json.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  const hash = (h >>> 0).toString(16).padStart(8, "0");
  return { score: score, fallTick: fallTick, log: log, hash: hash };
}

      const sy = pt[1] * 40 + (trng() - 0.5) * 18;
      ctx.fillStyle = trng() > 0.5 ? "rgba(55,62,75,0.35)" : "rgba(18,20,26,0.4)";
      ctx.fillRect(sx - 4, sy - 3, 8, 6);
    }

    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = 4;
    return tex;
  }

  const boardGroup = new THREE.Group();

  // Raised road curbs along ground path tiles

  // Entry portals (ground at (0,2) and air at (0,6))

  const airBeacon = new THREE.Mesh(

  // Faint glowing air lane ribbon at y = 0.8 + subtle ground trace
  const airMat = makeBasicMat({ color: 0x2ee6ff, transparent: true, opacity: 0.18, side: THREE.DoubleSide, depthWrite: false });

  const rockInst = new THREE.InstancedMesh(

  // 16 Build Pads (low stone platforms)
  const padOuterMat = makeStdMat({ color: 0x4b515e, roughness: 0.72, metalness: 0.22 });
  const padInnerMat = makeStdMat({ color: 0x2f343f, roughness: 0.8, metalness: 0.28 });
  const padOuterGeo = new THREE.CylinderGeometry(0.44, 0.48, 0.1, 8);
  const padInnerGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.115, 8);
  for (let i = 0; i < 16; i++) {

  // =========================================================================
  // WALLED KEEP AT (23, 11) WITH 10 BREAKABLE WALL CHUNKS & COLLAPSE RUINS
  // =========================================================================
  const keepGroup = new THREE.Group();
  keepGroup.position.set(23.5, 0, 11.5);

  const keepStoneMat = makeStdMat({ color: 0x6d7382, roughness: 0.72, metalness: 0.18, emissive: 0x000000 });

  const turretMats = {

  function buildTurretVariant(type) {
    const root = new THREE.Group();
    const head = new THREE.Group();
    root.add(head);

    if (type === "bolt") {
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.34, 0.22, 8), turretMats.boltDark);

      head.add(turretBody);
      for (let s = -1; s <= 1; s += 2) {

        brl.position.set(s * 0.09, 0.39, 0.28);
        brl.castShadow = true;
        head.add(brl);

      bore.castShadow = true;
      head.add(bore);

      const ped = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.34, 0.3, 6), turretMats.frostBase);
      ped.position.y = 0.22;

      const gem = new THREE.Mesh(new THREE.OctahedronGeometry(0.18, 0), turretMats.frostMain);
      gem.position.y = 0.98;
      head.add(gem);
    } else if (type === "lance") {
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.38, 0.32, 6), turretMats.lanceDark);
      base.position.y = 0.23;
      base.castShadow = true;

      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.38, 0.24, 8), turretMats.flakDark);
      base.position.y = 0.19;

      pod.rotation.x = -0.55;
      pod.castShadow = true;
      head.add(pod);
      for (let sx = -1; sx <= 1; sx += 2) {

      const rg = new THREE.Group();

      root.add(rg);
      tierRings.push(rg);
    }

    root.visible = false;
    return { root: root, head: head, tierRings: tierRings };
  }

  const TURRET_TYPES = ["bolt", "cannon", "frost", "lance", "flak"];

  for (let i = 0; i < 16; i++) {

    const sz = SLOT_TILES[i][1] + 0.5;

    holder.position.set(sx, 0, sz);

    const variants = {};
    for (let k = 0; k < TURRET_TYPES.length; k++) {

      holder.add(v.root);
      variants[tp] = v;
    }
    slotVisuals.push({ x: sx, z: sz, holder: holder, variants: variants, yaw: 0 });
  }

  // =========================================================================
  // INSTANCED ENEMIES (SILHOUETTES, COLOURS, SLOW TINT, SHADOWS & HP BARS)
  // =========================================================================
  const MAX_ENEMY_INST = 256;
  const ENEMY_TYPES = ["grunt", "brute", "runner", "wisp", "splitter", "splitling", "mender"];

  function createInstancedPart(geo, mat, castShad) {
    const im = new THREE.InstancedMesh(geo, mat, MAX_ENEMY_INST);
    im.frustumCulled = false;
    im.castShadow = !!castShad;
    im.receiveShadow = false;
    const white = new THREE.Color(0xffffff);
    for (let i = 0; i < MAX_ENEMY_INST; i++) im.setColorAt(i, white);
    im.instanceColor.needsUpdate = true;
    im.count = 0;
    scene.add(im);
    return im;
  }

  // Distinct geometric silhouettes & colour families readable at 1280x650 quarter size:

    },

      hpY: 0.82, baseY: 0.28
    },
    runner: {
      body: createInstancedPart(runnerGeo, makeStdMat({ color: 0xffd624, roughness: 0.38, metalness: 0.2, emissive: 0x4a3900, emissiveIntensity: 0.3 }), true),
      acc:  createInstancedPart(new THREE.BoxGeometry(0.36, 0.08, 0.22), makeStdMat({ color: 0xfff38a, roughness: 0.3, metalness: 0.2 }), false),
      hpY: 0.56, baseY: 0.22
    },
    wisp: {
      body: createInstancedPart(new THREE.OctahedronGeometry(0.24, 0), makeBasicMat({ color: 0x26f7ff }), false),
      acc:  createInstancedPart(new THREE.TorusGeometry(0.31, 0.035, 6, 16), makeBasicMat({ color: 0x99ffff, transparent: true, opacity: 0.68 }), false),
      hpY: 1.25, baseY: 0.8
    },
    splitter: {

  function createDigitMaterials() {
    const mats = [];
    for (let d = 0; d <= 9; d++) {
      const c = document.createElement("canvas");
      c.width = 96;
      c.height = 128;
      const ctx = c.getContext("2d");
      ctx.clearRect(0, 0, 96, 128);
      ctx.font = "800 104px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.lineWidth = 10;
      ctx.strokeStyle = "rgba(6, 8, 14, 0.78)";
      ctx.strokeText(String(d), 48, 68);
      ctx.fillStyle = "#ffffff";
      ctx.fillText(String(d), 48, 68);
      const tex = new THREE.CanvasTexture(c);
      tex.encoding = THREE.sRGBEncoding;
      mats.push(new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthTest: false, depthWrite: false }));
    }
    return mats;
  }

  // 10 Base HP pips in top-right corner

  function layoutNumber(pool, num, leftX, centerY, heightPx) {
    const str = String(Math.max(0, Math.floor(num)));
    const charW = heightPx * 0.64;
    const stepX = heightPx * 0.56;
    for (let i = 0; i < pool.quads.length; i++) {
      const q = pool.quads[i];
      if (i < str.length) {
        const d = str.charCodeAt(i) - 48;
        q.material = pool.mats[d >= 0 && d <= 9 ? d : 0];
        q.scale.set(charW, heightPx, 1);
        q.position.set(leftX + i * stepX + charW * 0.5, centerY, 0.2);
        q.visible = true;
      } else {
        q.visible = false;
      }
    }
    return leftX + str.length * stepX;
  }

  function updateHud(snap, simTime) {
    hudCamera.left = 0;
    hudCamera.right = viewW;
    hudCamera.top = viewH;
    hudCamera.bottom = 0;
    hudCamera.updateProjectionMatrix();

    const padX = Math.max(16, Math.round(viewW * 0.018));
    const padY = Math.max(14, Math.round(viewH * 0.022));

    // 1. Wave number (>= 7% of viewport height)
    const waveH = Math.max(46, Math.round(viewH * 0.078));
    const waveY = viewH - padY - waveH * 0.5;
    let wavePop = 1.0;
    if (snap.wave > 0) {
      const wStartT = (20 + 40 * (snap.wave - 1)) / 20;
      const dtW = simTime - wStartT;
      if (dtW >= 0 && dtW < 0.28) {
        wavePop = 1.0 + 0.18 * Math.sin((dtW / 0.28) * Math.PI);
      }
    }
    const iconSize = waveH * 0.72;
    waveIconGroup.position.set(padX + iconSize * 0.5, waveY, 0);
    waveIconGroup.scale.set(iconSize * wavePop, iconSize * wavePop, 1);
    layoutNumber(waveDigits, snap.wave, padX + iconSize + waveH * 0.14, waveY, waveH * wavePop);

    // 2. Gold under wave number
    const goldH = Math.max(26, Math.round(viewH * 0.044));
    const goldY = waveY - waveH * 0.56 - goldH * 0.52;
    const coinSize = goldH * 0.76;
    coinIconGroup.position.set(padX + coinSize * 0.55, goldY, 0);
    coinIconGroup.scale.set(coinSize, coinSize, 1);
    layoutNumber(goldDigits, snap.gold, padX + coinSize * 1.25, goldY, goldH);

    // 3. Next-wave preview under gold
    const prevH = Math.max(18, Math.round(viewH * 0.031));
    const prevY = goldY - goldH * 0.58 - prevH * 0.62;
    const counts = { grunt: 0, runner: 0, wisp: 0, brute: 0, splitter: 0, mender: 0 };
    for (let i = 0; i < snap.nextWave.length; i++) {
      const k = snap.nextWave[i];
      if (counts[k] !== undefined) counts[k]++;
    }
    let curX = padX;
    for (let i = 0; i < previewSlots.length; i++) {
      const ps = previewSlots[i];
      const cnt = counts[ps.type];
      if (cnt > 0) {
        ps.group.visible = true;
        const icSz = prevH * 0.95;
        ps.group.position.set(curX + icSz * 0.5, prevY, 0);
        ps.group.scale.set(icSz, icSz, 1);
        curX = layoutNumber(ps.digits, cnt, curX + icSz + 2, prevY, prevH) + prevH * 0.48;
      } else {
        ps.group.visible = false;
        for (let q = 0; q < ps.digits.quads.length; q++) ps.digits.quads[q].visible = false;
      }
    }

    // 4. Base HP 10 pips in top-right corner
    const pipH = Math.max(18, Math.round(viewH * 0.032));
    const pipW = Math.round(pipH * 0.68);
    const pipGap = Math.max(4, Math.round(pipW * 0.26));
    const totalPipW = 10 * pipW + 9 * pipGap;
    const startPipX = viewW - padX - totalPipW + pipW * 0.5;
    const pipY = viewH - padY - pipH * 0.55;

    for (let i = 0; i < 10; i++) {
      const pip = hpPips[i];
      pip.holder.position.set(startPipX + i * (pipW + pipGap), pipY, 0);
      pip.holder.scale.set(pipW, pipH, 1);
      if (i < snap.baseHp) {
        pip.fill.visible = true;
        pip.fillMat.color.setHex(snap.baseHp <= 3 ? 0xff3b3b : 0xf25244);
      } else {
        const dtLoss = simTime - pipLossTime[i];
        if (dtLoss >= 0 && dtLoss < 0.35) {
          pip.fill.visible = true;
          const fl = 1.0 - dtLoss / 0.35;
          pip.fillMat.color.setRGB(1.0, 0.5 + 0.5 * fl, 0.5 + 0.5 * fl);
          pip.holder.scale.set(pipW * (1 + 0.25 * fl), pipH * (1 + 0.25 * fl), 1);
        } else {
          pip.fill.visible = false;
        }
      }
    }
  }

  // =========================================================================
  // SYNTHESIZED WEB AUDIO SFX ENGINE (NO EXTERNAL FILES, NO MUSIC)
  // =========================================================================
  const audioRng = mulberry32(4242);
  let audioCtx = null;
  let masterGain = null;
  let compressor = null;
  let noiseBuf = null;
  let windSource = null;
  let windGain = null;
  let activeNodes = [];
  let shotSoundStamps = [];
  let lastKillSoundWall = 0;

  function initAudio() {
    if (audioCtx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      audioCtx = new AC();
      compressor = audioCtx.createDynamicsCompressor();
      compressor.threshold.value = -14;
      compressor.knee.value = 18;
      compressor.ratio.value = 6;
      compressor.attack.value = 0.003;
      compressor.release.value = 0.15;

      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.0;
      masterGain.connect(compressor);
      compressor.connect(audioCtx.destination);

      const len = audioCtx.sampleRate * 2;
      noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const data = noiseBuf.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0;
      for (let i = 0; i < len; i++) {
        const w = audioRng() * 2 - 1;
        b0 = 0.997 * b0 + w * 0.029;
        b1 = 0.985 * b1 + w * 0.032;
        b2 = 0.950 * b2 + w * 0.048;
        data[i] = Math.max(-1, Math.min(1, (b0 + b1 + b2 + w * 0.18) * 1.4));
      }

      // Continuous low post-fall wind (silent until PLAYING && simTime >= FALL_TIME)
      windSource = audioCtx.createBufferSource();
      windSource.buffer = noiseBuf;
      windSource.loop = true;
      const windFilter = audioCtx.createBiquadFilter();
      windFilter.type = "bandpass";
      windFilter.frequency.value = 175;
      windFilter.Q.value = 1.8;
      windGain = audioCtx.createGain();
      windGain.gain.value = 0.0;
      windSource.connect(windFilter);
      windFilter.connect(windGain);
      windGain.connect(masterGain);
      windSource.start();

      audioCtx.resume().catch(function () {});
    } catch (err) {
      audioCtx = null;
    }
  }

  function resumeAudioOnGesture() {
    initAudio();
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume().catch(function () {});
    }
  }
  window.addEventListener("pointerdown", resumeAudioOnGesture, { passive: true });
  window.addEventListener("keydown", resumeAudioOnGesture, { passive: true });
  initAudio();

  function trackNode(node) {
    activeNodes.push(node);
    node.onended = function () {
      const idx = activeNodes.indexOf(node);
      if (idx !== -1) activeNodes.splice(idx, 1);
    };
  }

  function createPannedDest(boardX) {
    if (audioCtx.createStereoPanner) {
      const pan = audioCtx.createStereoPanner();
      pan.pan.value = Math.max(-0.85, Math.min(0.85, (boardX / 24) * 1.7 - 0.85));
      pan.connect(masterGain);
      return pan;
    }
    return masterGain;
  }

  function setAudioAudible(audible, inPostFall) {
    if (!audioCtx || !masterGain) return;
    const now = audioCtx.currentTime;
    masterGain.gain.cancelScheduledValues(now);
    masterGain.gain.setValueAtTime(masterGain.gain.value, now);
    if (audible) {
      masterGain.gain.linearRampToValueAtTime(0.78, now + 0.035);
      if (windGain) {
        windGain.gain.cancelScheduledValues(now);
        windGain.gain.setValueAtTime(windGain.gain.value, now);
        windGain.gain.linearRampToValueAtTime(inPostFall ? 0.22 : 0.0, now + 0.08);
      }
    } else {
      masterGain.gain.linearRampToValueAtTime(0.0, now + 0.035);
      if (windGain) {
        windGain.gain.cancelScheduledValues(now);
        windGain.gain.setValueAtTime(windGain.gain.value, now);
        windGain.gain.linearRampToValueAtTime(0.0, now + 0.035);
      }
      const toStop = activeNodes.slice();
      activeNodes.length = 0;
      for (let i = 0; i < toStop.length; i++) {
        try { toStop[i].stop(now + 0.04); } catch (e) {}
      }
    }
  }

  function playShotSound(type, boardX) {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const dest = createPannedDest(boardX);
    const jitter = 0.96 + audioRng() * 0.08;

    if (type === "lance") {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(540 * jitter, now);
      osc.frequency.exponentialRampToValueAtTime(95, now + 0.11);
      g.gain.setValueAtTime(0.16, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.connect(g); g.connect(dest);
      osc.start(now); osc.stop(now + 0.125);
      trackNode(osc);
    } else if (type === "cannon") {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(155 * jitter, now);
      osc.frequency.exponentialRampToValueAtTime(38, now + 0.13);
      g.gain.setValueAtTime(0.22, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
      osc.connect(g); g.connect(dest);
      osc.start(now); osc.stop(now + 0.145);
      trackNode(osc);

      const ns = audioCtx.createBufferSource();
      ns.buffer = noiseBuf;
      const flt = audioCtx.createBiquadFilter();
      flt.type = "lowpass";
      flt.frequency.value = 380;
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(0.14, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
      ns.connect(flt); flt.connect(ng); ng.connect(dest);
      ns.start(now, audioRng() * 1.2, 0.12);
      trackNode(ns);
    } else if (type === "flak") {
      const ns = audioCtx.createBufferSource();
      ns.buffer = noiseBuf;
      const flt = audioCtx.createBiquadFilter();
      flt.type = "bandpass";
      flt.frequency.value = 1350 * jitter;
      flt.Q.value = 2.2;
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(0.15, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + 0.085);
      ns.connect(flt); flt.connect(ng); ng.connect(dest);
      ns.start(now, audioRng() * 1.2, 0.09);
      trackNode(ns);
    } else if (type === "frost") {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(1320 * jitter, now);
      osc.frequency.exponentialRampToValueAtTime(860, now + 0.09);
      g.gain.setValueAtTime(0.09, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.095);
      osc.connect(g); g.connect(dest);
      osc.start(now); osc.stop(now + 0.1);
      trackNode(osc);
    } else {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(720 * jitter, now);
      osc.frequency.exponentialRampToValueAtTime(240, now + 0.05);
      g.gain.setValueAtTime(0.09, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.055);
      osc.connect(g); g.connect(dest);
      osc.start(now); osc.stop(now + 0.06);
      trackNode(osc);
    }
  }

  function playKillSound(boardX) {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    if (now - lastKillSoundWall < 0.045) return;
    lastKillSoundWall = now;
    const dest = createPannedDest(boardX);
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(290 + audioRng() * 50, now);
    osc.frequency.exponentialRampToValueAtTime(95, now + 0.05);
    g.gain.setValueAtTime(0.08, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.055);
    osc.connect(g); g.connect(dest);
    osc.start(now); osc.stop(now + 0.06);
    trackNode(osc);
  }

  function playWaveHorn() {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const dest = createPannedDest(2.0);
    const osc = audioCtx.createOscillator();
    const flt = audioCtx.createBiquadFilter();
    const g = audioCtx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(196, now);
    osc.frequency.exponentialRampToValueAtTime(293.66, now + 0.34);
    flt.type = "lowpass";
    flt.frequency.value = 760;
    g.gain.setValueAtTime(0.001, now);
    g.gain.linearRampToValueAtTime(0.14, now + 0.06);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.42);
    osc.connect(flt); flt.connect(g); g.connect(dest);
    osc.start(now); osc.stop(now + 0.44);
    trackNode(osc);
  }

  function playLeakSound() {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const dest = createPannedDest(23.0);

    const ns = audioCtx.createBufferSource();
    ns.buffer = noiseBuf;
    const flt = audioCtx.createBiquadFilter();
    flt.type = "bandpass";
    flt.frequency.value = 920;
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.28, now);
    ng.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
    ns.connect(flt); flt.connect(ng); ng.connect(dest);
    ns.start(now, 0.2, 0.2);
    trackNode(ns);

    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(440, now);
    osc.frequency.setValueAtTime(311.13, now + 0.11);
    g.gain.setValueAtTime(0.14, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
    osc.connect(g); g.connect(dest);
    osc.start(now); osc.stop(now + 0.27);
    trackNode(osc);
  }

  function playFallCollapse() {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const dest = createPannedDest(22.5);

    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(72, now);
    osc.frequency.exponentialRampToValueAtTime(24, now + 1.35);
    const flt = audioCtx.createBiquadFilter();
    flt.type = "lowpass";
    flt.frequency.value = 180;
    g.gain.setValueAtTime(0.42, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 1.45);
    osc.connect(flt); flt.connect(g); g.connect(dest);
    osc.start(now); osc.stop(now + 1.5);
    trackNode(osc);

    const ns = audioCtx.createBufferSource();
    ns.buffer = noiseBuf;
    const nflt = audioCtx.createBiquadFilter();
    nflt.type = "lowpass";
    nflt.frequency.setValueAtTime(620, now);
    nflt.frequency.exponentialRampToValueAtTime(110, now + 1.3);
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.36, now);
    ng.gain.exponentialRampToValueAtTime(0.001, now + 1.4);
    ns.connect(nflt); nflt.connect(ng); ng.connect(dest);
    ns.start(now, 0, 1.45);
    trackNode(ns);
  }

  const LOUDNESS_RANK = { lance: 5, cannon: 4, flak: 3, frost: 2, bolt: 1 };

  function triggerAudioSpan(prevSim, curSim) {
    if (!audioCtx || audioCtx.state !== "running") return;
    const t0 = Math.floor(prevSim * 20);
    const t1 = Math.floor(curSim * 20);
    if (t1 <= t0) return;
    const minTick = Math.max(t0 + 1, t1 - 3);

    // Wave horns
    for (let i = lowerBoundTick(replayRec.waves, minTick); i < replayRec.waves.length; i++) {
      const w = replayRec.waves[i];
      if (w.tick > t1) break;
      playWaveHorn();
    }

    // Leaks & Fall
    for (let i = lowerBoundTick(replayRec.leaks, minTick); i < replayRec.leaks.length; i++) {
      const lk = replayRec.leaks[i];
      if (lk.tick > t1) break;
      if (FALL_TICK >= 0 && lk.tick === FALL_TICK && lk.hpAfter <= 0) {
        playFallCollapse();
      } else {
        playLeakSound();
      }
    }

    if (FALL_TICK >= 0 && t0 >= FALL_TICK) return;

    // Rate-limited turret shots: <= 12 per wall-clock second, loudest types first
    const nowWall = audioCtx.currentTime;
    while (shotSoundStamps.length > 0 && nowWall - shotSoundStamps[0] > 1.0) {
      shotSoundStamps.shift();
    }
    const dueShots = [];
    for (let i = lowerBoundTick(replayRec.shots, minTick); i < replayRec.shots.length; i++) {
      const sh = replayRec.shots[i];
      if (sh.tick > t1) break;
      dueShots.push(sh);
    }
    dueShots.sort(function (a, b) { return (LOUDNESS_RANK[b.type] || 0) - (LOUDNESS_RANK[a.type] || 0); });
    for (let i = 0; i < dueShots.length && shotSoundStamps.length < 12; i++) {
      shotSoundStamps.push(nowWall);
      playShotSound(dueShots[i].type, dueShots[i].sx / 100);
    }

    // Soft kill pops
    for (let i = lowerBoundTick(replayRec.kills, minTick); i < replayRec.kills.length; i++) {
      const kl = replayRec.kills[i];
      if (kl.tick > t1) break;
      playKillSound(kl.x / 100);
      break;
    }
  }

  // =========================================================================
  // FRAME-EXACT DETERMINISTIC SCENE RENDER AT ANY simTime IN [0, 100]
  // =========================================================================
  const tmpQuat = new THREE.Quaternion();
  const tmpColor = new THREE.Color();
  const upAxis = new THREE.Vector3(0, 1, 0);
  const zAxis = new THREE.Vector3(0, 0, 1);
  const dirVec = new THREE.Vector3();

  function renderAtSimTime(simTime) {
    const clampedSim = Math.max(0, Math.min(DURATION, simTime));
    const isFrozen = FALL_TICK >= 0 && clampedSim >= FALL_TIME;
    const boardSim = isFrozen ? FALL_TIME : clampedSim;

    // Desaturation after fall (smoothly 0 -> 0.92 over 1.0s after FALL_TIME)
    if (isFrozen) {
      uDesat.value = Math.min(1.0, Math.max(0.0, clampedSim - FALL_TIME)) * 0.92;
    } else {
      uDesat.value = 0.0;
    }

    // Camera trauma shake (closed-form in simTime)
    const trauma = getTraumaAt(clampedSim);
    const shakeMag = trauma * trauma * 0.25;
    const sx = shakeMag * smoothNoise(clampedSim * 34.0, 1);
    const sy = shakeMag * smoothNoise(clampedSim * 37.0, 2) * 0.6;
    const sz = shakeMag * smoothNoise(clampedSim * 41.0, 3);
    camera.position.set(baseCamPos.x + sx, baseCamPos.y + sy, baseCamPos.z + sz);
    camera.lookAt(baseCamTarget.x + sx * 0.6, baseCamTarget.y, baseCamTarget.z + sz * 0.6);
    camera.updateMatrixWorld();

    // Tick snapshot & interpolation factor
    const maxSnapIdx = replayRec.ticks.length - 1;
    let k, kNext, alpha;
    if (isFrozen) {
      k = maxSnapIdx;
      kNext = maxSnapIdx;
      alpha = 0;
    } else {
      const exactTick = Math.min(2019, Math.max(0, boardSim * 20));
      k = Math.min(maxSnapIdx, Math.floor(exactTick));
      kNext = Math.min(maxSnapIdx, k + 1);
      alpha = exactTick - Math.floor(exactTick);
    }
    const snap = replayRec.ticks[k];
    const nextMap = tickEnemyMaps[kNext];

    // 1. Update Turrets on 16 Slots
    for (let si = 0; si < 16; si++) {
      const vis = slotVisuals[si];
      const st = snap.slots[si];
      for (let t = 0; t < TURRET_TYPES.length; t++) {
        vis.variants[TURRET_TYPES[t]].root.visible = false;
      }
      if (st) {
        const v = vis.variants[st.type];
        v.root.visible = true;
        for (let r = 0; r < 3; r++) {
          v.tierRings[r].visible = r < st.tier;
        }
        if (st.type === "frost") {
          v.head.rotation.y = boardSim * 2.4;
        } else if (st.hasTarget) {
          const dx = st.tx / 100 - vis.x;
          const dz = st.ty / 100 - vis.z;
          v.head.rotation.y = Math.atan2(dx, dz);
        }
      }
    }

    // 2. Update Instanced Enemies, Shadows, Slow Rings & Health Bars
    const counts = { grunt: 0, brute: 0, runner: 0, wisp: 0, splitter: 0, splitling: 0, mender: 0 };
    let wispShadCount = 0;
    let slowCount = 0;
    let hpCount = 0;

    for (let i = 0; i < snap.enemies.length; i++) {
      const e0 = snap.enemies[i];
      const tp = e0.type;
      const idx = counts[tp];
      if (idx >= MAX_ENEMY_INST) continue;
      counts[tp] = idx + 1;

      const e1 = nextMap.get(e0.id);
      const route = e0.air ? airRoute : groundRoute;
      let prog, hpNow;
      if (e1) {
        prog = e0.progress + (e1.progress - e0.progress) * alpha;
        hpNow = e0.hp + (e1.hp - e0.hp) * alpha;
      } else {
        const spd = e0.slow > 0 ? Math.floor((BASE_SPEED[tp] * 60) / 100) : BASE_SPEED[tp];
        prog = Math.min(route.len, e0.progress + spd * alpha);
        hpNow = e0.hp;
      }

      const pos = sampleRouteWorld(route, prog);
      const pBack = sampleRouteWorld(route, Math.max(0, prog - 14));
      const pFwd = sampleRouteWorld(route, Math.min(route.len, prog + 14));
      const yaw = Math.atan2(pFwd[0] - pBack[0], pFwd[1] - pBack[1]);

      const em = enemyMeshes[tp];
      const bob = tp === "wisp" ? Math.sin(boardSim * 6.5 + e0.id) * 0.05 : Math.abs(Math.sin(prog * 0.09)) * 0.035;
      const wy = em.baseY + bob;

      dummyObj.position.set(pos[0], wy, pos[1]);
      dummyObj.rotation.set(0, yaw, 0);
      dummyObj.scale.set(1, 1, 1);
      dummyObj.updateMatrix();
      em.body.setMatrixAt(idx, dummyObj.matrix);

      // Accent part positioning per silhouette
      if (tp === "grunt") {
        dummyObj.position.set(pos[0], wy + 0.19, pos[1]);
      } else if (tp === "brute") {
        dummyObj.position.set(pos[0], wy + 0.08, pos[1]);
      } else if (tp === "runner") {
        dummyObj.position.set(pos[0], wy - 0.04, pos[1]);
      } else if (tp === "wisp") {
        dummyObj.rotation.set(Math.PI / 2, boardSim * 3.0 + e0.id, 0);
      } else if (tp === "splitter") {
        dummyObj.rotation.set(Math.PI / 2, yaw + boardSim * 2.2, 0);
      } else if (tp === "splitling") {
        dummyObj.position.set(pos[0], wy + 0.06, pos[1]);
      } else if (tp === "mender") {
        dummyObj.position.set(pos[0], wy + 0.31, pos[1]);
        dummyObj.rotation.set(Math.PI / 2, 0, 0);
      }
      dummyObj.updateMatrix();
      em.acc.setMatrixAt(idx, dummyObj.matrix);

      // Frost-blue tint on slowed enemies
      if (e0.slow > 0) {
        tmpColor.setHex(0x63e5ff);
      } else {
        tmpColor.setHex(0xffffff);
      }
      em.body.setColorAt(idx, tmpColor);
      em.acc.setColorAt(idx, tmpColor);

      if (e0.air && wispShadCount < MAX_ENEMY_INST) {
        dummyObj.position.set(pos[0], 0.025, pos[1]);
        dummyObj.rotation.set(0, 0, 0);
        dummyObj.scale.set(1, 1, 1);
        dummyObj.updateMatrix();
        wispShadowInst.setMatrixAt(wispShadCount++, dummyObj.matrix);
      }

      if (e0.slow > 0 && slowCount < MAX_ENEMY_INST) {
        dummyObj.position.set(pos[0], e0.air ? 0.78 : 0.03, pos[1]);
        dummyObj.rotation.set(0, 0, 0);
        dummyObj.scale.set(1, 1, 1);
        dummyObj.updateMatrix();
        slowRingInst.setMatrixAt(slowCount++, dummyObj.matrix);
      }

      // Health bar above enemy facing camera
      if (hpCount < MAX_ENEMY_INST) {
        const frac = Math.max(0.02, Math.min(1.0, hpNow / Math.max(1, e0.maxHp)));
        dummyObj.position.set(pos[0], em.hpY, pos[1]);
        dummyObj.quaternion.copy(camera.quaternion);
        dummyObj.scale.set(1, 1, 1);
        dummyObj.updateMatrix();
        hpBackInst.setMatrixAt(hpCount, dummyObj.matrix);

        dummyObj.position.set(pos[0], em.hpY, pos[1]);
        dummyObj.quaternion.copy(camera.quaternion);
        dummyObj.translateX(-0.21 * (1 - frac));
        dummyObj.scale.set(frac, 1, 1);
        dummyObj.updateMatrix();
        hpFillInst.setMatrixAt(hpCount, dummyObj.matrix);

        if (frac > 0.55) tmpColor.setHex(0x4ef272);
        else if (frac > 0.25) tmpColor.setHex(0xffc83d);
        else tmpColor.setHex(0xff4747);
        hpFillInst.setColorAt(hpCount, tmpColor);
        hpCount++;
      }
    }

    for (let t = 0; t < ENEMY_TYPES.length; t++) {
      const em = enemyMeshes[ENEMY_TYPES[t]];
      em.body.count = counts[ENEMY_TYPES[t]];
      em.acc.count = counts[ENEMY_TYPES[t]];
      em.body.instanceMatrix.needsUpdate = true;
      em.acc.instanceMatrix.needsUpdate = true;
      em.body.instanceColor.needsUpdate = true;
      em.acc.instanceColor.needsUpdate = true;
    }
    wispShadowInst.count = wispShadCount;
    wispShadowInst.instanceMatrix.needsUpdate = true;
    slowRingInst.count = slowCount;
    slowRingInst.instanceMatrix.needsUpdate = true;
    hpBackInst.count = hpCount;
    hpFillInst.count = hpCount;
    hpBackInst.instanceMatrix.needsUpdate = true;
    hpFillInst.instanceMatrix.needsUpdate = true;
    hpFillInst.instanceColor.needsUpdate = true;

    // 3. Shots (<= 0.15s), Mender Heals, Splitter Bursts & Build/Upgrade/Sell Rings
    let beamCount = 0;
    let shellCount = 0;
    let ringCount = 0;
    let debrisCount = 0;

    const shotStartIdx = lowerBoundTick(replayRec.shots, Math.floor((boardSim - 0.16) * 20));
    for (let i = shotStartIdx; i < replayRec.shots.length; i++) {
      const sh = replayRec.shots[i];
      const tEv = sh.tick / 20;
      if (tEv > boardSim) break;
      const dt = boardSim - tEv;
      if (dt < 0 || dt > 0.15) continue;

      const x0 = sh.sx / 100, y0 = 0.48, z0 = sh.sy / 100;
      const x1 = sh.tx / 100, y1 = sh.tAir ? 0.8 : 0.26, z1 = sh.ty / 100;

      if (sh.type === "cannon") {
        if (dt < 0.085 && shellCount < MAX_FX) {
          const u = dt / 0.085;
          dummyObj.position.set(
            x0 + (x1 - x0) * u,
            y0 + (y1 - y0) * u + Math.sin(u * Math.PI) * 0.85,
            z0 + (z1 - z0) * u
          );
          dummyObj.rotation.set(0, 0, 0);
          dummyObj.scale.setScalar(1.0);
          dummyObj.updateMatrix();
          shellInst.setMatrixAt(shellCount++, dummyObj.matrix);
        } else if (ringCount < MAX_FX) {
          const u = (dt - 0.085) / 0.065;
          const rad = 0.9 * (0.35 + 0.65 * u);
          dummyObj.position.set(x1, 0.05, z1);
          dummyObj.rotation.set(0, 0, 0);
          dummyObj.scale.set(rad, 1, rad);
          dummyObj.updateMatrix();
          ringInst.setMatrixAt(ringCount, dummyObj.matrix);
          tmpColor.setHex(0xff9b3d);
          ringInst.setColorAt(ringCount, tmpColor);
          ringCount++;
        }
      } else if (sh.type === "flak") {
        if (beamCount < MAX_FX && dt < 0.07) {
          dirVec.set(x1 - x0, y1 - y0, z1 - z0);
          const len = Math.max(0.05, dirVec.length());
          dummyObj.position.set(x0, y0, z0);
          tmpQuat.setFromUnitVectors(zAxis, dirVec.normalize());
          dummyObj.quaternion.copy(tmpQuat);
          dummyObj.scale.set(0.035, 0.035, len);
          dummyObj.updateMatrix();
          beamInst.setMatrixAt(beamCount, dummyObj.matrix);
          tmpColor.setHex(SHOT_HEX.flak);
          beamInst.setColorAt(beamCount, tmpColor);
          beamCount++;
        }
        if (ringCount < MAX_FX) {
          const u = dt / 0.15;
          const rad = 0.7 * (0.3 + 0.7 * u);
          dummyObj.position.set(x1, 0.8, z1);
          dummyObj.rotation.set(0, 0, 0);
          dummyObj.scale.set(rad, 1, rad);
          dummyObj.updateMatrix();
          ringInst.setMatrixAt(ringCount, dummyObj.matrix);
          tmpColor.setHex(0x38f7d8);
          ringInst.setColorAt(ringCount, tmpColor);
          ringCount++;
        }
      } else if (beamCount < MAX_FX) {
        const fade = 1.0 - dt / 0.15;
        dirVec.set(x1 - x0, y1 - y0, z1 - z0);
        const len = Math.max(0.05, dirVec.length());
        let thick = 0.038;
        if (sh.type === "lance") thick = 0.115 * (0.5 + 0.5 * fade);
        else if (sh.type === "frost") thick = 0.065 * (0.5 + 0.5 * fade);
        else thick = 0.036;

        if (sh.type === "bolt") {
          const u0 = Math.min(0.65, dt / 0.12);
          const segLen = len * 0.35;
          dummyObj.position.set(x0 + (x1 - x0) * u0, y0 + (y1 - y0) * u0, z0 + (z1 - z0) * u0);
          tmpQuat.setFromUnitVectors(zAxis, dirVec.normalize());
          dummyObj.quaternion.copy(tmpQuat);
          dummyObj.scale.set(thick, thick, segLen);
        } else {
          dummyObj.position.set(x0, y0, z0);
          tmpQuat.setFromUnitVectors(zAxis, dirVec.normalize());
          dummyObj.quaternion.copy(tmpQuat);
          dummyObj.scale.set(thick, thick, len);
        }
        dummyObj.updateMatrix();
        beamInst.setMatrixAt(beamCount, dummyObj.matrix);
        tmpColor.setHex(SHOT_HEX[sh.type] || 0xffffff);
        beamInst.setColorAt(beamCount, tmpColor);
        beamCount++;

        if (sh.type === "lance" && ringCount < MAX_FX) {
          const rad = 0.32 * (1.0 - 0.3 * fade);
          dummyObj.position.set(x1, 0.06, z1);
          dummyObj.rotation.set(0, 0, 0);
          dummyObj.scale.set(rad, 1, rad);
          dummyObj.updateMatrix();
          ringInst.setMatrixAt(ringCount, dummyObj.matrix);
          tmpColor.setHex(0xff4262);
          ringInst.setColorAt(ringCount, tmpColor);
          ringCount++;
        }
      }
    }

    // Mender green heal pulse rings (radius 1.50 tiles)
    for (let i = lowerBoundTick(replayRec.heals, Math.floor((boardSim - 0.38) * 20)); i < replayRec.heals.length; i++) {
      const hl = replayRec.heals[i];
      const dt = boardSim - hl.tick / 20;
      if (dt < 0) break;
      if (dt <= 0.35 && ringCount < MAX_FX) {
        const rad = 1.5 * (0.2 + 0.8 * (dt / 0.35));
        dummyObj.position.set(hl.x / 100, 0.06, hl.y / 100);
        dummyObj.rotation.set(0, 0, 0);
        dummyObj.scale.set(rad, 1, rad);
        dummyObj.updateMatrix();
        ringInst.setMatrixAt(ringCount, dummyObj.matrix);
        tmpColor.setHex(0x4dff88);
        ringInst.setColorAt(ringCount, tmpColor);
        ringCount++;
      }
    }

    // Splitter purple death burst rings
    for (let i = lowerBoundTick(replayRec.splits, Math.floor((boardSim - 0.38) * 20)); i < replayRec.splits.length; i++) {
      const sp = replayRec.splits[i];
      const dt = boardSim - sp.tick / 20;
      if (dt < 0) break;
      if (dt <= 0.32 && ringCount < MAX_FX) {
        const rad = 0.72 * (0.25 + 0.75 * (dt / 0.32));
        dummyObj.position.set(sp.x / 100, 0.08, sp.y / 100);
        dummyObj.rotation.set(0, 0, 0);
        dummyObj.scale.set(rad, 1, rad);
        dummyObj.updateMatrix();
        ringInst.setMatrixAt(ringCount, dummyObj.matrix);
        tmpColor.setHex(0xc46eff);
        ringInst.setColorAt(ringCount, tmpColor);
        ringCount++;
      }
    }

    // Build / Upgrade / Sell visual effects on slots
    for (let i = lowerBoundTick(replayRec.ops, Math.floor((boardSim - 0.55) * 20)); i < replayRec.ops.length; i++) {
      const op = replayRec.ops[i];
      const dt = boardSim - op.tick / 20;
      if (dt < 0) break;
      if (dt > 0.5) continue;
      const sx = SLOT_TILES[op.slot][0] + 0.5;
      const sz = SLOT_TILES[op.slot][1] + 0.5;
      const u = dt / 0.5;

      if ((op.op === "B" || op.op === "U") && ringCount < MAX_FX) {
        const rad = 0.55 + u * 0.42;
        dummyObj.position.set(sx, 0.08 + u * (op.op === "U" ? 0.75 : 0.45), sz);
        dummyObj.rotation.set(0, 0, 0);
        dummyObj.scale.set(rad, 1, rad);
        dummyObj.updateMatrix();
        ringInst.setMatrixAt(ringCount, dummyObj.matrix);
        tmpColor.setHex(op.op === "U" ? 0xffe478 : 0x70d6ff);
        ringInst.setColorAt(ringCount, tmpColor);
        ringCount++;
      }
      for (let p = 0; p < 5 && debrisCount < MAX_DEBRIS; p++) {
        const a = (p / 5) * Math.PI * 2 + op.slot;
        if (op.op === "S") {
          const r = 0.18 + u * 0.55;
          const py = Math.max(0.04, 0.38 * (1 - u) - 1.8 * dt * dt);
          dummyObj.position.set(sx + Math.cos(a) * r, py, sz + Math.sin(a) * r);
          dummyObj.scale.setScalar((1 - u * 0.7) * 0.9);
          tmpColor.setHex(0x8a8f9e);
        } else {
          const r = 0.36 * (1 - u * 0.35);
          dummyObj.position.set(sx + Math.cos(a + u * 3) * r, 0.1 + u * 0.95, sz + Math.sin(a + u * 3) * r);
          dummyObj.scale.setScalar((1 - u) * 0.8);
          tmpColor.setHex(op.op === "U" ? 0xfff099 : 0x8ce8ff);
        }
        dummyObj.rotation.set(u * 4, u * 5, 0);
        dummyObj.updateMatrix();
        debrisInst.setMatrixAt(debrisCount, dummyObj.matrix);
        debrisInst.setColorAt(debrisCount, tmpColor);
        debrisCount++;
      }
    }

    // Seeded ballistic kill debris (closed-form in dt since kill)
    for (let i = lowerBoundTick(replayRec.kills, Math.floor((boardSim - 0.48) * 20)); i < replayRec.kills.length; i++) {
      const kl = replayRec.kills[i];
      const dt = boardSim - kl.tick / 20;
      if (dt < 0) break;
      if (dt > 0.45) continue;
      const u = dt / 0.45;
      const bx = kl.x / 100;
      const bz = kl.y / 100;
      const by = kl.air ? 0.8 : 0.24;
      tmpColor.setHex(ENEMY_HEX[kl.type] || 0xffffff);

      for (let p = 0; p < 5 && debrisCount < MAX_DEBRIS; p++) {
        const seedBase = kl.id * 17 + p * 31;
        const ang = hash01(seedBase) * Math.PI * 2;
        const spd = 1.1 + hash01(seedBase + 1) * 2.2;
        const vy = 1.6 + hash01(seedBase + 2) * 2.1;
        const px = bx + Math.cos(ang) * spd * dt;
        const pz = bz + Math.sin(ang) * spd * dt;
        const py = Math.max(0.04, by + vy * dt - 6.5 * dt * dt);
        dummyObj.position.set(px, py, pz);
        dummyObj.rotation.set(dt * 9 * (p + 1), dt * 7, 0);
        dummyObj.scale.setScalar(Math.max(0.05, 1.0 - u));
        dummyObj.updateMatrix();
        debrisInst.setMatrixAt(debrisCount, dummyObj.matrix);
        debrisInst.setColorAt(debrisCount, tmpColor);
        debrisCount++;
      }
    }

    beamInst.count = beamCount;
    beamInst.instanceMatrix.needsUpdate = true;
    beamInst.instanceColor.needsUpdate = true;
    shellInst.count = shellCount;
    shellInst.instanceMatrix.needsUpdate = true;
    ringInst.count = ringCount;
    ringInst.instanceMatrix.needsUpdate = true;
    ringInst.instanceColor.needsUpdate = true;
    debrisInst.count = debrisCount;
    debrisInst.instanceMatrix.needsUpdate = true;
    debrisInst.instanceColor.needsUpdate = true;

    // 4. Keep Leak Flash, Progressive Wall Crumbling & Climactic Fall Collapse
    let leakFlash = 0;
    for (let i = 0; i < replayRec.leaks.length; i++) {
      const dtL = clampedSim - replayRec.leaks[i].tick / 20;
      if (dtL >= 0 && dtL < 0.38) {
        leakFlash = Math.max(leakFlash, 1.0 - dtL / 0.38);
      }
    }
    keepStoneMat.emissive.setRGB(leakFlash * 0.85, leakFlash * 0.08, leakFlash * 0.05);
    keepRoofMat.emissive.setRGB(leakFlash * 0.7, leakFlash * 0.05, 0);

    for (let i = 0; i < 10; i++) {
      const ch = keepChunks[i];
      const tLoss = pipLossTime[i];
      if (clampedSim < tLoss) {
        ch.mesh.visible = true;
        ch.mesh.position.set(ch.ox, ch.oy, ch.oz);
        ch.mesh.rotation.set(0, 0, 0);
        ch.mesh.scale.setScalar(1);
      } else {
        const dtC = Math.min(0.85, clampedSim - tLoss);
        const py = Math.max(0.11, ch.oy + ch.vy * dtC - 7.8 * dtC * dtC);
        const tGround = Math.min(dtC, 0.55);
        ch.mesh.visible = !isFrozen;
        ch.mesh.position.set(ch.ox + ch.vx * tGround, py, ch.oz + ch.vz * tGround);
        ch.mesh.rotation.set(ch.rx * tGround, 0.4 * i, ch.rz * tGround);
        ch.mesh.scale.setScalar(0.82);
      }
    }

    if (isFrozen) {
      const dtF = clampedSim - FALL_TIME;
      const sink = Math.min(1.0, dtF / 0.55);
      keepCore.position.y = -0.78 * sink;
      keepCore.rotation.z = 0.24 * sink;
      keepCore.rotation.x = -0.16 * sink;
      keepGlow.intensity = Math.max(0.05, 1.1 * (1 - sink));

      fallDebrisInst.count = FALL_DEBRIS_COUNT;
      for (let i = 0; i < FALL_DEBRIS_COUNT; i++) {
        const fd = fallDebrisSeeds[i];
        const tB = Math.min(dtF, 1.1);
        const py = Math.max(0.09, fd.oy + fd.vy * tB - 7.2 * tB * tB);
        const tHoriz = py <= 0.091 ? Math.min(tB, (fd.vy + Math.sqrt(fd.vy * fd.vy + 2 * 7.2 * fd.oy)) / 7.2) : tB;
        dummyObj.position.set(fd.ox + fd.vx * tHoriz, py, fd.oz + fd.vz * tHoriz);
        dummyObj.rotation.set(fd.rx * tHoriz, i, fd.rz * tHoriz);
        dummyObj.scale.setScalar(fd.sc);
        dummyObj.updateMatrix();
        fallDebrisInst.setMatrixAt(i, dummyObj.matrix);
      }
      fallDebrisInst.instanceMatrix.needsUpdate = true;

      if (dtF < 1.15) {
        const uS = dtF / 1.15;
        fallShockRing.visible = true;
        const sRad = 0.8 + uS * 14.5;
        fallShockRing.scale.set(sRad, sRad, 1);
        fallShockRing.material.opacity = (1.0 - uS) * 0.85;
      } else {
        fallShockRing.visible = false;
      }
    } else {
      keepCore.position.set(0, 0, 0);
      keepCore.rotation.set(0, 0, 0);
      keepGlow.intensity = 1.1;
      fallDebrisInst.count = 0;
      fallShockRing.visible = false;
    }

    // 5. Update Orthographic HUD & Execute Dual-Pass Render
    updateHud(snap, clampedSim);

    renderer.clear();
    renderer.render(scene, camera);
    renderer.clearDepth();
    renderer.render(hudScene, hudCamera);
  }

  // =========================================================================
  // 5-STATE PLAYBACK STATE MACHINE & DOCK CONTROLS (SECTION 3 & 4)
  // =========================================================================
  const countdownEl = document.getElementById("countdown");
  const btnRefire = document.getElementById("btn-refire");
  const btnToggle = document.getElementById("btn-toggle");
  const iconPause = document.getElementById("icon-pause");
  const iconPlay = document.getElementById("icon-play");
  const scrubber = document.getElementById("scrubber");
  const speedPills = Array.prototype.slice.call(document.querySelectorAll(".speed-pill"));

  let playState = "COUNTDOWN";
  let simTime = 0.0;
  let playbackSpeed = 1.0;
  let countdownElapsed = 0.0;
  let holdElapsed = 0.0;
  let isScrubDragging = false;

  function setToggleIcons(showPause) {
    iconPause.style.display = showPause ? "" : "none";
    iconPlay.style.display = showPause ? "none" : "";
    btnToggle.setAttribute("aria-label", showPause ? "Pause" : "Play");
  }

  function hideCountdown() {
    countdownEl.style.display = "none";
    countdownEl.textContent = "";
  }

  function syncAudioState() {
    const audible = playState === "PLAYING" && !isScrubDragging;
    setAudioAudible(audible, simTime >= FALL_TIME);
  }

  btnToggle.addEventListener("click", function () {
    resumeAudioOnGesture();
    if (playState === "PLAYING") {
      playState = "PAUSED";
      setToggleIcons(false);
    } else if (playState === "COUNTDOWN" || playState === "REFIRE_HOLD") {
      hideCountdown();
      simTime = 0.0;
      scrubber.value = "0";
      playState = "PAUSED";
      setToggleIcons(false);
      renderAtSimTime(simTime);
    } else if (playState === "PAUSED") {
      playState = "PLAYING";
      setToggleIcons(true);
    } else if (playState === "ENDED") {
      hideCountdown();
      simTime = 0.0;
      scrubber.value = "0";
      playState = "PLAYING";
      setToggleIcons(true);
      renderAtSimTime(simTime);
    }
    syncAudioState();
  });

  btnRefire.addEventListener("click", function () {
    resumeAudioOnGesture();
    hideCountdown();
    simTime = 0.0;
    scrubber.value = "0";
    holdElapsed = 0.0;
    playState = "REFIRE_HOLD";
    setToggleIcons(true);
    syncAudioState();
    renderAtSimTime(0.0);
  });

  speedPills.forEach(function (pill) {
    pill.addEventListener("click", function () {
      resumeAudioOnGesture();
      const spd = parseFloat(pill.getAttribute("data-speed"));
      if (!isNaN(spd)) playbackSpeed = spd;
      for (let i = 0; i < speedPills.length; i++) {
        const active = speedPills[i] === pill;
        speedPills[i].classList.toggle("is-active", active);
        speedPills[i].setAttribute("aria-checked", active ? "true" : "false");
      }
    });
  });

  scrubber.addEventListener("pointerdown", function () {
    isScrubDragging = true;
    syncAudioState();
  });
  window.addEventListener("pointerup", function () {
    if (isScrubDragging) {
      isScrubDragging = false;
      syncAudioState();
    }
  });
  scrubber.addEventListener("input", function () {
    hideCountdown();
    simTime = Math.max(0, Math.min(DURATION, parseFloat(scrubber.value) || 0));
    playState = "PAUSED";
    setToggleIcons(false);
    syncAudioState();
    renderAtSimTime(simTime);
  });

  window.addEventListener("resize", function () {
    updateCameraFraming();
    renderAtSimTime(simTime);
  });

  // Render exact initial resting scene (simTime = 0.000) BEFORE starting rAF countdown
  updateCameraFraming();
  countdownEl.style.display = "block";
  countdownEl.textContent = "3";
  scrubber.value = "0";
  setToggleIcons(true);
  renderAtSimTime(0.0);

  let firstRaf = true;
  let lastWallNow = 0;

  function onFrame(now) {
    requestAnimationFrame(onFrame);

    if (firstRaf) {
      firstRaf = false;
      lastWallNow = now;
      if (playState === "COUNTDOWN") {
        countdownElapsed = 0.0;
        countdownEl.style.display = "block";
        countdownEl.textContent = "3";
      }
      return;
    }

    const rawDt = Math.max(0, (now - lastWallNow) / 1000);
    lastWallNow = now;
    const dt = Math.min(rawDt, 0.1);

    if (playState === "COUNTDOWN") {
      countdownElapsed += dt;
      if (countdownElapsed < 1.0) {
        countdownEl.style.display = "block";
        countdownEl.textContent = "3";
      } else if (countdownElapsed < 2.0) {
        countdownEl.style.display = "block";
        countdownEl.textContent = "2";
      } else if (countdownElapsed < 3.0) {
        countdownEl.style.display = "block";
        countdownEl.textContent = "1";
      } else {
        hideCountdown();
        playState = "PLAYING";
        syncAudioState();
        const overDt = Math.max(0, countdownElapsed - 3.0);
        const prevSim = simTime;
        simTime = Math.min(DURATION, overDt * playbackSpeed);
        scrubber.value = simTime.toFixed(3);
        triggerAudioSpan(prevSim, simTime);
        renderAtSimTime(simTime);
      }
    } else if (playState === "REFIRE_HOLD") {
      holdElapsed += dt;
      if (holdElapsed >= 1.0) {
        playState = "PLAYING";
        syncAudioState();
        const overDt = Math.max(0, holdElapsed - 1.0);
        const prevSim = simTime;
        simTime = Math.min(DURATION, overDt * playbackSpeed);
        scrubber.value = simTime.toFixed(3);
        triggerAudioSpan(prevSim, simTime);
        renderAtSimTime(simTime);
      }
    } else if (playState === "PLAYING") {
      const prevSim = simTime;
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      scrubber.value = simTime.toFixed(3);
      triggerAudioSpan(prevSim, simTime);
      if (windGain && audioCtx) {
        const targetWind = simTime >= FALL_TIME ? 0.22 : 0.0;
        windGain.gain.setTargetAtTime(targetWind, audioCtx.currentTime, 0.08);
      }
      renderAtSimTime(simTime);
      if (simTime >= DURATION) {
        simTime = DURATION;
        scrubber.value = DURATION.toFixed(3);
        playState = "ENDED";
        setToggleIcons(false);
        syncAudioState();
        renderAtSimTime(DURATION);
      }
    }
  }

  requestAnimationFrame(onFrame);
})();
</script>
</body>
</html>
