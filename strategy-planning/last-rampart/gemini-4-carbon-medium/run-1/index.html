  // =========================================================================
  // CAMERA FRAMING & RESIZE (Whole board + >=0.5 tile margin, clear of 90px dock)
  // =========================================================================
  function updateCameraFraming() {
    viewW = Math.max(1, window.innerWidth);
    viewH = Math.max(1, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(viewW, viewH, false);

    camera.aspect = viewW / viewH;
    const elev = 55 * Math.PI / 180;
    const dirY = Math.sin(elev);
    const dirZ = Math.cos(elev);

    // Reserve bottom 96px (>= 90px dock) in NDC [-1, 1]
    const bottomSafeNdc = -1 + 2 * (Math.min(viewH * 0.35, 98) / viewH);
    const topSafeNdc = 0.93;
    const xSafeNdc = 0.945;

    // Shift target Z slightly south so board centers above the bottom dock
    const targetShiftZ = 0.85 * (98 / Math.max(360, viewH)) * 6.0;
    camBaseTarget.set(12.0, 0.0, 7.0 + targetShiftZ);

    // Binary search exact distance so [-0.65, 24.65] x [0, 2.0] x [-0.65, 14.65] fits inside safe NDC
    const corners = [
      new THREE.Vector3(-0.65, 0, -0.65),
      new THREE.Vector3(24.65, 0, -0.65),
      new THREE.Vector3(-0.65, 0, 14.65),
      new THREE.Vector3(24.65, 0, 14.65),
      new THREE.Vector3(-0.65, 1.9, -0.65),
      new THREE.Vector3(24.65, 1.9, -0.65),
      new THREE.Vector3(-0.65, 1.9, 14.65),
      new THREE.Vector3(24.65, 1.9, 14.65)
    ];
    const tmpProj = new THREE.Vector3();
    let lo = 12, hi = 65;
    for (let iter = 0; iter < 22; iter++) {
      const mid = (lo + hi) * 0.5;
      camera.position.set(camBaseTarget.x, camBaseTarget.y + dirY * mid, camBaseTarget.z + dirZ * mid);
      camera.lookAt(camBaseTarget);
      camera.updateProjectionMatrix();
      camera.updateMatrixWorld(true);
      let fits = true;
      for (let c = 0; c < corners.length; c++) {
        tmpProj.copy(corners[c]).project(camera);
        if (Math.abs(tmpProj.x) > xSafeNdc || tmpProj.y < bottomSafeNdc || tmpProj.y > topSafeNdc) {
          fits = false;
          break;
        }
      }
      if (fits) hi = mid;
      else lo = mid;
    }
    camBasePos.set(camBaseTarget.x, camBaseTarget.y + dirY * hi, camBaseTarget.z + dirZ * hi);
    camera.position.copy(camBasePos);
    camera.lookAt(camBaseTarget);
    camera.updateProjectionMatrix();

    hudCam.left = 0;
    hudCam.right = viewW;
    hudCam.top = viewH;
    hudCam.bottom = 0;
    hudCam.updateProjectionMatrix();
  }

  // =========================================================================
  // WEB AUDIO SYNTHESIZER (Seed 4242, State-Gated, Rate-Limited, Panned)
  // =========================================================================
  const sfx = (function createAudioSystem() {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return { setPlaying: function () {}, stepForward: function () {} };

    let ctx = null;
    let masterGain = null;
    let compressor = null;
    let noiseBuf = null;
    let windNodes = null;
    const activeOneShots = new Set();
    const audioRng = mulberry32(4242);
    let shotTimestamps = [];
    let killTimestamps = [];
    let isAudible = false;

    function initCtx() {
      if (ctx) return;
      try {
        ctx = new AudioCtx();
        compressor = ctx.createDynamicsCompressor();
        compressor.threshold.value = -16;
        compressor.knee.value = 18;
        compressor.ratio.value = 6;
        compressor.attack.value = 0.003;
        compressor.release.value = 0.15;

        masterGain = ctx.createGain();
        masterGain.gain.value = 0.0001;
        masterGain.connect(compressor);
        compressor.connect(ctx.destination);

        // Prebuild 2s seeded noise buffer (seed 4242)
        const sr = ctx.sampleRate;
        noiseBuf = ctx.createBuffer(1, sr * 2, sr);
        const data = noiseBuf.getChannelData(0);
        for (let i = 0; i < data.length; i++) {
          data[i] = (audioRng() / 4294967296) * 2 - 1;
        }

        if (ctx.state === "suspended") {
          const p = ctx.resume();
          if (p && typeof p.catch === "function") p.catch(function () {});
        }
      } catch (e) {
        ctx = null;
      }
    }

    initCtx();

    function resumeOnGesture() {
      if (!ctx) initCtx();
      if (ctx && ctx.state === "suspended") {
        const p = ctx.resume();
        if (p && typeof p.catch === "function") p.catch(function () {});
      }
    }
    window.addEventListener("pointerdown", resumeOnGesture, { passive: true });
    window.addEventListener("keydown", resumeOnGesture, { passive: true });

    function makePanner(worldX) {
      const panVal = Math.max(-0.9, Math.min(0.9, (worldX - 12) / 11.5));
      if (ctx.createStereoPanner) {
        const pn = ctx.createStereoPanner();
        pn.pan.value = panVal;
        pn.connect(masterGain);
        return pn;
      }
      return masterGain;
    }

    function trackNode(node, stopTime) {
      activeOneShots.add(node);
      node.onended = function () { activeOneShots.delete(node); };
      try { node.stop(stopTime); } catch (e) {}
    }

    function stopAllActive() {
      if (!ctx) return;
      activeOneShots.forEach(function (n) {
        try { n.stop(); } catch (e) {}
      });
      activeOneShots.clear();
      stopWind();
    }

    function startWind() {
      if (!ctx || !noiseBuf || windNodes) return;
      const now = ctx.currentTime;
      const src = ctx.createBufferSource();
      src.buffer = noiseBuf;
      src.loop = true;
      const filt = ctx.createBiquadFilter();
      filt.type = "bandpass";
      filt.frequency.value = 210;
      filt.Q.value = 2.4;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, now);
      g.gain.linearRampToValueAtTime(0.11, now + 0.6);
      src.connect(filt);
      filt.connect(g);
      g.connect(masterGain);
      src.start(now);
      windNodes = { src: src, gain: g };
    }

    function stopWind() {
      if (!windNodes || !ctx) return;
      try {
        windNodes.gain.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.015);
        windNodes.src.stop(ctx.currentTime + 0.05);
      } catch (e) {}
      windNodes = null;
    }

    function setPlaying(playing, simTimeNow) {
      if (!ctx || !masterGain) return;
      const now = ctx.currentTime;
      if (playing && !isAudible) {
        isAudible = true;
        masterGain.gain.cancelScheduledValues(now);
        masterGain.gain.setValueAtTime(Math.max(0.0001, masterGain.gain.value), now);
        masterGain.gain.linearRampToValueAtTime(0.72, now + 0.035);
        if (simTimeNow >= FALL_TIME) startWind();
      } else if (!playing && isAudible) {
        isAudible = false;
        masterGain.gain.cancelScheduledValues(now);
        masterGain.gain.setValueAtTime(masterGain.gain.value, now);
        masterGain.gain.linearRampToValueAtTime(0.0001, now + 0.04);
        stopAllActive();
      }
    }

    function detuneVar(seedKey, span) {
      return (hashFloat(seedKey * 2654435761 + 4242) * 2 - 1) * span;
    }

    function playShotSound(sh) {
      if (!ctx || !isAudible) return;
      const now = ctx.currentTime;
      shotTimestamps = shotTimestamps.filter(function (t) { return now - t < 1.0; });
      if (shotTimestamps.length >= 12) return;
      shotTimestamps.push(now);

      const wx = (sh.x0 + sh.x1) * 0.005;
      const dest = makePanner(wx);
      const jitter = 1 + detuneVar(sh.tick * 17 + sh.slot, 0.06);

      if (sh.type === "lance") {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(440 * jitter, now);
        osc.frequency.exponentialRampToValueAtTime(105, now + 0.11);
        g.gain.setValueAtTime(0.16, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.115);
        osc.connect(g); g.connect(dest);
        osc.start(now);
        trackNode(osc, now + 0.12);
      } else if (sh.type === "cannon") {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(155 * jitter, now);
        osc.frequency.exponentialRampToValueAtTime(42, now + 0.11);
        g.gain.setValueAtTime(0.19, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.connect(g); g.connect(dest);
        osc.start(now);
        trackNode(osc, now + 0.125);
      } else if (sh.type === "flak") {
        const src = ctx.createBufferSource();
        src.buffer = noiseBuf;
        const bp = ctx.createBiquadFilter();
        bp.type = "bandpass";
        bp.frequency.value = 1450 * jitter;
        bp.Q.value = 2.2;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.15, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.075);
        src.connect(bp); bp.connect(g); g.connect(dest);
        src.start(now, (sh.tick % 15) * 0.1, 0.08);
        trackNode(src, now + 0.08);
      } else if (sh.type === "frost") {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(1320 * jitter, now);
        osc.frequency.exponentialRampToValueAtTime(840, now + 0.085);
        g.gain.setValueAtTime(0.09, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
        osc.connect(g); g.connect(dest);
        osc.start(now);
        trackNode(osc, now + 0.095);
      } else {
        // bolt
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(560 * jitter, now);
        osc.frequency.exponentialRampToValueAtTime(195, now + 0.048);
        g.gain.setValueAtTime(0.08, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.052);
        osc.connect(g); g.connect(dest);
        osc.start(now);
        trackNode(osc, now + 0.055);
      }
    }

    function playKillPop(kl) {
      if (!ctx || !isAudible) return;
      const now = ctx.currentTime;
      killTimestamps = killTimestamps.filter(function (t) { return now - t < 1.0; });
      if (killTimestamps.length >= 14) return;
      killTimestamps.push(now);
      const dest = makePanner(kl.x * 0.01);
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(290 * (1 + detuneVar(kl.id, 0.1)), now);
      osc.frequency.exponentialRampToValueAtTime(95, now + 0.05);
      g.gain.setValueAtTime(0.075, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.055);
      osc.connect(g); g.connect(dest);
      osc.start(now);
      trackNode(osc, now + 0.06);
    }

    function playWaveHorn() {
      if (!ctx || !isAudible) return;
      const now = ctx.currentTime;
      const dest = makePanner(2.0);
      const osc = ctx.createOscillator();
      const lp = ctx.createBiquadFilter();
      const g = ctx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(196, now);
      osc.frequency.setValueAtTime(246.94, now + 0.12);
      osc.frequency.exponentialRampToValueAtTime(293.66, now + 0.28);
      lp.type = "lowpass";
      lp.frequency.value = 920;
      g.gain.setValueAtTime(0.001, now);
      g.gain.linearRampToValueAtTime(0.14, now + 0.04);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.42);
      osc.connect(lp); lp.connect(g); g.connect(dest);
      osc.start(now);
      trackNode(osc, now + 0.44);
    }

    function playLeakAlarm() {
      if (!ctx || !isAudible) return;
      const now = ctx.currentTime;
      const dest = makePanner(23.5);
      // Stone crack
      const src = ctx.createBufferSource();
      src.buffer = noiseBuf;
      const bp = ctx.createBiquadFilter();
      bp.type = "bandpass"; bp.frequency.value = 680; bp.Q.value = 1.4;
      const ng = ctx.createGain();
      ng.gain.setValueAtTime(0.24, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
      src.connect(bp); bp.connect(ng); ng.connect(dest);
      src.start(now, 0.2, 0.18);
      trackNode(src, now + 0.18);
      // Alarm tone
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = "square";
      osc.frequency.setValueAtTime(466.16, now);
      osc.frequency.setValueAtTime(349.23, now + 0.11);
      g.gain.setValueAtTime(0.11, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
      osc.connect(g); g.connect(dest);
      osc.start(now);
      trackNode(osc, now + 0.25);
    }

    function playFallCollapse() {
      if (!ctx || !isAudible) return;
      const now = ctx.currentTime;
      const dest = makePanner(23.5);
      // Deep seismic sub-boom + rumble
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(72, now);
      osc.frequency.exponentialRampToValueAtTime(22, now + 1.35);
      g.gain.setValueAtTime(0.38, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 1.4);
      osc.connect(g); g.connect(dest);
      osc.start(now);
      trackNode(osc, now + 1.45);

      const src = ctx.createBufferSource();
      src.buffer = noiseBuf;
      const lp = ctx.createBiquadFilter();
      lp.type = "lowpass"; lp.frequency.setValueAtTime(520, now); lp.frequency.exponentialRampToValueAtTime(95, now + 1.3);
      const ng = ctx.createGain();
      ng.gain.setValueAtTime(0.32, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + 1.35);
      src.connect(lp); lp.connect(ng); ng.connect(dest);
      src.start(now, 0, 1.4);
      trackNode(src, now + 1.42);

      startWind();
    }

    const PRIORITY = { lance: 5, cannon: 4, flak: 3, frost: 2, bolt: 1 };

    function stepForward(prevT, newT) {
      if (!ctx || !isAudible || newT <= prevT || (newT - prevT) > 0.35) return;
      const tStart = prevT * 20;
      const tEnd = newT * 20;

      // Check fall first: after FALL_TICK only low wind plays
      if (FALL_TICK >= 0 && tStart < FALL_TICK && tEnd >= FALL_TICK) {
        playFallCollapse();
        return;
      }
      if (FALL_TICK >= 0 && tStart >= FALL_TICK) {
        startWind();
        return;
      }

      // Wave horns
      for (let i = lowerBoundTick(REPLAY.waves, Math.ceil(tStart)); i < REPLAY.waves.length; i++) {
        const w = REPLAY.waves[i];
        if (w.tick > tEnd) break;
        if (w.tick > tStart) playWaveHorn();
      }

      // Leaks
      for (let i = lowerBoundTick(REPLAY.leaks, Math.ceil(tStart)); i < REPLAY.leaks.length; i++) {
        const lk = REPLAY.leaks[i];
        if (lk.tick > tEnd) break;
        if (lk.tick > tStart) playLeakAlarm();
      }

      // Shots (loudest types first within this step!)
      const stepShots = [];
      for (let i = lowerBoundTick(REPLAY.shots, Math.ceil(tStart)); i < REPLAY.shots.length; i++) {
        const sh = REPLAY.shots[i];
        if (sh.tick > tEnd) break;
        if (sh.tick > tStart) stepShots.push(sh);
      }
      if (stepShots.length > 1) {
        stepShots.sort(function (a, b) { return (PRIORITY[b.type] || 0) - (PRIORITY[a.type] || 0); });
      }
      for (let i = 0; i < stepShots.length; i++) playShotSound(stepShots[i]);

      // Kills
      for (let i = lowerBoundTick(REPLAY.kills, Math.ceil(tStart)); i < REPLAY.kills.length; i++) {
        const kl = REPLAY.kills[i];
        if (kl.tick > tEnd) break;
        if (kl.tick > tStart) playKillPop(kl);
      }
    }

    return { setPlaying: setPlaying, stepForward: stepForward };
  })();

  // =========================================================================
  // PURE DETERMINISTIC FRAME RENDERER AT ANY simTime IN [0, 100]
  // =========================================================================
  const qCamBill = new THREE.Quaternion();
  const upAxis = new THREE.Vector3(0, 1, 0);
  const vStart = new THREE.Vector3();
  const vEnd = new THREE.Vector3();
  const vDiff = new THREE.Vector3();
  const qOrient = new THREE.Quaternion();
  const zForward = new THREE.Vector3(0, 0, 1);

  function renderAtSimTime(simTime) {
    const clampedTime = Math.max(0, Math.min(DURATION, simTime));
    const rawTickFloat = clampedTime * 20;
    const fallen = FALL_TICK >= 0 && rawTickFloat >= FALL_TICK;
    const effTickFloat = fallen ? FALL_TICK : rawTickFloat;
    const maxFrameIdx = REPLAY.frames.length - 1;
    const k0 = Math.min(maxFrameIdx, Math.floor(effTickFloat));
    const k1 = fallen ? k0 : Math.min(maxFrameIdx, k0 + 1);
    const frac = fallen ? 0 : (effTickFloat - Math.floor(effTickFloat));

    const f0 = REPLAY.frames[k0];
    const f1 = REPLAY.frames[k1];

    // Desaturation after fall (smooth 0 -> 0.92 over 1.0s, held until 100s)
    if (fallen) {
      const fallDt = clampedTime - FALL_TIME;
      uDesat.value = Math.min(0.92, Math.max(0, fallDt) * 0.92);
    } else {
      uDesat.value = 0.0;
    }

    // Closed-form trauma shake
    const trauma = getTraumaAt(clampedTime);
    const shakeAmp = trauma * trauma * 0.25;
    const shX = shakeAmp * smoothNoise(clampedTime * 29.0, 1);
    const shZ = shakeAmp * smoothNoise(clampedTime * 29.0, 2);
    camera.position.set(camBasePos.x + shX, camBasePos.y, camBasePos.z + shZ);
    camera.lookAt(camBaseTarget.x + shX, camBaseTarget.y, camBaseTarget.z + shZ);
    camera.updateMatrixWorld(true);
    qCamBill.copy(camera.quaternion);

    // Air lane chevrons (driven strictly by simTime, frozen after fall)
    const animTime = fallen ? FALL_TIME : clampedTime;
    for (let i = 0; i < airChevrons.length; i++) {
      const p = ((i / airChevrons.length + animTime * 0.09) % 1) * 2800;
      let cx = 0.5, cz = 6.5, rotY = 0;
      if (p <= 2100) {
        cx = 0.5 + p * 0.01; cz = 6.5; rotY = 0;
      } else if (p <= 2600) {
        cx = 21.5; cz = 6.5 + (p - 2100) * 0.01; rotY = -Math.PI / 2;
      } else {
        cx = 21.5 + (p - 2600) * 0.01; cz = 11.5; rotY = 0;
      }
      airChevrons[i].position.set(cx, 0.81, cz);
      airChevrons[i].rotation.y = rotY;
    }

    // Keep leak flash, wall crumbling & fall collapse
    let leakFlash = 0;
    for (let i = 0; i < REPLAY.leaks.length; i++) {
      const dtL = clampedTime - REPLAY.leaks[i].tick / 20;
      if (dtL >= 0 && dtL < 0.3) {
        leakFlash = Math.max(leakFlash, 1 - dtL / 0.3);
      }
    }
    keepStoneMat.emissive.setRGB(leakFlash * 0.85, leakFlash * 0.08, leakFlash * 0.05);
    keepTrimMat.emissive.setRGB(leakFlash * 0.75, leakFlash * 0.08, leakFlash * 0.05);
    keepBeacon.rotation.y = animTime * 1.8;

    if (!fallen) {
      keepIntactGroup.visible = true;
      fallRubbleInst.visible = false;
      fallShockRing.visible = false;
      for (let i = 0; i < 10; i++) {
        const ch = keepWallChunks[i];
        const lostTick = hpChunkLostTick[i];
        if (effTickFloat < lostTick) {
          ch.mesh.visible = true;
          ch.mesh.position.set(ch.ox, ch.oy, ch.oz);
          ch.mesh.rotation.set(0, 0, 0);
        } else {
          const dt = Math.min(1.4, (effTickFloat - lostTick) / 20);
          const py = Math.max(0.14, ch.oy + ch.vy * dt - 6.8 * dt * dt);
          const settle = py <= 0.141 ? Math.min(dt, 0.65) : dt;
          ch.mesh.visible = true;
          ch.mesh.position.set(ch.ox + ch.vx * settle, py, ch.oz + ch.vz * settle);
          ch.mesh.rotation.set(ch.rx * settle, 0, ch.rz * settle);
        }
      }
    } else {
      keepIntactGroup.visible = false;
      for (let i = 0; i < 10; i++) keepWallChunks[i].mesh.visible = false;
      fallRubbleInst.visible = true;
      const fallDt = Math.max(0, clampedTime - FALL_TIME);
      const tPhys = Math.min(1.5, fallDt);
      for (let i = 0; i < fallRubbleCount; i++) {
        const rs = fallRubbleSeeds[i];
        const py = Math.max(0.09 * rs.sc, rs.oy + rs.vy * tPhys - 7.5 * tPhys * tPhys);
        const tHoriz = py <= 0.095 * rs.sc ? Math.min(tPhys, 0.78) : tPhys;
        dummyObj.position.set(rs.ox + rs.vx * tHoriz, py, rs.oz + rs.vz * tHoriz);
        dummyObj.rotation.set(rs.rx * tHoriz, rs.rx * 0.5, rs.rz * tHoriz);
        dummyObj.scale.setScalar(rs.sc);
        dummyObj.updateMatrix();
        fallRubbleInst.setMatrixAt(i, dummyObj.matrix);
      }
      fallRubbleInst.instanceMatrix.needsUpdate = true;

      if (fallDt < 1.1) {
        fallShockRing.visible = true;
        const rScale = 0.6 + fallDt * 12.5;
        fallShockRing.scale.set(rScale, 1, rScale);
        fallShockRing.material.opacity = (1 - fallDt / 1.1) * 0.85;
      } else {
        fallShockRing.visible = false;
      }
    }

    // Turrets on the 16 build slots
    for (let s = 0; s < 16; s++) {
      const sv = slotVisuals[s];
      const td = f0.turrets[s];
      if (!td) {
        sv.root.visible = false;
        continue;
      }
      sv.root.visible = true;
      const tdNext = f1.turrets[s];
      let aimX = td.aimX, aimY = td.aimY;
      if (tdNext && tdNext.type === td.type) {
        aimX = td.aimX + (tdNext.aimX - td.aimX) * frac;
        aimY = td.aimY + (tdNext.aimY - td.aimY) * frac;
      }
      for (let t = 0; t < 3; t++) {
        sv.tierRings[t].visible = t < td.tier;
      }
      const types = ["bolt", "cannon", "frost", "lance", "flak"];
      for (let j = 0; j < 5; j++) {
        const tp = types[j];
        const h = sv.heads[tp];
        const active = tp === td.type;
        h.group.visible = active;
        if (active) {
          if (tp === "frost") {
            h.head.rotation.y = animTime * 2.2;
            h.head.position.y = 0.72 + Math.sin(animTime * 4 + s) * 0.035;
          } else {
            const dx = aimX * 0.01 - sv.x;
            const dz = aimY * 0.01 - sv.z;
            h.head.rotation.y = Math.atan2(dx, dz);
          }
        }
      }
    }

    // Instanced Enemies & Health Bars (interpolated between k0 and k1)
    let nGrunt = 0, nRunner = 0, nWisp = 0, nBrute = 0, nSplitter = 0, nSplitling = 0, nMender = 0, nHp = 0;

    for (let i = 0; i < f0.enemies.length; i++) {
      const e0 = f0.enemies[i];
      const e1 = f1.enemyMap.get(e0.id);
      let wx, wz, dx, dz, hp;
      if (e1) {
        wx = (e0.x + (e1.x - e0.x) * frac) * 0.01;
        wz = (e0.y + (e1.y - e0.y) * frac) * 0.01;
        dx = e0.dx + (e1.dx - e0.dx) * frac;
        dz = e0.dy + (e1.dy - e0.dy) * frac;
        hp = e0.hp + (e1.hp - e0.hp) * frac;
      } else {
        wx = e0.x * 0.01;
        wz = e0.y * 0.01;
        dx = e0.dx;
        dz = e0.dy;
        hp = e0.hp;
      }
      const heading = Math.atan2(dx || 0.001, dz || 0);
      const slowed = e0.slow > 0;
      let barHeight = 0.56;

      if (e0.type === "grunt" && nGrunt < MAX_ENEMIES) {
        dummyObj.position.set(wx, 0.21, wz);
        dummyObj.rotation.set(0, heading, 0);
        dummyObj.scale.set(1, 1, 1);
        dummyObj.updateMatrix();
        gruntMesh.setMatrixAt(nGrunt, dummyObj.matrix);
        tmpColor.copy(COL_GRUNT);
        if (slowed) tmpColor.lerp(COL_FROST_TINT, 0.55);
        gruntMesh.setColorAt(nGrunt, tmpColor);
        nGrunt++;
        barHeight = 0.52;
      } else if (e0.type === "runner" && nRunner < MAX_ENEMIES) {
        dummyObj.position.set(wx, 0.16, wz);
        dummyObj.rotation.set(0, heading, 0);
        dummyObj.scale.set(1, 1, 1);
        dummyObj.updateMatrix();
        runnerMesh.setMatrixAt(nRunner, dummyObj.matrix);
        tmpColor.copy(COL_RUNNER);
        if (slowed) tmpColor.lerp(COL_FROST_TINT, 0.52);
        runnerMesh.setColorAt(nRunner, tmpColor);
        nRunner++;
        barHeight = 0.44;
      } else if (e0.type === "wisp" && nWisp < MAX_ENEMIES) {
        const bob = Math.sin(animTime * 6 + e0.id) * 0.045;
        dummyObj.position.set(wx, 0.8 + bob, wz);
        dummyObj.rotation.set(0, animTime * 2.5 + e0.id, 0);
        dummyObj.scale.set(1, 1.15, 1);
        dummyObj.updateMatrix();
        wispMesh.setMatrixAt(nWisp, dummyObj.matrix);
        tmpColor.copy(COL_WISP);
        if (slowed) tmpColor.setHex(0x88b8ff);
        wispMesh.setColorAt(nWisp, tmpColor);

        dummyObj.position.set(wx, 0.025, wz);
        dummyObj.rotation.set(0, 0, 0);
        dummyObj.scale.set(1, 1, 1);
        dummyObj.updateMatrix();
        wispShadowMesh.setMatrixAt(nWisp, dummyObj.matrix);
        nWisp++;
        barHeight = 1.18 + bob;
      } else if (e0.type === "brute" && nBrute < MAX_ENEMIES) {
        dummyObj.position.set(wx, 0.27, wz);
        dummyObj.rotation.set(0, heading, 0);
        dummyObj.scale.set(1, 1, 1);
        dummyObj.updateMatrix();
        bruteBodyMesh.setMatrixAt(nBrute, dummyObj.matrix);
        tmpColor.copy(COL_BRUTE_IRON);
        if (slowed) tmpColor.lerp(COL_FROST_TINT, 0.5);
        bruteBodyMesh.setColorAt(nBrute, tmpColor);

        dummyObj.position.set(wx, 0.36, wz);
        dummyObj.updateMatrix();
        brutePlateMesh.setMatrixAt(nBrute, dummyObj.matrix);
        tmpColor.copy(COL_BRUTE_PLATE);
        if (slowed) tmpColor.lerp(COL_FROST_TINT, 0.45);
        brutePlateMesh.setColorAt(nBrute, tmpColor);
        nBrute++;
        barHeight = 0.68;
      } else if (e0.type === "splitter" && nSplitter < MAX_ENEMIES) {
        dummyObj.position.set(wx, 0.28, wz);
        dummyObj.rotation.set(animTime * 1.2 + e0.id, heading, 0);
        dummyObj.scale.set(1, 1, 1);
        dummyObj.updateMatrix();
        splitterMesh.setMatrixAt(nSplitter, dummyObj.matrix);
        tmpColor.copy(COL_SPLITTER);
        if (slowed) tmpColor.lerp(COL_FROST_TINT, 0.5);
        splitterMesh.setColorAt(nSplitter, tmpColor);
        nSplitter++;
        barHeight = 0.66;
      } else if (e0.type === "splitling" && nSplitling < MAX_ENEMIES) {
        dummyObj.position.set(wx, 0.15, wz);
        dummyObj.rotation.set(0, heading + animTime * 3, 0);
        dummyObj.scale.set(1, 1, 1);
        dummyObj.updateMatrix();
        splitlingMesh.setMatrixAt(nSplitling, dummyObj.matrix);
        tmpColor.copy(COL_SPLITLING);
        if (slowed) tmpColor.lerp(COL_FROST_TINT, 0.5);
        splitlingMesh.setColorAt(nSplitling, tmpColor);
        nSplitling++;
        barHeight = 0.38;
      } else if (e0.type === "mender" && nMender < MAX_ENEMIES) {
        dummyObj.position.set(wx, 0.28, wz);
        dummyObj.rotation.set(0, heading, 0);
        dummyObj.scale.set(1, 1, 1);
        dummyObj.updateMatrix();
        menderBodyMesh.setMatrixAt(nMender, dummyObj.matrix);
        tmpColor.copy(COL_MENDER);
        if (slowed) tmpColor.lerp(COL_FROST_TINT, 0.5);
        menderBodyMesh.setColorAt(nMender, tmpColor);

        dummyObj.position.set(wx, 0.22 + Math.sin(animTime * 5 + e0.id) * 0.04, wz);
        dummyObj.rotation.set(0, 0, 0);
        dummyObj.scale.set(1, 1, 1);
        dummyObj.updateMatrix();
        menderHaloMesh.setMatrixAt(nMender, dummyObj.matrix);
        nMender++;
        barHeight = 0.66;
      }

      if (nHp < MAX_ENEMIES) {
        const ratio = Math.max(0.02, Math.min(1, hp / Math.max(1, e0.maxHp)));
        dummyObj.position.set(wx, barHeight, wz);
        dummyObj.quaternion.copy(qCamBill);
        dummyObj.scale.set(1, 1, 1);
        dummyObj.updateMatrix();
        hpBgInst.setMatrixAt(nHp, dummyObj.matrix);

        dummyObj.translateX(-0.22);
        dummyObj.translateZ(0.01);
        dummyObj.scale.set(ratio, 1, 1);
        dummyObj.updateMatrix();
        hpFillInst.setMatrixAt(nHp, dummyObj.matrix);
        if (ratio > 0.55) tmpColor.setHex(0x4eff7b);
        else if (ratio > 0.25) tmpColor.setHex(0xffbe3b);
        else tmpColor.setHex(0xff4252);
        hpFillInst.setColorAt(nHp, tmpColor);
        nHp++;
      }
    }

    function commitInst(im, cnt, hasCol) {
      im.count = cnt;
      if (cnt > 0) {
        im.instanceMatrix.needsUpdate = true;
        if (hasCol && im.instanceColor) im.instanceColor.needsUpdate = true;
      }
    }
    commitInst(gruntMesh, nGrunt, true);
    commitInst(runnerMesh, nRunner, true);
    commitInst(wispMesh, nWisp, true);
    commitInst(wispShadowMesh, nWisp, false);
    commitInst(bruteBodyMesh, nBrute, true);
    commitInst(brutePlateMesh, nBrute, true);
    commitInst(splitterMesh, nSplitter, true);
    commitInst(splitlingMesh, nSplitling, true);
    commitInst(menderBodyMesh, nMender, true);
    commitInst(menderHaloMesh, nMender, false);
    commitInst(hpBgInst, nHp, false);
    commitInst(hpFillInst, nHp, true);

    // Shots (duration <= 0.15s = 3 ticks) & Effect Rings & Ballistic Debris
    let nBeam = 0, nShell = 0, nRing = 0, nDebris = 0;

    if (!fallen) {
      const shotMinTick = Math.floor((clampedTime - 0.15) * 20);
      for (let i = lowerBoundTick(REPLAY.shots, shotMinTick); i < REPLAY.shots.length; i++) {
        const sh = REPLAY.shots[i];
        const dt = clampedTime - sh.tick / 20;
        if (dt < 0) break;
        if (dt > 0.15) continue;
        const u = dt / 0.15;
        const sx = sh.x0 * 0.01, sz = sh.y0 * 0.01;
        const sy = sh.type === "frost" ? 0.82 : 0.42;
        const tx = sh.x1 * 0.01, tz = sh.y1 * 0.01;
        const ty = sh.air ? 0.8 : 0.24;

        if (sh.type === "cannon") {
          if (dt <= 0.095 && nShell < MAX_SHELLS) {
            const su = dt / 0.095;
            const px = sx + (tx - sx) * su;
            const pz = sz + (tz - sz) * su;
            const py = sy + (ty - sy) * su + Math.sin(su * Math.PI) * 0.85;
            dummyObj.position.set(px, py, pz);
            dummyObj.rotation.set(0, 0, 0);
            dummyObj.scale.setScalar(1);
            dummyObj.updateMatrix();
            shellInst.setMatrixAt(nShell++, dummyObj.matrix);
          }
          if (dt >= 0.06 && nRing < MAX_RINGS) {
            const ru = (dt - 0.06) / 0.09;
            const rad = 0.90 * (0.25 + 0.75 * ru); // exact 0.90 splash radius
            dummyObj.position.set(tx, 0.07, tz);
            dummyObj.rotation.set(0, 0, 0);
            dummyObj.scale.set(rad, 1, rad);
            dummyObj.updateMatrix();
            fxRingInst.setMatrixAt(nRing, dummyObj.matrix);
            tmpColor.setRGB(1.0 * (1 - ru * 0.5), 0.58 * (1 - ru * 0.5), 0.18);
            fxRingInst.setColorAt(nRing, tmpColor);
            nRing++;
          }
        } else if (sh.type === "flak") {
          if (dt <= 0.06 && nBeam < MAX_BEAMS) {
            vStart.set(sx, sy, sz);
            vEnd.set(tx, ty, tz);
            vDiff.subVectors(vEnd, vStart);
            const len = vDiff.length();
            if (len > 0.01) {
              qOrient.setFromUnitVectors(zForward, vDiff.normalize());
              dummyObj.position.copy(vStart);
              dummyObj.quaternion.copy(qOrient);
              dummyObj.scale.set(0.022, 0.022, len);
              dummyObj.updateMatrix();
              beamInst.setMatrixAt(nBeam, dummyObj.matrix);
              tmpColor.setHex(0x36ffe0);
              beamInst.setColorAt(nBeam, tmpColor);
              nBeam++;
            }
          }
          if (nRing < MAX_RINGS) {
            const rad = 0.70 * (0.3 + 0.7 * u); // exact 0.70 air splash radius
            dummyObj.position.set(tx, 0.8, tz);
            dummyObj.rotation.set(0, 0, 0);
            dummyObj.scale.set(rad, 1, rad);
            dummyObj.updateMatrix();
            fxRingInst.setMatrixAt(nRing, dummyObj.matrix);
            tmpColor.setRGB(0.15, 0.95 * (1 - u * 0.5), 0.82 * (1 - u * 0.5));
            fxRingInst.setColorAt(nRing, tmpColor);
            nRing++;
          }
        } else if (nBeam < MAX_BEAMS) {
          vStart.set(sx, sy, sz);
          vEnd.set(tx, ty, tz);
          if (sh.type === "bolt") {
            // Fast steel-blue tracer dart segment
            const a0 = Math.max(0, u - 0.38);
            const a1 = Math.min(1, u * 1.25);
            vDiff.subVectors(vEnd, vStart);
            const fullLen = vDiff.length();
            if (fullLen > 0.01 && a1 > a0) {
              const dirNorm = vDiff.clone().normalize();
              qOrient.setFromUnitVectors(zForward, dirNorm);
              dummyObj.position.copy(vStart).addScaledVector(dirNorm, fullLen * a0);
              dummyObj.quaternion.copy(qOrient);
              dummyObj.scale.set(0.024, 0.024, fullLen * (a1 - a0));
              dummyObj.updateMatrix();
              beamInst.setMatrixAt(nBeam, dummyObj.matrix);
              tmpColor.setHex(0x7cc2ff);
              beamInst.setColorAt(nBeam, tmpColor);
              nBeam++;
            }
          } else if (sh.type === "frost") {
            vDiff.subVectors(vEnd, vStart);
            const len = vDiff.length();
            if (len > 0.01) {
              qOrient.setFromUnitVectors(zForward, vDiff.normalize());
              dummyObj.position.copy(vStart);
              dummyObj.quaternion.copy(qOrient);
              const th = 0.035 * (1 - u * 0.65);
              dummyObj.scale.set(th, th, len);
              dummyObj.updateMatrix();
              beamInst.setMatrixAt(nBeam, dummyObj.matrix);
              tmpColor.setHex(0xb8f4ff);
              beamInst.setColorAt(nBeam, tmpColor);
              nBeam++;
            }
          } else if (sh.type === "lance") {
            vDiff.subVectors(vEnd, vStart);
            const len = vDiff.length();
            if (len > 0.01) {
              qOrient.setFromUnitVectors(zForward, vDiff.normalize());
              dummyObj.position.copy(vStart);
              dummyObj.quaternion.copy(qOrient);
              const th = 0.075 * (1 - u * 0.55);
              dummyObj.scale.set(th, th, len);
              dummyObj.updateMatrix();
              beamInst.setMatrixAt(nBeam, dummyObj.matrix);
              tmpColor.setHex(0xff3850);
              beamInst.setColorAt(nBeam, tmpColor);
              nBeam++;
              if (u < 0.55 && nRing < MAX_RINGS) {
                dummyObj.position.set(tx, ty, tz);
                dummyObj.rotation.set(0, 0, 0);
                dummyObj.scale.setScalar(0.18 + u * 0.55);
                dummyObj.updateMatrix();
                fxRingInst.setMatrixAt(nRing, dummyObj.matrix);
                tmpColor.setHex(0xff5268);
                fxRingInst.setColorAt(nRing, tmpColor);
                nRing++;
              }
            }
          }
        }
      }

      // Mender heal rings (exact 1.50 radius green pulse)
      const healMinTick = Math.floor((clampedTime - 0.45) * 20);
      for (let i = lowerBoundTick(REPLAY.heals, healMinTick); i < REPLAY.heals.length; i++) {
        const hl = REPLAY.heals[i];
        const dt = clampedTime - hl.tick / 20;
        if (dt < 0) break;
        if (dt > 0.45 || nRing >= MAX_RINGS) continue;
        const u = dt / 0.45;
        const rad = 1.50 * (0.2 + 0.8 * u);
        dummyObj.position.set(hl.x * 0.01, 0.06, hl.y * 0.01);
        dummyObj.rotation.set(0, 0, 0);
        dummyObj.scale.set(rad, 1, rad);
        dummyObj.updateMatrix();
        fxRingInst.setMatrixAt(nRing, dummyObj.matrix);
        tmpColor.setRGB(0.22, 0.95 * (1 - u * 0.65), 0.48 * (1 - u * 0.65));
        fxRingInst.setColorAt(nRing, tmpColor);
        nRing++;
      }

      // Kill ballistic debris + splitter death burst
      const killMinTick = Math.floor((clampedTime - 0.55) * 20);
      for (let i = lowerBoundTick(REPLAY.kills, killMinTick); i < REPLAY.kills.length; i++) {
        const kl = REPLAY.kills[i];
        const dt = clampedTime - kl.tick / 20;
        if (dt < 0) break;
        if (dt > 0.55) continue;
        const u = dt / 0.55;
        const kx = kl.x * 0.01, kz = kl.y * 0.01, ky = kl.air ? 0.8 : 0.22;

        if (kl.type === "splitter" && dt < 0.35 && nRing < MAX_RINGS) {
          const su = dt / 0.35;
          dummyObj.position.set(kx, 0.12, kz);
          dummyObj.rotation.set(0, 0, 0);
          dummyObj.scale.set(0.25 + su * 0.75, 1, 0.25 + su * 0.75);
          dummyObj.updateMatrix();
          fxRingInst.setMatrixAt(nRing, dummyObj.matrix);
          tmpColor.setHex(0xc864ff);
          fxRingInst.setColorAt(nRing, tmpColor);
          nRing++;
        }

        const pieces = kl.type === "brute" ? 8 : (kl.type === "splitter" ? 9 : 5);
        for (let p = 0; p < pieces && nDebris < MAX_DEBRIS; p++) {
          const seedBase = kl.id * 97 + p * 31;
          const ang = hashFloat(seedBase + 1) * Math.PI * 2;
          const spd = 0.8 + hashFloat(seedBase + 2) * 2.2;
          const vy0 = 1.6 + hashFloat(seedBase + 3) * 2.2;
          const px = kx + Math.cos(ang) * spd * dt;
          const pz = kz + Math.sin(ang) * spd * dt;
          const py = Math.max(0.04, ky + vy0 * dt - 6.5 * dt * dt);
          dummyObj.position.set(px, py, pz);
          dummyObj.rotation.set(dt * 8, ang, dt * 6);
          dummyObj.scale.setScalar((1 - u) * 1.15);
          dummyObj.updateMatrix();
          debrisInst.setMatrixAt(nDebris, dummyObj.matrix);
          if (kl.type === "grunt") tmpColor.copy(COL_GRUNT);
          else if (kl.type === "runner") tmpColor.copy(COL_RUNNER);
          else if (kl.type === "wisp") tmpColor.copy(COL_WISP);
          else if (kl.type === "brute") tmpColor.copy(p % 2 === 0 ? COL_BRUTE_PLATE : COL_BRUTE_IRON);
          else if (kl.type === "mender") tmpColor.copy(COL_MENDER);
          else tmpColor.copy(COL_SPLITTER);
          debrisInst.setColorAt(nDebris, tmpColor);
          nDebris++;
        }
      }

      // Build, Upgrade & Sell visual effects at wave starts
      const opMinTick = Math.floor((clampedTime - 0.6) * 20);
      for (let i = lowerBoundTick(REPLAY.ops, opMinTick); i < REPLAY.ops.length; i++) {
        const op = REPLAY.ops[i];
        const dt = clampedTime - op.tick / 20;
        if (dt < 0) break;
        if (dt > 0.6) continue;
        const u = dt / 0.6;
        const ox = SLOT_TILES[op.slot][0] + 0.5;
        const oz = SLOT_TILES[op.slot][1] + 0.5;

        if (op.op === "B") {
          for (let p = 0; p < 6 && nDebris < MAX_DEBRIS; p++) {
            const ang = (p / 6) * Math.PI * 2 + u * 3.0;
            dummyObj.position.set(ox + Math.cos(ang) * 0.34 * (1 - u * 0.4), 0.12 + u * 0.95, oz + Math.sin(ang) * 0.34 * (1 - u * 0.4));
            dummyObj.rotation.set(u * 4, ang, 0);
            dummyObj.scale.setScalar((1 - u) * 0.95);
            dummyObj.updateMatrix();
            debrisInst.setMatrixAt(nDebris, dummyObj.matrix);
            tmpColor.setHex(0x8be8ff);
            debrisInst.setColorAt(nDebris, tmpColor);
            nDebris++;
          }
        } else if (op.op === "U" && nRing < MAX_RINGS) {
          const rad = 0.28 + u * 0.55;
          dummyObj.position.set(ox, 0.14 + u * 0.45, oz);
          dummyObj.rotation.set(0, 0, 0);
          dummyObj.scale.set(rad, 1, rad);
          dummyObj.updateMatrix();
          fxRingInst.setMatrixAt(nRing, dummyObj.matrix);
          tmpColor.setHex(0xffe066);
          fxRingInst.setColorAt(nRing, tmpColor);
          nRing++;
        } else if (op.op === "S") {
          for (let p = 0; p < 7 && nDebris < MAX_DEBRIS; p++) {
            const ang = (p / 7) * Math.PI * 2;
            const py = Math.max(0.04, 0.32 + 1.0 * dt - 6.0 * dt * dt);
            dummyObj.position.set(ox + Math.cos(ang) * 0.7 * dt, py, oz + Math.sin(ang) * 0.7 * dt);
            dummyObj.rotation.set(dt * 6, ang, 0);
            dummyObj.scale.setScalar((1 - u) * 1.1);
            dummyObj.updateMatrix();
            debrisInst.setMatrixAt(nDebris, dummyObj.matrix);
            tmpColor.setHex(0x8c8275);
            debrisInst.setColorAt(nDebris, tmpColor);
            nDebris++;
          }
        }
      }
    }

    commitInst(beamInst, nBeam, true);
    commitInst(shellInst, nShell, false);
    commitInst(fxRingInst, nRing, true);
    commitInst(debrisInst, nDebris, true);

    // Update Wordless HUD
    updateHudLayoutAndState(f0.wave, f0.gold, f0.baseHp, f0.nextWave, clampedTime);

    // Render 3D world pass + Orthographic HUD pass onto #stage
    renderer.clear();
    renderer.render(scene, camera);
    renderer.clearDepth();
    renderer.render(hudScene, hudCam);
  }

  // =========================================================================
  // 5-STATE TIMELINE & PLAYBACK CONTROLS (Section 3 Contract)
  // =========================================================================
  const elCountdown = document.getElementById("countdown");
  const btnRefire = document.getElementById("btn-refire");
  const btnToggle = document.getElementById("btn-toggle");
  const iconPause = document.getElementById("icon-pause");
  const iconPlay = document.getElementById("icon-play");
  const speedPills = Array.prototype.slice.call(document.querySelectorAll(".speed-pill"));
  const scrubber = document.getElementById("scrubber");

  let appState = "COUNTDOWN"; // COUNTDOWN | PLAYING | PAUSED | REFIRE_HOLD | ENDED
  let simTime = 0.000;
  let playbackSpeed = 1.0;
  let countdownElapsed = 0.000;
  let holdElapsed = 0.000;
  let firstRafAfterInit = true;
  let lastWallNow = 0;

  function setToggleVisual(isPauseIcon) {
    if (isPauseIcon) {
      iconPause.style.display = "";
      iconPlay.style.display = "none";
      btnToggle.setAttribute("aria-label", "Pause");
    } else {
      iconPause.style.display = "none";
      iconPlay.style.display = "";
      btnToggle.setAttribute("aria-label", "Play");
    }
  }

  function hideCountdown() {
    elCountdown.style.display = "none";
    elCountdown.textContent = "";
  }

  function syncAudioState() {
    sfx.setPlaying(appState === "PLAYING", simTime);
  }

  btnToggle.addEventListener("click", function () {
    if (appState === "PLAYING") {
      appState = "PAUSED";
      setToggleVisual(false);
      syncAudioState();
    } else if (appState === "COUNTDOWN" || appState === "REFIRE_HOLD") {
      hideCountdown();
      simTime = 0.000;
      scrubber.value = "0";
      appState = "PAUSED";
      setToggleVisual(false);
      syncAudioState();
      renderAtSimTime(simTime);
    } else if (appState === "PAUSED") {
      appState = "PLAYING";
      setToggleVisual(true);
      syncAudioState();
    } else if (appState === "ENDED") {
      hideCountdown();
      simTime = 0.000;
      scrubber.value = "0";
      appState = "PLAYING";
      setToggleVisual(true);
      syncAudioState();
      renderAtSimTime(simTime);
    }
  });

  btnRefire.addEventListener("click", function () {
    hideCountdown();
    simTime = 0.000;
    scrubber.value = "0";
    holdElapsed = 0.000;
    appState = "REFIRE_HOLD";
    setToggleVisual(true);
    syncAudioState();
    renderAtSimTime(0.000);
  });

  for (let i = 0; i < speedPills.length; i++) {
    speedPills[i].addEventListener("click", function (ev) {
      const btn = ev.currentTarget;
      const spd = parseFloat(btn.getAttribute("data-speed"));
      if (!isNaN(spd)) playbackSpeed = spd;
      for (let j = 0; j < speedPills.length; j++) {
        const active = speedPills[j] === btn;
        speedPills[j].classList.toggle("is-active", active);
        speedPills[j].setAttribute("aria-checked", active ? "true" : "false");
      }
    });
  }

  scrubber.addEventListener("input", function () {
    hideCountdown();
    simTime = Math.max(0, Math.min(DURATION, parseFloat(scrubber.value) || 0));
    appState = "PAUSED";
    setToggleVisual(false);
    syncAudioState();
    renderAtSimTime(simTime);
  });

  window.addEventListener("resize", function () {
    updateCameraFraming();
    renderAtSimTime(simTime);
  });

  // Initial resting scene render BEFORE starting COUNTDOWN on first rAF
  updateCameraFraming();
  elCountdown.style.display = "block";
  elCountdown.textContent = "3";
  scrubber.value = "0";
  setToggleVisual(true);
  renderAtSimTime(0.000);

  function tickLoop(nowMs) {
    requestAnimationFrame(tickLoop);

    if (firstRafAfterInit) {
      firstRafAfterInit = false;
      lastWallNow = nowMs;
      countdownElapsed = 0.000;
      return;
    }

    const rawDt = Math.max(0, (nowMs - lastWallNow) * 0.001);
    lastWallNow = nowMs;
    const dt = Math.min(rawDt, 0.1);

    if (appState === "COUNTDOWN") {
      countdownElapsed += dt;
      if (countdownElapsed < 1.000) {
        elCountdown.style.display = "block";
        elCountdown.textContent = "3";
        simTime = 0.000;
        scrubber.value = "0";
      } else if (countdownElapsed < 2.000) {
        elCountdown.style.display = "block";
        elCountdown.textContent = "2";
        simTime = 0.000;
        scrubber.value = "0";
      } else if (countdownElapsed < 3.000) {
        elCountdown.style.display = "block";
        elCountdown.textContent = "1";
        simTime = 0.000;
        scrubber.value = "0";
      } else {
        hideCountdown();
        appState = "PLAYING";
        setToggleVisual(true);
        syncAudioState();
        const overDt = Math.min(0.1, countdownElapsed - 3.000);
        const prevT = 0.000;
        simTime = Math.min(DURATION, overDt * playbackSpeed);
        scrubber.value = simTime.toFixed(3);
        sfx.stepForward(prevT, simTime);
        renderAtSimTime(simTime);
      }
    } else if (appState === "REFIRE_HOLD") {
      holdElapsed += dt;
      if (holdElapsed >= 1.000) {
        appState = "PLAYING";
        setToggleVisual(true);
        syncAudioState();
        const overDt = Math.min(0.1, holdElapsed - 1.000);
        const prevT = 0.000;
        simTime = Math.min(DURATION, overDt * playbackSpeed);
        scrubber.value = simTime.toFixed(3);
        sfx.stepForward(prevT, simTime);
        renderAtSimTime(simTime);
      }
    } else if (appState === "PLAYING") {
      const prevT = simTime;
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      scrubber.value = simTime.toFixed(3);
      sfx.stepForward(prevT, simTime);
      renderAtSimTime(simTime);
      if (simTime >= DURATION) {
        simTime = DURATION;
        scrubber.value = DURATION.toFixed(3);
        appState = "ENDED";
        setToggleVisual(false);
        syncAudioState();
        renderAtSimTime(DURATION);
      }
    }
  }

  requestAnimationFrame(tickLoop);
})();
</script>
</body>
</html>
