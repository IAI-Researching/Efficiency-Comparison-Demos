<script id="rampart-strategy">
function createStrategy() {
  const COSTS = { bolt: 50, cannon: 90, frost: 70, lance: 120, flak: 80 };
  const ORDER = [
    [14, "bolt", 1],
    [6, "cannon", 2], [11, "cannon", 2], [13, "cannon", 2],
    [4, "cannon", 3], [3, "cannon", 3], [6, "cannon", 3], [12, "flak", 3],
    [11, "cannon", 3], [13, "cannon", 3], [14, "bolt", 3],
    [0, "cannon", 3], [2, "cannon", 3], [7, "cannon", 3], [9, "cannon", 3],
    [10, "flak", 3], [5, "flak", 3], [15, "bolt", 3],
    [8, "frost", 3], [1, "frost", 3]
  ];

  return {
    plan(s) {
      const acts = [];
      let g = s.gold;
      const slots = [];
      for (let i = 0; i < s.slots.length; i++) {
        const x = s.slots[i];
        slots.push({
          slot: x.slot,
          x: x.x < 30 ? x.x * 100 + 50 : x.x,
          y: x.y < 30 ? x.y * 100 + 50 : x.y,
          turret: x.turret ? { type: x.turret.type, tier: x.turret.tier, spent: x.turret.spent } : null
        });
      }

      function build(slot, type, reserve) {
        const c = COSTS[type];
        if (!slots[slot].turret && g - c >= reserve && acts.length < 32) {
          acts.push({ op: "build", slot: slot, type: type });
          slots[slot].turret = { type: type, tier: 1, spent: c };
          g -= c;
          return true;
        }
        return false;
      }

      function upgrade(slot, targetTier, reserve) {
        while (slots[slot].turret && slots[slot].turret.tier < targetTier && acts.length < 32) {
          const t = slots[slot].turret;
          const c = COSTS[t.type] * (t.tier === 1 ? 1 : 2);
          if (g - c >= reserve) {
            acts.push({ op: "upgrade", slot: slot });
            t.tier += 1;
            t.spent += c;
            g -= c;
          } else {
            break;
          }
        }
      }

      function sell(slot) {
        const t = slots[slot].turret;
        if (t && acts.length < 32) {
          acts.push({ op: "sell", slot: slot });
          g += Math.floor(t.spent * 70 / 100);
          slots[slot] = { slot: slot, x: slots[slot].x, y: slots[slot].y, turret: null };
          return true;
        }
        return false;
      }

      let nextAir = 0;
      let nextBrutes = 0;
      for (let i = 0; i < s.nextWave.length; i++) {
        if (s.nextWave[i] === "wisp") nextAir++;
        else if (s.nextWave[i] === "brute") nextBrutes++;
      }

      let curAirThreat = false;
      let curGndThreat = false;
      let imminentLeak = false;
      for (let i = 0; i < s.enemies.length; i++) {
        const e = s.enemies[i];
        if (e.air && e.remaining < 1100) curAirThreat = true;
        if (!e.air && e.remaining < 1500) curGndThreat = true;
        if (e.remaining < 450) imminentLeak = true;
      }

      // Phase 1: Lean reactive opening to reach the 1000-gold interest cap (+50g/wave) quickly
      build(3, "cannon", 0);
      if (s.wave >= 2) build(1, "frost", 0);
      if (s.wave >= 3 || nextAir > 0) build(12, "flak", 0);
      if (s.wave >= 4 || nextBrutes > 0) build(6, "cannon", 0);
      if (s.wave >= 7 && (nextAir >= 3 || curAirThreat)) upgrade(12, 2, 0);
      if (s.wave >= 8 && curGndThreat) upgrade(3, 2, 0);
      if (s.wave >= 10) {
        build(8, "frost", 0);
        upgrade(3, 2, 0);
        upgrade(12, 2, 0);
      }
      if (s.wave >= 12 && curGndThreat) upgrade(6, 2, 0);
      if (s.wave >= 13 && (curAirThreat || nextAir >= 4)) build(14, "bolt", 0);

      // Phase 2: Hold 1000g bank until wave 25, investing surplus into concentrated T3 U-turn AoE
      const reserve = (s.wave >= 25 || imminentLeak || (s.baseHp <= 6 && s.wave >= 18)) ? 0 : 1000;

      let allMaxed = true;
      for (let i = 0; i < ORDER.length; i++) {
        const step = ORDER[i];
        const slot = step[0];
        const type = step[1];
        const tier = step[2];
        const cur = slots[slot].turret;
        if (cur && ((slot === 9 && cur.type === "lance") || (slot === 15 && cur.type === "flak"))) {
          if (cur.tier < 3) {
            upgrade(slot, 3, reserve);
            if (slots[slot].turret.tier < 3) allMaxed = false;
          }
          continue;
        }
        if (cur && cur.type !== type) {
          const refund = Math.floor(cur.spent * 70 / 100);
          const fullCost = COSTS[type] * (tier === 1 ? 1 : tier === 2 ? 2 : 4);
          if (g + refund - fullCost >= reserve && acts.length <= 28) {
            sell(slot);
            build(slot, type, reserve);
            upgrade(slot, tier, reserve);
          } else {
            allMaxed = false;
          }
          continue;
        }
        if (!cur) {
          if (!build(slot, type, reserve)) allMaxed = false;
        }
        if (slots[slot].turret && slots[slot].turret.type === type && tier > 1) {
          upgrade(slot, tier, reserve);
          if (slots[slot].turret.tier < tier) allMaxed = false;
        }
      }

      // Phase 3: Late-game surplus conversion into armor-piercing Lance T3 & extra Flak T3
      if (allMaxed) {
        const c9 = slots[9].turret;
        if (c9 && c9.type === "cannon" && g + Math.floor(c9.spent * 70 / 100) >= 480 && acts.length <= 28) {
          sell(9);
          build(9, "lance", 0);
          upgrade(9, 3, 0);
        }
        const c15 = slots[15].turret;
        if (c15 && c15.type === "bolt" && g + Math.floor(c15.spent * 70 / 100) >= 320 && acts.length <= 28) {
          sell(15);
          build(15, "flak", 0);
          upgrade(15, 3, 0);
        }
      }

      return acts;
    },

    target(turret, candidates) {
      const n = candidates.length;
      if (n === 1) return candidates[0].id;

      if (turret.type === "frost") {
        let best = candidates[0];
        let bestSc = -1e18;
        for (let i = 0; i < n; i++) {
          const c = candidates[i];
          const isSlow = c.slowed ? 1 : 0;
          let sc = isSlow ? -1000000 : 1000000;
          if (!isSlow) {
            if (c.air) sc += 12000;
            if (c.type === "runner") sc += 7000;
            else if (c.type === "brute" || c.type === "mender" || c.type === "splitter") sc += 4500;
          }
          sc -= c.remaining * 3;
          if (sc > bestSc) {
            bestSc = sc;
            best = c;
          }
        }
        return best.id;
      }

      if (turret.type === "cannon" || turret.type === "flak") {
        const sp2 = turret.type === "cannon" ? 8100 : 4900;
        const baseDmg = turret.type === "cannon"
          ? (turret.tier === 1 ? 60 : turret.tier === 2 ? 96 : 153)
          : (turret.tier === 1 ? 40 : turret.tier === 2 ? 64 : 102);

        let front = candidates[0];
        for (let i = 1; i < n; i++) {
          if (candidates[i].remaining < front.remaining) front = candidates[i];
        }
        const mustCoverFront = front.remaining < 220;

        let best = front;
        let bestSc = -1e18;
        for (let i = 0; i < n; i++) {
          const c = candidates[i];
          if (mustCoverFront) {
            const dfx = c.x - front.x;
            const dfy = c.y - front.y;
            if (dfx * dfx + dfy * dfy > sp2) continue;
          }
          let totalDmg = 0;
          let minRem = c.remaining;
          for (let j = 0; j < n; j++) {
            const o = candidates[j];
            const dx = o.x - c.x;
            const dy = o.y - c.y;
            if (dx * dx + dy * dy <= sp2) {
              const raw = Math.max(1, baseDmg - o.armor);
              const eff = o.hp < raw ? o.hp : raw;
              let w = 1.0;
              if (o.type === "mender") w = 3.0;
              else if (o.type === "runner" || o.type === "splitling") w = 1.3;
              totalDmg += eff * w;
              if (o.remaining < minRem) minRem = o.remaining;
            }
          }
          const routeLen = c.air ? 2800 : 4600;
          const prog = (routeLen - minRem) / routeLen;
          let sc = totalDmg * (1.0 + 1.25 * prog * prog);
          if (minRem < 750) {
            const u = (750 - minRem) / 750;
            sc *= (1.0 + 4.5 * u * u);
          }
          if (sc > bestSc) {
            bestSc = sc;
            best = c;
          }
        }
        return best.id;
      }

      if (turret.type === "lance") {
        const dmg = turret.tier === 1 ? 180 : turret.tier === 2 ? 288 : 460;
        let best = candidates[0];
        let bestSc = -1e18;
        for (let i = 0; i < n; i++) {
          const c = candidates[i];
          if (c.remaining < 420) {
            const sc = 1e9 - c.remaining * 1000 + c.hp;
            if (sc > bestSc) { bestSc = sc; best = c; }
            continue;
          }
          const eff = c.hp < dmg ? c.hp : dmg;
          const armorVal = c.armor * 6.0;
          const mult = c.type === "brute" ? 2.5 : (c.type === "mender" ? 2.5 : (c.type === "runner" ? 1.5 : 1.0));
          const prog = (4600 - c.remaining) / 4600;
          const sc = (eff + armorVal) * mult * (1.0 + 0.9 * prog * prog);
          if (sc > bestSc) {
            bestSc = sc;
            best = c;
          }
        }
        return best.id;
      }

      if (turret.type === "bolt") {
        const dmg = turret.tier === 1 ? 26 : turret.tier === 2 ? 41 : 65;
        let best = candidates[0];
        let bestSc = -1e18;
        for (let i = 0; i < n; i++) {
          const c = candidates[i];
          const raw = Math.max(1, dmg - c.armor);
          if (c.remaining < 550) {
            const killB = c.hp <= raw ? 50000 : 0;
            const sc = 1e8 - c.remaining * 1000 + killB;
            if (sc > bestSc) { bestSc = sc; best = c; }
            continue;
          }
          const eff = c.hp < raw ? c.hp : raw;
          const routeLen = c.air ? 2800 : 4600;
          const prog = (routeLen - c.remaining) / routeLen;
          const killB = c.hp <= raw ? dmg * 0.9 : 0;
          const airB = c.air ? dmg * 0.45 : 0;
          const mendB = c.type === "mender" ? dmg * 0.8 : 0;
          const runB = c.type === "runner" ? dmg * 0.5 : 0;
          const sc = (eff + killB + airB + mendB + runB) * (1.0 + 2.2 * prog * prog);
          if (sc > bestSc) {
            bestSc = sc;
            best = c;
          }
        }
        return best.id;
      }

      return candidates[0].id;
    }
  };
}
</script>

<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks, recordReplay) {
  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return (t ^ (t >>> 14)) >>> 0;
    };
  }

  const GROUND_TILES = [[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]];
  const AIR_TILES = [[0,6],[21,6],[21,11],[23,11]];
  const SLOT_TILES = [
    [3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],
    [14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]
  ];

  function buildRoute(tiles) {
    const pts = tiles.map(function (p) { return [p[0] * 100 + 50, p[1] * 100 + 50]; });
    const segs = [];
    let total = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const x0 = pts[i][0], y0 = pts[i][1];
      const x1 = pts[i + 1][0], y1 = pts[i + 1][1];
      const len = Math.abs(x1 - x0) + Math.abs(y1 - y0);
      segs.push({ x0: x0, y0: y0, dx: Math.sign(x1 - x0), dy: Math.sign(y1 - y0), start: total, len: len });
      total += len;
    }
    return { pts: pts, segs: segs, length: total };
  }

  const GROUND_ROUTE = buildRoute(GROUND_TILES);
  const AIR_ROUTE = buildRoute(AIR_TILES);

  function posAndDirAt(route, progress) {
    if (progress <= 0) {
      const s0 = route.segs[0];
      return [route.pts[0][0], route.pts[0][1], s0.dx, s0.dy];
    }
    for (let i = 0; i < route.segs.length; i++) {
      const s = route.segs[i];
      if (progress <= s.start + s.len) {
        const d = progress - s.start;
        return [s.x0 + s.dx * d, s.y0 + s.dy * d, s.dx, s.dy];
      }
    }
    const last = route.pts[route.pts.length - 1];
    const ls = route.segs[route.segs.length - 1];
    return [last[0], last[1], ls.dx, ls.dy];
  }

  const TURRET_DEFS = {
    bolt:   { idx: 0, cost: 50,  damage: 26,  period: 8,  range: 300, splash: 0,  slow: 0,  pierce: false, ground: true,  air: true },
    cannon: { idx: 1, cost: 90,  damage: 60,  period: 24, range: 260, splash: 90, slow: 0,  pierce: false, ground: true,  air: false },
    frost:  { idx: 2, cost: 70,  damage: 10,  period: 12, range: 240, splash: 0,  slow: 30, pierce: false, ground: true,  air: true },
    lance:  { idx: 3, cost: 120, damage: 180, period: 36, range: 360, splash: 0,  slow: 0,  pierce: true,  ground: true,  air: false },
    flak:   { idx: 4, cost: 80,  damage: 40,  period: 10, range: 320, splash: 70, slow: 0,  pierce: false, ground: false, air: true }
  };

  const ENEMY_ORDER = [
    { type: "grunt",    baseHp: 60,  speed: 10, bounty: 4, leak: 1, air: 0, firstWave: 1, weight: 10 },
    { type: "runner",   baseHp: 40,  speed: 20, bounty: 4, leak: 1, air: 0, firstWave: 2, weight: 4 },
    { type: "wisp",     baseHp: 50,  speed: 12, bounty: 6, leak: 2, air: 1, firstWave: 3, weight: 3 },
    { type: "brute",    baseHp: 150, speed: 6,  bounty: 9, leak: 3, air: 0, firstWave: 4, weight: 3 },
    { type: "splitter", baseHp: 90,  speed: 8,  bounty: 6, leak: 2, air: 0, firstWave: 6, weight: 2 },
    { type: "mender",   baseHp: 70,  speed: 8,  bounty: 7, leak: 2, air: 0, firstWave: 8, weight: 1 }
  ];
  const ENEMY_MAP = {};
  for (let i = 0; i < ENEMY_ORDER.length; i++) ENEMY_MAP[ENEMY_ORDER[i].type] = ENEMY_ORDER[i];

  function hpMult(w) {
    let m = 1000;
    for (let i = 2; i <= w; i++) m = Math.floor(m * 108 / 100);
    return m;
  }

  function turretStats(type, tier) {
    const d = TURRET_DEFS[type];
    let dmg = d.damage;
    for (let t = 2; t <= tier; t++) dmg = Math.floor(dmg * 16 / 10);
    return {
      dmg: dmg,
      range: d.range + 30 * (tier - 1),
      period: d.period,
      splash: d.splash,
      slow: d.slow,
      pierce: d.pierce,
      ground: d.ground,
      air: d.air
    };
  }

  function fnv1a(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return (h >>> 0).toString(16).padStart(8, "0");
  }

  const rng = mulberry32(seed);
  const strat = createStrategy();
  let gold = 250;
  let baseHp = 10;
  let currentWave = 0;
  let nextEnemyId = 1;
  const log = [];

  const slots = SLOT_TILES.map(function (p, i) {
    return { slot: i, x: p[0] * 100 + 50, y: p[1] * 100 + 50, turret: null };
  });

  const enemies = [];
  const spawnQueue = [];

  function genWave(w) {
    const count = 4 + Math.floor(3 * w / 5);
    const avail = [];
    let sumW = 0;
    for (let i = 0; i < ENEMY_ORDER.length; i++) {

                sl.turret.spent += upCost;

          const dy = e.y - ty;

        chosen.hp -= dmg;
        if (st.slow > 0) chosen.slow = st.slow;
      }

      const spawnedSplitlings = [];
      for (let i = 0; i < enemies.length; i++) {

          log.push([tick, "K", e.id, sIdx]);
          if (replay) {

                air: 0,
                route: GROUND_ROUTE,
                progress: e.progress,
                remaining: e.remaining,
                x: e.x,
                y: e.y,

                dy: pd[3],

                slow: 0
              });

          }
          enemies.splice(i, 1);
          i--;
        }
      }
      for (let i = 0; i < spawnedSplitlings.length; i++) {
        enemies.push(spawnedSplitlings[i]);
      }
    }

    // 6. Slow timers
    for (let i = 0; i < enemies.length; i++) {
      if (enemies[i].slow > 0) enemies[i].slow -= 1;
    }

    if (replay) {
      replay.frames.push({
        tick: tick,
        wave: currentWave,
        gold: gold,
        baseHp: baseHp,
        nextWave: shownNextWave,
        turrets: slots.map(function (s) {
          return s.turret ? { type: s.turret.type, tier: s.turret.tier, aimX: s.turret.aimX, aimY: s.turret.aimY } : null;
        }),
        enemies: enemies.map(function (e) {
          return { id: e.id, type: e.type, x: e.x, y: e.y, dx: e.dx, dy: e.dy, hp: e.hp, maxHp: e.maxHp, air: e.air, slow: e.slow > 0 ? 1 : 0 };

  // =========================================================================
  // BOARD, ROAD, AIR LANE, 16 BUILD PADS & FORTIFIED KEEP
  // =========================================================================
  const GROUND_TILES = [[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]];
  const AIR_TILES = [[0,6],[21,6],[21,11],[23,11]];
  const SLOT_TILES = [
    [3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],

  ];

  // Board plinth & terrain surface (24 x 14 tiles on XZ, tile (x,y) centered at (x+0.5, 0, y+0.5))
  const plinthGeo = new THREE.BoxGeometry(24.4, 0.55, 14.4);
  const plinthMat = stdMat({ color: 0x11141c, roughness: 0.92, metalness: 0.08 });
  const plinth = new THREE.Mesh(plinthGeo, plinthMat);
  plinth.position.set(12, -0.29, 7);
  plinth.receiveShadow = true;
  scene.add(plinth);

  const groundPlane = new THREE.Mesh(
    new THREE.PlaneGeometry(24, 14),
    stdMat({ map: makeTerrainTexture(), roughness: 0.94, metalness: 0.05 })

  groundPlane.rotation.x = -Math.PI / 2;
  groundPlane.position.set(12, 0, 7);
  groundPlane.receiveShadow = true;
  scene.add(groundPlane);

  // Build lookup of occupied road & slot tiles so rough terrain rocks avoid road/pads
  const occupiedTile = new Set();
  for (let i = 0; i < SLOT_TILES.length; i++) {
    occupiedTile.add(SLOT_TILES[i][0] + "," + SLOT_TILES[i][1]);
  }
  const roadTex = makeStoneRoadTexture();
  const roadMat = stdMat({ map: roadTex, color: 0x8f96a6, roughness: 0.85, metalness: 0.1 });
  const curbMat = stdMat({ color: 0x3b4150, roughness: 0.8, metalness: 0.15 });

  for (let i = 0; i < GROUND_TILES.length - 1; i++) {
    const a = GROUND_TILES[i], b = GROUND_TILES[i + 1];
    const minX = Math.min(a[0], b[0]), maxX = Math.max(a[0], b[0]);
    const minY = Math.min(a[1], b[1]), maxY = Math.max(a[1], b[1]);
    for (let tx = minX; tx <= maxX; tx++) {
      for (let ty = minY; ty <= maxY; ty++) {
        occupiedTile.add(tx + "," + ty);
      }
    }
    const w = (maxX - minX) + 0.92;
    const d = (maxY - minY) + 0.92;
    const cx = (minX + maxX) * 0.5 + 0.5;
    const cz = (minY + maxY) * 0.5 + 0.5;
    const segMesh = new THREE.Mesh(new THREE.BoxGeometry(w, 0.05, d), roadMat);
    segMesh.position.set(cx, 0.025, cz);
    segMesh.receiveShadow = true;
    scene.add(segMesh);

    const curbMesh = new THREE.Mesh(new THREE.BoxGeometry(w + 0.12, 0.032, d + 0.12), curbMat);
    curbMesh.position.set(cx, 0.014, cz);
    curbMesh.receiveShadow = true;
    scene.add(curbMesh);
  }
  // Reserve tiles around keep (23,11) and spawn gates
  for (let dx = -1; dx <= 1; dx++) {
    for (let dz = -1; dz <= 1; dz++) {
      occupiedTile.add((23 + dx) + "," + (11 + dz));
    }
  }
  occupiedTile.add("0,6");

  // Rough terrain rocks on unoccupied tiles (instanced)
  const rockPositions = [];
  for (let tx = 0; tx < 24; tx++) {
    for (let ty = 0; ty < 14; ty++) {
      if (occupiedTile.has(tx + "," + ty)) continue;
      const count = visRng() % 3;
      for (let k = 0; k < count; k++) {
        const rx = tx + 0.18 + (visRng() % 64) / 100;
        const rz = ty + 0.18 + (visRng() % 64) / 100;
        const sc = 0.11 + (visRng() % 18) / 100;
        const ry = (visRng() % 628) / 100;
        rockPositions.push({ x: rx, z: rz, sc: sc, ry: ry });
      }
    }
  }
  const rockInst = new THREE.InstancedMesh(
    new THREE.DodecahedronGeometry(1, 0),
    stdMat({ color: 0x262c38, roughness: 0.92, metalness: 0.06 }),
    Math.max(1, rockPositions.length)
  );
  rockInst.castShadow = true;
  rockInst.receiveShadow = true;
  const dummyObj = new THREE.Object3D();
  for (let i = 0; i < rockPositions.length; i++) {
    const rp = rockPositions[i];
    dummyObj.position.set(rp.x, rp.sc * 0.35, rp.z);
    dummyObj.rotation.set(rp.ry * 0.3, rp.ry, 0);
    dummyObj.scale.set(rp.sc * 1.2, rp.sc * 0.65, rp.sc);
    dummyObj.updateMatrix();
    rockInst.setMatrixAt(i, dummyObj.matrix);
  }
  rockInst.count = rockPositions.length;
  scene.add(rockInst);

  // Entry gate pillars at ground spawn (0.5, 2.5)
  const gateMat = stdMat({ color: 0x3b404e, roughness: 0.75, metalness: 0.2 });
  for (let s = -1; s <= 1; s += 2) {
    const p = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.75, 0.22), gateMat);
    p.position.set(0.22, 0.375, 2.5 + s * 0.48);
    p.castShadow = true;
    scene.add(p);

  // Faint glowing air lane along (0,6)->(21,6)->(21,11)->(23,11) at y = 0.8
  const airLaneMat = basicMat({
    color: 0x26e6ff,
    transparent: true,
    opacity: 0.16,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    side: THREE.DoubleSide
  });
  for (let i = 0; i < AIR_TILES.length - 1; i++) {
    const a = AIR_TILES[i], b = AIR_TILES[i + 1];
    const minX = Math.min(a[0], b[0]), maxX = Math.max(a[0], b[0]);
    const minY = Math.min(a[1], b[1]), maxY = Math.max(a[1], b[1]);
    const w = (maxX - minX) + 0.28;
    const d = (maxY - minY) + 0.28;
    const cx = (minX + maxX) * 0.5 + 0.5;
    const cz = (minY + maxY) * 0.5 + 0.5;
    const lane = new THREE.Mesh(new THREE.PlaneGeometry(w, d), airLaneMat);
    lane.rotation.x = -Math.PI / 2;
    lane.position.set(cx, 0.8, cz);
    scene.add(lane);

  // Animated air-lane directional chevrons (driven purely by simTime)
  const airChevrons = [];
  const chevShape = new THREE.Shape();
  chevShape.moveTo(-0.14, -0.14);
  chevShape.lineTo(0.14, 0);
  chevShape.lineTo(-0.14, 0.14);
  chevShape.lineTo(-0.05, 0);
  chevShape.closePath();
  const chevGeo = new THREE.ShapeGeometry(chevShape);
  chevGeo.rotateX(-Math.PI / 2);
  const chevMat = basicMat({
    color: 0x56f4ff,
    transparent: true,
    opacity: 0.32,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  for (let k = 0; k < 14; k++) {
    const m = new THREE.Mesh(chevGeo, chevMat);
    scene.add(m);
    airChevrons.push(m);
  }

  // 16 Build Pads (low stone octagonal platforms)
  const padOuterMat = stdMat({ color: 0x343b49, roughness: 0.78, metalness: 0.22 });
  const padInnerMat = stdMat({ color: 0x4b5568, roughness: 0.65, metalness: 0.3 });
  const padGeoOuter = new THREE.CylinderGeometry(0.42, 0.46, 0.1, 8);
  const padGeoInner = new THREE.CylinderGeometry(0.32, 0.34, 0.12, 8);
  for (let i = 0; i < 16; i++) {
    const sx = SLOT_TILES[i][0] + 0.5;
    const sz = SLOT_TILES[i][1] + 0.5;
    const po = new THREE.Mesh(padGeoOuter, padOuterMat);
    po.position.set(sx, 0.05, sz);
    po.receiveShadow = true;
    po.castShadow = true;
    scene.add(po);
    const pi = new THREE.Mesh(padGeoInner, padInnerMat);
    pi.position.set(sx, 0.06, sz);
    pi.receiveShadow = true;
    scene.add(pi);
  }

  // Fortified Walled Keep at tile (23, 11) -> world (23.5, 0, 11.5), ~1.5 tiles across
  const keepGroup = new THREE.Group();
  keepGroup.position.set(23.5, 0, 11.5);
  scene.add(keepGroup);

  const keepStoneMat = stdMat({ color: 0x5c6475, roughness: 0.72, metalness: 0.18, emissive: 0x000000 });
  const keepTrimMat = stdMat({ color: 0x8b7352, roughness: 0.55, metalness: 0.45, emissive: 0x000000 });
  const keepBeaconMat = basicMat({ color: 0xffaa44 });

  const keepIntactGroup = new THREE.Group();
  keepGroup.add(keepIntactGroup);

  const keepPlinth = new THREE.Mesh(new THREE.BoxGeometry(1.55, 0.32, 1.55), keepStoneMat);
  keepPlinth.position.y = 0.16;
  keepPlinth.castShadow = true;
  keepPlinth.receiveShadow = true;
  keepIntactGroup.add(keepPlinth);

  const keepCore = new THREE.Mesh(new THREE.BoxGeometry(0.92, 1.18, 0.92), keepStoneMat);
  keepCore.position.y = 0.72;
  keepCore.castShadow = true;
  keepCore.receiveShadow = true;
  keepIntactGroup.add(keepCore);

  const keepCrown = new THREE.Mesh(new THREE.BoxGeometry(1.04, 0.18, 1.04), keepTrimMat);

  keepCrown.castShadow = true;

  const keepBeacon = new THREE.Mesh(new THREE.OctahedronGeometry(0.22, 0), keepBeaconMat);
  keepBeacon.position.y = 1.65;

  // 10 Destructible outer wall / battlement chunks (one per Base HP point!)
  const keepWallChunks = [];
  const chunkOffsets = [
    [-0.62, 0.52, -0.52], [-0.62, 0.52, 0.0], [-0.62, 0.52, 0.52],
    [-0.20, 0.56, -0.62], [0.28, 0.56, -0.62],
    [-0.20, 0.56, 0.62],  [0.28, 0.56, 0.62],
    [0.62, 0.52, -0.44],  [0.62, 0.52, 0.44],
    [0.0, 1.52, 0.0]
  ];
  const chunkGeo = new THREE.BoxGeometry(0.34, 0.44, 0.34);
  for (let i = 0; i < 10; i++) {
    const cm = new THREE.Mesh(chunkGeo, i % 3 === 0 ? keepTrimMat : keepStoneMat);
    cm.castShadow = true;
    cm.receiveShadow = true;
    const co = chunkOffsets[i];
    const dirLen = Math.hypot(co[0], co[2]) || 1;
    const vx = (co[0] / dirLen) * (1.8 + hashFloat(i * 31 + 7) * 1.2) - 0.6;
    const vz = (co[2] / dirLen) * (1.8 + hashFloat(i * 53 + 11) * 1.2);
    const vy = 2.4 + hashFloat(i * 97 + 3) * 1.4;
    keepGroup.add(cm);
    keepWallChunks.push({
      mesh: cm,
      ox: co[0], oy: co[1], oz: co[2],
      vx: vx, vy: vy, vz: vz,
      rx: (hashFloat(i * 17) - 0.5) * 9,
      rz: (hashFloat(i * 29) - 0.5) * 9
    });
  }

  // Keep collapse debris pool (72 stone blocks + shockwave ring for FALL_TICK)
  const fallRubbleCount = 72;
  const fallRubbleInst = new THREE.InstancedMesh(
    new THREE.BoxGeometry(0.24, 0.2, 0.24),
    keepStoneMat,
    fallRubbleCount
  );
  fallRubbleInst.castShadow = true;
  fallRubbleInst.visible = false;
  keepGroup.add(fallRubbleInst);
  const fallRubbleSeeds = [];
  for (let i = 0; i < fallRubbleCount; i++) {
    const ang = hashFloat(i * 131 + 42) * Math.PI * 2;
    const spd = 1.2 + hashFloat(i * 197 + 42) * 4.5;
    fallRubbleSeeds.push({
      ox: (hashFloat(i * 41 + 1) - 0.5) * 1.1,
      oy: 0.2 + hashFloat(i * 67 + 2) * 1.3,
      oz: (hashFloat(i * 89 + 3) - 0.5) * 1.1,
      vx: Math.cos(ang) * spd,
      vy: 2.2 + hashFloat(i * 113 + 4) * 4.2,
      vz: Math.sin(ang) * spd,
      sc: 0.6 + hashFloat(i * 149 + 5) * 1.0,
      rx: (hashFloat(i * 173 + 6) - 0.5) * 10,
      rz: (hashFloat(i * 211 + 7) - 0.5) * 10
    });

  const ringBaseGeo = new THREE.RingGeometry(0.84, 1.0, 40);
  ringBaseGeo.rotateX(-Math.PI / 2);
  const fallShockRing = new THREE.Mesh(
    ringBaseGeo,
    basicMat({ color: 0xff6b3d, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide })
  );
  fallShockRing.position.set(23.5, 0.08, 11.5);
  fallShockRing.visible = false;
  scene.add(fallShockRing);

  // =========================================================================
  // 16 TURRET SLOTS (5 Distinct Silhouettes & Colours + 1..3 Tier Rings/Pips)
  // =========================================================================
  const turretMats = {
    bolt:   stdMat({ color: 0x4c8ed9, roughness: 0.38, metalness: 0.62 }),
    boltHi: basicMat({ color: 0x8cc6ff }),
    cannon: stdMat({ color: 0xcd7f32, roughness: 0.42, metalness: 0.68 }),
    canDark:stdMat({ color: 0x4a3520, roughness: 0.6, metalness: 0.5 }),
    frost:  stdMat({ color: 0xdff6ff, roughness: 0.22, metalness: 0.2, emissive: 0x246888, emissiveIntensity: 0.45 }),
    frostHi:basicMat({ color: 0xaef2ff }),
    lance:  stdMat({ color: 0xd92638, roughness: 0.35, metalness: 0.58, emissive: 0x3a050b, emissiveIntensity: 0.35 }),
    lanceHi:basicMat({ color: 0xff5468 }),
    flak:   stdMat({ color: 0x1abc9c, roughness: 0.38, metalness: 0.55 }),
    flakHi: basicMat({ color: 0x5fffe0 }),

  };

  function buildTurretVisualForSlot(sx, sz) {
    const root = new THREE.Group();
    root.position.set(sx, 0.11, sz);
    root.visible = false;
    scene.add(root);

    // Tier rings & pips (1 to 3 bright rings + pips)
    const tierRings = [];
    for (let t = 0; t < 3; t++) {
      const rg = new THREE.Group();
      const torus = new THREE.Mesh(
        new THREE.TorusGeometry(0.30 + t * 0.055, 0.018, 8, 24),
        turretMats.tierPip
      );
      torus.rotation.x = Math.PI / 2;
      torus.position.y = 0.03 + t * 0.055;
      rg.add(torus);
      const pip = new THREE.Mesh(new THREE.SphereGeometry(0.048, 8, 8), turretMats.tierPip);
      const ang = (t - 1) * 0.55 + Math.PI * 0.5;
      pip.position.set(Math.cos(ang) * 0.36, 0.16, Math.sin(ang) * 0.36);
      rg.add(pip);
      root.add(rg);
      tierRings.push(rg);
    }

    const heads = {};

    // BOLT: Steel-blue twin-rail rapid ballista turret
    const boltG = new THREE.Group();
    const bPed = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.27, 0.22, 8), turretMats.bolt);
    bPed.position.y = 0.11; bPed.castShadow = true; boltG.add(bPed);
    const boltHead = new THREE.Group();
    boltHead.position.y = 0.28;
    const bBody = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.16, 0.34), turretMats.bolt);
    bBody.castShadow = true; boltHead.add(bBody);
    for (let s = -1; s <= 1; s += 2) {
      const rail = new THREE.Mesh(new THREE.CylinderGeometry(0.032, 0.036, 0.46, 8), turretMats.boltHi);
      rail.rotation.x = Math.PI / 2;
      rail.position.set(s * 0.085, 0.02, 0.2);
      boltHead.add(rail);
    }
    boltG.add(boltHead);
    root.add(boltG);
    heads.bolt = { group: boltG, head: boltHead };

    // CANNON: Heavy bronze mortar / howitzer with wide flared barrel
    const canG = new THREE.Group();
    const cBase = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.33, 0.2, 10), turretMats.cannon);
    cBase.position.y = 0.1; cBase.castShadow = true; canG.add(cBase);
    const canHead = new THREE.Group();
    canHead.position.y = 0.26;
    const cCheek = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.18, 0.28), turretMats.canDark);
    canHead.add(cCheek);
    const cBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.145, 0.11, 0.48, 12), turretMats.cannon);
    cBarrel.rotation.x = Math.PI * 0.36;
    cBarrel.position.set(0, 0.12, 0.14);
    cBarrel.castShadow = true;
    canHead.add(cBarrel);
    const cMuzzle = new THREE.Mesh(new THREE.TorusGeometry(0.145, 0.028, 8, 16), turretMats.cannon);
    cMuzzle.rotation.x = -Math.PI * 0.14;
    cMuzzle.position.set(0, 0.22, 0.35);
    canHead.add(cMuzzle);
    canG.add(canHead);
    root.add(canG);
    heads.cannon = { group: canG, head: canHead };

    // FROST: Tall ice-white crystalline obelisk with hovering cryo-prism
    const frG = new THREE.Group();
    const fSpire = new THREE.Mesh(new THREE.ConeGeometry(0.24, 0.56, 6), turretMats.frost);
    fSpire.position.y = 0.28; fSpire.castShadow = true; frG.add(fSpire);
    const frHead = new THREE.Group();
    frHead.position.y = 0.72;
    const fCrystal = new THREE.Mesh(new THREE.OctahedronGeometry(0.17, 0), turretMats.frostHi);
    frHead.add(fCrystal);
    frG.add(frHead);
    root.add(frG);
    heads.frost = { group: frG, head: frHead };

    // LANCE: Long angular crimson rail-lance with glowing core
    const lanG = new THREE.Group();
    const lBase = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.30, 0.22, 6), turretMats.lance);
    lBase.position.y = 0.11; lBase.castShadow = true; lanG.add(lBase);
    const lanHead = new THREE.Group();
    lanHead.position.y = 0.30;
    const lCore = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.2, 0.44), turretMats.lance);
    lCore.castShadow = true; lanHead.add(lCore);
    const lSpear = new THREE.Mesh(new THREE.ConeGeometry(0.085, 0.68, 4), turretMats.lanceHi);
    lSpear.rotation.x = Math.PI / 2;
    lSpear.position.set(0, 0.02, 0.36);
    lanHead.add(lSpear);
    lanG.add(lanHead);
    root.add(lanG);
    heads.lance = { group: lanG, head: lanHead };

    // FLAK: Teal quad-barrel skyward anti-air battery
    const flkG = new THREE.Group();
    const kBase = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.3, 0.18, 8), turretMats.flak);
    kBase.position.y = 0.09; kBase.castShadow = true; flkG.add(kBase);
    const flkHead = new THREE.Group();
    flkHead.position.y = 0.26;
    const kPod = new THREE.Mesh(new THREE.SphereGeometry(0.2, 10, 8), turretMats.flak);
    flkHead.add(kPod);
    const bOffsets = [[-0.08, 0.06], [0.08, 0.06], [-0.08, -0.05], [0.08, -0.05]];
    for (let b = 0; b < 4; b++) {

    flkG.add(flkHead);
    root.add(flkG);
    heads.flak = { group: flkG, head: flkHead };

    return { root: root, tierRings: tierRings, heads: heads, x: sx, z: sz };
  }

  const slotVisuals = [];
  for (let i = 0; i < 16; i++) {
    slotVisuals.push(buildTurretVisualForSlot(SLOT_TILES[i][0] + 0.5, SLOT_TILES[i][1] + 0.5));
  }

  // =========================================================================
  // INSTANCED ENEMIES (7 Distinct Silhouettes & Colours + Slow Tint + HP Bars)
  // =========================================================================
  const MAX_ENEMIES = 220;

  function makeInstancedEnemyPool(geo, matOpts, count) {
    const mat = stdMat(matOpts);
    const im = new THREE.InstancedMesh(geo, mat, count);
    im.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    im.castShadow = true;
    im.receiveShadow = true;
    im.frustumCulled = false;
    // Initialize instanceColor buffer
    const white = new THREE.Color(0xffffff);
    for (let i = 0; i < count; i++) im.setColorAt(i, white);
    scene.add(im);
    return im;
  }

  const gruntMesh = makeInstancedEnemyPool(

    MAX_ENEMIES
  );

  runnerGeo.scale(0.85, 0.7, 1.05);
  const runnerMesh = makeInstancedEnemyPool(

  );
  // 3. Wisp: Glowing cyan floating octahedron at y = 0.8 + ground shadow disc
  const wispMat = basicMat({ color: 0xffffff });

  const bruteBodyMesh = makeInstancedEnemyPool(
    new THREE.BoxGeometry(0.46, 0.48, 0.46),
    { color: 0xffffff, roughness: 0.55, metalness: 0.65 },

  );
  const brutePlateGeo = new THREE.BoxGeometry(0.56, 0.22, 0.34);
  const brutePlateMesh = makeInstancedEnemyPool(
    brutePlateGeo,
    { color: 0xffffff, roughness: 0.35, metalness: 0.35, emissive: 0x551c00, emissiveIntensity: 0.35 },
    MAX_ENEMIES
  );

  // 5. Splitter: Large purple crystalline cluster
  const splitterMesh = makeInstancedEnemyPool(
    new THREE.DodecahedronGeometry(0.28, 0),
    { color: 0xffffff, roughness: 0.32, metalness: 0.28, emissive: 0x260842, emissiveIntensity: 0.3 },
    MAX_ENEMIES
  );
  // 6. Splitling: Small purple crystal shard
  const splitlingMesh = makeInstancedEnemyPool(

  // Detached in-memory digit glyph atlas ('0'..'9' only — zero words or letters!)
  function createDigitAtlasTextures() {
    const textures = [];
    for (let d = 0; d <= 9; d++) {
      const c = document.createElement("canvas");
      c.width = 96;
      c.height = 128;
      const ctx = c.getContext("2d");
      ctx.clearRect(0, 0, 96, 128);
      ctx.font = "800 98px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.lineJoin = "round";
      ctx.lineWidth = 10;
      ctx.strokeStyle = "rgba(6, 8, 14, 0.82)";
      ctx.strokeText(String(d), 48, 68);
      ctx.fillStyle = "#ffffff";
      ctx.fillText(String(d), 48, 68);
      const tex = new THREE.CanvasTexture(c);
      tex.encoding = THREE.sRGBEncoding;
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      textures.push(tex);
    }
    return textures;
  }

  function renderDigitNumber(pool, startIdx, num, leftX, centerY, heightPx) {
    const str = String(Math.max(0, Math.floor(num)));
    const charW = heightPx * 0.62;
    const stepX = heightPx * 0.56;
    for (let i = 0; i < str.length && (startIdx + i) < pool.length; i++) {
      const code = str.charCodeAt(i) - 48;
      const m = pool[startIdx + i];
      m.material.map = digitTextures[code >= 0 && code <= 9 ? code : 0];
      m.position.set(leftX + i * stepX + charW * 0.5, centerY, 0);
      m.scale.set(charW, heightPx, 1);
      m.visible = true;
    }
    return { used: str.length, width: str.length * stepX };
  }

  function updateHudLayoutAndState(wave, gold, baseHp, nextWave, curSimTime) {

      pDigitIdx += res.used;
      curX += res.width + prevH * 0.65;

    // 4. Base HP: 10 pips in top-right corner with leak extinguish flash

          p.fill.visible = true;
          const fl = 1 - dtLost / 0.28;
          p.mat.color.setRGB(1.0, 0.85 * fl, 0.85 * fl);
