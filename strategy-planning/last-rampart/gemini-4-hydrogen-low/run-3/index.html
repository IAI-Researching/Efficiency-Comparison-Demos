<script id="rampart-strategy">
function createStrategy() {
  const BUILD_ORDER = [
    { slot: 1,  type: "bolt" },
    { slot: 3,  type: "bolt" },
    { slot: 6,  type: "frost" },
    { slot: 7,  type: "cannon" },
    { slot: 5,  type: "flak" },
    { slot: 8,  type: "bolt" },
    { slot: 10, type: "flak" },
    { slot: 12, type: "cannon" },
    { slot: 13, type: "frost" },
    { slot: 2,  type: "lance" },
    { slot: 11, type: "lance" },
    { slot: 4,  type: "cannon" },
    { slot: 0,  type: "bolt" },
    { slot: 14, type: "bolt" },
    { slot: 9,  type: "lance" },
    { slot: 15, type: "frost" }
  ];

  const COST = { bolt: 50, cannon: 90, frost: 70, lance: 120, flak: 80 };
  const UP_PRIO = { lance: 5, cannon: 4, flak: 3, bolt: 2, frost: 1 };

  return {
    plan(state) {
      const actions = [];
      let g = state.gold;

      for (let i = 0; i < BUILD_ORDER.length; i++) {
        const b = BUILD_ORDER[i];
        const sl = state.slots[b.slot];
        if (!sl.turret) {
          const c = COST[b.type];
          if (g >= c) {
            actions.push({ op: "build", slot: b.slot, type: b.type });
            g -= c;
          }
        }
      }

      const upgradable = [];
      for (let i = 0; i < state.slots.length; i++) {
        const t = state.slots[i].turret;
        if (t && t.tier < 3) {
          const cost = t.tier === 1 ? COST[t.type] : COST[t.type] * 2;
          upgradable.push({ slot: i, tier: t.tier, prio: UP_PRIO[t.type], cost });
        }
      }
      upgradable.sort((a, b) => (a.tier - b.tier) || (b.prio - a.prio));
      for (let i = 0; i < upgradable.length; i++) {
        const u = upgradable[i];
        if (g >= u.cost) {
          actions.push({ op: "upgrade", slot: u.slot });
          g -= u.cost;
        }
      }

      return actions;
    },

    target(turret, candidates) {
      if (turret.type === "frost") {
        let best = null;
        let bestRem = Infinity;
        for (let i = 0; i < candidates.length; i++) {
          const c = candidates[i];
          if (c.slowed === 0 && c.remaining < bestRem) {
            bestRem = c.remaining;
            best = c;
          }
        }
        if (best) return best.id;
      } else if (turret.type === "lance") {
        let best = candidates[0];
        let bestScore = -1e9;
        for (let i = 0; i < candidates.length; i++) {
          const c = candidates[i];
          if (c.remaining < 400) return c.id;
          const s = c.armor * 20 + c.hp * 0.5 - c.remaining * 0.1;
          if (s > bestScore) { bestScore = s; best = c; }
        }
        return best.id;
      }
      let best = candidates[0];
      for (let i = 1; i < candidates.length; i++) {
        if (candidates[i].remaining < best.remaining) best = candidates[i];
      }
      return best.id;
    }
  };
}
</script>

<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks, onTick) {
  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return (t ^ (t >>> 14)) >>> 0;
    };
  }

  const GROUND_PTS = [[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]].map(([x,y])=>[x*100+50, y*100+50]);
  const AIR_PTS = [[0,6],[21,6],[21,11],[23,11]].map(([x,y])=>[x*100+50, y*100+50]);

  function buildRoute(pts) {
    const segs = [];
    let total = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const [x0, y0] = pts[i], [x1, y1] = pts[i+1];
      const len = Math.abs(x1 - x0) + Math.abs(y1 - y0);
      segs.push({ x0, y0, x1, y1, start: total, end: total + len, dx: Math.sign(x1 - x0), dy: Math.sign(y1 - y0) });
      total += len;
    }
    return { segs, length: total };
  }

  const GROUND_ROUTE = buildRoute(GROUND_PTS);
  const AIR_ROUTE = buildRoute(AIR_PTS);

  function posAt(route, progress) {
    if (progress <= 0) return [route.segs[0].x0, route.segs[0].y0, route.segs[0].dx, route.segs[0].dy];
    for (let i = 0; i < route.segs.length; i++) {
      const s = route.segs[i];
      if (progress <= s.end) {
        const d = progress - s.start;
        return [s.x0 + s.dx * d, s.y0 + s.dy * d, s.dx, s.dy];
      }
    }
    const last = route.segs[route.segs.length - 1];
    return [last.x1, last.y1, last.dx, last.dy];
  }

  const SLOTS_XY = [
    [3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],
    [14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]
  ].map(([x,y])=>[x*100+50, y*100+50]);

  const TURRETS = {
    bolt:   { idx: 0, cost: 50,  dmg: 26,  period: 8,  range: 300, splash: 0,  slow: 0,  pierce: false, ground: true,  air: true },
    cannon: { idx: 1, cost: 90,  dmg: 60,  period: 24, range: 260, splash: 90, slow: 0,  pierce: false, ground: true,  air: false },
    frost:  { idx: 2, cost: 70,  dmg: 10,  period: 12, range: 240, splash: 0,  slow: 30, pierce: false, ground: true,  air: true },
    lance:  { idx: 3, cost: 120, dmg: 180, period: 36, range: 360, splash: 0,  slow: 0,  pierce: true,  ground: true,  air: false },
    flak:   { idx: 4, cost: 80,  dmg: 40,  period: 10, range: 320, splash: 70, slow: 0,  pierce: false, ground: false, air: true }
  };

  const ENEMY_TYPES = [
    { type: "grunt",    baseHp: 60,  speed: 10, air: 0, bounty: 4, leak: 1, firstWave: 1, weight: 10 },
    { type: "runner",   baseHp: 40,  speed: 20, air: 0, bounty: 4, leak: 1, firstWave: 2, weight: 4 },
    { type: "wisp",     baseHp: 50,  speed: 12, air: 1, bounty: 6, leak: 2, firstWave: 3, weight: 3 },
    { type: "brute",    baseHp: 150, speed: 6,  air: 0, bounty: 9, leak: 3, firstWave: 4, weight: 3 },
    { type: "splitter", baseHp: 90,  speed: 8,  air: 0, bounty: 6, leak: 2, firstWave: 6, weight: 2 },
    { type: "mender",   baseHp: 70,  speed: 8,  air: 0, bounty: 7, leak: 2, firstWave: 8, weight: 1 }
  ];
  const ENEMY_MAP = {};
  for (const e of ENEMY_TYPES) ENEMY_MAP[e.type] = e;

  const rng = mulberry32(seed >>> 0);
  const strat = createStrategy();
  const hasTarget = typeof strat.target === "function";

  let baseHp = 10;
  let gold = 250;
  let currentWave = 0;
  let nextEnemyId = 1;
  const slots = SLOTS_XY.map(([x, y], i) => ({ slot: i, x, y, turret: null }));
  let enemies = [];
  const spawnQueue = [];
  const log = [];

  const waveMults = [0, 1000];
  function getMult(w) {
    while (waveMults.length <= w) {
      waveMults.push(Math.floor(waveMults[waveMults.length - 1] * 108 / 100));
    }
    return waveMults[w];
  }

  function genWave(w) {
    const count = 4 + Math.floor(3 * w / 5);
    const avail = [];
    let totalW = 0;
    for (const et of ENEMY_TYPES) {
      if (et.firstWave <= w) {
        avail.push(et);
        totalW += et.weight;
      }
    }
    const comp = [];
    for (let i = 0; i < count; i++) {
      let r = rng() % totalW;
      for (let j = 0; j < avail.length; j++) {
        if (r < avail[j].weight) {
          comp.push(avail[j].type);
          break;
        }
        r -= avail[j].weight;
      }
    }
    return comp;
  }

  let nextWaveComp = genWave(1);
  let fallTick = -1;
  let endTick = maxTicks;

  function makeEnemy(type, wave, progress, maxHpOverride) {
    const id = nextEnemyId++;
    const et = ENEMY_MAP[type];
    const air = type === "wisp" ? 1 : 0;
    const route = air ? AIR_ROUTE : GROUND_ROUTE;
    const speed = type === "splitling" ? 12 : et.speed;
    const bounty = type === "splitling" ? 1 : et.bounty;
    const leak = type === "splitling" ? 1 : et.leak;
    const armor = type === "grunt" ? Math.floor(wave / 4) : (type === "brute" ? 6 + wave : 0);
    const maxHp = maxHpOverride !== undefined ? maxHpOverride : Math.floor(et.baseHp * getMult(wave) / 1000);
    const [x, y, dx, dy] = posAt(route, progress);
    return { id, type, wave, air, route, progress, x, y, dx, dy, hp: maxHp, maxHp, speed, armor, bounty, leak, slow: 0, age: 0, dead: false };
  }

  function enemyView(e) {
    return {
      id: e.id, type: e.type, hp: e.hp, maxHp: e.maxHp, x: e.x, y: e.y,
      air: e.air, armor: e.armor, speed: e.speed, slowed: e.slow > 0 ? 1 : 0,
      remaining: e.route.length - e.progress
    };
  }

  for (let tick = 0; tick < maxTicks; tick++) {
    const tickEvents = onTick ? { shots: [], kills: [], heals: [], leaks: 0, builds: [] } : null;

    const nextW = currentWave + 1;
    if (tick === 20 + 40 * (nextW - 1)) {
      currentWave = nextW;
      gold += Math.min(50, Math.floor(gold * 5 / 100)) + 10 + 2 * currentWave;
      const thisWaveComp = nextWaveComp;
      nextWaveComp = genWave(currentWave + 1);

      const state = {
        tick,
        wave: currentWave,
        gold,
        baseHp,
        slots: slots.map(s => ({
          slot: s.slot, x: s.x, y: s.y,
          turret: s.turret ? { type: s.turret.type, tier: s.turret.tier, spent: s.turret.spent } : null
        })),
        enemies: enemies.map(enemyView),
        nextWave: nextWaveComp.slice()
      };

      const actions = strat.plan(state);
      if (Array.isArray(actions)) {
        const limit = Math.min(32, actions.length);
        for (let i = 0; i < limit; i++) {
          const act = actions[i];
          if (!act || typeof act.slot !== "number" || act.slot < 0 || act.slot >= 16) continue;
          const sl = slots[act.slot];
          if (act.op === "build") {
            const def = TURRETS[act.type];
            if (!sl.turret && def && gold >= def.cost) {
              gold -= def.cost;
              sl.turret = { type: act.type, tier: 1, spent: def.cost, cooldown: 0 };
              log.push([tick, "B", sl.slot, def.idx]);
              if (tickEvents) tickEvents.builds.push({ slot: sl.slot, op: "B" });
            }
          } else if (act.op === "upgrade") {
            if (sl.turret && sl.turret.tier < 3) {
              const def = TURRETS[sl.turret.type];
              const cost = sl.turret.tier === 1 ? def.cost : def.cost * 2;
              if (gold >= cost) {
                gold -= cost;
                sl.turret.tier += 1;
                sl.turret.spent += cost;
                log.push([tick, "U", sl.slot, sl.turret.tier]);
                if (tickEvents) tickEvents.builds.push({ slot: sl.slot, op: "U" });
              }
            }
          } else if (act.op === "sell") {
            if (sl.turret) {
              gold += Math.floor(sl.turret.spent * 70 / 100);
              sl.turret = null;
              log.push([tick, "S", sl.slot, 0]);
              if (tickEvents) tickEvents.builds.push({ slot: sl.slot, op: "S" });
            }
          }
        }
      }

      for (let i = 0; i < thisWaveComp.length; i++) {
        spawnQueue.push({ tick: tick + 4 * i, wave: currentWave, idx: i, type: thisWaveComp[i] });
      }
      spawnQueue.sort((a, b) => (a.tick - b.tick) || (a.wave - b.wave) || (a.idx - b.idx));
    }

    while (spawnQueue.length > 0 && spawnQueue[0].tick === tick) {
      const sq = spawnQueue.shift();
      enemies.push(makeEnemy(sq.type, sq.wave, 0));
    }

    let fell = false;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      const spd = e.slow > 0 ? Math.floor(e.speed * 60 / 100) : e.speed;
      e.progress += spd;
      if (e.progress >= e.route.length) {
        baseHp -= e.leak;
        e.dead = true;
        log.push([tick, "L", e.id, baseHp]);
        if (tickEvents) tickEvents.leaks++;
        if (baseHp <= 0) {
          log.push([tick, "F", currentWave, 0]);
          fallTick = tick;
          endTick = tick;
          fell = true;
          break;
        }
      } else {
        const [nx, ny, dx, dy] = posAt(e.route, e.progress);
        e.x = nx;
        e.y = ny;
        e.dx = dx;
        e.dy = dy;
      }
    }
    enemies = enemies.filter(e => !e.dead);
    if (fell) {
      if (onTick) onTick(tick, { wave: currentWave, gold, baseHp, nextWave: nextWaveComp, slots, enemies, events: tickEvents, fell: true });
      break;
    }

    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      e.age += 1;
      if (e.type === "mender" && e.age % 20 === 0) {
        if (tickEvents) tickEvents.heals.push({ x: e.x, y: e.y });
        for (let j = 0; j < enemies.length; j++) {
          const t = enemies[j];
          const dx = t.x - e.x, dy = t.y - e.y;
          if (dx * dx + dy * dy <= 150 * 150) {
            const heal = Math.floor(t.maxHp * 8 / 100);
            t.hp = Math.min(t.maxHp, t.hp + heal);
          }
        }
      }
    }

    for (let sIdx = 0; sIdx < 16; sIdx++) {
      const sl = slots[sIdx];
      const t = sl.turret;
      if (!t) continue;
      if (t.cooldown > 0) {
        t.cooldown -= 1;
        if (t.cooldown > 0) continue;
      }
      const def = TURRETS[t.type];
      const range = def.range + 30 * (t.tier - 1);
      const r2 = range * range;
      const cands = [];
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (e.dead) continue;
        if (e.air ? !def.air : !def.ground) continue;
        const dx = e.x - sl.x, dy = e.y - sl.y;
        if (dx * dx + dy * dy <= r2) cands.push(e);
      }
      if (cands.length === 0) continue;

      let chosen = null;
      if (hasTarget) {
        const tid = strat.target(
          { slot: sl.slot, type: t.type, tier: t.tier, x: sl.x, y: sl.y, range },
          cands.map(enemyView)
        );
        for (let i = 0; i < cands.length; i++) {
          if (cands[i].id === tid) { chosen = cands[i]; break; }
        }
      }
      if (!chosen) {
        let bestRem = Infinity;
        for (let i = 0; i < cands.length; i++) {
          const rem = cands[i].route.length - cands[i].progress;
          if (rem < bestRem) { bestRem = rem; chosen = cands[i]; }
        }
      }

      if (tickEvents) {
        tickEvents.shots.push({
          type: t.type, fromX: sl.x, fromY: sl.y,
          toX: chosen.x, toY: chosen.y, toAir: chosen.air, splash: def.splash
        });
      }

      let dmg = def.dmg;
      if (t.tier >= 2) dmg = Math.floor(dmg * 16 / 10);
      if (t.tier >= 3) dmg = Math.floor(dmg * 16 / 10);

      if (def.splash > 0) {
        const sr2 = def.splash * def.splash;
        for (let i = 0; i < enemies.length; i++) {
          const e = enemies[i];
          if (e.dead) continue;
          if (e.air ? !def.air : !def.ground) continue;
          const dx = e.x - chosen.x, dy = e.y - chosen.y;
          if (dx * dx + dy * dy <= sr2) {
            const deal = def.pierce ? dmg : Math.max(1, dmg - e.armor);
            e.hp -= deal;
            if (def.slow > 0) e.slow = def.slow;
          }
        }
      } else {

        chosen.hp -= deal;

      t.cooldown = def.period;

      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (!e.dead && e.hp <= 0) {

    }

  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  const hash = (h >>> 0).toString(16).padStart(8, "0");
  const score = Math.round(((endTick - 20) / 40) * 100) / 100;
  return { score, fallTick, log, hash };
}

      const ey = en ? e.y + (en.y - e.y) * frac : e.y;
      const worldY = e.air ? 0.8 : 0.22;
      const sc = e.type === "brute" ? 1.35 : (e.type === "splitling" ? 0.65 : 0.95);

      dummy.position.set(ex, worldY, ey);
      dummy.rotation.set(0, Math.atan2(e.dx, e.dy), 0);
      dummy.scale.set(sc, sc, sc);
      dummy.updateMatrix();
      enemyMesh.setMatrixAt(i, dummy.matrix);

      const col = e.slow ? FROST_TINT : (ENEMY_COLORS[e.type] || FROST_TINT);
      enemyMesh.setColorAt(i, col);

      dummy.position.set(ex, worldY + 0.45 * sc, ey);
      dummy.rotation.set(-0.6, 0, 0);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      hpBgMesh.setMatrixAt(i, dummy.matrix);

      const ratio = Math.max(0.01, e.hp / e.maxHp);
      dummy.position.set(ex - 0.24 * (1 - ratio), worldY + 0.45 * sc, ey);
      dummy.scale.set(ratio, 1, 1);
      dummy.updateMatrix();
      hpFgMesh.setMatrixAt(i, dummy.matrix);
    }
    enemyMesh.count = eCount;
    hpBgMesh.count = eCount;
    hpFgMesh.count = eCount;
    enemyMesh.instanceMatrix.needsUpdate = true;
    if (enemyMesh.instanceColor) enemyMesh.instanceColor.needsUpdate = true;
    hpBgMesh.instanceMatrix.needsUpdate = true;
    hpFgMesh.instanceMatrix.needsUpdate = true;

    let bCount = 0;
    let rCount = 0;
    for (let i = 0; i < shotEvents.length; i++) {
      const sh = shotEvents[i];
      const age = simTime - sh.tick / 20;
      if (age >= 0 && age <= 0.15) {
        if (bCount < MAX_FX) {
          const x0 = sh.fromX / 100, z0 = sh.fromY / 100, y0 = 0.5;
          const x1 = sh.toX / 100, z1 = sh.toY / 100, y1 = sh.toAir ? 0.8 : 0.25;
          const dx = x1 - x0, dy = y1 - y0, dz = z1 - z0;
          const len = Math.sqrt(dx * dx + dy * dy + dz * dz) || 0.01;
          dummy.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
          dummy.lookAt(x1, y1, z1);
          const thick = sh.type === "lance" ? 2.2 : 1.0;
          dummy.scale.set(thick, thick, len);
          dummy.updateMatrix();
          beamMesh.setMatrixAt(bCount, dummy.matrix);
          beamMesh.setColorAt(bCount, new THREE.Color(TURRET_COLORS[sh.type]));
          bCount++;
        }
        if (sh.splash > 0 && rCount < MAX_FX) {
          const rad = (sh.splash / 100) * (age / 0.15);
          dummy.position.set(sh.toX / 100, sh.toAir ? 0.8 : 0.05, sh.toY / 100);
          dummy.rotation.set(-Math.PI / 2, 0, 0);
          dummy.scale.set(rad, rad, 1);
          dummy.updateMatrix();
          ringMesh.setMatrixAt(rCount, dummy.matrix);
          ringMesh.setColorAt(rCount, new THREE.Color(TURRET_COLORS[sh.type]));
          rCount++;
        }
      }
    }
    beamMesh.count = bCount;
    beamMesh.instanceMatrix.needsUpdate = true;
    if (beamMesh.instanceColor) beamMesh.instanceColor.needsUpdate = true;

    for (let i = 0; i < healEvents.length && rCount < MAX_FX; i++) {
      const h = healEvents[i];
      const age = simTime - h.tick / 20;
      if (age >= 0 && age <= 0.35) {
        const rad = 1.5 * (age / 0.35);
        dummy.position.set(h.x / 100, 0.06, h.y / 100);
        dummy.rotation.set(-Math.PI / 2, 0, 0);
        dummy.scale.set(rad, rad, 1);
        dummy.updateMatrix();
        ringMesh.setMatrixAt(rCount, dummy.matrix);
        ringMesh.setColorAt(rCount, new THREE.Color(0x44dd77));
        rCount++;
      }
    }
    ringMesh.count = rCount;
    ringMesh.instanceMatrix.needsUpdate = true;
    if (ringMesh.instanceColor) ringMesh.instanceColor.needsUpdate = true;

    let dCount = 0;
    for (let i = 0; i < killEvents.length && dCount < MAX_FX - 4; i++) {
      const ke = killEvents[i];
      const age = simTime - ke.tick / 20;
      if (age >= 0 && age <= 0.4) {
        for (let p = 0; p < 3; p++) {
          const ang = (ke.tick * 1.7 + p * 2.1);
          const px = ke.x / 100 + Math.cos(ang) * age * 1.5;
          const pz = ke.y / 100 + Math.sin(ang) * age * 1.5;
          const py = Math.max(0.05, (ke.air ? 0.8 : 0.25) + age * 2.0 - 4.9 * age * age);
          dummy.position.set(px, py, pz);
          dummy.rotation.set(age * 6, age * 4, 0);
          const sc = Math.max(0.01, 1 - age / 0.4);
          dummy.scale.set(sc, sc, sc);
          dummy.updateMatrix();
          debrisMesh.setMatrixAt(dCount++, dummy.matrix);
        }
      }
    }
    debrisMesh.count = dCount;
    debrisMesh.instanceMatrix.needsUpdate = true;

    for (let i = 0; i < hudDigits.length; i++) hudDigits[i].visible = false;
    const waveSize = Math.max(28, viewH * 0.075);
    const pad = 20;
    waveIcon.position.set(pad + waveSize * 0.35, viewH - pad - waveSize * 0.5, 0);
    waveIcon.scale.set(waveSize * 0.35, waveSize * 0.35, 1);
    let dIdx = 0;
    dIdx += drawDigits(dIdx, s.wave, pad + waveSize * 0.8, viewH - pad - waveSize * 0.5, waveSize);

    const goldSize = waveSize * 0.55;
    goldIcon.position.set(pad + goldSize * 0.4, viewH - pad - waveSize - goldSize * 0.7, 0);
    goldIcon.scale.set(goldSize * 0.4, goldSize * 0.4, 1);
    dIdx += drawDigits(dIdx, s.gold, pad + goldSize * 0.9, viewH - pad - waveSize - goldSize * 0.7, goldSize);

    const counts = { grunt: 0, runner: 0, wisp: 0, brute: 0, splitter: 0, mender: 0 };
    for (let i = 0; i < s.nextWave.length; i++) counts[s.nextWave[i]]++;
    let nx = pad + 10;
    const ny = viewH - pad - waveSize - goldSize * 1.8;
    for (let i = 0; i < 6; i++) {
      const c = counts[NEXT_TYPES[i]];
      if (c > 0) {
        nextIcons[i].visible = true;
        nextIcons[i].position.set(nx, ny, 0);
        nextIcons[i].scale.set(8, 8, 1);
        dIdx += drawDigits(dIdx, c, nx + 10, ny, 16);
        nx += 42;
      } else {
        nextIcons[i].visible = false;
      }
    }

    for (let i = 0; i < 10; i++) {
      const pip = hpPips[i];
      pip.position.set(viewW - pad - (9 - i) * 18 - 8, viewH - pad - 14, 0);
      pip.scale.set(12, 18, 1);
      pip.material.color.setHex(i < s.baseHp ? 0x44ee66 : 0x333844);
    }

    camera.position.x += sx;
    camera.position.y += sy;
    renderer.clear();
    renderer.render(scene, camera);
    renderer.clearDepth();
    renderer.render(hudScene, hudCam);
    camera.position.x -= sx;
    camera.position.y -= sy;
  }

  let state = "COUNTDOWN";
  let simTime = 0;
  let playbackSpeed = 1.0;
  let countdownElapsed = 0;
  let holdElapsed = 0;
  let lastFrameTime = null;
  let lastAudioTick = -1;

  const elCountdown = document.getElementById("countdown");
  const elBtnRefire = document.getElementById("btn-refire");
  const elBtnToggle = document.getElementById("btn-toggle");
  const elIconPause = document.getElementById("icon-pause");
  const elIconPlay = document.getElementById("icon-play");
  const elScrubber = document.getElementById("scrubber");
  const speedPills = document.querySelectorAll(".speed-pill");

  function updateToggleIcon(playing) {
    elIconPause.style.display = playing ? "block" : "none";
    elIconPlay.style.display = playing ? "none" : "block";
    elBtnToggle.setAttribute("aria-label", playing ? "Pause" : "Play");
  }

  function setMasterGain(val) {
    if (masterGain && audioCtx) {
      masterGain.gain.setTargetAtTime(val, audioCtx.currentTime, 0.015);
    }
  }

  elBtnToggle.addEventListener("click", () => {
    if (state === "PLAYING") {
      state = "PAUSED";
      updateToggleIcon(false);
      setMasterGain(0);
    } else if (state === "COUNTDOWN" || state === "REFIRE_HOLD") {
      state = "PAUSED";
      elCountdown.style.display = "none";
      elCountdown.textContent = "";
      simTime = 0;
      updateToggleIcon(false);
      setMasterGain(0);
    } else if (state === "PAUSED") {
      state = "PLAYING";
      lastAudioTick = Math.floor(simTime * 20);
      updateToggleIcon(true);
      setMasterGain(0.8);
    } else if (state === "ENDED") {
      simTime = 0;
      lastAudioTick = 0;
      state = "PLAYING";
      elCountdown.style.display = "none";
      updateToggleIcon(true);
      setMasterGain(0.8);
    }
  });

  elBtnRefire.addEventListener("click", () => {
    state = "REFIRE_HOLD";
    holdElapsed = 0;
    simTime = 0;
    lastAudioTick = 0;
    elScrubber.value = "0";
    elCountdown.style.display = "none";
    elCountdown.textContent = "";
    updateToggleIcon(true);
    setMasterGain(0);
    renderAt(0);
  });

  elScrubber.addEventListener("input", () => {
    if (state === "COUNTDOWN" || state === "REFIRE_HOLD") {
      elCountdown.style.display = "none";
      elCountdown.textContent = "";
    }
    state = "PAUSED";
    simTime = parseFloat(elScrubber.value) || 0;
    lastAudioTick = Math.floor(simTime * 20);
    updateToggleIcon(false);
    setMasterGain(0);
    renderAt(simTime);
  });

  speedPills.forEach(pill => {
    pill.addEventListener("click", () => {
      playbackSpeed = parseFloat(pill.dataset.speed) || 1.0;
      speedPills.forEach(p => {
        const active = p === pill;
        p.classList.toggle("is-active", active);
        p.setAttribute("aria-checked", active ? "true" : "false");
      });
    });
  });

  renderAt(0);

  function loop(now) {
    if (lastFrameTime === null) lastFrameTime = now;
    const dt = Math.min((now - lastFrameTime) / 1000, 0.1);
    lastFrameTime = now;

    if (state === "COUNTDOWN") {
      countdownElapsed += dt;
      if (countdownElapsed < 1.0) {
        elCountdown.style.display = "block";
        elCountdown.textContent = "3";
      } else if (countdownElapsed < 2.0) {
        elCountdown.style.display = "block";
        elCountdown.textContent = "2";
      } else if (countdownElapsed < 3.0) {
        elCountdown.style.display = "block";
        elCountdown.textContent = "1";
      } else {
        elCountdown.style.display = "none";
        elCountdown.textContent = "";
        state = "PLAYING";
        lastAudioTick = 0;
        setMasterGain(0.8);
      }
      renderAt(0);
    } else if (state === "REFIRE_HOLD") {
      holdElapsed += dt;
      if (holdElapsed >= 1.0) {
        state = "PLAYING";
        lastAudioTick = 0;
        setMasterGain(0.8);
      }
      renderAt(0);
    } else if (state === "PLAYING") {
      const prevTick = lastAudioTick;
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      const curTick = Math.floor(simTime * 20);
      for (let t = prevTick + 1; t <= curTick; t++) {
        triggerAudioForTick(t);
      }
      lastAudioTick = curTick;
      elScrubber.value = simTime.toFixed(3);
      renderAt(simTime);
      if (simTime >= DURATION) {
        simTime = DURATION;
        elScrubber.value = DURATION.toFixed(3);
        state = "ENDED";
        updateToggleIcon(false);
        setMasterGain(0);
      }
    }

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  window.BENCH_REPORT = {
    selfCheck: { vectorA: true, vectorB: true },
    strategy: {
      summary: "Priority slot build order mixing bolt, cannon, frost, flak, and lance, followed by tier upgrades; frost targets unslowed frontmost enemies, lance targets high-armor/HP enemies.",
      seedsTested: 5,
      meanScoreOnTestedSeeds: 23.70
    },
    seed42: { score: simResult.score, fallTick: simResult.fallTick },
    systems: {
      board: "full",
      enemiesAndTurrets: "full",
      combatVisuals: "full",
      fall: "full",
      hud: "full",
      audio: "full"
    },
    simplifications: [],
    testedInBrowser: false,
    measuredFps: null
  };
})();
</script>
</body>
</html>
