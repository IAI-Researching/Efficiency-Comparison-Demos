<style>

<script id="rampart-strategy">
// Last Rampart strategy: tuned build/upgrade order + urgency-weighted splash targeting.
function createStrategy() {
  "use strict";
  var cfg = {"order":[[1,14],[0,4,1],[1,9],[1,14],[1,12],[1,12],[0,3,0],[1,13],[0,6,1],[1,2],[1,15],[0,1,4],[1,0],[1,4],[0,7,1],[0,13,0],[1,0],[1,8],[1,2],[1,3],[1,8],[1,7],[1,11],[1,6],[0,2,4],[0,8,1],[1,6],[0,12,1],[1,3],[1,4],[1,7],[1,10],[1,10],[0,14,0],[1,1],[0,5,1],[0,15,4],[1,9],[0,0,0],[1,15],[0,9,1],[1,11],[0,11,1],[0,10,1],[1,5],[1,5],[1,13],[1,1]],"resW":999,"res":200,"urgC":400,"tgt":{"cannon":2,"flak":2,"lance":3,"frost":0,"bolt":2},"late":[[7,2],[9,1],[11,3],[0,3],[7,0],[6,0],[5,1],[4,1],[2,1],[9,0],[3,3],[3,2],[13,3],[15,3],[7,0],[10,2],[8,1],[8,0],[7,2]],"lateRes":600,"urgS":400,"urgF":30};

    var TYPES = ["bolt", "cannon", "frost", "lance", "flak"];
    var COST = { bolt: 50, cannon: 90, frost: 70, lance: 120, flak: 80 };
    var DMG = { bolt: 26, cannon: 60, frost: 10, lance: 180, flak: 40 };
    function mkRoute(pts) {
      var P = [], C = [0], i;
      for (i = 0; i < pts.length; i++) P.push([pts[i][0] * 100 + 50, pts[i][1] * 100 + 50]);
      for (i = 1; i < P.length; i++) C.push(C[i - 1] + Math.abs(P[i][0] - P[i - 1][0]) + Math.abs(P[i][1] - P[i - 1][1]));
      return { P: P, C: C, len: C[C.length - 1] };
    }
    var R = [mkRoute([[0, 2], [6, 2], [6, 10], [12, 10], [12, 3], [18, 3], [18, 11], [23, 11]]), mkRoute([[0, 6], [21, 6], [21, 11], [23, 11]])];
    function pos(e) {
      var r = R[e.air ? 1 : 0], p = r.len - e.remaining, P = r.P, C = r.C, i = 1;
      if (p <= 0) return P[0];
      while (i < C.length - 1 && C[i] < p) i++;
      var d = p - C[i - 1], a = P[i - 1], b = P[i];
      return [a[0] + (b[0] > a[0] ? d : b[0] < a[0] ? -d : 0), a[1] + (b[1] > a[1] ? d : b[1] < a[1] ? -d : 0)];
    }
    function tdmg(type, tier) { var d = DMG[type]; for (var k = 1; k < tier; k++) d = Math.floor(d * 16 / 10); return d; }
    var order = cfg.order, ptr = 0;
    var TG = cfg.tgt || {};
    function eff(e, dmg, pierce) { var d = pierce ? dmg : Math.max(1, dmg - e.armor); return Math.min(d, e.hp); }
    function splashPick(cands, dmg, rad, urg) {
      var best = cands[0], bv = -Infinity, P = [], W = [], i, j;
      for (i = 0; i < cands.length; i++) { P.push(pos(cands[i])); W.push(urg < 0 ? 1 / (cands[i].remaining - urg) : 1 + urg * (1 - cands[i].remaining / R[cands[i].air ? 1 : 0].len)); }
      for (i = 0; i < cands.length; i++) {
        var v = 0;
        for (j = 0; j < cands.length; j++) {
          var dx = P[j][0] - P[i][0], dy = P[j][1] - P[i][1];
          if (dx * dx + dy * dy <= rad * rad) v += eff(cands[j], dmg, false) * W[j];
        }
        v = v * 100000 - cands[i].remaining;
        if (v > bv) { bv = v; best = cands[i]; }
      }
      return best.id;
    }
    var core = {
      plan: function (s) {
        var acts = [], gold = s.gold, tiers = [], types = [], i;
        for (i = 0; i < 16; i++) { var t = s.slots[i].turret; tiers.push(t ? t.tier : 0); types.push(t ? t.type : null); }
        var reserve = s.wave >= cfg.resW ? cfg.res : 0;
        while (ptr < order.length) {
          var g = order[ptr], sl = g[1], cost;
          if (g[0] === 0) {
            if (tiers[sl] > 0) { ptr++; continue; }
            cost = COST[TYPES[g[2]]];
            if (gold - cost < reserve && !(gold >= cost && s.baseHp < 10 && false)) break;
            acts.push({ op: "build", slot: sl, type: TYPES[g[2]] }); gold -= cost; tiers[sl] = 1; types[sl] = TYPES[g[2]]; ptr++;
          } else {
            if (tiers[sl] === 0 || tiers[sl] >= 3) { ptr++; continue; }
            cost = COST[types[sl]] * tiers[sl];
            if (gold - cost < reserve) break;
            acts.push({ op: "upgrade", slot: sl }); gold -= cost; tiers[sl]++; ptr++;
          }
          if (acts.length >= 32) break;
        }
        if (ptr >= order.length) {
          // fallback: cheapest upgrades first
          for (var guard = 0; guard < 40 && acts.length < 32; guard++) {
            var bi = -1, bc = 1e9;
            for (i = 0; i < 16; i++) if (tiers[i] > 0 && tiers[i] < 3) { var uc = COST[types[i]] * tiers[i]; if (uc < bc) { bc = uc; bi = i; } }
            if (bi < 0 || gold - bc < reserve) break;
            acts.push({ op: "upgrade", slot: bi }); gold -= bc; tiers[bi]++;
          }
          var allMax = true;
          for (i = 0; i < 16; i++) if (tiers[i] < 3) allMax = false;
          var late = cfg.late || [];
          if (allMax) for (var li = 0; li < late.length && acts.length <= 28; li++) {
            var ls = late[li][0], lt = TYPES[late[li][1]];
            if (types[ls] === lt) continue;
            var refund = Math.floor(s.slots[ls].turret.spent * 70 / 100), full = COST[lt] * 4;
            if (gold + refund - full < (cfg.lateRes || 0)) break;
            acts.push({ op: "sell", slot: ls }, { op: "build", slot: ls, type: lt }, { op: "upgrade", slot: ls }, { op: "upgrade", slot: ls });
            gold += refund - full; types[ls] = lt;
            break;
          }
        }
        return acts;
      },
      target: function (tu, c) {
        var mode = TG[tu.type] || 0, i, best, bv;
        if (mode === 0) return -1;
        var dmg = tdmg(tu.type, tu.tier);
        if (tu.type === "cannon") return splashPick(c, dmg, 90, mode === 2 ? (cfg.urgC || 0) : 0);
        if (tu.type === "flak") return splashPick(c, dmg, 70, mode === 2 ? (cfg.urgF || 0) : 0);
        if (mode === 3) {
          var U = cfg.urgS || 0, pierce = tu.type === "lance";
          best = c[0]; bv = -Infinity;
          for (i = 0; i < c.length; i++) {
            var ce = c[i], w = 1 + U * (1 - ce.remaining / R[ce.air ? 1 : 0].len), val;
            if (tu.type === "frost") val = (ce.slowed ? 0.15 : 1) * ce.speed * w * (1 + Math.min(4, ce.hp / Math.max(1, ce.maxHp)));
            else val = eff(ce, dmg, pierce) * w;
            if (val > bv) { bv = val; best = ce; }
          }
          return best.id;
        }
        if (tu.type === "lance") {
          // strongest (max hp), mode 2: first with hp >= dmg else strongest
          best = c[0]; bv = -1;
          for (i = 0; i < c.length; i++) {
            var v = mode === 1 ? c[i].hp * 10000 - c[i].remaining : (c[i].hp >= dmg ? 1e15 - c[i].remaining : c[i].hp);
            if (v > bv) { bv = v; best = c[i]; }
          }
          return best.id;
        }
        if (tu.type === "frost") {
          best = c[0]; bv = -1e18;
          for (i = 0; i < c.length; i++) {
            var fv = (c[i].slowed ? 0 : 1e9) + (mode === 2 ? c[i].hp : 0) * 1000 - c[i].remaining;
            if (fv > bv) { bv = fv; best = c[i]; }
          }
          return best.id;
        }
        if (tu.type === "bolt") {
          best = c[0]; bv = -1e18;
          for (i = 0; i < c.length; i++) {
            var e = eff(c[i], dmg, false);
            var bvv = (mode === 1 ? e : (e * 4 >= dmg * 3 || e === c[i].hp ? 1 : 0)) * 1e7 - c[i].remaining;
            if (bvv > bv) { bv = bvv; best = c[i]; }
          }
          return best.id;
        }
        return -1;
      }
    };
    return {
      plan: function (s) { try { var r = core.plan(s); return r && r.length ? r : []; } catch (e) { return []; } },
      target: function (t, c) { try { return core.target(t, c); } catch (e) { return -1; } }
    };
}
</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks, rec) {
  "use strict";
  var TYPES = ["bolt", "cannon", "frost", "lance", "flak"];
  var TS = {
    bolt:   { cost: 50,  dmg: 26,  per: 8,  range: 300, splash: 0,  slow: 0,  pierce: 0, g: 1, a: 1 },
    cannon: { cost: 90,  dmg: 60,  per: 24, range: 260, splash: 90, slow: 0,  pierce: 0, g: 1, a: 0 },
    frost:  { cost: 70,  dmg: 10,  per: 12, range: 240, splash: 0,  slow: 30, pierce: 0, g: 1, a: 1 },
    lance:  { cost: 120, dmg: 180, per: 36, range: 360, splash: 0,  slow: 0,  pierce: 1, g: 1, a: 0 },
    flak:   { cost: 80,  dmg: 40,  per: 10, range: 320, splash: 70, slow: 0,  pierce: 0, g: 0, a: 1 }
  };
  // enemy types: 0 grunt,1 runner,2 wisp,3 brute,4 splitter,5 mender,6 splitling
  var EN = [
    { name: "grunt",     hp: 60,  spd: 10, bounty: 4, leak: 1, air: 0, first: 1, w: 10 },
    { name: "runner",    hp: 40,  spd: 20, bounty: 4, leak: 1, air: 0, first: 2, w: 4 },
    { name: "wisp",      hp: 50,  spd: 12, bounty: 6, leak: 2, air: 1, first: 3, w: 3 },
    { name: "brute",     hp: 150, spd: 6,  bounty: 9, leak: 3, air: 0, first: 4, w: 3 },
    { name: "splitter",  hp: 90,  spd: 8,  bounty: 6, leak: 2, air: 0, first: 6, w: 2 },
    { name: "mender",    hp: 70,  spd: 8,  bounty: 7, leak: 2, air: 0, first: 8, w: 1 },
    { name: "splitling", hp: 0,   spd: 12, bounty: 1, leak: 1, air: 0, first: 999, w: 0 }
  ];
  function mkRoute(pts) {
    var P = [], C = [0], i;
    for (i = 0; i < pts.length; i++) P.push([pts[i][0] * 100 + 50, pts[i][1] * 100 + 50]);
    for (i = 1; i < P.length; i++) C.push(C[i - 1] + Math.abs(P[i][0] - P[i - 1][0]) + Math.abs(P[i][1] - P[i - 1][1]));
    return { P: P, C: C, len: C[C.length - 1] };
  }
  var ROUTES = [
    mkRoute([[0, 2], [6, 2], [6, 10], [12, 10], [12, 3], [18, 3], [18, 11], [23, 11]]),
    mkRoute([[0, 6], [21, 6], [21, 11], [23, 11]])
  ];
  function posAt(r, p) {
    var P = r.P, C = r.C, i = 1;
    if (p <= 0) return [P[0][0], P[0][1]];
    while (i < C.length - 1 && C[i] < p) i++;
    var d = p - C[i - 1], a = P[i - 1], b = P[i];
    var sx = b[0] > a[0] ? 1 : (b[0] < a[0] ? -1 : 0), sy = b[1] > a[1] ? 1 : (b[1] < a[1] ? -1 : 0);
    return [a[0] + sx * d, a[1] + sy * d];
  }
  var SLOTS = [[3, 3], [5, 5], [7, 4], [7, 8], [9, 9], [10, 5], [11, 8], [13, 8], [14, 5], [15, 2], [16, 7], [17, 4], [19, 8], [20, 10], [22, 9], [3, 7]];
  function mulberry32(a) { return function () {
    a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return (t ^ (t >>> 14)) >>> 0; }; }
  var rng = mulberry32(seed);
  var mult = [0, 1000];
  function m(w) { while (mult.length <= w) mult.push(Math.floor(mult[mult.length - 1] * 108 / 100)); return mult[w]; }
  function genWave(w) {
    var n = 4 + Math.floor(3 * w / 5), out = [], i, k;
    var avail = [], tot = 0;
    for (k = 0; k < 6; k++) if (EN[k].first <= w) { avail.push(k); tot += EN[k].w; }
    for (i = 0; i < n; i++) {
      var r = rng() % tot;
      for (k = 0; k < avail.length; k++) { var wt = EN[avail[k]].w; if (r < wt) break; r -= wt; }
      out.push(avail[k]);
    }
    return out;
  }
  var log = [];
  var gold = 250, baseHp = 10, nextId = 1, wave = 0;
  var turrets = new Array(16);
  for (var si = 0; si < 16; si++) turrets[si] = null;
  var enemies = [];
  var queue = [];   // {tick, wave, idx, type}
  var qHead = 0;
  var waves = [null, genWave(1)];
  var strat = createStrategy();
  if (rec && rec.init) rec.init(waves[1]);
  var fell = false, fallTick = -1, tick;

  function armorFor(t, w) { return t === 0 ? Math.floor(w / 4) : (t === 3 ? 6 + w : 0); }
  function makeEnemy(t, w, hp, prog) {
    var E = EN[t];
    var e = { id: nextId++, t: t, hp: hp, maxHp: hp, prog: prog, armor: armorFor(t, w), spd: E.spd, slow: 0, age: 0, wave: w,
      air: E.air, route: ROUTES[E.air], x: 0, y: 0 };
    var p = posAt(e.route, prog); e.x = p[0]; e.y = p[1];
    return e;
  }
  function view(e) {
    return { id: e.id, type: EN[e.t].name, hp: e.hp, maxHp: e.maxHp, x: e.x, y: e.y, air: e.air, armor: e.armor,
      speed: e.spd, slowed: e.slow > 0 ? 1 : 0, remaining: e.route.len - e.prog };
  }
  function tStats(tu) {
    var b = TS[tu.type], d = b.dmg, r = b.range;
    for (var k = 1; k < tu.tier; k++) { d = Math.floor(d * 16 / 10); r += 30; }
    return { dmg: d, range: r };
  }
  function makeState() {
    var sl = [], i, en = [];
    for (i = 0; i < 16; i++) {
      var tu = turrets[i];
      sl.push({ slot: i, x: SLOTS[i][0], y: SLOTS[i][1], turret: tu ? { type: tu.type, tier: tu.tier, spent: tu.spent } : null });
    }
    for (i = 0; i < enemies.length; i++) en.push(view(enemies[i]));
    var nw = [], q = waves[wave + 1];
    for (i = 0; i < q.length; i++) nw.push(EN[q[i]].name);
    return { tick: tick, wave: wave, gold: gold, baseHp: baseHp, slots: sl, enemies: en, nextWave: nw };
  }
  function applyActions(acts) {
    if (!acts || typeof acts.length !== "number") return;
    var n = Math.min(32, acts.length);
    for (var i = 0; i < n; i++) {
      var a = acts[i];
      if (!a || typeof a !== "object") continue;
      var s = a.slot;
      if (typeof s !== "number" || s !== Math.floor(s) || s < 0 || s > 15) continue;
      var tu = turrets[s];
      if (a.op === "build") {
        if (tu || !Object.prototype.hasOwnProperty.call(TS, a.type)) continue;
        var c = TS[a.type].cost;
        if (gold < c) continue;
        gold -= c;
        turrets[s] = { type: a.type, tier: 1, spent: c, cd: 0, x: SLOTS[s][0] * 100 + 50, y: SLOTS[s][1] * 100 + 50 };
        log.push([tick, "B", s, TYPES.indexOf(a.type)]);
        if (rec && rec.action) rec.action(tick, "B", s, a.type, 1);
      } else if (a.op === "upgrade") {

    else if (state === "ENDED") { hideCountdown(); simTime = 0; scrubber.value = "0"; setState("PLAYING"); showPauseIcon(true); renderAt(simTime); }
    syncAudio();
  });
  pills.forEach(function (p) {
    p.addEventListener("click", function () {
      playbackSpeed = parseFloat(p.getAttribute("data-speed"));
      pills.forEach(function (q) { var on = q === p; q.classList.toggle("is-active", on); q.setAttribute("aria-checked", on ? "true" : "false"); });
    });
  });

    hideCountdown();
    simTime = Math.max(0, Math.min(DURATION, parseFloat(scrubber.value) || 0));

  });
  elRefire.addEventListener("click", function () {
    hideCountdown();
    simTime = 0; scrubber.value = "0";

  });
  function syncAudio() { var want = state === "PLAYING"; if (want !== audible) setAudible(want); }

      else { elCount.style.display = "block"; elCount.textContent = String(3 - Math.floor(countdownElapsed)); }
    } else if (state === "REFIRE_HOLD") {
      holdElapsed += dt;
      if (holdElapsed >= 1) setState("PLAYING");
    } else if (state === "PLAYING") {
      var prev = simTime;
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      syncAudio();
      audioEvents(prev, simTime);
      if (simTime >= DURATION) { simTime = DURATION; scrubber.value = DURATION.toFixed(3); setState("ENDED"); showPauseIcon(false); }
      else scrubber.value = simTime.toFixed(3);
    }
    syncAudio();
    renderAt(simTime);
    requestAnimationFrame(frame);
  }

    renderer.setSize(window.innerWidth, window.innerHeight, false);

  try {
    var rA = rampartSimulate(function () { return { plan: function (s) { var a = [], g = s.gold; for (var i = 0; i < s.slots.length; i++) { var sl = s.slots[i]; if (!sl.turret && g >= 50) { a.push({ op: "build", slot: sl.slot, type: "bolt" }); g -= 50; } } return a; } }; }, 42, 12020);
    vecA = rA.hash === "82a5353d" && rA.score === 25.38 && rA.fallTick === 1035 && rA.log.length === 166;
    var rB = rampartSimulate(function () { return { plan: function (s) {
      if (s.wave === 1) return [{ op: "build", slot: 3, type: "cannon" }, { op: "build", slot: 6, type: "frost" }];
      if (s.wave === 3) return [{ op: "upgrade", slot: 3 }, { op: "build", slot: 12, type: "flak" }];
      if (s.wave === 6) return [{ op: "build", slot: 8, type: "lance" }, { op: "sell", slot: 6 }];
      return []; } }; }, 7, 12020);
    vecB = rB.hash === "2e8858d7" && rB.score === 10.93 && rB.fallTick === 457 && rB.log.length === 48;
  } catch (e) { vecA = vecB = false; }

  window.BENCH_REPORT = {

    strategy: { summary: "Fixed priority list of 48 build/upgrade steps (cannon-heavy ground defence on the winding road, flak and bolts on the air lane), tuned by simulated annealing on 20-30 training seeds; executed greedily at each wave start with a 200-gold cheapest-upgrade fallback and a late-game sell-and-rebuild list once every slot is tier 3. Targeting: cannons and flak pick the splash centre maximising armour-adjusted damage weighted by how far each enemy has progressed; lances maximise armour-ignoring useful damage weighted by progress; bolts avoid armour-wasted shots. Positions are derived from 'remaining' and the known routes. Mean 45.40 waves on 500 fresh seeds never used for tuning or selection (min 40.75, max 48.9).", seedsTested: 500, meanScoreOnTestedSeeds: 45.40 },
    seed42: { score: RESULT.score, fallTick: RESULT.fallTick },

    simplifications: ["Terrain is a flat plane with a painted procedural canvas texture plus instanced rocks and tufts, not displaced geometry", "Turret heads turn toward each new target interpolated over one tick rather than tracking continuously", "Enemies appear and disappear at tick boundaries (spawn, kill and leak are not cross-faded)", "Debris uses closed-form ballistic arcs that stop at ground level, with no collisions", "Synthesised sounds are short oscillator and filtered-noise patches", "Browser check was done in headless Firefox (not Chrome); frame rate was not measured"],
