<html lang="en">

<title>Last Rampart: Wave Defense Strategist</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;

}
#stage {

}

<script id="rampart-strategy">
function createStrategy() {
  var P = {"reserve":200,"resRate":70,"dumpWave":36,"KB":0.7000000000000001,"MB":3,"AW":3,"UR":1300,"UW":2.2,"SP":0,"FH":0.5,"LW":0.5,"RB":1.3,"AR":1.0000000000000002,"order":[[0,"lance"],[12,"bolt"],[9,"cannon"],[6,"frost"],[7,"flak"],[8,"cannon"],[7,2],[15,"cannon"],[15,2],[3,"cannon"],[0,2],[13,"bolt"],[10,"bolt"],[3,2],[9,2],[4,"cannon"],[2,"cannon"],[4,2],[15,3],[11,"cannon"],[2,2],[1,"cannon"],[10,2],[7,3],[2,3],[12,2],[13,2],[1,2],[3,3],[1,3],[13,3],[4,3],[0,3],[14,"flak"],[5,"flak"],[9,3],[11,2],[5,2],[8,2],[14,2],[8,3],[10,3],[6,2],[5,3],[14,3],[11,3],[6,3],[12,3]]};

  var BASE = { bolt: [50, 26], cannon: [90, 60], frost: [70, 10], lance: [120, 180], flak: [80, 40] };
  function dmgOf(type, tier) { var d = BASE[type][1]; for (var k = 1; k < tier; k++) d = Math.floor(d * 16 / 10); return d; }
  var order = P.order;
  var lastHp = 10, panic = false;
  function plan(s) {
    if (s.baseHp < lastHp) panic = true;
    lastHp = s.baseHp;
    var gold = s.gold, acts = [];
    var reserve = (panic || s.wave >= P.dumpWave) ? 0 : Math.min(P.reserve, s.wave * P.resRate);
    var tur = []; for (var i = 0; i < 16; i++) { var t = s.slots[i].turret; tur.push(t ? { type: t.type, tier: t.tier } : null); }
    for (var k = 0; k < order.length && acts.length < 32; k++) {
      var o = order[k], sl = o[0];
      if (typeof o[1] === "string") {
        if (tur[sl]) continue;
        var c = BASE[o[1]][0];
        if (gold - c < reserve) break;
        gold -= c; tur[sl] = { type: o[1], tier: 1 }; acts.push({ op: "build", slot: sl, type: o[1] });
      } else {
        var t2 = tur[sl];
        if (!t2 || t2.tier >= o[1]) continue;
        var uc = BASE[t2.type][0] * (t2.tier === 1 ? 1 : 2);
        if (gold - uc < reserve) break;
        gold -= uc; t2.tier++; acts.push({ op: "upgrade", slot: sl });
        k--;
      }
    }
    return acts;
  }
  var KB = P.KB, MB = P.MB, AW = P.AW, UR = P.UR, UW = P.UW, SP = P.SP, LW = P.LW || 0, RB = P.RB || 0, AR = P.AR || 1;
  function val(e, eff) {
    var u = Math.min(e.hp, eff);
    if (e.hp <= eff) u += KB * eff;
    if (e.type === "mender") u += MB * eff;
    else if (e.type === "splitter" && e.hp <= eff) u -= SP * eff;
    var ur = e.air ? UR * AR : UR; if (e.remaining < ur) u += UW * eff * (1 + LW * (e.type === "brute" ? 2 : e.type === "wisp" || e.type === "splitter" || e.type === "mender" ? 1 : 0)) * (ur - e.remaining) / ur;
    if (e.type === "runner") u += RB * eff;
    return u;
  }
  function target(t, cands) {
    if (!cands || !cands.length || !t || !BASE[t.type]) return -1;
    var type = t.type, d = dmgOf(type, t.tier || 1), n = cands.length, best = cands[0], bs = -1e18, i, j, c, sc;
    if (type === "cannon" || type === "flak") {
      var r2 = type === "cannon" ? 8100 : 4900;
      for (i = 0; i < n; i++) {
        c = cands[i]; sc = 0;
        for (j = 0; j < n; j++) {
          var e = cands[j], dx = e.x - c.x, dy = e.y - c.y;
          if (dx * dx + dy * dy <= r2) sc += val(e, Math.max(1, d - e.armor));
        }
        sc -= c.remaining * 1e-6;
        if (sc > bs) { bs = sc; best = c; }
      }
    } else if (type === "frost") {
      for (i = 0; i < n; i++) {
        c = cands[i];
        sc = (c.slowed ? 0 : 1e6) + (c.type === "splitling" ? 0 : 1e5) + P.FH * c.hp - c.remaining;
        if (sc > bs) { bs = sc; best = c; }
      }
    } else {
      var pierce = type === "lance";
      for (i = 0; i < n; i++) {
        c = cands[i];
        sc = val(c, pierce ? d : Math.max(1, d - c.armor)) + (pierce ? AW * c.armor : 0) - c.remaining * 1e-6;
        if (sc > bs) { bs = sc; best = c; }
      }
    }
    return best.id;
  }
  return { plan: plan, target: target };
}
</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks, rec) {
  "use strict";
  var TT = [
    { name: "bolt",   cost: 50,  dmg: 26,  period: 8,  range: 300, splash: 0,  slow: 0,  pierce: false, g: true,  a: true  },
    { name: "cannon", cost: 90,  dmg: 60,  period: 24, range: 260, splash: 90, slow: 0,  pierce: false, g: true,  a: false },
    { name: "frost",  cost: 70,  dmg: 10,  period: 12, range: 240, splash: 0,  slow: 30, pierce: false, g: true,  a: true  },
    { name: "lance",  cost: 120, dmg: 180, period: 36, range: 360, splash: 0,  slow: 0,  pierce: true,  g: true,  a: false },
    { name: "flak",   cost: 80,  dmg: 40,  period: 10, range: 320, splash: 70, slow: 0,  pierce: false, g: false, a: true  }
  ];
  var TIDX = { bolt: 0, cannon: 1, frost: 2, lance: 3, flak: 4 };
  var ET = {
    grunt:     { hp: 60,  speed: 10, bounty: 4, leak: 1, air: 0, first: 1, weight: 10 },
    runner:    { hp: 40,  speed: 20, bounty: 4, leak: 1, air: 0, first: 2, weight: 4 },
    wisp:      { hp: 50,  speed: 12, bounty: 6, leak: 2, air: 1, first: 3, weight: 3 },
    brute:     { hp: 150, speed: 6,  bounty: 9, leak: 3, air: 0, first: 4, weight: 3 },
    splitter:  { hp: 90,  speed: 8,  bounty: 6, leak: 2, air: 0, first: 6, weight: 2 },
    mender:    { hp: 70,  speed: 8,  bounty: 7, leak: 2, air: 0, first: 8, weight: 1 },
    splitling: { hp: 0,   speed: 12, bounty: 1, leak: 1, air: 0, first: 0, weight: 0 }
  };
  var SPAWN_ORDER = ["grunt", "runner", "wisp", "brute", "splitter", "mender"];
  var SLOTS = [[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],[14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]];

  function mkRoute(pts) {
    var P = [], cum = [0], i;
    for (i = 0; i < pts.length; i++) P.push([pts[i][0] * 100 + 50, pts[i][1] * 100 + 50]);
    for (i = 1; i < P.length; i++) cum.push(cum[i - 1] + Math.abs(P[i][0] - P[i - 1][0]) + Math.abs(P[i][1] - P[i - 1][1]));
    return { P: P, cum: cum, len: cum[cum.length - 1] };
  }
  var GROUND = mkRoute([[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]]);
  var AIR = mkRoute([[0,6],[21,6],[21,11],[23,11]]);

  function place(e) {
    var R = e.air ? AIR : GROUND, p = e.progress, P = R.P, cum = R.cum, i = 1;
    while (i < cum.length - 1 && p > cum[i]) i++;
    var d = p - cum[i - 1], ax = P[i - 1][0], ay = P[i - 1][1], bx = P[i][0], by = P[i][1];
    e.x = ax + (bx > ax ? d : bx < ax ? -d : 0);
    e.y = ay + (by > ay ? d : by < ay ? -d : 0);
  }

  function mulberry32(a) { return function () {
    a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return (t ^ (t >>> 14)) >>> 0; }; }
  var rng = mulberry32(seed);

  function genWave(w) {
    var n = 4 + Math.floor(3 * w / 5), out = [], avail = [], tot = 0, i, k;
    for (i = 0; i < SPAWN_ORDER.length; i++) if (ET[SPAWN_ORDER[i]].first <= w) { avail.push(SPAWN_ORDER[i]); tot += ET[SPAWN_ORDER[i]].weight; }
    for (k = 0; k < n; k++) {
      var r = rng() % tot;
      for (i = 0; i < avail.length; i++) { var wt = ET[avail[i]].weight; if (r < wt) break; r -= wt; }
      out.push(avail[i]);
    }
    return out;
  }
  var mulCache = [0, 1000];
  function mult(w) { while (mulCache.length <= w) mulCache.push(Math.floor(mulCache[mulCache.length - 1] * 108 / 100)); return mulCache[w]; }

  var log = [];
  var gold = 250, baseHp = 10, wave = 0, nextId = 1, fallTick = -1, tick;
  var turrets = []; for (var s = 0; s < 16; s++) turrets.push(null);
  var enemies = [];
  var spawnsAt = {};
  var waveComp = {}; waveComp[1] = genWave(1);
  var strat = createStrategy();

  function makeEnemy(type, w, maxHp, progress) {
    var d = ET[type];
    var armor = type === "grunt" ? Math.floor(w / 4) : type === "brute" ? 6 + w : 0;
    var e = { id: nextId++, type: type, wave: w, hp: maxHp, maxHp: maxHp, progress: progress, age: 0, slow: 0,
      armor: armor, speed: d.speed, air: d.air, bounty: d.bounty, leak: d.leak, x: 0, y: 0 };
    place(e);
    return e;
  }
  function view(e) {
    var R = e.air ? AIR : GROUND;
    return { id: e.id, type: e.type, hp: e.hp, maxHp: e.maxHp, x: e.x, y: e.y, air: e.air, armor: e.armor,
      speed: e.speed, slowed: e.slow, remaining: R.len - e.progress };
  }
  function turretStats(t) {
    var d = TT[t.ti], dmg = d.dmg, rg = d.range;
    for (var k = 1; k < t.tier; k++) { dmg = Math.floor(dmg * 16 / 10); rg += 30; }
    t.dmg = dmg; t.range = rg;
  }
  function applyActions(acts) {
    if (!acts || typeof acts.length !== "number") return;
    var n = Math.min(32, acts.length);
    for (var i = 0; i < n; i++) {
      var a = acts[i];
      if (!a || typeof a !== "object") continue;
      var sl = a.slot;
      if (typeof sl !== "number" || !(sl >= 0 && sl < 16) || Math.floor(sl) !== sl) continue;
      var t = turrets[sl];
      if (a.op === "build") {
        if (t || typeof a.type !== "string" || !TIDX.hasOwnProperty(a.type)) continue;
        var ti = TIDX[a.type], c = TT[ti].cost;
        if (gold < c) continue;
        gold -= c;
        t = { slot: sl, ti: ti, type: a.type, tier: 1, spent: c, cd: 0, x: SLOTS[sl][0] * 100 + 50, y: SLOTS[sl][1] * 100 + 50, dmg: 0, range: 0 };
        turretStats(t); turrets[sl] = t;
        log.push([tick, "B", sl, ti]);
      } else if (a.op === "upgrade") {
        if (!t || t.tier >= 3) continue;
        var uc = TT[t.ti].cost * (t.tier === 1 ? 1 : 2);
        if (gold < uc) continue;
        gold -= uc; t.spent += uc; t.tier++; turretStats(t);
        log.push([tick, "U", sl, t.tier]);
      } else if (a.op === "sell") {
        if (!t) continue;
        gold += Math.floor(t.spent * 70 / 100);
        turrets[sl] = null;
        log.push([tick, "S", sl, 0]);
      }
    }
  }

  var hasTarget = typeof strat.target === "function";
  var ended = false;
  for (tick = 0; tick < maxTicks && !ended; tick++) {
    // 1. wave start
    if (tick >= 20 && (tick - 20) % 40 === 0) {
      wave = (tick - 20) / 40 + 1;
      gold += Math.min(50, Math.floor(gold * 5 / 100)) + 10 + 2 * wave;
      waveComp[wave + 1] = genWave(wave + 1);
      var st = { tick: tick, wave: wave, gold: gold, baseHp: baseHp, slots: [], enemies: [], nextWave: waveComp[wave + 1].slice() };
      for (var si = 0; si < 16; si++) {
        var tu = turrets[si];
        st.slots.push({ slot: si, x: SLOTS[si][0], y: SLOTS[si][1], turret: tu ? { type: tu.type, tier: tu.tier, spent: tu.spent } : null });
      }
      for (var ei = 0; ei < enemies.length; ei++) st.enemies.push(view(enemies[ei]));
      applyActions(strat.plan(st));
      if (rec && rec.onWave) rec.onWave(tick, wave, waveComp[wave + 1], gold);
      var comp = waveComp[wave];
      for (var qi = 0; qi < comp.length; qi++) {
        var at = tick + 4 * qi;
        (spawnsAt[at] || (spawnsAt[at] = [])).push({ type: comp[qi], wave: wave });
      }
      delete waveComp[wave];
    }
    // 2. spawn
    var due = spawnsAt[tick];
    if (due) {
      for (var di = 0; di < due.length; di++) {
        var ww = due[di].wave;
        enemies.push(makeEnemy(due[di].type, ww, Math.floor(ET[due[di].type].hp * mult(ww) / 1000), 0));
      }
      delete spawnsAt[tick];
    }
    // 3. move
    var kept = [];
    for (var mi = 0; mi < enemies.length; mi++) {
      var e = enemies[mi];
      e.progress += e.slow > 0 ? Math.floor(e.speed * 60 / 100) : e.speed;
      var RL = e.air ? AIR.len : GROUND.len;
      if (e.progress >= RL) {
        baseHp -= e.leak;
        log.push([tick, "L", e.id, baseHp]);
        if (rec && rec.onLeak) rec.onLeak(tick, e, baseHp);
        if (baseHp <= 0) {
          log.push([tick, "F", wave, 0]);
          fallTick = tick; ended = true;
          for (var rj = mi + 1; rj < enemies.length; rj++) kept.push(enemies[rj]);
          break;
        }
        continue;
      }
      place(e);
      kept.push(e);
    }
    enemies = kept;
    if (ended) { if (rec && rec.onTick) rec.onTick(tick, enemies, turrets, gold, baseHp, wave); break; }
    // 4. age & heal
    for (var ai = 0; ai < enemies.length; ai++) {
      var m = enemies[ai];
      m.age++;
      if (m.type === "mender" && m.age % 20 === 0) {
        for (var hi = 0; hi < enemies.length; hi++) {
          var h = enemies[hi], hx = h.x - m.x, hy = h.y - m.y;
          if (hx * hx + hy * hy <= 22500) {
            h.hp = Math.min(h.maxHp, h.hp + Math.floor(h.maxHp * 8 / 100));
          }
        }
        if (rec && rec.onHeal) rec.onHeal(tick, m);
      }
    }
    // 5. turrets fire
    for (var ts = 0; ts < 16; ts++) {
      var T = turrets[ts];
      if (!T) continue;
      if (T.cd > 0) { T.cd--; if (T.cd > 0) continue; }
      var D = TT[T.ti], r2 = T.range * T.range, cands = [];
      for (var ci = 0; ci < enemies.length; ci++) {
        var c = enemies[ci];
        if (c.air ? !D.a : !D.g) continue;
        var cx = c.x - T.x, cy = c.y - T.y;
        if (cx * cx + cy * cy <= r2) cands.push(c);
      }
      if (cands.length === 0) continue;
      var tgt = null;
      if (hasTarget) {
        var views = [];
        for (var vi = 0; vi < cands.length; vi++) views.push(view(cands[vi]));
        var pick = strat.target({ slot: ts, type: T.type, tier: T.tier, x: T.x, y: T.y, range: T.range }, views);
        for (var pi = 0; pi < cands.length; pi++) if (cands[pi].id === pick) { tgt = cands[pi]; break; }
      }
      if (!tgt) {
        var best = -1;
        for (var bi = 0; bi < cands.length; bi++) {
          var cb = cands[bi], rem = (cb.air ? AIR.len : GROUND.len) - cb.progress;
          if (best < 0 || rem < best) { best = rem; tgt = cb; }
        }
      }
      var hits;

  // ---------------------------------------------------------------- audio

  } catch (err) { actx = null; }

  window.addEventListener("keydown", resumeAudio, { once: true });
  function ar() { return arng() / 4294967296; }

    if (actx.createStereoPanner) { var p = actx.createStereoPanner(); p.pan.value = Math.max(-0.9, Math.min(0.9, (x / 24) * 2 - 1)); g.connect(p); p.connect(master); }

    var t0 = actx.currentTime, s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain(), dst = out(x);

  var SHOT_PRI = [3, 0, 4, 1, 2]; // priority rank by turret type (lower = louder/first): cannon, lance, flak, bolt, frost
  function shotSound(ty, x) {
    var v = 0.9 + ar() * 0.2;
    if (ty === 0) { tone("triangle", 1300 * v, 420, 0.07, 0.10, x); noise(0.04, 0.05, x, "highpass", 3000, 0.7); }
    else if (ty === 1) { tone("sine", 140 * v, 42, 0.28, 0.30, x); noise(0.18, 0.18, x, "lowpass", 900, 0.8, 200); }
    else if (ty === 2) { tone("sine", 2200 * v, 1500, 0.14, 0.05, x); noise(0.12, 0.04, x, "bandpass", 6000, 2); }
    else if (ty === 3) { tone("sawtooth", 260 * v, 1400, 0.2, 0.12, x, ["bandpass", 900, 1.2]); noise(0.08, 0.12, x, "highpass", 1800, 0.8); }

    var t0 = actx.currentTime, dst = out(12), g = actx.createGain(), f = actx.createBiquadFilter();
    f.type = "lowpass"; f.frequency.setValueAtTime(500, t0); f.frequency.linearRampToValueAtTime(1600, t0 + 0.5); f.Q.value = 2;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.09, t0 + 0.12); g.gain.setValueAtTime(0.09, t0 + 0.45); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.75);

    [0, 7].forEach(function (det) { var o = actx.createOscillator(); o.type = "sawtooth"; o.detune.value = det; o.frequency.setValueAtTime(165, t0); o.frequency.exponentialRampToValueAtTime(247, t0 + 0.5); o.connect(f); track(o, t0 + 0.8); });
  }
  function leakSound() {
    noise(0.25, 0.35, KEEP_X, "bandpass", 2400, 1.2, 700);
    tone("sine", 110, 50, 0.3, 0.3, KEEP_X);
    var t0 = actx.currentTime, o = actx.createOscillator(), g = actx.createGain(), dst = out(KEEP_X);
    o.type = "square"; o.frequency.setValueAtTime(880, t0); o.frequency.setValueAtTime(660, t0 + 0.12); o.frequency.setValueAtTime(880, t0 + 0.24);

  var shotTimes = [], killTimes = [];

      if (playedTy[cand[c].ty]) continue; playedTy[cand[c].ty] = 1;

  }

  var iconPause = document.getElementById("icon-pause"), iconPlay = document.getElementById("icon-play"), scrubber = document.getElementById("scrubber");

  function showPauseIcon(isPlaying) {

    seed42: { score: RESULT.score, fallTick: RESULT.fallTick },

    simplifications: ["Each base HP lost knocks one chunk off the keep, so a 3-damage leak removes 3 chunks.", "After the fall the whole scene (enemies, debris, rings) is frozen; shot beams are hidden.", "Enemies get a small deterministic sideways offset per id so stacked crowds stay readable; the simulation positions are unchanged.", "Shot sounds: at most one per turret type per frame on top of the 12-per-second cap; kill pops capped at 10 per second."],

})();
