<!DOCTYPE html>
<html lang="en">
<head>

<style>

  box-sizing: border-box;
}

  margin: 0;
  padding: 0;

  width: 100vw;

  position: fixed;

<script id="rampart-strategy">
function createStrategy() {
  const COSTS = { bolt: 50, cannon: 90, frost: 70, lance: 120, flak: 80 };
  const PLAN = [
    { op: "build", slot: 3, type: "cannon" },
    { op: "build", slot: 6, type: "frost" },
    { op: "build", slot: 10, type: "flak" },
    { op: "build", slot: 11, type: "cannon" },
    { op: "build", slot: 7, type: "cannon" },
    { op: "build", slot: 8, type: "cannon" },
    { op: "build", slot: 13, type: "cannon" },
    { op: "build", slot: 12, type: "frost" },
    { op: "build", slot: 5, type: "flak" },
    { op: "build", slot: 4, type: "cannon" },
    { op: "build", slot: 1, type: "cannon" },
    { op: "build", slot: 14, type: "cannon" },
    { op: "build", slot: 2, type: "frost" },
    { op: "upgrade", slot: 10, tier: 2 },
    { op: "upgrade", slot: 3, tier: 2 },
    { op: "upgrade", slot: 11, tier: 2 },
    { op: "upgrade", slot: 7, tier: 2 },
    { op: "upgrade", slot: 8, tier: 2 },
    { op: "upgrade", slot: 13, tier: 2 },
    { op: "upgrade", slot: 5, tier: 2 },
    { op: "upgrade", slot: 4, tier: 2 },
    { op: "upgrade", slot: 1, tier: 2 },
    { op: "upgrade", slot: 14, tier: 2 },
    { op: "build", slot: 9, type: "lance" },
    { op: "upgrade", slot: 9, tier: 2 },
    { op: "build", slot: 15, type: "flak" },
    { op: "upgrade", slot: 15, tier: 2 },
    { op: "build", slot: 0, type: "cannon" },
    { op: "upgrade", slot: 0, tier: 2 },
    { op: "upgrade", slot: 10, tier: 3 },
    { op: "upgrade", slot: 5, tier: 3 },
    { op: "upgrade", slot: 3, tier: 3 },
    { op: "upgrade", slot: 11, tier: 3 },
    { op: "upgrade", slot: 7, tier: 3 },
    { op: "upgrade", slot: 8, tier: 3 },
    { op: "upgrade", slot: 13, tier: 3 },
    { op: "upgrade", slot: 4, tier: 3 },
    { op: "upgrade", slot: 1, tier: 3 },
    { op: "upgrade", slot: 14, tier: 3 },
    { op: "upgrade", slot: 15, tier: 3 },
    { op: "upgrade", slot: 9, tier: 3 },
    { op: "upgrade", slot: 0, tier: 3 },
    { op: "upgrade", slot: 6, tier: 2 },
    { op: "upgrade", slot: 12, tier: 2 },
    { op: "upgrade", slot: 2, tier: 2 },
    { op: "upgrade", slot: 6, tier: 3 },
    { op: "upgrade", slot: 12, tier: 3 },
    { op: "upgrade", slot: 2, tier: 3 }
  ];

  return {
    plan(state) {
      const acts = [];
      let g = state.gold;
      const slots = state.slots;
      for (let i = 0; i < PLAN.length; i++) {
        const p = PLAN[i];
        const sl = slots[p.slot];
        if (p.op === "build") {
          if (!sl.turret) {
            const c = COSTS[p.type];
            if (g >= c) {
              acts.push({ op: "build", slot: p.slot, type: p.type });
              g -= c;
            } else {
              break;
            }
          }
        } else if (p.op === "upgrade") {
          if (sl.turret && sl.turret.tier < p.tier) {
            const base = COSTS[sl.turret.type];
            const c = sl.turret.tier === 1 ? base : base * 2;
            if (g >= c) {
              acts.push({ op: "upgrade", slot: p.slot });
              g -= c;
            } else {
              break;
            }
          }
        }
      }
      return acts;
    },
    target(turret, candidates) {
      const n = candidates.length;
      if (n === 1) return candidates[0].id;
      if (turret.type === "frost") {
        let best = candidates[0], bestScore = -1e18;
        for (let i = 0; i < n; i++) {
          const e = candidates[i];
          const sc = (e.slowed ? 0 : 100000) + (5000 - e.remaining) + e.speed * 80 + (e.air ? 500 : 0);
          if (sc > bestScore) { bestScore = sc; best = e; }
        }
        return best.id;
      }
      if (turret.type === "lance") {
        let best = candidates[0], bestScore = -1e18;
        for (let i = 0; i < n; i++) {
          const e = candidates[i];
          let sc = (5000 - e.remaining);
          if (e.remaining < 900) sc += 50000;
          if (e.type === "mender") sc += 10000;
          else if (e.type === "brute") sc += 8000 + e.armor * 20;
          if (sc > bestScore) { bestScore = sc; best = e; }
        }
        return best.id;
      }
      if (turret.type === "cannon" || turret.type === "flak") {
        const sp = turret.type === "cannon" ? 90 : 70;
        const sp2 = sp * sp;
        let best = candidates[0], bestScore = -1e18;
        for (let i = 0; i < n; i++) {
          const e = candidates[i];
          let val = 0;
          for (let j = 0; j < n; j++) {
            const o = candidates[j];
            const dx = o.x - e.x, dy = o.y - e.y;
            if (dx * dx + dy * dy <= sp2) {
              val += 1000;
              if (o.remaining < 800) val += 4000;
              else if (o.speed >= 12) val += 400;
            }
          }
          const sc = val + (5000 - e.remaining);
          if (sc > bestScore) { bestScore = sc; best = e; }
        }
        return best.id;
      }
      return candidates[0].id;
    }
  };
}
</script>

<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks, observer) {
  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return (t ^ (t >>> 14)) >>> 0;
    };
  }

  const GROUND_PTS = [[50,250],[650,250],[650,1050],[1250,1050],[1250,350],[1850,350],[1850,1150],[2350,1150]];
  const AIR_PTS = [[50,650],[2150,650],[2150,1150],[2350,1150]];

  function buildPath(pts) {
    const segs = [];
    let total = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const x0 = pts[i][0], y0 = pts[i][1];
      const x1 = pts[i + 1][0], y1 = pts[i + 1][1];
      const len = Math.abs(x1 - x0) + Math.abs(y1 - y0);
      segs.push({ x0, y0, dx: Math.sign(x1 - x0), dy: Math.sign(y1 - y0), start: total, len });
      total += len;
    }
    return { segs, len: total };
  }

  const GROUND_PATH = buildPath(GROUND_PTS);
  const AIR_PATH = buildPath(AIR_PTS);

  function posOnPath(path, progress) {
    if (progress <= 0) return [path.segs[0].x0, path.segs[0].y0];
    for (let i = 0; i < path.segs.length; i++) {
      const s = path.segs[i];
      if (progress <= s.start + s.len || i === path.segs.length - 1) {
        const d = progress - s.start;
        return [s.x0 + s.dx * d, s.y0 + s.dy * d];
      }
    }
    const last = path.segs[path.segs.length - 1];
    return [last.x0 + last.dx * last.len, last.y0 + last.dy * last.len];
  }

  const SLOT_COORDS = [
    [3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],
    [14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]
  ];

  const TURRET_DEFS = {
    bolt:   { idx: 0, cost: 50,  dmg: 26,  period: 8,  range: 300, splash: 0,  slow: 0,  pierce: false, ground: true,  air: true  },
    cannon: { idx: 1, cost: 90,  dmg: 60,  period: 24, range: 260, splash: 90, slow: 0,  pierce: false, ground: true,  air: false },
    frost:  { idx: 2, cost: 70,  dmg: 10,  period: 12, range: 240, splash: 0,  slow: 30, pierce: false, ground: true,  air: true  },
    lance:  { idx: 3, cost: 120, dmg: 180, period: 36, range: 360, splash: 0,  slow: 0,  pierce: true,  ground: true,  air: false },
    flak:   { idx: 4, cost: 80,  dmg: 40,  period: 10, range: 320, splash: 70, slow: 0,  pierce: false, ground: false, air: true  }
  };

  const ENEMY_ORDER = ["grunt", "runner", "wisp", "brute", "splitter", "mender"];
  const ENEMY_DEFS = {
    grunt:     { hp: 60,  speed: 10, bounty: 4, leak: 1, air: 0, firstWave: 1, weight: 10 },
    runner:    { hp: 40,  speed: 20, bounty: 4, leak: 1, air: 0, firstWave: 2, weight: 4  },
    wisp:      { hp: 50,  speed: 12, bounty: 6, leak: 2, air: 1, firstWave: 3, weight: 3  },
    brute:     { hp: 150, speed: 6,  bounty: 9, leak: 3, air: 0, firstWave: 4, weight: 3  },
    splitter:  { hp: 90,  speed: 8,  bounty: 6, leak: 2, air: 0, firstWave: 6, weight: 2  },
    mender:    { hp: 70,  speed: 8,  bounty: 7, leak: 2, air: 0, firstWave: 8, weight: 1  },
    splitling: { hp: 1,   speed: 12, bounty: 1, leak: 1, air: 0, firstWave: 999, weight: 0 }
  };

  function turretDmg(type, tier) {
    let d = TURRET_DEFS[type].dmg;
    for (let t = 2; t <= tier; t++) d = Math.floor(d * 16 / 10);
    return d;
  }

  function turretRange(type, tier) {
    return TURRET_DEFS[type].range + (tier - 1) * 30;
  }

  const rng = mulberry32(seed);
  const strat = createStrategy();

  let hpMults = [0, 1000];
  function getHpMult(w) {
    while (hpMults.length <= w) {
      hpMults.push(Math.floor(hpMults[hpMults.length - 1] * 108 / 100));
    }
    return hpMults[w];
  }

  function generateWave(w) {
    const count = 4 + Math.floor(3 * w / 5);
    const avail = [];
    let totalW = 0;
    for (let i = 0; i < ENEMY_ORDER.length; i++) {
      const name = ENEMY_ORDER[i];
      const def = ENEMY_DEFS[name];
      if (def.firstWave <= w) {
        avail.push(name);
        totalW += def.weight;
      }
    }
    const list = [];
    for (let i = 0; i < count; i++) {
      let r = rng() % totalW;
      let chosen = avail[avail.length - 1];
      for (let j = 0; j < avail.length; j++) {
        const wt = ENEMY_DEFS[avail[j]].weight;
        if (r < wt) {
          chosen = avail[j];
          break;
        }
        r -= wt;
      }
      list.push(chosen);
    }
    return list;
  }

  const slots = SLOT_COORDS.map((c, idx) => ({
    slot: idx,
    x: c[0] * 100 + 50,
    y: c[1] * 100 + 50,
    turret: null
  }));

  let baseHp = 10;
  let gold = 250;
  let currentWave = 0;
  let nextEnemyId = 1;
  let enemies = [];
  let spawnQueue = [];
  const log = [];

  let waves = {};
  waves[1] = generateWave(1);

  function makeEnemyView(e) {
    const pathLen = e.air ? AIR_PATH.len : GROUND_PATH.len;
    return {
      id: e.id,
      type: e.type,
      hp: e.hp,
      maxHp: e.maxHp,
      x: e.x,
      y: e.y,
      air: e.air,
      armor: e.armor,
      speed: e.speed,
      slowed: e.slow > 0 ? 1 : 0,
      remaining: pathLen - e.progress
    };
  }

  let fallTick = -1;

  for (let tick = 0; tick < maxTicks; tick++) {
    const obsShots = observer ? [] : null;
    const obsKills = observer ? [] : null;
    const obsHeals = observer ? [] : null;
    const obsLeaks = observer ? [] : null;
    const obsActions = observer ? [] : null;
    let waveStarted = false;

    // 1. Wave start
    if (tick >= 20 && (tick - 20) % 40 === 0) {
      const w = Math.floor((tick - 20) / 40) + 1;
      currentWave = w;
      waveStarted = true;
      gold += Math.min(50, Math.floor(gold * 5 / 100)) + 10 + 2 * w;
      waves[w + 1] = generateWave(w + 1);

      const state = {
        tick,
        wave: w,
        gold,
        baseHp,
        slots: slots.map(s => ({
          slot: s.slot,
          x: s.x,
          y: s.y,
          turret: s.turret ? { type: s.turret.type, tier: s.turret.tier, spent: s.turret.spent } : null
        })),
        enemies: enemies.map(makeEnemyView),
        nextWave: waves[w + 1].slice()
      };

      const actions = strat.plan(state);
      if (Array.isArray(actions)) {
        const limit = Math.min(32, actions.length);
        for (let i = 0; i < limit; i++) {
          const act = actions[i];
          if (!act || typeof act !== "object") continue;
          const slIdx = act.slot;
          if (typeof slIdx !== "number" || slIdx < 0 || slIdx >= 16 || slIdx !== (slIdx | 0)) continue;
          const sl = slots[slIdx];
          if (act.op === "build") {
            const def = TURRET_DEFS[act.type];
            if (!def || sl.turret !== null || gold < def.cost) continue;
            gold -= def.cost;
            sl.turret = { type: act.type, tier: 1, spent: def.cost, cd: 0 };
            log.push([tick, "B", slIdx, def.idx]);
            if (obsActions) obsActions.push({ op: "B", slot: slIdx, type: act.type, x: sl.x, y: sl.y });
          } else if (act.op === "upgrade") {
            if (!sl.turret || sl.turret.tier >= 3) continue;
            const def = TURRET_DEFS[sl.turret.type];
            const cost = sl.turret.tier === 1 ? def.cost : def.cost * 2;
            if (gold < cost) continue;
            gold -= cost;
            sl.turret.tier += 1;
            sl.turret.spent += cost;
            log.push([tick, "U", slIdx, sl.turret.tier]);
            if (obsActions) obsActions.push({ op: "U", slot: slIdx, type: sl.turret.type, tier: sl.turret.tier, x: sl.x, y: sl.y });
          } else if (act.op === "sell") {
            if (!sl.turret) continue;
            const oldType = sl.turret.type;
            gold += Math.floor(sl.turret.spent * 70 / 100);
            sl.turret = null;
            log.push([tick, "S", slIdx, 0]);
            if (obsActions) obsActions.push({ op: "S", slot: slIdx, type: oldType, x: sl.x, y: sl.y });
          }
        }
      }

      const comp = waves[w];
      for (let i = 0; i < comp.length; i++) {
        spawnQueue.push({ tick: tick + 4 * i, wave: w, idx: i, type: comp[i] });
      }
      spawnQueue.sort((a, b) => (a.tick - b.tick) || (a.wave - b.wave) || (a.idx - b.idx));
    }

    // 2. Spawn
    let sqIdx = 0;
    while (sqIdx < spawnQueue.length && spawnQueue[sqIdx].tick === tick) {
      const item = spawnQueue[sqIdx++];
      const def = ENEMY_DEFS[item.type];
      const maxHp = Math.floor(def.hp * getHpMult(item.wave) / 1000);
      let armor = 0;
      if (item.type === "grunt") armor = Math.floor(item.wave / 4);
      else if (item.type === "brute") armor = 6 + item.wave;
      const path = def.air ? AIR_PATH : GROUND_PATH;
      const pos = posOnPath(path, 0);
      enemies.push({
        id: nextEnemyId++,
        type: item.type,
        wave: item.wave,
        hp: maxHp,
        maxHp,
        progress: 0,
        x: pos[0],
        y: pos[1],
        air: def.air,
        armor,
        speed: def.speed,
        bounty: def.bounty,
        leak: def.leak,
        slow: 0,
        age: 0
      });
    }
    if (sqIdx > 0) spawnQueue.splice(0, sqIdx);

    // 3. Move
    let fell = false;
    const survivors = [];
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      const step = e.slow > 0 ? Math.floor(e.speed * 60 / 100) : e.speed;
      e.progress += step;
      const path = e.air ? AIR_PATH : GROUND_PATH;
      if (e.progress >= path.len) {
        baseHp -= e.leak;
        log.push([tick, "L", e.id, baseHp]);
        if (obsLeaks) obsLeaks.push({ id: e.id, baseHp, leak: e.leak });
        if (baseHp <= 0) {
          log.push([tick, "F", currentWave, 0]);
          fallTick = tick;
          fell = true;
          break;
        }
      } else {
        const pos = posOnPath(path, e.progress);
        e.x = pos[0];
        e.y = pos[1];
        survivors.push(e);
      }
    }
    if (fell) {
      enemies = survivors;
      if (observer) {
        observer({
          tick, wave: currentWave, gold, baseHp: Math.max(0, baseHp), fell: true, waveStarted,
          nextWave: waves[currentWave + 1] || waves[1],
          slots: slots.map(s => s.turret ? { type: s.turret.type, tier: s.turret.tier } : null),
          enemies: enemies.map(e => ({ id: e.id, type: e.type, x: e.x, y: e.y, hp: e.hp, maxHp: e.maxHp, air: e.air, slowed: e.slow > 0 ? 1 : 0, progress: e.progress })),
          shots: obsShots, kills: obsKills, heals: obsHeals, leaks: obsLeaks, actions: obsActions
        });
      }
      break;
    }
    enemies = survivors;

    // 4. Age & heal
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      e.age += 1;
      if (e.type === "mender" && e.age % 20 === 0) {
        if (obsHeals) obsHeals.push({ x: e.x, y: e.y });
        for (let j = 0; j < enemies.length; j++) {
          const t = enemies[j];
          const dx = t.x - e.x;
          const dy = t.y - e.y;
          if (dx * dx + dy * dy <= 150 * 150) {
            const heal = Math.floor(t.maxHp * 8 / 100);
            t.hp = Math.min(t.maxHp, t.hp + heal);
          }
        }
      }
    }

    // 5. Turrets fire
    for (let sIdx = 0; sIdx < 16; sIdx++) {
      const sl = slots[sIdx];
      const tr = sl.turret;
      if (!tr) continue;
      if (tr.cd > 0) {
        tr.cd -= 1;
        if (tr.cd > 0) continue;
      }
      const def = TURRET_DEFS[tr.type];
      const range = turretRange(tr.type, tr.tier);
      const r2 = range * range;
      const cands = [];
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (e.air ? !def.air : !def.ground) continue;
        const dx = e.x - sl.x;
        const dy = e.y - sl.y;
        if (dx * dx + dy * dy <= r2) {
          cands.push(e);
        }
      }
      if (cands.length === 0) continue;

      let chosen = null;
      if (typeof strat.target === "function") {
        const tInfo = { slot: sl.slot, type: tr.type, tier: tr.tier, x: sl.x, y: sl.y, range };
        const candViews = cands.map(makeEnemyView);
        const res = strat.target(tInfo, candViews);
        for (let i = 0; i < cands.length; i++) {
          if (cands[i].id === res) {
            chosen = cands[i];
            break;
          }
        }
      }
      if (!chosen) {
        let bestRem = Infinity;
        for (let i = 0; i < cands.length; i++) {
          const e = cands[i];
          const rem = (e.air ? AIR_PATH.len : GROUND_PATH.len) - e.progress;
          if (rem < bestRem) {
            bestRem = rem;
            chosen = e;
          }
        }
      }

      if (obsShots) {
        obsShots.push({
          slot: sl.slot, type: tr.type, sx: sl.x, sy: sl.y,
          tx: chosen.x, ty: chosen.y, air: chosen.air, splash: def.splash
        });
      }

      const dmg = turretDmg(tr.type, tr.tier);
      const applyHit = (e) => {
        const dealt = def.pierce ? dmg : Math.max(1, dmg - e.armor);
        e.hp -= dealt;
        if (def.slow > 0) e.slow = def.slow;
      };

      if (def.splash > 0) {
        const sp2 = def.splash * def.splash;
        const tx = chosen.x, ty = chosen.y;
        for (let i = 0; i < enemies.length; i++) {
          const e = enemies[i];
          if (e.air ? !def.air : !def.ground) continue;
          const dx = e.x - tx;
          const dy = e.y - ty;
          if (dx * dx + dy * dy <= sp2) {
            applyHit(e);
          }
        }
      } else {
        applyHit(chosen);
      }

      tr.cd = def.period;

      let anyDead = false;
      for (let i = 0; i < enemies.length; i++) {
        if (enemies[i].hp <= 0) { anyDead = true; break; }
      }
      if (anyDead) {
        const nextEnemies = [];
        const spawnedSplitlings = [];
        for (let i = 0; i < enemies.length; i++) {
          const e = enemies[i];
          if (e.hp <= 0) {
            log.push([tick, "K", e.id, sl.slot]);
            gold += e.bounty;
            if (obsKills) obsKills.push({ x: e.x, y: e.y, air: e.air, type: e.type });
            if (e.type === "splitter") {
              const shp = Math.max(1, Math.floor(e.maxHp / 4));
              const pos = posOnPath(GROUND_PATH, e.progress);
              for (let k = 0; k < 3; k++) {
                spawnedSplitlings.push({
                  id: nextEnemyId++,
                  type: "splitling",
                  wave: e.wave,
                  hp: shp,
                  maxHp: shp,
                  progress: e.progress,
                  x: pos[0],
                  y: pos[1],
                  air: 0,
                  armor: 0,
                  speed: 12,
                  bounty: 1,
                  leak: 1,
                  slow: 0,
                  age: 0
                });
              }
            }
          } else {
            nextEnemies.push(e);
          }
        }
        for (let k = 0; k < spawnedSplitlings.length; k++) {
          nextEnemies.push(spawnedSplitlings[k]);
        }
        enemies = nextEnemies;
      }
    }

    // 6. Slow timers
    for (let i = 0; i < enemies.length; i++) {
      if (enemies[i].slow > 0) enemies[i].slow -= 1;
    }

    if (observer) {
      observer({
        tick, wave: currentWave, gold, baseHp, fell: false, waveStarted,
        nextWave: waves[currentWave + 1] || waves[1],
        slots: slots.map(s => s.turret ? { type: s.turret.type, tier: s.turret.tier } : null),
        enemies: enemies.map(e => ({ id: e.id, type: e.type, x: e.x, y: e.y, hp: e.hp, maxHp: e.maxHp, air: e.air, slowed: e.slow > 0 ? 1 : 0, progress: e.progress })),
        shots: obsShots, kills: obsKills, heals: obsHeals, leaks: obsLeaks, actions: obsActions
      });
    }
  }

  const endTick = fallTick >= 0 ? fallTick : maxTicks;
  const score = Math.round(((endTick - 20) / 40) * 100) / 100;
  const s = JSON.stringify(log);
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  const hash = (h >>> 0).toString(16).padStart(8, "0");
  return { score, fallTick, log, hash };
}

    } else if (type === "frost") {
      const spire = new THREE.Mesh(new THREE.OctahedronGeometry(0.28, 0), mainMat);
      spire.position.y = 0.18;
      spire.castShadow = true;
      head.add(spire);
    } else if (type === "lance") {
      const body = new THREE.Mesh(new THREE.ConeGeometry(0.26, 0.5, 6), mainMat);
      body.position.y = 0.1;
      const rail = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.78), mainMat);
      rail.position.set(0, 0.12, 0.3);
      head.add(body, rail);
    } else if (type === "flak") {
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.26, 0.36), mainMat);
      const b1 = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.48, 6), darkMat);
      b1.rotation.x = Math.PI / 3;
      b1.position.set(-0.12, 0.18, 0.15);
      const b2 = b1.clone();
      b2.position.x = 0.12;
      head.add(body, b1, b2);
    }

    // Tier pips (3 bright rings/spheres)
    const pips = [];
    const pipMat = new THREE.MeshBasicMaterial({ color: 0xfef08a });
    const pipGeo = new THREE.TorusGeometry(0.36, 0.035, 6, 16);
    for (let t = 0; t < 3; t++) {
      const ring = new THREE.Mesh(pipGeo, pipMat);
      ring.rotation.x = Math.PI / 2;
      ring.position.y = 0.16 + t * 0.11;
      ring.visible = false;
      g.add(ring);
      pips.push(ring);
    }

    g.userData = { type, head, pips };
    return g;
  }

  const slotVisuals = [];
  for (let i = 0; i < 16; i++) {
    slotVisuals.push({ currentType: null, mesh: null });
  }

  // --- Instanced Enemies ---
  const MAX_INST = 180;
  const ENEMY_TYPES = ["grunt", "runner", "wisp", "brute", "splitter", "splitling", "mender"];
  const ENEMY_COLORS = {
    grunt: 0x7a8f72,
    runner: 0xfacc15,
    wisp: 0x22d3ee,
    brute: 0x3a3e47,
    splitter: 0xa855f7,
    splitling: 0xc084fc,
    mender: 0xf8fafc
  };
  const FROST_TINT = new THREE.Color(0x7dd3fc);

  function makeEnemyInstanced(type) {
    let geo;
    if (type === "grunt") geo = new THREE.BoxGeometry(0.42, 0.48, 0.42);
    else if (type === "runner") geo = new THREE.ConeGeometry(0.24, 0.56, 5);
    else if (type === "wisp") geo = new THREE.OctahedronGeometry(0.28, 0);
    else if (type === "brute") geo = new THREE.BoxGeometry(0.64, 0.68, 0.64);
    else if (type === "splitter") geo = new THREE.DodecahedronGeometry(0.36, 0);
    else if (type === "splitling") geo = new THREE.OctahedronGeometry(0.18, 0);
    else geo = new THREE.CylinderGeometry(0.22, 0.28, 0.52, 8); // mender

    const mat = type === "wisp"
      ? new THREE.MeshBasicMaterial({ color: 0xffffff })
      : new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5, metalness: 0.25 });
    const im = new THREE.InstancedMesh(geo, mat, MAX_INST);
    im.count = 0;
    im.castShadow = true;
    im.receiveShadow = true;
    scene.add(im);
    return im;
  }

  const enemyMeshes = {};
  for (let i = 0; i < ENEMY_TYPES.length; i++) {
    enemyMeshes[ENEMY_TYPES[i]] = makeEnemyInstanced(ENEMY_TYPES[i]);
  }

  // Extra accent instances: brute orange shoulder plates, mender green halo, wisp ground shadows
  const brutePlateMesh = new THREE.InstancedMesh(
    new THREE.BoxGeometry(0.72, 0.22, 0.36),
    new THREE.MeshStandardMaterial({ color: 0xf97316, roughness: 0.4, metalness: 0.4 }),
    MAX_INST
  );
  brutePlateMesh.count = 0;
  scene.add(brutePlateMesh);

  const menderHaloMesh = new THREE.InstancedMesh(
    new THREE.RingGeometry(0.34, 0.46, 16),
    new THREE.MeshBasicMaterial({ color: 0x4ade80, side: THREE.DoubleSide, transparent: true, opacity: 0.65 }),
    MAX_INST
  );
  menderHaloMesh.count = 0;
  scene.add(menderHaloMesh);

  const wispShadowMesh = new THREE.InstancedMesh(
    new THREE.CircleGeometry(0.28, 12),
    new THREE.MeshBasicMaterial({ color: 0x05070a, transparent: true, opacity: 0.5 }),
    MAX_INST
  );
  wispShadowMesh.count = 0;
  scene.add(wispShadowMesh);

  // Instanced Health Bars (bg + fg)
  const hpBgMesh = new THREE.InstancedMesh(
    new THREE.PlaneGeometry(0.55, 0.08),
    new THREE.MeshBasicMaterial({ color: 0x111318, side: THREE.DoubleSide }),
    MAX_INST
  );
  const hpFgMesh = new THREE.InstancedMesh(
    new THREE.PlaneGeometry(0.53, 0.06),
    new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide }),
    MAX_INST
  );
  hpBgMesh.count = 0;
  hpFgMesh.count = 0;
  scene.add(hpBgMesh, hpFgMesh);

  // --- Combat VFX Instanced Pools ---
  const MAX_BEAMS = 120;
  const beamMesh = new THREE.InstancedMesh(
    new THREE.CylinderGeometry(0.05, 0.05, 1.0, 6),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 }),
    MAX_BEAMS
  );
  beamMesh.count = 0;
  scene.add(beamMesh);

  const MAX_RINGS = 120;
  const ringMesh = new THREE.InstancedMesh(
    new THREE.RingGeometry(0.78, 1.0, 24),
    new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.75 }),
    MAX_RINGS
  );
  ringMesh.count = 0;
  scene.add(ringMesh);

  const MAX_DEBRIS = 240;
  const debrisMesh = new THREE.InstancedMesh(
    new THREE.BoxGeometry(0.14, 0.14, 0.14),
    new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 }),
    MAX_DEBRIS
  );
  debrisMesh.count = 0;
  scene.add(debrisMesh);

  // --- Orthographic HUD Pass (Inside #stage, zero DOM elements) ---
  const hudScene = new THREE.Scene();
  const hudCam = new THREE.OrthographicCamera(0, window.innerWidth, window.innerHeight, 0, -10, 10);

  // Digit atlas on detached canvas (0-9)
  const glyphCanvas = document.createElement("canvas");
  glyphCanvas.width = 640;
  glyphCanvas.height = 96;
  const gctx = glyphCanvas.getContext("2d");
  gctx.clearRect(0, 0, 640, 96);
  gctx.font = "700 74px -apple-system, BlinkMacSystemFont, sans-serif";
  gctx.textAlign = "center";
  gctx.textBaseline = "middle";
  gctx.fillStyle = "#ffffff";
  for (let d = 0; d < 10; d++) {
    gctx.fillText(String(d), d * 64 + 32, 50);
  }
  const glyphTex = new THREE.CanvasTexture(glyphCanvas);
  glyphTex.encoding = THREE.sRGBEncoding;

  function makeDigitSprites(maxDigits, colorHex) {
    const arr = [];
    for (let i = 0; i < maxDigits; i++) {
      const mat = new THREE.MeshBasicMaterial({ map: glyphTex.clone(), color: colorHex, transparent: true });
      mat.map.needsUpdate = true;
      mat.map.repeat.set(0.1, 1);
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
      mesh.visible = false;
      hudScene.add(mesh);
      arr.push(mesh);
    }
    return arr;
  }

  function layoutNumber(sprites, value, x, y, h, colorHex) {
    const str = String(Math.max(0, Math.floor(value)));
    const w = h * 0.62;
    for (let i = 0; i < sprites.length; i++) {
      const sp = sprites[i];
      if (i < str.length) {
        const d = str.charCodeAt(i) - 48;
        sp.visible = true;
        sp.material.map.offset.set(d * 0.1, 0);
        if (colorHex !== undefined) sp.material.color.setHex(colorHex);
        sp.scale.set(w, h, 1);
        sp.position.set(x + i * w * 0.92 + w * 0.5, y, 0);
      } else {
        sp.visible = false;
      }
    }
    return str.length * w * 0.92;
  }

  // Wave icon (crossed blades)
  const waveIconGroup = new THREE.Group();
  const bladeMat = new THREE.MeshBasicMaterial({ color: 0xe2e8f0 });
  const b1 = new THREE.Mesh(new THREE.PlaneGeometry(0.16, 1.0), bladeMat);
  b1.rotation.z = Math.PI / 4;
  const b2 = new THREE.Mesh(new THREE.PlaneGeometry(0.16, 1.0), bladeMat);
  b2.rotation.z = -Math.PI / 4;
  waveIconGroup.add(b1, b2);
  hudScene.add(waveIconGroup);

  const waveDigits = makeDigitSprites(4, 0xf8fafc);

  // Gold coin icon + digits
  const coinMesh = new THREE.Mesh(
    new THREE.CircleGeometry(0.5, 16),
    new THREE.MeshBasicMaterial({ color: 0xfacc15 })
  );
  hudScene.add(coinMesh);
  const goldDigits = makeDigitSprites(5, 0xfef08a);

  // Next-wave preview icons + count digits
  const PREVIEW_TYPES = ["grunt", "runner", "wisp", "brute", "splitter", "mender"];
  const previewIcons = [];
  const previewCounts = [];
  for (let i = 0; i < PREVIEW_TYPES.length; i++) {
    const ic = new THREE.Mesh(
      new THREE.CircleGeometry(0.5, 12),
      new THREE.MeshBasicMaterial({ color: ENEMY_COLORS[PREVIEW_TYPES[i]] })
    );
    ic.visible = false;
    hudScene.add(ic);
    previewIcons.push(ic);
    previewCounts.push(makeDigitSprites(2, 0xe2e8f0));
  }

  // 10 Base HP pips (top-right)
  const hpPips = [];
  for (let i = 0; i < 10; i++) {
    const pip = new THREE.Mesh(
      new THREE.PlaneGeometry(1, 1),
      new THREE.MeshBasicMaterial({ color: 0x4ade80 })
    );
    hudScene.add(pip);
    hpPips.push(pip);
  }

  // Desaturation overlay quad (for fall state)
  const desatQuad = new THREE.Mesh(
    new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({ color: 0x1a1c22, transparent: true, opacity: 0 })
  );
  desatQuad.position.z = -5;
  hudScene.add(desatQuad);

  function updateHudLayout(wave, gold, baseHp, nextWave, simTime) {
    const W = window.innerWidth;
    const H = window.innerHeight;
    hudCam.right = W;
    hudCam.top = H;
    hudCam.updateProjectionMatrix();

    const padX = Math.max(18, W * 0.018);
    const padY = Math.max(18, H * 0.028);

    // Wave number: >= 7% of viewport height
    const waveH = Math.max(44, H * 0.075);
    const waveY = H - padY - waveH * 0.5;
    waveIconGroup.scale.set(waveH * 0.65, waveH * 0.65, 1);
    waveIconGroup.position.set(padX + waveH * 0.35, waveY, 0);
    layoutNumber(waveDigits, wave, padX + waveH * 0.85, waveY, waveH);

    // Gold under wave
    const goldH = waveH * 0.52;
    const goldY = waveY - waveH * 0.72;
    coinMesh.scale.set(goldH * 0.72, goldH * 0.72, 1);
    coinMesh.position.set(padX + goldH * 0.4, goldY, 0);
    layoutNumber(goldDigits, gold, padX + goldH * 0.95, goldY, goldH);

    // Next-wave preview under gold
    const prevH = waveH * 0.36;
    const prevY = goldY - goldH * 0.95;
    const counts = {};
    if (nextWave) {
      for (let i = 0; i < nextWave.length; i++) {
        counts[nextWave[i]] = (counts[nextWave[i]] || 0) + 1;
      }
    }
    let curX = padX + prevH * 0.4;
    for (let i = 0; i < PREVIEW_TYPES.length; i++) {
      const t = PREVIEW_TYPES[i];
      const c = counts[t] || 0;
      if (c > 0) {
        previewIcons[i].visible = true;
        previewIcons[i].scale.set(prevH * 0.7, prevH * 0.7, 1);
        previewIcons[i].position.set(curX, prevY, 0);
        const nw = layoutNumber(previewCounts[i], c, curX + prevH * 0.48, prevY, prevH);
        curX += prevH * 0.85 + nw + prevH * 0.45;
      } else {
        previewIcons[i].visible = false;
        for (let k = 0; k < previewCounts[i].length; k++) previewCounts[i][k].visible = false;
      }
    }

    // 10 Base HP pips top-right
    const pipW = Math.max(12, W * 0.012);
    const pipH = Math.max(18, H * 0.032);
    const pipGap = Math.max(4, pipW * 0.35);
    const totalPipW = 10 * pipW + 9 * pipGap;
    const startX = W - padX - totalPipW + pipW * 0.5;
    const pipY = H - padY - pipH * 0.5;

    // Check recent leak for flash
    let leakFlash = 0;
    for (let i = 0; i < allLeaks.length; i++) {
      const dt = simTime - allLeaks[i].t;
      if (dt >= 0 && dt < 0.3) leakFlash = Math.max(leakFlash, 1 - dt / 0.3);
    }

    for (let i = 0; i < 10; i++) {
      const pip = hpPips[i];
      pip.scale.set(pipW, pipH, 1);
      pip.position.set(startX + i * (pipW + pipGap), pipY, 0);
      if (i < baseHp) {
        pip.material.color.setHex(baseHp <= 3 ? 0xef4444 : 0x4ade80);
      } else {
        pip.material.color.setHex(leakFlash > 0.2 ? 0xf87171 : 0x262b36);
      }
    }

    // Desaturation veil after fall
    const fallDt = simTime - fallTime;
    if (fallDt > 0) {
      const a = Math.min(1, fallDt / 1.0);
      desatQuad.scale.set(W, H, 1);
      desatQuad.position.set(W / 2, H / 2, -5);
      desatQuad.material.opacity = a * 0.48;
      canvas.style.filter = "saturate(" + (1 - a * 0.92).toFixed(3) + ")";
    } else {
      desatQuad.material.opacity = 0;
      canvas.style.filter = "";
    }
  }

  // --- Render Replay at exact simTime ---
  const dummy = new THREE.Object3D();
  const tmpColor = new THREE.Color();
  const upVec = new THREE.Vector3(0, 1, 0);
  const vStart = new THREE.Vector3();
  const vEnd = new THREE.Vector3();
  const vDir = new THREE.Vector3();

  function smoothNoise(t) {
    return Math.sin(t * 23.7 + 0.4) * 0.5 + Math.sin(t * 41.3 + 1.9) * 0.35 + Math.cos(t * 67.1) * 0.15;
  }

  function renderAtTime(simTime) {
    const clampedTime = Math.min(simTime, fallTime);
    const fIdx = Math.min(frames.length - 1, Math.max(0, Math.floor(clampedTime * 20)));
    const fNextIdx = Math.min(frames.length - 1, fIdx + 1);
    const frac = simTime >= fallTime ? 0 : (clampedTime * 20 - fIdx);

    const f0 = frames[fIdx];
    const f1 = frames[fNextIdx];

    // Trauma shake (closed-form)
    let trauma = 0;
    for (let i = 0; i < allLeaks.length; i++) {
      const dt = simTime - allLeaks[i].t;
      if (dt >= 0 && dt < 1.0) trauma += Math.max(0, 0.3 - dt);
    }
    if (simTime >= fallTime) {
      const dt = simTime - fallTime;
      if (dt < 1.0) trauma += Math.max(0, 1.0 - dt);
    }
    trauma = Math.min(1, trauma);
    const shake = trauma * trauma * 0.25;
    camera.position.set(
      baseCamPos.x + smoothNoise(simTime) * shake,
      baseCamPos.y + smoothNoise(simTime + 11.3) * shake * 0.6,
      baseCamPos.z + smoothNoise(simTime + 27.1) * shake
    );
    camera.lookAt(baseCamLook);

    // Keep state & crumble
    let leakRed = 0;
    for (let i = 0; i < allLeaks.length; i++) {
      const dt = simTime - allLeaks[i].t;
      if (dt >= 0 && dt < 0.25) leakRed = Math.max(leakRed, 1 - dt / 0.25);
    }
    keepBaseMat.emissive.setRGB(leakRed * 0.8, 0, 0);
    const hpNow = f0.baseHp;
    const collapsed = simTime >= fallTime;
    keepCore.visible = !collapsed;
    keepTower.visible = !collapsed;
    keepSpire.visible = !collapsed;
    for (let i = 0; i < 10; i++) {
      keepChunks[i].visible = !collapsed && i < hpNow;
    }

    // Turrets
    for (let s = 0; s < 16; s++) {
      const st = f0.slots[s];
      const sv = slotVisuals[s];
      if (!st) {
        if (sv.mesh) {
          scene.remove(sv.mesh);
          sv.mesh = null;
          sv.currentType = null;
        }
      } else {
        if (sv.currentType !== st.type) {
          if (sv.mesh) scene.remove(sv.mesh);
          sv.mesh = createTurretMesh(st.type);
          sv.mesh.position.set(SLOT_TILES[s][0] + 0.5, 0, SLOT_TILES[s][1] + 0.5);
          scene.add(sv.mesh);
          sv.currentType = st.type;
        }
        const pips = sv.mesh.userData.pips;
        for (let t = 0; t < 3; t++) pips[t].visible = t < st.tier;
      }
    }

    // Map next-tick enemies by id for smooth interpolation
    const nextMap = new Map();
    for (let i = 0; i < f1.enemies.length; i++) {
      nextMap.set(f1.enemies[i].id, f1.enemies[i]);
    }

    const typeCounts = { grunt: 0, runner: 0, wisp: 0, brute: 0, splitter: 0, splitling: 0, mender: 0 };
    let brutePlateCnt = 0, menderHaloCnt = 0, wispShadCnt = 0, hpCnt = 0;

    for (let i = 0; i < f0.enemies.length; i++) {
      const e0 = f0.enemies[i];
      const e1 = nextMap.get(e0.id);
      const ex = (e1 ? (e0.x + (e1.x - e0.x) * frac) : e0.x) / 100;
      const ez = (e1 ? (e0.y + (e1.y - e0.y) * frac) : e0.y) / 100;
      const ey = e0.air ? 0.8 + Math.sin(clampedTime * 5 + e0.id) * 0.08 : 0.28;

      let yaw = 0;
      if (e1 && (e1.x !== e0.x || e1.y !== e0.y)) {
        yaw = Math.atan2(e1.x - e0.x, e1.y - e0.y);
      }

      const idx = typeCounts[e0.type];
      if (idx < MAX_INST) {
        dummy.position.set(ex, ey, ez);
        dummy.rotation.set(e0.type === "runner" ? Math.PI / 2 : 0, yaw, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        const im = enemyMeshes[e0.type];
        im.setMatrixAt(idx, dummy.matrix);
        tmpColor.setHex(ENEMY_COLORS[e0.type]);
        if (e0.slowed) tmpColor.lerp(FROST_TINT, 0.6);
        im.setColorAt(idx, tmpColor);
        typeCounts[e0.type]++;
      }

      if (e0.type === "brute" && brutePlateCnt < MAX_INST) {
        dummy.position.set(ex, ey + 0.14, ez);
        dummy.rotation.set(0, yaw, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        brutePlateMesh.setMatrixAt(brutePlateCnt++, dummy.matrix);
      } else if (e0.type === "mender" && menderHaloCnt < MAX_INST) {
        dummy.position.set(ex, 0.12, ez);
        dummy.rotation.set(-Math.PI / 2, 0, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        menderHaloMesh.setMatrixAt(menderHaloCnt++, dummy.matrix);
      } else if (e0.type === "wisp" && wispShadCnt < MAX_INST) {
        dummy.position.set(ex, 0.1, ez);
        dummy.rotation.set(-Math.PI / 2, 0, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        wispShadowMesh.setMatrixAt(wispShadCnt++, dummy.matrix);
      }

      // Health bar
      if (hpCnt < MAX_INST) {
        const ratio = Math.max(0.02, e0.hp / e0.maxHp);
        const by = ey + (e0.type === "brute" ? 0.65 : 0.48);
        dummy.position.set(ex, by, ez);
        dummy.rotation.set(-Math.PI / 3, 0, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        hpBgMesh.setMatrixAt(hpCnt, dummy.matrix);

        dummy.position.set(ex - (1 - ratio) * 0.265, by + 0.005, ez + 0.005);
        dummy.scale.set(ratio, 1, 1);
        dummy.updateMatrix();
        hpFgMesh.setMatrixAt(hpCnt, dummy.matrix);
        tmpColor.setHex(ratio > 0.5 ? 0x4ade80 : (ratio > 0.25 ? 0xfacc15 : 0xef4444));
        hpFgMesh.setColorAt(hpCnt, tmpColor);
        hpCnt++;
      }
    }

    for (let i = 0; i < ENEMY_TYPES.length; i++) {
      const t = ENEMY_TYPES[i];
      const im = enemyMeshes[t];
      im.count = typeCounts[t];
      im.instanceMatrix.needsUpdate = true;
      if (im.instanceColor) im.instanceColor.needsUpdate = true;
    }
    brutePlateMesh.count = brutePlateCnt; brutePlateMesh.instanceMatrix.needsUpdate = true;
    menderHaloMesh.count = menderHaloCnt; menderHaloMesh.instanceMatrix.needsUpdate = true;
    wispShadowMesh.count = wispShadCnt; wispShadowMesh.instanceMatrix.needsUpdate = true;
    hpBgMesh.count = hpCnt; hpBgMesh.instanceMatrix.needsUpdate = true;
    hpFgMesh.count = hpCnt; hpFgMesh.instanceMatrix.needsUpdate = true;
    if (hpFgMesh.instanceColor) hpFgMesh.instanceColor.needsUpdate = true;

    // Combat VFX: Beams, Rings, Debris
    let beamCnt = 0, ringCnt = 0, debCnt = 0;

    for (let i = 0; i < allShots.length; i++) {
      const sh = allShots[i];
      const dt = clampedTime - sh.t;
      if (dt < 0 || dt > 0.15) continue;
      const alpha = 1 - dt / 0.15;

      // Aim turret head toward shot
      const sv = slotVisuals[sh.slot];
      if (sv && sv.mesh) {
        sv.mesh.userData.head.rotation.y = Math.atan2(sh.tx - sh.sx, sh.ty - sh.sy);
      }

      if (beamCnt < MAX_BEAMS) {
        const sy = 0.65;
        const ty = sh.air ? 0.8 : 0.3;
        vStart.set(sh.sx, sy, sh.sy);
        vEnd.set(sh.tx, ty, sh.ty);
        vDir.subVectors(vEnd, vStart);
        const len = vDir.length();
        dummy.position.copy(vStart).addScaledVector(vDir, 0.5);
        dummy.quaternion.setFromUnitVectors(upVec, vDir.normalize());
        const thick = sh.type === "lance" ? 2.6 : (sh.type === "frost" ? 1.4 : 0.9);
        dummy.scale.set(thick * alpha, len, thick * alpha);
        dummy.updateMatrix();
        beamMesh.setMatrixAt(beamCnt, dummy.matrix);
        tmpColor.setHex(TURRET_COLORS[sh.type]);
        beamMesh.setColorAt(beamCnt, tmpColor);
        beamCnt++;
      }

      if (sh.splash > 0 && ringCnt < MAX_RINGS) {
        const r = Math.max(0.15, sh.splash * (0.35 + 0.65 * (dt / 0.15)));
        dummy.position.set(sh.tx, sh.air ? 0.8 : 0.14, sh.ty);
        dummy.rotation.set(-Math.PI / 2, 0, 0);
        dummy.scale.set(r, r, 1);
        dummy.updateMatrix();
        ringMesh.setMatrixAt(ringCnt, dummy.matrix);
        tmpColor.setHex(sh.type === "flak" ? 0x14b8a6 : 0xf59e0b);
        ringMesh.setColorAt(ringCnt, tmpColor);
        ringCnt++;
      }
    }

    // Mender heal rings
    for (let i = 0; i < allHeals.length; i++) {
      const h = allHeals[i];
      const dt = clampedTime - h.t;
      if (dt < 0 || dt > 0.35 || ringCnt >= MAX_RINGS) continue;
      const r = 1.5 * (dt / 0.35);
      dummy.position.set(h.x, 0.14, h.y);
      dummy.rotation.set(-Math.PI / 2, 0, 0);
      dummy.scale.set(r, r, 1);
      dummy.updateMatrix();
      ringMesh.setMatrixAt(ringCnt, dummy.matrix);
      tmpColor.setHex(0x4ade80);
      ringMesh.setColorAt(ringCnt, tmpColor);
      ringCnt++;
    }

    // Build/Upgrade/Sell rings
    for (let i = 0; i < allActions.length; i++) {
      const a = allActions[i];
      const dt = clampedTime - a.t;
      if (dt < 0 || dt > 0.4 || ringCnt >= MAX_RINGS) continue;
      const r = 0.4 + 0.7 * (dt / 0.4);
      dummy.position.set(a.x, 0.18 + (a.op === "B" ? dt * 1.2 : 0), a.y);
      dummy.rotation.set(-Math.PI / 2, 0, 0);
      dummy.scale.set(r, r, 1);
      dummy.updateMatrix();
      ringMesh.setMatrixAt(ringCnt, dummy.matrix);
      tmpColor.setHex(a.op === "U" ? 0xfef08a : (a.op === "B" ? 0x38bdf8 : 0x94a3b8));
      ringMesh.setColorAt(ringCnt, tmpColor);
      ringCnt++;
    }

    // Kill debris (closed-form ballistic)
    for (let i = 0; i < allKills.length; i++) {
      const k = allKills[i];
      const dt = clampedTime - k.t;
      if (dt < 0 || dt > 0.55) continue;
      const col = ENEMY_COLORS[k.type] || 0xffffff;
      const pieces = k.type === "splitter" ? 5 : 3;
      for (let p = 0; p < pieces && debCnt < MAX_DEBRIS; p++) {
        const ang = (k.seed + p * 2.1) % 6.283;
        const spd = 1.2 + ((k.seed * (p + 1)) % 10) * 0.15;
        const vy = 2.8 + (p % 3) * 0.6;
        const x = k.x + Math.cos(ang) * spd * dt;
        const z = k.y + Math.sin(ang) * spd * dt;
        const y = Math.max(0.08, (k.air ? 0.8 : 0.25) + vy * dt - 4.9 * dt * dt);
        const sc = Math.max(0.01, 1 - dt / 0.55);
        dummy.position.set(x, y, z);
        dummy.rotation.set(dt * 8 + p, dt * 6, 0);
        dummy.scale.set(sc, sc, sc);
        dummy.updateMatrix();
        debrisMesh.setMatrixAt(debCnt, dummy.matrix);
        tmpColor.setHex(col);
        debrisMesh.setColorAt(debCnt, tmpColor);
        debCnt++;
      }
    }

    // Fall shockwave & keep debris
    if (simTime >= fallTime) {
      const dt = simTime - fallTime;
      if (dt < 1.2 && ringCnt < MAX_RINGS) {
        const r = 0.5 + dt * 5.5;
        dummy.position.set(23.5, 0.2, 11.5);
        dummy.rotation.set(-Math.PI / 2, 0, 0);
        dummy.scale.set(r, r, 1);
        dummy.updateMatrix();
        ringMesh.setMatrixAt(ringCnt, dummy.matrix);
        tmpColor.setHex(0xef4444);
        ringMesh.setColorAt(ringCnt, tmpColor);
        ringCnt++;
      }
      if (dt < 2.0) {
        for (let p = 0; p < 18 && debCnt < MAX_DEBRIS; p++) {
          const ang = p * 0.35 + 0.2;
          const spd = 1.5 + (p % 5) * 0.55;
          const vy = 3.5 + (p % 4) * 0.9;
          const x = 23.5 + Math.cos(ang) * spd * dt;
          const z = 11.5 + Math.sin(ang) * spd * dt;
          const y = Math.max(0.1, 0.8 + vy * dt - 4.9 * dt * dt);
          dummy.position.set(x, y, z);
          dummy.rotation.set(dt * 5 + p, dt * 4, p);
          dummy.scale.set(1.6, 1.6, 1.6);
          dummy.updateMatrix();
          debrisMesh.setMatrixAt(debCnt, dummy.matrix);
          tmpColor.setHex(0x64748b);
          debrisMesh.setColorAt(debCnt, tmpColor);
          debCnt++;
        }
      }
    }

    beamMesh.count = beamCnt; beamMesh.instanceMatrix.needsUpdate = true;
    if (beamMesh.instanceColor) beamMesh.instanceColor.needsUpdate = true;
    ringMesh.count = ringCnt; ringMesh.instanceMatrix.needsUpdate = true;
    if (ringMesh.instanceColor) ringMesh.instanceColor.needsUpdate = true;
    debrisMesh.count = debCnt; debrisMesh.instanceMatrix.needsUpdate = true;
    if (debrisMesh.instanceColor) debrisMesh.instanceColor.needsUpdate = true;

    // Render 3D scene + HUD overlay
    updateHudLayout(f0.wave, f0.gold, f0.baseHp, f0.nextWave, simTime);
    renderer.clear();
    renderer.render(scene, camera);
    renderer.clearDepth();
    renderer.render(hudScene, hudCam);
  }

  // --- Web Audio API Synthesized SFX (No Music) ---
  let audioCtx = null;
  let masterGain = null;
  let activeNodes = [];
  let windNode = null;
  let windGain = null;
  let lastAudioTick = -1;
  let recentShotTimes = [];

  function initAudio() {
    if (audioCtx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
    const comp = audioCtx.createDynamicsCompressor();
    comp.threshold.value = -12;
    comp.ratio.value = 6;
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.0001;
    masterGain.connect(comp);
    comp.connect(audioCtx.destination);
    if (audioCtx.state === "suspended") audioCtx.resume().catch(function () {});
  }
  initAudio();

  function unlockAudio() {
    if (!audioCtx) initAudio();
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(function () {});
  }
  window.addEventListener("pointerdown", unlockAudio, { once: true });
  window.addEventListener("keydown", unlockAudio, { once: true });

  function setAudioAudible(audible) {
    if (!audioCtx || !masterGain) return;
    const now = audioCtx.currentTime;
    masterGain.gain.cancelScheduledValues(now);
    masterGain.gain.setTargetAtTime(audible ? 0.45 : 0.0001, now, 0.015);
    if (!audible) {
      for (let i = 0; i < activeNodes.length; i++) {
        try { activeNodes[i].stop(now + 0.04); } catch (e) {}
      }
      activeNodes = [];
    }
  }

  function makePanner(boardX) {
    if (audioCtx.createStereoPanner) {
      const p = audioCtx.createStereoPanner();
      p.pan.value = Math.max(-1, Math.min(1, (boardX / 12) - 1));
      p.connect(masterGain);
      return p;
    }
    return masterGain;
  }

  function playTone(freq0, freq1, dur, type, vol, boardX) {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq0, now);
    if (freq1 !== freq0) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq1), now + dur);
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.connect(g);
    g.connect(makePanner(boardX));
    osc.start(now);
    osc.stop(now + dur + 0.01);
    activeNodes.push(osc);
    if (activeNodes.length > 40) activeNodes.shift();
  }

  function playShotSound(type, boardX) {
    const now = audioCtx ? audioCtx.currentTime : 0;
    recentShotTimes = recentShotTimes.filter(function (t) { return now - t < 1.0; });
    if (recentShotTimes.length >= 12) return;
    recentShotTimes.push(now);
    const v = 0.9 + audRng() * 0.2;
    if (type === "cannon") playTone(140 * v, 45, 0.14, "sawtooth", 0.22, boardX);
    else if (type === "lance") playTone(680 * v, 180, 0.16, "sawtooth", 0.2, boardX);
    else if (type === "flak") playTone(320 * v, 90, 0.09, "square", 0.14, boardX);
    else if (type === "frost") playTone(1100 * v, 800, 0.1, "sine", 0.09, boardX);
    else playTone(520 * v, 260, 0.06, "triangle", 0.1, boardX);
  }

  function triggerAudioForTickRange(prevTick, curTick) {
    if (!audioCtx || audioCtx.state !== "running") return;
    if (curTick <= prevTick) return;
    const SHOT_PRIO = { lance: 5, cannon: 4, flak: 3, bolt: 2, frost: 1 };

    for (let t = prevTick + 1; t <= curTick; t++) {
      if (t >= frames.length) break;
      const f = frames[t];
      if (f.waveStarted) {
        playTone(220, 330, 0.35, "sawtooth", 0.16, 12);
      }
      if (f.shots.length > 0) {
        const sorted = f.shots.slice().sort(function (a, b) { return (SHOT_PRIO[b.type] || 0) - (SHOT_PRIO[a.type] || 0); });
        for (let i = 0; i < Math.min(3, sorted.length); i++) {
          playShotSound(sorted[i].type, sorted[i].sx / 100);
        }
      }
      if (f.kills.length > 0) {
        playTone(420 + audRng() * 140, 180, 0.05, "sine", 0.08, f.kills[0].x / 100);
      }
      if (f.leaks.length > 0) {
        playTone(180, 70, 0.22, "square", 0.28, 23.5);
        playTone(620, 440, 0.25, "sawtooth", 0.18, 23.5);
      }
      if (f.fell) {
        playTone(95, 28, 0.9, "sawtooth", 0.4, 23.5);
        playTone(60, 22, 1.2, "triangle", 0.35, 12);
      }
    }
  }

  // --- 5-State Playback State Machine ---
  const elCountdown = document.getElementById("countdown");
  const elBtnRefire = document.getElementById("btn-refire");
  const elBtnToggle = document.getElementById("btn-toggle");
  const elIconPause = document.getElementById("icon-pause");
  const elIconPlay = document.getElementById("icon-play");
  const elScrubber = document.getElementById("scrubber");
  const elSpeedPills = document.querySelectorAll(".speed-pill");

  let state = "COUNTDOWN"; // COUNTDOWN | PLAYING | PAUSED | REFIRE_HOLD | ENDED
  let simTime = 0.0;
  let playbackSpeed = 1.0;
  let countdownElapsed = 0.0;
  let holdElapsed = 0.0;
  let lastWallMs = null;

  function setPlayPauseIcon(isPlayingVisual) {
    elIconPause.style.display = isPlayingVisual ? "" : "none";
    elIconPlay.style.display = isPlayingVisual ? "none" : "";
    elBtnToggle.setAttribute("aria-label", isPlayingVisual ? "Pause" : "Play");
  }

  elBtnToggle.addEventListener("click", function () {
    if (state === "PLAYING") {
      state = "PAUSED";
      setPlayPauseIcon(false);
      setAudioAudible(false);
    } else if (state === "COUNTDOWN" || state === "REFIRE_HOLD") {
      state = "PAUSED";
      elCountdown.style.display = "none";
      elCountdown.textContent = "";
      simTime = 0.0;
      elScrubber.value = "0";
      setPlayPauseIcon(false);
      setAudioAudible(false);
      renderAtTime(simTime);
    } else if (state === "PAUSED") {
      state = "PLAYING";
      lastAudioTick = Math.floor(simTime * 20);
      setPlayPauseIcon(true);
      setAudioAudible(true);
    } else if (state === "ENDED") {
      simTime = 0.0;
      elScrubber.value = "0";
      elCountdown.style.display = "none";
      elCountdown.textContent = "";
      state = "PLAYING";
      lastAudioTick = -1;
      setPlayPauseIcon(true);
      setAudioAudible(true);
      renderAtTime(simTime);
    }
  });

  elBtnRefire.addEventListener("click", function () {
    elCountdown.style.display = "none";
    elCountdown.textContent = "";
    simTime = 0.0;
    elScrubber.value = "0";
    holdElapsed = 0.0;
    lastAudioTick = -1;
    state = "REFIRE_HOLD";
    setPlayPauseIcon(true);
    setAudioAudible(false);
    renderAtTime(0.0);
  });

  elSpeedPills.forEach(function (pill) {
    pill.addEventListener("click", function () {
      playbackSpeed = parseFloat(pill.getAttribute("data-speed")) || 1.0;
      elSpeedPills.forEach(function (p) {
        const active = p === pill;
        p.classList.toggle("is-active", active);
        p.setAttribute("aria-checked", active ? "true" : "false");
      });
    });
  });

  elScrubber.addEventListener("input", function () {
    elCountdown.style.display = "none";
    elCountdown.textContent = "";
    simTime = parseFloat(elScrubber.value) || 0.0;
    state = "PAUSED";
    lastAudioTick = Math.floor(simTime * 20);
    setPlayPauseIcon(false);
    setAudioAudible(false);
    renderAtTime(simTime);
  });

  window.addEventListener("resize", function () {
    updateCameraFraming();
    renderAtTime(simTime);
  });

  // Initial resting frame before countdown starts
  elCountdown.style.display = "block";
  elCountdown.textContent = "3";
  renderAtTime(0.0);

  function animate(nowMs) {
    requestAnimationFrame(animate);
    if (lastWallMs === null) {
      lastWallMs = nowMs;
      return;
    }
    const rawDt = (nowMs - lastWallMs) / 1000;
    lastWallMs = nowMs;
    const dt = Math.min(Math.max(rawDt, 0), 0.1);

    if (state === "COUNTDOWN") {
      countdownElapsed += dt;
      if (countdownElapsed < 1.0) {
        elCountdown.style.display = "block";
        elCountdown.textContent = "3";
      } else if (countdownElapsed < 2.0) {
        elCountdown.style.display = "block";
        elCountdown.textContent = "2";
      } else if (countdownElapsed < 3.0) {
        elCountdown.style.display = "block";
        elCountdown.textContent = "1";
      } else {
        elCountdown.style.display = "none";
        elCountdown.textContent = "";
        state = "PLAYING";
        lastAudioTick = -1;
        setPlayPauseIcon(true);
        setAudioAudible(true);
      }
      renderAtTime(0.0);
    } else if (state === "REFIRE_HOLD") {
      holdElapsed += dt;
      if (holdElapsed >= 1.0) {
        state = "PLAYING";
        lastAudioTick = -1;
        setPlayPauseIcon(true);
        setAudioAudible(true);
      }
      renderAtTime(0.0);
    } else if (state === "PLAYING") {
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      elScrubber.value = simTime.toFixed(3);
      const curTick = Math.floor(Math.min(simTime, fallTime) * 20);
      if (curTick > lastAudioTick) {
        triggerAudioForTickRange(lastAudioTick, curTick);
        lastAudioTick = curTick;
      }
      renderAtTime(simTime);
      if (simTime >= DURATION) {
        simTime = DURATION;
        elScrubber.value = DURATION.toFixed(3);
        state = "ENDED";
        setPlayPauseIcon(false);
        setAudioAudible(false);
      }
    }
  }

  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
