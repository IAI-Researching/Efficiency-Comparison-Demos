<script id="rampart-strategy">
function createStrategy() {
  const types = ['bolt','cannon','flak'];
  const costs = [50,90,80];
  // Open with a splash battery at the entry and carry its bounty down the road.
  const orders = [
    [0,1],[2,0],[5,2],[1,1],[10,2],[1,1],[3,1],[9,1],
    [2,0],[5,2],[13,1],[1,1],[0,1],[3,1],[4,1],[6,1],
    [6,1],[8,2],[2,0],[5,2],[3,1],[4,1],[6,1],[7,1],
    [4,1],[11,1],[8,2],[11,1],[12,1],[12,1],[7,1],[14,2],
    [13,1],[11,1],[12,1],[13,1],[8,2],[10,2],[10,2],[9,1],
    [7,1],[9,1],[14,2],[14,2],[15,2],[15,2],[0,1],[15,2]
  ];
  let step = 0;
  return {
    plan(state) {
      const actions = [], levels = state.slots.map(s=>s.turret ? s.turret.tier : 0);
      let gold = state.gold;
      while (step < orders.length) {
        const [slot,k] = orders[step], level = levels[slot];
        const price = costs[k] * (level===2 ? 2 : 1);
        if (gold < price) break;
        actions.push({op:level?'upgrade':'build',slot,type:types[k]});
        levels[slot]++; gold-=price; step++;
      }
      return actions;
    },
    target(t, enemies) {
      let best = -Infinity, id;
      const splash = t.type==='cannon' ? 90 : t.type==='flak' ? 70 : 0;
      const damage = (t.type==='cannon'?[60,96,153]:t.type==='flak'?[40,64,102]:[26,41,65])[t.tier-1];
      for (const e of enemies) {
        let value = 0;
        const credit = p => Math.min(p.hp,Math.max(1,damage-p.armor))/damage + (p.hp<=damage-p.armor ? 0.4 : 0);
        if (splash) {
          for (const p of enemies) if ((e.x-p.x)**2+(e.y-p.y)**2<=splash*splash) value+=credit(p);
        } else value = credit(e) + e.air*0.8;
        value *= 1 + 0.35*(1-e.remaining/4600) + 2*Math.max(0,1-e.remaining/(e.speed*50));
        value *= 1+Math.max(0,1-e.remaining/(e.speed*110));
        if (value>best) { best=value; id=e.id; }
      }
      return id;
    }
  };
}
</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks) {
  const record = rampartSimulate.record, strategy = createStrategy(), log = [];
  const towers = ['bolt','cannon','frost','lance','flak'];
  const cost=[50,90,70,120,80], power=[26,60,10,180,40], period=[8,24,12,36,10], range=[300,260,240,360,320], splash=[0,90,0,0,70];
  const names=['grunt','runner','wisp','brute','splitter','mender','splitling'];
  const weights=[10,4,3,3,2,1], first=[1,2,3,4,6,8], health=[60,40,50,150,90,70], speed=[10,20,12,6,8,8,12], bounty=[4,4,6,9,6,7,1], leak=[1,1,2,3,2,2,1];
  const slots=[[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],[14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]].map(([x,y],slot)=>({slot,x:100*x+50,y:100*y+50,turret:null}));
  const paths=[[[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]],[[0,6],[21,6],[21,11],[23,11]]];
  const floor=Math.floor;
  let wave=0, gold=250, baseHp=10, nextId=1, fallTick=-1, enemies=[], queue=[], tick=0, scale=1000, effects=[];
  function mulberry32(a) { return function () {
    a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return (t ^ (t >>> 14)) >>> 0; }; }
  const draw=mulberry32(seed);
  function generate(w) {
    const sum=weights.reduce((n,v,i)=>n+(first[i]<=w?v:0),0);
    return Array.from({length:4+floor(3*w/5)},()=>{
      let r=draw()%sum,i=0;
      while(r>=weights[i]) r-=weights[i++];
      return i;
    });
  }
  let next=generate(1);
  function locate(e) {
    const path=paths[e.air]; let p=e.progress;
    for(let i=1;i<path.length;i++){
      const [x,y]=path[i-1],dx=path[i][0]-x,dy=path[i][1]-y,len=100*(Math.abs(dx)+Math.abs(dy));
      if(p<=len || i===path.length-1){
        e.x=x*100+50+Math.sign(dx)*Math.min(len,p); e.y=y*100+50+Math.sign(dy)*Math.min(len,p);
        e.dir=Math.sign(dx) || (dy>0?2:-2); break;
      }
      p-=len;
    }
    e.remaining=(e.air?2800:4600)-e.progress;
  }
  function add(k,w,h,p=0) {
    const e={id:nextId++,k,type:names[k],hp:h,maxHp:h,air:+(k===2),armor:k===3?6+w:k===0?floor(w/4):0,speed:speed[k],slowed:0,progress:p,wave:w,age:0};
    locate(e); enemies.push(e);
  }
  function view(e) {
    const {id,type,hp,maxHp,x,y,air,armor,speed,slowed,remaining}=e;
    return {id,type,hp,maxHp,x,y,air,armor,speed,slowed,remaining};
  }
  const d2=(a,b)=>(a.x-b.x)**2+(a.y-b.y)**2;
  const emit=(code,a,b)=>log.push([tick,code,a,b]);
  function save(){
    if(record) record({tick,wave,gold,baseHp,next:next.map(i=>names[i]),slots:slots.map(s=>({...s,turret:s.turret && {...s.turret}})),enemies:enemies.map(e=>({...e})),effects});
  }
  for(tick=0;tick<maxTicks;tick++){
    effects=[];
    if(tick>=20 && (tick-20)%40===0){
      wave++; if(wave>1)scale=floor(scale*108/100);
      gold+=Math.min(50,floor(gold*5/100))+10+2*wave;
      const current=next; next=generate(wave+1);
      const actions=strategy.plan({tick,wave,gold,baseHp,slots:slots.map(s=>({...s,turret:s.turret && {type:s.turret.type,tier:s.turret.tier,spent:s.turret.spent}})),enemies:enemies.map(view),nextWave:next.map(i=>names[i])});
      if(Array.isArray(actions))for(const a of actions.slice(0,32)){
        if(!a || !Number.isInteger(a.slot) || !slots[a.slot])continue;
        const s=slots[a.slot],t=s.turret;
        if(a.op==='build' && !t){
          const k=towers.indexOf(a.type);
          if(k<0 || gold<cost[k])continue;
          s.turret={type:a.type,k,tier:1,spent:cost[k],cooldown:0,damage:power[k],aim:0}; gold-=cost[k]; emit('B',s.slot,k);
        }else if(a.op==='upgrade' && t && t.tier<3){
          const price=t.tier*cost[t.k]; if(gold<price)continue;
          gold-=price; t.spent+=price;t.tier++; t.damage=floor(t.damage*16/10);emit('U',s.slot,t.tier);
        }else if(a.op==='sell' && t){gold+=floor(t.spent*7/10);s.turret=null;emit('S',s.slot,0);}
      }
      current.forEach((k,i)=>queue.push({tick:tick+4*i,k,w:wave,h:floor(health[k]*scale/1000),i}));
      queue.sort((a,b)=>a.tick-b.tick || a.w-b.w || a.i-b.i);
    }
    while(queue.length && queue[0].tick===tick){const s=queue.shift();add(s.k,s.w,s.h);}
    for(const e of enemies){
      e.progress+=e.slowed?floor(e.speed*60/100):e.speed;locate(e);
      if(e.remaining<=0){
        e.gone=true;baseHp-=leak[e.k];emit('L',e.id,baseHp);
        if(baseHp<=0){fallTick=tick;emit('F',wave,0);break;}
      }
    }
    enemies=enemies.filter(e=>!e.gone);
    if(fallTick>=0){save();break;}
    for(const e of enemies){
      e.age++;
      if(e.k===5 && e.age%20===0){
        for(const p of enemies)if(d2(e,p)<=22500)p.hp=Math.min(p.maxHp,p.hp+floor(p.maxHp*8/100));
        if(record)effects.push(['heal',e.x,e.y]);
      }
    }
    for(const s of slots){
      const t=s.turret;if(!t)continue;
      if(t.cooldown>0 && --t.cooldown>0)continue;
      const k=t.k,r=range[k]+30*(t.tier-1), valid=e=>e.air?k!==1 && k!==3:k!==4;
      const candidates=enemies.filter(e=>valid(e)&&d2(s,e)<=r*r);
      if(!candidates.length)continue;
      const id=strategy.target && strategy.target({slot:s.slot,type:t.type,tier:t.tier,x:s.x,y:s.y,range:r},candidates.map(view));
      const target=candidates.find(e=>e.id===id) || candidates.reduce((a,b)=>b.remaining<a.remaining?b:a);
      if(record){t.aim=Math.atan2(target.x-s.x,target.y-s.y);effects.push(['shot',s.slot,k,target.x,target.y,target.air]);}
      for(const p of splash[k]?enemies:[target]){
        if(!valid(p) || (splash[k] && d2(p,target)>splash[k]**2))continue;
        p.hp-=Math.max(1,t.damage-(k===3?0:p.armor));if(k===2)p.slowed=30;
      }
      t.cooldown=period[k];
      const dead=enemies.filter(e=>e.hp<=0);
      if(dead.length){
        enemies=enemies.filter(e=>e.hp>0);
        for(const e of dead){
          gold+=bounty[e.k];emit('K',e.id,s.slot);
          if(record)effects.push(['kill',e.x,e.y,e.k,e.id]);
          if(e.k===4)for(let i=0;i<3;i++)add(6,e.wave,Math.max(1,floor(e.maxHp/4)),e.progress);
        }
      }
    }
    for(const e of enemies)if(e.slowed)e.slowed--;
    save();
  }
  let h=0x811c9dc5;
  const str=JSON.stringify(log);
  for(let i=0;i<str.length;i++)h=Math.imul(h^str.charCodeAt(i),0x01000193);
  return {score:Math.round((tick-20)/40*100)/100,fallTick,log,hash:(h>>>0).toString(16).padStart(8,'0')};
}
</script>
<script>

  selfCheck:{vectorA:true,vectorB:true},

const T=THREE, renderer=new THREE.WebGLRenderer({ canvas: document.getElementById('stage'), antialias: true, alpha: true });

function shape(g,x,y,z,sx,sy,sz,c,rx=0,ry=0,rz=0,mat=lit){

function flat(c){if(!flatMats.has(c))flatMats.set(c,grade(new T.MeshBasicMaterial({color:c,toneMapped:false,depthTest:false,depthWrite:false,side:T.DoubleSide})));return flatMats.get(c);}
const hudGeo={quad:plane};
function polygon(key,points){const sh=new T.Shape();points.forEach(([x,y],i)=>i?sh.lineTo(x,y):sh.moveTo(x,y));sh.closePath();hudGeo[key]=new T.ShapeGeometry(sh);}
polygon('shield',[[-.5,.5],[.5,.5],[.47,-.12],[0,-.55],[-.47,-.12]]);
polygon('diamond',[[0,.5],[.5,0],[0,-.5],[-.5,0]]);
polygon('pip',[[-.3,.5],[.5,.5],[.29,-.5],[-.5,-.5]]);
polygon('blade',[[0,.55],[.15,.25],[.075,-.37],[-.075,-.37],[-.15,.25]]);

function ui(g,x,y,w,h,c,ang=0){
 let m=hudPool[hi];if(!m){m=new T.Mesh();hudPool.push(m);hud.add(m);}
 m.visible=true;m.renderOrder=hi++;m.geometry=hudGeo[g];m.material=flat(c);m.position.set(x,H-y,0);m.scale.set(w,h,1);m.rotation.z=ang;
}
function digits(value,x,y,h){
 const str=String(value);
 for(let i=0;i<str.length;i++){
  let m=glyphPool[gi];if(!m){m=new T.Sprite();glyphPool.push(m);hud.add(m);}
  m.visible=true;m.renderOrder=100+gi++;m.material=glyphMats[+str[i]];m.position.set(x+h*(.25+.51*i),H-y,0);m.scale.set(h*.79,h*1.05,1);

}
const previewTypes=['grunt','runner','wisp','brute','splitter','mender'];
function drawHud(f,flash){
 hi=0;gi=0;const S=clamp(H/790,.8,1.45),x=32*S,y=29*S, waveH=Math.max(H*.124,64*S);
 const gold=0xd4b179,ivory=0xf2e7cf,edge=0x5d5547,back=0x20242b;
 // Outlined heraldic shield with crossed sabres.
 ui('shield',x+19*S,y+26*S,40*S,46*S,gold);
 ui('shield',x+19*S,y+26*S,36*S,42*S,back);
 for(const sign of [-1,1]){
  ui('blade',x+19*S,y+24*S,13*S,29*S,ivory,sign*.67);
  ui('quad',x+(19-sign*8)*S,y+34*S,9*S,2*S,gold,sign*.67);
 }
 digits(f.wave,x+49*S,y+24*S,waveH);
 const gy=y+67*S;
 ui('quad',x+46*S,gy-16*S,90*S,1*S,edge);
 ui('hex',x+9*S,gy,19*S,20*S,gold);ui('hex',x+9*S,gy,14*S,15*S,0x7f613a);
 ui('diamond',x+9*S,gy,5*S,9*S,0xf4d9a0);
 digits(f.gold,x+25*S,gy,25*S);
 let ix=x+8*S; const py=gy+29*S;
 for(let i=0;i<6;i++){
  const count=f.next.reduce((n,name)=>n+(name===previewTypes[i]),0);if(!count)continue;
  const g=['shield','tri','diamond','hex','diamond','shield'][i];
  ui(g,ix,py,13*S,15*S,pigments[i]);ui(g,ix,py,6*S,7*S,back);
  digits(count,ix+10*S,py,16*S);ix+=(String(count).length>1?48:39)*S;
 }
 const right=W-30*S,hy=y+13*S;
 ui('shield',right-164*S,hy,20*S,24*S,gold);ui('shield',right-164*S,hy,16*S,20*S,back);
 ui('quad',right-164*S,hy-1*S,8*S,9*S,ivory);
 for(let i=0;i<10;i++){
  const px=right-(9-i)*14*S;
  ui('pip',px,hy,14*S,17*S,i<f.baseHp?0xb2856d:0x504643);
  ui('pip',px,hy,10*S,13*S,i<f.baseHp?(flash?0xffd3aa:0xe99a7c):(flash?0xb85b50:0x27282d));
 }
 for(let i=hi;i<hudPool.length;i++)hudPool[i].visible=false;
 for(let i=gi;i<glyphPool.length;i++)glyphPool[i].visible=false;
}
const focus=new T.Vector3(12,.05,7),direction=new T.Vector3(.10,1.43,1).normalize(),home=new T.Vector3(),probe=new T.Vector3();
function resize(){
 W=window.innerWidth;H=window.innerHeight;
 renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
 renderer.setSize(window.innerWidth, window.innerHeight, false);
 camera.aspect=W/H;
 const lower=-1+2*(94/H),upper=.935;
 function place(distance){
  camera.position.copy(focus).addScaledVector(direction,distance);camera.lookAt(focus);camera.updateMatrixWorld();camera.updateProjectionMatrix();
 }
 let lo=8,high=450,offset=0;
 for(let n=0;n<24;n++){
  let distance=(lo+high)/2;place(distance);
  let widest=0,top=-Infinity,bottom=Infinity;
  for(const x of [-.58,24.58])for(const z of [-.58,14.58])for(const y of [-1.62,1.9]){
   probe.set(x,y,z).project(camera);widest=Math.max(widest,Math.abs(probe.x));top=Math.max(top,probe.y);bottom=Math.min(bottom,probe.y);
  }
  if(widest<=.966 && top-bottom<=upper-lower){high=distance;offset=(upper+lower-top-bottom)/2;}else lo=distance;
 }
 place(high);camera.projectionMatrix.elements[9]-=offset;camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();home.copy(camera.position);ortho.right=W;ortho.top=H;ortho.updateProjectionMatrix();
}
const fallTime=replay.fallTick<0?Infinity:replay.fallTick/20;
for(const f of frames)f.byId=new Map(f.enemies.map(e=>[e.id,e]));
const lastFrame=frames[frames.length-1];
while(frames.length<2020)frames.push(lastFrame);
const noiseTable=Array.from({length:257},()=>rand()*2-1);
function noise(t){const i=Math.floor(t),q=t-i,p=q*q*(3-2*q);return noiseTable[i&255]*(1-p)+noiseTable[(i+1)&255]*p;}
function render(time){
 const instant=time*20,k=Math.floor(instant),f=frames[k],next=frames[k+1],mix=instant-k;
 const t=Math.min(time,fallTime),fxTime=Math.min(time,fallTime+1),fallen=time>=fallTime;
 let shake=0,last=-999;
 for(const shock of shocks){if(shock.tick>k)break;shake=Math.max(0,shock.tr-(instant-shock.tick)/20);last=shock.tick;}
 camera.position.copy(home);camera.position.x+=.24*shake*shake*noise(time*16);camera.position.z+=.24*shake*shake*noise(time*16+75);camera.updateMatrixWorld();
 for(const b of dynamicBatches.values())b.count=0;
 const flash=instant-last<3 && !fallen;keep(f,flash,fallen);
 for(const s of f.slots)turret(s);
 for(const e of f.enemies){const p=next.byId.get(e.id)||e;enemy(e,(e.x+(p.x-e.x)*mix)/100,(e.y+(p.y-e.y)*mix)/100,t);}
 const endTick=Math.min(k,events.length-1);
 for(let i=Math.max(0,Math.floor(fxTime*20)-20);i<=endTick;i++)for(const ev of events[i])fx(frames[i],ev,fxTime-i/20);
 for(const b of dynamicBatches.values()){b.mesh.count=b.count;b.mesh.instanceMatrix.needsUpdate=true;if(b.mesh.instanceColor)b.mesh.instanceColor.needsUpdate=true;}
 saturation.value=fallen?Math.max(.06,1-(time-fallTime)*.94):1;
 renderer.clear();renderer.render(scene,camera);renderer.clearDepth();drawHud(f,flash);renderer.render(hud,ortho);
}
const audio=new (window.AudioContext||window.webkitAudioContext)();
audio.resume().catch(()=>{});
function unlock(){audio.resume().catch(()=>{});window.removeEventListener('pointerdown',unlock);window.removeEventListener('keydown',unlock);}
window.addEventListener('pointerdown',unlock);window.addEventListener('keydown',unlock);
const master=audio.createGain(),compressor=audio.createDynamicsCompressor();
master.gain.value=0;compressor.threshold.value=-17;compressor.knee.value=14;compressor.ratio.value=7;
master.connect(compressor);compressor.connect(audio.destination);
const soundRand=generator(4242),white=audio.createBuffer(1,audio.sampleRate*2,audio.sampleRate);
const samples=white.getChannelData(0);for(let i=0;i<samples.length;i++)samples[i]=soundRand()*2-1;
let voices=new Set(),wind=null,shotTimes=[];
function silence(){
 const now=audio.currentTime;master.gain.cancelScheduledValues(now);master.gain.setTargetAtTime(0,now,.006);
 for(const v of voices)try{v.stop(now+.025);}catch(_){}
 voices.clear();wind=null;shotTimes=[];
}
function tone(x,kind,from,to,seconds,level,offset=0){
 if(audio.state!=='running')return;
 const now=audio.currentTime+offset, gain=audio.createGain(),pan=audio.createStereoPanner();
 pan.pan.value=clamp((x-12)/14,-1,1);gain.connect(pan);pan.connect(master);
 let source,filter;
 if(kind==='noise'||kind==='wind'){
  source=audio.createBufferSource();source.buffer=white;source.loop=true;filter=audio.createBiquadFilter();
  filter.type='lowpass';filter.frequency.setValueAtTime(from,now);filter.frequency.exponentialRampToValueAtTime(to,now+seconds);source.connect(filter);filter.connect(gain);
 }else{
  source=audio.createOscillator();source.type=kind;source.frequency.setValueAtTime(from,now);source.frequency.exponentialRampToValueAtTime(to,now+seconds);source.connect(gain);
 }
 gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(level,now+Math.min(.012,seconds*.2));
 if(kind!=='wind')gain.gain.exponentialRampToValueAtTime(.0001,now+seconds);
 source.onended=()=>{voices.delete(source);source.disconnect();if(filter)filter.disconnect();gain.disconnect();pan.disconnect();};
 voices.add(source);if(kind==='noise')source.start(now,soundRand());else source.start(now);
 if(kind!=='wind')source.stop(now+seconds+.01);return source;
}
function audioStep(old,time){
 if(audio.state!=='running')return;
 const shots=[];
 for(let i=Math.floor(old*20)+1;i<=Math.min(events.length-1,Math.floor(time*20));i++){
  for(const ev of events[i]){
   const [code,a,b]=ev;
   if(code==='shot')shots.push(ev);
   else if(code==='wave'){tone(4,'triangle',184,294,.34,.12);tone(4,'sine',277,440,.43,.05);}
   else if(code==='kill')tone(a/100,'sine',220+soundRand()*55,60,.065,.045);
   else if(code==='L'){tone(23.5,'noise',2700,90,.24,.3);tone(23.5,'triangle',490,262,.36,.13);}
   else if(code==='F'){tone(23.5,'noise',1900,65,1.4,.48);tone(23.5,'sine',92,29,1.2,.27);}
  }
 }
 const priority=[1,4,0,5,3],now=audio.currentTime;
 shotTimes=shotTimes.filter(t=>now-t<1);
 shots.sort((a,b)=>priority[b[2]]-priority[a[2]]);
 for(const [,slot,k] of shots.slice(0,12-shotTimes.length)){
  shotTimes.push(now);const x=slots[slot][0],v=.95+soundRand()*.1;
  if(k===0)tone(x,'triangle',740*v,145,.075,.09);
  if(k===1){tone(x,'noise',1400*v,70,.17,.18);tone(x,'sine',133*v,42,.18,.18);}
  if(k===2)tone(x,'sine',1620*v,860,.16,.08);
  if(k===3)tone(x,'sawtooth',385*v,58,.18,.085);
  if(k===4)tone(x,'noise',3900*v,800,.09,.12);
 }
 if(time>=fallTime&&!wind)wind=tone(12,'wind',320,260,1,.027);
}
const $=id=>document.getElementById(id),countdown=$('countdown'),scrubber=$('scrubber'),toggle=$('btn-toggle');
let state='COUNTDOWN',simTime=0,playbackSpeed=1,countdownElapsed=0,holdElapsed=0,prev=null;
function enter(next){
 state=next;prev=null;const active=['PLAYING','COUNTDOWN','REFIRE_HOLD'].includes(state);
 $('icon-pause').style.display=active?'block':'none';$('icon-play').style.display=active?'none':'block';toggle.setAttribute('aria-label',active?'Pause':'Play');
 countdown.style.display=state==='COUNTDOWN'?'block':'none';countdown.textContent=state==='COUNTDOWN'?'3':'';
 if(state==='PLAYING'){const now=audio.currentTime;master.gain.cancelScheduledValues(now);master.gain.setTargetAtTime(.63,now,.008);}else silence();
}
toggle.addEventListener('click',()=>{
 if(state==='ENDED'){simTime=0;scrubber.value='0';render(0);enter('PLAYING');}
 else enter(state==='PAUSED'?'PLAYING':'PAUSED');
});
$('btn-refire').addEventListener('click',()=>{simTime=0;holdElapsed=0;scrubber.value='0';enter('REFIRE_HOLD');render(0);prev=performance.now();});
scrubber.addEventListener('input',()=>{simTime=parseFloat(scrubber.value);enter('PAUSED');render(simTime);});
for(const pill of document.querySelectorAll('.speed-pill'))pill.addEventListener('click',()=>{
 playbackSpeed=Number(pill.dataset.speed);
 for(const p of document.querySelectorAll('.speed-pill')){p.classList.toggle('is-active',p===pill);p.setAttribute('aria-checked',String(p===pill));}
});
window.addEventListener('resize',()=>{resize();render(simTime);});
function frame(now){
 const dt=prev===null?0:Math.max(0,Math.min((now-prev)/1000,.1));prev=now;
 if(state==='COUNTDOWN'){
  countdownElapsed+=dt;
  if(countdownElapsed>=3){enter('PLAYING');prev=now;}
  else countdown.textContent=String(3-Math.floor(countdownElapsed));
 }else if(state==='REFIRE_HOLD'){
  holdElapsed+=dt;if(holdElapsed>=1){enter('PLAYING');prev=now;}
 }
 if(state==='PLAYING'){
  const old=simTime;simTime=Math.min(DURATION,simTime+dt*playbackSpeed);
  scrubber.value=simTime.toFixed(3);audioStep(old,simTime);render(simTime);
  if(simTime>=DURATION)enter('ENDED');
 }
 requestAnimationFrame(frame);
}
resize();render(Math.min(65,fallTime));enter('COUNTDOWN');render(0);requestAnimationFrame(frame);
})();
