<script id="rampart-strategy">
function createStrategy() {
  const types=['bolt','cannon','frost','lance','flak'], prices=[50,90,70,120,80];
  const damages=[[26,41,65],[60,96,153],[10,16,25],[180,288,460],[40,64,102]];
  const periods=[8,24,12,36,10],ranges=[300,260,240,360,320],splash=[0,90,0,0,70];
  const preferred=[3,1,1,1,1,4,1,4,1,1,0,1,4,1,0,4];
  const utility=[.98,.71472,1.44933,.9191,.9504,.5878,.7044,1.48966,.4521,.5562,.93,.653,.3757,.2479,.49322,.65496];
  function choose(type,tier,c){
    const damage=damages[type][tier-1],rad=splash[type];
    const values=c.map(b=>{
      const hit=Math.max(1,damage-(type===3?0:b.armor));
      const urgency=1+56192.56/(7.25554+b.remaining/b.speed)**2;
      const role=b.type==='mender'?16.2146:b.type==='runner'?2.25227:1;
      return (Math.min(b.hp,hit)/damage+(b.hp<=hit?.27659:0))*urgency*role*(type===2&&b.slowed>.5?.19:1);
    });
    let best=-1,winner=c[0];
    for(let i=0;i<c.length;i++){
      const a=c[i];let value=values[i];
      if(rad)for(let j=0;j<c.length;j++){
        if(i===j)continue;
        const b=c[j],dx=a.x-b.x,dy=a.y-b.y;
        if(dx*dx+dy*dy<=rad*rad)value+=values[j];
      }
      value+=.04/(1+a.remaining/100);
      if(value>best){best=value;winner=a;}
    }

  }
  // Forecast only the final approach. Unobserved cooldowns start at half a period.
  function forecast(slots,incoming,changed){
    const units=incoming.map(e=>({...e,slowed:e.slowed?12:0}));
    const guns=slots.filter(t=>t.slot>=10&&t.slot<=14&&t.tier).map(t=>({...t,cd:t.slot===changed?0:Math.floor(periods[t.i]/2)}));
    let loss=0;
    for(let tick=0;tick<100;tick++){
      for(const e of units){
        if(e.hp<=0)continue;
        e.remaining-=e.slowed?Math.floor(e.speed*.6):e.speed;
        if(e.remaining<=0){loss+=e.type==='brute'?3:e.type==='wisp'||e.type==='mender'||e.type==='splitter'?2:1;e.hp=0;continue;}
        const leg=e.air?200:500,corner=e.air?2150:1850,vertical=e.air?500:800;
        if(e.remaining<=leg){e.x=2350-e.remaining;e.y=1150;}
        else if(e.remaining<=leg+vertical){e.x=corner;e.y=1150-(e.remaining-leg);}
        else{e.y=1150-vertical;e.x=corner-(e.remaining-leg-vertical);}
      }
      for(const g of guns){
        if(--g.cd>0)continue;
        const hits=e=>e.hp>0&&(e.air?g.i!==1&&g.i!==3:g.i!==4);
        const r=ranges[g.i]+30*(g.tier-1);
        const c=units.filter(e=>hits(e)&&(e.x-g.x)**2+(e.y-g.y)**2<=r*r);
        if(!c.length)continue;
        const a=choose(g.i,g.tier,c),d=damages[g.i][g.tier-1];
        for(const b of splash[g.i]?units:[a]){
          if(!hits(b)||(b.x-a.x)**2+(b.y-a.y)**2>splash[g.i]**2)continue;
          b.hp-=Math.max(1,d-(g.i===3?0:b.armor));if(g.i===2)b.slowed=30;
        }
        g.cd=periods[g.i];
      }
      for(const e of units)if(e.slowed)e.slowed--;
    }
    for(const e of units)if(e.hp>0)loss+=.45*(e.hp/e.maxHp)/(1+e.remaining/250);
    return loss;
  }
  return {
    plan(s){
      let gold=s.gold;
      const actions=[],slots=s.slots.map(({slot,x,y,turret:t})=>({slot,x,y,i:t?types.indexOf(t.type):preferred[slot],tier:t?t.tier:0,spent:t?t.spent:0}));
      while(actions.length<28){
        let slot=-1,best=0;
        for(const t of slots){
          if(t.tier===3||t.i===4&&s.wave<3)continue;
          const value=utility[t.slot]*[1,.85,.62005][t.tier];
          if(value>best){best=value;slot=t.slot;}
        }
        if(slot<0)break;
        const t=slots[slot],price=prices[t.i]*(t.tier===2?2:1);
        if(price>gold)break;
        actions.push(t.tier?{op:'upgrade',slot}:{op:'build',slot,type:types[t.i]});
        t.spent+=price;t.tier++;gold-=price;
      }
      if(s.wave>=34){
        const incoming=s.enemies.filter(e=>e.remaining<(e.air?1400:1580));
        if(incoming.some(e=>e.remaining/e.speed<85)){
          let best=forecast(slots,incoming,-1),change=null;
          if(best>.45)for(const slot of [12,13,14]){
            const old=slots[slot],funds=gold+Math.floor(old.spent*7/10);
            for(let i=0;i<5;i++){
              if(funds<prices[i]||old.i===i)continue;
              const tier=funds>=4*prices[i]?3:funds>=2*prices[i]?2:1;
              slots[slot]={...old,i,tier};
              const loss=forecast(slots,incoming,slot)+.35;
              if(loss<best){best=loss;change={slot,i,tier,sell:old.tier>0};}
            }
            slots[slot]=old;
          }
          if(change){
            const {slot,i,tier,sell}=change;
            if(sell)actions.push({op:'sell',slot});
            actions.push({op:'build',slot,type:types[i]});
            for(let n=1;n<tier;n++)actions.push({op:'upgrade',slot});
          }
        }
      }
      return actions;
    },
    target(t,c){return choose(types.indexOf(t.type),t.tier,c).id;}
  };
}

<script id="rampart-sim">
function rampartSimulate(createStrategy,seed,maxTicks) {
  const recorder=arguments[3],strategy=createStrategy(),log=[];
  const slots=[[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],[14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]].map(([x,y],slot)=>({slot,x:x*100+50,y:y*100+50,turret:null}));
  const ground=[[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]],air=[[0,6],[21,6],[21,11],[23,11]];
  const towers=['bolt','cannon','frost','lance','flak'],cost=[50,90,70,120,80],damage=[26,60,10,180,40],period=[8,24,12,36,10],range=[300,260,240,360,320],splash=[0,90,0,0,70];
  const names=['grunt','runner','wisp','brute','splitter','mender','splitling'],hp=[60,40,50,150,90,70],speed=[10,20,12,6,8,8,12],bounty=[4,4,6,9,6,7,1],leak=[1,1,2,3,2,2,1],first=[1,2,3,4,6,8],weight=[10,4,3,3,2,1];
  const floor=Math.floor;
  function draw(){seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^(seed>>>15),1|seed);t=(t+Math.imul(t^(t>>>7),61|t))^t;return(t^(t>>>14))>>>0;}
  function waveList(w){let sum=0;for(let i=0;i<6;i++)if(first[i]<=w)sum+=weight[i];return Array.from({length:4+floor(3*w/5)},()=>{let r=draw()%sum,i=0;while(r>=weight[i])r-=weight[i++];return i;});}
  let next=waveList(1),wave=0,gold=250,baseHp=10,tick=0,fallTick=-1,serial=0,enemies=[],queue=[],scale=1000;
  function emit(kind,...args){if(recorder)recorder.event(tick,kind,...args);}
  function position(e){
    let d=e.progress,p=e.air?air:ground;
    for(let i=1;i<p.length;i++){
      const [x,y]=p[i-1],dx=p[i][0]-x,dy=p[i][1]-y,len=(Math.abs(dx)+Math.abs(dy))*100;
      if(d<=len){e.x=x*100+50+Math.sign(dx)*d;e.y=y*100+50+Math.sign(dy)*d;e.dir=Math.atan2(dx,dy);return;}d-=len;
    }
  }
  function spawn(i,w,maxHp,progress=0){
    const flyer=+(i===2),e={id:++serial,type:names[i],i,w,hp:maxHp,maxHp,x:0,y:0,air:flyer,armor:i===0?floor(w/4):i===3?6+w:0,speed:speed[i],slowed:0,remaining:(flyer?2800:4600)-progress,progress,age:0};
    position(e);enemies.push(e);
  }
  function view(e){const {id,type,hp,maxHp,x,y,air,armor,speed,slowed,remaining}=e;return {id,type,hp,maxHp,x,y,air,armor,speed,slowed,remaining};}

  function record(){if(recorder)recorder.frame(tick,wave,gold,baseHp,next,slots,enemies);}
  for(;tick<maxTicks;tick++){
    if(tick>=20&&(tick-20)%40===0){
      wave++;if(wave>1)scale=floor(scale*108/100);
      gold+=Math.min(50,floor(gold*5/100))+10+2*wave;
      const current=next;next=waveList(wave+1);
      const state={tick,wave,gold,baseHp,slots:slots.map(({slot,x,y,turret:t})=>({slot,x,y,turret:t?{type:t.type,tier:t.tier,spent:t.spent}:null})),enemies:enemies.map(view),nextWave:next.map(i=>names[i])};
      emit('wave');
      for(const a of (strategy.plan(state)||[]).slice(0,32)){
        if(!a||!Number.isInteger(a.slot)||!slots[a.slot])continue;
        const sl=slots[a.slot],t=sl.turret,i=towers.indexOf(a.type);
        if(a.op==='build'&&!t&&i>=0&&gold>=cost[i]){
          gold-=cost[i];sl.turret={i,type:a.type,tier:1,spent:cost[i],cd:0};log.push([tick,'B',sl.slot,i]);emit('build',sl.slot);
        }else if(a.op==='upgrade'&&t&&t.tier<3&&gold>=cost[t.i]*t.tier){
          const price=cost[t.i]*t.tier;gold-=price;t.spent+=price;t.tier++;log.push([tick,'U',sl.slot,t.tier]);emit('upgrade',sl.slot);
        }else if(a.op==='sell'&&t){gold+=floor(t.spent*7/10);sl.turret=null;log.push([tick,'S',sl.slot,0]);emit('sell',sl.slot);}

      const step=e.slowed?floor(e.speed*60/100):e.speed;e.progress+=step;e.remaining-=step;

    }

    for(const e of enemies){e.age++;if(e.i===5&&e.age%20===0){for(const b of enemies)if(near(e,b,150))b.hp=Math.min(b.maxHp,b.hp+floor(b.maxHp*8/100));emit('heal',e.x,e.y);}}

      const t=sl.turret;if(!t||(t.cd>0&&--t.cd>0))continue;

      const target=candidates.find(e=>e.id===id)||candidates.reduce((a,b)=>a.remaining<=b.remaining?a:b);
      let dmg=damage[i];for(let j=1;j<t.tier;j++)dmg=floor(dmg*16/10);
      emit('shot',sl.slot,i,target.x,target.y,target.air);t.cd=period[i];
      for(const b of splash[i]?enemies:[target]){
        if(splash[i]&&(!can(b)||!near(target,b,splash[i])))continue;
        b.hp-=Math.max(1,dmg-(i===3?0:b.armor));if(i===2)b.slowed=30;
      }
      const dead=enemies.filter(e=>e.hp<=0);
      if(dead.length)enemies=enemies.filter(e=>e.hp>0);
      for(const e of dead){gold+=bounty[e.i];log.push([tick,'K',e.id,sl.slot]);emit('kill',e.x,e.y,e.i,e.id);if(e.i===4)for(let n=0;n<3;n++)spawn(6,e.w,Math.max(1,floor(e.maxHp/4)),e.progress);}
    }

  }

  return {score:Math.round((tick-20)/40*100)/100,fallTick,log,hash:(hash>>>0).toString(16).padStart(8,'0')};
}

const baseCam=new T.Vector3(),focus=new T.Vector3(12,.08,7),direction=new T.Vector3(.105,1.43,1).normalize();

function noise(t,n){const i=Math.floor(t),a=t-i,s=a*a*(3-2*a),sample=j=>Math.sin(j*127.1+n*311.7+42)*43758.5453%1;return sample(i)*(1-s)+sample(i+1)*s;}

const Audio=window.AudioContext||window.webkitAudioContext,ac=new Audio(),master=ac.createGain(),compressor=ac.createDynamicsCompressor(),voices=new Set();

const audioRand=rng(4242),buffer=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),samples=buffer.getChannelData(0);

let wind=null,shotTimes=[];
function voice(kind,x,pitch,end,length,level,delay=0){
 const now=ac.currentTime+delay,pan=ac.createStereoPanner(),env=ac.createGain(),filter=ac.createBiquadFilter();
 const src=kind==='noise'?ac.createBufferSource():ac.createOscillator();
 if(kind==='noise'){src.buffer=buffer;filter.type='lowpass';filter.frequency.setValueAtTime(pitch,now);filter.frequency.exponentialRampToValueAtTime(end,now+length);}
 else{src.type=kind;src.frequency.setValueAtTime(pitch,now);src.frequency.exponentialRampToValueAtTime(end,now+length);}
 pan.pan.value=Math.max(-1,Math.min(1,(x-12)/12));env.gain.setValueAtTime(.00001,now);env.gain.exponentialRampToValueAtTime(level,now+.005);env.gain.exponentialRampToValueAtTime(.00001,now+length);
 if(kind==='noise'){src.connect(filter);filter.connect(env);}else src.connect(env);
 env.connect(pan);pan.connect(master);voices.add(src);src.onended=()=>{voices.delete(src);src.disconnect();filter.disconnect();env.disconnect();pan.disconnect();};src.start(now);src.stop(now+length+.01);
}
function hush(){
 let t=ac.currentTime;master.gain.cancelScheduledValues(t);master.gain.setTargetAtTime(0,t,.007);for(const src of voices)try{src.stop(t+.035);}catch{}if(wind){wind.stop(t+.035);wind=null;}shotTimes=[];
}
function openAudio(){master.gain.cancelScheduledValues(ac.currentTime);master.gain.setTargetAtTime(.52,ac.currentTime,.009);}
function startWind(){if(wind)return;const src=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();src.buffer=buffer;src.loop=true;f.frequency.value=155;g.gain.value=.065;src.connect(f);f.connect(g);g.connect(master);src.onended=()=>{src.disconnect();f.disconnect();g.disconnect();};src.start();wind=src;}
function sounds(from,to){
 if(ac.state!=='running')return;

  if(k==='wave'){voice('triangle',2,146.83,220,.31,.13);voice('sine',2,220,293.66,.32,.08,.11);}
  if(k==='leak'){voice('noise',23.5,1800,120,.18,.32);voice('triangle',23.5,550,330,.26,.16);}
  if(k==='fall'){voice('noise',23.5,800,42,.85,.52);voice('sine',23.5,93,28,1.3,.4);}
 }
 if(to>=fall)startWind();

const byId=id=>document.getElementById(id),scrubber=byId('scrubber'),countdown=byId('countdown'),toggle=byId('btn-toggle');
let state='COUNTDOWN',simTime=0,playbackSpeed=1,countdownElapsed=0,holdElapsed=0,last=null;
function setState(s){state=s;const active=s!=='PAUSED'&&s!=='ENDED';byId('icon-pause').style.display=active?'block':'none';byId('icon-play').style.display=active?'none':'block';toggle.setAttribute('aria-label',active?'Pause':'Play');
 if(s!=='COUNTDOWN'){countdown.style.display='none';countdown.textContent='';}
 if(s==='PLAYING')openAudio();else hush();

function loop(ms){

 if(state==='COUNTDOWN'){countdownElapsed+=dt;if(countdownElapsed>=3)setState('PLAYING');else{countdown.style.display='block';countdown.textContent=String(3-Math.floor(countdownElapsed));}}
 else if(state==='REFIRE_HOLD'){holdElapsed+=dt;if(holdElapsed>=1)setState('PLAYING');}

}
