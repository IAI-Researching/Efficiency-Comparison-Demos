<script id="rampart-strategy">
function createStrategy(){
  const sequence=[0,1,3,10,0,1,11,2,3,4,15,7,7,2,11,14,4,9,5,2,10,15,0,1,3,6,11,12,12,6,8,4,7,12,6,9,8,8,13,13,10,9,14,13,14,5,15,5];
  const types=["cannon","bolt","cannon","cannon","cannon","cannon","cannon","cannon","flak","cannon","flak","cannon","bolt","cannon","flak","flak"];
  const costs={cannon:90,bolt:50,flak:80,frost:70,lance:120};
  let defendKeep=false;
  function reinforce(state){
    const actions=[],slots=state.slots.map(s=>s.turret&&{...s.turret});
    let gold=state.gold;
    function sell(slot){
      const t=slots[slot];
      if(t){gold+=Math.floor(t.spent*7/10);slots[slot]=null;actions.push({op:'sell',slot});}
    }
    for(const slot of [0,1,15,2])sell(slot);
    for(const [slot,type] of [[13,"cannon"],[9,"cannon"],[14,"bolt"],[11,"flak"],[10,"lance"],[8,"lance"],[12,"flak"]]){
      let t=slots[slot];
      if(t&&t.type!==type){sell(slot);t=null;}
      if(!t){
        if(gold<costs[type])break;
        gold-=costs[type];actions.push({op:'build',slot,type});slots[slot]=t={type,tier:1};
      }
      while(t.tier<3){
        const price=costs[type]*t.tier;
        if(gold<price)return actions;
        gold-=price;t.tier++;actions.push({op:'upgrade',slot});
      }
    }
    return actions;
  }
  return {
    plan(s){
      if(s.wave>=44&&s.enemies.some(e=>e.remaining<=(e.air?125:1026)))defendKeep=true;
      if(defendKeep)return reinforce(s);
      const actions=[],tier=s.slots.map(slot=>slot.turret?slot.turret.tier:0),desired=Array(16).fill(0);
      const reserve=Math.max(0,Math.min(182,(s.wave-2)*72,(23-s.wave)*144));
      let gold=s.gold-reserve;
      for(const slot of sequence){
        const level=++desired[slot],type=types[slot];
        if(tier[slot]>=level)continue;
        const cost=costs[type]*Math.max(1,level-1);
        if(cost>gold)break;
        gold-=cost;tier[slot]=level;
        actions.push(level===1?{op:'build',slot,type}:{op:'upgrade',slot});
      }
      return actions;
    },
    target(t,c){
      const splash=t.type==='cannon'?8100:t.type==='flak'?4900:0;
      const baseDamage={bolt:26,cannon:60,flak:40,lance:180,frost:10}[t.type];
      let power=baseDamage;
      for(let tier=1;tier<t.tier;tier++)power=Math.floor(power*16/10);
      const weights=c.map(e=>{
        const damage=Math.max(1,power-(t.type==='lance'?0:e.armor));
        const urgency=1+3.72*(1-e.remaining/(e.air?2800:4600))**2;
        const priority=e.type==='mender'?4.02:e.type==='runner'?2.17:e.air?1.41:1;
        return urgency*priority*(0.54+Math.min(1,e.hp/damage))*(1+1.04*damage/Math.max(damage,e.hp));
      });
      let best=-Infinity,answer=c[0].id;
      for(let i=0;i<c.length;i++){
        const e=c[i];let value=weights[i]+.0001*(1-e.remaining/4600);
        if(splash)for(let j=0;j<c.length;j++){
          if(i===j)continue;
          const dx=e.x-c[j].x,dy=e.y-c[j].y;
          if(dx*dx+dy*dy<=splash)value+=weights[j];
        }
        if(value>best){best=value;answer=e.id;}
      }
      return answer;
    }
  };
}
</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy,seed,maxTicks){

  const types=['bolt','cannon','frost','lance','flak'],cost=[50,90,70,120,80],damage=[26,60,10,180,40],period=[8,24,12,36,10],range=[300,260,240,360,320],splash=[0,90,0,0,70];
  const species=['grunt','runner','wisp','brute','splitter','mender','splitling'],hp=[60,40,50,150,90,70],spd=[10,20,12,6,8,8,12],bounty=[4,4,6,9,6,7,1],leak=[1,1,2,3,2,2,1],first=[1,2,3,4,6,8],weight=[10,4,3,3,2,1];

    a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);

  let enemies=[],gold=250,baseHp=10,wave=0,id=0,tick=0,fallTick=-1,events=[];
  function generate(w){
    const total=weight.reduce((n,a,i)=>n+(first[i]<=w?a:0),0);
    return Array.from({length:4+floor(3*w/5)},()=>{
      let r=draw()%total,i=0;while(r>=weight[i])r-=weight[i++];return i;
    });
  }
  let next=generate(1);
  function locate(e){
    let d=e.progress,p=e.air?air:ground;
    for(let i=1;i<p.length;i++){
      const [x,y]=p[i-1],dx=p[i][0]-x,dy=p[i][1]-y,n=100*(Math.abs(dx)+Math.abs(dy));
      if(d<=n){e.x=x*100+50+Math.sign(dx)*d;e.y=y*100+50+Math.sign(dy)*d;break;}
      d-=n;
    }

  }
  function spawn(i,w,progress=0,maxHp=floor(hp[i]*mult[w]/1000)){
    const e={id:++id,i,w,type:species[i],hp:maxHp,maxHp,progress,air:+(i===2),armor:i===3?6+w:i===0?floor(w/4):0,speed:spd[i],slowed:0,age:0};
    locate(e);enemies.push(e);
  }
  function view(e){const {id,type,hp,maxHp,x,y,air,armor,speed,slowed,remaining}=e;return {id,type,hp,maxHp,x,y,air,armor,speed,slowed,remaining};}
  function snapshot(){if(record)record(tick,{enemies:enemies.map(view),slots:slotView(),wave,baseHp,gold,nextWave:next.map(i=>species[i]),events});}
  function slotView(){return slots.map(({slot,x,y,turret:t})=>({slot,x,y,turret:t?{type:t.type,spent:t.spent,tier:t.tier}:null}));}
  function update(t){t.range=range[t.i]+30*(t.tier-1);t.damage=damage[t.i];for(let j=1;j<t.tier;j++)t.damage=floor(t.damage*16/10);}

    if(record)events=[];

      wave++;gold+=Math.min(50,floor(gold*5/100))+10+2*wave;
      const now=next;next=generate(wave+1);mult[wave+1]=floor(mult[wave]*108/100);
      if(record)events.push({kind:'wave',x:0,y:2.5});
      const actions=strategy.plan({tick,wave,gold,baseHp,slots:slotView(),enemies:enemies.map(view),nextWave:next.map(i=>species[i])});
      for(const a of (Array.isArray(actions)?actions:[]).slice(0,32)){

        if(a.op==='build'&&!t&&i>=0&&gold>=cost[i]){
          s.turret={type:a.type,i,tier:1,spent:cost[i],cd:0};gold-=cost[i];update(s.turret);code='B';b=i;
        }else if(a.op==='upgrade'&&t&&t.tier<3&&gold>=cost[t.i]*t.tier){
          const price=cost[t.i]*t.tier;gold-=price;t.spent+=price;t.tier++;update(t);code='U';b=t.tier;
        }else if(a.op==='sell'&&t){gold+=floor(7*t.spent/10);s.turret=null;code='S';}
        if(code){log.push([tick,code,s.slot,b]);if(record)events.push({kind:code,x:s.x/100,y:s.y/100});}
      }
      now.forEach((v,i)=>{const when=tick+4*i;if(!queue.has(when))queue.set(when,[]);queue.get(when).push([v,wave]);});

      const target=candidates.find(e=>e.id===chosen)||candidates.reduce((a,b)=>a.remaining<=b.remaining?a:b);

      if(record)events.push({kind:'shot',type:t.type,slot:s.slot,x:s.x/100,y:s.y/100,tx:target.x/100,ty:target.y/100,air:target.air});

      }
      const dead=enemies.filter(e=>e.hp<=0);
      if(dead.length){
        enemies=enemies.filter(e=>e.hp>0);
        for(const e of dead){
          gold+=bounty[e.i];log.push([tick,'K',e.id,s.slot]);
          if(record)events.push({kind:'kill',id:e.id,type:e.type,x:e.x/100,y:e.y/100,air:e.air});
          if(e.i===4)for(let n=0;n<3;n++)spawn(6,e.w,e.progress,Math.max(1,floor(e.maxHp/4)));
        }
      }
    }
    for(const e of enemies)if(e.slowed>0)e.slowed--;

  }
  let hash=0x811c9dc5;const json=JSON.stringify(log);for(let i=0;i<json.length;i++)hash=Math.imul(hash^json.charCodeAt(i),0x01000193);
  return {score:Math.round((tick-20)*2.5)/100,fallTick,log,hash:(hash>>>0).toString(16).padStart(8,'0')};
}
</script>

function graphic(g,x,y,w,h,c,rot=0,texture=false){

function hudDraw(s,time){
 hc=0;const scale=clamp(innerHeight/670,.92,1.7),left=26*scale,top=22*scale;

 rect(66,49,134,98,line);rect(66,49,132,96,ink);rect(1,31,2,60,amber);

 for(const dir of [-1,1]){rect(25,32,2.8,21,ivory,dir*.67);rect(25+dir*5,38,7,1.9,amber,dir*.67);}
 number(String(s.wave).padStart(2,'0'),61,36,84,ivory);
 rect(66,63,109,.9,line);circle(25,80,16,amber);circle(25,80,11.7,'#6b5639');rect(25,80,5,5,amber,Math.PI/4);
 number(s.gold,48,79,32,'#eed4a0');
 const counts={};for(const v of s.nextWave)counts[v]=(counts[v]||0)+1;
 let pos=0;for(const type of Object.keys(enemyColors).filter(k=>counts[k])){

   if(type==='grunt'||type==='mender')circle(x,115,10,enemyColors[type]);else rect(x,115,type==='runner'?6:9,type==='wisp'?12:9,enemyColors[type],angle);
   if(type==='mender')rect(x,115,4,4,'#72c48a',Math.PI/4);
   number(counts[type],x+15,114,23,'#dddcd2');pos++;
 }
 const right=(x,y,w,h,c,a=0)=>graphic(plane,innerWidth-(26+x)*scale,top+y*scale,w*scale,h*scale,c,a);
 right(96,15,194,31,line);right(96,15,192,29,ink);
 right(177,15,11,11,amber,Math.PI/4);right(177,15,5,5,ink,Math.PI/4);
 for(let i=0;i<10;i++){
   const x=154-i*15.3;right(x,15,9,14,i<s.baseHp?'#e4be87':time-s.leakTime<.22?'#e86a52':'#41484a',-.16);
   if(i<s.baseHp)right(x-.5,11,7,3,'#fff0b6',-.16);
 }
 for(let i=hc;i<hudPool.length;i++)hudPool[i].visible=false;
}
let centre=new T.Vector3(12,0,7),rest=new T.Vector3(),look=new T.Vector3(),simTime=0;
function resize(){
 const W=innerWidth,H=innerHeight;renderer.setSize(W,H,false);camera.aspect=W/H;camera.setViewOffset(W,H,0,Math.min(56,H*.083),W,H);
 const dir=new T.Vector3(.145,1.52,1).normalize(),v=new T.Vector3();
 let dist=20;
 for(;dist<240;dist+=.24){
   camera.position.copy(centre).addScaledVector(dir,dist);camera.lookAt(centre);camera.updateMatrixWorld();
   let fits=true;for(const x of [-.8,25])for(const z of [-.55,14.55])for(const y of [-1.10,1.3]){
     v.set(x,y,z).project(camera);if(Math.abs(v.x)>.94||v.y>1-16/H||v.y< -1+188/H)fits=false;
   }if(fits)break;
 }
 rest.copy(camera.position);ortho.right=W;ortho.top=H;ortho.updateProjectionMatrix();
}
const noiseKey=rng(42),shakeNoise=Array.from({length:256},()=>noiseKey()*2-1);
function noise(t,k){const v=t*13+k,n=Math.floor(v),f=v-n;return mix(shakeNoise[n&255],shakeNoise[(n+1)&255],f*f*(3-2*f));}
function render(time){
 const end=frames.length-1,raw=time*20,k=Math.min(end,Math.floor(raw)),f=k===end?0:raw-k,s=frames[k],next=frames[Math.min(end,k+1)];
 const afterFall=result.fallTick<0?0:Math.max(0,time-result.fallTick/20),worldTime=time-afterFall;
 for(const b of moving.values())b.n=0;
 for(const slot of s.slots)turret(slot,s.aims[slot.slot],.13*clamp(1-(worldTime-s.lastShot[slot.slot])/.14));
 for(const e of s.enemies)enemy(e,next.byId.get(e.id)||e,f,worldTime);
 keep(s,worldTime,afterFall);
 const fxTime=worldTime+Math.min(1,afterFall);
 for(let j=Math.max(0,k-20);j<=k;j++)for(const e of frames[j].events)effect(e,fxTime-j/20);
 for(const b of moving.values()){b.mesh.count=b.n;if(b.n){b.mesh.instanceMatrix.updateRange.count=b.n*16;b.mesh.instanceColor.updateRange.count=b.n*3;b.mesh.instanceMatrix.needsUpdate=true;b.mesh.instanceColor.needsUpdate=true;}}
 const tr=Math.max(0,s.trauma-(time-k/20)),shake=tr*tr*.25,dx=noise(time,31)*shake,dz=noise(time,103)*shake;
 camera.position.copy(rest);camera.position.x+=dx;camera.position.z+=dz;look.copy(centre);look.x+=dx;look.z+=dz;camera.lookAt(look);
 renderer.domElement.style.filter=afterFall?'grayscale('+(.95*clamp(afterFall))+')':'none';
 hudDraw(s,worldTime);renderer.clear();renderer.render(scene,camera);renderer.clearDepth();renderer.render(hud,ortho);
}
/* All voices share one controlled output path. */
const ac=new (window.AudioContext||window.webkitAudioContext)(),master=ac.createGain(),limiter=ac.createDynamicsCompressor();
limiter.threshold.value=-18;limiter.ratio.value=8;master.gain.value=0;master.connect(limiter);limiter.connect(ac.destination);
const resume=()=>ac.resume().catch(()=>{});resume();addEventListener('pointerdown',resume,{once:true});addEventListener('keydown',resume,{once:true});
const voices=new Set(),ar=rng(4242),noiseBuffer=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);
const samples=noiseBuffer.getChannelData(0);let last=0;for(let i=0;i<samples.length;i++){last=.66*last+.34*(ar()*2-1);samples[i]=last;}
let wind=null,shotTimes=[];
function voice(x,type,f0,f1,len,volume,delay=0,loop=false){
 if(ac.state!=='running')return;
 const start=ac.currentTime+delay,env=ac.createGain(),pan=ac.createStereoPanner(),filter=ac.createBiquadFilter();
 const source=type==='noise'?ac.createBufferSource():ac.createOscillator();
 if(type==='noise'){source.buffer=noiseBuffer;source.loop=loop;filter.type='lowpass';filter.frequency.setValueAtTime(f0,start);filter.frequency.exponentialRampToValueAtTime(f1,start+len);}
 else{source.type=type;source.frequency.setValueAtTime(f0,start);source.frequency.exponentialRampToValueAtTime(f1,start+len);filter.frequency.value=3500;}
 pan.pan.value=clamp(x/12-1,-1,1)*.85;
 env.gain.setValueAtTime(.0001,start);env.gain.exponentialRampToValueAtTime(volume,start+(loop?.35:.009));if(!loop)env.gain.exponentialRampToValueAtTime(.0001,start+len);
 source.connect(filter);filter.connect(env);env.connect(pan);pan.connect(master);voices.add(source);
 source.onended=()=>{voices.delete(source);source.disconnect();filter.disconnect();env.disconnect();pan.disconnect();};
 source.start(start);if(!loop)source.stop(start+len+.01);return source;
}
function gate(play){
 const now=ac.currentTime;master.gain.cancelScheduledValues(now);master.gain.setValueAtTime(master.gain.value,now);master.gain.linearRampToValueAtTime(play?.57:0,now+.028);
 if(!play){for(const v of voices){try{v.stop(now+.032);}catch{}}wind=null;shotTimes=[];}
}
const shotSound={cannon:['noise',1300,74,.19,.4],bolt:['triangle',790,190,.09,.13],flak:['square',300,78,.07,.082],frost:['sine',1600,770,.14,.14],lance:['sawtooth',520,58,.16,.17]};
function sound(a,b){
 const shots=[];
 for(let j=Math.floor(a*20)+1;j<=Math.min(frames.length-1,Math.floor(b*20));j++)for(const e of frames[j].events){
   if(e.kind==='shot')shots.push(e);
   else if(e.kind==='wave'){voice(6,'triangle',164,246,.29,.16);voice(6,'triangle',246,329,.34,.12,.12);}
   else if(e.kind==='kill')voice(e.x,'sine',180+ar()*80,55,.065,.07);
   else if(e.kind==='leak'){voice(e.x,'noise',1700,110,.3,.53);voice(e.x,'triangle',370,210,.39,.24);}
   else if(e.kind==='fall'){voice(e.x,'noise',1900,52,.94,.7);voice(e.x,'sine',90,26,1.16,.46);}
 }
 const now=ac.currentTime;shotTimes=shotTimes.filter(t=>now-t<1);
 const pr={cannon:5,lance:4,flak:3,bolt:2,frost:1};shots.sort((a,b)=>pr[b.type]-pr[a.type]);
 for(const e of shots){if(shotTimes.length>=12)break;voice(e.x,...shotSound[e.type]);shotTimes.push(now);}
 if(result.fallTick>=0&&b>result.fallTick/20&&!wind)wind=voice(12,'noise',240,170,.6,.07,0,true);
}
const $=id=>document.getElementById(id),slider=$('scrubber'),count=$('countdown'),toggle=$('btn-toggle');
let state='COUNTDOWN',countdownElapsed=0,holdElapsed=0,playbackSpeed=1,prev=null;
function setState(v){
 state=v;const paused=v==='PAUSED'||v==='ENDED';toggle.setAttribute('aria-label',paused?'Play':'Pause');$('icon-pause').style.display=paused?'none':'block';$('icon-play').style.display=paused?'block':'none';
 count.style.display=v==='COUNTDOWN'?'block':'none';count.textContent=v==='COUNTDOWN'?'3':'';gate(v==='PLAYING');
}
toggle.onclick=()=>{
 if(state==='ENDED'){simTime=0;slider.value='0';render(0);setState('PLAYING');}
 else setState(state==='PAUSED'?'PLAYING':'PAUSED');
 prev=performance.now();
};
$('btn-refire').onclick=()=>{simTime=0;holdElapsed=0;slider.value='0';setState('REFIRE_HOLD');render(0);prev=performance.now();};
for(const btn of document.querySelectorAll('.speed-pill'))btn.onclick=()=>{
 playbackSpeed=+btn.dataset.speed;for(const other of document.querySelectorAll('.speed-pill')){other.classList.toggle('is-active',other===btn);other.setAttribute('aria-checked',String(other===btn));}
};
slider.oninput=()=>{simTime=parseFloat(slider.value);setState('PAUSED');render(simTime);};
slider.onpointerdown=()=>{if(state==='PLAYING')setState('PAUSED');};
addEventListener('resize',()=>{resize();render(simTime);});
resize();setState('COUNTDOWN');render(0);
function frame(ts){
 const dt=prev===null?0:clamp((ts-prev)/1000,0,.1);prev=ts;
 if(state==='COUNTDOWN'){
   countdownElapsed+=dt;
   if(countdownElapsed+1e-9>=3)setState('PLAYING');else count.textContent=String(3-Math.floor(countdownElapsed+1e-9));
 }else if(state==='REFIRE_HOLD'){
   holdElapsed+=dt;if(holdElapsed+1e-9>=1)setState('PLAYING');
 }
 if(state==='PLAYING'){
   const past=simTime;simTime=Math.min(DURATION,simTime+dt*playbackSpeed);sound(past,simTime);slider.value=simTime.toFixed(3);render(simTime);
   if(simTime>=DURATION)setState('ENDED');
 }
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
