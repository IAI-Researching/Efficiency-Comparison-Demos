<script id="rampart-strategy">
function createStrategy(){
  const order=[4,12,10,6,14,15,8,3,7,11,9,5,2,1,13,0];
  const guns=['bolt','cannon','cannon','cannon','bolt','flak','cannon','bolt','cannon','cannon','cannon','cannon','bolt','flak','cannon','bolt'];
  return {
    plan(s){
      let gold=s.gold; const actions=[];
      const costs={cannon:90,bolt:50,flak:80};
      const options=[];
      order.forEach((slot,i)=>{
        const t=s.slots[slot].turret,type=guns[i],tier=t?t.tier:0;
        if(tier<3)options.push({slot,type,tier,cost:costs[type]*Math.max(1,tier),priority:i*(tier?0.65:1)+[0,3,7][tier]});
      });
      options.sort((a,b)=>a.priority-b.priority);
      for(const o of options)if(gold>=o.cost){actions.push({op:o.tier?'upgrade':'build',slot:o.slot,type:o.type});gold-=o.cost;}
      return actions;
    },
    target(t,c){
      const splash=t.type==='cannon'?90:t.type==='flak'?70:0;
      let best=-Infinity,id=0;
      for(const e of c){
        let value=0;
        if(splash)for(const n of c)if((e.x-n.x)**2+(e.y-n.y)**2<=splash*splash)value+=1+(n.type==='mender'?0.7:0);
        const rank=value*(1+0.35*(1-e.remaining/4600))+0.40754*(1-e.remaining/4600)+(e.air&&t.type==='bolt'?4:0)-0.00001*e.hp;
        if(rank>best){best=rank;id=e.id;}
      }return id;
    }
  };
}
</script>

        else if(a.op==='sell'&&t){gold+=floor(t.spent*7/10);s.turret=null;log.push([tick,'S',s.slot,0]);}else continue;
        fx(a.op,s.x,s.y);
      }
      current.forEach((i,j)=>{const due=tick+j*4;if(!queue.has(due))queue.set(due,[]);queue.get(due).push([i,wave]);});

      for(const e of radius[i]?enemies.filter(e=>domain(e)&&dist(e,target)<=radius[i]**2):[target]){
        e.hp-=Math.max(1,t.d-(i===3?0:e.armor));if(i===2)e.slowed=30;
      }t.cd=period[i];
      const dead=enemies.filter(e=>e.hp<=0);
      if(dead.length){enemies=enemies.filter(e=>e.hp>0);for(const e of dead){gold+=bounty[e.i];log.push([tick,'K',e.id,s.slot]);fx('kill',e.x,e.y,{type:e.type,air:e.air});if(e.i===4)for(let j=0;j<3;j++)spawn(6,e.wave,e.progress,Math.max(1,floor(e.maxHp/4)));}}
    }
    for(const e of enemies)if(e.slowed)e.slowed--;

  }
  let h=0x811c9dc5;const str=JSON.stringify(log);for(let j=0;j<str.length;j++)h=Math.imul(h^str.charCodeAt(j),0x01000193);
  return {score:Math.round((tick-20)/40*100)/100,fallTick,log,hash:(h>>>0).toString(16).padStart(8,'0')};
}

 if(e.kind==='fall'){voice('noise',.47,1,1.35,.85,e.x);voice('sine',90,25,1.15,.4,e.x);}
 if(e.kind==='shot')shots.push(e);
 }
 const specs={cannon:[5,'triangle',132,35,.16,.22],lance:[4,'sawtooth',500,69,.13,.10],flak:[3,'noise',2,1,.1,.43],bolt:[2,'square',294,112,.06,.05],frost:[1,'sine',810,530,.14,.085]};
 shots.sort((a,b)=>specs[b.gun][0]-specs[a.gun][0]);while(shotTimes.length&&ac.currentTime-shotTimes[0]>=1)shotTimes.shift();
 for(const e of shots.slice(0,12-shotTimes.length)){voice(...specs[e.gun].slice(1),e.x);shotTimes.push(ac.currentTime);}
 if(to>=fallen&&!wind){wind=ac.createBufferSource();wind.buffer=noise;wind.loop=true;wind.playbackRate.value=.27;const g=ac.createGain();g.gain.value=.06;wind.connect(g);g.connect(master);wind.onended=()=>g.disconnect();wind.start();}
}
const $=id=>document.getElementById(id),scrubber=$('scrubber'),count=$('countdown');
let state='COUNTDOWN',simTime=0,playbackSpeed=1,countdownElapsed=0,holdElapsed=0,lastWall=null;
function transition(next){
 state=next;const paused=next==='PAUSED'||next==='ENDED';
 $('icon-play').style.display=paused?'block':'none';$('icon-pause').style.display=paused?'none':'block';
 $('btn-toggle').setAttribute('aria-label',paused?'Play':'Pause');count.style.display=next==='COUNTDOWN'?'block':'none';count.textContent=next==='COUNTDOWN'?'3':'';
 if(next!=='PLAYING')silence();
}
$('btn-toggle').onclick=()=>{if(state==='ENDED'){simTime=0;scrubber.value='0';draw(0);transition('PLAYING');}else transition(state==='PAUSED'?'PLAYING':'PAUSED');lastWall=performance.now();};
$('btn-refire').onclick=()=>{simTime=0;holdElapsed=0;scrubber.value='0';transition('REFIRE_HOLD');draw(0);lastWall=performance.now();};
scrubber.oninput=()=>{simTime=parseFloat(scrubber.value);transition('PAUSED');draw(simTime);};
const pills=[...document.querySelectorAll('.speed-pill')];for(const p of pills)p.onclick=()=>{playbackSpeed=+p.dataset.speed;for(const b of pills){b.classList.toggle('is-active',p===b);b.setAttribute('aria-checked',String(b===p));}};
function frame(now){
 const dt=lastWall===null?0:Math.min(.1,Math.max(0,(now-lastWall)/1000));lastWall=now;
 if(state==='COUNTDOWN'){countdownElapsed+=dt;if(countdownElapsed>=3)transition('PLAYING');else count.textContent=String(3-Math.floor(countdownElapsed));}
 if(state==='REFIRE_HOLD'){holdElapsed+=dt;if(holdElapsed>=1)transition('PLAYING');}
 if(state==='PLAYING'){const prev=simTime;simTime=Math.min(DURATION,simTime+dt*playbackSpeed);scrubber.value=simTime.toFixed(3);sound(prev,simTime);draw(simTime);if(simTime>=DURATION)transition('ENDED');}
 requestAnimationFrame(frame);
}
window.addEventListener('resize',()=>{resize();draw(simTime);});resize();transition('COUNTDOWN');draw(0);requestAnimationFrame(frame);
})();
</script></body></html>
