 return {plan(s){
 let gold=s.gold,options=[],actions=[];
 layout.forEach(([slot,type],i)=>{

 if(slot===12&&s.wave>=24){type='cannon';if(t?.type==='bolt'&&gold>=60){actions.push({op:'sell',slot});gold+=Math.floor(t.spent*.7);t=null;}}
 const tier=t?t.tier:0;
 if(tier<3)options.push({slot,type,tier,rank:i+(tier===1?1.7:tier===2?5:0)+(i===2&&s.wave<5?12:0)+(slot===12&&tier?18:0),cost:({cannon:90,flak:80,bolt:50})[type]*(tier===2?2:1)});
 });
 for(const c of options.sort((a,b)=>a.rank-b.rank)){if(c.cost>gold)break;actions.push({op:c.tier?'upgrade':'build',slot:c.slot,type:c.type});gold-=c.cost;}return actions;

 for(let i=0;i<cs.length;i++){let e=cs[i],v=0;
 for(let j=r?0:i;j<(r?cs.length:i+1);j++){const q=cs[j];if((e.x-q.x)**2+(e.y-q.y)**2>r*r)continue;let hit=Math.max(1,d-q.armor);v+=(Math.min(q.hp,hit)/d+(q.hp<=hit?.48:0))*(1+300/(100+q.remaining))*(q.type==='mender'?1.45:1);}

 function gen(w){const n=first.filter(v=>v<=w).length,sum=weight.slice(0,n).reduce((a,b)=>a+b,0);

 for(;tick<maxTicks;tick++){events=[];
 if(tick>=20&&(tick-20)%40===0){wave++;if(wave>1)m=floor(m*108/100);

 const actions=strategy.plan({tick,wave,gold,baseHp,slots:slots.map(slotView),enemies:enemies.map(view),nextWave:next.map(k=>types[k])});

 while(queue.length&&queue[0].tick===tick){const q=queue.shift();spawn(q.k,q.w,q.h);}
 for(let i=0;i<enemies.length;i++){const e=enemies[i];e.progress+=e.slowed?floor(e.speed*60/100):e.speed;position(e);

 if(fallTick>=0){snapshot();break;}

 for(const e of enemies){if(++e.age%20===0&&e.k===5){for(const q of enemies)if(near(e,q,150))q.hp=Math.min(q.maxHp,q.hp+floor(q.maxHp*8/100));fx('heal',e.x,e.y);}}

 const dst=cs.find(e=>e.id===pick)||cs.reduce((a,b)=>b.remaining<a.remaining?b:a);
 fx('shot',s.x,s.y,{gun:k,slot:s.slot,tx:dst.x/100,tz:dst.y/100,air:dst.air});t.cd=period[k];
 for(const e of splash[k]?enemies:[dst])if(valid(e)&&near(e,dst,splash[k])){e.hp-=Math.max(1,t.d-(k===3?0:e.armor));if(k===2)e.slowed=30;}
 const dead=enemies.filter(e=>e.hp<=0);if(dead.length)enemies=enemies.filter(e=>e.hp>0);
 for(const e of dead){gold+=bounty[e.k];emit('K',e.id,s.slot);fx('kill',e.x,e.y,{k:e.k,id:e.id});if(e.k===4)for(let i=0;i<3;i++)spawn(6,e.w,Math.max(1,floor(e.maxHp/4)),e.progress);}}

 let h=0x811c9dc5;const str=JSON.stringify(log);for(let i=0;i<str.length;i++)h=Math.imul(h^str.charCodeAt(i),0x01000193);
 return {score:Math.round((tick-20)/40*100)/100,fallTick,log,hash:(h>>>0).toString(16).padStart(8,'0')};
}

const audio=new (window.AudioContext||window.webkitAudioContext)(),master=audio.createGain(),compressor=audio.createDynamicsCompressor(),arand=randomizer(4242),voices=new Set();

let wind=null,shotTimes=[];
function sound(freq,end,len,level,wave,x,loop=false){

function soundEvents(from,to){
 let shots=[];
 for(let k=Math.floor(from*20)+1;k<=Math.min(last,Math.floor(to*20));k++)for(let e of frames[k].events){const x=e.x;

 for(const e of shots.sort((a,b)=>tones[b.gun][3]-tones[a.gun][3])){if(shotTimes.length>=12)break;const [f,end,l,v,w]=tones[e.gun];sound(f*(.97+.06*arand()),end,l,v,w,e.x);shotTimes.push(now);}

const $=id=>document.getElementById(id),scrubber=$('scrubber'),countdown=$('countdown');
let state='COUNTDOWN',simTime=0,playbackSpeed=1,countdownElapsed=0,holdElapsed=0,previous=null;
function setState(next){state=next;let playing=next==='PLAYING',showPause=playing||next==='COUNTDOWN'||next==='REFIRE_HOLD';

 countdown.style.display=next==='COUNTDOWN'?'block':'none';countdown.textContent=next==='COUNTDOWN'?String(3-Math.floor(countdownElapsed)):'';

$('btn-toggle').onclick=()=>{if(state==='PAUSED'||state==='ENDED'){if(state==='ENDED'){simTime=0;scrubber.value='0';render(0);}previous=null;setState('PLAYING');}else setState('PAUSED');};

 else if(state==='REFIRE_HOLD'){holdElapsed+=dt;if(holdElapsed>=1)setState('PLAYING');}

 requestAnimationFrame(frame);}
resize();setState('COUNTDOWN');render(0);requestAnimationFrame(frame);
})();
