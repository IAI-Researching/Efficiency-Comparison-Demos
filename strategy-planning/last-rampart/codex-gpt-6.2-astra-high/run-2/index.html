<style>

html, body {

<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>

    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">

  </div>

  <input id="scrubber" type="range" min="0" max="100" step="0.001" value="0" aria-label="Timeline Scrubber">

<script id="rampart-strategy">
function createStrategy() {
  const battery=[0,2,4,8,11,6,3,1,13,9,7], antiAir=[14,5,10,15,12];
  const cost={bolt:50,cannon:90,frost:70,lance:120,flak:80};
  const power=[0,1,1.6,2.56];
  const tierDamage={bolt:[0,26,41,65],cannon:[0,60,96,153],frost:[0,10,16,25],lance:[0,180,288,460],flak:[0,40,64,102]};
  const futureStats={"grunt":[60,10,1],"runner":[40,20,1],"brute":[150,6,3],"wisp":[50,12,2],"splitter":[90,8,2],"mender":[70,8,2]};
  const compositions=new Map([[1,Array(4).fill('grunt')]]),scales=[0,1000];
  let arrivals=[];
  function preview(state,horizon) {
    const schedule=Array.from({length:horizon+1},()=>[]);
    const sequence=['grunt','runner','grunt','wisp','grunt','brute','mender','grunt','splitter','runner','grunt','wisp','brute','grunt','runner','splitter','grunt','brute','wisp','grunt','runner','grunt','grunt'];
    while(scales.length<=state.wave+Math.ceil(horizon/40))scales.push(Math.floor(scales[scales.length-1]*108/100));
    for(let w=Math.max(1,state.wave-4);w<=state.wave+Math.ceil(horizon/40);w++){
      const composition=compositions.get(w);
      for(let i=0;i<4+Math.floor(3*w/5);i++){
        const step=(w-state.wave)*40+4*i+1;
        if(step<1||step>horizon)continue;
        const type=composition?composition[i]:sequence[(i*7+w*11)%23];
        const [baseHp,speed]=futureStats[type],air=+(type==='wisp'),hp=Math.floor(baseHp*scales[w]/1000);
        schedule[step].push({type,p:0,remaining:tracks[air].length,x:50,y:air?650:250,air,hp,maxHp:hp,armor:type==='brute'?6+w:type==='grunt'?Math.floor(w/4):0,speed,slowed:0,age:0});
      }
    }return schedule;
  }
  // A short tactical forecast prices a fully funded battery conversion in the last sector.
  // Income and new construction beyond the current payment are intentionally excluded.
  const routes=[[[50,250],[650,250],[650,1050],[1250,1050],[1250,350],[1850,350],[1850,1150],[2350,1150]],[[50,650],[2150,650],[2150,1150],[2350,1150]]];
  const tracks=routes.map(nodes=>{
    const points=[];
    for(let i=1;i<nodes.length;i++){
      const [x,y]=nodes[i-1],dx=nodes[i][0]-x,dy=nodes[i][1]-y;
      for(let n=0;n<Math.abs(dx)+Math.abs(dy);n++)points.push([x+n*Math.sign(dx),y+n*Math.sign(dy)]);
    }
    return points;
  });
  const tables={bolt:[8,300,0],lance:[36,360,0],flak:[10,320,70],cannon:[24,260,90],frost:[12,240,0]};
  function selectTarget(t,candidates) {
      let best=-1,choice=candidates[0];
      if(t.type==='bolt'||t.type==='frost'||t.type==='lance') {
        for(const e of candidates){
          const damage=Math.max(1,tierDamage[t.type][t.tier]-(t.type==='lance'?0:e.armor));
          const gain=t.type==='frost'?Math.min(e.hp,780)*e.speed/(1+e.slowed):
            Math.min(e.hp,damage)*(e.type==='mender'?1.8:1)+(e.hp<=damage?damage*.4:0);
          const value=gain/(e.remaining+350);if(value>best){best=value;choice=e;}
        }
        return choice;
      }
      const air=t.type==='flak',radius=air?70:90,damage=tierDamage[t.type][t.tier];
      const values=candidates.map(e=>{
        const hit=Math.max(1,damage-e.armor);
        let v=Math.min(hit,e.hp)/hit+(e.hp<=hit?1.6:0);
        if(e.type==='mender')v*=14;
        if(e.type==='runner')v*=3;
        if(e.type==='brute')v*=1.3;
        return v*(1+64*(1-e.remaining/(air?2800:4600))**0.5);
      });
      for(const a of candidates) {
        let score=0;
        for(let j=0;j<candidates.length;j++){
          const b=candidates[j],dx=b.x-a.x,dy=b.y-a.y;
          if(dx*dx+dy*dy<=radius*radius)score+=values[j];
        }
        if(score>best){best=score;choice=a;}
      }
      return choice;
  }
  function forecast(state,layout,swap=-1,replacement='') {
    const es=state.enemies.map(e=>({...e,p:tracks[e.air].length-e.remaining,age:Math.floor((tracks[e.air].length-e.remaining)/e.speed)}));
    let penalty=0,damageTaken=0,maxId=0;
    for(const e of es)maxId=Math.max(maxId,e.id);
    const guns=layout.map((t,i)=>{
      if(!t)return null;
      const type=i===swap?replacement:t.type,tier=i===swap?3:t.tier;
      const [period,baseRange,blast]=tables[type],range=baseRange+30*(tier-1);
      return {x:state.slots[i].x,y:state.slots[i].y,type,tier,damage:tierDamage[type][tier],cd:i===swap?0:(i*7)%period,period,range2:range*range,blast};
    });
    const harm=e=>e.type==='brute'?3:(e.air||e.type==='mender'||e.type==='splitter')?2:1;
    const horizon=190;
    for(let step=1;step<=horizon;step++){
      for(const scheduled of arrivals[step])es.push({...scheduled,id:++maxId});
      for(const e of es) {
        if(e.hp<=0)continue;
        e.p+=e.slowed>0?Math.floor(.6*e.speed):e.speed;
        const track=tracks[e.air];e.remaining=track.length-e.p;
        if(e.remaining<=0){damageTaken+=harm(e);penalty+=harm(e)*(2-step/horizon);if(damageTaken>=state.baseHp && damageTaken-harm(e)<state.baseHp)penalty+=10*(1-step/horizon);e.hp=0;continue;}
        e.x=track[e.p][0];e.y=track[e.p][1];
      }
      for(const e of es)if(e.hp>0 && ++e.age%20===0 && e.type==='mender'){
        for(const b of es)if(b.hp>0&&(b.x-e.x)**2+(b.y-e.y)**2<=22500)b.hp=Math.min(b.maxHp,b.hp+Math.floor(b.maxHp*.08));
      }
      for(const gun of guns){
        if(!gun || --gun.cd>0)continue;
        const inRange=[];
        for(const e of es){
          if(e.hp<=0 || (gun.type==='flak'?!e.air:e.air && (gun.type==='cannon'||gun.type==='lance')))continue;
          if((gun.x-e.x)**2+(gun.y-e.y)**2<=gun.range2)inRange.push(e);
        }
        if(!inRange.length)continue;
        const target=selectTarget(gun,inRange);
        gun.cd=gun.period;
        const hitList=gun.blast?es:[target],count=hitList.length;
        for(let j=0;j<count;j++){
          const b=hitList[j];
          if(b.hp<=0 || b.air!==target.air || (b.x-target.x)**2+(b.y-target.y)**2>gun.blast**2)continue;
          b.hp-=Math.max(1,gun.damage-(gun.type==='lance'?0:b.armor));
          if(gun.type==='frost')b.slowed=30;
          if(b.hp<=0 && b.type==='splitter'){
            const hp=Math.max(1,Math.floor(b.maxHp/4));
            for(let j=0;j<3;j++)es.push({...b,id:++maxId,age:0,type:'splitling',hp,maxHp:hp,slowed:0,speed:12});
          }
        }
      }
      for(const e of es)if(e.slowed>0)e.slowed--;
    }
    for(const e of es)if(e.hp>0)penalty+=harm(e)*(.08+.45*e.hp/e.maxHp)*Math.exp(-e.remaining/800);
    return penalty;
  }
  return {
    plan(state) {
      compositions.set(state.wave+1,state.nextWave.slice());
      const w=state.wave, slots=state.slots.map(s=>s.turret?{...s.turret}:null);
      const actions=[];
      let gold=state.gold;
      const escapedAir=state.enemies.reduce((sum,e)=>sum+(e.air && e.remaining<1400?e.hp:0),0);
      const reserve=.25*Math.max(0,Math.min(1000,(w-3)*70,(33-w)*110));
      const airNeed=.95*(1+Math.min(1.4,escapedAir/1800));
      function role(i) {
        if(i===0 && w<8)return 'bolt';
        if(i===1)return 'lance';
        return antiAir.includes(i)?'flak':'cannon';
      }
      for(const i of battery) {
        const t=slots[i];if(w>=32 || !t || role(i)===t.type || (t.type==='frost' && role(i)==='cannon'))continue;
        const refund=Math.floor(t.spent*.7);
        if(gold+refund<cost[role(i)]*(t.tier===3?4:t.tier))continue;
        actions.push({op:'sell',slot:i});gold+=refund;slots[i]=null;
      }
      while(actions.length<32) {
        let best,utility=-1;
        for(const order of [battery,antiAir]) {
          const air=order===antiAir;
          if(air && w<3)continue;
          const total=order.reduce((a,i)=>a+power[slots[i]?.tier||0],0);
          for(let rank=0;rank<order.length;rank++) {
            const i=order[rank],tier=slots[i]?.tier||0,type=slots[i]?.type||role(i);
            if(tier===3)continue;
            const price=cost[type]*Math.max(1,tier);
            let value=[1,.86,.55][tier]/(1+rank*.16);
            value*=(air?airNeed:1)/(1+total*(air ? .35 : .1));
            if(air && total===0)value+=3;
            if(value>utility){utility=value;best={i,type,tier,price};}
          }
        }
        if(!best || gold<best.price+reserve)break;
        const {i,type,tier,price}=best;
        actions.push(tier?{op:'upgrade',slot:i}:{op:'build',slot:i,type});
        slots[i]={type,tier:tier+1};gold-=price;
      }
      if(w>=33 && state.enemies.some(e=>e.remaining<1600 && e.hp>60)){
        arrivals=preview(state,190);
        const baseline=forecast(state,slots);
        if(baseline>.4){
          let best=baseline,choice;
          for(const i of [14,13,12,10,11,7,8,5]){
            const t=slots[i];
            if(!t || t.tier!==3 || !state.slots[i].turret || actions.some(a=>a.slot===i))continue;
            for(const type of ['cannon','flak','frost','lance']){
              if(type===t.type)continue;
              const net=cost[type]*4-Math.floor(cost[t.type]*4*.7);
              if(gold<net)continue;
              const risk=forecast(state,slots,i,type)+.75+Math.max(0,net)*.0025;
              if(risk<best){best=risk;choice={i,type};}
            }
          }
          if(choice){const {i,type}=choice;actions.push({op:'sell',slot:i},{op:'build',slot:i,type},{op:'upgrade',slot:i},{op:'upgrade',slot:i});}
        }
      }
      return actions;
    },
    target(t,candidates) {
      return selectTarget(t,candidates).id;
    }
  };
}
</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks) {
  const strategy = createStrategy(), floor = Math.floor, observe = rampartSimulate.observe;
  const guns = {
    bolt: [50,26,8,300,0,0,1,1], cannon: [90,60,24,260,90,0,1,0],
    frost: [70,10,12,240,0,30,1,1], lance: [120,180,36,360,0,0,1,0],
    flak: [80,40,10,320,70,0,0,1]
  };
  const types = Object.keys(guns);
  const stats = {grunt:[60,10,4,1,1,10], runner:[40,20,4,1,2,4], wisp:[50,12,6,2,3,3],
    brute:[150,6,9,3,4,3], splitter:[90,8,6,2,6,2], mender:[70,8,7,2,8,1], splitling:[1,12,1,1,999,0]};
  const slots = [[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],[14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]]
    .map(([x,y],slot)=>({slot,x:x*100+50,y:y*100+50,turret:null}));
  const paths = [[[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]],[[0,6],[21,6],[21,11],[23,11]]];
  const route = paths.map(points => {
    const positions=[];
    for(let i=1;i<points.length;i++) {
      const [x,y]=points[i-1], dx=points[i][0]-x, dy=points[i][1]-y;
      for(let p=0;p<100*(Math.abs(dx)+Math.abs(dy));p++)
        positions.push([100*x+50+Math.sign(dx)*p,100*y+50+Math.sign(dy)*p]);
    }
    positions.push(points[points.length-1].map(n=>100*n+50));
    return positions;
  });
  function mulberry32(a) { return function () {
    a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return (t ^ (t >>> 14)) >>> 0; }; }
  const draw = mulberry32(seed);
  function composition(w) {
    const entries=Object.keys(stats).filter(type=>stats[type][4]<=w && stats[type][5]);
    const weight=entries.reduce((a,t)=>a+stats[t][5],0);
    return Array.from({length:4+floor(3*w/5)},()=>{
      let r=draw()%weight;
      for(const t of entries) { if(r<stats[t][5]) return t; r-=stats[t][5]; }
    });
  }
  const queue=[], log=[], scales=[0,1000];
  let enemies=[], gold=250, baseHp=10, wave=0, nextId=1, next=composition(1), fallTick=-1, tick=0;
  let effects;
  function effect(kind,...args) { if(observe) effects.push([kind,...args]); }
  function position(e) {
    const point=route[e.air][Math.min(e.progress,route[e.air].length-1)];
    e.x=point[0]; e.y=point[1]; e.remaining=e.length-e.progress;
  }
  function spawn(type,w,progress=0,childHp=0) {
    const data=stats[type], air=+(type==='wisp'), maxHp=childHp || floor(data[0]*scales[w]/1000);
    const e={id:nextId++,type,wave:w,progress,hp:maxHp,maxHp,air,speed:data[1],
      armor:type==='brute'?6+w:type==='grunt'?floor(w/4):0,slowed:0,age:0,length:air?2800:4600};
    position(e); enemies.push(e);
  }
  function view(e) {
    const {id,type,hp,maxHp,x,y,air,armor,speed,slowed,remaining}=e;
    return {id,type,hp,maxHp,x,y,air,armor,speed,slowed,remaining};
  }
  function slotViews() {
    return slots.map(({slot,x,y,turret:t})=>({slot,x,y,turret:t?{type:t.type,tier:t.tier,spent:t.spent}:null}));
  }
  function record() {
    if(observe) observe({tick,wave,gold,baseHp,next:next.slice(),slots:slotViews(),effects,
      enemies:enemies.map(e=>[e.id,e.type,e.x,e.y,e.hp/e.maxHp,e.slowed,e.progress])});
  }
  function startWave() {
    wave++; gold+=Math.min(50,floor(gold*5/100))+10+2*wave;
    if(wave>1) scales[wave]=floor(scales[wave-1]*108/100);
    const current=next; next=composition(wave+1);
    effect('wave',wave);
    const actions=strategy.plan({tick,wave,gold,baseHp,slots:slotViews(),enemies:enemies.map(view),nextWave:next.slice()});
    if(Array.isArray(actions)) for(const a of actions.slice(0,32)) {
      if(!a || !Number.isInteger(a.slot) || !slots[a.slot]) continue;
      const s=slots[a.slot],t=s.turret;
      if(a.op==='build' && !t && types.includes(a.type) && gold>=guns[a.type][0]) {
        const g=guns[a.type]; gold-=g[0];
        s.turret={type:a.type,tier:1,spent:g[0],damage:g[1],range:g[3],cooldown:0};
        log.push([tick,'B',s.slot,types.indexOf(a.type)]); effect('build',s.slot);
      } else if(a.op==='upgrade' && t && t.tier<3 && gold>=t.tier*guns[t.type][0]) {
        const cost=t.tier*guns[t.type][0]; gold-=cost; t.spent+=cost; t.tier++;
        t.damage=floor(t.damage*16/10); t.range+=30;
        log.push([tick,'U',s.slot,t.tier]); effect('upgrade',s.slot);

let hudSignature='';
function drawHUD(frame,t,leakAge) {

  polygon(left+8*unit,goldY+6.7*unit,8*unit,10,0xe0ab62);
  polygon(left+8*unit,goldY+6.7*unit,5.7*unit,10,0xb58246);
  polygon(left+8*unit,goldY+6.7*unit,3.6*unit,4,0xf0c982,1.25);
  number(frame.gold,left+24*unit,goldY-2*unit,19*unit,0xe2c08a);

    if(type==='wisp'){polygon(ix,iy,r,4,c,1.18);poly([[ix-r*.6,iy],[ix-r*1.6,iy-r*.83],[ix-r*1.42,iy+r*.18]],0x4caaaa);}
    if(type==='brute'){polygon(ix,iy,r*1.22,6,0xb1774c);polygon(ix,iy,r*.72,6,0x757b77);}
    if(type==='splitter'){polygon(ix,iy,r*1.15,5,c);polygon(ix+r*.6,iy-r*.5,r*.58,4,0xd9a4f4);}
    if(type==='mender'){polygon(ix,iy,r,4,c);polygon(ix,iy,r*.38,4,0x72b587);}

    shield(x+1.6*unit,hpY+1.7*unit,hpWidth-3.2*unit,15*unit,on?0x99b1a1:0x232b2d);
    if(on)poly([[x+3*unit,hpY+3.6*unit],[x+hpWidth-3*unit,hpY+3.6*unit],[x+hpWidth-3*unit,hpY+5*unit],[x+3*unit,hpY+5*unit]],0xd9d9ba);
  }
  function upload(mesh,v,c,u) {

const neutral=new T.Vector3(),cameraNormal=new T.Vector3(),cameraCentre=new T.Vector3(12,0,7);
const direction=new T.Vector3(.155,1.28,1).normalize(),corners=[];
for(const x of [-.66,24.66])for(const z of [-.60,14.60])for(const y of [-1.93,1.4])corners.push(new T.Vector3(x,y,z));
let simTime=0;
function resize(){
  const W=window.innerWidth,H=window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  camera.aspect=W/H;camera.clearViewOffset();camera.updateProjectionMatrix();
  const top=H*.052,bottom=H-Math.min(96,H*.30);
  const middle=(top+bottom)/2;
  function bounds(dist){
    camera.position.copy(cameraCentre).addScaledVector(direction,dist);camera.lookAt(cameraCentre);camera.updateMatrixWorld();
    let xlo=1,xhi=-1,ylo=1,yhi=-1;
    for(const p of corners){const v=p.clone().project(camera);xlo=Math.min(xlo,v.x);xhi=Math.max(xhi,v.x);ylo=Math.min(ylo,v.y);yhi=Math.max(yhi,v.y);}
    return {xlo,xhi,ylo,yhi};
  }
  let low=8,high=360;
  for(let i=0;i<25;i++){let mid=(low+high)/2;const b=bounds(mid);
    if((b.xhi-b.xlo)*.5*W>W*.934||(b.yhi-b.ylo)*.5*H>bottom-top)low=mid;else high=mid;}

  camera.setViewOffset(W,H,(b.xhi+b.xlo)*W*.25,(H/2-middle)-(b.yhi+b.ylo)*H*.25,W,H);
  neutral.copy(camera.position);cameraNormal.set(0,0,1).applyQuaternion(camera.quaternion);
  healthRight.set(1,0,0).applyQuaternion(camera.quaternion);
  hudCamera.left=0;hudCamera.right=W;hudCamera.top=H;hudCamera.bottom=0;hudCamera.updateProjectionMatrix();

// A deterministic, band-limited shake signal. No accumulated camera transforms.
const noise=Array.from({length:1300},()=>random()*2-1);
function sampleNoise(t,offset){const x=t*10.7+offset,i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return noise[i%noise.length]*(1-u)+noise[(i+1)%noise.length]*u;}
function render(t) {
  const position=Math.min(t*20,replay.length-1),k=Math.floor(position),f=position-k;
  const frame=replay[k],next=replay[Math.min(k+1,replay.length-1)];
  const worldTime=Math.min(t,fallTime),fxTime=Math.min(t,fallTime+1);
  const pulse=traumaEvents[upperTime(traumaEvents,t)-1];
  const leakAge=pulse?t-pulse.time:Infinity,trauma=pulse?Math.max(0,pulse.value-leakAge):0;
  camera.position.copy(neutral).addScaledVector(healthRight,.18*trauma**2*sampleNoise(t,0));
  camera.position.y+=.16*trauma**2*sampleNoise(t,47);camera.updateMatrixWorld();
  for(const b of groups.values())b.count=0;
  for(const [x,z,y,s] of hearths){

    part('gem',0xffe6a0,x-.018*s,y+.075*s,z,.112*s,.21*s*flicker,.112*s,0,0,0,'light');
  }

  for(const e of frame.enemies)enemy(e,next.index.get(e[0]),f,worldTime);
  if(t<fallTime+1.001)for(let i=upperTime(visuals,fxTime-1.05),end=upperTime(visuals,fxTime);i<end;i++)effect(visuals[i],fxTime);

    if(b.count){b.instanceMatrix.updateRange.count=b.count*16;b.instanceMatrix.needsUpdate=true;b.instanceColor.updateRange.count=b.count*3;b.instanceColor.needsUpdate=true;}

const AudioEngine=window.AudioContext||window.webkitAudioContext;
const ctx=new AudioEngine(),master=ctx.createGain(),compressor=ctx.createDynamicsCompressor();
master.gain.value=0;compressor.threshold.value=-16;compressor.knee.value=12;compressor.ratio.value=7;compressor.attack.value=.003;compressor.release.value=.16;
master.connect(compressor);compressor.connect(ctx.destination);
const resumeAudio=()=>{ctx.resume().catch(()=>{});};
resumeAudio();
for(const event of ['pointerdown','keydown'])window.addEventListener(event,resumeAudio,{once:true,capture:true});
const soundRandom=randomSource(4242),noiseBuffer=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
const channel=noiseBuffer.getChannelData(0);
for(let i=0;i<channel.length;i++)channel[i]=soundRandom()*2-1;
for(const event of soundEvents)event.variation=.94+.12*soundRandom();
const activeSources=new Set();
let wind=null,lastPop=-10,shotTimes=[],audioGate=false;
function attach(source,x,gain,filter=null) {
  const pan=ctx.createStereoPanner();pan.pan.value=clamp((x-12)/13,-.92,.92);
  if(filter){source.connect(filter);filter.connect(gain);}else source.connect(gain);
  gain.connect(pan);pan.connect(master);activeSources.add(source);
  source.onended=()=>{activeSources.delete(source);source.disconnect();filter?.disconnect();gain.disconnect();pan.disconnect();};
}
function soundGate(on) {
  audioGate=on;const now=ctx.currentTime;master.gain.cancelScheduledValues(now);
  master.gain.setValueAtTime(master.gain.value,now);master.gain.linearRampToValueAtTime(on ? .56 : 0,now+.026);
  if(!on){
    for(const source of activeSources){try{source.stop(now+.028);}catch{}}
    wind=null;shotTimes=[];lastPop=-10;
  }
}
function tone(shape,from,to,length,volume,x,delay=0) {
  const start=ctx.currentTime+delay,end=start+length,g=ctx.createGain(),osc=ctx.createOscillator();
  osc.type=shape;osc.frequency.setValueAtTime(from,start);osc.frequency.exponentialRampToValueAtTime(Math.max(16,to),end);
  g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(volume,start+.006);g.gain.exponentialRampToValueAtTime(.0001,end);
  attach(osc,x,g);osc.start(start);osc.stop(end+.005);
}
function noiseSound(length,volume,x,cutoff,highpass=false,offset=0) {
  const start=ctx.currentTime,g=ctx.createGain(),filter=ctx.createBiquadFilter(),source=ctx.createBufferSource();
  source.buffer=noiseBuffer;filter.type=highpass?'highpass':'lowpass';filter.frequency.value=cutoff;
  g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(volume,start+.005);
  g.gain.exponentialRampToValueAtTime(.0001,start+length);attach(source,x,g,filter);source.start(start,offset);source.stop(start+length+.005);
}
function startWind() {

  wind=ctx.createBufferSource();wind.buffer=noiseBuffer;wind.loop=true;
  const filter=ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=265;
  const gain=ctx.createGain();gain.gain.setValueAtTime(.0001,ctx.currentTime);gain.gain.linearRampToValueAtTime(.075,ctx.currentTime+.9);
  attach(wind,12,gain,filter);wind.start();

// Preselect loud shots with sufficient real-time separation at each of the four speeds.
const priority={cannon:5,lance:4,flak:3,frost:2,bolt:1},audibleShots=new Map();
const ranked=soundEvents.filter(e=>e.kind==='shot').sort((a,b)=>priority[b.b]-priority[a.b]||a.time-b.time);
for(const speed of [.25,.5,1,2]){
  const used=[],set=new Set();
  for(const e of ranked){const i=upperTime(used,e.time);
    if((i && e.time-used[i-1].time<speed/12-.00001)||(i<used.length && used[i].time-e.time<speed/12-.00001))continue;
    used.splice(i,0,e);set.add(e);}
  audibleShots.set(speed,set);
}
function playAudio(from,to,speed) {
  if(!audioGate||ctx.state!=='running'||to<=from)return;
  const now=ctx.currentTime;
  for(let i=upperTime(soundEvents,from),end=upperTime(soundEvents,to);i<end;i++){
    const e=soundEvents[i],v=e.variation;
    if(e.kind==='shot'){
      if(!audibleShots.get(speed).has(e))continue;
      shotTimes=shotTimes.filter(t=>now-t<1);if(shotTimes.length>=12)continue;shotTimes.push(now);
      const x=slots[e.a][0];
      if(e.b==='cannon'){tone('sine',114*v,34,.23,.35,x);noiseSound(.12,.23,x,1700,false,v);}
      else if(e.b==='bolt'){tone('triangle',980*v,240,.073,.14,x);noiseSound(.037,.05,x,1800,true,v);}
      else if(e.b==='frost'){tone('sine',1350*v,1780,.16,.095,x);tone('sine',720*v,1020,.18,.055,x);}
      else if(e.b==='lance'){tone('sawtooth',340*v,66,.16,.13,x);tone('sine',840*v,174,.11,.12,x);}
      else{noiseSound(.092,.13,x,2600,true,v);tone('triangle',540*v,135,.087,.12,x);}
    }else if(e.kind==='kill'){

    }else if(e.kind==='wave'){

    }else if(e.kind==='leak'){

    }else if(e.kind==='fall'){

}
const countdown=document.getElementById('countdown'),scrubber=document.getElementById('scrubber'),toggle=document.getElementById('btn-toggle');
const pauseIcon=document.getElementById('icon-pause'),playIcon=document.getElementById('icon-play');
let state='COUNTDOWN',playbackSpeed=1,countdownElapsed=0,holdElapsed=0,previous=null;
function setState(next) {
  state=next;const running=next==='PLAYING'||next==='COUNTDOWN'||next==='REFIRE_HOLD';
  pauseIcon.style.display=running?'block':'none';playIcon.style.display=running?'none':'block';toggle.setAttribute('aria-label',running?'Pause':'Play');
  countdown.style.display=next==='COUNTDOWN'?'block':'none';countdown.textContent=next==='COUNTDOWN'?'3':'';
  soundGate(next==='PLAYING');
}
toggle.addEventListener('click',()=>{
  if(state==='PLAYING'||state==='COUNTDOWN'||state==='REFIRE_HOLD')setState('PAUSED');
  else{
    if(state==='ENDED'){simTime=0;scrubber.value='0';render(0);}
    setState('PLAYING');
  }
  previous=performance.now();
});
document.getElementById('btn-refire').addEventListener('click',()=>{
  simTime=0;holdElapsed=0;countdownElapsed=0;scrubber.value='0';setState('REFIRE_HOLD');render(0);previous=performance.now();
});
for(const pill of document.querySelectorAll('.speed-pill'))pill.addEventListener('click',()=>{
  playbackSpeed=Number(pill.dataset.speed);
  for(const button of document.querySelectorAll('.speed-pill')){
    button.classList.toggle('is-active',button===pill);button.setAttribute('aria-checked',String(button===pill));
  }
});
scrubber.addEventListener('input',()=>{setState('PAUSED');simTime=parseFloat(scrubber.value);render(simTime);previous=performance.now();});

window.addEventListener('resize',resize);
function playback(now){
  const dt=previous===null?0:clamp((now-previous)/1000,0,.1);previous=now;
  if(state==='COUNTDOWN'){
    countdownElapsed+=dt;
    if(countdownElapsed+1e-9<3)countdown.textContent=String(3-Math.floor(countdownElapsed+1e-9));
    else setState('PLAYING');
  }else if(state==='REFIRE_HOLD'){
    holdElapsed+=dt;if(holdElapsed+1e-9>=1)setState('PLAYING');
  }
  if(state==='PLAYING'){
    const before=simTime;simTime=Math.min(DURATION,simTime+dt*playbackSpeed);
    scrubber.value=simTime.toFixed(3);playAudio(before,simTime,playbackSpeed);
    if(before<fallTime+1.05||simTime===DURATION)render(simTime);
    if(simTime>=DURATION)setState('ENDED');
  }
  requestAnimationFrame(playback);
}
setState('COUNTDOWN');resize();
requestAnimationFrame(playback);
})();
