<!DOCTYPE html>

<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;

}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;

  z-index: 50;

}

  left: 50%;

  z-index: 100;

  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

  margin: 0;

  appearance: none;

}

  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;

  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}

}

#btn-toggle {

  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;

}
#btn-toggle:hover {

#speed-group {

.speed-pill.is-active {

  border-radius: 50%;

  border: none;

<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">

  <input id="scrubber" type="range" min="0" max="100" step="0.001" value="0" aria-label="Timeline Scrubber">

<script id="rampart-strategy">
function createStrategy(){
  const names=['bolt','cannon','frost','lance','flak'];
  const cost=[50,90,70,120,80],period=[8,24,12,36,10],ranges=[300,260,240,360,320];
  const damage=[[26,41,65],[60,96,153],[10,16,25],[180,288,460],[40,64,102]];
  const desired=[4,4,4,1,1,1,1,1,1,1,4,1,1,0,0,4];
  const priority=[3,11,14,6,14,13,7,13,6,11,10,11,6,14,2,7,7,3,4,3,15,13,8,8,4,10,15,4,2,15,12,10,1,5,8,0,9,9,12,1,5,5,9,0,2,12,0,1];
  const stats={grunt:[60,10,1],runner:[40,20,1],wisp:[50,12,2],brute:[150,6,3],splitter:[90,8,2],mender:[70,8,2],splitling:[1,12,1]};
  const forecastWaves=[],multipliers=[0,1000],lastShot=Array(16).fill(-9999);
  let observations=new Map(),waveTick=0;
  function track(t,group){
    // The distance moved since the planning snapshot gives the firing tick for a
    // visible unit. This preserves reload phases when comparing late-game sales.
    for(const e of group){
      const old=observations.get(e.id);
      if(!old || e.slowed || old.slowed)continue;
      const elapsed=(old.remaining-e.remaining)/e.speed;
      if(elapsed>=1 && elapsed<=40 && Number.isInteger(elapsed)){
        lastShot[t.slot]=waveTick-1+elapsed;return;
      }
    }
  }
  function aim(type,tier,group){
    const radius=type===1?90:type===4?70:0,hit=damage[type][tier-1];
    const worth=group.map(e=>{
      const actual=Math.max(1,hit-(type===3?0:e.armor));
      const urgency=1+1400/(20+e.remaining/e.speed)+(e.type==='mender'?12:0);
      return urgency*(Math.min(e.hp,actual)/hit+(e.hp<=actual?.45:0))*(type===2&&e.slowed?.1:1);
    });
    let best=-1,selected=0;
    for(let i=0;i<group.length;i++){
      let score=worth[i];
      if(radius)for(let j=0;j<group.length;j++){
        if(i===j)continue;
        const dx=group[i].x-group[j].x,dy=group[i].y-group[j].y;
        if(dx*dx+dy*dy<=radius*radius)score+=worth[j];
      }
      if(score>best){best=score;selected=i;}
    }
    return group[selected];
  }
  // Cache the centi-tile geometry used to project an existing formation forward.
  const tracks=[[[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]],[[0,6],[21,6],[21,11],[23,11]]].map(path=>{
    const coords=[];
    for(let i=1;i<path.length;i++){
      const [x,y]=path[i-1],dx=path[i][0]-x,dy=path[i][1]-y;
      for(let p=0;p<100*(Math.abs(dx)+Math.abs(dy));p++)
        coords.push([100*x+50+p*Math.sign(dx),100*y+50+p*Math.sign(dy)]);
    }
    return coords;
  });
  function rearm(state,slots,cash,actions){
    const horizon=156,queue=Array.from({length:horizon},()=>[]);
    for(let w=Math.max(1,state.wave-4);w<=state.wave+1;w++){
      const wave=forecastWaves[w];if(!wave)continue;
      wave.forEach((type,i)=>{
        const time=(w-state.wave)*40+4*i;
        if(time<0||time>=horizon)return;
        const [base,speed]=stats[type],hp=Math.floor(base*multipliers[w]/1000),air=+(type==='wisp');
        queue[time].push({type,hp,maxHp:hp,speed,air,armor:type==='brute'?6+w:type==='grunt'?Math.floor(w/4):0,
          slowed:0,remaining:tracks[air].length,age:0});
      });
    }
    function estimate(changed,type){
      let living=state.enemies.map(e=>({...e,slowed:e.slowed?15:0,age:Math.floor((tracks[e.air].length-e.remaining)/e.speed)}));
      let penalty=0;
      const guns=slots.filter(s=>s.tier).map(s=>{
        const k=s.slot===changed?type:s.kind,level=s.slot===changed?3:s.tier;
        return {...s,k,level,range2:(ranges[k]+30*(level-1))**2,power:damage[k][level-1],cool:s.slot===changed||s.rebuilt?0:Math.max(0,lastShot[s.slot]+period[k]-state.tick+1)};
      });
      for(let t=0;t<horizon;t++){
        for(const e of queue[t])living.push({...e});
        let survivors=0;
        for(const e of living){
          e.remaining-=e.slowed?Math.floor(e.speed*.6):e.speed;
          if(e.remaining<=0){penalty+=stats[e.type][2]*(1.85-.65*t/horizon);continue;}
          const path=tracks[e.air],p=path[path.length-e.remaining];
          e.x=p[0];e.y=p[1];e.age++;living[survivors++]=e;
        }
        living.length=survivors;
        for(const m of living)if(m.type==='mender'&&m.age%20===0){
          for(const e of living){const dx=e.x-m.x,dy=e.y-m.y;
            if(dx*dx+dy*dy<=22500)e.hp=Math.min(e.maxHp,e.hp+Math.floor(e.maxHp*.08));}
        }
        for(const gun of guns){
          if(--gun.cool>0)continue;
          const k=gun.k,area=k===1?8100:k===4?4900:0,targets=[];
          for(const e of living){
            if(e.air?(k===1||k===3):k===4)continue;
            const dx=e.x-gun.x,dy=e.y-gun.y;if(dx*dx+dy*dy<=gun.range2)targets.push(e);
          }
          if(!targets.length)continue;
          const target=aim(k,gun.level,targets);gun.cool=period[k];
          let killed=false;
          for(const e of area?living:[target]){
            if(area){const dx=e.x-target.x,dy=e.y-target.y;if(e.air!==target.air || dx*dx+dy*dy>area)continue;}
            e.hp-=Math.max(1,gun.power-(k===3?0:e.armor));
            if(k===2)e.slowed=30;
            if(e.hp<=0)killed=true;
          }
          if(killed){
            const children=[];let count=0;
            for(const e of living){
              if(e.hp>0)living[count++]=e;
              else if(e.type==='splitter'){
                const hp=Math.max(1,Math.floor(e.maxHp/4));
                for(let j=0;j<3;j++)children.push({...e,type:'splitling',hp,maxHp:hp,speed:12,slowed:0,age:0});
              }
            }
            living.length=count;living.push(...children);
          }
        }
        for(const e of living)if(e.slowed)e.slowed--;
      }
      for(const e of living){
        const eta=e.remaining/e.speed;
        penalty+=stats[e.type][2]*Math.min(1.6,e.hp/900)*Math.exp(-eta/46)*.75;
      }
      return penalty;
    }
    let baseline=estimate(-1,-1);
    for(let pass=0;pass<3;pass++){
      let best=baseline,choice=null;
      // At saturation, compare a domain change or a delaying tower against holding cash.
      for(const [slot,alternatives] of [[13,[0,1,2,3,4]],[14,[0,2,4]],[12,[0,1,2,3,4]],[10,[0,1,4]],[11,[1,3,4]],[7,[1,2,4]],[2,[1,4]],[1,[1,4]],[3,[1,2]],[4,[1,3]],[6,[1,2]],[8,[1,3,4]],[0,[1,4]],[9,[1,3]],[15,[0,4]]]){
        const s=slots[slot];
        if(s.tier!==3 || s.rebuilt)continue;
        for(const kind of alternatives){
          if(kind===s.kind && lastShot[s.slot]+period[kind]<state.tick+7)continue;
          const charge=4*cost[kind]-Math.floor(280*cost[s.kind]/100);
          if(charge>cash)continue;
          const loss=estimate(slot,kind)+.18+Math.max(0,charge)*.0015;
          if(loss<best){best=loss;choice=[slot,kind];}
        }
      }
      if(choice){
        const [slot,kind]=choice;
        cash-=4*cost[kind]-Math.floor(280*cost[slots[slot].kind]/100);
        slots[slot].kind=kind;slots[slot].rebuilt=true;baseline=best;
        actions.push({op:'sell',slot},{op:'build',slot,type:names[kind]},{op:'upgrade',slot},{op:'upgrade',slot});
      }else break;
    }
  }
  return {
    plan(s){
      waveTick=s.tick;observations=new Map(s.enemies.map(e=>[e.id,e]));
      forecastWaves[s.wave+1]=s.nextWave.slice();
      multipliers[s.wave+1]=Math.floor(multipliers[s.wave]*108/100);
      if(s.wave<3)return [];
      const slots=s.slots.map(v=>({slot:v.slot,x:v.x,y:v.y,kind:v.turret?names.indexOf(v.turret.type):desired[v.slot],tier:v.turret?v.turret.tier:0}));
      const actions=[],occurrence=Array(16).fill(0);
      let cash=s.gold;
      for(let i=0;i<priority.length;i++){
        const slot=priority[i],tower=slots[slot],level=++occurrence[slot];
        if(tower.tier>=level)continue;
        if(i>=3 && s.wave<13 && cash<1000)break;
        const charge=cost[tower.kind]*Math.max(1,level-1);if(cash<charge)break;
        cash-=charge;tower.tier=level;
        actions.push(level===1?{op:'build',slot,type:names[tower.kind]}:{op:'upgrade',slot});
      }
      if(s.wave>=35 && cash>=35)rearm(s,slots,cash,actions);
      return actions;
    },
    target(t,candidates){track(t,candidates);return aim(names.indexOf(t.type),t.tier,candidates).id;}
  };
}
</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks) {
  const floor = Math.floor;
  function mulberry32(a) { return function () {
    a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return (t ^ (t >>> 14)) >>> 0; }; }
  const draw = mulberry32(seed);
  const stats = {
    grunt:[60,10,4,1,1,10], runner:[40,20,4,1,2,4], wisp:[50,12,6,2,3,3],
    brute:[150,6,9,3,4,3], splitter:[90,8,6,2,6,2], mender:[70,8,7,2,8,1],
    splitling:[0,12,1,1,999,0]
  };
  const guns = {
    bolt:[50,26,8,300,0,0,1,1], cannon:[90,60,24,260,90,0,1,0],
    frost:[70,10,12,240,0,30,1,1], lance:[120,180,36,360,0,0,1,0],
    flak:[80,40,10,320,70,0,0,1]
  };
  const ground=[[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]];
  const sky=[[0,6],[21,6],[21,11],[23,11]];
  const pads=[[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],[14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]];
  const slots=pads.map(([x,y],slot)=>({slot,x:100*x+50,y:100*y+50,turret:null}));
  const observer=rampartSimulate.record;
  const brain=createStrategy(), log=[], scale=[0,1000], types=Object.keys(guns);
  let living=[], queue=[], tick=0, wave=0, gold=250, baseHp=10, lastId=0, fallTick=-1;
  function generate(w) {
    const pool=Object.keys(stats).filter(k=>stats[k][4]<=w && stats[k][5]);
    const sum=pool.reduce((v,k)=>v+stats[k][5],0);
    return Array.from({length:4+floor(3*w/5)},()=>{
      let r=draw()%sum;
      for(const k of pool){r-=stats[k][5]; if(r<0) return k;}
    });
  }
  let preview=generate(1);
  function place(e) {
    const path=e.air?sky:ground;
    let p=e.progress;
    for(let i=1;i<path.length;i++){
      const [x,y]=path[i-1],dx=path[i][0]-x,dy=path[i][1]-y,len=(Math.abs(dx)+Math.abs(dy))*100;
      if(p<len || i===path.length-1) {
        e.x=100*x+50+Math.sign(dx)*p;
        e.y=100*y+50+Math.sign(dy)*p;
        e.dir=dx>0?1:dy>0?0:dy<0?2:3;
        break;
      }
      p-=len;
    }
    // The three air segments total 2800. Both published hashes require their full length.
    e.remaining=(e.air?2800:4600)-e.progress;
  }
  function spawn(type,w,progress=0,inheritedHp=0) {
    const a=stats[type], maxHp=inheritedHp||floor(a[0]*scale[w]/1000);
    const e={id:++lastId,type,wave:w,age:0,hp:maxHp,maxHp,progress,air:+(type==='wisp'),
      armor:type==='brute'?6+w:type==='grunt'?floor(w/4):0,speed:a[1],slowed:0};
    place(e);living.push(e);
  }
  function view(e) {
    const {id,type,hp,maxHp,x,y,air,armor,speed,slowed,remaining}=e;
    return {id,type,hp,maxHp,x,y,air,armor,speed,slowed,remaining};
  }
  function sq(a,b){const dx=a.x-b.x,dy=a.y-b.y;return dx*dx+dy*dy;}
  function event(code,a,b) { log.push([tick,code,a,b]); }
  function fx(kind,x,y,extra) { if(observer) observer.event(tick,kind,x,y,extra); }
  function waveStart(){
    wave++;
    gold+=Math.min(50,floor(gold*5/100))+10+2*wave;
    if(wave>1) scale[wave]=floor(scale[wave-1]*108/100);
    const current=preview;
    preview=generate(wave+1);
    fx('wave',50,250,wave);
    const actions=brain.plan({tick,wave,gold,baseHp,enemies:living.map(view),nextWave:preview.slice(),
      slots:slots.map(s=>({...s,turret:s.turret?{type:s.turret.type,tier:s.turret.tier,spent:s.turret.spent}:null}))});
    if(Array.isArray(actions)) for(const act of actions.slice(0,32)) {
      if(!act || !Number.isInteger(act.slot) || !slots[act.slot]) continue;
      const s=slots[act.slot], t=s.turret, k=act.type;
      if(act.op==='build' && !t && types.includes(k) && gold>=guns[k][0]){
        const spent=guns[k][0];gold-=spent;
        s.turret={type:k,tier:1,spent,cd:0,aim:Math.PI,damage:guns[k][1]};
        event('B',s.slot,types.indexOf(k));fx('build',s.x,s.y,k);
      } else if(act.op==='upgrade' && t && t.tier<3 && gold>=guns[t.type][0]*t.tier){
        const cost=guns[t.type][0]*t.tier;
        gold-=cost;t.spent+=cost;t.tier++;t.damage=floor(t.damage*16/10);
        event('U',s.slot,t.tier);fx('upgrade',s.x,s.y,t.tier);
      } else if(act.op==='sell' && t){
        gold+=floor(t.spent*70/100);s.turret=null;event('S',s.slot,0);fx('sell',s.x,s.y,t.type);
      }
    }
    current.forEach((type,i)=>queue.push({tick:tick+4*i,wave,i,type}));
    queue.sort((a,b)=>a.tick-b.tick || a.wave-b.wave || a.i-b.i);
  }
  function snapshot(){
    if(observer) observer.frame(tick,wave,gold,baseHp,preview,slots,living);
  }
  for(;tick<maxTicks;tick++){
    if(tick>=20 && (tick-20)%40===0) waveStart();
    while(queue.length && queue[0].tick===tick){
      const q=queue.shift();spawn(q.type,q.wave);
    }
    for(let i=0;i<living.length;i++){
      const e=living[i];
      e.progress+=e.slowed?floor(e.speed*60/100):e.speed;
      place(e);
      if(e.remaining<=0){
        baseHp-=stats[e.type][3];event('L',e.id,baseHp);fx('leak',2350,1150,e.type);
        living.splice(i--,1);
        if(baseHp<=0){fallTick=tick;event('F',wave,0);fx('fall',2350,1150,wave);break;}
      }
    }
    if(fallTick>=0){snapshot();break;}
    for(const e of living){
      e.age++;
      if(e.type==='mender' && e.age%20===0){
        fx('heal',e.x,e.y,e.id);

const hud=new T.Scene(),hudCamera=new T.OrthographicCamera(0,1,1,0,.1,100);

const hudMeshes=[],hudMaterials=new Map();let hudCount=0;
function symbol(g,x,y,w,h,c,angle=0){

 if(!hudMaterials.has(key))hudMaterials.set(key,new T.MeshBasicMaterial({color:col(c),map:isDigit?digitsTexture:null,transparent:isDigit,depthTest:false,depthWrite:false,toneMapped:false}));

function digits(value,x,y,h,c,pad=0){

function paintHUD(frame,t,shock){

 const scale=clamp(height/800,.91,1.48);

 const bx=l+13*scale,by=top+21*scale;
 symbol('ribbon',bx,by,27*scale,43*scale,muted);
 symbol('ribbon',bx,by-.8*scale,24*scale,40*scale,burgundy);
 symbol('quad',bx,by-23*scale,33*scale,2*scale,brass);
 symbol('diamond',bx-18*scale,by-23*scale,4*scale,4*scale,brass);
 symbol('diamond',bx+18*scale,by-23*scale,4*scale,4*scale,brass);
 symbol('keep',bx,by-3*scale,14*scale,16*scale,'#f0dcac');
 digits(frame.wave,l+40*scale,top+waveH*.45,waveH,ivory,2);

 symbol('disc',l+9*scale,gy,15*scale,15*scale,'#c5a572');
 symbol('disc',l+9*scale,gy,11.2*scale,11.2*scale,'#83643f');
 symbol('diamond',l+9*scale,gy,5*scale,8*scale,'#efcd8d');

 symbol('quad',start-14*scale,hpy+1*scale,scale,17*scale,'#615a4f');

   const x=start+i*step,on=i<frame.hp;
   symbol('shield',x,hpy,12*scale,18*scale,on?'#d79878':isFlash?'#c26955':'#514744');

function makeAudio(){
 const Context=window.AudioContext||window.webkitAudioContext;
 if(!Context)return {play(){},silence(){},cross(){}};
 const ac=new Context(),master=ac.createGain(),limiter=ac.createDynamicsCompressor();
 master.gain.value=0;limiter.threshold.value=-15;limiter.knee.value=12;limiter.ratio.value=7;
 limiter.attack.value=.003;limiter.release.value=.15;master.connect(limiter);limiter.connect(ac.destination);
 const unlock=()=>ac.resume().catch(()=>{});unlock();
 function gesture(){unlock();window.removeEventListener('pointerdown',gesture,true);window.removeEventListener('keydown',gesture,true);}
 window.addEventListener('pointerdown',gesture,true);window.addEventListener('keydown',gesture,true);
 const random=generator(4242),noiseBuffer=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);
 const samples=noiseBuffer.getChannelData(0);
 for(let i=0;i<samples.length;i++)samples[i]=random()*2-1;
 const voices=new Set();let wind=null,shotTimes=[];
 const priority={lance:5,cannon:4,flak:3,frost:2,bolt:1};
 const shots=events.filter(e=>e.kind==='shot').sort((a,b)=>priority[b.data.type]-priority[a.data.type]||a.tick-b.tick);
 const audibleShots=new Map();
 for(const speed of [.25,.5,1,2]){
   const selected=new Set(),occupied=new Uint8Array(2020);
   const separation=Math.ceil(20*speed/12);
   for(const shot of shots){
     if(occupied[shot.tick])continue;
     selected.add(shot);occupied.fill(1,Math.max(0,shot.tick-separation+1),Math.min(2020,shot.tick+separation));
   }
   audibleShots.set(speed,selected);
 }
 const variations=new Map(events.map(e=>[e,.94+.12*random()]));
 function envelope(source,filter,x,level,length,start,attack=.006){

   pan.pan.value=clamp(x/12-1,-1,1)*.82;

   gain.gain.exponentialRampToValueAtTime(.0001,start+length);
   if(filter){source.connect(filter);filter.connect(gain);}else source.connect(gain);
   gain.connect(pan);pan.connect(master);
   voices.add(source);source.onended=()=>{voices.delete(source);source.disconnect();if(filter)filter.disconnect();gain.disconnect();pan.disconnect();};

 function tone(wave,from,to,duration,level,x,at,attack){

   source.connect(f);f.connect(g);g.connect(pan);pan.connect(master);source.start();wind=source;

 function play(t){

   const now=ac.currentTime;master.gain.cancelScheduledValues(now);master.gain.setValueAtTime(master.gain.value,now);

          case 'bolt':tone('triangle',800*v,205,.066,.11,x,at);break;

          case 'flak':hiss(2400,690,.079,.15,x,at);tone('triangle',355*v,105,.08,.095,x,at);break;

const sound=makeAudio();
const $=id=>document.getElementById(id),scrubber=$('scrubber'),countdown=$('countdown');
let mode='COUNTDOWN',simTime=0,playbackSpeed=1,countdownElapsed=0,holdElapsed=0,lastWall=null;
function state(next){

}
function advance(dt){

function animation(now){

   countdownElapsed+=dt;
   if(countdownElapsed>=3){state('PLAYING');advance(countdownElapsed-3);}
   else {countdown.style.display='block';countdown.textContent=String(3-Math.floor(countdownElapsed));}

   holdElapsed+=dt;if(holdElapsed>=1){state('PLAYING');advance(holdElapsed-1);}
