<script id="rampart-strategy">
function createStrategy() {
  // Evaluate late-game replacements against the attackers already on the board.
  // The forecast infers hidden cooldowns and heal phases from the public view.
  const groundRoad=[[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]];
  const airRoad=[[0,6],[21,6],[21,11],[23,11]];
  function routeLookup(path) {
    const xs=[],ys=[];
    for(let j=1;j<path.length;j++){
      const [x,y]=path[j-1],dx=path[j][0]-x,dy=path[j][1]-y;
      const length=100*(Math.abs(dx)+Math.abs(dy));
      for(let i=0;i<length;i++){xs.push(x*100+50+i*Math.sign(dx));ys.push(y*100+50+i*Math.sign(dy));}
    }
    return {xs,ys};
  }
  const roads=[routeLookup(groundRoad),routeLookup(airRoad)];
  const siteTiles=[[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],[14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]];
  const sites=siteTiles.map(([x,y])=>[100*x+50,100*y+50]);
  const weapons={
    cannon:{damage:[60,96,153],radius:8100,range:260,period:24,ground:true,air:false},
    bolt:{damage:[26,41,65],radius:0,range:300,period:8,ground:true,air:true},
    flak:{damage:[40,64,102],radius:4900,range:320,period:10,ground:false,air:true},
    frost:{damage:[10,16,25],radius:0,range:240,period:12,ground:true,air:true},
    lance:{damage:[180,288,460],radius:0,range:360,period:36,ground:true,air:false}
  };
  const price={bolt:50,cannon:90,frost:70,lance:120,flak:80},leakDamage={grunt:1,runner:1,splitling:1,brute:3,splitter:2,mender:2,wisp:2};
  const waveBook=new Map([[1,['grunt','grunt','grunt','grunt']]]);
  let newArrivals=[],healthScale=[0,1000];
  function preview(state){
    waveBook.set(state.wave+1,state.nextWave.slice());
    while(healthScale.length<=state.wave+1)healthScale.push(Math.floor(healthScale[healthScale.length-1]*108/100));
    newArrivals=[];
    const hp={grunt:60,runner:40,wisp:50,brute:150,splitter:90,mender:70};
    const speed={grunt:10,runner:20,wisp:12,brute:6,splitter:8,mender:8};
    for(const [w,types] of waveBook){
      if(w<state.wave-4){waveBook.delete(w);continue;}
      types.forEach((type,i)=>{
        const due=(w-state.wave)*40+4*i;if(due<0)return;
        const maxHp=Math.floor(hp[type]*healthScale[w]/1000),fly=+(type==='wisp');
        newArrivals.push({due,x:50,y:fly?650:250,hp:maxHp,maxHp,type,air:fly,armor:type==='brute'?6+w:type==='grunt'?Math.floor(w/4):0,speed:speed[type],progress:0,remaining:fly?2800:4600,slowed:0,healPhase:-due});
      });
    }
    newArrivals.sort((a,b)=>a.due-b.due);
  }
  const values=[];
  function chooseTarget(type,damage,radiusSquared,candidates){
    for(let i=0;i<candidates.length;i++){
      const e=candidates[i],hit=Math.max(1,damage-(type==='lance'?0:e.armor));
      const urgency=1+179.6/(6.94+e.remaining/e.speed);
      const weight=e.type==='mender'?8.23:e.type==='runner'?1.33:e.type==='brute'?.17:e.air?1.94:1;
      const lethalBonus=e.hp<=hit?.87*hit:0;
      values[i]=weight*urgency*(Math.min(hit,e.hp)+lethalBonus)*(1+.5*(1-e.hp/e.maxHp));
      if(type==='frost'&&e.slowed)values[i]*=.08;
    }
    let best=-1,chosen=candidates[0];
    for(let i=0;i<candidates.length;i++){
      let score=values[i];
      const center=candidates[i];
      if(radiusSquared){
        for(let j=0;j<candidates.length;j++){
          if(i===j)continue;
          const dx=center.x-candidates[j].x,dy=center.y-candidates[j].y;
          if(dx*dx+dy*dy<=radiusSquared)score+=values[j];
        }
      }
      if(score>best){best=score;chosen=center;}
    }
    return chosen;
  }
  function estimate(state,change,horizon) {
    const units=state.enemies.map(e=>({
      x:e.x,y:e.y,hp:e.hp,maxHp:e.maxHp,type:e.type,air:e.air,armor:e.armor,speed:e.speed,
      progress:(e.air?2800:4600)-e.remaining,remaining:e.remaining,slowed:e.slowed?12:0,healPhase:Math.floor((e.air?2800-e.remaining:4600-e.remaining)/e.speed)%20
    }));
    const guns=[];
    for(const s of state.slots){
      if(!s.turret)continue;
      const swap=change&&change.slot===s.slot,type=swap?change.type:s.turret.type,w=weapons[type],tier=swap?3:s.turret.tier;
      guns.push({w,type,x:sites[s.slot][0],y:sites[s.slot][1],range2:(w.range+30*(tier-1))**2,damage:w.damage[tier-1],cool:swap?0:(s.slot*5+state.wave*3)%w.period});
    }
    let loss=0,life=state.baseHp,fall=false;
    const near=[];
    let arrival=0;
    for(let dt=0;dt<horizon;dt++){
      while(arrival<newArrivals.length && newArrivals[arrival].due<=dt)units.push({...newArrivals[arrival++]});
      for(const e of units)if(e.hp>0) {
        const speed=e.slowed>0?Math.floor(e.speed*.6):e.speed;
        e.progress+=speed;e.remaining-=speed;e.slowed=Math.max(0,e.slowed-1);
        if(e.remaining<=0){
          const damage=leakDamage[e.type];life-=damage;loss+=damage*(1.65-dt/horizon);
          if(life<=0&&!fall){loss+=12*(1-dt/horizon);fall=true;}e.hp=0;
        }else {const road=roads[e.air];e.x=road.xs[e.progress];e.y=road.ys[e.progress];}
      }
      for(const m of units)if(m.hp>0&&m.type==='mender'&&(dt+m.healPhase)%20<1){
        for(const e of units)if(e.hp>0&&(e.x-m.x)**2+(e.y-m.y)**2<=22500)e.hp=Math.min(e.maxHp,e.hp+Math.floor(.08*e.maxHp));
      }
      for(const gun of guns){
        gun.cool--;if(gun.cool>0)continue;gun.cool=0;
        near.length=0;
        for(const e of units){
          if(e.hp<=0||!(e.air?gun.w.air:gun.w.ground)||(e.x-gun.x)**2+(e.y-gun.y)**2>gun.range2)continue;
          near.push(e);
        }
        if(!near.length)continue;
        const chosen=chooseTarget(gun.type,gun.damage,gun.w.radius,near);
        gun.cool=gun.w.period;
        const hitCount=gun.w.radius?units.length:1;
        for(let hitIndex=0;hitIndex<hitCount;hitIndex++){
          const e=gun.w.radius?units[hitIndex]:chosen;
          if(e!==chosen && (e.hp<=0||!(e.air?gun.w.air:gun.w.ground)||(e.x-chosen.x)**2+(e.y-chosen.y)**2>gun.w.radius))continue;
          e.hp-=Math.max(1,gun.damage-(gun.type==='lance'?0:e.armor));
          if(gun.type==='frost')e.slowed=30;
          if(e.hp<=0&&e.type==='splitter'){
            const hp=Math.max(1,Math.floor(e.maxHp/4));
            for(let child=0;child<3;child++)units.push({...e,type:'splitling',maxHp:hp,hp,speed:12,slowed:0});
          }
        }
      }
    }
    for(const e of units)if(e.hp>0){const timeLeft=e.remaining/e.speed;loss+=leakDamage[e.type]*(e.hp/e.maxHp)*1.4/(1+timeLeft/27)**2;}
    return loss;
  }
  function reinforce(state,budget,actions){
    if(state.wave<35||budget<54||actions.length>26)return;
    const horizon=160,baseline=estimate(state,null,horizon);
    if(baseline<.38)return;
    let best=baseline,choice=null;
    for(const slot of [14,13,12,11,10,8,7,6,5,15]){
      const turret=state.slots[slot].turret;if(!turret||turret.tier!==3)continue;
      for(const type of ['cannon','flak','frost','lance']){
        if(turret.type===type)continue;
        const cost=4*price[type]-Math.floor(.7*turret.spent);
        if(cost>budget)continue;
        const trial={slot,type};
        const result=estimate(state,trial,horizon)+(.25+cost*.0015);
        if(result<best){best=result;choice=trial;}
      }
    }
    if(choice)actions.push({op:'sell',slot:choice.slot},{op:'build',...choice},{op:'upgrade',slot:choice.slot},{op:'upgrade',slot:choice.slot});
  }
  // Each row lists a weapon and the purchase priorities for its three tiers.
  const purchases = [
    ['cannon',0,27,27],  ['cannon',35,46,47], ['cannon',32,34,68], ['cannon',-26,22,33],
    ['cannon',9,15,29],  ['flak',26,42,63],   ['cannon',14,30,41], ['cannon',16,32,43],
    ['flak',1,28,48],    ['cannon',26,38,49], ['cannon',28,41,55], ['cannon',11,37,38],
    ['cannon',38,48,51], ['flak',10,33,37],   ['bolt',17,36,47],   ['flak',4,29,30]
  ];
  const purchaseOrder=[];
  purchases.forEach(([type,...ranks],slot)=>{
    ranks.forEach((rank,i)=>purchaseOrder.push({slot,type,rank,tier:i+1}));
  });
  purchaseOrder.sort((a,b)=>a.rank-b.rank);
  return {
    plan(state) {
      preview(state);
      const actions=[],tiers=state.slots.map(s=>s.turret?s.turret.tier:0);
      // Accumulate interest while the first batteries can hold the road.
      const reserve=Math.floor(600*Math.max(0,Math.min(1,(state.wave-9)/12,(27-state.wave)/4)));
      let gold=Math.max(0,state.gold-reserve);
      for(const {slot,type,tier} of purchaseOrder){
        if(tiers[slot]+1!==tier)continue;
        const amount=price[type]*(tier===3?2:1);
        if(amount>gold)break;
        actions.push(tier===1?{op:'build',slot,type}:{op:'upgrade',slot});
        gold-=amount;
        tiers[slot]=tier;
      }
      reinforce(state,gold,actions);
      return actions;
    },
    target(turret,candidates) {
      const w=weapons[turret.type];
      return chooseTarget(turret.type,w.damage[turret.tier-1],w.radius,candidates).id;
    }
  };
}
</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks) {
  function mulberry32(a) { return function () {
    a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return (t ^ (t >>> 14)) >>> 0; }; }
  const random=mulberry32(seed), floor=Math.floor, strategy=createStrategy();
  const observe=rampartSimulate.observe;
  const groundPath=[[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]];
  const airPath=[[0,6],[21,6],[21,11],[23,11]];
  const slots=[[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],[14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]].map(([x,y],slot)=>({slot,x:x*100+50,y:y*100+50,turret:null}));
  const types=['grunt','runner','wisp','brute','splitter','mender','splitling'];
  const first=[1,2,3,4,6,8], weights=[10,4,3,3,2,1];
  const health=[60,40,50,150,90,70,0], speeds=[10,20,12,6,8,8,12];
  const bounty=[4,4,6,9,6,7,1], leak=[1,1,2,3,2,2,1];
  const guns=['bolt','cannon','frost','lance','flak'];
  const costs=[50,90,70,120,80], power=[26,60,10,180,40], range=[300,260,240,360,320], period=[8,24,12,36,10], splash=[0,90,0,0,70];
  let tick=0,wave=0,gold=250,baseHp=10,fallTick=-1,serial=0,enemies=[],queue=[],log=[],events=[];
  let multipliers=[0,1000], next=composition(1);
  function composition(w) {
    let n=first.filter(f=>f<=w).length, total=weights.slice(0,n).reduce((a,b)=>a+b,0);
    return Array.from({length:4+floor(3*w/5)},()=>{
      let r=random()%total,i=0;
      while(r>=weights[i]) r-=weights[i++];
      return i;
    });
  }
  function place(e) {
    const path=e.air ? airPath:groundPath;
    let distance=e.progress;
    for(let i=1;i<path.length;i++) {
      const [x,y]=path[i-1],dx=path[i][0]-x,dy=path[i][1]-y;
      const length=(Math.abs(dx)+Math.abs(dy))*100;
      if(distance<length || i===path.length-1) {
        e.x=x*100+50+Math.sign(dx)*distance; e.y=y*100+50+Math.sign(dy)*distance;
        e.dx=Math.sign(dx); e.dy=Math.sign(dy); break;
      }
      distance-=length;
    }
    // The three air segments total 2800, the length used by both check vectors.
    e.remaining=(e.air?2800:4600)-e.progress;
  }
  function spawn(kind,w,progress=0,hp=floor(health[kind]*multipliers[w]/1000)) {
    const e={id:++serial,type:types[kind],kind,w,progress,hp,maxHp:hp,air:+(kind===2),armor:kind===0?floor(w/4):kind===3?6+w:0,speed:speeds[kind],slowed:0,age:0};
    place(e); enemies.push(e);
  }
  function view(e) {
    const {id,type,hp,maxHp,x,y,air,armor,speed,slowed,remaining}=e;
    return {id,type,hp,maxHp,x,y,air,armor,speed,slowed,remaining};
  }
  function slotView(s) {
    const t=s.turret;
    return {slot:s.slot,x:s.x,y:s.y,turret:t?{type:t.type,tier:t.tier,spent:t.spent}:null};
  }
  function event(code,x,y,other={}) {if(observe) events.push({code,x,y,...other});}
  function waveStart() {
    wave++;
    if(wave>1) multipliers[wave]=floor(multipliers[wave-1]*108/100);
    gold+=Math.min(50,floor(gold*5/100))+10+2*wave;
    const current=next; next=composition(wave+1);
    event('wave',0,2.5);
    const actions=strategy.plan({tick,wave,gold,baseHp,slots:slots.map(slotView),enemies:enemies.map(view),nextWave:next.map(i=>types[i])});
    for(const a of (Array.isArray(actions)?actions:[]).slice(0,32)) {
      if(!a || !Number.isInteger(a.slot) || a.slot<0 || a.slot>=slots.length) continue;
      const s=slots[a.slot],t=s.turret,kind=guns.indexOf(a.type);
      if(a.op==='build' && !t && kind>=0 && gold>=costs[kind]) {
        gold-=costs[kind];s.turret={type:a.type,kind,tier:1,spent:costs[kind],cool:0,damage:power[kind],range:range[kind],angle:0};
        log.push([tick,'B',s.slot,kind]);event('build',s.x/100,s.y/100);
      } else if(a.op==='upgrade' && t && t.tier<3 && gold>=t.tier*costs[t.kind]) {
        const price=t.tier*costs[t.kind];gold-=price;t.spent+=price;t.tier++;t.range+=30;t.damage=floor(t.damage*16/10);
        log.push([tick,'U',s.slot,t.tier]);event('upgrade',s.x/100,s.y/100);
      } else if(a.op==='sell' && t) {
        gold+=floor(t.spent*70/100);s.turret=null;log.push([tick,'S',s.slot,0]);event('sell',s.x/100,s.y/100);
      }
    }
    current.forEach((kind,i)=>queue.push({kind,w:wave,due:tick+4*i,i}));
    queue.sort((a,b)=>a.due-b.due || a.w-b.w || a.i-b.i);
  }
  function within(a,b,r) {const dx=a.x-b.x,dy=a.y-b.y;return dx*dx+dy*dy<=r*r;}

const baseCamera=new T.Vector3(),focus=new T.Vector3(12,.25,7);
function resize() {

  renderer.setSize(window.innerWidth, window.innerHeight, false);
  camera.aspect=w/h;camera.updateProjectionMatrix();
  const direction=new T.Vector3(2.4,27.5,21.1).normalize();
  const corners=[];
  for(const x of [-.86,24.87])for(const z of [-.82,14.82])for(const y of [-1.25,1.01])corners.push(new T.Vector3(x,y,z));
  corners.push(new T.Vector3(23.5,3.6,11.6),new T.Vector3(.25,2.6,2.5));
  const top=clamp(h*.073,23,83),bottom=clamp(h*.139,91,146),available=2*(1-(top+bottom)/h);
  let dist=16,offset=0;
  for(;dist<320;dist+=.12){
    camera.position.copy(focus).addScaledVector(direction,dist);camera.lookAt(focus);camera.updateMatrixWorld();
    let ymin=Infinity,ymax=-Infinity,extent=0;
    for(const v of corners){const p=v.clone().project(camera);ymin=Math.min(ymin,p.y);ymax=Math.max(ymax,p.y);extent=Math.max(extent,Math.abs(p.x));}
    if(ymax-ymin<=available && extent<=.968){offset=(bottom-top)/h-(ymax+ymin)/2;break;}
  }
  camera.projectionMatrix.elements[9]-=offset;camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
  baseCamera.copy(camera.position);toCamRight.set(1,0,0).applyQuaternion(camera.quaternion);
  hudCamera.right=w;hudCamera.bottom=h;hudCamera.updateProjectionMatrix();hudKey='';
}
function smoothNoise(t,phase){

function render(time){

// One audio graph, with all voices owned by the current playback interval.
function soundEngine(){
  const Audio=window.AudioContext||window.webkitAudioContext;

  for(let i=0;i<samples.length;i++)samples[i]=rng()*2-1;
  for(const f of frameData)for(const e of f.events)e.pitch=.95+rng()*.1;
  const voices=new Set();let wind=null,playing=false,shotTimes=[],popTime=-Infinity;

    src.onended=()=>{voices.delete(src);src.disconnect();filter.disconnect();envelope.disconnect();panner.disconnect();};
    src.start(now);src.stop(now+length+.006);
  }
  function windOn(){
    if(wind||!playing||ctx.state!=='running')return;
    const src=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),gain=ctx.createGain();
    src.buffer=noise;src.loop=true;src.playbackRate.value=.68;

    for(const f of frameData){
      const bin=Math.floor(f.tick*12/(20*rate));
      for(const e of f.events)if(e.code==='shot'){
        const prev=buckets.get(bin);

    if(e.kind===1){voice('sine',138*v,42,.22,.37,p);voice('noise',.78,0,.125,.20,p,1400);}
    if(e.kind===2){voice('sine',890*v,1340,.15,.12,p);voice('triangle',1350*v,730,.12,.052,p);}
    if(e.kind===3){voice('sawtooth',580*v,72,.19,.15,p,1450);voice('sine',220,55,.16,.2,p);}
    if(e.kind===4){voice('noise',1.2,0,.115,.19,p,3600);voice('triangle',420*v,190,.09,.12,p);}
  }

const sound=soundEngine();
function unlock(){sound.resume();window.removeEventListener('pointerdown',unlock);window.removeEventListener('keydown',unlock);}

const countdown=document.getElementById('countdown'),scrubber=document.getElementById('scrubber'),toggle=document.getElementById('btn-toggle');

function transition(s) {
