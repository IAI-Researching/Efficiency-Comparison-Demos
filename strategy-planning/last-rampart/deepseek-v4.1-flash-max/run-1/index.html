<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wave Defense</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="100" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script id="rampart-strategy">
function createStrategy() {
  "use strict";
  // Fixed map knowledge (matches the reference arena geometry).
  var SLOT_POS = [
    [3, 3], [5, 5], [7, 4], [7, 8], [9, 9], [10, 5], [11, 8], [13, 8],
    [14, 5], [15, 2], [16, 7], [17, 4], [19, 8], [20, 10], [22, 9], [3, 7]
  ];
  var GROUND_PTS = [[0, 2], [6, 2], [6, 10], [12, 10], [12, 3], [18, 3], [18, 11], [23, 11]];
  var AIR_PTS = [[0, 6], [21, 6], [21, 11], [23, 11]];
  var TURRET = {
    bolt: { cost: 50, damage: 26, period: 8, range: 300, ground: 1, air: 1 },
    cannon: { cost: 90, damage: 60, period: 24, range: 260, ground: 1, air: 0 },
    frost: { cost: 70, damage: 10, period: 12, range: 240, ground: 1, air: 1 },
    lance: { cost: 120, damage: 180, period: 36, range: 360, ground: 1, air: 0 },
    flak: { cost: 80, damage: 40, period: 10, range: 320, ground: 0, air: 1 }
  };
  var DAMAGE = {
    bolt: [26, 41, 65], cannon: [60, 96, 153], frost: [10, 16, 25],
    lance: [180, 288, 460], flak: [40, 64, 102]
  };
  // Final layout: slot -> turret type. Hybrid flak/bolt slots cover the air lane
  // while cannons own the dense ground kill zones.
  var LAYOUT = [
    "flak", "cannon", "cannon", "cannon", "cannon", "cannon", "cannon", "cannon",
    "cannon", "cannon", "cannon", "cannon", "bolt", "bolt", "flak", "flak"
  ];
  // Build order: two early cannons, early air coverage, then the rest.
  var BUILD_ORDER = [4, 3, 12, 14, 9, 8, 6, 11, 13, 0, 1, 2, 7, 5, 10, 15];

  function route(pts) {
    var segs = [], total = 0;
    for (var i = 0; i < pts.length - 1; i++) {
      var ax = pts[i][0] * 100 + 50, ay = pts[i][1] * 100 + 50;
      var bx = pts[i + 1][0] * 100 + 50, by = pts[i + 1][1] * 100 + 50;
      var dx = bx - ax, dy = by - ay, len = Math.abs(dx) + Math.abs(dy);
      segs.push({ ax: ax, ay: ay, dx: dx, dy: dy, len: len });
      total += len;
    }
    return { segs: segs, total: total };
  }
  var GR = route(GROUND_PTS), AR = route(AIR_PTS);
  function covOn(r, sx, sy, range) {
    var cov = 0, r2 = range * range;
    for (var si = 0; si < r.segs.length; si++) {
      var s = r.segs[si];
      var n = Math.ceil(s.len / 8);
      for (var k = 0; k < n; k++) {
        var u = (k + 0.5) / n;
        var dx = s.ax + s.dx * u - sx, dy = s.ay + s.dy * u - sy;
        if (dx * dx + dy * dy <= r2) cov += s.len / n;
      }
    }
    return cov;
  }
  var SXY = [];
  for (var si2 = 0; si2 < SLOT_POS.length; si2++) SXY.push([SLOT_POS[si2][0] * 100 + 50, SLOT_POS[si2][1] * 100 + 50]);
  var covCache = {};
  function coverage(type, slot, tier) {
    var key = type + "|" + slot + "|" + tier;
    if (covCache[key] !== undefined) return covCache[key];
    var def = TURRET[type];
    var range = def.range + (tier - 1) * 30;
    var res = {
      g: def.ground ? covOn(GR, SXY[slot][0], SXY[slot][1], range) : 0,
      a: def.air ? covOn(AR, SXY[slot][0], SXY[slot][1], range) : 0
    };
    covCache[key] = res;
    return res;
  }
  var SG = 9.65, SA = 12, AIRW = 1.1;
  function value(type, slot, tier) {
    if (!TURRET[type]) return 0;
    var def = TURRET[type];
    var dmg = DAMAGE[type][tier - 1];
    if (!(dmg > 0)) return 0;
    var dps = dmg / def.period;
    var c = coverage(type, slot, tier);
    var g = c.g / SG, a = AIRW * c.a / SA;
    var v = dps * (g + a);
    if (type === "frost") v += 2.2 * (g + a);
    return v;
  }
  var BUILDS = [];
  for (var bo = 0; bo < BUILD_ORDER.length; bo++) {
    var bs = BUILD_ORDER[bo];
    BUILDS.push({ slot: bs, type: LAYOUT[bs] });
  }

  return {
    plan: function (s) {
      try {
        var actions = [];
        if (!s || typeof s !== "object") return actions;
        var gold = typeof s.gold === "number" && isFinite(s.gold) ? s.gold : 0;
        var wave = typeof s.wave === "number" && isFinite(s.wave) ? s.wave : 1;
        var occ = new Array(16).fill(null);
        var slots = s.slots;
        if (Array.isArray(slots)) {
          for (var i = 0; i < slots.length && i < 16; i++) {
            var sl = slots[i];
            if (!sl || !sl.turret) continue;
            var tt = sl.turret.type;
            if (!TURRET[tt]) continue;
            var tr = sl.turret.tier;
            if (tr !== 2 && tr !== 3) tr = 1;
            occ[i] = { t: tt, tier: tr };
          }
        }
        // Gold reserve schedule: hoard early for the 5% wave interest, then
        // release the reserve to finish the upgrade curve as the pressure builds.
        var reserve;
        if (wave <= 25) reserve = 250;
        else if (wave >= 35) reserve = 0;
        else reserve = 250 * (35 - wave) / 10;
        // Strict build order: save for the next planned tower.
        var canUpgrade = true;
        for (var nb = 0; nb < BUILDS.length; nb++) {
          if (!occ[BUILDS[nb].slot]) { canUpgrade = false; break; }
        }
        for (var bi = 0; bi < BUILDS.length; bi++) {
          var b = BUILDS[bi];
          if (occ[b.slot]) continue;
          var cost = TURRET[b.type].cost;
          if (gold - cost < reserve) break;
          actions.push({ op: "build", slot: b.slot, type: b.type });
          gold -= cost;
          occ[b.slot] = { t: b.type, tier: 1 };
          if (actions.length >= 32) return actions;
        }
        if (!canUpgrade) return actions;
        // Upgrades: first bring everything to tier 2, then tier 3 by marginal
        // coverage-weighted value per gold.
        for (var guard = 0; guard < 32; guard++) {
          var best = null;
          for (var k = 0; k < 16; k++) {
            var o = occ[k];
            if (!o || o.tier >= 3) continue;
            var upcost = o.tier === 1 ? TURRET[o.t].cost : TURRET[o.t].cost * 2;
            if (upcost > gold - reserve) continue;
            var dv = value(o.t, k, o.tier + 1) - value(o.t, k, o.tier);
            var rank = (o.tier === 1 ? 1e6 : 0) + dv / upcost;
            if (!best || rank > best.rank) best = { slot: k, cost: upcost, rank: rank };
          }
          if (!best) break;
          actions.push({ op: "upgrade", slot: best.slot });
          gold -= best.cost;
          occ[best.slot].tier += 1;
          if (actions.length >= 32) break;
        }
        return actions;
      } catch (e) {
        return [];
      }
    },
    target: function (turret, cands) {
      try {
        if (!turret || !Array.isArray(cands) || cands.length === 0) return null;
        var type = turret.type;
        var tier = turret.tier === 2 || turret.tier === 3 ? turret.tier : 1;
        if (type === "cannon" || type === "flak") {
          // Aim splash at the point that maximises real damage, with a heavy
          // preference for ending mender healing and for targets close to leaking.
          var radius = type === "cannon" ? 90 : 70;
          var r2 = radius * radius;
          var dmg = DAMAGE[type][tier - 1];
          var K = type === "cannon" ? 80 : 30;
          var best = null, bestScore = -1;
          for (var i = 0; i < cands.length; i++) {
            var e = cands[i];
            if (!e) continue;
            var valueSum = 0;
            for (var j = 0; j < cands.length; j++) {
              var o = cands[j];
              if (!o) continue;
              var dx = (o.x || 0) - (e.x || 0), dy = (o.y || 0) - (e.y || 0);
              if (dx * dx + dy * dy > r2) continue;
              var eff = Math.max(1, dmg - (o.armor || 0));
              var wt = 1;
              if (o.type === "mender") wt = 80;
              valueSum += wt * Math.min(eff, o.hp > 0 ? o.hp : 0);
            }
            var rem = e.remaining > 0 ? e.remaining : 0;
            var score = valueSum / (1 + rem / K) - rem * 1e-6;
            if (score > bestScore) { bestScore = score; best = e; }
          }
          if (best && typeof best.id === "number") return best.id;
          return null;
        }
        // Bolts/lances/frost use the engine default (closest to leaking);
        // bolts double as air cover and this is the safest focus policy.
        return null;
      } catch (e2) {
        return null;
      }
    }
  };
}

</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks) {
  const TYPES = ["grunt", "runner", "wisp", "brute", "splitter", "mender"];
  const FIRST = { grunt: 1, runner: 2, wisp: 3, brute: 4, splitter: 6, mender: 8 };
  const WEIGHT = { grunt: 10, runner: 4, wisp: 3, brute: 3, splitter: 2, mender: 1 };
  const BASE_HP = { grunt: 60, runner: 40, wisp: 50, brute: 150, splitter: 90, mender: 70 };
  const SPEED = { grunt: 10, runner: 20, wisp: 12, brute: 6, splitter: 8, mender: 8, splitling: 12 };
  const BOUNTY = { grunt: 4, runner: 4, wisp: 6, brute: 9, splitter: 6, mender: 7, splitling: 1 };
  const LEAK = { grunt: 1, runner: 1, wisp: 2, brute: 3, splitter: 2, mender: 2, splitling: 1 };
  const AIR = { grunt: 0, runner: 0, wisp: 1, brute: 0, splitter: 0, mender: 0, splitling: 0 };
  const TURRET_TYPES = ["bolt", "cannon", "frost", "lance", "flak"];
  const TURRET = {
    bolt:    { cost: 50,  damage: 26,  period: 8,  range: 300, splash: 0,  slow: 0,  pierce: 0, ground: 1, air: 1 },
    cannon:  { cost: 90,  damage: 60,  period: 24, range: 260, splash: 90, slow: 0,  pierce: 0, ground: 1, air: 0 },
    frost:   { cost: 70,  damage: 10,  period: 12, range: 240, splash: 0,  slow: 30, pierce: 0, ground: 1, air: 1 },
    lance:   { cost: 120, damage: 180, period: 36, range: 360, splash: 0,  slow: 0,  pierce: 1, ground: 1, air: 0 },
    flak:    { cost: 80,  damage: 40,  period: 10, range: 320, splash: 70, slow: 0,  pierce: 0, ground: 0, air: 1 }
  };
  const SLOT_POS = [
    [3, 3], [5, 5], [7, 4], [7, 8], [9, 9], [10, 5], [11, 8], [13, 8],
    [14, 5], [15, 2], [16, 7], [17, 4], [19, 8], [20, 10], [22, 9], [3, 7]
  ];

  const GROUND_PTS = [[0, 2], [6, 2], [6, 10], [12, 10], [12, 3], [18, 3], [18, 11], [23, 11]];
  const AIR_PTS = [[0, 6], [21, 6], [21, 11], [23, 11]];

  function routeFromPoints(points) {
    const segs = [];
    let total = 0;
    for (let i = 0; i < points.length - 1; i++) {
      const ax = points[i][0] * 100 + 50, ay = points[i][1] * 100 + 50;
      const bx = points[i + 1][0] * 100 + 50, by = points[i + 1][1] * 100 + 50;
      const dx = bx - ax, dy = by - ay;
      const len = Math.abs(dx) + Math.abs(dy);
      segs.push({ ax, ay, bx, by, dx, dy, len, start: total });
      total += len;
    }
    return { points: points, segs: segs, total: total, length: total };
  }
  const groundRoute = routeFromPoints(GROUND_PTS);
  const airRoute = routeFromPoints(AIR_PTS);
  airRoute.length = airRoute.total;

  function routePoint(route, progress) {
    let p = progress;
    if (p < 0) p = 0;
    const segs = route.segs;
    let last = segs[segs.length - 1];
    for (let i = 0; i < segs.length; i++) {
      const s = segs[i];
      if (p <= s.start + s.len || i === segs.length - 1) {
        const d = Math.min(Math.max(p - s.start, 0), s.len);
        const u = s.len > 0 ? d / s.len : 0;
        return {
          x: s.ax + s.dx * u,
          y: s.ay + s.dy * u,
          dirx: s.dx === 0 ? 0 : (s.dx > 0 ? 1 : -1),
          diry: s.dy === 0 ? 0 : (s.dy > 0 ? 1 : -1)
        };
      }
    }
    return { x: last.bx, y: last.by, dirx: 1, diry: 0 };
  }

  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return (t ^ (t >>> 14)) >>> 0;
    };
  }

  const rand = mulberry32(seed >>> 0);
  const hpMult = [0, 1000];
  function hpMul(w) {
    while (hpMult.length <= w) {
      const n = hpMult.length;
      hpMult[n] = Math.floor(hpMult[n - 1] * 108 / 100);
    }
    return hpMult[w];
  }
  function generateWave(w) {
    const avail = [];
    let sum = 0;
    for (let i = 0; i < TYPES.length; i++) {
      const t = TYPES[i];
      if (FIRST[t] <= w) { avail.push(t); sum += WEIGHT[t]; }
    }
    const n = 4 + Math.floor(3 * w / 5);
    const out = new Array(n);
    for (let i = 0; i < n; i++) {
      let r = rand() % sum;
      for (let j = 0; j < avail.length; j++) {
        const t = avail[j];
        if (r < WEIGHT[t]) { out[i] = t; break; }
        r -= WEIGHT[t];
      }
    }
    return out;
  }
  function tierDamage(base, tier) {
    let d = base;
    if (tier >= 2) d = Math.floor(d * 16 / 10);
    if (tier >= 3) d = Math.floor(d * 16 / 10);
    return d;
  }

  const strategy = createStrategy();
  const record = maxTicks <= 3000;
  const log = [];
  let hash = 0;
  let gold = 250;
  let baseHp = 10;
  let nextId = 1;
  let enemies = [];
  let slots = new Array(16).fill(null);
  let spawnQueue = [];
  let wave = 0;
  let fallTick = -1;
  let fallWave = 0;
  let endTick = maxTicks;
  let tick = 0;

  // Wave 1 is drawn before the first wave starts; every following wave is
  // drawn at the start of the previous one, as required by the preview API.
  let upcomingComp = generateWave(1);
  let previewComp = upcomingComp.slice();
  let generatedWave = 1;
  let lastAim = new Array(16).fill(null);

  const shots = [];
  const kills = [];
  const leaks = [];
  const heals = [];
  const buildFx = [];
  const waveFx = [];
  const frameList = [];
  let fallFx = null;

  function addLog(e) { log.push(e); }

  function enemySpeed(e) {
    return e.slow > 0 ? Math.floor(e.speed * 60 / 100) : e.speed;
  }
  function refreshPosition(e) {
    const r = e.route;
    const pt = routePoint(r, e.progress);
    e.x = pt.x; e.y = pt.y; e.dirx = pt.dirx; e.diry = pt.diry;
    e.remaining = r.length - e.progress;
  }
  function makeEnemy(type, w, progress, hpOverride, isSplitling) {
    let maxHp, armor;
    if (type === "splitling") {
      maxHp = hpOverride;
      armor = 0;
    } else {
      maxHp = Math.floor(BASE_HP[type] * hpMul(w) / 1000);
      armor = type === "grunt" ? Math.floor(w / 4) : (type === "brute" ? 6 + w : 0);
    }
    const route = AIR[type] ? airRoute : groundRoute;
    const e = {
      id: nextId++,
      type: type,
      wave: w,
      hp: maxHp,
      maxHp: maxHp,
      speed: SPEED[type],
      armor: armor,
      air: AIR[type],
      route: route,
      progress: progress,
      remaining: route.length - progress,
      x: 0, y: 0, dirx: 1, diry: 0,
      age: 0,
      slow: 0
    };
    refreshPosition(e);
    return e;
  }
  function enemyView(e) {
    return {
      id: e.id, type: e.type, hp: e.hp, maxHp: e.maxHp,
      x: e.x, y: e.y, air: e.air, armor: e.armor,
      speed: e.speed, slowed: e.slow > 0 ? true : false,
      remaining: e.remaining
    };
  }
  function planState() {
    const sl = [];
    for (let i = 0; i < 16; i++) {
      const t = slots[i];
      sl.push({
        slot: i,
        x: SLOT_POS[i][0] * 100 + 50,
        y: SLOT_POS[i][1] * 100 + 50,
        turret: t ? { type: t.type, tier: t.tier, spent: t.spent } : null
      });
    }
    return {
      tick: tick,
      wave: wave,
      gold: gold,
      baseHp: baseHp,
      slots: sl,
      enemies: enemies.map(enemyView),
      nextWave: previewComp.slice()
    };
  }
  function validAction(a) {
    return a && typeof a === "object" && typeof a.op === "string";
  }
  function applyPlan(actions) {
    if (!Array.isArray(actions)) return;
    const n = Math.min(actions.length, 32);
    for (let k = 0; k < n; k++) {
      const a = actions[k];
      if (!validAction(a)) continue;
      const slot = a.slot;
      if (!Number.isInteger(slot) || slot < 0 || slot >= 16) continue;
      if (a.op === "build") {
        if (slots[slot]) continue;
        if (!Object.prototype.hasOwnProperty.call(TURRET, a.type)) continue;
        const def = TURRET[a.type];
        if (gold < def.cost) continue;
        gold -= def.cost;
        slots[slot] = {
          slot: slot, type: a.type, tier: 1, spent: def.cost,
          cooldown: 0, aimx: SLOT_POS[slot][0] * 100 + 50, aimy: SLOT_POS[slot][1] * 100 + 50
        };
        lastAim[slot] = null;
        addLog([tick, "B", slot, TURRET_TYPES.indexOf(a.type)]);
        if (record) buildFx.push({ tick: tick, slot: slot, action: "build", type: a.type, tier: 1 });
      } else if (a.op === "upgrade") {
        const t = slots[slot];
        if (!t || t.tier >= 3) continue;
        const def = TURRET[t.type];
        const cost = t.tier === 1 ? def.cost : def.cost * 2;
        if (gold < cost) continue;
        gold -= cost;
        t.tier += 1;
        t.spent += cost;
        addLog([tick, "U", slot, t.tier]);
        if (record) buildFx.push({ tick: tick, slot: slot, action: "upgrade", type: t.type, tier: t.tier });
      } else if (a.op === "sell") {
        const t = slots[slot];
        if (!t) continue;
        const refund = Math.floor(t.spent * 70 / 100);
        gold += refund;
        const type = t.type;
        slots[slot] = null;
        lastAim[slot] = null;
        addLog([tick, "S", slot, 0]);
        if (record) buildFx.push({ tick: tick, slot: slot, action: "sell", type: type, tier: 0, refund: refund });
      }
    }
  }

  function spawnDue() {
    spawnQueue.sort((a, b) => (a.tick - b.tick) || (a.wave - b.wave) || (a.index - b.index));
    while (spawnQueue.length && spawnQueue[0].tick === tick) {
      const q = spawnQueue.shift();
      enemies.push(makeEnemy(q.type, q.wave, 0, 0, false));
    }
  }

  function recordDeaths(turretSlot, killList) {
    if (!killList.length) return;
    killList.sort((a, b) => a.id - b.id);
    for (let ki = 0; ki < killList.length; ki++) {
      const dead = killList[ki];
      const idx = enemies.indexOf(dead);
      if (idx < 0) continue;
      enemies.splice(idx, 1);
      gold += BOUNTY[dead.type];
      addLog([tick, "K", dead.id, turretSlot]);
      if (record) {
        kills.push({
          tick: tick, id: dead.id, type: dead.type, x: dead.x, y: dead.y,
          hp: dead.hp, maxHp: dead.maxHp, slot: turretSlot,
          split: dead.type === "splitter" ? 1 : 0
        });
      }
      if (dead.type === "splitter") {
        const splitHp = Math.max(1, Math.floor(dead.maxHp / 4));
        for (let s = 0; s < 3; s++) {
          const child = makeEnemy("splitling", dead.wave, dead.progress, splitHp, true);
          enemies.push(child);
        }
      }
    }
    // New splitlings have larger ids and are appended, preserving ascending id.
  }

  function lightHit(e, def, tier, armorPierce, slowTicks) {
    let dmg = tierDamage(def.damage, tier);
    if (!armorPierce) dmg = Math.max(1, dmg - e.armor);
    if (dmg < 1) dmg = 1;
    e.hp -= dmg;
    if (slowTicks > 0) e.slow = slowTicks;
  }

  function startWave(w) {
    wave = w;
    gold += Math.min(50, Math.floor(gold * 5 / 100)) + 10 + 2 * w;
    if (record) waveFx.push({ tick: tick, wave: w });
    // Generate wave w+1 now for planning and preview.
    generatedWave = w + 1;
    const nextComp = generateWave(generatedWave);
    const thisComp = upcomingComp;
    previewComp = nextComp;
    let actions;
    try {
      actions = strategy.plan(planState());
    } catch (err) {
      throw err;
    }
    applyPlan(actions);
    // Queue this wave's spawns after the plan has been applied.
    for (let i = 0; i < thisComp.length; i++) {
      spawnQueue.push({ tick: tick + 4 * i, wave: w, index: i, type: thisComp[i] });
    }
    upcomingComp = nextComp;
  }

  function pointTargets(def, turret) {
    const cands = [];
    const rangeSq = turret.range * turret.range;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (e.hp <= 0) continue;
      if (e.air ? !def.air : !def.ground) continue;
      const dx = e.x - turret.x, dy = e.y - turret.y;
      if (dx * dx + dy * dy <= rangeSq) cands.push(e);
    }
    return cands;
  }

  function snapshot() {
    const es = new Array(enemies.length);
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      es[i] = {
        id: e.id, type: e.type, hp: e.hp, maxHp: e.maxHp,
        x: e.x, y: e.y, slowed: e.slow > 0 ? 1 : 0,
        dirx: e.dirx, diry: e.diry
      };
    }
    const ts = new Array(16);
    for (let i = 0; i < 16; i++) {
      const t = slots[i];
      ts[i] = t ? {
        type: t.type, tier: t.tier, aimx: t.aimx, aimy: t.aimy
      } : null;
    }
    return {
      tick: tick, wave: wave, gold: gold, baseHp: baseHp,
      enemies: es, turrets: ts, preview: previewComp.slice()
    };
  }

  let aborted = false;
  for (tick = 0; tick < maxTicks; tick++) {
    if (tick >= 20 && (tick - 20) % 40 === 0) {
      startWave((tick - 20) / 40 + 1);
    }
    spawnDue();

    // 3. move
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      const sp = enemySpeed(e);
      e.progress += sp;
      if (e.progress >= e.route.length) {
        enemies.splice(i, 1);
        i--;
        baseHp -= LEAK[e.type];
        addLog([tick, "L", e.id, baseHp]);
        if (record) leaks.push({ tick: tick, id: e.id, type: e.type, x: e.x, y: e.y, hpAfter: baseHp, wave: e.wave });
        if (baseHp <= 0) {
          fallTick = tick;
          fallWave = wave;
          addLog([tick, "F", wave, 0]);
          if (record) fallFx = { tick: tick, wave: wave, x: e.x, y: e.y, baseHp: baseHp };
          aborted = true;
          break;
        }
      } else {
        refreshPosition(e);
      }
    }
    if (aborted) {
      if (record) frameList[tick] = snapshot();
      break;
    }

    // 4. age & mender heals
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      e.age += 1;
      if (e.type === "mender" && e.age % 20 === 0) {
        const r2 = 150 * 150;
        const amount = Math.floor(e.maxHp * 8 / 100);
        if (record) heals.push({ tick: tick, id: e.id, x: e.x, y: e.y, amount: amount });
        for (let j = 0; j < enemies.length; j++) {
          const o = enemies[j];
          const dx = o.x - e.x, dy = o.y - e.y;
          if (dx * dx + dy * dy <= r2) o.hp = Math.min(o.maxHp, o.hp + Math.floor(o.maxHp * 8 / 100));
        }
      }
    }

    // 5. turrets fire
    for (let s = 0; s < 16; s++) {
      const t = slots[s];
      if (!t) continue;
      const def = TURRET[t.type];
      if (t.cooldown > 0) {
        t.cooldown -= 1;
        if (t.cooldown > 0) continue;
      }
      const tx = SLOT_POS[s][0] * 100 + 50;
      const ty = SLOT_POS[s][1] * 100 + 50;
      const range = def.range + (t.tier - 1) * 30;
      const turretView = { slot: s, type: t.type, tier: t.tier, x: tx, y: ty, range: range };
      const cands = pointTargets(def, { x: tx, y: ty, range: range });
      if (!cands.length) continue;
      let chosen = null;
      if (typeof strategy.target === "function") {
        let ret;
        try {
          ret = strategy.target(
            { slot: s, type: t.type, tier: t.tier, x: tx, y: ty, range: range },
            cands.map(enemyView)
          );
        } catch (err) {
          throw err;
        }
        for (let ci = 0; ci < cands.length; ci++) {
          if (cands[ci].id === ret) { chosen = cands[ci]; break; }
        }
      }
      if (!chosen) {
        for (let ci = 0; ci < cands.length; ci++) {
          const e = cands[ci];
          if (!chosen || e.remaining < chosen.remaining ||
              (e.remaining === chosen.remaining && e.id < chosen.id)) chosen = e;
        }
      }
      const targetX = chosen.x, targetY = chosen.y;
      t.aimx = targetX; t.aimy = targetY;
      // Apply damage (splash checks are made against the pre-damage living set).
      if (def.splash > 0) {
        const sr2 = def.splash * def.splash;
        for (let ci = 0; ci < enemies.length; ci++) {
          const e = enemies[ci];
          if (e.hp <= 0) continue;
          if (e.air ? !def.air : !def.ground) continue;
          const dx = e.x - targetX, dy = e.y - targetY;
          if (dx * dx + dy * dy <= sr2) lightHit(e, def, t.tier, def.pierce, def.slow);
        }
      } else {
        lightHit(chosen, def, t.tier, def.pierce, def.slow);
      }
      t.cooldown = def.period;
      if (record) shots.push({
        tick: tick, slot: s, type: t.type, tier: t.tier,
        x0: tx, y0: ty, x1: targetX, y1: targetY,
        splash: def.splash, targetId: chosen.id, air: chosen.air, targetType: chosen.type
      });
      const dead = [];
      for (let ci = 0; ci < enemies.length; ci++) if (enemies[ci].hp <= 0) dead.push(enemies[ci]);
      recordDeaths(s, dead);
    }

    // 6. slow timers
    for (let i = 0; i < enemies.length; i++) {
      if (enemies[i].slow > 0) enemies[i].slow -= 1;
    }

    if (record) frameList[tick] = snapshot();
  }

  if (fallTick < 0) endTick = maxTicks; else endTick = fallTick;
  let score;
  if (fallTick >= 0) score = Math.round(((fallTick - 20) / 40) * 100) / 100;
  else score = Math.round(((maxTicks - 20) / 40) * 100) / 100;

  const json = JSON.stringify(log);
  hash = 0x811c9dc5;
  for (let i = 0; i < json.length; i++) {
    hash ^= json.charCodeAt(i);
    hash = Math.imul(hash, 0x01000193);
  }
  hash = hash >>> 0;
  const hashStr = ("00000000" + hash.toString(16)).slice(-8);

  const result = { score: score, fallTick: fallTick, log: log, hash: hashStr };
  if (record) {
    result.frames = frameList;
    result.shots = shots;
    result.kills = kills;
    result.leaks = leaks;
    result.heals = heals;
    result.builds = buildFx;
    result.waves = waveFx;
    result.fall = fallFx;
    result.seed = seed;
    result.endTick = endTick;
  }
  return result;
}

      centerMaxY = Math.max(centerMaxY, testPoint.y);
    }
    const boardCenterY = (centerMinY + centerMaxY) * 0.5;
    camera.projectionMatrix.elements[9] += boardCenterY;
    camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();

    hudCamera.left = 0;
    hudCamera.right = W;
    hudCamera.top = H;
    hudCamera.bottom = 0;
    hudCamera.updateProjectionMatrix();
    hudLayoutDirty = true;
  }

  let hudLayoutDirty = true;

  function applyResize() {
    const W = Math.max(1, window.innerWidth);
    const H = Math.max(1, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(W, H, false);
    fitCamera();
    if (typeof hud !== "undefined" && hud && hud.reflow) {
      hud.reflow(W, H);
      hudLayoutDirty = false;
    }
    renderCurrent(true);
  }

  // ------------------------------------------------------------------
  // Procedural in-memory textures (never attached to the DOM)
  // ------------------------------------------------------------------
  const visualRandom = (() => { const r = mulberry32(42); return () => r() / 4294967296; })();
  const maxAnisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());

  function textureFromCanvas(canvas, repeatX, repeatY) {
    const tex = new THREE.CanvasTexture(canvas);
    tex.encoding = THREE.sRGBEncoding;
    if (repeatX || repeatY) {
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(repeatX || 1, repeatY || 1);
    }
    tex.anisotropy = maxAnisotropy;
    tex.needsUpdate = true;
    return tex;
  }

  function createGroundTexture() {
    const c = makeCanvas(512, 512);
    const ctx = c.getContext("2d");
    const img = ctx.createImageData(512, 512);
    const data = img.data;
    for (let y = 0; y < 512; y++) {
      for (let x = 0; x < 512; x++) {
        const i = (y * 512 + x) * 4;
        const broad = Math.sin(x * 0.021) * 5 + Math.sin(y * 0.017 + 1.9) * 4;
        const grain = visualRandom() * 20 - 10;
        const moss = Math.max(0, Math.sin(x * 0.045 + 0.5) * Math.sin(y * 0.039 - 1.1)) * 10;
        data[i] = clamp(31 + grain + broad * 0.35, 8, 80);
        data[i + 1] = clamp(39 + grain + moss + broad * 0.5, 10, 90);
        data[i + 2] = clamp(34 + grain * 0.8 + broad * 0.3, 8, 75);
        data[i + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    for (let i = 0; i < 220; i++) {
      const x = visualRandom() * 512, y = visualRandom() * 512;
      const r = 1 + visualRandom() * 5;
      ctx.fillStyle = visualRandom() > 0.55 ? "rgba(95,103,80,0.18)" : "rgba(13,16,14,0.25)";
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    for (let i = 0; i < 56; i++) {
      const x = visualRandom() * 512, y = visualRandom() * 512;
      ctx.strokeStyle = "rgba(9,11,10,0.35)";
      ctx.lineWidth = 1 + visualRandom() * 1.5;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + visualRandom() * 18 - 9, y + visualRandom() * 18 - 9);
      ctx.lineTo(x + visualRandom() * 32 - 16, y + visualRandom() * 32 - 16);
      ctx.stroke();
    }
    return c;
  }

  function createRoadTexture() {
    const c = makeCanvas(256, 256);
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#35383b";
    ctx.fillRect(0, 0, 256, 256);
    const rows = 6, cols = 4;
    for (let ry = 0; ry < rows; ry++) {
      for (let cx = 0; cx < cols; cx++) {
        const x = cx * 64 + (ry % 2) * 24 + visualRandom() * 6;
        const y = ry * 43 + visualRandom() * 4;
        const w = 54 + visualRandom() * 12;
        const h = 35 + visualRandom() * 8;
        const v = 54 + Math.floor(visualRandom() * 26);
        ctx.fillStyle = "rgb(" + v + "," + (v + 3) + "," + (v + 4) + ")";
        ctx.strokeStyle = "rgba(8,10,12,0.62)";
        ctx.lineWidth = 2.2;
        ctx.fillRect(x, y, w, h);
        ctx.strokeRect(x, y, w, h);
        ctx.fillStyle = "rgba(140,146,143,0.09)";
        ctx.fillRect(x + 4, y + 3, w - 8, 2);
      }
    }
    for (let i = 0; i < 150; i++) {
      ctx.fillStyle = visualRandom() > 0.5 ? "rgba(90,96,94,0.18)" : "rgba(5,6,8,0.24)";
      ctx.fillRect(visualRandom() * 256, visualRandom() * 256, 1 + visualRandom() * 2, 1 + visualRandom() * 2);
    }
    return c;
  }

  function createGlowTexture() {
    const c = makeCanvas(128, 128);
    const ctx = c.getContext("2d");
    const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
    g.addColorStop(0, "rgba(255,255,255,1)");
    g.addColorStop(0.2, "rgba(255,255,255,0.85)");
    g.addColorStop(0.5, "rgba(255,255,255,0.3)");
    g.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 128, 128);
    return c;
  }

  function createShadowTexture() {
    const c = makeCanvas(128, 128);
    const ctx = c.getContext("2d");
    const g = ctx.createRadialGradient(64, 64, 2, 64, 64, 62);
    g.addColorStop(0, "rgba(0,0,0,0.8)");
    g.addColorStop(0.55, "rgba(0,0,0,0.45)");
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 128, 128);
    return c;
  }

  const groundTexture = textureFromCanvas(createGroundTexture(), 3.2, 2.0);
  const roadTexture = textureFromCanvas(createRoadTexture(), 2, 8);
  const glowTexture = textureFromCanvas(createGlowTexture());
  glowTexture.wrapS = glowTexture.wrapT = THREE.ClampToEdgeWrapping;
  const shadowTexture = textureFromCanvas(createShadowTexture());
  shadowTexture.wrapS = shadowTexture.wrapT = THREE.ClampToEdgeWrapping;

  function toLinearColor(value) {
    return new THREE.Color(value).convertSRGBToLinear();
  }

  function makeMaterial(options) {
    const opts = Object.assign({ roughness: 0.8, metalness: 0.08 }, options);
    if (typeof opts.color === "number") opts.color = toLinearColor(opts.color);
    if (typeof opts.emissive === "number") opts.emissive = toLinearColor(opts.emissive);
    return new THREE.MeshStandardMaterial(opts);
  }

  const mats = {
    ground: makeMaterial({ map: groundTexture, color: 0xffffff, roughness: 0.98, metalness: 0.0 }),
    road: makeMaterial({ map: roadTexture, color: 0xf2f2ee, roughness: 0.9, metalness: 0.08 }),
    roadEdge: makeMaterial({ color: 0x433f39, roughness: 0.95 }),
    stone: makeMaterial({ color: 0x60615c, roughness: 0.88, metalness: 0.04 }),
    darkStone: makeMaterial({ color: 0x353a3c, roughness: 0.92 }),
    pad: makeMaterial({ color: 0x555c5d, roughness: 0.82, metalness: 0.12 }),
    padGlow: new THREE.MeshBasicMaterial({ color: 0x557b83, transparent: true, opacity: 0.38 }),

    bronze: makeMaterial({ color: 0x9c6735, roughness: 0.45, metalness: 0.72 }),
    steel: makeMaterial({ color: 0x7590a8, roughness: 0.4, metalness: 0.66 }),
    ice: makeMaterial({ color: 0xcdefff, roughness: 0.22, metalness: 0.18, emissive: 0x4d8ca0, emissiveIntensity: 0.55 }),
    crimson: makeMaterial({ color: 0xb52e42, roughness: 0.4, metalness: 0.5, emissive: 0x4d0710, emissiveIntensity: 0.7 }),
    teal: makeMaterial({ color: 0x379f94, roughness: 0.45, metalness: 0.5, emissive: 0x0c4b43, emissiveIntensity: 0.6 }),
    gold: makeMaterial({ color: 0xe4b763, roughness: 0.42, metalness: 0.6, emissive: 0x6c430d, emissiveIntensity: 0.4 })
  };

  // === WORLD ===
  const world = new THREE.Group();
  scene.add(world);
  const staticDummy = new THREE.Object3D();
  const staticColor = new THREE.Color();

  const groundWorldPts = GROUND_PTS.map(p => new THREE.Vector3(p[0] + 0.5, 0, p[1] + 0.5));
  const airWorldPts = AIR_PTS.map(p => new THREE.Vector3(p[0] + 0.5, 0, p[1] + 0.5));

  function distToPolyline(x, z, pts) {
    let best = Infinity;
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1];
      const vx = b.x - a.x, vz = b.z - a.z;
      const len2 = vx * vx + vz * vz;
      let t = len2 > 0 ? ((x - a.x) * vx + (z - a.z) * vz) / len2 : 0;
      t = clamp(t, 0, 1);
      const dx = x - (a.x + vx * t), dz = z - (a.z + vz * t);
      const d = dx * dx + dz * dz;
      if (d < best) best = d;
    }
    return Math.sqrt(best);
  }

  function addGroundAndRoad() {
    const side = makeMaterial({ color: 0x1a1a17, roughness: 1.0 });
    const soil = makeMaterial({ color: 0x3f3a2b, roughness: 1.0 });
    const top = mats.ground;
    const slabGeo = new THREE.BoxGeometry(25.4, 0.85, 15.4);
    const slab = new THREE.Mesh(slabGeo, [side, side, top, soil, side, side]);
    slab.position.set(12, -0.425, 7);
    slab.receiveShadow = true;
    world.add(slab);

    // A low, uneven stone lip keeps the playfield visually contained.
    const lipMat = makeMaterial({ color: 0x333530, roughness: 0.98 });
    const lipGeoH = new THREE.BoxGeometry(24.9, 0.22, 0.22);
    const lipGeoV = new THREE.BoxGeometry(0.22, 0.22, 14.9);
    const lips = [
      [12, 0.02, -0.28, lipGeoH], [12, 0.02, 14.28, lipGeoH],
      [-0.28, 0.02, 7, lipGeoV], [24.28, 0.02, 7, lipGeoV]
    ];
    for (const l of lips) {
      const m = new THREE.Mesh(l[3], lipMat);
      m.position.set(l[0], l[1], l[2]);
      m.receiveShadow = true;
      m.castShadow = true;
      world.add(m);
    }

    const roadW = 0.76;
    const roadGeo = new THREE.BoxGeometry(roadW, 0.055, 1);
    for (let i = 0; i < groundWorldPts.length - 1; i++) {
      const a = groundWorldPts[i], b = groundWorldPts[i + 1];
      const dx = b.x - a.x, dz = b.z - a.z;
      const len = Math.hypot(dx, dz);
      const mesh = new THREE.Mesh(roadGeo, mats.road);
      mesh.scale.z = len + 0.18;
      mesh.position.set((a.x + b.x) / 2, 0.025, (a.z + b.z) / 2);
      mesh.rotation.y = Math.atan2(dx, dz);
      mesh.receiveShadow = true;
      world.add(mesh);

      const edgeGeo = new THREE.BoxGeometry(0.075, 0.075, len + 0.2);
      for (const s of [-1, 1]) {
        const edge = new THREE.Mesh(edgeGeo, mats.roadEdge);
        edge.position.set((a.x + b.x) / 2, 0.04, (a.z + b.z) / 2);
        edge.rotation.y = Math.atan2(dx, dz);
        const nx = Math.cos(mesh.rotation.y) * s * (roadW * 0.5 + 0.035);
        const nz = -Math.sin(mesh.rotation.y) * s * (roadW * 0.5 + 0.035);
        edge.position.x += nx;
        edge.position.z += nz;
        edge.receiveShadow = true;
        world.add(edge);
      }
    }
    const cornerGeo = new THREE.CircleGeometry(roadW * 0.5, 18);
    for (let i = 1; i < groundWorldPts.length - 1; i++) {
      const p = groundWorldPts[i];
      const corner = new THREE.Mesh(cornerGeo, mats.road);
      corner.rotation.x = -Math.PI / 2;
      corner.position.set(p.x, 0.03, p.z);
      corner.receiveShadow = true;
      world.add(corner);
    }
    // Stone kerb markers at intervals along the road.
    const markerGeo = new THREE.BoxGeometry(0.16, 0.18, 0.12);
    const markerMat = makeMaterial({ color: 0x514b40, roughness: 0.96 });
    for (let i = 0; i < groundWorldPts.length - 1; i++) {
      const a = groundWorldPts[i], b = groundWorldPts[i + 1];
      const len = Math.hypot(b.x - a.x, b.z - a.z);
      const dir = new THREE.Vector3(b.x - a.x, 0, b.z - a.z).normalize();
      const side = new THREE.Vector3(dir.z, 0, -dir.x);
      const count = Math.max(2, Math.floor(len / 1.7));
      for (let j = 1; j < count; j++) {
        const t = j / count;
        for (const sign of [-1, 1]) {
          const m = new THREE.Mesh(markerGeo, markerMat);
          const offset = 0.46 * sign;
          m.position.set(
            a.x + (b.x - a.x) * t + side.x * offset,
            0.02,
            a.z + (b.z - a.z) * t + side.z * offset
          );
          m.rotation.y = Math.atan2(dir.x, dir.z) + 0.15 * sign;
          m.castShadow = true;
          m.receiveShadow = true;
          world.add(m);
        }
      }
    }
  }

  function addAirLane() {
    const laneMat = new THREE.MeshBasicMaterial({
      color: 0x63e4f2, transparent: true, opacity: 0.27,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const dashGeo = new THREE.BoxGeometry(0.035, 0.012, 0.5);
    for (let i = 0; i < airWorldPts.length - 1; i++) {
      const a = airWorldPts[i], b = airWorldPts[i + 1];
      const dx = b.x - a.x, dz = b.z - a.z;
      const len = Math.hypot(dx, dz);
      const count = Math.floor(len / 0.92);
      for (let j = 0; j < count; j++) {
        const u = (j + 0.35) / count;
        const m = new THREE.Mesh(dashGeo, laneMat);
        m.position.set(a.x + dx * u, 1.32, a.z + dz * u);
        m.rotation.y = Math.atan2(dx, dz);
        world.add(m);
      }
    }
    const moteGeo = new THREE.OctahedronGeometry(0.055, 0);
    const moteMat = new THREE.MeshBasicMaterial({
      color: 0x7eefff, transparent: true, opacity: 0.5,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const motes = new THREE.InstancedMesh(moteGeo, moteMat, 46);
    for (let i = 0; i < 46; i++) {
      const seg = i % (airWorldPts.length - 1);
      const a = airWorldPts[seg], b = airWorldPts[seg + 1];
      const u = visualRandom();
      staticDummy.position.set(a.x + (b.x - a.x) * u, 1.14 + visualRandom() * 0.46, a.z + (b.z - a.z) * u);
      const s = 0.45 + visualRandom() * 0.8;
      staticDummy.scale.set(s, s, s);
      staticDummy.rotation.y = visualRandom() * Math.PI;
      staticDummy.updateMatrix();
      motes.setMatrixAt(i, staticDummy.matrix);
    }
    motes.instanceMatrix.needsUpdate = true;
    world.add(motes);
  }

  function addPads() {
    const padGeo = new THREE.CylinderGeometry(0.44, 0.52, 0.11, 8);
    const rimGeo = new THREE.TorusGeometry(0.34, 0.023, 6, 24);
    const notchGeo = new THREE.BoxGeometry(0.055, 0.035, 0.16);
    for (let i = 0; i < SLOT_TILES.length; i++) {
      const tx = SLOT_TILES[i][0] + 0.5;
      const tz = SLOT_TILES[i][1] + 0.5;
      const g = new THREE.Group();
      const pad = new THREE.Mesh(padGeo, mats.pad);
      pad.position.y = 0.075;
      pad.castShadow = true;
      pad.receiveShadow = true;
      g.add(pad);
      const rim = new THREE.Mesh(rimGeo, mats.padGlow);
      rim.rotation.x = Math.PI / 2;

      g.add(rim);

        notch.rotation.y = -ang;
        notch.castShadow = true;
        g.add(notch);
      }
      g.position.set(tx, 0, tz);

      world.add(g);
    }
  }

  function addTerrainDetails() {
    const rockGeo = new THREE.DodecahedronGeometry(0.45, 0);
    const rockMat = makeMaterial({ roughness: 0.98, metalness: 0.02 });
    const rockCount = 58;
    const rocks = new THREE.InstancedMesh(rockGeo, rockMat, rockCount);
    rocks.castShadow = true;
    rocks.receiveShadow = true;
    let n = 0;
    let attempts = 0;
    while (n < rockCount && attempts < 900) {
      attempts++;
      const x = -0.1 + visualRandom() * 24.2;
      const z = -0.1 + visualRandom() * 14.2;
      if (distToPolyline(x, z, groundWorldPts) < 0.9) continue;
      let nearPad = false;
      for (const p of SLOT_TILES) {
        if (Math.hypot(x - (p[0] + 0.5), z - (p[1] + 0.5)) < 0.9) { nearPad = true; break; }
      }
      if (nearPad) continue;
      if (Math.hypot(x - 23.5, z - 11.5) < 1.8) continue;
      const edge = Math.min(x, 24 - x, z, 14 - z);
      const size = (edge < 1.0 ? 0.36 : 0.17) + visualRandom() * (edge < 1.0 ? 0.7 : 0.38);
      staticDummy.position.set(x, size * 0.3 - 0.05, z);
      staticDummy.rotation.set(visualRandom() * 0.4, visualRandom() * Math.PI * 2, visualRandom() * 0.35);
      staticDummy.scale.set(size * (0.75 + visualRandom() * 0.6), size * (0.55 + visualRandom() * 0.9), size);
      staticDummy.updateMatrix();
      rocks.setMatrixAt(n, staticDummy.matrix);
      staticColor.setHSL(0.1 + visualRandom() * 0.06, 0.1 + visualRandom() * 0.12, 0.1 + visualRandom() * 0.08).convertSRGBToLinear();
      rocks.setColorAt(n, staticColor);
      n++;
    }
    rocks.count = n;
    rocks.instanceMatrix.needsUpdate = true;
    if (rocks.instanceColor) rocks.instanceColor.needsUpdate = true;
    world.add(rocks);

    const tuftGeo = new THREE.ConeGeometry(0.1, 0.46, 3);
    const tuftMat = makeMaterial({ roughness: 1.0, metalness: 0.0 });
    const tuftCount = 120;
    const tufts = new THREE.InstancedMesh(tuftGeo, tuftMat, tuftCount);
    let tn = 0;
    attempts = 0;
    while (tn < tuftCount && attempts < 800) {
      attempts++;
      const x = 0.2 + visualRandom() * 23.6;
      const z = 0.2 + visualRandom() * 13.6;
      if (distToPolyline(x, z, groundWorldPts) < 0.68) continue;
      let nearPad = false;
      for (const p of SLOT_TILES) {
        if (Math.hypot(x - (p[0] + 0.5), z - (p[1] + 0.5)) < 0.72) { nearPad = true; break; }
      }
      if (nearPad) continue;
      const h = 0.28 + visualRandom() * 0.42;
      staticDummy.position.set(x, h * 0.5, z);
      staticDummy.rotation.set((visualRandom() - 0.5) * 0.22, visualRandom() * Math.PI, (visualRandom() - 0.5) * 0.22);
      staticDummy.scale.set(0.7 + visualRandom() * 0.9, h / 0.46, 0.7 + visualRandom() * 0.9);
      staticDummy.updateMatrix();
      tufts.setMatrixAt(tn, staticDummy.matrix);
      staticColor.setHSL(0.18 + visualRandom() * 0.07, 0.25 + visualRandom() * 0.18, 0.12 + visualRandom() * 0.06).convertSRGBToLinear();
      tufts.setColorAt(tn, staticColor);
      tn++;
    }
    tufts.count = tn;
    tufts.instanceMatrix.needsUpdate = true;
    if (tufts.instanceColor) tufts.instanceColor.needsUpdate = true;
    world.add(tufts);

    // Sparse dead trees lend the field a fortified frontier silhouette.
    const trunkMat = makeMaterial({ color: 0x2b2119, roughness: 1.0 });
    const branchMat = makeMaterial({ color: 0x33261b, roughness: 1.0 });
    const treeSpots = [
      [1.1, 12.0], [11.0, 0.8], [20.8, 2.0], [10.8, 13.2], [2.0, 8.4]
    ];
    for (let t = 0; t < treeSpots.length; t++) {
      const g = new THREE.Group();
      const h = 1.5 + visualRandom() * 1.35;
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.16, h, 5), trunkMat);
      trunk.position.y = h * 0.5;
      trunk.rotation.z = (visualRandom() - 0.5) * 0.18;
      trunk.castShadow = true;
      g.add(trunk);
      for (let b = 0; b < 3; b++) {
        const bl = 0.5 + visualRandom() * 0.6;
        const br = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.065, bl, 4), branchMat);
        br.position.set((visualRandom() - 0.5) * 0.4, h * (0.58 + b * 0.14), (visualRandom() - 0.5) * 0.4);
        br.rotation.z = (visualRandom() - 0.5) * 1.8;
        br.rotation.x = (visualRandom() - 0.5) * 0.9;
        br.castShadow = true;
        g.add(br);
      }
      g.position.set(treeSpots[t][0], 0, treeSpots[t][1]);
      g.rotation.y = visualRandom() * Math.PI * 2;
      world.add(g);
    }
  }

  let keepGroup = null;
  let keepWreck = null;
  let keepChunks = [];
  let keepStoneMat = null;
  let keepDarkMat = null;
  let keepRoofMat = null;
  let keepFlashLight = null;
  let keepWindowMats = [];

  function addKeep() {
    keepStoneMat = makeMaterial({ color: 0x565851, roughness: 0.9, metalness: 0.04 });
    keepDarkMat = makeMaterial({ color: 0x303332, roughness: 0.94 });
    keepRoofMat = makeMaterial({ color: 0x432927, roughness: 0.9 });

    const gateStud = new THREE.Mesh(new THREE.SphereGeometry(0.028, 6, 5), gateStudMat);

    for (let i = 0; i < 6; i++) {

      r.position.set((visualRandom() - 0.5) * 1.2, 0.1 + visualRandom() * 0.12, (visualRandom() - 0.5) * 1.0);

  addLights();

  // === HUD ===
  const hud = (function () {
    const ATLAS_W = 1024, ATLAS_H = 512;
    const atlasCanvas = makeCanvas(ATLAS_W, ATLAS_H);
    const actx = atlasCanvas.getContext("2d");
    actx.clearRect(0, 0, ATLAS_W, ATLAS_H);

    function roundedPath(ctx, x, y, w, h, r) {
      const rr = Math.min(r, w * 0.5, h * 0.5);
      ctx.beginPath();
      ctx.moveTo(x + rr, y);
      ctx.lineTo(x + w - rr, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
      ctx.lineTo(x + w, y + h - rr);
      ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
      ctx.lineTo(x + rr, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
      ctx.lineTo(x, y + rr);
      ctx.quadraticCurveTo(x, y, x + rr, y);
      ctx.closePath();
    }

    // White digit glyphs, drawn once; every HUD number uses this atlas.
    const digitCells = [];
    actx.font = "700 86px Arial, Helvetica, sans-serif";
    actx.textAlign = "center";
    actx.textBaseline = "middle";
    actx.fillStyle = "#ffffff";
    for (let d = 0; d < 10; d++) {
      const x = d * 64, y = 0, w = 64, h = 96;
      actx.fillText(String(d), x + w / 2, y + h / 2 + 3);
      digitCells.push({ x, y, w, h });
    }

    const glyphCells = {
      coin: { x: 0, y: 112, w: 96, h: 96 },
      wave: { x: 96, y: 112, w: 96, h: 96 },
      pip: { x: 192, y: 112, w: 64, h: 80 },
      grunt: { x: 256, y: 112, w: 96, h: 96 },
      runner: { x: 352, y: 112, w: 96, h: 96 },
      wisp: { x: 448, y: 112, w: 96, h: 96 },
      brute: { x: 544, y: 112, w: 96, h: 96 },
      splitter: { x: 640, y: 112, w: 96, h: 96 },
      mender: { x: 736, y: 112, w: 96, h: 96 },
      splitling: { x: 832, y: 112, w: 96, h: 96 }
    };

    // Coin.
    actx.save();
    actx.translate(48, 160);
    const coinG = actx.createRadialGradient(-9, -10, 2, 0, 0, 37);
    coinG.addColorStop(0, "#fff2b0");
    coinG.addColorStop(0.4, "#edbd55");
    coinG.addColorStop(1, "#9a5f1e");
    actx.fillStyle = coinG;
    actx.beginPath();
    actx.arc(0, 0, 34, 0, Math.PI * 2);
    actx.fill();
    actx.strokeStyle = "#57330d";
    actx.lineWidth = 4;
    actx.stroke();
    actx.strokeStyle = "rgba(255,246,190,0.75)";
    actx.lineWidth = 3;
    actx.beginPath();
    actx.arc(0, 0, 24, 0.2, Math.PI * 1.55);
    actx.stroke();
    actx.fillStyle = "#795018";
    actx.beginPath();
    actx.moveTo(-6, -17); actx.lineTo(10, -17); actx.lineTo(5, -3); actx.lineTo(12, 8);
    actx.lineTo(-3, 8); actx.lineTo(-9, 18); actx.lineTo(-12, -2);
    actx.closePath();
    actx.fill();
    actx.restore();

    // Crossed blades banner glyph.
    actx.save();
    actx.translate(144, 160);
    actx.strokeStyle = "#ffffff";
    actx.fillStyle = "#ffffff";
    actx.lineCap = "round";
    actx.lineWidth = 8;
    actx.beginPath();
    actx.moveTo(-25, 25); actx.lineTo(22, -24);
    actx.moveTo(25, 25); actx.lineTo(-22, -24);
    actx.stroke();
    actx.lineWidth = 11;
    actx.beginPath();
    actx.moveTo(-25, 25); actx.lineTo(-32, 32);
    actx.moveTo(25, 25); actx.lineTo(32, 32);
    actx.stroke();
    actx.lineWidth = 5;
    actx.beginPath();
    actx.moveTo(-30, 9); actx.lineTo(-12, 28);
    actx.moveTo(30, 9); actx.lineTo(12, 28);
    actx.stroke();
    actx.fillStyle = "#ffffff";
    actx.beginPath();
    actx.moveTo(22, -24); actx.lineTo(35, -34); actx.lineTo(31, -19);
    actx.closePath();
    actx.fill();
    actx.beginPath();
    actx.moveTo(-22, -24); actx.lineTo(-35, -34); actx.lineTo(-31, -19);
    actx.closePath();
    actx.fill();
    actx.restore();

    // HP pip: a shield / banner lozenge.
    actx.save();
    actx.translate(glyphCells.pip.x + 32, glyphCells.pip.y + 40);
    actx.fillStyle = "#ffffff";
    actx.beginPath();
    actx.moveTo(0, -26);
    actx.quadraticCurveTo(20, -15, 22, 0);
    actx.quadraticCurveTo(20, 20, 0, 29);
    actx.quadraticCurveTo(-20, 20, -22, 0);
    actx.quadraticCurveTo(-20, -15, 0, -26);
    actx.closePath();
    actx.fill();
    actx.globalCompositeOperation = "destination-out";
    actx.beginPath();
    actx.moveTo(0, -12);
    actx.lineTo(7, -2);
    actx.lineTo(1, 10);
    actx.lineTo(-6, 2);
    actx.closePath();
    actx.fill();
    actx.restore();

    function drawEnemyIcon(type, cx, cy) {
      actx.save();
      actx.translate(cx, cy);
      if (type === "grunt") {
        actx.fillStyle = "#728463";
        roundedPath(actx, -25, -18, 50, 44, 10);
        actx.fill();
        actx.fillStyle = "#9eaf8a";
        roundedPath(actx, -17, -30, 34, 24, 7);
        actx.fill();
        actx.fillStyle = "#f3d87a";
        actx.fillRect(-12, -22, 8, 4);
        actx.fillRect(5, -22, 8, 4);
        actx.fillStyle = "#424a39";
        actx.fillRect(-18, 22, 13, 9);
        actx.fillRect(6, 22, 13, 9);
      } else if (type === "runner") {
        actx.fillStyle = "#e5c643";
        actx.beginPath();
        actx.moveTo(-27, 22); actx.lineTo(-11, -31); actx.lineTo(16, -16);
        actx.lineTo(25, 22); actx.lineTo(1, 12);
        actx.closePath();
        actx.fill();
        actx.fillStyle = "#fff2a4";
        actx.beginPath();
        actx.moveTo(0, -25); actx.lineTo(18, -15); actx.lineTo(12, 10); actx.lineTo(-10, 4);
        actx.closePath();
        actx.fill();
      } else if (type === "wisp") {
        const g = actx.createRadialGradient(0, 0, 1, 0, 0, 34);
        g.addColorStop(0, "rgba(210,255,255,0.9)");
        g.addColorStop(0.5, "rgba(68,226,245,0.4)");
        g.addColorStop(1, "rgba(20,160,200,0)");
        actx.fillStyle = g;
        actx.beginPath(); actx.arc(0, 0, 38, 0, Math.PI * 2); actx.fill();
        actx.fillStyle = "#6ff5ff";
        actx.beginPath();
        actx.moveTo(0, -28); actx.lineTo(23, 0); actx.lineTo(0, 28); actx.lineTo(-23, 0);
        actx.closePath(); actx.fill();
        actx.fillStyle = "#e8ffff";
        actx.beginPath();
        actx.moveTo(0, -14); actx.lineTo(10, 0); actx.lineTo(0, 14); actx.lineTo(-10, 0);
        actx.closePath(); actx.fill();
      } else if (type === "brute") {
        actx.fillStyle = "#4a4c53";
        roundedPath(actx, -34, -22, 68, 49, 10);
        actx.fill();
        actx.fillStyle = "#d87833";
        roundedPath(actx, -39, -26, 19, 26, 5); actx.fill();
        roundedPath(actx, 20, -26, 19, 26, 5); actx.fill();
        actx.fillStyle = "#e89242";
        actx.fillRect(-20, -9, 40, 15);
        actx.fillStyle = "#26272b";
        actx.fillRect(-12, -34, 24, 17);
        actx.fillStyle = "#ffcc82";
        actx.fillRect(-8, -27, 5, 4);
        actx.fillRect(3, -27, 5, 4);
      } else if (type === "splitter") {
        actx.fillStyle = "#9a59bd";
        actx.beginPath();
        for (let i = 0; i < 12; i++) {
          const a = i / 12 * Math.PI * 2;
          const r = i % 2 === 0 ? 31 : 22;
          const x = Math.cos(a) * r, y = Math.sin(a) * r;
          if (i === 0) actx.moveTo(x, y); else actx.lineTo(x, y);
        }
        actx.closePath(); actx.fill();
        actx.fillStyle = "#d194ed";
        actx.beginPath(); actx.arc(-5, -6, 10, 0, Math.PI * 2); actx.fill();
        actx.fillStyle = "#f0d4ff";
        actx.beginPath(); actx.arc(-8, -10, 4, 0, Math.PI * 2); actx.fill();
      } else if (type === "mender") {
        const g = actx.createRadialGradient(0, 4, 4, 0, 4, 34);
        g.addColorStop(0, "rgba(132,240,156,0.55)");
        g.addColorStop(1, "rgba(47,169,86,0)");
        actx.fillStyle = g;
        actx.beginPath(); actx.arc(0, 4, 38, 0, Math.PI * 2); actx.fill();
        actx.fillStyle = "#eee9dd";
        actx.beginPath();
        actx.moveTo(0, -32); actx.lineTo(24, 26); actx.lineTo(-24, 26);
        actx.closePath(); actx.fill();
        actx.fillStyle = "#f8f4e9";
        actx.beginPath(); actx.arc(0, -20, 13, 0, Math.PI * 2); actx.fill();
        actx.strokeStyle = "#79e49d";
        actx.lineWidth = 4;
        actx.beginPath(); actx.arc(0, 2, 26, 0.2, Math.PI - 0.2); actx.stroke();
      } else if (type === "splitling") {
        actx.fillStyle = "#c385df";
        actx.beginPath();
        actx.moveTo(0, -24); actx.lineTo(22, 20); actx.lineTo(-18, 13);
        actx.closePath(); actx.fill();
        actx.fillStyle = "#e9c2f6";
        actx.beginPath(); actx.arc(-2, -4, 6, 0, Math.PI * 2); actx.fill();
      }
      actx.restore();
    }

    for (const type of ["grunt", "runner", "wisp", "brute", "splitter", "mender", "splitling"]) {
      const cell = glyphCells[type];
      drawEnemyIcon(type, cell.x + cell.w / 2, cell.y + cell.h / 2);
    }

    const atlasTexture = new THREE.CanvasTexture(atlasCanvas);
    atlasTexture.encoding = THREE.sRGBEncoding;
    atlasTexture.minFilter = THREE.LinearFilter;
    atlasTexture.magFilter = THREE.LinearFilter;
    atlasTexture.needsUpdate = true;

    function makeSubTexture(cell) {
      const t = atlasTexture.clone();
      t.offset.set(cell.x / ATLAS_W, 1 - (cell.y + cell.h) / ATLAS_H);
      t.repeat.set(cell.w / ATLAS_W, cell.h / ATLAS_H);
      t.encoding = THREE.sRGBEncoding;
      t.minFilter = THREE.LinearFilter;
      t.magFilter = THREE.LinearFilter;
      t.needsUpdate = true;
      return t;
    }

    const digitTextures = digitCells.map(makeSubTexture);
    const glyphTextures = {};
    for (const key in glyphCells) glyphTextures[key] = makeSubTexture(glyphCells[key]);

    const quadGeo = new THREE.PlaneGeometry(1, 1);
    const itemRenderOrder = 200;

    function makeQuad(tex, color, opacity) {
      const mat = new THREE.MeshBasicMaterial({
        map: tex, transparent: true, depthTest: false, depthWrite: false,
        toneMapped: false, color: color === undefined ? 0xffffff : color,
        opacity: opacity === undefined ? 1 : opacity
      });
      const mesh = new THREE.Mesh(quadGeo, mat);
      mesh.renderOrder = itemRenderOrder;
      mesh.frustumCulled = false;
      hudScene.add(mesh);
      return mesh;
    }

    const iconMeshes = {};
    for (const key in glyphTextures) {
      const tempMesh = makeQuad(glyphTextures[key], 0xffffff, 1);
      tempMesh.visible = false;
      iconMeshes[key] = tempMesh;
    }
    // The wave and coin glyphs are always visible.
    iconMeshes.wave.visible = true;
    iconMeshes.wave.material.color.setHex(0xffd28a).convertSRGBToLinear();
    iconMeshes.coin.visible = true;

    const pips = [];
    for (let i = 0; i < 10; i++) {
      const p = makeQuad(glyphTextures.pip, 0xff6254, 1);
      p.userData.index = i;
      pips.push(p);
    }

    function makeDigitPool(count) {
      const pool = [];
      for (let i = 0; i < count; i++) {
        const m = makeQuad(digitTextures[0], 0xffffff, 1);
        m.visible = false;
        pool.push(m);
      }
      return pool;
    }
    const waveDigits = makeDigitPool(4);
    const goldDigits = makeDigitPool(8);
    const previewDigits = makeDigitPool(24);

    const previewIcons = {};
    for (const type of ENEMY_TYPES) {
      const m = makeQuad(glyphTextures[type], 0xffffff, 0.95);
      m.visible = false;
      previewIcons[type] = m;
    }

    let viewW = 1, viewH = 1;
    let metrics = null;

    function reflow(w, h) {
      viewW = w;
      viewH = h;
      const margin = Math.max(16, Math.min(40, h * 0.032));
      // The atlas glyph ink fills roughly 70% of its cell, so use a cell height
      // of 11% of the viewport to keep the wave digits at 7%+ visually.
      const waveH = Math.max(46, h * 0.112);
      const waveIcon = waveH * 0.68;
      const goldH = waveH * 0.44;
      const coinSize = goldH * 1.08;
      const previewH = waveH * 0.38;
      const previewDigitH = previewH * 0.9;
      const pipH = clamp(h * 0.038, 20, 42);
      const pipW = pipH * 0.8;
      const pipGap = Math.max(3, pipH * 0.18);
      const goldTop = margin + waveH * 0.96;
      const previewTop = goldTop + goldH * 1.55;
      metrics = {
        margin, waveH, waveIcon, goldH, coinSize, previewH, previewDigitH,
        pipH, pipW, pipGap, goldTop, previewTop
      };
      hudCamera.left = 0;
      hudCamera.right = w;
      hudCamera.top = h;
      hudCamera.bottom = 0;
      hudCamera.updateProjectionMatrix();

      iconMeshes.wave.position.set(margin + waveIcon / 2, h - (margin + waveH * 0.5), 0);
      iconMeshes.wave.scale.set(waveIcon, waveIcon, 1);
      iconMeshes.coin.position.set(margin + coinSize / 2, h - (goldTop + goldH * 0.52), 0);
      iconMeshes.coin.scale.set(coinSize, coinSize, 1);

      const totalPipW = 10 * pipW + 9 * pipGap;
      for (let i = 0; i < pips.length; i++) {
        const x = w - margin - totalPipW + i * (pipW + pipGap) + pipW / 2;
        const y = h - (margin + waveH * 0.5);
        pips[i].position.set(x, y, 0);
        pips[i].scale.set(pipW, pipH, 1);
      }
    }

    function hidePool(pool, start) {
      for (let i = start; i < pool.length; i++) pool[i].visible = false;
    }

    const digitAspect = 64 / 96;
    function layoutDigits(pool, text, x, yTop, height, color) {
      const cw = height * digitAspect;
      const gap = Math.max(1, height * 0.035);
      let cursor = x;
      let used = 0;
      for (let i = 0; i < text.length && i < pool.length; i++) {
        const ch = text.charCodeAt(i) - 48;
        const mesh = pool[i];
        const digit = (ch >= 0 && ch <= 9) ? ch : 0;
        mesh.visible = true;
        mesh.material.map = digitTextures[digit];
        mesh.material.color.setHex(color).convertSRGBToLinear();
        mesh.scale.set(cw, height, 1);
        mesh.position.set(cursor + cw / 2, viewH - yTop - height / 2, 0);
        cursor += cw + gap;
        used = i + 1;
      }
      hidePool(pool, used);
      return cursor - x - (used ? gap : 0);
    }

    function digitWidth(text, height) {
      const cw = height * digitAspect;
      const gap = Math.max(1, height * 0.035);
      return text.length ? text.length * cw + (text.length - 1) * gap : 0;
    }

    let recentLeakFx = [];

    function update(frame, simTime) {
      if (!frame) return;
      const m = metrics;
      if (!m) return;

      // Wave number.
      const waveText = String(Math.max(0, frame.wave | 0));
      const waveX = m.margin + m.waveIcon + Math.max(8, m.waveH * 0.12);
      layoutDigits(waveDigits, waveText, waveX, m.margin - m.waveH * 0.015, m.waveH, 0xffd99a);

      // Gold.
      const goldText = String(Math.max(0, frame.gold | 0));
      const goldX = m.margin + m.coinSize + Math.max(7, m.goldH * 0.18);
      layoutDigits(goldDigits, goldText, goldX, m.goldTop, m.goldH, 0xffd477);

      // Next-wave preview: one icon per type, with a count.
      const counts = {};
      if (frame.preview) {
        for (const t of frame.preview) counts[t] = (counts[t] || 0) + 1;
      }
      let px = m.margin;
      let usedPreviewDigits = 0;
      const previewY = m.previewTop;
      const iconSize = m.previewH;
      for (const type of ENEMY_TYPES) {
        const c = counts[type] || 0;
        if (c <= 0) { previewIcons[type].visible = false; continue; }
        const icon = previewIcons[type];
        icon.visible = true;
        icon.scale.set(iconSize, iconSize, 1);
        icon.position.set(px + iconSize / 2, viewH - previewY - iconSize / 2, 0);
        let x = px + iconSize + 2;
        const countText = String(c);
        const cw = digitWidth(countText, m.previewDigitH);
        for (let i = 0; i < countText.length && usedPreviewDigits < previewDigits.length; i++) {
          const mesh = previewDigits[usedPreviewDigits++];
          const d = countText.charCodeAt(i) - 48;
          mesh.visible = true;
          mesh.material.map = digitTextures[d];
          mesh.material.color.setHex(0xdfe7e1).convertSRGBToLinear();
          mesh.scale.set(m.previewDigitH * digitAspect, m.previewDigitH, 1);
          mesh.position.set(x + m.previewDigitH * digitAspect / 2, viewH - previewY - iconSize * 0.73 + m.previewDigitH * 0.15, 0);
          x += m.previewDigitH * digitAspect + Math.max(0.5, m.previewDigitH * 0.03);

      for (const type of ENEMY_TYPES) if ((counts[type] || 0) <= 0) previewIcons[type].visible = false;

      const leaks = replay.leaks || [];
      recentLeakFx.length = 0;
      for (let i = leaks.length - 1; i >= 0; i--) {
        const age = simTime - leaks[i].tick / TICKS_PER_SECOND;

        p.scale.set(m.pipW * scaleBoost, m.pipH * scaleBoost, 1);

    const audioEvents = (function buildEvents() {
      const list = [];
      for (const s of (replay.shots || [])) {
        list.push({
          t: s.tick / TICKS_PER_SECOND, kind: "shot", type: s.type,
          pan: clamp((s.x0 / 1200) - 1, -1, 1) * 0.65
        });
      }

    function makeNoiseBuffer(seconds, brownish) {
      const len = Math.max(1, Math.floor(sr * seconds));
      const buf = ctx.createBuffer(1, len, sr);
      const data = buf.getChannelData(0);
      let last = 0;
      for (let i = 0; i < len; i++) {
        const white = audioRandom() * 2 - 1;
        if (brownish) {
          last = last * 0.965 + white * 0.035;
          data[i] = last * 3.1;
        } else {
          data[i] = white;
        }
      }
      // Smooth the loop boundary for the long wind buffer.
      if (brownish) {
        const fade = Math.min(1024, len >> 2);
        for (let i = 0; i < fade; i++) {
          const t = i / fade;
          data[i] = data[i] * t + data[len - fade + i] * (1 - t);
        }
      }
      return buf;

    function init() {

        master = ctx.createGain();
        master.gain.value = 0.0;

        compressor.threshold.setValueAtTime(-18, ctx.currentTime);
        compressor.knee.setValueAtTime(18, ctx.currentTime);
        compressor.ratio.setValueAtTime(5, ctx.currentTime);
        compressor.attack.setValueAtTime(0.004, ctx.currentTime);
        compressor.release.setValueAtTime(0.24, ctx.currentTime);
        master.connect(compressor);
        compressor.connect(ctx.destination);
        noiseBuffer = makeNoiseBuffer(2.0, false);
        windBuffer = makeNoiseBuffer(5.0, true);
        const resume = () => {
          if (ctx && ctx.state === "suspended") {
            ctx.resume().catch(() => {});
          }

        window.addEventListener("pointerdown", resume, { passive: true });
        window.addEventListener("keydown", resume);

    function routeNode(node, pan) {
      if (!ctx) return;
      let finalNode = node;
      if (ctx.createStereoPanner) {

      const now = ctx.currentTime;

      src.buffer = windBuffer;
      src.loop = true;
      const filter = ctx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = 420;
      filter.Q.value = 0.6;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.028, now + 1.3);
      src.connect(filter);
      filter.connect(gain);
      gain.connect(master);
      src.start(now);
      wind = { src, filter, gain };

    function stopWind() {

    function tone(type, f0, f1, dur, vol, pan, attack, delay) {
      if (!ctx) return;
      const now = ctx.currentTime + (delay || 0);
      const osc = ctx.createOscillator();
      osc.type = type;
      osc.frequency.setValueAtTime(Math.max(20, f0), now);
      osc.frequency.linearRampToValueAtTime(Math.max(20, f1), now + dur * 0.94);
      const env = ctx.createGain();
      const atk = Math.max(0.002, attack === undefined ? 0.006 : attack);
      env.gain.setValueAtTime(0.0001, now);
      env.gain.linearRampToValueAtTime(Math.max(0.0002, vol), now + atk);
      env.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(env);
      routeNode(env, pan);
      osc.start(now);
      osc.stop(now + dur + 0.025);
      trackSource(osc);
    }

    function noiseBurst(dur, vol, pan, filterType, freq, q, attack) {
      if (!ctx || !noiseBuffer) return;
      const now = ctx.currentTime;

      const filter = ctx.createBiquadFilter();
      filter.type = filterType || "lowpass";
      filter.frequency.setValueAtTime(freq || 1200, now);
      filter.Q.value = q === undefined ? 0.7 : q;
      const env = ctx.createGain();
      const atk = Math.max(0.002, attack === undefined ? 0.005 : attack);
      env.gain.setValueAtTime(0.0001, now);
      env.gain.linearRampToValueAtTime(Math.max(0.0002, vol), now + atk);
      env.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      src.connect(filter);
      filter.connect(env);
      routeNode(env, pan);
      src.start(now, offset, dur + 0.04);
      src.stop(now + dur + 0.05);
      trackSource(src);

      } else if (type === "cannon") {
        tone("sine", 155 * jit, 48, 0.17, 0.105, pan, 0.004);
        noiseBurst(0.14, 0.055, pan, "lowpass", 380, 0.8, 0.003);
      } else if (type === "frost") {

      } else if (type === "lance") {

      tone("sine", 54, 82, 0.55, 0.035, 0, 0.05);

    function playFall() {
      if (!ctx) return;

      tone("triangle", 118, 43, 0.9, 0.06, 0.2, 0.01);
      noiseBurst(2.1, 0.12, 0.25, "lowpass", 190, 0.7, 0.03);
      noiseBurst(0.7, 0.06, 0.1, "lowpass", 900, 0.5, 0.01);

    function scheduleShots(candidates) {
      candidates.sort((a, b) => (shotPriority[b.type] || 0) - (shotPriority[a.type] || 0));
      for (const c of candidates) {
        const now = ctx.currentTime;
        while (shotTimes.length && now - shotTimes[0] >= 1.0) shotTimes.shift();
        if (shotTimes.length >= 12) continue;
        shotTimes.push(now);
        playShot(c.type, c.pan);

    }

    function lowerBoundTime(t) {
      let lo = 0, hi = audioEvents.length;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (audioEvents[mid].t <= t + 1e-9) lo = mid + 1; else hi = mid;

    }

    function update(state, simTime) {

      const playing = state === STATE_PLAYING;
      if (!playing) {
        if (wasPlaying) setAudible(false);
        lastSim = simTime;
        wasPlaying = false;
        return;

      if (!wasPlaying) {
        setAudible(true);
        lastSim = simTime;
        wasPlaying = true;
        if (replay.fall && simTime >= fallTime) startWind();

      if (simTime < lastSim - 1e-9) {
        lastSim = simTime;
        return;

      if (simTime === lastSim) return;
      const from = lastSim, to = simTime;
      let i = lowerBoundTime(from);
      const shots = [];

        if (ev.kind === "shot") shots.push(ev);
        else if (ev.kind === "kill") playKill(ev.pan);
        else if (ev.kind === "wave") playWaveHorn();
        else if (ev.kind === "leak") playLeak(ev.pan);
        else if (ev.kind === "fall") playFall();

      scheduleShots(shots);
      lastSim = to;
    }

      stopWind();
      stopOneShots();
      lastSim = 0;
      wasPlaying = false;

        const now = ctx.currentTime;
        try {
