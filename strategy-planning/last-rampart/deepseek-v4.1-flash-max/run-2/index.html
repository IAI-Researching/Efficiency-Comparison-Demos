<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Last Rampart</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;

  transform: translateX(-50%);
  z-index: 100;

}

}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;

#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>

<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script id="rampart-strategy">
function createStrategy() {
  var LAYOUT = {0:'flak',1:'flak',2:'cannon',3:'cannon',4:'cannon',5:'cannon',6:'cannon',7:'cannon',8:'cannon',9:'cannon',10:'cannon',11:'cannon',12:'flak',13:'bolt',14:'flak',15:'flak'};
  var BUILD_ORDER = [2,5,15,1,3,10,12,0,7,8,6,4,13,14,11,9];
  var UPGRADE_ORDER = [4,3,7,6,13,0,1,14,8,5,11,9,10,2,12,15];
  var COST = {bolt:50,cannon:90,frost:70,lance:120,flak:80};
  function effectiveSpeed(e) { return e.slowed > 0 ? Math.floor(e.speed * 60 / 100) : e.speed; }
  return {
    plan: function(s) {
      var actions = [], g = s.gold, bySlot = {}, i;
      for (i = 0; i < s.slots.length; i++) {
        var sl = s.slots[i];
        bySlot[sl.slot] = sl.turret ? {type:sl.turret.type, tier:sl.turret.tier} : null;
      }
      for (var bi = 0; bi < BUILD_ORDER.length && actions.length < 32; bi++) {
        var slot = BUILD_ORDER[bi], type = LAYOUT[slot];
        if (!type || bySlot[slot]) continue;
        var cost = COST[type];
        if (g < cost) continue;
        actions.push({op:'build', slot:slot, type:type});
        g -= cost; bySlot[slot] = {type:type, tier:1};
      }
      for (var pass = 0; pass < 3 && actions.length < 32; pass++) {
        var did = false;
        for (var ui = 0; ui < UPGRADE_ORDER.length && actions.length < 32; ui++) {
          var us = UPGRADE_ORDER[ui], t = bySlot[us];
          if (!t || t.tier >= 3) continue;
          var uc = COST[t.type] * (t.tier === 1 ? 1 : 2);
          if (g < uc) continue;
          actions.push({op:'upgrade', slot:us});
          g -= uc; t.tier += 1; did = true;
        }
        if (!did) break;
      }
      return actions;
    },
    target: function(t, candidates) {
      var radius = t.type === 'flak' ? 70 : t.type === 'cannon' ? 90 : 0;
      var i, j, e;
      if (radius > 0) {
        var r2 = radius * radius, best = candidates[0], bestScore = -1e30;
        for (i = 0; i < candidates.length; i++) {
          e = candidates[i];
          var count = 0;
          for (j = 0; j < candidates.length; j++) {
            var o = candidates[j], dx = e.x - o.x, dy = e.y - o.y;
            if (dx*dx + dy*dy <= r2) count++;
          }
          var score = count * 200 - e.remaining;
          if (score > bestScore) { bestScore = score; best = e; }
        }
        return best.id;
      }
      var bestTime = 1e30, chosen = candidates[0];
      for (i = 0; i < candidates.length; i++) {
        e = candidates[i];
        var time = e.remaining / effectiveSpeed(e);
        if (time < bestTime) { bestTime = time; chosen = e; }
      }
      return chosen.id;
    }
  };
}

</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks, record) {
  function mulberry32(a) { return function () {
    a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return (t ^ (t >>> 14)) >>> 0; }; }

  const SLOT_TILES = [[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],[14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]];
  const GROUND_POINTS = [[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]];
  const AIR_POINTS = [[0,6],[21,6],[21,11],[23,11]];
  const TURRET_DEFS = {
    bolt:   {cost:50,  damage:26,  period:8,  range:300, splash:0,  slow:0,  pierce:false, ground:true,  air:true,  idx:0},
    cannon: {cost:90,  damage:60,  period:24, range:260, splash:90, slow:0,  pierce:false, ground:true,  air:false, idx:1},
    frost:  {cost:70,  damage:10,  period:12, range:240, splash:0,  slow:30, pierce:false, ground:true,  air:true,  idx:2},
    lance:  {cost:120, damage:180, period:36, range:360, splash:0,  slow:0,  pierce:true,  ground:true,  air:false, idx:3},
    flak:   {cost:80,  damage:40,  period:10, range:320, splash:70, slow:0,  pierce:false, ground:false, air:true,  idx:4}
  };
  const TYPE_DEFS = {
    grunt:     {hp:60,  speed:10, armor:function(w){return Math.floor(w/4);}, bounty:4, leak:1, air:false, first:1, weight:10},
    runner:    {hp:40,  speed:20, armor:function(w){return 0;},              bounty:4, leak:1, air:false, first:2, weight:4},
    wisp:      {hp:50,  speed:12, armor:function(w){return 0;},              bounty:6, leak:2, air:true,  first:3, weight:3},
    brute:     {hp:150, speed:6,  armor:function(w){return 6+w;},            bounty:9, leak:3, air:false, first:4, weight:3},
    splitter:  {hp:90,  speed:8,  armor:function(w){return 0;},              bounty:6, leak:2, air:false, first:6, weight:2},
    mender:    {hp:70,  speed:8,  armor:function(w){return 0;},              bounty:7, leak:2, air:false, first:8, weight:1}
  };
  const TYPE_ORDER = ['grunt','runner','wisp','brute','splitter','mender'];

  function makeRoute(points) {
    const segs = []; let len = 0;
    for (let i = 1; i < points.length; i++) {
      const ax = points[i-1][0]*100+50, ay = points[i-1][1]*100+50;
      const bx = points[i][0]*100+50, by = points[i][1]*100+50;
      const dx = bx-ax, dy = by-ay, l = Math.abs(dx)+Math.abs(dy);
      segs.push({ax,ay,dx,dy,len:l});
      len += l;
    }
    return {segs, len};
  }
  const groundRoute = makeRoute(GROUND_POINTS);
  const airRoute = makeRoute(AIR_POINTS);

  function routePoint(route, progress) {
    let p = progress;
    for (let i = 0; i < route.segs.length; i++) {
      const s = route.segs[i];
      if (p <= s.len || i === route.segs.length - 1) {
        let f = p / s.len; if (!(f > 0)) f = 0; if (f > 1) f = 1;
        return [s.ax + s.dx*f, s.ay + s.dy*f];
      }
      p -= s.len;
    }
    const s = route.segs[route.segs.length-1];
    return [s.ax+s.dx, s.ay+s.dy];
  }
  function routeHeading(route, progress) {
    let p = progress;
    for (let i = 0; i < route.segs.length; i++) {
      const s = route.segs[i];
      if (p < s.len || i === route.segs.length - 1) {
        const l = s.len || 1;
        return [s.dx/l, s.dy/l];
      }
      p -= s.len;
    }
    return [0,0];
  }

  const rng = mulberry32(seed >>> 0);
  function generateWave(w) {
    const list = []; let sum = 0;
    for (let i = 0; i < TYPE_ORDER.length; i++) {
      const name = TYPE_ORDER[i], def = TYPE_DEFS[name];
      if (def.first <= w) { list.push([name, def.weight]); sum += def.weight; }
    }
    const out = [], count = 4 + Math.floor(3*w/5);
    for (let n = 0; n < count; n++) {
      let r = rng() % sum, picked = list[list.length-1][0];
      for (let j = 0; j < list.length; j++) {
        if (r < list[j][1]) { picked = list[j][0]; break; }
        r -= list[j][1];
      }
      out.push(picked);
    }
    return out;
  }
  const hpMult = [0, 1000];
  function multiplier(w) {
    while (hpMult.length <= w) hpMult.push(Math.floor(hpMult[hpMult.length-1] * 108 / 100));
    return hpMult[w];
  }

  const slots = [];
  for (let i = 0; i < 16; i++) slots.push({slot:i, x:SLOT_TILES[i][0]*100+50, y:SLOT_TILES[i][1]*100+50, turret:null});
  const cooldowns = new Array(16).fill(0);
  let gold = 250, baseHp = 10, wave = 0, tick = 0, nextId = 1;
  let enemies = [], pending = [];
  const log = [];
  let waveComp = generateWave(1);
  let nextWave = null;
  let previewComp = waveComp.slice();
  const strategy = createStrategy();
  const rec = record && typeof record === 'object' ? record : null;
  if (rec) {
    rec.frames = []; rec.shots = []; rec.kills = []; rec.heals = [];
    rec.waves = []; rec.leaks = []; rec.fall = null;
    rec.initialPreview = waveComp.slice();
  }

  function makeView(e) {
    const pt = routePoint(e.route, e.progress);
    return {id:e.id, type:e.type, hp:e.hp, maxHp:e.maxHp, x:pt[0], y:pt[1],
      air:e.air?1:0, armor:e.armor, speed:e.speed, slowed:e.slow, remaining:e.len-e.progress};
  }
  function makeState() {
    return {
      tick: tick, wave: wave, gold: gold, baseHp: baseHp,
      slots: slots.map(function(s){ return {slot:s.slot, x:s.x, y:s.y,
        turret: s.turret ? {type:s.turret.type, tier:s.turret.tier, spent:s.turret.spent} : null}; }),
      enemies: enemies.map(makeView),
      nextWave: previewComp.slice()
    };
  }
  function captureFrame() {
    if (!rec) return;
    const ef = new Array(enemies.length);
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i], pt = routePoint(e.route, e.progress), hd = routeHeading(e.route, e.progress);
      ef[i] = {id:e.id, type:e.type, x:pt[0], y:pt[1], hp:e.hp, maxHp:e.maxHp,
        air:e.air?1:0, slow:e.slow, hx:hd[0], hy:hd[1]};
    }
    const tf = new Array(16);
    for (let s = 0; s < 16; s++) {
      const t = slots[s].turret;
      tf[s] = t ? {slot:s, type:t.type, tier:t.tier} : null;
    }
    rec.frames[tick] = {tick:tick, wave:wave, gold:gold, baseHp:baseHp,
      enemies:ef, turrets:tf, preview:previewComp.slice()};
  }
  function turretDamage(t) {
    const def = TURRET_DEFS[t.type]; let d = def.damage;
    if (t.tier >= 2) d = Math.floor(d * 16 / 10);
    if (t.tier >= 3) d = Math.floor(d * 16 / 10);
    return d;
  }
  function turretRange(t) { return TURRET_DEFS[t.type].range + (t.tier-1)*30; }

  function spawnEnemy(type, w, progress, route, hpOverride) {
    let maxHp, armor, bounty, leak, speed, air = false;
    if (type === 'splitling') {
      maxHp = hpOverride; armor = 0; bounty = 1; leak = 1; speed = 12; route = groundRoute;
    } else {
      const def = TYPE_DEFS[type];
      maxHp = Math.floor(def.hp * multiplier(w) / 1000);
      armor = def.armor(w); bounty = def.bounty; leak = def.leak; speed = def.speed; air = def.air;
      route = air ? airRoute : groundRoute;
    }
    if (maxHp < 1) maxHp = 1;
    enemies.push({id:nextId++, type:type, wave:w, route:route, len:route.len, progress:progress,
      maxHp:maxHp, hp:maxHp, age:0, slow:0, armor:armor, speed:speed,
      slowSpeed:Math.floor(speed*60/100), bounty:bounty, leak:leak, air:air});
  }

  function spawnDue() {
    if (!pending.length) return;
    const due = [], rest = [];
    for (let i = 0; i < pending.length; i++) {
      if (pending[i].tick === tick) due.push(pending[i]); else rest.push(pending[i]);
    }
    pending = rest;
    due.sort(function(a,b){ return (a.wave-b.wave) || (a.index-b.index); });
    for (let i = 0; i < due.length; i++) spawnEnemy(due[i].type, due[i].wave, 0, null, 0);
  }

  function processDead(slotIndex) {
    let dead = null;
    for (let i = 0; i < enemies.length; i++) {
      if (enemies[i].hp <= 0) { if (!dead) dead = []; dead.push(enemies[i]); }
    }
    if (!dead) return;
    for (let d = 0; d < dead.length; d++) {
      const e = dead[d];
      log.push([tick, 'K', e.id, slotIndex]);
      gold += e.bounty;
      if (rec) {
        const pt = routePoint(e.route, e.progress);
        rec.kills.push({tick:tick, id:e.id, type:e.type, wave:e.wave, x:pt[0], y:pt[1], air:e.air?1:0, slot:slotIndex});
      }
      const idx = enemies.indexOf(e);
      if (idx >= 0) enemies.splice(idx, 1);
      if (e.type === 'splitter') {
        const childHp = Math.max(1, Math.floor(e.maxHp/4));
        for (let s = 0; s < 3; s++) spawnEnemy('splitling', e.wave, e.progress, groundRoute, childHp);
      }
    }
  }

  function finish(fallTick) {
    const endTick = fallTick >= 0 ? fallTick : maxTicks;
    const score = Math.round(((endTick - 20) / 40) * 100) / 100;
    let h = 0x811c9dc5;
    const str = JSON.stringify(log);
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return {score:score, fallTick:fallTick, log:log, hash:('00000000' + ((h>>>0).toString(16))).slice(-8)};
  }

  for (tick = 0; tick < maxTicks; tick++) {
    // 1. wave start
    if (tick === 20 + 40 * wave) {
      wave += 1;
      gold += Math.min(50, Math.floor(gold * 5 / 100)) + 10 + 2 * wave;
      nextWave = generateWave(wave + 1);
      previewComp = nextWave;
      if (rec) rec.waves.push({tick:tick, wave:wave});
      const actions = strategy.plan(makeState()) || [];
      const lim = Math.min(32, actions.length || 0);
      for (let ai = 0; ai < lim; ai++) {
        const a = actions[ai];
        if (!a || typeof a !== 'object') continue;
        const op = a.op, si = a.slot;
        if (typeof si !== 'number' || si < 0 || si >= 16 || si !== Math.floor(si)) continue;
        const slotObj = slots[si];
        if (op === 'build') {
          const def = TURRET_DEFS[a.type];
          if (!def || slotObj.turret || gold < def.cost) continue;
          gold -= def.cost;
          slotObj.turret = {type:a.type, tier:1, spent:def.cost};
          cooldowns[si] = 0;
          log.push([tick, 'B', si, def.idx]);
        } else if (op === 'upgrade') {
          const t = slotObj.turret;
          if (!t || t.tier >= 3) continue;
          const cost = TURRET_DEFS[t.type].cost * (t.tier === 1 ? 1 : 2);
          if (gold < cost) continue;
          gold -= cost; t.tier += 1; t.spent += cost;
          log.push([tick, 'U', si, t.tier]);
        } else if (op === 'sell') {
          const t = slotObj.turret;
          if (!t) continue;
          gold += Math.floor(t.spent * 70 / 100);
          slotObj.turret = null; cooldowns[si] = 0;
          log.push([tick, 'S', si, 0]);
        }
      }
      for (let i = 0; i < waveComp.length; i++) {
        pending.push({tick:tick + 4*i, wave:wave, index:i, type:waveComp[i]});
      }
      waveComp = nextWave;
    }

    // 2. spawn
    spawnDue();

    // 3. move
    {
      let i = 0;
      while (i < enemies.length) {
        const e = enemies[i];
        e.progress += (e.slow > 0 ? e.slowSpeed : e.speed);
        if (e.progress >= e.len) {
          baseHp -= e.leak;
          log.push([tick, 'L', e.id, baseHp]);
          if (rec) {
            const pt = routePoint(e.route, e.progress);
            rec.leaks.push({tick:tick, id:e.id, type:e.type, wave:e.wave, x:pt[0], y:pt[1], air:e.air?1:0, baseHp:baseHp});
          }
          enemies.splice(i, 1);
          if (baseHp <= 0) {
            log.push([tick, 'F', wave, 0]);
            if (rec) rec.fall = {tick:tick, wave:wave};
            captureFrame();
            return finish(tick);
          }
        } else i++;
      }
    }

    // 4. age & heal
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      e.age += 1;

  function updateEnemies(frameA, frameB, alpha, simTime) {
    var typeCounts = {};

    var barN = 0, shadowN = 0, glowN = 0;

    var mapB = frameB ? frameMaps[frameB.tick] : null;
    for (var i = 0; i < listA.length; i++) {
      var a = listA[i];
      var b = mapB ? mapB[a.id] : null;
      var x = b ? (a.x + (b.x - a.x) * alpha) / 100 : a.x / 100;
      var z = b ? (a.y + (b.y - a.y) * alpha) / 100 : a.y / 100;
      var hp = b ? a.hp + (b.hp - a.hp) * alpha : a.hp;
      var maxHp = Math.max(1, a.maxHp);
      var slowed = a.slow > 0;
      var info = ENEMY_INFO[a.type] || ENEMY_INFO.grunt;
      var phase = a.id * 1.731;
      var bob = 0;
      var scalePulse = 1;
      if (a.type === 'runner') bob = Math.abs(Math.sin(simTime * 9 + phase)) * 0.045;
      else if (a.type === 'grunt') bob = Math.abs(Math.sin(simTime * 6 + phase)) * 0.022;
      else if (a.type === 'brute') bob = Math.abs(Math.sin(simTime * 3.8 + phase)) * 0.018;
      else if (a.type === 'splitter') scalePulse = 1 + Math.sin(simTime * 6.4 + phase) * 0.035;
      else if (a.type === 'splitling') scalePulse = 1 + Math.sin(simTime * 9 + phase) * 0.06;
      else if (a.type === 'mender') bob = Math.sin(simTime * 2.2 + phase) * 0.025;
      else if (a.type === 'wisp') bob = Math.sin(simTime * 3.1 + phase) * 0.06;
      var baseY = a.air ? 0.8 : 0;
      var yy = baseY + bob;
      if (a.type === 'wisp') yy = 0.82 + bob;
      var aAngle = Math.atan2(a.hx || 0, a.hy || 1);
      var bAngle = b ? Math.atan2(b.hx || 0, b.hy || 1) : aAngle;
      if (!isFinite(aAngle)) aAngle = 0;
      if (!isFinite(bAngle)) bAngle = aAngle;

      if (a.type === 'wisp') heading += simTime * 0.9 + phase;
      enemyQuat.setFromAxisAngle(new THREE.Vector3(0, 1, 0), heading);

      barScale.set(info.barW * 1.12, 0.072, 1);

      barBgMesh.setMatrixAt(barN, enemyMatrix);
      var ratio = clamp01(hp / maxHp);
      var fillW = Math.max(0.001, info.barW * 1.12 * ratio);
      barPos.y -= 0.002;
      barPos.z += 0.0001;
      barScale.set(fillW, 0.046, 1);
      enemyMatrix.compose(barPos, camera.quaternion, barScale);
      barFillMesh.setMatrixAt(barN, enemyMatrix);
      tmpColor.setRGB(

      if (time >= t) tr += 0.3 * Math.max(0, 1 - (time - t));
    }
    if (fallTime < 1e8 && time >= fallTime) tr += Math.max(0, 1 - (time - fallTime));
    return Math.min(1, tr);
  }
  var shakeVec = new THREE.Vector3();
  var lookVec = new THREE.Vector3();
  var hudTime = 0;
  var lastRenderedTime = -1;

  function renderAt(time) {
    if (time < 0) time = 0; else if (time > DURATION) time = DURATION;
    var fallNow = fallTime < 1e8 && time >= fallTime;
    var animationTime = fallNow ? fallTime : time;
    var sampled = frameAtTime(time);
    syncTurrets(sampled.a);
    var tr = currentTrauma(time);
    var amp = tr * tr * 0.25;
    shakeVec.set(
      (valueNoise(time * 5.1 + 0.3, 11) * 2 - 1) * amp,
      (valueNoise(time * 5.5 + 3.7, 23) * 2 - 1) * amp * 0.45,
      (valueNoise(time * 4.7 + 7.1, 37) * 2 - 1) * amp
    );
    camera.position.copy(baseCamPos).add(shakeVec);
    lookVec.copy(baseCamTarget);
    lookVec.x += shakeVec.x * 0.55;
    lookVec.y += shakeVec.y * 0.8;
    lookVec.z += shakeVec.z * 0.55;
    camera.lookAt(lookVec);
    camera.updateMatrixWorld(true);
    updateEnemies(sampled.a, sampled.b, sampled.alpha, animationTime);
    updateTurretAim(animationTime);
    updatePadRings(sampled.a, animationTime);
    updateKeep(sampled.a, animationTime, time);
    updateEffects(animationTime, time);
    updateHUD(sampled.a, time);

    // Fall desaturation; the HUD shares the final WebGL pass, so it desaturates too.
    var sat = 1;
    if (fallNow) sat = 1 - 0.9 * clamp01((time - fallTime) / 1.0);
    stage.style.filter = sat < 0.999 ? 'saturate(' + sat.toFixed(4) + ')' : '';

    renderer.setRenderTarget(null);
    renderer.setClearColor(0x000000, 0);
    renderer.clear(true, true, true);
    renderer.render(scene, camera);
    renderer.clearDepth();
    renderer.render(hudScene, hudCamera);
    lastRenderedTime = time;
  }

  window.addEventListener('resize', function () {
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    fitCamera();
    renderAt(simTime);
  });

  /* -------------------- controls & state machine -------------------- */
  var countdownEl = document.getElementById('countdown');
  var scrubber = document.getElementById('scrubber');
  var btnToggle = document.getElementById('btn-toggle');
  var btnRefire = document.getElementById('btn-refire');
  var iconPause = document.getElementById('icon-pause');
  var iconPlay = document.getElementById('icon-play');
  var speedPills = Array.prototype.slice.call(document.querySelectorAll('.speed-pill'));

  var state = 'COUNTDOWN';
  var countdownElapsed = 0;
  var holdElapsed = 0;
  var playbackSpeed = 1.0;
  var simTime = 0;
  var lastLoopTimestamp = null;
  var countdownArmed = false;
  var measuredPlayingFrames = 0;
  var measuredPlayingTime = 0;
  var lastMeasureTimestamp = null;
  function setPlaybackIcon(playing) {
    iconPause.style.display = playing ? 'inline' : 'none';
    iconPlay.style.display = playing ? 'none' : 'inline';
    btnToggle.setAttribute('aria-label', playing ? 'Pause' : 'Play');
  }
  function hideCountdown() {
    countdownEl.style.display = 'none';
    countdownEl.textContent = '';
  }
  function showCountdown(n) {
    countdownEl.textContent = String(n);
    countdownEl.style.display = 'block';
  }
  function setSpeed(speed, pill) {
    playbackSpeed = speed;
    for (var i = 0; i < speedPills.length; i++) {
      var active = speedPills[i] === pill;
      speedPills[i].classList.toggle('is-active', active);
      speedPills[i].setAttribute('aria-checked', active ? 'true' : 'false');
    }
  }
  function pauseForScrub() {
    state = 'PAUSED';
    hideCountdown();
    setPlaybackIcon(false);
    if (audioEngine) audioEngine.setActive(false);
    if (audioEngine) audioEngine.setWind(false);
  }
  function enterPlaying(startTime) {
    state = 'PLAYING';
    simTime = startTime;
    hideCountdown();
    setPlaybackIcon(true);
    if (audioEngine) {
      resetAudioCursor(startTime);
      audioEngine.setActive(true);
      audioEngine.setWind(fallTime < 1e8 && startTime >= fallTime);
    }
    scrubber.value = simTime.toFixed(3);
    renderAt(simTime);
  }
  function resetToStartForHold() {
    state = 'REFIRE_HOLD';
    holdElapsed = 0;
    simTime = 0;
    countdownElapsed = 0;
    hideCountdown();
    countdownEl.style.display = 'none';
    countdownEl.textContent = '';
    scrubber.value = '0';
    setPlaybackIcon(true);
    if (audioEngine) { audioEngine.setActive(false); audioEngine.setWind(false); resetAudioCursor(0); }
    renderAt(0);
  }

  btnToggle.addEventListener('click', function () {
    if (state === 'PLAYING') {
      state = 'PAUSED';
      setPlaybackIcon(false);
      if (audioEngine) audioEngine.setActive(false);
      if (audioEngine) audioEngine.setWind(false);
    } else if (state === 'COUNTDOWN' || state === 'REFIRE_HOLD') {
      hideCountdown();
      state = 'PAUSED';
      simTime = 0;
      scrubber.value = '0';
      countdownElapsed = 0;
      holdElapsed = 0;
      setPlaybackIcon(false);
      if (audioEngine) audioEngine.setActive(false);
      if (audioEngine) audioEngine.setWind(false);
      renderAt(0);
    } else if (state === 'PAUSED') {
      enterPlaying(simTime);
    } else if (state === 'ENDED') {
      simTime = 0;
      scrubber.value = '0.000';
      enterPlaying(0);
    }
  });

  btnRefire.addEventListener('click', function () {
    resetToStartForHold();
  });

  for (var pi = 0; pi < speedPills.length; pi++) {
    (function (pill) {
      pill.addEventListener('click', function () {
        var s = parseFloat(pill.getAttribute('data-speed'));
        if (s === 0.25 || s === 0.5 || s === 1.0 || s === 2.0) setSpeed(s, pill);
      });
    })(speedPills[pi]);
  }

  scrubber.addEventListener('input', function () {
    var t = parseFloat(scrubber.value);
    if (!isFinite(t)) t = 0;
    if (t < 0) t = 0; else if (t > DURATION) t = DURATION;
    countdownElapsed = 0;
    holdElapsed = 0;
    simTime = t;
    pauseForScrub();
    scrubber.value = simTime.toFixed(3);
    if (audioEngine) resetAudioCursor(simTime);
    renderAt(simTime);
  });

  // A first resting frame is painted synchronously; the countdown starts on the
  // first animation-frame callback after this.
  renderAt(0);

  function loop(now) {
    requestAnimationFrame(loop);
    if (lastLoopTimestamp === null) {
      lastLoopTimestamp = now;
      countdownArmed = true;
      if (state === 'COUNTDOWN') {
        showCountdown(3);
        renderAt(0);
      }
      return;
    }
    var rawDt = (now - lastLoopTimestamp) / 1000;
    lastLoopTimestamp = now;
    var dt = Math.min(Math.max(rawDt, 0), 0.1);

    if (state === 'COUNTDOWN') {
      countdownElapsed += dt;
      if (countdownElapsed < 1) {
        showCountdown(3);
        renderAt(0);
        if (audioEngine) audioEngine.setActive(false);
      } else if (countdownElapsed < 2) {
        showCountdown(2);
        renderAt(0);
        if (audioEngine) audioEngine.setActive(false);
      } else if (countdownElapsed < 3) {
        showCountdown(1);
        renderAt(0);
        if (audioEngine) audioEngine.setActive(false);
      } else {
        countdownElapsed = 3;
        hideCountdown();
        enterPlaying(0);
      }
    } else if (state === 'REFIRE_HOLD') {
      holdElapsed += dt;
      if (audioEngine) audioEngine.setActive(false);
      if (holdElapsed >= 1) {
        holdElapsed = 1;
        enterPlaying(0);
      } else {
        renderAt(0);
      }
    } else if (state === 'PLAYING') {
      var prev = simTime;
      var before = simTime;
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      scrubber.value = simTime.toFixed(3);
      if (audioEngine) audioEngine.setActive(true);
      if (audioEngine) audioEngine.setWind(fallTime < 1e8 && simTime >= fallTime);
      triggerAudioRange(prev, simTime);
      renderAt(simTime);
      if (simTime >= DURATION) {
        simTime = DURATION;
        scrubber.value = DURATION.toFixed(3);
        if (audioEngine) { audioEngine.setActive(false); audioEngine.setWind(false); }
        state = 'ENDED';
        setPlaybackIcon(false);
      }
      lastMeasureTimestamp = measuredPlayingFrames === 0 ? now : lastMeasureTimestamp;
      measuredPlayingFrames++;
      if (measuredPlayingFrames === 180 && now > lastMeasureTimestamp) {
        var fps = 179000 / (now - lastMeasureTimestamp);
        window.BENCH_REPORT.measuredFps = Math.round(fps * 10) / 10;
      }
    } else if (state === 'PAUSED') {
      renderAt(simTime);
      if (audioEngine) { audioEngine.setActive(false); audioEngine.setWind(false); }
    } else if (state === 'ENDED') {
      renderAt(DURATION);
      if (audioEngine) { audioEngine.setActive(false); audioEngine.setWind(false); }
    }
  }

  setPlaybackIcon(true);
  requestAnimationFrame(loop);
})();

</script>
</body>
</html>
