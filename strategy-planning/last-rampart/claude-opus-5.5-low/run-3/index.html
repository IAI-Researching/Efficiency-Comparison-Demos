<style>

<script id="rampart-strategy">
function createStrategy() {
  var P = [1.331,1.388,2.226,0.516,0.718,4.944,4.492,0.5,0.83,1.072,0.335];
  var T = {
    bolt:   { c: 50,  d: 26,  p: 8,  r: 300, sp: 0,  sl: 0,  pi: 0, g: 1, a: 1, k: 0 },
    cannon: { c: 90,  d: 60,  p: 24, r: 260, sp: 90, sl: 0,  pi: 0, g: 1, a: 0, k: 1 },
    frost:  { c: 70,  d: 10,  p: 12, r: 240, sp: 0,  sl: 30, pi: 0, g: 1, a: 1, k: 2 },
    lance:  { c: 120, d: 180, p: 36, r: 360, sp: 0,  sl: 0,  pi: 1, g: 1, a: 0, k: 3 },
    flak:   { c: 80,  d: 40,  p: 10, r: 320, sp: 70, sl: 0,  pi: 0, g: 0, a: 1, k: 4 }
  };
  var TYPES = ["bolt", "cannon", "frost", "lance", "flak"];
  var BASE = { grunt: 60, runner: 40, wisp: 50, brute: 150, splitter: 90, mender: 70 };
  var LEAK = { grunt: 1, runner: 1, wisp: 2, brute: 3, splitter: 2, mender: 2 };
  function pts(p) {
    var out = [];
    for (var i = 1; i < p.length; i++) {
      var ax = p[i-1][0]*100+50, ay = p[i-1][1]*100+50, bx = p[i][0]*100+50, by = p[i][1]*100+50;
      var L = Math.abs(bx-ax)+Math.abs(by-ay);
      for (var q = 0; q < L; q += 25) out.push([ax + Math.sign(bx-ax)*q, ay + Math.sign(by-ay)*q]);
    }
    return out;
  }
  var GS = pts([[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]]);
  var AS = pts([[0,6],[21,6],[21,11],[23,11]]);
  var covCache = {};
  function cov(x, y, r, air) {
    var k = x + "," + y + "," + r + "," + air;
    if (covCache[k] !== undefined) return covCache[k];
    var S = air ? AS : GS, n = 0, cx = x*100+50, cy = y*100+50;
    for (var i = 0; i < S.length; i++) { var dx = S[i][0]-cx, dy = S[i][1]-cy; if (dx*dx+dy*dy <= r*r) n++; }
    covCache[k] = n; return n;
  }
  function stats(type, tier) { var d = T[type].d, r = T[type].r; for (var i = 1; i < tier; i++) { d = Math.floor(d*16/10); r += 30; } return { d: d, r: r }; }
  function mult(w) { var m = 1000; for (var i = 2; i <= w; i++) m = Math.floor(m*108/100); return m; }
  // raw per-class contribution vector of a turret
  function contrib(type, tier, sl, mix) {
    var t = T[type], s = stats(type, tier), out = [];
    for (var i = 0; i < mix.length; i++) {
      var e = mix[i];
      if (e.air ? !t.a : !t.g) { out.push(0); continue; }
      var c = cov(sl.x, sl.y, s.r, e.air);
      var dmg = t.pi ? s.d : Math.max(1, s.d - e.armor);
      dmg = Math.min(dmg, e.hp);
      if (t.sp) dmg *= (e.air ? P[6] : P[5]);
      if (t.sl) dmg += P[7] * e.hp * 0.05;
      out.push(dmg * c / t.p / e.hp * P[t.k]);
    }
    return out;
  }
  function score(prov, mix) {
    var v = 0;
    for (var i = 0; i < mix.length; i++) v += mix[i].w * (1 - 1 / (1 + prov[i] * P[9] / mix[i].n));
    return v;
  }
  return {
    plan: function (st) {
      var w = st.wave + 1, m = mult(w), mix = [], counts = {};
      for (var i = 0; i < st.nextWave.length; i++) counts[st.nextWave[i]] = (counts[st.nextWave[i]] || 0) + 1;
      var kinds = ["grunt", "runner", "wisp", "brute", "splitter", "mender"];
      for (var ki = 0; ki < kinds.length; ki++) {
        var k = kinds[ki], cnt = (counts[k] || 0) + 0.3;
        var hp = Math.floor(BASE[k]*m/1000);
        var armor = k === "grunt" ? Math.floor(w/4) : k === "brute" ? 6 + w : 0;
        mix.push({ air: k === "wisp" ? 1 : 0, hp: hp, armor: armor, n: cnt, w: cnt * (1 + P[10]*LEAK[k]) });
        if (k === "splitter") mix.push({ air: 0, hp: Math.max(1, Math.floor(hp/4)), armor: 0, n: cnt*3, w: cnt*3*(1+P[10]) });
      }
      var gold = st.gold, acts = [];
      var slots = st.slots.map(function (s) { return { slot: s.slot, x: s.x, y: s.y, t: s.turret ? { type: s.turret.type, tier: s.turret.tier, spent: s.turret.spent } : null }; });
      var cc = {};
      function C(type, tier, s) { var key = type + tier + "_" + s.slot; if (!cc[key]) cc[key] = contrib(type, tier, s, mix); return cc[key]; }
      for (var iter = 0; iter < 32; iter++) {
        var prov = mix.map(function () { return 0; });
        slots.forEach(function (s) { if (s.t) { var c = C(s.t.type, s.t.tier, s); for (var i = 0; i < c.length; i++) prov[i] += c[i]; } });
        var base = score(prov, mix);
        function gainOf(rem, add) { var p2 = prov.slice(); for (var i = 0; i < p2.length; i++) p2[i] += add[i] - (rem ? rem[i] : 0); return score(p2, mix) - base; }
        var best = null;
        for (var j = 0; j < slots.length; j++) {
          var s = slots[j];
          if (!s.t) {
            for (var q = 0; q < TYPES.length; q++) {
              var ty = TYPES[q], c = T[ty].c, r = gainOf(null, C(ty, 1, s)) / c;
              if (!best || r > best.r) best = { r: r, c: c, act: { op: "build", slot: j, type: ty }, s: s, ty: ty };
            }
          } else if (s.t.tier < 3) {
            var c2 = T[s.t.type].c * s.t.tier;
            var r2 = gainOf(C(s.t.type, s.t.tier, s), C(s.t.type, s.t.tier+1, s)) / c2 * P[8];
            if (!best || r2 > best.r) best = { r: r2, c: c2, act: { op: "upgrade", slot: j }, s: s };
          }
        }
        if (!best) {
          var worst = null;
          for (var j2 = 0; j2 < slots.length; j2++) {
            var s2 = slots[j2];
            for (var q2 = 0; q2 < TYPES.length; q2++) {
              var ty2 = TYPES[q2]; if (ty2 === s2.t.type) continue;
              var g = gainOf(C(s2.t.type, s2.t.tier, s2), C(ty2, 3, s2));
              if (g > 0 && (!worst || g > worst.g)) worst = { g: g, s: s2, ty: ty2 };
            }
          }
          if (worst && gold + Math.floor(worst.s.t.spent*70/100) >= T[worst.ty].c * 4) {
            acts.push({ op: "sell", slot: worst.s.slot }); gold += Math.floor(worst.s.t.spent*70/100);
            acts.push({ op: "build", slot: worst.s.slot, type: worst.ty }); gold -= T[worst.ty].c;
            worst.s.t = { type: worst.ty, tier: 1, spent: T[worst.ty].c };
            continue;
          }
          break;
        }
        if (best.c > gold) break;
        gold -= best.c; acts.push(best.act);
        if (best.act.op === "build") best.s.t = { type: best.ty, tier: 1, spent: best.c };
        else { best.s.t.spent += best.c; best.s.t.tier++; }
      }
      return acts;
    },
    target: function (tu, cands) {
      var t = T[tu.type], d = stats(tu.type, tu.tier).d, best = null, bs = -Infinity;
      for (var i = 0; i < cands.length; i++) {
        var e = cands[i], sc;
        if (t.sp) {
          var n = 0;
          for (var j = 0; j < cands.length; j++) { var dx = cands[j].x - e.x, dy = cands[j].y - e.y; if (dx*dx+dy*dy <= t.sp*t.sp) n += Math.min(cands[j].hp, Math.max(1, d - cands[j].armor)); }
          sc = n * 10000 - e.remaining;
        } else if (t.sl) {
          sc = (e.slowed ? 0 : 1e7) + e.maxHp * 10 - e.remaining / 100;
        } else {
          var eff = t.pi ? d : Math.max(1, d - e.armor);
          sc = Math.min(eff, e.hp) * 10000 - e.remaining;
          if (e.type === "mender") sc += 50000;
        }
        if (sc > bs) { bs = sc; best = e.id; }
      }
      return best;
    }
  };
}
</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks, rec) {
  var GP=[[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]];
  var AP=[[0,6],[21,6],[21,11],[23,11]];
  function mk(p){var pts=p.map(function(q){return [q[0]*100+50,q[1]*100+50];});var L=0;for(var i=1;i<pts.length;i++)L+=Math.abs(pts[i][0]-pts[i-1][0])+Math.abs(pts[i][1]-pts[i-1][1]);return {pts:pts,len:L};}
  var R=[mk(GP),mk(AP)];
  function pos(r,p){var pts=r.pts;for(var i=1;i<pts.length;i++){var a=pts[i-1],b=pts[i];var l=Math.abs(b[0]-a[0])+Math.abs(b[1]-a[1]);if(p<=l||i==pts.length-1){var q=Math.min(p,l);return [a[0]+Math.sign(b[0]-a[0])*q,a[1]+Math.sign(b[1]-a[1])*q];}p-=l;}}
  var SL=[[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],[14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]];
  var TN=["bolt","cannon","frost","lance","flak"];
  var TT={bolt:[50,26,8,300,0,0,0,1,1],cannon:[90,60,24,260,90,0,0,1,0],frost:[70,10,12,240,0,30,0,1,1],lance:[120,180,36,360,0,0,1,1,0],flak:[80,40,10,320,70,0,0,0,1]};
  var ET={grunt:[60,10,4,1,0,1,10],runner:[40,20,4,1,0,2,4],wisp:[50,12,6,2,1,3,3],brute:[150,6,9,3,0,4,3],splitter:[90,8,6,2,0,6,2],mender:[70,8,7,2,0,8,1],splitling:[0,12,1,1,0,999,0]};
  var EO=["grunt","runner","wisp","brute","splitter","mender"];
  function armorOf(t,w){return t=="grunt"?Math.floor(w/4):t=="brute"?6+w:0;}
  var mcache=[0,1000];function mw(w){while(mcache.length<=w)mcache.push(Math.floor(mcache[mcache.length-1]*108/100));return mcache[w];}
  function mulberry32(a){return function(){a=(a+0x6D2B79F5)|0;var t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return (t^(t>>>14))>>>0;};}
  var rng=mulberry32(seed);
  function gen(w){var n=4+Math.floor(3*w/5),out=[];var av=EO.filter(function(t){return ET[t][5]<=w;});var tw=0;av.forEach(function(t){tw+=ET[t][6];});for(var i=0;i<n;i++){var r=rng()%tw;for(var j=0;j<av.length;j++){if(r<ET[av[j]][6]){out.push(av[j]);break;}r-=ET[av[j]][6];}}return out;}
  var strat=createStrategy();
  var gold=250,baseHp=10,log=[],nextId=1,enemies=[],queue=[],turrets=[];for(var z=0;z<16;z++)turrets.push(null);
  var waves={1:gen(1)},wave=0,fallTick=-1,endTick=maxTicks;
  function newEnemy(type,w,maxHp,prog){var e=ET[type];var air=e[4];return {id:nextId++,type:type,hp:maxHp,maxHp:maxHp,armor:armorOf(type,w),speed:e[1],progress:prog,age:0,slow:0,wave:w,air:air,r:R[air]};}
  function epos(e){return pos(e.r,e.progress);}
  function view(e){var p=epos(e);return {id:e.id,type:e.type,hp:e.hp,maxHp:e.maxHp,x:p[0],y:p[1],air:e.air,armor:e.armor,speed:e.speed,slowed:e.slow>0?1:0,remaining:e.r.len-e.progress};}
  function tstats(t){var b=TT[t.type],d=b[1],rg=b[3];for(var i=1;i<t.tier;i++){d=Math.floor(d*16/10);rg+=30;}return {d:d,rg:rg};}
  for(var tick=0;tick<maxTicks;tick++){
    var R_shots=[],R_heals=[],R_kills=[],R_leaks=[],R_acts=[];
    if(tick>=20&&(tick-20)%40==0){
      wave=(tick-20)/40+1;var w=wave;
      gold+=Math.min(50,Math.floor(gold*5/100))+10+2*w;
      waves[w+1]=gen(w+1);
      var st={tick:tick,wave:w,gold:gold,baseHp:baseHp,slots:SL.map(function(s,i){var t=turrets[i];return {slot:i,x:s[0],y:s[1],turret:t?{type:t.type,tier:t.tier,spent:t.spent}:null};}),enemies:enemies.map(view),nextWave:waves[w+1].slice()};
      var acts=strat.plan(st);
      if(Array.isArray(acts))for(var ai=0;ai<acts.length&&ai<32;ai++){var a=acts[ai];if(!a||typeof a!="object")continue;var s=a.slot;if(typeof s!="number"||s<0||s>15||Math.floor(s)!==s)continue;var t,c;
        if(a.op=="build"){var ti=TN.indexOf(a.type);if(ti<0||turrets[s])continue;c=TT[a.type][0];if(gold<c)continue;gold-=c;turrets[s]={type:a.type,ti:ti,tier:1,spent:c,cd:0,slot:s,x:SL[s][0]*100+50,y:SL[s][1]*100+50};log.push([tick,"B",s,ti]);R_acts.push([s,"B",ti]);}
        else if(a.op=="upgrade"){t=turrets[s];if(!t||t.tier>=3)continue;c=TT[t.type][0]*t.tier;if(gold<c)continue;gold-=c;t.spent+=c;t.tier++;log.push([tick,"U",s,t.tier]);R_acts.push([s,"U",t.ti]);}
        else if(a.op=="sell"){t=turrets[s];if(!t)continue;gold+=Math.floor(t.spent*70/100);turrets[s]=null;log.push([tick,"S",s,0]);R_acts.push([s,"S",t.ti]);}}
      waves[w].forEach(function(ty,i){queue.push([tick+4*i,w,i,ty]);});
      queue.sort(function(a,b){return a[0]-b[0]||a[1]-b[1]||a[2]-b[2];});
      delete waves[w];
    }
    while(queue.length&&queue[0][0]<=tick){var q=queue.shift();enemies.push(newEnemy(q[3],q[1],Math.floor(ET[q[3]][0]*mw(q[1])/1000),0));}
    var fell=false;
