<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last Rampart</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">

      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>

  </div>

  <input id="scrubber" type="range" min="0" max="100" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script id="rampart-strategy">
function createStrategy() {

  var prm = { alpha: 1.924, cover0: 637.8, cannonHits: 6.81, flakHits: 1.486, look: 2.969, frostMax: 1, grow: 2.35 };
  var TD = { bolt: [50, 26, 8, 300, 0, 0, 0, 1, 1], cannon: [90, 60, 24, 260, 90, 0, 0, 1, 0], frost: [70, 10, 12, 240, 0, 30, 0, 1, 1], lance: [120, 180, 36, 360, 0, 0, 1, 1, 0], flak: [80, 40, 10, 320, 70, 0, 0, 0, 1] };
  var TYPES = ["bolt", "cannon", "frost", "lance", "flak"];
  var EH = { grunt: 60, runner: 40, wisp: 50, brute: 150, splitter: 90, mender: 70 };
  var SPD = { grunt: 10, runner: 20, wisp: 12, brute: 6, splitter: 8, mender: 8, splitling: 12 };
  var KS = ["grunt", "runner", "wisp", "brute", "splitter", "mender", "splitling"];
  var SL = [[3, 3], [5, 5], [7, 4], [7, 8], [9, 9], [10, 5], [11, 8], [13, 8], [14, 5], [15, 2], [16, 7], [17, 4], [19, 8], [20, 10], [22, 9], [3, 7]];
  function samples(pts) {
    var out = [];
    for (var i = 1; i < pts.length; i++) {
      var ax = pts[i - 1][0] * 100 + 50, ay = pts[i - 1][1] * 100 + 50, bx = pts[i][0] * 100 + 50, by = pts[i][1] * 100 + 50;
      var L = Math.abs(bx - ax) + Math.abs(by - ay);
      for (var d = 0; d < L; d += 10) out.push([ax + Math.sign(bx - ax) * d, ay + Math.sign(by - ay) * d]);
    }
    return out;
  }
  var GS = samples([[0, 2], [6, 2], [6, 10], [12, 10], [12, 3], [18, 3], [18, 11], [23, 11]]);
  var AS = samples([[0, 6], [21, 6], [21, 11], [23, 11]]);
  var covCache = {};
  function cover(slot, range, air) {
    var key = slot + ":" + range + ":" + air;
    if (covCache[key] !== undefined) return covCache[key];
    var S = air ? AS : GS, x = SL[slot][0] * 100 + 50, y = SL[slot][1] * 100 + 50, n = 0;
    for (var i = 0; i < S.length; i++) { var dx = S[i][0] - x, dy = S[i][1] - y; if (dx * dx + dy * dy <= range * range) n++; }
    return (covCache[key] = n * 10);
  }
  function dmgAt(type, tier) { var d = TD[type][1]; for (var k = 1; k < tier; k++) d = Math.floor(d * 16 / 10); return d; }
  function mval(w) { var m = 1000; for (var i = 1; i < w; i++) m = Math.floor(m * 108 / 100); return m; }
  function armor(k, w) { return k === "grunt" ? Math.floor(w / 4) : k === "brute" ? 6 + w : 0; }
  // capacity contribution of a turret against each enemy kind
  function contrib(slot, type, tier, w, out, frostN) {
    var d = TD[type], dmg = dmgAt(type, tier), range = d[3] + 30 * (tier - 1);
    for (var j = 0; j < KS.length; j++) {
      var k = KS[j], air = k === "wisp";
      if (air ? !d[8] : !d[7]) continue;
      var eff = d[6] ? dmg : Math.max(1, dmg - armor(k, w));
      var hits = d[4] ? (type === "cannon" ? prm.cannonHits : prm.flakHits) : 1;
      var cv = cover(slot, range, air ? 1 : 0);
      var busy = Math.min(1, cv / prm.cover0);
      var v = eff / d[2] * hits * busy * 20;
      if (type === "frost") v = v + (frostN < prm.frostMax ? 25 * busy * (1 + w * 0.15) : 0);
      out[j] += v;
    }
  }
  function objective(turr, w, need) {
    var cap = [0, 0, 0, 0, 0, 0, 0], fN = 0;
    for (var s = 0; s < 16; s++) if (turr[s]) { contrib(s, turr[s].type, turr[s].tier, w, cap, fN); if (turr[s].type === "frost") fN++; }
    var J = 0;
    for (var j = 0; j < KS.length; j++) if (need[j] > 0) J += need[j] * (1 - Math.exp(-cap[j] * prm.alpha / need[j]));
    return J;
  }
  function plan(st) {
    var w = st.wave + 1, mv = mval(w) * prm.grow;
    var need = [0, 0, 0, 0, 0, 0, 0];
    // demand: hp of next wave by kind + baseline so all kinds are covered
    var nw = st.nextWave;
    for (var i = 0; i < nw.length; i++) {
      var k = nw[i], j = KS.indexOf(k);
      need[j] += EH[k] * mv / 1000;
      if (k === "splitter") need[6] += 3 * Math.max(1, Math.floor(EH[k] * mv / 4000));
    }
    var baseW = 4 + Math.floor(3 * w / 5);
    var expect = [10, 4, 3, 3, 2, 1, 0], tw = 0, avail = [1, 2, 3, 4, 6, 8, 99];
    for (j = 0; j < 6; j++) if (avail[j] <= w + 2) tw += expect[j];
    for (j = 0; j < 6; j++) if (avail[j] <= w + 2) need[j] += prm.look * baseW * expect[j] / tw * EH[KS[j]] * mv / 1000;
    var turr = []; for (var s = 0; s < 16; s++) turr.push(st.slots[s].turret ? { type: st.slots[s].turret.type, tier: st.slots[s].turret.tier, spent: st.slots[s].turret.spent } : null);
    var gold = st.gold, acts = [];
    var J0 = objective(turr, w, need);
    for (var iter = 0; iter < 30; iter++) {
      var best = null, bestR = 0;
      for (s = 0; s < 16; s++) {
        var t = turr[s];
        if (!t) {
          for (var ti = 0; ti < TYPES.length; ti++) {
            var ty = TYPES[ti], c = TD[ty][0]; if (c > gold) continue;
            turr[s] = { type: ty, tier: 1, spent: c };
            var r = (objective(turr, w, need) - J0) / c; turr[s] = null;
            if (r > bestR) { bestR = r; best = { op: "build", slot: s, type: ty, cost: c }; }
          }
        } else if (t.tier < 3) {
          c = TD[t.type][0] * (t.tier === 1 ? 1 : 2); if (c > gold) continue;
          t.tier++; r = (objective(turr, w, need) - J0) / c; t.tier--;
          if (r > bestR) { bestR = r; best = { op: "upgrade", slot: s, cost: c }; }
        }
      }
      if (!best) break;
      if (best.op === "build") turr[best.slot] = { type: best.type, tier: 1, spent: best.cost };
      else { turr[best.slot].tier++; turr[best.slot].spent += best.cost; }
      gold -= best.cost; J0 = objective(turr, w, need);
      acts.push(best.op === "build" ? { op: "build", slot: best.slot, type: best.type } : { op: "upgrade", slot: best.slot });
    }
    // late game: replace a weak turret when the board is maxed
    if (acts.length === 0) {
      var full = true; for (s = 0; s < 16; s++) if (!turr[s] || turr[s].tier < 3) full = false;
      if (full) {
        var bestS = null, bestG = 0;
        for (s = 0; s < 16; s++) {
          var old = turr[s], refund = Math.floor(old.spent * 70 / 100), g = gold + refund;
          for (ti = 0; ti < TYPES.length; ti++) {
            ty = TYPES[ti]; if (ty === old.type) continue; var tc = TD[ty][0] * 4; if (tc > g) continue;
            turr[s] = { type: ty, tier: 3, spent: tc };
            var gain = objective(turr, w, need) - J0; turr[s] = old;
            if (gain > bestG && gain > J0 * 0.03) { bestG = gain; bestS = { slot: s, type: ty }; }
          }
        }
        if (bestS) acts.push({ op: "sell", slot: bestS.slot }, { op: "build", slot: bestS.slot, type: bestS.type }, { op: "upgrade", slot: bestS.slot }, { op: "upgrade", slot: bestS.slot });
      }
    }
    return acts;
  }
  function target(tu, cands) {
    var d = TD[tu.type], dmg = dmgAt(tu.type, tu.tier), best = null, bs = -1e18;
    for (var i = 0; i < cands.length; i++) {
      var e = cands[i], eff = d[6] ? dmg : Math.max(1, dmg - e.armor), sc;
      if (tu.type === "frost") sc = (e.slowed > 2 ? -1e6 : 0) + e.hp - e.remaining * 0.01;
      else if (tu.type === "lance") sc = Math.min(e.hp, eff) * 10 - e.remaining * 0.05;
      else sc = (eff * 2 >= Math.min(dmg, e.hp) ? 1e6 : 0) - e.remaining;
      if (sc > bs) { bs = sc; best = e.id; }
    }
    return best;
  }
  return { plan: plan, target: target };
}
</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks, rec) {
  var TT = ["bolt", "cannon", "frost", "lance", "flak"];
  // cost, dmg, period, range, splash, slow, pierce, ground, air
  var TD = { bolt: [50, 26, 8, 300, 0, 0, 0, 1, 1], cannon: [90, 60, 24, 260, 90, 0, 0, 1, 0], frost: [70, 10, 12, 240, 0, 30, 0, 1, 1], lance: [120, 180, 36, 360, 0, 0, 1, 1, 0], flak: [80, 40, 10, 320, 70, 0, 0, 0, 1] };
  var ET = ["grunt", "runner", "wisp", "brute", "splitter", "mender"];
  // hp, speed, bounty, leak, air, firstWave, weight
  var ED = { grunt: [60, 10, 4, 1, 0, 1, 10], runner: [40, 20, 4, 1, 0, 2, 4], wisp: [50, 12, 6, 2, 1, 3, 3], brute: [150, 6, 9, 3, 0, 4, 3], splitter: [90, 8, 6, 2, 0, 6, 2], mender: [70, 8, 7, 2, 0, 8, 1], splitling: [0, 12, 1, 1, 0, 0, 0] };
  var SL = [[3, 3], [5, 5], [7, 4], [7, 8], [9, 9], [10, 5], [11, 8], [13, 8], [14, 5], [15, 2], [16, 7], [17, 4], [19, 8], [20, 10], [22, 9], [3, 7]];
  function mkRoute(pts) {
    var p = pts.map(function (q) { return [q[0] * 100 + 50, q[1] * 100 + 50]; }), cum = [0];
    for (var i = 1; i < p.length; i++) cum.push(cum[i - 1] + Math.abs(p[i][0] - p[i - 1][0]) + Math.abs(p[i][1] - p[i - 1][1]));
    return { p: p, cum: cum, len: cum[cum.length - 1] };
  }
  var GR = mkRoute([[0, 2], [6, 2], [6, 10], [12, 10], [12, 3], [18, 3], [18, 11], [23, 11]]);
  var AR = mkRoute([[0, 6], [21, 6], [21, 11], [23, 11]]);
  function pos(r, d) {
    var i = 1; while (i < r.cum.length - 1 && r.cum[i] < d) i++;
    var a = r.p[i - 1], b = r.p[i], t = d - r.cum[i - 1];
    return [a[0] + Math.sign(b[0] - a[0]) * t, a[1] + Math.sign(b[1] - a[1]) * t];
  }
  function mulberry32(a) { return function () {
    a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return (t ^ (t >>> 14)) >>> 0; }; }
  var rng = mulberry32(seed);
  function genWave(w) {
    var n = 4 + Math.floor(3 * w / 5), av = [], tot = 0, out = [];
    for (var k = 0; k < ET.length; k++) if (ED[ET[k]][5] <= w) { av.push(ET[k]); tot += ED[ET[k]][6]; }
    for (var i = 0; i < n; i++) {
      var r = rng() % tot;
      for (var j = 0; j < av.length; j++) { var wt = ED[av[j]][6]; if (r < wt) { out.push(av[j]); break; } r -= wt; }
    }
    return out;
  }
  var mult = [0, 1000];
  function m(w) { while (mult.length <= w) mult.push(Math.floor(mult[mult.length - 1] * 108 / 100)); return mult[w]; }
  var strat = createStrategy();
  var gold = 250, baseHp = 10, wave = 0, nextId = 1, log = [], enemies = [], queue = [], qi = 0;
  var turrets = [], s, i, j, e, t, dx, dy, keep;
  for (s = 0; s < 16; s++) turrets.push(null);
  var waves = [null, genWave(1)];
  var fallTick = -1, endTick = maxTicks;
  function armorOf(type, w) { return type === "grunt" ? Math.floor(w / 4) : type === "brute" ? 6 + w : 0; }
  function mkEnemy(type, w, prog, maxHp) {
    var d = ED[type], r = d[4] ? AR : GR;
    var en = { id: nextId++, type: type, wave: w, maxHp: maxHp, hp: maxHp, speed: d[1], armor: armorOf(type, w), bounty: d[2], leak: d[3], air: d[4], route: r, progress: prog, age: 0, slow: 0, x: 0, y: 0 };
    var q = pos(r, prog); en.x = q[0]; en.y = q[1]; return en;
  }
  function view(en) { return { id: en.id, type: en.type, hp: en.hp, maxHp: en.maxHp, x: en.x, y: en.y, air: en.air, armor: en.armor, speed: en.speed, slowed: en.slow, remaining: en.route.len - en.progress }; }
  function tstat(tu) {
    var dmg = TD[tu.type][1]; for (var k = 1; k < tu.tier; k++) dmg = Math.floor(dmg * 16 / 10);
    return { dmg: dmg, range: TD[tu.type][3] + 30 * (tu.tier - 1) };
  }
  for (var tick = 0; tick < maxTicks; tick++) {
    if (tick >= 20 && (tick - 20) % 40 === 0) {
      wave = (tick - 20) / 40 + 1;
      gold += Math.min(50, Math.floor(gold * 5 / 100)) + 10 + 2 * wave;
      waves[wave + 1] = genWave(wave + 1);
      var st = { tick: tick, wave: wave, gold: gold, baseHp: baseHp, slots: [], enemies: enemies.map(view), nextWave: waves[wave + 1].slice() };
      for (s = 0; s < 16; s++) st.slots.push({ slot: s, x: SL[s][0], y: SL[s][1], turret: turrets[s] ? { type: turrets[s].type, tier: turrets[s].tier, spent: turrets[s].spent } : null });
      var acts = strat.plan(st);
      if (Array.isArray(acts)) for (var ai = 0; ai < acts.length && ai < 32; ai++) {
        var a = acts[ai]; if (!a || typeof a !== "object") continue;
        var sl = a.slot; if (typeof sl !== "number" || sl % 1 !== 0 || sl < 0 || sl > 15) continue;
        t = turrets[sl];
        if (a.op === "build") {
          if (t || !TD.hasOwnProperty(a.type) || gold < TD[a.type][0]) continue;
          gold -= TD[a.type][0]; turrets[sl] = { type: a.type, tier: 1, spent: TD[a.type][0], cd: 0 };
          log.push([tick, "B", sl, TT.indexOf(a.type)]); if (rec) rec.ev(tick, "B", sl, a.type);
        } else if (a.op === "upgrade") {
          if (!t || t.tier >= 3) continue; var c = TD[t.type][0] * (t.tier === 1 ? 1 : 2); if (gold < c) continue;
          gold -= c; t.tier++; t.spent += c; log.push([tick, "U", sl, t.tier]); if (rec) rec.ev(tick, "U", sl, t.type);
        } else if (a.op === "sell") {
          if (!t) continue; gold += Math.floor(t.spent * 70 / 100); turrets[sl] = null;
          log.push([tick, "S", sl, 0]); if (rec) rec.ev(tick, "S", sl, t.type);
        }
      }
      var wl = waves[wave]; queue = queue.slice(qi); qi = 0;
      for (i = 0; i < wl.length; i++) queue.push([tick + 4 * i, wave, wl[i], i]);
      queue.sort(function (u, v) { return u[0] - v[0] || u[1] - v[1] || u[3] - v[3]; });
    }
    while (qi < queue.length && queue[qi][0] === tick) { var q = queue[qi++]; enemies.push(mkEnemy(q[2], q[1], 0, Math.floor(ED[q[2]][0] * m(q[1]) / 1000))); }
    var fell = false; keep = [];
    for (i = 0; i < enemies.length; i++) {
      e = enemies[i];
      if (fell) { keep.push(e); continue; }
      e.progress += e.slow > 0 ? Math.floor(e.speed * 60 / 100) : e.speed;
      if (e.progress >= e.route.len) {
        baseHp -= e.leak; log.push([tick, "L", e.id, baseHp]); if (rec) rec.ev(tick, "L", e.id, baseHp);
        if (baseHp <= 0) fell = true;

  layoutHud({ wave: mt[2], gold: mt[0], hp: Math.max(0, hpNow), pipFlash: pf });

  renderer.setRenderTarget(null); renderer.clear();
  renderer.render(scene, camera);
  renderer.clearDepth();
  var tm = renderer.toneMapping; renderer.toneMapping = THREE.NoToneMapping;
  renderer.render(hudScene, hudCam);
  renderer.toneMapping = tm;
}

// ---------------- Audio ----------------
var AC = window.AudioContext || window.webkitAudioContext, actx = null, master = null, comp = null, noiseBuf = null, live = [], shotTimes = [], popTimes = [], wind = null;
try {
  actx = new AC(); actx.resume();
  comp = actx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 6; comp.connect(actx.destination);
  master = actx.createGain(); master.gain.value = 0; master.connect(comp);
  var ar = mulberry32(4242); noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate); var nd = noiseBuf.getChannelData(0); for (var ni = 0; ni < nd.length; ni++) nd[ni] = ar() * 2 - 1;
} catch (err) { actx = null; }
function resumeAudio() { if (actx && actx.state !== "running") actx.resume(); }
window.addEventListener("pointerdown", resumeAudio); window.addEventListener("keydown", resumeAudio);
var ar2 = mulberry32(4242);
function out(pan, vol) { var g = actx.createGain(); g.gain.value = vol; var p = actx.createStereoPanner ? actx.createStereoPanner() : null; if (p) { p.pan.value = Math.max(-1, Math.min(1, pan)); g.connect(p); p.connect(master); } else g.connect(master); return g; }
function track(node, dur) { live.push(node); node.onended = function () { var i = live.indexOf(node); if (i >= 0) live.splice(i, 1); }; }
function tone(type, f0, f1, dur, vol, pan, delay) {
  var t = actx.currentTime + (delay || 0), o = actx.createOscillator(), g = out(pan, 0); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); o.start(t); o.stop(t + dur + 0.02); track(o);
}
function noise(ftype, freq, q, dur, vol, pan, delay) {
  var t = actx.currentTime + (delay || 0), s = actx.createBufferSource(); s.buffer = noiseBuf; var f = actx.createBiquadFilter(); f.type = ftype; f.frequency.value = freq; f.Q.value = q;
  var g = out(pan, 0); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); s.start(t, ar2() * 1.5); s.stop(t + dur + 0.02); track(s);
}
var SHOT_PRI = { lance: 0, cannon: 1, flak: 2, frost: 3, bolt: 4 };
function shotSound(type, pan) {
  var v = 0.9 + ar2() * 0.2;
  if (type === "bolt") tone("square", 1100 * v, 420, 0.06, 0.08, pan);
  else if (type === "cannon") { tone("sine", 110 * v, 45, 0.25, 0.35, pan); noise("lowpass", 500, 0.7, 0.2, 0.25, pan); }
  else if (type === "frost") { tone("sine", 1900 * v, 1300, 0.14, 0.07, pan); noise("highpass", 5000, 0.5, 0.12, 0.06, pan); }
  else if (type === "lance") { tone("sawtooth", 320 * v, 70, 0.32, 0.16, pan); noise("bandpass", 1500, 1, 0.2, 0.12, pan); }
  else { noise("bandpass", 1300 * v, 2, 0.09, 0.22, pan); tone("triangle", 600, 300, 0.06, 0.06, pan); }
}
function playEvents(k0, k1) {
  if (!actx) return;
  var now = actx.currentTime, i, j;
  shotTimes = shotTimes.filter(function (t) { return now - t < 1; }); popTimes = popTimes.filter(function (t) { return now - t < 1; });
  for (var k = k0 + 1; k <= k1; k++) {
    if (k >= 20 && (k - 20) % 40 === 0 && (FALL < 0 || k <= FALL)) { tone("sawtooth", 160, 250, 0.6, 0.1, 0); tone("sine", 240, 375, 0.6, 0.08, 0, 0.05); }
  }
  var cand = [];
  for (j = lowerTick(shots, k0 + 1); j < shots.length && shots[j].t <= k1; j++) cand.push(shots[j]);
  cand.sort(function (a, b) { return SHOT_PRI[a.type] - SHOT_PRI[b.type]; });
  for (i = 0; i < cand.length && shotTimes.length < 12; i++) { shotSound(cand[i].type, (SLOTS[cand[i].s][0] / 23) * 2 - 1); shotTimes.push(now); }
  for (j = lowerTick(kills, k0 + 1); j < kills.length && kills[j].t <= k1; j++) if (popTimes.length < 10) { tone("sine", 700 + ar2() * 200, 180, 0.08, 0.12, kills[j].x / 12 - 1); popTimes.push(now); }
  for (j = lowerTick(leaks, k0 + 1); j < leaks.length && leaks[j].t <= k1; j++) { noise("highpass", 1200, 0.7, 0.18, 0.35, 0.9); tone("square", 880, 870, 0.12, 0.06, 0.9); tone("square", 660, 650, 0.14, 0.06, 0.9, 0.14); }
  if (FALL >= 0 && k0 < FALL && k1 >= FALL) { tone("sine", 70, 25, 2.5, 0.6, 0.9); noise("lowpass", 160, 0.8, 3.0, 0.7, 0.9); noise("lowpass", 600, 0.6, 0.8, 0.4, 0.9); }
}
function setWind(on) {
  if (!actx) return;
  if (on && !wind) { var s = actx.createBufferSource(); s.buffer = noiseBuf; s.loop = true; var f = actx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 380; f.Q.value = 0.6; var g = out(0, 0.0001); g.gain.exponentialRampToValueAtTime(0.12, actx.currentTime + 1.2); s.connect(f); f.connect(g); s.start(); wind = s; }
  else if (!on && wind) { try { wind.stop(); } catch (e) {} wind = null; }
}
function audioState(playing) {
  if (!actx) return;
  master.gain.cancelScheduledValues(actx.currentTime);
  master.gain.setTargetAtTime(playing ? 0.8 : 0, actx.currentTime, 0.01);
  if (!playing) { live.slice().forEach(function (n) { try { n.stop(); } catch (e) {} }); live = []; setWind(false); }
}

// ---------------- Playback state machine ----------------
var scrubber = document.getElementById("scrubber"), cd = document.getElementById("countdown"), btnT = document.getElementById("btn-toggle"), btnR = document.getElementById("btn-refire");
var iPause = document.getElementById("icon-pause"), iPlay = document.getElementById("icon-play");
var state = "INIT", simTime = 0, playbackSpeed = 1.0, countdownElapsed = 0, holdElapsed = 0, lastTs = null, audioOn = null;
function icons(playing) { iPause.style.display = playing ? "" : "none"; iPlay.style.display = playing ? "none" : ""; btnT.setAttribute("aria-label", playing ? "Pause" : "Play"); }
function hideCd() { cd.style.display = "none"; cd.textContent = ""; }
function setAudio(on) { if (audioOn !== on) { audioOn = on; audioState(on); } }
btnT.addEventListener("click", function () {
  if (state === "PLAYING") { state = "PAUSED"; icons(false); }
  else if (state === "COUNTDOWN" || state === "REFIRE_HOLD") { hideCd(); simTime = 0; scrubber.value = "0"; state = "PAUSED"; icons(false); renderAt(0); }
  else if (state === "PAUSED") { state = "PLAYING"; icons(true); }
  else if (state === "ENDED") { simTime = 0; scrubber.value = "0"; hideCd(); state = "PLAYING"; icons(true); renderAt(0); }
  setAudio(state === "PLAYING");
});
document.querySelectorAll(".speed-pill").forEach(function (b) {
  b.addEventListener("click", function () {
    playbackSpeed = parseFloat(b.getAttribute("data-speed"));
    document.querySelectorAll(".speed-pill").forEach(function (o) { var on = o === b; o.classList.toggle("is-active", on); o.setAttribute("aria-checked", on ? "true" : "false"); });
  });
});
scrubber.addEventListener("input", function () {
  hideCd(); simTime = Math.max(0, Math.min(DURATION, parseFloat(scrubber.value) || 0)); state = "PAUSED"; icons(false); setAudio(false); renderAt(simTime);
});
btnR.addEventListener("click", function () {
  hideCd(); simTime = 0; scrubber.value = "0"; renderAt(0); icons(true); state = "REFIRE_HOLD"; holdElapsed = 0; setAudio(false);
});
function frame(ts) {
  var raw = lastTs === null ? 0 : (ts - lastTs) / 1000; lastTs = ts; var dt = Math.min(Math.max(raw, 0), 0.1);
  if (state === "INIT") { state = "COUNTDOWN"; countdownElapsed = 0; }
  else if (state === "COUNTDOWN") countdownElapsed += dt;
  if (state === "COUNTDOWN") {
    if (countdownElapsed >= 3) { hideCd(); state = "PLAYING"; icons(true); }
    else { cd.style.display = "block"; cd.textContent = countdownElapsed < 1 ? "3" : countdownElapsed < 2 ? "2" : "1"; simTime = 0; scrubber.value = "0"; }
  } else if (state === "REFIRE_HOLD") {
    holdElapsed += dt; if (holdElapsed >= 1) { state = "PLAYING"; }
  } else if (state === "PLAYING") {
    var prev = simTime; simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
    setAudio(true);
    playEvents(Math.floor(prev * TPS), Math.min(Math.floor(simTime * TPS), LAST));
    if (FALL >= 0 && simTime >= FALLT + 0.5) setWind(true);
    scrubber.value = simTime.toFixed(3);
    if (simTime >= DURATION) { simTime = DURATION; scrubber.value = DURATION.toFixed(3); state = "ENDED"; icons(false); }
  }
  setAudio(state === "PLAYING");
  renderAt(simTime);
  requestAnimationFrame(frame);
}
window.addEventListener("resize", function () { renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2)); renderer.setSize(window.innerWidth, window.innerHeight, false); fitCamera(); renderAt(simTime); });
fitCamera();
cd.style.display = "block"; cd.textContent = "3";
renderAt(0);
requestAnimationFrame(frame);
})();
</script>
