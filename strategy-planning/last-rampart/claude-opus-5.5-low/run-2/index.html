<style>

<script id="rampart-strategy">
function createStrategy() {
  var K = {
    cannonSplash: 12, flakSplash: 2.5, frostVal: 0.0, airFloor: 0.1, tb: 5, reserve: 0, repl: 0, t_cannon: 1, t_flak: 1
  };
  var TD = {
    bolt: { c: 50, d: 26, p: 8, r: 300, g: 1, a: 1, pi: 0 },
    cannon: { c: 90, d: 60, p: 24, r: 260, g: 1, a: 0, pi: 0 },
    frost: { c: 70, d: 10, p: 12, r: 240, g: 1, a: 1, pi: 0 },
    lance: { c: 120, d: 180, p: 36, r: 360, g: 1, a: 0, pi: 1 },
    flak: { c: 80, d: 40, p: 10, r: 320, g: 0, a: 1, pi: 0 }
  };
  var TYPES = ['bolt', 'cannon', 'frost', 'lance', 'flak'];
  var EH = { grunt: 60, runner: 40, wisp: 50, brute: 150, splitter: 90, mender: 70 };
  var LK = { grunt: 1, runner: 1, wisp: 2, brute: 3, splitter: 2, mender: 2 };
  function poly(pts) {
    var out = [];
    for (var i = 0; i + 1 < pts.length; i++) {
      var ax = pts[i][0] * 100 + 50, ay = pts[i][1] * 100 + 50, bx = pts[i + 1][0] * 100 + 50, by = pts[i + 1][1] * 100 + 50;
      var n = (Math.abs(bx - ax) + Math.abs(by - ay)) / 10;
      for (var k = 0; k < n; k++) out.push([ax + (bx - ax) * k / n, ay + (by - ay) * k / n]);
    }
    return out;
  }
  var GP = poly([[0, 2], [6, 2], [6, 10], [12, 10], [12, 3], [18, 3], [18, 11], [23, 11]]);
  var AP = poly([[0, 6], [21, 6], [21, 11], [23, 11]]);
  function cover(path, x, y, r) {
    var c = 0;
    for (var i = 0; i < path.length; i++) { var dx = path[i][0] - x, dy = path[i][1] - y; if (dx * dx + dy * dy <= r * r) c++; }
    return c * 10;
  }
  var covCache = {};
  function cov(slot, x, y, r, air) {
    var key = slot + ':' + r + ':' + air;
    if (!(key in covCache)) covCache[key] = cover(air ? AP : GP, x, y, r);
    return covCache[key];
  }
  function dmgAt(type, tier) { var d = TD[type].d; for (var i = 1; i < tier; i++) d = Math.floor(d * 16 / 10); return d; }
  // capacity: expected damage dealt to a pass of the route = dmg/period * coverage(centi)/speed(~10)
  function contrib(slotObj, type, tier, ctx) {
    var b = TD[type], d = dmgAt(type, tier), r = b.r + 30 * (tier - 1);
    var g = 0, a = 0;
    if (b.g) {
      var eff = b.pi ? d : Math.max(1, d - ctx.gArm);
      eff = Math.min(eff, ctx.gHp * 1.2);
      var m = type === 'cannon' ? K.cannonSplash : 1;
      if (type === 'frost') eff = eff + K.frostVal * ctx.gHp / 10;
      g = eff * m / b.p * cov(slotObj.slot, slotObj.x, slotObj.y, r, 0);
    }
    if (b.a) {
      var ea = Math.min(d, ctx.aHp * 1.2);
      var ma = type === 'flak' ? K.flakSplash : 1;
      a = ea * ma / b.p * cov(slotObj.slot, slotObj.x, slotObj.y, r, 1);
    }
    return [g, a];
  }
  function mult(w) { var m = 1000; for (var i = 2; i <= w; i++) m = Math.floor(m * 108 / 100); return m; }
  var SPL = { cannon: 90, flak: 70 };
  return {
    target: function (tu, cs) {
      var mode = K['t_' + tu.type] || 0; if (!mode) return -1;
      var d = dmgAt(tu.type, tu.tier), pi = tu.type === 'lance', best = -1, bv = -1, br = 0;
      for (var i = 0; i < cs.length; i++) {
        var c = cs[i], v = 0;
        if (SPL[tu.type]) {
          var R = SPL[tu.type] * SPL[tu.type];
          for (var j = 0; j < cs.length; j++) { var o = cs[j], dx = o.x - c.x, dy = o.y - c.y; if (dx * dx + dy * dy <= R) v += Math.min(o.hp, Math.max(1, d - o.armor)); }
        } else v = Math.min(c.hp, pi ? d : Math.max(1, d - c.armor));
        v = v * (1 + K.tb / (1 + c.remaining / 100));
        if (v > bv || (v === bv && c.remaining < br)) { bv = v; best = c.id; br = c.remaining; }
      }
      return best;
    },
    plan: function (s) {
      var w = s.wave + 1, mm = mult(w);
      var gNeed = 0, aNeed = 0, gHpS = 0, gn = 0, gArmS = 0, aHp = 1;
      var list = s.nextWave;
      for (var i = 0; i < list.length; i++) {
        var t = list[i], hp = EH[t] * mm / 1000, arm = t === 'grunt' ? Math.floor(w / 4) : t === 'brute' ? 6 + w : 0;
        if (t === 'splitter') hp *= 1.75;
        if (t === 'wisp') { aNeed += hp * LK[t]; aHp = hp; }
        else { gNeed += hp * LK[t]; gHpS += hp; gArmS += arm * hp; gn++; }
      }
      var gHp = gn ? gHpS / gn : 60 * mm / 1000, gArm = gHpS ? gArmS / gHpS : 0;
      if (aNeed === 0) aNeed = gNeed * K.airFloor;
      if (aNeed < gNeed * K.airFloor) aNeed = gNeed * K.airFloor;
      var ctx = { gArm: gArm, gHp: gHp, aHp: aHp || 50 * mm / 1000 };
      var slots = s.slots.map(function (x) { return { slot: x.slot, x: x.x, y: x.y, t: x.turret ? { type: x.turret.type, tier: x.turret.tier, spent: x.turret.spent } : null }; });

        var G = 1, A = 1;
        for (var i = 0; i < 16; i++) if (slots[i].t) { var c = contrib(slots[i], slots[i].t.type, slots[i].t.tier, ctx); G += c[0]; A += c[1]; }
        return [G, A];
      }
      for (var iter = 0; iter < 32; iter++) {
        var C = caps(), U0 = gNeed * Math.log(C[0]) + aNeed * Math.log(C[1]);
        var best = null, bv = 0;
        for (var j = 0; j < 16; j++) {
          var sl = slots[j], opts = [];
          if (!sl.t) { for (var k = 0; k < TYPES.length; k++) opts.push({ op: 'build', type: TYPES[k], tier: 1, cost: TD[TYPES[k]].c }); }
          else { if (sl.t.tier < 3) opts.push({ op: 'upgrade', type: sl.t.type, tier: sl.t.tier + 1, cost: TD[sl.t.type].c * sl.t.tier });
            if (K.repl) for (var k2 = 0; k2 < TYPES.length; k2++) if (TYPES[k2] !== sl.t.type) opts.push({ op: "repl", type: TYPES[k2], tier: 3, cost: Math.max(20, 4 * TD[TYPES[k2]].c - Math.floor(sl.t.spent * 70 / 100)) * K.repl }); }
          for (var o = 0; o < opts.length; o++) {
            var op = opts[o]; if (op.cost > gold) continue;
            var nc = contrib(sl, op.type, op.tier, ctx), oc = sl.t ? contrib(sl, sl.t.type, sl.t.tier, ctx) : [0, 0];
            var U = gNeed * Math.log(C[0] + nc[0] - oc[0]) + aNeed * Math.log(C[1] + nc[1] - oc[1]);
            var v = (U - U0) / op.cost;
            if (v > bv) { bv = v; best = { j: j, op: op }; }
          }
        }
        if (!best || acts.length > 28) break;
        var bs = slots[best.j];
        if (best.op.op === 'build') { acts.push({ op: 'build', slot: best.j, type: best.op.type }); bs.t = { type: best.op.type, tier: 1, spent: TD[best.op.type].c }; }
        else if (best.op.op === "upgrade") { acts.push({ op: "upgrade", slot: best.j }); bs.t.tier++; bs.t.spent += TD[bs.t.type].c * (bs.t.tier - 1); }
        else { acts.push({ op: "sell", slot: best.j }, { op: "build", slot: best.j, type: best.op.type }, { op: "upgrade", slot: best.j }, { op: "upgrade", slot: best.j }); bs.t = { type: best.op.type, tier: 3, spent: 4 * TD[best.op.type].c }; best.op.cost /= K.repl; }
        gold -= best.op.cost;
      }
      return acts;
    }
  };
}
</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks, observer) {
  var TN = ['bolt', 'cannon', 'frost', 'lance', 'flak'];
  var TD = {
    bolt: { c: 50, d: 26, p: 8, r: 300, s: 0, sl: 0, pi: 0, g: 1, a: 1 },
    cannon: { c: 90, d: 60, p: 24, r: 260, s: 90, sl: 0, pi: 0, g: 1, a: 0 },
    frost: { c: 70, d: 10, p: 12, r: 240, s: 0, sl: 30, pi: 0, g: 1, a: 1 },
    lance: { c: 120, d: 180, p: 36, r: 360, s: 0, sl: 0, pi: 1, g: 1, a: 0 },
    flak: { c: 80, d: 40, p: 10, r: 320, s: 70, sl: 0, pi: 0, g: 0, a: 1 }
  };
  var ED = {
    grunt: { hp: 60, sp: 10, bo: 4, lk: 1, air: 0, fw: 1, wt: 10 },
    runner: { hp: 40, sp: 20, bo: 4, lk: 1, air: 0, fw: 2, wt: 4 },
    wisp: { hp: 50, sp: 12, bo: 6, lk: 2, air: 1, fw: 3, wt: 3 },
    brute: { hp: 150, sp: 6, bo: 9, lk: 3, air: 0, fw: 4, wt: 3 },
    splitter: { hp: 90, sp: 8, bo: 6, lk: 2, air: 0, fw: 6, wt: 2 },
    mender: { hp: 70, sp: 8, bo: 7, lk: 2, air: 0, fw: 8, wt: 1 },
    splitling: { hp: 0, sp: 12, bo: 1, lk: 1, air: 0, fw: 9999, wt: 0 }
  };
  var ORDER = ['grunt', 'runner', 'wisp', 'brute', 'splitter', 'mender'];
  function mkRoute(pts) {
    var segs = [], L = 0;
    for (var i = 0; i + 1 < pts.length; i++) {
      var ax = pts[i][0] * 100 + 50, ay = pts[i][1] * 100 + 50, bx = pts[i + 1][0] * 100 + 50, by = pts[i + 1][1] * 100 + 50;
      var len = Math.abs(bx - ax) + Math.abs(by - ay);
      segs.push({ ax: ax, ay: ay, dx: Math.sign(bx - ax), dy: Math.sign(by - ay), s: L, len: len });
      L += len;
    }
    return { segs: segs, L: L };
  }
  var GR = mkRoute([[0, 2], [6, 2], [6, 10], [12, 10], [12, 3], [18, 3], [18, 11], [23, 11]]);
  var AR = mkRoute([[0, 6], [21, 6], [21, 11], [23, 11]]);
  function place(e) {
    var sg = (e.air ? AR : GR).segs;
    for (var i = 0; i < sg.length; i++) {
      var q = sg[i];
      if (e.progress <= q.s + q.len || i === sg.length - 1) {

      }
    }

  var SL = [[3, 3], [5, 5], [7, 4], [7, 8], [9, 9], [10, 5], [11, 8], [13, 8], [14, 5], [15, 2], [16, 7], [17, 4], [19, 8], [20, 10], [22, 9], [3, 7]];
  var M = [0, 1000];
  function mult(w) { while (M.length <= w) M.push(Math.floor(M[M.length - 1] * 108 / 100)); return M[w]; }
  function armorOf(t, w) { return t === 'grunt' ? Math.floor(w / 4) : t === 'brute' ? 6 + w : 0; }
  function mulberry32(a) { return function () {
    a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return (t ^ (t >>> 14)) >>> 0; }; }
  var rng = mulberry32(seed);
  function genWave(w) {
    var n = 4 + Math.floor(3 * w / 5), types = [], tot = 0, out = [];
    for (var i = 0; i < ORDER.length; i++) if (ED[ORDER[i]].fw <= w) { types.push(ORDER[i]); tot += ED[ORDER[i]].wt; }
    for (var j = 0; j < n; j++) {
      var r = rng() % tot;
      for (var k = 0; k < types.length; k++) { var wt = ED[types[k]].wt; if (r < wt) { out.push(types[k]); break; } r -= wt; }
    }

  }
  function stats(t) {
    var d = TD[t.type].d;
    for (var i = 1; i < t.tier; i++) d = Math.floor(d * 16 / 10);
    return { d: d, r: TD[t.type].r + 30 * (t.tier - 1) };
  }
  function view(e) {
    return { id: e.id, type: e.type, hp: e.hp, maxHp: e.maxHp, x: e.x, y: e.y, air: e.air, armor: e.armor,

  }

  for (var i0 = 0; i0 < 16; i0++) turrets.push(null);
  var strat = createStrategy();
  var fallTick = -1, endTick = maxTicks, ev = null;
  function mkEnemy(type, w, maxHp, progress) {
    var d = ED[type];
    var e = { id: nextId++, type: type, wave: w, maxHp: maxHp, hp: maxHp, armor: armorOf(type, w), speed: d.sp, air: d.air,
      progress: progress, age: 0, slow: 0, x: 0, y: 0 };

  }
  for (var tick = 0; tick < maxTicks; tick++) {
    if (observer) ev = { shots: [], kills: [], heals: [], leaks: [], actions: [], spawns: [], waveStart: 0 };
    if (tick >= 20 && (tick - 20) % 40 === 0) {
      var w = (tick - 20) / 40 + 1; wave = w;
      if (ev) ev.waveStart = w;
      gold += Math.min(50, Math.floor(gold * 5 / 100)) + 10 + 2 * w;
      var comp = nextComp; nextComp = genWave(w + 1);
      var st = { tick: tick, wave: w, gold: gold, baseHp: baseHp, slots: [], enemies: [], nextWave: nextComp.slice() };
      for (var s = 0; s < 16; s++) st.slots.push({ slot: s, x: SL[s][0] * 100 + 50, y: SL[s][1] * 100 + 50,
        turret: turrets[s] ? { type: turrets[s].type, tier: turrets[s].tier, spent: turrets[s].spent } : null });
      for (var q = 0; q < enemies.length; q++) st.enemies.push(view(enemies[q]));
      var acts = strat.plan(st);
      if (acts && acts.length) {
        for (var ai = 0; ai < acts.length && ai < 32; ai++) {
          var A = acts[ai]; if (!A || typeof A !== 'object') continue;
          var sl = A.slot;
          if (typeof sl !== 'number' || sl < 0 || sl > 15 || (sl | 0) !== sl) continue;
          if (A.op === 'build') {
            if (turrets[sl] || !Object.prototype.hasOwnProperty.call(TD, A.type)) continue;
            var c = TD[A.type].c; if (gold < c) continue;
            gold -= c; turrets[sl] = { slot: sl, type: A.type, tier: 1, spent: c, cd: 0, x: SL[sl][0] * 100 + 50, y: SL[sl][1] * 100 + 50 };
            log.push([tick, 'B', sl, TN.indexOf(A.type)]); if (ev) ev.actions.push(['B', sl, A.type]);
          } else if (A.op === 'upgrade') {
            var T = turrets[sl]; if (!T || T.tier >= 3) continue;
            var uc = TD[T.type].c * T.tier; if (gold < uc) continue;
            gold -= uc; T.spent += uc; T.tier++;
            log.push([tick, 'U', sl, T.tier]); if (ev) ev.actions.push(['U', sl, T.type]);
          } else if (A.op === 'sell') {
            var T2 = turrets[sl]; if (!T2) continue;
            gold += Math.floor(T2.spent * 70 / 100); turrets[sl] = null;
            log.push([tick, 'S', sl, 0]); if (ev) ev.actions.push(['S', sl, T2.type]);
          }
        }
