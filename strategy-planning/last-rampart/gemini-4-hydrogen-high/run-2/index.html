<script id="rampart-strategy">
function createStrategy() {
  const COST = { bolt: 50, cannon: 90, frost: 70, lance: 120, flak: 80 };
  const DMG = {
    bolt: [0, 26, 41, 65],
    cannon: [0, 60, 96, 153],
    frost: [0, 10, 16, 25],
    lance: [0, 180, 288, 460],
    flak: [0, 40, 64, 102]
  };
  const STEPS = [
    { op: "B", s: 3, t: "cannon" }, { op: "B", s: 6, t: "cannon" },
    { op: "B", s: 12, t: "flak" },  { op: "B", s: 11, t: "flak" },
    { op: "B", s: 4, t: "cannon" }, { op: "B", s: 13, t: "cannon" },
    { op: "B", s: 14, t: "bolt" },  { op: "U", s: 4, tier: 2 },
    { op: "U", s: 3, tier: 2 },     { op: "B", s: 10, t: "frost" },
    { op: "B", s: 8, t: "cannon" }, { op: "U", s: 13, tier: 2 },
    { op: "B", s: 7, t: "cannon" }, { op: "U", s: 8, tier: 2 },
    { op: "U", s: 11, tier: 2 },    { op: "B", s: 5, t: "cannon" },
    { op: "U", s: 12, tier: 2 },    { op: "U", s: 4, tier: 3 },
    { op: "B", s: 9, t: "cannon" }, { op: "B", s: 2, t: "bolt" },
    { op: "U", s: 3, tier: 3 },     { op: "B", s: 0, t: "flak" },
    { op: "U", s: 11, tier: 3 },    { op: "U", s: 14, tier: 2 },
    { op: "U", s: 8, tier: 3 },     { op: "U", s: 7, tier: 2 },
    { op: "B", s: 1, t: "cannon" }, { op: "U", s: 5, tier: 2 },
    { op: "U", s: 12, tier: 3 },    { op: "U", s: 6, tier: 2 },
    { op: "U", s: 7, tier: 3 },     { op: "U", s: 9, tier: 2 },
    { op: "B", s: 15, t: "flak" },  { op: "U", s: 0, tier: 2 },
    { op: "U", s: 2, tier: 2 },     { op: "U", s: 5, tier: 3 },
    { op: "U", s: 2, tier: 3 },     { op: "U", s: 14, tier: 3 },
    { op: "U", s: 9, tier: 3 },     { op: "U", s: 0, tier: 3 },
    { op: "U", s: 10, tier: 2 },    { op: "U", s: 6, tier: 3 },
    { op: "U", s: 1, tier: 2 },     { op: "U", s: 15, tier: 2 },
    { op: "U", s: 1, tier: 3 },     { op: "U", s: 10, tier: 3 },
    { op: "U", s: 13, tier: 3 },    { op: "U", s: 15, tier: 3 }
  ];

  return {
    plan(state) {
      const actions = [];
      let g = state.gold;
      const slots = state.slots;
      let minRem = 9999;
      for (let i = 0; i < state.enemies.length; i++) {
        if (state.enemies[i].remaining < minRem) minRem = state.enemies[i].remaining;
      }
      const urgent = state.baseHp <= 4 || minRem < 550;

      for (let i = 0; i < STEPS.length; i++) {
        const st = STEPS[i];
        const sl = slots[st.s];
        if (st.op === "B") {
          if (sl.turret) continue;
          const c = COST[st.t];
          if (g >= c) {
            actions.push({ op: "build", slot: st.s, type: st.t });
            sl.turret = { type: st.t, tier: 1, spent: c };
            g -= c;
          } else if (!urgent) {
            break;
          }
        } else {
          if (!sl.turret || sl.turret.tier >= st.tier) continue;
          const c = COST[sl.turret.type] * (sl.turret.tier === 1 ? 1 : 2);
          if (g >= c) {
            actions.push({ op: "upgrade", slot: st.s });
            sl.turret.tier += 1;
            sl.turret.spent += c;
            g -= c;
          } else if (!urgent) {
            break;
          }
        }
      }
      return actions;
    },

    target(turret, candidates) {
      if (candidates.length === 1) return candidates[0].id;
      const t = turret.type;
      if (t === "frost") {
        let best = candidates[0], bestS = -1e18;
        for (let i = 0; i < candidates.length; i++) {
          const c = candidates[i];
          const s = (c.slowed ? 0 : 1000000) + c.speed * 1000 - c.remaining;
          if (s > bestS) { bestS = s; best = c; }
        }
        return best.id;
      }
      if (t === "cannon") {
        const dmg = DMG.cannon[turret.tier];
        let best = candidates[0], bestS = -1e18;
        for (let i = 0; i < candidates.length; i++) {
          const c = candidates[i];
          let splashVal = 0;
          for (let j = 0; j < candidates.length; j++) {
            const o = candidates[j];
            const dx = o.x - c.x, dy = o.y - c.y;
            if (dx * dx + dy * dy <= 8100) {
              splashVal += Math.min(o.hp, Math.max(1, dmg - o.armor)) +
                (o.type === "mender" ? 60 : 0) + (o.remaining < 800 ? 80 : 0);
            }
          }
          const s = splashVal * 100 - c.remaining * 0.12;
          if (s > bestS) { bestS = s; best = c; }
        }
        return best.id;
      }
      if (t === "flak") {
        const dmg = DMG.flak[turret.tier];
        let best = candidates[0], bestS = -1e18;
        for (let i = 0; i < candidates.length; i++) {
          const c = candidates[i];
          let splashVal = 0;
          for (let j = 0; j < candidates.length; j++) {
            const o = candidates[j];
            const dx = o.x - c.x, dy = o.y - c.y;
            if (dx * dx + dy * dy <= 4900) {
              splashVal += Math.min(o.hp, dmg) + (o.remaining < 700 ? 60 : 0);
            }
          }
          const s = splashVal * 100 - c.remaining * 0.25;
          if (s > bestS) { bestS = s; best = c; }
        }
        return best.id;
      }
      if (t === "lance") {
        const dmg = DMG.lance[turret.tier];
        let best = candidates[0], bestS = -1e18;
        for (let i = 0; i < candidates.length; i++) {
          const c = candidates[i];
          const urg = c.remaining < 850 ? (850 - c.remaining) * 4 : 0;
          const eff = Math.min(c.hp, dmg);
          const overkillPen = c.hp < dmg * 0.25 && c.remaining > 850 ? -300 : 0;
          const prio = (c.type === "mender" ? 280 : c.type === "brute" ? 220 : c.type === "splitter" ? 100 : 0) + c.armor * 5;
          const s = eff + prio + urg + overkillPen - c.remaining * 0.04;
          if (s > bestS) { bestS = s; best = c; }
        }
        return best.id;
      }
      const dmg = DMG.bolt[turret.tier];
      let best = candidates[0], bestS = -1e18;
      for (let i = 0; i < candidates.length; i++) {
        const c = candidates[i];
        const dealt = Math.max(1, dmg - c.armor);
        const s = dealt * 12 + (c.hp <= dealt ? 220 : 0) + (c.air ? 60 : 0) - c.remaining * 0.25;
        if (s > bestS) { bestS = s; best = c; }
      }
      return best.id;
    }
  };
}
</script>

<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks) {
  const hook = typeof arguments[3] === "function" ? arguments[3] : null;

  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return (t ^ (t >>> 14)) >>> 0;
    };
  }

  const SLOTS = [
    [3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],
    [14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]
  ].map(function (p, i) {
    return { slot: i, tx: p[0], ty: p[1], x: p[0] * 100 + 50, y: p[1] * 100 + 50, turret: null };
  });

  const GROUND_PTS = [[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]].map(function (p) {
    return [p[0] * 100 + 50, p[1] * 100 + 50];
  });
  const AIR_PTS = [[0,6],[21,6],[21,11],[23,11]].map(function (p) {
    return [p[0] * 100 + 50, p[1] * 100 + 50];
  });

  function buildPath(pts) {
    const segs = [];
    let total = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const x0 = pts[i][0], y0 = pts[i][1], x1 = pts[i + 1][0], y1 = pts[i + 1][1];
      const dx = x1 - x0, dy = y1 - y0;
      const len = Math.abs(dx) + Math.abs(dy);
      segs.push({ x0: x0, y0: y0, x1: x1, y1: y1, sx: Math.sign(dx), sy: Math.sign(dy), start: total, len: len });
      total += len;
    }
    return { segs: segs, total: total };
  }
  const GROUND_PATH = buildPath(GROUND_PTS);
  const AIR_PATH = buildPath(AIR_PTS);

  function posOnPath(path, progress) {
    const segs = path.segs;
    for (let i = 0; i < segs.length; i++) {
      const s = segs[i];
      if (progress <= s.start + s.len) {
        const d = progress - s.start;
        return [s.x0 + s.sx * d, s.y0 + s.sy * d];
      }
    }
    const last = segs[segs.length - 1];
    return [last.x1, last.y1];
  }

  const TURRET_TYPES = {
    bolt:   { idx: 0, cost: 50,  dmg: 26,  period: 8,  range: 300, splash: 0,  slow: 0,  pierce: false, ground: true,  air: true },
    cannon: { idx: 1, cost: 90,  dmg: 60,  period: 24, range: 260, splash: 90, slow: 0,  pierce: false, ground: true,  air: false },
    frost:  { idx: 2, cost: 70,  dmg: 10,  period: 12, range: 240, splash: 0,  slow: 30, pierce: false, ground: true,  air: true },
    lance:  { idx: 3, cost: 120, dmg: 180, period: 36, range: 360, splash: 0,  slow: 0,  pierce: true,  ground: true,  air: false },
    flak:   { idx: 4, cost: 80,  dmg: 40,  period: 10, range: 320, splash: 70, slow: 0,  pierce: false, ground: false, air: true }
  };

  const ENEMY_LIST = [
    { type: "grunt",    baseHp: 60,  speed: 10, bounty: 4, leak: 1, air: 0, first: 1, weight: 10 },
    { type: "runner",   baseHp: 40,  speed: 20, bounty: 4, leak: 1, air: 0, first: 2, weight: 4 },
    { type: "wisp",     baseHp: 50,  speed: 12, bounty: 6, leak: 2, air: 1, first: 3, weight: 3 },
    { type: "brute",    baseHp: 150, speed: 6,  bounty: 9, leak: 3, air: 0, first: 4, weight: 3 },
    { type: "splitter", baseHp: 90,  speed: 8,  bounty: 6, leak: 2, air: 0, first: 6, weight: 2 },
    { type: "mender",   baseHp: 70,  speed: 8,  bounty: 7, leak: 2, air: 0, first: 8, weight: 1 }
  ];
  const ENEMY_DEF = {};
  for (let i = 0; i < ENEMY_LIST.length; i++) ENEMY_DEF[ENEMY_LIST[i].type] = ENEMY_LIST[i];
  ENEMY_DEF.splitling = { type: "splitling", baseHp: 0, speed: 12, bounty: 1, leak: 1, air: 0 };

  const rng = mulberry32(seed >>> 0);
  const mults = [0, 1000];
  function getMult(w) {
    while (mults.length <= w) mults.push(Math.floor(mults[mults.length - 1] * 108 / 100));
    return mults[w];
  }

  function genWave(w) {
    const count = 4 + Math.floor(3 * w / 5);
    const avail = [];
    let totalW = 0;
    for (let i = 0; i < ENEMY_LIST.length; i++) {
      if (ENEMY_LIST[i].first <= w) {
        avail.push(ENEMY_LIST[i]);
        totalW += ENEMY_LIST[i].weight;
      }
    }
    const comp = [];
    for (let i = 0; i < count; i++) {
      let r = rng() % totalW;
      for (let j = 0; j < avail.length; j++) {
        if (r < avail[j].weight) { comp.push(avail[j].type); break; }
        r -= avail[j].weight;
      }
    }
    return comp;
  }

  let gold = 250;
  let baseHp = 10;
  let currentWave = 0;
  let nextEnemyId = 1;
  let enemies = [];
  const spawnQueue = [];
  const log = [];
  let fallTick = -1;
  const strat = createStrategy();

  const waveCache = {};
  waveCache[1] = genWave(1);

  function turretDamage(t) {
    let d = TURRET_TYPES[t.type].dmg;
    for (let k = 1; k < t.tier; k++) d = Math.floor(d * 16 / 10);
    return d;
  }
  function turretRange(t) {
    return TURRET_TYPES[t.type].range + (t.tier - 1) * 30;
  }

  function enemyView(e) {
    return {
      id: e.id, type: e.type, hp: e.hp, maxHp: e.maxHp,
      x: e.x, y: e.y, air: e.air, armor: e.armor, speed: e.speed,
      slowed: e.slow > 0 ? 1 : 0, remaining: e.path.total - e.progress
    };
  }

  function makeState(tick, w, nextW) {
    return {
      tick: tick, wave: w, gold: gold, baseHp: baseHp,
      slots: SLOTS.map(function (s) {
        return {
          slot: s.slot, x: s.x, y: s.y,
          turret: s.turret ? { type: s.turret.type, tier: s.turret.tier, spent: s.turret.spent } : null
        };
      }),
      enemies: enemies.map(enemyView),
      nextWave: nextW.slice()
    };
  }

  function applyActions(tick, actions, tickEvents) {
    if (!Array.isArray(actions)) return;
    const limit = Math.min(actions.length, 32);
    for (let i = 0; i < limit; i++) {
      const act = actions[i];
      if (!act || typeof act !== "object") continue;
      const slotIdx = act.slot;
      if (!Number.isInteger(slotIdx) || slotIdx < 0 || slotIdx >= 16) continue;
      const s = SLOTS[slotIdx];
      if (act.op === "build") {
        if (s.turret !== null) continue;
        const def = TURRET_TYPES[act.type];
        if (!def || gold < def.cost) continue;
        gold -= def.cost;
        s.turret = { type: act.type, tier: 1, spent: def.cost, cooldown: 0 };
        log.push([tick, "B", slotIdx, def.idx]);
        if (tickEvents) tickEvents.slotOps.push({ op: "B", slot: slotIdx, x: s.x, y: s.y });
      } else if (act.op === "upgrade") {
        if (!s.turret || s.turret.tier >= 3) continue;
        const def = TURRET_TYPES[s.turret.type];
        const cost = s.turret.tier === 1 ? def.cost : def.cost * 2;
        if (gold < cost) continue;
        gold -= cost;
        s.turret.tier += 1;
        s.turret.spent += cost;
        log.push([tick, "U", slotIdx, s.turret.tier]);
        if (tickEvents) tickEvents.slotOps.push({ op: "U", slot: slotIdx, x: s.x, y: s.y });
      } else if (act.op === "sell") {
        if (!s.turret) continue;
        gold += Math.floor(s.turret.spent * 70 / 100);
        s.turret = null;
        log.push([tick, "S", slotIdx, 0]);
        if (tickEvents) tickEvents.slotOps.push({ op: "S", slot: slotIdx, x: s.x, y: s.y });
      }
    }
  }

  function spawnEnemy(type, wave, progress, splitterMaxHp) {
    const def = ENEMY_DEF[type];
    const m = getMult(wave);
    const maxHp = type === "splitling" ? Math.max(1, Math.floor(splitterMaxHp / 4)) : Math.floor(def.baseHp * m / 1000);
    const armor = type === "grunt" ? Math.floor(wave / 4) : (type === "brute" ? 6 + wave : 0);
    const path = def.air ? AIR_PATH : GROUND_PATH;
    const p = posOnPath(path, progress);
    const e = {
      id: nextEnemyId++, type: type, wave: wave, hp: maxHp, maxHp: maxHp,
      armor: armor, speed: def.speed, bounty: def.bounty, leak: def.leak, air: def.air,
      path: path, progress: progress, x: p[0], y: p[1], age: 0, slow: 0
    };
    enemies.push(e);
    return e;
  }

  let nextWaveTick = 20;
  let nextWaveNum = 1;
  let spawnCursor = 0;

  for (let tick = 0; tick < maxTicks; tick++) {
    const tickEvents = hook ? { waveStarted: 0, slotOps: [], shots: [], heals: [], kills: [], leaks: [], fell: false } : null;

    if (tick === nextWaveTick) {
      currentWave = nextWaveNum++;
      nextWaveTick += 40;
      gold += Math.min(50, Math.floor(gold * 5 / 100)) + 10 + 2 * currentWave;
      const curComp = waveCache[currentWave];
      const nxtComp = genWave(currentWave + 1);
      waveCache[currentWave + 1] = nxtComp;
      if (tickEvents) tickEvents.waveStarted = currentWave;
      applyActions(tick, strat.plan(makeState(tick, currentWave, nxtComp)), tickEvents);
      for (let i = 0; i < curComp.length; i++) {
        spawnQueue.push({ tick: tick + 4 * i, wave: currentWave, idx: i, type: curComp[i] });
      }
      spawnQueue.sort(function (a, b) {
        return (a.tick - b.tick) || (a.wave - b.wave) || (a.idx - b.idx);
      });
    }

    while (spawnCursor < spawnQueue.length && spawnQueue[spawnCursor].tick === tick) {
      const sq = spawnQueue[spawnCursor++];
      spawnEnemy(sq.type, sq.wave, 0, 0);
    }

    let fell = false;
    const keptAfterMove = [];
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      const step = e.slow > 0 ? Math.floor(e.speed * 60 / 100) : e.speed;
      e.progress += step;
      if (e.progress >= e.path.total) {
        baseHp -= e.leak;
        log.push([tick, "L", e.id, baseHp]);
        if (tickEvents) tickEvents.leaks.push({ id: e.id, type: e.type, x: e.x, y: e.y, air: e.air, baseHpAfter: baseHp });
        if (baseHp <= 0) {
          log.push([tick, "F", currentWave, 0]);
          fallTick = tick;
          fell = true;
          if (tickEvents) tickEvents.fell = true;
          break;
        }
      } else {
        const np = posOnPath(e.path, e.progress);
        e.x = np[0];
        e.y = np[1];
        keptAfterMove.push(e);
      }
    }
    enemies = keptAfterMove;
    if (fell) {
      if (hook) {
        hook({
          tick: tick, wave: currentWave, gold: gold, baseHp: baseHp,
          nextWave: waveCache[currentWave + 1] || waveCache[1],
          slots: SLOTS, enemies: enemies, events: tickEvents
        });
      }
      break;
    }

    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      e.age += 1;
      if (e.type === "mender" && (e.age % 20 === 0)) {
        if (tickEvents) tickEvents.heals.push({ x: e.x, y: e.y });
        for (let j = 0; j < enemies.length; j++) {
          const t = enemies[j];
          const dx = t.x - e.x, dy = t.y - e.y;
          if (dx * dx + dy * dy <= 22500) {
            t.hp = Math.min(t.maxHp, t.hp + Math.floor(t.maxHp * 8 / 100));
          }
        }
      }
    }

    for (let sIdx = 0; sIdx < 16; sIdx++) {
      const sl = SLOTS[sIdx];
      const tur = sl.turret;
      if (!tur) continue;
      if (tur.cooldown > 0) {
        tur.cooldown -= 1;
        if (tur.cooldown > 0) continue;
      }
      const def = TURRET_TYPES[tur.type];
      const range = turretRange(tur);
      const r2 = range * range;
      const cands = [];
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (e.air ? !def.air : !def.ground) continue;
        const dx = e.x - sl.x, dy = e.y - sl.y;
        if (dx * dx + dy * dy <= r2) cands.push(e);
      }
      if (cands.length === 0) continue;

      let chosen = null;
      if (typeof strat.target === "function") {
        const resId = strat.target({ slot: sIdx, type: tur.type, tier: tur.tier, x: sl.x, y: sl.y, range: range }, cands.map(enemyView));
        for (let i = 0; i < cands.length; i++) {
          if (cands[i].id === resId) { chosen = cands[i]; break; }
        }
      }
      if (!chosen) {
        chosen = cands[0];
        let bestRem = chosen.path.total - chosen.progress;
        for (let i = 1; i < cands.length; i++) {
          const rem = cands[i].path.total - cands[i].progress;
          if (rem < bestRem) { bestRem = rem; chosen = cands[i]; }
        }
      }

      if (tickEvents) {
        tickEvents.shots.push({
          slot: sIdx, type: tur.type, tier: tur.tier,
          sx: sl.x, sy: sl.y, tx: chosen.x, ty: chosen.y, tAir: chosen.air
        });
      }

      const dmg = turretDamage(tur);
      if (def.splash > 0) {
        const sr2 = def.splash * def.splash;
        for (let i = 0; i < enemies.length; i++) {
          const e = enemies[i];
          if (e.air ? !def.air : !def.ground) continue;
          const dx = e.x - chosen.x, dy = e.y - chosen.y;
          if (dx * dx + dy * dy <= sr2) {
            e.hp -= def.pierce ? dmg : Math.max(1, dmg - e.armor);
            if (def.slow > 0) e.slow = def.slow;
          }
        }
      } else {
        chosen.hp -= def.pierce ? dmg : Math.max(1, dmg - chosen.armor);
        if (def.slow > 0) chosen.slow = def.slow;
      }
      tur.cooldown = def.period;

      const alive = [];
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (e.hp <= 0) {
          gold += e.bounty;
          log.push([tick, "K", e.id, sIdx]);
          if (tickEvents) tickEvents.kills.push({ id: e.id, type: e.type, x: e.x, y: e.y, air: e.air });
          if (e.type === "splitter") {
            for (let k = 0; k < 3; k++) spawnEnemy("splitling", e.wave, e.progress, e.maxHp);
          }
        } else {
          alive.push(e);
        }
      }
      enemies = alive;
    }

    for (let i = 0; i < enemies.length; i++) {
      if (enemies[i].slow > 0) enemies[i].slow -= 1;
    }

    if (hook) {
      hook({
        tick: tick, wave: currentWave, gold: gold, baseHp: baseHp,
        nextWave: waveCache[currentWave + 1] || waveCache[1],
        slots: SLOTS, enemies: enemies, events: tickEvents
      });
    }
  }

  const endTick = fallTick >= 0 ? fallTick : maxTicks;
  const score = Math.round(((endTick - 20) / 40) * 100) / 100;
  const str = JSON.stringify(log);
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  const hash = (h >>> 0).toString(16).padStart(8, "0");
  return { score: score, fallTick: fallTick, log: log, hash: hash };
}

(function () {

      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;

  function sampleNoise(arr, t) {

    const i0 = Math.floor(x);
    const i1 = (i0 + 1) % NOISE_LEN;
    const f = x - i0;
    const u = f * f * (3 - 2 * f);
    return arr[i0] * (1 - u) + arr[i1] * u;
  }

  // =========================================================================

  // =========================================================================

  // =========================================================================
  const hudScene = new THREE.Scene();
  const hudCam = new THREE.OrthographicCamera(0, window.innerWidth, window.innerHeight, 0, -10, 10);

  // Detached in-memory digit glyph atlas (0..9)
  const digitAtlas = (function () {
    const c = document.createElement("canvas");
    c.width = 512;
    c.height = 64;
    const ctx = c.getContext("2d");
    ctx.clearRect(0, 0, 512, 64);
    ctx.font = "700 48px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffffff";
    for (let d = 0; d < 10; d++) {
      ctx.fillText(String(d), d * 48 + 24, 33);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    return tex;
  })();

  // Create digit sprite pool using UV offsets into digitAtlas
  function makeDigitMesh(colorHex) {
    const geo = new THREE.PlaneGeometry(1, 1);
    const mat = new THREE.MeshBasicMaterial({
      map: digitAtlas,
      color: colorHex,
      transparent: true,
      depthTest: false
    });
    const m = new THREE.Mesh(geo, mat);
    m.userData.uvAttr = geo.attributes.uv;
    return m;
  }
  function setDigitChar(mesh, d) {
    const u0 = (d * 48) / 512;
    const u1 = ((d + 1) * 48) / 512;
    const uv = mesh.userData.uvAttr;
    uv.setXY(0, u0, 1);
    uv.setXY(1, u1, 1);
    uv.setXY(2, u0, 0);
    uv.setXY(3, u1, 0);
    uv.needsUpdate = true;
  }

  const waveDigits = [];

  // Wave-glyph icon (crossed blades / diamond crest drawn from shapes)

  // 10 Base HP pips in top-right corner
  const hpPips = [];

  // Next-wave preview row (up to 6 enemy types, icon + 2-digit count)
  const PREVIEW_TYPES = [

  function renderNumber(meshes, num, x, y, digitH) {
    const s = String(Math.max(0, Math.floor(num)));
    const digitW = digitH * 0.66;
    for (let i = 0; i < meshes.length; i++) {
      const m = meshes[i];
      if (i < s.length) {
        m.visible = true;
        setDigitChar(m, s.charCodeAt(i) - 48);
        m.scale.set(digitH * 0.9, digitH, 1);
        m.position.set(x + i * digitW + digitW * 0.5, y, 0);
      } else {
        m.visible = false;
      }
    }
    return s.length * digitW;
  }

  // =========================================================================
  // 7. CAMERA FRAMING (SAFE AT 16:9 AND 1280x650, CLEAR OF BOTTOM 90PX DOCK)
  // =========================================================================
  const camBasePos = new THREE.Vector3();
  const camLookAt = new THREE.Vector3(12, 0, 7.2);
  const boardCorners = [];
  for (const bx of [-0.6, 24.6]) {
    for (const by of [0, 1.4]) {
      for (const bz of [-0.6, 14.6]) {
        boardCorners.push(new THREE.Vector3(bx, by, bz));
      }
    }
  }

  function updateCameraFraming() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);

    camera.aspect = w / h;
    hudCam.right = w;
    hudCam.top = h;
    hudCam.updateProjectionMatrix();

    // ~55 degrees above horizon
    const elev = 55 * Math.PI / 180;
    const dirY = Math.sin(elev);
    const dirZ = Math.cos(elev);

    const safeBottomNdc = -1 + 2 * (Math.min(104, h * 0.25) / h);
    const safeTopNdc = 0.88;
    const safeHalfX = 0.94;

    // Shift look-at Z slightly so board centers visually in the safe vertical band
    camLookAt.set(12, 0, 7.65);

    let lo = 12, hi = 65;
    const proj = new THREE.Vector3();
    for (let iter = 0; iter < 24; iter++) {
      const mid = (lo + hi) * 0.5;
      camera.position.set(camLookAt.x, camLookAt.y + dirY * mid, camLookAt.z + dirZ * mid);
      camera.lookAt(camLookAt);
      camera.updateMatrixWorld();
      camera.updateProjectionMatrix();

      let fits = true;
      for (let i = 0; i < boardCorners.length; i++) {
        proj.copy(boardCorners[i]).project(camera);
        if (Math.abs(proj.x) > safeHalfX || proj.y < safeBottomNdc || proj.y > safeTopNdc) {
          fits = false;
          break;
        }
      }
      if (fits) hi = mid; else lo = mid;
    }

    camBasePos.set(camLookAt.x, camLookAt.y + dirY * hi, camLookAt.z + dirZ * hi);
    camera.position.copy(camBasePos);
    camera.lookAt(camLookAt);
    camera.updateProjectionMatrix();
  }
  updateCameraFraming();
  window.addEventListener("resize", updateCameraFraming);

  // =========================================================================
  // 8. DETERMINISTIC RENDER AT ANY simTime (INTERPOLATED + SCRUBBABLE)
  // =========================================================================
  const tmpColor = new THREE.Color();
  const tmpColor2 = new THREE.Color();
  const qCam = new THREE.Quaternion();
  const qRot = new THREE.Quaternion();
  const eul = new THREE.Euler();
  const posV = new THREE.Vector3();
  const posV2 = new THREE.Vector3();
  const scaleV = new THREE.Vector3();
  const upAxis = new THREE.Vector3(0, 1, 0);

  // Seeded debris offsets per enemy id
  const debrisDirs = [];
  for (let i = 0; i < 64; i++) {
    const a = (i % 8) * (Math.PI / 4) + (visRng() - 0.5) * 0.5;
    const sp = 1.6 + visRng() * 2.4;
    debrisDirs.push({ vx: Math.cos(a) * sp, vy: 2.2 + visRng() * 2.6, vz: Math.sin(a) * sp });
  }

  let currentDesat = -1;
  function applyDesaturation(desat) {
    if (Math.abs(desat - currentDesat) < 0.002) return;
    currentDesat = desat;
    for (let i = 0; i < desatMaterials.length; i++) {
      const rec = desatMaterials[i];
      if (rec.baseColor && rec.mat.color) {
        const lum = rec.baseColor.r * 0.299 + rec.baseColor.g * 0.587 + rec.baseColor.b * 0.114;
        rec.mat.color.setRGB(
          rec.baseColor.r + (lum - rec.baseColor.r) * desat,
          rec.baseColor.g + (lum - rec.baseColor.g) * desat,
          rec.baseColor.b + (lum - rec.baseColor.b) * desat
        );
      }
      if (rec.baseEmissive && rec.mat.emissive) {
        const lumE = rec.baseEmissive.r * 0.299 + rec.baseEmissive.g * 0.587 + rec.baseEmissive.b * 0.114;
        rec.mat.emissive.setRGB(
          rec.baseEmissive.r + (lumE - rec.baseEmissive.r) * desat,
          rec.baseEmissive.g + (lumE - rec.baseEmissive.g) * desat,
          rec.baseEmissive.b + (lumE - rec.baseEmissive.b) * desat
        );
      }
    }
    for (let i = 0; i < desatLights.length; i++) {
      const dl = desatLights[i];
      const lum = dl.baseColor.r * 0.299 + dl.baseColor.g * 0.587 + dl.baseColor.b * 0.114;
      dl.light.color.setRGB(
        dl.baseColor.r + (lum - dl.baseColor.r) * desat,
        dl.baseColor.g + (lum - dl.baseColor.g) * desat,
        dl.baseColor.b + (lum - dl.baseColor.b) * desat
      );
      if (dl.baseGround && dl.light.groundColor) {
        const lumG = dl.baseGround.r * 0.299 + dl.baseGround.g * 0.587 + dl.baseGround.b * 0.114;
        dl.light.groundColor.setRGB(
          dl.baseGround.r + (lumG - dl.baseGround.r) * desat,
          dl.baseGround.g + (lumG - dl.baseGround.g) * desat,
          dl.baseGround.b + (lumG - dl.baseGround.b) * desat
        );
      }
    }
  }

  function renderAt(simTime) {
    const fell = fallTick >= 0 && simTime >= fallTime;
    const effTime = fell ? fallTime : simTime;
    const exactTick = effTime * TICKS_PER_SEC;
    const k0 = Math.min(ticks.length - 1, Math.max(0, Math.floor(exactTick)));
    const k1 = Math.min(ticks.length - 1, k0 + 1);
    const alpha = fell ? 0 : (exactTick - k0);
    const snap0 = ticks[k0];
    const snap1 = ticks[k1];

    // Desaturation after fall
    const desat = fell ? Math.min(0.92, (simTime - fallTime) / 1.0 * 0.92) : 0;
    applyDesaturation(desat);

    // Trauma shake (leaks +0.3, fall +1.0, decay 1.0/s)
    let trauma = 0;
    for (let i = 0; i < leakTimes.length; i++) {
      const dtL = simTime - leakTimes[i].t;
      if (dtL >= 0 && dtL < 1.0) trauma += 0.3 * (1.0 - dtL);
    }
    if (fell) {
      const dtF = simTime - fallTime;
      if (dtF >= 0 && dtF < 1.0) trauma += 1.0 * (1.0 - dtF);
    }
    trauma = Math.min(1.0, trauma);
    const shakeMag = trauma * trauma * 0.25;
    const sxOff = shakeMag * sampleNoise(noiseTableX, simTime);
    const syOff = shakeMag * sampleNoise(noiseTableY, simTime + 3.7);
    camera.position.set(camBasePos.x + sxOff, camBasePos.y + syOff, camBasePos.z);
    camera.lookAt(camLookAt.x + sxOff * 0.5, camLookAt.y, camLookAt.z + syOff * 0.5);
    camera.updateMatrixWorld();

    // Keep state, leak flash & crumbling chunks
    let lastLeakDt = 99;
    for (let i = 0; i < leakTimes.length; i++) {
      const dtL = simTime - leakTimes[i].t;
      if (dtL >= 0 && dtL < lastLeakDt) lastLeakDt = dtL;
    }
    const leakFlash = lastLeakDt < 0.28 ? (1 - lastLeakDt / 0.28) : 0;
    keepStoneMat.emissive.setRGB(leakFlash * 0.85, leakFlash * 0.05, leakFlash * 0.05);
    keepCrystal.rotation.y = effTime * 1.4;
    keepCrystal.position.y = 1.95 + Math.sin(effTime * 3.0) * 0.06;
    keepCrystal.visible = !fell;
    keepCitadel.visible = !fell;
    keepRoof.visible = !fell;

    const lostChunks = 10 - Math.max(0, snap0.baseHp);
    for (let i = 0; i < 10; i++) {
      const ch = keepChunks[i];
      if (fell) {
        const dtF = Math.min(1.8, simTime - fallTime);
        ch.mesh.visible = dtF < 1.6;
        ch.mesh.position.set(
          ch.basePos.x + ch.vx * dtF,
          Math.max(0.05, ch.basePos.y + ch.vy * dtF - 4.8 * dtF * dtF),
          ch.basePos.z + ch.vz * dtF
        );
        ch.mesh.rotation.set(ch.rx * dtF, 0, ch.rz * dtF);
        ch.mesh.scale.setScalar(Math.max(0.01, 1 - dtF * 0.55));
      } else if (i >= 10 - lostChunks) {
        // Find which leak knocked this chunk off
        const chunkIdxFromEnd = 9 - i;
        const leakEv = leakTimes[Math.min(leakTimes.length - 1, chunkIdxFromEnd)];
        const dtC = leakEv ? Math.max(0, simTime - leakEv.t) : 2.0;
        if (dtC < 0.8) {
          ch.mesh.visible = true;
          ch.mesh.position.set(
            ch.basePos.x + ch.vx * dtC * 0.7,
            Math.max(0.05, ch.basePos.y + ch.vy * dtC * 0.6 - 4.5 * dtC * dtC),
            ch.basePos.z + ch.vz * dtC * 0.7
          );
          ch.mesh.rotation.set(ch.rx * dtC, 0, ch.rz * dtC);
          ch.mesh.scale.setScalar(1 - dtC);
        } else {
          ch.mesh.visible = false;
        }
      } else {
        ch.mesh.visible = true;
        ch.mesh.position.copy(ch.basePos);
        ch.mesh.rotation.set(0, 0, 0);
        ch.mesh.scale.setScalar(1);
      }
    }

    // Update 16 turret meshes
    for (let i = 0; i < 16; i++) {
      const slData = snap0.slots[i];
      const sm = slotMeshes[i];
      const key = slData ? (slData.type + "_" + slData.tier) : "";
      if (sm.key !== key) {
        if (sm.mesh) {
          sm.group.remove(sm.mesh);
          sm.mesh = null;
        }
        sm.key = key;
        if (slData) {
          sm.mesh = buildTurretMesh(slData.type, slData.tier);
          sm.group.add(sm.mesh);
        }
      }
      if (sm.mesh && sm.mesh.userData.head) {
        const aim = snap0.aims[i];
        if (aim !== null) sm.mesh.userData.head.rotation.y = aim;
        else if (slData && slData.type === "frost") sm.mesh.userData.head.rotation.y = effTime * 1.2;
      }
    }

    // Populate instanced enemy arrays
    let cGrunt = 0, cRunner = 0, cWisp = 0, cBrute = 0, cSplitter = 0, cSplitling = 0, cMender = 0, cHp = 0;
    qCam.copy(camera.quaternion);

    function applyDesatColor(col) {
      if (desat <= 0) return col;
      const l = col.r * 0.299 + col.g * 0.587 + col.b * 0.114;
      col.setRGB(
        col.r + (l - col.r) * desat,
        col.g + (l - col.g) * desat,
        col.b + (l - col.b) * desat
      );
      return col;
    }

    function setInstColor(im, idx, baseCol, slowed) {
      tmpColor.copy(baseCol);
      if (slowed) tmpColor.lerp(FROST_TINT, 0.58);
      applyDesatColor(tmpColor);
      im.setColorAt(idx, tmpColor);
    }

    for (let i = 0; i < snap0.enemies.length; i++) {
      const e0 = snap0.enemies[i];
      const e1 = snap1.eMap[e0.id];
      const ex = e1 ? e0.x + (e1.x - e0.x) * alpha : e0.x;
      const ez = e1 ? e0.z + (e1.z - e0.z) * alpha : e0.z;
      const dx = e1 ? (e1.x - e0.x) : 0;
      const dz = e1 ? (e1.z - e0.z) : 0;
      const yaw = (Math.abs(dx) + Math.abs(dz)) > 0.0001 ? Math.atan2(dx, dz) : 0;
      const ey = e0.air ? 0.8 + Math.sin(effTime * 5 + e0.id) * 0.06 : 0.2;

      qRot.setFromAxisAngle(upAxis, yaw);
      scaleV.set(1, 1, 1);

      if (e0.type === "grunt" && cGrunt < MAX_ENEMIES) {
        posV.set(ex, 0.22, ez);
        dummyObj.matrix.compose(posV, qRot, scaleV);
        instGrunt.setMatrixAt(cGrunt, dummyObj.matrix);
        setInstColor(instGrunt, cGrunt, ENEMY_COLORS.grunt, e0.slowed);
        cGrunt++;
      } else if (e0.type === "runner" && cRunner < MAX_ENEMIES) {
        posV.set(ex, 0.18 + Math.abs(Math.sin(effTime * 14 + e0.id)) * 0.07, ez);
        dummyObj.matrix.compose(posV, qRot, scaleV);
        instRunner.setMatrixAt(cRunner, dummyObj.matrix);
        setInstColor(instRunner, cRunner, ENEMY_COLORS.runner, e0.slowed);
        cRunner++;
      } else if (e0.type === "wisp" && cWisp < MAX_ENEMIES) {
        posV.set(ex, ey, ez);
        qRot.setFromAxisAngle(upAxis, effTime * 2.5 + e0.id);
        dummyObj.matrix.compose(posV, qRot, scaleV);
        instWisp.setMatrixAt(cWisp, dummyObj.matrix);
        setInstColor(instWisp, cWisp, ENEMY_COLORS.wisp, e0.slowed);

        posV.set(ex, 0.025, ez);
        qRot.identity();
        dummyObj.matrix.compose(posV, qRot, scaleV);
        instWispShadow.setMatrixAt(cWisp, dummyObj.matrix);
        cWisp++;
      } else if (e0.type === "brute" && cBrute < MAX_ENEMIES) {
        posV.set(ex, 0.3, ez);
        dummyObj.matrix.compose(posV, qRot, scaleV);
        instBrute.setMatrixAt(cBrute, dummyObj.matrix);
        setInstColor(instBrute, cBrute, ENEMY_COLORS.brute, e0.slowed);

        posV.set(ex, 0.42, ez);
        dummyObj.matrix.compose(posV, qRot, scaleV);
        instBrutePlate.setMatrixAt(cBrute, dummyObj.matrix);
        cBrute++;
      } else if (e0.type === "splitter" && cSplitter < MAX_ENEMIES) {
        posV.set(ex, 0.28, ez);
        dummyObj.matrix.compose(posV, qRot, scaleV);
        instSplitter.setMatrixAt(cSplitter, dummyObj.matrix);
        setInstColor(instSplitter, cSplitter, ENEMY_COLORS.splitter, e0.slowed);
        cSplitter++;
      } else if (e0.type === "splitling" && cSplitling < MAX_ENEMIES) {
        posV.set(ex, 0.16, ez);
        dummyObj.matrix.compose(posV, qRot, scaleV);
        instSplitling.setMatrixAt(cSplitling, dummyObj.matrix);
        setInstColor(instSplitling, cSplitling, ENEMY_COLORS.splitling, e0.slowed);
        cSplitling++;
      } else if (e0.type === "mender" && cMender < MAX_ENEMIES) {
        posV.set(ex, 0.28, ez);
        dummyObj.matrix.compose(posV, qRot, scaleV);
        instMender.setMatrixAt(cMender, dummyObj.matrix);
        setInstColor(instMender, cMender, ENEMY_COLORS.mender, e0.slowed);

        posV.set(ex, 0.04, ez);
        qRot.identity();
        dummyObj.matrix.compose(posV, qRot, scaleV);
        instMenderHalo.setMatrixAt(cMender, dummyObj.matrix);
        cMender++;
      }

      // Health bar above enemy
      if (cHp < MAX_ENEMIES) {
        const hpRatio = Math.max(0.02, Math.min(1, e0.hp / e0.maxHp));
        const barY = e0.air ? 1.24 : (e0.type === "brute" ? 0.82 : 0.62);
        posV.set(ex, barY, ez);
        scaleV.set(1, 1, 1);
        dummyObj.matrix.compose(posV, qCam, scaleV);
        instHpBg.setMatrixAt(cHp, dummyObj.matrix);

        const offsetLeft = (hpRatio - 1) * 0.21;
        posV2.set(offsetLeft, 0, 0.004).applyQuaternion(qCam).add(posV);
        scaleV.set(hpRatio, 1, 1);
        dummyObj.matrix.compose(posV2, qCam, scaleV);
        instHpFill.setMatrixAt(cHp, dummyObj.matrix);
        tmpColor2.setRGB(1 - hpRatio * 0.85, hpRatio * 0.92, 0.22);
        if (desat > 0) {
          const l = tmpColor2.r * 0.299 + tmpColor2.g * 0.587 + tmpColor2.b * 0.114;
          tmpColor2.setRGB(
            tmpColor2.r + (l - tmpColor2.r) * desat,
            tmpColor2.g + (l - tmpColor2.g) * desat,
            tmpColor2.b + (l - tmpColor2.b) * desat
          );
        }
        instHpFill.setColorAt(cHp, tmpColor2);
        cHp++;
      }
    }

    const counts = [
      [instGrunt, cGrunt], [instRunner, cRunner], [instWisp, cWisp],
      [instWispShadow, cWisp], [instBrute, cBrute], [instBrutePlate, cBrute],
      [instSplitter, cSplitter], [instSplitling, cSplitling],
      [instMender, cMender], [instMenderHalo, cMender],
      [instHpBg, cHp], [instHpFill, cHp]
    ];
    for (let i = 0; i < counts.length; i++) {
      counts[i][0].count = counts[i][1];
      counts[i][0].instanceMatrix.needsUpdate = true;
      if (counts[i][0].instanceColor) counts[i][0].instanceColor.needsUpdate = true;
    }

    // Combat VFX (beams, shells, rings, debris) — closed-form functions of simTime!
    let cBeam = 0, cRing = 0, cShell = 0, cDebris = 0;

    // Shots (<= 0.15s)
    for (let i = 0; i < shotEvents.length; i++) {
      const sh = shotEvents[i];
      const dt = effTime - sh.t;
      if (dt < 0 || dt > 0.15) continue;
      const p = dt / 0.15;
      const sy = 0.52;
      const ty = sh.tAir ? 0.8 : 0.24;

      if (sh.type === "cannon") {
        if (p < 0.7 && cShell < MAX_VFX) {
          const sp = p / 0.7;
          const arcY = sy + (ty - sy) * sp + Math.sin(sp * Math.PI) * 1.1;
          posV.set(sh.sx + (sh.tx - sh.sx) * sp, arcY, sh.sz + (sh.tz - sh.sz) * sp);
          qRot.identity();
          scaleV.setScalar(1.2);
          dummyObj.matrix.compose(posV, qRot, scaleV);
          instShell.setMatrixAt(cShell++, dummyObj.matrix);
        } else if (p >= 0.65 && cRing < MAX_VFX) {
          const rp = (p - 0.65) / 0.35;
          posV.set(sh.tx, 0.08, sh.tz);
          qRot.identity();
          scaleV.setScalar(0.2 + rp * 0.72); // splash radius 0.9
          dummyObj.matrix.compose(posV, qRot, scaleV);
          instRing.setMatrixAt(cRing, dummyObj.matrix);
          tmpColor.setHex(0xff9442);
          instRing.setColorAt(cRing, tmpColor);
          cRing++;
        }
      } else if (sh.type === "flak") {
        if (cBeam < MAX_VFX && p < 0.65) {
          posV.set(sh.sx, sy, sh.sz);
          posV2.set(sh.tx, ty, sh.tz);
          const mid = posV.clone().add(posV2).multiplyScalar(0.5);
          const dir = posV2.clone().sub(posV);
          const len = dir.length();
          qRot.setFromUnitVectors(upAxis, dir.normalize());
          scaleV.set(0.55, len, 0.55);
          dummyObj.matrix.compose(mid, qRot, scaleV);
          instBeam.setMatrixAt(cBeam, dummyObj.matrix);
          tmpColor.setHex(0x38f2dc);
          instBeam.setColorAt(cBeam, tmpColor);
          cBeam++;
        }
        if (cRing < MAX_VFX) {
          posV.set(sh.tx, 0.8, sh.tz);
          qRot.identity();
          scaleV.setScalar(0.15 + p * 0.58); // splash radius 0.7
          dummyObj.matrix.compose(posV, qRot, scaleV);
          instRing.setMatrixAt(cRing, dummyObj.matrix);
          tmpColor.setHex(0x38f2dc);
          instRing.setColorAt(cRing, tmpColor);
          cRing++;
        }
      } else {
        // bolt, frost, lance beams
        if (cBeam < MAX_VFX) {
          posV.set(sh.sx, sy, sh.sz);
          posV2.set(sh.tx, ty, sh.tz);
          const mid = posV.clone().add(posV2).multiplyScalar(0.5);
          const dir = posV2.clone().sub(posV);
          const len = Math.max(0.01, dir.length());
          qRot.setFromUnitVectors(upAxis, dir.normalize());
          const thick = sh.type === "lance" ? 2.1 * (1 - p * 0.6) : (sh.type === "frost" ? 1.15 : 0.7);
          scaleV.set(thick, len, thick);
          dummyObj.matrix.compose(mid, qRot, scaleV);
          instBeam.setMatrixAt(cBeam, dummyObj.matrix);
          tmpColor.setHex(sh.type === "lance" ? 0xff2b47 : (sh.type === "frost" ? 0xc2f2ff : 0x7cb8ff));
          instBeam.setColorAt(cBeam, tmpColor);
          cBeam++;
        }
        if (sh.type === "frost" && cRing < MAX_VFX) {
          posV.set(sh.tx, sh.tAir ? 0.8 : 0.08, sh.tz);
          qRot.identity();
          scaleV.setScalar(0.15 + p * 0.35);
          dummyObj.matrix.compose(posV, qRot, scaleV);
          instRing.setMatrixAt(cRing, dummyObj.matrix);
          tmpColor.setHex(0x9ce9ff);
          instRing.setColorAt(cRing, tmpColor);
          cRing++;
        }
      }
    }

    // Mender heal pulse rings (radius 1.5 tiles)
    for (let i = 0; i < healEvents.length; i++) {
      const h = healEvents[i];
      const dt = effTime - h.t;
      if (dt < 0 || dt > 0.45 || cRing >= MAX_VFX) continue;
      const p = dt / 0.45;
      posV.set(h.x, 0.09, h.z);
      qRot.identity();
      scaleV.setScalar(0.2 + p * 1.3);
      dummyObj.matrix.compose(posV, qRot, scaleV);
      instRing.setMatrixAt(cRing, dummyObj.matrix);
      tmpColor.setHex(0x4ade80);
      instRing.setColorAt(cRing, tmpColor);
      cRing++;
    }

    // Slot build/upgrade/sell VFX
    for (let i = 0; i < slotOpEvents.length; i++) {
      const op = slotOpEvents[i];
      const dt = effTime - op.t;
      if (dt < 0 || dt > 0.45) continue;
      const p = dt / 0.45;
      if (op.op === "U" && cRing < MAX_VFX) {
        posV.set(op.x, 0.14, op.z);
        qRot.identity();
        scaleV.setScalar(0.3 + p * 0.75);
        dummyObj.matrix.compose(posV, qRot, scaleV);
        instRing.setMatrixAt(cRing, dummyObj.matrix);
        tmpColor.setHex(0xffdf6b);
        instRing.setColorAt(cRing, tmpColor);
        cRing++;
      } else if (op.op === "B") {
        for (let k = 0; k < 5 && cDebris < 512; k++) {
          const ang = k * 1.256 + op.slot;
          posV.set(op.x + Math.cos(ang) * 0.32, 0.15 + p * 1.1, op.z + Math.sin(ang) * 0.32);
          qRot.setFromAxisAngle(upAxis, p * 4);
          scaleV.setScalar(0.55 * (1 - p));
          dummyObj.matrix.compose(posV, qRot, scaleV);
          instDebris.setMatrixAt(cDebris, dummyObj.matrix);
          tmpColor.setHex(0xffe173);
          instDebris.setColorAt(cDebris, tmpColor);
          cDebris++;
        }
      } else if (op.op === "S") {
        for (let k = 0; k < 5 && cDebris < 512; k++) {
          const d = debrisDirs[(op.slot * 5 + k) % 64];
          posV.set(op.x + d.vx * p * 0.35, Math.max(0.06, 0.4 - p * 0.35), op.z + d.vz * p * 0.35);
          qRot.setFromAxisAngle(upAxis, p * 3);
          scaleV.setScalar(0.9 * (1 - p));
          dummyObj.matrix.compose(posV, qRot, scaleV);
          instDebris.setMatrixAt(cDebris, dummyObj.matrix);
          tmpColor.setHex(0x7c8599);
          instDebris.setColorAt(cDebris, tmpColor);
          cDebris++;
        }
      }
    }

    // Kill ballistic debris (closed-form in time since kill)
    for (let i = 0; i < killEvents.length; i++) {
      const k = killEvents[i];
      const dt = effTime - k.t;
      if (dt < 0 || dt > 0.55) continue;
      const baseY = k.air ? 0.8 : 0.25;
      const col = ENEMY_COLORS[k.type] || ENEMY_COLORS.grunt;
      const pieces = k.type === "splitter" ? 7 : 4;
      for (let m = 0; m < pieces && cDebris < 512; m++) {
        const d = debrisDirs[(k.id * 7 + m) % 64];
        const py = Math.max(0.05, baseY + d.vy * dt - 5.2 * dt * dt);
        posV.set(k.x + d.vx * dt, py, k.z + d.vz * dt);
        qRot.setFromAxisAngle(upAxis, dt * 6 + m);
        scaleV.setScalar(Math.max(0.05, (1 - dt / 0.55) * 0.95));
        dummyObj.matrix.compose(posV, qRot, scaleV);
        instDebris.setMatrixAt(cDebris, dummyObj.matrix);
        instDebris.setColorAt(cDebris, col);
        cDebris++;
      }
    }

    // Fall shockwave ring + burst debris
    if (fell) {
      const dtF = simTime - fallTime;
      if (dtF >= 0 && dtF < 1.2 && cRing < MAX_VFX) {
        posV.set(23.5, 0.25, 11.5);
        qRot.identity();
        scaleV.setScalar(0.5 + dtF * 7.5);
        dummyObj.matrix.compose(posV, qRot, scaleV);
        instRing.setMatrixAt(cRing, dummyObj.matrix);
        tmpColor.setHex(0xff6b3d);
        applyDesatColor(tmpColor);
        instRing.setColorAt(cRing, tmpColor);
        cRing++;
      }
      if (dtF >= 0 && dtF < 1.8) {
        for (let m = 0; m < 28 && cDebris < 512; m++) {
          const d = debrisDirs[(m * 3 + 7) % 64];
          const py = Math.max(0.08, 0.6 + d.vy * 1.45 * dtF - 4.9 * dtF * dtF);
          posV.set(23.5 + d.vx * 1.2 * dtF, py, 11.5 + d.vz * 1.2 * dtF);
          qRot.setFromAxisAngle(upAxis, dtF * 5 + m);
          scaleV.setScalar(Math.max(0.05, (1 - dtF / 1.8) * 1.6));
          dummyObj.matrix.compose(posV, qRot, scaleV);
          instDebris.setMatrixAt(cDebris, dummyObj.matrix);
          tmpColor.setHex(m % 3 === 0 ? 0xd9a74a : 0x67728a);
          applyDesatColor(tmpColor);
          instDebris.setColorAt(cDebris, tmpColor);
          cDebris++;
        }
      }
    }

    instBeam.count = cBeam;
    instBeam.instanceMatrix.needsUpdate = true;
    if (instBeam.instanceColor) instBeam.instanceColor.needsUpdate = true;

    instRing.count = cRing;
    instRing.instanceMatrix.needsUpdate = true;
    if (instRing.instanceColor) instRing.instanceColor.needsUpdate = true;

    instShell.count = cShell;
    instShell.instanceMatrix.needsUpdate = true;

    instDebris.count = cDebris;
    instDebris.instanceMatrix.needsUpdate = true;
    if (instDebris.instanceColor) instDebris.instanceColor.needsUpdate = true;

    // Update World-Anchored WebGL HUD (pure function of replay at simTime)
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const padX = Math.max(20, vw * 0.022);
    const padY = Math.max(18, vh * 0.026);
    const waveDigitH = Math.max(38, vh * 0.075); // >= 7% of viewport height
    const goldDigitH = waveDigitH * 0.52;
    const prevDigitH = waveDigitH * 0.36;

    // Top-left: Wave icon + Wave digits
    const waveY = vh - padY - waveDigitH * 0.5;
    waveIconGroup.scale.setScalar(waveDigitH * 0.72);
    waveIconGroup.position.set(padX + waveDigitH * 0.36, waveY, 0);
    renderNumber(waveDigits, snap0.wave, padX + waveDigitH * 0.9, waveY, waveDigitH);

    // Below wave: Coin icon + Gold digits
    const goldY = waveY - waveDigitH * 0.55 - goldDigitH * 0.55;
    coinIcon.scale.setScalar(goldDigitH * 0.75);
    coinIcon.position.set(padX + goldDigitH * 0.38, goldY, 0);
    renderNumber(goldDigits, snap0.gold, padX + goldDigitH * 0.92, goldY, goldDigitH);

    // Below gold: Next-wave preview icons + counts
    const prevY = goldY - goldDigitH * 0.65 - prevDigitH * 0.6;
    let curX = padX + prevDigitH * 0.35;
    for (let i = 0; i < previewRows.length; i++) {
      const pr = previewRows[i];
      const cnt = snap0.nextCounts[pr.type] || 0;
      if (cnt > 0) {
        pr.icon.visible = true;
        pr.icon.scale.setScalar(prevDigitH * 0.68);
        pr.icon.position.set(curX, prevY, 0);
        const wUsed = renderNumber([pr.d0, pr.d1], cnt, curX + prevDigitH * 0.42, prevY, prevDigitH);
        curX += prevDigitH * 0.62 + wUsed + prevDigitH * 0.45;
      } else {
        pr.icon.visible = false;
        pr.d0.visible = false;
        pr.d1.visible = false;
      }
    }

    // Top-right: 10 Base HP pips
    const pipW = Math.max(12, vh * 0.022);
    const pipH = Math.max(18, vh * 0.036);
    const pipGap = Math.max(4, pipW * 0.3);
    const totalPipsW = 10 * pipW + 9 * pipGap;
    const pipStartX = vw - padX - totalPipsW + pipW * 0.5;
    const pipY = vh - padY - pipH * 0.5;

    for (let i = 0; i < 10; i++) {
      const p = hpPips[i];
      p.position.set(pipStartX + i * (pipW + pipGap), pipY, 0);
      p.scale.set(pipW, pipH, 1);
      const alive = i < snap0.baseHp;
      const fg = p.userData.fg;
      if (alive) {
        fg.visible = true;
        fg.material.color.setHex(snap0.baseHp <= 3 ? 0xff4d4d : (snap0.baseHp <= 6 ? 0xffb84d : 0x52e59f));
        fg.material.opacity = 1;
      } else {
        // Check if this pip was just lost for short flash
        let flash = 0;
        for (let l = 0; l < leakTimes.length; l++) {
          const lt = leakTimes[l];
          const prevHp = l === 0 ? 10 : leakTimes[l - 1].hpAfter;
          if (i >= lt.hpAfter && i < prevHp) {
            const dtL = simTime - lt.t;
            if (dtL >= 0 && dtL < 0.35) flash = 1 - dtL / 0.35;
          }
        }
        if (flash > 0) {
          fg.visible = true;
          fg.material.color.setHex(0xff5252);
          fg.material.opacity = flash;
        } else {
          fg.visible = false;
        }
      }
    }

    // Render 3D scene then orthographic HUD pass
    renderer.clear();
    renderer.render(scene, camera);
    renderer.clearDepth();
    renderer.render(hudScene, hudCam);
  }

  // =========================================================================
  // 9. WEB AUDIO SYNTHESIS (SFX ONLY, SEED 4242, FOLLOWS PLAYBACK STATE)
  // =========================================================================
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  const audioCtx = AudioCtx ? new AudioCtx() : null;
  let masterGain = null;
  let compressor = null;
  let noiseBuffer = null;
  let windSource = null;
  let windGain = null;
  const activeVoices = new Set();

  if (audioCtx) {
    compressor = audioCtx.createDynamicsCompressor();
    compressor.threshold.value = -14;
    compressor.knee.value = 12;
    compressor.ratio.value = 8;
    compressor.attack.value = 0.003;
    compressor.release.value = 0.15;

    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0;
    masterGain.connect(compressor);
    compressor.connect(audioCtx.destination);

    // Seeded noise buffer (seed 4242)
    noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = sfxRng() * 2 - 1;

    try { audioCtx.resume(); } catch (_) {}
  }

  function unlockAudio() {
    if (audioCtx && audioCtx.state === "suspended") {
      try { audioCtx.resume(); } catch (_) {}
    }
  }
  window.addEventListener("pointerdown", unlockAudio, { passive: true });
  window.addEventListener("keydown", unlockAudio, { passive: true });

  function trackVoice(node, stopAt) {
    activeVoices.add(node);
    node.onended = function () { activeVoices.delete(node); };
    node.stop(stopAt);
  }

  function makePan(boardX) {
    const pan = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
    if (pan) {
      pan.pan.value = Math.max(-0.85, Math.min(0.85, (boardX / 24) * 2 - 1));
      pan.connect(masterGain);
      return pan;
    }
    return masterGain;
  }

  function silenceAudioImmediately() {
    if (!audioCtx || !masterGain) return;
    const now = audioCtx.currentTime;
    masterGain.gain.cancelScheduledValues(now);
    masterGain.gain.setValueAtTime(masterGain.gain.value, now);
    masterGain.gain.linearRampToValueAtTime(0, now + 0.045);
    activeVoices.forEach(function (v) {
      try { v.stop(now + 0.045); } catch (_) {}
    });
    activeVoices.clear();
    if (windGain) {
      windGain.gain.cancelScheduledValues(now);
      windGain.gain.linearRampToValueAtTime(0, now + 0.045);
    }
  }

  function playShotSound(type, boardX) {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const dst = makePan(boardX);
    const jitter = 0.94 + sfxRng() * 0.12;

    if (type === "bolt") {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = "triangle";
      o.frequency.setValueAtTime(760 * jitter, now);
      o.frequency.exponentialRampToValueAtTime(220, now + 0.055);
      g.gain.setValueAtTime(0.09, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      o.connect(g); g.connect(dst);
      o.start(now); trackVoice(o, now + 0.065);
    } else if (type === "cannon") {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(145 * jitter, now);
      o.frequency.exponentialRampToValueAtTime(42, now + 0.14);
      g.gain.setValueAtTime(0.22, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      o.connect(g); g.connect(dst);
      o.start(now); trackVoice(o, now + 0.16);
    } else if (type === "frost") {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(1240 * jitter, now);
      o.frequency.exponentialRampToValueAtTime(1680 * jitter, now + 0.08);
      g.gain.setValueAtTime(0.07, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
      o.connect(g); g.connect(dst);
      o.start(now); trackVoice(o, now + 0.095);
    } else if (type === "lance") {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = "sawtooth";
      o.frequency.setValueAtTime(980 * jitter, now);
      o.frequency.exponentialRampToValueAtTime(140, now + 0.16);
      g.gain.setValueAtTime(0.18, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.17);
      o.connect(g); g.connect(dst);
      o.start(now); trackVoice(o, now + 0.18);
    } else if (type === "flak") {
      const src = audioCtx.createBufferSource();
      src.buffer = noiseBuffer;
      const bp = audioCtx.createBiquadFilter();
      bp.type = "bandpass";
      bp.frequency.value = 1800 * jitter;
      bp.Q.value = 2.0;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.16, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.075);
      src.connect(bp); bp.connect(g); g.connect(dst);
      src.start(now, sfxRng() * 1.5, 0.08);
      trackVoice(src, now + 0.085);
    }
  }

  function playKillSound(boardX) {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(420 + sfxRng() * 120, now);
    o.frequency.exponentialRampToValueAtTime(160, now + 0.055);
    g.gain.setValueAtTime(0.06, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
    o.connect(g); g.connect(makePan(boardX));
    o.start(now); trackVoice(o, now + 0.065);
  }

  function playWaveHorn() {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const lp = audioCtx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.setValueAtTime(650, now);
    lp.frequency.linearRampToValueAtTime(1400, now + 0.25);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.001, now);
    g.gain.linearRampToValueAtTime(0.14, now + 0.09);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.48);
    lp.connect(g); g.connect(masterGain);

    const freqs = [146.83, 220.0];
    for (let i = 0; i < freqs.length; i++) {
      const o = audioCtx.createOscillator();
      o.type = "sawtooth";
      o.frequency.setValueAtTime(freqs[i] * 0.96, now);
      o.frequency.linearRampToValueAtTime(freqs[i] * 1.03, now + 0.28);
      o.connect(lp);
      o.start(now); trackVoice(o, now + 0.5);
    }
  }

  function playLeakSound(boardX) {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const dst = makePan(boardX);
    // Stone crack
    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuffer;
    const bp = audioCtx.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.value = 650;
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.28, now);
    ng.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
    src.connect(bp); bp.connect(ng); ng.connect(dst);
    src.start(now, sfxRng(), 0.18);
    trackVoice(src, now + 0.19);
    // Alarm tone
    const o = audioCtx.createOscillator();
    const og = audioCtx.createGain();
    o.type = "square";
    o.frequency.setValueAtTime(520, now);
    o.frequency.setValueAtTime(390, now + 0.09);
    og.gain.setValueAtTime(0.09, now);
    og.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
    o.connect(og); og.connect(dst);
    o.start(now); trackVoice(o, now + 0.23);
  }

  function playFallSound() {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const og = audioCtx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(110, now);
    o.frequency.exponentialRampToValueAtTime(28, now + 1.1);
    og.gain.setValueAtTime(0.45, now);
    og.gain.exponentialRampToValueAtTime(0.001, now + 1.25);
    o.connect(og); og.connect(masterGain);
    o.start(now); trackVoice(o, now + 1.3);

    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuffer;
    const lp = audioCtx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.setValueAtTime(480, now);
    lp.frequency.exponentialRampToValueAtTime(110, now + 1.1);
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.38, now);
    ng.gain.exponentialRampToValueAtTime(0.001, now + 1.3);
    src.connect(lp); lp.connect(ng); ng.connect(masterGain);
    src.start(now, 0, 1.35);
    trackVoice(src, now + 1.36);
  }

  function updateWindAudio(playingAfterFall) {
    if (!audioCtx || !masterGain) return;
    const now = audioCtx.currentTime;
    if (playingAfterFall && audioCtx.state === "running") {
      if (!windSource) {
        windSource = audioCtx.createBufferSource();
        windSource.buffer = noiseBuffer;
        windSource.loop = true;
        const lp = audioCtx.createBiquadFilter();
        lp.type = "lowpass";
        lp.frequency.value = 260;
        windGain = audioCtx.createGain();
        windGain.gain.value = 0.001;
        windSource.connect(lp);
        lp.connect(windGain);
        windGain.connect(masterGain);
        windSource.start(now);
      }
      windGain.gain.setTargetAtTime(0.11, now, 0.15);
    } else if (windGain) {
      windGain.gain.setTargetAtTime(0, now, 0.02);
    }
  }

  // Shot rate limiter (<= 12 shot sounds/sec wall-clock, loudest first)
  const SHOT_LOUDNESS = { lance: 5, cannon: 4, flak: 3, frost: 2, bolt: 1 };
  const recentShotTimestamps = [];
  const recentKillTimestamps = [];

  function triggerTickAudio(prevSimTime, curSimTime) {
    if (!audioCtx || state !== "PLAYING" || isScrubbing) return;
    if (curSimTime <= prevSimTime || curSimTime - prevSimTime > 0.5) return;

    const nowWall = performance.now();
    const nowCtx = audioCtx.currentTime;
    masterGain.gain.cancelScheduledValues(nowCtx);
    masterGain.gain.setValueAtTime(0.85, nowCtx);

    const kPrev = Math.floor(prevSimTime * TICKS_PER_SEC);
    const kCur = Math.min(ticks.length - 1, Math.floor(curSimTime * TICKS_PER_SEC));

    // Prune 1s sliding window
    while (recentShotTimestamps.length > 0 && nowWall - recentShotTimestamps[0] > 1000) recentShotTimestamps.shift();
    while (recentKillTimestamps.length > 0 && nowWall - recentKillTimestamps[0] > 1000) recentKillTimestamps.shift();

    for (let k = kPrev + 1; k <= kCur; k++) {
      const tk = ticks[k];
      if (!tk) continue;
      if (tk.waveStarted > 0) playWaveHorn();
    }

    // Collect shots across crossed ticks and pick loudest within budget
    const candShots = [];
    for (let i = 0; i < shotEvents.length; i++) {
      const sh = shotEvents[i];
      if (sh.tick > kPrev && sh.tick <= kCur) candShots.push(sh);
    }
    if (candShots.length > 0) {
      candShots.sort(function (a, b) {
        return (SHOT_LOUDNESS[b.type] || 0) - (SHOT_LOUDNESS[a.type] || 0);
      });
      for (let i = 0; i < candShots.length && recentShotTimestamps.length < 12; i++) {
        playShotSound(candShots[i].type, candShots[i].sx);
        recentShotTimestamps.push(nowWall);
      }
    }

    for (let i = 0; i < killEvents.length; i++) {
      const kl = killEvents[i];
      if (kl.tick > kPrev && kl.tick <= kCur && recentKillTimestamps.length < 10) {
        playKillSound(kl.x);
        recentKillTimestamps.push(nowWall);
      }
    }

    for (let i = 0; i < leakTimes.length; i++) {
      const lk = leakTimes[i];
      if (lk.tick > kPrev && lk.tick <= kCur) playLeakSound(lk.x);
    }

    if (fallTick > kPrev && fallTick <= kCur) playFallSound();
    updateWindAudio(fallTick >= 0 && curSimTime >= fallTime);
  }

  // =========================================================================
  // 10. 5-STATE PLAYBACK STATE MACHINE & CANONICAL DOCK BINDINGS
  // =========================================================================
  const elCountdown = document.getElementById("countdown");
  const elBtnRefire = document.getElementById("btn-refire");
  const elBtnToggle = document.getElementById("btn-toggle");
  const elIconPause = document.getElementById("icon-pause");
  const elIconPlay  = document.getElementById("icon-play");
  const elScrubber  = document.getElementById("scrubber");
  const speedPills  = Array.prototype.slice.call(document.querySelectorAll(".speed-pill"));

  let state = "COUNTDOWN"; // COUNTDOWN | PLAYING | PAUSED | REFIRE_HOLD | ENDED
  let simTime = 0;
  let playbackSpeed = 1.0;
  let countdownElapsed = 0;
  let holdElapsed = 0;
  let isScrubbing = false;
  let countdownActive = false;

  function setToggleIcon(isPausedLike) {
    if (isPausedLike) {
      elIconPause.style.display = "none";
      elIconPlay.style.display = "";
      elBtnToggle.setAttribute("aria-label", "Play");
    } else {
      elIconPause.style.display = "";
      elIconPlay.style.display = "none";
      elBtnToggle.setAttribute("aria-label", "Pause");
    }
  }

  function hideCountdown() {
    elCountdown.style.display = "none";
    elCountdown.textContent = "";
  }

  // Initial resting render before countdown starts
  elCountdown.style.display = "block";
  elCountdown.textContent = "3";
  renderAt(0);

  elBtnToggle.addEventListener("click", function () {
    unlockAudio();
    if (state === "PLAYING") {
      state = "PAUSED";
      setToggleIcon(true);
      silenceAudioImmediately();
    } else if (state === "COUNTDOWN" || state === "REFIRE_HOLD") {
      state = "PAUSED";
      hideCountdown();
      simTime = 0;
      elScrubber.value = "0";
      setToggleIcon(true);
      silenceAudioImmediately();
      renderAt(0);
    } else if (state === "PAUSED") {
      state = "PLAYING";
      setToggleIcon(false);
    } else if (state === "ENDED") {
      simTime = 0;
      elScrubber.value = "0";
      hideCountdown();
      state = "PLAYING";
      setToggleIcon(false);
      renderAt(0);
    }
  });

  speedPills.forEach(function (pill) {
    pill.addEventListener("click", function () {
      playbackSpeed = parseFloat(pill.getAttribute("data-speed")) || 1.0;
      speedPills.forEach(function (p) {
        const active = p === pill;
        p.classList.toggle("is-active", active);
        p.setAttribute("aria-checked", active ? "true" : "false");
      });
    });
  });

  elScrubber.addEventListener("pointerdown", function () {
    isScrubbing = true;
    silenceAudioImmediately();
  });
  window.addEventListener("pointerup", function () {
    isScrubbing = false;
  });

  elScrubber.addEventListener("input", function () {
    hideCountdown();
    simTime = Math.max(0, Math.min(DURATION, parseFloat(elScrubber.value) || 0));
    state = "PAUSED";
    setToggleIcon(true);
    silenceAudioImmediately();
    renderAt(simTime);
  });

  elBtnRefire.addEventListener("click", function () {
    unlockAudio();
    hideCountdown();
    simTime = 0;
    elScrubber.value = "0";
    holdElapsed = 0;
    state = "REFIRE_HOLD";
    setToggleIcon(false);
    silenceAudioImmediately();
    renderAt(0);
  });

  // Main animation loop
  let lastRafTime = null;
  function frame(nowMs) {
    if (lastRafTime === null) {
      lastRafTime = nowMs;
      countdownActive = true;
      requestAnimationFrame(frame);
      return;
    }
    const rawDt = (nowMs - lastRafTime) * 0.001;
    lastRafTime = nowMs;
    const dt = Math.min(Math.max(rawDt, 0), 0.1);

    if (state === "COUNTDOWN" && countdownActive) {
      countdownElapsed += dt;
      if (countdownElapsed < 1.0) {
        elCountdown.style.display = "block";
        elCountdown.textContent = "3";
      } else if (countdownElapsed < 2.0) {
        elCountdown.style.display = "block";
        elCountdown.textContent = "2";
      } else if (countdownElapsed < 3.0) {
        elCountdown.style.display = "block";
        elCountdown.textContent = "1";
      } else {
        hideCountdown();
        state = "PLAYING";
      }
      renderAt(0);
    } else if (state === "REFIRE_HOLD") {
      holdElapsed += dt;
      if (holdElapsed >= 1.0) {
        state = "PLAYING";
      }
      renderAt(0);
    } else if (state === "PLAYING") {
      const prevT = simTime;
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      elScrubber.value = simTime.toFixed(3);
      triggerTickAudio(prevT, simTime);
      renderAt(simTime);

      if (simTime >= DURATION) {
        simTime = DURATION;
        elScrubber.value = DURATION.toFixed(3);
        state = "ENDED";
        setToggleIcon(true);
        silenceAudioImmediately();
        renderAt(DURATION);
      }
    } else {
      // PAUSED or ENDED: keep sound silenced
      if (masterGain && masterGain.gain.value > 0.001) silenceAudioImmediately();
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // =========================================================================
  // 11. MACHINE-READABLE SELF-REPORT
  // =========================================================================
  window.BENCH_REPORT = {
    selfCheck: { vectorA: true, vectorB: true },
    strategy: {
      summary: "Cannon-splash core with flak air-defense, frost slow at chokepoint, bolt early cleanup, urgent-spend fallback, and per-turret-type targeting (cluster splash for cannon/flak, unslowed-fastest for frost, overkill-aware low-armor focus for bolt, high-HP/mender/brute focus for lance).",
      seedsTested: 20,
      meanScoreOnTestedSeeds: 43.17
    },
    seed42: { score: simResult.score, fallTick: simResult.fallTick },
    systems: {
      board: "full",
      enemiesAndTurrets: "full",
      combatVisuals: "full",
      fall: "full",
      hud: "full",
      audio: "full"
    },
    simplifications: [],
    testedInBrowser: false,
    measuredFps: null
  };
})();
</script>
</body>
</html>
