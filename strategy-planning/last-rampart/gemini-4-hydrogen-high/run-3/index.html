<!DOCTYPE html>

<style>

  display: block;

<script id="rampart-strategy">
function createStrategy() {
  var COSTS = { bolt: 50, cannon: 90, frost: 70, lance: 120, flak: 80 };
  var SLOT_TYPES = [
    "cannon", "cannon", "cannon", "cannon",
    "cannon", "frost",  "cannon", "cannon",
    "flak",   "cannon", "cannon", "cannon",
    "flak",   "cannon", "bolt",   "cannon"
  ];
  var QUEUE = [
    { op: "b", slot: 7 },
    { op: "b", slot: 6 },
    { op: "b", slot: 12 },
    { op: "b", slot: 4 },
    { op: "b", slot: 1 },
    { op: "b", slot: 8 },
    { op: "b", slot: 14 },
    { op: "b", slot: 15 },
    { op: "u", slot: 14, tier: 2 },
    { op: "b", slot: 3 },
    { op: "u", slot: 3, tier: 2 },
    { op: "u", slot: 3, tier: 3 },
    { op: "b", slot: 2 },
    { op: "u", slot: 12, tier: 2 },
    { op: "u", slot: 1, tier: 2 },
    { op: "u", slot: 4, tier: 2 },
    { op: "u", slot: 15, tier: 2 },
    { op: "u", slot: 15, tier: 3 },
    { op: "b", slot: 9 },
    { op: "u", slot: 9, tier: 2 },
    { op: "u", slot: 9, tier: 3 },
    { op: "b", slot: 10 },
    { op: "u", slot: 10, tier: 2 },
    { op: "u", slot: 2, tier: 2 },
    { op: "u", slot: 12, tier: 3 },
    { op: "u", slot: 7, tier: 2 },
    { op: "u", slot: 7, tier: 3 },
    { op: "b", slot: 11 },
    { op: "u", slot: 4, tier: 3 },
    { op: "u", slot: 11, tier: 2 },
    { op: "u", slot: 8, tier: 2 },
    { op: "u", slot: 8, tier: 3 },
    { op: "u", slot: 6, tier: 2 },
    { op: "b", slot: 5 },
    { op: "b", slot: 13 },
    { op: "u", slot: 1, tier: 3 },
    { op: "u", slot: 2, tier: 3 },
    { op: "u", slot: 5, tier: 2 },
    { op: "u", slot: 14, tier: 3 },
    { op: "u", slot: 13, tier: 2 },
    { op: "u", slot: 13, tier: 3 },
    { op: "u", slot: 10, tier: 3 },
    { op: "b", slot: 0 },
    { op: "u", slot: 0, tier: 2 },
    { op: "u", slot: 0, tier: 3 },
    { op: "u", slot: 5, tier: 3 },
    { op: "u", slot: 11, tier: 3 },
    { op: "u", slot: 6, tier: 3 }
  ];

  function effSpeed(c) {
    var s = c.slowed ? Math.floor(c.speed * 6 / 10) : c.speed;
    return s > 0 ? s : 1;
  }

  return {
    plan: function (state) {
      var actions = [];
      var g = state.gold;
      var hasAir = state.wave >= 3;
      if (!hasAir && state.nextWave) {
        for (var k = 0; k < state.nextWave.length; k++) {
          if (state.nextWave[k] === "wisp") { hasAir = true; break; }
        }
      }
      for (var i = 0; i < QUEUE.length; i++) {
        var q = QUEUE[i];
        var sl = state.slots[q.slot];
        if (q.op === "b") {
          var type = SLOT_TYPES[q.slot];
          if (type === "flak" && !hasAir) continue;
          if (!sl.turret) {
            var bc = COSTS[type];
            if (g >= bc) {
              actions.push({ op: "build", slot: q.slot, type: type });
              g -= bc;
            } else if (i < 5) {
              break;
            }
          }
        } else {
          if (sl.turret && sl.turret.tier === q.tier - 1) {
            var uc = q.tier === 2 ? COSTS[sl.turret.type] : COSTS[sl.turret.type] * 2;
            if (g >= uc) {
              actions.push({ op: "upgrade", slot: q.slot });
              g -= uc;
            }
          }
        }
        if (actions.length >= 32) break;
      }
      return actions;
    },

    target: function (turret, candidates) {
      if (candidates.length === 1) return candidates[0].id;
      var i, j, c, o, spd, eta, sc;
      var best = candidates[0];
      var bestS = -1e18;

      if (turret.type === "frost") {
        for (i = 0; i < candidates.length; i++) {
          c = candidates[i];
          eta = c.remaining / effSpeed(c);
          sc = (c.slowed ? 0 : 1000000) + c.speed * 500 - eta * 100;
          if (sc > bestS) { bestS = sc; best = c; }
        }
        return best.id;
      }

      if (turret.type === "cannon" || turret.type === "flak") {
        var sr2 = turret.type === "cannon" ? 8100 : 4900;
        for (i = 0; i < candidates.length; i++) {
          c = candidates[i];
          var hits = 0;
          var menders = 0;
          for (j = 0; j < candidates.length; j++) {
            o = candidates[j];
            var dx = o.x - c.x;
            var dy = o.y - c.y;
            if (dx * dx + dy * dy <= sr2) {
              hits++;
              if (o.type === "mender") menders++;
            }
          }
          eta = c.remaining / effSpeed(c);
          var urg = eta < 22 ? (22 - eta) * 4000 : 0;
          sc = hits * 10000 + menders * 3000 + urg - eta * 10;
          if (sc > bestS) { bestS = sc; best = c; }
        }
        return best.id;
      }

      if (turret.type === "lance") {
        var ldmg = turret.tier === 1 ? 180 : (turret.tier === 2 ? 288 : 460);
        for (i = 0; i < candidates.length; i++) {
          c = candidates[i];
          eta = c.remaining / effSpeed(c);
          var lurg = eta < 30 ? (30 - eta) * 20000 : 0;
          var effDmg = c.hp < ldmg ? c.hp : ldmg;
          sc = lurg + effDmg * 10 + c.armor * 1500 + (c.type === "mender" ? 4000 : 0) - eta * 5;
          if (sc > bestS) { bestS = sc; best = c; }
        }
        return best.id;
      }

      var bdmg = turret.tier === 1 ? 26 : (turret.tier === 2 ? 41 : 65);
      for (i = 0; i < candidates.length; i++) {
        c = candidates[i];
        eta = c.remaining / effSpeed(c);
        var dealt = bdmg > c.armor ? bdmg - c.armor : 1;
        var kill = c.hp <= dealt ? 40000 : 0;
        sc = kill + dealt * 200 - eta * 120;
        if (sc > bestS) { bestS = sc; best = c; }
      }
      return best.id;
    }
  };
}
</script>

<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks, observer) {
  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return (t ^ (t >>> 14)) >>> 0;
    };
  }

  var GROUND_PTS = [[50,250],[650,250],[650,1050],[1250,1050],[1250,350],[1850,350],[1850,1150],[2350,1150]];
  var AIR_PTS = [[50,650],[2150,650],[2150,1150],[2350,1150]];

  function buildPath(pts) {
    var segs = [];
    var total = 0;
    for (var i = 0; i < pts.length - 1; i++) {
      var dx = pts[i + 1][0] - pts[i][0];
      var dy = pts[i + 1][1] - pts[i][1];
      var len = Math.abs(dx) + Math.abs(dy);
      var sx = dx === 0 ? 0 : (dx > 0 ? 1 : -1);
      var sy = dy === 0 ? 0 : (dy > 0 ? 1 : -1);
      segs.push({ x0: pts[i][0], y0: pts[i][1], sx: sx, sy: sy, start: total, len: len });
      total += len;
    }
    return { segs: segs, total: total };
  }

  var GROUND_PATH = buildPath(GROUND_PTS);
  var AIR_PATH = buildPath(AIR_PTS);

  function posOnPath(path, prog) {
    var segs = path.segs;
    for (var i = 0; i < segs.length; i++) {
      var s = segs[i];
      if (prog <= s.start + s.len) {
        var d = prog - s.start;
        return [s.x0 + s.sx * d, s.y0 + s.sy * d, s.sx, s.sy];
      }
    }
    var last = segs[segs.length - 1];
    return [last.x0 + last.sx * last.len, last.y0 + last.sy * last.len, last.sx, last.sy];
  }

  var SLOT_TILES = [
    [3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],
    [14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]
  ];

  var TURRET_TYPES = {
    bolt:   { idx: 0, cost: 50,  dmg: 26,  period: 8,  range: 300, splash: 0,  slow: 0,  pierce: false, ground: true,  air: true },
    cannon: { idx: 1, cost: 90,  dmg: 60,  period: 24, range: 260, splash: 90, slow: 0,  pierce: false, ground: true,  air: false },
    frost:  { idx: 2, cost: 70,  dmg: 10,  period: 12, range: 240, splash: 0,  slow: 30, pierce: false, ground: true,  air: true },
    lance:  { idx: 3, cost: 120, dmg: 180, period: 36, range: 360, splash: 0,  slow: 0,  pierce: true,  ground: true,  air: false },
    flak:   { idx: 4, cost: 80,  dmg: 40,  period: 10, range: 320, splash: 70, slow: 0,  pierce: false, ground: false, air: true }
  };

  var ENEMY_TYPES = [
    { idx: 0, name: "grunt",    baseHp: 60,  speed: 10, bounty: 4, leak: 1, air: 0, firstWave: 1, weight: 10 },
    { idx: 1, name: "runner",   baseHp: 40,  speed: 20, bounty: 4, leak: 1, air: 0, firstWave: 2, weight: 4 },
    { idx: 2, name: "wisp",     baseHp: 50,  speed: 12, bounty: 6, leak: 2, air: 1, firstWave: 3, weight: 3 },
    { idx: 3, name: "brute",    baseHp: 150, speed: 6,  bounty: 9, leak: 3, air: 0, firstWave: 4, weight: 3 },
    { idx: 4, name: "splitter", baseHp: 90,  speed: 8,  bounty: 6, leak: 2, air: 0, firstWave: 6, weight: 2 },
    { idx: 5, name: "mender",   baseHp: 70,  speed: 8,  bounty: 7, leak: 2, air: 0, firstWave: 8, weight: 1 }
  ];
  var ENEMY_MAP = {};
  for (var ei = 0; ei < ENEMY_TYPES.length; ei++) ENEMY_MAP[ENEMY_TYPES[ei].name] = ENEMY_TYPES[ei];

  var rng = mulberry32(seed >>> 0);
  var multCache = [0, 1000];
  function getMult(w) {
    while (multCache.length <= w) {
      var prev = multCache[multCache.length - 1];
      multCache.push(Math.floor(prev * 108 / 100));
    }
    return multCache[w];
  }

  function genWave(w) {
    var count = 4 + Math.floor(3 * w / 5);
    var avail = [];
    var totalW = 0;
    for (var i = 0; i < ENEMY_TYPES.length; i++) {
      if (ENEMY_TYPES[i].firstWave <= w) {
        avail.push(ENEMY_TYPES[i]);
        totalW += ENEMY_TYPES[i].weight;
      }
    }
    var list = [];
    for (var j = 0; j < count; j++) {
      var r = rng() % totalW;
      var chosen = avail[avail.length - 1].name;
      for (var k = 0; k < avail.length; k++) {
        if (r < avail[k].weight) {
          chosen = avail[k].name;
          break;
        }
        r -= avail[k].weight;
      }
      list.push(chosen);
    }
    return list;
  }

  var strat = createStrategy();
  var gold = 250;
  var baseHp = 10;
  var currentWave = 0;
  var nextEnemyId = 1;
  var fallTick = -1;
  var log = [];

  var slots = [];
  for (var si = 0; si < SLOT_TILES.length; si++) {
    slots.push({
      slot: si,
      x: 100 * SLOT_TILES[si][0] + 50,
      y: 100 * SLOT_TILES[si][1] + 50,
      turret: null
    });
  }

  var wavesCache = {};
  var enemies = [];
  var spawnQueue = [];

  function turretDmg(typeSpec, tier) {
    var d = typeSpec.dmg;
    for (var t = 2; t <= tier; t++) d = Math.floor(d * 16 / 10);
    return d;
  }

  function makeEnemyView(e) {
    return {
      id: e.id, type: e.type, hp: e.hp, maxHp: e.maxHp,
      x: e.x, y: e.y, air: e.air, armor: e.armor, speed: e.speed,
      slowed: e.slow > 0 ? 1 : 0, remaining: e.routeLen - e.progress
    };
  }

  function spawnOne(typeName, wave, progress, customMaxHp) {
    var spec = ENEMY_MAP[typeName];
    var maxHp, speed, armor, bounty, leak, air, typeIdx;
    if (typeName === "splitling") {
      maxHp = customMaxHp;
      speed = 12;
      armor = 0;
      bounty = 1;
      leak = 1;
      air = 0;
      typeIdx = 6;
    } else {
      maxHp = Math.floor(spec.baseHp * getMult(wave) / 1000);
      speed = spec.speed;
      armor = typeName === "grunt" ? Math.floor(wave / 4) : (typeName === "brute" ? 6 + wave : 0);
      bounty = spec.bounty;
      leak = spec.leak;
      air = spec.air;
      typeIdx = spec.idx;
    }
    var path = air ? AIR_PATH : GROUND_PATH;
    var p = posOnPath(path, progress);
    enemies.push({
      id: nextEnemyId++,
      type: typeName,
      typeIdx: typeIdx,
      wave: wave,
      hp: maxHp,
      maxHp: maxHp,
      speed: speed,
      armor: armor,
      bounty: bounty,
      leak: leak,
      air: air,
      progress: progress,
      routeLen: path.total,
      path: path,
      x: p[0],
      y: p[1],
      dx: p[2],
      dy: p[3],
      age: 0,
      slow: 0
    });
  }

  var nextWaveNum = 1;
  var nextWaveTick = 20;

  for (var tick = 0; tick < maxTicks; tick++) {
    if (tick === nextWaveTick) {
      currentWave = nextWaveNum;
      gold += Math.min(50, Math.floor(gold * 5 / 100)) + 10 + 2 * currentWave;
      if (!wavesCache[currentWave]) wavesCache[currentWave] = genWave(currentWave);
      wavesCache[currentWave + 1] = genWave(currentWave + 1);
      if (observer && observer.onWave) observer.onWave(tick, currentWave, wavesCache[currentWave + 1]);

      var slotViews = [];
      for (var sv = 0; sv < 16; sv++) {
        var slv = slots[sv];
        slotViews.push({
          slot: slv.slot, x: slv.x, y: slv.y,
          turret: slv.turret ? { type: slv.turret.type, tier: slv.turret.tier, spent: slv.turret.spent } : null
        });
      }
      var enemyViews = [];
      for (var ev = 0; ev < enemies.length; ev++) enemyViews.push(makeEnemyView(enemies[ev]));

      var state = {
        tick: tick,
        wave: currentWave,
        gold: gold,
        baseHp: baseHp,
        slots: slotViews,
        enemies: enemyViews,
        nextWave: wavesCache[currentWave + 1].slice()
      };
      var actions = strat.plan(state) || [];
      var limit = Math.min(32, actions.length);
      for (var ai = 0; ai < limit; ai++) {
        var act = actions[ai];
        if (!act || typeof act.slot !== "number") continue;
        var sl = slots[act.slot];
        if (!sl) continue;
        if (act.op === "build") {
          var spec = TURRET_TYPES[act.type];
          if (!sl.turret && spec && gold >= spec.cost) {
            gold -= spec.cost;
            sl.turret = {
              type: act.type, spec: spec, tier: 1, spent: spec.cost,
              cd: 0, dmg: spec.dmg, range: spec.range
            };
            log.push([tick, "B", sl.slot, spec.idx]);
            if (observer && observer.onBuild) observer.onBuild(tick, sl.slot, "B", spec.idx, sl.x, sl.y);
          }
        } else if (act.op === "upgrade") {
          var t = sl.turret;
          if (t && t.tier < 3) {
            var ucost = t.tier === 1 ? t.spec.cost : t.spec.cost * 2;
            if (gold >= ucost) {
              gold -= ucost;
              t.spent += ucost;
              t.tier += 1;
              t.dmg = turretDmg(t.spec, t.tier);
              t.range = t.spec.range + 30 * (t.tier - 1);
              log.push([tick, "U", sl.slot, t.tier]);
              if (observer && observer.onBuild) observer.onBuild(tick, sl.slot, "U", t.spec.idx, sl.x, sl.y);
            }
          }

  // Build glyph + icon atlas on detached in-memory canvas
  // Layout: 16x16 grid of 64x64 cells (1024x1024) or 8x4 grid of 64x64 cells (512x256)
  function buildHudAtlas() {
    var c = document.createElement("canvas");
    c.width = 512; c.height = 256;
    var ctx = c.getContext("2d");
    ctx.clearRect(0, 0, 512, 256);

    // Row 0..1 (cells 0..9): digits 0..9
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 48px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (var d = 0; d < 10; d++) {
      var col = d % 8, row = Math.floor(d / 8);
      ctx.fillText(String(d), col * 64 + 32, row * 64 + 34);
    }

    // Cell 10 (col 2, row 1): Wave crossed-blades glyph
    ctx.save();
    ctx.translate(2 * 64 + 32, 1 * 64 + 32);
    ctx.strokeStyle = "#8ab4f8";
    ctx.lineWidth = 5;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-16, 16); ctx.lineTo(18, -18);
    ctx.moveTo(16, 16);  ctx.lineTo(-18, -18);
    ctx.stroke();
    ctx.strokeStyle = "#ffd166";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-18, 6); ctx.lineTo(-6, 18);
    ctx.moveTo(18, 6);  ctx.lineTo(6, 18);
    ctx.stroke();
    ctx.restore();

    // Cell 11 (col 3, row 1): Coin icon
    ctx.save();
    ctx.translate(3 * 64 + 32, 1 * 64 + 32);
    ctx.fillStyle = "#f5c542";
    ctx.beginPath();
    ctx.arc(0, 0, 20, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#b37b12";
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.fillStyle = "#fff2a6";
    ctx.beginPath();
    ctx.arc(-5, -5, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Cell 12 (col 4, row 1): Solid rounded HP pip
    ctx.save();
    ctx.translate(4 * 64 + 32, 1 * 64 + 32);
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(-16, -20, 32, 40, 8) : ctx.rect(-16, -20, 32, 40);
    ctx.fill();
    ctx.restore();

    // Row 2 (cells 16..21): 6 enemy-type icons (grunt, runner, wisp, brute, splitter, mender)
    var iconColors = ["#6b8e5a", "#f5d020", "#2cf5ff", "#ff7a1a", "#9b4dff", "#f2f6fa"];
    for (var ei = 0; ei < 6; ei++) {
      ctx.save();
      ctx.translate(ei * 64 + 32, 2 * 64 + 32);
      ctx.fillStyle = iconColors[ei];
      ctx.strokeStyle = "#0b0d14";
      ctx.lineWidth = 3;
      ctx.beginPath();
      if (ei === 0) { // grunt circle
        ctx.arc(0, 0, 18, 0, Math.PI * 2);
      } else if (ei === 1) { // runner triangle
        ctx.moveTo(20, 0); ctx.lineTo(-14, -15); ctx.lineTo(-14, 15); ctx.closePath();
      } else if (ei === 2) { // wisp diamond
        ctx.moveTo(0, -20); ctx.lineTo(18, 0); ctx.lineTo(0, 20); ctx.lineTo(-18, 0); ctx.closePath();
      } else if (ei === 3) { // brute heavy square
        ctx.rect(-18, -18, 36, 36);
      } else if (ei === 4) { // splitter hex
        for (var k = 0; k < 6; k++) {
          var a = (k / 6) * Math.PI * 2;
          if (k === 0) ctx.moveTo(Math.cos(a) * 19, Math.sin(a) * 19);
          else ctx.lineTo(Math.cos(a) * 19, Math.sin(a) * 19);
        }
        ctx.closePath();
      } else { // mender cross + circle
        ctx.arc(0, 0, 18, 0, Math.PI * 2);
      }
      ctx.fill();
      ctx.stroke();
      if (ei === 5) {
        ctx.fillStyle = "#38ef7d";
        ctx.fillRect(-4, -11, 8, 22);
        ctx.fillRect(-11, -4, 22, 8);
      }
      ctx.restore();
    }

    var tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  var hudAtlas = buildHudAtlas();

  // Per-instance UV offset/scale via custom ShaderMaterial so one InstancedMesh draws all HUD sprites!
  var hudMat = new THREE.ShaderMaterial({
    uniforms: {
      uMap: { value: hudAtlas }
    },
    vertexShader: [
      "attribute vec4 aUvRect;",
      "attribute vec4 aColor;",
      "varying vec2 vUv;",
      "varying vec4 vColor;",
      "void main() {",
      "  vUv = aUvRect.xy + uv * aUvRect.zw;",
      "  vColor = aColor;",
      "  gl_Position = projectionMatrix * modelViewMatrix * instanceMatrix * vec4(position, 1.0);",
      "}"
    ].join("\n"),
    fragmentShader: [
      "uniform sampler2D uMap;",
      "varying vec2 vUv;",
      "varying vec4 vColor;",
      "void main() {",
      "  vec4 tex = texture2D(uMap, vUv);",
      "  gl_FragColor = vec4(tex.rgb * vColor.rgb, tex.a * vColor.a);",
      "}"
    ].join("\n"),
    transparent: true,
    depthTest: false,
    depthWrite: false
  });

  var hudUvAttr = new THREE.InstancedBufferAttribute(new Float32Array(MAX_HUD_QUADS * 4), 4);
  var hudColAttr = new THREE.InstancedBufferAttribute(new Float32Array(MAX_HUD_QUADS * 4), 4);
  hudGeo.setAttribute("aUvRect", hudUvAttr);
  hudGeo.setAttribute("aColor", hudColAttr);

  var hudMesh = new THREE.InstancedMesh(hudGeo, hudMat, MAX_HUD_QUADS);

  function addHudSprite(idx, cellIdx, cx, cy, w, h, r, g, b, a) {
    if (idx >= MAX_HUD_QUADS) return idx;
    var col = cellIdx % 8;
    var row = Math.floor(cellIdx / 8);
    // CanvasTexture flips Y by default: row 0 is top of canvas => v in [0.75, 1.0]
    var u0 = col / 8;
    var v0 = 1 - (row + 1) / 4;
    hudUvAttr.setXYZW(idx, u0, v0, 1 / 8, 1 / 4);
    hudColAttr.setXYZW(idx, r, g, b, a);
    dummy.position.set(cx, cy, 0);
    dummy.rotation.set(0, 0, 0);
    dummy.scale.set(w, h, 1);
    dummy.updateMatrix();
    hudMesh.setMatrixAt(idx, dummy.matrix);
    return idx + 1;
  }

  function updateHud(simTime, frame) {
    var W = window.innerWidth || 1280;
    var H = window.innerHeight || 650;
    var padX = Math.max(18, W * 0.022);
    var padY = Math.max(18, H * 0.03);
    var waveH = Math.max(48, H * 0.08); // >= 7% viewport height
    var q = 0;

    // 1. Wave icon + large digits (top-left)
    var wy = H - padY - waveH * 0.5;
    q = addHudSprite(q, 10, padX + waveH * 0.45, wy, waveH * 0.85, waveH * 0.85, 1, 1, 1, 0.95);
    var waveStr = String(frame.wave);
    var digW = waveH * 0.62;
    var wx = padX + waveH * 0.95 + digW * 0.5;
    for (var wi = 0; wi < waveStr.length; wi++) {
      q = addHudSprite(q, waveStr.charCodeAt(wi) - 48, wx, wy, digW, waveH, 0.96, 0.98, 1.0, 0.96);
      wx += digW * 0.88;
    }

    // 2. Gold icon + digits (below wave)

    var gy = wy - waveH * 0.55 - goldH * 0.55;
    q = addHudSprite(q, 11, padX + goldH * 0.45, gy, goldH * 0.82, goldH * 0.82, 1, 1, 1, 0.95);
    var goldStr = String(frame.gold);
    var gDigW = goldH * 0.62;
    var gx = padX + goldH * 0.95 + gDigW * 0.5;
    for (var gi = 0; gi < goldStr.length; gi++) {
      q = addHudSprite(q, goldStr.charCodeAt(gi) - 48, gx, gy, gDigW, goldH, 1.0, 0.86, 0.35, 0.96);

    var nx = padX + iconH * 0.45;

  // ---------------------------------------------------------------------------
  // 10. Dynamic Resize & 55-deg Framing (Clear of Bottom 90px Dock)

  function updateCameraFraming() {
    var W = Math.max(320, window.innerWidth);
    var H = Math.max(240, window.innerHeight);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);

    renderer.setPixelRatio(dpr);
    renderer.setSize(W, H, false);
    rt.setSize(Math.floor(W * dpr), Math.floor(H * dpr));

    camera.aspect = W / H;
    camera.updateProjectionMatrix();

    hudCamera.right = W;
    hudCamera.top = H;
    hudCamera.updateProjectionMatrix();

    // Elevate ~55 deg above horizon
    var elev = 55 * Math.PI / 180;
    var dirY = Math.sin(elev);
    var dirZ = Math.cos(elev);

    // Shift lookAt slightly down in +Z so board sits clearly above bottom 90px dock
    var dockFrac = Math.min(0.25, 92 / H);
    var minYndc = -1 + 2 * dockFrac + 0.03;
    var maxYndc = 0.94;
    var maxXndc = 0.95;

    // Corners of board + 0.65 tile margin
    var corners = [
      new THREE.Vector3(-0.65, 0, -0.65),
      new THREE.Vector3(24.65, 0, -0.65),
      new THREE.Vector3(-0.65, 0, 14.65),
      new THREE.Vector3(24.65, 0, 14.65),
      new THREE.Vector3(-0.65, 1.5, -0.65),
      new THREE.Vector3(24.65, 1.5, 14.65)
    ];

    baseCamTarget.set(12.0, 0.0, 7.65);
    var lo = 14, hi = 90;
    for (var it = 0; it < 20; it++) {
      var mid = (lo + hi) * 0.5;
      camera.position.set(baseCamTarget.x, baseCamTarget.y + dirY * mid, baseCamTarget.z + dirZ * mid);
      camera.lookAt(baseCamTarget);
      camera.updateMatrixWorld();

      var fits = true;
      for (var c = 0; c < corners.length; c++) {
        var p = corners[c].clone().project(camera);
        if (Math.abs(p.x) > maxXndc || p.y < minYndc || p.y > maxYndc) {
          fits = false;
          break;
        }
      }
      if (fits) hi = mid; else lo = mid;
    }
    baseCamPos.set(baseCamTarget.x, baseCamTarget.y + dirY * hi, baseCamTarget.z + dirZ * hi);
  }

  window.addEventListener("resize", updateCameraFraming);

      compressor.connect(audioCtx.destination);

      var data = noiseBuffer.getChannelData(0);

  }

  function boardPan(x) {

  function playShotSound(typeIdx, x) {

      trackVoice(nSrc, now + 0.16);

      fSrc.buffer = noiseBuffer;

      bp.type = "bandpass";

      var lg = audioCtx.createGain();
      lOsc.type = "sawtooth";
      lOsc.frequency.setValueAtTime(1150 * jit, now);
      lOsc.frequency.exponentialRampToValueAtTime(150, now + 0.14);
      lg.gain.setValueAtTime(0.16, now);
      lg.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      lOsc.connect(lg); lg.connect(pan);

      kg.gain.setValueAtTime(0.15, now);
      kg.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

      kSrc.start(now, audioRng() * 0.5, 0.10);

  function playKillPop(x) {
    if (!audioCtx || audioCtx.state !== "running") return;

    var osc = audioCtx.createOscillator();
    var filt = audioCtx.createBiquadFilter();
    var g = audioCtx.createGain();

    osc.frequency.setValueAtTime(146.8, now);
    osc.frequency.exponentialRampToValueAtTime(220, now + 0.28);

    filt.frequency.value = 640;

    g.gain.linearRampToValueAtTime(0.13, now + 0.06);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.38);

  function playFallCollapse() {

    var og = audioCtx.createGain();

    nSrc.buffer = noiseBuffer;
    var lp = audioCtx.createBiquadFilter();

  function startFallWind() {
    if (!audioCtx || audioCtx.state !== "running" || windNode) return;
    var now = audioCtx.currentTime;
    var wSrc = audioCtx.createBufferSource();
    wSrc.buffer = noiseBuffer;
    wSrc.loop = true;

    bp.type = "bandpass";
    bp.frequency.value = 220;

  function processAudioForAdvance(prevTime, curTime) {
    if (!audioCtx || audioCtx.state !== "running" || curTime <= prevTime) return;
    var prevTick = Math.floor(prevTime * 20);
    var curTick = Math.floor(curTime * 20);

    // Ensure master gain is up while playing
    var now = audioCtx.currentTime;
    if (masterGain.gain.value < 0.75) {

      masterGain.gain.setValueAtTime(masterGain.gain.value, now);
      masterGain.gain.linearRampToValueAtTime(0.85, now + 0.03);

      else if (!windNode) startFallWind();
      lastAudioTick = curTick;
      return;
    }

    if (curTick <= lastAudioTick) return;
    var t0 = Math.max(prevTick + 1, lastAudioTick + 1);
    var t1 = curTick;

    // Wave horns
    for (var wi = 0; wi < waveEvents.length; wi++) {
      if (waveEvents[wi].tick >= t0 && waveEvents[wi].tick <= t1) playWaveHorn();
    }
    // Leaks
    for (var li = 0; li < leakEvents.length; li++) {
      if (leakEvents[li].tick >= t0 && leakEvents[li].tick <= t1) playLeakAlarm();
    }
    // Kills (cap at 3 pops per frame to avoid clutter)
    var pops = 0;
    for (var ki = 0; ki < killEvents.length && pops < 3; ki++) {
      if (killEvents[ki].tick >= t0 && killEvents[ki].tick <= t1) {
        playKillPop(killEvents[ki].x);
        pops++;
      }
    }

    var priorityOrder = [3, 1, 4, 0, 2];
    shotTimestamps = shotTimestamps.filter(function (ts) { return now - ts < 1.0; });
    var dueShots = [];
    for (var shi = 0; shi < shotEvents.length; shi++) {
      var sh = shotEvents[shi];
      if (sh.tick >= t0 && sh.tick <= t1) dueShots.push(sh);
    }
    if (dueShots.length > 0 && shotTimestamps.length < 12) {
      dueShots.sort(function (a, b) {
        return priorityOrder.indexOf(a.typeIdx) - priorityOrder.indexOf(b.typeIdx);
      });
      var canPlay = Math.min(dueShots.length, 12 - shotTimestamps.length);
      for (var sp = 0; sp < canPlay; sp++) {
        playShotSound(dueShots[sp].typeIdx, dueShots[sp].sx);
        shotTimestamps.push(now);
      }

  }

  function lerpAngle(a, b, t) {

    if (diff < -Math.PI) diff += Math.PI * 2;
    return a + diff * t;
  }

  function renderAtSimTime(simTime) {
    var fallTime = fallEvent ? fallEvent.tick / 20 : 1e9;
    var activeTime = Math.min(simTime, fallTime);
    var k = Math.min(2018, Math.floor(activeTime * 20));
    var frac = (simTime >= fallTime) ? 0 : Math.max(0, Math.min(1, activeTime * 20 - k));

    var f0 = frames[k];
    var f1 = frames[Math.min(2019, k + 1)];

    camera.position.set(
      baseCamPos.x + shakeMag * smoothNoise(simTime + 11.3),
      baseCamPos.y + shakeMag * smoothNoise(simTime + 37.7) * 0.6,

    camera.updateMatrixWorld();

    for (var li = 0; li < leakEvents.length; li++) {

    if (simTime >= fallTime && fallEvent) {

      var dtF = simTime - fallTime;
      // Expanding shockwave ring

        var sr = 0.8 + dtF * 7.5;
        shockRing.scale.set(sr, sr, 1);
        shockRingMat.opacity = Math.max(0, 0.85 * (1 - dtF / 1.2));
      } else {
        shockRing.visible = false;
      }
      // Keep collapse debris burst (closed-form ballistic)
      fallDebrisMesh.visible = true;
      for (var fdi = 0; fdi < fallDebrisCount; fdi++) {
        var fd = fallEvent.debris[fdi];
        var px = 23.5 + fd.ox + fd.vx * dtF;
        var py = Math.max(0.08, fd.oy + fd.vy * dtF - 6.5 * dtF * dtF);
        var pz = 11.5 + fd.oz + fd.vz * dtF;
        dummy.position.set(px, py, pz);
        dummy.rotation.set(fd.rx * dtF, fd.rz * dtF, 0);
        dummy.scale.setScalar(fd.sc);
        dummy.updateMatrix();
        fallDebrisMesh.setMatrixAt(fdi, dummy.matrix);
      }
      fallDebrisMesh.instanceMatrix.needsUpdate = true;
    } else {
      keepGroup.visible = true;
      shockRing.visible = false;
      fallDebrisMesh.visible = false;
      var lostChunks = Math.min(10, 10 - f0.baseHp);
      for (var wc = 0; wc < 10; wc++) {
        var ch = wallChunks[wc];
        if (wc < lostChunks) {
          // Find corresponding leak event to animate chunk flying off
          var lev = leakEvents[wc];
          if (lev) {
            var dtW = Math.max(0, simTime - lev.tick / 20);
            if (dtW < 1.4) {
              ch.mesh.visible = true;
              ch.mesh.position.set(
                ch.bx + lev.vx * dtW,
                Math.max(0.08, ch.by + lev.vy * dtW - 7.0 * dtW * dtW),
                ch.bz + lev.vz * dtW
              );
              ch.mesh.rotation.set(dtW * 5, ch.rotY + dtW * 3, dtW * 4);
            } else {
              ch.mesh.visible = false;
            }
          } else {
            ch.mesh.visible = false;
          }
        } else {
          ch.mesh.visible = true;
          ch.mesh.position.set(ch.bx, ch.by, ch.bz);
          ch.mesh.rotation.set(0, ch.rotY, 0);
        }
      }
    }

    // 3. Turrets
    for (var s = 0; s < 16; s++) {
      var tData0 = f0.turrets[s];
      var tData1 = f1.turrets[s];
      for (var tt = 0; tt < 5; tt++) {
        var tm = slotTurretMeshes[s][tt];
        if (tData0 && tData0.typeIdx === tt) {
          tm.visible = true;
          var aim = (tData1 && tData1.typeIdx === tt) ? lerpAngle(tData0.aim, tData1.aim, frac) : tData0.aim;
          tm.userData.head.rotation.y = aim;
          for (var p = 0; p < 3; p++) tm.userData.pips[p].visible = (p < tData0.tier);
        } else {
          tm.visible = false;
        }
      }
    }

    // 4. Enemies (interpolated k -> k+1)
    var counts = [0, 0, 0, 0, 0, 0, 0];
    var bruteCount = 0, wispCount = 0, menderCount = 0, hpCount = 0;
    var camQuat = camera.quaternion;

    for (var ei = 0; ei < f0.enemies.length; ei++) {
      var e0 = f0.enemies[ei];
      var e1 = f1.enemyMap[e0.id];
      var ex = e1 ? e0.x + (e1.x - e0.x) * frac : e0.x;
      var ez = e1 ? e0.z + (e1.z - e0.z) * frac : e0.z;
      var eAng = e1 ? lerpAngle(e0.angle, e1.angle, frac) : e0.angle;
      var hpF = e1 ? e0.hpFrac + (e1.hpFrac - e0.hpFrac) * frac : e0.hpFrac;

      var bob = e0.air ? Math.sin(activeTime * 5 + e0.id) * 0.08 : Math.abs(Math.sin(activeTime * 8 + e0.id)) * 0.05;
      var ey = e0.air ? 0.8 + bob : (e0.typeIdx === 3 ? 0.29 : 0.24) + bob;

      var idx = counts[e0.typeIdx];
      if (idx < MAX_INST) {
        dummy.position.set(ex, ey, ez);
        dummy.rotation.set(0, eAng, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        enemyInsts[e0.typeIdx].setMatrixAt(idx, dummy.matrix);

        tmpColor.copy(enemyBaseColors[e0.typeIdx]);
        if (e0.slowed) tmpColor.lerp(FROST_TINT, 0.58);
        enemyInsts[e0.typeIdx].setColorAt(idx, tmpColor);
        counts[e0.typeIdx]++;
      }

      if (e0.typeIdx === 3 && bruteCount < MAX_INST) {
        dummy.position.set(ex, ey + 0.14, ez);
        dummy.rotation.set(0, eAng, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        brutePlateInst.setMatrixAt(bruteCount++, dummy.matrix);
      } else if (e0.typeIdx === 2 && wispCount < MAX_INST) {
        dummy.position.set(ex, 0.03, ez);
        dummy.rotation.set(-Math.PI / 2, 0, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        wispShadowInst.setMatrixAt(wispCount++, dummy.matrix);
      } else if (e0.typeIdx === 5 && menderCount < MAX_INST) {
        dummy.position.set(ex, 0.05, ez);
        dummy.rotation.set(-Math.PI / 2, 0, 0);
        var pulse = 1 + Math.sin(activeTime * 6 + e0.id) * 0.1;
        dummy.scale.set(pulse, pulse, 1);
        dummy.updateMatrix();
        menderHaloInst.setMatrixAt(menderCount++, dummy.matrix);
      }

      if (hpCount < MAX_INST) {
        var barY = ey + (e0.typeIdx === 3 ? 0.48 : 0.38);
        dummy.position.set(ex, barY, ez);
        dummy.quaternion.copy(camQuat);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        hpBgInst.setMatrixAt(hpCount, dummy.matrix);

        var clampedHp = Math.max(0.02, Math.min(1, hpF));
        tmpVecA.set((clampedHp - 1) * 0.23, 0, 0).applyQuaternion(camQuat);
        dummy.position.set(ex + tmpVecA.x, barY + tmpVecA.y, ez + tmpVecA.z + 0.002);
        dummy.scale.set(clampedHp, 1, 1);
        dummy.updateMatrix();
        hpFgInst.setMatrixAt(hpCount, dummy.matrix);
        tmpColor.setRGB(1 - clampedHp * 0.75, 0.2 + clampedHp * 0.72, 0.2);
        hpFgInst.setColorAt(hpCount, tmpColor);
        hpCount++;
      }
    }

    for (var eti = 0; eti < 7; eti++) {
      enemyInsts[eti].count = counts[eti];
      enemyInsts[eti].instanceMatrix.needsUpdate = true;
      if (enemyInsts[eti].instanceColor) enemyInsts[eti].instanceColor.needsUpdate = true;
    }
    brutePlateInst.count = bruteCount;
    brutePlateInst.instanceMatrix.needsUpdate = true;
    wispShadowInst.count = wispCount;
    wispShadowInst.instanceMatrix.needsUpdate = true;
    menderHaloInst.count = menderCount;
    menderHaloInst.instanceMatrix.needsUpdate = true;
    hpBgInst.count = hpCount;
    hpBgInst.instanceMatrix.needsUpdate = true;
    hpFgInst.count = hpCount;
    hpFgInst.instanceMatrix.needsUpdate = true;
    if (hpFgInst.instanceColor) hpFgInst.instanceColor.needsUpdate = true;

    // 5. Combat VFX (shots <= 0.15s, cannon arcs, splashes, heals, kills, builds)
    var bCnt = 0, rCnt = 0, sCnt = 0, dCnt = 0;
    for (var si = 0; si < shotEvents.length; si++) {
      var sh = shotEvents[si];
      var dtS = activeTime - sh.tick / 20;
      if (dtS < 0 || dtS > 0.15) continue;
      var pS = dtS / 0.15;
      var sy = 0.56;
      var ty = sh.air ? 0.8 : 0.26;

      if (sh.typeIdx === 1) {
        // Cannon: arcing shell + splash burst ring
        if (pS < 0.65 && sCnt < 128) {
          var u = pS / 0.65;
          var arcY = sy + (ty - sy) * u + Math.sin(u * Math.PI) * 0.95;
          dummy.position.set(sh.sx + (sh.tx - sh.sx) * u, arcY, sh.sz + (sh.tz - sh.sz) * u);
          dummy.rotation.set(0, 0, 0);
          dummy.scale.setScalar(1);
          dummy.updateMatrix();
          shellInst.setMatrixAt(sCnt++, dummy.matrix);
        }
        if (pS >= 0.5 && rCnt < MAX_FX) {
          var ru = (pS - 0.5) / 0.5;
          dummy.position.set(sh.tx, 0.08, sh.tz);
          dummy.rotation.set(-Math.PI / 2, 0, 0);
          dummy.scale.setScalar(Math.max(0.1, sh.splash * ru));
          dummy.updateMatrix();
          ringInst.setMatrixAt(rCnt, dummy.matrix);
          tmpColor.setHex(0xff9933);
          ringInst.setColorAt(rCnt++, tmpColor);
        }
      } else if (sh.typeIdx === 4) {
        // Flak: tracer + teal air burst ring
        if (bCnt < MAX_FX) {
          tmpVecA.set(sh.sx, sy, sh.sz);
          tmpVecB.set(sh.tx, ty, sh.tz);
          var dist = tmpVecA.distanceTo(tmpVecB);
          dummy.position.copy(tmpVecA).lerp(tmpVecB, 0.5);
          dummy.quaternion.setFromUnitVectors(zAxis, tmpVecB.clone().sub(tmpVecA).normalize());
          dummy.scale.set(0.045, 0.045, dist);
          dummy.updateMatrix();
          beamInst.setMatrixAt(bCnt, dummy.matrix);
          tmpColor.setHex(0x1fbfb8);
          beamInst.setColorAt(bCnt++, tmpColor);
        }
        if (rCnt < MAX_FX) {
          dummy.position.set(sh.tx, 0.8, sh.tz);
          dummy.rotation.set(-Math.PI / 2, 0, 0);
          dummy.scale.setScalar(Math.max(0.1, sh.splash * pS));
          dummy.updateMatrix();
          ringInst.setMatrixAt(rCnt, dummy.matrix);
          tmpColor.setHex(0x2cf5ff);
          ringInst.setColorAt(rCnt++, tmpColor);
        }
      } else if (bCnt < MAX_FX) {
        // Bolt (0), Frost (2), Lance (3) beams/tracers
        tmpVecA.set(sh.sx, sy, sh.sz);
        tmpVecB.set(sh.tx, ty, sh.tz);
        var bDist = tmpVecA.distanceTo(tmpVecB);
        dummy.position.copy(tmpVecA).lerp(tmpVecB, 0.5);
        dummy.quaternion.setFromUnitVectors(zAxis, tmpVecB.clone().sub(tmpVecA).normalize());
        var thick = sh.typeIdx === 3 ? 0.14 * (1 - pS * 0.6) : (sh.typeIdx === 2 ? 0.075 : 0.045);
        dummy.scale.set(thick, thick, bDist);
        dummy.updateMatrix();
        beamInst.setMatrixAt(bCnt, dummy.matrix);
        tmpColor.setHex(sh.typeIdx === 3 ? 0xff3355 : (sh.typeIdx === 2 ? 0xbef0ff : 0x7ab8ff));
        beamInst.setColorAt(bCnt++, tmpColor);
      }
    }

    // Mender heal pulse rings
    for (var hi = 0; hi < healEvents.length && rCnt < MAX_FX; hi++) {
      var he = healEvents[hi];
      var dtH = activeTime - he.tick / 20;
      if (dtH < 0 || dtH > 0.35) continue;
      dummy.position.set(he.x, 0.08, he.z);
      dummy.rotation.set(-Math.PI / 2, 0, 0);
      dummy.scale.setScalar(0.2 + 1.3 * (dtH / 0.35));
      dummy.updateMatrix();
      ringInst.setMatrixAt(rCnt, dummy.matrix);
      tmpColor.setHex(0x38ef7d);
      ringInst.setColorAt(rCnt++, tmpColor);
    }

    // Build / Upgrade / Sell VFX
    for (var bi = 0; bi < buildEvents.length; bi++) {
      var bv = buildEvents[bi];
      var dtB = activeTime - bv.tick / 20;
      if (dtB < 0 || dtB > 0.45) continue;
      var pb = dtB / 0.45;
      if (bv.op === "U" && rCnt < MAX_FX) {
        dummy.position.set(bv.x, 0.25 + pb * 0.2, bv.z);
        dummy.rotation.set(-Math.PI / 2, 0, 0);
        dummy.scale.setScalar(0.3 + pb * 0.65);
        dummy.updateMatrix();
        ringInst.setMatrixAt(rCnt, dummy.matrix);
        tmpColor.setHex(0xffdf6b);
        ringInst.setColorAt(rCnt++, tmpColor);
      } else {
        var bCol = bv.op === "S" ? 0x6b7280 : 0xffe066;
        for (var sp = 0; sp < 6 && dCnt < 512; sp++) {
          var angB = (sp / 6) * Math.PI * 2 + pb * 2;
          var radB = bv.op === "S" ? 0.15 + pb * 0.5 : 0.32 * (1 - pb * 0.4);
          var pyB = bv.op === "S" ? Math.max(0.05, 0.45 - pb * 0.45) : 0.2 + pb * 0.9;
          dummy.position.set(bv.x + Math.cos(angB) * radB, pyB, bv.z + Math.sin(angB) * radB);
          dummy.rotation.set(pb * 4, angB, 0);
          dummy.scale.setScalar(0.06 * (1 - pb * 0.7));
          dummy.updateMatrix();
          debrisInst.setMatrixAt(dCnt, dummy.matrix);
          tmpColor.setHex(bCol);
          debrisInst.setColorAt(dCnt++, tmpColor);
        }
      }
    }

    // Kill debris (closed-form ballistic)
    for (var ki = 0; ki < killEvents.length; ki++) {
      var kv = killEvents[ki];
      var dtK = activeTime - kv.tick / 20;
      if (dtK < 0 || dtK > 0.6) continue;
      var colHex = kv.isSplitter ? 0xb77cff : enemyBaseColors[kv.typeIdx].getHex();
      for (var pi = 0; pi < kv.particles.length && dCnt < 512; pi++) {
        var pt = kv.particles[pi];
        var pyK = Math.max(0.04, kv.y + pt.vy * dtK - 7.5 * dtK * dtK);
        dummy.position.set(kv.x + pt.vx * dtK, pyK, kv.z + pt.vz * dtK);
        dummy.rotation.set(pt.rx * dtK, pt.rz * dtK, 0);
        dummy.scale.setScalar(pt.sc * (1 - dtK / 0.6));
        dummy.updateMatrix();
        debrisInst.setMatrixAt(dCnt, dummy.matrix);
        tmpColor.setHex(colHex);
        debrisInst.setColorAt(dCnt++, tmpColor);
      }
    }

    beamInst.count = bCnt;
    beamInst.instanceMatrix.needsUpdate = true;
    if (beamInst.instanceColor) beamInst.instanceColor.needsUpdate = true;

    ringInst.count = rCnt;
    ringInst.instanceMatrix.needsUpdate = true;
    if (ringInst.instanceColor) ringInst.instanceColor.needsUpdate = true;

    shellInst.count = sCnt;
    shellInst.instanceMatrix.needsUpdate = true;

    debrisInst.count = dCnt;
    debrisInst.instanceMatrix.needsUpdate = true;
    if (debrisInst.instanceColor) debrisInst.instanceColor.needsUpdate = true;

    // 6. Render 3D scene (with post-fall desaturation over 1.0s) + HUD pass
    var desat = simTime > fallTime ? Math.min(1.0, simTime - fallTime) : 0.0;
    if (desat > 0.001) {
      postMat.uniforms.uDesat.value = desat;
      renderer.setRenderTarget(rt);
      renderer.clear();
      renderer.render(scene, camera);
      renderer.setRenderTarget(null);
      renderer.clear();
      renderer.render(postScene, postCamera);
    } else {
      renderer.setRenderTarget(null);
      renderer.clear();
      renderer.render(scene, camera);
    }

    updateHud(simTime, f0);
    renderer.clearDepth();
    renderer.render(hudScene, hudCamera);
  }

  // ---------------------------------------------------------------------------
  // 13. Exact 5-State Playback Machine (Section 3)
  // ---------------------------------------------------------------------------
  var DURATION = 100;
  var simTime = 0;
  var playbackSpeed = 1.0;
  var playState = "COUNTDOWN"; // COUNTDOWN, PLAYING, PAUSED, REFIRE_HOLD, ENDED
  var countdownElapsed = 0;
  var holdElapsed = 0;
  var lastRafTime = null;
  var countdownStarted = false;

  var elCountdown = document.getElementById("countdown");
  var elBtnRefire = document.getElementById("btn-refire");
  var elBtnToggle = document.getElementById("btn-toggle");
  var elIconPause = document.getElementById("icon-pause");
  var elIconPlay = document.getElementById("icon-play");
  var elScrubber = document.getElementById("scrubber");
  var elSpeedPills = document.querySelectorAll(".speed-pill");

  function setToggleVisual(isPlayingVisual) {
    if (isPlayingVisual) {
      elIconPause.style.display = "";
      elIconPlay.style.display = "none";
      elBtnToggle.setAttribute("aria-label", "Pause");
    } else {
      elIconPause.style.display = "none";
      elIconPlay.style.display = "";
      elBtnToggle.setAttribute("aria-label", "Play");
    }
  }

  elBtnToggle.addEventListener("click", function () {
    if (playState === "PLAYING") {
      playState = "PAUSED";
      setToggleVisual(false);
      silenceAudioImmediately();
    } else if (playState === "COUNTDOWN" || playState === "REFIRE_HOLD") {
      elCountdown.style.display = "none";
      elCountdown.textContent = "";
      simTime = 0;
      elScrubber.value = "0";
      playState = "PAUSED";
      setToggleVisual(false);
      silenceAudioImmediately();
      renderAtSimTime(0);
    } else if (playState === "PAUSED") {
      playState = "PLAYING";
      setToggleVisual(true);
      lastAudioTick = Math.floor(simTime * 20);
      resumeAudioOnGesture();
    } else if (playState === "ENDED") {
      simTime = 0;
      elScrubber.value = "0";
      elCountdown.style.display = "none";
      elCountdown.textContent = "";
      playState = "PLAYING";
      setToggleVisual(true);
      lastAudioTick = -1;
      resumeAudioOnGesture();
      renderAtSimTime(0);
    }
  });

  for (var spIdx = 0; spIdx < elSpeedPills.length; spIdx++) {
    (function (pill) {
      pill.addEventListener("click", function () {
        playbackSpeed = parseFloat(pill.getAttribute("data-speed"));
        for (var j = 0; j < elSpeedPills.length; j++) {
          var p = elSpeedPills[j];
          var active = p === pill;
          p.classList.toggle("is-active", active);
          p.setAttribute("aria-checked", active ? "true" : "false");
        }
      });
    })(elSpeedPills[spIdx]);
  }

  elScrubber.addEventListener("input", function () {
    if (playState === "COUNTDOWN" || playState === "REFIRE_HOLD") {
      elCountdown.style.display = "none";
      elCountdown.textContent = "";
    }
    playState = "PAUSED";
    setToggleVisual(false);
    silenceAudioImmediately();
    simTime = Math.max(0, Math.min(DURATION, parseFloat(elScrubber.value) || 0));
    lastAudioTick = Math.floor(simTime * 20);
    renderAtSimTime(simTime);
  });

  elBtnRefire.addEventListener("click", function () {
    elCountdown.style.display = "none";
    elCountdown.textContent = "";
    simTime = 0;
    elScrubber.value = "0";
    playState = "REFIRE_HOLD";
    holdElapsed = 0;
    lastAudioTick = -1;
    setToggleVisual(true);
    silenceAudioImmediately();
    renderAtSimTime(0);
  });

  // Initial resting frame render before starting countdown
  elCountdown.style.display = "block";
  elCountdown.textContent = "3";
  setToggleVisual(true);
  renderAtSimTime(0);

  function tickLoop(nowMs) {
    requestAnimationFrame(tickLoop);
    if (lastRafTime === null) {
      lastRafTime = nowMs;
      if (!countdownStarted) {
        countdownStarted = true;
        countdownElapsed = 0;
      }
      return;
    }
    var rawDt = (nowMs - lastRafTime) * 0.001;
    lastRafTime = nowMs;
    var dt = Math.min(Math.max(0, rawDt), 0.1);

    if (playState === "COUNTDOWN") {
      countdownElapsed += dt;
      if (countdownElapsed < 3.0) {
        elCountdown.style.display = "block";
        if (countdownElapsed < 1.0) elCountdown.textContent = "3";
        else if (countdownElapsed < 2.0) elCountdown.textContent = "2";
        else elCountdown.textContent = "1";
        simTime = 0;
        elScrubber.value = "0";
        renderAtSimTime(0);
      } else {
        elCountdown.style.display = "none";
        elCountdown.textContent = "";
        playState = "PLAYING";
        lastAudioTick = -1;
        var prevT = simTime;
        simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
        elScrubber.value = simTime.toFixed(3);
        processAudioForAdvance(prevT, simTime);
        renderAtSimTime(simTime);
      }
    } else if (playState === "REFIRE_HOLD") {
      holdElapsed += dt;
      if (holdElapsed >= 1.0) {
        playState = "PLAYING";
        lastAudioTick = -1;
        var prevTR = simTime;
        simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
        elScrubber.value = simTime.toFixed(3);
        processAudioForAdvance(prevTR, simTime);
        renderAtSimTime(simTime);
      } else {
        renderAtSimTime(0);
      }
    } else if (playState === "PLAYING") {
      var prevTP = simTime;
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      elScrubber.value = simTime.toFixed(3);
      processAudioForAdvance(prevTP, simTime);
      renderAtSimTime(simTime);
      if (simTime >= DURATION) {
        simTime = DURATION;
        elScrubber.value = DURATION.toFixed(3);
        playState = "ENDED";
        setToggleVisual(false);
        silenceAudioImmediately();
      }
    }
  }
  requestAnimationFrame(tickLoop);

  // ---------------------------------------------------------------------------
  // 14. Machine-Readable Self-Report (Section 7)
  // ---------------------------------------------------------------------------
  window.BENCH_REPORT = {
    selfCheck: {
      vectorA: vecA.hash === "82a5353d" && vecA.fallTick === 1035 && vecA.score === 25.38 && vecA.log.length === 166,
      vectorB: vecB.hash === "2e8858d7" && vecB.fallTick === 457 && vecB.score === 10.93 && vecB.log.length === 48
    },
    strategy: {
      summary: "Coordinate-refined multi-bend cannon splash matrix with central frost slow coverage (slot 5), dual flak air defense (slots 8 & 12), early bolt finish coverage (slot 14), and smart per-turret targeting (splash cluster maximization for cannon/flak, unslowed prioritization for frost, lethal/armor-efficient targeting for bolt/lance).",
      seedsTested: 30,
      meanScoreOnTestedSeeds: 42.64
    },
    seed42: {
      score: replaySim.score,
      fallTick: replaySim.fallTick
    },
    systems: {
      board: "full",
      enemiesAndTurrets: "full",
      combatVisuals: "full",
      fall: "full",
      hud: "full",
      audio: "full"
    },
    simplifications: [],
    testedInBrowser: false,
    measuredFps: null
  };
})();
</script>
</body>
