}
function resetAudioCursor() { audioTick = Math.min(Math.floor(simTime * TPS), NS - 1); }
function enterState(s) {
  state = s;
  if (s === 'PLAYING') { resetAudioCursor(); } else { setAudible(false); }
}
pills.forEach(function (p) {
  p.addEventListener('click', function () {
    speed = parseFloat(p.getAttribute('data-speed'));
    pills.forEach(function (q) { const on = q === p; q.classList.toggle('is-active', on); q.setAttribute('aria-checked', on ? 'true' : 'false'); });
  });
});
btnT.addEventListener('click', function () {
  resumeAudio();
  if (state === 'PLAYING') { enterState('PAUSED'); setIcons(false); }
  else if (state === 'COUNTDOWN' || state === 'REFIRE_HOLD') { hideCount(); simTime = 0; scrub.value = '0'; enterState('PAUSED'); setIcons(false); renderFrame(simTime); }
  else if (state === 'PAUSED') { enterState('PLAYING'); setIcons(true); }
  else if (state === 'ENDED') { simTime = 0; scrub.value = '0'; hideCount(); enterState('PLAYING'); setIcons(true); }
});
btnR.addEventListener('click', function () {
  resumeAudio();
  hideCount(); simTime = 0; scrub.value = '0'; holdElapsed = 0;
  setIcons(true); enterState('REFIRE_HOLD'); renderFrame(0);
});
scrub.addEventListener('input', function () {
  hideCount();
  simTime = clamp(parseFloat(scrub.value) || 0, 0, DURATION);
  enterState('PAUSED'); setIcons(false);
  renderFrame(simTime);
});
function frame(ts) {
  requestAnimationFrame(frame);
  const raw = lastTs === null ? 0 : (ts - lastTs) / 1000; lastTs = ts;
  const dt = Math.min(Math.max(raw, 0), 0.1);
  if (state === 'COUNTDOWN') {
    if (!cdStarted) { cdStarted = true; cdElapsed = 0; } else cdElapsed += dt;
    if (cdElapsed >= 3.0) { hideCount(); enterState('PLAYING'); setIcons(true); }
    else showCount(cdElapsed < 1 ? '3' : (cdElapsed < 2 ? '2' : '1'));
  } else if (state === 'REFIRE_HOLD') {
    holdElapsed += dt;
    if (holdElapsed >= 1.0) { enterState('PLAYING'); }
  } else if (state === 'PLAYING') {
    simTime = Math.min(DURATION, simTime + dt * speed);
    scrub.value = simTime.toFixed(3);
    if (simTime >= DURATION) {
      simTime = DURATION; scrub.value = DURATION.toFixed(3);
      renderFrame(simTime);
      enterState('ENDED'); setIcons(false);
      return;
    }
  }
  if (state === 'PLAYING' && actx) {
    setAudible(true);
    audioAdvance(simTime);
    const windOn = simTime >= T_FALL + 1.5;
    windGain.gain.setTargetAtTime(windOn ? 0.12 : 0, actx.currentTime, 0.4);
  }
  renderFrame(simTime);
}
resize();
renderFrame(0);
/*TESTHOOK*/
requestAnimationFrame(frame);
})();
</script>
