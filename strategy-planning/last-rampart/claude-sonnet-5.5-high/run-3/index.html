<!DOCTYPE html>

<style>

  box-sizing: border-box;
}
html, body {

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script id="rampart-strategy">
function createStrategy() {
  // Build order found by offline search (simulated annealing over a purchase list scored on many
  // seeds), executed strictly in order each wave start with whatever gold is available.
  // Step: [op, slot, type]  op: 0 build, 1 upgrade, 2 sell
  var STEPS = [
    [0,3,"flak"],[0,14,"bolt"],[0,8,"cannon"],[0,7,"cannon"],[1,7],[1,8],[1,7],[0,2,"flak"],
    [0,6,"cannon"],[1,3],[0,4,"cannon"],[1,3],[0,15,"frost"],[1,4],[0,10,"cannon"],[1,14],
    [0,5,"cannon"],[0,1,"flak"],[0,0,"flak"],[1,4],[1,6],[1,8],[0,11,"cannon"],[1,5],
    [0,13,"cannon"],[0,12,"cannon"],[1,0],[1,14],[1,6],[1,12],[0,9,"cannon"],[1,5],
    [1,2],[1,9],[1,0],[1,2],[1,12],[1,11],[1,9],[1,13],
    [1,11],[1,10],[1,13],[1,10]
  ];
  // Targeting mode per turret type (bolt, cannon, frost, lance, flak):
  // 0 default (closest to the base), 1 highest hp, 2 lowest hp, 3 densest cluster, 4 un-slowed first, 5 furthest back, 7 highest max hp
  var TM = [2,3,4,3,3];
  var COST = { bolt: 50, cannon: 90, frost: 70, lance: 120, flak: 80 };
  var TYPES = ['bolt', 'cannon', 'frost', 'lance', 'flak'];
  var ptr = 0;

  function plan(state) {
    var gold = state.gold, acts = [];
    var tier = [], type = [], spent = [], i;
    for (i = 0; i < 16; i++) {
      var t = state.slots[i].turret;
      tier.push(t ? t.tier : 0); type.push(t ? t.type : null); spent.push(t ? t.spent : 0);
    }
    while (ptr < STEPS.length && acts.length < 32) {
      var st = STEPS[ptr], s = st[1];
      if (st[0] === 0) {
        if (tier[s]) { ptr++; continue; }
        var c = COST[st[2]]; if (gold < c) break;
        gold -= c; tier[s] = 1; type[s] = st[2]; spent[s] = c; acts.push({ op: 'build', slot: s, type: st[2] }); ptr++;
      } else if (st[0] === 1) {
        if (!tier[s] || tier[s] >= 3) { ptr++; continue; }
        var uc = COST[type[s]] * (tier[s] === 1 ? 1 : 2); if (gold < uc) break;
        gold -= uc; spent[s] += uc; tier[s]++; acts.push({ op: 'upgrade', slot: s }); ptr++;
      } else {
        if (!tier[s]) { ptr++; continue; }
        gold += Math.floor(spent[s] * 70 / 100); tier[s] = 0; type[s] = null; spent[s] = 0; acts.push({ op: 'sell', slot: s }); ptr++;
      }
    }
    return acts;
  }

  function target(turret, cands) {
    var mode = TM[TYPES.indexOf(turret.type)], best = null, bs = -Infinity, i, j, c, d, n, sc;
    if (!mode) return -1;
    for (i = 0; i < cands.length; i++) {
      c = cands[i];
      if (mode === 1) sc = c.hp;
      else if (mode === 2) sc = -c.hp;
      else if (mode === 3) {
        n = 0;
        for (j = 0; j < cands.length; j++) { d = cands[j]; var dx = c.x - d.x, dy = c.y - d.y; if (dx * dx + dy * dy <= 8100) n++; }
        sc = n * 1e6 - c.remaining;
      }
      else if (mode === 4) sc = (c.slowed ? 0 : 1e6) - c.remaining;
      else if (mode === 5) sc = c.remaining;
      else if (mode === 7) sc = c.maxHp;
      else return -1;
      if (sc > bs) { bs = sc; best = c; }
    }
    return best ? best.id : -1;
  }
  return { plan: plan, target: target };
}
</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks, hooks) {
  function mulberry32(a) { return function () {
    a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return (t ^ (t >>> 14)) >>> 0; }; }
  const GROUND_PTS = [[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]];
  const AIR_PTS = [[0,6],[21,6],[21,11],[23,11]];
  function buildRoute(pts) {
    const xs = [], ys = [];
    for (let i = 0; i + 1 < pts.length; i++) {
      const ax = pts[i][0] * 100 + 50, ay = pts[i][1] * 100 + 50;
      const bx = pts[i + 1][0] * 100 + 50, by = pts[i + 1][1] * 100 + 50;
      const len = Math.abs(bx - ax) + Math.abs(by - ay);
      const sx = Math.sign(bx - ax), sy = Math.sign(by - ay);
      for (let d = 0; d < len; d++) { xs.push(ax + sx * d); ys.push(ay + sy * d); }
    }
    const last = pts[pts.length - 1];
    xs.push(last[0] * 100 + 50); ys.push(last[1] * 100 + 50);
    return { xs, ys, len: xs.length - 1 };
  }
  const ROUTES = [buildRoute(GROUND_PTS), buildRoute(AIR_PTS)];
  const SLOT_TILES = [[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],[14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]];
  const TNAMES = ['bolt', 'cannon', 'frost', 'lance', 'flak'];
  const TS = {
    bolt:   { idx: 0, cost: 50,  dmg: 26,  per: 8,  rng: 300, spl: 0,  slow: 0,  pierce: 0, ground: 1, air: 1 },
    cannon: { idx: 1, cost: 90,  dmg: 60,  per: 24, rng: 260, spl: 90, slow: 0,  pierce: 0, ground: 1, air: 0 },
    frost:  { idx: 2, cost: 70,  dmg: 10,  per: 12, rng: 240, spl: 0,  slow: 30, pierce: 0, ground: 1, air: 1 },
    lance:  { idx: 3, cost: 120, dmg: 180, per: 36, rng: 360, spl: 0,  slow: 0,  pierce: 1, ground: 1, air: 0 },
    flak:   { idx: 4, cost: 80,  dmg: 40,  per: 10, rng: 320, spl: 70, slow: 0,  pierce: 0, ground: 0, air: 1 }
  };
  const ENAMES = ['grunt', 'runner', 'wisp', 'brute', 'splitter', 'mender'];
  const ES = {
    grunt:     { hp: 60,  spd: 10, bounty: 4, leak: 1, air: 0, first: 1, weight: 10 },
    runner:    { hp: 40,  spd: 20, bounty: 4, leak: 1, air: 0, first: 2, weight: 4 },
    wisp:      { hp: 50,  spd: 12, bounty: 6, leak: 2, air: 1, first: 3, weight: 3 },
    brute:     { hp: 150, spd: 6,  bounty: 9, leak: 3, air: 0, first: 4, weight: 3 },
    splitter:  { hp: 90,  spd: 8,  bounty: 6, leak: 2, air: 0, first: 6, weight: 2 },
    mender:    { hp: 70,  spd: 8,  bounty: 7, leak: 2, air: 0, first: 8, weight: 1 },
    splitling: { hp: 0,   spd: 12, bounty: 1, leak: 1, air: 0, first: 99, weight: 0 }
  };
  const rng = mulberry32(seed >>> 0);
  const mult = [0, 1000];
  function mOf(w) { while (mult.length <= w) mult.push(Math.floor(mult[mult.length - 1] * 108 / 100)); return mult[w]; }
  const comps = [null];
  function genWave(w) {
    const types = ENAMES.filter(n => ES[n].first <= w);
    let total = 0; for (const n of types) total += ES[n].weight;
    const cnt = 4 + Math.floor(3 * w / 5), out = [];
    for (let i = 0; i < cnt; i++) {
      let r = rng() % total, k = 0;
      while (r >= ES[types[k]].weight) { r -= ES[types[k]].weight; k++; }
      out.push(types[k]);
    }
    comps[w] = out;
  }
  const strat = createStrategy();
  const log = [];
  let gold = 250, baseHp = 10, nextId = 1, fallTick = -1, curWave = 0;
  let enemies = [];
  const turrets = new Array(16).fill(null);
  const spawnAt = new Map();
  function tstat(t) {
    const s = TS[t.type]; let dmg = s.dmg;
    for (let i = 1; i < t.tier; i++) dmg = Math.floor(dmg * 16 / 10);
    return { dmg, rng: s.rng + 30 * (t.tier - 1) };
  }
  function armorOf(e) {
    if (e.type === 'grunt') return Math.floor(e.wave / 4);
    if (e.type === 'brute') return 6 + e.wave;
    return 0;
  }
  function effSpeed(e) { return e.slow > 0 ? Math.floor(e.spd * 60 / 100) : e.spd; }
  function view(e) {
    const r = ROUTES[e.air];
    return { id: e.id, type: e.type, hp: e.hp, maxHp: e.maxHp, x: r.xs[e.prog], y: r.ys[e.prog], air: e.air,
             armor: armorOf(e), speed: effSpeed(e), slowed: e.slow > 0 ? 1 : 0, remaining: r.len - e.prog };
  }
  function makeEnemy(type, wave, hp, prog) {
    const s = ES[type];
    return { id: nextId++, type, wave, hp, maxHp: hp, prog, age: 0, slow: 0, spd: s.spd, air: s.air, bounty: s.bounty, leak: s.leak };
  }
  genWave(1);
  let tick = 0;
  for (; tick < maxTicks; tick++) {
    // 1. wave start
    if (tick >= 20 && (tick - 20) % 40 === 0) {
      const w = (tick - 20) / 40 + 1; curWave = w;
      gold += Math.min(50, Math.floor(gold * 5 / 100)) + 10 + 2 * w;
      genWave(w + 1);
      const state = {
        tick, wave: w, gold, baseHp,
        slots: turrets.map((t, i) => ({ slot: i, x: SLOT_TILES[i][0], y: SLOT_TILES[i][1],
          turret: t ? { type: t.type, tier: t.tier, spent: t.spent } : null })),
        enemies: enemies.map(view),
        nextWave: comps[w + 1].slice()
      };
      let actions = strat.plan(state);
      if (!Array.isArray(actions)) actions = [];
      const n = Math.min(32, actions.length);
      for (let i = 0; i < n; i++) {
        const a = actions[i];
        if (!a || typeof a.slot !== 'number' || !(a.slot >= 0 && a.slot < 16) || a.slot !== Math.floor(a.slot)) continue;
        const sl = a.slot;
        if (a.op === 'build') {
          const s = TS[a.type];
          if (!s || !Object.prototype.hasOwnProperty.call(TS, a.type) || turrets[sl] || gold < s.cost) continue;
          gold -= s.cost; turrets[sl] = { type: a.type, tier: 1, spent: s.cost, cd: 0 };
          log.push([tick, 'B', sl, s.idx]); if (hooks && hooks.onBuild) hooks.onBuild(tick, sl, a.type, 1);
        } else if (a.op === 'upgrade') {
          const t = turrets[sl]; if (!t || t.tier >= 3) continue;
          const c = TS[t.type].cost * (t.tier === 1 ? 1 : 2);
          if (gold < c) continue;
          gold -= c; t.spent += c; t.tier++;
          log.push([tick, 'U', sl, t.tier]); if (hooks && hooks.onBuild) hooks.onBuild(tick, sl, t.type, t.tier);
        } else if (a.op === 'sell') {
          const t = turrets[sl]; if (!t) continue;
          gold += Math.floor(t.spent * 70 / 100); turrets[sl] = null;
          log.push([tick, 'S', sl, 0]); if (hooks && hooks.onSell) hooks.onSell(tick, sl, t.type, t.tier);
        }
      }
      // queue spawns
      const comp = comps[w];
      for (let i = 0; i < comp.length; i++) {
        const tk = tick + 4 * i;
        let q = spawnAt.get(tk); if (!q) { q = []; spawnAt.set(tk, q); }
        q.push([comp[i], w]);
      }
      if (hooks && hooks.onWave) hooks.onWave(tick, w, gold, comps[w + 1].slice());
    }
    // 2. spawn
    const q = spawnAt.get(tick);
    if (q) {
      for (const [type, w] of q) {
        const hp = Math.floor(ES[type].hp * mOf(w) / 1000);
        const e = makeEnemy(type, w, hp, 0); e.maxHp = hp; enemies.push(e);
      }
      spawnAt.delete(tick);
    }
    // 3. move
    let fell = false, anyLeak = false;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      e.prog += effSpeed(e);
      if (e.prog >= ROUTES[e.air].len) {
        baseHp -= e.leak; e.dead = 1; anyLeak = true;
        log.push([tick, 'L', e.id, baseHp]);
        if (hooks && hooks.onLeak) hooks.onLeak(tick, e, baseHp);
        if (baseHp <= 0) { fell = true; break; }
      }
    }
    if (fell) {
      log.push([tick, 'F', curWave, 0]); fallTick = tick;
      if (hooks && hooks.onFall) hooks.onFall(tick, curWave);
      break;
    }
    if (anyLeak) enemies = enemies.filter(e => !e.dead);
    // 4. age & heal
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i]; e.age++;
      if (e.type === 'mender' && e.age % 20 === 0) {
        const r = ROUTES[e.air], mx = r.xs[e.prog], my = r.ys[e.prog];
        for (const o of enemies) {
          const rr = ROUTES[o.air], dx = rr.xs[o.prog] - mx, dy = rr.ys[o.prog] - my;
          if (dx * dx + dy * dy <= 150 * 150) o.hp = Math.min(o.maxHp, o.hp + Math.floor(o.maxHp * 8 / 100));
        }
        if (hooks && hooks.onHeal) hooks.onHeal(tick, e);
      }
    }
    // 5. turrets fire
    for (let sl = 0; sl < 16; sl++) {
      const t = turrets[sl]; if (!t) continue;
      if (t.cd > 0) t.cd--;
      if (t.cd > 0) continue;
      const s = TS[t.type], st = tstat(t);
      const tx = SLOT_TILES[sl][0] * 100 + 50, ty = SLOT_TILES[sl][1] * 100 + 50;
      const r2 = st.rng * st.rng;
      const cands = [];
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (e.air ? !s.air : !s.ground) continue;
        const rr = ROUTES[e.air], dx = rr.xs[e.prog] - tx, dy = rr.ys[e.prog] - ty;
        if (dx * dx + dy * dy <= r2) cands.push(e);
      }
      if (!cands.length) continue;
      let tgt = null;
      if (typeof strat.target === 'function') {
        const id = strat.target({ slot: sl, type: t.type, tier: t.tier, x: tx, y: ty, range: st.rng }, cands.map(view));
        for (const c of cands) if (c.id === id) { tgt = c; break; }
      }
      if (!tgt) {
        let best = Infinity;
        for (const c of cands) { const rem = ROUTES[c.air].len - c.prog; if (rem < best) { best = rem; tgt = c; } }
      }
      const tr = ROUTES[tgt.air], px = tr.xs[tgt.prog], py = tr.ys[tgt.prog];
      const hitList = [];
      if (s.spl > 0) {
        const sr2 = s.spl * s.spl;
        for (const e of enemies) {
          if (e.hp <= 0) continue;
          if (e.air ? !s.air : !s.ground) continue;
          const rr = ROUTES[e.air], dx = rr.xs[e.prog] - px, dy = rr.ys[e.prog] - py;
          if (dx * dx + dy * dy <= sr2) hitList.push(e);
        }
      } else hitList.push(tgt);
      for (const e of hitList) {
        const d = s.pierce ? st.dmg : Math.max(1, st.dmg - armorOf(e));
        e.hp -= d;
        if (s.slow) e.slow = s.slow;
      }
      t.cd = s.per;
      if (hooks && hooks.onShot) hooks.onShot(tick, sl, t, tgt, px, py);
      // remove dead
      let dead = null;
      for (const e of enemies) if (e.hp <= 0) (dead || (dead = [])).push(e);
      if (dead) {
        const spawned = [];
        for (const e of dead) {
          gold += e.bounty;
          log.push([tick, 'K', e.id, sl]);
          if (hooks && hooks.onKill) hooks.onKill(tick, e, sl);
          if (e.type === 'splitter') {
            const hp = Math.max(1, Math.floor(e.maxHp / 4));
            for (let k = 0; k < 3; k++) { const sp = makeEnemy('splitling', e.wave, hp, e.prog); spawned.push(sp); }

const $ = function (id) { return document.getElementById(id); };

function showCountdown(txt) { elCountdown.style.display = 'block'; elCountdown.textContent = txt; }
