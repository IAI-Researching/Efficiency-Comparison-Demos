<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="100" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script id="rampart-strategy">
function createStrategy() {
  var G = {"steps":[[13,0,2],[1,1,3],[3,0,3],[12,0,3],[15,0,3],[4,1,3],[0,0,3],[11,4,1],[13,0,3],[6,1,3],[8,1,3],[5,4,3],[7,1,3],[10,0,3],[9,1,3],[2,4,3],[14,0,3],[11,4,3],[15,2,1],[1,2,1],[3,2,1],[0,2,1],[10,1,3],[2,4,1],[4,1,1],[0,4,3],[1,3,2],[7,3,2],[4,2,2],[2,2,2],[2,4,2],[3,4,3],[6,0,3],[13,3,2],[12,3,3],[7,1,3],[8,0,3],[14,0,2],[7,1,3],[15,4,1],[8,1,2],[9,4,1],[0,4,1],[14,2,2],[11,4,1],[15,4,1],[6,3,2],[14,1,3],[3,2,1],[3,2,1],[15,1,1],[3,3,2],[15,0,3],[3,2,3],[15,0,2],[10,0,2],[12,4,2],[11,2,2],[10,0,2],[1,3,3]],"tm":[6,11,0,8,5],"look":1};
  var TYPES = ['bolt', 'cannon', 'frost', 'lance', 'flak'];
  var COST = { bolt: 50, cannon: 90, frost: 70, lance: 120, flak: 80 };
  var DMG = { bolt: 26, cannon: 60, frost: 10, lance: 180, flak: 40 };
  var SPL = { bolt: 0, cannon: 90, frost: 0, lance: 0, flak: 70 };
  var TIDX = { bolt: 0, cannon: 1, frost: 2, lance: 3, flak: 4 };
  return {
    plan: function (state) {
      var acts = [], gold = state.gold, cur = [], i, s;
      for (i = 0; i < 16; i++) cur.push(state.slots[i].turret ? { type: state.slots[i].turret.type, tier: state.slots[i].turret.tier, spent: state.slots[i].turret.spent } : null);
      var look = G.look || 1, seen = 0;
      for (var k = 0; k < G.steps.length && acts.length < 30; k++) {
        s = G.steps[k];
        var slot = s[0], type = TYPES[s[1]], want = s[2], t = cur[slot];
        if (t && t.type === type && t.tier >= want) continue;
        seen++;
        if (seen > look) break;
        var base = COST[type];
        if (t && t.type !== type) {
          var refund = Math.floor(t.spent * 70 / 100);
          if (gold + refund < base) continue;
          gold += refund; acts.push({ op: 'sell', slot: slot }); cur[slot] = t = null;
        }
        if (!t) {
          if (gold < base) continue;
          gold -= base; acts.push({ op: 'build', slot: slot, type: type }); cur[slot] = t = { type: type, tier: 1, spent: base };
        }
        while (t.tier < want) {
          var c = base * (t.tier === 1 ? 1 : 2);
          if (gold < c) break;
          gold -= c; t.tier++; t.spent += c; acts.push({ op: 'upgrade', slot: slot });
        }
        if (t.tier < want) continue; // could not finish; counts as seen
        seen--; // completed: does not count against the look-ahead budget
      }
      return acts;
    },
    target: function (tur, c) {
      var mode = G.tm[TIDX[tur.type]];
      if (!mode || c.length < 2) return -1;
      var best = null, bs = -1e18, i, j, e, v;
      var tux = tur.x < 30 ? tur.x * 100 + 50 : tur.x, tuy = tur.y < 30 ? tur.y * 100 + 50 : tur.y; // tolerate tile or centi-tile units
      var dmg = DMG[tur.type];
      for (i = 0; i < tur.tier - 1; i++) dmg = Math.floor(dmg * 16 / 10);
      for (i = 0; i < c.length; i++) {
        e = c[i];
        switch (mode) {
          case 1: v = e.hp; break;
          case 2: v = -e.hp; break;
          case 3: v = e.armor * 100000 - e.remaining; break;
          case 4: v = -((e.x - tux) * (e.x - tux) + (e.y - tuy) * (e.y - tuy)); break;
          case 5:
            v = 0;
            for (j = 0; j < c.length; j++) { var dx = c[j].x - e.x, dy = c[j].y - e.y; if (dx * dx + dy * dy <= SPL[tur.type] * SPL[tur.type]) v += 1000; }
            v -= e.remaining / 10;
            break;
          case 6: v = (e.type === 'mender' ? 3e6 : e.type === 'splitter' ? 2e6 : 0) - e.remaining; break;
          case 7: v = (e.slowed > 0 ? 0 : 1e6) - e.remaining; break;
          case 8: v = e.remaining; break;
          case 9: { var dd = tur.type === 'lance' ? dmg : Math.max(1, dmg - e.armor); v = (e.hp <= dd ? 1e6 : 0) - e.remaining; break; }
          case 10: v = e.maxHp - e.remaining / 1000; break;
          case 11: { // expected damage over the splash zone around this enemy (hp-capped), tie-break: front-most
            var sr = SPL[tur.type], tot = 0;
            for (j = 0; j < c.length; j++) {
              var ex = c[j].x - e.x, ey = c[j].y - e.y;
              if (sr === 0 ? j === i : ex * ex + ey * ey <= sr * sr) { var d2 = tur.type === 'lance' ? dmg : Math.max(1, dmg - c[j].armor); tot += Math.min(d2, c[j].hp); }
            }
            v = tot * 1000 - e.remaining / 10; break;
          }
          default: v = 0;
        }
        if (v > bs) { bs = v; best = e; }
      }
      return best ? best.id : -1;
    }
  };
}

<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks) {
  'use strict';
  var rec = arguments.length > 3 ? arguments[3] : null; // optional replay recorder (never influences the rules)
  var W = 24, H = 14;
  var GROUND = [[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]];
  var AIR = [[0,6],[21,6],[21,11],[23,11]];
  var SLOTS = [[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],[14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]];
  function mkRoute(pts) {
    var segs = [], len = 0;
    for (var i = 0; i + 1 < pts.length; i++) {
      var x0 = pts[i][0] * 100 + 50, y0 = pts[i][1] * 100 + 50, x1 = pts[i + 1][0] * 100 + 50, y1 = pts[i + 1][1] * 100 + 50;
      var l = Math.abs(x1 - x0) + Math.abs(y1 - y0);
      segs.push({ x0: x0, y0: y0, x1: x1, y1: y1, l: l, s: len });
      len += l;
    }
    return { segs: segs, len: len };
  }
  var ROUTES = [mkRoute(GROUND), mkRoute(AIR)];
  function posOf(route, p) {
    var segs = route.segs;
    if (p >= route.len) { var e = segs[segs.length - 1]; return [e.x1, e.y1]; }
    for (var i = 0; i < segs.length; i++) {
      var s = segs[i];
      if (p < s.s + s.l) {
        var d = p - s.s;
        return [s.x0 + (s.x1 > s.x0 ? d : s.x1 < s.x0 ? -d : 0), s.y0 + (s.y1 > s.y0 ? d : s.y1 < s.y0 ? -d : 0)];
      }
    }
    return [segs[0].x0, segs[0].y0];
  }
  var TT = {
    bolt:   { cost: 50,  dmg: 26,  per: 8,  range: 300, splash: 0,  slow: 0,  pierce: false, ground: true,  air: true,  idx: 0 },
    cannon: { cost: 90,  dmg: 60,  per: 24, range: 260, splash: 90, slow: 0,  pierce: false, ground: true,  air: false, idx: 1 },
    frost:  { cost: 70,  dmg: 10,  per: 12, range: 240, splash: 0,  slow: 30, pierce: false, ground: true,  air: true,  idx: 2 },
    lance:  { cost: 120, dmg: 180, per: 36, range: 360, splash: 0,  slow: 0,  pierce: true,  ground: true,  air: false, idx: 3 },
    flak:   { cost: 80,  dmg: 40,  per: 10, range: 320, splash: 70, slow: 0,  pierce: false, ground: false, air: true,  idx: 4 }
  };
  var ET = {
    grunt:     { hp: 60,  speed: 10, bounty: 4, leak: 1, air: 0, first: 1, weight: 10 },
    runner:    { hp: 40,  speed: 20, bounty: 4, leak: 1, air: 0, first: 2, weight: 4 },
    wisp:      { hp: 50,  speed: 12, bounty: 6, leak: 2, air: 1, first: 3, weight: 3 },
    brute:     { hp: 150, speed: 6,  bounty: 9, leak: 3, air: 0, first: 4, weight: 3 },
    splitter:  { hp: 90,  speed: 8,  bounty: 6, leak: 2, air: 0, first: 6, weight: 2 },
    mender:    { hp: 70,  speed: 8,  bounty: 7, leak: 2, air: 0, first: 8, weight: 1 },
    splitling: { hp: 1,   speed: 12, bounty: 1, leak: 1, air: 0, first: 99, weight: 0 }
  };
  var ORDER = ['grunt', 'runner', 'wisp', 'brute', 'splitter', 'mender'];
  function mulberry32(a) { return function () {
    a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return (t ^ (t >>> 14)) >>> 0; }; }
  var rng = mulberry32(seed);
  var waves = [];
  function genWave(w) {
    var types = [], sum = 0, i;
    for (i = 0; i < ORDER.length; i++) if (ET[ORDER[i]].first <= w) { types.push(ORDER[i]); sum += ET[ORDER[i]].weight; }
    var n = 4 + Math.floor(3 * w / 5), out = [];
    for (i = 0; i < n; i++) {
      var r = rng() % sum;
      for (var j = 0; j < types.length; j++) {
        var wt = ET[types[j]].weight;
        if (r < wt) { out.push(types[j]); break; }
        r -= wt;
      }
    }
    waves[w] = out;
  }
  var mult = [0, 1000];
  function mOf(w) { while (mult.length <= w) mult.push(Math.floor(mult[mult.length - 1] * 108 / 100)); return mult[w]; }

  var strat = createStrategy();
  var log = [];
  var gold = 250, baseHp = 10, tick = 0;
  var slots = [];
  for (var si = 0; si < 16; si++) slots.push(null);
  var enemies = []; // ascending id
  var nextId = 1;
  var queue = []; // spawn queue {tick, wave, idx, type}
  var fallTick = -1;
  genWave(1);
  if (rec) rec.wave(-1, 0, waves[1]);

  function dmgOf(t, tier) { var d = TT[t].dmg; for (var i = 1; i < tier; i++) d = Math.floor(d * 16 / 10); return d; }
  function rangeOf(t, tier) { return TT[t].range + 30 * (tier - 1); }
  function armorOf(e) {
    if (e.type === 'grunt') return Math.floor(e.wave / 4);
    if (e.type === 'brute') return 6 + e.wave;
    return 0;
  }
  function effSpeed(e) { return e.slow > 0 ? Math.floor(e.speed * 60 / 100) : e.speed; }
  function view(e) {
    return { id: e.id, type: e.type, hp: e.hp, maxHp: e.maxHp, x: e.x, y: e.y, air: e.air, armor: armorOf(e), speed: e.speed, slowed: e.slow, remaining: ROUTES[e.air].len - e.progress };
  }
  function setPos(e) { var p = posOf(ROUTES[e.air], e.progress); e.x = p[0]; e.y = p[1]; }
  function mkEnemy(type, wave, maxHp, progress) {
    var d = ET[type];
    var e = { id: nextId++, type: type, wave: wave, maxHp: maxHp, hp: maxHp, speed: d.speed, air: d.air, progress: progress, age: 0, slow: 0, x: 0, y: 0 };
    setPos(e);
    return e;
  }
  function insertEnemy(e) { enemies.push(e); } // ids ascending since nextId increments

  function applyActions(acts) {
    if (!Array.isArray(acts)) return;
    var n = Math.min(32, acts.length);
    for (var i = 0; i < n; i++) {
      var a = acts[i];
      if (!a || typeof a !== 'object') continue;
      var s = a.slot;
      if (typeof s !== 'number' || s !== Math.floor(s) || s < 0 || s > 15) continue;
      if (a.op === 'build') {
        var t = TT[a.type];
        if (!t || !Object.prototype.hasOwnProperty.call(TT, a.type)) continue;
        if (slots[s] || gold < t.cost) continue;
        gold -= t.cost;
        slots[s] = { type: a.type, tier: 1, spent: t.cost, cd: 0, slot: s };
        log.push([tick, 'B', s, t.idx]);
      } else if (a.op === 'upgrade') {
        var tr = slots[s];
        if (!tr || tr.tier >= 3) continue;
        var c = TT[tr.type].cost * (tr.tier === 1 ? 1 : 2);
        if (gold < c) continue;
        gold -= c; tr.spent += c; tr.tier++;
        log.push([tick, 'U', s, tr.tier]);
      } else if (a.op === 'sell') {
        var ts = slots[s];
        if (!ts) continue;
        gold += Math.floor(ts.spent * 70 / 100);
        slots[s] = null;
        log.push([tick, 'S', s, 0]);
      }
    }
  }

  function snapshot(w) {
    var sl = [];
    for (var i = 0; i < 16; i++) {
      var tr = slots[i];
      sl.push({ slot: i, x: SLOTS[i][0], y: SLOTS[i][1], turret: tr ? { type: tr.type, tier: tr.tier, spent: tr.spent } : null });
    }
    var ev = [];
    for (var j = 0; j < enemies.length; j++) ev.push(view(enemies[j]));
    return { tick: tick, wave: w, gold: gold, baseHp: baseHp, slots: sl, enemies: ev, nextWave: waves[w + 1].slice() };
  }

  function killEnemy(e, slot) {
    gold += ET[e.type].bounty;
    log.push([tick, 'K', e.id, slot]);
    var kids = null;
    if (e.type === 'splitter') {
      var hp = Math.max(1, Math.floor(e.maxHp / 4));
      kids = [];
      for (var k = 0; k < 3; k++) { var c = mkEnemy('splitling', e.wave, hp, e.progress); insertEnemy(c); kids.push(c.id); }
    }
    if (rec) rec.kill(tick, e, slot, kids);
  }

  var endTick = maxTicks;
  for (tick = 0; tick < maxTicks; tick++) {
    // 1 wave start
    if (tick >= 20 && (tick - 20) % 40 === 0) {
      var w = (tick - 20) / 40 + 1;
      gold += Math.min(50, Math.floor(gold * 5 / 100)) + 10 + 2 * w;
      genWave(w + 1);
      if (rec) rec.wave(tick, w, waves[w + 1]);
      var acts;
      try { acts = strat.plan(snapshot(w)); } catch (err) { acts = []; }
      applyActions(acts);
      var wv = waves[w];
      for (var qi = 0; qi < wv.length; qi++) queue.push({ tick: tick + 4 * qi, wave: w, idx: qi, type: wv[qi] });
      queue.sort(function (a, b) { return a.tick - b.tick || a.wave - b.wave || a.idx - b.idx; });
    }
    // 2 spawn
    while (queue.length && queue[0].tick <= tick) {
      var q = queue.shift();
      var d = ET[q.type];
      insertEnemy(mkEnemy(q.type, q.wave, Math.floor(d.hp * mOf(q.wave) / 1000), 0));
    }
    // 3 move
    var fell = false;
    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      e.progress += effSpeed(e);
      if (e.progress >= ROUTES[e.air].len) {
        baseHp -= ET[e.type].leak;
        e.dead = true;
        log.push([tick, 'L', e.id, baseHp]);
        if (rec) rec.leak(tick, e, baseHp);
        if (baseHp <= 0) { fell = true; break; }
      } else setPos(e);
    }
    if (fell) {
      var cw = Math.floor((tick - 20) / 40) + 1;
      log.push([tick, 'F', cw, 0]);
      if (rec) rec.fall(tick, cw, gold, baseHp, enemies, slots);
      fallTick = tick; endTick = tick;
      break;
    }
    enemies = enemies.filter(function (x) { return !x.dead; });
    // 4 age & heal
    for (i = 0; i < enemies.length; i++) {
      e = enemies[i];
      e.age++;
      if (e.type === 'mender' && e.age % 20 === 0) {
        for (var j = 0; j < enemies.length; j++) {
          var o = enemies[j], dx = o.x - e.x, dy = o.y - e.y;
          if (dx * dx + dy * dy <= 150 * 150) o.hp = Math.min(o.maxHp, o.hp + Math.floor(o.maxHp * 8 / 100));
        }
        if (rec) rec.heal(tick, e);

    else if (e.k === 4) playFall(e.x);
  }
  if (shots.length) {
    const now = actx.currentTime;
    while (shotLog.length && shotLog[0] < now - 1) shotLog.shift();
    shots.sort((a, b) => SHOT_PRIO[b.ty] - SHOT_PRIO[a.ty] || a.t - b.t);
    for (const e of shots) { if (shotLog.length >= 12) break; shotLog.push(now); playShot(e.ty, e.x); }
  }
}
initAudio();

/* ===================== self-check, report ===================== */
function runSelfCheck() {
  const out = { vectorA: false, vectorB: false };
  try {
    const A = () => ({ plan(s) { const a = []; let g = s.gold; for (const sl of s.slots) if (!sl.turret && g >= 50) { a.push({ op: 'build', slot: sl.slot, type: 'bolt' }); g -= 50; } return a; } });
    const B = () => ({ plan(s) {
      if (s.wave === 1) return [{ op: 'build', slot: 3, type: 'cannon' }, { op: 'build', slot: 6, type: 'frost' }];
      if (s.wave === 3) return [{ op: 'upgrade', slot: 3 }, { op: 'build', slot: 12, type: 'flak' }];
      if (s.wave === 6) return [{ op: 'build', slot: 8, type: 'lance' }, { op: 'sell', slot: 6 }];
      return []; } });
    const ra = rampartSimulate(A, 42, 12020), rb = rampartSimulate(B, 7, 12020);
    out.vectorA = ra.hash === '82a5353d' && ra.score === 25.38 && ra.fallTick === 1035 && ra.log.length === 166;
    out.vectorB = rb.hash === '2e8858d7' && rb.score === 10.93 && rb.fallTick === 457 && rb.log.length === 48;
  } catch (e) {}
  return out;
}
window.BENCH_REPORT = {
  selfCheck: runSelfCheck(),
  strategy: { summary: "Priority build script (59 ordered slot/type/tier steps run at every wave start; a turret is sold only to change its type) found by evolutionary search plus steepest-ascent polishing on training seeds. Ends cannon-heavy (about 9 cannons) with bolt, frost and flak support at tier 3 on all 16 pads. Targeting: bolt prefers menders and splitters, cannon maximises hp-capped splash damage, lance shoots the farthest-from-base enemy, flak shoots the densest air cluster, frost uses the default.", seedsTested: 600, meanScoreOnTestedSeeds: 45.36 },
  seed42: { score: REP.res.score, fallTick: REP.res.fallTick },
  systems: { board: 'full', enemiesAndTurrets: 'full', combatVisuals: 'full', fall: 'full', hud: 'full', audio: 'full' },
  simplifications: [
    'Keep, terrain and units are low-poly procedural meshes (no textures); wall chunks are 10 fixed pieces tied to base HP',
    'Desaturation after the fall is applied per material through a shared shader uniform (HUD stays coloured)',
    'Replay renders from recorded per-tick state; sound is triggered from the recorded event list'
  ],
  testedInBrowser: true,
  measuredFps: null
};

/* ===================== playback state machine & UI ===================== */
const $ = (id) => document.getElementById(id);
const elCountdown = $('countdown'), elToggle = $('btn-toggle'), elPause = $('icon-pause'), elPlay = $('icon-play'), elRefire = $('btn-refire'), elScrub = $('scrubber');
const pills = Array.prototype.slice.call(document.querySelectorAll('.speed-pill'));
let state = 'INIT', simTime = 0, playbackSpeed = 1, countdownElapsed = 0, holdElapsed = 0, lastTs = null;

function setIcons(playing) {
  elPause.style.display = playing ? '' : 'none';
  elPlay.style.display = playing ? 'none' : '';
  elToggle.setAttribute('aria-label', playing ? 'Pause' : 'Play');
}
function showCountdown(txt) { elCountdown.style.display = 'block'; elCountdown.textContent = txt; }
function hideCountdown() { elCountdown.style.display = 'none'; elCountdown.textContent = ''; }
function setSim(t) { simTime = Math.max(0, Math.min(DURATION, t)); }
function setScrub() { elScrub.value = simTime === 0 ? '0' : simTime.toFixed(3); }

elToggle.addEventListener('click', () => {
  if (state === 'PLAYING') { state = 'PAUSED'; setIcons(false); }
  else if (state === 'COUNTDOWN' || state === 'REFIRE_HOLD' || state === 'INIT') { hideCountdown(); setSim(0); setScrub(); state = 'PAUSED'; setIcons(false); }
  else if (state === 'PAUSED') { state = 'PLAYING'; setIcons(true); }
  else if (state === 'ENDED') { setSim(0); setScrub(); hideCountdown(); state = 'PLAYING'; setIcons(true); }
  audPrev = simTime;
});
elRefire.addEventListener('click', () => {
  hideCountdown(); setSim(0); elScrub.value = '0'; setIcons(true);
  state = 'REFIRE_HOLD'; holdElapsed = 0; audPrev = 0; renderNow();
});
pills.forEach((p) => p.addEventListener('click', () => {
  playbackSpeed = parseFloat(p.getAttribute('data-speed'));
  pills.forEach((q) => { const on = q === p; q.classList.toggle('is-active', on); q.setAttribute('aria-checked', on ? 'true' : 'false'); });
}));
elScrub.addEventListener('input', () => {
  hideCountdown(); setSim(parseFloat(elScrub.value) || 0);
  state = 'PAUSED'; setIcons(false); audPrev = simTime; renderNow();
});

let audPrev = 0, stepFrom = -1, stepTo = 0;
function renderNow() {
  const W = window.innerWidth, H = window.innerHeight;
  updateScene(simTime); updateHud(simTime, W, H);
  renderer.clear(); renderer.render(scene, camera);
  renderer.clearDepth(); renderer.render(hudScene, hudCam);
}
function onResize() {
  const W = window.innerWidth, H = window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(W, H, false);
  frameCamera(W, H);
  hudCam.left = 0; hudCam.right = W; hudCam.top = H; hudCam.bottom = 0; hudCam.updateProjectionMatrix();
  renderNow();
}
window.addEventListener('resize', onResize);

function frame(ts) {
  window.requestAnimationFrame(frame);
  const raw = lastTs === null ? 0 : (ts - lastTs) / 1000; lastTs = ts;
  const dt = Math.min(Math.max(raw, 0), 0.1);
  if (state === 'INIT') { state = 'COUNTDOWN'; countdownElapsed = 0; showCountdown('3'); }
  else if (state === 'COUNTDOWN') {
    countdownElapsed += dt;
    if (countdownElapsed >= 3) { hideCountdown(); state = 'PLAYING'; audPrev = simTime; }
    else showCountdown(String(3 - Math.floor(countdownElapsed)));
  } else if (state === 'REFIRE_HOLD') {
    holdElapsed += dt;
    if (holdElapsed >= 1) { state = 'PLAYING'; audPrev = simTime; }
  } else if (state === 'PLAYING') {
    stepFrom = simTime;
    simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
    elScrub.value = simTime.toFixed(3);
    if (simTime >= DURATION) { simTime = DURATION; elScrub.value = DURATION.toFixed(3); state = 'ENDED'; setIcons(false); }
    stepTo = simTime;
  }
  audioGate(state === 'PLAYING' || (state === 'ENDED' && false));
  if (stepFrom >= 0) { if (audioOn) audioStep(stepFrom, stepTo); stepFrom = -1; }
  const wantWind = state === 'PLAYING' && simTime >= FALL_T + 0.3;
  if (actx && audioOn) { if (wantWind) startWind(); }
  renderNow();
}
onResize();
window.requestAnimationFrame(frame);

</script>
