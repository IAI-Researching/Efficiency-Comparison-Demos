<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;

  height: 100%;

  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;

  align-items: center;

  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

}

}

<script id="rampart-strategy">
function createStrategy() {
  const types = ["bolt","cannon","frost","lance","flak"];
  const costs = [50,90,70,120,80];
  const ranges = [300,260,240,360,320];
  const damages = [[26,41,65],[60,96,153],[10,16,25],[180,288,460],[40,64,102]];

  // Each entry gives the slot, type index, desired tier, and first wave to invest.
  const purchases = [
    [0,1,2,1], [5,4,1,3], [2,1,3,4], [0,1,3,7], [13,0,1,14], [1,1,3,19],
    [12,0,2,15], [11,1,1,14], [8,1,2,13], [10,4,2,10], [6,1,2,12], [7,1,3,15],
    [9,1,2,19], [14,4,1,14], [5,4,2,34], [3,1,3,10], [4,1,3,26], [15,4,1,4]
  ];
  const tierThree = [5,1,6,8,15,13,7,14,9,3,10,12,4,11,0,2];
  const refits = [[9,3,39],[11,2,37]];
  const converted = new Set();
  const shotsSincePlan = new Uint8Array(16);

  function plan(state) {
    const { wave, enemies } = state;
    const actions = [];
    const slots = state.slots.map(s => s.turret);
    let gold = state.gold;

    function invest(slot, kind, tier) {
      let turret = slots[slot];
      const type = types[kind], cost = costs[kind];
      if (turret && turret.type !== type) {
        const refund = Math.floor(turret.spent*70/100);
        if (gold+refund < cost) return;
        actions.push({ op:"sell", slot });
        gold += refund;
        turret = null;
      }
      if (!turret && gold >= cost) {
        actions.push({ op:"build", slot, type });
        gold -= cost;
        turret = { type, tier:1, spent:cost };
      }
      while (turret && turret.tier < tier && gold >= turret.tier*cost) {
        actions.push({ op:"upgrade", slot });
        gold -= turret.tier*cost;
        turret = { type, tier:turret.tier+1, spent:turret.spent+turret.tier*cost };
      }
      slots[slot] = turret;
    }

    // The rear bolt can cover an early runner that outranges the opening battery.
    const desired = new Map();
    if (wave < 14 && enemies.some(e => e.type === "runner" && e.remaining < 1800)) {
      desired.set(13,[13,0,1]);
    }
    for (const order of purchases) {
      if (wave >= order[3]) desired.set(order[0],order);
    }
    for (const [slot,kind] of refits) {
      if (converted.has(slot)) desired.set(slot,[slot,kind,3]);
    }
    for (const [slot,kind,tier] of desired.values()) {
      if (actions.length > 27) break;
      invest(slot,kind,tier);
    }
    if (wave > 12) for (const slot of tierThree) {
      if (actions.length > 27) break;
      const order = desired.get(slot);
      if (order) invest(slot,order[1],3);
    }

    if (wave >= 33) {
      for (const [slot,kind,after] of refits) {
        const turret = slots[slot];
        if (actions.length <= 28 && wave >= after && turret && turret.type !== types[kind] &&
            gold+Math.floor(turret.spent*70/100) >= costs[kind]*4) {
          invest(slot,kind,3);
          converted.add(slot);
        }
      }
      // A freshly built battery can fire immediately. Spend surplus on crowded
      // sectors where the previous battery has likely fired in the last few ticks.
      if (gold >= 108) {
        const batteries = [];
        for (const s of state.slots) {
          const t = slots[s.slot];
          if (!t || t.tier !== 3 || !shotsSincePlan[s.slot] ||
              (t.type !== "cannon" && t.type !== "lance" && t.type !== "flak")) continue;
          const kind = types.indexOf(t.type), air = kind === 4;
          const rr = (ranges[kind]+60)**2;
          let count = 0, weight = 0;
          for (const e of enemies) {
            const dx = e.x-s.x, dy = e.y-s.y;
            if (Boolean(e.air) !== air || dx*dx+dy*dy > rr) continue;
            const urgency = 1+1/(1+e.remaining/(air?340:580));
            count++;
            weight += urgency*(e.type === "mender" ? 1.35 : 1);
          }
          const recency = shotsSincePlan[s.slot] > 1 ? 1 : 0.45;
          const demand = recency*(kind === 3 ? Math.min(2,count)*2 : weight);
          if (demand >= 2.4) batteries.push({ slot:s.slot, kind, demand });
        }
        batteries.sort((a,b) => b.demand-a.demand || a.slot-b.slot);
        for (const {slot,kind} of batteries.slice(0,13)) {
          if (actions.length > 28) break;
          const refund = Math.floor(slots[slot].spent*70/100);
          if (gold+refund < costs[kind]*4) continue;
          actions.push({ op:"sell", slot });
          gold += refund;
          slots[slot] = null;
          invest(slot,kind,3);
        }
      }
    }
    shotsSincePlan.fill(0);
    return actions;
  }

  function target(turret, candidates) {
    shotsSincePlan[turret.slot]++;
    if (candidates.length === 1) return candidates[0].id;
    const kind = types.indexOf(turret.type);
    const damage = damages[kind][turret.tier-1];
    const splash = kind === 1 ? 8100 : kind === 4 ? 4900 : 0;

    // Score damage that fits the target's remaining HP and weight kills, healers,
    // armor bypass, and enemies nearing the end of their route.
    function value(e) {
      const hit = Math.max(1,damage-(kind === 3 ? 0 : e.armor));
      const effective = Math.min(hit,e.hp)/damage;
      const timeLeft = e.remaining/(e.speed*(e.slowed ? 0.6 : 1));
      const horizon = e.air ? 6.665537966 : 5.320975802;
      const leak = 1/(1+timeLeft/horizon*0.07);
      const urgency = (e.air ? 1.1 : 1)*(e.type === "brute" ? 1.08 : 1);
      const kill = e.hp <= hit ? 4.205493 : 0.44187*(1-e.hp/e.maxHp);
      const danger = Math.max(0,1-timeLeft/50);
      const priority = e.air ? 5.6 : e.type === "runner" ? 1.2 : e.type === "brute" ? 1.25 : 1;
      return 6*danger*danger*priority*(e.hp <= hit ? 1.25 : effective)+
        effective*(1+kill+5.2626965*(e.type === "mender"))+3.720909312*urgency*leak+
        (kind === 3 ? 33.191761619*Math.min(1,e.armor/34)*effective : 0)+
        (kind === 2 && !e.slowed ? 60 : 0);
    }
    const values = candidates.map(value);
    let choice = candidates[0], best = -Infinity;
    for (let i=0;i<candidates.length;i++) {
      const e = candidates[i];
      const dx = e.x-turret.x, dy = e.y-turret.y;
      let score = values[i]+0.10*(dx*dx+dy*dy)/(turret.range*turret.range);
      if (splash) for (let j=0;j<candidates.length;j++) {
        if (i === j) continue;
        const other = candidates[j], x = other.x-e.x, y = other.y-e.y;
        if (x*x+y*y <= splash) score += values[j];
      }
      if (score > best) {
        best = score;
        choice = e;
      }
    }
    return choice.id;
  }
  return { plan, target };
}
</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks) {
  const record = arguments[3];
  const layout = {
    ground: [[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]],
    air: [[0,6],[21,6],[21,11],[23,11]],
    slots: [[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],[14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]]
  };
  const towers = {
    bolt:   { index:0, cost:50,  damage:26,  period:8,  range:300, splash:0,  slow:0, pierce:false, ground:true,  air:true },
    cannon: { index:1, cost:90,  damage:60,  period:24, range:260, splash:90, slow:0, pierce:false, ground:true,  air:false },
    frost:  { index:2, cost:70,  damage:10,  period:12, range:240, splash:0,  slow:30,pierce:false, ground:true,  air:true },
    lance:  { index:3, cost:120, damage:180, period:36, range:360, splash:0,  slow:0, pierce:true, ground:true,  air:false },
    flak:   { index:4, cost:80,  damage:40,  period:10, range:320, splash:70, slow:0, pierce:false, ground:false, air:true }
  };
  const kinds = [
    { type:"grunt",    hp:60,  speed:10, bounty:4, leak:1, air:0, first:1, weight:10 },
    { type:"runner",   hp:40,  speed:20, bounty:4, leak:1, air:0, first:2, weight:4 },
    { type:"wisp",     hp:50,  speed:12, bounty:6, leak:2, air:1, first:3, weight:3 },
    { type:"brute",    hp:150, speed:6,  bounty:9, leak:3, air:0, first:4, weight:3 },
    { type:"splitter", hp:90,  speed:8,  bounty:6, leak:2, air:0, first:6, weight:2 },
    { type:"mender",   hp:70,  speed:8,  bounty:7, leak:2, air:0, first:8, weight:1 },
    { type:"splitling",hp:0,   speed:12, bounty:1, leak:1, air:0, first:Infinity, weight:0 }
  ];
  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return (t ^ (t >>> 14)) >>> 0;
    };
  }
  const random = mulberry32(seed);
  const strategy = createStrategy();
  const slots = layout.slots.map(([x,y], slot) => ({ slot, x:100*x+50, y:100*y+50, turret:null }));
  const lengths = [4600, 2800]; // The air waypoints and both reference vectors use 2800.
  const routes = [layout.ground, layout.air].map((points, air) => {
    const route = [];
    for (let i = 1; i < points.length; i++) {
      const [x,y] = points[i-1];
      const dx = points[i][0]-x, dy = points[i][1]-y;
      const distance = 100*(Math.abs(dx)+Math.abs(dy));
      for (let d = 0; d < distance && route.length < lengths[air]; d++) {
        route.push([100*x+50+Math.sign(dx)*d, 100*y+50+Math.sign(dy)*d]);
      }
    }
    return route;
  });
  const log = [], queue = new Map(), enemies = [];
  let tick = 0, wave = 0, gold = 250, baseHp = 10, lastId = 0, fallTick = -1;
  let multiplier = 1000, events;
  function generate(w) {
    const eligible = kinds.filter(kind => kind.first <= w);
    const total = eligible.reduce((sum, kind) => sum + kind.weight, 0);
    return Array.from({ length:4+Math.floor(3*w/5) }, () => {
      let r = random() % total;
      for (const kind of eligible) {
        if (r < kind.weight) return kind;
        r -= kind.weight;
      }
    });
  }
  let upcoming = generate(1);
  function spawn(kind, ownWave, maxHp, progress) {
    const { type, air, speed, bounty, leak } = kind;
    const armor = type === "grunt" ? Math.floor(ownWave/4) : type === "brute" ? 6+ownWave : 0;
    const [x,y] = routes[air][progress];
    enemies.push({ id:++lastId, type, air, speed, bounty, leak, armor, wave:ownWave,
      hp:maxHp, maxHp, progress, x, y, slow:0, age:0, remaining:lengths[air]-progress });
  }
  function view(e) {
    return { id:e.id, type:e.type, hp:e.hp, maxHp:e.maxHp, x:e.x, y:e.y, air:e.air,
      armor:e.armor, speed:e.speed, slowed:e.slow > 0, remaining:e.remaining };
  }
  function emit(code, a, b) {
    log.push([tick,code,a,b]);
  }
  function visual(code, fields) {
    if (record) events.push({ code, ...fields });
  }
  function inRange(a, b, rr) {
    const dx = a.x-b.x, dy = a.y-b.y;
    return dx*dx+dy*dy <= rr;
  }
  function snapshot() {
    record(tick, {
      wave, gold, baseHp, events,
      nextWave:upcoming.map(kind => kind.type),
      turrets:slots.map(s => s.turret && { type:s.turret.type, tier:s.turret.tier,
        aimX:s.turret.aimX, aimY:s.turret.aimY }),
      enemies:enemies.map(e => ({ id:e.id, type:e.type, x:e.x, y:e.y, hp:e.hp, maxHp:e.maxHp,
        progress:e.progress, slowed:e.slow > 0 }))
    }, layout);
  }
  for (; tick < maxTicks; tick++) {
    if (record) events = [];
    if (tick >= 20 && (tick-20)%40 === 0) {
      wave++;
      gold += Math.min(50, Math.floor(gold*5/100)) + 10 + 2*wave;
      const spawning = upcoming;
      upcoming = generate(wave+1);
      if (wave > 1) multiplier = Math.floor(multiplier*108/100);
      visual("W", { wave, x:1200 });
      const actions = strategy.plan({
        tick, wave, gold, baseHp, enemies:enemies.map(view), nextWave:upcoming.map(kind => kind.type),
        slots:slots.map(s => ({ slot:s.slot, x:s.x, y:s.y, turret:s.turret &&
          { type:s.turret.type, tier:s.turret.tier, spent:s.turret.spent } }))
      });
      if (Array.isArray(actions)) for (const action of actions.slice(0,32)) {
        if (!action || !Number.isInteger(action.slot)) continue;
        const s = slots[action.slot];
        if (!s) continue;
        const { slot, x, y, turret } = s;
        if (action.op === "build" && !turret && typeof action.type === "string" &&
            Object.prototype.hasOwnProperty.call(towers, action.type)) {
          const def = towers[action.type];
          if (gold < def.cost) continue;
          gold -= def.cost;
          s.turret = { ...def, type:action.type, tier:1, spent:def.cost, cooldown:0, aimX:x+100, aimY:y };
          emit("B", slot, def.index);
          visual("B", { x, y, type:action.type });
        } else if (action.op === "upgrade" && turret && turret.tier < 3) {
          const cost = turret.cost*turret.tier;
          if (gold < cost) continue;
          gold -= cost;
          turret.spent += cost;
          turret.damage = Math.floor(turret.damage*16/10);
          turret.range += 30;
          emit("U", slot, ++turret.tier);
          visual("U", { x, y, type:turret.type });
        } else if (action.op === "sell" && turret) {
          gold += Math.floor(turret.spent*70/100);
          s.turret = null;
          emit("S", slot, 0);
          visual("S", { x, y, type:turret.type });
        }
      }
      spawning.forEach((kind, index) => {
        const due = tick+4*index;
        if (!queue.has(due)) queue.set(due, []);
        queue.get(due).push([kind,wave,Math.floor(kind.hp*multiplier/1000)]);
      });
    }
    const due = queue.get(tick);
    if (due) {
      for (const [kind, ownWave, hp] of due) spawn(kind, ownWave, hp, 0);
      queue.delete(tick);
    }
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      e.progress += e.slow ? Math.floor(e.speed*60/100) : e.speed;
      e.remaining = lengths[e.air]-e.progress;
      if (e.remaining > 0) {
        [e.x,e.y] = routes[e.air][e.progress];
        continue;
      }
      baseHp -= e.leak;
      enemies.splice(i--,1);
      emit("L", e.id, baseHp);
      visual("L", { x:2350, y:1150, baseHp, amount:e.leak });
      if (baseHp <= 0) {
        fallTick = tick;
        emit("F", wave, 0);
        visual("F", { x:2350, y:1150 });
        break;
      }
    }
    if (fallTick >= 0) {
      if (record) snapshot();
      break;
    }
    for (const e of enemies) {
      e.age++;
      if (e.type === "mender" && e.age%20 === 0) {
        for (const other of enemies) if (inRange(e, other, 22500)) {
          other.hp = Math.min(other.maxHp, other.hp + Math.floor(other.maxHp*8/100));
        }
        visual("H", { x:e.x, y:e.y, radius:150 });
      }
    }
    for (const s of slots) {
      const t = s.turret;
      if (!t || (t.cooldown > 0 && --t.cooldown > 0)) continue;
      const candidates = [];
      for (const e of enemies) {
        if ((e.air ? t.air : t.ground) && inRange(s, e, t.range*t.range)) candidates.push(e);
      }
      if (!candidates.length) continue;
      let target;
      if (typeof strategy.target === "function") {

  const COUNTDOWN="COUNTDOWN", PLAYING="PLAYING", PAUSED="PAUSED", REFIRE_HOLD="REFIRE_HOLD", ENDED="ENDED";
  let playbackState=COUNTDOWN, simTime=0, playbackSpeed=1;
  let countdownElapsed=0, holdElapsed=0, lastFrame=null, restingFrame=true, dragging=false;
  function showCount(text) {
    countdown.style.display=text ? "block" : "none";
    if (countdown.textContent!==text) countdown.textContent=text;
  }
  function state(next) {
    playbackState=next;
    const moving=next===PLAYING || next===COUNTDOWN || next===REFIRE_HOLD;
    pauseIcon.style.display=moving ? "" : "none";
    playIcon.style.display=moving ? "none" : "";
    toggle.setAttribute("aria-label",moving ? "Pause" : "Play");
    if (next!==COUNTDOWN) showCount("");
    audio.active(next===PLAYING && !dragging);
  }
  function reset() {
    simTime=0;
    scrubber.value="0";
    draw(0);
  }
  function advance(dt) {
    const from=simTime;
    simTime=min(DURATION,simTime+dt*playbackSpeed);
    scrubber.value=simTime.toFixed(3);
    if (!dragging && simTime>from) audio.advance(from,simTime,playbackSpeed);
    if (simTime!==from) draw(simTime);
    if (simTime>=DURATION) state(ENDED);
  }
  function playback(now) {
    const dt=lastFrame===null ? 0 : clamp((now-lastFrame)/1000,0,0.1);
    lastFrame=now;
    if (playbackState===COUNTDOWN) {
      if (restingFrame) {
        restingFrame=false;
        showCount("3");
      } else {
        countdownElapsed+=dt;
        if (countdownElapsed>=3) {
          state(PLAYING);
          advance(countdownElapsed-3);
        } else {
          showCount(String(3-floor(countdownElapsed)));
        }
      }
    } else if (playbackState===REFIRE_HOLD) {
      holdElapsed+=dt;
      if (holdElapsed>=1) {
        state(PLAYING);
        advance(holdElapsed-1);
      }
    } else if (playbackState===PLAYING) {
      advance(dt);
    }
    requestAnimationFrame(playback);
  }
  toggle.addEventListener("click",()=>{
    lastFrame=performance.now();
    if (playbackState===PLAYING || playbackState===COUNTDOWN || playbackState===REFIRE_HOLD) {
      state(PAUSED);
    } else {
      if (playbackState===ENDED) reset();
      state(PLAYING);
    }
  });
  document.getElementById("btn-refire").addEventListener("click",()=>{
    lastFrame=performance.now();
    holdElapsed=0;
    state(REFIRE_HOLD);
    reset();
  });
  scrubber.addEventListener("pointerdown",()=>{
    dragging=true;
    audio.active(false);
  });
  function endDrag() {
    if (!dragging) return;
    dragging=false;
    audio.active(playbackState===PLAYING);
  }
  window.addEventListener("pointerup",endDrag);
  window.addEventListener("pointercancel",endDrag);
  scrubber.addEventListener("input",()=>{
    simTime=parseFloat(scrubber.value);
    state(PAUSED);
    draw(simTime);
  });
  const pills=[...document.querySelectorAll(".speed-pill")];
  for (const pill of pills) pill.addEventListener("click",()=>{
    playbackSpeed=Number(pill.dataset.speed);
    for (const item of pills) {
      const selected=item===pill;
      item.classList.toggle("is-active",selected);
      item.setAttribute("aria-checked",String(selected));
    }
  });
  window.addEventListener("resize",()=>{
    lastDraw=-1;
    frameCamera();
    draw(simTime);
  });
  showCount("");
  frameCamera();
  draw(0);
  requestAnimationFrame(playback);
})();
</script>
</body>
</html>
