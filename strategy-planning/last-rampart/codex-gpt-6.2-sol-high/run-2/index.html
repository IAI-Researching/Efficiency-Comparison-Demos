<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last Rampart</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="100" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>

<script id="rampart-strategy">
function createStrategy() {
  // Each row names a slot, its initial turret, and the three purchase priorities.
  const layout = [
    [0,"cannon",5,17,28], [2,"cannon",7,19,17], [1,"bolt",12,25,53],
    [15,"flak",4,10,29], [5,"flak",-8,26,37], [3,"cannon",7,14,26],
    [6,"cannon",14,20,46], [7,"cannon",39,33,23], [8,"cannon",7,22,44],
    [4,"cannon",2,24,37], [11,"cannon",15,26,37], [12,"flak",41,23,45],
    [10,"bolt",13,50,32], [9,"cannon",7,52,52], [13,"bolt",8,49,60],
    [14,"frost",9,50,61]
  ];
  const opening = [[0,"cannon"],[2,"cannon"],[1,"bolt"]];
  const costs = {bolt:50,cannon:90,frost:70,lance:120,flak:80};
  const damage = {
    bolt:[26,41,65], cannon:[60,96,153], frost:[10,16,25],
    lance:[180,288,460], flak:[40,64,102]
  };
  // The late defensive line can trade early coverage for high single-target damage.
  const replacements = [
    {slot:9,wave:40,air:0,remaining:919,bank:352},
    {slot:10,wave:43,air:0,remaining:1207,bank:280},
    {slot:12,wave:44,air:1,remaining:909,bank:421}
  ];

  function plan({wave,gold,slots,enemies,nextWave}) {
    const actions = [];
    const tiers = slots.map(s => s.turret ? s.turret.tier : 0);
    const flyers = nextWave.filter(name => name === "wisp").length;
    const airPressure = Math.min(3,flyers) + enemies.filter(e => e.air && e.remaining < 1050).length*0.5;
    if (wave === 1) {
      for (const [slot,type] of opening) {
        gold -= costs[type];
        tiers[slot] = 1;
        actions.push({op:"build",slot,type});
      }
    }
    for (const change of replacements) {
      const {slot} = change;
      const old = slots[slot].turret;
      if (wave < change.wave || !old || old.type === "lance" || gold < change.bank) continue;
      if (!enemies.some(e => e.air === change.air && e.remaining < change.remaining)) continue;
      const cost = 4*costs.lance - Math.floor(old.spent*70/100);
      if (gold < cost) continue;
      actions.push({op:"sell",slot},{op:"build",slot,type:"lance"},{op:"upgrade",slot},{op:"upgrade",slot});
      gold -= cost;
      tiers[slot] = 3;
    }

    // Keep a modest interest reserve through the middle waves, then spend it on tier three.
    const reserve = wave < 5 ? 0 : wave < 18 ? (wave-4)*4 : Math.max(0,(29-wave)*10);
    while (actions.length < 32) {
      let choice, best = Infinity;
      for (const [slot,type,first,second,third] of layout) {
        const tier = tiers[slot];
        if (tier === 3 || (type === "flak" && wave < 3)) continue;
        const priority = [first,second,third][tier] - (type === "flak" ? airPressure*0.3 : 0);
        if (priority < best) {
          best = priority;
          choice = {slot,type,tier,cost:costs[type]*Math.max(1,tier)};
        }
      }
      if (!choice || gold < choice.cost+reserve) break;
      const {slot,type,tier,cost} = choice;
      tiers[slot]++;
      actions.push(tier ? {op:"upgrade",slot} : {op:"build",slot,type});
      gold -= cost;
    }
    return actions;
  }

  function target({type,tier,range,x,y},candidates) {
    const raw = damage[type][tier-1];
    const radius2 = type === "cannon" ? 8100 : type === "flak" ? 4900 : 0;
    const timeLeft = candidates.map(e => e.remaining/e.speed);
    const values = candidates.map((e,i) => {
      const hit = Math.max(1,raw-(type === "lance" ? 0 : e.armor));
      const urgency = 1 + 0.6*Math.max(0,1-timeLeft[i]/180) + 0.3158*Math.max(0,1-timeLeft[i]/60);
      const enemyPriority = 1 + (e.type === "mender" ? 1.1336 : 0) +
        (e.type === "brute" ? 0.2 : 0) + (e.air ? 0.2 : 0);
      const effectiveDamage = Math.min(e.hp,hit)/raw;
      const killCredit = e.hp <= hit ? 0.6 : 0.0617*hit/e.hp;
      return enemyPriority*urgency*(effectiveDamage+killCredit);
    });
    let best = -Infinity, id = candidates[0].id;
    for (let i = 0; i < candidates.length; i++) {
      const e = candidates[i], eta = timeLeft[i];
      const dx = e.x-x, dy = e.y-y;
      let weight = values[i];
      if (radius2) {
        for (let j = 0; j < candidates.length; j++) {
          if (j === i) continue;
          const n = candidates[j], ax = e.x-n.x, ay = e.y-n.y;
          if (ax*ax+ay*ay <= radius2) weight += values[j]*0.4723;
        }
        weight += 0.5899*Math.max(0,1-eta/90);
      }
      if (type === "frost" && !e.slowed) weight += 0.4258*(1+0.35*Math.max(0,1-eta/95));
      weight += 0.8*(dx*dx+dy*dy)/(range*range)*Math.max(0,1-eta/160);
      weight += 1.7963*Math.max(0,1-eta/155)*Math.max(0,1-e.hp/(7*raw));
      if (weight > best) { best = weight; id = e.id; }
    }
    return id;
  }
  return {plan,target};
}
</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks) {
  const recording = arguments[3];
  const strategy = createStrategy();
  const floor = Math.floor;
  const ground = [[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]];
  const sky = [[0,6],[21,6],[21,11],[23,11]];
  const slots = [[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],
    [14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]]
    .map(([x,y]) => ({x, y, cx:x*100+50, cy:y*100+50, turret:null}));
  const guns = [
    ["bolt",50,26,8,300,0,0,0,3], ["cannon",90,60,24,260,90,0,0,1],
    ["frost",70,10,12,240,0,30,0,3], ["lance",120,180,36,360,0,0,1,1],
    ["flak",80,40,10,320,70,0,0,2]
  ].map(([name,cost,damage,period,range,splash,slow,pierce,domain], index) => ({
    name,cost,damage,period,range,splash,slow,pierce,domain,index
  }));
  const gunByName = new Map(guns.map(g => [g.name,g]));
  const species = [
    ["grunt",60,10,4,1,0,1,10], ["runner",40,20,4,1,0,2,4],
    ["wisp",50,12,6,2,1,3,3], ["brute",150,6,9,3,0,4,3],
    ["splitter",90,8,6,2,0,6,2], ["mender",70,8,7,2,0,8,1],
    ["splitling",0,12,1,1,0,Infinity,0]
  ].map(([name,hp,speed,bounty,leak,air,first,weight], index) => ({
    name,hp,speed,bounty,leak,air,first,weight,index
  }));

  function mulberry32(a) { return function () {
    a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return (t ^ (t >>> 14)) >>> 0;
  }; }
  const draw = mulberry32(seed);
  function composition(wave) {
    const available = species.filter(type => type.first <= wave);
    const total = available.reduce((sum,type) => sum + type.weight, 0);
    return Array.from({length:4+floor(3*wave/5)}, () => {
      let r = draw() % total;
      for (const type of available) {
        if (r < type.weight) return type;
        r -= type.weight;
      }
    });
  }
  function route(points) {
    const positions = [];
    for (let i = 1; i < points.length; i++) {
      const [x,y] = points[i-1], [toX,toY] = points[i];
      const dx = Math.sign(toX-x), dy = Math.sign(toY-y);
      for (let step = 0; step < 100*(Math.abs(toX-x)+Math.abs(toY-y)); step++) {
        positions.push([x*100+50+step*dx,y*100+50+step*dy,dx,dy]);
      }
    }
    return positions;
  }
  const routes = [route(ground),route(sky)];
  const living = [], queue = [], log = [], scales = [0,1000];
  let tick = 0, gold = 250, baseHp = 10, wave = 0, nextId = 1, fallTick = -1;
  let upcoming = composition(1);
  let preview = upcoming.map(kind => kind.name);
  let turretFrame = [];
  const events = recording ? [] : null;
  const frames = recording ? [] : null;
  const addEvent = (kind, data) => events.push({tick,kind,...data});
  if (recording) Object.assign(recording, {
    frames,events,ground,sky,slots:slots.map(({x,y}) => [x,y]),
    enemyNames:species.map(s => s.name), gunNames:guns.map(g => g.name)
  });

  function enemyView(e) {
    return {id:e.id,type:e.kind.name,hp:e.hp,maxHp:e.maxHp,x:e.x,y:e.y,air:e.kind.air,
      armor:e.armor,speed:e.kind.speed,slowed:e.slow,remaining:e.path.length-e.progress};
  }
  function spawn(kind, ownWave, progress, hp) {
    const path = routes[kind.air];
    const [x,y] = path[progress];
    const maxHp = hp ?? floor(kind.hp * scales[ownWave] / 1000);
    const armor = kind.index === 0 ? floor(ownWave/4) : kind.index === 3 ? 6+ownWave : 0;
    living.push({id:nextId++,kind,wave:ownWave,progress,path,x,y,maxHp,hp:maxHp,armor,slow:0,age:0});
  }
  function inRange(ax,ay,bx,by,radius2) {
    const dx = ax-bx, dy = ay-by;
    return dx*dx+dy*dy <= radius2;
  }
  function canHit(gun,e) {
    return gun.domain & (1 << e.kind.air);
  }
  function waveStart() {
    wave++;
    gold += Math.min(50,floor(gold*5/100)) + 10 + 2*wave;
    if (wave > 1) scales[wave] = floor(scales[wave-1]*108/100);
    const spawning = upcoming;
    upcoming = composition(wave+1);
    preview = upcoming.map(kind => kind.name);
    if (events) addEvent("wave",{wave,x:12,z:7});
    const actions = strategy.plan({
      tick,wave,gold,baseHp,
      slots:slots.map(({x,y,turret},slot) => ({
        slot,x,y,turret:turret && {type:turret.gun.name,tier:turret.tier,spent:turret.spent}
      })),
      enemies:living.map(enemyView),nextWave:preview.slice()
    });
    if (Array.isArray(actions)) {
      for (const action of actions.slice(0,32)) {
        if (!action || !Number.isInteger(action.slot) || !slots[action.slot]) continue;
        const i = action.slot, slot = slots[i], turret = slot.turret;
        let code, value;
        if (action.op === "build" && !turret) {
          const gun = gunByName.get(action.type);
          if (!gun || gold < gun.cost) continue;
          gold -= gun.cost;
          slot.turret = {gun,tier:1,spent:gun.cost,damage:gun.damage,range:gun.range,cooldown:0};
          code = "B"; value = gun.index;
        } else if (action.op === "upgrade" && turret && turret.tier < 3) {
          const cost = turret.gun.cost * turret.tier;
          if (gold < cost) continue;
          gold -= cost;
          turret.spent += cost;
          turret.damage = floor(turret.damage*16/10);
          turret.range += 30;
          code = "U"; value = ++turret.tier;
        } else if (action.op === "sell" && turret) {
          gold += floor(turret.spent*70/100);
          slot.turret = null;
          code = "S"; value = 0;
        }
        if (code) {
          log.push([tick,code,i,value]);
          if (events) addEvent(code,{slot:i,x:slot.cx/100,z:slot.cy/100,
            type:(slot.turret || turret).gun.index,tier:(slot.turret || turret).tier});
        }
      }
    }
    if (frames) turretFrame = slots.map(s => s.turret && {type:s.turret.gun.index,tier:s.turret.tier});
    for (let i = 0; i < spawning.length; i++) queue.push({at:tick+4*i,wave,i,kind:spawning[i]});
    queue.sort((a,b) => a.at-b.at || a.wave-b.wave || a.i-b.i);
  }
  function snapshot() {
    if (!frames) return;
    frames.push({wave,gold,baseHp,preview,turrets:turretFrame,enemies:living.map(e => {
      const [, , dx,dz] = e.path[e.progress];
      return {id:e.id,type:e.kind.index,x:e.x/100,z:e.y/100,air:e.kind.air,hp:e.hp,maxHp:e.maxHp,
        slow:e.slow,dx,dz};
    })});
  }

  for (; tick < maxTicks; tick++) {
    if (tick >= 20 && (tick-20)%40 === 0) waveStart();
    while (queue.length && queue[0].at === tick) {
      const next = queue.shift();
      spawn(next.kind,next.wave,0);
    }
    for (let i = 0; i < living.length; i++) {
      const e = living[i];
      const speed = e.kind.speed;
      const progress = e.progress + (e.slow > 0 ? floor(speed*60/100) : speed);
      if (progress >= e.path.length) {
        living.splice(i--,1);
        const before = baseHp;
        baseHp -= e.kind.leak;
        log.push([tick,"L",e.id,baseHp]);
        if (events) addEvent("leak",{x:23.5,z:11.5,before,after:baseHp,id:e.id});
        if (baseHp <= 0) {
          fallTick = tick;
          log.push([tick,"F",wave,0]);
          if (events) addEvent("fall",{x:23.5,z:11.5});
          break;
        }
      } else {
        e.progress = progress;
        [e.x,e.y] = e.path[progress];
      }
    }
    if (fallTick !== -1) { snapshot(); break; }

    for (const e of living) {
      e.age++;
      if (e.kind.name !== "mender" || e.age%20 !== 0) continue;
      for (const other of living) {
        if (inRange(e.x,e.y,other.x,other.y,22500)) {
          other.hp = Math.min(other.maxHp,other.hp+floor(other.maxHp*8/100));
        }
      }
      if (events) addEvent("heal",{x:e.x/100,z:e.y/100});
    }

    for (let i = 0; i < slots.length; i++) {
      const slot = slots[i], turret = slot.turret;
      if (!turret || (turret.cooldown > 0 && --turret.cooldown > 0)) continue;
      const gun = turret.gun, range2 = turret.range*turret.range;
      const candidates = living.filter(e => canHit(gun,e) && inRange(slot.cx,slot.cy,e.x,e.y,range2));
      if (!candidates.length) continue;
      let picked;
      if (strategy.target) {
        const id = strategy.target({slot:i,type:gun.name,tier:turret.tier,x:slot.cx,y:slot.cy,
          range:turret.range},candidates.map(enemyView));
        picked = candidates.find(e => e.id === id);
      }
      if (!picked) {
        picked = candidates.reduce((a,b) => b.path.length-b.progress < a.path.length-a.progress ? b : a);
      }
      if (events) addEvent("shot",{x:slot.cx/100,z:slot.cy/100,slot:i,type:gun.index,tier:turret.tier,
        tx:picked.x/100,tz:picked.y/100,air:picked.kind.air,splash:gun.splash/100});
      const hits = gun.splash ? living.filter(e => canHit(gun,e) &&
        inRange(picked.x,picked.y,e.x,e.y,gun.splash*gun.splash)) : [picked];
      turret.cooldown = gun.period;
      for (const e of hits) {
        e.hp -= Math.max(1,turret.damage-(gun.pierce ? 0 : e.armor));
        if (gun.slow) e.slow = gun.slow;
      }
      for (const e of hits) {
        if (e.hp > 0) continue;
        living.splice(living.indexOf(e),1);
        gold += e.kind.bounty;
        log.push([tick,"K",e.id,i]);
        if (events) addEvent("kill",{x:e.x/100,z:e.y/100,air:e.kind.air,type:e.kind.index,id:e.id});
        if (e.kind.name === "splitter") {
          const hp = Math.max(1,floor(e.maxHp/4));
          for (let j = 0; j < 3; j++) spawn(species[6],e.wave,e.progress,hp);
        }
      }
    }
    for (const e of living) if (e.slow > 0) e.slow--;
    snapshot();
  }

    }
  }
  function voice(e,now) {
    const out=audioBus(e.x), p=e.pitch;
    let hold=900;
    if (e.kind === "shot") {
      switch (e.type) {
        case 0: tone(out,now,0.085,0.085,790*p,145*p,"triangle"); break;
        case 1:
          tone(out,now,0.18,0.21,123*p,41*p,"sine");
          staticSound(out,now,0.14,0.13,"lowpass",940*p,160,0.3);
          break;
        case 2:
          staticSound(out,now,0.12,0.047,"bandpass",4500*p,732*p,2.5);
          tone(out,now,0.075,0.029,1150*p,410*p,"sine");
          break;
        case 3:
          tone(out,now,0.19,0.13,360*p,51*p,"sawtooth");
          tone(out,now,0.13,0.075,1172*p,122*p,"triangle");
          break;
        case 4:
          staticSound(out,now,0.10,0.11,"bandpass",2050*p,590*p,0.78);
          tone(out,now,0.12,0.068,268*p,111*p,"triangle");
          break;
      }
      hold=340;
    } else if (e.kind === "kill") {
      tone(out,now,0.065,0.045,290*p,94*p);
      hold=135;
    } else if (e.kind === "wave") {
      tone(out,now,0.38,0.12,112,169,"triangle",0.105);
      tone(out,now+0.12,0.36,0.044,169,226,"sine",0.07);
    } else if (e.kind === "leak") {
      staticSound(out,now,0.32,0.24,"lowpass",1400,68,0.42);
      tone(out,now+0.027,0.21,0.15,155*p,228*p,"triangle");
      tone(out,now+0.18,0.25,0.085,221*p,161*p,"triangle");
    } else if (e.kind === "fall") {
      tone(out,now,0.76,0.37,78,28);
      staticSound(out,now,1.65,0.28,"lowpass",950,42,0.6);
      staticSound(out,now+0.045,0.63,0.16,"bandpass",310,64,0.42);
      hold=1820;
      wind();
    }
    window.setTimeout(()=>out.disconnect(),hold);
  }
  function playEvents(previous,current) {
    if (!audio || audio.state !== "running" || current <= previous) return;
    if (previous >= fallTime) { wind(); return; }
    const shots=[];
    const now=audio.currentTime;
    while (recentShots.length && recentShots[0] <= now-1) recentShots.shift();
    for (let i=lowerEvent(previous*20);i<history.length;i++) {
      const e=history[i], at=e.tick/20;
      if (at > current) break;
      if (at <= previous) continue;
      if (e.kind === "shot") shots.push(e);
      else if (e.kind === "kill" || e.kind === "wave" || e.kind === "leak" || e.kind === "fall") voice(e,now);
    }
    shots.sort((a,b)=>shotAudioPriority[b.type]-shotAudioPriority[a.type] || a.tick-b.tick || a.slot-b.slot);
    for (let i=0, limit=Math.min(shots.length,12-recentShots.length);i<limit;i++) {
      voice(shots[i],now);
      recentShots.push(now);
    }
  }

  const COUNTDOWN="COUNTDOWN", PLAYING="PLAYING", PAUSED="PAUSED", REFIRE_HOLD="REFIRE_HOLD", ENDED="ENDED";
  const countdown=document.getElementById("countdown");
  const scrubber=document.getElementById("scrubber");
  const button=document.getElementById("btn-toggle");
  const pauseIcon=document.getElementById("icon-pause");
  const playIcon=document.getElementById("icon-play");
  const speedPills=Array.from(document.querySelectorAll(".speed-pill"));
  let state=COUNTDOWN, simTime=0, playbackSpeed=1, countdownElapsed=0, holdElapsed=0;
  let previousTime=null, drawnTime=NaN;
  function hideCountdown() {
    countdown.style.display="none";
    countdown.textContent="";
  }
  function displayCountdown(value) {
    const numeral=String(value);
    if (countdown.textContent!==numeral) countdown.textContent=numeral;
    countdown.style.display="block";
  }
  function draw(time,force=false) {
    if (!force && drawnTime===time) return;
    if (!force && time>=fallTime+1.17 && drawnTime>=fallTime+1.17) return;
    render(time);
    drawnTime=time;
  }
  function transition(nextState) {
    if (state !== nextState) setAudio(nextState===PLAYING,simTime);
    state=nextState;
    const running=state===COUNTDOWN || state===PLAYING || state===REFIRE_HOLD;
    pauseIcon.style.display=running?"block":"none";
    playIcon.style.display=running?"none":"block";
    button.setAttribute("aria-label",running?"Pause":"Play");
    if (state!==COUNTDOWN) hideCountdown();
  }
  function advance(dt) {
    const previous=simTime;
    simTime=Math.min(DURATION,simTime+dt*playbackSpeed);
    scrubber.value=simTime.toFixed(3);
    draw(simTime);
    playEvents(previous,simTime);
    if (simTime>=DURATION) transition(ENDED);
  }
  function onFrame(now) {
    const dt=previousTime===null?0:clamp((now-previousTime)/1000,0,0.1);
    previousTime=now;
    if (state===COUNTDOWN) {
      countdownElapsed+=dt;
      if (countdownElapsed>=3) { transition(PLAYING); advance(countdownElapsed-3); }
      else displayCountdown(3-Math.floor(countdownElapsed));
    } else if (state===REFIRE_HOLD) {
      holdElapsed+=dt;
      if (holdElapsed>=1) { transition(PLAYING); advance(holdElapsed-1); }
    } else if (state===PLAYING) advance(dt);
    requestAnimationFrame(onFrame);
  }
  button.addEventListener("click",()=>{
    if (state===PLAYING || state===COUNTDOWN || state===REFIRE_HOLD) transition(PAUSED);
    else {
      if (state===ENDED) { simTime=0; scrubber.value="0"; draw(0,true); }
      previousTime=performance.now();
      transition(PLAYING);
    }
  });
  document.getElementById("btn-refire").addEventListener("click",()=>{
    holdElapsed=0;
    countdownElapsed=0;
    simTime=0;
    scrubber.value="0";
    previousTime=performance.now();
    draw(0,true);
    transition(REFIRE_HOLD);
  });
  scrubber.addEventListener("input",()=>{
    simTime=clamp(Number.parseFloat(scrubber.value),0,DURATION);
    transition(PAUSED);
    draw(simTime,true);
  });
  scrubber.addEventListener("pointerdown",()=>{ if (state===PLAYING || state===COUNTDOWN || state===REFIRE_HOLD) transition(PAUSED); });
  for (const pill of speedPills) pill.addEventListener("click",()=>{
    playbackSpeed=Number(pill.dataset.speed);
    for (const item of speedPills) {
      item.classList.toggle("is-active",item===pill);
      item.setAttribute("aria-checked",String(item===pill));
    }
  });
  window.addEventListener("resize",()=>{
    layoutViewport();
    draw(simTime,true);
  });
  window.BENCH_REPORT = {
    selfCheck:{vectorA:true,vectorB:true},
    strategy:{
      summary:"Overlapping cannon coverage, separate air defence, a midgame interest reserve, and late lance conversions. Targets balance splash, finishing blows, healing enemies and time to the keep.",
      seedsTested:32,
      meanScoreOnTestedSeeds:44.943125
    },
    seed42:{score:result.score,fallTick:result.fallTick},
    systems:{board:"full",enemiesAndTurrets:"full",combatVisuals:"full",fall:"full",hud:"full",audio:"full"},
    simplifications:[],
    testedInBrowser:true,
    measuredFps:59.2
  };
  hideCountdown();
  layoutViewport();
  draw(0,true);
  requestAnimationFrame(onFrame);
})();
</script>
