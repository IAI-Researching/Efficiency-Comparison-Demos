  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script id="rampart-strategy">
function createStrategy() {
  var TYPES = ['bolt','cannon','cannon','cannon','cannon','flak','flak','cannon','cannon','cannon','cannon','cannon','flak','bolt','bolt','bolt'];
  var ORDER = [3,0,7,14,11,1,2,10,8,6,4,12,9,5,15,13];
  var UP = [1,4,2,7,3,0,6,5,8,10,15,14,11,13,12,9];
  var BASE = { bolt: 50, cannon: 90, frost: 70, lance: 120, flak: 80 };
  function closer(a, b) { return a.remaining !== b.remaining ? a.remaining < b.remaining : a.id < b.id; }
  return {
    plan: function (s) {
      var acts = [], gold = s.gold, i, slot, tr, cost, pass;
      for (i = 0; i < ORDER.length && acts.length < 32; i++) {
        slot = ORDER[i]; tr = s.slots[slot].turret;
        if (!tr && gold >= BASE[TYPES[slot]]) {
          acts.push({ op: "build", slot: slot, type: TYPES[slot] });
          gold -= BASE[TYPES[slot]];
        }
      }
      for (pass = 0; pass < 2 && acts.length < 32; pass++) {
        for (i = 0; i < UP.length && acts.length < 32; i++) {
          slot = UP[i]; tr = s.slots[slot].turret;
          if (!tr || (pass === 0 ? tr.tier !== 1 : tr.tier !== 2)) continue;
          cost = pass === 0 ? BASE[tr.type] : BASE[tr.type] * 2;
          if (gold >= cost) { acts.push({ op: "upgrade", slot: slot }); gold -= cost; }
        }
      }
      return acts;
    },
    target: function (t, cands) {
      if (!cands.length) return 0;
      var i, j, c, d, dx, dy, best, bs, score;
      if (t.type === "cannon" || t.type === "flak") {
        var em = cands[0];
        for (i = 1; i < cands.length; i++) if (closer(cands[i], em)) em = cands[i];
        if (em.remaining <= 350 && (t.type === "cannon" ? !em.air : em.air)) return em.id;
        var splash = t.type === "cannon" ? 90 : 70; best = cands[0]; bs = -1;
        for (i = 0; i < cands.length; i++) {
          c = cands[i]; score = 0;
          for (j = 0; j < cands.length; j++) {
            d = cands[j]; dx = d.x - c.x; dy = d.y - c.y;
            if (dx * dx + dy * dy <= splash * splash) score += 10 + (d.type === "mender" ? 100 : 0);
          }
          if (score > bs || (score === bs && closer(c, best))) { best = c; bs = score; }
        }
        return best.id;
      }
      if (t.type !== "frost") {
        var mend = null;
        for (i = 0; i < cands.length; i++) if (cands[i].type === "mender" && (!mend || closer(cands[i], mend))) mend = cands[i];
        if (mend) return mend.id;
      }
      if (t.type === "frost") for (i = 0; i < cands.length; i++) if (!cands[i].slowed) return cands[i].id;
      best = cands[0];
      for (i = 1; i < cands.length; i++) if (closer(cands[i], best)) best = cands[i];
      return best.id;
    }
  };
}

</script>
<script id="rampart-sim">
var rampartSimulate = (function () {
  "use strict";

  var TYPE_LIST = ["bolt", "cannon", "frost", "lance", "flak"];
  var TYPE_INDEX = { bolt: 0, cannon: 1, frost: 2, lance: 3, flak: 4 };
  var TURRET = {
    bolt:   { cost: 50,  damage: 26,  period: 8,  range: 300, splash: 0,  slow: 0,  pierce: false, ground: true,  air: true  },
    cannon: { cost: 90,  damage: 60,  period: 24, range: 260, splash: 90, slow: 0,  pierce: false, ground: true,  air: false },
    frost:  { cost: 70,  damage: 10,  period: 12, range: 240, splash: 0,  slow: 30, pierce: false, ground: true,  air: true  },
    lance:  { cost: 120, damage: 180, period: 36, range: 360, splash: 0,  slow: 0,  pierce: true,  ground: true,  air: false },
    flak:   { cost: 80,  damage: 40,  period: 10, range: 320, splash: 70, slow: 0,  pierce: false, ground: false, air: true  }
  };
  var ENEMY = {
    grunt:     { hp: 60,  speed: 10, bounty: 4, leak: 1, air: false, baseArmor: 0 },
    runner:    { hp: 40,  speed: 20, bounty: 4, leak: 1, air: false, baseArmor: 0 },
    wisp:      { hp: 50,  speed: 12, bounty: 6, leak: 2, air: true,  baseArmor: 0 },
    brute:     { hp: 150, speed: 6,  bounty: 9, leak: 3, air: false, baseArmor: -1 },
    splitter:  { hp: 90,  speed: 8,  bounty: 6, leak: 2, air: false, baseArmor: 0 },
    mender:    { hp: 70,  speed: 8,  bounty: 7, leak: 2, air: false, baseArmor: 0 },
    splitling: { hp: 22,  speed: 12, bounty: 1, leak: 1, air: false, baseArmor: 0 }
  };
  var GROUND_PTS = [[0, 2], [6, 2], [6, 10], [12, 10], [12, 3], [18, 3], [18, 11], [23, 11]];
  var AIR_PTS = [[0, 6], [21, 6], [21, 11], [23, 11]];
  var GROUND_LEN = 4600;
  var AIR_LEN = 2800;
  var SLOT_TILES = [[3, 3], [5, 5], [7, 4], [7, 8], [9, 9], [10, 5], [11, 8], [13, 8], [14, 5], [15, 2], [16, 7], [17, 4], [19, 8], [20, 10], [22, 9], [3, 7]];

  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return (t ^ (t >>> 14)) >>> 0;
    };
  }

  function fnv1a(str) {
    var h = 0x811c9dc5;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return (h >>> 0).toString(16).padStart(8, "0");
  }

  function pointAlong(air, progress) {
    var pts = air ? AIR_PTS : GROUND_PTS;
    var d = progress;
    for (var i = 0; i < pts.length - 1; i++) {
      var x0 = pts[i][0] * 100 + 50, y0 = pts[i][1] * 100 + 50;
      var x1 = pts[i + 1][0] * 100 + 50, y1 = pts[i + 1][1] * 100 + 50;
      var dx = x1 - x0, dy = y1 - y0;
      var seg = Math.abs(dx) + Math.abs(dy);
      if (d <= seg || i === pts.length - 2) {
        var t = seg > 0 ? d / seg : 0;
        if (t < 0) t = 0;
        if (t > 1) t = 1;
        return [x0 + dx * t, y0 + dy * t];
      }
      d -= seg;
    }
    return [2300, 1100];
  }

  function enemyView(e) {
    return {
      id: e.id, type: e.type, hp: e.hp, maxHp: e.maxHp,
      x: e.x, y: e.y, air: e.air ? 1 : 0, armor: e.armor,
      speed: e.speed, slowed: e.slow, remaining: e.remaining
    };
  }

  function turretView(t) {
    return { slot: t.slot, type: t.type, tier: t.tier, x: t.x, y: t.y, range: t.range };
  }

  function makeTurret(slot, type, tier) {
    var spec = TURRET[type];
    var dmg = spec.damage;
    if (tier >= 2) dmg = Math.floor(dmg * 16 / 10);
    if (tier >= 3) dmg = Math.floor(dmg * 16 / 10);
    return {
      slot: slot, type: type, tier: tier, x: SLOT_TILES[slot][0] * 100 + 50,
      y: SLOT_TILES[slot][1] * 100 + 50, damage: dmg,
      range: spec.range + (tier - 1) * 30, cooldown: 0, spent: 0
    };
  }

  function round2(v) { return Math.round(v * 100) / 100; }

  return function rampartSimulate(createStrategy, seed, maxTicks) {
    var strategy = createStrategy();
    var rng = mulberry32(seed);
    var gold = 250;
    var baseHp = 10;
    var currentWave = 0;
    var nextId = 1;
    var enemies = [];
    var turrets = new Array(16).fill(null);
    var spawnQueue = [];
    var log = [];
    var fallTick = -1;
    var fallBase = null;
    var mScale = [0, 1000];
    var comps = [null, null];
    var maxNeededWave = Math.floor(maxTicks / 40) + 2;
    for (var mi = 2; mi <= maxNeededWave; mi++) {
      mScale[mi] = Math.floor(mScale[mi - 1] * 108 / 100);
    }
    var recordFrames = maxTicks <= 2200;
    var frames = [];
    var fx = [];
    var waveStartTicks = [];

    function scaleHp(w) {
      if (w > mScale.length - 1) {
        for (var k = mScale.length; k <= w; k++) mScale[k] = Math.floor(mScale[k - 1] * 108 / 100);
      }
      return mScale[w];
    }

    function genComposition(w) {
      if (comps[w]) return comps[w].slice();
      var avail = [
        ["grunt", 10, 1], ["runner", 4, 2], ["wisp", 3, 3],
        ["brute", 3, 4], ["splitter", 2, 6], ["mender", 1, 8]
      ].filter(function (a) { return a[2] <= w; });
      var sum = avail.reduce(function (s, a) { return s + a[1]; }, 0);
      var count = 4 + Math.floor(3 * w / 5);
      var list = [];
      for (var i = 0; i < count; i++) {
        var r = rng() % sum;
        for (var j = 0; j < avail.length; j++) {
          if (r < avail[j][1]) { list.push(avail[j][0]); break; }
          r -= avail[j][1];
        }
      }
      comps[w] = list;
      return list.slice();
    }

    function armorOf(type, wave) {
      if (type === "grunt") return Math.floor(wave / 4);
      if (type === "brute") return 6 + wave;
      if (type === "splitling") return 0;
      return 0;
    }

    function spawnEnemy(type, wave, progress) {
      var spec = ENEMY[type];
      var maxHp = type === "splitling" ? 1 : Math.floor(spec.hp * scaleHp(wave) / 1000);
      return spawnEnemyHp(type, wave, progress, maxHp);
    }

    function spawnEnemyHp(type, wave, progress, maxHp) {
      var spec = ENEMY[type];
      var pos = pointAlong(spec.air, progress);
      var routeLen = spec.air ? AIR_LEN : GROUND_LEN;
      var e = {
        id: nextId++, type: type, wave: wave,
        progress: progress, hp: maxHp, maxHp: maxHp,
        armor: armorOf(type, wave), speed: spec.speed,
        slow: 0, age: 0, air: !!spec.air, bounty: spec.bounty, leak: spec.leak,
        routeLen: routeLen, remaining: routeLen - progress,
        x: Math.floor(pos[0]), y: Math.floor(pos[1])
      };
      enemies.push(e);
      return e;
    }

    function rebuildPos(e) {
      var p = pointAlong(e.air, e.progress);
      e.x = Math.floor(p[0]);
      e.y = Math.floor(p[1]);
      e.remaining = e.routeLen - e.progress;
    }

    function startWave(w) {
      var interest = Math.min(50, Math.floor(gold * 5 / 100));
      gold += interest + 10 + 2 * w;
      currentWave = w;
      var comp = comps[w];
      if (!comp) comp = genComposition(w);
      // Generate wave w+1 now, in strict sequence, so plan can preview it.
      if (w + 1 >= comps.length || !comps[w + 1]) genComposition(w + 1);
      var nextWave = (comps[w + 1] || []).slice();
      waveStartTicks.push(w);

      var state = {
        tick: currentTick, wave: w, gold: gold, baseHp: baseHp,
        slots: [], enemies: [], nextWave: nextWave.slice()
      };
      for (var s = 0; s < 16; s++) {
        var t = turrets[s];
        state.slots.push({
          slot: s, x: SLOT_TILES[s][0] * 100 + 50, y: SLOT_TILES[s][1] * 100 + 50,
          turret: t ? { type: t.type, tier: t.tier, spent: t.spent } : null
        });
      }
      for (var ei = 0; ei < enemies.length; ei++) state.enemies.push(enemyView(enemies[ei]));

      var actions = strategy.plan(state);
      if (!Array.isArray(actions)) actions = [];
      var limit = Math.min(32, actions.length);
      for (var ai = 0; ai < limit; ai++) {
        var act = actions[ai];
        if (!act || typeof act !== "object") continue;
        var slot = act.slot;
        if (typeof slot !== "number" || !isFinite(slot)) continue;
        slot = slot | 0;
        if (slot < 0 || slot > 15) continue;
        if (act.op === "build") {
          var type = act.type;
          if (typeof type !== "string" || !Object.prototype.hasOwnProperty.call(TURRET, type)) continue;
          if (turrets[slot]) continue;
          var cost = TURRET[type].cost;
          if (gold < cost) continue;
          gold -= cost;
          var nt = makeTurret(slot, type, 1);
          nt.spent = cost;
          turrets[slot] = nt;
          log.push([currentTick, "B", slot, TYPE_INDEX[type]]);
          if (recordFrames) fx.push({ kind: "build", tick: currentTick, slot: slot, type: type, tier: 1 });
        } else if (act.op === "upgrade") {
          var ut = turrets[slot];
          if (!ut || ut.tier >= 3) continue;
          var baseCost = TURRET[ut.type].cost;
          var upCost = ut.tier === 1 ? baseCost : baseCost * 2;
          if (gold < upCost) continue;
          gold -= upCost;
          ut.tier++;
          ut.spent += upCost;
          var ud = TURRET[ut.type].damage;
          if (ut.tier >= 2) ud = Math.floor(ud * 16 / 10);
          if (ut.tier >= 3) ud = Math.floor(ud * 16 / 10);
          ut.damage = ud;
          ut.range = TURRET[ut.type].range + (ut.tier - 1) * 30;
          log.push([currentTick, "U", slot, ut.tier]);
          if (recordFrames) fx.push({ kind: "upgrade", tick: currentTick, slot: slot, type: ut.type, tier: ut.tier });
        } else if (act.op === "sell") {
          var st = turrets[slot];
          if (!st) continue;
          gold += Math.floor(st.spent * 70 / 100);
          turrets[slot] = null;
          log.push([currentTick, "S", slot, 0]);
          if (recordFrames) fx.push({ kind: "sell", tick: currentTick, slot: slot, type: st.type, tier: st.tier });
        }
      }

      for (var si = 0; si < comp.length; si++) {
        spawnQueue.push({ tick: currentTick + 4 * si, wave: w, index: si, type: comp[si] });
      }
    }

    function killEnemy(e, slot) {
      log.push([currentTick, "K", e.id, slot]);
      gold += e.bounty;
      if (recordFrames) {
        fx.push({ kind: "kill", tick: currentTick, id: e.id, enemyType: e.type, x: e.x, y: e.y,
          air: e.air ? 1 : 0, slot: slot });
      }
      if (e.type === "splitter") {
        var shp = Math.max(1, Math.floor(e.maxHp / 4));
        for (var q = 0; q < 3; q++) {
          var child = spawnEnemyHp("splitling", e.wave, e.progress, shp);
          if (recordFrames) {
            fx.push({ kind: "split", tick: currentTick, id: child.id, x: child.x, y: child.y,
              parentId: e.id });
          }
        }
      }
    }

    function shotAt(t, target, candidates) {
      var spec = TURRET[t.type];
      // Local copies keep strategy code from touching live simulation objects.
      var tv = turretView(t);
      var views = candidates.map(enemyView);
      var chosenId = null;
      if (typeof strategy.target === "function") {
        var ret = strategy.target(tv, views);
        if (typeof ret === "number") chosenId = ret;
      }
      var targetEnemy = null;
      if (chosenId !== null) {
        for (var ci = 0; ci < candidates.length; ci++) {
          if (candidates[ci].id === chosenId) { targetEnemy = candidates[ci]; break; }
        }
      }
      if (!targetEnemy) {
        targetEnemy = candidates[0];
        for (var cj = 1; cj < candidates.length; cj++) {
          var c = candidates[cj];
          if (c.remaining < targetEnemy.remaining ||
              (c.remaining === targetEnemy.remaining && c.id < targetEnemy.id)) {
            targetEnemy = c;
          }
        }
      }
      var tx = targetEnemy.x, ty = targetEnemy.y;
      if (recordFrames) {
        fx.push({
          kind: "shot", tick: currentTick, slot: t.slot, turretType: t.type,
          x: t.x, y: t.y, tx: tx, ty: ty, targetId: targetEnemy.id, air: targetEnemy.air ? 1 : 0, splash: spec.splash
        });
      }
      var hitList = [];
      if (spec.splash > 0) {
        var sr = spec.splash * spec.splash;
        for (var hi = 0; hi < enemies.length; hi++) {
          var he = enemies[hi];
          if (he.air ? !spec.air : !spec.ground) continue;
          var dxs = he.x - tx, dys = he.y - ty;
          if (dxs * dxs + dys * dys <= sr) hitList.push(he);
        }
      } else {
        hitList.push(targetEnemy);
      }
      for (var hj = 0; hj < hitList.length; hj++) {
        var he2 = hitList[hj];
        var dmg = spec.pierce ? t.damage : Math.max(1, t.damage - he2.armor);
        he2.hp -= dmg;
        if (spec.slow > 0) he2.slow = spec.slow;
      }
      t.cooldown = spec.period;
    }

    var currentTick = 0;
    // Generate wave 1 up front. Wave 2 is generated at the wave-1 start.
    comps[1] = genComposition(1);

    if (recordFrames) {
      frames.push(snapshot(0));
      fx.push({ kind: "initial", tick: 0 });
    }

    var i, j, e, t, s;
    for (currentTick = 0; currentTick < maxTicks; currentTick++) {
      // 1. Wave start.
      if (currentTick >= 20 && (currentTick - 20) % 40 === 0) {
        var w = (currentTick - 20) / 40 + 1;
        startWave(w);
      }

      // 2. Spawn, ordered by tick, wave, index.
      var due = [];
      var keep = [];
      for (i = 0; i < spawnQueue.length; i++) {
        if (spawnQueue[i].tick === currentTick) due.push(spawnQueue[i]);
        else if (spawnQueue[i].tick > currentTick) keep.push(spawnQueue[i]);
      }
      due.sort(function (a, b) {
        return a.tick - b.tick || a.wave - b.wave || a.index - b.index;
      });
      spawnQueue = keep;
      for (i = 0; i < due.length; i++) spawnEnemy(due[i].type, due[i].wave, 0);

      // 3. Move in ascending id order.
      var fell = false;
      var still = [];
      for (i = 0; i < enemies.length; i++) {
        e = enemies[i];
        var step = e.slow > 0 ? Math.floor(e.speed * 60 / 100) : e.speed;
        e.progress += step;
        if (e.progress >= e.routeLen) {
          baseHp -= e.leak;
          log.push([currentTick, "L", e.id, baseHp]);
          if (recordFrames) {
            fx.push({ kind: "leak", tick: currentTick, id: e.id, enemyType: e.type,
              x: e.x, y: e.y, air: e.air ? 1 : 0, baseHp: baseHp });
          }
          if (baseHp <= 0) {
            log.push([currentTick, "F", currentWave, 0]);
            fallTick = currentTick;
            fallBase = baseHp;
            fell = true;
            still = still.concat(enemies.slice(i + 1));
            break;
          }
        } else {
          rebuildPos(e);
          still.push(e);
        }
      }
      enemies = still;

      if (!fell) {
        // 4. Age and mend.
        for (i = 0; i < enemies.length; i++) {
          e = enemies[i];
          e.age++;
          if (e.type === "mender" && e.age % 20 === 0) {
            if (recordFrames) fx.push({ kind: "heal", tick: currentTick, x: e.x, y: e.y, radius: 150, id: e.id });
            for (j = 0; j < enemies.length; j++) {
              var he3 = enemies[j];
              var hx = he3.x - e.x, hy = he3.y - e.y;
              if (hx * hx + hy * hy <= 150 * 150) {
                var amount = Math.floor(he3.maxHp * 8 / 100);
                he3.hp = Math.min(he3.maxHp, he3.hp + amount);
              }
            }
          }
        }

        // 5. Turrets fire in ascending slot order.
        for (s = 0; s < 16; s++) {
          t = turrets[s];
          if (!t) continue;
          if (t.cooldown > 0) {
            t.cooldown--;
            if (t.cooldown > 0) continue;
          }
          var spec = TURRET[t.type];
          var cands = [];
          var r2 = t.range * t.range;
          for (i = 0; i < enemies.length; i++) {
            e = enemies[i];
            if (e.air ? !spec.air : !spec.ground) continue;
            var dx = e.x - t.x, dy = e.y - t.y;
            if (dx * dx + dy * dy <= r2) cands.push(e);
          }
          if (cands.length === 0) continue;
          shotAt(t, cands[0], cands);
          // Remove deaths in ascending id order.
          var dead = [];
          for (i = 0; i < enemies.length; i++) if (enemies[i].hp <= 0) dead.push(enemies[i]);
          for (i = 0; i < dead.length; i++) {
            var de = dead[i];
            var idx = enemies.indexOf(de);
            if (idx >= 0) enemies.splice(idx, 1);
            killEnemy(de, s);
          }
        }

        // 6. Slow timers.
        for (i = 0; i < enemies.length; i++) if (enemies[i].slow > 0) enemies[i].slow--;
      }

      if (recordFrames) frames[currentTick] = snapshot(currentTick);
      if (fell) break;
    }

    function snapshot(tick) {
      var fr = {
        tick: tick, wave: currentWave, gold: gold, baseHp: baseHp,
        enemies: [], turrets: []
      };
      for (var q = 0; q < enemies.length; q++) {
        var ee = enemies[q];
        fr.enemies.push({
          id: ee.id, type: ee.type, hp: ee.hp, maxHp: ee.maxHp, x: ee.x, y: ee.y,
          air: ee.air ? 1 : 0, slow: ee.slow, progress: ee.progress, remaining: ee.remaining
        });
      }
      for (var q2 = 0; q2 < 16; q2++) {
        var tt = turrets[q2];
        fr.turrets.push(tt ? { type: tt.type, tier: tt.tier, spent: tt.spent } : null);
      }
      return fr;
    }

    var endTick = fallTick >= 0 ? fallTick : maxTicks;
    var score = round2((endTick - 20) / 40);
    var hash = fnv1a(JSON.stringify(log));
    var result = { score: score, fallTick: fallTick, log: log, hash: hash };
    if (recordFrames) {
      result.frames = frames;
      result.fx = fx;
      result.waveStartTicks = waveStartTicks;
      result.compositions = comps;
    }
    return result;
  };
})();

  function addBeam(mesh, ax, ay, az, bx, by, bz, thickness, color, fade) {

    var len = tmpV1.length();

    boxDummy.scale.set(thickness, len, thickness);
    boxDummy.updateMatrix();
    mesh.setMatrixAt(count, boxDummy.matrix);
    colorTmp.setHex(color).convertSRGBToLinear().multiplyScalar(fade);
    mesh.setColorAt(count, colorTmp);
    beamCounters[mesh.uuid] = count + 1;

  function renderShotsAndRings(simTime, tickNow) {
    beamCounters = {};

    var tickStart = Math.max(0, tickNow - 16);
    for (var t = tickStart; t <= tickNow; t++) {
      var shots = shotsByTick[t];
      if (shots) {
        for (var i = 0; i < shots.length; i++) {
          var sh = shots[i];
          var age = simTime - t / TICK_RATE;
          if (age < 0 || age > 0.15) continue;
          var ax = sh.x / 100, az = sh.y / 100;
          var bx = sh.tx / 100, bz = sh.ty / 100;
          var ay = 0.78;
          var by = sh.air ? 0.9 : 0.23;
          if (sh.turretType === "bolt") {
            addBeam(boltsMesh, ax, ay, az, bx, by, bz, 0.022, 0x9cd8ff, Math.max(0.1, 1 - age / 0.12));
          } else if (sh.turretType === "frost") {
            var f = Math.max(0.1, 1 - age / 0.15);
            addBeam(frostMesh, ax, ay, az, bx, by, bz, 0.045, 0xd6f7ff, f);
            addBeam(frostMesh, ax, ay + 0.04, az, bx, by + 0.04, bz, 0.018, 0xffffff, f * 0.6);
          } else if (sh.turretType === "lance") {
            var lf = Math.max(0.1, 1 - age / 0.15);
            addBeam(lanceMesh, ax, 0.9, az, bx, 0.25, bz, 0.11, 0xff3344, lf);
            addBeam(lanceMesh, ax, 0.9, az, bx, 0.25, bz, 0.035, 0xffd1d1, lf * 0.9);

            var sy = lerp(ay, 0.2, p) + Math.sin(p * Math.PI) * (0.35 + Math.min(1.2, Math.abs(bx - ax) + Math.abs(bz - az)) * 0.12);
            addShell(sx, sy, sz, 0.9 + p * 0.3);
            if (age > 0.085) {
              var bp = clamp((age - 0.085) / 0.065, 0, 1);
              addRing(bx, 0.14, bz, sh.splash / 100 * (0.7 + bp * 0.3), 0xffa45a, (1 - bp) * 0.9);

        setScrubber(simTime);
        setPlayUI(true);
        AudioSys.resume();
        AudioSys.setActive(true, simTime);
        renderAt(simTime);
      } else {
        simTime = 0;
        scrubber.value = "0";
        showCountdownNumber(3 - Math.floor(countdownElapsed));
        AudioSys.setActive(false, simTime);
        renderAt(0);
      }
    } else if (state === STATE.PLAYING) {
      AudioSys.setActive(true, simTime);
      var old = simTime;
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      setScrubber(simTime);
      triggerAudio(old, simTime);
      renderAt(simTime);
      if (simTime >= DURATION) {
        simTime = DURATION;
        setScrubber(DURATION);
        renderAt(DURATION);
        state = STATE.ENDED;
        setPlayUI(false);
        AudioSys.setActive(false, simTime);
      }
    } else if (state === STATE.REFIRE_HOLD) {
      holdElapsed += dt;
      simTime = 0;
      scrubber.value = "0";
      AudioSys.setActive(false, 0);
      renderAt(0);
      if (holdElapsed >= 1.0) {
        state = STATE.PLAYING;
        setPlayUI(true);
        AudioSys.resume();
        AudioSys.setActive(true, 0);
      }
    } else if (state === STATE.PAUSED) {
      AudioSys.setActive(false, simTime);
      renderAt(simTime);
    } else if (state === STATE.ENDED) {
      AudioSys.setActive(false, simTime);
      renderAt(DURATION);
    }
  }

  // Initial resting frame, then the countdown begins on the first RAF.
  showCountdownNumber(3);
  setPlayUI(true);
  scrubber.value = "0";
  renderAt(0);
  requestAnimationFrame(frame);
})();

});
</script>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="100" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>
</body>
</html>
