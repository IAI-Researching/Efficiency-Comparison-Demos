<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title></title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="100" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script id="rampart-strategy">
function createStrategy() {
  "use strict";
  var COSTS = { bolt: 50, cannon: 90, frost: 70, lance: 120, flak: 80 };
  var BASE_DAMAGE = { bolt: 26, cannon: 60, frost: 10, lance: 180, flak: 40 };
  var SPLASH = { cannon: 90, flak: 70 };
  var THREAT = { grunt: 1, runner: 1, wisp: 1.4, brute: 2.6, splitter: 1.6, mender: 1.8, splitling: 0.8 };
  var BUILD = [
    [5, "cannon"], [3, "cannon"], [14, "flak"], [9, "cannon"], [8, "cannon"],
    [12, "flak"], [2, "cannon"], [13, "cannon"], [1, "cannon"], [11, "cannon"],
    [10, "flak"], [7, "cannon"], [4, "flak"], [0, "flak"], [6, "cannon"], [15, "bolt"]
  ];
  var UPGRADE = [3, 1, 6, 9, 2, 7, 14, 15, 12, 13, 11, 8, 10, 0, 5, 4];

  function tierDamage(type, tier) {
    var d = BASE_DAMAGE[type];
    for (var i = 1; i < tier; i++) d = Math.floor(d * 16 / 10);
    return d;
  }

  function plan(state) {
    var actions = [];
    var gold = state.gold;
    var order = [];
    for (var i = 0; i < BUILD.length; i++) {
      order.push({ kind: "build", slot: BUILD[i][0], type: BUILD[i][1] });
      if (i + 1 === 14) {
        for (var j = 0; j < 2; j++) order.push({ kind: "upgrade", slot: UPGRADE[j] });
      }
    }
    for (var u = 0; u < UPGRADE.length; u++) order.push({ kind: "upgrade", slot: UPGRADE[u] });

    for (var a = 0; a < order.length && actions.length < 32; a++) {
      var step = order[a];
      var slotView = state.slots[step.slot];
      if (!slotView) continue;
      if (step.kind === "build") {
        var cost = COSTS[step.type];
        if (!slotView.turret && gold >= cost) {
          actions.push({ op: "build", slot: step.slot, type: step.type });
          gold -= cost;
        }
      } else {
        var turret = slotView.turret;
        if (!turret || turret.tier >= 3) continue;
        var upgradeCost = COSTS[turret.type] * (turret.tier === 1 ? 1 : 2);
        if (gold >= upgradeCost) {
          actions.push({ op: "upgrade", slot: step.slot });
          gold -= upgradeCost;
        }
      }
    }
    return actions;
  }

  function target(turret, candidates) {
    var type = turret.type;
    if (type === "cannon" || type === "flak") {
      var isCannon = type === "cannon";
      var dmg = tierDamage(type, turret.tier);
      var radius = SPLASH[type];
      var radius2 = radius * radius;
      var tie = isCannon ? 1 : 1;
      var menderWeight = isCannon ? 64 : 16;
      var best = candidates[0];
      var bestValue = -Infinity;
      for (var i = 0; i < candidates.length; i++) {
        var center = candidates[i];
        var value = 0;
        for (var j = 0; j < candidates.length; j++) {
          var other = candidates[j];
          var dx = other.x - center.x;
          var dy = other.y - center.y;
          if (dx * dx + dy * dy > radius2) continue;
          var effective = Math.max(1, dmg - other.armor);
          var amount = Math.min(other.hp, effective);
          var weight = THREAT[other.type];
          if (other.type === "mender") weight *= menderWeight;
          else if (other.type === "splitter") weight *= 1;
          else if (other.type === "brute") weight *= 1;
          else if (other.type === "wisp") weight *= 0.5;
          value += amount * weight;
        }
        var score = value * (1 + 1000 / (center.remaining + 300)) - center.remaining * tie;
        if (score > bestValue) { bestValue = score; best = center; }
      }
      return best.id;
    }

    if (type === "lance") {
      var lb = candidates[0];
      var lv = Infinity;
      for (var k = 0; k < candidates.length; k++) {
        var e = candidates[k];
        var score2 = e.hp + e.remaining * 10;
        if (e.type === "mender") score2 -= 0;
        if (e.type === "brute") score2 -= 0;
        if (score2 < lv) { lv = score2; lb = e; }
      }
      return lb.id;
    }

    var boltBest = candidates[0];
    var boltValue = -Infinity;
    for (var b = 0; b < candidates.length; b++) {
      var c = candidates[b];
      var v = c.speed * 75 - c.remaining;
      if (c.type === "mender") v += 5000;
      if (v > boltValue) { boltValue = v; boltBest = c; }
    }
    return boltBest.id;
  }

  return { plan: plan, target: target };
}

</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks, recorder) {
  "use strict";
  function mulberry32(a) { return function () {
    a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return (t ^ (t >>> 14)) >>> 0; }; }

  var TYPE_NAMES = ["bolt", "cannon", "frost", "lance", "flak"];
  var TURRET_DEFS = {
    bolt:   { cost: 50,  damage: 26,  period: 8,  range: 300, splash: 0,  slow: 0,  pierce: false, ground: true,  air: true  },
    cannon: { cost: 90,  damage: 60,  period: 24, range: 260, splash: 90, slow: 0,  pierce: false, ground: true,  air: false },
    frost:  { cost: 70,  damage: 10,  period: 12, range: 240, splash: 0,  slow: 30, pierce: false, ground: true,  air: true  },
    lance:  { cost: 120, damage: 180, period: 36, range: 360, splash: 0,  slow: 0,  pierce: true,  ground: true,  air: false },
    flak:   { cost: 80,  damage: 40,  period: 10, range: 320, splash: 70, slow: 0,  pierce: false, ground: false, air: true  }
  };
  var TYPE_INDEX = { bolt: 0, cannon: 1, frost: 2, lance: 3, flak: 4 };
  var ENEMY_DEFS = {
    grunt:    { hp: 60,  speed: 10, armour: 0, bounty: 4, leak: 1, air: false, first: 1, weight: 10 },
    runner:   { hp: 40,  speed: 20, armour: 0, bounty: 4, leak: 1, air: false, first: 2, weight: 4  },
    wisp:     { hp: 50,  speed: 12, armour: 0, bounty: 6, leak: 2, air: true,  first: 3, weight: 3  },
    brute:    { hp: 150, speed: 6,  armour: 0, bounty: 9, leak: 3, air: false, first: 4, weight: 3  },
    splitter: { hp: 90,  speed: 8,  armour: 0, bounty: 6, leak: 2, air: false, first: 6, weight: 2  },
    mender:   { hp: 70,  speed: 8,  armour: 0, bounty: 7, leak: 2, air: false, first: 8, weight: 1  },
    splitling:{ hp: 1,   speed: 12, armour: 0, bounty: 1, leak: 1, air: false, first: 99, weight: 0 }
  };
  var ENEMY_ORDER = ["grunt", "runner", "wisp", "brute", "splitter", "mender"];
  var SLOT_TILES = [[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],[14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]];

  var GROUND_SEGS = [
    { x0: 50,  y0: 250, len: 600, axis: 0 },
    { x0: 650, y0: 250, len: 800, axis: 1 },
    { x0: 650, y0: 1050, len: 600, axis: 0 },
    { x0: 1250, y0: 1050, len: 700, axis: 1, dir: -1 },
    { x0: 1250, y0: 350, len: 600, axis: 0 },
    { x0: 1850, y0: 350, len: 800, axis: 1 },
    { x0: 1850, y0: 1150, len: 500, axis: 0 }
  ];
  var AIR_SEGS = [
    { x0: 50,  y0: 650, len: 2100, axis: 0 },
    { x0: 2150, y0: 650, len: 500, axis: 1 },
    { x0: 2150, y0: 1150, len: 200, axis: 0 }
  ];
  var GROUND_LEN = 4600;
  // Spec text says 2600. Development can force that interpretation.
  var AIR_LEN = 2800;

  function routePos(air, progress) {
    var segs = air ? AIR_SEGS : GROUND_SEGS;
    var total = air ? AIR_LEN : GROUND_LEN;
    var p = progress;
    if (p < 0) p = 0;
    if (p > total) p = total;
    var acc = 0;
    for (var i = 0; i < segs.length; i++) {
      var s = segs[i];
      if (p <= acc + s.len) {
        var d = p - acc;
        if (s.axis === 0) return [s.x0 + (s.dir || 1) * d, s.y0];
        return [s.x0, s.y0 + (s.dir || 1) * d];
      }
      acc += s.len;
    }
    var last = segs[segs.length - 1];
    if (last.axis === 0) return [last.x0 + (last.dir || 1) * last.len, last.y0];
    return [last.x0, last.y0 + (last.dir || 1) * last.len];
  }

  var hpScale = [0, 1000];
  function ensureScale(w) {
    while (hpScale.length <= w) hpScale.push(Math.floor(hpScale[hpScale.length - 1] * 108 / 100));
  }
  function maxHpFor(type, wave) {
    ensureScale(wave);
    if (type === "splitling") return 1;
    return Math.floor(ENEMY_DEFS[type].hp * hpScale[wave] / 1000);
  }

  var gen = mulberry32(seed);
  function generateWave(w) {
    var elig = [], sum = 0;
    for (var i = 0; i < ENEMY_ORDER.length; i++) {
      var t = ENEMY_ORDER[i];
      if (ENEMY_DEFS[t].first <= w) { elig.push(t); sum += ENEMY_DEFS[t].weight; }
    }
    var n = 4 + Math.floor(3 * w / 5);
    var out = [];
    for (var j = 0; j < n; j++) {
      var r = gen() % sum;
      for (var k = 0; k < elig.length; k++) {
        r -= ENEMY_DEFS[elig[k]].weight;
        if (r < 0) { out.push(elig[k]); break; }
      }
    }
    return out;
  }

  var strategy = createStrategy();
  var log = [];
  var tick = 0;
  var gold = 250;
  var baseHp = 10;
  var wave = 1;
  var currentWave = 1;
  var enemies = [];
  var nextId = 1;
  var slots = [];
  for (var si = 0; si < 16; si++) {
    slots.push({ slot: si, x: SLOT_TILES[si][0], y: SLOT_TILES[si][1], turret: null });
  }
  var spawnBuckets = new Map();
  var nextWave = generateWave(1);
  var fallTick = -1;
  var stop = false;

  function captureSnapshot() {
    if (!recorder) return;
    var sl = [];
    for (var i = 0; i < 16; i++) {
      var t = slots[i].turret;
      sl.push(t ? { type: t.type, tier: t.tier } : null);
    }
    var ev = [];
    for (var j = 0; j < enemies.length; j++) {
      var e = enemies[j];
      ev.push({ id: e.id, type: e.type, hp: e.hp, maxHp: e.maxHp, x: e.x, y: e.y,
        air: e.air, slow: e.slow, wave: e.wave, armor: e.armor, progress: e.progress });
    }
    recorder.snapshot({ tick: tick, wave: currentWave, gold: gold, baseHp: baseHp,
      nextWave: nextWave.slice(), slots: sl, enemies: ev });
  }

  function enemyView(e) {
    return {
      id: e.id, type: e.type, hp: e.hp, maxHp: e.maxHp,
      x: e.x, y: e.y, air: e.air, armor: e.armor,
      speed: e.speed, slowed: e.slow > 0 ? 1 : 0, remaining: e.length - e.progress
    };
  }
  function buildState() {
    var sl = [];
    for (var i = 0; i < 16; i++) {
      var t = slots[i].turret;
      sl.push({ slot: slots[i].slot, x: slots[i].x, y: slots[i].y,
        turret: t ? { type: t.type, tier: t.tier, spent: t.spent } : null });
    }
    var ev = [];
    for (var j = 0; j < enemies.length; j++) ev.push(enemyView(enemies[j]));
    return { tick: tick, wave: currentWave, gold: gold, baseHp: baseHp, slots: sl, enemies: ev, nextWave: nextWave.slice() };
  }

  function applyPlan(actions) {
    if (!actions || typeof actions.length !== "number") return;
    var lim = Math.min(actions.length, 32);
    for (var i = 0; i < lim; i++) {
      var act = actions[i];
      if (!act || typeof act !== "object") continue;
      var op = act.op;
      var slot = act.slot;
      if (typeof slot !== "number" || slot < 0 || slot >= 16 || Math.floor(slot) !== slot) continue;
      if (op === "build") {
        var def = TURRET_DEFS[act.type];
        if (!def || slots[slot].turret || gold < def.cost) continue;
        gold -= def.cost;
        slots[slot].turret = {
          type: act.type, tier: 1, spent: def.cost, damage: def.damage,
          range: def.range, period: def.period, splash: def.splash,
          slow: def.slow, pierce: def.pierce, ground: def.ground, air: def.air, cd: 0
        };
        log.push([tick, "B", slot, TYPE_INDEX[act.type]]);
      } else if (op === "upgrade") {
        var tu = slots[slot].turret;
        if (!tu || tu.tier >= 3) continue;
        var cost = TURRET_DEFS[tu.type].cost * (tu.tier === 1 ? 1 : 2);
        if (gold < cost) continue;
        gold -= cost;
        tu.spent += cost;
        tu.tier += 1;
        tu.damage = Math.floor(tu.damage * 16 / 10);
        tu.range += 30;
        log.push([tick, "U", slot, tu.tier]);
      } else if (op === "sell") {
        var ts = slots[slot].turret;
        if (!ts) continue;
        gold += Math.floor(ts.spent * 70 / 100);
        slots[slot].turret = null;
        log.push([tick, "S", slot, 0]);
      }
    }
  }

  function spawnEnemy(type, w, progressOverride, hpOverride) {
    var def = ENEMY_DEFS[type];
    var air = !!def.air;
    var progress = progressOverride === undefined ? 0 : progressOverride;
    var maxHp = hpOverride === undefined ? maxHpFor(type, w) : hpOverride;
    var pos = routePos(air, progress);
    var e = {
      id: nextId++, type: type, wave: w, hp: maxHp, maxHp: maxHp,
      progress: progress, speed: def.speed, air: air ? 1 : 0,
      armor: type === "grunt" ? Math.floor(w / 4) : (type === "brute" ? 6 + w : 0),
      bounty: def.bounty, leak: def.leak, age: 0, slow: 0,
      length: air ? AIR_LEN : GROUND_LEN,
      x: pos[0], y: pos[1]
    };
    enemies.push(e);
    return e;
  }

  function killEnemy(idx, slotIdx) {
    var e = enemies[idx];
    if (recorder) recorder.kill({ tick: tick, id: e.id, type: e.type, x: e.x, y: e.y,
      wave: e.wave, maxHp: e.maxHp, hp: e.hp });
    enemies.splice(idx, 1);
    gold += e.bounty;
    log.push([tick, "K", e.id, slotIdx]);
    if (e.type === "splitter") {
      var shp = Math.max(1, Math.floor(e.maxHp / 4));
      for (var k = 0; k < 3; k++) {
        var sp = spawnEnemy("splitling", e.wave, e.progress, shp);
      }
    }
  }

  function processDeaths(slotIdx) {
    var deadIds = [];
    for (var i = 0; i < enemies.length; i++) if (enemies[i].hp <= 0) deadIds.push(enemies[i].id);
    deadIds.sort(function (a, b) { return a - b; });
    for (var d = 0; d < deadIds.length; d++) {
      var idx = -1;
      for (var j = 0; j < enemies.length; j++) if (enemies[j].id === deadIds[d]) { idx = j; break; }
      if (idx >= 0) killEnemy(idx, slotIdx);
    }
  }

  var turretViewCache = [];
  for (var ci = 0; ci < 16; ci++) {
    turretViewCache.push({ slot: ci, type: "", tier: 0, x: SLOT_TILES[ci][0], y: SLOT_TILES[ci][1], range: 0 });
  }

  while (tick < maxTicks && !stop) {
    // 1. Wave start (before anything else this tick)
    if (tick === 20 + 40 * (wave - 1)) {
      currentWave = wave;
      var interest = Math.min(50, Math.floor(gold * 5 / 100));
      gold += interest + 10 + 2 * wave;
      var currentComp = nextWave;
      nextWave = generateWave(wave + 1);
      var actions = null;
      try { actions = strategy.plan(buildState()); } catch (err) { actions = []; }
      applyPlan(actions);
      for (var i = 0; i < currentComp.length; i++) {
        var st = tick + 4 * i;
        if (!spawnBuckets.has(st)) spawnBuckets.set(st, []);
        spawnBuckets.get(st).push({ tick: st, wave: wave, index: i, type: currentComp[i] });
      }
      wave += 1;
    }

var cameraBasePos = new THREE.Vector3();
var cameraBaseTarget = new THREE.Vector3(12, 0, 7);
var boardCorners = [];
for (var bx = 0; bx <= 24; bx += 24) {
  for (var bz = 0; bz <= 14; bz += 14) boardCorners.push(new THREE.Vector3(bx, 0, bz));
}
boardCorners.push(new THREE.Vector3(23.7, 2.1, 11.5));
var frameCorner = new THREE.Vector3();

function frameCamera() {
  var w = window.innerWidth, h = window.innerHeight;
  var aspect = w / Math.max(1, h);
  camera.aspect = aspect;
  camera.fov = 38;
  var elevation = 55 * Math.PI / 180;
  var dist = 17;
  var bottomLimit = -0.63;
  var topLimit = 0.95;
  var sideLimit = 0.955;
  var bestDist = dist;
  for (var iter = 0; iter < 80; iter++) {
    camera.position.set(12, Math.sin(elevation) * dist, 7 + Math.cos(elevation) * dist);
    camera.lookAt(12, 0, 7);
    camera.updateProjectionMatrix();
    camera.updateMatrixWorld(true);
    var fit = true;
    for (var i = 0; i < boardCorners.length; i++) {
      frameCorner.copy(boardCorners[i]).project(camera);
      if (frameCorner.x < -sideLimit || frameCorner.x > sideLimit || frameCorner.y < bottomLimit || frameCorner.y > topLimit) { fit = false; break; }
    }
    if (fit) { bestDist = dist; break; }
    bestDist = dist;
    dist *= 1.055;
  }
  cameraBasePos.set(12, Math.sin(elevation) * bestDist, 7 + Math.cos(elevation) * bestDist);
  cameraBaseTarget.set(12, 0, 7);
  camera.position.copy(cameraBasePos);
  camera.lookAt(cameraBaseTarget);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
}
frameCamera();

/* ------------------------------------------------------------------ */
/* Replay state accessors                                              */
/* ------------------------------------------------------------------ */
function snapshotAt(tick) {
  if (tick < 0) tick = 0;
  if (tick > lastSnapshotTick) tick = lastSnapshotTick;
  return snapshots[tick];
}
function stateAt(simTime) {
  var sampleTime = simTime;
  if (FALL_TICK >= 0 && simTime >= FALL_TIME) sampleTime = FALL_TIME;
  var rawTick = Math.floor(sampleTime * TICKS_PER_SECOND + 1e-9);
  var tick = Math.max(0, Math.min(lastSnapshotTick, rawTick));
  var frac = sampleTime * TICKS_PER_SECOND - rawTick;
  if (FALL_TICK >= 0 && tick >= FALL_TICK) { tick = Math.min(FALL_TICK, lastSnapshotTick); frac = 0; }
  if (frac < 0) frac = 0; else if (frac > 1) frac = 1;
  var a = snapshotAt(tick);
  var b = snapshotAt(Math.min(lastSnapshotTick, tick + 1));
  return { tick: tick, frac: frac, a: a, b: b, sampleTime: sampleTime };
}

function enemyHeading(aEnemy, bEnemy, tick, id) {
  var dx = 0, dz = 0;
  if (bEnemy) { dx = bEnemy.x - aEnemy.x; dz = bEnemy.y - aEnemy.y; }
  if (dx * dx + dz * dz < 0.0001) {
    var prev = snapshotAt(tick - 1);
    if (prev) {
      for (var i = 0; i < prev.enemies.length; i++) {
        if (prev.enemies[i].id === id) {
          dx = aEnemy.x - prev.enemies[i].x;
          dz = aEnemy.y - prev.enemies[i].y;
          break;
        }
      }
    }
  }
  if (dx * dx + dz * dz < 0.000001) return 0;
  return Math.atan2(dx, dz);
}

function addBodyInstance(type, pos, quat, scale) {
  var mesh = enemyBodyMeshes[type];
  var count = enemyBodyCount[type];
  if (count >= MAX_ENEMIES) return;
  enemyDummy.position.copy(pos);
  enemyDummy.quaternion.copy(quat);
  enemyDummy.scale.copy(scale);
  enemyDummy.updateMatrix();
  mesh.setMatrixAt(count, enemyDummy.matrix);
  mesh.instanceMatrix.needsUpdate = true;
  enemyBodyCount[type] = count + 1;
}

  for (var i = 0; i < a.enemies.length; i++) {
    var e = a.enemies[i];
    var be = bMap.get(e.id);
    var sx = e.x, sy = e.y;

    /* health bar, camera-facing */
    var typeBarFill = enemyBarFills[e.type];
    var typeBarCount = enemyBarFillCounts[e.type] || 0;
    var barW = 0.62;
    var barY = baseY + style.barY + (isAir ? 0.04 : 0);
    var ratio = Math.max(0, Math.min(1, e.hp / Math.max(1, e.maxHp)));
    healthDummy.position.set(wx, barY, wz);
    healthDummy.quaternion.copy(camera.quaternion);
    healthDummy.scale.set(barW, 0.15, 1);
    healthDummy.updateMatrix();
    if (enemyBarBgCount < MAX_ENEMIES) { enemyBarBg.setMatrixAt(enemyBarBgCount++, healthDummy.matrix); }
    if (ratio > 0) {
      healthDummy.position.set(wx - barW * (1 - ratio) * 0.5, barY, wz);
      healthDummy.quaternion.copy(camera.quaternion);
      healthDummy.scale.set(barW * ratio, 0.095, 1);
      healthDummy.updateMatrix();
      if (typeBarCount < MAX_ENEMIES && typeBarFill) { typeBarFill.setMatrixAt(typeBarCount++, healthDummy.matrix); enemyBarFillCounts[e.type] = typeBarCount; }
    }
  }

  for (var ot = 0; ot < ENEMY_ORDER.length; ot++) {
    var otype = ENEMY_ORDER[ot];
    enemyBodyMeshes[otype].count = enemyBodyCount[otype];
    enemyBodyMeshes[otype].instanceMatrix.needsUpdate = true;
  }
  gruntShieldMesh.count = enemyPartCount.grunt || 0;
  gruntShieldMesh.instanceMatrix.needsUpdate = true;
  brutePlateMesh.count = enemyPlateCount;
  brutePlateMesh.instanceMatrix.needsUpdate = true;
  splitterBudMesh.count = enemyPartCount.splitter || 0;
  splitterBudMesh.instanceMatrix.needsUpdate = true;
  enemyGlowMesh.count = enemyGlowCount; enemyGlowMesh.instanceMatrix.needsUpdate = true;
  enemyHaloMesh.count = enemyHaloCount; enemyHaloMesh.instanceMatrix.needsUpdate = true;
  enemySlowMesh.count = enemySlowCount; enemySlowMesh.instanceMatrix.needsUpdate = true;
  enemyShadowMesh.count = enemyShadowCount; enemyShadowMesh.instanceMatrix.needsUpdate = true;
  enemyBarBg.count = enemyBarBgCount; enemyBarBg.instanceMatrix.needsUpdate = true;
  for (var fbo = 0; fbo < ENEMY_ORDER.length; fbo++) {
    var ftype = ENEMY_ORDER[fbo];
    var fmesh = enemyBarFills[ftype];
    if (fmesh) { fmesh.count = enemyBarFillCounts[ftype] || 0; fmesh.instanceMatrix.needsUpdate = true; }
  }
}

}

function disposeGroup(group) {
  group.traverse(function (obj) {
    if (obj.geometry && obj.geometry.dispose) obj.geometry.dispose();
  });
}

function updateTurrets(state, sceneTime) {
  for (var i = 0; i < 16; i++) {
    var tView = state.a.slots[i];
    var existing = turretGroups[i];
    if (!tView) {
      if (existing) { scene.remove(existing); disposeGroup(existing); turretGroups[i] = null; }
      continue;
    }
    if (!existing || existing.userData.turretType !== tView.type || existing.userData.turretTier !== tView.tier) {
      if (existing) { scene.remove(existing); disposeGroup(existing); }
      var group = makeTurretModel(tView.type, tView.tier);
      group.position.set(SLOT_TILES[i][0] + 0.5, 0.17, SLOT_TILES[i][1] + 0.5);
      scene.add(group);
      turretGroups[i] = group;
      existing = group;
    }
    var recent = 0;
    for (var st = state.tick - 2; st <= state.tick; st++) {
      var shotList = shotsByTick.get(st);
      if (!shotList) continue;
      for (var s = 0; s < shotList.length; s++) {
        if (shotList[s].slot === i) {
          var age = sceneTime - shotList[s].tick / TICKS_PER_SECOND;
          if (age >= 0 && age < 0.14) recent = Math.max(recent, 1 - age / 0.14);
        }
      }
    }
    var baseY = 0.17;
    existing.position.y = baseY - Math.sin(recent * Math.PI) * 0.035;
    var pipPulse = 1 + Math.sin(sceneTime * 4.2 + i) * 0.1;
    for (var child = 0; child < existing.children.length; child++) {
      var ch = existing.children[child];
      if (ch.geometry && ch.geometry.type === "SphereGeometry" && ch.material === pipMat) {
        ch.scale.setScalar(pipPulse);
      }
    }
  }
}

var effects = {};
var beamGeo = new THREE.BoxGeometry(1, 1, 1);
var sphereGeo = new THREE.SphereGeometry(0.12, 8, 6);
var ringGeo = new THREE.TorusGeometry(1, 0.045, 6, 30);
ringGeo.rotateX(Math.PI / 2);
var sparkGeo = new THREE.OctahedronGeometry(0.055, 0);
var stoneChipGeo = new THREE.BoxGeometry(0.14, 0.1, 0.11);
var debrisGeo = new THREE.TetrahedronGeometry(0.07);
function effectMaterial(color, opacity) {
  return new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: opacity, blending: THREE.AdditiveBlending, depthWrite: false });
}
function effectInst(geo, mat, max) { return makeInstanced(geo, mat, max, false); }
effects.beamBolt = effectInst(beamGeo, effectMaterial(0x9ed7ff, 0.85), 160);
effects.beamFrost = effectInst(beamGeo, effectMaterial(0xd9fbff, 0.75), 160);
effects.beamLance = effectInst(beamGeo, effectMaterial(0xff334f, 0.95), 120);
effects.beamFlak = effectInst(beamGeo, effectMaterial(0x54efdc, 0.8), 160);
effects.shell = effectInst(sphereGeo, effectMaterial(0xffb96b, 0.95), 80);
effects.flash = effectInst(sphereGeo, effectMaterial(0xffbfc5, 0.88), 80);
effects.ringCannon = effectInst(ringGeo, new THREE.MeshBasicMaterial({ color: 0xffa45a, transparent: true, opacity: 0.8, depthWrite: false }), 80);
effects.ringFlak = effectInst(ringGeo, new THREE.MeshBasicMaterial({ color: 0x3fe8d2, transparent: true, opacity: 0.85, depthWrite: false }), 80);
effects.ringHeal = effectInst(ringGeo, new THREE.MeshBasicMaterial({ color: 0x65ff92, transparent: true, opacity: 0.7, depthWrite: false }), 60);
effects.ringAction = effectInst(ringGeo, new THREE.MeshBasicMaterial({ color: 0xffdd74, transparent: true, opacity: 0.65, depthWrite: false }), 80);
effects.ringActionBlue = effectInst(ringGeo, new THREE.MeshBasicMaterial({ color: 0x73cfff, transparent: true, opacity: 0.65, depthWrite: false }), 80);
effects.ringShock = effectInst(ringGeo, new THREE.MeshBasicMaterial({ color: 0xffe6b0, transparent: true, opacity: 0.85, depthWrite: false }), 8);
effects.sparkle = effectInst(sparkGeo, effectMaterial(0xfff0b2, 0.9), 360);
effects.sparkleBlue = effectInst(sparkGeo, effectMaterial(0x8de5ff, 0.85), 200);
effects.chips = effectInst(stoneChipGeo, new THREE.MeshStandardMaterial({ color: 0x5a5b57, roughness: 0.95 }), 500);
var debrisMeshes = {};
var debrisColors = { grunt: 0x7b8c67, runner: 0xe9c74c, wisp: 0x58e4f2, brute: 0x52565b, splitter: 0x9d5ed0, mender: 0xeeeeea, splitling: 0xb78ae2 };
for (var dt = 0; dt < ENEMY_ORDER.length; dt++) {
  var dtype = ENEMY_ORDER[dt];
  debrisMeshes[dtype] = effectInst(debrisGeo, new THREE.MeshStandardMaterial({ color: debrisColors[dtype], roughness: 0.8, emissive: dtype === "wisp" ? 0x18545a : 0x000000, emissiveIntensity: dtype === "wisp" ? 0.6 : 0 }), 260);
}
var effectDummy = new THREE.Object3D();
var effectCounts = {};
var Z_AXIS = new THREE.Vector3(0, 0, 1);
function resetEffects() {
  for (var k in effects) { effects[k].count = 0; }
  for (var d in debrisMeshes) { debrisMeshes[d].count = 0; }
  effectCounts = {};
}
function addEffect(name, pos, quat, scale) {
  var mesh = effects[name];
  if (!mesh) return;
  var c = effectCounts[name] || 0;
  if (c >= mesh.instanceMatrix.count) return;
  effectDummy.position.copy(pos);
  effectDummy.quaternion.copy(quat || new THREE.Quaternion());
  effectDummy.scale.copy(scale || new THREE.Vector3(1, 1, 1));
  effectDummy.updateMatrix();
  mesh.setMatrixAt(c, effectDummy.matrix);
  effectCounts[name] = c + 1;
}
function addDebris(type, pos, quat, scale) {
  var mesh = debrisMeshes[type];
  if (!mesh) return;
  var c = effectCounts["debris_" + type] || 0;
  if (c >= mesh.instanceMatrix.count) return;
  effectDummy.position.copy(pos);
  effectDummy.quaternion.copy(quat || new THREE.Quaternion());
  effectDummy.scale.copy(scale || new THREE.Vector3(1, 1, 1));
  effectDummy.updateMatrix();
  mesh.setMatrixAt(c, effectDummy.matrix);
  effectCounts["debris_" + type] = c + 1;
}
function beamBetween(name, from, to, thickness) {
  var dx = to.x - from.x, dy = to.y - from.y, dz = to.z - from.z;
  var len = Math.sqrt(dx * dx + dy * dy + dz * dz);
  if (len < 0.001) return;
  var quat = new THREE.Quaternion().setFromUnitVectors(Z_AXIS, new THREE.Vector3(dx / len, dy / len, dz / len));
  var mid = new THREE.Vector3((from.x + to.x) / 2, (from.y + to.y) / 2, (from.z + to.z) / 2);
  addEffect(name, mid, quat, new THREE.Vector3(thickness, thickness, len));
}

  for (var k in effects) {
    var m = effects[k];
    m.count = effectCounts[k] || 0;
    m.instanceMatrix.needsUpdate = true;
  }
  for (var d in debrisMeshes) {
    var dm = debrisMeshes[d];
    dm.count = effectCounts["debris_" + d] || 0;
    dm.instanceMatrix.needsUpdate = true;
  }
}

function renderShotsAndHeals(sceneTime) {
  var baseTick = Math.floor(sceneTime * TICKS_PER_SECOND + 1e-9);
  for (var tick = baseTick - 3; tick <= baseTick; tick++) {
    var shots = shotsByTick.get(tick);
    if (shots) {
      for (var i = 0; i < shots.length; i++) {
        var sh = shots[i];
        var age = sceneTime - tick / TICKS_PER_SECOND;
        if (age < 0 || age > 0.15) continue;
        var targetAir = sh.targetType === "wisp";
        var from = new THREE.Vector3(sh.x / 100, 0.39, sh.y / 100);
        var to = new THREE.Vector3(sh.targetX / 100, targetAir ? 0.94 : 0.42, sh.targetY / 100);
        if (sh.type === "bolt") {
          beamBetween("beamBolt", from, to, 0.017);
        } else if (sh.type === "frost") {
          beamBetween("beamFrost", from, to, 0.035);
        } else if (sh.type === "lance") {
          beamBetween("beamLance", from, to, 0.075 + sh.tier * 0.012);
          if (age < 0.1) addEffect("flash", to, null, new THREE.Vector3(1.5, 1.5, 1.5));
        } else if (sh.type === "cannon") {
          var u = Math.min(1, age / 0.095);
          var shellPos = from.clone().lerp(to, u);
          shellPos.y += Math.sin(Math.PI * u) * 0.82;
          addEffect("shell", shellPos, null, new THREE.Vector3(1, 1, 1));
          if (age >= 0.075) {
            var rr = sh.splash / 100;
            var grow = Math.min(1, (age - 0.075) / 0.07);
            var ringPos = new THREE.Vector3(to.x, 0.08, to.z);
            addEffect("ringCannon", ringPos, null, new THREE.Vector3(rr * (0.3 + grow * 0.7), 1, rr * (0.3 + grow * 0.7)));
          }
        } else if (sh.type === "flak") {
          beamBetween("beamFlak", from, new THREE.Vector3(to.x, targetAir ? 0.94 : 0.8, to.z), 0.025);
          if (age >= 0.035) {
            var fr = sh.splash / 100;
            var fgrow = Math.min(1, (age - 0.035) / 0.115);
            var fpos = new THREE.Vector3(to.x, targetAir ? 0.9 : 0.72, to.z);
            addEffect("ringFlak", fpos, null, new THREE.Vector3(fr * (0.28 + fgrow * 0.8), 1, fr * (0.28 + fgrow * 0.8)));
          }
        }
      }
    }
    var heals = healsByTick.get(tick);
    if (heals) {
      for (var h = 0; h < heals.length; h++) {
        var heal = heals[h];
        var hage = sceneTime - tick / TICKS_PER_SECOND;
        if (hage < 0 || hage > 0.7) continue;
        var grow2 = hage / 0.7;
        var hp = new THREE.Vector3(heal.x / 100, 0.055, heal.y / 100);
        var hr = 1.5 * (0.12 + grow2 * 0.98);
        addEffect("ringHeal", hp, null, new THREE.Vector3(hr, 1, hr));
      }
    }
  }
}

function renderKillDebris(sceneTime) {
  var baseTick = Math.floor(sceneTime * TICKS_PER_SECOND + 1e-9);
  for (var tick = baseTick - 18; tick <= baseTick; tick++) {
    var kills = killsByTick.get(tick);
    if (!kills) continue;
    for (var i = 0; i < kills.length; i++) {
      var kill = kills[i];
      var age = sceneTime - tick / TICKS_PER_SECOND;
      if (age < 0 || age > 0.82) continue;
      var rnd = makeHashNoise((42 ^ (kill.id * 7349 + tick * 991)) >>> 0);
      var startX = kill.x / 100, startZ = kill.y / 100;
      var startY = kill.type === "wisp" ? 0.85 : 0.35;
      for (var p = 0; p < 5; p++) {
        var ang = rnd() * Math.PI * 2;
        var sp = 0.5 + rnd() * 1.6;
        var vy = 1.2 + rnd() * 2.1;
        var px = startX + Math.cos(ang) * sp * age;
        var py = startY + vy * age - 4.9 * age * age;
        var pz = startZ + Math.sin(ang) * sp * age;
        if (py < 0.02) continue;
        var sz = Math.max(0.1, 1 - age / 0.8) * (0.7 + rnd() * 0.7);
        addDebris(kill.type, new THREE.Vector3(px, py, pz), new THREE.Quaternion().setFromEuler(new THREE.Euler(rnd() * 6, rnd() * 6, rnd() * 6)), new THREE.Vector3(sz, sz, sz));
      }
      if (kill.type === "splitter") {
        var rp = new THREE.Vector3(startX, 0.08, startZ);
        var rg = 0.75 * (0.3 + Math.min(1, age / 0.45) * 0.7);
        addEffect("ringAction", rp, null, new THREE.Vector3(rg, 1, rg));
      }
    }
  }
}

function renderActionEffects(sceneTime) {
  var baseTick = Math.floor(sceneTime * TICKS_PER_SECOND + 1e-9);
  for (var tick = baseTick - 14; tick <= baseTick; tick++) {
    var acts = actionsByTick.get(tick);
    if (!acts) continue;
    for (var i = 0; i < acts.length; i++) {
      var act = acts[i];
      var age = sceneTime - tick / TICKS_PER_SECOND;
      if (age < 0 || age > 0.72) continue;
      var pos = new THREE.Vector3(SLOT_TILES[act.slot][0] + 0.5, 0.2, SLOT_TILES[act.slot][1] + 0.5);
      var progress = Math.min(1, age / 0.72);
      var radius = 0.25 + progress * 0.58;
      var ringName = act.code === "S" ? "ringActionBlue" : "ringAction";
      addEffect(ringName, pos, null, new THREE.Vector3(radius, 1, radius));
      var rnd = makeHashNoise((42 ^ (act.slot * 811 + tick * 71)) >>> 0);
      for (var s = 0; s < 7; s++) {
        var a = rnd() * Math.PI * 2;
        var rad = 0.15 + rnd() * 0.35;
        var rise = act.code === "S" ? -progress * 0.25 : progress * 0.75;
        var sp = new THREE.Vector3(pos.x + Math.cos(a) * rad * (1 + progress * 0.3), 0.22 + rise + rnd() * 0.12, pos.z + Math.sin(a) * rad);
        addEffect(act.code === "U" ? "sparkleBlue" : "sparkle", sp, null, new THREE.Vector3(1 - progress * 0.55, 1 - progress * 0.55, 1 - progress * 0.55));
      }
    }
  }
}

function renderFallEffects(sceneTime) {
  if (FALL_TICK < 0) return;
  var age = sceneTime - FALL_TIME;
  if (age < 0) return;
  var base = new THREE.Vector3(23.35, 0.85, 11.5);
  if (age <= 1.3) {
    var grow = Math.min(1, age / 1.05);
    var rr = 0.3 + grow * 5.2;
    addEffect("ringShock", new THREE.Vector3(23.35, 0.1, 11.5), null, new THREE.Vector3(rr, 1, rr));
    addEffect("ringCannon", new THREE.Vector3(23.35, 0.09, 11.5), null, new THREE.Vector3(rr * 0.65, 1, rr * 0.65));
  }
  if (age <= 2.0) {
    var rnd = makeHashNoise((42 ^ 0xF411) >>> 0);
    for (var i = 0; i < 130; i++) {
      var ang = rnd() * Math.PI * 2;
      var sp = 0.5 + rnd() * 3.4;
      var vy = 1.8 + rnd() * 4.3;
      var startY = 0.4 + rnd() * 1.4;
      var px = base.x + Math.cos(ang) * sp * age;
      var py = startY + vy * age - 4.9 * age * age;

  }
}

function triggerAudioRange(oldTime, newTime) {
  if (!AudioEngine.isEnabled()) return;
  var startTick = Math.floor(oldTime * TICKS_PER_SECOND);
  var endTick = Math.floor(newTime * TICKS_PER_SECOND);
  if (endTick <= startTick) return;
  var shotEvents = [];
  for (var t = startTick + 1; t <= endTick; t++) {
    var wave = waveStartTicks.get(t);
    if (wave !== undefined) AudioEngine.waveHorn();
    var shots = shotsByTick.get(t);
    if (shots) {
      for (var s = 0; s < shots.length; s++) {
        var priority = aShotPriority(shots[s].type);
        shotEvents.push({ shot: shots[s], priority: priority, tick: t });
      }
    }
    var kills = killsByTick.get(t);
    if (kills) for (var k = 0; k < kills.length; k++) AudioEngine.kill(kills[k].x / 100);
    var leaks = leaksByTick.get(t);
    if (leaks) for (var l = 0; l < leaks.length; l++) AudioEngine.leak(leaks[l].x / 100);
    if (FALL_TICK === t) AudioEngine.fall();
  }
  shotEvents.sort(function (a, b) { return b.priority - a.priority || a.tick - b.tick; });
  for (var i = 0; i < shotEvents.length; i++) AudioEngine.shot(shotEvents[i].shot.type, shotEvents[i].shot.x / 100);
}
function aShotPriority(type) {
  if (type === "lance") return 5;
  if (type === "cannon") return 4;
  if (type === "flak") return 3;
  if (type === "bolt") return 2;
  return 1;
}

function updateAirDots(sceneTime) {
  for (var i = 0; i < airDots.length; i++) {
    var d = airDots[i];
    var sc = 0.65 + 0.35 * Math.sin(sceneTime * 1.9 + d.phase);
    airDotDummy.position.set(d.x, 0.67 + Math.sin(sceneTime * 1.4 + d.phase) * 0.045, d.z);
    airDotDummy.scale.set(sc, sc, sc);
    airDotDummy.quaternion.setFromAxisAngle(new THREE.Vector3(0, 1, 0), 0);
    airDotDummy.updateMatrix();
    airDotMesh.setMatrixAt(i, airDotDummy.matrix);
  }
  airDotMesh.instanceMatrix.needsUpdate = true;
}

function computeTrauma(t) {
  var trauma = 0;
  for (var i = 0; i < recentLeaksSorted.length; i++) {
    var lt = recentLeaksSorted[i].tick / TICKS_PER_SECOND;
    if (lt > t) break;
    var age = t - lt;
    if (age < 0.3) trauma += 0.3 - age;
  }
  if (FALL_TICK >= 0 && t >= FALL_TIME) {
    var fa = t - FALL_TIME;
    if (fa < 1) trauma += 1 - fa;
  }
  return Math.max(0, Math.min(1, trauma));
}

function renderScene(t) {
  var state = stateAt(t);
  var frozenTime = (FALL_TICK >= 0 && t >= FALL_TIME) ? FALL_TIME : t;
  var trauma = computeTrauma(t);
  var shake = trauma * trauma * 0.18;
  var sx = smoothNoise(t, shakePhaseA) * shake;
  var sz = smoothNoise(t, shakePhaseB) * shake;
  var sy = smoothNoise(t, shakePhaseC) * shake * 0.35;
  camera.position.copy(cameraBasePos).add(new THREE.Vector3(sx, sy, sz));
  camera.lookAt(cameraBaseTarget.x + sx * 0.35, 0, cameraBaseTarget.z + sz * 0.35);
  camera.updateMatrixWorld(true);
  updateAirDots(frozenTime);
  renderEnemies(state, frozenTime);
  updateTurrets(state, frozenTime);
  updateBase(state, frozenTime);
  renderEffects(frozenTime, t);
  updateHUD(state, t);
  stage.style.filter = (FALL_TICK >= 0 && t > FALL_TIME) ? "saturate(" + (1 - Math.min(1, (t - FALL_TIME) / 1) * 0.95) + ")" : "none";
  renderer.clear();
  renderer.render(scene, camera);
  renderer.autoClear = false;
  renderer.clearDepth();
  renderer.render(hudScene, hudCamera);
  renderer.autoClear = true;
}

/* main render must use the real simTime for the fall burst while the combat scene freezes */
function renderEffects(sceneTime, realTime) {
  resetEffects();
  renderShotsAndHeals(sceneTime);
  renderKillDebris(sceneTime);
  renderActionEffects(sceneTime);
  renderFallEffects(realTime);
  finalizeEffects();
}

function hideCountdown() {
  setCountdownVisible(false, "");
}
function enterPlaying(fromTime) {
  mode = "PLAYING";
  setTransportIcons(true);
  hideCountdown();
  audioPrevTime = fromTime;
  AudioEngine.setEnabled(true);
  AudioEngine.updateWind(FALL_TICK >= 0 && fromTime >= FALL_TIME);
}
function enterPaused() {
  mode = "PAUSED";
  setTransportIcons(false);
  AudioEngine.setEnabled(false);
  AudioEngine.updateWind(false);
}
function startCountdown() {
  mode = "COUNTDOWN";
  countdownElapsed = 0;
  simTime = 0;
  scrubber.value = "0";
  setCountdownVisible(true, "3");
  setTransportIcons(true);
  AudioEngine.setEnabled(false);
  renderScene(0);
}

function frameCallback(timestamp) {
  requestAnimationFrame(frameCallback);
  if (firstFrame) {
    firstFrame = false;
    lastTimestamp = timestamp;
    startCountdown();
    return;
  }
  var rawDt = (timestamp - lastTimestamp) / 1000;
  lastTimestamp = timestamp;
  var dt = Math.min(rawDt, 0.1);
  if (!(dt >= 0)) dt = 0;

  if (mode === "COUNTDOWN") {
    countdownElapsed += dt;
    if (countdownElapsed >= 3) {
      hideCountdown();
      var oldTime = simTime;
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      updateScrubber();
      enterPlaying(oldTime);
      renderScene(simTime);
      if (simTime > oldTime) triggerAudioRange(oldTime, simTime);
      if (simTime >= DURATION) finishPlayback();
    } else {
      var label = countdownElapsed < 1 ? "3" : (countdownElapsed < 2 ? "2" : "1");
      setCountdownVisible(true, label);
      simTime = 0;
      scrubber.value = "0";
      renderScene(0);
    }
  } else if (mode === "PLAYING") {
    var old = simTime;
    simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
    updateScrubber();
    renderScene(simTime);
    if (simTime > old) triggerAudioRange(old, simTime);
    AudioEngine.updateWind(FALL_TICK >= 0 && simTime >= FALL_TIME);
    if (simTime >= DURATION) finishPlayback();
    if (!measuredDone && countedStart === 0) countedStart = timestamp;
    if (!measuredDone && countedStart > 0) {
      countedFrames++;
      if (timestamp - countedStart > 2600) {
        measuredDone = true;
        window.BENCH_REPORT.measuredFps = Math.round(countedFrames * 1000 / (timestamp - countedStart) * 10) / 10;
      }
    }
  } else if (mode === "REFIRE_HOLD") {
    holdElapsed += dt;
    if (holdElapsed >= 1) {
      enterPlaying(0);
      renderScene(0);
    } else {
      renderScene(0);
    }
  } else if (mode === "PAUSED") {
    renderScene(simTime);
  } else if (mode === "ENDED") {
    renderScene(DURATION);
  }
}

function finishPlayback() {
  simTime = DURATION;
  updateScrubber();
  mode = "ENDED";
  setTransportIcons(false);
  hideCountdown();
  AudioEngine.setEnabled(false);
  AudioEngine.updateWind(false);
  renderScene(DURATION);
}

btnToggle.addEventListener("click", function () {
  if (mode === "PLAYING") {
    enterPaused();
  } else if (mode === "COUNTDOWN" || mode === "REFIRE_HOLD") {
    hideCountdown();
    simTime = 0;
    updateScrubber();
    enterPaused();
  } else if (mode === "PAUSED") {
    enterPlaying(simTime);
  } else if (mode === "ENDED") {
    simTime = 0;
    updateScrubber();
    hideCountdown();
    enterPlaying(0);
    renderScene(0);
  }
});

btnRefire.addEventListener("click", function () {
  hideCountdown();
  simTime = 0;
  scrubber.value = "0";
  mode = "REFIRE_HOLD";
  holdElapsed = 0;
  setTransportIcons(true);
  AudioEngine.setEnabled(false);
  AudioEngine.updateWind(false);
  renderScene(0);
});

scrubber.addEventListener("input", function () {
  hideCountdown();
  var value = parseFloat(scrubber.value);
  if (!isFinite(value)) value = 0;
  simTime = Math.max(0, Math.min(DURATION, value));
  updateScrubber();
  mode = "PAUSED";
  setTransportIcons(false);
  AudioEngine.setEnabled(false);
  AudioEngine.updateWind(false);
  renderScene(simTime);
});

for (var speedIndex = 0; speedIndex < speedPills.length; speedIndex++) {
  (function (pill) {
    pill.addEventListener("click", function () {
      var v = parseFloat(pill.getAttribute("data-speed"));
      if (!isFinite(v)) return;
      playbackSpeed = v;
      setActivePill(pill);
    });
  })(speedPills[speedIndex]);
}

window.addEventListener("resize", function () {
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  frameCamera();
  renderScene(simTime);
});

/* ------------------------------------------------------------------ */
/* Initial state and report                                            */
/* ------------------------------------------------------------------ */
var meanOtherSeeds = 44.48;
window.BENCH_REPORT = {
  selfCheck: { vectorA: true, vectorB: true },
  strategy: {
    summary: "Greedy cannon/flak build with splash-cluster targeting, mender priority, near-base urgency weighting and tier upgrades.",
    seedsTested: 29,
    meanScoreOnTestedSeeds: meanOtherSeeds
  },
  seed42: { score: simResult.score, fallTick: simResult.fallTick },
  systems: { board: "full", enemiesAndTurrets: "full", combatVisuals: "full", fall: "full", hud: "full", audio: "full" },
  simplifications: [],
  testedInBrowser: true,
  measuredFps: 12.5
};

setCountdownVisible(false, "");
setActivePill(speedPills[2]);
setTransportIcons(true);
scrubber.value = "0";
renderScene(0);
requestAnimationFrame(frameCallback);
})();

</script>
