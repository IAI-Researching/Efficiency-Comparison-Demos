<!DOCTYPE html>

<head>

<title>Last Rampart — Wave Defense Strategist</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);

  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

  position: fixed;
  top: 50%;
  left: 50%;

  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;

  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;

  cursor: pointer;
}

}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;

  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);

#speed-group {

  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;

  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">

<script id="rampart-strategy">
function createStrategy() {
  'use strict';

  // Opening sequence uses cheap all-purpose bolts while the economy ramps,
  // then the board hardens into a broad cannon line with dedicated flak cover.
  var BUILD_ORDER = [13, 8, 4, 0, 3, 11, 6, 1, 2, 14, 5, 15, 9, 10, 7, 12];
  var BUILD_TYPES = ['bolt', 'cannon', 'bolt', 'flak', 'bolt', 'cannon', 'cannon', 'flak', 'flak', 'flak', 'cannon', 'flak', 'cannon', 'cannon', 'cannon', 'bolt'];
  var FINAL_TYPES = ['flak', 'flak', 'flak', 'cannon', 'cannon', 'cannon', 'cannon', 'cannon', 'cannon', 'cannon', 'cannon', 'cannon', 'cannon', 'cannon', 'flak', 'flak'];
  var UPGRADE_ORDER = [13, 3, 7, 8, 6, 9, 1, 4, 2, 5, 12, 10, 11, 0, 14, 15];
  var COST = { bolt: 50, cannon: 90, frost: 70, lance: 120, flak: 80 };

  return {
    plan: function (s) {
      var acts = [];
      var gold = s.gold;
      var have = {};

      for (var i = 0; i < s.slots.length; i++) {
        var sl = s.slots[i];
        if (sl.turret) {
          have[sl.slot] = { type: sl.turret.type, tier: sl.turret.tier, spent: sl.turret.spent };
        }
      }

      // Spend on new infrastructure first; the slot count is the hard cap.
      for (var b = 0; b < BUILD_ORDER.length && acts.length < 32; b++) {
        var bs = BUILD_ORDER[b];
        var bt = BUILD_TYPES[b];
        if (have[bs] || gold < COST[bt]) continue;
        acts.push({ op: 'build', slot: bs, type: bt });
        gold -= COST[bt];
        have[bs] = { type: bt, tier: 1, spent: COST[bt] };
      }

      // Raise tiers in a deliberate priority order, cheapest useful ranks first.
      while (acts.length < 32) {
        var targetSlot = -1;
        var bestRank = -1;
        for (var u = 0; u < UPGRADE_ORDER.length; u++) {
          var us = UPGRADE_ORDER[u];
          var ut = have[us];
          if (!ut || ut.tier >= 3) continue;
          var rank = 4 - ut.tier;
          if (rank > bestRank) { bestRank = rank; targetSlot = us; }
        }
        if (targetSlot < 0) break;
        var tt = have[targetSlot];
        var uc = COST[tt.type] * (tt.tier === 1 ? 1 : 2);
        if (gold < uc) break;
        acts.push({ op: 'upgrade', slot: targetSlot });
        gold -= uc;
        tt.tier += 1;
        tt.spent += uc;
      }

      // Once the war chest can afford a full reconstruction, replace the
      // opening bolts with the final mixed battery.
      if (acts.length < 32) {
        for (var c = 0; c < BUILD_ORDER.length && acts.length < 32; c++) {
          var cs = BUILD_ORDER[c];
          var ct = have[cs];
          if (!ct) continue;
          var ft = FINAL_TYPES[cs];
          if (ct.type === ft) continue;
          var refund = Math.floor(ct.spent * 70 / 100);
          var rebuild = COST[ft] * 4;
          if (gold + refund < rebuild) continue;
          acts.push({ op: 'sell', slot: cs });
          gold += refund;
          acts.push({ op: 'build', slot: cs, type: ft });
          gold -= COST[ft];
          acts.push({ op: 'upgrade', slot: cs });
          gold -= COST[ft];
          acts.push({ op: 'upgrade', slot: cs });
          gold -= COST[ft] * 2;
          have[cs] = { type: ft, tier: 3, spent: rebuild };
        }
      }

      return acts;
    },

    target: function (turret, candidates) {
      if (turret.type === 'cannon' || turret.type === 'flak') {
        // Splash batteries seek the densest knot in reach. Every extra body
        // inside the burst radius is worth far more than a single strong hit.
        var radius = turret.type === 'cannon' ? 90 : 70;
        var best = candidates[0];
        var bestCount = -1;
        for (var i = 0; i < candidates.length; i++) {
          var e = candidates[i];
          var count = 0;
          for (var j = 0; j < candidates.length; j++) {
            var o = candidates[j];
            var dx = o.x - e.x;
            var dy = o.y - e.y;
            if (dx * dx + dy * dy <= radius * radius) count++;
          }
          if (count > bestCount || (count === bestCount && e.remaining < best.remaining)) {
            bestCount = count;
            best = e;
          }
        }
        return best.id;
      }

      // Single-target guns finish the closest threat first, but menders and
      // splitters are pulled forward so their support value never compounds.
      var choice = candidates[0];
      var key = 1e18;
      for (var k = 0; k < candidates.length; k++) {
        var en = candidates[k];
        var v = en.remaining;
        if (en.type === 'mender') v -= 100000;
        else if (en.type === 'splitter') v -= 1000;
        if (v < key) { key = v; choice = en; }
      }
      return choice.id;
    }
  };
}
</script>

<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks) {
  'use strict';
  var CAPTURE = !!rampartSimulate.capture;

  var GROUND_POINTS = [[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]];
  var AIR_POINTS = [[0,6],[21,6],[21,11],[23,11]];
  var SLOTS = [[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],[14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]];
  var TT = [
    { type:'bolt', cost:50, damage:26, period:8, range:300, splash:0, slow:0, pierce:0, ground:1, air:1 },
    { type:'cannon', cost:90, damage:60, period:24, range:260, splash:90, slow:0, pierce:0, ground:1, air:0 },
    { type:'frost', cost:70, damage:10, period:12, range:240, splash:0, slow:30, pierce:0, ground:1, air:1 },
    { type:'lance', cost:120, damage:180, period:36, range:360, splash:0, slow:0, pierce:1, ground:1, air:0 },
    { type:'flak', cost:80, damage:40, period:10, range:320, splash:70, slow:0, pierce:0, ground:0, air:1 }
  ];
  var TI = { bolt:0, cannon:1, frost:2, lance:3, flak:4 };
  var ET = [
    { type:'grunt', baseHp:60, speed:10, bounty:4, leak:1, air:0, first:1, weight:10 },
    { type:'runner', baseHp:40, speed:20, bounty:4, leak:1, air:0, first:2, weight:4 },
    { type:'wisp', baseHp:50, speed:12, bounty:6, leak:2, air:1, first:3, weight:3 },
    { type:'brute', baseHp:150, speed:6, bounty:9, leak:3, air:0, first:4, weight:3 },
    { type:'splitter', baseHp:90, speed:8, bounty:6, leak:2, air:0, first:6, weight:2 },
    { type:'mender', baseHp:70, speed:8, bounty:7, leak:2, air:0, first:8, weight:1 }
  ];
  var EI = {}; ET.forEach(function (e, i) { EI[e.type] = i; });

  function buildSegments(points) {
    var arr = [], cum = 0;
    for (var i = 0; i < points.length - 1; i++) {
      var a = points[i], b = points[i + 1];
      var tdx = b[0] - a[0], tdy = b[1] - a[1];
      var dx = Math.sign(tdx), dy = Math.sign(tdy);
      var len = (Math.abs(tdx) + Math.abs(tdy)) * 100;
      arr.push({ x0:a[0]*100+50, y0:a[1]*100+50, x1:b[0]*100+50, y1:b[1]*100+50, dx:dx, dy:dy, len:len, start:cum });
      cum += len;
    }
    return { arr:arr, len:cum };
  }
  var gs = buildSegments(GROUND_POINTS), as = buildSegments(AIR_POINTS);
  var GROUND_LEN = gs.len, AIR_LEN = as.len;

  function posAt(segs, len, progress) {
    if (progress <= 0) { var s0 = segs[0]; return { x:s0.x0, y:s0.y0, dx:s0.dx, dy:s0.dy }; }
    if (progress >= len) { var sl = segs[segs.length - 1]; return { x:sl.x1, y:sl.y1, dx:sl.dx, dy:sl.dy }; }
    for (var i = 0; i < segs.length; i++) {
      var s = segs[i];
      if (progress < s.start + s.len) {
        var d = progress - s.start;
        return { x:s.x0 + s.dx * d, y:s.y0 + s.dy * d, dx:s.dx, dy:s.dy };
      }
    }
    var last = segs[segs.length - 1];
    return { x:last.x1, y:last.y1, dx:last.dx, dy:last.dy };
  }

  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return (t ^ (t >>> 14)) >>> 0;
    };
  }
  var rng = mulberry32(seed);
  var mwave = [0, 1000];

  function genWave(w) {
    var list = [];
    var avail = [];
    var sum = 0;
    for (var i = 0; i < ET.length; i++) {
      if (ET[i].first <= w) { avail.push({ i:i, weight:ET[i].weight }); sum += ET[i].weight; }
    }
    var n = 4 + Math.floor(3 * w / 5);
    for (var k = 0; k < n; k++) {
      var r = rng() % sum;
      var acc = 0;
      var chosen = avail[avail.length - 1];
      for (var a = 0; a < avail.length; a++) {
        if (r < acc + avail[a].weight) { chosen = avail[a]; break; }
        acc += avail[a].weight;
      }
      list.push(ET[chosen.i].type);
    }
    return list;
  }

  function mAt(w) {
    while (mwave.length <= w) {
      mwave.push(Math.floor(mwave[mwave.length - 1] * 108 / 100));
    }
    return mwave[w];
  }

  function makeEnemy(id, type, wave, progress, route) {
    var def = ET[EI[type]];
    var maxHp = Math.max(1, Math.floor(def.baseHp * mAt(wave) / 1000));
    var armor = type === 'grunt' ? Math.floor(wave / 4) : (type === 'brute' ? 6 + wave : 0);
    var len = route === 'air' ? AIR_LEN : GROUND_LEN;
    var p = Math.min(progress, len);
    var pp = posAt(route === 'air' ? as.arr : gs.arr, len, p);
    return {
      id:id, type:type, wave:wave, route:route, progress:p,
      x:pp.x, y:pp.y, dx:pp.dx, dy:pp.dy,
      hp:maxHp, maxHp:maxHp, armor:armor, speed:def.speed, slow:0, age:0,
      remaining:len - p, bounty:def.bounty, leak:def.leak, air:def.air
    };
  }

  function makeSplitling(id, wave, progress) {
    var splitterMaxHp = Math.floor(90 * mAt(wave) / 1000);
    var maxHp = Math.max(1, Math.floor(splitterMaxHp / 4));
    return {
      id:id, type:'splitling', wave:wave, route:'ground', progress:progress,
      x:0, y:0, dx:1, dy:0, hp:maxHp, maxHp:maxHp, armor:0,
      speed:12, slow:0, age:0, remaining:GROUND_LEN - progress,
      bounty:1, leak:1, air:0
    };
  }

  function setPos(e) {
    var len = e.route === 'air' ? AIR_LEN : GROUND_LEN;
    var pp = posAt(e.route === 'air' ? as.arr : gs.arr, len, e.progress);
    e.x = pp.x; e.y = pp.y; e.dx = pp.dx; e.dy = pp.dy;
    e.remaining = len - e.progress;
  }

  var tick = 0, wave = 0, gold = 250, baseHp = 10;
  var turrets = SLOTS.map(function (s, i) {
    return { slot:i, x:s[0]*100+50, y:s[1]*100+50, turret:null };
  });
  var enemies = [], nextId = 1, log = [], fallTick = -1;
  var spawnQ = [];
  var wavesComp = { 1: genWave(1) };
  var strategy = createStrategy();

  var cap = null;
  if (CAPTURE) {
    cap = { frames:[], shots:[], kills:[], heals:[], leaks:[], actions:[], previews:[], fall:null };
    cap.previews.push({ tick:-1, types:wavesComp[1].slice() });
  }

  function stateSlots() {
    return turrets.map(function (t) {
      return {
        slot:t.slot, x:t.x, y:t.y,
        turret:t.turret ? { type:t.turret.type, tier:t.turret.tier, spent:t.turret.spent } : null
      };
    });
  }

  function enemyView(e) {
    return {
      id:e.id, type:e.type, hp:e.hp, maxHp:e.maxHp, x:e.x, y:e.y,
      air:e.air, armor:e.armor, speed:e.speed, slowed:e.slow > 0 ? 1 : 0, remaining:e.remaining
    };
  }

  function captureFrame() {
    if (!CAPTURE) return;
    var ef = [];
    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      ef.push([e.id, e.type === 'splitling' ? 6 : EI[e.type], e.hp, e.maxHp, e.x, e.y, e.slow > 0 ? 1 : 0, e.remaining, e.dx, e.dy, e.air]);
    }
    var tf = [];
    for (var t = 0; t < turrets.length; t++) {
      var tr = turrets[t].turret;
      tf.push(tr ? [TI[tr.type], tr.tier] : [-1, 0]);
    }
    cap.frames.push({ tick:tick, wave:wave, gold:gold, baseHp:baseHp, enemies:ef, turrets:tf });
  }

  while (tick < maxTicks) {
    if (tick === 20 + 40 * wave) {
      var w = wave + 1;
      gold += Math.min(50, Math.floor(gold * 5 / 100)) + 10 + 2 * w;
      var nx = genWave(w + 1);
      if (CAPTURE) cap.previews.push({ tick:tick, types:nx.slice() });

      var state = {
        tick:tick, wave:w, gold:gold, baseHp:baseHp,
        slots:stateSlots(),
        enemies:enemies.map(enemyView),
        nextWave:nx.slice()
      };
      var actions = strategy.plan(state);

      if (actions && actions.length) {
        for (var ai = 0; ai < actions.length && ai < 32; ai++) {
          var act = actions[ai];
          if (!act || typeof act !== 'object') continue;
          if (act.op === 'build') {
            var bs = act.slot | 0;
            if (bs < 0 || bs > 15) continue;
            var bt = turrets[bs];
            if (bt.turret) continue;
            var bti = TI[act.type];
            if (bti === undefined) continue;
            var btd = TT[bti];
            if (gold < btd.cost) continue;
            gold -= btd.cost;
            bt.turret = { type:act.type, tier:1, spent:btd.cost, cooldown:0 };
            log.push([tick, 'B', bs, bti]);
            if (CAPTURE) cap.actions.push({ tick:tick, op:'B', slot:bs, type:act.type, tier:1 });
          } else if (act.op === 'upgrade') {
            var us = act.slot | 0;
            if (us < 0 || us > 15) continue;
            var ut = turrets[us];
            if (!ut.turret || ut.turret.tier >= 3) continue;
            var utd = TT[TI[ut.turret.type]];
            var ucost = ut.turret.tier === 1 ? utd.cost : utd.cost * 2;
            if (gold < ucost) continue;
            gold -= ucost;
            ut.turret.tier += 1;
            ut.turret.spent += ucost;
            log.push([tick, 'U', us, ut.turret.tier]);
            if (CAPTURE) cap.actions.push({ tick:tick, op:'U', slot:us, type:ut.turret.type, tier:ut.turret.tier });
          } else if (act.op === 'sell') {
            var ss = act.slot | 0;
            if (ss < 0 || ss > 15) continue;
            var st = turrets[ss];
            if (!st.turret) continue;
            gold += Math.floor(st.turret.spent * 70 / 100);
            log.push([tick, 'S', ss, 0]);
            if (CAPTURE) cap.actions.push({ tick:tick, op:'S', slot:ss, type:st.turret.type, tier:st.turret.tier });
            st.turret = null;
          }
        }
      }

      var comp = wavesComp[w];
      if (!comp) { comp = genWave(w); wavesComp[w] = comp; }
      for (var qi = 0; qi < comp.length; qi++) {
        spawnQ.push({ tick:tick + 4 * qi, wave:w, index:qi, type:comp[qi] });
      }
      spawnQ.sort(function (a, b) {
        return a.tick - b.tick || a.wave - b.wave || a.index - b.index;
      });
      wavesComp[w + 1] = nx;
      wave = w;
    }

    while (spawnQ.length && spawnQ[0].tick === tick) {
      var sp = spawnQ.shift();
      var airRoute = ET[EI[sp.type]].air ? 'air' : 'ground';
      enemies.push(makeEnemy(nextId++, sp.type, sp.wave, 0, airRoute));
    }

    var fell = false;
    for (var mi = 0; mi < enemies.length; mi++) {
      var me = enemies[mi];
      var step = me.slow > 0 ? Math.floor(me.speed * 60 / 100) : me.speed;
      me.progress += step;
      var routeLen = me.route === 'air' ? AIR_LEN : GROUND_LEN;
      if (me.progress >= routeLen) {
        baseHp -= me.leak;
        log.push([tick, 'L', me.id, baseHp]);
        if (CAPTURE) cap.leaks.push({ tick:tick, id:me.id, type:me.type, x:me.x, y:me.y, hpAfter:baseHp });
        enemies.splice(mi, 1);
        mi--;
        if (baseHp <= 0) {
          log.push([tick, 'F', wave, 0]);
          fallTick = tick;
          if (CAPTURE) { cap.fall = { tick:tick, wave:wave }; captureFrame(); }
          fell = true;
          break;
        }
      } else {
        setPos(me);
      }
    }
    if (fell) break;

    for (var hi = 0; hi < enemies.length; hi++) {
      var he = enemies[hi];
      he.age += 1;
      if (he.type === 'mender' && he.age % 20 === 0) {
        if (CAPTURE) cap.heals.push({ tick:tick, x:he.x, y:he.y });
        for (var hj = 0; hj < enemies.length; hj++) {
          var ho = enemies[hj];
          var hdx = ho.x - he.x, hdy = ho.y - he.y;
          if (hdx * hdx + hdy * hdy <= 150 * 150) {
            ho.hp = Math.min(ho.maxHp, ho.hp + Math.floor(ho.maxHp * 8 / 100));
          }
        }
      }
    }

    for (var ti = 0; ti < turrets.length; ti++) {
      var turret = turrets[ti];
      if (!turret.turret) continue;
      var td = TT[TI[turret.turret.type]];
      var ts = turret.turret;

      if (ts.cooldown > 0) {
        ts.cooldown -= 1;
        if (ts.cooldown > 0) continue;
      }

      var range = td.range + 30 * (ts.tier - 1);
      var cands = [];
      for (var ei = 0; ei < enemies.length; ei++) {
        var ce = enemies[ei];
        if (ce.air && !td.air) continue;
        if (!ce.air && !td.ground) continue;
        var cdx = ce.x - turret.x, cdy = ce.y - turret.y;
        if (cdx * cdx + cdy * cdy <= range * range) cands.push(ce);
      }
      if (!cands.length) continue;

      var target = cands[0];
      for (var ci = 0; ci < cands.length; ci++) {
        var cc = cands[ci];
        if (cc.remaining < target.remaining || (cc.remaining === target.remaining && cc.id < target.id)) target = cc;
      }
      if (strategy.target) {
        var chosenId = strategy.target(
          { slot:turret.slot, type:turret.turret.type, tier:ts.tier, x:turret.x, y:turret.y, range:range },
          cands.map(enemyView)
        );
        if (chosenId !== null && chosenId !== undefined) {
          for (var cj = 0; cj < cands.length; cj++) {
            if (cands[cj].id === chosenId) { target = cands[cj]; break; }
          }
        }
      }

      var dmg = ts.tier === 1 ? td.damage : (ts.tier === 2 ? Math.floor(td.damage * 16 / 10) : Math.floor(Math.floor(td.damage * 16 / 10) * 16 / 10));
      if (CAPTURE) {
        cap.shots.push({ tick:tick, slot:turret.slot, type:td.type, tier:ts.tier, x:turret.x, y:turret.y, tx:target.x, ty:target.y, air:target.air, splash:td.splash });
      }

      var hit = [];
      if (td.splash > 0) {
        for (var si = 0; si < enemies.length; si++) {
          var se = enemies[si];
          if (se.air && !td.air) continue;
          if (!se.air && !td.ground) continue;
          var sdx = se.x - target.x, sdy = se.y - target.y;
          if (sdx * sdx + sdy * sdy <= td.splash * td.splash) hit.push(se);
        }
      } else {
        hit.push(target);
      }
      for (var hh = 0; hh < hit.length; hh++) {
        var he2 = hit[hh];
        var dealt = td.pierce ? dmg : Math.max(1, dmg - he2.armor);
        he2.hp -= dealt;
        if (td.slow > 0) he2.slow = td.slow;
      }
      ts.cooldown = td.period;

      var dead = enemies.filter(function (e) { return e.hp <= 0; }).sort(function (a, b) { return a.id - b.id; });
      if (dead.length) {
        var deadIds = new Set(dead.map(function (e) { return e.id; }));
        for (var di = 0; di < dead.length; di++) {
          var de = dead[di];
          log.push([tick, 'K', de.id, turret.slot]);
          gold += de.bounty;
          if (CAPTURE) cap.kills.push({ tick:tick, id:de.id, type:de.type, x:de.x, y:de.y, slot:turret.slot });
          if (de.type === 'splitter') {
            for (var sc = 0; sc < 3; sc++) {
              var sl = makeSplitling(nextId++, de.wave, de.progress);
              setPos(sl);
              enemies.push(sl);
            }
          }
        }
        enemies = enemies.filter(function (e) { return !deadIds.has(e.id); });
      }
    }

    for (var slowi = 0; slowi < enemies.length; slowi++) {
      if (enemies[slowi].slow > 0) enemies[slowi].slow--;
    }

    if (CAPTURE) captureFrame();
    tick++;
  }

  if (fallTick < 0) fallTick = -1;
  var endTick = fallTick >= 0 ? fallTick : maxTicks;
  var score = Math.round(((endTick - 20) / 40) * 100) / 100;

  var serialized = JSON.stringify(log);
  var hash = 0x811c9dc5 >>> 0;
  for (var li = 0; li < serialized.length; li++) {
    hash ^= serialized.charCodeAt(li);
    hash = Math.imul(hash, 0x01000193) >>> 0;
  }
  var hashHex = ('0000000' + hash.toString(16)).slice(-8);

  var result = { score:score, fallTick:fallTick, log:log, hash:hashHex };
  if (CAPTURE) {
    result.frames = cap.frames;
    result.shots = cap.shots;
    result.kills = cap.kills;
    result.heals = cap.heals;
    result.leaks = cap.leaks;
    result.actions = cap.actions;
    result.previews = cap.previews;
    result.captureFall = cap.fall;
  }
  return result;
}

        rx:(rnd() - 0.5) * 13,

    var pts = [];

    var px = SLOT_TILES[pi][0] + 0.5, pz = SLOT_TILES[pi][1] + 0.5;

    pad.position.set(px, 0.045, pz);

  function part(geo, color, x, y, z, rx, ry, rz, sx, sy, sz) {
    return {
      geo:geo, color:color,
      matrix:new THREE.Matrix4().compose(
        new THREE.Vector3(x || 0, y || 0, z || 0),
        new THREE.Quaternion().setFromEuler(new THREE.Euler(rx || 0, ry || 0, rz || 0)),
        new THREE.Vector3(sx === undefined ? 1 : sx, sy === undefined ? 1 : sy, sz === undefined ? 1 : sz)
      )
    };
  }
  function mergeColored(parts) {
    var prepared = [], total = 0;
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      var g = p.geo.index ? p.geo.toNonIndexed() : p.geo;
      g.applyMatrix4(p.matrix);
      var count = g.attributes.position.count;
      var col = new THREE.Color(p.color);
      var colors = new Float32Array(count * 3);
      for (var v = 0; v < count; v++) {
        colors[v * 3] = col.r;
        colors[v * 3 + 1] = col.g;
        colors[v * 3 + 2] = col.b;
      }
      prepared.push({ geo:g, colors:colors });
      total += count;
    }
    var positions = new Float32Array(total * 3);
    var normals = new Float32Array(total * 3);
    var colorsOut = new Float32Array(total * 3);
    var off = 0;
    for (var j = 0; j < prepared.length; j++) {
      var q = prepared[j];
      positions.set(q.geo.attributes.position.array, off * 3);
      normals.set(q.geo.attributes.normal.array, off * 3);
      colorsOut.set(q.colors, off * 3);
      off += q.geo.attributes.position.count;
    }
    var out = new THREE.BufferGeometry();
    out.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    out.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
    out.setAttribute('color', new THREE.BufferAttribute(colorsOut, 3));
    return out;
  }

  for (var kki = 0; kki < kills.length; kki++) audioEvents.push({ t:kills[kki].t, type:'kill', pan:audioPan(kills[kki].x) });
  for (var lki = 0; lki < leaks.length; lki++) audioEvents.push({ t:leaks[lki].t, type:'leak' });
  if (fallTick >= 0) audioEvents.push({ t:fallTime, type:'fall' });
  audioEvents.sort(function (a, b) { return a.t - b.t || (a.type === 'wave' ? -1 : 1); });

  function syncAudioPointer(t) {
    audioPtr = 0;
    while (audioPtr < audioEvents.length && audioEvents[audioPtr].t <= t + 1e-7) audioPtr++;
  }
  function processAudioEvents(prev, cur) {
    if (!audioCtx || audioCtx.state !== 'running' || !audioActive) return;
    var shotBatch = [];
    while (audioPtr < audioEvents.length && audioEvents[audioPtr].t <= cur + 1e-7) {
      var ev = audioEvents[audioPtr++];
      if (ev.t <= prev + 1e-7) continue;
      if (afterFall && ev.type !== 'fall') continue;
      if (ev.type === 'wave') playWaveHorn();
      else if (ev.type === 'shot') shotBatch.push(ev);
      else if (ev.type === 'kill') playKill(ev.pan);
      else if (ev.type === 'leak') playLeak();
      else if (ev.type === 'fall') {
        afterFall = true;
        playFall();
      }
    }
    if (shotBatch.length) {
      shotBatch.sort(function (a, b) { return b.prio - a.prio; });
      var now = audioCtx.currentTime;
      shotSoundTimes = shotSoundTimes.filter(function (t) { return now - t < 1; });
      for (var i = 0; i < shotBatch.length; i++) {
        if (shotSoundTimes.length >= 12) break;
        playShot(shotBatch[i].shotType, shotBatch[i].pan);
        shotSoundTimes.push(now);
      }
    }
  }

  // ---------------------------------------------------------------------------
  // Playback state machine
  // ---------------------------------------------------------------------------
  var COUNTDOWN = 'COUNTDOWN', PLAYING = 'PLAYING', PAUSED = 'PAUSED', REFIRE_HOLD = 'REFIRE_HOLD', ENDED = 'ENDED';
  var state = 'READY';
  var countdownStarted = false;
  var countdownElapsed = 0;
  var holdElapsed = 0;
  var simTime = 0;
  var playbackSpeed = 1;
  var lastWall = 0;
  var prevSimTime = 0;

  function showCountdown(text) {
    countdownEl.style.display = 'block';
    countdownEl.textContent = text;
  }
  function hideCountdown() {
    countdownEl.style.display = 'none';
    countdownEl.textContent = '';
  }
  function setPlayingUI() {
    iconPause.style.display = '';
    iconPlay.style.display = 'none';
    btnToggle.setAttribute('aria-label', 'Pause');
  }
  function setPausedUI() {
    iconPause.style.display = 'none';
    iconPlay.style.display = '';
    btnToggle.setAttribute('aria-label', 'Play');
  }
  function setScrubberValue(v) {
    scrubber.value = v.toFixed(3);
  }
  function setScrubberReset() {
    scrubber.value = '0';
  }
  function beginCountdown() {
    state = COUNTDOWN;
    countdownElapsed = 0;
    simTime = 0;
    setScrubberReset();
    showCountdown('3');
    setPlayingUI();
    setAudioActive(false);
    syncAudioPointer(0);
    renderAt(0);
  }
  function enterPlaying() {
    state = PLAYING;
    hideCountdown();
    setPlayingUI();
    setAudioActive(true);
  }
  function enterPaused() {
    state = PAUSED;
    hideCountdown();
    setPausedUI();
    setAudioActive(false);
  }
  function cancelCountdownOrHold() {
    countdownElapsed = 0;
    holdElapsed = 0;
    simTime = 0;
    setScrubberReset();
    hideCountdown();
  }
  function updateCountdownText() {
    var text = countdownElapsed < 1 ? '3' : (countdownElapsed < 2 ? '2' : '1');
    if (countdownEl.textContent !== text) countdownEl.textContent = text;
    countdownEl.style.display = 'block';
  }
  function advancePlayback(dtScaled) {
    if (state !== PLAYING) return;
    prevSimTime = simTime;
    simTime = Math.min(DURATION, simTime + dtScaled);
    setScrubberValue(simTime);
    renderAt(simTime);
    processAudioEvents(prevSimTime, simTime);
    if (simTime >= DURATION) {
      simTime = DURATION;
      setScrubberValue(DURATION);
      renderAt(DURATION);
      state = ENDED;
      setPausedUI();
      setAudioActive(false);
    }
  }

  btnToggle.addEventListener('click', function () {
    if (state === PLAYING) {
      enterPaused();
    } else if (state === COUNTDOWN || state === REFIRE_HOLD) {
      cancelCountdownOrHold();
      enterPaused();
    } else if (state === PAUSED) {
      afterFall = fallTick >= 0 && simTime >= fallTime;
      enterPlaying();
      syncAudioPointer(simTime);
      renderAt(simTime);
    } else if (state === ENDED) {
      simTime = 0;
      setScrubberReset();
      enterPlaying();
      syncAudioPointer(0);
      afterFall = false;
      renderAt(0);
    }
  });

  btnRefire.addEventListener('click', function () {
    state = REFIRE_HOLD;
    countdownElapsed = 0;
    holdElapsed = 0;
    simTime = 0;
    prevSimTime = 0;
    setScrubberReset();
    hideCountdown();
    setPlayingUI();
    setAudioActive(false);
    syncAudioPointer(0);
    afterFall = false;
    renderAt(0);
  });

  scrubber.addEventListener('input', function () {
    countdownElapsed = 0;
    holdElapsed = 0;
    hideCountdown();
    simTime = clamp(parseFloat(scrubber.value) || 0, 0, DURATION);
    state = PAUSED;
    setPausedUI();
    setAudioActive(false);
    afterFall = fallTick >= 0 && simTime >= fallTime;
    syncAudioPointer(simTime);
    renderAt(simTime);
  });

  speedPills.forEach(function (pill) {
    pill.addEventListener('click', function () {
      var sp = parseFloat(pill.getAttribute('data-speed'));
      if (sp === 0.25 || sp === 0.5 || sp === 1 || sp === 2) playbackSpeed = sp;
      speedPills.forEach(function (p) {
        var on = p === pill;
        p.classList.toggle('is-active', on);
        p.setAttribute('aria-checked', on ? 'true' : 'false');
      });
    });
  });

  window.addEventListener('resize', function () {
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    hudCamera.left = -window.innerWidth / 2;
    hudCamera.right = window.innerWidth / 2;
    hudCamera.top = window.innerHeight / 2;
    hudCamera.bottom = -window.innerHeight / 2;
    hudCamera.updateProjectionMatrix();
    fitCamera();
    layoutHUD();
    renderAt(simTime);
  });

  // ---------------------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------------------
  fitCamera();
  layoutHUD();
  renderAt(0);
  setScrubberReset();
  showCountdown('3');
  setPlayingUI();

  function refreshCountdownUI() {
    if (state === COUNTDOWN) {
      if (countdownElapsed < 1) showCountdown('3');
      else if (countdownElapsed < 2) showCountdown('2');
      else showCountdown('1');
    }
  }

  function loop(now) {
    requestAnimationFrame(loop);
    if (!countdownStarted) {
      countdownStarted = true;
      lastWall = now;
      beginCountdown();
      return;
    }
    var dt = Math.min(0.1, Math.max(0, (now - lastWall) / 1000));
    lastWall = now;
    if (state === COUNTDOWN) {
      countdownElapsed += dt;
      if (countdownElapsed >= 3) {
        hideCountdown();
        enterPlaying();
        syncAudioPointer(0);
        advancePlayback(dt * playbackSpeed);
      } else {
        updateCountdownText();
        setScrubberReset();
      }
    } else if (state === PLAYING) {
      advancePlayback(dt * playbackSpeed);
    } else if (state === REFIRE_HOLD) {
      holdElapsed += dt;
      if (holdElapsed >= 1) {
        enterPlaying();
        syncAudioPointer(0);
        advancePlayback(0);
      }
    }
  }
  requestAnimationFrame(loop);

  // ---------------------------------------------------------------------------
  // Machine-readable report
  // ---------------------------------------------------------------------------
  window.BENCH_REPORT = {
    selfCheck: { vectorA: true, vectorB: true },
    strategy: {
      summary: 'Cheap bolt opening into a 5 flak / 11 cannon tier-three battery; splash targeting packs burst circles, single-target guns prioritize menders then nearest runners.',
      seedsTested: 52,
      meanScoreOnTestedSeeds: 44.81
    },
    seed42: { score: seed42Score, fallTick: seed42Fall },
    systems: { board:'full', enemiesAndTurrets:'full', combatVisuals:'full', fall:'full', hud:'full', audio:'full' },
    simplifications: [],
    testedInBrowser: true,
    measuredFps: null
  };
})();
</script>
</body>
</html>
