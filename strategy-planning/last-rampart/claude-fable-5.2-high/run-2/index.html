<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last Rampart</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="100" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script id="rampart-strategy">
function createStrategy() {
  "use strict";
  var P = {
    H: 800,        // lookahead horizon (ticks)
    H1: 440,       // need horizon: buy only if a leak is predicted within H1 (else bank for interest)
    U: 45,         // urgency softening (ticks)
    KB: 0.375,     // kill factor (<1 discourages overkill)
    HPW: 0,
    UT: [45, 45, 45, 45, 45], KBT: [0.375, 0.375, 0.375, 0.375, 0.375],
    LWK: [0.75, 1, 2, 1.5, 1.33, 6.65, 1],
    LW: [0.75, 1, 2, 1.5, 1.33, 6.65, 1],   // leak weights per enemy type for targeting
    FW: [4, 8, 5, 3, 4, 4, 5],     // frost value per enemy type
    UF: 60, FS: 0.05,
    cap: 1000,     // gold above this is surplus
    w0: 22, w1: 30, // cap decays linearly to 0 between these waves
    alpha: 1,      // cost exponent in greedy
    RES: 300,      // residual weight
    SOFT: 0,
    budget: 15000000,
    DW: 0.02,
    repWave: 1, repPen: 1, maxBuildTier: 1,
    FIN: [1, 1, 1, 1, 1, 1, 1, 1, 4, 1, 4, 1, 4, 1, 4, 4],
    minGain: 0.0001
  };
  var GLEN = 4600, ALEN = 2800, AOFF = GLEN + 1, PTOT = GLEN + ALEN + 2;
  var PX = new Int16Array(PTOT), PY = new Int16Array(PTOT);
  (function () {
    function fill(tiles, off) {
      var p = 0, i, d;

        var ax = tiles[i - 1][0] * 100 + 50, ay = tiles[i - 1][1] * 100 + 50, bx = tiles[i][0] * 100 + 50, by = tiles[i][1] * 100 + 50;
        var L = Math.abs(bx - ax) + Math.abs(by - ay), sx = bx > ax ? 1 : bx < ax ? -1 : 0, sy = by > ay ? 1 : by < ay ? -1 : 0;
        for (d = 0; d <= L; d++) { PX[off + p + d] = ax + sx * d; PY[off + p + d] = ay + sy * d; }

  })();
  var SLOTS = [[3, 3], [5, 5], [7, 4], [7, 8], [9, 9], [10, 5], [11, 8], [13, 8], [14, 5], [15, 2], [16, 7], [17, 4], [19, 8], [20, 10], [22, 9], [3, 7]];
  var TN = ["bolt", "cannon", "frost", "lance", "flak"], TIDX = { bolt: 0, cannon: 1, frost: 2, lance: 3, flak: 4 };
  var T_COST = [50, 90, 70, 120, 80], T_DMG = [26, 60, 10, 180, 40], T_PER = [8, 24, 12, 36, 10], T_RNG = [300, 260, 240, 360, 320];
  var T_SPL = [0, 90, 0, 0, 70], T_PIERCE = [0, 0, 0, 1, 0], T_GROUND = [1, 1, 1, 1, 0], T_AIR = [1, 0, 1, 0, 1];
  var EIDX = { grunt: 0, runner: 1, wisp: 2, brute: 3, splitter: 4, mender: 5, splitling: 6 };
  var E_HP = [60, 40, 50, 150, 90, 70, 0], E_SPD = [10, 20, 12, 6, 8, 8, 12], E_SLOW = [6, 12, 7, 3, 4, 4, 7];
  var E_LEAK = [1, 1, 2, 3, 2, 2, 1], E_AIR = [0, 0, 1, 0, 0, 0, 0], E_FIRST = [1, 2, 3, 4, 6, 8], E_W = [10, 4, 3, 3, 2, 1];
  var E_END = [GLEN, GLEN, AOFF + ALEN, GLEN, GLEN, GLEN, GLEN], E_OFF = [0, 0, AOFF, 0, 0, 0, 0];
  var mult = [0, 1000];
  function mOf(w) { while (mult.length <= w) mult.push(Math.floor(mult[mult.length - 1] * 108 / 100)); return mult[w]; }
  function tierDmg(tt, tier) { var d = T_DMG[tt]; if (tier > 1) d = Math.floor(d * 16 / 10); if (tier > 2) d = Math.floor(d * 16 / 10); return d; }

  // range tables, lazily built: key = (type*3 + tier-1)*16 + slot
  var rangeTabs = [];
  function rangeTab(tt, tier, slot) {
    var key = (tt * 3 + tier - 1) * 16 + slot, tab = rangeTabs[key];
    if (tab) return tab;
    tab = new Uint8Array(PTOT);
    var r = T_RNG[tt] + 30 * (tier - 1), r2 = r * r, sx = SLOTS[slot][0] * 100 + 50, sy = SLOTS[slot][1] * 100 + 50, p, dx, dy, any = 0;
    if (T_GROUND[tt]) for (p = 0; p < GLEN; p++) { dx = PX[p] - sx; dy = PY[p] - sy; if (dx * dx + dy * dy <= r2) { tab[p] = 1; any = 1; } }

    tab.any = any;
    rangeTabs[key] = tab;
    return tab;
  }

  // ---------- candidate scratch + shared targeting core ----------
  var SC = 4096;
  var sTy = new Uint8Array(SC), sHp = new Int32Array(SC), sP = new Int32Array(SC), sSl = new Uint8Array(SC), sAr = new Int32Array(SC);
  var sV = new Float64Array(SC);
  function pick(tt, dmg, nc) {
    var best = 0, bs = -1, i, j, s, ty, d, hp, eta;
    if (tt === 2) {
      var FW = P.FW, UF = P.UF, FS = P.FS;
      for (i = 0; i < nc; i++) {
        ty = sTy[i];
        eta = (E_END[ty] - sP[i]) / E_SPD[ty];
        s = FW[ty] / (eta + UF);
        if (sSl[i]) s *= FS;
        if (s > bs) { bs = s; best = i; }
      }
      return best;
    }
    var LW = tt === 4 ? P.LWK : P.LW, U = P.UT[tt], KB = P.KBT[tt], HPW = P.HPW, pierce = T_PIERCE[tt], spl = T_SPL[tt];
    for (i = 0; i < nc; i++) {
      ty = sTy[i];
      d = pierce ? dmg : dmg - sAr[i];
      if (d < 1) d = 1;
      hp = sHp[i];
      eta = (E_END[ty] - sP[i]) / E_SPD[ty];
      s = LW[ty] * (d >= hp ? KB * hp : d) / ((hp + HPW * d) * (eta + U));
      sV[i] = s;
      if (!spl && s > bs) { bs = s; best = i; }
    }
    if (!spl) return best;
    var sp2 = spl * spl;
    for (i = 0; i < nc; i++) {
      var x = PX[sP[i]], y = PY[sP[i]];
      s = 0;
      for (j = 0; j < nc; j++) {
        var dx = PX[sP[j]] - x, dy = PY[sP[j]] - y;
        if (dx * dx + dy * dy <= sp2) s += sV[j];
      }
      if (s > bs) { bs = s; best = i; }
    }
    return best;
  }

  // ---------- lookahead model ----------
  var CAP = 4096;
  var bTy = new Uint8Array(CAP), bHp = new Int32Array(CAP), bMx = new Int32Array(CAP), bP = new Int32Array(CAP), bSl = new Uint8Array(CAP), bAr = new Int32Array(CAP), bAge = new Int32Array(CAP), bN = 0;
  var wTy = new Uint8Array(CAP), wHp = new Int32Array(CAP), wMx = new Int32Array(CAP), wP = new Int32Array(CAP), wSl = new Uint8Array(CAP), wAr = new Int32Array(CAP), wAge = new Int32Array(CAP), wA = new Uint8Array(CAP);
  var cI = new Int32Array(CAP);
  var qTick = new Int32Array(CAP), qTy = new Uint8Array(CAP), qHp = new Int32Array(CAP), qAr = new Int32Array(CAP), qN = 0;
  var cfgType = new Int8Array(16), cfgTier = new Int8Array(16);
  var tSlot = new Int32Array(16), tTy = new Int32Array(16), tDmg = new Int32Array(16), tCd = new Int32Array(16), tTab = [];
  var work = 0, mBaseHp = 10, dmgNorm = 1;
  var rJ = 0, rLeak = 0, rEarly = 0;

  function evalCfg(H) {
    var n = bN, i, j, k, t, ty, p, nT = 0, s;
    wTy.set(bTy.subarray(0, n)); wHp.set(bHp.subarray(0, n)); wMx.set(bMx.subarray(0, n)); wP.set(bP.subarray(0, n));
    wSl.set(bSl.subarray(0, n)); wAr.set(bAr.subarray(0, n)); wAge.set(bAge.subarray(0, n));
    var nMend = 0, nDead = 0;
    for (i = 0; i < n; i++) { wA[i] = 1; if (wTy[i] === 5) nMend++; }
    for (s = 0; s < 16; s++) if (cfgType[s] >= 0) {
      tSlot[nT] = s; tTy[nT] = cfgType[s]; tDmg[nT] = tierDmg(cfgType[s], cfgTier[s]); tCd[nT] = 0; tTab[nT] = rangeTab(cfgType[s], cfgTier[s], s); nT++;
    }
    var qi = 0, leak = 0, soft = 0, hpLeft = mBaseHp, deadTick = -1, dealt = 0, early = 0, H1 = P.H1;
    outer:
    for (t = 0; t < H; t++) {
      while (qi < qN && qTick[qi] <= t) {
        if (n < CAP) {
          ty = qTy[qi];
          wTy[n] = ty; wHp[n] = qHp[qi]; wMx[n] = qHp[qi]; wP[n] = E_OFF[ty]; wSl[n] = 0; wAr[n] = qAr[qi]; wAge[n] = 0; wA[n] = 1;
          if (ty === 5) nMend++;
          n++;
        }
        qi++;
      }
      work += n;
      for (i = 0; i < n; i++) {
        if (!wA[i]) continue;
        ty = wTy[i];
        s = wSl[i];
        if (s > 0) { s--; wSl[i] = s; }
        p = wP[i] + (s > 0 ? E_SLOW[ty] : E_SPD[ty]);
        if (p >= E_END[ty]) {
          wA[i] = 0; nDead++;
          if (ty === 5) nMend--;
          leak += E_LEAK[ty]; soft += E_LEAK[ty] * wHp[i] / wMx[i];
          if (t < H1) early += E_LEAK[ty];
          hpLeft -= E_LEAK[ty];
          if (hpLeft <= 0) { deadTick = t; break outer; }
        } else wP[i] = p;
      }
      if (nMend > 0) {
        for (i = 0; i < n; i++) {
          if (!wA[i] || wTy[i] !== 5) continue;
          if (++wAge[i] % 20 !== 0) continue;
          var mx = PX[wP[i]], my = PY[wP[i]];
          for (j = 0; j < n; j++) {
            if (!wA[j]) continue;
            var hx = PX[wP[j]] - mx, hy = PY[wP[j]] - my;
            if (hx * hx + hy * hy <= 22500) { var nh = wHp[j] + Math.floor(wMx[j] * 8 / 100); wHp[j] = nh > wMx[j] ? wMx[j] : nh; }
          }
        }
      }

        if (!nc) continue;
        work += n;
        var tt = tTy[k], dmg = tDmg[k];
        for (j = 0; j < nc; j++) { i = cI[j]; sTy[j] = wTy[i]; sHp[j] = wHp[i]; sP[j] = wP[i]; sSl[j] = wSl[i] > 0 ? 1 : 0; sAr[j] = wAr[i]; }

          for (i = 0; i < n; i++) {

                for (j = 0; j < 3; j++) { wTy[n] = 6; wHp[n] = ch; wMx[n] = ch; wP[n] = wP[i]; wSl[n] = 0; wAr[n] = 0; wAge[n] = 0; wA[n] = 1; n++; }

        } else {

          if (tt === 2) wSl[sel] = 30;
          if (wHp[sel] <= 0) {
            wA[sel] = 0; nDead++;

  function doPlan(state) {
