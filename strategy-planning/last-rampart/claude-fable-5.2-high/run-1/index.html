      }
      if (loose >= 0 && kp.kind !== 'plinth') {
        if (kp.kind === 'gate') continue;
        // ballistic with landing (closed form)
        var g = 9.0, vy0 = kp.vy * boost, ground = 0.06 + kp.sy * 0.25;
        var tl = (vy0 + Math.sqrt(vy0 * vy0 + 2 * g * Math.max(0, kp.y - ground))) / g;
        var tq = Math.min(loose, tl);
        var px2 = KX + kp.x + kp.vx * boost * tq, pz2 = KZ + kp.z + kp.vz * boost * tq, py2 = kp.y + vy0 * tq - 0.5 * g * tq * tq;
        var lx = KX + kp.x + kp.vx * boost * tl, lz2 = KZ + kp.z + kp.vz * boost * tl;
        if (lx > 24.9 || lz2 > 14.9 || lz2 < -0.9) { // flies off the slab: keeps falling
          tq = loose; px2 = KX + kp.x + kp.vx * boost * tq; pz2 = KZ + kp.z + kp.vz * boost * tq; py2 = kp.y + vy0 * tq - 0.5 * g * tq * tq;
          if (py2 < -6) continue;
        } else if (loose >= tl) py2 = ground;
        _ax.set(kp.ax, kp.ay, kp.az).normalize();
        _q2.setFromAxisAngle(_ax, kp.spin * tq);
        var shr = loose >= tl ? 0.7 : 1 - 0.3 * (tq / tl);
        put(keepMesh, px2, py2, pz2, _q2, kp.sx * shr, kp.sy * shr, kp.sz * shr, cr2 * 0.8, cg2 * 0.8, cb2 * 0.8);
      } else {
        put(keepMesh, KX + kp.x, kp.y, KZ + kp.z, QID, kp.sx, kp.sy, kp.sz, cr2, cg2, cb2);
      }
    }
    // leak impact burst at the gate
    var l0 = R.leakAt[Math.max(0, k - 10)], l1 = R.leakAt[k + 1];
    for (i = l0; i < l1; i++) {
      var lt = simTime - R.leaks[i].t / TPS; if (lt < 0 || lt >= 0.5) continue;
      var lf = 1 - lt / 0.5;
      put(ringMesh, KX, 0.15, KZ, QID, 0.6 + lt * 3.2, 1, 0.6 + lt * 3.2, 1.6 * lf, 0.2 * lf, 0.12 * lf);
      put(flashMesh, KX - 0.6, 0.4, KZ, QID, 0.5 * lf, 0.5 * lf, 0.5 * lf, 1.5 * lf, 0.25 * lf, 0.1 * lf);
      for (j = 0; j < 6; j++) {
        var la = vr(i * 6 + j, 41) * 6.283, ls = 0.8 + vr(i * 6 + j, 42) * 1.6, lvy = 1.6 + vr(i * 6 + j, 43) * 2.4;
        var ly = 0.5 + lvy * lt - 4.9 * lt * lt; if (ly < 0.1) ly = 0.1;
        var lz = 0.07 * lf + 0.01;
        put(debrisMesh, KX - 0.5 + Math.cos(la) * ls * lt, ly, KZ + Math.sin(la) * ls * lt, QID, lz, lz, lz, 0.5, 0.47, 0.43);
      }
    }
    // the fall: debris burst + shockwave
    if (fell) {
      if (ft < 1.6) {
        var su2 = ft / 1.6, sr = 0.5 + 9.5 * (1 - Math.pow(1 - su2, 2)), sf2 = (1 - su2);
        put(ringMesh, KX, 0.18, KZ, QID, sr, 1, sr, 2.2 * sf2, 1.5 * sf2, 0.9 * sf2);
        if (ft > 0.1) { var sr3 = 0.5 + 6.5 * (1 - Math.pow(1 - (ft - 0.1) / 1.5, 2)); put(ringMesh, KX, 0.3, KZ, QID, sr3, 1, sr3, 1.2 * sf2, 0.7 * sf2, 0.4 * sf2); }
      }
      if (ft < 0.5) { var bf = 1 - ft / 0.5, bs2 = 0.8 + ft * 6; put(flashMesh, KX, 0.6, KZ, QID, bs2, bs2 * 0.7, bs2, 2.0 * bf, 1.3 * bf, 0.7 * bf); }
      for (j = 0; j < 90; j++) {
        var fa3 = vr(j, 51) * 6.283, fs = 0.4 + vr(j, 52) * 2.4, fvy = 2.5 + vr(j, 53) * 5.0, gg2 = 9.0;
        var ftl = (fvy + Math.sqrt(fvy * fvy + 2 * gg2 * 0.5)) / gg2, fq = Math.min(ft, ftl);
        var fy = 0.6 + fvy * fq - 0.5 * gg2 * fq * fq;
        var flx = KX + Math.cos(fa3) * fs * ftl, flz = KZ + Math.sin(fa3) * fs * ftl;
        if (flx > 24.9 || flz > 14.9) { fq = ft; fy = 0.6 + fvy * fq - 0.5 * gg2 * fq * fq; if (fy < -6) continue; }
        else if (ft >= ftl) fy = 0.08;
        var fz = 0.06 + vr(j, 54) * 0.1;
        _ax.set(vr(j, 55) - 0.5, vr(j, 56) - 0.5, vr(j, 57) - 0.5).normalize();
        var gk = 0.3 + vr(j, 58) * 0.35;
        put(debrisMesh, KX + Math.cos(fa3) * fs * fq, fy, KZ + Math.sin(fa3) * fs * fq, _q2.setFromAxisAngle(_ax, fq * (4 + vr(j, 59) * 8)), fz, fz, fz, gk, gk * 0.96, gk * 0.9);
      }
    }
    endPools();
    return k;
  }

  function renderAt(simTime) {
    var k = updateScene(simTime);
    drawHud(k, simTime);
    renderer.clear(true, true, true);
    renderer.render(scene, camera);
    renderer.clearDepth();
    renderer.render(hudScene, hudCam);
  }

  function onResize() {
    var W = window.innerWidth, H = window.innerHeight;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(W, H, false);
    fitCamera();
    hudCam.left = 0; hudCam.right = W; hudCam.top = 0; hudCam.bottom = H; hudCam.updateProjectionMatrix();
    renderAt(simTime);
  }

  // ------------------------------------------------------------------ audio (all synthesized, driven by simTime)
  var actx = null, master = null, comp = null, noiseBuf = null, liveNodes = [], windNodes = null;
  var arand = seededFloat(4242);
  var MASTER_LEVEL = 0.55;
  function resumeAudio() { if (actx && actx.state !== 'running') { try { var pr = actx.resume(); if (pr && pr.catch) pr.catch(function () { }); } catch (e) { } } }
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    actx = new AC();
    master = actx.createGain(); master.gain.value = 0;
    comp = actx.createDynamicsCompressor();
    comp.threshold.value = -20; comp.knee.value = 12; comp.ratio.value = 8; comp.attack.value = 0.003; comp.release.value = 0.2;
    master.connect(comp); comp.connect(actx.destination);
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
    (function () { var d = noiseBuf.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = arand() * 2 - 1; })();
    resumeAudio();
  } catch (err) { actx = null; }
  window.addEventListener('pointerdown', resumeAudio);
  window.addEventListener('keydown', resumeAudio);

  function setAudible(on) {
    if (!actx) return;
    var now = actx.currentTime, g = master.gain;
    try {
      g.cancelScheduledValues(now); g.setValueAtTime(g.value, now);
      g.linearRampToValueAtTime(on ? MASTER_LEVEL : 0, now + 0.04);
    } catch (e) { }
    if (!on) {
      for (var i = 0; i < liveNodes.length; i++) { try { liveNodes[i].stop(now + 0.045); } catch (e2) { } }
      liveNodes.length = 0;
      stopWind();
    }
  }
  function track(src) {
    liveNodes.push(src);
    src.onended = function () { var i = liveNodes.indexOf(src); if (i >= 0) liveNodes.splice(i, 1); };
  }
  function outNode(pan, gainNode) {
    if (actx.createStereoPanner) { var p = actx.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, pan)); gainNode.connect(p); p.connect(master); }
    else gainNode.connect(master);
  }
  function tone(type, f0, f1, dur, vol, pan, delay, attack) {
    var t0 = actx.currentTime + (delay || 0), o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t0);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + (attack || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); outNode(pan, g);
    o.start(t0); o.stop(t0 + dur + 0.02); track(o);
  }
  function noise(ftype, f0, f1, q, dur, vol, pan, delay, attack) {
    var t0 = actx.currentTime + (delay || 0), s = actx.createBufferSource(), fl = actx.createBiquadFilter(), g = actx.createGain();
    s.buffer = noiseBuf; s.loop = true;
    fl.type = ftype; fl.frequency.setValueAtTime(f0, t0); if (f1 !== f0) fl.frequency.exponentialRampToValueAtTime(Math.max(10, f1), t0 + dur);
    fl.Q.value = q;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + (attack || 0.003));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(fl); fl.connect(g); outNode(pan, g);
    s.start(t0, arand() * 1.5); s.stop(t0 + dur + 0.02); track(s);
  }
  function panOf(x) { return (x / 24 * 2 - 1) * 0.8; }
  var SHOT_PRIO = [4, 1, 3, 0, 2]; // lance, cannon, flak, frost, bolt (loudest first)
  var shotTimes = [], killTimes = [];
  function sndShot(type, pan) {
    var v = 0.94 + arand() * 0.12;
    if (type === 0) { tone('square', 1900 * v, 700, 0.05, 0.05, pan); }
    else if (type === 1) { tone('sine', 150 * v, 42, 0.22, 0.3, pan); noise('lowpass', 900, 200, 0.7, 0.16, 0.2, pan); }
    else if (type === 2) { tone('sine', 2600 * v, 2300, 0.13, 0.06, pan); tone('sine', 3900 * v, 3500, 0.1, 0.035, pan); noise('highpass', 5000, 7000, 0.5, 0.08, 0.03, pan); }
    else if (type === 3) { tone('sawtooth', 240 * v, 1300, 0.16, 0.13, pan); tone('sine', 90, 55, 0.2, 0.2, pan); noise('bandpass', 2500, 900, 2, 0.12, 0.08, pan); }
    else { noise('bandpass', 1500 * v, 700, 1.2, 0.09, 0.16, pan); tone('triangle', 520 * v, 240, 0.07, 0.08, pan); }
  }
  function sndKill(pan) { tone('sine', 520 + arand() * 160, 230, 0.07, 0.07, pan); }
  function sndHorn() {
    tone('sawtooth', 98, 147, 0.75, 0.085, -0.5, 0, 0.12); tone('sawtooth', 98.8, 148.2, 0.75, 0.085, -0.3, 0, 0.12);
    tone('triangle', 196, 294, 0.75, 0.07, -0.4, 0, 0.15);
  }
  function sndLeak() {
    noise('bandpass', 900, 300, 1.0, 0.2, 0.4, 0.7); noise('highpass', 3000, 2000, 0.6, 0.05, 0.16, 0.7);
    tone('square', 880, 880, 0.11, 0.07, 0.6, 0.02); tone('square', 660, 660, 0.14, 0.07, 0.6, 0.15);
  }
  function sndFall() {
    tone('sine', 70, 24, 2.4, 0.6, 0.6, 0, 0.01); tone('triangle', 46, 30, 3.0, 0.3, 0.5, 0.05, 0.05);
    noise('lowpass', 500, 60, 0.6, 3.2, 0.55, 0.5, 0, 0.02); noise('bandpass', 1400, 200, 0.8, 0.9, 0.3, 0.6, 0, 0.005);
  }
  function startWind() {
    if (!actx || windNodes) return;
    var s = actx.createBufferSource(), fl = actx.createBiquadFilter(), g = actx.createGain(), lfo = actx.createOscillator(), lg = actx.createGain();
    s.buffer = noiseBuf; s.loop = true; fl.type = 'bandpass'; fl.frequency.value = 260; fl.Q.value = 0.9;
    g.gain.setValueAtTime(0.0001, actx.currentTime); g.gain.linearRampToValueAtTime(0.11, actx.currentTime + 1.5);
    lfo.frequency.value = 0.17; lg.gain.value = 90; lfo.connect(lg); lg.connect(fl.frequency);
    s.connect(fl); fl.connect(g); g.connect(master);
    s.start(); lfo.start();
    windNodes = [s, lfo];
  }
  function stopWind() {
    if (!windNodes) return;
    for (var i = 0; i < windNodes.length; i++) { try { windNodes[i].stop(actx.currentTime + 0.05); } catch (e) { } }
    windNodes = null;
  }
  function limiter(times, max, now) {
    while (times.length && now - times[0] >= 1) times.shift();
    if (times.length >= max) return false;
    times.push(now); return true;
  }
  var pendShots = [];
  function audioAdvance(prev, cur) { // forward playback carried simTime from prev to cur
    if (!actx || actx.state !== 'running') return;
    var kA = Math.floor(prev * TPS + 1e-9) + 1, kB = Math.floor(cur * TPS + 1e-9), i, e, now = actx.currentTime;
    if (prev <= 0 && cur > 0) kA = 0;
    var kEnd = Math.min(kB, R.lastFrame);
    if (kEnd >= kA) {
      if (kEnd - kA > 12) kA = kEnd - 12;       // never burst after a long frame
      for (i = kA; i <= kEnd; i++) if (i >= 20 && (i - 20) % 40 === 0 && i < R.fallTime * TPS) sndHorn();
      pendShots.length = 0;
      for (i = R.shotAt[kA]; i < R.shotAt[kEnd + 1]; i++) pendShots.push(R.shots[i]);
      pendShots.sort(function (a, b) { return SHOT_PRIO[a.type] - SHOT_PRIO[b.type] || a.t - b.t; });
      for (i = 0; i < pendShots.length; i++) { if (!limiter(shotTimes, 12, now)) break; sndShot(pendShots[i].type, panOf(SLOTS[pendShots[i].slot][0] + 0.5)); }
      for (i = R.killAt[kA]; i < R.killAt[kEnd + 1]; i++) { if (!limiter(killTimes, 8, now)) break; sndKill(panOf(R.kills[i].x)); }
      for (i = R.leakAt[kA]; i < R.leakAt[kEnd + 1]; i++) sndLeak();
      if (R.fallTick >= kA && R.fallTick <= kEnd) sndFall();
    }
    if (cur >= R.fallTime + 1.2) startWind(); else stopWind();
  }

  // ------------------------------------------------------------------ playback state machine
  var elCount = document.getElementById('countdown'), elScrub = document.getElementById('scrubber');
  var elToggle = document.getElementById('btn-toggle'), elRefire = document.getElementById('btn-refire');
  var elPause = document.getElementById('icon-pause'), elPlay = document.getElementById('icon-play');
  var pills = Array.prototype.slice.call(document.querySelectorAll('.speed-pill'));
  var state = 'COUNTDOWN', simTime = 0, playbackSpeed = 1.0, countdownElapsed = 0, holdElapsed = 0, lastTs = null, started = false;

  function showCountdown(txt) { if (elCount.textContent !== txt) elCount.textContent = txt; if (elCount.style.display !== 'block') elCount.style.display = 'block'; }
  function hideCountdown() { elCount.style.display = 'none'; elCount.textContent = ''; }
  function setIcon(playing) {
    elPause.style.display = playing ? '' : 'none';
    elPlay.style.display = playing ? 'none' : '';
    elToggle.setAttribute('aria-label', playing ? 'Pause' : 'Play');
  }
  function setState(s) {
    state = s;
    setAudible(s === 'PLAYING');
    setIcon(s === 'PLAYING' || s === 'COUNTDOWN' || s === 'REFIRE_HOLD');
  }
  elToggle.addEventListener('click', function () {
    if (state === 'PLAYING') setState('PAUSED');
    else if (state === 'COUNTDOWN' || state === 'REFIRE_HOLD') { hideCountdown(); simTime = 0; elScrub.value = '0'; setState('PAUSED'); renderAt(simTime); }
    else if (state === 'PAUSED') setState('PLAYING');
    else if (state === 'ENDED') { hideCountdown(); simTime = 0; elScrub.value = '0'; setState('PLAYING'); renderAt(simTime); }
  });
  elRefire.addEventListener('click', function () {
    hideCountdown();
    simTime = 0; elScrub.value = '0'; holdElapsed = 0; countdownElapsed = 0;
    setState('REFIRE_HOLD');
    renderAt(simTime);
  });
  elScrub.addEventListener('input', function () {
    hideCountdown();
    var v = parseFloat(elScrub.value);
    simTime = isFinite(v) ? Math.max(0, Math.min(DURATION, v)) : 0;
    setState('PAUSED');
    renderAt(simTime);
  });
  pills.forEach(function (p) {
    p.addEventListener('click', function () {
      playbackSpeed = parseFloat(p.getAttribute('data-speed'));
      pills.forEach(function (o) { var on = o === p; o.classList.toggle('is-active', on); o.setAttribute('aria-checked', on ? 'true' : 'false'); });
    });
  });

  function frame(ts) {
    requestAnimationFrame(frame);
    if (!started) { // first rAF after the resting scene rendered: start the countdown
      started = true; lastTs = ts; countdownElapsed = 0;
      if (state === 'COUNTDOWN') showCountdown('3');
      return;
    }
    var dt = Math.min((ts - lastTs) / 1000, 0.1); lastTs = ts;
    if (dt < 0) dt = 0;
    if (state === 'COUNTDOWN') {
      countdownElapsed += dt;
      if (countdownElapsed >= 3) { hideCountdown(); setState('PLAYING'); }
      else showCountdown(countdownElapsed < 1 ? '3' : countdownElapsed < 2 ? '2' : '1');
    } else if (state === 'REFIRE_HOLD') {
      holdElapsed += dt;
      if (holdElapsed >= 1) setState('PLAYING');
    } else if (state === 'PLAYING') {
      var prev = simTime;
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      elScrub.value = simTime.toFixed(3);
      audioAdvance(prev, simTime);
      if (simTime >= DURATION) { simTime = DURATION; elScrub.value = DURATION.toFixed(3); renderAt(simTime); setState('ENDED'); return; }
    }
    renderAt(simTime);
  }

  window.addEventListener('resize', onResize);
  elScrub.value = '0';
  setIcon(true);
  fitCamera();
  hudCam.left = 0; hudCam.right = window.innerWidth; hudCam.top = 0; hudCam.bottom = window.innerHeight; hudCam.updateProjectionMatrix();
  renderAt(0);                       // initial resting scene
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
