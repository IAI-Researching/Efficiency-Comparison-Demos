<script id="rampart-strategy">
function createStrategy() {

  var TURRETS = {
    bolt:   { cost: 50,  dmg: 26,  period: 8,  range: 300 },
    cannon: { cost: 90,  dmg: 60,  period: 24, range: 260 },
    frost:  { cost: 70,  dmg: 10,  period: 12, range: 240 },
    lance:  { cost: 120, dmg: 180, period: 36, range: 360 },
    flak:   { cost: 80,  dmg: 40,  period: 10, range: 320 }
  };
  var SLOTS = [[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],[14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]];
  var GROUND = [[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]];
  var AIR = [[0,6],[21,6],[21,11],[23,11]];

  function segsOf(route) {
    var segs = [], t = 0;
    for (var i = 0; i < route.length - 1; i++) {
      var x0 = route[i][0] * 100 + 50, y0 = route[i][1] * 100 + 50;
      var x1 = route[i + 1][0] * 100 + 50, y1 = route[i + 1][1] * 100 + 50;
      var len = Math.abs(x1 - x0) + Math.abs(y1 - y0);
      segs.push([x0, y0, x1, y1, t, len]);
      t += len;
    }
    return segs;
  }
  var GS = segsOf(GROUND), AS = segsOf(AIR), GLEN = GS[GS.length - 1][4] + GS[GS.length - 1][5], ALEN = AS[AS.length - 1][4] + AS[AS.length - 1][5];

  // remaining distance along route from closest point to (x,y)
  function remaining(segs, total, x, y) {
    var best = 1e9;
    for (var s = 0; s < segs.length; s++) {
      var sg = segs[s];
      var ax = Math.max(Math.min(x, Math.max(sg[0], sg[2])), Math.min(sg[0], sg[2]));
      var ay = Math.max(Math.min(y, Math.max(sg[1], sg[3])), Math.min(sg[1], sg[3]));
      var dx = x - ax, dy = y - ay;
      var along = (sg[2] !== sg[0]) ? Math.abs(ax - sg[0]) : Math.abs(ay - sg[1]);
      var rem = sg[4] + sg[5] - along + Math.sqrt(dx * dx + dy * dy);
      if (rem < best) best = rem;
    }
    return best;
  }
  // distance from slot centre to route (closest point)
  function distTo(segs, x, y) {
    var best = 1e9, at = 0;
    for (var s = 0; s < segs.length; s++) {
      var sg = segs[s];
      var ax = Math.max(Math.min(x, Math.max(sg[0], sg[2])), Math.min(sg[0], sg[2]));
      var ay = Math.max(Math.min(y, Math.max(sg[1], sg[3])), Math.min(sg[1], sg[3]));
      var dx = x - ax, dy = y - ay;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < best) { best = d; at = sg[4] + ((sg[2] !== sg[0]) ? Math.abs(ax - sg[0]) : Math.abs(ay - sg[1])); }
    }
    return { d: best, at: at };
  }

  var BUCKET = 60;
  var PREFERRED = ['lance', 'cannon', 'bolt', 'bolt'];
  var slots = [];
  for (var i = 0; i < 16; i++) {
    var x = SLOTS[i][0] * 100 + 50, y = SLOTS[i][1] * 100 + 50;
    var gg = distTo(GS, x, y), aa = distTo(AS, x, y);
    slots.push({ slot: i, x: x, y: y, gd: gg.d, gat: gg.at, ad: aa.d });
  }

  function tierDmg(d, tier) {
    if (tier === 2) return Math.floor(d * 16 / 10);
    if (tier === 3) return Math.floor(Math.floor(d * 16 / 10) * 16 / 10);
    return d;
  }
  // time (ticks) an enemy stays inside the turret's circle around the slot
  function coverage(sl, type, tier) {
    var rng = TURRETS[type].range + (tier - 1) * 30;
    var d = sl.gd;
    if (d >= rng) return 0;
    var half = Math.sqrt(rng * rng - d * d);
    var m = Math.min(4, Math.floor((rng - d) / BUCKET) + 1);
    var tot = 0;
    for (var k = 0; k < m; k++) {
      var D = d + k * BUCKET + BUCKET / 2;
      var h = D < rng ? Math.sqrt(rng * rng - D * D) : 0;
      var span = Math.min(half, h) * 2;
      tot += span * Math.pow(D / rng, 0.8);
    }
    return tot / Math.max(1, m);
  }
  function valueScore(sl, type, tier) {
    var sp = TURRETS[type];
    var dps = tierDmg(sp.dmg, tier) / sp.period;
    var cov = coverage(sl, type, tier);
    var v;
    if (type === 'frost') v = 0.8 * dps * Math.sqrt(1 + cov / 100);
    else if (type === 'flak') v = 0.5 * dps * (cov / 100);
    else if (type === 'cannon') v = 2.5 * dps * (cov / 100) + 0.2;
    else if (type === 'lance') v = dps * Math.sqrt(1 + cov / 50);
    else v = 0.6 * dps * (cov / 100);
    return v;
  }

  function plan(s) {
    var acts = [];
    var gold = s.gold;
    var turrets = [], empty = [];
    for (var i = 0; i < 16; i++) {
      var sl = s.slots[i];
      if (sl.turret) turrets.push({ slot: sl.slot, turret: { type: sl.turret.type, tier: sl.turret.tier } });
      else empty.push(slots[i]);
    }
    var nWisp = 0, nOther = 0;
    for (var k = 0; k < s.nextWave.length; k++) { if (s.nextWave[k] === 'wisp') nWisp++; else nOther++; }
    var airOn = s.wave >= 3;
    var counts = { bolt: 0, cannon: 0, frost: 0, lance: 0, flak: 0 };
    var nFlak = 0;
    for (var q = 0; q < turrets.length; q++) { counts[turrets[q].turret.type]++; if (turrets[q].turret.type === 'flak') nFlak++; }
    var guard = 0;
    while (guard++ < 24) {
      var best = null;
      for (var e = 0; e < empty.length; e++) {
        var candidates = PREFERRED;
        if (airOn && nFlak < 6 && empty[e].ad < 400 && nWisp >= 2) candidates = candidates.concat(['flak', 'flak']);
        if (counts.frost < 3) candidates = candidates.concat(['frost']);
        for (var ci = 0; ci < candidates.length; ci++) {
          var ty = candidates[ci];
          var sp = TURRETS[ty];
          if (sp.cost > gold) continue;
          var v = valueScore(empty[e], ty, 1) / sp.cost;
          if (ty === 'flak' && (empty[e].ad > 380)) continue;
          if (ty !== 'flak' && (empty[e].gd > 700)) continue;
          if (!best || v > best.v) best = { v: v, sl: empty[e], type: ty, cost: sp.cost };
        }
      }
      if (!best) break;
      if (best.v < 0.002 && turrets.length >= 16) break;
      acts.push({ op: 'build', slot: best.sl.slot, type: best.type });
      gold -= best.cost;
      counts[best.type]++; if (best.type === 'flak') nFlak++;
      turrets.push({ slot: best.sl.slot, turret: { type: best.type, tier: 1 } });
      empty.splice(empty.indexOf(best.sl), 1);
    }
    var uguard = 0;
    while (uguard++ < 24) {
      var bu = null;
      for (var u = 0; u < turrets.length; u++) {
        var t = turrets[u].turret;
        if (t.tier >= 3) continue;
        var sp2 = TURRETS[t.type];
        var cost = sp2.cost * (t.tier === 1 ? 1 : 2);
        if (cost > gold) continue;
        var sl2 = slots[turrets[u].slot];
        var dv = valueScore(sl2, t.type, t.tier + 1) - valueScore(sl2, t.type, t.tier);
        var v2 = dv / cost;
        if (!bu || v2 > bu.v) bu = { v: v2, sl: turrets[u], cost: cost };
      }
      if (!bu || bu.v < 0.005) break;
      acts.push({ op: 'upgrade', slot: bu.sl.slot });
      gold -= bu.cost;
      bu.sl.turret.tier++;
    }
    return acts;
  }

  var LEAK = { grunt: 1, runner: 1, wisp: 2, brute: 3, splitter: 2, mender: 2, splitling: 1 };
  function threat(c) {
    var leak = LEAK[c.type] || 1;
    var sp = c.speed > 0 ? c.speed : 1;
    return leak / Math.max(1, (c.hp - 1) / sp + c.remaining / sp * 0.3);
  }
  function target(turret, cands) {
    var best = null, bestSc = -1e18;
    var mode = turret.type === 'frost' ? 'hp' : (turret.type === 'flak' ? 'remaining' : 'threat');
    var tdm = mode === 'overkill' ? (TURRETS[turret.type] ? Math.floor(TURRETS[turret.type].dmg * (turret.tier === 3 ? 2.56 : turret.tier === 2 ? 1.6 : 1)) : 0) : 0;
    for (var i = 0; i < cands.length; i++) {
      var c = cands[i];
      var sc;
      if (mode === 'threat') sc = threat(c) * 1e6 - c.remaining * 0.001;
      else if (mode === 'hp') sc = c.maxHp * 1e6 - c.remaining * 0.001;
      else if (mode === 'overkill') sc = -Math.abs(c.hp - tdm) * 1e6 - c.remaining * 0.001;
      else if (mode === 'first') sc = -c.id;
      else sc = -c.remaining * 1e6 - c.id;
      if (sc > bestSc) { bestSc = sc; best = c; }
    }
    return best ? best.id : undefined;
  }

  return { plan: plan, target: target };
}

</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks) {
  // ---- Exact game rules (section 2) ----
  var TURRETS = {
    bolt:   { cost: 50,  dmg: 26,  period: 8,  range: 300, splash: 0,  slow: 0,  pierce: 0, ground: 1, air: 1 },
    cannon: { cost: 90,  dmg: 60,  period: 24, range: 260, splash: 90, slow: 0,  pierce: 0, ground: 1, air: 0 },
    frost:  { cost: 70,  dmg: 10,  period: 12, range: 240, splash: 0,  slow: 30, pierce: 0, ground: 1, air: 1 },
    lance:  { cost: 120, dmg: 180, period: 36, range: 360, splash: 0,  slow: 0,  pierce: 1, ground: 1, air: 0 },
    flak:   { cost: 80,  dmg: 40,  period: 10, range: 320, splash: 70, slow: 0,  pierce: 0, ground: 0, air: 1 }
  };
  var TYPE_INDEX = { bolt: 0, cannon: 1, frost: 2, lance: 3, flak: 4 };
  var SPAWN_ORDER = ['grunt', 'runner', 'wisp', 'brute', 'splitter', 'mender'];
  var ENEMY = {
    grunt:     { hp: 60,  speed: 10, bounty: 4, leak: 1, air: 0, first: 1, weight: 10 },
    runner:    { hp: 40,  speed: 20, bounty: 4, leak: 1, air: 0, first: 2, weight: 4 },
    wisp:      { hp: 50,  speed: 12, bounty: 6, leak: 2, air: 1, first: 3, weight: 3 },
    brute:     { hp: 150, speed: 6,  bounty: 9, leak: 3, air: 0, first: 4, weight: 3 },
    splitter:  { hp: 90,  speed: 8,  bounty: 6, leak: 2, air: 0, first: 6, weight: 2 },
    mender:    { hp: 70,  speed: 8,  bounty: 7, leak: 2, air: 0, first: 8, weight: 1 },
    splitling: { hp: 0,   speed: 12, bounty: 1, leak: 1, air: 0, first: 99, weight: 0 }
  };
  var SLOT_TILES = [[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],[14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]];
  var GROUND = [[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]];
  var AIR = [[0,6],[21,6],[21,11],[23,11]];

  function buildRoute(pts) {
    var segs = [], total = 0;
    for (var i = 0; i < pts.length - 1; i++) {
      var x0 = pts[i][0] * 100 + 50, y0 = pts[i][1] * 100 + 50;
      var x1 = pts[i + 1][0] * 100 + 50, y1 = pts[i + 1][1] * 100 + 50;
      var len = Math.abs(x1 - x0) + Math.abs(y1 - y0);
      segs.push({ x0: x0, y0: y0, x1: x1, y1: y1, start: total, len: len });
      total += len;
    }
    return { segs: segs, total: total };
  }
  var GROUND_ROUTE = buildRoute(GROUND);
  var AIR_ROUTE = buildRoute(AIR);

  function routePos(route, p) {
    var segs = route.segs;
    for (var i = 0; i < segs.length; i++) {
      var s = segs[i];
      if (p <= s.start + s.len || i === segs.length - 1) {
        var d = p - s.start;
        if (d < 0) d = 0;
        if (d > s.len) d = s.len;
        if (s.x1 !== s.x0) return { x: s.x0 + (s.x1 > s.x0 ? d : -d), y: s.y0 };
        return { x: s.x0, y: s.y0 + (s.y1 > s.y0 ? d : -d) };
      }
    }
    var l = segs[segs.length - 1];
    return { x: l.x1, y: l.y1 };
  }

  function mulberry32(a) { return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return (t ^ (t >>> 14)) >>> 0;
  }; }
  var rng = mulberry32(seed >>> 0);

  // HP multiplier m(w): m(1) = 1000, m(w) = floor(m(w-1) * 108 / 100)
  var mTable = [1000, 1000];
  function multAt(w) {
    while (mTable.length <= w) mTable.push(Math.floor(mTable[mTable.length - 1] * 108 / 100));
    return mTable[w];
  }

  function composeWave(w) {
    var types = [], total = 0;
    for (var i = 0; i < SPAWN_ORDER.length; i++) {
      var e = ENEMY[SPAWN_ORDER[i]];
      if (e.first <= w) { types.push(SPAWN_ORDER[i]); total += e.weight; }
    }
    var count = 4 + Math.floor(3 * w / 5);
    var out = [];
    for (var k = 0; k < count; k++) {
      var r = rng() % total;
      for (var j = 0; j < types.length; j++) {
        var wt = ENEMY[types[j]].weight;
        if (r < wt) { out.push(types[j]); break; }
        r -= wt;
      }
    }
    return out;
  }

  var log = [];
  var logStr = '';
  function addLog(t, code, a, b) {
    log.push([t, code, a, b]);
    logStr += (log.length === 1 ? '' : ',') + '[' + t + ',"' + code + '",' + a + ',' + b + ']';
  }

  var gold = 250, baseHp = 10;
  var tick = 0, wave = 0, nextId = 1, fallTick = -1, endTick = maxTicks;
  var enemies = [];
