  background: rgba(255, 255, 255, 0.16);
}

          tone('sine', 520 + ar() * 180, 210, 0.07, 0.07, panOf(_rp.x));
        }
        for (i = rep.waveIdx[kA + 1]; i < rep.waveIdx[kB + 1]; i++) {        // rising horn
          tone('sawtooth', 147, 220, 0.6, 0.085, -0.5, 0.08); tone('triangle', 220, 330, 0.62, 0.11, -0.5, 0.1); tone('sawtooth', 110, 165, 0.6, 0.05, -0.4, 0.1);
        }
        for (i = rep.leakIdx[kA + 1]; i < rep.leakIdx[kB + 1]; i++) {        // stone crack + alarm
          if (rep.fall && rep.leaks[i].tick === rep.fall.tick && rep.leaks[i].hp <= 0) continue;
          noise('lowpass', 2600, 300, 0.8, 0.22, 0.42, 0.75, 0.002); tone('square', 880, 870, 0.13, 0.07, 0.7); tone('square', 660, 650, 0.3, 0.07, 0.7, 0.14);
        }
      }
      if (rep.fall && rep.fall.tick > kA && rep.fall.tick <= kB) {            // deep collapse with rumble
        noise('lowpass', 1400, 70, 0.6, 2.4, 0.75, 0.6, 0.01); tone('sine', 62, 27, 2.6, 0.6, 0.6, 0.02); tone('triangle', 96, 34, 1.5, 0.3, 0.6, 0.01);
        noise('bandpass', 400, 120, 0.9, 1.2, 0.35, 0.6, 0.005);
      }
    }
    function windOn(on) {
      if (!ctx) return;
      if (on && !wind && ctx.state === 'running') {
        wind = ctx.createBufferSource(); wind.buffer = noiseBuf; wind.loop = true; wind.playbackRate.value = 0.5;
        var fl = ctx.createBiquadFilter(); fl.type = 'bandpass'; fl.frequency.value = 260; fl.Q.value = 0.6;
        var lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = 0.17; lg.gain.value = 110; lfo.connect(lg); lg.connect(fl.frequency);
        windGain = ctx.createGain(); windGain.gain.setValueAtTime(0.0001, ctx.currentTime); windGain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + 1.5);
        wind.connect(fl); fl.connect(windGain); windGain.connect(master);
        wind.start(); lfo.start(); wind._lfo = lfo;
      } else if (!on && wind) {
        try { wind.stop(); wind._lfo.stop(); } catch (e) { }
        wind = null; windGain = null;
      }
    }
    // sound is audible only while PLAYING; anything still ringing is cut when playback stops
    function setAudible(on) {
      if (!ctx || on === audible) return;
      audible = on;
      var now = ctx.currentTime;
      master.gain.cancelScheduledValues(now);
      master.gain.setValueAtTime(master.gain.value, now);
      master.gain.linearRampToValueAtTime(on ? 0.8 : 0, now + 0.04);
      if (!on) {
        var old = live; live = [];
        for (var i = 0; i < old.length; i++) { try { old[i].onended = null; old[i].stop(now + 0.05); } catch (e) { } }
        windOn(false);
        shotTimes.length = 0; popTimes.length = 0;
      }
    }
    return { advance: advance, setAudible: setAudible, windOn: windOn };
  })();

  // ------------------------------------------------------------------ playback state machine
  var COUNTDOWN = 0, PLAYING = 1, PAUSED = 2, REFIRE_HOLD = 3, ENDED = 4;
  var state = -1, simTime = 0, playbackSpeed = 1.0, countdownElapsed = 0, holdElapsed = 0, lastTs = null;
  var elCount = document.getElementById('countdown'), elScrub = document.getElementById('scrubber'), elToggle = document.getElementById('btn-toggle');
  var elPause = document.getElementById('icon-pause'), elPlay = document.getElementById('icon-play'), pills = document.querySelectorAll('.speed-pill');

  function showPauseIcon(pauseShown) {
    elPause.style.display = pauseShown ? '' : 'none';
    elPlay.style.display = pauseShown ? 'none' : '';
    elToggle.setAttribute('aria-label', pauseShown ? 'Pause' : 'Play');
  }
  function hideCountdown() { elCount.style.display = 'none'; elCount.textContent = ''; }
  function setState(s) {
    state = s;
    audio.setAudible(s === PLAYING);
  }

  elToggle.addEventListener('click', function () {
    if (state === PLAYING) { setState(PAUSED); showPauseIcon(false); }
    else if (state === COUNTDOWN || state === REFIRE_HOLD) { hideCountdown(); simTime = 0; setState(PAUSED); showPauseIcon(false); }
    else if (state === PAUSED) { setState(PLAYING); showPauseIcon(true); }
    else if (state === ENDED) { hideCountdown(); simTime = 0; elScrub.value = '0'; setState(PLAYING); showPauseIcon(true); }
  });
  for (var pi = 0; pi < pills.length; pi++) {
    pills[pi].addEventListener('click', function () {
      playbackSpeed = parseFloat(this.getAttribute('data-speed'));
      for (var k = 0; k < pills.length; k++) {
        var on = pills[k] === this;
        pills[k].classList.toggle('is-active', on);
        pills[k].setAttribute('aria-checked', on ? 'true' : 'false');
      }
    });
  }
  elScrub.addEventListener('input', function () {
    hideCountdown();
    var v = parseFloat(elScrub.value);
    simTime = Math.max(0, Math.min(DURATION, isNaN(v) ? 0 : v));
    setState(PAUSED); showPauseIcon(false);
    renderAt(simTime);
  });
  document.getElementById('btn-refire').addEventListener('click', function () {
    hideCountdown();
    simTime = 0; elScrub.value = '0';
    setState(REFIRE_HOLD); holdElapsed = 0;
    showPauseIcon(true);
    renderAt(0);
  });
  window.addEventListener('resize', function () { fitCamera(); renderAt(simTime); });

  function frame(ts) {
    requestAnimationFrame(frame);
    if (lastTs === null) {                  // first frame after the resting scene: the countdown starts here
      lastTs = ts;
      if (state === -1) { state = COUNTDOWN; countdownElapsed = 0; elCount.style.display = 'block'; elCount.textContent = '3'; }
      renderAt(simTime);
      return;
    }
    var dt = Math.min((ts - lastTs) / 1000, 0.1);
    if (dt < 0) dt = 0;
    lastTs = ts;
    if (state === COUNTDOWN) {
      countdownElapsed += dt;
      if (countdownElapsed >= 3) { hideCountdown(); setState(PLAYING); showPauseIcon(true); }
      else { elCount.style.display = 'block'; elCount.textContent = countdownElapsed < 1 ? '3' : countdownElapsed < 2 ? '2' : '1'; }
    } else if (state === REFIRE_HOLD) {
      holdElapsed += dt;
      if (holdElapsed >= 1) { setState(PLAYING); showPauseIcon(true); }
    } else if (state === PLAYING) {
      var prev = simTime;
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      elScrub.value = simTime.toFixed(3);
      audio.advance(prev, simTime);
      audio.windOn(simTime >= T_FALL + 1.2);
      if (simTime >= DURATION) {
        simTime = DURATION; elScrub.value = DURATION.toFixed(3);
        setState(ENDED); showPauseIcon(false);
      }
    }
    renderAt(simTime);
  }

  fitCamera();
  renderAt(0);                              // the initial resting scene
  requestAnimationFrame(frame);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="100" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>
</body>
</html>
