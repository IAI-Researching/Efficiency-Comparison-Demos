<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last Rampart: Wave Defense Strategist</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="100" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script id="rampart-strategy">
function createStrategy() {
  "use strict";
  // ---------------- parameters ----------------
  var P = {
    H1: 320,            // short (just-in-time) horizon, ticks
    H2: 480,            // long horizon for spending gold above the bank target
    softW: 1.0,         // weight of surviving hp fraction of leakers in J
    pressW: 1.5,        // weight of end-of-horizon pressure
    pressPow: 3,
    steps1: 10, steps2: 8,
    bank: 1000,         // gold kept for interest
    relWave: 22,        // from this wave on the bank target is 0
    replTier: 1,        // stage 1: replace candidates for turrets up to this tier
    replTier2: 3,       // stage 2
    boltArmCut: 3,
    boltT: [0, 0, 0, 0, 0, 1000, 0],      // per enemy type bonus (ticks) for bolt targeting
    lanceT: [0, 0, 0, 0, 0, 1000, 0],
    lanceEffW: 60, lanceArmW: 1.0,
    frostT: [0, 0, 0, 0, 0, 0, 0],
    canW: [1, 1, 1, 1, 1, 30, 1],         // per enemy type weight for splash value
    canUrg: 3.0,
    minRatio: 0,
    ban1: [0, 0, 0, 0, 0], ban2: [0, 0, 0, 0, 0],   // turret types excluded from stage 1 / stage 2 candidates
    softFall: 0,        // extra weight (in ticks) of leakers' surviving hp once a fall is predicted
    s1AfterRel: 1,      // keep the just-in-time stage after the bank is released
    replBound: 4,       // tier >= 2 replacements only when at most this many ordinary candidates exist
    fresh: 10,          // allow sell-and-rebuild of reloading cannons / lances with at least this cooldown left
    skipZero: 2,        // re-evaluate candidates that did nothing last time only every skipZero-th wave
    lazy: 1,
    budget: 2.4e8
  };

  // ---------------- static tables ----------------
  var SLOTS = [[3, 3], [5, 5], [7, 4], [7, 8], [9, 9], [10, 5], [11, 8], [13, 8], [14, 5], [15, 2], [16, 7], [17, 4], [19, 8], [20, 10], [22, 9], [3, 7]];
  function mkRoute(pts) {
    var xs = [], ys = [], i, k;
    for (i = 0; i + 1 < pts.length; i++) {
      var ax = pts[i][0] * 100 + 50, ay = pts[i][1] * 100 + 50, bx = pts[i + 1][0] * 100 + 50, by = pts[i + 1][1] * 100 + 50;
      var len = Math.abs(bx - ax) + Math.abs(by - ay), sx = bx > ax ? 1 : (bx < ax ? -1 : 0), sy = by > ay ? 1 : (by < ay ? -1 : 0);
      for (k = 0; k < len; k++) { xs.push(ax + sx * k); ys.push(ay + sy * k); }
      if (i + 2 === pts.length) { xs.push(bx); ys.push(by); }
    }
    return [Int32Array.from(xs), Int32Array.from(ys)];
  }
  var RG = mkRoute([[0, 2], [6, 2], [6, 10], [12, 10], [12, 3], [18, 3], [18, 11], [23, 11]]);
  var RA = mkRoute([[0, 6], [21, 6], [21, 11], [23, 11]]);
  var GX = RG[0], GY = RG[1], AX = RA[0], AY = RA[1], GLEN = 4600, ALEN = 2800;
  var TNAMES = ["bolt", "cannon", "frost", "lance", "flak"];
  //           cost dmg period range splash slow pierce ground air
  var TDEF = [[50, 26, 8, 300, 0, 0, 0, 1, 1], [90, 60, 24, 260, 90, 0, 0, 1, 0], [70, 10, 12, 240, 0, 30, 0, 1, 1], [120, 180, 36, 360, 0, 0, 1, 1, 0], [80, 40, 10, 320, 70, 0, 0, 0, 1]];
  var EIDX = { grunt: 0, runner: 1, wisp: 2, brute: 3, splitter: 4, mender: 5, splitling: 6 };
  //           hp speed bounty leak air firstWave weight
  var EDEF = [[60, 10, 4, 1, 0, 1, 10], [40, 20, 4, 1, 0, 2, 4], [50, 12, 6, 2, 1, 3, 3], [150, 6, 9, 3, 0, 4, 3], [90, 8, 6, 2, 0, 6, 2], [70, 8, 7, 2, 0, 8, 1], [0, 12, 1, 1, 0, 0, 0]];
  var mult = [0, 1000];
  function hpMult(w) { while (mult.length <= w) mult.push(Math.floor(mult[mult.length - 1] * 108 / 100)); return mult[w]; }

  var covCache = {};
  function cov(slot, range, air) {
    var key = slot * 4000 + range * 2 + air, c = covCache[key];
    if (c) return c;
    var xs = air ? AX : GX, ys = air ? AY : GY, n = (air ? ALEN : GLEN) + 1, x = SLOTS[slot][0] * 100 + 50, y = SLOTS[slot][1] * 100 + 50, r2 = range * range;
    var tab = new Uint8Array(n), first = -1, last = -1;
    for (var p = 0; p < n; p++) { var dx = xs[p] - x, dy = ys[p] - y; if (dx * dx + dy * dy <= r2) { tab[p] = 1; if (first < 0) first = p; last = p; } }
    c = { tab: tab, first: first, last: last };
    covCache[key] = c;
    return c;
  }
  function tierDmg(type, tier) { var d = TDEF[type][1]; for (var k = 1; k < tier; k++) d = Math.floor(d * 16 / 10); return d; }
  function totalCost(type, tier) { var c = TDEF[type][0]; return tier === 1 ? c : (tier === 2 ? 2 * c : 4 * c); }

  function mkTurret(slot, type, tier, spent, cd) {
    var d = TDEF[type], range = d[3] + 30 * (tier - 1);
    var cg = d[7] ? cov(slot, range, 0) : null, ca = d[8] ? cov(slot, range, 1) : null;
    if (cg && cg.last < 0) cg = null;
    if (ca && ca.last < 0) ca = null;
    var h = type === 4 ? ca : cg;
    return { slot: slot, type: type, tier: tier, spent: spent, cd: cd, dmg: tierDmg(type, tier), range: range, period: d[2], splash: d[4], slow: d[5], pierce: d[6],
      covG: cg ? cg.tab : null, covA: ca ? ca.tab : null, lo: h ? h.first : 0, hi: h ? h.last : 0 };
  }

  // ---------------- wave compositions ----------------
  var comps = [null, [0, 0, 0, 0]];     // known compositions (type indices); wave 1 is always four grunts
  var guess = [];                       // deterministic guesses for unknown future waves
  function guessWave(w) {
    if (guess[w]) return guess[w];
    var n = 4 + Math.floor(3 * w / 5), total = 0, t, i, out = [], frac = [];
    for (t = 0; t < 6; t++) if (EDEF[t][5] <= w) total += EDEF[t][6];
    var left = n;
    for (t = 0; t < 6; t++) {
      if (EDEF[t][5] > w) { frac.push(-1); continue; }
      var q = n * EDEF[t][6] / total, c = Math.floor(q);
      frac.push(q - c); left -= c;
      for (i = 0; i < c; i++) out.push(t);
    }
    while (left > 0) { var bi = 0; for (t = 1; t < 6; t++) if (frac[t] > frac[bi]) bi = t; out.push(bi); frac[bi] = -1; left--; }
    var a = (w * 7919 + 12345) | 0;
    for (i = out.length - 1; i > 0; i--) {
      a = (a + 0x6D2B79F5) | 0; var z = Math.imul(a ^ (a >>> 15), 1 | a); z = (z + Math.imul(z ^ (z >>> 7), 61 | z)) ^ z; z = (z ^ (z >>> 14)) >>> 0;
      var j = z % (i + 1), tmp = out[i]; out[i] = out[j]; out[j] = tmp;
    }
    guess[w] = out;
    return out;
  }
  function compOf(w) { return comps[w] || guessWave(w); }

  // ---------------- internal engine (exact copy of the rules; ground and air kept in separate id-ordered lists) ----------------
  var work = 0;
  var CB = [];                              // candidate buffer
  var HB = new Float64Array(600);           // splash-value histogram (8 centi-tile bins)
  function newState() {
    return { tick: 0, gold: 250, base: 10, nid: 1, wave: 0, g: [], a: [], md: [], tur: [null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null],
      sched: null, leakDmg: 0, leakSoft: 0, fall: -1, lk: null, aborted: false, J: 0, JL: 0 };
  }
  function mkEnemy(S, ti, w, prog, maxHp, t) {
    var d = EDEF[ti];
    var e = { id: S.nid++, ti: ti, w: w, hp: maxHp, maxHp: maxHp, prog: prog, air: d[4], armor: ti === 0 ? Math.floor(w / 4) : (ti === 3 ? 6 + w : 0),
      spd: d[1], sspd: Math.floor(d[1] * 60 / 100), slowed: 0, b: t - 1, dead: false, bounty: d[2], ldmg: d[3] };
    if (d[4]) S.a.push(e); else { S.g.push(e); if (ti === 5) S.md.push(e); }
    return e;
  }
  function cloneList(src, md) {
    var n = src.length, out = new Array(n), i, e, c;
    for (i = 0; i < n; i++) {
      e = src[i];
      c = { id: e.id, ti: e.ti, w: e.w, hp: e.hp, maxHp: e.maxHp, prog: e.prog, air: e.air, armor: e.armor, spd: e.spd, sspd: e.sspd, slowed: e.slowed, b: e.b, dead: false, bounty: e.bounty, ldmg: e.ldmg };
      out[i] = c;
      if (md !== null && e.ti === 5) md.push(c);
    }
    return out;
  }
  function cloneS(S) {
    var md = [], g = cloneList(S.g, md), a = cloneList(S.a, null), tur = new Array(16), T, i;
    for (i = 0; i < 16; i++) {
      T = S.tur[i];
      tur[i] = T === null ? null : { slot: T.slot, type: T.type, tier: T.tier, spent: T.spent, cd: T.cd, dmg: T.dmg, range: T.range, period: T.period, splash: T.splash, slow: T.slow, pierce: T.pierce, covG: T.covG, covA: T.covA, lo: T.lo, hi: T.hi };
    }
    return { tick: S.tick, gold: S.gold, base: S.base, nid: S.nid, wave: S.wave, g: g, a: a, md: md, tur: tur, sched: null,
      leakDmg: 0, leakSoft: 0, fall: -1, lk: [], aborted: false, J: 0, JL: 0 };
  }
  // actions: [op, slot, type]  op 0 build, 1 upgrade, 2 sell
  function applyActs(S, acts) {
    for (var k = 0; k < acts.length && k < 32; k++) {
      var a = acts[k], sl = a[1], T = S.tur[sl];
      if (a[0] === 0) {
        if (T !== null) continue;
        var c = TDEF[a[2]][0];
        if (S.gold < c) continue;
        S.gold -= c; S.tur[sl] = mkTurret(sl, a[2], 1, c, 0);
      } else if (a[0] === 1) {
        if (T === null || T.tier >= 3) continue;
        var uc = TDEF[T.type][0] * T.tier;
        if (S.gold < uc) continue;
        S.gold -= uc; S.tur[sl] = mkTurret(sl, T.type, T.tier + 1, T.spent + uc, T.cd);
      } else {
        if (T === null) continue;
        S.gold += Math.floor(T.spent * 70 / 100); S.tur[sl] = null;
      }
    }
  }
  function compact(en) {
    var n = en.length, j = 0, i;
    for (i = 0; i < n; i++) if (!en[i].dead) en[j++] = en[i];
    en.length = j;
  }

  // target selection (uses full internal information; the engine replays it through target())
  function pick(S, T, m) {
    var i, e, best = CB[0], bu = -1e30, u, eff, dmg = T.dmg, type = T.type;
    if (m === 1) return best;
    if (type === 0) {            // bolt: menders first, then soonest to reach the base, avoiding heavy armour
      var bt = P.boltT, cut = P.boltArmCut;
      for (i = 0; i < m; i++) {
        e = CB[i];
        u = bt[e.ti] - ((e.air ? ALEN : GLEN) - e.prog) / e.spd;
        if ((dmg - e.armor) * cut < dmg) u -= 1e6;
        if (u > bu) { bu = u; best = e; }
      }
    } else if (type === 3) {     // lance: menders first, then full-value hits and armour, then urgency
      var lt = P.lanceT, ew = P.lanceEffW, aw = P.lanceArmW;
      for (i = 0; i < m; i++) {
        e = CB[i];
        u = lt[e.ti] + ew * (e.hp < dmg ? e.hp / dmg : 1) + aw * e.armor - (GLEN - e.prog) / e.spd;
        if (u > bu) { bu = u; best = e; }
      }
    } else if (type === 2) {     // frost: enemies that are not (or barely) slowed, soonest first
      var ft = P.frostT;
      for (i = 0; i < m; i++) {
        e = CB[i];
        u = (e.slowed <= 1 ? 1e6 : -e.slowed * 1e3) + ft[e.ti] - ((e.air ? ALEN : GLEN) - e.prog) / e.spd;
        if (u > bu) { bu = u; best = e; }
      }
    } else {                     // cannon / flak: maximise useful splash damage (along-path span estimate)
      var en = type === 4 ? S.a : S.g, n = en.length, rad = T.splash, cw = P.canW, urg = P.canUrg / (type === 4 ? ALEN : GLEN);
      var b0 = (T.lo - rad) >> 3, b1 = ((T.hi + rad) >> 3) + 1, b, o, p;
      if (b0 < 0) b0 = 0;
      for (b = b0; b <= b1 + 1; b++) HB[b] = 0;
      for (i = 0; i < n; i++) {
        o = en[i];
        b = o.prog >> 3;
        if (b < b0 || b > b1) continue;
        eff = dmg - o.armor; if (eff < 1) eff = 1; if (eff > o.hp) eff = o.hp;
        HB[b + 1] += eff * cw[o.ti] * (1 + urg * o.prog);
      }
      for (b = b0 + 1; b <= b1 + 1; b++) HB[b] += HB[b - 1];
      for (i = 0; i < m; i++) {
        e = CB[i]; p = e.prog;
        var lo = (p - rad) >> 3, hi = ((p + rad) >> 3) + 1;
        if (lo < b0) lo = b0;
        if (hi > b1 + 1) hi = b1 + 1;
        u = HB[hi] - HB[lo] + p * 1e-5;
        if (u > bu) { bu = u; best = e; }
      }
    }
    return best;
  }

  function leak(S, e, t) {
    S.base -= e.ldmg; S.leakDmg += e.ldmg; S.leakSoft += e.ldmg * e.hp / e.maxHp;
    if (S.lk !== null) S.lk.push(e.id, e.air);
    e.dead = true;
  }

  function run(S, t1, rec, bound) {
    var g = S.g, a = S.a, md = S.md, tur = S.tur, t, i, n, e, s, T, k, w, o, dx, dy, softW = P.softW;
    for (t = S.tick; t < t1; t++) {
      k = t - 20;
      if (k >= 0) {
        if (k % 40 === 0) {
          w = k / 40 + 1; S.wave = w;
          S.gold += Math.min(50, Math.floor(S.gold * 5 / 100)) + 10 + 2 * w;
          if (S.sched !== null && S.sched[w]) applyActs(S, S.sched[w]);
        }
        if ((k & 3) === 0) {
          w = S.wave;
          var lo = w - Math.floor((4 + Math.floor(3 * w / 5)) / 10);
          if (lo < 1) lo = 1;
          for (; lo <= w; lo++) {
            var idx = (t - 20 - 40 * (lo - 1)) >> 2, comp = compOf(lo);
            if (idx < comp.length) { var ti = comp[idx]; mkEnemy(S, ti, lo, 0, Math.floor(EDEF[ti][0] * hpMult(lo) / 1000), t); }
          }
        }
      }
      // move (+ slow timers of the previous tick)
      var ng = g.length, na = a.length, leaked = false;
      work += ng + na + 8;
      for (i = 0; i < ng; i++) {
        e = g[i];
        if (e.slowed > 0) { e.slowed--; e.prog += e.slowed > 0 ? e.sspd : e.spd; } else e.prog += e.spd;
        if (e.prog >= GLEN) { leak(S, e, t); leaked = true; }
      }
      if (leaked) { compact(g); ng = g.length; }
      var leakedA = false;
      for (i = 0; i < na; i++) {
        e = a[i];
        if (e.slowed > 0) { e.slowed--; e.prog += e.slowed > 0 ? e.sspd : e.spd; } else e.prog += e.spd;
        if (e.prog >= ALEN) { leak(S, e, t); leakedA = true; }
      }
      if (leakedA) { compact(a); na = a.length; leaked = true; }
      if (leaked) {
        if (S.base <= 0) { S.fall = t; S.tick = t; return; }
        if (bound >= 0 && S.leakDmg + softW * S.leakSoft >= bound) { S.tick = t + 1; S.aborted = true; return; }
      }
      // heal

  }

  // =====================================================================================
