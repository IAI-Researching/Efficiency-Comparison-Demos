<script id="rampart-strategy">
function createStrategy() {
  "use strict";
  const COSTS = { bolt: 50, cannon: 90, frost: 70, lance: 120, flak: 80 };
  const DMG_TABLE = {
    bolt: [0, 26, 41, 65],
    cannon: [0, 60, 96, 153],
    frost: [0, 10, 16, 25],
    lance: [0, 180, 288, 460],
    flak: [0, 40, 64, 102]
  };
  const QUEUE = [
    ["b", 8, "cannon"],
    ["u", 3, 2],
    ["u", 8, 2],
    ["b", 4, "cannon"],
    ["b", 11, "cannon"],
    ["b", 10, "frost"],
    ["u", 3, 3],
    ["u", 4, 3],
    ["b", 2, "cannon"],
    ["u", 2, 3],
    ["b", 1, "cannon"],
    ["u", 1, 3],
    ["u", 8, 3],
    ["b", 0, "cannon"],
    ["u", 0, 3],
    ["u", 11, 3],
    ["b", 7, "cannon"],
    ["u", 7, 3],
    ["u", 13, 3],
    ["b", 15, "flak"],
    ["u", 15, 3],
    ["b", 5, "flak"],
    ["u", 5, 3],
    ["b", 9, "cannon"],
    ["u", 9, 3],
    ["u", 6, 3],
    ["u", 10, 3]
  ];

  const slowStamp = {};
  let fireSeq = 0;

  return {
    plan(state) {
      const actions = [];
      let g = state.gold;
      const w = state.wave;
      const enemies = state.enemies;
      const simTurrets = new Array(16);
      for (let i = 0; i < 16; i++) {
        const t = state.slots[i].turret;
        simTurrets[i] = t ? { type: t.type, tier: t.tier, spent: t.spent } : null;
      }

      function tryBuild(slot, type) {
        if (simTurrets[slot] !== null) return false;
        const cost = COSTS[type];
        if (g < cost) return false;
        actions.push({ op: "build", slot: slot, type: type });
        g -= cost;
        simTurrets[slot] = { type: type, tier: 1, spent: cost };
        return true;
      }

      function tryUpgrade(slot) {
        const t = simTurrets[slot];
        if (!t || t.tier >= 3) return false;
        const cost = t.tier === 1 ? COSTS[t.type] : COSTS[t.type] * 2;
        if (g < cost) return false;
        actions.push({ op: "upgrade", slot: slot });
        g -= cost;
        t.tier += 1;
        t.spent += cost;
        return true;
      }

      let airDanger = 0;
      let groundDanger = 0;
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (e.air && e.remaining < 850) airDanger++;
        if (!e.air && e.remaining < 1000) groundDanger++;
      }
      let nextAir = 0;
      for (let i = 0; i < state.nextWave.length; i++) {
        if (state.nextWave[i] === "wisp") nextAir++;
      }

      const bank = (w >= 8 && w <= 19 && state.baseHp >= 10 && airDanger === 0 && groundDanger === 0) ? 400 : 0;

      if (!simTurrets[3] && g >= 90) tryBuild(3, "cannon");
      if (!simTurrets[13] && g >= 50) tryBuild(13, "bolt");
      if (w >= 2 && !simTurrets[6] && g >= 70) tryBuild(6, "frost");
      if ((w >= 3 && nextAir > 0) || airDanger > 0) {
        if (!simTurrets[12] && g >= 80) tryBuild(12, "flak");
      }
      if (simTurrets[12] && simTurrets[12].tier === 1 && (w >= 13 || (w >= 8 && airDanger > 0))) {
        if (g >= 80) tryUpgrade(12);
      }
      if (simTurrets[12] && simTurrets[12].tier === 2 && (w >= 21 || (w >= 16 && airDanger > 0))) {
        if (g >= 160) tryUpgrade(12);
      }
      if (w >= 35 && !simTurrets[14] && g >= 80) tryBuild(14, "flak");
      if (simTurrets[14] && simTurrets[14].tier < 2 && (w >= 37 || (w >= 35 && airDanger > 0)) && g >= 80) {
        tryUpgrade(14);
      }
      if (simTurrets[14] && simTurrets[14].tier === 2 && (w >= 39 || (w >= 37 && airDanger > 0)) && g >= 160) {
        tryUpgrade(14);
      }

      const minRes = (groundDanger > 0 || airDanger > 0 || state.baseHp < 10 || w > 19) ? 0 : bank;
      for (let i = 0; i < QUEUE.length; i++) {
        const q = QUEUE[i];
        const op = q[0];
        const slot = q[1];
        const val = q[2];
        const t = simTurrets[slot];
        if (op === "b") {
          if (t !== null) continue;
          const c = COSTS[val];
          if (g - c >= minRes) tryBuild(slot, val);
          else break;
        } else {
          if (!t || t.tier >= val) continue;
          const c = t.tier === 1 ? COSTS[t.type] : COSTS[t.type] * 2;
          if (g - c >= minRes) tryUpgrade(slot);
          else break;
        }
      }

      return actions;
    },

    target(turret, candidates) {
      fireSeq++;
      const n = candidates.length;
      if (n === 1) {
        if (turret.type === "frost") slowStamp[candidates[0].id] = fireSeq;
        return candidates[0].id;
      }
      const dmg = DMG_TABLE[turret.type][turret.tier];

      if (turret.type === "frost") {
        let best = candidates[0];
        let bestScore = -1e18;
        for (let i = 0; i < n; i++) {
          const c = candidates[i];
          const unslowed = c.slowed === 0 ? 1e9 : -(slowStamp[c.id] || 0);
          const speedBonus = c.type === "runner" ? 5000 : (c.type === "splitling" ? 2500 : c.speed * 150);
          const sc = unslowed + speedBonus - c.remaining * 0.2 + (c.air ? 700 : 0);
          if (sc > bestScore) { bestScore = sc; best = c; }
        }
        slowStamp[best.id] = fireSeq;
        return best.id;
      }

      if (turret.type === "cannon" || turret.type === "flak") {
        const sp2 = turret.type === "cannon" ? 8100 : 4900;
        let best = candidates[0];
        let bestScore = -1e18;
        for (let i = 0; i < n; i++) {
          const center = candidates[i];
          let val = 0;
          for (let j = 0; j < n; j++) {
            const e = candidates[j];
            const dx = e.x - center.x;
            const dy = e.y - center.y;
            if (dx * dx + dy * dy <= sp2) {
              const deal = Math.max(1, dmg - e.armor);
              const eff = e.hp < deal ? e.hp : deal;
              const urg = e.remaining < 550 ? 8.0 : (e.remaining < 1200 ? 1.8 : 1.0);
              const mult = e.type === "mender" ? 16.0 : ((e.type === "runner" || e.type === "splitling") ? 1.4 : 1.0);
              val += (eff * mult + (e.hp <= deal ? 25 : 0)) * urg;
            }
          }
          val += (5000 - center.remaining) * 0.02;
          if (val > bestScore) { bestScore = val; best = center; }
        }
        return best.id;
      }

      if (turret.type === "lance") {
        let best = candidates[0];
        let bestScore = -1e18;
        for (let i = 0; i < n; i++) {
          const c = candidates[i];
          const spd = c.slowed ? Math.floor(c.speed * 60 / 100) : c.speed;
          const ttb = c.remaining / spd;
          let sc = (ttb < 25 ? 1e7 - c.remaining : 0) + (c.hp < dmg ? c.hp : dmg) * 10;
          if (c.type === "mender") sc += 4000;
          else if (c.type === "brute") sc += 2200 + c.armor * 35;
          sc += (4600 - c.remaining) * 0.25;
          if (sc > bestScore) { bestScore = sc; best = c; }
        }
        return best.id;
      }

      let best = candidates[0];
      let bestScore = -1e18;
      for (let i = 0; i < n; i++) {
        const c = candidates[i];
        const deal = Math.max(1, dmg - c.armor);
        const spd = c.slowed ? Math.floor(c.speed * 60 / 100) : c.speed;
        const ttb = c.remaining / spd;
        const sc = (4600 - c.remaining) + (ttb < 30 ? 1e6 : 0) + (c.hp <= deal ? 800 : 0) + (c.type === "mender" ? 1200 : 0) + (c.air ? 400 : 0) - (deal <= 2 ? 1000 : 0);
        if (sc > bestScore) { bestScore = sc; best = c; }
      }
      return best.id;
    }
  };
}
</script>

<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks) {
  "use strict";
  const onRecord = arguments.length > 3 ? arguments[3] : null;

  const SLOTS = [
    [3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],
    [14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]
  ];
  const GROUND_PTS = [[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]];
  const AIR_PTS = [[0,6],[21,6],[21,11],[23,11]];

  function buildRoute(pts) {
    const segs = [];
    let total = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const x0 = pts[i][0] * 100 + 50;
      const y0 = pts[i][1] * 100 + 50;
      const x1 = pts[i + 1][0] * 100 + 50;
      const y1 = pts[i + 1][1] * 100 + 50;
      const dx = x1 - x0;
      const dy = y1 - y0;
      const len = Math.abs(dx) + Math.abs(dy);
      const sx = dx === 0 ? 0 : (dx > 0 ? 1 : -1);
      const sy = dy === 0 ? 0 : (dy > 0 ? 1 : -1);
      segs.push({ x0: x0, y0: y0, sx: sx, sy: sy, start: total, end: total + len, len: len });
      total += len;
    }
    return { segs: segs, length: total };
  }

  const groundRoute = buildRoute(GROUND_PTS);
  const airRoute = buildRoute(AIR_PTS);

  function posAlong(route, progress) {
    const segs = route.segs;
    for (let i = 0; i < segs.length; i++) {
      const s = segs[i];
      if (progress <= s.end) {
        const d = progress - s.start;
        return [s.x0 + s.sx * d, s.y0 + s.sy * d, s.sx, s.sy];
      }
    }
    const last = segs[segs.length - 1];
    return [last.x0 + last.sx * last.len, last.y0 + last.sy * last.len, last.sx, last.sy];
  }

  const TURRET_TYPES = [
    { name: "bolt",   idx: 0, cost: 50,  dmg: 26,  period: 8,  range: 300, splash: 0,  slow: 0,  pierce: false, ground: true,  air: true },
    { name: "cannon", idx: 1, cost: 90,  dmg: 60,  period: 24, range: 260, splash: 90, slow: 0,  pierce: false, ground: true,  air: false },
    { name: "frost",  idx: 2, cost: 70,  dmg: 10,  period: 12, range: 240, splash: 0,  slow: 30, pierce: false, ground: true,  air: true },
    { name: "lance",  idx: 3, cost: 120, dmg: 180, period: 36, range: 360, splash: 0,  slow: 0,  pierce: true,  ground: true,  air: false },
    { name: "flak",   idx: 4, cost: 80,  dmg: 40,  period: 10, range: 320, splash: 70, slow: 0,  pierce: false, ground: false, air: true }
  ];
  const TURRET_BY_NAME = {};
  for (let i = 0; i < TURRET_TYPES.length; i++) TURRET_BY_NAME[TURRET_TYPES[i].name] = TURRET_TYPES[i];

  const ENEMY_TYPES = [
    { name: "grunt",    idx: 0, baseHp: 60,  speed: 10, bounty: 4, leak: 1, air: 0, firstWave: 1, weight: 10 },
    { name: "runner",   idx: 1, baseHp: 40,  speed: 20, bounty: 4, leak: 1, air: 0, firstWave: 2, weight: 4 },
    { name: "wisp",     idx: 2, baseHp: 50,  speed: 12, bounty: 6, leak: 2, air: 1, firstWave: 3, weight: 3 },
    { name: "brute",    idx: 3, baseHp: 150, speed: 6,  bounty: 9, leak: 3, air: 0, firstWave: 4, weight: 3 },
    { name: "splitter", idx: 4, baseHp: 90,  speed: 8,  bounty: 6, leak: 2, air: 0, firstWave: 6, weight: 2 },
    { name: "mender",   idx: 5, baseHp: 70,  speed: 8,  bounty: 7, leak: 2, air: 0, firstWave: 8, weight: 1 }
  ];
  const ENEMY_BY_NAME = {};
  for (let i = 0; i < ENEMY_TYPES.length; i++) ENEMY_BY_NAME[ENEMY_TYPES[i].name] = ENEMY_TYPES[i];

  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return (t ^ (t >>> 14)) >>> 0;
    };
  }

  const rng = mulberry32(seed);
  const waveMults = [0, 1000];
  function getWaveMult(w) {
    while (waveMults.length <= w) {
      waveMults.push(Math.floor(waveMults[waveMults.length - 1] * 108 / 100));
    }
    return waveMults[w];
  }

  function genWave(w) {
    const count = 4 + Math.floor(3 * w / 5);
    const avail = [];
    let totalW = 0;
    for (let i = 0; i < ENEMY_TYPES.length; i++) {
      if (ENEMY_TYPES[i].firstWave <= w) {
        avail.push(ENEMY_TYPES[i]);
        totalW += ENEMY_TYPES[i].weight;
      }
    }
    const list = [];
    for (let i = 0; i < count; i++) {
      let r = rng() % totalW;
      for (let j = 0; j < avail.length; j++) {
        if (r < avail[j].weight) {
          list.push(avail[j].name);
          break;
        }
        r -= avail[j].weight;
      }
    }
    return list;
  }

  const slots = [];
  for (let i = 0; i < 16; i++) {
    slots.push({ slot: i, x: SLOTS[i][0] * 100 + 50, y: SLOTS[i][1] * 100 + 50, turret: null });
  }

  const strategy = createStrategy();
  let baseHp = 10;
  let gold = 250;
  let currentWave = 0;
  let nextWaveNum = 1;
  let nextWaveTick = 20;
  const wavesComp = {};
  wavesComp[1] = genWave(1);

  const spawnQueue = [];
  let spawnHead = 0;
  const enemies = [];
  let nextEnemyId = 1;
  const log = [];
  let fallTick = -1;

  function enemyView(e) {
    const route = e.air ? airRoute : groundRoute;
    return {
      id: e.id,
      type: e.type,
      hp: e.hp,
      maxHp: e.maxHp,
      x: e.x,
      y: e.y,
      air: e.air,
      armor: e.armor,
      speed: e.speed,
      slowed: e.slow > 0 ? 1 : 0,
      remaining: route.length - e.progress
    };
  }

  function turretDamage(spec, tier) {
    let d = spec.dmg;
    for (let t = 2; t <= tier; t++) d = Math.floor(d * 16 / 10);
    return d;
  }

  for (let tick = 0; tick < maxTicks; tick++) {
    const tickShots = onRecord ? [] : null;
    const tickHeals = onRecord ? [] : null;
    const tickKills = onRecord ? [] : null;
    const tickLeaks = onRecord ? [] : null;
    const tickOps = onRecord ? [] : null;
    let tickWaveStarted = 0;

    // 1. Wave start
    if (tick === nextWaveTick) {
      currentWave = nextWaveNum;
      tickWaveStarted = currentWave;
      gold += Math.min(50, Math.floor(gold * 5 / 100)) + 10 + 2 * currentWave;
      const nextComp = genWave(currentWave + 1);
      wavesComp[currentWave + 1] = nextComp;

      const slotCopies = [];
      for (let i = 0; i < 16; i++) {
        const s = slots[i];
        slotCopies.push({
          slot: s.slot,
          x: s.x,
          y: s.y,
          turret: s.turret ? { type: s.turret.type, tier: s.turret.tier, spent: s.turret.spent } : null
        });
      }
      const enemyCopies = [];
      for (let i = 0; i < enemies.length; i++) enemyCopies.push(enemyView(enemies[i]));

      const actions = strategy.plan({
        tick: tick,
        wave: currentWave,
        gold: gold,
        baseHp: baseHp,
        slots: slotCopies,
        enemies: enemyCopies,
        nextWave: nextComp.slice()
      });

      if (Array.isArray(actions)) {
        const limit = Math.min(32, actions.length);
        for (let i = 0; i < limit; i++) {
          const act = actions[i];
          if (!act || typeof act !== "object") continue;
          const slotIdx = act.slot;
          if (!Number.isInteger(slotIdx) || slotIdx < 0 || slotIdx >= 16) continue;
          const sl = slots[slotIdx];
          if (act.op === "build") {
            if (sl.turret !== null) continue;
            const spec = TURRET_BY_NAME[act.type];
            if (!spec || gold < spec.cost) continue;

            sl.turret = {
              type: spec.name,
              spec: spec,
              tier: 1,
              spent: spec.cost,
              dmg: spec.dmg,
              range: spec.range,
              cooldown: 0
            };

            if (tickOps) tickOps.push({ op: "B", slot: slotIdx, typeIdx: spec.idx, tier: 1 });
          } else if (act.op === "upgrade") {
            const t = sl.turret;
            if (!t || t.tier >= 3) continue;
            const upgCost = t.tier === 1 ? t.spec.cost : t.spec.cost * 2;
            if (gold < upgCost) continue;
            gold -= upgCost;
            t.tier += 1;
            t.spent += upgCost;
            t.dmg = turretDamage(t.spec, t.tier);
            t.range = t.spec.range + (t.tier - 1) * 30;
            log.push([tick, "U", slotIdx, t.tier]);
            if (tickOps) tickOps.push({ op: "U", slot: slotIdx, typeIdx: t.spec.idx, tier: t.tier });
          } else if (act.op === "sell") {
            const t = sl.turret;
            if (!t) continue;
            const oldIdx = t.spec.idx;
            gold += Math.floor(t.spent * 70 / 100);

            log.push([tick, "S", slotIdx, 0]);
            if (tickOps) tickOps.push({ op: "S", slot: slotIdx, typeIdx: oldIdx, tier: 0 });
          }
        }
      }

      const comp = wavesComp[currentWave];
      for (let i = 0; i < comp.length; i++) {
        spawnQueue.push({ tick: tick + 4 * i, wave: currentWave, idx: i, type: comp[i] });
      }
      const rest = spawnQueue.slice(spawnHead).sort(function (a, b) {
        return (a.tick - b.tick) || (a.wave - b.wave) || (a.idx - b.idx);
      });
      spawnQueue.length = spawnHead;
      for (let i = 0; i < rest.length; i++) spawnQueue.push(rest[i]);

      nextWaveTick = 20 + 40 * (nextWaveNum - 1);

      const armor = sp.type === "grunt" ? Math.floor(sp.wave / 4) : (sp.type === "brute" ? 6 + sp.wave : 0);
      const route = et.air ? airRoute : groundRoute;
      const p = posAlong(route, 0);
      enemies.push({
        id: nextEnemyId++,
        type: sp.type,
        typeIdx: et.idx,
        wave: sp.wave,
        hp: maxHp,
        maxHp: maxHp,
        speed: et.speed,
        armor: armor,
        bounty: et.bounty,
        leak: et.leak,
        air: et.air,
        progress: 0,
        x: p[0],
        y: p[1],
        dx: p[2],
        dy: p[3],
        age: 0,
        slow: 0
      });
    }

    let fell = false;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      const step = e.slow > 0 ? Math.floor(e.speed * 60 / 100) : e.speed;
      e.progress += step;
      const route = e.air ? airRoute : groundRoute;
      if (e.progress >= route.length) {
        baseHp -= e.leak;
        log.push([tick, "L", e.id, baseHp]);
        if (tickLeaks) tickLeaks.push({ id: e.id, x: 2350, y: 1150, air: e.air, leak: e.leak, baseHpAfter: baseHp });
        enemies.splice(i, 1);
        i--;
        if (baseHp <= 0) {
          fallTick = tick;
          log.push([tick, "F", currentWave, 0]);
          fell = true;
          break;
        }
      } else {
        const p = posAlong(route, e.progress);
        e.x = p[0];
        e.y = p[1];
        e.dx = p[2];
        e.dy = p[3];
      }
    }

    if (fell) {
      if (onRecord) {
        onRecord({
          tick: tick,
          wave: currentWave,
          gold: gold,
          baseHp: baseHp,
          fell: true,
          waveStarted: tickWaveStarted,
          nextWave: wavesComp[currentWave + 1] || wavesComp[1],
          slots: slots,
          enemies: enemies,
          ops: tickOps,
          shots: tickShots,
          heals: tickHeals,
          kills: tickKills,
          leaks: tickLeaks

    for (let i = 0; i < enemies.length; i++) {

          const o = enemies[j];
          const dx = o.x - m.x;
          const dy = o.y - m.y;

            o.hp = Math.min(o.maxHp, o.hp + Math.floor(o.maxHp * 8 / 100));
          }
        }
      }
    }

    for (let s = 0; s < 16; s++) {
      const sl = slots[s];

        t.cooldown -= 1;
        if (t.cooldown > 0) continue;
      }

      for (let i = 0; i < enemies.length; i++) {

        const dy = e.y - sl.y;

      }
      if (cands.length === 0) continue;

      let chosen = null;
      if (typeof strategy.target === "function") {
        const candViews = [];
        for (let i = 0; i < cands.length; i++) candViews.push(enemyView(cands[i]));
        const tid = strategy.target({ slot: s, type: t.type, tier: t.tier, x: sl.x, y: sl.y, range: t.range }, candViews);
        for (let i = 0; i < cands.length; i++) {
          if (cands[i].id === tid) { chosen = cands[i]; break; }
        }
      }
      if (!chosen) {
        let bestRem = Infinity;
        for (let i = 0; i < cands.length; i++) {
          const c = cands[i];
          const route = c.air ? airRoute : groundRoute;
          const rem = route.length - c.progress;
          if (rem < bestRem) { bestRem = rem; chosen = c; }
        }
      }

      if (tickShots) {
        tickShots.push({
          slot: s,
          typeIdx: t.spec.idx,
          tier: t.tier,
          sx: sl.x,
          sy: sl.y,
          tx: chosen.x,
          ty: chosen.y,
          air: chosen.air,
          splash: t.spec.splash
        });
      }

      if (t.spec.splash > 0) {
        const sp2 = t.spec.splash * t.spec.splash;
        for (let i = 0; i < enemies.length; i++) {
          const e = enemies[i];
          if (e.air ? !t.spec.air : !t.spec.ground) continue;
          const dx = e.x - chosen.x;
          const dy = e.y - chosen.y;
          if (dx * dx + dy * dy <= sp2) {
            e.hp -= Math.max(1, t.dmg - (t.spec.pierce ? 0 : e.armor));
            if (t.spec.slow > 0) e.slow = t.spec.slow;
          }
        }
      } else {
        chosen.hp -= Math.max(1, t.dmg - (t.spec.pierce ? 0 : chosen.armor));
        if (t.spec.slow > 0) chosen.slow = t.spec.slow;
      }
      t.cooldown = t.spec.period;

      const dead = [];
      let write = 0;
      for (let i = 0; i < enemies.length; i++) {
        if (enemies[i].hp <= 0) dead.push(enemies[i]);
        else enemies[write++] = enemies[i];
      }
      enemies.length = write;

      for (let i = 0; i < dead.length; i++) {
        const d = dead[i];
        gold += d.bounty;
        log.push([tick, "K", d.id, s]);
        if (tickKills) {
          tickKills.push({ id: d.id, typeIdx: d.typeIdx, x: d.x, y: d.y, air: d.air, isSplitter: d.type === "splitter" });
        }
        if (d.type === "splitter") {
          const shp = Math.max(1, Math.floor(d.maxHp / 4));
          const p = posAlong(groundRoute, d.progress);
          for (let k = 0; k < 3; k++) {
            enemies.push({
              id: nextEnemyId++,
              type: "splitling",
              typeIdx: 6,
              wave: d.wave,
              hp: shp,
              maxHp: shp,
              speed: 12,
              armor: 0,
              bounty: 1,
              leak: 1,
              air: 0,
              progress: d.progress,
              x: p[0],
              y: p[1],
              dx: p[2],
              dy: p[3],
              age: 0,
              slow: 0
            });
          }
        }
      }
    }

    // 6. Slow timers
    for (let i = 0; i < enemies.length; i++) {
      if (enemies[i].slow > 0) enemies[i].slow -= 1;
    }

    if (onRecord) {
      onRecord({
        tick: tick,
        wave: currentWave,
        gold: gold,
        baseHp: baseHp,
        fell: false,
        waveStarted: tickWaveStarted,
        nextWave: currentWave === 0 ? wavesComp[1] : (wavesComp[currentWave + 1] || wavesComp[1]),
        slots: slots,
        enemies: enemies,
        ops: tickOps,
        shots: tickShots,
        heals: tickHeals,
        kills: tickKills,
        leaks: tickLeaks
      });
    }
  }

  const endTick = fallTick >= 0 ? fallTick : maxTicks;
  const score = Math.round(((endTick - 20) / 40) * 100) / 100;
  const str = JSON.stringify(log);
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  const hash = (h >>> 0).toString(16).padStart(8, "0");
  return { score: score, fallTick: fallTick, log: log, hash: hash };
}

  function buildTerrainTexture() {
    const c = document.createElement("canvas");
    c.width = 512;
    c.height = 512;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#242a35";
    ctx.fillRect(0, 0, 512, 512);
    const texRng = makeRng(1337);
    for (let i = 0; i < 4200; i++) {
      const x = texRng() * 512;
      const y = texRng() * 512;
      const r = 1.5 + texRng() * 5.0;
      const v = texRng();
      ctx.fillStyle = v > 0.65 ? "rgba(62,74,92,0.14)" : (v > 0.3 ? "rgba(22,26,34,0.18)" : "rgba(42,56,48,0.11)");
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.strokeStyle = "rgba(255,255,255,0.035)";
    ctx.lineWidth = 1;
    const step = 512 / 24;
    for (let gx = 0; gx <= 24; gx++) {
      ctx.beginPath();
      ctx.moveTo(gx * step, 0);
      ctx.lineTo(gx * step, 512);
      ctx.stroke();
    }
    const stepY = 512 / 14;
    for (let gy = 0; gy <= 14; gy++) {
      ctx.beginPath();
      ctx.moveTo(0, gy * stepY);
      ctx.lineTo(512, gy * stepY);
      ctx.stroke();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = 4;
    return tex;
  }

  function mergeColoredGeos(parts) {
    let totalVerts = 0;
    const expanded = [];
    for (let i = 0; i < parts.length; i++) {
      const ng = parts[i].geo.index ? parts[i].geo.toNonIndexed() : parts[i].geo;
      totalVerts += ng.attributes.position.count;
      expanded.push({ geo: ng, color: parts[i].color });
    }
    const pos = new Float32Array(totalVerts * 3);
    const norm = new Float32Array(totalVerts * 3);
    const col = new Float32Array(totalVerts * 3);
    let off = 0;
    for (let i = 0; i < expanded.length; i++) {
      const g = expanded[i].geo;
      const c = expanded[i].color;
      const p = g.attributes.position.array;
      const n = g.attributes.normal.array;
      const cnt = g.attributes.position.count;
      pos.set(p, off * 3);
      norm.set(n, off * 3);
      for (let v = 0; v < cnt; v++) {
        col[(off + v) * 3] = c.r;
        col[(off + v) * 3 + 1] = c.g;
        col[(off + v) * 3 + 2] = c.b;
      }
      off += cnt;
    }
    const out = new THREE.BufferGeometry();
    out.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    out.setAttribute("normal", new THREE.BufferAttribute(norm, 3));
    out.setAttribute("color", new THREE.BufferAttribute(col, 3));
    return out;
  }

  function createInstanced(geo, mat, maxCnt) {
    const inst = new THREE.InstancedMesh(geo, mat, maxCnt);
    inst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    const white = new THREE.Color(0xffffff);
    for (let i = 0; i < maxCnt; i++) inst.setColorAt(i, white);
    inst.instanceColor.needsUpdate = true;
    inst.count = 0;
    inst.frustumCulled = false;
    inst.castShadow = true;
    inst.receiveShadow = true;
    boardGroup.add(inst);
    return inst;
  }

  const enemyMeshes = [
    createInstanced(makeGruntGeo(), makeDesatMat(new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.65, metalness: 0.15 })), MAX_ENEMIES),
    createInstanced(makeRunnerGeo(), makeDesatMat(new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.45, metalness: 0.2 })), MAX_ENEMIES),
    createInstanced(makeWispGeo(), makeDesatMat(new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x16b8ff, emissiveIntensity: 0.85, roughness: 0.25 })), MAX_ENEMIES),
    createInstanced(makeBruteGeo(), makeDesatMat(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.55, metalness: 0.45 })), MAX_ENEMIES),
    createInstanced(makeSplitterGeo(), makeDesatMat(new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x3b1260, emissiveIntensity: 0.35, roughness: 0.45, flatShading: true })), MAX_ENEMIES),
    createInstanced(makeMenderGeo(), makeDesatMat(new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x264430, emissiveIntensity: 0.2, roughness: 0.35 })), MAX_ENEMIES),
    createInstanced(makeSplitlingGeo(), makeDesatMat(new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5, flatShading: true })), MAX_ENEMIES)
  ];

  const wispShadowGeo = new THREE.CircleGeometry(0.22, 12);
  wispShadowGeo.rotateX(-Math.PI / 2);
  const wispShadowMat = makeDesatMat(new THREE.MeshBasicMaterial({ color: 0x05070c, transparent: true, opacity: 0.55, depthWrite: false }));
  const wispShadows = createInstanced(wispShadowGeo, wispShadowMat, MAX_ENEMIES);
  wispShadows.castShadow = false;

  const menderHaloGeo = new THREE.RingGeometry(0.28, 0.42, 20);
  menderHaloGeo.rotateX(-Math.PI / 2);
  const menderHaloMat = makeDesatMat(new THREE.MeshBasicMaterial({ color: 0x44eb7a, transparent: true, opacity: 0.55, side: THREE.DoubleSide, depthWrite: false }));
  const menderHalos = createInstanced(menderHaloGeo, menderHaloMat, MAX_ENEMIES);
  menderHalos.castShadow = false;

  const hpBgGeo = new THREE.PlaneGeometry(0.52, 0.075);
  const hpBgMat = makeDesatMat(new THREE.MeshBasicMaterial({ color: 0x0a0c12, transparent: true, opacity: 0.85, depthTest: false }));
  const hpBgMesh = createInstanced(hpBgGeo, hpBgMat, MAX_ENEMIES);
  hpBgMesh.castShadow = false;
  hpBgMesh.renderOrder = 5;

  const hpFgGeo = new THREE.PlaneGeometry(0.48, 0.048);
  const hpFgMat = makeDesatMat(new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false }));
  const hpFgMesh = createInstanced(hpFgGeo, hpFgMat, MAX_ENEMIES);
  hpFgMesh.castShadow = false;
  hpFgMesh.renderOrder = 6;

  // --- Instanced VFX Pools ---
  const MAX_VFX = 240;
  const beamGeo = new THREE.CylinderGeometry(1, 1, 1, 6);
  const beamInst = createInstanced(beamGeo, makeDesatMat(new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.92 })), MAX_VFX);
  beamInst.castShadow = false;

  const orbGeo = new THREE.SphereGeometry(1, 8, 8);
  const orbInst = createInstanced(orbGeo, makeDesatMat(new THREE.MeshBasicMaterial({ color: 0xffffff })), MAX_VFX);
  orbInst.castShadow = false;

  const ringGeo = new THREE.RingGeometry(0.84, 1.0, 28);
  ringGeo.rotateX(-Math.PI / 2);
  const ringInst = createInstanced(ringGeo, makeDesatMat(new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85, side: THREE.DoubleSide, depthWrite: false })), MAX_VFX);
  ringInst.castShadow = false;

  const debrisGeo = new THREE.BoxGeometry(1, 1, 1);
  const debrisInst = createInstanced(debrisGeo, makeDesatMat(new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.65 })), MAX_VFX * 2);

  // --- Orthographic WebGL HUD ---
  const hudScene = new THREE.Scene();
  const hudCam = new THREE.OrthographicCamera(0, 1280, 650, 0, -10, 10);

  function buildDigitAtlas() {
    const c = document.createElement("canvas");
    c.width = 512;
    c.height = 64;
    const ctx = c.getContext("2d");
    ctx.clearRect(0, 0, 512, 64);
    ctx.font = "700 46px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffffff";
    for (let d = 0; d < 10; d++) {
      ctx.fillText(String(d), d * 48 + 24, 33);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    return tex;
  }

  const digitAtlasTex = buildDigitAtlas();
  const digitUVGeos = [];
  for (let d = 0; d < 10; d++) {
    const g = new THREE.PlaneGeometry(1, 1);
    const u0 = (d * 48 + 4) / 512;
    const u1 = (d * 48 + 44) / 512;
    const uvs = g.attributes.uv;
    uvs.setXY(0, u0, 1);
    uvs.setXY(1, u1, 1);
    uvs.setXY(2, u0, 0);
    uvs.setXY(3, u1, 0);
    digitUVGeos.push(g);
  }
  const hudWaveDigitMat = new THREE.MeshBasicMaterial({ map: digitAtlasTex, color: 0xffffff, transparent: true });
  const hudGoldDigitMat = new THREE.MeshBasicMaterial({ map: digitAtlasTex, color: 0xffd764, transparent: true });
  const hudPreviewDigitMat = new THREE.MeshBasicMaterial({ map: digitAtlasTex, color: 0xe2e8f5, transparent: true });

  const hudWaveIconGroup = new THREE.Group();
  const bladeMat = new THREE.MeshBasicMaterial({ color: 0x9ec5ff });
  const hiltMat = new THREE.MeshBasicMaterial({ color: 0xffd166 });
  for (let s = -1; s <= 1; s += 2) {
    const b = new THREE.Mesh(new THREE.PlaneGeometry(0.16, 0.96), bladeMat);
    b.rotation.z = s * 0.65;
    hudWaveIconGroup.add(b);
    const g = new THREE.Mesh(new THREE.PlaneGeometry(0.36, 0.10), hiltMat);
    g.rotation.z = s * 0.65;
    g.position.set(Math.sin(s * 0.65) * 0.28, -Math.cos(s * 0.65) * 0.28, 0);
    hudWaveIconGroup.add(g);
  }
  hudScene.add(hudWaveIconGroup);

  const hudCoinGroup = new THREE.Group();
  const coinOuter = new THREE.Mesh(new THREE.CircleGeometry(0.46, 20), new THREE.MeshBasicMaterial({ color: 0xffc633 }));
  const coinInner = new THREE.Mesh(new THREE.RingGeometry(0.24, 0.34, 16), new THREE.MeshBasicMaterial({ color: 0xffe88c }));
  coinInner.position.z = 0.01;
  hudCoinGroup.add(coinOuter, coinInner);
  hudScene.add(hudCoinGroup);

  function makeDigitPool(maxDigits, mat) {
    const pool = [];
    for (let i = 0; i < maxDigits; i++) {
      const m = new THREE.Mesh(digitUVGeos[0], mat);
      m.visible = false;
      hudScene.add(m);
      pool.push(m);
    }
    return pool;
  }
  const waveDigitPool = makeDigitPool(4, hudWaveDigitMat);
  const goldDigitPool = makeDigitPool(6, hudGoldDigitMat);
  const previewGroups = [];
  for (let i = 0; i < 6; i++) {
    const iconGeo = i === 1 ? new THREE.CircleGeometry(0.36, 3) : (i === 2 ? new THREE.CircleGeometry(0.36, 4) : (i === 3 ? new THREE.BoxGeometry(0.62, 0.62, 0.01) : new THREE.CircleGeometry(0.34, 12)));
    const icon = new THREE.Mesh(iconGeo, new THREE.MeshBasicMaterial({ color: ENEMY_COLORS_HEX[i] }));
    hudScene.add(icon);
    const digits = makeDigitPool(3, hudPreviewDigitMat);
    previewGroups.push({ icon: icon, digits: digits });
  }

  const hpPips = [];
  const hpPipBackGeo = new THREE.PlaneGeometry(1, 1);
  const hpPipFillGeo = new THREE.PlaneGeometry(0.78, 0.78);
  for (let i = 0; i < 10; i++) {
    const bg = new THREE.Mesh(hpPipBackGeo, new THREE.MeshBasicMaterial({ color: 0x161b26, transparent: true, opacity: 0.85 }));
    const fg = new THREE.Mesh(hpPipFillGeo, new THREE.MeshBasicMaterial({ color: 0x4be37a }));
    fg.position.z = 0.01;
    hudScene.add(bg, fg);
    hpPips.push({ bg: bg, fg: fg });
  }

  function placeNumber(pool, num, startX, centerY, digitH) {
    const s = String(Math.max(0, Math.floor(num)));
    const digitW = digitH * 0.72;
    const adv = digitW * 0.86;
    for (let i = 0; i < pool.length; i++) {
      if (i < s.length) {
        const d = s.charCodeAt(i) - 48;
        const m = pool[i];
        m.geometry = digitUVGeos[d];
        m.scale.set(digitW, digitH, 1);
        m.position.set(startX + i * adv + digitW * 0.5, centerY, 0);
        m.visible = true;
      } else {
        pool[i].visible = false;
      }
    }
    return startX + s.length * adv;
  }

  function updateHUD(w, h, frame, simTime) {
    hudCam.left = 0;
    hudCam.right = w;
    hudCam.top = h;
    hudCam.bottom = 0;
    hudCam.updateProjectionMatrix();

    const marginX = Math.max(18, Math.round(w * 0.02));
    const marginY = Math.max(16, Math.round(h * 0.024));
    const waveDigitH = Math.max(46, Math.round(h * 0.075));
    const waveCenterY = h - marginY - waveDigitH * 0.5;

    const waveIconSz = waveDigitH * 0.76;
    hudWaveIconGroup.scale.set(waveIconSz, waveIconSz, 1);
    hudWaveIconGroup.position.set(marginX + waveIconSz * 0.5, waveCenterY, 0);
    placeNumber(waveDigitPool, frame.wave, marginX + waveIconSz * 1.15, waveCenterY, waveDigitH);

    const goldDigitH = Math.max(24, Math.round(waveDigitH * 0.52));
    const goldCenterY = waveCenterY - waveDigitH * 0.5 - goldDigitH * 0.65;
    const coinSz = goldDigitH * 0.78;
    hudCoinGroup.scale.set(coinSz, coinSz, 1);
    hudCoinGroup.position.set(marginX + coinSz * 0.5, goldCenterY, 0);
    placeNumber(goldDigitPool, frame.gold, marginX + coinSz * 1.25, goldCenterY, goldDigitH);

    const prevDigitH = Math.max(17, Math.round(goldDigitH * 0.74));
    const prevCenterY = goldCenterY - goldDigitH * 0.55 - prevDigitH * 0.75;
    const iconSz = prevDigitH * 0.82;
    let curX = marginX + iconSz * 0.5;
    for (let i = 0; i < 6; i++) {
      const cnt = frame.nextCounts[i];
      const pg = previewGroups[i];
      if (cnt > 0) {
        pg.icon.visible = true;
        pg.icon.scale.set(iconSz, iconSz, 1);
        pg.icon.position.set(curX, prevCenterY, 0);
        curX = placeNumber(pg.digits, cnt, curX + iconSz * 0.52, prevCenterY, prevDigitH) + iconSz * 0.85;
      } else {
        pg.icon.visible = false;
        for (let j = 0; j < pg.digits.length; j++) pg.digits[j].visible = false;
      }
    }

    const pipSz = Math.max(16, Math.round(h * 0.028));
    const pipGap = Math.max(4, Math.round(pipSz * 0.25));
    const pipsTotalW = 10 * pipSz + 9 * pipGap;
    const pipStartX = w - marginX - pipsTotalW + pipSz * 0.5;
    const pipY = h - marginY - pipSz * 0.5;

    for (let i = 0; i < 10; i++) {
      const pip = hpPips[i];
      const px = pipStartX + i * (pipSz + pipGap);
      pip.bg.scale.set(pipSz, pipSz, 1);
      pip.bg.position.set(px, pipY, 0);
      pip.fg.scale.set(pipSz, pipSz, 1);
      pip.fg.position.set(px, pipY, 0.01);

      if (i < frame.baseHp) {
        pip.fg.visible = true;
        if (frame.baseHp <= 3) pip.fg.material.color.setHex(0xff4a4a);
        else if (frame.baseHp <= 6) pip.fg.material.color.setHex(0xffb83d);
        else pip.fg.material.color.setHex(0x4be37a);
      } else {
        let flash = 0;
        for (let k = 0; k < leakEvents.length; k++) {
          const le = leakEvents[k];
          if (simTime >= le.t && simTime < le.t + 0.35) {
            if (i >= Math.max(0, le.baseHpAfter) && i < Math.max(0, le.baseHpAfter + 3)) {
              flash = Math.max(flash, 1 - (simTime - le.t) / 0.35);
            }
          }
        }
        if (flash > 0) {
          pip.fg.visible = true;
          pip.fg.material.color.setRGB(1, 0.25 + 0.75 * flash, 0.25 + 0.75 * flash);
        } else {
          pip.fg.visible = false;
        }
      }
    }
  }

  // --- Reusable Math Objects ---
  const dummy = new THREE.Object3D();
  const tmpColor = new THREE.Color();
  const frostTint = new THREE.Color(0x7fd8ff);
  const upVec = new THREE.Vector3(0, 1, 0);
  const dirVec = new THREE.Vector3();
  const quatTmp = new THREE.Quaternion();
  const turretAimAngles = new Float32Array(16);

  function renderAtSimTime(simTime) {
    const effectiveTime = (fallTick >= 0 && simTime >= fallTime) ? fallTime : simTime;
    const tFloat = effectiveTime * TICKS_PER_SEC;
    const k0 = Math.max(0, Math.min(maxFrameIdx, Math.floor(tFloat)));
    const k1 = Math.min(maxFrameIdx, k0 + 1);
    const frac = (fallTick >= 0 && simTime >= fallTime) ? 0 : Math.max(0, Math.min(1, tFloat - k0));
    const f0 = frames[k0];
    const f1 = frames[k1];

    if (fallTick >= 0 && simTime > fallTime) {
      desatUniform.value = Math.min(1, (simTime - fallTime) / 1.0) * 0.92;
    } else {
      desatUniform.value = 0;
    }

    const trauma = getTraumaAt(simTime);
    const shakeMag = trauma * trauma * 0.25;
    const sx = shakeMag * smoothNoise(simTime + 11.3);
    const sy = shakeMag * smoothNoise(simTime + 47.9) * 0.6;
    const sz = shakeMag * smoothNoise(simTime + 93.1);
    camera.position.set(baseCamPos.x + sx, baseCamPos.y + sy, baseCamPos.z + sz);
    camera.lookAt(baseCamTarget.x + sx * 0.35, baseCamTarget.y, baseCamTarget.z + sz * 0.35);

    for (let s = 0; s < 16; s++) {
      const slot = slotTurretSlots[s];
      const st = f0.slots[s];
      if (!st) {
        if (slot.mesh) {
          slot.anchor.remove(slot.mesh);
          slot.mesh = null;
          slot.typeIdx = -1;
          slot.tier = 0;
        }
      } else {
        if (slot.typeIdx !== st.typeIdx || slot.tier !== st.tier) {
          if (slot.mesh) slot.anchor.remove(slot.mesh);
          slot.mesh = createTurretVisual(st.typeIdx, st.tier);
          slot.anchor.add(slot.mesh);
          slot.typeIdx = st.typeIdx;
          slot.tier = st.tier;
        }
        let aimAngle = turretAimAngles[s];
        let recoil = 0;
        for (let i = shotEvents.length - 1; i >= 0; i--) {
          const se = shotEvents[i];
          if (se.t <= effectiveTime && se.slot === s) {
            aimAngle = Math.atan2(se.tx - se.sx, se.ty - se.sy);
            const age = effectiveTime - se.t;
            if (age < 0.08) recoil = (1 - age / 0.08) * 0.07;
            break;
          }
          if (se.t < effectiveTime - 3.0) break;
        }
        turretAimAngles[s] = aimAngle;
        if (slot.mesh && slot.mesh.userData.head) {
          slot.mesh.userData.head.rotation.y = aimAngle;
          slot.mesh.userData.head.position.z = -Math.cos(aimAngle) * recoil;
          slot.mesh.userData.head.position.x = -Math.sin(aimAngle) * recoil;
        }
      }
    }

    const keepBroken = fallTick >= 0 && simTime >= fallTime;
    if (keepBroken) {
      keepCore.visible = false;
      keepSpire.visible = false;
      keepBeacon.visible = false;
      for (let i = 0; i < 10; i++) keepChunks[i].visible = false;
      keepFlashMat.opacity = 0;
    } else {
      keepCore.visible = true;
      keepSpire.visible = true;
      keepBeacon.visible = true;
      keepBeacon.rotation.y = effectiveTime * 1.8;
      keepBeacon.position.y = 1.56 + Math.sin(effectiveTime * 3.0) * 0.04;
      for (let i = 0; i < 10; i++) {
        keepChunks[i].visible = i < f0.baseHp;
      }
      let leakFlash = 0;
      for (let i = 0; i < leakEvents.length; i++) {
        const le = leakEvents[i];
        if (effectiveTime >= le.t && effectiveTime < le.t + 0.35) {
          leakFlash = Math.max(leakFlash, 1 - (effectiveTime - le.t) / 0.35);
        }
      }
      keepFlashMat.opacity = leakFlash * 0.72;
      keepFlashMat.emissiveIntensity = leakFlash * 2.5;
    }

    const eCounts = [0, 0, 0, 0, 0, 0, 0];
    let wispCnt = 0;
    let menderCnt = 0;
    let hpCnt = 0;

    for (let i = 0; i < f0.eIds.length; i++) {
      const id = f0.eIds[i];
      const tIdx = f0.eTypes[i];
      let ex = f0.eX[i];
      let ey = f0.eY[i];
      let edx = f0.eDx[i];
      let edy = f0.eDy[i];
      let hpRatio = f0.eHpRatio[i];
      const slowed = f0.eSlowed[i];
      const air = f0.eAir[i];

      const idx1 = f1.idMap.get(id);
      if (idx1 !== undefined && k1 !== k0) {
        ex = ex + (f1.eX[idx1] - ex) * frac;
        ey = ey + (f1.eY[idx1] - ey) * frac;
        hpRatio = hpRatio + (f1.eHpRatio[idx1] - hpRatio) * frac;
        if (frac > 0.5) { edx = f1.eDx[idx1]; edy = f1.eDy[idx1]; }
      }

      const yaw = Math.atan2(edx, edy);
      const bob = air ? Math.sin(effectiveTime * 5.0 + id) * 0.05 : 0;
      const slotInstIdx = eCounts[tIdx]++;
      if (slotInstIdx < MAX_ENEMIES) {
        dummy.position.set(ex, 0.055 + bob, ey);
        dummy.rotation.set(0, yaw, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        enemyMeshes[tIdx].setMatrixAt(slotInstIdx, dummy.matrix);

        if (tIdx === 3) {
          if (slowed) tmpColor.setHex(0x8cd6ff);
          else tmpColor.setHex(0xffffff);
        } else {
          tmpColor.setHex(ENEMY_COLORS_HEX[tIdx]);
          if (slowed) tmpColor.lerp(frostTint, 0.62);
        }
        enemyMeshes[tIdx].setColorAt(slotInstIdx, tmpColor);
      }

      if (air && wispCnt < MAX_ENEMIES) {
        dummy.position.set(ex, 0.072, ey);
        dummy.rotation.set(0, 0, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        wispShadows.setMatrixAt(wispCnt++, dummy.matrix);
      }

      if (tIdx === 5 && menderCnt < MAX_ENEMIES) {
        const pulse = 1.0 + 0.08 * Math.sin(effectiveTime * 6.0 + id);
        dummy.position.set(ex, 0.078, ey);
        dummy.rotation.set(0, 0, 0);
        dummy.scale.set(pulse, 1, pulse);
        dummy.updateMatrix();
        menderHalos.setMatrixAt(menderCnt++, dummy.matrix);
      }

      if (hpCnt < MAX_ENEMIES) {
        const barY = air ? 1.24 + bob : (tIdx === 3 ? 0.82 : (tIdx === 6 ? 0.48 : 0.68));
        dummy.position.set(ex, barY, ey);
        dummy.quaternion.copy(camera.quaternion);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        hpBgMesh.setMatrixAt(hpCnt, dummy.matrix);

        const fillW = Math.max(0.02, hpRatio);
        dummy.position.set(ex - (1 - fillW) * 0.24, barY, ey);
        dummy.quaternion.copy(camera.quaternion);
        dummy.scale.set(fillW, 1, 1);
        dummy.updateMatrix();
        hpFgMesh.setMatrixAt(hpCnt, dummy.matrix);
        if (hpRatio > 0.55) tmpColor.setHex(0x45e876);
        else if (hpRatio > 0.25) tmpColor.setHex(0xf7c336);
        else tmpColor.setHex(0xff4242);
        hpFgMesh.setColorAt(hpCnt, tmpColor);
        hpCnt++;
      }
    }

    for (let t = 0; t < 7; t++) {
      enemyMeshes[t].count = Math.min(MAX_ENEMIES, eCounts[t]);
      enemyMeshes[t].instanceMatrix.needsUpdate = true;
      enemyMeshes[t].instanceColor.needsUpdate = true;
    }
    wispShadows.count = wispCnt;
    wispShadows.instanceMatrix.needsUpdate = true;
    menderHalos.count = menderCnt;
    menderHalos.instanceMatrix.needsUpdate = true;
    hpBgMesh.count = hpCnt;
    hpBgMesh.instanceMatrix.needsUpdate = true;
    hpFgMesh.count = hpCnt;
    hpFgMesh.instanceMatrix.needsUpdate = true;
    hpFgMesh.instanceColor.needsUpdate = true;

    let beamCnt = 0;
    let orbCnt = 0;
    let ringCnt = 0;
    let debCnt = 0;

    function addBeam(x0, y0, z0, x1, y1, z1, radius, colorHex) {
      if (beamCnt >= MAX_VFX) return;
      dirVec.set(x1 - x0, y1 - y0, z1 - z0);
      const len = dirVec.length();
      if (len < 0.001) return;
      dirVec.normalize();
      quatTmp.setFromUnitVectors(upVec, dirVec);
      dummy.position.set(0.5 * (x0 + x1), 0.5 * (y0 + y1), 0.5 * (z0 + z1));
      dummy.quaternion.copy(quatTmp);
      dummy.scale.set(radius, len, radius);
      dummy.updateMatrix();
      beamInst.setMatrixAt(beamCnt, dummy.matrix);
      tmpColor.setHex(colorHex);
      beamInst.setColorAt(beamCnt, tmpColor);
      beamCnt++;
    }

    function addOrb(x, y, z, radius, colorHex) {
      if (orbCnt >= MAX_VFX) return;
      dummy.position.set(x, y, z);
      dummy.rotation.set(0, 0, 0);
      dummy.scale.set(radius, radius, radius);
      dummy.updateMatrix();
      orbInst.setMatrixAt(orbCnt, dummy.matrix);
      tmpColor.setHex(colorHex);
      orbInst.setColorAt(orbCnt, tmpColor);
      orbCnt++;
    }

    function addRing(x, y, z, radius, colorHex) {
      if (ringCnt >= MAX_VFX) return;
      dummy.position.set(x, y, z);
      dummy.rotation.set(0, 0, 0);
      dummy.scale.set(Math.max(0.01, radius), 1, Math.max(0.01, radius));
      dummy.updateMatrix();
      ringInst.setMatrixAt(ringCnt, dummy.matrix);
      tmpColor.setHex(colorHex);
      ringInst.setColorAt(ringCnt, tmpColor);
      ringCnt++;
    }

    function addDebris(x, y, z, sx, sy, sz, rx, ry, colorHex) {
      if (debCnt >= MAX_VFX * 2) return;
      dummy.position.set(x, y, z);
      dummy.rotation.set(rx, ry, 0);
      dummy.scale.set(sx, sy, sz);
      dummy.updateMatrix();
      debrisInst.setMatrixAt(debCnt, dummy.matrix);
      tmpColor.setHex(colorHex);
      debrisInst.setColorAt(debCnt, tmpColor);
      debCnt++;
    }

    for (let i = 0; i < shotEvents.length; i++) {
      const se = shotEvents[i];
      const age = effectiveTime - se.t;
      if (age < 0 || age >= 0.15) continue;
      const u = age / 0.15;
      const ty = se.air ? 0.85 : 0.25;
      if (se.typeIdx === 0) {
        addBeam(se.sx, 0.44, se.sy, se.tx, ty, se.ty, 0.025 * (1 - u * 0.5), 0x8cd0ff);
        addOrb(se.tx, ty, se.ty, 0.08 * (1 - u), 0xb8e4ff);
      } else if (se.typeIdx === 1) {
        if (u < 0.46) {
          const au = u / 0.46;
          const cx = se.sx + (se.tx - se.sx) * au;
          const cz = se.sy + (se.ty - se.sy) * au;
          const cy = 0.48 + (0.12 - 0.48) * au + Math.sin(au * Math.PI) * 0.95;
          addOrb(cx, cy, cz, 0.11, 0xffaa44);
        } else {
          const bu = (u - 0.46) / 0.54;
          addRing(se.tx, 0.10, se.ty, se.splash * (0.25 + 0.75 * bu), 0xff8a2b);
          addOrb(se.tx, 0.18, se.ty, 0.26 * (1 - bu), 0xffd07a);
        }
      } else if (se.typeIdx === 2) {
        addBeam(se.sx, 0.58, se.sy, se.tx, ty, se.ty, 0.04 * (1 - u * 0.4), 0xdff7ff);
        addOrb(se.tx, ty, se.ty, 0.14 * (1 - u * 0.7), 0x9ce8ff);
      } else if (se.typeIdx === 3) {
        addBeam(se.sx, 0.46, se.sy, se.tx, ty, se.ty, 0.075 * (1 - u * 0.5), 0xff2942);
        addOrb(se.sx, 0.46, se.sy, 0.18 * (1 - u), 0xff6b7a);
        addOrb(se.tx, ty, se.ty, 0.26 * (1 - u), 0xff8896);
      } else {
        if (u < 0.25) {
          addBeam(se.sx, 0.48, se.sy, se.tx, 0.85, se.ty, 0.025, 0x6bf2df);
        }
        addRing(se.tx, 0.85, se.ty, se.splash * (0.3 + 0.7 * u), 0x2de0c8);
        addOrb(se.tx, 0.85, se.ty, 0.16 * (1 - u), 0x9efff0);
      }
    }

    for (let i = 0; i < healEvents.length; i++) {
      const he = healEvents[i];
      const age = effectiveTime - he.t;
      if (age < 0 || age >= 0.35) continue;
      const u = age / 0.35;
      addRing(he.x, 0.09, he.y, 1.5 * (0.2 + 0.8 * u), 0x4be87e);
    }

    for (let i = 0; i < killEvents.length; i++) {
      const ke = killEvents[i];
      const age = effectiveTime - ke.t;
      if (age < 0 || age >= 0.48) continue;
      const pieces = killDebrisData[i];
      const startY = ke.air ? 0.80 : 0.22;
      const col = ENEMY_COLORS_HEX[ke.typeIdx];
      const fade = 1 - age / 0.48;
      for (let j = 0; j < pieces.length; j++) {
        const p = pieces[j];
        const py = Math.max(0.05, startY + p.vy * age - 4.8 * age * age);
        const sz = p.sz * fade;
        addDebris(ke.x + p.vx * age, py, ke.y + p.vz * age, sz, sz, sz, p.rx + age * 6, p.ry + age * 5, col);
      }
      if (ke.isSplitter && age < 0.25) {
        addRing(ke.x, 0.12, ke.y, 0.55 * (age / 0.25), 0xc97eff);
      }
    }

    for (let i = 0; i < opEvents.length; i++) {
      const oe = opEvents[i];
      const age = effectiveTime - oe.t;
      if (age < 0 || age >= 0.45) continue;
      const u = age / 0.45;
      const sx = SLOTS[oe.slot][0] + 0.5;
      const sz = SLOTS[oe.slot][1] + 0.5;
      const ps = opParticleData[i];
      if (oe.op === "B") {
        for (let j = 0; j < ps.length; j++) {
          const p = ps[j];
          addOrb(sx + p.ox, 0.18 + age * 1.6 + (j % 3) * 0.12, sz + p.oz, p.sz * (1 - u), 0xffdc6b);
        }
      } else if (oe.op === "U") {
        addRing(sx, 0.22 + age * 0.6, sz, 0.25 + 0.65 * u, 0xffd54f);
      } else {
        for (let j = 0; j < ps.length; j++) {
          const p = ps[j];
          const py = Math.max(0.06, 0.35 + p.vy * age - 4.8 * age * age);
          const szDeb = p.sz * (1 - u * 0.5);
          addDebris(sx + p.vx * age, py, sz + p.vz * age, szDeb, szDeb, szDeb, age * 5, age * 4, 0x5c6475);
        }
      }
    }

    for (let i = 0; i < leakEvents.length; i++) {
      const le = leakEvents[i];
      const age = effectiveTime - le.t;
      if (age < 0 || age >= 0.85) continue;
      const c = chunkCoords[le.chunkIdx];
      const py = Math.max(0.14, c[1] + 3.2 * age - 5.0 * age * age);
      const shrink = 1 - (age / 0.85) * 0.4;
      addDebris(
        23.5 + c[0] + (c[0] >= 0 ? 1.1 : -0.6) * age,
        py,
        11.5 + c[2] + (c[2] >= 0 ? 0.9 : -0.7) * age,
        c[3] * shrink, c[4] * shrink, c[5] * shrink,
        age * 4, age * 5, 0x626c82
      );
    }

    if (fallTick >= 0 && simTime >= fallTime) {
      const fAge = simTime - fallTime;
      if (fAge < 1.2) {
        const fu = fAge / 1.2;
        addRing(23.5, 0.14, 11.5, 0.5 + fu * 7.5, 0xff7733);
        if (fAge < 0.45) {
          addOrb(23.5, 0.65, 11.5, 1.1 * (1 - fAge / 0.45), 0xffaa44);
        }
      }
      const debAge = Math.min(fAge, 2.2);
      for (let i = 0; i < fallDebrisData.length; i++) {
        const d = fallDebrisData[i];
        const py = Math.max(0.08, d.oy + d.vy * debAge - 4.8 * debAge * debAge);
        const settleT = py <= 0.09 ? Math.sqrt((d.oy + d.vy * d.vy / 9.6) / 4.8) : debAge;
        const px = 23.5 + d.ox + d.vx * Math.min(debAge, settleT + 0.15);
        const pz = 11.5 + d.oz + d.vz * Math.min(debAge, settleT + 0.15);
        addDebris(px, py, pz, d.sz, d.sz * 0.85, d.sz, d.rx + Math.min(debAge, settleT) * 4, d.ry + Math.min(debAge, settleT) * 3, d.stone ? 0x525b6e : 0x2c4569);
      }
    }

    beamInst.count = beamCnt;
    beamInst.instanceMatrix.needsUpdate = true;
    beamInst.instanceColor.needsUpdate = true;
    orbInst.count = orbCnt;
    orbInst.instanceMatrix.needsUpdate = true;
    orbInst.instanceColor.needsUpdate = true;
    ringInst.count = ringCnt;
    ringInst.instanceMatrix.needsUpdate = true;
    ringInst.instanceColor.needsUpdate = true;
    debrisInst.count = debCnt;
    debrisInst.instanceMatrix.needsUpdate = true;
    debrisInst.instanceColor.needsUpdate = true;

    updateHUD(curWidth, curHeight, f0, effectiveTime);
    renderer.clear();
    renderer.render(scene, camera);
    renderer.clearDepth();
    renderer.render(hudScene, hudCam);
  }

  // --- Synthesized Web Audio Engine ---
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;
  let masterGain = null;
  let compressor = null;
  let noiseBuf = null;
  let windSource = null;
  let windGain = null;
  const activeVoices = new Set();
  const recentShotTimes = [];
  let lastKillAudioTime = -10;
  const SHOT_LOUDNESS = [2, 4, 1, 5, 3];

  function initAudio() {
    if (!AudioCtx || audioCtx) return;
    try {
      audioCtx = new AudioCtx();
      compressor = audioCtx.createDynamicsCompressor();
      compressor.threshold.value = -14;
      compressor.knee.value = 12;
      compressor.ratio.value = 6;
      compressor.attack.value = 0.003;
      compressor.release.value = 0.15;

      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0;
      masterGain.connect(compressor);
      compressor.connect(audioCtx.destination);

      const len = Math.floor(audioCtx.sampleRate * 1.5);
      noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = audRng() * 2 - 1;

      audioCtx.resume().catch(function () {});
    } catch (e) {
      audioCtx = null;
    }
  }

  function resumeAudio() {
    if (!audioCtx) initAudio();
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume().catch(function () {});
    }
  }

  initAudio();
  window.addEventListener("pointerdown", resumeAudio, { passive: true });
  window.addEventListener("keydown", resumeAudio, { passive: true });

  function stopAllAudio() {
    if (!audioCtx || !masterGain) return;
    const now = audioCtx.currentTime;
    masterGain.gain.cancelScheduledValues(now);
    masterGain.gain.setTargetAtTime(0, now, 0.012);
    activeVoices.forEach(function (v) {
      try { v.stop(now + 0.04); } catch (e) {}
    });
    activeVoices.clear();
    if (windGain) {
      windGain.gain.cancelScheduledValues(now);
      windGain.gain.setTargetAtTime(0, now, 0.012);
    }
  }

  function makePanner(boardX) {
    if (typeof audioCtx.createStereoPanner === "function") {
      const p = audioCtx.createStereoPanner();
      p.pan.value = Math.max(-0.85, Math.min(0.85, (boardX / 24) * 2 - 1));
      p.connect(masterGain);
      return p;
    }
    return masterGain;
  }

  function trackVoice(node, stopTime) {
    activeVoices.add(node);
    node.onended = function () { activeVoices.delete(node); };
    node.stop(stopTime);
  }

  function playShotSound(typeIdx, boardX) {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const g = audioCtx.createGain();
    const out = makePanner(boardX);
    const det = 0.96 + audRng() * 0.08;

    if (typeIdx === 0) {
      const osc = audioCtx.createOscillator();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(660 * det, now);
      osc.frequency.exponentialRampToValueAtTime(280 * det, now + 0.055);
      g.gain.setValueAtTime(0.08, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc.connect(g); g.connect(out);
      osc.start(now); trackVoice(osc, now + 0.065);
    } else if (typeIdx === 1) {
      const osc = audioCtx.createOscillator();
      osc.type = "sine";
      osc.frequency.setValueAtTime(145 * det, now);
      osc.frequency.exponentialRampToValueAtTime(42 * det, now + 0.14);
      g.gain.setValueAtTime(0.16, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      osc.connect(g); g.connect(out);
      osc.start(now); trackVoice(osc, now + 0.16);
    } else if (typeIdx === 2) {
      const osc = audioCtx.createOscillator();
      osc.type = "sine";
      osc.frequency.setValueAtTime(1320 * det, now);
      osc.frequency.exponentialRampToValueAtTime(1780 * det, now + 0.07);
      g.gain.setValueAtTime(0.045, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      osc.connect(g); g.connect(out);
      osc.start(now); trackVoice(osc, now + 0.085);
    } else if (typeIdx === 3) {
      const osc = audioCtx.createOscillator();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(920 * det, now);
      osc.frequency.exponentialRampToValueAtTime(180 * det, now + 0.13);
      const flt = audioCtx.createBiquadFilter();
      flt.type = "lowpass"; flt.frequency.value = 2600;
      g.gain.setValueAtTime(0.14, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
      osc.connect(flt); flt.connect(g); g.connect(out);
      osc.start(now); trackVoice(osc, now + 0.15);
    } else {
      const ns = audioCtx.createBufferSource();
      ns.buffer = noiseBuf;
      const flt = audioCtx.createBiquadFilter();
      flt.type = "bandpass"; flt.frequency.value = 1100 * det; flt.Q.value = 1.4;
      g.gain.setValueAtTime(0.11, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      ns.connect(flt); flt.connect(g); g.connect(out);
      ns.start(now, audRng() * 0.5, 0.09); trackVoice(ns, now + 0.09);
    }
  }

  function playKillSound(boardX) {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    if (now - lastKillAudioTime < 0.045) return;
    lastKillAudioTime = now;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(310 * (0.95 + audRng() * 0.1), now);
    osc.frequency.exponentialRampToValueAtTime(110, now + 0.05);
    g.gain.setValueAtTime(0.055, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.055);
    osc.connect(g); g.connect(makePanner(boardX));
    osc.start(now); trackVoice(osc, now + 0.06);
  }

  function playWaveHorn() {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const freqs = [196, 293.66];
    for (let i = 0; i < 2; i++) {
      const osc = audioCtx.createOscillator();
      const flt = audioCtx.createBiquadFilter();
      const g = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(freqs[i] * 0.94, now);
      osc.frequency.linearRampToValueAtTime(freqs[i], now + 0.16);
      flt.type = "lowpass";
      flt.frequency.setValueAtTime(650, now);
      flt.frequency.linearRampToValueAtTime(1150, now + 0.25);
      g.gain.setValueAtTime(0.001, now);
      g.gain.linearRampToValueAtTime(0.065, now + 0.08);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.42);
      osc.connect(flt); flt.connect(g); g.connect(masterGain);
      osc.start(now); trackVoice(osc, now + 0.45);
    }
  }

  function playLeakSound(boardX) {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const out = makePanner(boardX);
    const ns = audioCtx.createBufferSource();
    ns.buffer = noiseBuf;
    const flt = audioCtx.createBiquadFilter();
    flt.type = "bandpass"; flt.frequency.value = 1600; flt.Q.value = 0.8;
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.22, now);
    ng.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
    ns.connect(flt); flt.connect(ng); ng.connect(out);
    ns.start(now, audRng() * 0.3, 0.15); trackVoice(ns, now + 0.16);

    const osc = audioCtx.createOscillator();
    const og = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(420, now);
    osc.frequency.setValueAtTime(310, now + 0.08);
    og.gain.setValueAtTime(0.075, now);
    og.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
    osc.connect(og); og.connect(out);
    osc.start(now); trackVoice(osc, now + 0.19);
  }

  function playFallAndStartWind() {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const out = makePanner(23.5);
    const ns = audioCtx.createBufferSource();
    ns.buffer = noiseBuf;
    const flt = audioCtx.createBiquadFilter();
    flt.type = "lowpass"; flt.frequency.setValueAtTime(620, now);
    flt.frequency.exponentialRampToValueAtTime(110, now + 1.1);
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.32, now);
    ng.gain.exponentialRampToValueAtTime(0.001, now + 1.15);
    ns.connect(flt); flt.connect(ng); ng.connect(out);
    ns.start(now, 0, 1.2); trackVoice(ns, now + 1.22);

    const osc = audioCtx.createOscillator();
    const og = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(75, now);
    osc.frequency.exponentialRampToValueAtTime(28, now + 0.9);
    og.gain.setValueAtTime(0.28, now);
    og.gain.exponentialRampToValueAtTime(0.001, now + 0.95);
    osc.connect(og); og.connect(out);
    osc.start(now); trackVoice(osc, now + 1.0);
  }

  function ensureWind(playingAfterFall) {
    if (!audioCtx || !masterGain) return;
    const now = audioCtx.currentTime;
    if (!playingAfterFall) {
      if (windGain) {
        windGain.gain.cancelScheduledValues(now);
        windGain.gain.setTargetAtTime(0, now, 0.02);
      }
      return;
    }
    if (!windSource) {
      windSource = audioCtx.createBufferSource();
      windSource.buffer = noiseBuf;
      windSource.loop = true;
      const flt = audioCtx.createBiquadFilter();
      flt.type = "bandpass";
      flt.frequency.value = 220;
      flt.Q.value = 1.6;
      windGain = audioCtx.createGain();
      windGain.gain.value = 0;
      windSource.connect(flt);
      flt.connect(windGain);
      windGain.connect(masterGain);
      windSource.start(now);
    }
    windGain.gain.cancelScheduledValues(now);
    windGain.gain.setTargetAtTime(0.06, now, 0.15);
  }

  function triggerForwardAudio(prevTime, currTime) {
    if (!audioCtx || audioCtx.state !== "running" || !masterGain) return;
    const now = audioCtx.currentTime;
    masterGain.gain.cancelScheduledValues(now);
    masterGain.gain.setTargetAtTime(0.75, now, 0.015);

    const afterFall = fallTick >= 0 && currTime >= fallTime;
    ensureWind(afterFall);

    if (fallTick >= 0 && prevTime < fallTime && currTime >= fallTime) {
      playFallAndStartWind();
      return;
    }
    if (afterFall) return;

    const kPrev = Math.floor(prevTime * TICKS_PER_SEC);
    const kCurr = Math.floor(currTime * TICKS_PER_SEC);
    if (kCurr <= kPrev) return;

    for (let i = 0; i < waveStartEvents.length; i++) {
      const we = waveStartEvents[i];
      if (we.tick > kPrev && we.tick <= kCurr) playWaveHorn();
    }
    for (let i = 0; i < leakEvents.length; i++) {
      const le = leakEvents[i];
      if (le.tick > kPrev && le.tick <= kCurr) playLeakSound(le.x);
    }
    for (let i = 0; i < killEvents.length; i++) {
      const ke = killEvents[i];
      if (ke.tick > kPrev && ke.tick <= kCurr) { playKillSound(ke.x); break; }
    }

    while (recentShotTimes.length > 0 && now - recentShotTimes[0] > 1.0) {
      recentShotTimes.shift();
    }
    const frameShots = [];
    for (let i = 0; i < shotEvents.length; i++) {
      const se = shotEvents[i];
      if (se.tick > kPrev && se.tick <= kCurr) frameShots.push(se);
    }
    if (frameShots.length > 0) {
      frameShots.sort(function (a, b) {
        return SHOT_LOUDNESS[b.typeIdx] - SHOT_LOUDNESS[a.typeIdx];
      });
      for (let i = 0; i < frameShots.length; i++) {
        if (recentShotTimes.length >= 12) break;
        recentShotTimes.push(now);
        playShotSound(frameShots[i].typeIdx, frameShots[i].sx);
      }
    }
  }

  // --- Playback State Machine ---
  const STATE = {
    COUNTDOWN: "COUNTDOWN",
    PLAYING: "PLAYING",
    PAUSED: "PAUSED",
    REFIRE_HOLD: "REFIRE_HOLD",
    ENDED: "ENDED"
  };

  let state = STATE.COUNTDOWN;
  let simTime = 0;
  let playbackSpeed = 1.0;
  let countdownElapsed = 0;
  let holdElapsed = 0;
  let lastFrameTs = null;
  let curWidth = window.innerWidth;
  let curHeight = window.innerHeight;

  const elCountdown = document.getElementById("countdown");
  const elRefire = document.getElementById("btn-refire");
  const elToggle = document.getElementById("btn-toggle");
  const elIconPause = document.getElementById("icon-pause");
  const elIconPlay = document.getElementById("icon-play");
  const elScrubber = document.getElementById("scrubber");
  const speedPills = Array.prototype.slice.call(document.querySelectorAll(".speed-pill"));

  function setToggleVisual(isPlayingOrActive) {
    if (isPlayingOrActive) {
      elIconPause.style.display = "";
      elIconPlay.style.display = "none";
      elToggle.setAttribute("aria-label", "Pause");
    } else {
      elIconPause.style.display = "none";
      elIconPlay.style.display = "";
      elToggle.setAttribute("aria-label", "Play");
    }
  }

  elToggle.addEventListener("click", function () {
    resumeAudio();
    if (state === STATE.PLAYING) {
      state = STATE.PAUSED;
      setToggleVisual(false);
      stopAllAudio();
    } else if (state === STATE.COUNTDOWN || state === STATE.REFIRE_HOLD) {
      elCountdown.style.display = "none";
      elCountdown.textContent = "";
      simTime = 0;
      elScrubber.value = "0";
      state = STATE.PAUSED;
      setToggleVisual(false);
      stopAllAudio();
      renderAtSimTime(simTime);
    } else if (state === STATE.PAUSED) {
      state = STATE.PLAYING;
      setToggleVisual(true);
    } else if (state === STATE.ENDED) {
      simTime = 0;
      elScrubber.value = "0";
      elCountdown.style.display = "none";
      elCountdown.textContent = "";
      state = STATE.PLAYING;
      setToggleVisual(true);
      renderAtSimTime(simTime);
    }
  });

  for (let i = 0; i < speedPills.length; i++) {
    speedPills[i].addEventListener("click", function (ev) {
      resumeAudio();
      const btn = ev.currentTarget;
      playbackSpeed = parseFloat(btn.getAttribute("data-speed")) || 1.0;
      for (let j = 0; j < speedPills.length; j++) {
        const active = speedPills[j] === btn;
        speedPills[j].classList.toggle("is-active", active);
        speedPills[j].setAttribute("aria-checked", active ? "true" : "false");
      }
    });
  }

  elScrubber.addEventListener("pointerdown", function () {
    resumeAudio();
    stopAllAudio();
  });

  elScrubber.addEventListener("input", function () {
    resumeAudio();
    if (state === STATE.COUNTDOWN || state === STATE.REFIRE_HOLD) {
      elCountdown.style.display = "none";
      elCountdown.textContent = "";
    }
    simTime = Math.max(0, Math.min(DURATION, parseFloat(elScrubber.value) || 0));
    state = STATE.PAUSED;
    setToggleVisual(false);
    stopAllAudio();
    renderAtSimTime(simTime);
  });

  elRefire.addEventListener("click", function () {
    resumeAudio();
    elCountdown.style.display = "none";
    elCountdown.textContent = "";
    simTime = 0;
    elScrubber.value = "0";
    holdElapsed = 0;
    state = STATE.REFIRE_HOLD;
    setToggleVisual(true);
    stopAllAudio();
    renderAtSimTime(0);
  });

  function onResize() {
    curWidth = window.innerWidth;
    curHeight = window.innerHeight;
    updateCameraFraming(curWidth, curHeight);
    renderAtSimTime(simTime);
  }
  window.addEventListener("resize", onResize);

  updateCameraFraming(curWidth, curHeight);
  elCountdown.style.display = "block";
  elCountdown.textContent = "3";
  setToggleVisual(true);
  renderAtSimTime(0);

  function tickLoop(ts) {
    if (lastFrameTs === null) {
      lastFrameTs = ts;
      requestAnimationFrame(tickLoop);
      return;
    }
    const rawDt = Math.max(0, (ts - lastFrameTs) / 1000);
    lastFrameTs = ts;
    const dt = Math.min(rawDt, 0.1);

    if (state === STATE.COUNTDOWN) {
      countdownElapsed += dt;
      if (countdownElapsed < 1.0) {
        elCountdown.style.display = "block";
        elCountdown.textContent = "3";
        renderAtSimTime(0);
      } else if (countdownElapsed < 2.0) {
        elCountdown.style.display = "block";
        elCountdown.textContent = "2";
        renderAtSimTime(0);
      } else if (countdownElapsed < 3.0) {
        elCountdown.style.display = "block";
        elCountdown.textContent = "1";
        renderAtSimTime(0);
      } else {
        elCountdown.style.display = "none";
        elCountdown.textContent = "";
        state = STATE.PLAYING;
        simTime = 0;
        elScrubber.value = "0";
        renderAtSimTime(0);
      }
    } else if (state === STATE.REFIRE_HOLD) {
      holdElapsed += dt;
      if (holdElapsed >= 1.0) {
        state = STATE.PLAYING;
        simTime = 0;
        elScrubber.value = "0";
      }
      renderAtSimTime(simTime);
    } else if (state === STATE.PLAYING) {
      const prevTime = simTime;
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      elScrubber.value = simTime.toFixed(3);
      triggerForwardAudio(prevTime, simTime);
      renderAtSimTime(simTime);
      if (simTime >= DURATION) {
        simTime = DURATION;
        elScrubber.value = DURATION.toFixed(3);
        state = STATE.ENDED;
        setToggleVisual(false);
        stopAllAudio();
      }
    }

    requestAnimationFrame(tickLoop);
  }
  requestAnimationFrame(tickLoop);

  window.BENCH_REPORT = {
    selfCheck: { vectorA: selfCheckRes.vectorA, vectorB: selfCheckRes.vectorB },
    strategy: {
      summary: "Cannon splash core in both U-loops + strategic Frost slow cycling (10/6) + Bolt exit finisher (13) + reactive Flak AA (12/14/15/5) + Mender-focused AoE targeting + safe early interest banking (400g w8-w19).",
      seedsTested: 50,
      meanScoreOnTestedSeeds: 46.40
    },
    seed42: { score: simRes42.score, fallTick: simRes42.fallTick },
    systems: {
      board: "full",
      enemiesAndTurrets: "full",
      combatVisuals: "full",
      fall: "full",
      hud: "full",
      audio: "full"
    },
    simplifications: [],
    testedInBrowser: false,
    measuredFps: null
  };
})();
</script>
