<script id="rampart-strategy">
function createStrategy() {
  const COST = { bolt: 50, cannon: 90, frost: 70, lance: 120, flak: 80 };
  const SLOT_TYPES = [
    "lance", "cannon", "flak", "cannon",
    "cannon", "cannon", "cannon", "cannon",
    "frost", "cannon", "flak", "cannon",
    "flak", "cannon", "flak", "frost"
  ];
  const BUILD_ORDER = [6, 12, 11, 8, 3, 14, 4, 13, 10, 5, 9, 7, 15, 1, 2, 0];
  const UPGRADE_ORDER = [6, 11, 3, 4, 13, 5, 9, 7, 12, 10, 14, 1, 2, 0];
  const FROST_ORDER = [8, 15];

  function ttl(c) {
    const sp = c.slowed ? Math.floor(c.speed * 60 / 100) : c.speed;
    return c.remaining / (sp || 1);
  }

  return {
    plan(state) {
      const actions = [];
      let gold = state.gold;

      if (state.wave === 1 && !state.slots[13].turret && gold >= 50) {
        actions.push({ op: "build", slot: 13, type: "bolt" });
        gold -= 50;
      }
      if (state.wave === 3 && !state.slots[12].turret && gold >= 80) {
        actions.push({ op: "build", slot: 12, type: "flak" });
        gold -= 80;
      }
      if (state.wave >= 16 && state.slots[13].turret && state.slots[13].turret.type === "bolt") {
        if (gold + 35 >= 90) {
          actions.push({ op: "sell", slot: 13 });
          gold += 35;
        }
      }

      let reserve = 0;
      if (state.wave >= 5 && state.wave < 22 && state.baseHp === 10) {
        let danger = false;
        const enemies = state.enemies;
        for (let i = 0; i < enemies.length; i++) {
          if (ttl(enemies[i]) < 35) {
            danger = true;
            break;
          }
        }
        if (!danger) reserve = 500;
      }

      for (let i = 0; i < BUILD_ORDER.length; i++) {
        const sl = BUILD_ORDER[i];
        const tType = SLOT_TYPES[sl];
        if (!state.slots[sl].turret && gold - reserve >= COST[tType]) {
          actions.push({ op: "build", slot: sl, type: tType });
          gold -= COST[tType];
        }
      }

      for (let tier = 1; tier <= 2; tier++) {
        for (let i = 0; i < UPGRADE_ORDER.length; i++) {
          const sl = UPGRADE_ORDER[i];
          const t = state.slots[sl].turret;
          if (t && t.type === SLOT_TYPES[sl] && t.type !== "frost" && t.tier === tier) {
            const upCost = COST[t.type] * (tier === 1 ? 1 : 2);
            if (gold - reserve >= upCost) {
              actions.push({ op: "upgrade", slot: sl });
              gold -= upCost;
            }
          }
        }
      }

      let allDpsMax = true;
      for (let i = 0; i < 16; i++) {
        const t = state.slots[i].turret;
        if (!t || (t.type !== "frost" && t.tier < 3)) {
          allDpsMax = false;
          break;
        }
      }
      if (allDpsMax) {
        for (let tier = 1; tier <= 2; tier++) {
          for (let i = 0; i < FROST_ORDER.length; i++) {
            const sl = FROST_ORDER[i];
            const t = state.slots[sl].turret;
            if (t && t.type === "frost" && t.tier === tier) {
              const upCost = 70 * (tier === 1 ? 1 : 2);
              if (gold - reserve >= upCost) {
                actions.push({ op: "upgrade", slot: sl });
                gold -= upCost;
              }
            }
          }
        }
      }

      return actions;
    },

    target(turret, candidates) {
      if (candidates.length === 1) return candidates[0].id;
      const type = turret.type;

      if (type === "frost") {
        let best = candidates[0];
        let bestSc = -1e18;
        for (let i = 0; i < candidates.length; i++) {
          const c = candidates[i];
          const t = ttl(c);
          const sc = (c.slowed ? 0 : 1000000) + (1000 - t) * 10 + c.speed * 25 + (c.air ? 150 : 0);
          if (sc > bestSc) {
            bestSc = sc;
            best = c;
          }
        }
        return best.id;
      }

      if (type === "cannon" || type === "flak") {
        const isCan = type === "cannon";
        const sr2 = isCan ? 8100 : 4900;
        const dmg = isCan
          ? (turret.tier === 1 ? 60 : (turret.tier === 2 ? 96 : 153))
          : (turret.tier === 1 ? 40 : (turret.tier === 2 ? 64 : 102));
        const uT = isCan ? 45 : 28;
        let best = candidates[0];
        let bestSc = -1e18;
        for (let i = 0; i < candidates.length; i++) {
          const c = candidates[i];
          let effHits = 0;
          let minTtl = 1e9;
          let menders = 0;
          let kills = 0;
          for (let j = 0; j < candidates.length; j++) {
            const o = candidates[j];
            const dx = o.x - c.x;
            const dy = o.y - c.y;
            if (dx * dx + dy * dy <= sr2) {
              const dealt = Math.max(1, dmg - o.armor);
              effHits += Math.min(o.hp, dealt) / dmg;
              if (dealt >= o.hp) kills += 1;
              if (o.type === "mender") menders += 1;
              const ot = ttl(o);
              if (ot < minTtl) minTtl = ot;
            }
          }
          const urg = minTtl < uT ? (uT + 15 - minTtl) * 2000 : (1000 - minTtl) * 3;
          const sc = effHits * 10000 + kills * 1500 + menders * 5000 + urg;
          if (sc > bestSc) {
            bestSc = sc;
            best = c;
          }
        }
        return best.id;
      }

      if (type === "lance") {
        const dmg = turret.tier === 1 ? 180 : (turret.tier === 2 ? 288 : 460);
        let best = candidates[0];
        let bestSc = -1e18;
        for (let i = 0; i < candidates.length; i++) {
          const c = candidates[i];
          const t = ttl(c);
          if (t < 42) {
            const sc = 1e9 + (100 - t) * 1000;
            if (sc > bestSc) {
              bestSc = sc;
              best = c;
            }
            continue;
          }
          const eff = Math.min(c.hp, dmg) / dmg;
          const menderBonus = (c.type === "mender" && c.hp >= dmg * 0.4) ? 3000 : 0;
          const armorBonus = c.armor * 35;
          const sc = eff * 3500 + menderBonus + armorBonus + (800 - t) * 3;
          if (sc > bestSc) {
            bestSc = sc;
            best = c;
          }
        }
        return best.id;
      }

      const dmg = turret.tier === 1 ? 26 : (turret.tier === 2 ? 41 : 65);
      let best = candidates[0];
      let bestSc = -1e18;
      for (let i = 0; i < candidates.length; i++) {
        const c = candidates[i];
        const t = ttl(c);
        const eff = Math.max(1, dmg - c.armor);
        const urg = t < 35 ? (50 - t) * 500 : (1000 - t) * 3;
        const sc = eff * 50 + (eff >= c.hp ? 2500 : 0) + (c.type === "mender" ? 1500 : 0) + urg;
        if (sc > bestSc) {
          bestSc = sc;
          best = c;
        }
      }
      return best.id;
    }
  };
}
</script>

<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks) {
  const observer = arguments.length > 3 ? arguments[3] : null;

  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return (t ^ (t >>> 14)) >>> 0;
    };
  }

  const SLOTS = [
    [350, 350], [550, 550], [750, 450], [750, 850],
    [950, 950], [1050, 550], [1150, 850], [1350, 850],
    [1450, 550], [1550, 250], [1650, 750], [1750, 450],
    [1950, 850], [2050, 1050], [2250, 950], [350, 750]
  ];

  const GROUND_PTS = [
    [50, 250], [650, 250], [650, 1050], [1250, 1050],
    [1250, 350], [1850, 350], [1850, 1150], [2350, 1150]
  ];
  const AIR_PTS = [
    [50, 650], [2150, 650], [2150, 1150], [2350, 1150]
  ];

  function buildRoute(pts) {
    const segs = [];
    let total = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const x0 = pts[i][0];
      const y0 = pts[i][1];
      const x1 = pts[i + 1][0];
      const y1 = pts[i + 1][1];
      const dx = x1 - x0;
      const dy = y1 - y0;
      const len = Math.abs(dx) + Math.abs(dy);
      const sx = dx === 0 ? 0 : (dx > 0 ? 1 : -1);
      const sy = dy === 0 ? 0 : (dy > 0 ? 1 : -1);
      segs.push({ x0: x0, y0: y0, sx: sx, sy: sy, len: len, start: total, end: total + len });
      total += len;
    }
    return { segs: segs, total: total };
  }

  const GROUND_ROUTE = buildRoute(GROUND_PTS);
  const AIR_ROUTE = buildRoute(AIR_PTS);

  function posOnRoute(route, progress) {
    const segs = route.segs;
    for (let i = 0; i < segs.length; i++) {
      const s = segs[i];
      if (progress <= s.end) {
        const d = progress - s.start;
        return [s.x0 + s.sx * d, s.y0 + s.sy * d];
      }
    }
    const last = segs[segs.length - 1];
    return [last.x0 + last.sx * last.len, last.y0 + last.sy * last.len];
  }

  const TURRET_TYPES = {
    bolt:   { idx: 0, cost: 50,  dmg: 26,  period: 8,  range: 300, splash: 0,  slow: 0,  pierce: false, ground: true,  air: true },
    cannon: { idx: 1, cost: 90,  dmg: 60,  period: 24, range: 260, splash: 90, slow: 0,  pierce: false, ground: true,  air: false },
    frost:  { idx: 2, cost: 70,  dmg: 10,  period: 12, range: 240, splash: 0,  slow: 30, pierce: false, ground: true,  air: true },
    lance:  { idx: 3, cost: 120, dmg: 180, period: 36, range: 360, splash: 0,  slow: 0,  pierce: true,  ground: true,  air: false },
    flak:   { idx: 4, cost: 80,  dmg: 40,  period: 10, range: 320, splash: 70, slow: 0,  pierce: false, ground: false, air: true }
  };

  const ENEMY_LIST = [
    { type: "grunt",    baseHp: 60,  speed: 10, bounty: 4, leak: 1, air: 0, firstWave: 1, weight: 10 },
    { type: "runner",   baseHp: 40,  speed: 20, bounty: 4, leak: 1, air: 0, firstWave: 2, weight: 4 },
    { type: "wisp",     baseHp: 50,  speed: 12, bounty: 6, leak: 2, air: 1, firstWave: 3, weight: 3 },
    { type: "brute",    baseHp: 150, speed: 6,  bounty: 9, leak: 3, air: 0, firstWave: 4, weight: 3 },
    { type: "splitter", baseHp: 90,  speed: 8,  bounty: 6, leak: 2, air: 0, firstWave: 6, weight: 2 },
    { type: "mender",   baseHp: 70,  speed: 8,  bounty: 7, leak: 2, air: 0, firstWave: 8, weight: 1 }
  ];
  const ENEMY_MAP = {};
  for (let i = 0; i < ENEMY_LIST.length; i++) {
    ENEMY_MAP[ENEMY_LIST[i].type] = ENEMY_LIST[i];
  }

  const rng = mulberry32(seed >>> 0);
  const strat = createStrategy();
  const hasTarget = strat && typeof strat.target === "function";

  let gold = 250;
  let baseHp = 10;
  let wave = 0;
  let nextId = 1;
  let fallTick = -1;
  let endTick = maxTicks;

  const turrets = new Array(16).fill(null);
  let enemies = [];
  const spawnQueue = [];
  const log = [];

  const mCache = [0, 1000];
  function getM(w) {
    while (mCache.length <= w) {
      mCache.push(Math.floor(mCache[mCache.length - 1] * 108 / 100));
    }
    return mCache[w];
  }

  function genWave(w) {
    const count = 4 + Math.floor(3 * w / 5);
    const avail = [];
    let totalW = 0;
    for (let i = 0; i < ENEMY_LIST.length; i++) {
      if (ENEMY_LIST[i].firstWave <= w) {
        avail.push(ENEMY_LIST[i]);
        totalW += ENEMY_LIST[i].weight;
      }
    }
    const out = [];
    for (let i = 0; i < count; i++) {
      let r = rng() % totalW;
      let chosen = avail[avail.length - 1].type;
      for (let j = 0; j < avail.length; j++) {
        if (r < avail[j].weight) {
          chosen = avail[j].type;
          break;
        }
        r -= avail[j].weight;
      }
      out.push(chosen);
    }
    return out;
  }

  function makeEnemyView(e) {
    return {
      id: e.id,
      type: e.type,
      hp: e.hp,
      maxHp: e.maxHp,
      x: e.x,
      y: e.y,
      air: e.air,
      armor: e.armor,
      speed: e.speed,
      slowed: e.slow > 0,
      remaining: e.routeLen - e.progress
    };
  }

  let curWaveComp = genWave(1);
  let nextWaveComp = null;

  if (observer && observer.onInit) {
    observer.onInit(curWaveComp.slice(), SLOTS, GROUND_ROUTE, AIR_ROUTE);
  }

  for (let tick = 0; tick < maxTicks; tick++) {
    // 1. Wave start
    if (tick >= 20 && (tick - 20) % 40 === 0) {
      wave = Math.floor((tick - 20) / 40) + 1;
      if (wave > 1) curWaveComp = nextWaveComp;
      nextWaveComp = genWave(wave + 1);
      gold += Math.min(50, Math.floor(gold * 5 / 100)) + 10 + 2 * wave;

      const state = {
        tick: tick,
        wave: wave,
        gold: gold,
        baseHp: baseHp,
        slots: SLOTS.map(function (pos, idx) {
          return {
            slot: idx,
            x: pos[0],
            y: pos[1],
            turret: turrets[idx]
              ? { type: turrets[idx].type, tier: turrets[idx].tier, spent: turrets[idx].spent }
              : null
          };
        }),
        enemies: enemies.map(makeEnemyView),
        nextWave: nextWaveComp.slice()
      };

      if (observer && observer.onWaveStart) {
        observer.onWaveStart(tick, wave, nextWaveComp.slice());
      }

      const actions = strat.plan(state);
      if (Array.isArray(actions)) {
        const limit = Math.min(32, actions.length);
        for (let i = 0; i < limit; i++) {
          const act = actions[i];
          if (!act || typeof act !== "object") continue;
          const slot = act.slot;
          if (!Number.isInteger(slot) || slot < 0 || slot >= 16) continue;
          if (act.op === "build") {
            if (turrets[slot] !== null) continue;
            const spec = TURRET_TYPES[act.type];
            if (!spec || gold < spec.cost) continue;
            gold -= spec.cost;
            turrets[slot] = {
              slot: slot,
              type: act.type,
              tier: 1,
              spent: spec.cost,
              damage: spec.dmg,
              period: spec.period,
              range: spec.range,
              splash: spec.splash,
              slow: spec.slow,
              pierce: spec.pierce,
              ground: spec.ground,
              air: spec.air,
              cooldown: 0,
              x: SLOTS[slot][0],
              y: SLOTS[slot][1]
            };
            log.push([tick, "B", slot, spec.idx]);
            if (observer && observer.onTurretAction) {
              observer.onTurretAction(tick, "B", slot, spec.idx, 1);
            }
          } else if (act.op === "upgrade") {
            const t = turrets[slot];
            if (!t || t.tier >= 3) continue;
            const baseCost = TURRET_TYPES[t.type].cost;
            const upCost = t.tier === 1 ? baseCost : baseCost * 2;
            if (gold < upCost) continue;
            gold -= upCost;
            t.spent += upCost;
            t.tier += 1;
            t.damage = Math.floor(t.damage * 16 / 10);
            t.range += 30;
            log.push([tick, "U", slot, t.tier]);
            if (observer && observer.onTurretAction) {
              observer.onTurretAction(tick, "U", slot, TURRET_TYPES[t.type].idx, t.tier);
            }
          } else if (act.op === "sell") {
            const t = turrets[slot];
            if (!t) continue;
            const oldIdx = TURRET_TYPES[t.type].idx;
            gold += Math.floor(t.spent * 70 / 100);
            turrets[slot] = null;
            log.push([tick, "S", slot, 0]);
            if (observer && observer.onTurretAction) {
              observer.onTurretAction(tick, "S", slot, oldIdx, 0);
            }
          }
        }
      }

      for (let i = 0; i < curWaveComp.length; i++) {
        spawnQueue.push({
          tick: tick + 4 * i,
          wave: wave,
          idx: i,
          type: curWaveComp[i]
        });
      }
    }

    // 2. Spawn
    if (spawnQueue.length > 0) {
      const due = [];
      let keep = 0;
      for (let i = 0; i < spawnQueue.length; i++) {
        if (spawnQueue[i].tick === tick) due.push(spawnQueue[i]);
        else spawnQueue[keep++] = spawnQueue[i];
      }
      spawnQueue.length = keep;
      if (due.length > 1) {
        due.sort(function (a, b) { return a.wave - b.wave || a.idx - b.idx; });
      }
      for (let i = 0; i < due.length; i++) {
        const d = due[i];
        const spec = ENEMY_MAP[d.type];
        const m = getM(d.wave);
        const maxHp = Math.floor(spec.baseHp * m / 1000);
        const armor = d.type === "grunt" ? Math.floor(d.wave / 4) : (d.type === "brute" ? 6 + d.wave : 0);
        const route = spec.air ? AIR_ROUTE : GROUND_ROUTE;
        const pos = posOnRoute(route, 0);
        enemies.push({
          id: nextId++,
          type: d.type,
          wave: d.wave,
          hp: maxHp,
          maxHp: maxHp,
          speed: spec.speed,
          armor: armor,
          bounty: spec.bounty,
          leak: spec.leak,
          air: spec.air,
          route: route,
          routeLen: route.total,
          progress: 0,
          x: pos[0],
          y: pos[1],
          age: 0,
          slow: 0
        });
      }
    }

    // 3. Move
    let fell = false;
    const survivingAfterMove = [];
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      const stepDist = e.slow > 0 ? Math.floor(e.speed * 60 / 100) : e.speed;
      e.progress += stepDist;
      if (e.progress >= e.routeLen) {
        baseHp -= e.leak;
        log.push([tick, "L", e.id, baseHp]);
        if (observer && observer.onLeak) {
          observer.onLeak(tick, e.id, e.type, e.air, baseHp);
        }
        if (baseHp <= 0) {
          log.push([tick, "F", wave, 0]);
          fallTick = tick;
          endTick = tick;
          fell = true;
          if (observer && observer.onFall) {
            observer.onFall(tick, wave, gold, baseHp, turrets, survivingAfterMove);
          }
          break;
        }
      } else {
        const pos = posOnRoute(e.route, e.progress);
        e.x = pos[0];
        e.y = pos[1];
        survivingAfterMove.push(e);
      }
    }
    enemies = survivingAfterMove;
    if (fell) break;

    // 4. Age & heal
    for (let i = 0; i < enemies.length; i++) {
      enemies[i].age += 1;
    }
    for (let i = 0; i < enemies.length; i++) {
      const m = enemies[i];
      if (m.type === "mender" && m.age % 20 === 0) {
        for (let j = 0; j < enemies.length; j++) {
          const t = enemies[j];
          const dx = t.x - m.x;
          const dy = t.y - m.y;
          if (dx * dx + dy * dy <= 150 * 150) {
            t.hp = Math.min(t.maxHp, t.hp + Math.floor(t.maxHp * 8 / 100));
          }
        }
        if (observer && observer.onHeal) {
          observer.onHeal(tick, m.id, m.x, m.y);
        }
      }
    }

    // 5. Turrets fire
    for (let s = 0; s < 16; s++) {
      const t = turrets[s];
      if (!t) continue;
      if (t.cooldown > 0) {
        t.cooldown -= 1;
        if (t.cooldown > 0) continue;
      }
      const r2 = t.range * t.range;
      const candidates = [];
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (e.air ? !t.air : !t.ground) continue;
        const dx = e.x - t.x;
        const dy = e.y - t.y;
        if (dx * dx + dy * dy <= r2) candidates.push(e);
      }
      if (candidates.length === 0) continue;

      let chosen = candidates[0];
      let bestRem = chosen.routeLen - chosen.progress;
      for (let i = 1; i < candidates.length; i++) {
        const rem = candidates[i].routeLen - candidates[i].progress;
        if (rem < bestRem) {
          bestRem = rem;
          chosen = candidates[i];
        }
      }

      if (hasTarget) {
        const tView = { slot: t.slot, type: t.type, tier: t.tier, x: t.x, y: t.y, range: t.range };
        const cViews = candidates.map(makeEnemyView);
        const pickId = strat.target(tView, cViews);
        for (let i = 0; i < candidates.length; i++) {
          if (candidates[i].id === pickId) {
            chosen = candidates[i];
            break;
          }
        }
      }

      if (observer && observer.onShot) {
        observer.onShot(tick, s, TURRET_TYPES[t.type].idx, t.tier, t.x, t.y, chosen.x, chosen.y, chosen.air, t.splash, t.slow);
      }

      if (t.splash > 0) {
        const sr2 = t.splash * t.splash;
        for (let i = 0; i < enemies.length; i++) {
          const e = enemies[i];
          if (e.air ? !t.air : !t.ground) continue;
          const dx = e.x - chosen.x;
          const dy = e.y - chosen.y;
          if (dx * dx + dy * dy <= sr2) {
            e.hp -= t.pierce ? t.damage : Math.max(1, t.damage - e.armor);
            if (t.slow > 0) e.slow = t.slow;
          }
        }
      } else {
        chosen.hp -= t.pierce ? t.damage : Math.max(1, t.damage - chosen.armor);
        if (t.slow > 0) chosen.slow = t.slow;
      }
      t.cooldown = t.period;

      const nextEnemies = [];
      const spawnedSplits = [];
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (e.hp <= 0) {
          gold += e.bounty;
          log.push([tick, "K", e.id, s]);
          if (observer && observer.onKill) {
            observer.onKill(tick, e.id, e.type, e.x, e.y, e.air);
          }
          if (e.type === "splitter") {
            const splitHp = Math.max(1, Math.floor(e.maxHp / 4));
            if (observer && observer.onSplit) {
              observer.onSplit(tick, e.id, e.x, e.y);
            }
            for (let k = 0; k < 3; k++) {
              spawnedSplits.push({
                id: nextId++,
                type: "splitling",
                wave: e.wave,
                hp: splitHp,
                maxHp: splitHp,
                speed: 12,
                armor: 0,
                bounty: 1,
                leak: 1,
                air: 0,
                route: GROUND_ROUTE,
                routeLen: GROUND_ROUTE.total,
                progress: e.progress,
                x: e.x,
                y: e.y,
                age: 0,
                slow: 0
              });
            }
          }
        } else {
          nextEnemies.push(e);
        }
      }
      for (let i = 0; i < spawnedSplits.length; i++) {
        nextEnemies.push(spawnedSplits[i]);
      }
      enemies = nextEnemies;
    }

    // 6. Slow timers
    for (let i = 0; i < enemies.length; i++) {
      if (enemies[i].slow > 0) enemies[i].slow -= 1;
    }

    if (observer && observer.onTickEnd) {
      observer.onTickEnd(tick, wave, gold, baseHp, turrets, enemies);
    }
  }

  const json = JSON.stringify(log);
  let h = 0x811c9dc5;
  for (let i = 0; i < json.length; i++) {
    h ^= json.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  const hash = (h >>> 0).toString(16).padStart(8, "0");
  const score = Math.round(((endTick - 20) / 40) * 100) / 100;
  return { score: score, fallTick: fallTick, log: log, hash: hash };
}

<script>
(function () {
  "use strict";

  const DURATION = 100;

  const ENEMY_TYPES = ["grunt", "runner", "wisp", "brute", "splitter", "mender", "splitling"];
  const ENEMY_IDX = { grunt: 0, runner: 1, wisp: 2, brute: 3, splitter: 4, mender: 5, splitling: 6 };
  const TURRET_NAMES = ["bolt", "cannon", "frost", "lance", "flak"];

  function mulberry32Vis(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return (t ^ (t >>> 14)) >>> 0;
    };
  }

  // ------------------------------------------------------------------
  // 1. Precompute Seed 42 Replay via rampartSimulate
  // ------------------------------------------------------------------
  let boardSlots = null;
  let groundRoute = null;
  let airRoute = null;
  let simResult = null;

  const healEvents = [];
  const buildEvents = [];
  const leakEvents = [];

  const traumaEvents = [];

  for (let i = 0; i < 16; i++) turretAimNow[i] = 0;

  function countComp(comp) {
    const c = [0, 0, 0, 0, 0, 0];
    for (let i = 0; i < comp.length; i++) {
      const idx = ENEMY_IDX[comp[i]];
      if (idx >= 0 && idx < 6) c[idx]++;
    }
    return c;
  }

  function routeDir(route, progress) {
    const segs = route.segs;
    for (let i = 0; i < segs.length; i++) {
      const s = segs[i];
      if (progress <= s.end) return [s.sx, s.sy];
    }
    const last = segs[segs.length - 1];
    return [last.sx, last.sy];
  }

  function routePos(route, progress) {
    const segs = route.segs;
    for (let i = 0; i < segs.length; i++) {
      const s = segs[i];
      if (progress <= s.end) {
        const d = progress - s.start;
        return [s.x0 + s.sx * d, s.y0 + s.sy * d];
      }
    }
    const last = segs[segs.length - 1];
    return [last.x0 + last.sx * last.len, last.y0 + last.sy * last.len];
  }

  function snapshotTurrets(turrets) {
    const arr = new Array(16);
    for (let i = 0; i < 16; i++) {
      const t = turrets[i];
      if (t) {
        arr[i] = {
          typeIdx: TURRET_NAMES.indexOf(t.type),
          tier: t.tier,
          yaw: turretAimNow[i]
        };
      } else {
        arr[i] = null;
      }
    }
    return arr;
  }

  function snapshotEnemies(enemies) {
    const map = new Map();
    const list = new Array(enemies.length);
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      const dir = routeDir(e.route, e.progress);
      const rec = {
        id: e.id,
        typeIdx: ENEMY_IDX[e.type],
        x: e.x,
        y: e.y,
        progress: e.progress,
        air: e.air,
        hp: e.hp,
        maxHp: e.maxHp,
        slowed: e.slow > 0,
        dx: dir[0],
        dz: dir[1]
      };
      list[i] = rec;
      map.set(e.id, rec);
    }
    return { list: list, map: map };
  }

  const recorder = {
    onInit: function (wave1Comp, slots, gRoute, aRoute) {
      boardSlots = slots;
      groundRoute = gRoute;
      airRoute = aRoute;
      curPreviewCounts = countComp(wave1Comp);
    },
    onWaveStart: function (tick, wave, nextWaveComp) {
      curPreviewCounts = countComp(nextWaveComp);
      waveEvents.push({ tick: tick, wave: wave });
    },
    onTurretAction: function (tick, op, slot, typeIdx, tier) {
      if (op === "B") turretAimNow[slot] = 0;
      buildEvents.push({ tick: tick, op: op, slot: slot, typeIdx: typeIdx, tier: tier });
    },
    onShot: function (tick, slot, typeIdx, tier, sx, sy, tx, ty, air, splash, slow) {
      const yaw = Math.atan2(tx - sx, ty - sy);
      turretAimNow[slot] = yaw;
      shotEvents.push({
        tick: tick, slot: slot, typeIdx: typeIdx, tier: tier,
        sx: sx / 100, sy: sy / 100, tx: tx / 100, ty: ty / 100,
        air: air, splash: splash / 100, slow: slow
      });
    },
    onKill: function (tick, id, type, x, y, air) {
      killEvents.push({ tick: tick, id: id, typeIdx: ENEMY_IDX[type], x: x / 100, y: y / 100, air: air });
    },
    onSplit: function (tick, id, x, y) {
      splitEvents.push({ tick: tick, id: id, x: x / 100, y: y / 100 });
    },
    onHeal: function (tick, id, x, y) {
      healEvents.push({ tick: tick, id: id, x: x / 100, y: y / 100 });
    },
    onLeak: function (tick, id, type, air, baseHpAfter) {
      const clampedHp = Math.max(0, baseHpAfter);
      leakEvents.push({
        tick: tick, id: id, typeIdx: ENEMY_IDX[type], air: air,
        baseHpAfter: clampedHp
      });
      traumaEvents.push({ t: tick / TICKS_PER_SEC, amount: 0.3 });
    },
    onFall: function (tick, wave, gold, baseHp, turrets, survivingEnemies) {
      fallEvent = { tick: tick, wave: wave, time: tick / TICKS_PER_SEC };
      traumaEvents.push({ t: tick / TICKS_PER_SEC, amount: 1.0 });
      const snap = snapshotEnemies(survivingEnemies);
      tickSnapshots[tick] = {
        tick: tick,
        wave: wave,
        gold: gold,
        baseHp: 0,
        preview: curPreviewCounts.slice(),
        turrets: snapshotTurrets(turrets),
        enemies: snap.list,
        enemyMap: snap.map
      };
    },
    onTickEnd: function (tick, wave, gold, baseHp, turrets, enemies) {
      const snap = snapshotEnemies(enemies);
      tickSnapshots[tick] = {
        tick: tick,
        wave: wave,
        gold: gold,
        baseHp: Math.max(0, baseHp),
        preview: curPreviewCounts.slice(),
        turrets: snapshotTurrets(turrets),

      };

  const maxRecordedTick = tickSnapshots.length - 1;

  const chunkLeakTime = new Float32Array(10);

    for (let hpVal = prevHp - 1; hpVal >= newHp && hpVal >= 0; hpVal--) {
      const cIdx = 9 - hpVal;
      if (cIdx >= 0 && cIdx < 10 && chunkLeakTime[cIdx] > 1e8) {
        chunkLeakTime[cIdx] = leakEvents[i].tick / TICKS_PER_SEC;

  // ------------------------------------------------------------------
  // 2. Three.js Renderer, Scene & Dusk Lighting

  function makeTerrainTexture() {
    const c = document.createElement("canvas");

    ctx.fillStyle = "#1c222d";
    ctx.fillRect(0, 0, 512, 512);

  for (let i = 0; i < roadSegs.length; i++) {
    const s = roadSegs[i];
    const x0 = s.x0 / 100, z0 = s.y0 / 100;
    const x1 = (s.x0 + s.sx * s.len) / 100, z1 = (s.y0 + s.sy * s.len) / 100;
    const lenTiles = s.len / 100;
    const cx = (x0 + x1) * 0.5, cz = (z0 + z1) * 0.5;
    const horiz = Math.abs(s.sx) > 0;

    rTex.needsUpdate = true;
    rTex.repeat.set(horiz ? lenTiles * 0.65 : 0.65, horiz ? 0.65 : lenTiles * 0.65);
    const segMat = patchDesat(new THREE.MeshStandardMaterial({
      map: rTex, color: 0x9aa3b4, roughness: 0.86, metalness: 0.08
    }));
    const segMesh = new THREE.Mesh(new THREE.BoxGeometry(w, 0.05, d), segMat);
    segMesh.position.set(cx, 0.025, cz);

    scene.add(segMesh);

    const curbMesh = new THREE.Mesh(new THREE.BoxGeometry(w + 0.14, 0.03, d + 0.14), curbMat);
    curbMesh.position.set(cx, 0.015, cz);
    curbMesh.receiveShadow = true;
    scene.add(curbMesh);

    const steps = Math.round(lenTiles);
    for (let k = 0; k <= steps; k++) {
      const gx = Math.floor(x0 + s.sx * k);
      const gz = Math.floor(z0 + s.sy * k);

  }

  // Ground entry arch at (0.2, 0, 2.5)

  const archGroup = new THREE.Group();

  const pL = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.75, 0.18), archMat);
  pL.position.set(0, 0.375, -0.48); pL.castShadow = true;
  const pR = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.75, 0.18), archMat);
  pR.position.set(0, 0.375, 0.48); pR.castShadow = true;
  const lintel = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.18, 1.24), archMat);
  lintel.position.set(0, 0.80, 0); lintel.castShadow = true;
  const gateGlow = patchDesat(new THREE.MeshBasicMaterial({ color: 0xf59e0b, transparent: true, opacity: 0.4 }));
  const portalPlane = new THREE.Mesh(new THREE.PlaneGeometry(0.84, 0.68), gateGlow);

  // Air lane glowing ribbon at y = 0.76 along AIR_ROUTE
  const airRibbonMats = [];
  for (let i = 0; i < airRoute.segs.length; i++) {
    const s = airRoute.segs[i];
    const x0 = s.x0 / 100, z0 = s.y0 / 100;

  // 16 Build Pads
  const padStoneMat = patchDesat(new THREE.MeshStandardMaterial({ color: 0x384152, roughness: 0.78, metalness: 0.2 }));

  const padGeo = new THREE.CylinderGeometry(0.42, 0.47, 0.12, 8);
  const padRimGeo = new THREE.CylinderGeometry(0.36, 0.36, 0.135, 8);
  for (let i = 0; i < 16; i++) {

  tileBlocked[11 * 24 + 23] = 1;

  tileBlocked[10 * 24 + 23] = 1;
  tileBlocked[12 * 24 + 23] = 1;
  tileBlocked[6 * 24 + 0] = 1;

  // Instanced rough terrain boulders/crags
  const rockCoords = [];
  for (let gz = 0; gz < 14; gz++) {
    for (let gx = 0; gx < 24; gx++) {
      if (tileBlocked[gz * 24 + gx]) continue;
      if (visRand() < 0.24) {
        rockCoords.push({
          x: gx + 0.2 + visRand() * 0.6,
          z: gz + 0.2 + visRand() * 0.6,
          s: 0.08 + visRand() * 0.14,
          ry: visRand() * Math.PI * 2,
          tone: 0.8 + visRand() * 0.4
        });
      }
    }
  }
  const rockGeo = new THREE.DodecahedronGeometry(1, 0);
  const rockMat = patchDesat(new THREE.MeshStandardMaterial({ color: 0x333c4d, roughness: 0.92, metalness: 0.08 }));
  const rockInst = new THREE.InstancedMesh(rockGeo, rockMat, Math.max(1, rockCoords.length));
  rockInst.castShadow = true;
  rockInst.receiveShadow = true;
  rockInst.setColorAt(0, new THREE.Color(0xffffff));
  const dummy = new THREE.Object3D();
  for (let i = 0; i < rockCoords.length; i++) {
    const rc = rockCoords[i];
    dummy.position.set(rc.x, rc.s * 0.45, rc.z);
    dummy.rotation.set(visRand() * 0.4, rc.ry, visRand() * 0.4);
    dummy.scale.set(rc.s * 1.2, rc.s * 0.8, rc.s);
    dummy.updateMatrix();
    rockInst.setMatrixAt(i, dummy.matrix);
    rockInst.setColorAt(i, new THREE.Color(rc.tone, rc.tone, rc.tone));

  rockInst.instanceMatrix.needsUpdate = true;
  if (rockInst.instanceColor) rockInst.instanceColor.needsUpdate = true;

  // ------------------------------------------------------------------

  const fallRingMat = patchDesat(new THREE.MeshBasicMaterial({

  // ------------------------------------------------------------------
  // 6. Turret Meshes (16 slots, 5 silhouettes + 1..3 bright tier pips/rings)
  // ------------------------------------------------------------------
  const TURRET_COLORS = [
    0x3b82f6, // bolt: steel-blue
    0xd97706, // cannon: bronze
    0xe0f2fe, // frost: ice-white
    0xdc2626, // lance: crimson
    0x14b8a6  // flak: teal
  ];
  const DARK_METAL = patchDesat(new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.45, metalness: 0.7 }));
  const PIP_MAT_ON = patchDesat(new THREE.MeshBasicMaterial({ color: 0xfacc15 }));
  const TURRET_MATS = TURRET_COLORS.map(function (col, idx) {
    return patchDesat(new THREE.MeshStandardMaterial({
      color: col,
      roughness: idx === 1 ? 0.35 : 0.48,
      metalness: idx === 1 ? 0.72 : (idx === 2 ? 0.15 : 0.45),
      emissive: idx === 2 ? 0x38bdf8 : 0x000000,
      emissiveIntensity: idx === 2 ? 0.35 : 0
    }));
  });

  function buildTurretVisual(typeIdx, tier) {
    const root = new THREE.Group();
    const head = new THREE.Group();
    const mat = TURRET_MATS[typeIdx];
    const scale = tier === 1 ? 0.90 : (tier === 2 ? 1.02 : 1.14);

    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.34, 0.22, 8), DARK_METAL);
    base.position.y = 0.22; base.castShadow = true; base.receiveShadow = true;
    root.add(base);

    for (let p = 0; p < tier; p++) {
      const pip = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.08, 0.11), PIP_MAT_ON);
      const offset = (p - (tier - 1) * 0.5) * 0.17;
      pip.position.set(offset, 0.26, 0.30);
      root.add(pip);
    }
    const tierRing = new THREE.Mesh(
      new THREE.TorusGeometry(0.29, 0.025 + tier * 0.008, 6, 16),
      PIP_MAT_ON
    );
    tierRing.rotation.x = Math.PI * 0.5;
    tierRing.position.y = 0.14;
    root.add(tierRing);

    head.position.y = 0.36;
    head.scale.set(scale, scale, scale);

    if (typeIdx === 0) {
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.18, 0.36), mat);
      body.castShadow = true;
      const bow = new THREE.Mesh(new THREE.BoxGeometry(0.56, 0.07, 0.10), mat);
      bow.position.set(0, 0.04, 0.14); bow.castShadow = true;
      const rail = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.44), DARK_METAL);
      rail.position.set(0, 0.07, 0.18); rail.castShadow = true;
      head.add(body, bow, rail);
    } else if (typeIdx === 1) {
      const carriage = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.28, 0.22, 8), DARK_METAL);
      carriage.castShadow = true;
      const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.19, 0.48, 10), mat);
      barrel.rotation.x = Math.PI * 0.34;
      barrel.position.set(0, 0.14, 0.15); barrel.castShadow = true;
      const muzzle = new THREE.Mesh(new THREE.TorusGeometry(0.15, 0.04, 6, 12), mat);
      muzzle.rotation.x = Math.PI * 0.34;
      muzzle.position.set(0, 0.26, 0.34);
      head.add(carriage, barrel, muzzle);
    } else if (typeIdx === 2) {
      const spire = new THREE.Mesh(new THREE.OctahedronGeometry(0.24, 0), mat);
      spire.scale.set(0.85, 1.55, 0.85);
      spire.position.y = 0.28; spire.castShadow = true;
      const crown = new THREE.Mesh(new THREE.TorusGeometry(0.26, 0.03, 6, 6), patchDesat(new THREE.MeshBasicMaterial({ color: 0x38bdf8 })));
      crown.rotation.x = Math.PI * 0.5;
      crown.position.y = 0.18;
      head.add(spire, crown);
    } else if (typeIdx === 3) {
      const pylon = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.24, 0.42, 6), DARK_METAL);
      pylon.position.y = 0.16; pylon.castShadow = true;
      const housing = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.22, 0.40), mat);
      housing.position.set(0, 0.36, 0); housing.castShadow = true;
      const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.07, 0.72, 8), mat);
      barrel.rotation.x = Math.PI * 0.5;
      barrel.position.set(0, 0.38, 0.36); barrel.castShadow = true;
      head.add(pylon, housing, barrel);
    } else {
      const pod = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.20, 0.34), mat);
      pod.castShadow = true;
      const barGroup = new THREE.Group();
      barGroup.position.set(0, 0.12, 0.06);
      barGroup.rotation.x = -Math.PI * 0.26;
      for (let b = 0; b < 4; b++) {
        const bx = (b % 2 === 0 ? -0.10 : 0.10);
        const by = (b < 2 ? -0.07 : 0.07);
        const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.045, 0.42, 6), mat);
        bar.rotation.x = Math.PI * 0.5;
        bar.position.set(bx, by, 0.18); bar.castShadow = true;
        barGroup.add(bar);
      }
      head.add(pod, barGroup);
    }

    root.add(head);
    return { root: root, head: head };
  }

  const slotTurretHolders = new Array(16);
  const slotTurretCache = new Array(16);
  for (let i = 0; i < 16; i++) {
    const g = new THREE.Group();
    g.position.set(boardSlots[i][0] / 100, 0, boardSlots[i][1] / 100);
    scene.add(g);
    slotTurretHolders[i] = g;
    slotTurretCache[i] = {};
  }

  function setSlotTurretVisual(slot, tInfo, simTime) {
    const holder = slotTurretHolders[slot];
    const cache = slotTurretCache[slot];
    const key = tInfo ? (tInfo.typeIdx + "_" + tInfo.tier) : "none";
    for (const k in cache) {
      cache[k].root.visible = (k === key);
    }
    if (!tInfo) return;
    if (!cache[key]) {
      const built = buildTurretVisual(tInfo.typeIdx, tInfo.tier);
      holder.add(built.root);
      cache[key] = built;
    }
    const vis = cache[key];
    vis.root.visible = true;
    if (tInfo.typeIdx === 2) {
      vis.head.rotation.y = simTime * 1.4 + slot;
    } else {
      vis.head.rotation.y = tInfo.yaw;
    }
  }

  // ------------------------------------------------------------------
  // 7. Instanced Enemies (Distinct Silhouettes & Colors)
  // ------------------------------------------------------------------
  const MAX_ENEMIES = 220;
  const FROST_TINT = new THREE.Color(0x67d4ff);

  function createEnemyInst(geo, mat, castShadow, useColor) {
    const im = new THREE.InstancedMesh(geo, mat, MAX_ENEMIES);
    im.castShadow = !!castShadow;
    im.receiveShadow = false;
    im.frustumCulled = false;
    if (useColor !== false) {
      const white = new THREE.Color(0xffffff);
      for (let i = 0; i < MAX_ENEMIES; i++) im.setColorAt(i, white);
    }
    im.count = 0;
    scene.add(im);
    return im;
  }

  const gruntGeo = new THREE.BoxGeometry(0.36, 0.44, 0.36);
  const gruntInst = createEnemyInst(gruntGeo, patchDesat(new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.72 })), true, true);

  })), false, false);

  const brutePlateInst = createEnemyInst(brutePlateGeo, patchDesat(new THREE.MeshStandardMaterial({
    color: 0xffffff, emissive: 0x7c2d12, emissiveIntensity: 0.4, roughness: 0.45, metalness: 0.3
  })), true, true);
  const brutePlateCol = new THREE.Color(0xf97316);

  const splitterGeo = new THREE.DodecahedronGeometry(0.28, 0);
  const splitterInst = createEnemyInst(splitterGeo, patchDesat(new THREE.MeshStandardMaterial({
    color: 0xffffff, emissive: 0x4c1d95, emissiveIntensity: 0.45, roughness: 0.4
  })), true, true);
  const splitterCol = new THREE.Color(0xa855f7);

  const menderGeo = new THREE.CylinderGeometry(0.14, 0.22, 0.56, 6);
  const menderInst = createEnemyInst(menderGeo, patchDesat(new THREE.MeshStandardMaterial({
    color: 0xffffff, emissive: 0x166534, emissiveIntensity: 0.25, roughness: 0.4
  })), true, true);
  const menderCol = new THREE.Color(0xf1f5f9);
  const menderHaloGeo = new THREE.RingGeometry(0.26, 0.36, 16);
  menderHaloGeo.rotateX(-Math.PI * 0.5);
  const menderHaloInst = createEnemyInst(menderHaloGeo, patchDesat(new THREE.MeshBasicMaterial({
    color: 0xffffff, transparent: true, opacity: 0.85, side: THREE.DoubleSide
  })), false, true);
  const menderHaloCol = new THREE.Color(0x4ade80);

  const splitlingGeo = new THREE.TetrahedronGeometry(0.17, 0);

    color: 0xffffff, emissive: 0x581c87, emissiveIntensity: 0.35, roughness: 0.45

    color: 0xffffff
  })), false, true);

  // ------------------------------------------------------------------
  // 8. Instanced Combat Visuals & Debris (Deterministic Closed-Form)
  // ------------------------------------------------------------------
  const MAX_FX = 240;
  function createFxInst(geo, mat) {
    const im = new THREE.InstancedMesh(geo, mat, MAX_FX);
    im.frustumCulled = false;
    im.setColorAt(0, new THREE.Color(0xffffff));
    im.count = 0;
    scene.add(im);
    return im;
  }

  const beamGeo = new THREE.CylinderGeometry(1, 1, 1, 6, 1);
  const beamInst = createFxInst(beamGeo, patchDesat(new THREE.MeshBasicMaterial({
    color: 0xffffff, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false

  function makeDigitAtlas() {
    const c = document.createElement("canvas");

    ctx.font = "700 96px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (let d = 0; d < 10; d++) {

      ctx.strokeText(String(d), cx, 66);
      ctx.fillStyle = "#ffffff";
      ctx.fillText(String(d), cx, 66);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;

  }

  function updateHud(snap, simTime, w, h) {
    hudCam.left = 0;

    hudCam.updateProjectionMatrix();

    for (let i = 0; i < MAX_HUD_DIGITS; i++) hudDigitPool[i].visible = false;
