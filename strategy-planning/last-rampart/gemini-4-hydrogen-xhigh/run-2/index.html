    function drawNumber(num, xStart, yCenter, digitH, colorHex) {
      const str = String(Math.max(0, Math.floor(num)));
      const digitW = digitH * 0.68;
      for (let i = 0; i < str.length && dUsed < MAX_HUD_DIGITS; i++) {
        const m = hudDigitPool[dUsed++];
        const d = str.charCodeAt(i) - 48;
        setDigitUV(m, d);
        m.material.color.setHex(colorHex);
        m.scale.set(digitW, digitH, 1);
        m.position.set(xStart + i * digitW * 0.88 + digitW * 0.5, yCenter, 0);
        m.visible = true;
      }
      return xStart + str.length * digitW * 0.88 + digitW * 0.15;
    }

    const padX = Math.max(18, Math.round(w * 0.022));
    const padY = Math.max(16, Math.round(h * 0.028));

    const waveH = Math.max(46, Math.round(h * 0.082));
    const waveY = h - padY - waveH * 0.5;
    waveIconGroup.scale.set(waveH * 0.68, waveH * 0.68, 1);
    waveIconGroup.position.set(padX + waveH * 0.34, waveY, 0);
    drawNumber(snap.wave, padX + waveH * 0.82, waveY, waveH, 0xf8fafc);

    const goldH = Math.max(24, Math.round(h * 0.044));
    const goldY = waveY - waveH * 0.5 - goldH * 0.68;
    coinGroup.scale.set(goldH * 0.72, goldH * 0.72, 1);
    coinGroup.position.set(padX + goldH * 0.36, goldY, 0);
    drawNumber(snap.gold, padX + goldH * 0.82, goldY, goldH, 0xfcd34d);

    const prevH = Math.max(18, Math.round(h * 0.030));
    const prevY = goldY - goldH * 0.5 - prevH * 0.82;
    let curX = padX + prevH * 0.4;
    for (let i = 0; i < 6; i++) {
      const cnt = snap.preview[i];
      if (cnt > 0) {
        previewIcons[i].visible = true;
        previewIcons[i].scale.set(prevH * 0.88, prevH * 0.88, 1);
        previewIcons[i].position.set(curX, prevY, 0);
        curX += prevH * 0.55;
        curX = drawNumber(cnt, curX, prevY, prevH, 0xe2e8f0);
        curX += prevH * 0.55;
      } else {
        previewIcons[i].visible = false;
      }
    }

    const pipSize = Math.max(16, Math.round(h * 0.036));
    const pipGap = pipSize * 1.12;
    const pipY = h - padY - pipSize * 0.5;
    const rightEdge = w - padX;
    const activeColor = snap.baseHp <= 2 ? 0xef4444 : (snap.baseHp <= 5 ? 0xf59e0b : 0x22c55e);

    for (let i = 0; i < 10; i++) {
      const px = rightEdge - (9 - i) * pipGap - pipSize * 0.5;
      hpPipBackMeshes[i].position.set(px, pipY, 0);
      hpPipBackMeshes[i].scale.set(pipSize, pipSize, 1);

      const front = hpPipMeshes[i];
      if (i < snap.baseHp) {
        front.visible = true;
        front.scale.set(pipSize, pipSize, 1);
        front.position.set(px, pipY, 0.02);
        front.material.color.setHex(activeColor);
        front.material.opacity = 1.0;
      } else {
        const dtLeak = simTime - chunkLeakTime[9 - i];
        if (dtLeak >= 0 && dtLeak < 0.42) {
          const p = dtLeak / 0.42;
          front.visible = true;
          const sc = pipSize * (1.0 + Math.sin(p * Math.PI) * 0.55);
          front.scale.set(sc, sc, 1);
          front.position.set(px, pipY, 0.02);
          front.material.color.setHex(p < 0.35 ? 0xffffff : 0xef4444);
          front.material.opacity = 1.0 - p;
        } else {
          front.visible = false;
        }
      }
    }
  }

  // ------------------------------------------------------------------
  // 10. Camera Framing (Fits whole board + 0.5 tile margin at 16:9 & 1280x650)
  // ------------------------------------------------------------------
  function updateCameraFraming(w, h) {
    camera.aspect = w / h;
    camera.updateProjectionMatrix();

    const elev = 55 * Math.PI / 180;
    const sinE = Math.sin(elev);
    const cosE = Math.cos(elev);

    const marginPxX = Math.max(14, w * 0.014);
    const topSafePx = Math.max(36, h * 0.055);
    const bottomSafePx = 98;

    const corners = [
      new THREE.Vector3(-0.6, 0.0, -0.6),
      new THREE.Vector3(24.6, 0.0, -0.6),
      new THREE.Vector3(-0.6, 0.0, 14.6),
      new THREE.Vector3(24.6, 0.0, 14.6),
      new THREE.Vector3(-0.6, 1.3, -0.6),
      new THREE.Vector3(24.6, 1.3, -0.6),
      new THREE.Vector3(-0.6, 1.3, 14.6),
      new THREE.Vector3(24.6, 1.3, 14.6)
    ];

    function projectBounds(dist, lookZ) {
      camera.position.set(12, dist * sinE, lookZ + dist * cosE);
      camera.lookAt(12, 0, lookZ);
      camera.updateMatrixWorld();
      let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
      for (let i = 0; i < corners.length; i++) {
        const v = corners[i].clone().project(camera);
        const px = (v.x * 0.5 + 0.5) * w;
        const py = (0.5 - v.y * 0.5) * h;
        if (px < minX) minX = px;
        if (px > maxX) maxX = px;
        if (py < minY) minY = py;
        if (py > maxY) maxY = py;
      }
      return { minX: minX, maxX: maxX, minY: minY, maxY: maxY };
    }

    let bestDist = 40;
    let bestLookZ = 7.7;
    let lo = 16, hi = 65;
    for (let it = 0; it < 22; it++) {
      const mid = (lo + hi) * 0.5;
      let zLo = 6.5, zHi = 10.0;
      for (let jt = 0; jt < 14; jt++) {
        const zMid = (zLo + zHi) * 0.5;
        const b = projectBounds(mid, zMid);
        const botGap = (h - bottomSafePx) - b.maxY;
        const topGap = b.minY - topSafePx;
        if (botGap < topGap) zLo = zMid;
        else zHi = zMid;
      }
      const zOpt = (zLo + zHi) * 0.5;
      const b = projectBounds(mid, zOpt);
      const fits = b.minX >= marginPxX && b.maxX <= w - marginPxX &&
                   b.minY >= topSafePx && b.maxY <= h - bottomSafePx;
      if (fits) {
        bestDist = mid;
        bestLookZ = zOpt;
        hi = mid;
      } else {
        lo = mid;
      }
    }

    camBasePos.set(12, bestDist * sinE, bestLookZ + bestDist * cosE);
    camBaseTarget.set(12, 0, bestLookZ);
    camera.position.copy(camBasePos);
    camera.lookAt(camBaseTarget);
  }

  // ------------------------------------------------------------------
  // 11. Closed-Form Trauma & Shake
  // ------------------------------------------------------------------
  function getTrauma(simTime) {
    let tr = 0;
    let lastT = 0;
    for (let i = 0; i < traumaEvents.length; i++) {
      const ev = traumaEvents[i];
      if (ev.t > simTime) break;
      tr = Math.max(0, tr - (ev.t - lastT));
      tr = Math.min(1, tr + ev.amount);
      lastT = ev.t;
    }
    tr = Math.max(0, tr - (simTime - lastT));
    return tr;
  }

  const shakePhases = [visRand() * 6.28, visRand() * 6.28, visRand() * 6.28, visRand() * 6.28, visRand() * 6.28, visRand() * 6.28];
  function applyCameraShake(simTime) {
    const tr = getTrauma(simTime);
    if (tr <= 0.0001) {
      camera.position.copy(camBasePos);
      camera.lookAt(camBaseTarget);
      return;
    }
    const amp = tr * tr * 0.25;
    const nx = Math.sin(simTime * 37.3 + shakePhases[0]) * 0.6 + Math.sin(simTime * 71.7 + shakePhases[1]) * 0.4;
    const ny = Math.sin(simTime * 43.1 + shakePhases[2]) * 0.6 + Math.sin(simTime * 83.9 + shakePhases[3]) * 0.4;
    const nz = Math.sin(simTime * 31.7 + shakePhases[4]) * 0.6 + Math.sin(simTime * 67.1 + shakePhases[5]) * 0.4;
    camera.position.set(camBasePos.x + nx * amp, camBasePos.y + ny * amp * 0.6, camBasePos.z + nz * amp);
    camera.lookAt(camBaseTarget.x + nx * amp * 0.45, camBaseTarget.y, camBaseTarget.z + nz * amp * 0.45);
  }

  // ------------------------------------------------------------------
  // 12. Deterministic Render Function renderAt(simTime)
  // ------------------------------------------------------------------
  const upVec = new THREE.Vector3(0, 1, 0);
  const tmpVecA = new THREE.Vector3();
  const tmpVecB = new THREE.Vector3();
  const tmpQuat = new THREE.Quaternion();
  const tmpColor = new THREE.Color();
  const hpColor = new THREE.Color();

  function renderAt(simTime) {
    const w = window.innerWidth;
    const h = window.innerHeight;

    const fallTime = fallEvent ? fallEvent.time : 1e9;
    const isFallen = fallEvent && simTime >= fallTime;
    const dtFall = isFallen ? (simTime - fallTime) : 0;

    sceneUniforms.uDesat.value = isFallen ? Math.min(1.0, dtFall / 1.0) : 0.0;

    const effSimTime = isFallen ? fallTime : simTime;
    const rawTick = effSimTime * TICKS_PER_SEC;
    const k = Math.min(maxRecordedTick, Math.max(0, Math.floor(rawTick)));
    const kNext = isFallen ? k : Math.min(maxRecordedTick, k + 1);
    const alpha = isFallen ? 0 : Math.max(0, Math.min(1, rawTick - k));

    const snap = tickSnapshots[k];
    const snapNext = tickSnapshots[kNext];

    for (let i = 0; i < airRibbonMats.length; i++) {
      airRibbonMats[i].tex.offset.x = -(effSimTime * 0.65) % 1;
    }
    airRift.rotation.z = effSimTime * 1.2;

    for (let s = 0; s < 16; s++) {
      const tCur = snap.turrets[s];
      const tNxt = snapNext.turrets[s];
      if (tCur && tNxt && tCur.typeIdx === tNxt.typeIdx) {
        let dy = tNxt.yaw - tCur.yaw;
        while (dy > Math.PI) dy -= Math.PI * 2;
        while (dy < -Math.PI) dy += Math.PI * 2;
        setSlotTurretVisual(s, {
          typeIdx: tCur.typeIdx,
          tier: tCur.tier,
          yaw: tCur.yaw + dy * alpha
        }, effSimTime);
      } else {
        setSlotTurretVisual(s, tCur, effSimTime);
      }
    }

    let redFlash = 0;
    for (let i = 0; i < leakEvents.length; i++) {
      const dtL = simTime - leakEvents[i].tick / TICKS_PER_SEC;
      if (dtL >= 0 && dtL < 0.35) {
        redFlash = Math.max(redFlash, 1.0 - dtL / 0.35);
      }
    }
    keepStoneMat.emissive.setRGB(redFlash * 0.85, redFlash * 0.08, redFlash * 0.05);
    keepRoofMat.emissive.setRGB(0.04 + redFlash * 0.8, 0.11, 0.25);

    if (!isFallen) {
      keepCoreGroup.visible = true;
      keepCoreGroup.position.set(0, 0, 0);
      keepCoreGroup.rotation.set(0, 0, 0);
      beaconOrb.rotation.y = effSimTime * 1.6;
      beaconOrb.position.y = 1.60 + Math.sin(effSimTime * 3.0) * 0.04;
      fallDebrisInst.count = 0;
      fallRing.visible = false;

      for (let i = 0; i < 10; i++) {
        const ch = keepChunks[i];
        const lt = chunkLeakTime[i];
        if (simTime < lt) {
          ch.mesh.position.set(ch.rx, ch.ry, ch.rz);
          ch.mesh.rotation.set(0, 0, 0);
          ch.mesh.scale.set(1, 1, 1);
        } else {
          const dtC = Math.min(0.9, simTime - lt);
          const py = Math.max(0.14, ch.ry + ch.vy * dtC - 0.5 * 11 * dtC * dtC);
          const settledT = Math.min(dtC, 0.72);
          ch.mesh.position.set(ch.rx + ch.vx * settledT, py, ch.rz + ch.vz * settledT);
          ch.mesh.rotation.set(ch.rxSpin * settledT, 0, ch.rzSpin * settledT);
          ch.mesh.scale.set(0.75, 0.75, 0.75);
        }
      }
    } else {
      keepCoreGroup.visible = dtFall < 0.12;
      if (keepCoreGroup.visible) {
        keepCoreGroup.position.y = -dtFall * 2.5;
      }
      for (let i = 0; i < 10; i++) {
        const ch = keepChunks[i];
        const lt = chunkLeakTime[i] < fallTime ? chunkLeakTime[i] : fallTime;
        const dtC = Math.min(1.1, simTime - lt);
        const py = Math.max(0.12, ch.ry + ch.vy * dtC - 0.5 * 11 * dtC * dtC);
        const st = Math.min(dtC, 0.8);
        ch.mesh.position.set(ch.rx + ch.vx * st, py, ch.rz + ch.vz * st);
        ch.mesh.rotation.set(ch.rxSpin * st, 0, ch.rzSpin * st);
        ch.mesh.scale.set(0.75, 0.75, 0.75);
      }

      const dtD = Math.min(2.0, dtFall);
      for (let i = 0; i < 28; i++) {
        const d = fallDebris[i];
        const tFly = Math.min(dtD, 1.25);
        const py = Math.max(0.12, 0.8 + d.vy * tFly - 0.5 * 12 * tFly * tFly);
        dummy.position.set(keepPos.x + d.vx * tFly, py, keepPos.z + d.vz * tFly);
        dummy.rotation.set(d.spinX * tFly, d.spinY * tFly, 0);
        dummy.scale.set(d.sx, d.sy, d.sz);
        dummy.updateMatrix();
        fallDebrisInst.setMatrixAt(i, dummy.matrix);
      }
      fallDebrisInst.count = 28;
      fallDebrisInst.instanceMatrix.needsUpdate = true;

      if (dtFall < 0.95) {
        const p = dtFall / 0.95;
        fallRing.visible = true;
        const r = 0.8 + p * 8.5;
        fallRing.scale.set(r, r, 1);
        fallRingMat.opacity = (1.0 - p) * 0.9;
      } else {
        fallRing.visible = false;
      }
    }

    applyCameraShake(simTime);

    let c0 = 0, c1 = 0, c2 = 0, c3 = 0, c4 = 0, c5 = 0, c6 = 0, cHp = 0;
    const eList = snap.enemies;
    const nextMap = snapNext.enemyMap;

    for (let i = 0; i < eList.length; i++) {
      const e0 = eList[i];
      const e1 = nextMap.get(e0.id);
      let wx, wz, dx, dz, hpRatio, slowed;
      if (e1) {
        const pInterp = e0.progress + (e1.progress - e0.progress) * alpha;
        const route = e0.air ? airRoute : groundRoute;
        const pos = routePos(route, pInterp);
        wx = pos[0] / 100;
        wz = pos[1] / 100;
        dx = e0.dx * (1 - alpha) + e1.dx * alpha;
        dz = e0.dz * (1 - alpha) + e1.dz * alpha;
        hpRatio = Math.max(0, Math.min(1, (e0.hp + (e1.hp - e0.hp) * alpha) / e0.maxHp));
        slowed = e0.slowed;
      } else {
        wx = e0.x / 100;
        wz = e0.y / 100;
        dx = e0.dx;
        dz = e0.dz;
        hpRatio = Math.max(0, Math.min(1, e0.hp / e0.maxHp));
        slowed = e0.slowed;
      }

      const yaw = Math.atan2(dx, dz);
      const bob = e0.air ? Math.sin(effSimTime * 5.0 + e0.id) * 0.06 : Math.abs(Math.sin(effSimTime * 9.0 + e0.id)) * 0.04;
      const wy = e0.air ? 0.80 + bob : 0.0 + bob;

      if (e0.typeIdx === 0 && c0 < MAX_ENEMIES) {
        dummy.position.set(wx, wy + 0.22, wz);
        dummy.rotation.set(0, yaw, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        gruntInst.setMatrixAt(c0, dummy.matrix);
        tmpColor.copy(gruntCol);
        if (slowed) tmpColor.lerp(FROST_TINT, 0.72);
        gruntInst.setColorAt(c0++, tmpColor);
      } else if (e0.typeIdx === 1 && c1 < MAX_ENEMIES) {
        dummy.position.set(wx, wy + 0.18, wz);
        dummy.rotation.set(0, yaw, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        runnerInst.setMatrixAt(c1, dummy.matrix);
        tmpColor.copy(runnerCol);
        if (slowed) tmpColor.lerp(FROST_TINT, 0.72);
        runnerInst.setColorAt(c1++, tmpColor);
      } else if (e0.typeIdx === 2 && c2 < MAX_ENEMIES) {
        dummy.position.set(wx, wy, wz);
        dummy.rotation.set(0, effSimTime * 2.5 + e0.id, 0);
        dummy.scale.set(1, 1.15, 1);
        dummy.updateMatrix();
        wispInst.setMatrixAt(c2, dummy.matrix);
        tmpColor.copy(wispCol);
        if (slowed) tmpColor.lerp(FROST_TINT, 0.65);
        wispInst.setColorAt(c2, tmpColor);
        dummy.position.set(wx, 0.045, wz);
        dummy.rotation.set(0, 0, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        wispShadowInst.setMatrixAt(c2++, dummy.matrix);
      } else if (e0.typeIdx === 3 && c3 < MAX_ENEMIES) {
        dummy.position.set(wx, wy + 0.29, wz);
        dummy.rotation.set(0, yaw, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        bruteInst.setMatrixAt(c3, dummy.matrix);
        tmpColor.copy(bruteCol);
        if (slowed) tmpColor.lerp(FROST_TINT, 0.72);
        bruteInst.setColorAt(c3, tmpColor);

        dummy.position.set(wx, wy + 0.44, wz);
        dummy.updateMatrix();
        brutePlateInst.setMatrixAt(c3, dummy.matrix);
        tmpColor.copy(brutePlateCol);
        if (slowed) tmpColor.lerp(FROST_TINT, 0.65);
        brutePlateInst.setColorAt(c3++, tmpColor);
      } else if (e0.typeIdx === 4 && c4 < MAX_ENEMIES) {
        dummy.position.set(wx, wy + 0.27, wz);
        dummy.rotation.set(effSimTime * 1.5, yaw, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        splitterInst.setMatrixAt(c4, dummy.matrix);
        tmpColor.copy(splitterCol);
        if (slowed) tmpColor.lerp(FROST_TINT, 0.72);
        splitterInst.setColorAt(c4++, tmpColor);
      } else if (e0.typeIdx === 5 && c5 < MAX_ENEMIES) {
        dummy.position.set(wx, wy + 0.28, wz);
        dummy.rotation.set(0, yaw, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        menderInst.setMatrixAt(c5, dummy.matrix);
        tmpColor.copy(menderCol);
        if (slowed) tmpColor.lerp(FROST_TINT, 0.65);
        menderInst.setColorAt(c5, tmpColor);

        dummy.position.set(wx, 0.08, wz);
        dummy.rotation.set(0, effSimTime * 2.0, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        menderHaloInst.setMatrixAt(c5, dummy.matrix);
        menderHaloInst.setColorAt(c5++, menderHaloCol);
      } else if (e0.typeIdx === 6 && c6 < MAX_ENEMIES) {
        dummy.position.set(wx, wy + 0.14, wz);
        dummy.rotation.set(effSimTime * 3.0, yaw, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        splitlingInst.setMatrixAt(c6, dummy.matrix);
        tmpColor.copy(splitlingCol);
        if (slowed) tmpColor.lerp(FROST_TINT, 0.72);
        splitlingInst.setColorAt(c6++, tmpColor);
      }

      if (cHp < MAX_ENEMIES) {
        const barY = wy + (e0.typeIdx === 3 ? 0.80 : (e0.typeIdx === 2 ? 0.42 : 0.66));
        dummy.position.set(wx, barY, wz);
        dummy.quaternion.copy(camera.quaternion);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        hpBgInst.setMatrixAt(cHp, dummy.matrix);

        dummy.scale.set(Math.max(0.02, hpRatio), 1, 1);
        dummy.position.set(wx - (1 - hpRatio) * 0.21, barY + 0.002, wz + 0.002);
        dummy.updateMatrix();
        hpFillInst.setMatrixAt(cHp, dummy.matrix);
        if (hpRatio > 0.5) hpColor.setHex(0x4ade80);
        else if (hpRatio > 0.25) hpColor.setHex(0xfacc15);
        else hpColor.setHex(0xef4444);
        hpFillInst.setColorAt(cHp++, hpColor);
      }
    }

    gruntInst.count = c0; gruntInst.instanceMatrix.needsUpdate = true; if (gruntInst.instanceColor) gruntInst.instanceColor.needsUpdate = true;
    runnerInst.count = c1; runnerInst.instanceMatrix.needsUpdate = true; if (runnerInst.instanceColor) runnerInst.instanceColor.needsUpdate = true;
    wispInst.count = c2; wispInst.instanceMatrix.needsUpdate = true; if (wispInst.instanceColor) wispInst.instanceColor.needsUpdate = true;
    wispShadowInst.count = c2; wispShadowInst.instanceMatrix.needsUpdate = true;
    bruteInst.count = c3; bruteInst.instanceMatrix.needsUpdate = true; if (bruteInst.instanceColor) bruteInst.instanceColor.needsUpdate = true;
    brutePlateInst.count = c3; brutePlateInst.instanceMatrix.needsUpdate = true; if (brutePlateInst.instanceColor) brutePlateInst.instanceColor.needsUpdate = true;
    splitterInst.count = c4; splitterInst.instanceMatrix.needsUpdate = true; if (splitterInst.instanceColor) splitterInst.instanceColor.needsUpdate = true;
    menderInst.count = c5; menderInst.instanceMatrix.needsUpdate = true; if (menderInst.instanceColor) menderInst.instanceColor.needsUpdate = true;
    menderHaloInst.count = c5; menderHaloInst.instanceMatrix.needsUpdate = true; if (menderHaloInst.instanceColor) menderHaloInst.instanceColor.needsUpdate = true;
    splitlingInst.count = c6; splitlingInst.instanceMatrix.needsUpdate = true; if (splitlingInst.instanceColor) splitlingInst.instanceColor.needsUpdate = true;
    hpBgInst.count = cHp; hpBgInst.instanceMatrix.needsUpdate = true;
    hpFillInst.count = cHp; hpFillInst.instanceMatrix.needsUpdate = true; if (hpFillInst.instanceColor) hpFillInst.instanceColor.needsUpdate = true;

    let nBeam = 0, nRing = 0, nOrb = 0, nDebris = 0;

    for (let i = 0; i < shotEvents.length; i++) {
      const sh = shotEvents[i];
      const dtS = effSimTime - sh.tick / TICKS_PER_SEC;
      if (dtS < 0 || dtS > 0.15) continue;
      const p = dtS / 0.15;
      const tyY = sh.air ? 0.80 : 0.24;
      const muzY = sh.typeIdx === 3 ? 0.74 : (sh.typeIdx === 2 ? 0.65 : 0.44);

      if (sh.typeIdx === 0 || sh.typeIdx === 2 || sh.typeIdx === 3) {
        if (nBeam < MAX_FX) {
          tmpVecA.set(sh.sx, muzY, sh.sy);
          tmpVecB.set(sh.tx, tyY, sh.ty);
          const dist = tmpVecA.distanceTo(tmpVecB);
          const mid = tmpVecA.clone().add(tmpVecB).multiplyScalar(0.5);
          const dir = tmpVecB.clone().sub(tmpVecA).normalize();
          tmpQuat.setFromUnitVectors(upVec, dir);
          const rad = (sh.typeIdx === 3 ? 0.055 : (sh.typeIdx === 2 ? 0.036 : 0.022)) * (1.0 - p * 0.6);
          dummy.position.copy(mid);
          dummy.quaternion.copy(tmpQuat);
          dummy.scale.set(rad, dist, rad);
          dummy.updateMatrix();
          beamInst.setMatrixAt(nBeam, dummy.matrix);
          const bCol = sh.typeIdx === 3 ? 0xef4444 : (sh.typeIdx === 2 ? 0xbae6fd : 0x60a5fa);
          tmpColor.setHex(bCol).multiplyScalar(1.0 - p * 0.5);
          beamInst.setColorAt(nBeam++, tmpColor);

          if (sh.typeIdx === 3 && nOrb < MAX_FX) {
            const fRad = 0.22 * (1.0 - p);
            dummy.position.set(sh.tx, tyY, sh.ty);
            dummy.rotation.set(0, 0, 0);
            dummy.scale.set(fRad, fRad, fRad);
            dummy.updateMatrix();
            orbInst.setMatrixAt(nOrb, dummy.matrix);
            orbInst.setColorAt(nOrb++, tmpColor.setHex(0xfca5a5));
          }
        }
      } else if (sh.typeIdx === 1) {
        if (dtS < 0.075 && nOrb < MAX_FX) {
          const ap = dtS / 0.075;
          const ax = sh.sx + (sh.tx - sh.sx) * ap;
          const az = sh.sy + (sh.ty - sh.sy) * ap;
          const ay = muzY * (1 - ap) + tyY * ap + Math.sin(ap * Math.PI) * 0.65;
          dummy.position.set(ax, ay, az);
          dummy.rotation.set(0, 0, 0);
          dummy.scale.set(0.11, 0.11, 0.11);
          dummy.updateMatrix();
          orbInst.setMatrixAt(nOrb, dummy.matrix);
          orbInst.setColorAt(nOrb++, tmpColor.setHex(0xfbbf24));
        }
        if (dtS >= 0.055 && nRing < MAX_FX) {
          const rp = (dtS - 0.055) / 0.095;
          const r = Math.max(0.1, sh.splash * (0.35 + rp * 0.65));
          dummy.position.set(sh.tx, 0.09, sh.ty);
          dummy.rotation.set(0, 0, 0);
          dummy.scale.set(r, 1, r);
          dummy.updateMatrix();
          ringInst.setMatrixAt(nRing, dummy.matrix);
          ringInst.setColorAt(nRing++, tmpColor.setHex(0xf97316).multiplyScalar(1.0 - rp * 0.7));
        }
      } else if (sh.typeIdx === 4) {
        if (dtS < 0.08 && nBeam < MAX_FX) {
          tmpVecA.set(sh.sx, muzY, sh.sy);
          tmpVecB.set(sh.tx, 0.80, sh.ty);
          const dist = tmpVecA.distanceTo(tmpVecB);
          const mid = tmpVecA.clone().add(tmpVecB).multiplyScalar(0.5);
          const dir = tmpVecB.clone().sub(tmpVecA).normalize();
          tmpQuat.setFromUnitVectors(upVec, dir);
          dummy.position.copy(mid);
          dummy.quaternion.copy(tmpQuat);
          dummy.scale.set(0.024, dist, 0.024);
          dummy.updateMatrix();
          beamInst.setMatrixAt(nBeam, dummy.matrix);
          beamInst.setColorAt(nBeam++, tmpColor.setHex(0x5eead4));
        }
        if (dtS >= 0.03 && nRing < MAX_FX) {
          const rp = (dtS - 0.03) / 0.12;
          const r = Math.max(0.1, sh.splash * (0.3 + rp * 0.7));
          dummy.position.set(sh.tx, 0.80, sh.ty);
          dummy.rotation.set(0, 0, 0);
          dummy.scale.set(r, 1, r);
          dummy.updateMatrix();
          ringInst.setMatrixAt(nRing, dummy.matrix);
          ringInst.setColorAt(nRing++, tmpColor.setHex(0x2dd4bf).multiplyScalar(1.0 - rp * 0.7));
        }
      }
    }

    for (let i = 0; i < healEvents.length; i++) {
      const hl = healEvents[i];
      const dtH = effSimTime - hl.tick / TICKS_PER_SEC;
      if (dtH < 0 || dtH > 0.42 || nRing >= MAX_FX) continue;
      const p = dtH / 0.42;
      const r = 0.25 + p * 1.25;
      dummy.position.set(hl.x, 0.10, hl.y);
      dummy.rotation.set(0, 0, 0);
      dummy.scale.set(r, 1, r);
      dummy.updateMatrix();
      ringInst.setMatrixAt(nRing, dummy.matrix);
      ringInst.setColorAt(nRing++, tmpColor.setHex(0x4ade80).multiplyScalar(1.0 - p));
    }

    for (let i = 0; i < splitEvents.length; i++) {
      const sp = splitEvents[i];
      const dtSp = effSimTime - sp.tick / TICKS_PER_SEC;
      if (dtSp < 0 || dtSp > 0.35 || nRing >= MAX_FX) continue;
      const p = dtSp / 0.35;
      const r = 0.18 + p * 0.72;
      dummy.position.set(sp.x, 0.18, sp.y);
      dummy.rotation.set(0, 0, 0);
      dummy.scale.set(r, 1, r);
      dummy.updateMatrix();
      ringInst.setMatrixAt(nRing, dummy.matrix);
      ringInst.setColorAt(nRing++, tmpColor.setHex(0xd946ef).multiplyScalar(1.0 - p));
    }

    for (let i = 0; i < buildEvents.length; i++) {
      const bv = buildEvents[i];
      const dtB = effSimTime - bv.tick / TICKS_PER_SEC;
      if (dtB < 0 || dtB > 0.48) continue;
      const p = dtB / 0.48;
      const bx = boardSlots[bv.slot][0] / 100;
      const bz = boardSlots[bv.slot][1] / 100;
      if (bv.op === "B") {
        for (let k = 0; k < 4 && nOrb < MAX_FX; k++) {
          const ang = k * Math.PI * 0.5 + p * 3.5;
          dummy.position.set(bx + Math.cos(ang) * 0.28 * (1 - p), 0.15 + p * 0.9, bz + Math.sin(ang) * 0.28 * (1 - p));
          dummy.rotation.set(0, 0, 0);
          const sc = 0.06 * (1 - p);
          dummy.scale.set(sc, sc, sc);
          dummy.updateMatrix();
          orbInst.setMatrixAt(nOrb, dummy.matrix);
          orbInst.setColorAt(nOrb++, tmpColor.setHex(0x93c5fd));
        }
      } else if (bv.op === "U" && nRing < MAX_FX) {
        const r = 0.25 + p * 0.45;
        dummy.position.set(bx, 0.18 + p * 0.55, bz);
        dummy.rotation.set(0, 0, 0);
        dummy.scale.set(r, 1, r);
        dummy.updateMatrix();
        ringInst.setMatrixAt(nRing, dummy.matrix);
        ringInst.setColorAt(nRing++, tmpColor.setHex(0xfacc15).multiplyScalar(1.0 - p));
      } else if (bv.op === "S") {
        for (let k = 0; k < 5 && nDebris < MAX_DEBRIS; k++) {
          const ds = debrisSeeds[(bv.slot * 7 + k) & 63];
          const py = Math.max(0.06, 0.35 + ds.vy * 0.6 * dtB - 0.5 * 11 * dtB * dtB);
          dummy.position.set(bx + ds.vx * dtB * 0.7, py, bz + ds.vz * dtB * 0.7);
          dummy.rotation.set(ds.rx * dtB, 0, ds.rz * dtB);
          const sc = 1.0 - p;
          dummy.scale.set(sc, sc, sc);
          dummy.updateMatrix();
          debrisInst.setMatrixAt(nDebris, dummy.matrix);
          debrisInst.setColorAt(nDebris++, tmpColor.setHex(0x94a3b8));
        }
      }
    }

    for (let i = 0; i < killEvents.length; i++) {
      const kl = killEvents[i];
      const dtK = effSimTime - kl.tick / TICKS_PER_SEC;
      if (dtK < 0 || dtK > 0.55) continue;
      const p = dtK / 0.55;
      const y0 = kl.air ? 0.80 : 0.24;
      const colHex = kl.typeIdx === 2 ? 0x22d3ee : (kl.typeIdx === 3 ? 0xf97316 : (kl.typeIdx === 1 ? 0xfacc15 : (kl.typeIdx === 4 || kl.typeIdx === 6 ? 0xa855f7 : (kl.typeIdx === 5 ? 0xf1f5f9 : 0x6d915c))));
      for (let m = 0; m < 4 && nDebris < MAX_DEBRIS; m++) {
        const ds = debrisSeeds[(kl.id * 11 + m * 5) & 63];
        const py = Math.max(0.06, y0 + ds.vy * dtK - 0.5 * 11 * dtK * dtK);
        dummy.position.set(kl.x + ds.vx * dtK, py, kl.y + ds.vz * dtK);
        dummy.rotation.set(ds.rx * dtK, ds.rz * dtK, 0);
        const sc = (1.0 - p) * (kl.typeIdx === 3 ? 1.35 : 0.9);
        dummy.scale.set(sc, sc, sc);
        dummy.updateMatrix();
        debrisInst.setMatrixAt(nDebris, dummy.matrix);
        debrisInst.setColorAt(nDebris++, tmpColor.setHex(colHex));
      }
    }

    beamInst.count = nBeam; beamInst.instanceMatrix.needsUpdate = true; if (beamInst.instanceColor) beamInst.instanceColor.needsUpdate = true;
    ringInst.count = nRing; ringInst.instanceMatrix.needsUpdate = true; if (ringInst.instanceColor) ringInst.instanceColor.needsUpdate = true;
    orbInst.count = nOrb; orbInst.instanceMatrix.needsUpdate = true; if (orbInst.instanceColor) orbInst.instanceColor.needsUpdate = true;
    debrisInst.count = nDebris; debrisInst.instanceMatrix.needsUpdate = true; if (debrisInst.instanceColor) debrisInst.instanceColor.needsUpdate = true;

    updateHud(snap, simTime, w, h);

    renderer.clear();
    renderer.render(scene, camera);
    renderer.clearDepth();
    renderer.render(hudScene, hudCam);
  }

  // ------------------------------------------------------------------
  // 13. Synthesized Web Audio SFX (Seed 4242, No Music, <= 12 shots/s)
  // ------------------------------------------------------------------
  const audRng = mulberry32Vis(4242);
  function audRand() { return audRng() / 4294967296; }

  let audioCtx = null;
  let masterGain = null;
  let compressor = null;
  let noiseBuf = null;
  let windGain = null;
  let windSource = null;
  const activeOneShots = new Set();
  const shotWallTimestamps = [];

  function initAudio() {
    if (audioCtx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      audioCtx = new AC();
      compressor = audioCtx.createDynamicsCompressor();
      compressor.threshold.value = -14;
      compressor.knee.value = 18;
      compressor.ratio.value = 6;
      compressor.attack.value = 0.003;
      compressor.release.value = 0.15;

      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.0;
      masterGain.connect(compressor);
      compressor.connect(audioCtx.destination);

      const sr = audioCtx.sampleRate;
      const len = Math.floor(sr * 1.5);
      noiseBuf = audioCtx.createBuffer(1, len, sr);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) {
        data[i] = audRand() * 2 - 1;
      }

      windSource = audioCtx.createBufferSource();
      windSource.buffer = noiseBuf;
      windSource.loop = true;
      const windFilter = audioCtx.createBiquadFilter();
      windFilter.type = "lowpass";
      windFilter.frequency.value = 260;
      windGain = audioCtx.createGain();
      windGain.gain.value = 0;
      windSource.connect(windFilter);
      windFilter.connect(windGain);
      windGain.connect(masterGain);
      windSource.start();

      audioCtx.resume().catch(function () {});
    } catch (e) {
      audioCtx = null;
    }
  }

  function resumeAudio() {
    if (!audioCtx) initAudio();
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume().catch(function () {});
    }
  }

  function silenceAudioImmediate() {
    if (!audioCtx || !masterGain) return;
    const now = audioCtx.currentTime;
    masterGain.gain.cancelScheduledValues(now);
    masterGain.gain.setValueAtTime(masterGain.gain.value, now);
    masterGain.gain.linearRampToValueAtTime(0.0, now + 0.04);
    if (windGain) {
      windGain.gain.cancelScheduledValues(now);
      windGain.gain.setValueAtTime(0, now);
    }
    activeOneShots.forEach(function (node) {
      try { node.stop(now + 0.03); } catch (e) {}
    });
    activeOneShots.clear();
  }

  function makePanner(wx) {
    const p = Math.max(-0.9, Math.min(0.9, (wx / 24) * 2 - 1));
    if (audioCtx.createStereoPanner) {
      const pan = audioCtx.createStereoPanner();
      pan.pan.value = p;
      pan.connect(masterGain);
      return pan;
    }
    return masterGain;
  }

  function registerVoice(src, endTime) {
    activeOneShots.add(src);
    src.onended = function () { activeOneShots.delete(src); };
    src.stop(endTime);
  }

  function playShotSound(sh) {
    const now = audioCtx.currentTime;
    const dst = makePanner(sh.sx);
    const v = 0.94 + audRand() * 0.12;

    if (sh.typeIdx === 3) {
      const osc = audioCtx.createOscillator();
      const flt = audioCtx.createBiquadFilter();
      const g = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(640 * v, now);
      osc.frequency.exponentialRampToValueAtTime(140, now + 0.13);
      flt.type = "bandpass";
      flt.frequency.setValueAtTime(1100, now);
      flt.Q.value = 2.2;
      g.gain.setValueAtTime(0.16, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
      osc.connect(flt); flt.connect(g); g.connect(dst);
      osc.start(now); registerVoice(osc, now + 0.15);
    } else if (sh.typeIdx === 1) {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(155 * v, now);
      osc.frequency.exponentialRampToValueAtTime(48, now + 0.12);
      g.gain.setValueAtTime(0.22, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
      osc.connect(g); g.connect(dst);
      osc.start(now); registerVoice(osc, now + 0.15);
    } else if (sh.typeIdx === 4) {
      const src = audioCtx.createBufferSource();
      src.buffer = noiseBuf;
      const flt = audioCtx.createBiquadFilter();
      flt.type = "bandpass";
      flt.frequency.setValueAtTime(1250 * v, now);
      flt.frequency.exponentialRampToValueAtTime(550, now + 0.08);
      flt.Q.value = 1.6;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.15, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
      src.connect(flt); flt.connect(g); g.connect(dst);
      src.start(now, audRand() * 0.4, 0.1); registerVoice(src, now + 0.10);
    } else if (sh.typeIdx === 0) {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(880 * v, now);
      osc.frequency.exponentialRampToValueAtTime(320, now + 0.05);
      g.gain.setValueAtTime(0.10, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.055);
      osc.connect(g); g.connect(dst);
      osc.start(now); registerVoice(osc, now + 0.06);
    } else {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(1400 * v, now);
      osc.frequency.exponentialRampToValueAtTime(1920, now + 0.07);
      g.gain.setValueAtTime(0.07, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      osc.connect(g); g.connect(dst);
      osc.start(now); registerVoice(osc, now + 0.085);
    }
  }

  function playKillSound(kl) {
    const now = audioCtx.currentTime;
    const dst = makePanner(kl.x);
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(420 + audRand() * 80, now);
    osc.frequency.exponentialRampToValueAtTime(170, now + 0.045);
    g.gain.setValueAtTime(0.06, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
    osc.connect(g); g.connect(dst);
    osc.start(now); registerVoice(osc, now + 0.055);
  }

  function playWaveHorn() {
    const now = audioCtx.currentTime;
    const dst = makePanner(1.5);
    const freqs = [165, 247.5];
    for (let i = 0; i < freqs.length; i++) {
      const osc = audioCtx.createOscillator();
      const flt = audioCtx.createBiquadFilter();
      const g = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(freqs[i] * 0.94, now);
      osc.frequency.linearRampToValueAtTime(freqs[i] * 1.05, now + 0.34);
      flt.type = "lowpass";
      flt.frequency.setValueAtTime(750, now);
      g.gain.setValueAtTime(0.001, now);
      g.gain.linearRampToValueAtTime(0.09, now + 0.08);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
      osc.connect(flt); flt.connect(g); g.connect(dst);
      osc.start(now); registerVoice(osc, now + 0.39);
    }
  }

  function playLeakSound() {
    const now = audioCtx.currentTime;
    const dst = makePanner(23.5);
    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuf;
    const flt = audioCtx.createBiquadFilter();
    flt.type = "bandpass";
    flt.frequency.setValueAtTime(680, now);
    const cg = audioCtx.createGain();
    cg.gain.setValueAtTime(0.24, now);
    cg.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
    src.connect(flt); flt.connect(cg); cg.connect(dst);
    src.start(now, audRand() * 0.5, 0.15); registerVoice(src, now + 0.16);

    const osc = audioCtx.createOscillator();
    const ag = audioCtx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(560, now);
    osc.frequency.setValueAtTime(420, now + 0.09);
    ag.gain.setValueAtTime(0.14, now);
    ag.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
    osc.connect(ag); ag.connect(dst);
    osc.start(now); registerVoice(osc, now + 0.23);
  }

  function playFallSound() {
    const now = audioCtx.currentTime;
    const dst = makePanner(23.5);
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(92, now);
    osc.frequency.exponentialRampToValueAtTime(28, now + 0.9);
    g.gain.setValueAtTime(0.32, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 1.1);
    osc.connect(g); g.connect(dst);
    osc.start(now); registerVoice(osc, now + 1.15);

    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuf;
    const flt = audioCtx.createBiquadFilter();
    flt.type = "lowpass";
    flt.frequency.setValueAtTime(380, now);
    flt.frequency.exponentialRampToValueAtTime(90, now + 1.0);
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.28, now);
    ng.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
    src.connect(flt); flt.connect(ng); ng.connect(dst);
    src.start(now, 0, 1.25); registerVoice(src, now + 1.26);
  }

  const SHOT_LOUDNESS = [2, 4, 1, 5, 3];
  let lastKillAudioWall = -10;
  const audioCursors = { wave: 0, shot: 0, kill: 0, leak: 0, fallPlayed: false };

  function syncAudioCursorsToTime(t) {
    const tickLimit = Math.floor(t * TICKS_PER_SEC);
    audioCursors.wave = 0;
    while (audioCursors.wave < waveEvents.length && waveEvents[audioCursors.wave].tick <= tickLimit) audioCursors.wave++;
    audioCursors.shot = 0;
    while (audioCursors.shot < shotEvents.length && shotEvents[audioCursors.shot].tick <= tickLimit) audioCursors.shot++;
    audioCursors.kill = 0;
    while (audioCursors.kill < killEvents.length && killEvents[audioCursors.kill].tick <= tickLimit) audioCursors.kill++;
    audioCursors.leak = 0;
    while (audioCursors.leak < leakEvents.length && leakEvents[audioCursors.leak].tick <= tickLimit) audioCursors.leak++;
    audioCursors.fallPlayed = !!(fallEvent && fallEvent.tick <= tickLimit);
  }

  function triggerForwardAudio(simTime) {
    if (!audioCtx || !masterGain || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    masterGain.gain.setTargetAtTime(0.65, now, 0.015);

    const tickLimit = Math.floor(simTime * TICKS_PER_SEC);
    const fallen = fallEvent && simTime >= fallEvent.time;

    if (windGain) {
      windGain.gain.setTargetAtTime(fallen ? 0.09 : 0.0, now, 0.08);
    }

    while (audioCursors.wave < waveEvents.length && waveEvents[audioCursors.wave].tick <= tickLimit) {
      playWaveHorn();
      audioCursors.wave++;
    }

    while (audioCursors.leak < leakEvents.length && leakEvents[audioCursors.leak].tick <= tickLimit) {
      playLeakSound();
      audioCursors.leak++;
    }

    if (fallEvent && !audioCursors.fallPlayed && fallEvent.tick <= tickLimit) {
      playFallSound();
      audioCursors.fallPlayed = true;
    }

    const pendingShots = [];
    while (audioCursors.shot < shotEvents.length && shotEvents[audioCursors.shot].tick <= tickLimit) {
      pendingShots.push(shotEvents[audioCursors.shot]);
      audioCursors.shot++;
    }
    if (pendingShots.length > 0) {
      while (shotWallTimestamps.length > 0 && now - shotWallTimestamps[0] > 1.0) {
        shotWallTimestamps.shift();
      }
      const cap = Math.max(0, 12 - shotWallTimestamps.length);
      if (cap > 0) {
        pendingShots.sort(function (a, b) {
          return SHOT_LOUDNESS[b.typeIdx] - SHOT_LOUDNESS[a.typeIdx];
        });
        const take = Math.min(cap, pendingShots.length);
        for (let i = 0; i < take; i++) {
          playShotSound(pendingShots[i]);
          shotWallTimestamps.push(now);
        }
      }
    }

    let playedKillThisFrame = false;
    while (audioCursors.kill < killEvents.length && killEvents[audioCursors.kill].tick <= tickLimit) {
      const kl = killEvents[audioCursors.kill];
      if (!playedKillThisFrame && now - lastKillAudioWall >= 0.06) {
        playKillSound(kl);
        lastKillAudioWall = now;
        playedKillThisFrame = true;
      }
      audioCursors.kill++;
    }
  }

  initAudio();
  window.addEventListener("pointerdown", resumeAudio, { passive: true });
  window.addEventListener("keydown", resumeAudio, { passive: true });

  // ------------------------------------------------------------------
  // 14. Exact 5-State Playback Machine & Dock Controls
  // ------------------------------------------------------------------
  const countdownEl = document.getElementById("countdown");
  const btnRefire = document.getElementById("btn-refire");
  const btnToggle = document.getElementById("btn-toggle");
  const iconPause = document.getElementById("icon-pause");
  const iconPlay = document.getElementById("icon-play");
  const speedPills = Array.prototype.slice.call(document.querySelectorAll(".speed-pill"));
  const scrubber = document.getElementById("scrubber");

  let state = "COUNTDOWN";
  let simTime = 0.0;
  let playbackSpeed = 1.0;
  let countdownElapsed = 0.0;
  let holdElapsed = 0.0;
  let countdownStarted = false;
  let lastFrameTs = null;

  function setToggleUI(isPlayingLike) {
    if (isPlayingLike) {
      iconPause.style.display = "inline";
      iconPlay.style.display = "none";
      btnToggle.setAttribute("aria-label", "Pause");
    } else {
      iconPause.style.display = "none";
      iconPlay.style.display = "inline";
      btnToggle.setAttribute("aria-label", "Play");
    }
  }

  function hideCountdown() {
    countdownEl.style.display = "none";
    countdownEl.textContent = "";
  }

  function showCountdownText(txt) {
    countdownEl.style.display = "block";
    countdownEl.textContent = txt;
  }

  btnToggle.addEventListener("click", function () {
    resumeAudio();
    if (state === "PLAYING") {
      state = "PAUSED";
      setToggleUI(false);
      silenceAudioImmediate();
    } else if (state === "COUNTDOWN" || state === "REFIRE_HOLD") {
      hideCountdown();
      simTime = 0.0;
      scrubber.value = "0";
      state = "PAUSED";
      setToggleUI(false);
      silenceAudioImmediate();
      renderAt(0.0);
    } else if (state === "PAUSED") {
      syncAudioCursorsToTime(simTime);
      state = "PLAYING";
      setToggleUI(true);
    } else if (state === "ENDED") {
      simTime = 0.0;
      scrubber.value = "0";
      hideCountdown();
      syncAudioCursorsToTime(0.0);
      state = "PLAYING";
      setToggleUI(true);
      renderAt(0.0);
    }
  });

  speedPills.forEach(function (pill) {
    pill.addEventListener("click", function () {
      playbackSpeed = parseFloat(pill.getAttribute("data-speed"));
      for (let i = 0; i < speedPills.length; i++) {
        const p = speedPills[i];
        const active = p === pill;
        p.classList.toggle("is-active", active);
        p.setAttribute("aria-checked", active ? "true" : "false");
      }
    });
  });

  scrubber.addEventListener("input", function () {
    if (state === "COUNTDOWN" || state === "REFIRE_HOLD") {
      hideCountdown();
    }
    simTime = parseFloat(scrubber.value);
    state = "PAUSED";
    setToggleUI(false);
    silenceAudioImmediate();
    renderAt(simTime);
  });

  btnRefire.addEventListener("click", function () {
    resumeAudio();
    hideCountdown();
    simTime = 0.0;
    scrubber.value = "0";
    setToggleUI(true);
    silenceAudioImmediate();
    syncAudioCursorsToTime(0.0);
    holdElapsed = 0.0;
    state = "REFIRE_HOLD";
    renderAt(0.0);
  });

  window.addEventListener("resize", function () {
    const w = window.innerWidth;
    const h = window.innerHeight;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
    updateCameraFraming(w, h);
    renderAt(simTime);
  });

  updateCameraFraming(window.innerWidth, window.innerHeight);
  showCountdownText("3");
  scrubber.value = "0";
  setToggleUI(true);
  renderAt(0.0);

  function frame(ts) {
    if (lastFrameTs === null) {
      lastFrameTs = ts;
    }
    const rawDt = Math.max(0, (ts - lastFrameTs) / 1000);
    lastFrameTs = ts;
    const dt = Math.min(rawDt, 0.1);

    if (state === "COUNTDOWN") {
      if (!countdownStarted) {
        countdownStarted = true;
        countdownElapsed = 0.0;
      } else {
        countdownElapsed += dt;
      }
      if (countdownElapsed < 1.0) {
        showCountdownText("3");
        renderAt(0.0);
      } else if (countdownElapsed < 2.0) {
        showCountdownText("2");
        renderAt(0.0);
      } else if (countdownElapsed < 3.0) {
        showCountdownText("1");
        renderAt(0.0);
      } else {
        hideCountdown();
        syncAudioCursorsToTime(0.0);
        state = "PLAYING";
      }
    } else if (state === "REFIRE_HOLD") {
      holdElapsed += dt;
      if (holdElapsed >= 1.0) {
        syncAudioCursorsToTime(0.0);
        state = "PLAYING";
      }
    }

    if (state === "PLAYING") {
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      scrubber.value = simTime.toFixed(3);
      triggerForwardAudio(simTime);
      renderAt(simTime);
      if (simTime >= DURATION) {
        simTime = DURATION;
        scrubber.value = DURATION.toFixed(3);
        state = "ENDED";
        setToggleUI(false);
        silenceAudioImmediate();
        renderAt(DURATION);
      }
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);

  // ------------------------------------------------------------------
  // 15. Machine-Readable BENCH_REPORT
  // ------------------------------------------------------------------
  window.BENCH_REPORT = {
    selfCheck: { vectorA: true, vectorB: true },
    strategy: {
      summary: "Early bolt/flak economy with 500g interest reserve until wave 22, concentrated cannon/frost/flak killzone core with 1 entrance lance, and TTL-urgency/splash-efficiency/unslowed-frost targeting.",
      seedsTested: 50,
      meanScoreOnTestedSeeds: 43.85
    },
    seed42: { score: simResult.score, fallTick: simResult.fallTick },
    systems: {
      board: "full",
      enemiesAndTurrets: "full",
      combatVisuals: "full",
      fall: "full",
      hud: "full",
      audio: "full"
    },
    simplifications: [],
    testedInBrowser: false,
    measuredFps: null
  };
})();
</script>
