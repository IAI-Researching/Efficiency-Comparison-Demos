<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Last Rampart</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;

  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

  position: fixed;
  bottom: 24px;

  border-radius: 9999px;

  -webkit-appearance: none;
}

  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;

  justify-content: center;

  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;

  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);

<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script id="rampart-strategy">
function createStrategy() {
  const COST = { bolt: 50, cannon: 90, frost: 70, lance: 120, flak: 80 };
  const DMG = { bolt: 26, cannon: 60, frost: 10, lance: 180, flak: 40 };
  const SPLASH = { bolt: 0, cannon: 90, frost: 0, lance: 0, flak: 70 };

  const LAYOUT = [
    "flak", "cannon", "flak", "cannon",
    "cannon", "cannon", "cannon", "cannon",
    "cannon", "cannon", "cannon", "frost",
    "flak", "bolt", "bolt", "frost"
  ];
  const BUILD_ORDER = [3, 12, 1, 13, 9, 8, 4, 11, 5, 0, 6, 7, 10, 2, 15, 14];
  const UPG2_ORDER  = [12, 5, 14, 3, 8, 11, 9, 0, 13, 2, 10, 4, 6, 1, 7, 15];
  const UPG3_ORDER  = [5, 3, 8, 11, 14, 4, 6, 7, 10, 0, 2, 9, 12, 15, 13, 1];
  const CORE_BUILD_COUNT = 5;
  const LATE_SWAPS = [
    { wave: 40, slot: 13, type: "cannon" },
    { wave: 42, slot: 14, type: "cannon" }
  ];

  function effectiveDmg(type, tier) {
    let d = DMG[type];
    if (tier >= 2) d = Math.floor(d * 16 / 10);
    if (tier >= 3) d = Math.floor(d * 16 / 10);
    return d;
  }

  return {
    plan(state) {
      const actions = [];
      let gold = state.gold;
      const slots = state.slots;
      let blocked = false;

      for (let k = 0; k < CORE_BUILD_COUNT; k++) {
        const slIdx = BUILD_ORDER[k];
        const tp = LAYOUT[slIdx];
        if (!slots[slIdx].turret) {
          if (gold >= COST[tp]) {
            actions.push({ op: "build", slot: slIdx, type: tp });
            gold -= COST[tp];
          } else {
            blocked = true;
            break;
          }
        }
      }

      if (!blocked) {
        for (let k = 0; k < 16; k++) {
          const slIdx = UPG2_ORDER[k];
          const t = slots[slIdx].turret;
          if (t && t.type === LAYOUT[slIdx] && t.tier === 1 && t.type !== "frost") {
            const c = COST[t.type];
            if (gold >= c) {
              actions.push({ op: "upgrade", slot: slIdx });
              gold -= c;
            } else {
              blocked = true;
              break;
            }
          }
        }
      }

      if (!blocked) {
        for (let k = 0; k < 16; k++) {
          const slIdx = BUILD_ORDER[k];
          const tp = LAYOUT[slIdx];
          if (!slots[slIdx].turret) {
            if (gold >= COST[tp]) {
              actions.push({ op: "build", slot: slIdx, type: tp });
              gold -= COST[tp];
            } else {
              blocked = true;
              break;
            }
          }
        }
      }

      if (!blocked) {
        for (let k = 0; k < 16; k++) {
          const slIdx = UPG3_ORDER[k];
          const t = slots[slIdx].turret;
          if (t && t.type === LAYOUT[slIdx] && t.tier === 2 && t.type !== "frost") {
            const c = 2 * COST[t.type];
            if (gold >= c) {
              actions.push({ op: "upgrade", slot: slIdx });
              gold -= c;
            } else {
              blocked = true;
              break;
            }
          }
        }
      }

      if (!blocked) {
        const frostSlots = [11, 15];
        for (let i = 0; i < frostSlots.length; i++) {
          const slIdx = frostSlots[i];
          const t = slots[slIdx].turret;
          if (t && t.tier < 3) {
            const c = COST[t.type] * (t.tier === 1 ? 1 : 2);
            if (gold >= c) {
              actions.push({ op: "upgrade", slot: slIdx });
              gold -= c;
            } else {
              blocked = true;
              break;
            }
          }
        }
      }

      if (!blocked) {
        for (let i = 0; i < LATE_SWAPS.length; i++) {
          const sw = LATE_SWAPS[i];
          if (state.wave < sw.wave) continue;
          const t = slots[sw.slot].turret;
          if (t && t.type !== sw.type) {
            const refund = Math.floor(t.spent * 70 / 100);
            if (gold + refund >= COST[sw.type] * 4) {
              actions.push({ op: "sell", slot: sw.slot });
              actions.push({ op: "build", slot: sw.slot, type: sw.type });
              actions.push({ op: "upgrade", slot: sw.slot });
              actions.push({ op: "upgrade", slot: sw.slot });
              gold = gold + refund - COST[sw.type] * 4;
            }
          }
        }
      }

      return actions;
    },

    target(turret, candidates) {
      if (!candidates || candidates.length === 0) return null;

      if (turret.type === "frost") {
        let bestId = candidates[0].id;
        let bestScore = -1e18;
        for (let i = 0; i < candidates.length; i++) {
          const e = candidates[i];
          let sc = (!e.slowed ? 1e7 : 0) + e.speed * 500 - e.remaining;
          if (e.air) sc += 50000;
          if (sc > bestScore) {
            bestScore = sc;
            bestId = e.id;
          }
        }
        return bestId;
      }

      const dmg = effectiveDmg(turret.type, turret.tier);

      if (turret.type === "cannon" || turret.type === "flak") {
        const r = SPLASH[turret.type];
        const sr2 = r * r;
        let bestId = candidates[0].id;
        let bestScore = -1e18;
        for (let i = 0; i < candidates.length; i++) {
          const c = candidates[i];
          let tot = 0;
          let urg = 0;
          let kills = 0;
          for (let j = 0; j < candidates.length; j++) {
            const o = candidates[j];
            const dx = o.x - c.x;
            const dy = o.y - c.y;
            if (dx * dx + dy * dy <= sr2) {
              const d = Math.max(1, dmg - o.armor);
              let eff = Math.min(o.hp, d);
              if (o.type === "mender") eff *= 4;
              tot += eff;
              if (o.hp <= d) kills += 1;
              if (o.remaining < 300) urg += (300 - o.remaining) * 24;
            }
          }
          const sc = tot * 100 + urg * 50 + kills * 200 - c.remaining * 0.5;
          if (sc > bestScore) {
            bestScore = sc;
            bestId = c.id;
          }
        }
        return bestId;
      }

      if (turret.type === "lance") {
        let bestId = candidates[0].id;
        let bestScore = -1e18;
        for (let i = 0; i < candidates.length; i++) {
          const e = candidates[i];
          if (e.remaining <= e.speed * 5 && e.hp <= dmg) return e.id;
          const eff = Math.min(e.hp, dmg);
          let sc = eff * 100 - e.remaining * 0.5;
          if (e.type === "brute") sc += eff * 80;
          if (e.type === "mender") sc += eff * 120;
          if (e.hp < dmg * 0.3 && e.remaining > 600) sc -= 40000;
          if (sc > bestScore) {
            bestScore = sc;
            bestId = e.id;
          }
        }
        return bestId;
      }

      let bestId = candidates[0].id;
      let bestScore = -1e18;
      for (let i = 0; i < candidates.length; i++) {
        const e = candidates[i];
        const d = Math.max(1, dmg - e.armor);
        if (e.hp <= d && e.remaining < 600) return e.id;
        let sc = -e.remaining * 2;
        if (e.hp <= d) sc += 1500;
        if (e.type === "splitling" || e.type === "runner") sc += 1000;
        if (e.type === "mender") sc += 1200;
        if (e.armor >= dmg) sc -= 5000;
        if (sc > bestScore) {
          bestScore = sc;
          bestId = e.id;
        }
      }
      return bestId;
    }
  };
}
</script>

<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks) {
  const observer = arguments.length >= 4 ? arguments[3] : null;

  const GROUND_PTS = [
    [50, 250], [650, 250], [650, 1050], [1250, 1050],
    [1250, 350], [1850, 350], [1850, 1150], [2350, 1150]
  ];
  const AIR_PTS = [
    [50, 650], [2150, 650], [2150, 1150], [2350, 1150]
  ];

  function buildRoute(pts) {
    const segs = [];
    let total = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const x0 = pts[i][0], y0 = pts[i][1];
      const x1 = pts[i + 1][0], y1 = pts[i + 1][1];
      const dx = x1 - x0, dy = y1 - y0;
      const len = Math.abs(dx) + Math.abs(dy);
      const sx = dx === 0 ? 0 : (dx > 0 ? 1 : -1);
      const sy = dy === 0 ? 0 : (dy > 0 ? 1 : -1);
      segs.push({ x0, y0, sx, sy, start: total, end: total + len, len });
      total += len;
    }
    return { segs, length: total };
  }

  const GROUND_ROUTE = buildRoute(GROUND_PTS);
  const AIR_ROUTE = buildRoute(AIR_PTS);

  function routePos(route, progress) {
    const segs = route.segs;
    for (let i = 0; i < segs.length; i++) {
      const s = segs[i];
      if (progress <= s.end || i === segs.length - 1) {
        const d = progress - s.start;
        return [s.x0 + s.sx * d, s.y0 + s.sy * d, s.sx, s.sy];
      }
    }
    const last = segs[segs.length - 1];
    return [last.x0 + last.sx * last.len, last.y0 + last.sy * last.len, last.sx, last.sy];
  }

  const SLOT_COORDS = [
    [3, 3], [5, 5], [7, 4], [7, 8], [9, 9], [10, 5], [11, 8], [13, 8],
    [14, 5], [15, 2], [16, 7], [17, 4], [19, 8], [20, 10], [22, 9], [3, 7]
  ];

  const TURRET_TYPES = {
    bolt:   { idx: 0, cost: 50,  dmg: 26,  period: 8,  range: 300, splash: 0,  slow: 0,  pierce: false, ground: true,  air: true },
    cannon: { idx: 1, cost: 90,  dmg: 60,  period: 24, range: 260, splash: 90, slow: 0,  pierce: false, ground: true,  air: false },
    frost:  { idx: 2, cost: 70,  dmg: 10,  period: 12, range: 240, splash: 0,  slow: 30, pierce: false, ground: true,  air: true },
    lance:  { idx: 3, cost: 120, dmg: 180, period: 36, range: 360, splash: 0,  slow: 0,  pierce: true,  ground: true,  air: false },
    flak:   { idx: 4, cost: 80,  dmg: 40,  period: 10, range: 320, splash: 70, slow: 0,  pierce: false, ground: false, air: true }
  };

  const ENEMY_ORDER = ["grunt", "runner", "wisp", "brute", "splitter", "mender"];
  const ENEMY_DEFS = {
    grunt:     { idx: 0, baseHp: 60,  speed: 10, bounty: 4, leak: 1, air: 0, firstWave: 1, weight: 10 },
    runner:    { idx: 1, baseHp: 40,  speed: 20, bounty: 4, leak: 1, air: 0, firstWave: 2, weight: 4 },
    wisp:      { idx: 2, baseHp: 50,  speed: 12, bounty: 6, leak: 2, air: 1, firstWave: 3, weight: 3 },
    brute:     { idx: 3, baseHp: 150, speed: 6,  bounty: 9, leak: 3, air: 0, firstWave: 4, weight: 3 },
    splitter:  { idx: 4, baseHp: 90,  speed: 8,  bounty: 6, leak: 2, air: 0, firstWave: 6, weight: 2 },
    mender:    { idx: 5, baseHp: 70,  speed: 8,  bounty: 7, leak: 2, air: 0, firstWave: 8, weight: 1 },
    splitling: { idx: 6, baseHp: 1,   speed: 12, bounty: 1, leak: 1, air: 0, firstWave: 999999, weight: 0 }
  };

  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return (t ^ (t >>> 14)) >>> 0;
    };
  }

  const rng = mulberry32(seed | 0);
  const multCache = [0, 1000];
  function getMult(w) {
    while (multCache.length <= w) {
      multCache.push(Math.floor(multCache[multCache.length - 1] * 108 / 100));
    }
    return multCache[w];
  }

  function enemyArmor(type, w) {
    if (type === "grunt") return Math.floor(w / 4);
    if (type === "brute") return 6 + w;
    return 0;
  }

  function generateWave(w) {
    const count = 4 + Math.floor(3 * w / 5);
    const avail = [];
    let totalWeight = 0;
    for (let i = 0; i < ENEMY_ORDER.length; i++) {
      const name = ENEMY_ORDER[i];
      const def = ENEMY_DEFS[name];
      if (def.firstWave <= w) {
        avail.push([name, def.weight]);
        totalWeight += def.weight;
      }
    }
    const list = [];
    for (let i = 0; i < count; i++) {
      let r = rng() % totalWeight;
      let chosen = avail[avail.length - 1][0];
      for (let j = 0; j < avail.length; j++) {
        if (r < avail[j][1]) {
          chosen = avail[j][0];
          break;
        }
        r -= avail[j][1];
      }
      list.push(chosen);
    }
    return list;
  }

  const slots = SLOT_COORDS.map((c, idx) => ({
    slot: idx,
    x: c[0] * 100 + 50,
    y: c[1] * 100 + 50,
    turret: null
  }));

  function turretDamage(type, tier) {
    let d = TURRET_TYPES[type].dmg;
    if (tier >= 2) d = Math.floor(d * 16 / 10);
    if (tier >= 3) d = Math.floor(d * 16 / 10);
    return d;
  }

  function turretRange(type, tier) {
    return TURRET_TYPES[type].range + (tier - 1) * 30;
  }

  const strategy = createStrategy();
  let gold = 250;
  let baseHp = 10;
  let currentWave = 0;
  let nextEnemyId = 1;
  let enemies = [];
  const spawnQueue = [];
  const log = [];
  let fallTick = -1;
  let endTick = maxTicks;

  const waveComp = [null];
  waveComp[1] = generateWave(1);

  function makeEnemyView(e) {
    const route = e.air ? AIR_ROUTE : GROUND_ROUTE;
    return {
      id: e.id,
      type: e.type,
      hp: e.hp,
      maxHp: e.maxHp,
      x: e.x,
      y: e.y,
      air: e.air,
      armor: e.armor,
      speed: e.speed,
      slowed: e.slow > 0,
      remaining: route.length - e.progress
    };
  }

  function spawnEnemy(type, wave, progress) {
    const def = ENEMY_DEFS[type];
    const mult = getMult(wave);
    const maxHp = Math.floor(def.baseHp * mult / 1000);
    const air = def.air;
    const route = air ? AIR_ROUTE : GROUND_ROUTE;
    const pos = routePos(route, progress);
    const e = {
      id: nextEnemyId++,
      type: type,
      typeIdx: def.idx,
      wave: wave,
      hp: maxHp,
      maxHp: maxHp,
      progress: progress,
      x: pos[0],
      y: pos[1],
      dx: pos[2],
      dy: pos[3],
      air: air,
      armor: enemyArmor(type, wave),
      speed: def.speed,
      bounty: def.bounty,
      leak: def.leak,
      slow: 0,
      age: 0
    };
    enemies.push(e);
    return e;
  }

  for (let tick = 0; tick < maxTicks; tick++) {
    const tickEvents = observer ? {
      waveStarted: false,
      builds: [],
      shots: [],
      kills: [],
      heals: [],
      leaks: [],
      fell: false
    } : null;

    if (tick >= 20 && (tick - 20) % 40 === 0) {
      currentWave = 1 + (tick - 20) / 40;
      const interest = Math.min(50, Math.floor(gold * 5 / 100));
      gold += interest + 10 + 2 * currentWave;

      if (!waveComp[currentWave + 1]) {
        waveComp[currentWave + 1] = generateWave(currentWave + 1);
      }
      if (tickEvents) tickEvents.waveStarted = true;

      const state = {
        tick: tick,
        wave: currentWave,
        gold: gold,
        baseHp: baseHp,
        slots: slots.map(sl => ({
          slot: sl.slot,
          x: sl.x,
          y: sl.y,
          turret: sl.turret ? { type: sl.turret.type, tier: sl.turret.tier, spent: sl.turret.spent } : null
        })),
        enemies: enemies.map(makeEnemyView),
        nextWave: waveComp[currentWave + 1].slice()
      };

      const actions = strategy.plan(state);
      if (Array.isArray(actions)) {
        const limit = Math.min(32, actions.length);
        for (let i = 0; i < limit; i++) {
          const act = actions[i];
          if (!act || typeof act !== "object") continue;
          const slIdx = act.slot;
          if (!Number.isInteger(slIdx) || slIdx < 0 || slIdx >= 16) continue;
          const sl = slots[slIdx];
          if (act.op === "build") {
            const def = TURRET_TYPES[act.type];
            if (!def || sl.turret !== null || gold < def.cost) continue;
            gold -= def.cost;
            sl.turret = {
              type: act.type,
              tier: 1,
              spent: def.cost,
              cooldown: 0,
              dmg: turretDamage(act.type, 1),
              range: turretRange(act.type, 1)
            };
            log.push([tick, "B", slIdx, def.idx]);
            if (tickEvents) tickEvents.builds.push({ slot: slIdx, kind: 0, typeIdx: def.idx });
          } else if (act.op === "upgrade") {
            if (!sl.turret || sl.turret.tier >= 3) continue;
            const def = TURRET_TYPES[sl.turret.type];
            const cost = sl.turret.tier === 1 ? def.cost : 2 * def.cost;
            if (gold < cost) continue;
            gold -= cost;
            sl.turret.tier += 1;
            sl.turret.spent += cost;
            sl.turret.dmg = turretDamage(sl.turret.type, sl.turret.tier);
            sl.turret.range = turretRange(sl.turret.type, sl.turret.tier);
            log.push([tick, "U", slIdx, sl.turret.tier]);
            if (tickEvents) tickEvents.builds.push({ slot: slIdx, kind: 1, typeIdx: def.idx });
          } else if (act.op === "sell") {
            if (!sl.turret) continue;
            const def = TURRET_TYPES[sl.turret.type];
            gold += Math.floor(sl.turret.spent * 70 / 100);
            sl.turret = null;
            log.push([tick, "S", slIdx, 0]);
            if (tickEvents) tickEvents.builds.push({ slot: slIdx, kind: 2, typeIdx: def.idx });
          }
        }
      }

      const comp = waveComp[currentWave];
      for (let i = 0; i < comp.length; i++) {
        spawnQueue.push({
          tick: tick + 4 * i,
          wave: currentWave,
          idx: i,
          type: comp[i]
        });
      }
      spawnQueue.sort((a, b) => (a.tick - b.tick) || (a.wave - b.wave) || (a.idx - b.idx));
    }

    while (spawnQueue.length > 0 && spawnQueue[0].tick === tick) {
      const item = spawnQueue.shift();
      spawnEnemy(item.type, item.wave, 0);
    }

    const survivingAfterMove = [];
    let fell = false;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      const step = e.slow > 0 ? Math.floor(e.speed * 60 / 100) : e.speed;
      e.progress += step;
      const route = e.air ? AIR_ROUTE : GROUND_ROUTE;
      if (e.progress >= route.length) {
        baseHp -= e.leak;
        log.push([tick, "L", e.id, baseHp]);
        if (tickEvents) tickEvents.leaks.push({ id: e.id, hpAfter: baseHp });
        if (baseHp <= 0) {
          log.push([tick, "F", currentWave, 0]);
          fallTick = tick;
          endTick = tick;
          fell = true;
          if (tickEvents) tickEvents.fell = true;
          break;
        }
      } else {
        const pos = routePos(route, e.progress);
        e.x = pos[0];
        e.y = pos[1];
        e.dx = pos[2];
        e.dy = pos[3];
        survivingAfterMove.push(e);
      }
    }
    if (fell) {
      if (observer) {
        observer(tick, currentWave, gold, baseHp, waveComp[currentWave + 1] || waveComp[1], slots, enemies, tickEvents);
      }
      break;
    }
    enemies = survivingAfterMove;

    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      e.age += 1;
      if (e.type === "mender" && e.age % 20 === 0) {
        if (tickEvents) tickEvents.heals.push({ x: e.x, y: e.y });
        for (let j = 0; j < enemies.length; j++) {
          const other = enemies[j];
          const dx = other.x - e.x;
          const dy = other.y - e.y;
          if (dx * dx + dy * dy <= 150 * 150) {
            const heal = Math.floor(other.maxHp * 8 / 100);
            other.hp = Math.min(other.maxHp, other.hp + heal);
          }
        }
      }
    }

    for (let sIdx = 0; sIdx < 16; sIdx++) {
      const sl = slots[sIdx];
      const t = sl.turret;
      if (!t) continue;
      if (t.cooldown > 0) {
        t.cooldown -= 1;
        if (t.cooldown > 0) continue;
      }
      const def = TURRET_TYPES[t.type];
      const r2 = t.range * t.range;
      const candidates = [];
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (e.air ? !def.air : !def.ground) continue;
        const dx = e.x - sl.x;
        const dy = e.y - sl.y;
        if (dx * dx + dy * dy <= r2) {
          candidates.push(e);
        }
      }
      if (candidates.length === 0) continue;

      let chosen = null;
      if (typeof strategy.target === "function") {
        const tView = { slot: sIdx, type: t.type, tier: t.tier, x: sl.x, y: sl.y, range: t.range };
        const cViews = candidates.map(makeEnemyView);
        const res = strategy.target(tView, cViews);
        for (let i = 0; i < candidates.length; i++) {
          if (candidates[i].id === res) {
            chosen = candidates[i];
            break;
          }
        }
      }
      if (!chosen) {
        let bestRem = Infinity;
        for (let i = 0; i < candidates.length; i++) {
          const e = candidates[i];
          const route = e.air ? AIR_ROUTE : GROUND_ROUTE;
          const rem = route.length - e.progress;
          if (rem < bestRem) {
            bestRem = rem;
            chosen = e;
          }
        }
      }

      if (tickEvents) {
        tickEvents.shots.push({
          slot: sIdx,
          typeIdx: def.idx,
          tier: t.tier,
          sx: sl.x,
          sy: sl.y,
          tx: chosen.x,
          ty: chosen.y,
          air: chosen.air,
          splash: def.splash
        });
      }

      if (def.splash > 0) {
        const sr2 = def.splash * def.splash;
        const tx = chosen.x, ty = chosen.y;
        for (let i = 0; i < enemies.length; i++) {
          const e = enemies[i];
          if (e.air ? !def.air : !def.ground) continue;
          const dx = e.x - tx;
          const dy = e.y - ty;
          if (dx * dx + dy * dy <= sr2) {
            const dmg = def.pierce ? t.dmg : Math.max(1, t.dmg - e.armor);
            e.hp -= dmg;
            if (def.slow > 0) e.slow = def.slow;
          }
        }
      } else {
        const dmg = def.pierce ? t.dmg : Math.max(1, t.dmg - chosen.armor);
        chosen.hp -= dmg;
        if (def.slow > 0) chosen.slow = def.slow;
      }

      t.cooldown = def.period;

      const nextEnemies = [];
      const spawnedSplitlings = [];
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (e.hp <= 0) {
          gold += e.bounty;
          log.push([tick, "K", e.id, sIdx]);
          if (tickEvents) {
            tickEvents.kills.push({ id: e.id, x: e.x, y: e.y, air: e.air, typeIdx: e.typeIdx });
          }
          if (e.type === "splitter") {
            const sHp = Math.max(1, Math.floor(e.maxHp / 4));
            const pos = routePos(GROUND_ROUTE, e.progress);
            for (let k = 0; k < 3; k++) {
              spawnedSplitlings.push({
                id: nextEnemyId++,
                type: "splitling",
                typeIdx: ENEMY_DEFS.splitling.idx,
                wave: e.wave,
                hp: sHp,
                maxHp: sHp,
                progress: e.progress,
                x: pos[0],
                y: pos[1],
                dx: pos[2],
                dy: pos[3],
                air: 0,
                armor: 0,
                speed: 12,
                bounty: 1,
                leak: 1,
                slow: 0,
                age: 0
              });
            }
          }
        } else {
          nextEnemies.push(e);
        }
      }
      if (spawnedSplitlings.length > 0) {
        for (let k = 0; k < spawnedSplitlings.length; k++) {
          nextEnemies.push(spawnedSplitlings[k]);
        }
      }
      enemies = nextEnemies;
    }

    for (let i = 0; i < enemies.length; i++) {
      if (enemies[i].slow > 0) enemies[i].slow -= 1;
    }

    if (observer) {
      observer(tick, currentWave, gold, baseHp, waveComp[currentWave + 1] || waveComp[1], slots, enemies, tickEvents);
    }
  }

  let h = 0x811c9dc5;
  const s = JSON.stringify(log);
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  const hash = (h >>> 0).toString(16).padStart(8, "0");
  const score = Math.round(((endTick - 20) / 40) * 100) / 100;
  return { score, fallTick, log, hash };
}

(function () {

    [0, 6], [21, 6], [21, 11], [23, 11]
  ];
  const TURRET_KEYS = ["bolt", "cannon", "frost", "lance", "flak"];

  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;

  // --- 1. Precompute Seed 42 Replay ---

    const counts = [0, 0, 0, 0, 0, 0];
    if (!list) return counts;
    for (let i = 0; i < list.length; i++) {
      const t = list[i];
      if (t === "grunt") counts[0]++;
      else if (t === "runner") counts[1]++;
      else if (t === "wisp") counts[2]++;
      else if (t === "brute") counts[3]++;

      ids[i] = e.id;

      ys[i] = e.y / 100;
      dxs[i] = e.dx;
      dys[i] = e.dy;
      hpR[i] = e.maxHp > 0 ? Math.max(0, e.hp / e.maxHp) : 0;
      slowed[i] = e.slow > 0 ? 1 : 0;
    }

    const slotState = new Array(16);
    for (let i = 0; i < 16; i++) {
      const t = slots[i].turret;
      slotState[i] = t ? (TURRET_KEYS.indexOf(t.type) | (t.tier << 4)) : -1;
    }

    frames[tick] = {
      tick: tick,
      wave: wave,
      gold: gold,
      baseHp: Math.max(0, baseHp),

      xs: xs,

    };

    if (ev.waveStarted) {

    }
    for (let i = 0; i < ev.builds.length; i++) {
      const b = ev.builds[i];
      buildEvents.push({ tick: tick, slot: b.slot, kind: b.kind, typeIdx: b.typeIdx });
      if (b.kind === 0) slotLastBuildTick[b.slot] = tick;
    }
    for (let i = 0; i < ev.shots.length; i++) {
      const sh = ev.shots[i];
      const rec = {
        tick: tick,
        slot: sh.slot,
        typeIdx: sh.typeIdx,
        tier: sh.tier,
        sx: sh.sx / 100,
        sy: sh.sy / 100,
        tx: sh.tx / 100,
        ty: sh.ty / 100,
        air: sh.air,
        splash: sh.splash / 100
      };

    for (let i = 0; i < ev.kills.length; i++) {

      const lk = ev.leaks[i];
      deathPosById[lk.id] = { tick: tick, x: 23.5, y: 11.5 };
      leakEvents.push({ tick: tick, hpAfter: Math.max(0, lk.hpAfter) });
      traumaEvents.push({ t: tick / TICKS_PER_SEC, amt: 0.3 });
    }
    if (ev.fell) {
      fallEvent = { tick: tick, t: tick / TICKS_PER_SEC, wave: wave };

  const lastValidTick = frames.length - 1;
  const tFall = fallEvent ? fallEvent.t : DURATION + 10;

  // --- 2. Three.js Renderer, Scene & Desaturation Injection ---
  const canvas = document.getElementById("stage");

  const desatUniform = { value: 0.0 };

  // Dusk Lighting

  const roadTex = makeStoneRoadTexture();

  // --- 8. Wordless WebGL HUD (Orthographic Pass inside #stage) ---
  function createDigitAtlas() {
    const c = document.createElement("canvas");
    c.width = 512;
    c.height = 64;
    const ctx = c.getContext("2d");
    ctx.clearRect(0, 0, 512, 64);
    ctx.font = "700 48px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (let d = 0; d < 10; d++) {
      const cx = d * 48 + 24;
      ctx.lineWidth = 4;
      ctx.strokeStyle = "rgba(8, 10, 16, 0.75)";
      ctx.strokeText(String(d), cx, 33);
      ctx.fillStyle = "#ffffff";
      ctx.fillText(String(d), cx, 33);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    return tex;
  }

  const digitAtlas = createDigitAtlas();
  const MAX_DIGITS = 32;
  const digitMeshes = [];
  for (let i = 0; i < MAX_DIGITS; i++) {
    const geo = new THREE.PlaneGeometry(1, 1);
    const mat = new THREE.MeshBasicMaterial({ map: digitAtlas, transparent: true, depthTest: false, color: 0xffffff });
    const m = new THREE.Mesh(geo, mat);
    m.visible = false;
    hudScene.add(m);
    digitMeshes.push({ mesh: m, geo: geo, mat: mat });
  }

  function setDigitChar(slot, ch, x, y, h, colorHex) {
    const d = digitMeshes[slot];
    const code = ch.charCodeAt(0) - 48;
    const w = h * 0.64;
    const u0 = (code * 48 + 4) / 512;
    const u1 = (code * 48 + 44) / 512;
    const uv = d.geo.attributes.uv;
    uv.setXY(0, u0, 1);
    uv.setXY(1, u1, 1);
    uv.setXY(2, u0, 0);
    uv.setXY(3, u1, 0);
    uv.needsUpdate = true;
    d.mesh.position.set(x + w * 0.5, y, 2);
    d.mesh.scale.set(w, h, 1);
    d.mat.color.setHex(colorHex);
    d.mesh.visible = true;
    return w;
  }

  const PREVIEW_COLORS = [0x729668, 0xf5cf27, 0x34f0ff, 0xf5761a, 0x9d4edd, 0xf3f7f4];
  const hudPreviewIcons = [];
  const previewGeos = [

  // --- 9. Camera Framing ---
  const boardCorners = [
    new THREE.Vector3(-0.58, 0, -0.58),
    new THREE.Vector3(24.58, 0, -0.58),
    new THREE.Vector3(-0.58, 0, 14.58),
    new THREE.Vector3(24.58, 0, 14.58),
    new THREE.Vector3(-0.58, 1.3, -0.58),
    new THREE.Vector3(24.58, 1.3, -0.58),
    new THREE.Vector3(-0.58, 1.3, 14.58),
    new THREE.Vector3(24.58, 1.3, 14.58)
  ];
  const baseCamPos = new THREE.Vector3();
  const baseCamTarget = new THREE.Vector3();

  function updateFraming() {
    const w = Math.max(1, window.innerWidth);
    const h = Math.max(1, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);

    camera.aspect = w / h;
    camera.near = 0.1;
    camera.far = 500;
    camera.updateProjectionMatrix();

    hudCamera.left = 0;
    hudCamera.right = w;
    hudCamera.bottom = 0;
    hudCamera.top = h;
    hudCamera.updateProjectionMatrix();

    const elev = 55 * Math.PI / 180;
    const dockMinNdcY = -1 + 2 * (94 / h);
    const topMaxNdcY = 0.90;
    const horizMaxNdc = 0.94;
    const targetZ = 7.45;
    baseCamTarget.set(12, 0, targetZ);

    let lo = 12, hi = 95;
    for (let iter = 0; iter < 28; iter++) {
      const mid = (lo + hi) * 0.5;
      camera.position.set(12, mid * Math.sin(elev), targetZ + mid * Math.cos(elev));
      camera.lookAt(baseCamTarget);
      camera.updateMatrixWorld();

      let fits = true;
      for (let i = 0; i < boardCorners.length; i++) {
        const p = boardCorners[i].clone().project(camera);
        if (Math.abs(p.x) > horizMaxNdc || p.y < dockMinNdcY || p.y > topMaxNdcY) {
          fits = false;
          break;
        }
      }
      if (fits) hi = mid;
      else lo = mid;
    }

    const dist = hi * 1.015;
    baseCamPos.set(12, dist * Math.sin(elev), targetZ + dist * Math.cos(elev));
    camera.position.copy(baseCamPos);
    camera.lookAt(baseCamTarget);
  }
  updateFraming();
  window.addEventListener("resize", updateFraming);

  // --- 10. Web Audio SFX Engine (Seed 4242) ---
  const audioRng = mulberry32(4242);
  let audioCtx = null;
  let masterGain = null;
  let compressor = null;
  let noiseBuffer = null;
  let windGain = null;
  let windSource = null;
  const activeOneShots = new Set();
  const shotTimestamps = [];
  let lastPopAudioWall = -10;
  let isAudioActive = false;

  function initAudio() {
    if (audioCtx) return;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    try {
      audioCtx = new Ctx();
      compressor = audioCtx.createDynamicsCompressor();
      compressor.threshold.value = -14;
      compressor.knee.value = 12;
      compressor.ratio.value = 6;
      compressor.attack.value = 0.003;
      compressor.release.value = 0.15;

      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.0;
      masterGain.connect(compressor);
      compressor.connect(audioCtx.destination);

      const sr = audioCtx.sampleRate;
      const len = sr * 2;
      noiseBuffer = audioCtx.createBuffer(1, len, sr);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < len; i++) {
        data[i] = (audioRng() / 0x7fffffff) - 1.0;
      }

      windSource = audioCtx.createBufferSource();
      windSource.buffer = noiseBuffer;
      windSource.loop = true;
      const windFilter = audioCtx.createBiquadFilter();
      windFilter.type = "lowpass";
      windFilter.frequency.value = 220;
      windGain = audioCtx.createGain();
      windGain.gain.value = 0.0;
      windSource.connect(windFilter);
      windFilter.connect(windGain);
      windGain.connect(masterGain);
      windSource.start();
    } catch (_) {
      audioCtx = null;
    }
  }

  function resumeAudio() {
    if (!audioCtx) initAudio();
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume().catch(function () {});
    }
  }

  initAudio();
  resumeAudio();
  window.addEventListener("pointerdown", resumeAudio, { passive: true });
  window.addEventListener("keydown", resumeAudio, { passive: true });

  function silenceAudioImmediately() {
    isAudioActive = false;
    if (!audioCtx || !masterGain) return;
    const now = audioCtx.currentTime;
    masterGain.gain.cancelScheduledValues(now);
    masterGain.gain.setValueAtTime(masterGain.gain.value, now);
    masterGain.gain.linearRampToValueAtTime(0.0, now + 0.045);
    if (windGain) {
      windGain.gain.cancelScheduledValues(now);
      windGain.gain.setTargetAtTime(0.0, now, 0.015);
    }
    activeOneShots.forEach(function (node) {
      try { node.stop(now + 0.02); } catch (_) {}
    });
    activeOneShots.clear();
  }

  function makePanner(boardX) {
    const panVal = Math.max(-0.85, Math.min(0.85, (boardX / 12) - 1.0));
    if (typeof audioCtx.createStereoPanner === "function") {
      const p = audioCtx.createStereoPanner();
      p.pan.value = panVal;
      p.connect(masterGain);
      return p;
    }
    return masterGain;
  }

  function trackNode(node, stopTime) {
    activeOneShots.add(node);
    node.onended = function () { activeOneShots.delete(node); };
    node.stop(stopTime);
  }

  function playShotSound(typeIdx, boardX) {
    if (!audioCtx || audioCtx.state !== "running" || !isAudioActive) return;
    const now = audioCtx.currentTime;
    const dest = makePanner(boardX);
    const jitter = 0.96 + (audioRng() % 80) / 1000;

    if (typeIdx === 0) {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(760 * jitter, now);
      osc.frequency.exponentialRampToValueAtTime(280 * jitter, now + 0.055);
      g.gain.setValueAtTime(0.08, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc.connect(g); g.connect(dest);
      osc.start(now); trackNode(osc, now + 0.065);
    } else if (typeIdx === 1) {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(165 * jitter, now);
      osc.frequency.exponentialRampToValueAtTime(42, now + 0.13);
      g.gain.setValueAtTime(0.18, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
      osc.connect(g); g.connect(dest);
      osc.start(now); trackNode(osc, now + 0.145);

      const n = audioCtx.createBufferSource();
      n.buffer = noiseBuffer;
      const lp = audioCtx.createBiquadFilter();
      lp.type = "lowpass"; lp.frequency.value = 520;
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(0.12, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      n.connect(lp); lp.connect(ng); ng.connect(dest);
      n.start(now, (audioRng() % 100) / 100); trackNode(n, now + 0.125);
    } else if (typeIdx === 2) {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(1420 * jitter, now);
      osc.frequency.exponentialRampToValueAtTime(1860 * jitter, now + 0.08);
      g.gain.setValueAtTime(0.055, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
      osc.connect(g); g.connect(dest);
      osc.start(now); trackNode(osc, now + 0.095);
    } else if (typeIdx === 3) {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(980 * jitter, now);
      osc.frequency.exponentialRampToValueAtTime(175, now + 0.11);
      const lp = audioCtx.createBiquadFilter();
      lp.type = "lowpass"; lp.frequency.value = 2600;
      g.gain.setValueAtTime(0.15, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.115);
      osc.connect(lp); lp.connect(g); g.connect(dest);
      osc.start(now); trackNode(osc, now + 0.12);
    } else {
      const n = audioCtx.createBufferSource();
      n.buffer = noiseBuffer;
      const bp = audioCtx.createBiquadFilter();
      bp.type = "bandpass"; bp.frequency.value = 1300 * jitter; bp.Q.value = 1.6;
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(0.13, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      n.connect(bp); bp.connect(ng); ng.connect(dest);
      n.start(now, (audioRng() % 100) / 100); trackNode(n, now + 0.085);
    }
  }

  function playKillPop(boardX) {
    if (!audioCtx || audioCtx.state !== "running" || !isAudioActive) return;
    const now = audioCtx.currentTime;
    if (now - lastPopAudioWall < 0.045) return;
    lastPopAudioWall = now;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(420 + (audioRng() % 90), now);
    osc.frequency.exponentialRampToValueAtTime(140, now + 0.055);
    g.gain.setValueAtTime(0.06, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
    osc.connect(g); g.connect(makePanner(boardX));
    osc.start(now); trackNode(osc, now + 0.065);
  }

  function playWaveHorn() {
    if (!audioCtx || audioCtx.state !== "running" || !isAudioActive) return;
    const now = audioCtx.currentTime;
    const freqs = [146.8, 220.0];
    for (let i = 0; i < freqs.length; i++) {
      const osc = audioCtx.createOscillator();
      const lp = audioCtx.createBiquadFilter();
      const g = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(freqs[i] * 0.92, now);
      osc.frequency.linearRampToValueAtTime(freqs[i], now + 0.16);
      lp.type = "lowpass";
      lp.frequency.setValueAtTime(480, now);
      lp.frequency.linearRampToValueAtTime(1250, now + 0.18);
      g.gain.setValueAtTime(0.001, now);
      g.gain.linearRampToValueAtTime(0.08, now + 0.08);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
      osc.connect(lp); lp.connect(g); g.connect(masterGain);
      osc.start(now); trackNode(osc, now + 0.37);
    }
  }

  function playLeakSound() {
    if (!audioCtx || audioCtx.state !== "running" || !isAudioActive) return;
    const now = audioCtx.currentTime;
    const dest = makePanner(23.5);
    const n = audioCtx.createBufferSource();
    n.buffer = noiseBuffer;
    const bp = audioCtx.createBiquadFilter();
    bp.type = "bandpass"; bp.frequency.value = 900; bp.Q.value = 1.2;
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.24, now);
    ng.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
    n.connect(bp); bp.connect(ng); ng.connect(dest);
    n.start(now, (audioRng() % 100) / 100); trackNode(n, now + 0.19);

    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(520, now);
    osc.frequency.setValueAtTime(390, now + 0.09);
    g.gain.setValueAtTime(0.09, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
    osc.connect(g); g.connect(dest);
    osc.start(now); trackNode(osc, now + 0.25);
  }

  function playFallCollapse() {
    if (!audioCtx || audioCtx.state !== "running" || !isAudioActive) return;
    const now = audioCtx.currentTime;
    const dest = makePanner(23.5);
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(95, now);
    osc.frequency.exponentialRampToValueAtTime(28, now + 0.9);
    g.gain.setValueAtTime(0.35, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.95);
    osc.connect(g); g.connect(dest);
    osc.start(now); trackNode(osc, now + 0.96);

    const n = audioCtx.createBufferSource();
    n.buffer = noiseBuffer;
    const lp = audioCtx.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = 460;
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.28, now);
    ng.gain.exponentialRampToValueAtTime(0.001, now + 0.85);
    n.connect(lp); lp.connect(ng); ng.connect(dest);
    n.start(now, 0); trackNode(n, now + 0.86);
  }

  const SHOT_PRIORITY = [2, 4, 1, 5, 3];
  function triggerAudioBetween(prevTime, currTime) {
    if (!audioCtx || !isAudioActive) return;
    if (audioCtx.state === "running" && masterGain) {
      const now = audioCtx.currentTime;
      masterGain.gain.setTargetAtTime(0.65, now, 0.015);
      if (windGain) {
        windGain.gain.setTargetAtTime(currTime >= tFall ? 0.14 : 0.0, now, 0.04);
      }
    }

    if (currTime <= prevTime) return;
    const prevTick = Math.floor(prevTime * TICKS_PER_SEC);
    const currTick = Math.floor(currTime * TICKS_PER_SEC);
    if (currTick <= prevTick) return;

    if (fallEvent && prevTick < fallEvent.tick && currTick >= fallEvent.tick) {
      playFallCollapse();
      return;
    }
    if (currTime >= tFall) return;

    for (let i = 0; i < waveEvents.length; i++) {
      const t = waveEvents[i].tick;
      if (t > prevTick && t <= currTick) playWaveHorn();
    }
    for (let i = 0; i < leakEvents.length; i++) {
      const t = leakEvents[i].tick;
      if (t > prevTick && t <= currTick) playLeakSound();
    }
    for (let i = 0; i < killEvents.length; i++) {
      const k = killEvents[i];
      if (k.tick > prevTick && k.tick <= currTick) playKillPop(k.x);
    }

    const wallNow = audioCtx.currentTime;
    while (shotTimestamps.length > 0 && wallNow - shotTimestamps[0] >= 1.0) {
      shotTimestamps.shift();
    }
    const pendingShots = [];
    for (let i = 0; i < shotEvents.length; i++) {
      const sh = shotEvents[i];
      if (sh.tick > prevTick && sh.tick <= currTick) pendingShots.push(sh);
    }
    if (pendingShots.length > 0) {
      pendingShots.sort(function (a, b) {
        return SHOT_PRIORITY[b.typeIdx] - SHOT_PRIORITY[a.typeIdx];
      });
      for (let i = 0; i < pendingShots.length; i++) {
        if (shotTimestamps.length >= 12) break;
        shotTimestamps.push(wallNow);
        playShotSound(pendingShots[i].typeIdx, pendingShots[i].sx);
      }
    }
  }

  // --- 11. Closed-Form Render at Any simTime ---
  function lowerBoundTick(arr, targetTick) {
    let lo = 0, hi = arr.length;
    while (lo < hi) {
      const mid = (lo + hi) >>> 1;
      if (arr[mid].tick < targetTick) lo = mid + 1;
      else hi = mid;
    }
    return lo;
  }

  function lastShotForSlot(slotIdx, maxTick) {
    const list = slotShotIdx[slotIdx];
    let lo = 0, hi = list.length - 1, ans = -1;
    while (lo <= hi) {
      const mid = (lo + hi) >>> 1;
      const s = shotEvents[list[mid]];
      if (s.tick <= maxTick) { ans = list[mid]; lo = mid + 1; }
      else hi = mid - 1;
    }
    return ans >= 0 ? shotEvents[ans] : null;
  }

  function seededNoise1D(t) {
    const i = Math.floor(t);
    const f = t - i;
    const u = f * f * (3 - 2 * f);
    function hash1(n) {
      let x = Math.imul((n | 0) ^ 0x9e3779b9, 0x85ebca6b);
      x = Math.imul(x ^ (x >>> 13), 0xc2b2ae35);
      return (((x ^ (x >>> 16)) >>> 0) / 2147483647.5) - 1.0;
    }
    return hash1(i) * (1 - u) + hash1(i + 1) * u;
  }

  const tmpColor = new THREE.Color();
  const slowColor = new THREE.Color(0x7ee2ff);
  const vStart = new THREE.Vector3();
  const vEnd = new THREE.Vector3();
  const vMid = new THREE.Vector3();
  const vDir = new THREE.Vector3();
  const qRot = new THREE.Quaternion();
  const zAxis = new THREE.Vector3(0, 0, 1);

  const SHOT_COLORS = [
    new THREE.Color(0x7ac7ff),
    new THREE.Color(0xff9b3d),
    new THREE.Color(0xc2f5ff),
    new THREE.Color(0xff2e4c),
    new THREE.Color(0x2ef2e2)
  ];
  const ENEMY_COLORS_ARR = [0x729668, 0xf5cf27, 0x34f0ff, 0x2b303c, 0x9d4edd, 0xf3f7f4, 0xc77dff];

  function renderAt(simTime) {
    const clampedSim = Math.max(0, Math.min(DURATION, simTime));
    const frozenAtFall = fallEvent !== null && clampedSim >= tFall;
    const activeTime = frozenAtFall ? tFall : clampedSim;
    const tickFloat = activeTime * TICKS_PER_SEC;
    const k = Math.min(lastValidTick, Math.floor(tickFloat));
    const kNext = Math.min(lastValidTick, k + 1);
    const frac = frozenAtFall ? 0 : (tickFloat - k);

    const f0 = frames[k];
    const f1 = frames[kNext];

    if (frozenAtFall) {
      const dtFall = Math.max(0, Math.min(1.0, clampedSim - tFall));
      desatUniform.value = dtFall * 0.88;
    } else {
      desatUniform.value = 0.0;
    }

    let trauma = 0, prevT = 0;
    for (let i = 0; i < traumaEvents.length; i++) {
      const ev = traumaEvents[i];
      if (ev.t > clampedSim) break;
      trauma = Math.max(0, trauma - (ev.t - prevT));
      trauma = Math.min(1, trauma + ev.amt);
      prevT = ev.t;
    }
    trauma = Math.max(0, trauma - (clampedSim - prevT));
    const shakeAmp = trauma * trauma * 0.25;
    const sx = shakeAmp * seededNoise1D(clampedSim * 28.3 + 11.7);
    const sy = shakeAmp * 0.65 * seededNoise1D(clampedSim * 31.7 + 47.2);
    const sz = shakeAmp * seededNoise1D(clampedSim * 24.9 + 93.1);
    camera.position.set(baseCamPos.x + sx, baseCamPos.y + sy, baseCamPos.z + sz);
    camera.lookAt(baseCamTarget.x + sx * 0.5, baseCamTarget.y, baseCamTarget.z + sz * 0.5);

    const chevTravel = (activeTime * 2.2) % 28;
    for (let i = 0; i < airChevrons.length; i++) {
      const p = sampleAirPolyline(airChevrons[i].baseDist + chevTravel);
      airChevrons[i].mesh.position.set(p.x, 0.81, p.z);
      airChevrons[i].mesh.rotation.y = p.ang;
    }

    const hp = frozenAtFall ? 0 : f0.baseHp;
    keepIntactGroup.visible = !frozenAtFall;
    for (let i = 0; i < keepChunks.length; i++) {
      keepChunks[i].visible = !frozenAtFall && i < hp;
    }
    let leakFlash = 0;
    for (let i = leakEvents.length - 1; i >= 0; i--) {
      const dt = clampedSim - leakEvents[i].tick / TICKS_PER_SEC;
      if (dt >= 0 && dt < 0.35) {
        leakFlash = Math.max(leakFlash, 1 - dt / 0.35);
        break;
      }
      if (leakEvents[i].tick / TICKS_PER_SEC < clampedSim - 0.35) break;
    }
    if (frozenAtFall) {
      keepWallMat.emissive.setHex(0x000000);
      keepGlowLight.intensity = 0.1;
    } else {
      keepWallMat.emissive.setHex(0xff1e1e);
      keepWallMat.emissiveIntensity = leakFlash * 1.4;
      keepGlowLight.intensity = 1.3 + leakFlash * 1.6;
      beaconCrystal.rotation.y = activeTime * 1.2;
    }

    for (let sIdx = 0; sIdx < 16; sIdx++) {
      const code = f0.slots[sIdx];
      const sv = slotVisuals[sIdx];
      const activeType = code >= 0 ? TURRET_KEYS[code & 0xf] : null;
      const tier = code >= 0 ? (code >> 4) : 0;
      const lastShot = code >= 0 ? lastShotForSlot(sIdx, k) : null;

      let popScale = 1.0;
      if (code >= 0) {
        for (let b = buildEvents.length - 1; b >= 0; b--) {
          const be = buildEvents[b];
          if (be.slot === sIdx && be.kind === 0 && be.tick <= k) {
            const dtB = activeTime - be.tick / TICKS_PER_SEC;
            if (dtB >= 0 && dtB < 0.22) {
              const tPop = dtB / 0.22;
              popScale = 0.2 + 0.8 * (tPop * tPop * (3 - 2 * tPop));
            }
            break;
          }
        }
      }
      sv.container.scale.setScalar(popScale);

      for (let t = 0; t < TURRET_KEYS.length; t++) {
        const key = TURRET_KEYS[t];
        const tv = sv.byType[key];
        const show = key === activeType;
        tv.root.visible = show;
        if (!show) continue;

        for (let p = 0; p < 3; p++) tv.pips[p].visible = p < tier;

        if (key === "frost") {
          tv.barrelGroup.rotation.y = activeTime * 1.8 + sIdx;
        } else if (lastShot) {
          const dx = lastShot.tx - lastShot.sx;
          const dz = lastShot.ty - lastShot.sy;
          tv.head.rotation.y = Math.atan2(dx, dz);
          const dtShot = activeTime - lastShot.tick / TICKS_PER_SEC;
          if (dtShot >= 0 && dtShot < 0.15) {
            const kick = Math.sin((1 - dtShot / 0.15) * Math.PI);
            tv.barrelGroup.position.z = -kick * 0.12;
          } else {
            tv.barrelGroup.position.z = 0;
          }
        } else {
          tv.head.rotation.y = 0;
          tv.barrelGroup.position.z = 0;
        }
      }
    }

    const counts = [0, 0, 0, 0, 0, 0, 0];
    let bruteCount = 0, menderCount = 0, shadowCount = 0, hpCount = 0;
    let i0 = 0, i1 = 0;
    const n0 = f0.n, n1 = f1.n;
    const camDir = camera.quaternion;

    while (i0 < n0) {
      const id = f0.ids[i0];
      while (i1 < n1 && f1.ids[i1] < id) i1++;
      const hasNext = (i1 < n1 && f1.ids[i1] === id);

      let ex = f0.xs[i0], ez = f0.ys[i0];
      let dx = f0.dxs[i0], dz = f0.dys[i0];
      let hpRatio = f0.hpR[i0];
      if (hasNext) {
        ex += (f1.xs[i1] - ex) * frac;
        ez += (f1.ys[i1] - ez) * frac;
        dx = frac < 0.5 ? dx : f1.dxs[i1];
        dz = frac < 0.5 ? dz : f1.dys[i1];
        hpRatio += (f1.hpR[i1] - hpRatio) * frac;
      } else if (!frozenAtFall && kNext > k) {
        const dp = deathPosById[id];
        if (dp && dp.tick === kNext) {
          ex += (dp.x - ex) * frac;
          ez += (dp.y - ez) * frac;
        }
      }

      const typeIdx = f0.types[i0];
      const isAir = typeIdx === 2;
      const isSlowed = f0.slowed[i0] === 1;
      const ey = isAir ? 0.8 + Math.sin(activeTime * 4.5 + id) * 0.06 : (typeIdx === 3 ? 0.22 : (typeIdx === 5 ? 0.24 : (typeIdx === 6 ? 0.11 : 0.18)));
      const yaw = Math.atan2(dx, dz);

      const em = enemyMeshes[typeIdx];
      const idx = counts[typeIdx];
      if (idx < MAX_ENEMIES) {
        dummy.position.set(ex, ey, ez);
        dummy.rotation.set(0, yaw + (typeIdx === 2 ? activeTime * 2.2 : 0), 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        em.inst.setMatrixAt(idx, dummy.matrix);
        tmpColor.copy(em.baseColor);
        if (isSlowed) tmpColor.lerp(slowColor, 0.58);
        em.inst.setColorAt(idx, tmpColor);
        counts[typeIdx]++;
      }

      if (typeIdx === 3 && bruteCount < MAX_ENEMIES) {
        dummy.position.set(ex, 0.30, ez);
        dummy.rotation.set(0, yaw, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        brutePlates.inst.setMatrixAt(bruteCount, dummy.matrix);
        tmpColor.copy(brutePlates.baseColor);
        if (isSlowed) tmpColor.lerp(slowColor, 0.5);
        brutePlates.inst.setColorAt(bruteCount, tmpColor);
        bruteCount++;
      } else if (typeIdx === 5 && menderCount < MAX_ENEMIES) {
        dummy.position.set(ex, 0.26, ez);
        dummy.rotation.set(0, activeTime * 2.0, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        menderHalos.inst.setMatrixAt(menderCount, dummy.matrix);
        menderCount++;
      } else if (isAir && shadowCount < MAX_ENEMIES) {
        dummy.position.set(ex, 0.03, ez);
        dummy.rotation.set(0, 0, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        wispShadows.setMatrixAt(shadowCount, dummy.matrix);
        shadowCount++;
      }

      if (hpCount < MAX_ENEMIES) {
        const barY = isAir ? 1.18 : (typeIdx === 3 ? 0.66 : (typeIdx === 5 ? 0.68 : 0.54));
        dummy.position.set(ex, barY, ez);
        dummy.quaternion.copy(camDir);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        hpBgInst.setMatrixAt(hpCount, dummy.matrix);

        const rClamped = Math.max(0.02, Math.min(1, hpRatio));
        dummy.translateX((rClamped - 1) * 0.20);
        dummy.translateZ(0.004);
        dummy.scale.set(rClamped, 1, 1);
        dummy.updateMatrix();
        hpFgInst.setMatrixAt(hpCount, dummy.matrix);

        if (rClamped > 0.5) tmpColor.setHex(0x4ade80);
        else if (rClamped > 0.25) tmpColor.setHex(0xfacc15);
        else tmpColor.setHex(0xf87171);
        hpFgInst.setColorAt(hpCount, tmpColor);
        hpCount++;
      }

      i0++;
    }

    for (let t = 0; t < 7; t++) {
      enemyMeshes[t].inst.count = counts[t];
      enemyMeshes[t].inst.instanceMatrix.needsUpdate = true;
      enemyMeshes[t].inst.instanceColor.needsUpdate = true;
    }
    brutePlates.inst.count = bruteCount;
    brutePlates.inst.instanceMatrix.needsUpdate = true;
    brutePlates.inst.instanceColor.needsUpdate = true;
    menderHalos.inst.count = menderCount;
    menderHalos.inst.instanceMatrix.needsUpdate = true;
    wispShadows.count = shadowCount;
    wispShadows.instanceMatrix.needsUpdate = true;
    hpBgInst.count = hpCount;
    hpBgInst.instanceMatrix.needsUpdate = true;
    hpFgInst.count = hpCount;
    hpFgInst.instanceMatrix.needsUpdate = true;
    hpFgInst.instanceColor.needsUpdate = true;

    let beamCount = 0, shellCount = 0, ringCount = 0, debrisCount = 0;

    const minShotTick = Math.floor((activeTime - 0.15) * TICKS_PER_SEC);
    const maxShotTick = Math.floor(activeTime * TICKS_PER_SEC);
    const sStart = lowerBoundTick(shotEvents, minShotTick);
    for (let i = sStart; i < shotEvents.length; i++) {
      const sh = shotEvents[i];
      if (sh.tick > maxShotTick) break;
      const dt = activeTime - sh.tick / TICKS_PER_SEC;
      if (dt < 0 || dt > 0.15) continue;
      const p = dt / 0.15;
      const sy = 0.34;
      const ty = sh.air ? 0.8 : 0.2;

      if (sh.typeIdx === 1) {
        if (p < 0.72) {
          const arcP = p / 0.72;
          const px = sh.sx + (sh.tx - sh.sx) * arcP;
          const pz = sh.sy + (sh.ty - sh.sy) * arcP;
          const py = sy + (ty - sy) * arcP + Math.sin(arcP * Math.PI) * 0.95;
          if (shellCount < MAX_FX) {
            dummy.position.set(px, py, pz);
            dummy.rotation.set(0, 0, 0);
            dummy.scale.setScalar(1.0);
            dummy.updateMatrix();
            shellInst.setMatrixAt(shellCount, dummy.matrix);
            shellInst.setColorAt(shellCount, SHOT_COLORS[1]);
            shellCount++;
          }
        } else if (ringCount < MAX_FX) {
          const rp = (p - 0.72) / 0.28;
          dummy.position.set(sh.tx, 0.08, sh.ty);
          dummy.rotation.set(0, 0, 0);
          dummy.scale.setScalar(sh.splash * (0.25 + 0.75 * rp));
          dummy.updateMatrix();
          ringInst.setMatrixAt(ringCount, dummy.matrix);
          ringInst.setColorAt(ringCount, SHOT_COLORS[1]);
          ringCount++;
        }
      } else if (sh.typeIdx === 4) {
        if (p < 0.45 && beamCount < MAX_FX) {
          vStart.set(sh.sx, sy, sh.sy);
          vEnd.set(sh.tx, ty, sh.ty);
          vDir.subVectors(vEnd, vStart);
          const len = Math.max(0.01, vDir.length());
          vMid.addVectors(vStart, vEnd).multiplyScalar(0.5);
          qRot.setFromUnitVectors(zAxis, vDir.normalize());
          dummy.position.copy(vMid);
          dummy.quaternion.copy(qRot);
          dummy.scale.set(0.032, 0.032, len);
          dummy.updateMatrix();
          beamInst.setMatrixAt(beamCount, dummy.matrix);
          beamInst.setColorAt(beamCount, SHOT_COLORS[4]);
          beamCount++;
        }
        if (ringCount < MAX_FX) {
          dummy.position.set(sh.tx, 0.80, sh.ty);
          dummy.rotation.set(0, 0, 0);
          dummy.scale.setScalar(sh.splash * (0.25 + 0.75 * p));
          dummy.updateMatrix();
          ringInst.setMatrixAt(ringCount, dummy.matrix);
          ringInst.setColorAt(ringCount, SHOT_COLORS[4]);
          ringCount++;
        }
      } else if (beamCount < MAX_FX) {
        vStart.set(sh.sx, sy, sh.sy);
        vEnd.set(sh.tx, ty, sh.ty);
        vDir.subVectors(vEnd, vStart);
        const len = Math.max(0.01, vDir.length());
        vMid.addVectors(vStart, vEnd).multiplyScalar(0.5);
        qRot.setFromUnitVectors(zAxis, vDir.normalize());
        const thick = sh.typeIdx === 3 ? (0.095 * (1 - p * 0.65)) : (sh.typeIdx === 2 ? 0.045 * (1 - p * 0.5) : 0.028);
        dummy.position.copy(vMid);
        dummy.quaternion.copy(qRot);
        dummy.scale.set(thick, thick, len);
        dummy.updateMatrix();
        beamInst.setMatrixAt(beamCount, dummy.matrix);
        beamInst.setColorAt(beamCount, SHOT_COLORS[sh.typeIdx]);
        beamCount++;

        if (sh.typeIdx === 3 && shellCount < MAX_FX) {
          dummy.position.set(sh.tx, ty, sh.ty);
          dummy.rotation.set(0, 0, 0);
          dummy.scale.setScalar(2.1 * (1 - p));
          dummy.updateMatrix();
          shellInst.setMatrixAt(shellCount, dummy.matrix);
          shellInst.setColorAt(shellCount, SHOT_COLORS[3]);
          shellCount++;
        }
      }
    }

    const minHealTick = Math.floor((activeTime - 0.40) * TICKS_PER_SEC);
    const hStart = lowerBoundTick(healEvents, minHealTick);
    for (let i = hStart; i < healEvents.length; i++) {
      const hl = healEvents[i];
      if (hl.tick > maxShotTick) break;
      const dt = activeTime - hl.tick / TICKS_PER_SEC;
      if (dt < 0 || dt > 0.40 || ringCount >= MAX_FX) continue;
      const p = dt / 0.40;
      dummy.position.set(hl.x, 0.07, hl.y);
      dummy.rotation.set(0, 0, 0);
      dummy.scale.setScalar(1.5 * p);
      dummy.updateMatrix();
      ringInst.setMatrixAt(ringCount, dummy.matrix);
      tmpColor.setHex(0x45ff8a);
      ringInst.setColorAt(ringCount, tmpColor);
      ringCount++;
    }

    const minBuildTick = Math.floor((activeTime - 0.50) * TICKS_PER_SEC);
    const bStart = lowerBoundTick(buildEvents, minBuildTick);
    for (let i = bStart; i < buildEvents.length; i++) {
      const b = buildEvents[i];
      if (b.tick > maxShotTick) break;
      const dt = activeTime - b.tick / TICKS_PER_SEC;
      if (dt < 0 || dt > 0.50) continue;
      const p = dt / 0.50;
      const bx = SLOT_COORDS[b.slot][0] + 0.5;
      const bz = SLOT_COORDS[b.slot][1] + 0.5;
      if (b.kind === 1 && ringCount < MAX_FX) {
        dummy.position.set(bx, 0.18, bz);
        dummy.rotation.set(0, 0, 0);
        dummy.scale.setScalar(0.35 + 0.65 * p);
        dummy.updateMatrix();
        ringInst.setMatrixAt(ringCount, dummy.matrix);
        tmpColor.setHex(0xffdf6b);
        ringInst.setColorAt(ringCount, tmpColor);
        ringCount++;
      } else {
        const count = b.kind === 0 ? 5 : 6;
        for (let m = 0; m < count && debrisCount < MAX_DEBRIS; m++) {
          const ang = (m / count) * Math.PI * 2 + b.slot;
          const r = (b.kind === 0 ? 0.25 : 0.65) * p;
          const py = b.kind === 0 ? (0.15 + p * 1.15) : Math.max(0.05, 0.35 + 1.5 * p - 4.0 * p * p);
          dummy.position.set(bx + Math.cos(ang) * r, py, bz + Math.sin(ang) * r);
          dummy.rotation.set(p * 4 + m, p * 3, 0);
          dummy.scale.setScalar(Math.max(0.01, (1 - p) * (b.kind === 0 ? 0.65 : 1.1)));
          dummy.updateMatrix();
          debrisInst.setMatrixAt(debrisCount, dummy.matrix);
          tmpColor.setHex(b.kind === 0 ? 0xffe47a : 0x5c6478);
          debrisInst.setColorAt(debrisCount, tmpColor);
          debrisCount++;
        }
      }
    }

    const minKillTick = Math.floor((activeTime - 0.45) * TICKS_PER_SEC);
    const kStart = lowerBoundTick(killEvents, minKillTick);
    for (let i = kStart; i < killEvents.length; i++) {
      const kl = killEvents[i];
      if (kl.tick > maxShotTick) break;
      const dt = activeTime - kl.tick / TICKS_PER_SEC;
      if (dt < 0 || dt > 0.45) continue;
      const p = dt / 0.45;
      const baseY = kl.air ? 0.8 : 0.22;
      const shards = kl.typeIdx === 4 ? 8 : 5;
      const colHex = ENEMY_COLORS_ARR[kl.typeIdx];
      for (let m = 0; m < shards && debrisCount < MAX_DEBRIS; m++) {
        const seedVal = Math.imul((i + 1) * 73856093 ^ (m + 1) * 19349663, 0x27d4eb4d);
        const ang = ((seedVal & 0xffff) / 65535) * Math.PI * 2;
        const spd = 0.8 + (((seedVal >>> 16) & 0xff) / 255) * 1.6;
        const vy = 1.6 + (((seedVal >>> 24) & 0xff) / 255) * 1.4;
        const px = kl.x + Math.cos(ang) * spd * dt;
        const pz = kl.y + Math.sin(ang) * spd * dt;
        const py = Math.max(0.05, baseY + vy * dt - 4.8 * dt * dt);
        dummy.position.set(px, py, pz);
        dummy.rotation.set(dt * 8 + m, dt * 6, m);
        dummy.scale.setScalar((1 - p) * (kl.typeIdx === 3 ? 1.35 : 0.85));
        dummy.updateMatrix();
        debrisInst.setMatrixAt(debrisCount, dummy.matrix);
        tmpColor.setHex(colHex);
        debrisInst.setColorAt(debrisCount, tmpColor);
        debrisCount++;
      }
      if (kl.typeIdx === 4 && ringCount < MAX_FX) {
        dummy.position.set(kl.x, 0.14, kl.y);
        dummy.rotation.set(0, 0, 0);
        dummy.scale.setScalar(0.55 * p);
        dummy.updateMatrix();
        ringInst.setMatrixAt(ringCount, dummy.matrix);
        tmpColor.setHex(0xc77dff);
        ringInst.setColorAt(ringCount, tmpColor);
        ringCount++;
      }
    }

    if (frozenAtFall) {
      const dtFall = clampedSim - tFall;
      if (dtFall < 1.35 && ringCount < MAX_FX) {
        const rp = dtFall / 1.35;
        dummy.position.set(23.5, 0.18, 11.5);
        dummy.rotation.set(0, 0, 0);
        dummy.scale.setScalar(0.5 + rp * 7.5);
        dummy.updateMatrix();
        ringInst.setMatrixAt(ringCount, dummy.matrix);
        tmpColor.setHex(0xff422b);
        ringInst.setColorAt(ringCount, tmpColor);
        ringCount++;
      }
      const dtDeb = Math.min(2.0, dtFall);
      for (let m = 0; m < 44 && debrisCount < MAX_DEBRIS; m++) {
        const seedVal = Math.imul((m + 17) * 2654435761, 0x45d9f3b);
        const ang = ((seedVal & 0xffff) / 65535) * Math.PI * 2;
        const spd = 1.2 + (((seedVal >>> 16) & 0xff) / 255) * 3.8;
        const vy = 3.2 + (((seedVal >>> 24) & 0xff) / 255) * 4.5;
        const px = 23.5 + Math.cos(ang) * spd * dtDeb;
        const pz = 11.5 + Math.sin(ang) * spd * dtDeb;
        const py = Math.max(0.08, 0.45 + vy * dtDeb - 5.2 * dtDeb * dtDeb);
        const settled = py <= 0.085;
        dummy.position.set(px, py, pz);
        dummy.rotation.set(settled ? 0.2 : dtDeb * 5 + m, m * 1.1, settled ? 0.1 : dtDeb * 4);
        dummy.scale.setScalar(1.45 + (m % 3) * 0.45);
        dummy.updateMatrix();
        debrisInst.setMatrixAt(debrisCount, dummy.matrix);
        tmpColor.setHex(m % 4 === 0 ? 0xff7b39 : 0x5c6680);
        debrisInst.setColorAt(debrisCount, tmpColor);
        debrisCount++;
      }
    }

    beamInst.count = beamCount;
    beamInst.instanceMatrix.needsUpdate = true;
    beamInst.instanceColor.needsUpdate = true;
    shellInst.count = shellCount;
    shellInst.instanceMatrix.needsUpdate = true;
    shellInst.instanceColor.needsUpdate = true;
    ringInst.count = ringCount;
    ringInst.instanceMatrix.needsUpdate = true;
    ringInst.instanceColor.needsUpdate = true;
    debrisInst.count = debrisCount;
    debrisInst.instanceMatrix.needsUpdate = true;
    debrisInst.instanceColor.needsUpdate = true;

    // --- Wordless HUD ---
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const padX = Math.max(18, Math.round(vw * 0.02));
    const padY = Math.max(16, Math.round(vh * 0.024));
    const waveH = Math.max(46, Math.round(vh * 0.078));
    const goldH = Math.max(24, Math.round(vh * 0.042));
    const prevH = Math.max(16, Math.round(vh * 0.028));

    for (let i = 0; i < MAX_DIGITS; i++) digitMeshes[i].mesh.visible = false;
    let dPtr = 0;

    const waveCy = vh - padY - waveH * 0.5;
    hudWaveIcon.position.set(padX + waveH * 0.36, waveCy, 2);
    hudWaveIcon.scale.setScalar(waveH * 0.72);
    const waveStr = String(f0.wave);
    let curX = padX + waveH * 0.88;
    for (let i = 0; i < waveStr.length && dPtr < MAX_DIGITS; i++) {
      curX += setDigitChar(dPtr++, waveStr[i], curX, waveCy, waveH, 0xf4f7ff) + 1;
    }

    const goldCy = waveCy - waveH * 0.58 - goldH * 0.52;
    hudCoinIcon.position.set(padX + goldH * 0.38, goldCy, 2);
    hudCoinIcon.scale.setScalar(goldH * 0.72);
    const goldStr = String(f0.gold);
    curX = padX + goldH * 0.92;
    for (let i = 0; i < goldStr.length && dPtr < MAX_DIGITS; i++) {
      curX += setDigitChar(dPtr++, goldStr[i], curX, goldCy, goldH, 0xffdf6b) + 1;
    }

    const prevCy = goldCy - goldH * 0.62 - prevH * 0.58;
    let prevX = padX + prevH * 0.42;
    for (let t = 0; t < 6; t++) {
      const cnt = f0.nextCounts[t];
      if (cnt > 0) {
        hudPreviewIcons[t].visible = true;
        hudPreviewIcons[t].position.set(prevX, prevCy, 2);
        hudPreviewIcons[t].scale.setScalar(prevH * 0.82);
        prevX += prevH * 0.62;
        const cs = String(cnt);
        for (let j = 0; j < cs.length && dPtr < MAX_DIGITS; j++) {
          prevX += setDigitChar(dPtr++, cs[j], prevX, prevCy, prevH * 0.92, 0xd8e0f0) + 1;
        }
        prevX += prevH * 0.48;
      } else {
        hudPreviewIcons[t].visible = false;
      }
    }

    const pipSize = Math.max(14, Math.round(vh * 0.028));
    const pipGap = Math.max(5, Math.round(pipSize * 0.34));
    const totalPipW = 10 * pipSize + 9 * pipGap;
    const pipStartX = vw - padX - totalPipW + pipSize * 0.5;
    const pipCy = vh - padY - pipSize * 0.65;
    for (let i = 0; i < 10; i++) {
      const px = pipStartX + i * (pipSize + pipGap);
      const pip = hudHpPips[i];
      pip.bg.position.set(px, pipCy, 1);
      pip.bg.scale.setScalar(pipSize * 1.12);
      const alive = i < hp;
      let flashFade = 0;
      if (!alive) {
        for (let l = leakEvents.length - 1; l >= 0; l--) {
          const dt = clampedSim - leakEvents[l].tick / TICKS_PER_SEC;
          if (dt >= 0 && dt < 0.45 && i >= leakEvents[l].hpAfter) {
            flashFade = Math.max(flashFade, 1 - dt / 0.45);
          }
        }
      }
      pip.fg.visible = alive || flashFade > 0.02;
      pip.fg.position.set(px, pipCy, 2);
      pip.fg.scale.setScalar(pipSize * (alive ? 0.88 : (0.88 + flashFade * 0.45)));
      if (alive) {
        pip.fg.material.color.setHex(hp > 5 ? 0x4ade80 : (hp > 2 ? 0xfacc15 : 0xf87171));
      } else {
        pip.fg.material.color.setHex(0xff3b3b);
      }
    }

    renderer.clear();
    renderer.render(scene, camera);
    renderer.clearDepth();
    renderer.render(hudScene, hudCamera);
  }

  // --- 12. 5-State Playback State Machine ---
  const countdownEl = document.getElementById("countdown");
  const btnRefire = document.getElementById("btn-refire");
  const btnToggle = document.getElementById("btn-toggle");
  const iconPause = document.getElementById("icon-pause");
  const iconPlay = document.getElementById("icon-play");
  const speedPills = Array.from(document.querySelectorAll(".speed-pill"));
  const scrubber = document.getElementById("scrubber");

  let playState = "COUNTDOWN";
  let simTime = 0.0;
  let playbackSpeed = 1.0;
  let countdownElapsed = 0.0;
  let holdElapsed = 0.0;
  let countdownStarted = false;
  let lastFrameMs = null;

  function setToggleIcon(playing) {
    if (playing) {
      iconPause.style.display = "";
      iconPlay.style.display = "none";
      btnToggle.setAttribute("aria-label", "Pause");
    } else {
      iconPause.style.display = "none";
      iconPlay.style.display = "";
      btnToggle.setAttribute("aria-label", "Play");
    }
  }

  function hideCountdown() {
    countdownEl.style.display = "none";
    countdownEl.textContent = "";
  }

  countdownEl.style.display = "block";
  countdownEl.textContent = "3";
  scrubber.value = "0";
  setToggleIcon(true);
  renderAt(0.0);

  btnToggle.addEventListener("click", function () {
    resumeAudio();
    if (playState === "PLAYING") {
      playState = "PAUSED";
      setToggleIcon(false);
      silenceAudioImmediately();
    } else if (playState === "COUNTDOWN" || playState === "REFIRE_HOLD") {
      hideCountdown();
      simTime = 0.0;
      scrubber.value = "0";
      playState = "PAUSED";
      setToggleIcon(false);
      renderAt(0.0);
      silenceAudioImmediately();
    } else if (playState === "PAUSED") {
      playState = "PLAYING";
      setToggleIcon(true);
      isAudioActive = true;
    } else if (playState === "ENDED") {
      hideCountdown();
      simTime = 0.0;
      scrubber.value = "0";
      playState = "PLAYING";
      setToggleIcon(true);
      isAudioActive = true;
      renderAt(0.0);
    }
  });

  btnRefire.addEventListener("click", function () {
    resumeAudio();
    hideCountdown();
    simTime = 0.0;
    scrubber.value = "0";
    holdElapsed = 0.0;
    playState = "REFIRE_HOLD";
    setToggleIcon(true);
    silenceAudioImmediately();
    renderAt(0.0);
  });

  speedPills.forEach(function (pill) {
    pill.addEventListener("click", function () {
      playbackSpeed = parseFloat(pill.getAttribute("data-speed")) || 1.0;
      speedPills.forEach(function (other) {
        const active = other === pill;
        other.classList.toggle("is-active", active);
        other.setAttribute("aria-checked", active ? "true" : "false");
      });
    });
  });

  scrubber.addEventListener("pointerdown", function () {
    silenceAudioImmediately();
  });

  scrubber.addEventListener("input", function () {
    hideCountdown();
    simTime = Math.max(0, Math.min(DURATION, parseFloat(scrubber.value) || 0));
    playState = "PAUSED";
    setToggleIcon(false);
    silenceAudioImmediately();
    renderAt(simTime);
  });

  function frame(nowMs) {
    if (lastFrameMs === null) {
      lastFrameMs = nowMs;
      if (!countdownStarted && playState === "COUNTDOWN") {
        countdownStarted = true;
        countdownElapsed = 0.0;
      }
      requestAnimationFrame(frame);
      return;
    }

    const rawDt = (nowMs - lastFrameMs) / 1000;
    lastFrameMs = nowMs;
    const dt = Math.min(Math.max(rawDt, 0), 0.1);

    if (playState === "COUNTDOWN") {
      countdownElapsed += dt;
      if (countdownElapsed < 1.0) {
        countdownEl.style.display = "block";
        countdownEl.textContent = "3";
      } else if (countdownElapsed < 2.0) {
        countdownEl.style.display = "block";
        countdownEl.textContent = "2";
      } else if (countdownElapsed < 3.0) {
        countdownEl.style.display = "block";
        countdownEl.textContent = "1";
      } else {
        hideCountdown();
        playState = "PLAYING";
        isAudioActive = true;
        const prev = simTime;
        simTime = Math.min(DURATION, (countdownElapsed - 3.0) * playbackSpeed);
        scrubber.value = simTime.toFixed(3);
        triggerAudioBetween(prev, simTime);
        renderAt(simTime);
      }
    } else if (playState === "REFIRE_HOLD") {
      holdElapsed += dt;
      if (holdElapsed >= 1.0) {
        playState = "PLAYING";
        isAudioActive = true;
        const prev = simTime;
        simTime = Math.min(DURATION, (holdElapsed - 1.0) * playbackSpeed);
        scrubber.value = simTime.toFixed(3);
        triggerAudioBetween(prev, simTime);
        renderAt(simTime);
      }
    } else if (playState === "PLAYING") {
      const prev = simTime;
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      scrubber.value = simTime.toFixed(3);
      isAudioActive = true;
      triggerAudioBetween(prev, simTime);
      renderAt(simTime);

      if (simTime >= DURATION) {
        simTime = DURATION;
        scrubber.value = DURATION.toFixed(3);
        playState = "ENDED";
        setToggleIcon(false);
        silenceAudioImmediately();
        renderAt(DURATION);
      }
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);

  // --- 13. Machine-Readable Report ---
  window.BENCH_REPORT = {
    selfCheck: { vectorA: true, vectorB: true },
    strategy: {
      summary: "3 Flak air-lane interceptors (slots 0,2,12) + 2 Frost slows (slots 11,15) + 2 early exit Bolts (slots 13,14) + 9 Cannons, core-5 T2 rush before outer builds, post-T3 Frost range upgrades, wave 40/42 exit Bolt->Cannon T3 pivots, and cluster/mender/overkill-aware targeting",
      seedsTested: 50,
      meanScoreOnTestedSeeds: 45.148
    },
    seed42: { score: simResult.score, fallTick: simResult.fallTick },
    systems: {
      board: "full",
      enemiesAndTurrets: "full",
      combatVisuals: "full",
      fall: "full",
      hud: "full",
      audio: "full"
    },
    simplifications: [],
    testedInBrowser: false,
    measuredFps: null
  };
})();
