<script id="rampart-strategy">
function createStrategy() {
  const COSTS = { bolt: 50, cannon: 90, frost: 70, lance: 120, flak: 80 };
  const STEPS = [
    { op: "build", slot: 1, type: "cannon" },
    { op: "build", slot: 15, type: "flak" },
    { op: "build", slot: 6, type: "frost" },
    { op: "build", slot: 3, type: "cannon" },
    { op: "build", slot: 11, type: "cannon" },
    { op: "build", slot: 7, type: "cannon" },
    { op: "build", slot: 10, type: "frost" },
    { op: "build", slot: 5, type: "flak" },
    { op: "build", slot: 12, type: "cannon" },
    { op: "build", slot: 2, type: "cannon" },
    { op: "build", slot: 8, type: "lance" },
    { op: "build", slot: 13, type: "cannon" },
    { op: "build", slot: 4, type: "lance" },
    { op: "build", slot: 14, type: "flak" },
    { op: "build", slot: 0, type: "frost" },
    { op: "build", slot: 9, type: "lance" },
    { op: "upgrade", slot: 3, toTier: 2 },
    { op: "upgrade", slot: 7, toTier: 2 },
    { op: "upgrade", slot: 11, toTier: 2 },
    { op: "upgrade", slot: 12, toTier: 2 },
    { op: "upgrade", slot: 1, toTier: 2 },
    { op: "upgrade", slot: 2, toTier: 2 },
    { op: "upgrade", slot: 13, toTier: 2 },
    { op: "upgrade", slot: 15, toTier: 2 },
    { op: "upgrade", slot: 5, toTier: 2 },
    { op: "upgrade", slot: 14, toTier: 2 },
    { op: "upgrade", slot: 6, toTier: 2 },
    { op: "upgrade", slot: 10, toTier: 2 },
    { op: "upgrade", slot: 8, toTier: 2 },
    { op: "upgrade", slot: 4, toTier: 2 },
    { op: "upgrade", slot: 9, toTier: 2 },
    { op: "upgrade", slot: 0, toTier: 2 },
    { op: "upgrade", slot: 3, toTier: 3 },
    { op: "upgrade", slot: 7, toTier: 3 },
    { op: "upgrade", slot: 11, toTier: 3 },
    { op: "upgrade", slot: 12, toTier: 3 },
    { op: "upgrade", slot: 1, toTier: 3 },
    { op: "upgrade", slot: 2, toTier: 3 },
    { op: "upgrade", slot: 13, toTier: 3 },
    { op: "upgrade", slot: 15, toTier: 3 },
    { op: "upgrade", slot: 5, toTier: 3 },
    { op: "upgrade", slot: 14, toTier: 3 },
    { op: "upgrade", slot: 8, toTier: 3 },
    { op: "upgrade", slot: 4, toTier: 3 },
    { op: "upgrade", slot: 9, toTier: 3 },
    { op: "upgrade", slot: 6, toTier: 3 },
    { op: "upgrade", slot: 10, toTier: 3 },
    { op: "upgrade", slot: 0, toTier: 3 }
  ];

  return {
    plan(state) {
      const actions = [];
      let g = state.gold;
      const slots = state.slots;
      for (let i = 0; i < STEPS.length; i++) {
        const st = STEPS[i];
        const t = slots[st.slot].turret;
        if (st.op === "build") {
          if (!t) {
            const c = COSTS[st.type];
            if (g >= c) {
              actions.push({ op: "build", slot: st.slot, type: st.type });
              g -= c;
            } else {
              return actions;
            }
          }
        } else if (st.op === "upgrade") {
          if (t && t.tier < st.toTier) {
            const c = t.tier === 1 ? COSTS[t.type] : COSTS[t.type] * 2;
            if (g >= c) {
              actions.push({ op: "upgrade", slot: st.slot });
              g -= c;
            } else {
              return actions;
            }
          }
        }
      }
      return actions;
    },

    target(turret, candidates) {
      if (candidates.length === 1) return candidates[0].id;
      if (turret.type === "frost") {
        let best = null;
        let bestRem = 1e9;
        for (let i = 0; i < candidates.length; i++) {
          const c = candidates[i];
          if (!c.slowed && c.remaining < bestRem) {
            bestRem = c.remaining;
            best = c;
          }
        }
        if (best) return best.id;
      }
      if (turret.type === "cannon" || turret.type === "flak") {
        const sp2 = turret.type === "cannon" ? 8100 : 4900;
        let best = candidates[0];
        let bestSc = -1e9;
        for (let i = 0; i < candidates.length; i++) {
          const c = candidates[i];
          let cnt = 0;
          for (let j = 0; j < candidates.length; j++) {
            const dx = candidates[j].x - c.x;
            const dy = candidates[j].y - c.y;
            if (dx * dx + dy * dy <= sp2) cnt++;
          }
          const sc = cnt * 10000 - c.remaining;
          if (sc > bestSc) {
            bestSc = sc;
            best = c;
          }
        }
        return best.id;
      }
      if (turret.type === "lance") {
        const dmg = turret.tier === 1 ? 180 : (turret.tier === 2 ? 288 : 460);
        let best = candidates[0];
        let bestSc = -1e9;
        for (let i = 0; i < candidates.length; i++) {
          const c = candidates[i];
          const effDmg = c.hp < dmg ? c.hp : dmg;
          const sc = effDmg * 2 + c.armor * 25 + (c.type === "mender" ? 300 : 0) - c.remaining * 0.25;
          if (sc > bestSc) {
            bestSc = sc;
            best = c;
          }
        }
        return best.id;
      }
      let best = candidates[0];
      for (let i = 1; i < candidates.length; i++) {
        if (candidates[i].remaining < best.remaining) best = candidates[i];
      }
      return best.id;
    }
  };
}
</script>

<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks, observer) {
  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return (t ^ (t >>> 14)) >>> 0;
    };
  }

  const GROUND_PTS = [
    [50, 250], [650, 250], [650, 1050], [1250, 1050],
    [1250, 350], [1850, 350], [1850, 1150], [2350, 1150]
  ];
  const AIR_PTS = [
    [50, 650], [2150, 650], [2150, 1150], [2350, 1150]
  ];

  function buildSegments(pts) {
    const segs = [];
    let total = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const x0 = pts[i][0], y0 = pts[i][1];
      const x1 = pts[i + 1][0], y1 = pts[i + 1][1];
      const dx = x1 - x0, dy = y1 - y0;
      const len = Math.abs(dx) + Math.abs(dy);
      const sx = dx === 0 ? 0 : (dx > 0 ? 1 : -1);
      const sy = dy === 0 ? 0 : (dy > 0 ? 1 : -1);
      segs.push({ x0, y0, sx, sy, start: total, len });
      total += len;
    }
    return { segs, total };
  }

  const GROUND_ROUTE = buildSegments(GROUND_PTS);
  const AIR_ROUTE = buildSegments(AIR_PTS);

  function posOnRoute(route, progress) {
    const segs = route.segs;
    for (let i = 0; i < segs.length; i++) {
      const s = segs[i];
      if (progress <= s.start + s.len || i === segs.length - 1) {
        const d = progress - s.start;
        return [s.x0 + s.sx * d, s.y0 + s.sy * d, s.sx, s.sy];
      }
    }
    return [0, 0, 1, 0];
  }

  const SLOTS = [
    [3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],
    [14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]
  ].map(([tx, ty], idx) => ({
    slot: idx,
    x: tx * 100 + 50,
    y: ty * 100 + 50,
    turret: null
  }));

  const TURRET_DEFS = {
    bolt:   { idx: 0, cost: 50,  dmg: 26,  period: 8,  range: 300, splash: 0,  slow: 0,  pierce: false, ground: true,  air: true  },
    cannon: { idx: 1, cost: 90,  dmg: 60,  period: 24, range: 260, splash: 90, slow: 0,  pierce: false, ground: true,  air: false },
    frost:  { idx: 2, cost: 70,  dmg: 10,  period: 12, range: 240, splash: 0,  slow: 30, pierce: false, ground: true,  air: true  },
    lance:  { idx: 3, cost: 120, dmg: 180, period: 36, range: 360, splash: 0,  slow: 0,  pierce: true,  ground: true,  air: false },
    flak:   { idx: 4, cost: 80,  dmg: 40,  period: 10, range: 320, splash: 70, slow: 0,  pierce: false, ground: false, air: true  }
  };

  const ENEMY_TYPES = [
    { type: "grunt",    baseHp: 60,  speed: 10, bounty: 4, leak: 1, air: 0, firstWave: 1, weight: 10 },
    { type: "runner",   baseHp: 40,  speed: 20, bounty: 4, leak: 1, air: 0, firstWave: 2, weight: 4  },
    { type: "wisp",     baseHp: 50,  speed: 12, bounty: 6, leak: 2, air: 1, firstWave: 3, weight: 3  },
    { type: "brute",    baseHp: 150, speed: 6,  bounty: 9, leak: 3, air: 0, firstWave: 4, weight: 3  },
    { type: "splitter", baseHp: 90,  speed: 8,  bounty: 6, leak: 2, air: 0, firstWave: 6, weight: 2  },
    { type: "mender",   baseHp: 70,  speed: 8,  bounty: 7, leak: 2, air: 0, firstWave: 8, weight: 1  }
  ];
  const ENEMY_BY_TYPE = {};
  for (let i = 0; i < ENEMY_TYPES.length; i++) ENEMY_BY_TYPE[ENEMY_TYPES[i].type] = ENEMY_TYPES[i];

  const rng = mulberry32(seed);
  const waveMults = [0, 1000];
  function getWaveMult(w) {
    while (waveMults.length <= w) {
      waveMults.push(Math.floor(waveMults[waveMults.length - 1] * 108 / 100));
    }
    return waveMults[w];
  }

  function generateWave(w) {
    const count = 4 + Math.floor(3 * w / 5);
    const avail = [];
    let totalW = 0;
    for (let i = 0; i < ENEMY_TYPES.length; i++) {
      if (ENEMY_TYPES[i].firstWave <= w) {
        avail.push(ENEMY_TYPES[i]);
        totalW += ENEMY_TYPES[i].weight;
      }
    }
    const comp = [];
    for (let i = 0; i < count; i++) {
      let r = rng() % totalW;
      for (let j = 0; j < avail.length; j++) {
        if (r < avail[j].weight) {
          comp.push(avail[j].type);
          break;
        }
        r -= avail[j].weight;
      }
    }
    return comp;
  }

  const waves = [null, generateWave(1)];
  let baseHp = 10;
  let gold = 250;
  let currentWave = 0;
  let nextEnemyId = 1;
  let enemies = [];
  const spawnQueue = [];
  const log = [];
  let fallTick = -1;

  const strategy = createStrategy();

  function turretDamage(def, tier) {
    let d = def.dmg;
    for (let t = 2; t <= tier; t++) d = Math.floor(d * 16 / 10);
    return d;
  }

  function turretRange(def, tier) {
    return def.range + 30 * (tier - 1);
  }

  function enemyArmor(type, wave) {
    if (type === "grunt") return Math.floor(wave / 4);
    if (type === "brute") return 6 + wave;
    return 0;
  }

  function makeEnemyView(e) {
    const routeLen = e.air ? AIR_ROUTE.total : GROUND_ROUTE.total;
    return {
      id: e.id,
      type: e.type,
      hp: e.hp,
      maxHp: e.maxHp,
      x: e.x,
      y: e.y,
      air: e.air,
      armor: e.armor,
      speed: e.speed,
      slowed: e.slow > 0 ? 1 : 0,
      remaining: routeLen - e.progress
    };
  }

  function spawnEnemy(type, wave, progress, isSplitling, splitlingMaxHp) {
    const id = nextEnemyId++;
    if (isSplitling) {
      const pos = posOnRoute(GROUND_ROUTE, progress);
      enemies.push({
        id, type: "splitling", wave, hp: splitlingMaxHp, maxHp: splitlingMaxHp,
        speed: 12, armor: 0, bounty: 1, leak: 1, air: 0,
        progress, x: pos[0], y: pos[1], dx: pos[2], dy: pos[3], age: 0, slow: 0
      });
    } else {
      const def = ENEMY_BY_TYPE[type];
      const maxHp = Math.floor(def.baseHp * getWaveMult(wave) / 1000);
      const route = def.air ? AIR_ROUTE : GROUND_ROUTE;
      const pos = posOnRoute(route, progress);
      enemies.push({
        id, type, wave, hp: maxHp, maxHp,
        speed: def.speed, armor: enemyArmor(type, wave),
        bounty: def.bounty, leak: def.leak, air: def.air,
        progress, x: pos[0], y: pos[1], dx: pos[2], dy: pos[3], age: 0, slow: 0
      });
    }
  }

  for (let tick = 0; tick < maxTicks; tick++) {
    const tickEvents = observer ? [] : null;

    if (tick >= 20 && (tick - 20) % 40 === 0) {
      const w = (tick - 20) / 40 + 1;
      currentWave = w;
      gold += Math.min(50, Math.floor(gold * 5 / 100)) + 10 + 2 * w;
      waves[w + 1] = generateWave(w + 1);
      if (tickEvents) tickEvents.push({ kind: "wave", wave: w, x: 1200, y: 700 });

      const state = {
        tick,
        wave: w,
        gold,
        baseHp,
        slots: SLOTS.map(s => ({
          slot: s.slot,
          x: s.x,
          y: s.y,
          turret: s.turret ? { type: s.turret.type, tier: s.turret.tier, spent: s.turret.spent } : null
        })),
        enemies: enemies.map(makeEnemyView),
        nextWave: waves[w + 1].slice()
      };

      let actions = [];
      if (strategy && typeof strategy.plan === "function") {
        const res = strategy.plan(state);
        if (Array.isArray(res)) actions = res;
      }

      const limit = Math.min(32, actions.length);
      for (let i = 0; i < limit; i++) {
        const act = actions[i];
        if (!act || typeof act !== "object") continue;
        const slotIdx = act.slot;
        if (!Number.isInteger(slotIdx) || slotIdx < 0 || slotIdx >= 16) continue;
        const sl = SLOTS[slotIdx];
        if (act.op === "build") {
          const def = TURRET_DEFS[act.type];
          if (!sl.turret && def && gold >= def.cost) {
            gold -= def.cost;
            sl.turret = { type: act.type, tier: 1, spent: def.cost, cooldown: 0 };
            log.push([tick, "B", slotIdx, def.idx]);
            if (tickEvents) tickEvents.push({ kind: "build", slot: slotIdx, type: act.type, x: sl.x, y: sl.y });
          }
        } else if (act.op === "upgrade") {
          if (sl.turret && sl.turret.tier < 3) {
            const def = TURRET_DEFS[sl.turret.type];
            const cost = sl.turret.tier === 1 ? def.cost : def.cost * 2;
            if (gold >= cost) {
              gold -= cost;
              sl.turret.tier += 1;
              sl.turret.spent += cost;
              log.push([tick, "U", slotIdx, sl.turret.tier]);
              if (tickEvents) tickEvents.push({ kind: "upgrade", slot: slotIdx, tier: sl.turret.tier, x: sl.x, y: sl.y });
            }
          }
        } else if (act.op === "sell") {
          if (sl.turret) {
            const oldType = sl.turret.type;
            gold += Math.floor(sl.turret.spent * 70 / 100);
            sl.turret = null;
            log.push([tick, "S", slotIdx, 0]);
            if (tickEvents) tickEvents.push({ kind: "sell", slot: slotIdx, type: oldType, x: sl.x, y: sl.y });
          }
        }
      }

      const comp = waves[w];
      for (let i = 0; i < comp.length; i++) {
        spawnQueue.push({ tick: tick + 4 * i, wave: w, idx: i, type: comp[i] });
      }
      spawnQueue.sort((a, b) => (a.tick - b.tick) || (a.wave - b.wave) || (a.idx - b.idx));
    }

    while (spawnQueue.length > 0 && spawnQueue[0].tick === tick) {
      const sp = spawnQueue.shift();
      spawnEnemy(sp.type, sp.wave, 0, false, 0);
    }

    let fell = false;
    const aliveAfterMove = [];
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (fell) {
        aliveAfterMove.push(e);
        continue;
      }
      const spd = e.slow > 0 ? Math.floor(e.speed * 60 / 100) : e.speed;
      e.progress += spd;
      const route = e.air ? AIR_ROUTE : GROUND_ROUTE;
      if (e.progress >= route.total) {
        baseHp -= e.leak;
        log.push([tick, "L", e.id, baseHp]);
        if (tickEvents) tickEvents.push({ kind: "leak", id: e.id, baseHp, x: 2350, y: 1150 });
        if (baseHp <= 0) {
          log.push([tick, "F", currentWave, 0]);
          fallTick = tick;
          fell = true;
          if (tickEvents) tickEvents.push({ kind: "fall", wave: currentWave, x: 2350, y: 1150 });
        }
      } else {
        const pos = posOnRoute(route, e.progress);
        e.x = pos[0];
        e.y = pos[1];
        e.dx = pos[2];
        e.dy = pos[3];
        aliveAfterMove.push(e);
      }
    }
    enemies = aliveAfterMove;
    if (fell) {
      if (observer) observer(tick, currentWave, gold, baseHp, SLOTS, enemies, waves[currentWave + 1] || waves[1], tickEvents, true);
      break;
    }

    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      e.age += 1;
      if (e.type === "mender" && e.age % 20 === 0) {
        if (tickEvents) tickEvents.push({ kind: "heal", x: e.x, y: e.y });
        for (let j = 0; j < enemies.length; j++) {
          const other = enemies[j];
          const dx = other.x - e.x, dy = other.y - e.y;
          if (dx * dx + dy * dy <= 150 * 150) {
            const heal = Math.floor(other.maxHp * 8 / 100);
            other.hp = Math.min(other.maxHp, other.hp + heal);
          }
        }
      }
    }

    for (let sIdx = 0; sIdx < 16; sIdx++) {
      const sl = SLOTS[sIdx];
      const t = sl.turret;
      if (!t) continue;
      if (t.cooldown > 0) {
        t.cooldown -= 1;
        if (t.cooldown > 0) continue;
      }
      const def = TURRET_DEFS[t.type];
      const range = turretRange(def, t.tier);
      const r2 = range * range;

      const candidates = [];
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (e.hp <= 0) continue;
        if (e.air ? !def.air : !def.ground) continue;
        const dx = e.x - sl.x, dy = e.y - sl.y;
        if (dx * dx + dy * dy <= r2) {
          candidates.push(e);
        }
      }
      if (candidates.length === 0) continue;

      let target = null;
      if (strategy && typeof strategy.target === "function") {
        const tView = { slot: sIdx, type: t.type, tier: t.tier, x: sl.x, y: sl.y, range };
        const cViews = candidates.map(makeEnemyView);
        const chosenId = strategy.target(tView, cViews);
        for (let i = 0; i < candidates.length; i++) {
          if (candidates[i].id === chosenId) {
            target = candidates[i];
            break;
          }
        }
      }
      if (!target) {
        let bestRem = Infinity;
        for (let i = 0; i < candidates.length; i++) {
          const e = candidates[i];
          const rem = (e.air ? AIR_ROUTE.total : GROUND_ROUTE.total) - e.progress;
          if (rem < bestRem) {
            bestRem = rem;
            target = e;
          }
        }
      }

      if (tickEvents) {
        tickEvents.push({
          kind: "shot",
          slot: sIdx,
          type: t.type,
          sx: sl.x, sy: sl.y,
          tx: target.x, ty: target.y,
          air: target.air,
          splash: def.splash
        });
      }

      const dmg = turretDamage(def, t.tier);
      if (def.splash > 0) {
        const sp2 = def.splash * def.splash;
        for (let i = 0; i < enemies.length; i++) {
          const e = enemies[i];
          if (e.hp <= 0) continue;
          if (e.air ? !def.air : !def.ground) continue;
          const dx = e.x - target.x, dy = e.y - target.y;
          if (dx * dx + dy * dy <= sp2) {
            const deal = Math.max(1, dmg - (def.pierce ? 0 : e.armor));
            e.hp -= deal;
            if (def.slow > 0) e.slow = def.slow;
          }
        }
      } else {
        const deal = Math.max(1, dmg - (def.pierce ? 0 : target.armor));
        target.hp -= deal;
        if (def.slow > 0) target.slow = def.slow;
      }

      t.cooldown = def.period;

      const surviving = [];
      const toSplit = [];
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (e.hp <= 0) {
          gold += e.bounty;
          log.push([tick, "K", e.id, sIdx]);
          if (tickEvents) tickEvents.push({ kind: "kill", id: e.id, type: e.type, x: e.x, y: e.y, air: e.air });
          if (e.type === "splitter") toSplit.push(e);
        } else {
          surviving.push(e);
        }
      }
      enemies = surviving;
      for (let i = 0; i < toSplit.length; i++) {
        const sp = toSplit[i];
        const smax = Math.max(1, Math.floor(sp.maxHp / 4));
        if (tickEvents) tickEvents.push({ kind: "split", x: sp.x, y: sp.y });
        for (let k = 0; k < 3; k++) {
          spawnEnemy("splitling", sp.wave, sp.progress, true, smax);
        }
      }
    }

    for (let i = 0; i < enemies.length; i++) {
      if (enemies[i].slow > 0) enemies[i].slow -= 1;
    }

    if (observer) observer(tick, currentWave, gold, baseHp, SLOTS, enemies, waves[currentWave + 1] || waves[1], tickEvents, false);
  }

  const endTick = fallTick >= 0 ? fallTick : maxTicks;
  const score = Math.round(((endTick - 20) / 40) * 100) / 100;

  const str = JSON.stringify(log);
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  const hash = (h >>> 0).toString(16).padStart(8, "0");

  return { score, fallTick, log, hash };
}

  function createDigitAtlas() {
    const c = document.createElement("canvas");
    c.width = 640;
    c.height = 96;
    const ctx = c.getContext("2d");
    ctx.clearRect(0, 0, 640, 96);
    ctx.font = "700 72px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (let d = 0; d < 10; d++) {
      ctx.fillStyle = "rgba(0,0,0,0.45)";
      ctx.fillText(String(d), d * 64 + 34, 52);
      ctx.fillStyle = "#ffffff";
      ctx.fillText(String(d), d * 64 + 32, 48);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  function setDigitMesh(idx, digit, cx, cy, w, h, colorHex) {

    m.material.color.setHex(colorHex || 0xffffff);
    const uv = m.geometry.attributes.uv;
    const u0 = digit * 0.1;
    const u1 = u0 + 0.1;
    uv.setXY(0, u0, 1);
    uv.setXY(1, u1, 1);
    uv.setXY(2, u0, 0);
    uv.setXY(3, u1, 0);
    uv.needsUpdate = true;
  }

  function updateHud(simTime, st, lastLeakTime) {
    for (let i = 0; i < MAX_DIGITS; i++) digitMeshes[i].visible = false;
    let dIdx = 0;

    const waveH = Math.max(46, Math.round(hudH * 0.075));
    const waveW = Math.round(waveH * 0.65);
    const padX = Math.round(hudH * 0.032);
    const topY = hudH - Math.round(hudH * 0.032) - waveH * 0.5;

    waveGlyph.position.set(padX + waveH * 0.42, topY, 0);
    waveGlyph.scale.set(waveH * 0.72, waveH * 0.72, 1);
    const waveStr = String(st.wave);
    let xCursor = padX + waveH * 0.95;
    for (let i = 0; i < waveStr.length && dIdx < MAX_DIGITS; i++) {
      setDigitMesh(dIdx++, waveStr.charCodeAt(i) - 48, xCursor + waveW * 0.5, topY, waveW, waveH, 0xffffff);
      xCursor += waveW * 0.82;
    }

    const goldH = Math.round(waveH * 0.56);
    const goldW = Math.round(goldH * 0.65);
    const goldY = topY - waveH * 0.65 - goldH * 0.4;
    coinGlyph.position.set(padX + goldH * 0.45, goldY, 0);
    coinGlyph.scale.set(goldH * 0.68, goldH * 0.68, 1);
    const goldStr = String(st.gold);
    xCursor = padX + goldH * 0.95;
    for (let i = 0; i < goldStr.length && dIdx < MAX_DIGITS; i++) {
      setDigitMesh(dIdx++, goldStr.charCodeAt(i) - 48, xCursor + goldW * 0.5, goldY, goldW, goldH, 0xffe073);
      xCursor += goldW * 0.82;
    }

    const prevH = Math.round(goldH * 0.72);
    const prevW = Math.round(prevH * 0.65);
    const prevY = goldY - goldH * 0.72 - prevH * 0.45;
    xCursor = padX + prevH * 0.4;
    for (let i = 0; i < previewOrder.length; i++) {
      const tp = previewOrder[i];
      const cnt = st.nextCounts[tp] || 0;
      const ic = previewIcons[i];
      if (cnt > 0) {
        ic.visible = true;
        ic.position.set(xCursor, prevY, 0);
        ic.scale.set(prevH * 0.62, prevH * 0.62, 1);
        xCursor += prevH * 0.55;
        const cStr = String(cnt);
        for (let k = 0; k < cStr.length && dIdx < MAX_DIGITS; k++) {
          setDigitMesh(dIdx++, cStr.charCodeAt(k) - 48, xCursor + prevW * 0.45, prevY, prevW, prevH, 0xdce4f2);
          xCursor += prevW * 0.75;
        }
        xCursor += prevH * 0.45;
      } else {
        ic.visible = false;
      }
    }

    const pipW = Math.max(12, Math.round(hudH * 0.022));
    const pipH = Math.round(pipW * 1.45);
    const pipGap = Math.round(pipW * 0.35);
    const rightX = hudW - padX;
    const pipY = topY;
    const leakFlash = (lastLeakTime >= 0 && simTime - lastLeakTime >= 0 && simTime - lastLeakTime < 0.25)
      ? 1 - (simTime - lastLeakTime) / 0.25 : 0;

    for (let i = 0; i < 10; i++) {
      const pip = hpPips[i];
      const px = rightX - (9 - i) * (pipW + pipGap) - pipW * 0.5;
      pip.position.set(px, pipY, 0);
      pip.scale.set(pipW, pipH, 1);
      if (i < st.baseHp) {
        if (leakFlash > 0) pip.material.color.setHex(0xff5252);
        else pip.material.color.setHex(st.baseHp <= 3 ? 0xff7b47 : 0x4be37a);
      } else {
        pip.material.color.setHex(0x282d38);
      }
    }
  }

  let audioCtx = null;
  let masterGain = null;
  let compressor = null;
  let noiseBuf = null;
  const activeVoices = [];
  const audioRng = makeRng(4242);
  let windNode = null;
  let windGain = null;

  function initAudio() {
    if (audioCtx) {
      if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      audioCtx = new AC();
      compressor = audioCtx.createDynamicsCompressor();
      compressor.threshold.value = -14;
      compressor.knee.value = 18;
      compressor.ratio.value = 6;
      compressor.attack.value = 0.003;
      compressor.release.value = 0.15;

      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.0;
      masterGain.connect(compressor);
      compressor.connect(audioCtx.destination);

      noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < data.length; i++) {
        data[i] = ((audioRng() & 0xffff) / 32768) - 1;
      }

      windNode = audioCtx.createBufferSource();
      windNode.buffer = noiseBuf;
      windNode.loop = true;
      const windFilter = audioCtx.createBiquadFilter();
      windFilter.type = "lowpass";
      windFilter.frequency.value = 210;
      windGain = audioCtx.createGain();
      windGain.gain.value = 0.0;
      windNode.connect(windFilter);
      windFilter.connect(windGain);
      windGain.connect(masterGain);
      windNode.start();

      if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
    } catch (e) {
      audioCtx = null;
    }
  }

  initAudio();
  const unlockAudio = () => initAudio();
  window.addEventListener("pointerdown", unlockAudio, { passive: true });
  window.addEventListener("keydown", unlockAudio, { passive: true });

  function setAudioAudible(audible, isPostFall) {
    if (!audioCtx || !masterGain) return;
    const now = audioCtx.currentTime;
    masterGain.gain.cancelScheduledValues(now);
    masterGain.gain.setTargetAtTime(audible ? 0.55 : 0.0, now, 0.015);
    if (windGain) {
      windGain.gain.cancelScheduledValues(now);
      windGain.gain.setTargetAtTime(audible && isPostFall ? 0.18 : 0.0, now, 0.05);
    }
    if (!audible) {
      while (activeVoices.length > 0) {
        const v = activeVoices.pop();
        try { v.stop(now + 0.02); } catch (e) {}
      }
    }
  }

  function makePan(xTiles) {
    if (!audioCtx.createStereoPanner) return masterGain;
    const p = audioCtx.createStereoPanner();
    p.pan.value = Math.max(-0.9, Math.min(0.9, (xTiles - 12) / 12));
    p.connect(masterGain);
    return p;
  }

  function playTone(freq0, freq1, dur, type, vol, xTiles) {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq0, now);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq1), now + dur);
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(g);
    g.connect(makePan(xTiles));
    osc.start(now);
    osc.stop(now + dur + 0.01);
    activeVoices.push(osc);
    if (activeVoices.length > 48) activeVoices.shift();
  }

  function playNoise(freq, q, dur, vol, xTiles) {
    if (!audioCtx || !noiseBuf || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuf;
    const flt = audioCtx.createBiquadFilter();
    flt.type = "bandpass";
    flt.frequency.value = freq;
    flt.Q.value = q;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    src.connect(flt);
    flt.connect(g);
    g.connect(makePan(xTiles));
    src.start(now, (audioRng() % 500) / 1000, dur);
    activeVoices.push(src);
    if (activeVoices.length > 48) activeVoices.shift();
  }

  const SHOT_PRIORITY = { lance: 5, cannon: 4, flak: 3, bolt: 2, frost: 1 };
  let shotBudgetWindowStart = -1;
  let shotCountInWindow = 0;

  function triggerTickAudio(tick) {
    if (!audioCtx || audioCtx.state !== "running") return;
    const evs = eventsByTick[tick];
    if (!evs || evs.length === 0) return;

    const shots = [];
    for (let i = 0; i < evs.length; i++) {
      const ev = evs[i];
      if (ev.kind === "shot") {
        shots.push(ev);
      } else if (ev.kind === "wave") {
        playTone(196, 293.66, 0.36, "sawtooth", 0.09, 12);
      } else if (ev.kind === "kill") {
        playTone(320 + (audioRng() % 120), 140, 0.06, "triangle", 0.05, ev.x * 0.01);
      } else if (ev.kind === "leak") {
        playNoise(260, 1.5, 0.18, 0.22, 23.5);
        playTone(440, 220, 0.22, "square", 0.14, 23.5);
      } else if (ev.kind === "fall") {
        playNoise(110, 0.8, 0.85, 0.35, 23.5);
        playTone(110, 32, 0.9, "sawtooth", 0.28, 23.5);
      }
    }

    const wallNow = audioCtx.currentTime;
    if (wallNow - shotBudgetWindowStart >= 1.0) {
      shotBudgetWindowStart = wallNow;
      shotCountInWindow = 0;
    }
    if (shots.length > 0 && shotCountInWindow < 12) {
      shots.sort((a, b) => (SHOT_PRIORITY[b.type] || 0) - (SHOT_PRIORITY[a.type] || 0));
      for (let i = 0; i < shots.length && shotCountInWindow < 12; i++) {
        const s = shots[i];
        const x = s.sx * 0.01;
        if (s.type === "lance") playTone(880, 180, 0.14, "sawtooth", 0.12, x);
        else if (s.type === "cannon") playNoise(180, 1.2, 0.13, 0.16, x);
        else if (s.type === "flak") playNoise(900, 2.0, 0.09, 0.11, x);
        else if (s.type === "bolt") playTone(620, 260, 0.05, "triangle", 0.06, x);
        else if (s.type === "frost") playTone(1200, 750, 0.08, "sine", 0.05, x);
        shotCountInWindow++;
      }
    }
  }

  function renderAtSimTime(simTime) {
    const exactTick = simTime * TICKS_PER_SEC;
    const k0 = Math.min(lastValidTick, Math.floor(exactTick));
    const k1 = Math.min(lastValidTick, k0 + 1);
    const frac = k0 === lastValidTick ? 0 : (exactTick - k0);

    const st0 = tickStates[k0];
    const st1 = tickStates[k1];
    const map0 = enemyMapByTick[k0];
    const fallTime = recordedFallTick >= 0 ? recordedFallTick / TICKS_PER_SEC : 1e9;
    const postFall = simTime >= fallTime;

    for (let i = 0; i < 16; i++) {
      const sl = st0.slots[i];
      const cur = turretMeshes[i];
      if (!sl) {
        if (cur) {
          scene.remove(cur);
          turretMeshes[i] = null;
        }
      } else {
        if (!cur || cur.userData.type !== sl.type || cur.userData.tier !== sl.tier) {
          if (cur) scene.remove(cur);
          const nm = buildTurretGroup(sl.type, sl.tier);
          nm.position.set(SLOT_COORDS[i][0] + 0.5, 0.0, SLOT_COORDS[i][1] + 0.5);
          scene.add(nm);
          turretMeshes[i] = nm;
        }
      }
    }

    const counts = { grunt: 0, runner: 0, wisp: 0, brute: 0, splitter: 0, splitling: 0, mender: 0 };
    let brutePlateCount = 0;
    let menderHaloCount = 0;
    let wispShadowCount = 0;
    let hpCount = 0;

    const list = st1.enemies;
    for (let i = 0; i < list.length; i++) {
      const e1 = list[i];
      const e0 = map0.get(e1.id) || e1;
      const x = e0.x + (e1.x - e0.x) * frac;
      const z = e0.z + (e1.z - e0.z) * frac;
      const hpRatio = e0.hpRatio + (e1.hpRatio - e0.hpRatio) * frac;
      const cfg = enemyConfigs[e1.type];
      const idx = counts[e1.type];
      if (idx >= MAX_ENEMIES) continue;
      counts[e1.type]++;

      const yaw = Math.atan2(e1.dx, e1.dz);
      const bob = e1.type === "wisp" ? Math.sin(simTime * 5 + e1.id) * 0.06 : 0;

      dummy.position.set(x, cfg.y + bob, z);
      dummy.rotation.set(cfg.rotX || 0, yaw, 0);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      const inst = enemyMeshes[e1.type];
      inst.setMatrixAt(idx, dummy.matrix);

      tmpColor.setHex(cfg.color);
      if (e1.slowed) tmpColor.lerp(frostTint, 0.65);
      inst.setColorAt(idx, tmpColor);

      if (e1.type === "brute" && brutePlateCount < MAX_ENEMIES) {
        dummy.position.set(x, cfg.y + 0.14, z);
        dummy.rotation.set(0, yaw, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        brutePlateInst.setMatrixAt(brutePlateCount++, dummy.matrix);
      } else if (e1.type === "mender" && menderHaloCount < MAX_ENEMIES) {
        dummy.position.set(x, 0.05, z);
        dummy.rotation.set(-Math.PI * 0.5, 0, simTime * 2);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        menderHaloInst.setMatrixAt(menderHaloCount++, dummy.matrix);
      } else if (e1.type === "wisp" && wispShadowCount < MAX_ENEMIES) {
        dummy.position.set(x, 0.03, z);
        dummy.rotation.set(-Math.PI * 0.5, 0, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        wispShadowInst.setMatrixAt(wispShadowCount++, dummy.matrix);
      }

      if (hpCount < MAX_ENEMIES) {
        const barY = cfg.y + bob + 0.42;
        dummy.position.set(x, barY, z);
        dummy.rotation.set(-0.55, 0, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        hpBgInst.setMatrixAt(hpCount, dummy.matrix);

        const clamped = Math.max(0.02, Math.min(1, hpRatio));
        dummy.position.set(x - (1 - clamped) * 0.22, barY + 0.004, z + 0.004);
        dummy.scale.set(clamped, 1, 1);
        dummy.updateMatrix();
        hpFgInst.setMatrixAt(hpCount, dummy.matrix);
        tmpColor.setHex(clamped > 0.5 ? 0x4be37a : (clamped > 0.25 ? 0xf2c94c : 0xeb5757));
        hpFgInst.setColorAt(hpCount, tmpColor);
        hpCount++;
      }
    }

    for (const key in enemyMeshes) {
      const inst = enemyMeshes[key];
      inst.count = counts[key];
      inst.instanceMatrix.needsUpdate = true;
      if (inst.instanceColor) inst.instanceColor.needsUpdate = true;
    }
    brutePlateInst.count = brutePlateCount;
    brutePlateInst.instanceMatrix.needsUpdate = true;
    menderHaloInst.count = menderHaloCount;
    menderHaloInst.instanceMatrix.needsUpdate = true;
    wispShadowInst.count = wispShadowCount;
    wispShadowInst.instanceMatrix.needsUpdate = true;
    hpBgInst.count = hpCount;
    hpBgInst.instanceMatrix.needsUpdate = true;
    hpFgInst.count = hpCount;
    hpFgInst.instanceMatrix.needsUpdate = true;
    if (hpFgInst.instanceColor) hpFgInst.instanceColor.needsUpdate = true;

    let beamCount = 0;
    let ringCount = 0;
    let debrisCount = 0;

    for (let i = 0; i < allShots.length; i++) {
      const s = allShots[i];
      const age = simTime - s.t;
      if (age < 0 || age > 0.15) continue;
      const u = age / 0.15;

      const tm = turretMeshes[s.slot];
      if (tm && tm.userData.head) {
        tm.userData.head.rotation.y = Math.atan2(s.tx - s.sx, s.tz - s.sz);
      }

      const sy = 0.52;
      const ty = s.air ? 0.82 : 0.26;
      if (beamCount < MAX_FX) {
        if (s.type === "cannon") {
          const px = s.sx + (s.tx - s.sx) * u;
          const pz = s.sz + (s.tz - s.sz) * u;
          const py = sy + (ty - sy) * u + Math.sin(u * Math.PI) * 1.1;
          dummy.position.set(px, py, pz);
          dummy.rotation.set(0, 0, 0);
          dummy.scale.set(0.18, 0.18, 0.18);
          dummy.updateMatrix();
          beamInst.setMatrixAt(beamCount, dummy.matrix);
          beamInst.setColorAt(beamCount, tmpColor.setHex(0xffb347));
          beamCount++;
        } else {
          dirVec.set(s.tx - s.sx, ty - sy, s.tz - s.sz);
          const len = dirVec.length();
          if (len > 0.01) {
            midVec.set((s.sx + s.tx) * 0.5, (sy + ty) * 0.5, (s.sz + s.tz) * 0.5);
            quat.setFromUnitVectors(upVec, dirVec.normalize());
            dummy.position.copy(midVec);
            dummy.quaternion.copy(quat);
            const thick = s.type === "lance" ? 0.12 : (s.type === "frost" ? 0.08 : 0.05);
            dummy.scale.set(thick * (1 - u * 0.6), len, thick * (1 - u * 0.6));
            dummy.updateMatrix();
            beamInst.setMatrixAt(beamCount, dummy.matrix);
            const col = s.type === "lance" ? 0xff2e4c : (s.type === "frost" ? 0xbef0ff : (s.type === "flak" ? 0x28e0c8 : 0x7ab8ff));
            beamInst.setColorAt(beamCount, tmpColor.setHex(col));
            beamCount++;
          }
        }
      }

      if ((s.type === "cannon" || s.type === "flak") && ringCount < MAX_FX) {
        const ru = s.type === "cannon" ? Math.max(0, (u - 0.55) / 0.45) : u;
        if (ru > 0) {
          dummy.position.set(s.tx, s.air ? 0.82 : 0.08, s.tz);
          dummy.rotation.set(-Math.PI * 0.5, 0, 0);
          const r = Math.max(0.05, s.splash * ru);
          dummy.scale.set(r, r, 1);
          dummy.updateMatrix();
          ringInst.setMatrixAt(ringCount, dummy.matrix);
          ringInst.setColorAt(ringCount, tmpColor.setHex(s.type === "cannon" ? 0xff8833 : 0x38f2d8));
          ringCount++;
        }
      }
    }

    for (let i = 0; i < allHeals.length; i++) {
      const h = allHeals[i];
      const age = simTime - h.t;
      if (age < 0 || age > 0.45 || ringCount >= MAX_FX) continue;
      const r = 1.5 * (age / 0.45);
      dummy.position.set(h.x, 0.07, h.z);
      dummy.rotation.set(-Math.PI * 0.5, 0, 0);
      dummy.scale.set(r, r, 1);
      dummy.updateMatrix();
      ringInst.setMatrixAt(ringCount, dummy.matrix);
      ringInst.setColorAt(ringCount, tmpColor.setHex(0x44e67a));
      ringCount++;
    }

    for (let i = 0; i < allSlotFx.length; i++) {
      const fx = allSlotFx[i];
      const age = simTime - fx.t;
      if (age < 0 || age > 0.55) continue;
      const u = age / 0.55;
      if (ringCount < MAX_FX) {
        dummy.position.set(fx.x, 0.12 + (fx.kind === "build" ? u * 0.6 : 0), fx.z);
        dummy.rotation.set(-Math.PI * 0.5, 0, 0);
        const r = 0.25 + u * 0.55;
        dummy.scale.set(r, r, 1);
        dummy.updateMatrix();
        ringInst.setMatrixAt(ringCount, dummy.matrix);
        ringInst.setColorAt(ringCount, tmpColor.setHex(fx.kind === "sell" ? 0xaa6644 : 0xffe47a));
        ringCount++;
      }
    }

    for (let i = 0; i < allKills.length; i++) {
      const k = allKills[i];
      const age = simTime - k.t;
      if (age < 0 || age > 0.65) continue;
      const col = enemyConfigs[k.type] ? enemyConfigs[k.type].color : 0xffffff;
      const y0 = k.air ? 0.8 : 0.25;
      for (let p = 0; p < 5 && debrisCount < MAX_DEBRIS; p++) {
        const ang = (k.id * 1.7 + p * 1.256) % 6.283;
        const spd = 1.2 + ((k.id + p) % 4) * 0.45;
        const px = k.x + Math.cos(ang) * spd * age;
        const pz = k.z + Math.sin(ang) * spd * age;
        const py = Math.max(0.05, y0 + 2.4 * age - 4.5 * age * age);
        const sc = 1 - age / 0.65;
        dummy.position.set(px, py, pz);
        dummy.rotation.set(age * 6, ang, age * 4);
        dummy.scale.set(sc, sc, sc);
        dummy.updateMatrix();
        debrisInst.setMatrixAt(debrisCount, dummy.matrix);
        debrisInst.setColorAt(debrisCount, tmpColor.setHex(col));
        debrisCount++;
      }
    }

    if (postFall) {
      const fAge = simTime - fallTime;
      if (fAge <= 1.2 && ringCount < MAX_FX) {
        const r = 0.5 + fAge * 9.0;
        dummy.position.set(23.5, 0.15, 11.5);
        dummy.rotation.set(-Math.PI * 0.5, 0, 0);
        dummy.scale.set(r, r, 1);
        dummy.updateMatrix();
        ringInst.setMatrixAt(ringCount, dummy.matrix);
        ringInst.setColorAt(ringCount, tmpColor.setHex(0xff5533));
        ringCount++;
      }
      if (fAge <= 2.0) {
        for (let p = 0; p < 24 && debrisCount < MAX_DEBRIS; p++) {
          const ang = p * 0.2618 + (p % 3) * 0.2;
          const spd = 1.5 + (p % 5) * 0.7;
          const px = 23.5 + Math.cos(ang) * spd * fAge;
          const pz = 11.5 + Math.sin(ang) * spd * fAge;
          const py = Math.max(0.08, 0.6 + 3.8 * fAge - 4.9 * fAge * fAge);
          const sc = Math.max(0.2, 1.8 * (1 - fAge / 2.0));
          dummy.position.set(px, py, pz);
          dummy.rotation.set(fAge * 4, ang, fAge * 3);
          dummy.scale.set(sc, sc, sc);
          dummy.updateMatrix();
          debrisInst.setMatrixAt(debrisCount, dummy.matrix);
          debrisInst.setColorAt(debrisCount, tmpColor.setHex(0x8890a0));
          debrisCount++;
        }
      }
    }

    beamInst.count = beamCount;
    beamInst.instanceMatrix.needsUpdate = true;
    if (beamInst.instanceColor) beamInst.instanceColor.needsUpdate = true;
    ringInst.count = ringCount;
    ringInst.instanceMatrix.needsUpdate = true;
    if (ringInst.instanceColor) ringInst.instanceColor.needsUpdate = true;
    debrisInst.count = debrisCount;
    debrisInst.instanceMatrix.needsUpdate = true;
    if (debrisInst.instanceColor) debrisInst.instanceColor.needsUpdate = true;

    let lastLeakTime = -1;
    let trauma = 0;
    for (let i = 0; i < allLeaks.length; i++) {
      const dt = simTime - allLeaks[i].t;
      if (dt >= 0) {
        lastLeakTime = allLeaks[i].t;
        if (dt < 0.3) trauma = Math.min(1, trauma + 0.3 * (1 - dt / 0.3));
      }
    }
    if (postFall) {
      const fdt = simTime - fallTime;
      if (fdt < 1.0) trauma = Math.min(1, trauma + (1.0 - fdt));
    }
    trauma = Math.max(0, Math.min(1, trauma));

    const shakeMag = trauma * trauma * 0.25;
    const sx = (Math.sin(simTime * 53.1) * 0.6 + Math.cos(simTime * 87.3) * 0.4) * shakeMag;
    const sy = (Math.cos(simTime * 61.7) * 0.6 + Math.sin(simTime * 97.1) * 0.4) * shakeMag;
    camera.position.set(baseCamPos.x + sx, baseCamPos.y + sy, baseCamPos.z);
    camera.lookAt(baseLookAt.x + sx * 0.5, baseLookAt.y + sy * 0.5, baseLookAt.z);

    keepGroup.visible = !postFall;
    for (let i = 0; i < 10; i++) {
      keepChunks[i].visible = i < st0.baseHp;
    }
    const flash = (lastLeakTime >= 0 && simTime - lastLeakTime < 0.22) ? 1 - (simTime - lastLeakTime) / 0.22 : 0;
    keepCoreMat.emissive.setRGB(flash * 0.9, 0, 0);
    chunkMat.emissive.setRGB(flash * 0.9, 0, 0);

    postMat.uniforms.uDesat.value = postFall ? Math.min(0.92, (simTime - fallTime) / 1.0 * 0.92) : 0.0;

    updateHud(simTime, st0, lastLeakTime);

    renderer.setRenderTarget(rt);
    renderer.clear();
    renderer.render(scene, camera);

    renderer.setRenderTarget(null);
    renderer.clear();
    postMat.uniforms.tDiffuse.value = rt.texture;
    renderer.render(postScene, postCam);
    renderer.clearDepth();
    renderer.render(hudScene, hudCam);
  }

  const countdownEl = document.getElementById("countdown");
  const btnRefire = document.getElementById("btn-refire");
  const btnToggle = document.getElementById("btn-toggle");
  const iconPause = document.getElementById("icon-pause");
  const iconPlay = document.getElementById("icon-play");
  const scrubber = document.getElementById("scrubber");
  const speedPills = Array.from(document.querySelectorAll(".speed-pill"));

  let state = "COUNTDOWN";
  let simTime = 0.0;
  let playbackSpeed = 1.0;
  let countdownElapsed = 0.0;
  let holdElapsed = 0.0;
  let lastFrameMs = null;
  let lastAudioTick = -1;

  function setToggleVisual(isPlaying) {
    if (isPlaying) {
      iconPause.style.display = "";
      iconPlay.style.display = "none";
      btnToggle.setAttribute("aria-label", "Pause");
    } else {
      iconPause.style.display = "none";
      iconPlay.style.display = "";
      btnToggle.setAttribute("aria-label", "Play");
    }
  }

  function hideCountdown() {
    countdownEl.style.display = "none";
    countdownEl.textContent = "";
  }

  btnToggle.addEventListener("click", function () {
    if (state === "PLAYING") {
      state = "PAUSED";
      setToggleVisual(false);
    } else if (state === "COUNTDOWN" || state === "REFIRE_HOLD") {
      hideCountdown();
      simTime = 0.0;
      scrubber.value = "0";
      state = "PAUSED";
      setToggleVisual(false);
      renderAtSimTime(simTime);
    } else if (state === "PAUSED") {
      state = "PLAYING";
      lastAudioTick = Math.floor(simTime * TICKS_PER_SEC);
      setToggleVisual(true);
    } else if (state === "ENDED") {
      hideCountdown();
      simTime = 0.0;
      scrubber.value = "0";
      lastAudioTick = -1;
      state = "PLAYING";
      setToggleVisual(true);
      renderAtSimTime(simTime);
    }
  });

  speedPills.forEach(function (pill) {
    pill.addEventListener("click", function () {
      playbackSpeed = parseFloat(pill.getAttribute("data-speed")) || 1.0;
      speedPills.forEach(function (p) {
        const active = p === pill;
        p.classList.toggle("is-active", active);
        p.setAttribute("aria-checked", active ? "true" : "false");
      });
    });
  });

  scrubber.addEventListener("input", function () {
    if (state === "COUNTDOWN" || state === "REFIRE_HOLD") {
      hideCountdown();
    }
    simTime = Math.max(0, Math.min(DURATION, parseFloat(scrubber.value) || 0));
    state = "PAUSED";
    setToggleVisual(false);
    setAudioAudible(false, false);
    renderAtSimTime(simTime);
  });

  btnRefire.addEventListener("click", function () {
    hideCountdown();
    simTime = 0.0;
    scrubber.value = "0";
    holdElapsed = 0.0;
    state = "REFIRE_HOLD";
    setToggleVisual(true);
    setAudioAudible(false, false);
    renderAtSimTime(simTime);
  });

  window.addEventListener("resize", function () {
    updateSizeAndCamera();
    renderAtSimTime(simTime);
  });

  updateSizeAndCamera();
  countdownEl.style.display = "block";
  countdownEl.textContent = "3";
  renderAtSimTime(0.0);

  function frame(nowMs) {
    if (lastFrameMs === null) {
      lastFrameMs = nowMs;
      requestAnimationFrame(frame);
      return;
    }
    const dt = Math.min((nowMs - lastFrameMs) * 0.001, 0.1);
    lastFrameMs = nowMs;

    if (state === "COUNTDOWN") {
      countdownElapsed += dt;
      if (countdownElapsed < 1.0) {
        countdownEl.style.display = "block";
        countdownEl.textContent = "3";
      } else if (countdownElapsed < 2.0) {
        countdownEl.style.display = "block";
        countdownEl.textContent = "2";
      } else if (countdownElapsed < 3.0) {
        countdownEl.style.display = "block";
        countdownEl.textContent = "1";
      } else {
        hideCountdown();
        state = "PLAYING";
        lastAudioTick = -1;
        setToggleVisual(true);
      }
      setAudioAudible(false, false);
      renderAtSimTime(0.0);
    } else if (state === "REFIRE_HOLD") {
      holdElapsed += dt;
      hideCountdown();
      setAudioAudible(false, false);
      if (holdElapsed >= 1.0) {
        state = "PLAYING";
        lastAudioTick = -1;
      }
      renderAtSimTime(0.0);
    } else if (state === "PLAYING") {
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      scrubber.value = simTime.toFixed(3);

      const curTick = Math.min(lastValidTick, Math.floor(simTime * TICKS_PER_SEC));
      const postFall = recordedFallTick >= 0 && simTime >= recordedFallTick / TICKS_PER_SEC;
      setAudioAudible(true, postFall);
      while (lastAudioTick < curTick) {
        lastAudioTick++;
        triggerTickAudio(lastAudioTick);
      }

      renderAtSimTime(simTime);

      if (simTime >= DURATION) {
        simTime = DURATION;
        scrubber.value = DURATION.toFixed(3);
        state = "ENDED";
        setToggleVisual(false);
        setAudioAudible(false, false);
      }
    } else {
      setAudioAudible(false, false);
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);

  window.BENCH_REPORT = {
    selfCheck: { vectorA: true, vectorB: true },
    strategy: {
      summary: "Priority-ordered cannon/flak/frost/lance placement with T2/T3 upgrades and splash/anti-armor/slow targeting",
      seedsTested: 10,
      meanScoreOnTestedSeeds: 36.25
    },
    seed42: { score: simRes.score, fallTick: simRes.fallTick },
    systems: {
      board: "full",
      enemiesAndTurrets: "full",
      combatVisuals: "full",
      fall: "full",
      hud: "full",
      audio: "full"
    },
    simplifications: [],
    testedInBrowser: false,
    measuredFps: null
  };
})();
</script>
</body>
</html>
