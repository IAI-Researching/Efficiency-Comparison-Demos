<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Last Rampart</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>

<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>

  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>

  <span class="dock-sep" aria-hidden="true"></span>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script id="rampart-strategy">
function createStrategy() {
  const COST = { bolt: 50, cannon: 90, frost: 70, lance: 120, flak: 80 };
  const STEPS = [
    { op: "build", slot: 3, type: "cannon" },
    { op: "build", slot: 6, type: "frost" },
    { op: "build", slot: 1, type: "cannon" },
    { op: "build", slot: 10, type: "flak" },
    { op: "build", slot: 8, type: "lance" },
    { op: "build", slot: 7, type: "cannon" },
    { op: "build", slot: 12, type: "lance" },
    { op: "build", slot: 14, type: "flak" },
    { op: "build", slot: 13, type: "lance" },
    { op: "build", slot: 11, type: "cannon" },
    { op: "build", slot: 5, type: "frost" },
    { op: "build", slot: 4, type: "cannon" },
    { op: "upgrade", slot: 8 },
    { op: "upgrade", slot: 12 },
    { op: "upgrade", slot: 3 },
    { op: "upgrade", slot: 7 },
    { op: "upgrade", slot: 10 },
    { op: "build", slot: 2, type: "cannon" },
    { op: "build", slot: 9, type: "lance" },
    { op: "build", slot: 0, type: "cannon" },
    { op: "upgrade", slot: 13 },
    { op: "upgrade", slot: 14 },
    { op: "upgrade", slot: 1 },
    { op: "upgrade", slot: 11 },
    { op: "upgrade", slot: 4 },
    { op: "upgrade", slot: 2 },
    { op: "upgrade", slot: 9 },
    { op: "upgrade", slot: 0 },
    { op: "upgrade", slot: 8 },
    { op: "upgrade", slot: 12 },
    { op: "upgrade", slot: 13 },
    { op: "upgrade", slot: 3 },
    { op: "upgrade", slot: 7 },
    { op: "upgrade", slot: 10 },
    { op: "upgrade", slot: 14 },
    { op: "upgrade", slot: 11 },
    { op: "upgrade", slot: 1 },
    { op: "upgrade", slot: 4 },
    { op: "upgrade", slot: 9 },
    { op: "upgrade", slot: 2 },
    { op: "upgrade", slot: 0 }
  ];

  return {
    plan(state) {
      const actions = [];
      let g = state.gold;
      for (let i = 0; i < STEPS.length; i++) {
        const st = STEPS[i];
        const t = state.slots[st.slot].turret;
        if (st.op === "build") {
          if (!t) {
            const c = COST[st.type];
            if (g >= c) {
              actions.push({ op: "build", slot: st.slot, type: st.type });
              g -= c;
            } else {
              break;
            }
          }
        } else if (st.op === "upgrade") {
          const targetTier = i >= 28 ? 3 : 2;
          if (t && t.tier < targetTier) {
            const c = t.tier === 1 ? COST[t.type] : COST[t.type] * 2;
            if (g >= c) {
              actions.push({ op: "upgrade", slot: st.slot });
              g -= c;
            } else {
              break;
            }
          }
        }
      }
      return actions.slice(0, 32);
    },

    target(turret, candidates) {
      if (candidates.length === 1) return candidates[0].id;
      if (turret.type === "frost") {
        let bestU = null;
        let bestA = candidates[0];
        for (let i = 0; i < candidates.length; i++) {
          const c = candidates[i];
          if (c.remaining < bestA.remaining) bestA = c;
          if (!c.slowed && (!bestU || c.remaining < bestU.remaining)) bestU = c;
        }
        return (bestU || bestA).id;
      }
      if (turret.type === "cannon" || turret.type === "flak") {
        const spSq = turret.type === "cannon" ? 8100 : 4900;
        let best = candidates[0];
        let bestScore = -1e9;
        for (let i = 0; i < candidates.length; i++) {
          const a = candidates[i];
          let hits = 0;
          for (let j = 0; j < candidates.length; j++) {
            const b = candidates[j];
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            if (dx * dx + dy * dy <= spSq) hits++;
          }
          const sc = hits * 100 + (a.remaining < 500 ? 20 : 0) - a.remaining * 0.01;
          if (sc > bestScore) {
            bestScore = sc;
            best = a;
          }
        }
        return best.id;
      }
      if (turret.type === "lance") {
        let best = candidates[0];
        let bestScore = -1e9;
        for (let i = 0; i < candidates.length; i++) {
          const c = candidates[i];
          let sc = c.hp + c.armor * 15 - c.remaining * 0.05;
          if (c.type === "mender") sc += 300;
          if (c.remaining < 450) sc += 2000 - c.remaining;
          if (sc > bestScore) {
            bestScore = sc;
            best = c;
          }
        }
        return best.id;
      }
      let best = candidates[0];
      for (let i = 1; i < candidates.length; i++) {
        if (candidates[i].remaining < best.remaining) best = candidates[i];
      }
      return best.id;
    }
  };
}
</script>

<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks) {
  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return (t ^ (t >>> 14)) >>> 0;
    };
  }

  const GROUND_PTS = [
    [50, 250], [650, 250], [650, 1050], [1250, 1050],
    [1250, 350], [1850, 350], [1850, 1150], [2350, 1150]
  ];
  const AIR_PTS = [
    [50, 650], [2150, 650], [2150, 1150], [2350, 1150]
  ];

  function buildSegments(pts) {
    const segs = [];
    let total = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const x0 = pts[i][0], y0 = pts[i][1];
      const x1 = pts[i + 1][0], y1 = pts[i + 1][1];
      const dx = x1 - x0, dy = y1 - y0;
      const len = Math.abs(dx) + Math.abs(dy);
      segs.push({ x0, y0, x1, y1, dx: Math.sign(dx), dy: Math.sign(dy), start: total, len });
      total += len;
    }
    return { segs, total };
  }

  const GROUND_ROUTE = buildSegments(GROUND_PTS);
  const AIR_ROUTE = buildSegments(AIR_PTS);

  function posOnRoute(route, progress) {
    const segs = route.segs;
    for (let i = 0; i < segs.length; i++) {
      const s = segs[i];
      if (progress <= s.start + s.len) {
        const d = progress - s.start;
        return [s.x0 + s.dx * d, s.y0 + s.dy * d];
      }
    }
    const last = segs[segs.length - 1];
    return [last.x1, last.y1];
  }

  const SLOT_COORDS = [
    [3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],
    [14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]
  ];

  const TURRET_TYPES = {
    bolt:   { idx: 0, cost: 50,  dmg: 26,  period: 8,  range: 300, splash: 0,  slow: 0,  pierce: false, ground: true,  air: true },
    cannon: { idx: 1, cost: 90,  dmg: 60,  period: 24, range: 260, splash: 90, slow: 0,  pierce: false, ground: true,  air: false },
    frost:  { idx: 2, cost: 70,  dmg: 10,  period: 12, range: 240, splash: 0,  slow: 30, pierce: false, ground: true,  air: true },
    lance:  { idx: 3, cost: 120, dmg: 180, period: 36, range: 360, splash: 0,  slow: 0,  pierce: true,  ground: true,  air: false },
    flak:   { idx: 4, cost: 80,  dmg: 40,  period: 10, range: 320, splash: 70, slow: 0,  pierce: false, ground: false, air: true }
  };

  const ENEMY_TYPES = [
    { name: "grunt",    hp: 60,  speed: 10, bounty: 4, leak: 1, air: 0, firstWave: 1, weight: 10 },
    { name: "runner",   hp: 40,  speed: 20, bounty: 4, leak: 1, air: 0, firstWave: 2, weight: 4 },
    { name: "wisp",     hp: 50,  speed: 12, bounty: 6, leak: 2, air: 1, firstWave: 3, weight: 3 },
    { name: "brute",    hp: 150, speed: 6,  bounty: 9, leak: 3, air: 0, firstWave: 4, weight: 3 },
    { name: "splitter", hp: 90,  speed: 8,  bounty: 6, leak: 2, air: 0, firstWave: 6, weight: 2 },
    { name: "mender",   hp: 70,  speed: 8,  bounty: 7, leak: 2, air: 0, firstWave: 8, weight: 1 }
  ];

  const ENEMY_MAP = {};
  for (let i = 0; i < ENEMY_TYPES.length; i++) ENEMY_MAP[ENEMY_TYPES[i].name] = ENEMY_TYPES[i];

  const rng = mulberry32(seed >>> 0);

  const hpMult = [0, 1000];
  function getMult(w) {
    while (hpMult.length <= w) {
      hpMult.push(Math.floor(hpMult[hpMult.length - 1] * 108 / 100));
    }
    return hpMult[w];
  }

  function generateWave(w) {
    const count = 4 + Math.floor(3 * w / 5);
    const avail = [];
    let totalWeight = 0;
    for (let i = 0; i < ENEMY_TYPES.length; i++) {
      if (ENEMY_TYPES[i].firstWave <= w) {
        avail.push(ENEMY_TYPES[i]);
        totalWeight += ENEMY_TYPES[i].weight;
      }
    }
    const list = [];
    for (let i = 0; i < count; i++) {
      let r = rng() % totalWeight;
      for (let j = 0; j < avail.length; j++) {
        if (r < avail[j].weight) {
          list.push(avail[j].name);
          break;
        }
        r -= avail[j].weight;
      }
    }
    return list;
  }

  const slots = SLOT_COORDS.map((c, idx) => ({
    slot: idx,
    x: c[0] * 100 + 50,
    y: c[1] * 100 + 50,
    turret: null
  }));

  let gold = 250;
  let baseHp = 10;
  let currentWave = 0;
  let nextEnemyId = 1;
  let enemies = [];
  const spawnQueue = [];
  const log = [];
  let fallTick = -1;

  const strategy = createStrategy();
  let pendingWaveComp = generateWave(1);

  function enemyArmor(typeName, w) {
    if (typeName === "grunt") return Math.floor(w / 4);
    if (typeName === "brute") return 6 + w;
    return 0;
  }

  function spawnEnemy(typeName, w, progress) {
    const id = nextEnemyId++;
    let maxHp, speed, bounty, leak, air, armor;
    if (typeName === "splitling") {
      speed = 12; bounty = 1; leak = 1; air = 0; armor = 0; maxHp = 1;
    } else {
      const def = ENEMY_MAP[typeName];
      maxHp = Math.floor(def.hp * getMult(w) / 1000);
      speed = def.speed;
      bounty = def.bounty;
      leak = def.leak;
      air = def.air;
      armor = enemyArmor(typeName, w);
    }
    const route = air ? AIR_ROUTE : GROUND_ROUTE;
    const pos = posOnRoute(route, progress);
    return {
      id, type: typeName, wave: w, hp: maxHp, maxHp,
      speed, bounty, leak, air, armor, progress,
      x: pos[0], y: pos[1], remaining: route.total - progress,
      age: 0, slow: 0
    };
  }

  function makeEnemyView(e) {
    return {
      id: e.id, type: e.type, hp: e.hp, maxHp: e.maxHp,
      x: e.x, y: e.y, air: e.air, armor: e.armor,
      speed: e.speed, slowed: e.slow > 0, remaining: e.remaining
    };
  }

  function makeStateView(tick, wave, nextWaveComp) {
    return {
      tick, wave, gold, baseHp,
      slots: slots.map(s => ({
        slot: s.slot, x: s.x, y: s.y,
        turret: s.turret ? { type: s.turret.type, tier: s.turret.tier, spent: s.turret.spent } : null
      })),
      enemies: enemies.map(makeEnemyView),
      nextWave: nextWaveComp.slice()
    };
  }

  function applyActions(tick, actions) {
    if (!Array.isArray(actions)) return;
    const limit = Math.min(32, actions.length);
    for (let i = 0; i < limit; i++) {
      const act = actions[i];
      if (!act || typeof act !== "object") continue;
      const slIdx = act.slot;
      if (typeof slIdx !== "number" || slIdx < 0 || slIdx >= 16 || (slIdx | 0) !== slIdx) continue;
      const sl = slots[slIdx];
      if (act.op === "build") {
        if (sl.turret !== null) continue;
        const tdef = TURRET_TYPES[act.type];
        if (!tdef || gold < tdef.cost) continue;
        gold -= tdef.cost;
        sl.turret = {
          slot: slIdx, type: act.type, tier: 1, spent: tdef.cost,
          dmg: tdef.dmg, range: tdef.range, period: tdef.period,
          splash: tdef.splash, slow: tdef.slow, pierce: tdef.pierce,
          ground: tdef.ground, air: tdef.air, cooldown: 0
        };
        log.push([tick, "B", slIdx, tdef.idx]);
      } else if (act.op === "upgrade") {
        const t = sl.turret;
        if (!t || t.tier >= 3) continue;
        const tdef = TURRET_TYPES[t.type];
        const upgCost = t.tier === 1 ? tdef.cost : tdef.cost * 2;
        if (gold < upgCost) continue;
        gold -= upgCost;
        t.spent += upgCost;
        t.tier += 1;
        t.dmg = Math.floor(t.dmg * 16 / 10);
        t.range += 30;
        log.push([tick, "U", slIdx, t.tier]);
      } else if (act.op === "sell") {
        const t = sl.turret;
        if (!t) continue;
        gold += Math.floor(t.spent * 70 / 100);
        sl.turret = null;
        log.push([tick, "S", slIdx, 0]);
      }
    }
  }

  for (let tick = 0; tick < maxTicks; tick++) {
    if (tick >= 20 && (tick - 20) % 40 === 0) {
      const w = 1 + Math.floor((tick - 20) / 40);
      currentWave = w;
      gold += Math.min(50, Math.floor(gold * 5 / 100)) + 10 + 2 * w;
      const thisWaveComp = pendingWaveComp;
      const nextWaveComp = generateWave(w + 1);
      pendingWaveComp = nextWaveComp;

      applyActions(tick, strategy.plan(makeStateView(tick, w, nextWaveComp)));

      for (let i = 0; i < thisWaveComp.length; i++) {
        spawnQueue.push({ tick: tick + 4 * i, wave: w, idx: i, type: thisWaveComp[i] });
      }
      spawnQueue.sort((a, b) => (a.tick - b.tick) || (a.wave - b.wave) || (a.idx - b.idx));
    }

    while (spawnQueue.length > 0 && spawnQueue[0].tick === tick) {
      const item = spawnQueue.shift();
      enemies.push(spawnEnemy(item.type, item.wave, 0));
    }

    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      const step = e.slow > 0 ? Math.floor(e.speed * 60 / 100) : e.speed;
      e.progress += step;
      const route = e.air ? AIR_ROUTE : GROUND_ROUTE;
      if (e.progress >= route.total) {
        baseHp -= e.leak;
        log.push([tick, "L", e.id, baseHp]);
        enemies.splice(i, 1);
        i--;
        if (baseHp <= 0) {
          fallTick = tick;
          log.push([tick, "F", currentWave, 0]);
          break;
        }
      } else {
        const pos = posOnRoute(route, e.progress);
        e.x = pos[0];
        e.y = pos[1];
        e.remaining = route.total - e.progress;
      }
    }
    if (fallTick !== -1) break;

    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      e.age += 1;
      if (e.type === "mender" && e.age % 20 === 0) {
        for (let j = 0; j < enemies.length; j++) {
          const ally = enemies[j];
          const dx = ally.x - e.x, dy = ally.y - e.y;
          if (dx * dx + dy * dy <= 22500) {
            ally.hp = Math.min(ally.maxHp, ally.hp + Math.floor(ally.maxHp * 8 / 100));
          }
        }
      }
    }

    for (let s = 0; s < 16; s++) {
      const sl = slots[s];
      const t = sl.turret;
      if (!t) continue;
      if (t.cooldown > 0) {
        t.cooldown -= 1;
        if (t.cooldown > 0) continue;
      }
      const rSq = t.range * t.range;
      const candidates = [];
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (e.air ? !t.air : !t.ground) continue;
        const dx = e.x - sl.x, dy = e.y - sl.y;

    ctx.fillStyle = "#222630";
    ctx.fillRect(0, 0, 512, 512);
    const rng = mulberry32(4201);
    for (let i = 0; i < 3200; i++) {
      const x = rng() % 512, y = rng() % 512;
      const s = 1 + (rng() % 3);
      const v = 28 + (rng() % 22);
      ctx.fillStyle = `rgb(${v},${v + 3},${v + 9})`;
      ctx.fillRect(x, y, s, s);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(6, 3.5);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  function createHudAtlas() {
    const c = document.createElement("canvas");
    c.width = 1024; c.height = 128;
    const ctx = c.getContext("2d");
    ctx.clearRect(0, 0, 1024, 128);

    ctx.fillStyle = "#ffffff";
    ctx.font = "700 84px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (let d = 0; d < 10; d++) {
      ctx.fillText(String(d), d * 64 + 32, 66);
    }

    ctx.save();
    ctx.translate(672, 64);
    ctx.strokeStyle = "#e2e8f0";
    ctx.lineWidth = 6;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-20, 20); ctx.lineTo(20, -20);
    ctx.moveTo(20, 20); ctx.lineTo(-20, -20);
    ctx.stroke();
    ctx.fillStyle = "#94a3b8";
    ctx.fillRect(-16, 10, 10, 10);
    ctx.fillRect(6, 10, 10, 10);
    ctx.restore();

    ctx.save();
    ctx.translate(736, 64);
    ctx.fillStyle = "#fbbf24";
    ctx.beginPath();
    ctx.arc(0, 0, 22, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#f59e0b";
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.fillStyle = "#fef3c7";
    ctx.fillRect(-3, -10, 6, 20);
    ctx.restore();

    const eColors = ["#6b8e6b", "#f5d033", "#38f2ff", "#ff7a1a", "#9b4dca", "#f4f7fa"];
    for (let i = 0; i < 6; i++) {
      ctx.save();
      ctx.translate((12 + i) * 64 + 32, 64);
      ctx.fillStyle = eColors[i];
      ctx.beginPath();
      if (i === 1) {
        ctx.moveTo(0, -18); ctx.lineTo(18, 16); ctx.lineTo(-18, 16); ctx.closePath();
      } else if (i === 2) {
        ctx.moveTo(0, -20); ctx.lineTo(18, 0); ctx.lineTo(0, 20); ctx.lineTo(-18, 0); ctx.closePath();
      } else if (i === 3) {
        ctx.rect(-18, -18, 36, 36);
      } else {
        ctx.arc(0, 0, 17, 0, Math.PI * 2);
      }
      ctx.fill();
      ctx.restore();
    }

    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    return tex;
  }

  function setHudQuad(idx, cell, cx, cy, w, h, colorHex, opacity) {
    if (idx >= MAX_HUD_SPRITES) return idx;
    const q = hudQuads[idx];
    const u0 = (cell * 64) / 1024;
    const u1 = ((cell + 1) * 64) / 1024;
    const uv = q.geo.attributes.uv;
    uv.setXY(0, u0, 1);
    uv.setXY(1, u1, 1);
    uv.setXY(2, u0, 0);
    uv.setXY(3, u1, 0);
    uv.needsUpdate = true;
    q.mesh.visible = true;
    q.mesh.position.set(cx, cy, 0);
    q.mesh.scale.set(w, h, 1);
    q.mat.color.setHex(colorHex);
    q.mat.opacity = opacity;
    return idx + 1;

    if (!AudioCtx) return null;
    const ctx = new AudioCtx();
    if (ctx.state === "suspended") ctx.resume().catch(() => {});

    const masterGain = ctx.createGain();
    masterGain.gain.value = 0.0;
    const compressor = ctx.createDynamicsCompressor();
    compressor.threshold.value = -14;
    compressor.knee.value = 18;
    compressor.ratio.value = 6;
    compressor.attack.value = 0.003;
    compressor.release.value = 0.15;
    masterGain.connect(compressor);
    compressor.connect(ctx.destination);

    const arng = mulberry32(4242);
    const noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const ndata = noiseBuf.getChannelData(0);
    for (let i = 0; i < ndata.length; i++) ndata[i] = (arng() / 4294967296) * 2 - 1;

    const activeNodes = new Set();
    let windNode = null;

    function unlock() {
      if (ctx.state === "suspended") ctx.resume().catch(() => {});
    }
    window.addEventListener("pointerdown", unlock, { passive: true });
    window.addEventListener("keydown", unlock, { passive: true });

    function reg(node, stopTime) {
      activeNodes.add(node);
      node.onended = () => activeNodes.delete(node);
      node.stop(stopTime);
    }

    function makePan(xCenti) {
      if (!ctx.createStereoPanner) return masterGain;
      const p = ctx.createStereoPanner();
      p.pan.value = Math.max(-0.85, Math.min(0.85, (xCenti / 2400) * 2 - 1));
      p.connect(masterGain);
      return p;
    }

    function playShot(type, xCenti) {
      const now = ctx.currentTime;
      const dest = makePan(xCenti);
      const g = ctx.createGain();
      g.connect(dest);

      if (type === "lance") {
        const osc = ctx.createOscillator();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.14);
        g.gain.setValueAtTime(0.22, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.connect(g);
        osc.start(now);
        reg(osc, now + 0.16);
      } else if (type === "cannon") {
        const osc = ctx.createOscillator();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(42, now + 0.16);
        g.gain.setValueAtTime(0.28, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.17);
        osc.connect(g);
        osc.start(now);
        reg(osc, now + 0.18);
      } else if (type === "flak") {
        const src = ctx.createBufferSource();
        src.buffer = noiseBuf;
        const bp = ctx.createBiquadFilter();
        bp.type = "bandpass";
        bp.frequency.value = 1400;
        g.gain.setValueAtTime(0.16, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
        src.connect(bp); bp.connect(g);
        src.start(now, (arng() % 1000) / 2000);
        reg(src, now + 0.1);
      } else if (type === "bolt") {
        const osc = ctx.createOscillator();
        osc.type = "square";
        osc.frequency.setValueAtTime(620, now);
        osc.frequency.exponentialRampToValueAtTime(260, now + 0.06);
        g.gain.setValueAtTime(0.09, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.065);
        osc.connect(g);
        osc.start(now);
        reg(osc, now + 0.07);
      } else {
        const osc = ctx.createOscillator();
        osc.type = "sine";
        osc.frequency.setValueAtTime(1350, now);
        osc.frequency.exponentialRampToValueAtTime(980, now + 0.08);
        g.gain.setValueAtTime(0.08, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
        osc.connect(g);
        osc.start(now);
        reg(osc, now + 0.1);
      }
    }

    function playKill(xCenti) {
      const now = ctx.currentTime;
      const g = ctx.createGain();
      g.connect(makePan(xCenti));
      const osc = ctx.createOscillator();
      osc.type = "sine";
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.exponentialRampToValueAtTime(180, now + 0.05);
      g.gain.setValueAtTime(0.08, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.055);
      osc.connect(g);
      osc.start(now);
      reg(osc, now + 0.06);
    }

    function playWaveHorn() {
      const now = ctx.currentTime;
      const g = ctx.createGain();
      g.connect(masterGain);
      const osc = ctx.createOscillator();
      osc.type = "sawtooth";
      const lp = ctx.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.value = 600;
      osc.frequency.setValueAtTime(146.8, now);
      osc.frequency.linearRampToValueAtTime(220.0, now + 0.25);
      g.gain.setValueAtTime(0.001, now);
      g.gain.linearRampToValueAtTime(0.14, now + 0.06);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
      osc.connect(lp); lp.connect(g);
      osc.start(now);
      reg(osc, now + 0.4);
    }

    function playLeak() {
      const now = ctx.currentTime;
      const dest = makePan(2350);
      const src = ctx.createBufferSource();
      src.buffer = noiseBuf;
      const lp = ctx.createBiquadFilter();
      lp.type = "lowpass"; lp.frequency.value = 900;
      const g1 = ctx.createGain();
      g1.gain.setValueAtTime(0.32, now);
      g1.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
      src.connect(lp); lp.connect(g1); g1.connect(dest);
      src.start(now);
      reg(src, now + 0.19);

      const osc = ctx.createOscillator();
      osc.type = "square";
      osc.frequency.setValueAtTime(340, now);
      osc.frequency.setValueAtTime(260, now + 0.1);
      const g2 = ctx.createGain();
      g2.gain.setValueAtTime(0.14, now);
      g2.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
      osc.connect(g2); g2.connect(dest);
      osc.start(now);
      reg(osc, now + 0.25);
    }

    function playFall() {
      const now = ctx.currentTime;
      const src = ctx.createBufferSource();
      src.buffer = noiseBuf;
      const lp = ctx.createBiquadFilter();
      lp.type = "lowpass"; lp.frequency.value = 280;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.55, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 1.1);
      src.connect(lp); lp.connect(g); g.connect(masterGain);
      src.start(now);
      reg(src, now + 1.15);

      const osc = ctx.createOscillator();
      osc.type = "sine";
      osc.frequency.setValueAtTime(95, now);
      osc.frequency.exponentialRampToValueAtTime(28, now + 0.9);
      const g2 = ctx.createGain();
      g2.gain.setValueAtTime(0.45, now);
      g2.gain.exponentialRampToValueAtTime(0.001, now + 0.95);
      osc.connect(g2); g2.connect(masterGain);
      osc.start(now);
      reg(osc, now + 1.0);
    }

    function setWind(active) {
      if (active && !windNode) {
        const src = ctx.createBufferSource();
        src.buffer = noiseBuf;
        src.loop = true;
        const bp = ctx.createBiquadFilter();
        bp.type = "bandpass";
        bp.frequency.value = 190;
        bp.Q.value = 1.4;
        const g = ctx.createGain();
        g.gain.value = 0.12;
        src.connect(bp); bp.connect(g); g.connect(masterGain);
        src.start();
        windNode = src;
      } else if (!active && windNode) {
        try { windNode.stop(); } catch (e) {}
        windNode = null;
      }
    }

    function setAudible(on) {
      const now = ctx.currentTime;
      masterGain.gain.cancelScheduledValues(now);
      masterGain.gain.setTargetAtTime(on ? 0.65 : 0.0, now, 0.015);
      if (!on) {
        setWind(false);
        activeNodes.forEach(n => { try { n.stop(now + 0.02); } catch (e) {} });
        activeNodes.clear();
      }
    }

    const SHOT_PRIO = { lance: 5, cannon: 4, flak: 3, bolt: 2, frost: 1 };
    let shotWindowStart = 0;
    let shotsInWindow = 0;

    function triggerTickRange(prevTick, currTick, wallNow, isFallen) {
      if (currTick <= prevTick) return;
      if (wallNow - shotWindowStart > 1.0) {
        shotWindowStart = wallNow;
        shotsInWindow = 0;
      }
      if (isFallen) {
        setWind(true);
        return;
      }
      setWind(false);

      for (let i = 0; i < replay.waveStarts.length; i++) {
        const ws = replay.waveStarts[i];
        if (ws.tick > prevTick && ws.tick <= currTick) playWaveHorn();
      }
      for (let i = 0; i < replay.leaks.length; i++) {
        const lk = replay.leaks[i];
        if (lk.tick > prevTick && lk.tick <= currTick) playLeak();
      }
      if (replay.fallTick > prevTick && replay.fallTick <= currTick) {
        playFall();
        setWind(true);
        return;
      }
      let killCount = 0;
      for (let i = 0; i < replay.kills.length && killCount < 3; i++) {
        const k = replay.kills[i];
        if (k.tick > prevTick && k.tick <= currTick) {
          playKill(k.x);
          killCount++;
        }
      }
      const pendingShots = [];
      for (let i = 0; i < replay.shots.length; i++) {
        const sh = replay.shots[i];
        if (sh.tick > prevTick && sh.tick <= currTick) pendingShots.push(sh);
      }
      if (pendingShots.length > 0 && shotsInWindow < 12) {
        pendingShots.sort((a, b) => (SHOT_PRIO[b.type] || 0) - (SHOT_PRIO[a.type] || 0));
        const allow = Math.min(pendingShots.length, 12 - shotsInWindow);
        for (let i = 0; i < allow; i++) {
          playShot(pendingShots[i].type, pendingShots[i].sx);
          shotsInWindow++;
        }
      }
    }

    return { setAudible, triggerTickRange };
  })();

  const tmpColor = new THREE.Color();
  const frostTint = new THREE.Color(0x7fd8ff);
  const upVec = new THREE.Vector3(0, 1, 0);
  const beamDir = new THREE.Vector3();
  const beamStart = new THREE.Vector3();
  const beamEnd = new THREE.Vector3();
  const beamMid = new THREE.Vector3();
  const beamQuat = new THREE.Quaternion();

  function renderAtSimTime(simTime) {
    const fTick = simTime * TICKS_PER_SEC;
    const k = Math.min(MAX_TICKS - 2, Math.max(0, Math.floor(fTick)));
    const alpha = Math.max(0, Math.min(1, fTick - k));
    const snapA = replay.ticks[k];
    const snapB = replay.ticks[k + 1];

    const fallTime = replay.fallTick >= 0 ? replay.fallTick / TICKS_PER_SEC : 1e9;
    const isFallen = simTime >= fallTime;
    const effectiveAlpha = isFallen ? 0 : alpha;

    let trauma = 0;
    for (let i = 0; i < replay.leaks.length; i++) {
      const lt = replay.leaks[i].tick / TICKS_PER_SEC;
      if (simTime >= lt) {
        const rem = 0.3 - (simTime - lt);
        if (rem > 0) trauma += rem;
      }
    }
    if (isFallen) {
      const rem = 1.0 - (simTime - fallTime);
      if (rem > 0) trauma += rem;
    }
    trauma = Math.min(1.0, trauma);
    const shakeMag = trauma * trauma * 0.25;
    const sx = (Math.sin(simTime * 53.7) * 0.6 + Math.cos(simTime * 89.3) * 0.4) * shakeMag;
    const sy = (Math.cos(simTime * 61.1) * 0.6 + Math.sin(simTime * 97.9) * 0.4) * shakeMag;
    camera.position.set(baseCamPos.x + sx, baseCamPos.y + sy, baseCamPos.z);
    camera.lookAt(baseLookAt.x + sx * 0.5, baseLookAt.y, baseLookAt.z);

    const lostHp = 10 - snapA.baseHp;
    let leakFlash = 0;
    for (let i = 0; i < replay.leaks.length; i++) {
      const lt = replay.leaks[i].tick / TICKS_PER_SEC;
      if (simTime >= lt && simTime - lt < 0.25) {
        leakFlash = Math.max(leakFlash, 1.0 - (simTime - lt) / 0.25);
      }
    }
    keepMat.emissive.setRGB(leakFlash * 0.85, 0, 0);
    keepBeacon.rotation.y = simTime * 1.8;
    keepTower.visible = !isFallen;
    keepBeacon.visible = !isFallen;

    for (let i = 0; i < 10; i++) {
      const ch = keepChunks[i];
      if (isFallen) {
        ch.mesh.visible = false;
      } else if (i < lostHp) {
        const lk = replay.leaks.find(l => (10 - l.baseHp) > i);
        const dt = lk ? Math.max(0, simTime - lk.tick / TICKS_PER_SEC) : 1;
        if (dt < 0.65) {
          ch.mesh.visible = true;
          ch.mesh.position.copy(ch.basePos).addScaledVector(ch.dir, dt * 3.5);
          ch.mesh.position.y -= 4.5 * dt * dt;
          ch.mesh.rotation.set(ch.baseRot.x + dt * 5, ch.baseRot.y + dt * 4, ch.baseRot.z);
        } else {
          ch.mesh.visible = false;
        }
      } else {
        ch.mesh.visible = true;
        ch.mesh.position.copy(ch.basePos);
        ch.mesh.rotation.copy(ch.baseRot);
      }
    }

    for (let s = 0; s < 16; s++) {
      const tA = snapA.turrets[s];
      const sv = slotVisuals[s];
      for (let ti = 0; ti < TURRET_KEYS.length; ti++) {
        const key = TURRET_KEYS[ti];
        const tv = sv.byType[key];
        if (tA && tA.type === key) {
          tv.group.visible = true;
          tv.head.rotation.y = tA.yaw;
          for (let p = 0; p < 3; p++) tv.pips[p].visible = p < tA.tier;
        } else {
          tv.group.visible = false;
        }
      }
    }

    const counts = { grunt: 0, runner: 0, wisp: 0, brute: 0, splitter: 0, splitling: 0, mender: 0 };
    let bruteCnt = 0, wispCnt = 0, menderCnt = 0, hpCnt = 0;

    for (let i = 0; i < snapA.enemies.length; i++) {
      const eA = snapA.enemies[i];
      const eB = snapB.enemyById.get(eA.id);
      const ex = (eB ? eA.x + (eB.x - eA.x) * effectiveAlpha : eA.x) / 100;
      const ez = (eB ? eA.y + (eB.y - eA.y) * effectiveAlpha : eA.y) / 100;
      const yaw = Math.atan2(eA.dx, eA.dy);

      const bucket = enemyInsts[eA.type];
      const idx = counts[eA.type];
      if (bucket && idx < MAX_INST) {
        dummy.position.set(ex, bucket.cfg.yOff, ez);
        dummy.rotation.set(bucket.cfg.rotX || 0, yaw, 0);
        if (eA.type === "wisp") {
          dummy.position.y += Math.sin(simTime * 5 + eA.id) * 0.08;
          dummy.rotation.y = simTime * 2.5 + eA.id;
        }
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        bucket.inst.setMatrixAt(idx, dummy.matrix);
        tmpColor.copy(bucket.baseColor);
        if (eA.slowed) tmpColor.lerp(frostTint, 0.55);
        bucket.inst.setColorAt(idx, tmpColor);
        counts[eA.type]++;
      }

      if (eA.type === "brute" && bruteCnt < MAX_INST) {
        dummy.position.set(ex, 0.44, ez);
        dummy.rotation.set(0, yaw, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        brutePlateInst.setMatrixAt(bruteCnt++, dummy.matrix);
      } else if (eA.type === "wisp" && wispCnt < MAX_INST) {
        dummy.position.set(ex, 0.05, ez);
        dummy.rotation.set(-Math.PI / 2, 0, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        wispShadowInst.setMatrixAt(wispCnt++, dummy.matrix);
      } else if (eA.type === "mender" && menderCnt < MAX_INST) {
        dummy.position.set(ex, 0.07, ez);
        dummy.rotation.set(-Math.PI / 2, 0, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        menderHaloInst.setMatrixAt(menderCnt++, dummy.matrix);
      }

      if (hpCnt < MAX_HP_BARS) {
        const barY = eA.air ? 1.25 : 0.72;
        const frac = Math.max(0.02, eA.hp / eA.maxHp);
        dummy.position.set(ex, barY, ez);
        dummy.quaternion.copy(camera.quaternion);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        hpBgInst.setMatrixAt(hpCnt, dummy.matrix);

        dummy.position.set(ex - (1 - frac) * 0.23, barY, ez + 0.002);
        dummy.scale.set(frac, 1, 1);
        dummy.updateMatrix();
        hpFillInst.setMatrixAt(hpCnt, dummy.matrix);
        tmpColor.setHex(frac > 0.5 ? 0x4be37a : frac > 0.25 ? 0xfbbf24 : 0xef4444);
        hpFillInst.setColorAt(hpCnt, tmpColor);
        hpCnt++;
      }
    }

    for (const typeName in enemyInsts) {
      const b = enemyInsts[typeName];
      b.inst.count = counts[typeName];
      b.inst.instanceMatrix.needsUpdate = true;
      if (b.inst.instanceColor) b.inst.instanceColor.needsUpdate = true;
    }
    brutePlateInst.count = bruteCnt; brutePlateInst.instanceMatrix.needsUpdate = true;
    wispShadowInst.count = wispCnt; wispShadowInst.instanceMatrix.needsUpdate = true;
    menderHaloInst.count = menderCnt; menderHaloInst.instanceMatrix.needsUpdate = true;
    hpBgInst.count = hpCnt; hpBgInst.instanceMatrix.needsUpdate = true;
    hpFillInst.count = hpCnt; hpFillInst.instanceMatrix.needsUpdate = true;
    if (hpFillInst.instanceColor) hpFillInst.instanceColor.needsUpdate = true;

    let beamCnt = 0, ringCnt = 0, shellCnt = 0, debrisCnt = 0;

    for (let i = 0; i < replay.shots.length; i++) {
      const sh = replay.shots[i];
      const st = sh.tick / TICKS_PER_SEC;
      if (st > simTime || simTime - st > 0.15) continue;
      const u = (simTime - st) / 0.15;
      const sxw = sh.sx / 100, szw = sh.sy / 100;
      const txw = sh.tx / 100, tzw = sh.ty / 100;
      const tyw = sh.targetAir ? 0.8 : 0.25;

      if (sh.type === "cannon") {
        if (u < 0.7 && shellCnt < MAX_SHELLS) {
          const su = u / 0.7;
          const arcY = 0.45 * (1 - su) + tyw * su + Math.sin(su * Math.PI) * 0.9;
          dummy.position.set(sxw + (txw - sxw) * su, arcY, szw + (tzw - szw) * su);
          dummy.rotation.set(0, 0, 0);
          dummy.scale.set(1, 1, 1);
          dummy.updateMatrix();
          shellInst.setMatrixAt(shellCnt++, dummy.matrix);
        }
        if (u >= 0.5 && ringCnt < MAX_RINGS) {
          const ru = (u - 0.5) / 0.5;
          const r = 0.9 * (0.25 + 0.75 * ru);
          dummy.position.set(txw, 0.08, tzw);
          dummy.rotation.set(-Math.PI / 2, 0, 0);
          dummy.scale.set(r, r, 1);
          dummy.updateMatrix();
          ringInst.setMatrixAt(ringCnt, dummy.matrix);
          ringInst.setColorAt(ringCnt, tmpColor.setHex(0xffa94d));
          ringCnt++;
        }
      } else if (sh.type === "flak") {
        if (ringCnt < MAX_RINGS) {
          const r = 0.7 * (0.2 + 0.8 * u);
          dummy.position.set(txw, 0.8, tzw);
          dummy.rotation.set(-Math.PI / 2, 0, 0);
          dummy.scale.set(r, r, 1);
          dummy.updateMatrix();
          ringInst.setMatrixAt(ringCnt, dummy.matrix);
          ringInst.setColorAt(ringCnt, tmpColor.setHex(0x2ec4b6));
          ringCnt++;
        }
        if (beamCnt < MAX_BEAMS) {
          beamStart.set(sxw, 0.55, szw);
          beamEnd.set(txw, 0.8, tzw);
          const len = beamStart.distanceTo(beamEnd);
          beamMid.addVectors(beamStart, beamEnd).multiplyScalar(0.5);
          beamDir.subVectors(beamEnd, beamStart).normalize();
          beamQuat.setFromUnitVectors(upVec, beamDir);
          dummy.position.copy(beamMid);
          dummy.quaternion.copy(beamQuat);
          dummy.scale.set(0.025, len, 0.025);
          dummy.updateMatrix();
          beamInst.setMatrixAt(beamCnt, dummy.matrix);
          beamInst.setColorAt(beamCnt, tmpColor.setHex(0x2ec4b6));
          beamCnt++;
        }
      } else if (beamCnt < MAX_BEAMS) {
        beamStart.set(sxw, 0.55, szw);
        beamEnd.set(txw, tyw, tzw);
        const len = beamStart.distanceTo(beamEnd);
        beamMid.addVectors(beamStart, beamEnd).multiplyScalar(0.5);
        beamDir.subVectors(beamEnd, beamStart).normalize();
        beamQuat.setFromUnitVectors(upVec, beamDir);
        const rad = sh.type === "lance" ? 0.065 * (1 - u * 0.5) : sh.type === "frost" ? 0.038 : 0.022;
        dummy.position.copy(beamMid);
        dummy.quaternion.copy(beamQuat);
        dummy.scale.set(rad, len, rad);
        dummy.updateMatrix();
        beamInst.setMatrixAt(beamCnt, dummy.matrix);
        beamInst.setColorAt(beamCnt, tmpColor.setHex(TURRET_COLORS[sh.type]));
        beamCnt++;
      }
    }

    for (let i = 0; i < replay.heals.length; i++) {
      const h = replay.heals[i];
      const ht = h.tick / TICKS_PER_SEC;
      if (ht > simTime || simTime - ht > 0.35 || ringCnt >= MAX_RINGS) continue;
      const u = (simTime - ht) / 0.35;
      const r = 1.5 * (0.2 + 0.8 * u);
      dummy.position.set(h.x / 100, 0.09, h.y / 100);
      dummy.rotation.set(-Math.PI / 2, 0, 0);
      dummy.scale.set(r, r, 1);
      dummy.updateMatrix();
      ringInst.setMatrixAt(ringCnt, dummy.matrix);
      ringInst.setColorAt(ringCnt, tmpColor.setHex(0x3ee878));
      ringCnt++;
    }

    for (let i = 0; i < replay.builds.length; i++) {
      const b = replay.builds[i];
      const bt = b.tick / TICKS_PER_SEC;
      if (bt > simTime || simTime - bt > 0.4 || ringCnt >= MAX_RINGS) continue;
      const u = (simTime - bt) / 0.4;
      const [sxC, syC] = SLOT_COORDS[b.slot];
      const r = 0.25 + 0.55 * u;
      dummy.position.set(sxC + 0.5, 0.14 + u * 0.35, syC + 0.5);
      dummy.rotation.set(-Math.PI / 2, 0, 0);
      dummy.scale.set(r, r, 1);
      dummy.updateMatrix();
      ringInst.setMatrixAt(ringCnt, dummy.matrix);
      ringInst.setColorAt(ringCnt, tmpColor.setHex(b.op === "S" ? 0xef4444 : 0xfbbf24));
      ringCnt++;
    }

    for (let i = 0; i < replay.kills.length; i++) {
      const kl = replay.kills[i];
      const kt = kl.tick / TICKS_PER_SEC;
      if (kt > simTime || simTime - kt > 0.55) continue;
      const dt = simTime - kt;
      const colHex = enemyConfigs[kl.type] ? enemyConfigs[kl.type].color : 0xffffff;
      const pieces = kl.type === "splitter" ? 6 : 4;
      for (let p = 0; p < pieces && debrisCnt < MAX_DEBRIS; p++) {
        const ang = hashFloat(42, kl.id * 17 + p) * Math.PI * 2;
        const spd = 1.2 + hashFloat(42, kl.id * 31 + p) * 2.0;
        const vy = 2.0 + hashFloat(42, kl.id * 43 + p) * 1.8;
        const px = kl.x / 100 + Math.cos(ang) * spd * dt;
        const pz = kl.y / 100 + Math.sin(ang) * spd * dt;
        const py = Math.max(0.04, (kl.air ? 0.8 : 0.25) + vy * dt - 4.8 * dt * dt);
        const sc = Math.max(0.1, 1 - dt / 0.55);
        dummy.position.set(px, py, pz);
        dummy.rotation.set(dt * 8, ang, dt * 6);
        dummy.scale.set(sc, sc, sc);
        dummy.updateMatrix();
        debrisInst.setMatrixAt(debrisCnt, dummy.matrix);
        debrisInst.setColorAt(debrisCnt, tmpColor.setHex(colHex));
        debrisCnt++;
      }
    }

    if (isFallen) {
      const dt = simTime - fallTime;
      if (dt < 1.2 && ringCnt < MAX_RINGS) {
        const r = 0.5 + dt * 9.0;
        dummy.position.set(23.5, 0.15, 11.5);
        dummy.rotation.set(-Math.PI / 2, 0, 0);
        dummy.scale.set(r, r, 1);
        dummy.updateMatrix();
        ringInst.setMatrixAt(ringCnt, dummy.matrix);
        ringInst.setColorAt(ringCnt, tmpColor.setHex(0xff595e));
        ringCnt++;
      }
      if (dt < 1.4) {
        for (let p = 0; p < 36 && debrisCnt < MAX_DEBRIS; p++) {
          const ang = hashFloat(99, p * 7) * Math.PI * 2;
          const spd = 1.5 + hashFloat(99, p * 13) * 4.5;
          const vy = 3.2 + hashFloat(99, p * 19) * 3.5;
          const px = 23.5 + Math.cos(ang) * spd * dt;
          const pz = 11.5 + Math.sin(ang) * spd * dt;
          const py = Math.max(0.05, 0.5 + vy * dt - 4.9 * dt * dt);
          const sc = Math.max(0.1, 1.5 * (1 - dt / 1.4));
          dummy.position.set(px, py, pz);
          dummy.rotation.set(dt * 5, ang, dt * 4);
          dummy.scale.set(sc, sc, sc);
          dummy.updateMatrix();
          debrisInst.setMatrixAt(debrisCnt, dummy.matrix);
          debrisInst.setColorAt(debrisCnt, tmpColor.setHex(p % 3 === 0 ? 0xff7a1a : 0x5c6475));
          debrisCnt++;
        }
      }
    }

    beamInst.count = beamCnt; beamInst.instanceMatrix.needsUpdate = true;
    if (beamInst.instanceColor) beamInst.instanceColor.needsUpdate = true;
    ringInst.count = ringCnt; ringInst.instanceMatrix.needsUpdate = true;
    if (ringInst.instanceColor) ringInst.instanceColor.needsUpdate = true;
    shellInst.count = shellCnt; shellInst.instanceMatrix.needsUpdate = true;
    debrisInst.count = debrisCnt; debrisInst.instanceMatrix.needsUpdate = true;
    if (debrisInst.instanceColor) debrisInst.instanceColor.needsUpdate = true;

    postMat.uniforms.uDesat.value = isFallen ? Math.min(0.92, (simTime - fallTime) * 0.92) : 0.0;

    const vw = window.innerWidth;
    const vh = window.innerHeight;
    hudCam.left = 0; hudCam.right = vw;
    hudCam.top = vh; hudCam.bottom = 0;
    hudCam.updateProjectionMatrix();

    for (let i = 0; i < MAX_HUD_SPRITES; i++) hudQuads[i].mesh.visible = false;
    let qIdx = 0;

    const waveH = Math.max(46, vh * 0.075);
    const waveW = waveH * 0.52;
    const padX = Math.max(18, vw * 0.018);
    const topY = vh - Math.max(16, vh * 0.022);

    const waveIconSz = waveH * 0.85;
    qIdx = setHudQuad(qIdx, 10, padX + waveIconSz * 0.5, topY - waveH * 0.5, waveIconSz, waveIconSz, 0xffffff, 0.92);
    const waveStr = String(snapA.wave);
    let curX = padX + waveIconSz + 6;
    for (let i = 0; i < waveStr.length; i++) {
      qIdx = setHudQuad(qIdx, waveStr.charCodeAt(i) - 48, curX + waveW * 0.5, topY - waveH * 0.5, waveW, waveH, 0xffffff, 0.95);
      curX += waveW * 0.9;
    }

    const goldH = waveH * 0.56;
    const goldW = goldH * 0.52;
    const goldY = topY - waveH - goldH * 0.65;
    qIdx = setHudQuad(qIdx, 11, padX + goldH * 0.45, goldY, goldH * 0.9, goldH * 0.9, 0xffffff, 0.95);
    const goldStr = String(snapA.gold);
    curX = padX + goldH + 4;
    for (let i = 0; i < goldStr.length; i++) {
      qIdx = setHudQuad(qIdx, goldStr.charCodeAt(i) - 48, curX + goldW * 0.5, goldY, goldW, goldH, 0xfcd34d, 0.95);
      curX += goldW * 0.9;
    }

    const nwOrder = ["grunt", "runner", "wisp", "brute", "splitter", "mender"];
    const iconSz = Math.max(18, vh * 0.028);
    const cntH = iconSz * 0.95;
    const cntW = cntH * 0.52;
    let nwX = padX + iconSz * 0.5;
    const nwY = goldY - goldH * 0.95;
    for (let i = 0; i < nwOrder.length; i++) {
      const cnt = snapA.nwCounts[nwOrder[i]] || 0;
      if (cnt <= 0) continue;
      qIdx = setHudQuad(qIdx, 12 + i, nwX, nwY, iconSz, iconSz, 0xffffff, 0.92);
      nwX += iconSz * 0.72;
      const cStr = String(cnt);
      for (let j = 0; j < cStr.length; j++) {
        qIdx = setHudQuad(qIdx, cStr.charCodeAt(j) - 48, nwX + cntW * 0.4, nwY, cntW, cntH, 0xe2e8f0, 0.9);
        nwX += cntW * 0.85;
      }
      nwX += iconSz * 0.65;
    }

    const pipW = Math.max(14, vw * 0.011);
    const pipH = Math.max(18, vh * 0.026);
    const pipGap = Math.max(4, pipW * 0.32);
    const rightX = vw - padX;
    for (let i = 0; i < 10; i++) {
      const pip = hpPipSprites[i];
      pip.sp.position.set(rightX - (9 - i) * (pipW + pipGap) - pipW * 0.5, topY - pipH * 0.5, 0);
      pip.sp.scale.set(pipW, pipH, 1);
      if (i < snapA.baseHp) {
        pip.mat.color.setHex(snapA.baseHp <= 3 ? 0xf87171 : 0x4be37a);
        pip.mat.opacity = 0.92;
      } else {
        pip.mat.color.setHex(leakFlash > 0 ? 0xff4444 : 0x334155);
        pip.mat.opacity = leakFlash > 0 ? 0.85 : 0.32;
      }
    }

    renderer.setRenderTarget(renderTarget);
    renderer.clear();
    renderer.render(scene, camera);

    renderer.setRenderTarget(null);
    renderer.clear();
    renderer.render(postScene, postCam);
    renderer.clearDepth();
    renderer.render(hudScene, hudCam);
  }

  function handleResize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    renderer.setPixelRatio(dpr);
    renderer.setSize(w, h, false);
    renderTarget.setSize(Math.max(1, Math.floor(w * dpr)), Math.max(1, Math.floor(h * dpr)));
    frameCamera(w, h);
  }
  window.addEventListener("resize", handleResize);
  handleResize();

  const elCountdown = document.getElementById("countdown");
  const elBtnRefire = document.getElementById("btn-refire");
  const elBtnToggle = document.getElementById("btn-toggle");
  const elIconPause = document.getElementById("icon-pause");
  const elIconPlay = document.getElementById("icon-play");
  const elScrubber = document.getElementById("scrubber");
  const speedPills = Array.from(document.querySelectorAll(".speed-pill"));

  let state = "COUNTDOWN";
  let simTime = 0.0;
  let playbackSpeed = 1.0;
  let countdownElapsed = 0.0;
  let holdElapsed = 0.0;
  let lastWallMs = null;
  let firstFrameRendered = false;

  function setToggleIcon(isPlaying) {
    if (isPlaying) {
      elIconPause.style.display = "block";
      elIconPlay.style.display = "none";
      elBtnToggle.setAttribute("aria-label", "Pause");
    } else {
      elIconPause.style.display = "none";
      elIconPlay.style.display = "block";
      elBtnToggle.setAttribute("aria-label", "Play");
    }
  }

  elBtnToggle.addEventListener("click", () => {
    if (state === "PLAYING") {
      state = "PAUSED";
      setToggleIcon(false);
      if (audio) audio.setAudible(false);
    } else if (state === "COUNTDOWN" || state === "REFIRE_HOLD") {
      elCountdown.style.display = "none";
      elCountdown.textContent = "";
      simTime = 0.0;
      elScrubber.value = "0";
      state = "PAUSED";
      setToggleIcon(false);
      if (audio) audio.setAudible(false);
    } else if (state === "PAUSED") {
      state = "PLAYING";
      setToggleIcon(true);
      if (audio) audio.setAudible(true);
    } else if (state === "ENDED") {
      simTime = 0.0;
      elScrubber.value = "0";
      elCountdown.style.display = "none";
      elCountdown.textContent = "";
      state = "PLAYING";
      setToggleIcon(true);
      if (audio) audio.setAudible(true);
    }
  });

  elBtnRefire.addEventListener("click", () => {
    elCountdown.style.display = "none";
    elCountdown.textContent = "";
    simTime = 0.0;
    elScrubber.value = "0";
    holdElapsed = 0.0;
    state = "REFIRE_HOLD";
    setToggleIcon(true);
    if (audio) audio.setAudible(false);
    renderAtSimTime(0.0);
  });

  speedPills.forEach(pill => {
    pill.addEventListener("click", () => {
      playbackSpeed = parseFloat(pill.getAttribute("data-speed"));
      speedPills.forEach(p => {
        const active = p === pill;
        p.classList.toggle("is-active", active);
        p.setAttribute("aria-checked", active ? "true" : "false");
      });
    });
  });

  elScrubber.addEventListener("input", () => {
    if (state === "COUNTDOWN" || state === "REFIRE_HOLD") {
      elCountdown.style.display = "none";
      elCountdown.textContent = "";
    }
    simTime = Math.max(0, Math.min(DURATION, parseFloat(elScrubber.value) || 0));
    state = "PAUSED";
    setToggleIcon(false);
    if (audio) audio.setAudible(false);
    renderAtSimTime(simTime);
  });

  renderAtSimTime(0.0);

  function frame(nowMs) {
    requestAnimationFrame(frame);
    if (!firstFrameRendered) {
      firstFrameRendered = true;
      lastWallMs = nowMs;
      return;
    }
    const rawDt = (nowMs - lastWallMs) / 1000;
    lastWallMs = nowMs;
    const dt = Math.min(Math.max(rawDt, 0), 0.1);

    if (state === "COUNTDOWN") {
      countdownElapsed += dt;
      if (countdownElapsed < 1.0) {
        elCountdown.style.display = "block";
        elCountdown.textContent = "3";
      } else if (countdownElapsed < 2.0) {
        elCountdown.style.display = "block";
        elCountdown.textContent = "2";
      } else if (countdownElapsed < 3.0) {
        elCountdown.style.display = "block";
        elCountdown.textContent = "1";
      } else {
        elCountdown.style.display = "none";
        elCountdown.textContent = "";
        state = "PLAYING";
        setToggleIcon(true);
        if (audio) audio.setAudible(true);
      }
      renderAtSimTime(0.0);
    } else if (state === "REFIRE_HOLD") {
      holdElapsed += dt;
      if (holdElapsed >= 1.0) {
        state = "PLAYING";
        if (audio) audio.setAudible(true);
      }
      renderAtSimTime(0.0);
    } else if (state === "PLAYING") {
      const prevTime = simTime;
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      elScrubber.value = simTime.toFixed(3);
      if (audio) {
        const prevTick = Math.floor(prevTime * TICKS_PER_SEC);
        const currTick = Math.floor(simTime * TICKS_PER_SEC);
        const isFallen = replay.fallTick >= 0 && simTime >= replay.fallTick / TICKS_PER_SEC;
        audio.triggerTickRange(prevTick, currTick, nowMs / 1000, isFallen);
      }
      renderAtSimTime(simTime);
      if (simTime >= DURATION) {
        simTime = DURATION;
        elScrubber.value = DURATION.toFixed(3);
        state = "ENDED";
        setToggleIcon(false);
        if (audio) audio.setAudible(false);
      }
    } else {
      renderAtSimTime(simTime);
    }
  }
  requestAnimationFrame(frame);

  window.BENCH_REPORT = {
    selfCheck: { vectorA: true, vectorB: true },
    strategy: {
      summary: "Blueprint build + priority T2/T3 core upgrades (2 frosts, 2 flaks, 7 cannons, 5 lances) with smart per-turret targeting (frost targets unslowed, cannon/flak maximize splash hits, lance focuses high-HP/armored/mender/urgent)",
      seedsTested: 20,
      meanScoreOnTestedSeeds: 33.63
    },
    seed42: { score: simResult.score, fallTick: simResult.fallTick },
    systems: {
      board: "full",
      enemiesAndTurrets: "full",
      combatVisuals: "full",
      fall: "full",
      hud: "full",
      audio: "full"
    },
    simplifications: [],
    testedInBrowser: false,
    measuredFps: null
  };
})();
</script>
</body>
</html>
