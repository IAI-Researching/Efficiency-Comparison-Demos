<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>

<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

<script id="rampart-strategy">
function createStrategy() {
  const buildOrder = [
    [4,"lance"],[0,"bolt"],[10,"flak"],[3,"frost"],[7,"cannon"],
    [12,"cannon"],[6,"cannon"],[14,"flak"],[8,"cannon"],[1,"cannon"],
    [11,"cannon"],[5,"cannon"],[2,"cannon"],[13,"cannon"],[9,"flak"],[15,"cannon"]
  ];
  const costs = {bolt:50,cannon:90,frost:70,lance:120,flak:80};
  return {
    plan(s) {
      const a=[]; let gold=s.gold;
      const occupied=new Set();
      for(const sl of s.slots) if(sl.turret) occupied.add(sl.slot);
      if(s.wave===1) {
        for(const [slot,type] of [[6,"cannon"],[3,"cannon"]]) {
          if(gold>=costs[type]) { a.push({op:"build",slot,type}); gold-=costs[type]; occupied.add(slot); }
        }
        return a;
      }
      if(s.wave>=3) {
        const air=s.nextWave.filter(t=>t==="wisp").length;
        let flak=0;
        for(const sl of s.slots) if(sl.turret&&sl.turret.type==="flak") flak+=sl.turret.tier;
        if(air>=3&&flak<3) {
          for(const [slot,type] of buildOrder) if(type==="flak"&&!occupied.has(slot)&&gold>=80) {
            a.push({op:"build",slot,type});gold-=80;occupied.add(slot);flak++;break;
          }
        }
      }
      const upgrades=s.slots.filter(sl=>sl.turret&&sl.turret.tier<3).sort((u,v)=>{
        const rank={lance:0,flak:1,cannon:2,frost:3,bolt:4};
        return rank[u.turret.type]-rank[v.turret.type]||u.turret.tier-v.turret.tier;
      });
      for(const [slot,type] of buildOrder) {
        if(!occupied.has(slot)&&gold>=costs[type]) {
          a.push({op:"build",slot,type});gold-=costs[type];occupied.add(slot);
        }
      }
      for(const sl of upgrades) {
        const c=costs[sl.turret.type]*(sl.turret.tier===1?1:2);
        if(sl.turret.type==="bolt"&&s.wave<12) continue;
        if(gold>=c&&(sl.turret.type!=="frost"||sl.turret.tier===1)) {
          a.push({op:"upgrade",slot:sl.slot});gold-=c;
        }
      }
      return a;
    },
    target(t,c) {
      let best=c[0], score=-Infinity;
      for(const e of c) {
        let v=-e.remaining;
        if(e.type==="mender"&&t.type==="lance") v+=100000;
        if(t.type==="lance") {
          if(e.type==="brute"&&e.remaining<700) v+=12000;
        } else if(t.type==="frost") {
          v+=e.speed*300-e.slowed*150;
          if(e.type==="runner") v+=20000;
        } else if(t.type==="cannon") {
          v+=e.hp*.1;let n=0;for(const o of c){const dx=o.x-e.x,dy=o.y-e.y;if(dx*dx+dy*dy<=8100)n++;}v+=n*4000;
        }
        if(v>score) {score=v;best=e;}
      }
      return best.id;
    }
  };
}
</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks) {
  function mulberry32(a) { return function () {
    a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return (t ^ (t >>> 14)) >>> 0; }; }
  const rand=mulberry32(seed), log=[], replay=[];
  const ground=[[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]];
  const air=[[0,6],[21,6],[21,11],[23,11]];
  const slotXY=[[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],[14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]];
  const defs={
    grunt:{hp:60,speed:10,bounty:4,leak:1,air:0,first:1,weight:10},
    runner:{hp:40,speed:20,bounty:4,leak:1,air:0,first:2,weight:4},
    wisp:{hp:50,speed:12,bounty:6,leak:2,air:1,first:3,weight:3},
    brute:{hp:150,speed:6,bounty:9,leak:3,air:0,first:4,weight:3},
    splitter:{hp:90,speed:8,bounty:6,leak:2,air:0,first:6,weight:2},
    mender:{hp:70,speed:8,bounty:7,leak:2,air:0,first:8,weight:1},
    splitling:{hp:1,speed:12,bounty:1,leak:1,air:0,first:999,weight:0}
  };
  const types=["grunt","runner","wisp","brute","splitter","mender"];
  const turretDefs={bolt:{cost:50,damage:26,period:8,range:300,splash:0,slow:0,pierce:0,ground:1,air:1},cannon:{cost:90,damage:60,period:24,range:260,splash:90,slow:0,pierce:0,ground:1,air:0},frost:{cost:70,damage:10,period:12,range:240,splash:0,slow:30,pierce:0,ground:1,air:1},lance:{cost:120,damage:180,period:36,range:360,splash:0,slow:0,pierce:1,ground:1,air:0},flak:{cost:80,damage:40,period:10,range:320,splash:70,slow:0,pierce:0,ground:0,air:1}};
  const turretTypes=["bolt","cannon","frost","lance","flak"];
  function routeData(points) {
    const seg=[];let total=0;
    for(let i=1;i<points.length;i++){const rx=points[i][0]-points[i-1][0],ry=points[i][1]-points[i-1][1],dx=Math.sign(rx),dy=Math.sign(ry),len=Math.abs(rx+ry)*100;seg.push({x:points[i-1][0]*100+50,y:points[i-1][1]*100+50,dx,dy,len});total+=len;}
    return {seg,total};
  }
  const routes=[routeData(ground),routeData(air)];
  function position(e) {
    const r=routes[e.air];let p=e.progress;
    for(const s of r.seg){if(p<=s.len){return [s.x+s.dx*p,s.y+s.dy*p];}p-=s.len;}
    const last=r.seg[r.seg.length-1];return [last.x+last.dx*last.len,last.y+last.dy*last.len];
  }
  function makeWave(w){const n=4+Math.floor(3*w/5),out=[];for(let i=0;i<n;i++){const avail=types.filter(t=>defs[t].first<=w),sum=avail.reduce((v,t)=>v+defs[t].weight,0);let r=rand()%sum;for(const t of avail){if(r<defs[t].weight){out.push(t);break;}r-=defs[t].weight;}}return out;}
  let wave=1,nextWave=makeWave(1),queued=[],gold=250,baseHp=10,nextId=1,endTick=maxTicks,fallTick=-1;
  const enemies=[],slots=slotXY.map((p,i)=>({slot:i,x:p[0]*100+50,y:p[1]*100+50,turret:null}));
  const strategy=createStrategy();
  function view(e){const p=position(e);return{id:e.id,type:e.type,hp:e.hp,maxHp:e.maxHp,x:p[0],y:p[1],air:e.air,armor:e.armor,speed:e.speed,slowed:e.slow,remaining:routes[e.air].total-e.progress};}
  function state(tick){return{tick,wave,gold,baseHp,slots:slots.map(s=>({slot:s.slot,x:s.x,y:s.y,turret:s.turret?{type:s.turret.type,tier:s.turret.tier,spent:s.turret.spent}:null})),enemies:enemies.map(view),nextWave:nextWave.slice()};}
  function spawn(type,w,progress){const d=defs[type],m=type==="splitling"?Math.max(1,Math.floor(w/4)):w;let scale=1000;for(let i=1;i<m;i++)scale=Math.floor(scale*108/100);const maxHp=type==="splitling"?progress.hp:Math.max(1,Math.floor(d.hp*scale/1000));const e={id:nextId++,type,wave:w,hp:maxHp,maxHp,speed:d.speed,armor:type==="grunt"?Math.floor(w/4):type==="brute"?6+w:0,air:d.air,progress:type==="splitling"?progress.p:0,slow:0,age:0};enemies.push(e);return e;}
  function kill(e,slot,tick,events){e.dead=true;gold+=defs[e.type].bounty;log.push([tick,"K",e.id,slot]);events.push({kind:"kill",id:e.id,type:e.type,air:e.air,p:position(e),slot});if(e.type==="splitter"){for(let i=0;i<3;i++){const child=spawn("splitling",e.wave,{p:e.progress,hp:Math.max(1,Math.floor(e.maxHp/4))});events.push({kind:"spawn",id:child.id,p:position(child)});}}}
  for(let tick=0;tick<maxTicks;tick++){
    const events=[];
    if(tick===20+40*(wave-1)){
      gold+=Math.min(50,Math.floor(gold*5/100))+10+2*wave;
      const actions=strategy.plan(state(tick))||[];
      for(const ac of actions.slice(0,32)){
        if(!ac||typeof ac.slot!=="number")continue;const sl=slots[ac.slot];if(!sl)continue;
        if(ac.op==="build"&&!sl.turret&&turretDefs[ac.type]&&gold>=turretDefs[ac.type].cost){const d=turretDefs[ac.type];sl.turret={type:ac.type,tier:1,spent:d.cost,damage:d.damage,range:d.range,cooldown:0};gold-=d.cost;log.push([tick,"B",sl.slot,turretTypes.indexOf(ac.type)]);events.push({kind:"build",slot:sl.slot,type:ac.type});}
        else if(ac.op==="upgrade"&&sl.turret&&sl.turret.tier<3){const d=turretDefs[sl.turret.type],cost=d.cost*(sl.turret.tier===1?1:2);if(gold>=cost){gold-=cost;sl.turret.spent+=cost;sl.turret.tier++;sl.turret.damage=Math.floor(sl.turret.damage*16/10);sl.turret.range+=30;log.push([tick,"U",sl.slot,sl.turret.tier]);events.push({kind:"upgrade",slot:sl.slot,tier:sl.turret.tier});}}
        else if(ac.op==="sell"&&sl.turret){gold+=Math.floor(sl.turret.spent*70/100);sl.turret=null;log.push([tick,"S",sl.slot,0]);events.push({kind:"sell",slot:sl.slot});}
      }
      for(let i=0;i<nextWave.length;i++)queued.push({tick:tick+4*i,wave,index:i,type:nextWave[i]});
      events.push({kind:"wave",wave});nextWave=makeWave(wave+1);wave++;
    }
    queued.sort((a,b)=>a.tick-b.tick||a.wave-b.wave||a.index-b.index);
    while(queued.length&&queued[0].tick===tick){const q=queued.shift();spawn(q.type,q.wave,0);}
    let fell=false;
    enemies.sort((a,b)=>a.id-b.id);
    for(const e of enemies){if(e.dead)continue;const r=routes[e.air];e.progress+=e.slow>0?Math.floor(e.speed*60/100):e.speed;if(e.progress>=r.total){e.dead=true;e.leaked=true;baseHp-=defs[e.type].leak;log.push([tick,"L",e.id,baseHp]);events.push({kind:"leak",id:e.id,hp:baseHp,p:position(e)});if(baseHp<=0){fallTick=tick;endTick=tick;log.push([tick,"F",Math.max(1,wave-1),0]);events.push({kind:"fall",wave:Math.max(1,wave-1)});fell=true;break;}}}
    if(fell){for(let i=enemies.length-1;i>=0;i--)if(enemies[i].dead)enemies.splice(i,1);replay.push({tick,wave:Math.max(1,wave-1),nextWave:nextWave.slice(),gold,baseHp,enemies:enemies.map(view),slots:slots.map(s=>({slot:s.slot,turret:s.turret?{...s.turret}:null})),events});break;}
    for(const e of enemies){if(e.dead)continue;e.age++;if(e.type==="mender"&&e.age%20===0){const p=position(e);let healed=false;for(const o of enemies){if(o.dead)continue;const q=position(o),dx=p[0]-q[0],dy=p[1]-q[1];if(dx*dx+dy*dy<=150*150){const old=o.hp;o.hp=Math.min(o.maxHp,o.hp+Math.floor(o.maxHp*8/100));if(o.hp>old)healed=true;}}if(healed)events.push({kind:"heal",id:e.id,p});}}
    for(const sl of slots){const t=sl.turret;if(!t)continue;const d=turretDefs[t.type];if(t.cooldown>0)t.cooldown--;if(t.cooldown>0)continue;const candidates=enemies.filter(e=>{if(e.dead||(e.air&&!d.air)||(!e.air&&!d.ground))return false;const p=position(e),dx=p[0]-sl.x,dy=p[1]-sl.y;return dx*dx+dy*dy<=t.range*t.range;}).sort((a,b)=>a.id-b.id);if(!candidates.length)continue;let target=null;if(strategy.target){const cvs=candidates.map(view),id=strategy.target({slot:sl.slot,type:t.type,tier:t.tier,x:sl.x,y:sl.y,range:t.range},cvs);target=candidates.find(e=>e.id===id);}if(!target)target=candidates.reduce((a,b)=>routes[b.air].total-b.progress<routes[a.air].total-a.progress?b:a,candidates[0]);const tp=position(target);const hits=d.splash?enemies.filter(e=>{if(e.dead||(e.air&&!d.air)||(!e.air&&!d.ground))return false;const p=position(e),dx=p[0]-tp[0],dy=p[1]-tp[1];return dx*dx+dy*dy<=d.splash*d.splash;}):[target];events.push({kind:"shot",slot:sl.slot,type:t.type,target:target.id,from:[sl.x,sl.y],to:tp,splash:d.splash});for(const e of hits){if(e.dead)continue;e.hp-=t.pierce?t.damage:Math.max(1,t.damage-e.armor);if(d.slow)e.slow=d.slow;}t.cooldown=d.period;const dead=enemies.filter(e=>!e.dead&&e.hp<=0).sort((a,b)=>a.id-b.id);for(const e of dead)kill(e,sl.slot,tick,events);}
    for(const e of enemies)if(!e.dead&&e.slow>0)e.slow--;
    for(let i=enemies.length-1;i>=0;i--)if(enemies[i].dead)enemies.splice(i,1);
    replay.push({tick,wave:Math.max(1,wave-1),nextWave:nextWave.slice(),gold,baseHp,enemies:enemies.map(view),slots:slots.map(s=>({slot:s.slot,turret:s.turret?{...s.turret}:null})),events});
  }
  let h=0x811c9dc5;const text=JSON.stringify(log);for(let i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,0x01000193);}const hash=(h>>>0).toString(16).padStart(8,"0");
  return{score:Math.round((endTick-20)/40*100)/100,fallTick,log,hash,replay};
}
</script>
<script>
(() => {
'use strict';
const DURATION=100;
const game=rampartSimulate(createStrategy,42,2020),frames=game.replay;
const frameAt=t=>frames[Math.max(0,Math.min(frames.length-1,t))]||{tick:0,wave:1,gold:250,baseHp:10,enemies:[],slots:[],events:[]};
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('stage'),antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.setSize(window.innerWidth,window.innerHeight,false);
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.autoClear=false;
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x11141c,.018);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,500);
scene.add(new THREE.HemisphereLight(0x9eb9d5,0x272019,1.05));
const sun=new THREE.DirectionalLight(0xffc28f,1.55);sun.position.set(-8,20,10);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-18;sun.shadow.camera.right=18;sun.shadow.camera.top=16;sun.shadow.camera.bottom=-16;scene.add(sun);
const fill=new THREE.DirectionalLight(0x6688cc,.5);fill.position.set(15,8,-12);scene.add(fill);
const board=new THREE.Group();board.position.set(-12,0,-7);scene.add(board);
function rng(seed){return()=>{seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^(seed>>>15),1|seed);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
const visualRand=rng(42);

const baseCameraPos=new THREE.Vector3();function render(simTime){updateWorld(simTime);baseCameraPos.copy(camera.position);let trauma=0;for(const l of leaks){const age=simTime-l.tick/20;if(age>=0&&age<.3)trauma+=.3*(1-age/.3);}if(game.fallTick>=0){const age=simTime-game.fallTick/20;if(age>=0&&age<1)trauma+=1-age;}trauma=Math.min(1,trauma);const shake=trauma*trauma*.25;camera.position.x+=Math.sin(simTime*37.1+1.3)*shake;camera.position.y+=Math.sin(simTime*41.7+3.8)*shake*.5;camera.position.z+=Math.sin(simTime*31.3+5.1)*shake;const grey=game.fallTick>=0?Math.max(0,Math.min(1,(simTime-game.fallTick/20))):0;scene.fog.color.setRGB(.067+grey*.18,.078+grey*.16,.11+grey*.12);if(grey>0)for(const m of sceneMaterials){m.color.copy(m.userData.baseColor);const c=m.color,l=c.r*.2126+c.g*.7152+c.b*.0722;c.lerp(new THREE.Color(l,l,l),grey*.92);}renderer.setClearColor(0x000000,0);renderer.clear();renderer.render(scene,camera);camera.position.copy(baseCameraPos);renderer.clearDepth();renderer.render(hudScene,hudCamera);}
let audioCtx,master,compressor;try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();master=audioCtx.createGain();master.gain.value=0;compressor=audioCtx.createDynamicsCompressor();compressor.threshold.value=-12;compressor.ratio.value=8;master.connect(compressor);compressor.connect(audioCtx.destination);audioCtx.resume();}catch(e){}

function tone(freq,duration,volume,pan=0,type='sine',slide=1){if(!audioCtx||state!=='PLAYING')return;const now=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain(),p=audioCtx.createStereoPanner();o.type=type;o.frequency.setValueAtTime(freq,now);o.frequency.exponentialRampToValueAtTime(Math.max(30,freq*slide),now+duration);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(volume,now+.008);g.gain.exponentialRampToValueAtTime(.0001,now+duration);p.pan.value=Math.max(-1,Math.min(1,pan));o.connect(g);g.connect(p);p.connect(master);o.start();o.stop(now+duration+.02);activeVoices.push(o);o.onended=()=>{const i=activeVoices.indexOf(o);if(i>=0)activeVoices.splice(i,1);};}

function playEvents(prev,next){if(next<=prev)return;const a=Math.floor(prev*20)+1,b=Math.floor(next*20);let shots=0;for(let tick=a;tick<=b;tick++){const f=frameAt(tick);if(f.tick!==tick)continue;const priority={cannon:0,lance:1,flak:2,bolt:3,frost:4};const soundEvents=f.events.slice().sort((a,b)=>(a.kind==='shot'?priority[a.type]:9)-(b.kind==='shot'?priority[b.type]:9));for(const e of soundEvents){if(e.kind==='shot'){const now=performance.now();shotTimes=shotTimes.filter(t=>now-t<1000);if(shotTimes.length>=12)continue;shotTimes.push(now);const freq={bolt:780,cannon:130,frost:1150,lance:210,flak:430}[e.type];tone(freq,{bolt:.055,cannon:.18,frost:.1,lance:.16,flak:.08}[e.type],e.type==='cannon'?.13:.045,(e.from[0]/100-12)/12,e.type==='frost'?'sine':'square',e.type==='lance'?2:.7);}else if(e.kind==='kill')tone(260,.07,.025,(e.p[0]/100-12)/12,'triangle',1.8);else if(e.kind==='wave'){tone(180,.35,.07,0,'sawtooth',2);tone(270,.4,.04,0,'sawtooth',1.5);}else if(e.kind==='leak'){noise(.18,.12,.8);tone(95,.35,.12,.8,'square',.65);}else if(e.kind==='fall'){noise(1,.25,0);tone(70,1.2,.2,0,'sawtooth',.35);wind();}}}}

function loop(now){requestAnimationFrame(loop);const raw=lastNow===null?0:(now-lastNow)/1000,last=lastNow;lastNow=now;const dt=Math.min(raw,.1);if(!restingRendered){restingRendered=true;lastNow=now;return;}if(state==='COUNTDOWN'){countdownElapsed+=dt;simTime=0;scrubber.value='0';if(countdownElapsed>=3){countdown.style.display='none';countdown.textContent='';setState('PLAYING');}else{countdown.style.display='block';countdown.textContent=countdownElapsed<1?'3':countdownElapsed<2?'2':'1';}}else if(state==='REFIRE_HOLD'){holdElapsed+=dt;if(holdElapsed>=1)setState('PLAYING');}else if(state==='PLAYING'){const prev=simTime;simTime=Math.min(DURATION,simTime+dt*playbackSpeed);scrubber.value=simTime.toFixed(3);if(!scrubbing)playEvents(prev,simTime);if(simTime>=DURATION){simTime=DURATION;scrubber.value=DURATION.toFixed(3);setState('ENDED');}}render(simTime);}requestAnimationFrame(loop);
