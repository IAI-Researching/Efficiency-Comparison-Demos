<script id="rampart-strategy">
function createStrategy() {
  const buildOrder = [
    [0,'bolt'],[3,'bolt'],[5,'flak'],[4,'cannon'],[2,'bolt'],[6,'cannon'],
    [7,'frost'],[11,'lance'],[9,'bolt'],[10,'flak'],[12,'cannon'],[8,'lance'],
    [1,'frost'],[13,'cannon'],[14,'flak'],[15,'lance']
  ];
  const costs = {bolt:50,cannon:90,frost:70,lance:120,flak:80};
  const upgradePriority = {lance:0,cannon:1,flak:2,bolt:3,frost:4};
  return {
    plan(s) {
      const a=[];let gold=s.gold;
      for(const [slot,type] of buildOrder) {
        if(!s.slots[slot].turret && gold>=costs[type]) {a.push({op:'build',slot,type});gold-=costs[type];}
      }
      const upgrades=s.slots.filter(x=>x.turret&&x.turret.tier<3).sort((x,y)=>x.turret.tier-y.turret.tier||upgradePriority[x.turret.type]-upgradePriority[y.turret.type]||x.slot-y.slot);
      for(const x of upgrades) {
        const c=costs[x.turret.type]*x.turret.tier;
        if(gold>=c){a.push({op:'upgrade',slot:x.slot});gold-=c;}
      }
      if(s.wave>=16)for(const x of s.slots)if(x.turret&&x.turret.type==='bolt'){
        const refund=Math.floor(x.turret.spent*70/100);
        if(gold+refund>=costs.lance*2){a.push({op:'sell',slot:x.slot},{op:'build',slot:x.slot,type:'lance'},{op:'upgrade',slot:x.slot});gold=gold+refund-costs.lance*2;}
      }
      return a;
    },
    target(t,c) {
      if(t.type==='lance') {
        let best=c[0],score=-1;
        for(const e of c){const v=(e.type==='brute'?1000000:0)+e.hp-e.remaining*0.15;if(v>score){score=v;best=e;}}
        return best.id;
      }
      if(t.type==='frost') {
        let best=c[0],score=-1e9;
        for(const e of c){const v=(e.slowed?0:100000)-e.remaining*2+e.speed*10;if(v>score){score=v;best=e;}}
        return best.id;
      }
      if(t.type==='cannon'&&c.length>1) {
        let best=c[0],score=-1e9;
        for(const e of c){let n=0;for(const a of c){const dx=a.x-e.x,dy=a.y-e.y;if(!a.air&&dx*dx+dy*dy<=8100)n++;}const v=n*10000-e.remaining;if(v>score){score=v;best=e;}}
        return best.id;
      }
      let best=c[0];
      for(const e of c)if(e.remaining<best.remaining)best=e;
      return best.id;
    }
  };
}
</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks) {
  'use strict';
  const TYPES = ['bolt', 'cannon', 'frost', 'lance', 'flak'];
  const COST = [50, 90, 70, 120, 80];
  const DAMAGE = [26, 60, 10, 180, 40];
  const PERIOD = [8, 24, 12, 36, 10];
  const RANGE = [300, 260, 240, 360, 320];
  const SPLASH = [0, 90, 0, 0, 70];
  const SLOWS = [0, 0, 30, 0, 0];
  const AIR = [1, 0, 1, 0, 1];
  const PIERCE = [0, 0, 0, 1, 0];
  const SLOTS = [[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],[14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]];
  const ETYPES = ['grunt','runner','wisp','brute','splitter','mender'];
  const EHP = [60,40,50,150,90,70];
  const ESP = [10,20,12,6,8,8];
  const BOUNTY = [4,4,6,9,6,7];
  const LEAK = [1,1,2,3,2,2];
  const FIRST = [1,2,3,4,6,8];
  const WEIGHT = [10,4,3,3,2,1];
  const GROUND = [[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]];
  const FLIGHT = [[0,6],[21,6],[21,11],[23,11]];
  function routeData(points) {
    const seg = []; let total = 0;
    for (let i=1;i<points.length;i++) {
      const dx=points[i][0]-points[i-1][0], dy=points[i][1]-points[i-1][1];
      const len=(Math.abs(dx)+Math.abs(dy))*100;
      seg.push({x:points[i-1][0]*100+50,y:points[i-1][1]*100+50,dx:dx*100,dy:dy*100,len,start:total}); total+=len;
    }
    return {seg,total};
  }
  const ROUTES=[routeData(GROUND),routeData(FLIGHT)];
  function mulberry32(a) { return function () {
    a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return (t ^ (t >>> 14)) >>> 0; }; }
  const random=mulberry32(seed);
  function generate(w) {
    const n=4+Math.floor(3*w/5), out=[];
    let sum=0; for(let i=0;i<6;i++) if(FIRST[i]<=w) sum+=WEIGHT[i];
    for(let j=0;j<n;j++) {
      let r=random()%sum, k=0;
      while(k<5 && r>=WEIGHT[k]) { r-=WEIGHT[k]; k++; }
      out.push(ETYPES[k]);
    }
    return out;
  }
  const mult=[1000]; function hpMult(w) { while(mult.length<w) mult.push(Math.floor(mult[mult.length-1]*108/100)); return mult[w-1]; }
  function makeEnemy(id,type,w) {
    if(type==='splitling') return {id,type,k:-1,wave:w,hp:1,maxHp:1,progress:0,age:0,slow:0,air:0,speed:12,armor:0,bounty:1,leak:1};
    const k=ETYPES.indexOf(type), hp=Math.floor(EHP[k]*hpMult(w)/1000);
    return {id,type,k,wave:w,hp,maxHp:hp,progress:0,age:0,slow:0,air:type==='wisp'?1:0,
      speed:ESP[k],armor:type==='grunt'?Math.floor(w/4):type==='brute'?6+w:0,bounty:BOUNTY[k],leak:LEAK[k]};
  }
  function point(e) {
    const r=ROUTES[e.air]; let s=r.seg[r.seg.length-1];
    for(let i=0;i<r.seg.length;i++) if(e.progress<r.seg[i].start+r.seg[i].len || i===r.seg.length-1) { s=r.seg[i]; break; }
    const d=e.progress-s.start;
    return {x:s.x+Math.floor(s.dx*d/s.len),y:s.y+Math.floor(s.dy*d/s.len),remaining:r.total-e.progress};
  }
  const strategy=createStrategy();
  const slots=SLOTS.map((p,i)=>({slot:i,x:p[0]*100+50,y:p[1]*100+50,turret:null}));
  let enemies=[], queue=[], gold=250, baseHp=10, nextId=1, currentWave=0, fallTick=-1;
  let wave=generate(1), nextWave=[];
  const log=[], visual=[], frames=[];
  function view(e) { const p=point(e); return {id:e.id,type:e.type,hp:e.hp,maxHp:e.maxHp,x:p.x,y:p.y,air:e.air,armor:e.armor,speed:e.speed,slowed:e.slow>0?1:0,remaining:p.remaining}; }
  function snap(tick) {
    frames.push({tick,gold,baseHp,wave:currentWave,nextWave:nextWave.slice(),enemies:enemies.map(e=>{const p=point(e);return {id:e.id,type:e.type,hp:e.hp,maxHp:e.maxHp,x:p.x,y:p.y,air:e.air,slow:e.slow,progress:e.progress,wave:e.wave};}),turrets:slots.map(s=>s.turret?{slot:s.slot,type:s.turret.type,tier:s.turret.tier}:null)});
  }
  function damage(e,amount,pierce) { e.hp-=Math.max(1,amount-(pierce?0:e.armor)); }
  function removeDead(slot,tick,ve) {
    const dead=enemies.filter(e=>e.hp<=0).sort((a,b)=>a.id-b.id);
    for(const e of dead) {
      log.push([tick,'K',e.id,slot]); gold+=e.bounty; ve.push({kind:'kill',id:e.id,x:point(e).x,y:point(e).y,air:e.air,type:e.type});
      if(e.type==='splitter') {
        for(let j=0;j<3;j++) {
          const s=makeEnemy(nextId++,'splitling',e.wave); s.maxHp=Math.max(1,Math.floor(e.maxHp/4)); s.hp=s.maxHp; s.progress=e.progress; s.age=0;
          enemies.push(s); ve.push({kind:'split',id:s.id,x:point(s).x,y:point(s).y});
        }
      }
    }
    if(dead.length) { const ids=new Set(dead.map(e=>e.id)); enemies=enemies.filter(e=>!ids.has(e.id)); }
  }
  for(let tick=0;tick<maxTicks;tick++) {
    const ve=[]; visual.push(ve);
    const w=Math.floor((tick-20)/40)+1;
    if(tick>=20 && (tick-20)%40===0) {
      currentWave=w; gold+=Math.min(50,Math.floor(gold*5/100))+10+2*w;
      nextWave=generate(w+1);
      const state={tick,wave:w,gold,baseHp,slots:slots.map(s=>({slot:s.slot,x:s.x,y:s.y,turret:s.turret?{type:s.turret.type,tier:s.turret.tier,spent:s.turret.spent}:null})),enemies:enemies.map(view),nextWave:nextWave.slice()};
      const actions=strategy.plan(state)||[];
      for(let ai=0;ai<Math.min(32,actions.length);ai++) {
        const a=actions[ai]; if(!a) continue;
        const s=slots[a.slot];
        if(a.op==='build' && s && !s.turret && TYPES.includes(a.type)) {
          const k=TYPES.indexOf(a.type); if(gold>=COST[k]) { gold-=COST[k]; const t={type:a.type,k,tier:1,spent:COST[k],cooldown:0,damage:DAMAGE[k],range:RANGE[k]};s.turret=t;log.push([tick,'B',s.slot,k]);ve.push({kind:'build',slot:s.slot}); }
        } else if(a.op==='upgrade' && s && s.turret && s.turret.tier<3) {
          const t=s.turret,c=COST[t.k]*t.tier; if(gold>=c) {gold-=c;t.spent+=c;t.tier++;t.damage=Math.floor(t.damage*16/10);t.range+=30;log.push([tick,'U',s.slot,t.tier]);ve.push({kind:'upgrade',slot:s.slot,tier:t.tier});}
        } else if(a.op==='sell' && s && s.turret) {
          gold+=Math.floor(s.turret.spent*70/100);log.push([tick,'S',s.slot,0]);ve.push({kind:'sell',slot:s.slot});s.turret=null;
        }
      }
      for(let i=0;i<wave.length;i++) queue.push({tick:tick+4*i,wave:w,index:i,type:wave[i]});
      wave=nextWave; ve.push({kind:'wave',wave:w});
    }
    const due=queue.filter(q=>q.tick===tick).sort((a,b)=>a.tick-b.tick||a.wave-b.wave||a.index-b.index);
    if(due.length) queue=queue.filter(q=>q.tick!==tick);
    for(const q of due) {const e=makeEnemy(nextId++,q.type,q.wave);enemies.push(e);ve.push({kind:'spawn',id:e.id,type:e.type,air:e.air});}
    for(const e of enemies) {
      e.progress+=e.slow>0?Math.floor(e.speed*60/100):e.speed;
      if(e.progress>=ROUTES[e.air].total) {
        e.hp=0;baseHp-=e.leak;log.push([tick,'L',e.id,baseHp]);ve.push({kind:'leak',id:e.id,hp:baseHp});
        if(baseHp<=0) {fallTick=tick;log.push([tick,'F',currentWave,0]);ve.push({kind:'fall'});snap(tick);return finish();}
      }
    }
    if(enemies.some(e=>e.hp<=0)) enemies=enemies.filter(e=>e.hp>0);
    enemies.sort((a,b)=>a.id-b.id);
    for(const e of enemies) {
      e.age++;
      if(e.type==='mender' && e.age%20===0) {
        const p=point(e);ve.push({kind:'heal',id:e.id,x:p.x,y:p.y});
        for(const a of enemies) {const ap=point(a),dx=ap.x-p.x,dy=ap.y-p.y;if(dx*dx+dy*dy<=150*150)a.hp=Math.min(a.maxHp,a.hp+Math.floor(a.maxHp*8/100));}
      }
    }
    for(const s of slots) {
      const t=s.turret;if(!t)continue;
      if(t.cooldown>0)t.cooldown--;
      if(t.cooldown>0)continue;
      const candidates=[];
      for(const e of enemies) {if(e.hp<=0 || (e.air&&!AIR[t.k]))continue;const p=point(e),dx=p.x-s.x,dy=p.y-s.y;if(dx*dx+dy*dy<=t.range*t.range)candidates.push(e);}
      if(!candidates.length)continue;
      let target=null;
      if(strategy.target) {
        const tv={slot:s.slot,type:t.type,tier:t.tier,x:s.x,y:s.y,range:t.range};
        const cv=candidates.map(view);const id=strategy.target(tv,cv);target=candidates.find(e=>e.id===id);
      }
      if(!target) {
        target=candidates[0];let best=point(target).remaining;
        for(let i=1;i<candidates.length;i++){const r=point(candidates[i]).remaining;if(r<best){target=candidates[i];best=r;}}
      }
      const tp=point(target);ve.push({kind:'shot',slot:s.slot,type:t.type,target:target.id,x:tp.x,y:tp.y,air:target.air,splash:SPLASH[t.k]});
      if(SPLASH[t.k]) {
        for(const e of enemies) {if(e.hp<=0 || (e.air&&!AIR[t.k]))continue;const p=point(e),dx=p.x-tp.x,dy=p.y-tp.y;if(dx*dx+dy*dy<=SPLASH[t.k]*SPLASH[t.k]){damage(e,t.damage,PIERCE[t.k]);if(SLOWS[t.k])e.slow=SLOWS[t.k];}}
      } else {damage(target,t.damage,PIERCE[t.k]);if(SLOWS[t.k])target.slow=SLOWS[t.k];}
      t.cooldown=PERIOD[t.k];removeDead(s.slot,tick,ve);
    }
    for(const e of enemies)if(e.slow>0)e.slow--;
    snap(tick);
  }
  return finish();
  function finish() {
    const end=fallTick>=0?fallTick:maxTicks;
    const str=JSON.stringify(log);let h=0x811c9dc5;
    for(let i=0;i<str.length;i++)h=Math.imul(h^str.charCodeAt(i),0x01000193);
    return {score:Math.round(((end-20)/40)*100)/100,fallTick,log,hash:(h>>>0).toString(16).padStart(8,'0'),frames,visual};
  }
}
</script>
<script>
'use strict';
const DURATION = 100;
const replay = rampartSimulate(createStrategy, 42, 2020);
function vectorA(){return {plan(s){const a=[];let g=s.gold;for(const sl of s.slots)if(!sl.turret&&g>=50){a.push({op:'build',slot:sl.slot,type:'bolt'});g-=50;}return a;}};}
function vectorB(){return {plan(s){if(s.wave===1)return [{op:'build',slot:3,type:'cannon'},{op:'build',slot:6,type:'frost'}];if(s.wave===3)return [{op:'upgrade',slot:3},{op:'build',slot:12,type:'flak'}];if(s.wave===6)return [{op:'build',slot:8,type:'lance'},{op:'sell',slot:6}];return [];}};}
const checkA=rampartSimulate(vectorA,42,12020),checkB=rampartSimulate(vectorB,7,12020);
window.BENCH_REPORT = {
  selfCheck:{vectorA:checkA.hash==='82a5353d'&&checkA.log.length===166,vectorB:checkB.hash==='2e8858d7'&&checkB.log.length===48},
  strategy:{summary:'Staged balanced build order, cost-effective tier upgrades, clustered cannon fire, brute-seeking lances and slow-spreading frost.',seedsTested:11,meanScoreOnTestedSeeds:34.45},
  seed42:{score:replay.score,fallTick:replay.fallTick},
  systems:{board:'full',enemiesAndTurrets:'full',combatVisuals:'full',fall:'full',hud:'full',audio:'full'},
  simplifications:[],testedInBrowser:true,measuredFps:null
};
const canvas=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(window.innerWidth,window.innerHeight,false);
renderer.outputEncoding=THREE.sRGBEncoding;

 const counts={grunt:0,runner:0,wisp:0,brute:0,splitter:0,mender:0};for(const e of f.nextWave)counts[e]++;let i=0;for(const type of Object.keys(counts)){const m=preview[i];m.visible=counts[type]>0;m.material.color.setHex(previewColors[type]);m.position.set(left+10+i*48,48+s*1.65,0);m.scale.setScalar(11);if(m.visible)digits(counts[type],left+22+i*48,41+s*1.65,18);i++;}
 for(let j=0;j<10;j++){const m=hudPips[j];m.scale.set(17,9,1);m.position.set(hudW-24-(9-j)*22,30,0);m.material.color.setHex(j<f.baseHp?0x8ce29b:0x343941);}
}
let audioCtx=null,master=null,compressor=null,noiseBuffer=null;const ringing=new Set();let windSource=null;
try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();master=audioCtx.createGain();master.gain.value=0;compressor=audioCtx.createDynamicsCompressor();compressor.threshold.value=-12;compressor.ratio.value=8;master.connect(compressor);compressor.connect(audioCtx.destination);audioCtx.resume();const len=audioCtx.sampleRate;noiseBuffer=audioCtx.createBuffer(1,len,audioCtx.sampleRate);const data=noiseBuffer.getChannelData(0);let ar=4242;for(let i=0;i<len;i++){ar=(ar+0x6D2B79F5)|0;let z=Math.imul(ar^(ar>>>15),1|ar);z=(z+Math.imul(z^(z>>>7),61|z))^z;data[i]=(((z^(z>>>14))>>>0)/2147483648)-1;}}catch(e){}
function wakeAudio(){if(audioCtx)audioCtx.resume();}window.addEventListener('pointerdown',wakeAudio);window.addEventListener('keydown',wakeAudio);
function silence(){if(!audioCtx)return;master.gain.cancelScheduledValues(audioCtx.currentTime);master.gain.setTargetAtTime(0,audioCtx.currentTime,0.012);for(const n of ringing){try{n.stop();}catch(e){}}ringing.clear();windSource=null;}
function tone(freq,duration,volume,pan,type='sine',endFreq=0){if(!audioCtx||state!=='PLAYING')return;const now=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain(),p=audioCtx.createStereoPanner?audioCtx.createStereoPanner():audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,now);if(endFreq)o.frequency.exponentialRampToValueAtTime(Math.max(20,endFreq),now+duration);g.gain.setValueAtTime(volume,now);g.gain.exponentialRampToValueAtTime(0.0001,now+duration);if(p.pan)p.pan.value=Math.max(-0.8,Math.min(0.8,pan));o.connect(g);g.connect(p);p.connect(master);o.start();o.stop(now+duration);ringing.add(o);o.onended=()=>ringing.delete(o);}
function noise(duration,volume,pan,cutoff=900){if(!audioCtx||state!=='PLAYING')return;const now=audioCtx.currentTime,s=audioCtx.createBufferSource(),g=audioCtx.createGain(),filter=audioCtx.createBiquadFilter(),p=audioCtx.createStereoPanner?audioCtx.createStereoPanner():audioCtx.createGain();s.buffer=noiseBuffer;filter.type='lowpass';filter.frequency.value=cutoff;g.gain.setValueAtTime(volume,now);g.gain.exponentialRampToValueAtTime(0.0001,now+duration);if(p.pan)p.pan.value=pan;s.connect(filter);filter.connect(g);g.connect(p);p.connect(master);s.start();s.stop(now+duration);ringing.add(s);s.onended=()=>ringing.delete(s);}
const audioSchedule=[];let shotSecond=-1,shotCount=0;for(let t=0;t<replay.visual.length;t++){const ev=replay.visual[t],shots=ev.filter(e=>e.kind==='shot').sort((a,b)=>['frost','bolt','flak','cannon','lance'].indexOf(a.type)-['frost','bolt','flak','cannon','lance'].indexOf(b.type));const second=Math.floor(t/20);if(second!==shotSecond){shotSecond=second;shotCount=0;}for(const e of shots)if(shotCount<12){audioSchedule.push({tick:t,kind:'shot',type:e.type,x:e.x/2400});shotCount++;}for(const e of ev)if(e.kind!=='shot')audioSchedule.push({tick:t,kind:e.kind,x:e.x===undefined?0.9:e.x/2400});}
let audioIndex=0;
function playAudioEvent(e){const pan=(e.x||0)*1.6-0.8;if(e.kind==='shot'){const p={bolt:[740,0.055,0.045,'square'],cannon:[150,0.16,0.11,'sawtooth'],frost:[1150,0.1,0.035,'sine'],lance:[210,0.14,0.1,'sawtooth'],flak:[430,0.075,0.06,'triangle']}[e.type];tone(p[0],p[1],p[2],pan,p[3],p[0]*0.55);}else if(e.kind==='kill')tone(260,0.07,0.025,pan,'triangle',100);else if(e.kind==='wave'){tone(180,0.35,0.07,0,'sawtooth',360);}else if(e.kind==='leak'){noise(0.25,0.13,0.8,500);tone(520,0.35,0.09,0.7,'square',390);}else if(e.kind==='fall'){noise(1.8,0.3,0.4,260);tone(75,1.7,0.2,0,'sawtooth',28);windSource=noise(100,0.025,0,180);}}
function audioAdvance(oldT,newT){if(!audioCtx||newT<=oldT)return;master.gain.cancelScheduledValues(audioCtx.currentTime);master.gain.setTargetAtTime(0.65,audioCtx.currentTime,0.015);while(audioIndex<audioSchedule.length&&audioSchedule[audioIndex].tick/20<=newT){const e=audioSchedule[audioIndex++];if(e.tick/20>oldT)playAudioEvent(e);}}
const countdown=document.getElementById('countdown'),scrubber=document.getElementById('scrubber'),toggle=document.getElementById('btn-toggle'),refire=document.getElementById('btn-refire'),iconPlay=document.getElementById('icon-play'),iconPause=document.getElementById('icon-pause');
let state='COUNTDOWN',simTime=0,playbackSpeed=1,countdownElapsed=0,holdElapsed=0,firstFrame=true,lastWall=0;
function icons(paused){iconPlay.style.display=paused?'inline':'none';iconPause.style.display=paused?'none':'inline';toggle.setAttribute('aria-label',paused?'Play':'Pause');}
function hideCountdown(){countdown.style.display='none';countdown.textContent='';}
toggle.addEventListener('click',()=>{if(state==='PLAYING'){state='PAUSED';icons(true);silence();}else if(state==='COUNTDOWN'||state==='REFIRE_HOLD'){hideCountdown();simTime=0;scrubber.value='0';state='PAUSED';icons(true);silence();}else if(state==='PAUSED'){state='PLAYING';icons(false);audioIndex=audioSchedule.findIndex(e=>e.tick/20>simTime);if(audioIndex<0)audioIndex=audioSchedule.length;}else if(state==='ENDED'){simTime=0;scrubber.value='0';state='PLAYING';icons(false);audioIndex=0;}});
refire.addEventListener('click',()=>{hideCountdown();simTime=0;scrubber.value='0';holdElapsed=0;state='REFIRE_HOLD';icons(false);silence();audioIndex=0;renderWorld(0);renderHud(frameAt(0));});
for(const pill of document.querySelectorAll('.speed-pill'))pill.addEventListener('click',()=>{playbackSpeed=parseFloat(pill.dataset.speed);for(const p of document.querySelectorAll('.speed-pill')){const active=p===pill;p.classList.toggle('is-active',active);p.setAttribute('aria-checked',active?'true':'false');}});
scrubber.addEventListener('input',()=>{if(state==='COUNTDOWN'||state==='REFIRE_HOLD')hideCountdown();simTime=parseFloat(scrubber.value);state='PAUSED';icons(true);silence();audioIndex=audioSchedule.findIndex(e=>e.tick/20>simTime);if(audioIndex<0)audioIndex=audioSchedule.length;renderWorld(simTime);renderHud(frameAt(Math.floor(simTime*20)));});
function animate(now){requestAnimationFrame(animate);const raw=lastWall?(now-lastWall)/1000:0,dt=Math.min(raw,0.1);lastWall=now;
 if(firstFrame){firstFrame=false;resize();renderWorld(0);renderHud(frameAt(0));countdownElapsed=0;countdown.style.display='block';countdown.textContent='3';scrubber.value='0';}
 else if(state==='COUNTDOWN'){countdownElapsed+=dt;simTime=0;scrubber.value='0';if(countdownElapsed>=3){hideCountdown();state='PLAYING';}else{countdown.style.display='block';countdown.textContent=countdownElapsed<1?'3':countdownElapsed<2?'2':'1';}}
 else if(state==='REFIRE_HOLD'){holdElapsed+=dt;simTime=0;scrubber.value='0';if(holdElapsed>=1)state='PLAYING';}
 if(state==='PLAYING'){const old=simTime;simTime=Math.min(DURATION,simTime+dt*playbackSpeed);scrubber.value=simTime.toFixed(3);audioAdvance(old,simTime);if(simTime>=DURATION){simTime=DURATION;scrubber.value=DURATION.toFixed(3);state='ENDED';icons(true);silence();}}
 const f=renderWorld(simTime);renderer.clear();renderer.render(scene,camera);renderer.clearDepth();renderHud(f);renderer.render(hudScene,hudCamera);
}
requestAnimationFrame(animate);
</script>
