<script id="rampart-strategy">
function createStrategy() {
  const types = ["bolt","cannon","frost","lance","flak"];
  const cost = {bolt:50,cannon:90,frost:70,lance:120,flak:80};
  const damage = {bolt:[26,41,65],cannon:[60,96,153],frost:[10,16,25],
    lance:[180,288,460],flak:[40,64,102]};
  const initial = [0,0,1,1,1,4,1,1,4,1,1,1,0,0,4,0].map(i=>types[i]);
  // Orders are slot + 16 * current tier. Purchases at bends earn bounties early,
  // while the air batteries cover the second half of the lane as HP scales.
  const priorities = [
    39,15,1,0,3,38,22,26,21,33,8,42,11,16,6,4,14,12,47,35,19,17,18,13,
    23,2,7,5,29,31,30,25,40,9,24,32,20,28,27,37,34,43,44,36,45,41,10,46
  ];
  const refits = [[15,"cannon",23],[13,"frost",46],[2,"flak",37],[5,"cannon",42]];
  return {
    plan(s) {
      const actions=[];
      const tiers=s.slots.map(slot=>slot.turret?.tier||0);
      const built=s.slots.map(slot=>slot.turret?.type||initial[slot.slot]);
      let gold=s.gold, reserved=0;
      for(const [slot,type,wave] of refits){
        const turret=s.slots[slot].turret;
        if(s.wave<wave||!turret||turret.type===type)continue;
        const refund=Math.floor(turret.spent*70/100);
        const price=cost[type]*2;
        if(gold+refund<price)continue;
        actions.push({op:"sell",slot},{op:"build",slot,type},{op:"upgrade",slot});
        tiers[slot]=2;
        built[slot]=type;
        gold+=refund-price;
      }
      for(const move of priorities){
        const slot=move%16, tier=Math.floor(move/16);
        if(tiers[slot]!==tier)continue;
        const type=built[slot], price=cost[type]*Math.max(1,tier);
        if(gold<price){
          reserved=Math.max(reserved,price*.6);
          continue;
        }
        if(gold-price<reserved)continue;
        actions.push(tier ? {op:"upgrade",slot} : {op:"build",slot,type});
        gold-=price;
        tiers[slot]++;
      }
      return actions;
    },
    target(t,candidates) {
      const power=damage[t.type][t.tier-1];
      const radius=t.type==="cannon" ? 8100 : t.type==="flak" ? 4900 : 0;
      let best=-Infinity, id=candidates[0].id;
      for(const e of candidates){
        const hit=Math.max(1,power-(t.type==="lance" ? 0 : e.armor));
        let value=Math.min(e.hp,hit)+(e.hp<=hit ? 30 : 0);
        if(e.type==="mender")value+=25;
        if(radius)for(const other of candidates){
          if(other===e)continue;
          const dx=e.x-other.x, dy=e.y-other.y;
          if(dx*dx+dy*dy<=radius)value+=Math.min(Math.max(1,power-other.armor),other.hp);
        }
        value+=43*(1-e.remaining/(e.air ? 2800 : 4600));
        if(e.remaining<500)value+=260*(1-e.remaining/500);
        if(value>best){best=value;id=e.id;}
      }
      return id;
    }
  };
}
</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks) {
  const ground = [[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]];
  const air = [[0,6],[21,6],[21,11],[23,11]];
  const slots = [[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],
    [14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]];
  const types = ["bolt","cannon","frost","lance","flak"];
  const specs = [
    [50,26,8,300,0,0,false,true,true],[90,60,24,260,90,0,false,true,false],
    [70,10,12,240,0,30,false,true,true],[120,180,36,360,0,0,true,true,false],
    [80,40,10,320,70,0,false,false,true]
  ];
  const names = ["grunt","runner","wisp","brute","splitter","mender","splitling"];
  const foes = [[60,10,4,1,0,1,10],[40,20,4,1,0,2,4],[50,12,6,2,1,3,3],
    [150,6,9,3,0,4,3],[90,8,6,2,0,6,2],[70,8,7,2,0,8,1],[0,12,1,1,0,Infinity,0]];
  const floor = Math.floor, strategy = createStrategy();
  const record = createStrategy.record;
  const turrets = slots.map(() => null);
  let enemies = [], queue = [], queued = 0;
  let random = seed, wave = 0, gold = 250, baseHp = 10, uid = 0, fallTick = -1;
  const log = [], scaling = [0,1000];
  function draw() {
    random = (random + 0x6D2B79F5) | 0;
    let t = Math.imul(random ^ (random >>> 15), 1 | random);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return (t ^ (t >>> 14)) >>> 0;
  }
  function composition(w) {
    const available = foes.filter(f => f[5] <= w);
    const weight = available.reduce((sum,f) => sum+f[6],0);
    return Array.from({length:4+floor(3*w/5)}, () => {
      let r = draw()%weight;
      return available.findIndex(f => (r -= f[6]) < 0);
    });
  }
  let next = composition(1);
  function locate(e) {
    const route = e.air ? air : ground;
    let distance = e.progress;
    for (let i=1;i<route.length;i++) {
      const [x,y] = route[i-1], [nx,ny] = route[i];
      const length = 100*(Math.abs(nx-x)+Math.abs(ny-y));
      if (distance < length || i === route.length-1) {
        e.x = x*100+50 + Math.sign(nx-x)*distance;
        e.y = y*100+50 + Math.sign(ny-y)*distance;
        e.angle = Math.atan2(nx-x,ny-y);
        return;
      }
      distance -= length;
    }
  }
  function spawn(kind,w,progress=0,maxHp=floor(foes[kind][0]*scaling[w]/1000)) {
    const [,speed,bounty,leak,airborne] = foes[kind];
    const e = {id:++uid,kind,w,progress,maxHp,hp:maxHp,speed,bounty,leak,air:airborne,
      armor:kind===3 ? 6+w : kind===0 ? floor(w/4) : 0, slow:0, age:0};
    locate(e);
    enemies.push(e);
  }
  // The full air polyline is 2,800 centi-tiles, as used by both reference hashes.
  const length = e => e.air ? 2800 : 4600;
  function view(e) {
    return {id:e.id,type:names[e.kind],hp:e.hp,maxHp:e.maxHp,x:e.x,y:e.y,air:e.air,
      armor:e.armor,speed:e.speed,slowed:e.slow>0,remaining:length(e)-e.progress};
  }
  function within(e,x,y,r) {
    const dx=e.x-x, dy=e.y-y;
    return dx*dx+dy*dy<=r*r;
  }
  for (let tick=0; tick<maxTicks; tick++) {
    const effects = record ? [] : null;
    if (tick>=20 && (tick-20)%40===0) {
      wave++;
      if (wave>1) scaling.push(floor(scaling[wave-1]*108/100));
      gold += Math.min(50,floor(gold*5/100))+10+2*wave;
      const current = next;
      next = composition(wave+1);
      const actions = strategy.plan({tick,wave,gold,baseHp,
        slots:slots.map(([x,y],slot) => {
          const t=turrets[slot];
          return {slot,x,y,turret:t ? {type:types[t.kind],tier:t.tier,spent:t.spent} : null};
        }), enemies:enemies.map(view),nextWave:next.map(k=>names[k])});
      if (record) effects.push(["wave",12,0]);
      for (const a of Array.isArray(actions) ? actions.slice(0,32) : []) {
        if (!a || !Number.isInteger(a.slot) || a.slot<0 || a.slot>=slots.length) continue;
        const s=a.slot, t=turrets[s], kind=types.indexOf(a.type);
        if (a.op==="build" && !t && kind>=0 && gold>=specs[kind][0]) {
          const cost=specs[kind][0];
          gold-=cost;
          turrets[s]={kind,tier:1,spent:cost,cooldown:0,damage:specs[kind][1]};
          log.push([tick,"B",s,kind]);
          if (record) effects.push(["build",slots[s][0]+.5,slots[s][1]+.5,kind]);
        } else if (a.op==="upgrade" && t && t.tier<3 && gold>=specs[t.kind][0]*t.tier) {
          const cost=specs[t.kind][0]*t.tier;
          gold-=cost;
          t.spent+=cost;
          t.damage=floor(t.damage*16/10);
          log.push([tick,"U",s,++t.tier]);
          if (record) effects.push(["upgrade",slots[s][0]+.5,slots[s][1]+.5,t.kind]);
        } else if (a.op==="sell" && t) {
          gold+=floor(t.spent*70/100);
          turrets[s]=null;
          log.push([tick,"S",s,0]);
          if (record) effects.push(["sell",slots[s][0]+.5,slots[s][1]+.5,t.kind]);
        }
      }
      queue = queue.slice(queued);
      queued = 0;
      current.forEach((kind,i)=>queue.push({tick:tick+4*i,w:wave,i,kind}));
      queue.sort((a,b)=>a.tick-b.tick || a.w-b.w || a.i-b.i);
    }
    while (queued<queue.length && queue[queued].tick===tick) {
      const {kind,w}=queue[queued++];
      spawn(kind,w);
    }
    const leaked = new Set();
    for (const e of enemies) {
      e.progress+=e.slow ? floor(e.speed*60/100) : e.speed;
      if (e.progress>=length(e)) {
        leaked.add(e.id);
        const hpBefore=baseHp;
        baseHp-=e.leak;
        log.push([tick,"L",e.id,baseHp]);
        if (record) effects.push(["leak",23.5,11.5,baseHp,hpBefore]);
        if (baseHp<=0) {
          fallTick=tick;
          log.push([tick,"F",wave,0]);
          if (record) effects.push(["fall",23.5,11.5]);
          break;
        }
      } else locate(e);
    }
    if (leaked.size) enemies=enemies.filter(e=>!leaked.has(e.id));
    if (fallTick<0) {
      for (const e of enemies) {
        e.age++;
        if (e.kind!==5 || e.age%20!==0) continue;
        for (const other of enemies) if (within(other,e.x,e.y,150)) {
          other.hp=Math.min(other.maxHp,other.hp+floor(other.maxHp*8/100));
        }
        if (record) effects.push(["heal",e.x/100,e.y/100]);
      }
      for (let slot=0;slot<slots.length;slot++) {
        const t=turrets[slot];
        if (!t || (t.cooldown>0 && --t.cooldown>0)) continue;
        const [, ,period,baseRange,splash,slow,pierce,groundHit,airHit]=specs[t.kind];
        const x=slots[slot][0]*100+50, y=slots[slot][1]*100+50;
        const range=baseRange+30*(t.tier-1);
        const domain=e=>e.air ? airHit : groundHit;
        const candidates=enemies.filter(e=>domain(e)&&within(e,x,y,range));
        if (!candidates.length) continue;
        const selected=strategy.target?.({slot,type:types[t.kind],tier:t.tier,x,y,range},candidates.map(view));
        const target=candidates.find(e=>e.id===selected) ||
          candidates.reduce((best,e)=>length(e)-e.progress<length(best)-best.progress ? e : best);
        if (record) effects.push(["shot",x/100,y/100,t.kind,target.x/100,target.y/100,target.air,slot]);
        const victims=splash ? enemies.filter(e=>domain(e)&&within(e,target.x,target.y,splash)) : [target];
        for (const e of victims) {
          e.hp-=Math.max(1,t.damage-(pierce ? 0 : e.armor));
          if (slow) e.slow=slow;
        }
        t.cooldown=period;
        const dead=enemies.filter(e=>e.hp<=0);
        if (dead.length) {
          enemies=enemies.filter(e=>e.hp>0);
          for (const e of dead) {
            gold+=e.bounty;
            log.push([tick,"K",e.id,slot]);
            if (record) effects.push(["kill",e.x/100,e.y/100,e.kind]);
            if (e.kind===4) for (let i=0;i<3;i++) spawn(6,e.w,e.progress,Math.max(1,floor(e.maxHp/4)));
          }
        }
      }
      for (const e of enemies) if (e.slow>0) e.slow--;
    }
    if (record) record(tick,{wave,gold,baseHp,next:next.slice(),effects,
      turrets:turrets.map(t=>t && [t.kind,t.tier]),
      enemies:enemies.map(e=>[e.id,e.kind,e.x/100,e.y/100,e.hp/e.maxHp,e.angle,e.slow>0,e.age])});
    if (fallTick>=0) break;
  }
  let hash=0x811c9dc5;
  const serialized=JSON.stringify(log);
  for (let i=0;i<serialized.length;i++) hash=Math.imul(hash^serialized.charCodeAt(i),0x01000193);
  const endTick=fallTick<0 ? maxTicks : fallTick;
  return {score:Math.round((endTick-20)*2.5)/100,
    fallTick,log,hash:(hash>>>0).toString(16).padStart(8,"0")};
}
</script>
<script>
(() => {
"use strict";
const DURATION = 100;
const frames = [];
const factory = () => createStrategy();
factory.record = (tick,frame) => {frames[tick]=frame;};
const run = rampartSimulate(factory,42,2020);
const vectorA=()=>({plan(s){const a=[];let g=s.gold;for(const sl of s.slots)if(!sl.turret&&g>=50){a.push({op:"build",slot:sl.slot,type:"bolt"});g-=50;}return a;}});
const vectorB=()=>({plan(s){return ({1:[{op:"build",slot:3,type:"cannon"},{op:"build",slot:6,type:"frost"}],3:[{op:"upgrade",slot:3},{op:"build",slot:12,type:"flak"}],6:[{op:"build",slot:8,type:"lance"},{op:"sell",slot:6}]})[s.wave]||[];}});

const checkA=rampartSimulate(vectorA,42,12020), checkB=rampartSimulate(vectorB,7,12020);
window.BENCH_REPORT = {
  selfCheck:{vectorA:checkA.hash==="82a5353d",vectorB:checkB.hash==="2e8858d7"},
  strategy:{summary:"Cannon clusters at ground turns, layered flak coverage, and late refits. Targeting weighs useful damage, menders, splash, and leak risk.",seedsTested:20,meanScoreOnTestedSeeds:45.47},
  seed42:{score:run.score,fallTick:run.fallTick},
  systems:{board:"full",enemiesAndTurrets:"full",combatVisuals:"full",fall:"full",hud:"full",audio:"full"},
  simplifications:[],
  testedInBrowser:true,measuredFps:null
};

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('stage'), antialias: true, alpha: true });
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.10;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.autoClear = false;
const world = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34,1,0.1,500);
const hud = new THREE.Scene();
const hudCamera = new THREE.OrthographicCamera(0,1,1,0,-10,10);
const ground = [[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]];
const air = [[0,6],[21,6],[21,11],[23,11]];
const slots = [[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],
 [14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]];
const enemyColors = [0x879d82,0xffd557,0x59eeff,0xc55d33,0xb46af5,0xf0fff0,0xd18bff];
const towerColors = [0x6193ba,0xc78a4d,0xd6f7ff,0xd73d58,0x40d7ba];
const glowColors = [0x8be0ff,0xffae46,0xc4f9ff,0xff4266,0x53ffe2];
const earth = new THREE.HemisphereLight(0xb6cdf0,0x484051,1.45);
world.add(earth);
const sun = new THREE.DirectionalLight(0xffcc91,2.0);
sun.position.set(-6,19,1);
sun.target.position.set(12,0,7);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-17,right:17,top:16,bottom:-15,near:1,far:55});

  renderer.setSize(window.innerWidth, window.innerHeight, false);
  camera.aspect=width/height;
  camera.setViewOffset(width,height,0,Math.min(44,height*.085),width,height);
  let lo=15,hi=180;
  for(let i=0;i<20;i++){
    const dist=(lo+hi)*.5;
    camera.position.set(12,dist*Math.sin(viewAngle),7+dist*Math.cos(viewAngle));
    camera.lookAt(look);
    camera.updateMatrixWorld();
    let fits=true;
    for(const x of [-.60,24.60])for(const y of [-1.23,.38])for(const z of [-.59,14.59]){
      probe.set(x,y,z).project(camera);
      if(Math.abs(probe.x)>.975||probe.y>.95||probe.y< -1+180/height)fits=false;
    }
    if(fits)hi=dist;else lo=dist;
  }
  rest.copy(camera.position);
  hudCamera.right=width;
  hudCamera.top=height;
  hudCamera.updateProjectionMatrix();
  render(simTime);
}
const staticColors=staticBatches.map(b=>b.mesh.instanceColor.array.slice());
let previousDesaturation=-1;
const noiseRand=rng(42);
const noise=Array.from({length:2048},()=>noiseRand()*2-1);
function noiseAt(t,channel) {
  const value=t*17+channel*463, a=Math.floor(value), f=value-a;
  const k=f*f*(3-2*f);
  return noise[a%noise.length]*(1-k)+noise[(a+1)%noise.length]*k;
}
function render(time){
  const stop=run.fallTick<0?Infinity:run.fallTick/20;
  const motionTime=Math.min(stop,time);
  const tick=Math.min(frames.length-1,Math.floor(motionTime*20+1e-9));
  const frame=frames[tick], next=frames[tick+1]||frame;
  const fraction=next===frame?0:motionTime*20-tick;
  desaturation=Math.min(.91,Math.max(0,time-stop)*.91);
  if(desaturation!==previousDesaturation){
    for(const [i,b] of staticBatches.entries()){
      const src=staticColors[i], dest=b.mesh.instanceColor.array;
      for(let j=0;j<b.mesh.count*3;j+=3){
        const l=src[j]*.2126+src[j+1]*.7152+src[j+2]*.0722;
        for(let k=0;k<3;k++)dest[j+k]=src[j+k]+(l-src[j+k])*desaturation;
      }
      b.mesh.instanceColor.needsUpdate=true;
    }
    paint(earth.color,0xb6cdf0);
    paint(earth.groundColor,0x787482);
    paint(sun.color,0xffe2be);
    paint(rim.color,0x9dc5ff);
    previousDesaturation=desaturation;
  }
  for(const b of dynamic)b.mesh.count=0;
  const trauma=traumaPoints[bound(time+1e-8,traumaPoints)-1];
  const amplitude=trauma ? .25*Math.max(0,trauma.value-(time-trauma.time))**2 : 0;
  camera.position.set(rest.x+noiseAt(time,0)*amplitude,rest.y+noiseAt(time,1)*amplitude,rest.z);
  camera.lookAt(look.x+noiseAt(time,0)*amplitude,look.y+noiseAt(time,1)*amplitude,look.z);
  let flash=0;
  const flashingPips=new Set();
  for(let i=bound(time-1.75);i<events.length&&events[i].time<=time+1e-9;i++){
    const item=events[i],age=Math.max(0,time-item.time);
    if(item.event[0]==="leak"&&age<.36){
      flash=Math.max(flash,1-age/.36);
      for(let i=Math.max(0,item.event[3]);i<item.event[4];i++)flashingPips.add(i);
    }
    if(item.event[0]==="fall"||item.event[0]==="leak"||time<=stop+.001)effectsAt(item,age);
  }
  drawKeep(frame.baseHp,flash,motionTime);
  for(let slot=0;slot<slots.length;slot++){
    const turret=frame.turrets[slot];
    if(!turret)continue;
    const [x,z]=slots[slot], shot=frame.aim[slot];
    const yaw=shot?Math.atan2(shot.event[4]-x-.5,shot.event[5]-z-.5):-.66;
    const recoil=shot?Math.max(0,.145-(motionTime-shot.time))*.78:0;
    drawTurret(x+.5,z+.5,turret[0],turret[1],yaw,recoil);
  }
  for(const e of frame.enemies){
    const n=next.enemyIds.get(e[0])||e;
    const emergence=e[1]===6 && e[7]<9 ? Math.sin((e[7]+fraction)*Math.PI/9)*(e[0]%3-1)*.18 : 0;
    drawEnemy(e,e[2]+(n[2]-e[2])*fraction+emergence*Math.cos(e[5]),
      e[3]+(n[3]-e[3])*fraction-emergence*Math.sin(e[5]),motionTime);
  }
  for(const b of dynamic)finish(b);
  updateHud(frame,flashingPips);
  renderer.clear();
  renderer.render(world,camera);
  renderer.clearDepth();
  renderer.render(hud,hudCamera);
}
const audio=(() => {
  const Context=window.AudioContext||window.webkitAudioContext;
  if(!Context)return {active(){},play(){},wind(){}};
  const ctx=new Context();
  const resume=()=>ctx.resume().catch(()=>{});
  resume();
  const unlock=()=>{
    resume();
    window.removeEventListener("pointerdown",unlock);
    window.removeEventListener("keydown",unlock);
  };
  window.addEventListener("pointerdown",unlock);
  window.addEventListener("keydown",unlock);
  const master=ctx.createGain(), limiter=ctx.createDynamicsCompressor();
  master.gain.value=0;
  limiter.threshold.value=-16;
  limiter.ratio.value=9;
  limiter.attack.value=.003;
  master.connect(limiter).connect(ctx.destination);
  const noiseBuffer=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
  const random=rng(4242);
  const samples=noiseBuffer.getChannelData(0);
  for(let i=0;i<samples.length;i++)samples[i]=random()*2-1;
  const playing=new Set();
  const shotTimes=[];
  let enabled=false, windSource=null;
  function voice(x,vol,duration,source,filter,offset=0,slow=false) {
    const now=ctx.currentTime;
    const envelope=ctx.createGain(), pan=ctx.createStereoPanner();
    envelope.gain.setValueAtTime(.0001,now);
    envelope.gain.exponentialRampToValueAtTime(vol,now+(slow?.24:.012));
    envelope.gain.exponentialRampToValueAtTime(slow?vol*.82:.0001,now+Math.max(.025,duration));
    pan.pan.value=(Math.max(0,Math.min(24,x))/12-1)*.8;
    if(filter)source.connect(filter).connect(envelope);
    else source.connect(envelope);
    envelope.connect(pan).connect(master);
    playing.add(source);
    source.onended=()=>{
      playing.delete(source);
      source.disconnect();
      if(filter)filter.disconnect();
      envelope.disconnect();
      pan.disconnect();
    };
    source.start(now,offset);
    if(!slow)source.stop(now+duration+.025);
    return source;
  }
  function sweep(x,start,end,dur,vol,wave="sine"){
    const o=ctx.createOscillator();
    o.type=wave;
    o.frequency.setValueAtTime(start,ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(end,ctx.currentTime+dur);
    voice(x,vol,dur,o,null);
  }
  function grit(x,hz,dur,vol,loop=false,offset=0){
    const s=ctx.createBufferSource(), f=ctx.createBiquadFilter();
    s.buffer=noiseBuffer;
    s.loop=loop;
    f.type="lowpass";
    f.frequency.value=hz;
    return voice(x,vol,dur,s,f,offset,loop);
  }
  const order=[1,5,2,6,3];
  return {
    active(on){
      if(on===enabled)return;
      enabled=on;
      const now=ctx.currentTime;
      master.gain.cancelScheduledValues(now);
      master.gain.setTargetAtTime(on?.57:0,now,.008);
      if(!on){
        for(const source of playing)try{source.stop(now+.035);}catch{}
        windSource=null;
      }
    },
    play(items){
      if(!enabled||ctx.state!=="running")return;
      const now=ctx.currentTime;
      while(shotTimes.length&&shotTimes[0]<=now-1)shotTimes.shift();
      const shots=[];
      for(const item of items){
        const [kind,x,,type]=item.event;
        const offset=(item.tick*.0157+item.index*.033)%1;
        if(kind==="shot")shots.push(item);
        else if(kind==="kill")sweep(x,155,49,.067,.105);
        else if(kind==="wave"){
          sweep(12,108,222,.39,.10,"triangle");
          sweep(12,164,330,.34,.065);
        }else if(kind==="leak"){
          grit(x,1400,.22,.24,false,offset);
          sweep(x,567,262,.35,.16,"triangle");
        }else if(kind==="fall"){
          grit(x,390,1.33,.47,false,0);
          sweep(x,85,26,1.44,.46);
        }
      }
      shots.sort((a,b)=>order[b.event[3]]-order[a.event[3]]);
      for(const item of shots){
        if(shotTimes.length>=12)break;
        shotTimes.push(now);
        const [,x,,type]=item.event;
        const offset=(item.tick*.013+item.index*.071)%1;
        if(type===0)sweep(x,680,117,.085,.15,"triangle");
        if(type===1){grit(x,750,.17,.32,false,offset);sweep(x,140,32,.17,.24);}
        if(type===2){grit(x,2600,.11,.10,false,offset);sweep(x,1110,580,.11,.085);}
        if(type===3){sweep(x,520,63,.185,.22,"sawtooth");grit(x,750,.18,.14,false,offset);}
        if(type===4){grit(x,1250,.116,.23,false,offset);sweep(x,226,82,.12,.12);}
      }
    },
    wind(on){
      if(on&&enabled&&!windSource&&ctx.state==="running")windSource=grit(12,270,.6,.045,true);
      if(!on&&windSource){windSource.stop();windSource=null;}
    }
  };
})();

const countdown=document.getElementById("countdown");
const scrubber=document.getElementById("scrubber");
const toggle=document.getElementById("btn-toggle");
const iconPause=document.getElementById("icon-pause");
const iconPlay=document.getElementById("icon-play");
const refire=document.getElementById("btn-refire");
const pills=[...document.querySelectorAll(".speed-pill")];
let state="COUNTDOWN", simTime=0, playbackSpeed=1;
let countdownElapsed=0,holdElapsed=0,lastWall=null,dragging=false;
let lastDrawn=NaN;
function hideCountdown(){countdown.style.display="none";countdown.textContent="";}
function setState(next) {
  state=next;
  if(next!=="COUNTDOWN")hideCountdown();
  const running=next==="PLAYING"||next==="COUNTDOWN"||next==="REFIRE_HOLD";
  iconPause.style.display=running?"":"none";
  iconPlay.style.display=running?"none":"";
  toggle.setAttribute("aria-label",running?"Pause":"Play");
  audio.active(next==="PLAYING"&&!dragging);
}
function show(time){
  render(time);
  lastDrawn=time;
}
hideCountdown();
window.addEventListener("resize",resize);
resize();
lastDrawn=0;
function advance(dt){
  const before=simTime;
  simTime=Math.min(DURATION,simTime+dt*playbackSpeed);
  scrubber.value=simTime.toFixed(3);
  if(!dragging){
    const first=bound(before+1e-9), end=bound(simTime+1e-9);
    if(end>first)audio.play(events.slice(first,end));
    audio.wind(run.fallTick>=0&&simTime>=run.fallTick/20+1.4);
  }
  if(simTime>=DURATION)setState("ENDED");
}
function update(wall){
  const dt=lastWall===null?0:Math.min((wall-lastWall)*.001,.1);
  lastWall=wall;
  if(state==="COUNTDOWN"){
    countdownElapsed+=dt;
    if(countdownElapsed>=3){
      setState("PLAYING");
      advance(countdownElapsed-3);
    }else{
      countdown.style.display="block";
      countdown.textContent=String(3-Math.floor(countdownElapsed));
    }
  }else if(state==="REFIRE_HOLD"){
    holdElapsed+=dt;
    if(holdElapsed>=1){
      setState("PLAYING");
      advance(holdElapsed-1);
    }
  }else if(state==="PLAYING")advance(dt);
  if(simTime!==lastDrawn){
    if(run.fallTick<0||simTime<run.fallTick/20+1.8||lastDrawn<run.fallTick/20+1.8)show(simTime);
  }
  requestAnimationFrame(update);
}
toggle.addEventListener("click",()=>{
  lastWall=performance.now();
  if(state==="PLAYING"||state==="COUNTDOWN"||state==="REFIRE_HOLD"){
    setState("PAUSED");
  }else{
    if(state==="ENDED"){
      simTime=0;
      scrubber.value="0";
      show(0);
    }
    setState("PLAYING");
  }
});
refire.addEventListener("click",()=>{
  lastWall=performance.now();
  simTime=0;
  holdElapsed=0;
  scrubber.value="0";
  setState("REFIRE_HOLD");
  show(0);
});
for(const pill of pills)pill.addEventListener("click",()=>{
  playbackSpeed=Number(pill.dataset.speed);
  for(const candidate of pills){
    candidate.classList.toggle("is-active",candidate===pill);
    candidate.setAttribute("aria-checked",String(candidate===pill));
  }
});
scrubber.addEventListener("pointerdown",()=>{
  dragging=true;
  audio.active(false);
});
for(const signal of ["pointerup","pointercancel"])window.addEventListener(signal,()=>{
  dragging=false;
  audio.active(state==="PLAYING");
});
scrubber.addEventListener("input",()=>{
  setState("PAUSED");
  simTime=Number(scrubber.value);
  show(simTime);
});
requestAnimationFrame(update);
})();
</script>
