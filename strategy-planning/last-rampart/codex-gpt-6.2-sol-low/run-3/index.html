<script id="rampart-strategy">
function createStrategy() {
  const layout = ['bolt','bolt','lance','cannon','cannon','flak','cannon','cannon','cannon','cannon','flak','bolt','bolt','bolt','frost','bolt'];
  const buildOrder = [11,3,1,8,9,14,10,5,15,2,6,4,7,13,0,12];
  const upgradeOrder = [6,1,3,0,12,4,11,7,5,9,13,10,2,8,14,15];
  const costs = {bolt:50,cannon:90,frost:70,lance:120,flak:80};
  const damage = {bolt:[26,41,65], cannon:[60,96,153], frost:[10,16,25], lance:[180,288,460], flak:[40,64,102]};
  return {
    plan(s) {
      let gold=s.gold;
      const actions=[];
      // Move anti-air spending forward when the next wave is unusually dense.
      const incomingWisps=s.nextWave.filter(type=>type==='wisp').length;
      const choices=[];
      for(const [priority,slot] of buildOrder.entries()) {
        if(s.slots[slot].turret)continue;
        const type=layout[slot];
        choices.push({slot,type,tier:0,priority:priority-(slot>=5&&type==='flak'&&incomingWisps>=3?3:0)});
      }
      for(const [priority,slot] of upgradeOrder.entries()) {
        const turret=s.slots[slot].turret;
        if(!turret||turret.tier===3)continue;
        const {type,tier}=turret;
        const push=type==='cannon'&&s.wave>=30?8:0;
        const air=slot>=5&&type==='flak'&&incomingWisps>=3?3:0;
        choices.push({slot,type,tier,priority:16*tier+priority-push-air});
      }
      const reserve=s.wave>1&&s.wave<8?38:0;
      const emergency=s.wave>=28&&s.enemies.filter(e=>e.air&&e.remaining<950).length>=4;
      const rear=s.slots[13].turret;
      if(emergency&&rear?.type==='bolt'&&gold+Math.floor(rear.spent*7/10)>=320) {
        return [{op:'sell',slot:13},{op:'build',type:'flak',slot:13},{op:'upgrade',slot:13},{op:'upgrade',slot:13}];
      }
      choices.sort((a,b)=>a.priority-b.priority || a.tier-b.tier ||
          (a.tier===0?buildOrder:upgradeOrder).indexOf(a.slot)-(b.tier===0?buildOrder:upgradeOrder).indexOf(b.slot));
      for(const {slot,tier,type} of choices) {
        const cost=costs[type]*Math.max(1,tier);
        if(gold-cost<reserve)break;
        gold-=cost;
        actions.push(tier?{op:'upgrade',slot}:{op:'build',slot,type});
      }
      return actions;
    },
    target(t,enemies) {
      const power=damage[t.type][t.tier-1];
      const splash=t.type==='cannon'?8100:t.type==='flak'?4900:0;
      const urgency=t.x>=1850?1.8:1;
      let best, value=-Infinity;
      for(const e of enemies) {
        const hit=Math.max(1,power-(t.type==='lance'?0:e.armor));
        let v=Math.min(hit,e.hp)/power*12+(hit>=e.hp?8:0)
          +Math.max(0,180-e.remaining/e.speed)*.12*urgency;
        if(e.type==='mender')v+=4;
        if(e.type==='brute'&&t.type==='lance')v+=3;
        if(t.type==='frost'&&!e.slowed)v+=15;
        if(splash)for(const other of enemies){
          const dx=e.x-other.x,dy=e.y-other.y;
          if(other===e||dx*dx+dy*dy>splash)continue;
          const secondary=Math.max(1,power-other.armor);
          v+=14*Math.min(secondary,other.hp)/power+(other.hp<=secondary?5:0);
        }
        if(v>value){value=v;best=e.id;}
      }
      return best;
    }
  };
}
</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks) {
  const capture = arguments[3];
  const ground = [[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]];
  const air = [[0,6],[21,6],[21,11],[23,11]];
  const locations = [[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],[14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]];
  const slots = locations.map(([x,y],slot) => ({slot,x:x*100+50,y:y*100+50,turret:null}));
  if (capture) capture.board({ground,air,locations});
  const weapons = [
    ['bolt',50,26,8,300,0,0,3], ['cannon',90,60,24,260,90,0,1],
    ['frost',70,10,12,240,0,30,3], ['lance',120,180,36,360,0,0,1], ['flak',80,40,10,320,70,0,2]
  ].map(([type,cost,damage,period,range,splash,slow,domain],index) => ({type,cost,damage,period,range,splash,slow,domain,index}));
  const types = [
    ['grunt',60,10,4,1,0,1,10], ['runner',40,20,4,1,0,2,4], ['wisp',50,12,6,2,1,3,3],
    ['brute',150,6,9,3,0,4,3], ['splitter',90,8,6,2,0,6,2], ['mender',70,8,7,2,0,8,1],
    ['splitling',0,12,1,1,0,Infinity,0]
  ].map(([type,hp,speed,bounty,leak,air,first,weight]) => ({type,hp,speed,bounty,leak,air,first,weight}));
  function draw() {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return (t ^ (t >>> 14)) >>> 0;
  }
  function generate(w) {
    const available = types.filter(e => e.first <= w);
    const total = available.reduce((sum,e) => sum + e.weight,0);
    return Array.from({length:4+Math.floor(3*w/5)}, () => {
      let r = draw() % total;
      return available.find(e => (r -= e.weight) < 0);
    });
  }
  function place(e) {
    const path = e.air ? air : ground;
    let distance = e.progress;
    for (let i = 1; i < path.length; i++) {
      const [x,y] = path[i-1], [nx,ny] = path[i];
      const length = 100*(Math.abs(nx-x)+Math.abs(ny-y));
      if (distance < length || i === path.length-1) {
        e.dx = Math.sign(nx-x); e.dy = Math.sign(ny-y);
        e.x = 100*x+50+e.dx*Math.min(length,distance);
        e.y = 100*y+50+e.dy*Math.min(length,distance);
        return;
      }
      distance -= length;
    }
  }
  function view(e) {
    const {id,type,hp,maxHp,x,y,air,armor,speed,remaining} = e;
    return {id,type,hp,maxHp,x,y,air,armor,speed,slowed:e.slow > 0,remaining};
  }
  function inRange(a,b,r) {
    const dx = a.x-b.x, dy = a.y-b.y;
    return dx*dx+dy*dy <= r*r;
  }
  const strategy = createStrategy(), log = [], queue = new Map();
  let next = generate(1), wave = 0, hp = 10, gold = 250, tick = 0, fallTick = -1, id = 0, scale = 1000;
  let enemies = [];
  const record = (code,a,b) => log.push([tick,code,a,b]);
  const effect = (code,data) => { if (capture) capture.event(tick,code,data); };
  function spawn(kind,w,maxHp,progress=0) {
    // The air waypoints total 2,800 centi-tiles, which reproduces both reference hashes.
    const length = kind.air ? 2800 : 4600;
    const e = {...kind,id:++id,wave:w,hp:maxHp,maxHp,progress,length,remaining:length-progress,age:0,slow:0,
      armor:kind.type === 'brute' ? 6+w : kind.type === 'grunt' ? Math.floor(w/4) : 0};
    place(e);
    enemies.push(e);
  }
  function snapshot() {
    if (capture) capture.frame(tick,{
      wave, hp, gold, next:next.map(e=>e.type),
      turrets:slots.map(s=>s.turret && {type:s.turret.type,tier:s.turret.tier}),
      enemies:enemies.map(e=>({...view(e),dx:e.dx,dy:e.dy}))
    });
  }
  for (; tick < maxTicks; tick++) {
    if (tick >= 20 && (tick-20)%40 === 0) {
      wave++;
      if (wave > 1) scale = Math.floor(scale*108/100);
      gold += Math.min(50,Math.floor(gold*5/100))+10+2*wave;
      const current = next;
      next = generate(wave+1);
      effect('wave',{wave,x:1200});
      const plan = strategy.plan({
        tick,wave,gold,baseHp:hp,
        slots:slots.map(({slot,x,y,turret:t})=>({slot,x,y,turret:t && {type:t.type,tier:t.tier,spent:t.spent}})),
        enemies:enemies.map(view),nextWave:next.map(e=>e.type)
      });
      if (Array.isArray(plan)) for (const action of plan.slice(0,32)) {
        if (!action || !Number.isInteger(action.slot) || action.slot < 0 || action.slot >= slots.length) continue;
        const s = slots[action.slot], t = s.turret;
        if (action.op === 'build' && !t) {
          const weapon = weapons.find(w=>w.type === action.type);
          if (!weapon || gold < weapon.cost) continue;
          gold -= weapon.cost;
          s.turret = {...weapon,tier:1,spent:weapon.cost,cooldown:0};
          record('B',s.slot,weapon.index);
          effect('B',{x:s.x,y:s.y,type:weapon.type});
        } else if (action.op === 'upgrade' && t && t.tier < 3 && gold >= t.cost*t.tier) {
          const price = t.cost*t.tier;
          gold -= price;
          t.spent += price;
          t.tier++;
          t.range += 30;
          t.damage = Math.floor(t.damage*16/10);
          record('U',s.slot,t.tier);
          effect('U',{x:s.x,y:s.y,type:t.type});
        } else if (action.op === 'sell' && t) {
          gold += Math.floor(t.spent*70/100);
          s.turret = null;
          record('S',s.slot,0);
          effect('S',{x:s.x,y:s.y,type:t.type});
        }
      }
      current.forEach((kind,i)=>{
        const due = tick+4*i;
        if (!queue.has(due)) queue.set(due,[]);
        queue.get(due).push({kind,wave,maxHp:Math.floor(kind.hp*scale/1000)});
      });
    }
    const due = queue.get(tick);
    if (due) {
      for (const e of due) spawn(e.kind,e.wave,e.maxHp);
      queue.delete(tick);
    }
    for (let i=0; i<enemies.length;) {
      const e = enemies[i];
      e.progress += e.slow ? Math.floor(e.speed*60/100) : e.speed;
      e.remaining = e.length-e.progress;
      place(e);
      if (e.remaining > 0) { i++; continue; }
      enemies.splice(i,1);
      hp -= e.leak;
      record('L',e.id,hp);
      effect('L',{x:2350,y:1150,hp});
      if (hp <= 0) {
        fallTick = tick;
        record('F',wave,0);
        effect('F',{x:2350,y:1150});
        break;
      }
    }
    if (fallTick !== -1) { snapshot(); break; }
    for (const e of enemies) {
      e.age++;
      if (e.type === 'mender' && e.age%20 === 0) {
        for (const recipient of enemies) if (inRange(e,recipient,150)) {
          recipient.hp = Math.min(recipient.maxHp,recipient.hp+Math.floor(recipient.maxHp*8/100));
        }
        effect('heal',{x:e.x,y:e.y});
      }
    }
    for (const s of slots) {
      const t = s.turret;
      if (!t || (t.cooldown > 0 && --t.cooldown > 0)) continue;
      const candidates = enemies.filter(e=>(t.domain & (1 << e.air)) && inRange(s,e,t.range));
      if (!candidates.length) continue;
      const chosen = strategy.target && strategy.target(
        {slot:s.slot,type:t.type,tier:t.tier,x:s.x,y:s.y,range:t.range}, candidates.map(view));
      const target = candidates.find(e=>e.id===chosen) ||
        candidates.reduce((a,b)=>b.remaining<a.remaining ? b : a);
      if (capture) effect('shot',{x:s.x,y:s.y,type:t.type,tx:target.x,ty:target.y,air:target.air,radius:t.splash});
      const hits = t.splash ? enemies.filter(e=>(t.domain & (1 << e.air)) && inRange(target,e,t.splash)) : [target];
      for (const e of hits) {
        e.hp -= Math.max(1,t.damage-(t.type==='lance' ? 0 : e.armor));
        if (t.slow) e.slow = t.slow;
      }
      t.cooldown = t.period;
      for (let i=0;i<enemies.length;) {
        const e = enemies[i];
        if (e.hp > 0) { i++; continue; }
        enemies.splice(i,1);
        gold += e.bounty;
        record('K',e.id,s.slot);
        effect('K',{x:e.x,y:e.y,type:e.type,air:e.air,id:e.id});
        if (e.type === 'splitter') for (let j=0;j<3;j++) {
          spawn(types[6],e.wave,Math.max(1,Math.floor(e.maxHp/4)),e.progress);
        }
      }
    }
    for (const e of enemies) if (e.slow > 0) e.slow--;
    snapshot();
  }
  const serialized = JSON.stringify(log);
  let hash = 0x811c9dc5;
  for (let i=0;i<serialized.length;i++) hash = Math.imul(hash ^ serialized.charCodeAt(i),0x01000193);
  return {score:Math.round(((fallTick === -1 ? maxTicks : fallTick)-20)*2.5)/100,
    fallTick,log,hash:(hash>>>0).toString(16).padStart(8,'0')};
}
</script>
<script>
(() => {
'use strict';
const DURATION = 100;
const frames = [], events = [];
let board, peakEnemies = 0;
const run = rampartSimulate(createStrategy, 42, 2020, {
  board(data) { board = data; },
  frame(tick,data) {
    data.byId = new Map(data.enemies.map(e=>[e.id,e]));
    frames[tick] = data;
    peakEnemies = Math.max(peakEnemies,data.enemies.length);
  },
  event(tick,code,data) { (events[tick] ||= []).push({code,...data}); }
});
const vectorA = rampartSimulate(() => ({
  plan(s) {
    let gold = s.gold;
    return s.slots.filter(slot=>!slot.turret && gold>=50 && (gold-=50)>=0)
      .map(({slot})=>({op:'build',slot,type:'bolt'}));
  }
}),42,12020).hash === '82a5353d';
const vectorB = rampartSimulate(() => ({
  plan(s) {
    return ({
      1:[{op:'build',slot:3,type:'cannon'},{op:'build',slot:6,type:'frost'}],
      3:[{op:'upgrade',slot:3},{op:'build',slot:12,type:'flak'}],
      6:[{op:'build',slot:8,type:'lance'},{op:'sell',slot:6}]
    })[s.wave] || [];
  }
}),7,12020).hash === '2e8858d7';
const testedSeeds = [7,11,21,100,12345,41237,87139,99173];
const testScores = testedSeeds.map(seed=>rampartSimulate(createStrategy,seed,12020).score);
window.BENCH_REPORT = {
  selfCheck:{vectorA,vectorB},
  strategy:{
    summary:'Use a cannon-heavy layout and prioritize splash clusters and leaking threats. Wisp-heavy previews accelerate anti-air investment, and a late air emergency can trigger a rear-turret replacement.',
    seedsTested:testedSeeds.length,
    meanScoreOnTestedSeeds:Math.round(100*testScores.reduce((sum,n)=>sum+n,0)/testScores.length)/100
  },
  seed42:{score:run.score,fallTick:run.fallTick},
  systems:{board:'full',enemiesAndTurrets:'full',combatVisuals:'full',fall:'full',hud:'full',audio:'full'},
  simplifications:[],
  testedInBrowser:true,
  measuredFps:null
};

function seeded(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t ^= t + Math.imul(t ^ t >>> 7, 61 | t);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const random=seeded(42);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({ canvas: document.getElementById('stage'), antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.08;
renderer.shadowMap.enabled=true;

      } else if(e.code==='F' && age<.94) {
        pulse(x,.126,z,age*9+.3,tinted('#ffd39f',1-age/.94),true);
        pulse(x,.13,z,age*6+.15,tinted('#f28868',1-age/.94));
        debris({...e,tick},age,20,'#ac9184',1.5);
      }
    }
  }
  return {aimed,recentLeak};
}

const atlas=document.createElement('canvas');
atlas.width=640; atlas.height=96;
const ctx=atlas.getContext('2d');
ctx.font='700 80px monospace';
ctx.textBaseline='middle'; ctx.textAlign='center'; ctx.fillStyle='#fff8e6';
for(let i=0;i<10;i++) ctx.fillText(i,i*64+32,48);
const digits=new Array(10);
const atlasTexture=new THREE.CanvasTexture(atlas);
atlasTexture.encoding=THREE.sRGBEncoding;
for(let i=0;i<10;i++){
  const texture=atlasTexture.clone();
  texture.offset.x=i/10; texture.repeat.x=.1; texture.needsUpdate=true;
  digits[i]=new THREE.SpriteMaterial({map:texture,toneMapped:false,depthTest:false});
}
const glyphs=[];
let glyphIndex=0;
function number(value,left,top,height) {
  const width=height*2/3;
  for(const char of String(value)) {
    if(glyphIndex===glyphs.length) {
      const sprite=new THREE.Sprite(digits[0]);
      glyphs.push(sprite); hud.add(sprite);
    }
    const sprite=glyphs[glyphIndex++];
    sprite.material=digits[Number(char)]; sprite.visible=true;
    sprite.position.set(left+width/2,top-height/2,1); sprite.scale.set(width,height,1);
    left+=width*.86;
  }
  return left;
}
function uiMesh(key,tint) {
  const m=new THREE.Mesh(geometry[key],new THREE.MeshBasicMaterial({color:tint,depthTest:false,toneMapped:false}));
  hud.add(m); return m;
}
function uiPart(m,x,y,w,h,rotation=0){
  m.position.set(x,y,0); m.scale.set(w,h,1); m.rotation.z=rotation;
}
const banner=uiMesh('box','#dfac6a'), pole=uiMesh('box','#eed6ac'), crossbar=uiMesh('box','#9f6442');
const coin=uiMesh('sphere','#eeb85d'), coinFace=uiMesh('sphere','#ae773f');
const pips=Array.from({length:10},()=>uiMesh('box','#f2ac73'));
const previews=Object.keys(enemyColors).filter(type=>type!=='splitling').map(type=>({
  type,m:uiMesh(({grunt:'box',runner:'cone',wisp:'oct',brute:'hex',splitter:'oct',mender:'sphere'})[type],enemyColors[type])
}));
let width=0,height=0;
function drawHud(f,leakAge) {
  const waveHeight=Math.max(56,height*.12), top=height-16, left=26;
  glyphIndex=0;
  uiPart(pole,left+5,top-25,3,32);
  uiPart(banner,left+16,top-21,19,19);
  uiPart(crossbar,left+16,top-28,17,3);
  number(f.wave,left+36,top,waveHeight);
  uiPart(coin,left+11,top-waveHeight-9,20,20);
  uiPart(coinFace,left+11,top-waveHeight-9,11,11);
  number(f.gold,left+33,top-waveHeight+6,30);
  let x=left+9;
  const row=top-waveHeight-38;
  const counts={};
  for(const type of f.next) counts[type]=(counts[type]||0)+1;
  for(const {type,m} of previews) {
    m.visible=Boolean(counts[type]);
    if(!m.visible)continue;
    uiPart(m,x,row,type==='brute'?19:15,15,type==='runner'?-Math.PI/2:0);
    x=number(counts[type],x+10,row+10,20)+12;
  }
  for(let i=glyphIndex;i<glyphs.length;i++) glyphs[i].visible=false;
  for(let i=0;i<10;i++) {
    const missing=i>=f.hp;
    pips[i].material.color.set(missing?(leakAge<.24?'#fa594e':'#3a3c48'):'#f2ac73');
    uiPart(pips[i],width-26-(9-i)*16,top-11,10,missing?12:17,.15);
  }
}

const center=new THREE.Vector3(12,0,7);
const direction=new THREE.Vector3(-.12,1.428,1).normalize();
const restingCamera=new THREE.Vector3();
function resize() {
  width=window.innerWidth; height=window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  camera.aspect=width/height; camera.updateProjectionMatrix();
  // Move the optical centre upward within the viewport to reserve the dock.
  camera.projectionMatrix.elements[9]=-Math.min(.16,84/height);
  camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
  let distance=20;
  const trial=new THREE.Vector3(), bounds=[];
  for(const x of [-.7,24.7])for(const z of [-.7,14.7]) {
    bounds.push([x,0,z],[x,-1.55,z]);
  }
  bounds.push([24.5,2.05,12.45],[22.45,2.05,10.5]);
  for(let i=0;i<50;i++) {
    camera.position.copy(center).addScaledVector(direction,distance);
    camera.lookAt(center); camera.updateMatrixWorld();
    const fits=bounds.every(([x,y,z])=>{
      trial.set(x,y,z).project(camera);
      return Math.abs(trial.x)<=.973 && trial.y<=.94 && trial.y>=-1+Math.min(.58,190/height);
    });
    if(fits)break;
    distance*=1.06;
  }
  restingCamera.copy(camera.position);
  uiCamera.right=width; uiCamera.top=height; uiCamera.updateProjectionMatrix();
}
let simTime=0;
function render(t) {
  const k=Math.min(Math.floor(t*20),frames.length-1);
  const f=frames[k], next=frames[Math.min(k+1,frames.length-1)];
  const fraction=clamp(t*20-k);
  const worldTime=Math.min(t,fallTime);
  for(const mesh of dynamic.values())mesh.count=0;
  const {aimed,recentLeak}=effects(t,k);
  for(const e of f.enemies) {
    const after=next.byId.get(e.id);
    let x=e.x/100,z=e.y/100;
    if(after) {
      // Follow both legs when an interpolation interval crosses a path corner.
      const stride=e.remaining-after.remaining;
      const first=after.dx!==e.dx||after.dy!==e.dy ?
        Math.abs((e.dx?after.x-e.x:after.y-e.y)) : stride;
      const move=stride*fraction;
      x+=(e.dx*Math.min(move,first)+after.dx*Math.max(0,move-first))/100;
      z+=(e.dy*Math.min(move,first)+after.dy*Math.max(0,move-first))/100;
    }
    if(e.type==='splitling'){
      const offset=(e.id%3-1)*.135;
      x+=offset*e.dy; z-=offset*e.dx;
    }
    const lift=e.air?.8+.047*Math.sin(worldTime*7+e.id):0;
    if(e.air) {
      part('plane','shadow','#0d141b',x,.065,z,.7,1,.63);
      part('plane','halo','#62defa',x,lift-.03,z,1.26,1,1.26);
    }
    if(e.type==='mender')part('plane','halo','#8affad',x,.115,z,1.23,1,1.23);
    const facing=Math.atan2(e.dx,e.dy)+(e.air?worldTime*1.9:0);
    model(enemyModels[e.type],x,lift,z,facing,e.slowed?frostTint:null);
    const y=lift+(e.air?.45:e.type==='brute'?.64:.53), size=e.type==='splitling'?.24:.43;
    const ratio=clamp(e.hp/e.maxHp);
    part('plane','fx','#182231',x,y,z,size+ .035,1,.085,.45);
    if(ratio>0)part('plane','fx',e.slowed?'#72e2ff':ratio<.3?'#ff775c':'#a6db8e',
      x-(1-ratio)*size/2,y+.007,z,size*ratio,1,.045,.45);
  }
  for(let i=0;i<f.turrets.length;i++) {
    const turret=f.turrets[i];
    if(!turret)continue;
    const [px,pz]=board.locations[i], x=px+.5,z=pz+.5;
    const heading=aimed.get((px*100+50)+','+(pz*100+50))??-Math.PI/2;
    part('hex','solid','#283545',x,.377,z,.74,.19,.74,0,Math.PI/6);
    part('cylinder','solid',weaponColors[turret.type],x,.51,z,.51,.26,.51);
    model(turretModels[turret.type],x,0,z,heading);
    for(let j=0;j<turret.tier;j++)
      part('sphere','fx','#ffe5a6',x+(j-(turret.tier-1)/2)*.14,.357,z+.397,.085,.083,.085);
  }
  drawKeep(f.hp,t,recentLeak);
  let shake=0;
  for(let i=trauma.length-1;i>=0;i--) if(trauma[i].time<=t) {
    shake=clamp(trauma[i].amount-(t-trauma[i].time))**2*.25; break;
  }
  camera.position.copy(restingCamera);
  camera.position.x+=shake*.78*Math.sin(t*35+noisePhase[0]);
  camera.position.y+=shake*.36*Math.sin(t*38+noisePhase[1]);
  camera.position.z+=shake*.51*Math.sin(t*29+noisePhase[2]);
  camera.lookAt(center);
  for(const mesh of dynamic.values()) if(mesh.count) {
    mesh.instanceMatrix.updateRange.count=mesh.count*16; mesh.instanceMatrix.needsUpdate=true;
    mesh.instanceColor.updateRange.count=mesh.count*3; mesh.instanceColor.needsUpdate=true;
  }
  stage.style.filter=t>=fallTime?'grayscale('+(.94*clamp(t-fallTime))+')':'';
  drawHud(f,recentLeak);
  renderer.clear(true,true,true);
  renderer.render(scene,camera);
  renderer.clearDepth();
  renderer.render(hud,uiCamera);
}

const COUNTDOWN='COUNTDOWN', PLAYING='PLAYING', PAUSED='PAUSED', REFIRE_HOLD='REFIRE_HOLD', ENDED='ENDED';
let state=COUNTDOWN, playbackSpeed=1, countdownElapsed=0, holdElapsed=0, previousWall=null;
const countdown=document.getElementById('countdown'), scrubber=document.getElementById('scrubber');
const toggle=document.getElementById('btn-toggle'), pauseIcon=document.getElementById('icon-pause'), playIcon=document.getElementById('icon-play');
const audioRandom=seeded(4242);
let audio, master, noise, wind, dragging=false;
const activeSounds=new Set(), shotTimes=[];
let lastKill=-Infinity;
try {
  const Audio=window.AudioContext||window.webkitAudioContext;
  audio=new Audio();
  master=audio.createGain(); master.gain.value=0;
  const compressor=audio.createDynamicsCompressor();
  compressor.threshold.value=-18; compressor.ratio.value=5;
  master.connect(compressor).connect(audio.destination);
  noise=audio.createBuffer(1,audio.sampleRate*2,audio.sampleRate);
  const data=noise.getChannelData(0);
  for(let i=0;i<data.length;i++)data[i]=audioRandom()*2-1;
  const unlock=()=>audio.resume().catch(()=>{});
  unlock();
  function gesture(){
    unlock();
    window.removeEventListener('pointerdown',gesture,true);
    window.removeEventListener('keydown',gesture,true);
  }
  window.addEventListener('pointerdown',gesture,true);
  window.addEventListener('keydown',gesture,true);
} catch {
  audio=null;
  window.BENCH_REPORT.systems.audio='missing';
  window.BENCH_REPORT.simplifications.push('Web Audio could not initialize in this browser.');
}
function stopWind() {
  if(!wind)return;
  try{wind.stop(audio.currentTime+.04);}catch{}
  wind=null;
}
function syncAudio() {
  if(!audio)return;
  const now=audio.currentTime, open=state===PLAYING&&!dragging;
  master.gain.cancelScheduledValues(now);
  master.gain.setTargetAtTime(open?.52:0,now,.008);
  if(!open) {
    for(const voice of activeSounds)try{voice.stop(now+.04);}catch{}
    activeSounds.clear(); stopWind();
  } else if(simTime>=fallTime+1&&!wind) startWind();
}
function panSource(source,volume,pan,seconds,delay=0) {
  const now=audio.currentTime+delay;
  const envelope=audio.createGain();
  const panner=audio.createStereoPanner();
  panner.pan.value=clamp(pan,-1,1);
  source.connect(envelope).connect(panner).connect(master);
  envelope.gain.setValueAtTime(.0001,now);
  envelope.gain.exponentialRampToValueAtTime(volume,now+.009);
  envelope.gain.exponentialRampToValueAtTime(.0001,now+seconds);
  activeSounds.add(source);
  source.onended=()=>{activeSounds.delete(source);source.disconnect();envelope.disconnect();panner.disconnect();};
  source.start(now); source.stop(now+seconds+.015);
}
function tone(from,to,duration,volume,pan,type='sine',delay=0) {
  const voice=audio.createOscillator(), now=audio.currentTime+delay;
  voice.type=type;
  voice.frequency.setValueAtTime(from,now);
  voice.frequency.exponentialRampToValueAtTime(to,now+duration);
  panSource(voice,volume,pan,duration,delay);
}
function burst(frequency,duration,volume,pan) {
  const source=audio.createBufferSource(); source.buffer=noise;
  const filter=audio.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value=frequency;
  source.connect(filter);
  const now=audio.currentTime;
  const envelope=audio.createGain(); const panner=audio.createStereoPanner();
  filter.connect(envelope).connect(panner).connect(master); panner.pan.value=pan;
  envelope.gain.setValueAtTime(volume,now);
  envelope.gain.exponentialRampToValueAtTime(.0001,now+duration);
  activeSounds.add(source);
  source.onended=()=>{activeSounds.delete(source);source.disconnect();filter.disconnect();envelope.disconnect();panner.disconnect();};
  source.start(now,audioRandom()*.9);source.stop(now+duration+.01);
}
function startWind() {
  if(!audio||wind||state!==PLAYING||dragging)return;
  const w=audio.createBufferSource(), filter=audio.createBiquadFilter(), gain=audio.createGain();
  w.buffer=noise;w.loop=true; filter.type='lowpass';filter.frequency.value=205;gain.gain.value=.065;
  w.connect(filter).connect(gain).connect(master);
  w.onended=()=>{w.disconnect();filter.disconnect();gain.disconnect();};
  w.start();wind=w;
}
const audioPriority={lance:5,cannon:4,flak:3,frost:2,bolt:1};
function shotAudio(e){
  const pan=clamp((e.x/1200-1)*.8,-1,1), v=.91+audioRandom()*.18;
  if(e.type==='bolt')tone(410*v,155*v,.095,.107,pan,'triangle');
  else if(e.type==='cannon'){tone(109*v,43*v,.22,.22,pan,'triangle');burst(1200,.16,.14,pan);}
  else if(e.type==='frost')tone(1120*v,615*v,.16,.095,pan,'sine');
  else if(e.type==='lance'){tone(174*v,61*v,.31,.18,pan,'sawtooth');tone(446*v,260*v,.14,.045,pan);}
  else {burst(2360,.12,.14,pan);tone(233*v,98*v,.11,.087,pan,'square');}
}
function playCrossed(from,to) {
  if(!audio||audio.state!=='running'||state!==PLAYING||dragging)return;
  const shots=[];
  const now=audio.currentTime;
  for(let tick=Math.floor(from*20)+1;tick<=Math.floor(to*20);tick++)for(const e of events[tick]||[]){
    const pan=clamp((e.x/1200-1)*.8,-1,1);
    if(e.code==='shot')shots.push(e);
    if(e.code==='K'&&now-lastKill>.054){tone(180,87,.085,.073,pan);lastKill=now;}
    if(e.code==='wave'){tone(180,284,.37,.14,0,'triangle');tone(361,412,.31,.057,0,'sine',.075);}
    if(e.code==='L'){burst(1850,.23,.29,pan);tone(450,305,.38,.15,pan,'triangle');}
    if(e.code==='F'){burst(310,.92,.39,pan);tone(78,27,1.05,.29,pan,'triangle');}
  }
  while(shotTimes.length && now-shotTimes[0]>=1)shotTimes.shift();
  shots.sort((a,b)=>audioPriority[b.type]-audioPriority[a.type]);
  for(const e of shots) {
    if(shotTimes.length>=12)break;
    shotTimes.push(now); shotAudio(e);
  }
  if(to>=fallTime+1)startWind();
}

function hideCountdown() {
  countdown.style.display='none'; countdown.textContent='';
}
function transition(next) {
  state=next;
  const pause=next===PLAYING||next===COUNTDOWN||next===REFIRE_HOLD;
  pauseIcon.style.display=pause?'':'none';
  playIcon.style.display=pause?'none':'';
  toggle.setAttribute('aria-label',pause?'Pause':'Play');
  if(next!==COUNTDOWN)hideCountdown();
  syncAudio();
}
function resetTime() {
  simTime=0; scrubber.value='0'; render(0);
}
function advance(dt) {
  const from=simTime;
  simTime=Math.min(DURATION,simTime+dt*playbackSpeed);
  scrubber.value=simTime.toFixed(3);
  playCrossed(from,simTime);
  if(from<fallTime+1||simTime>=DURATION)render(simTime);
  if(simTime>=DURATION)transition(ENDED);
}
toggle.addEventListener('click',()=>{
  if(state===COUNTDOWN||state===REFIRE_HOLD) {
    resetTime(); transition(PAUSED);
  } else if(state===PLAYING) transition(PAUSED);
  else {
    if(state===ENDED)resetTime();
    previousWall=performance.now(); transition(PLAYING);
  }
});
document.getElementById('btn-refire').addEventListener('click',()=>{
  holdElapsed=0; previousWall=performance.now();
  transition(REFIRE_HOLD); resetTime();
});
scrubber.addEventListener('pointerdown',()=>{dragging=true;syncAudio();});
function releaseScrubber(){if(dragging){dragging=false;syncAudio();}}
window.addEventListener('pointerup',releaseScrubber);
window.addEventListener('pointercancel',releaseScrubber);
scrubber.addEventListener('input',()=>{
  transition(PAUSED);
  simTime=Number.parseFloat(scrubber.value);
  render(simTime);
});
const speedPills=[...document.querySelectorAll('.speed-pill')];
for(const pill of speedPills) pill.addEventListener('click',()=>{
  playbackSpeed=Number(pill.dataset.speed);
  for(const button of speedPills){
    button.classList.toggle('is-active',button===pill);
    button.setAttribute('aria-checked',String(button===pill));
  }
});
function animate(wall) {
  const rawDt=previousWall===null?0:Math.max(0,(wall-previousWall)/1000);
  const dt=Math.min(rawDt,.1);
  previousWall=wall;
  if(state===COUNTDOWN) {
    countdownElapsed+=dt;
    if(countdownElapsed>=3) {
      transition(PLAYING); advance(Math.min(dt,countdownElapsed-3));
    } else {
      countdown.style.display='block';
      countdown.textContent=String(3-Math.floor(countdownElapsed));
    }
  } else if(state===REFIRE_HOLD) {
    holdElapsed+=rawDt;
    if(holdElapsed>=1)transition(PLAYING);
  } else if(state===PLAYING)advance(dt);
  requestAnimationFrame(animate);
}
window.addEventListener('resize',()=>{resize();render(simTime);});
resize();
countdown.style.display='none';
render(0);
requestAnimationFrame(animate);
})();
</script>
