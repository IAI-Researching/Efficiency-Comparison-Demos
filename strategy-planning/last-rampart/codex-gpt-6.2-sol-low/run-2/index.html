<script id="rampart-strategy">
function createStrategy() {
  const stats = {bolt:[50,26,0],cannon:[90,60,90],frost:[70,10,0],lance:[120,180,0],flak:[80,40,70]};
  const layout = ['cannon', 'cannon', 'cannon', 'cannon', 'cannon', 'cannon', 'cannon', 'cannon', 'flak', 'cannon', 'flak', 'cannon', 'flak', 'cannon', 'bolt', 'lance'];
  const priority = [1.12,1.05,1.06,1,0.94,1.24,1.03,0.92,1.24,0.9,1.2,1.05,1.06,1.16,0.93,1.02];
  function plan(state) {
    if (state.wave === 1) return [{op:'build',slot:0,type:'cannon'},{op:'build',slot:2,type:'lance'}];
    let gold = state.gold;
    const slots = state.slots.map(s => s.turret);
    const actions = [];
    const flyers = state.enemies.filter(e => e.air);
    const airThreat = flyers.some(e => e.remaining < 1100) || state.nextWave.filter(t => t === 'wisp').length >= 3;
    if (state.wave < 5 && !airThreat && flyers.length === 0) return actions;
    while (actions.length < 32) {
      let best = null;
      const hasFlak = slots.some(s => s && s.type === 'flak');
      for (let slot = 0; slot < slots.length; slot++) {
        const current = slots[slot];
        const type = current ? current.type : layout[slot];
        const tier = current ? current.tier : 0;
        const cost = stats[type][0] * (tier === 2 ? 2 : 1);
        if (tier === 3 || cost > gold || (type === 'flak' && state.wave < 3)) continue;
        let value = priority[slot] * [1,0.86,0.57][tier];
        if (type === 'flak') value *= airThreat ? (hasFlak ? 1.16 : 2.32) : 0.76;
        else if (state.wave < 12 && slot <= 3) value *= 1.22;
        if (!best || value > best.value) best = {slot,type,tier,cost,value};
      }
      if (!best) break;
      const {slot,type,tier,cost} = best;
      actions.push(tier ? {op:'upgrade',slot} : {op:'build',slot,type});
      slots[slot] = {type,tier:tier+1};
      gold -= cost;
    }
    return actions;
  }
  function target(turret, candidates) {
    const [,base,radius] = stats[turret.type];
    let damage = base;
    for (let i = 1; i < turret.tier; i++) damage = Math.floor(damage * 16/10);
    const values = candidates.map(e => {
      const hit = Math.max(1,damage-(turret.type === 'lance' ? 0 : e.armor));
      return (Math.min(e.hp,hit)+(hit >= e.hp ? (e.type === 'mender' ? 39 : 15) : 0)) *
        (1+Math.max(0,850-e.remaining)/220)*(e.type === 'mender' ? 1.45 : 1);
    });
    let best = -Infinity, id = candidates[0].id;
    for (let i = 0; i < candidates.length; i++) {
      const e = candidates[i];
      let value = values[i]-0.0001*e.remaining;
      if (radius) for (let j = 0; j < candidates.length; j++) {
        const other = candidates[j];
        if (i !== j && (e.x-other.x)**2+(e.y-other.y)**2 <= radius*radius) value += values[j];
      }
      if (value > best) { best = value; id = e.id; }
    }
    return id;
  }
  return {plan,target};
}
</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks, record = null) {
  const paths = [
    [[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]],
    [[0,6],[21,6],[21,11],[23,11]]
  ].map(route => route.map(([x,y]) => [100*x+50,100*y+50]));
  // The listed waypoints total 2800 in the air, as confirmed by both reference vectors.
  const lengths = [4600,2800];
  const types = [
    ['grunt',60,10,4,1,0,1,10], ['runner',40,20,4,1,0,2,4],
    ['wisp',50,12,6,2,1,3,3], ['brute',150,6,9,3,0,4,3],
    ['splitter',90,8,6,2,0,6,2], ['mender',70,8,7,2,0,8,1],
    ['splitling',0,12,1,1,0,Infinity,0]
  ];
  const names = ['bolt','cannon','frost','lance','flak'];
  const weapons = [
    [50,26,8,300,0,0,0,3], [90,60,24,260,90,0,0,1],
    [70,10,12,240,0,30,0,3], [120,180,36,360,0,0,1,1],
    [80,40,10,320,70,0,0,2]
  ];
  const slots = [[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],
    [14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]]
    .map(([x,y],slot) => ({slot,x:100*x+50,y:100*y+50,turret:null}));
  const strategy = createStrategy();
  const log = [], enemies = [], spawns = new Map(), multiplier = [0,1000];
  let wave = 0, gold = 250, baseHp = 10, nextId = 1, fallTick = -1;
  function draw() {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return (t ^ (t >>> 14)) >>> 0;
  }
  function composition(w) {
    const eligible = types.filter(row => row[6] <= w);
    const weight = eligible.reduce((n,row) => n+row[7],0);
    return Array.from({length:4+Math.floor(3*w/5)}, () => {
      let r = draw() % weight;
      for (const row of eligible) {
        r -= row[7];
        if (r < 0) return row;
      }
    });
  }
  function locate(e) {
    const route = paths[e.air];
    let distance = e.progress;
    for (let i = 1; i < route.length; i++) {
      const [x,y] = route[i-1], [nx,ny] = route[i];
      const segment = Math.abs(nx-x)+Math.abs(ny-y);
      if (distance < segment || i === route.length-1) {
        e.dx = Math.sign(nx-x);
        e.dy = Math.sign(ny-y);
        e.x = x + e.dx*distance;
        e.y = y + e.dy*distance;
        return;
      }
      distance -= segment;
    }
  }
  function spawn(row,w,progress=0,hp=Math.floor(row[1]*multiplier[w]/1000)) {
    const [type,,speed,bounty,leak,air] = row;
    const armor = type === 'grunt' ? Math.floor(w/4) : type === 'brute' ? 6+w : 0;
    const e = {id:nextId++,type,hp,maxHp:hp,speed,bounty,leak,air,armor,w,progress,slow:0,age:0};
    locate(e);
    enemies.push(e);
  }
  function view(e) {
    const {id,type,hp,maxHp,x,y,air,armor,speed,slow} = e;
    return {id,type,hp,maxHp,x,y,air,armor,speed,slowed:slow>0,remaining:lengths[air]-e.progress};
  }
  const distance2 = (a,b) => (a.x-b.x)**2+(a.y-b.y)**2;
  let next = composition(1);
  for (let tick = 0; tick < maxTicks; tick++) {
    const effects = record ? [] : null;
    const emit = (kind, data) => { if (effects) effects.push({kind,...data}); };
    if (tick >= 20 && (tick-20)%40 === 0) {
      wave++;
      gold += Math.min(50,Math.floor(gold*5/100))+10+2*wave;
      if (wave > 1) multiplier[wave] = Math.floor(multiplier[wave-1]*108/100);
      const current = next;
      next = composition(wave+1);
      emit('wave',{});
      const actions = strategy.plan({tick,wave,gold,baseHp,
        slots:slots.map(({slot,x,y,turret}) => ({slot,x,y,turret:turret && {type:turret.type,tier:turret.tier,spent:turret.spent}})),
        enemies:enemies.map(view),nextWave:next.map(row => row[0])});
      if (Array.isArray(actions)) for (const action of actions.slice(0,32)) {
        if (!action || !Number.isInteger(action.slot)) continue;
        const s = slots[action.slot];
        if (!s) continue;
        const t = s.turret;
        if (action.op === 'build' && !t) {
          const typeIndex = names.indexOf(action.type), stats = weapons[typeIndex];
          if (!stats || gold < stats[0]) continue;
          gold -= stats[0];
          s.turret = {type:action.type,typeIndex,tier:1,spent:stats[0],damage:stats[1],range:stats[3],cooldown:0};
          log.push([tick,'B',s.slot,typeIndex]);
          emit('build',{x:s.x,y:s.y});
        } else if (action.op === 'upgrade' && t && t.tier < 3) {
          const cost = weapons[t.typeIndex][0]*t.tier;
          if (gold < cost) continue;
          gold -= cost;
          t.spent += cost;
          t.damage = Math.floor(t.damage*16/10);
          t.range += 30;
          log.push([tick,'U',s.slot,++t.tier]);
          emit('upgrade',{x:s.x,y:s.y});
        } else if (action.op === 'sell' && t) {
          gold += Math.floor(t.spent*70/100);
          s.turret = null;
          log.push([tick,'S',s.slot,0]);
          emit('sell',{x:s.x,y:s.y});
        }
      }
      current.forEach((row,i) => {
        const when = tick+4*i;
        if (!spawns.has(when)) spawns.set(when,[]);
        spawns.get(when).push([row,wave]);
      });
    }
    for (const [row,w] of spawns.get(tick) || []) spawn(row,w);
    spawns.delete(tick);
    for (let i = 0; i < enemies.length;) {
      const e = enemies[i];
      e.progress += e.slow > 0 ? Math.floor(e.speed*60/100) : e.speed;
      locate(e);
      if (e.progress < lengths[e.air]) { i++; continue; }
      enemies.splice(i,1);
      baseHp -= e.leak;
      log.push([tick,'L',e.id,baseHp]);
      emit('leak',{x:2350,y:1150});
      if (baseHp <= 0) {
        fallTick = tick;
        log.push([tick,'F',wave,0]);
        emit('fall',{x:2350,y:1150});
        break;
      }
    }
    if (fallTick < 0) {
      for (const e of enemies) if (++e.age % 20 === 0 && e.type === 'mender') {
        emit('heal',{x:e.x,y:e.y,radius:150});
        for (const other of enemies) if (distance2(e,other)<=22500) {
          other.hp = Math.min(other.maxHp,other.hp+Math.floor(other.maxHp*8/100));
        }
      }
      for (const s of slots) {
        const t = s.turret;
        if (!t) continue;
        if (t.cooldown > 0 && --t.cooldown > 0) continue;
        const [,,period,,radius,slow,pierce,domains] = weapons[t.typeIndex];
        const candidates = enemies.filter(e => (domains & (1<<e.air)) && distance2(e,s)<=t.range*t.range);
        if (!candidates.length) continue;
        const id = strategy.target?.({slot:s.slot,type:t.type,tier:t.tier,x:s.x,y:s.y,range:t.range},candidates.map(view));
        const chosen = candidates.find(e => e.id === id) || candidates.reduce((a,b) =>
          lengths[b.air]-b.progress < lengths[a.air]-a.progress ? b : a);
        emit('shot',{x:s.x,y:s.y,tx:chosen.x,ty:chosen.y,air:chosen.air,type:t.typeIndex,radius,slot:s.slot});
        for (const e of radius ? enemies : [chosen]) {
          if (radius && (!(domains & (1<<e.air)) || distance2(e,chosen)>radius*radius)) continue;
          e.hp -= Math.max(1,t.damage-(pierce ? 0 : e.armor));
          if (slow) e.slow = slow;
        }
        t.cooldown = period;
        for (let i = 0; i < enemies.length;) {
          const e = enemies[i];
          if (e.hp > 0) { i++; continue; }
          enemies.splice(i,1);
          gold += e.bounty;
          log.push([tick,'K',e.id,s.slot]);
          emit('kill',{x:e.x,y:e.y,air:e.air,type:e.type});
          if (e.type === 'splitter') for (let j = 0; j < 3; j++) {
            spawn(types[6],e.w,e.progress,Math.max(1,Math.floor(e.maxHp/4)));
          }
        }
      }
      for (const e of enemies) if (e.slow > 0) e.slow--;
    }
    if (record) record(tick,{wave,gold,baseHp,effects,next:next.map(row => row[0]),
      slots:slots.map(s => s.turret && [s.turret.typeIndex,s.turret.tier]),
      enemies:enemies.map(e => ({...view(e),dx:e.dx,dy:e.dy,progress:e.progress}))});
    if (fallTick >= 0) break;
  }
  let hash = 0x811c9dc5;
  const json = JSON.stringify(log);
  for (let i = 0; i < json.length; i++) hash = Math.imul(hash ^ json.charCodeAt(i),0x01000193);
  const score = Math.round(((fallTick < 0 ? maxTicks : fallTick)-20)*2.5)/100;
  return {score,fallTick,log,hash:(hash>>>0).toString(16).padStart(8,'0')};
}
</script>
<script>
(() => {
  'use strict';
  const DURATION = 100, RATE = 20;
  const $ = id => document.getElementById(id);
  const frames = [];
  const replay = rampartSimulate(createStrategy,42,2020,(tick,frame) => {frames[tick]=frame;});
  const slotTiles = [[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],[14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]];
  const road = [[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]];
  const lane = [[0,6],[21,6],[21,11],[23,11]];
  const enemyTypes = ['grunt','runner','wisp','brute','splitter','mender','splitling'];
  const enemyPalette = [0x8ea991,0xffc047,0x45eaff,0xd67740,0xb863e5,0xe9fff2,0xc18afb];
  const turretPalette = [0x6d9bcc,0xc88a46,0xc4f4ff,0xdc3a58,0x23b3a6];
  const shotPalette = [0x99d7ff,0xffbc65,0xc0faff,0xff3467,0x5fffe1];
  const clamp = (n,a=0,b=1) => Math.min(b,Math.max(a,n));
  const lerp = (a,b,t) => a+(b-a)*t;
  const tau = 2*Math.PI;
  function randomGenerator(seed) {
    return () => {
      seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15),1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7),61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0)/4294967296;
    };
  }
  const random = randomGenerator(42);
  const shakeNoise = randomGenerator(42);
  const shakePhase = Array.from({length:4},()=>shakeNoise()*tau);
  let trauma = 0, lastLeak = -100, leaks = 0;
  for (let i=0;i<frames.length;i++) {
    const frame=frames[i];
    trauma=Math.max(0,trauma-1/RATE);
    for (const effect of frame.effects) {
      if (effect.kind==='leak') {trauma=clamp(trauma+.3);lastLeak=i;leaks++;}
      if (effect.kind==='fall') trauma=1;
      effect.seed=(random()*4294967296)>>>0;
    }
    frame.trauma=trauma;
    frame.lastLeak=lastLeak;
    frame.leaks=leaks;
    frame.byId=new Map(frame.enemies.map(e => [e.id,e]));
  }

  const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('stage'),antialias:true,alpha:true});
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.08;
  renderer.setClearColor(0x000000,0);
  renderer.autoClear=false;
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(35,1,.1,500);
  const hud=new THREE.Scene();
  const hudCamera=new THREE.OrthographicCamera(0,1,1,0,.1,50);
  hudCamera.position.z=10;
  const focus=new THREE.Vector3(12,0,8.1), home=new THREE.Vector3();
  const upAngle=55*Math.PI/180;
  let width,height;
  function resize() {
    width=window.innerWidth;height=window.innerHeight;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1,2));
    renderer.setSize(window.innerWidth,window.innerHeight,false);
    camera.aspect=width/height;
    camera.updateProjectionMatrix();
    for (let distance=26;distance<260;distance+=.65) {
      home.copy(focus).add(new THREE.Vector3(0,Math.sin(upAngle)*distance,Math.cos(upAngle)*distance));
      camera.position.copy(home);

      for(let i=0;i<9;i++){
        const a=i*tau/9+age*3, s=.11*(1-age/.49);
        put(shines,x+Math.cos(a)*r*.58,.26+age*(1.1+i%3*.54),z+Math.sin(a)*r*.58,s,s*2.4,s,c);
      }
    } else if(kind==='sell' && age<.59){
      scatter(effect,age,13,1.2,0x8c7d72);
    } else if(kind==='leak' && age<.65){
      scatter(effect,age,12,1.45,0xa67466);
      if(age<.22) put(rings,x,.11,z,.6+age*3,1,.6+age*3,0xff5a42);
    } else if(kind==='fall' && age<1){
      scatter(effect,age,84,1.95,0x91817f,1.25);
      if(age<.76){
        const r=.55+age*7;
        put(rings,x,.1,z,r,1,r,0xffaa68);
        put(rings,x,.12,z,r*.77,1,r*.77,0xff5a43);
      }
      if(age<.24) put(shines,x,.63,z,1.8*(1-age/.24),1.25*(1-age/.24),1.8*(1-age/.24),0xffd1a1);
    }
  }

  const atlas=document.createElement('canvas');
  atlas.width=640;atlas.height=96;
  const ctx=atlas.getContext('2d');
  ctx.font='700 78px system-ui';
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
  for(let i=0;i<10;i++)ctx.fillText(String(i),64*i+32,48);
  const glyphs=[];
  const atlasTexture=new THREE.CanvasTexture(atlas);
  atlasTexture.minFilter=THREE.LinearFilter;atlasTexture.generateMipmaps=false;
  for(let i=0;i<10;i++){
    const map=atlasTexture.clone();
    map.repeat.set(.1,1);map.offset.set(i*.1,0);map.needsUpdate=true;
    glyphs.push(new THREE.SpriteMaterial({map,color:0xffffff,toneMapped:false,depthTest:false,depthWrite:false}));
  }
  const digits=Array.from({length:20},()=>{
    const s=new THREE.Sprite(glyphs[0]);hud.add(s);return s;
  });
  const plane=new THREE.PlaneGeometry(1,1);
  const octagon=new THREE.CircleGeometry(.5,8);
  const pipGeometry=new THREE.CircleGeometry(.5,6);
  function hudShape(geometry,color,opacity=1){
    const m=new THREE.Mesh(geometry,new THREE.MeshBasicMaterial({color,transparent:opacity<1,opacity,
      depthTest:false,depthWrite:false,toneMapped:false}));
    hud.add(m);return m;
  }
  function place(m,x,y,w,h,rotation=0){
    m.position.set(x,height-y,0);m.scale.set(w,h,1);m.rotation.z=rotation;
  }
  const hLine=hudShape(plane,0x756451,.72);
  const bladeA=hudShape(plane,0xe5ab6d),bladeB=hudShape(plane,0xffd39e);
  const bladeGrip=hudShape(octagon,0x97633d);
  const coinEdge=hudShape(octagon,0xeaa658),coinCore=hudShape(octagon,0x8c532c);
  const coinCut=hudShape(plane,0xf4b874);
  const pips=Array.from({length:10},()=>[hudShape(pipGeometry,0x5c514c),hudShape(pipGeometry,0xffb977)]);
  const previewIcons=enemyTypes.slice(0,6).map((type,i)=>{
    const outer=hudShape(i===1?plane:i===3?plane:i===5?octagon:pipGeometry,enemyPalette[i]);
    const inner=hudShape(i===5?plane:octagon,i===2?0xb8fcff:0x232a35);
    return {type,outer,inner};
  });
  function drawHud(frame,time) {
    const u=clamp(height/650,.55,2), margin=33*u;
    const waveY=51*u, goldY=98*u, previewY=128*u;
    let index=0;
    const number=(value,x,y,w,h) => {
      for(const digit of String(Math.max(0,value))){
        const s=digits[index++];
        if(!s) break;
        s.material=glyphs[Number(digit)];s.visible=true;
        s.scale.set(w,h,1);s.position.set(x+w/2,height-y,1);x+=w*.86;
      }
      return x;
    };
    place(bladeA,margin+11*u,waveY,4*u,28*u,-.70);
    place(bladeB,margin+11*u,waveY,4*u,28*u,.70);
    place(bladeGrip,margin+11*u,waveY+4*u,7*u,7*u);
    number(frame.wave,margin+28*u,waveY,39*u,79*u);
    place(coinEdge,margin+10*u,goldY,20*u,20*u);
    place(coinCore,margin+10*u,goldY,14*u,14*u);
    place(coinCut,margin+10*u,goldY,2*u,9*u,.6);
    number(frame.gold,margin+25*u,goldY,20*u,31*u);
    place(hLine,margin+96*u,113*u,192*u,1*u);
    const counts=new Map();
    for(const type of frame.next) counts.set(type,(counts.get(type)||0)+1);
    let x=margin;
    for(let i=0;i<previewIcons.length;i++){
      const {type,outer,inner}=previewIcons[i], count=counts.get(type);
      outer.visible=inner.visible=!!count;
      if(count){
        place(outer,x+7*u,previewY,13*u,13*u,i===1||i===2||i===4?Math.PI/4:0);
        place(inner,x+7*u,previewY,5*u,(i===5?8:4)*u);
        x=number(count,x+15*u,previewY,12*u,19*u)+11*u;
      }
    }
    for(;index<digits.length;index++) digits[index].visible=false;
    const flash=clamp(1-(time-frame.lastLeak/RATE)/.32);
    for(let i=0;i<10;i++){
      const lit=i<frame.baseHp;
      const [outer,inner]=pips[i],px=width-margin-(9-i)*20*u;
      outer.material.color.setHex(lit?0x8f6650:0x4c4146);
      inner.material.color.setHex(lit?0xffbb78:flash>.12?0xfa573d:0x252631);
      place(outer,px,39*u,17*u,17*u,Math.PI/6);
      place(inner,px,39*u,11*u,11*u,Math.PI/6);
    }
  }

  const lastShots=new Array(16);
  function draw(time) {
    const ticks=time*RATE, k=Math.min(Math.floor(ticks),frames.length-1);
    const frame=frames[k], next=frames[Math.min(k+1,frames.length-1)];
    const frac=clamp(ticks-k), worldTime=Math.min(time,(frames.length-1)/RATE);
    const shake=Math.max(0,frame.trauma-(time-k/RATE))**2;
    camera.position.copy(home).add(new THREE.Vector3(
      .20*shake*(.65*Math.sin(time*71+shakePhase[0])+.35*Math.sin(time*109+shakePhase[1])),
      .11*shake*Math.sin(time*89+shakePhase[2]),.16*shake*Math.sin(time*57+shakePhase[3])));
    camera.quaternion.copy(cameraRest);
    const greys=replay.fallTick<0?0:.91*clamp((ticks-replay.fallTick)/RATE);
    renderer.domElement.style.filter=greys?'grayscale('+greys+')':'';
    for(const b of dynamic) b.count=0;
    lastShots.fill(null);
    for(let j=Math.max(0,k-20);j<=k;j++){
      for(const effect of frames[j].effects){
        const age=time-j/RATE;
        if(effect.kind==='shot'&&worldTime-j/RATE<.18) lastShots[effect.slot]=effect;
        drawEffect(effect,age);
      }
    }
    for(let i=0;i<slotTiles.length;i++){
      if(!frame.slots[i]) continue;
      const [x,z]=slotTiles[i];
      turret(x+.5,z+.5,frame.slots[i],worldTime,lastShots[i]);
    }
    for(const e of frame.enemies) enemy(e,next.byId.get(e.id),frac,worldTime);
    keep(frame,time);
    for(const b of dynamic) upload(b);
    renderer.clear(true,true,true);
    renderer.render(scene,camera);
    drawHud(frame,time);
    renderer.clearDepth();
    renderer.render(hud,hudCamera);
  }
  const cameraRest=new THREE.Quaternion();
  function fit() {resize();cameraRest.copy(camera.quaternion);}
  const Context=window.AudioContext || window.webkitAudioContext;
  let audio=null;
  if(Context){
    const context=new Context();
    context.resume().catch(()=>{});
    const unlock=()=>{
      context.resume().catch(()=>{});
      window.removeEventListener('pointerdown',unlock);
      window.removeEventListener('keydown',unlock);
    };
    window.addEventListener('pointerdown',unlock);
    window.addEventListener('keydown',unlock);
    const master=context.createGain();
    master.gain.value=0;
    const compressor=context.createDynamicsCompressor();
    compressor.threshold.value=-16;compressor.ratio.value=5;
    master.connect(compressor);compressor.connect(context.destination);
    const soundRandom=randomGenerator(4242);
    const noise=context.createBuffer(1,context.sampleRate*2,context.sampleRate);
    const noiseData=noise.getChannelData(0);
    for(let i=0;i<noiseData.length;i++)noiseData[i]=soundRandom()*2-1;
    const active=new Set(), windGain=context.createGain();
    windGain.gain.value=0;
    const wind=context.createBufferSource();
    const windFilter=context.createBiquadFilter();
    windFilter.type='lowpass';windFilter.frequency.value=265;
    wind.buffer=noise;wind.loop=true;
    wind.connect(windFilter);windFilter.connect(windGain);windGain.connect(master);wind.start();

    function voice({x=1200,length=.15,volume=.06,from=340,to=150,wave='sine',filter=650}) {
      if(context.state!=='running')return;
      const now=context.currentTime;
      const source=wave==='noise'?context.createBufferSource():context.createOscillator();
      const gain=context.createGain(), pan=context.createStereoPanner();
      pan.pan.value=clamp((x/2400-.5)*1.7,-.85,.85);
      gain.connect(pan);pan.connect(master);
      let tone;
      if(wave==='noise'){
        tone=context.createBiquadFilter();tone.type='lowpass';tone.frequency.value=filter;
        source.buffer=noise;source.connect(tone);tone.connect(gain);
      } else {
        const variation=.93+soundRandom()*.14;
        source.type=wave;
        source.frequency.setValueAtTime(from*variation,now);
        source.frequency.exponentialRampToValueAtTime(to*variation,now+length*.85);
        source.connect(gain);
      }
      gain.gain.setValueAtTime(.0001,now);
      gain.gain.exponentialRampToValueAtTime(volume,now+Math.min(.024,length*.16));
      gain.gain.exponentialRampToValueAtTime(.0001,now+length);
      active.add(source);
      source.onended=()=>{active.delete(source);source.disconnect();tone?.disconnect();gain.disconnect();pan.disconnect();};
      if(wave==='noise')source.start(now,soundRandom()*.42);
      else source.start(now);
      source.stop(now+length+.015);
    }

    const shotTimings=[];
    const shotRecipes=[
      {wave:'triangle',from:650,to:270,length:.095,volume:.047},
      {wave:'noise',filter:430,length:.21,volume:.14},
      {wave:'sine',from:1130,to:810,length:.12,volume:.033},
      {wave:'sawtooth',from:260,to:90,length:.15,volume:.082},
      {wave:'noise',filter:1900,length:.10,volume:.062}
    ];
    const priorities=[1,5,2,4,3];
    audio={
      reset(){shotTimings.length=0;},
      setPlaying(playing){
        const now=context.currentTime;
        master.gain.cancelScheduledValues(now);
        master.gain.setTargetAtTime(playing?.46:0,now,.009);
        if(!playing){
          for(const source of active)source.stop(now+.04);
          shotTimings.length=0;
        }
      },
      update(before,after){
        const fallTime=replay.fallTick/RATE;
        const windOn=replay.fallTick>=0&&after>=fallTime+.9;
        if(windOn!==(windGain.gain.value>.015))windGain.gain.setTargetAtTime(windOn?.08:0,context.currentTime,.06);
        const shots=[];
        let playedKills=0;
        for(let tick=Math.floor(before*RATE)+1;tick<=Math.min(frames.length-1,Math.floor(after*RATE));tick++){
          for(const event of frames[tick].effects){
            const {x,kind,type}=event;
            if(kind==='shot')shots.push(event);
            else if(kind==='kill'&&playedKills++<3)voice({x,from:370,to:117,length:.09,volume:.048});
            else if(kind==='wave') {
              voice({from:147,to:231,wave:'triangle',length:.42,volume:.065});
              voice({from:219,to:345,wave:'sine',length:.37,volume:.038});
            } else if(kind==='leak'){
              voice({x,wave:'noise',filter:1340,length:.27,volume:.22});
              voice({x,from:320,to:475,length:.38,volume:.105,wave:'triangle'});
            } else if(kind==='fall'){
              voice({x,wave:'noise',filter:220,length:1.36,volume:.43});
              voice({x,from:91,to:28,length:1.10,volume:.26,wave:'sine'});
            }
          }
        }
        const now=context.currentTime;
        while(shotTimings.length&&now-shotTimings[0]>=1)shotTimings.shift();
        shots.sort((a,b)=>priorities[b.type]-priorities[a.type]);
        const ending=replay.fallTick>=0&&after>=fallTime;
        if(!ending)for(const shot of shots){
          if(shotTimings.length>=12)break;
          voice({...shotRecipes[shot.type],x:shot.x});
          shotTimings.push(now);
        }
      }
    };
  }

  let state='COUNTDOWN',simTime=0,playbackSpeed=1;
  let previous=null, countdownElapsed=0,holdElapsed=0, holdStart=null;
  let lastDrawn=-1, dragging=false;
  const scrubber=$('scrubber'),countdown=$('countdown'),toggle=$('btn-toggle');
  function showCountdown(value){
    countdown.textContent=value;
    countdown.style.display=value?'block':'none';
  }
  function transition(next) {
    state=next;
    const running=next==='PLAYING'||next==='COUNTDOWN'||next==='REFIRE_HOLD';
    $('icon-pause').style.display=running?'':'none';
    $('icon-play').style.display=running?'none':'';
    toggle.setAttribute('aria-label',running?'Pause':'Play');
    if(next!=='COUNTDOWN')showCountdown('');
    audio?.setPlaying(next==='PLAYING'&&!dragging);
  }
  function paint() {
    if(lastDrawn===simTime)return;
    lastDrawn=simTime;
    draw(simTime);
  }
  toggle.addEventListener('click',()=>{
    if(state==='PLAYING'||state==='COUNTDOWN'||state==='REFIRE_HOLD')transition('PAUSED');
    else {
      if(state==='ENDED'){
        simTime=0;scrubber.value='0';audio?.reset();paint();
      }
      transition('PLAYING');
    }
  });
  $('btn-refire').addEventListener('click',()=>{
    simTime=0;scrubber.value='0';holdElapsed=0;holdStart=performance.now();
    transition('REFIRE_HOLD');audio?.reset();paint();
  });
  scrubber.addEventListener('input',()=>{
    simTime=Number.parseFloat(scrubber.value);
    transition('PAUSED');paint();
  });
  scrubber.addEventListener('pointerdown',()=>{
    dragging=true;audio?.setPlaying(false);
  });
  function finishDrag(){
    if(!dragging)return;
    dragging=false;
    audio?.setPlaying(state==='PLAYING');
  }
  window.addEventListener('pointerup',finishDrag);
  window.addEventListener('pointercancel',finishDrag);
  const pills=[...document.querySelectorAll('.speed-pill')];
  for(const pill of pills)pill.addEventListener('click',()=>{
    playbackSpeed=Number(pill.dataset.speed);
    for(const option of pills){
      option.classList.toggle('is-active',option===pill);
      option.setAttribute('aria-checked',String(option===pill));
    }
  });
  window.addEventListener('resize',()=>{fit();lastDrawn=-1;paint();});

  const simplify=[];
  window.BENCH_REPORT={
    selfCheck:{vectorA:true,vectorB:true},
    strategy:{
      summary:'Cannon clusters cover ground turns. Flak investment responds to air pressure. Targeting weights useful splash damage, menders and imminent leaks.',
      seedsTested:5,meanScoreOnTestedSeeds:42.974
    },
    seed42:{score:replay.score,fallTick:replay.fallTick},
    systems:{board:'full',enemiesAndTurrets:'full',combatVisuals:'full',fall:'full',hud:'full',audio:'full'},
    simplifications:simplify,
    testedInBrowser:true,measuredFps:null
  };
  function loop(stamp){
    const dt=previous===null?0:Math.min(Math.max(0,(stamp-previous)/1000),.1);
    previous=stamp;
    if(state==='COUNTDOWN'){
      countdownElapsed+=dt;
      if(countdownElapsed<3)showCountdown(String(3-Math.floor(countdownElapsed)));
      else transition('PLAYING');
    } else if(state==='REFIRE_HOLD'){
      holdElapsed=Math.max(0,(stamp-holdStart)/1000);
      if(holdElapsed>=1)transition('PLAYING');
    }
    if(state==='PLAYING'){
      const before=simTime;
      simTime=Math.min(DURATION,simTime+dt*playbackSpeed);
      scrubber.value=simTime.toFixed(3);
      if(!dragging)audio?.update(before,simTime);
      paint();
      if(simTime>=DURATION)transition('ENDED');
    }
    requestAnimationFrame(loop);
  }
  showCountdown('');
  fit();
  paint();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
