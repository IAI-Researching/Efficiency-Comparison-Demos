<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last Rampart</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}

  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>

<script id="rampart-strategy">
function createStrategy() {

  var DMG = { bolt: [26, 41, 65], cannon: [60, 96, 153], frost: [10, 16, 25], lance: [180, 288, 460], flak: [40, 64, 102] };
  var SPD = { grunt: 10, runner: 20, wisp: 12, brute: 6, splitter: 8, mender: 8, splitling: 12 };
  // per turret type: weight of each enemy type
  var W = {
    bolt: { grunt: 1, runner: P.wRuB, wisp: P.wWiB, brute: P.wBr, splitter: P.wSp, mender: P.wM, splitling: P.wSl },
    cannon: { grunt: 1, runner: P.wRuC, wisp: 1, brute: P.wBr, splitter: P.wSp, mender: P.wM, splitling: P.wSl },
    lance: { grunt: 1, runner: P.wRuL, wisp: 1, brute: P.wBrL, splitter: P.wSp, mender: P.wM, splitling: P.wSl },
    flak: { grunt: 1, runner: 1, wisp: 1, brute: 1, splitter: 1, mender: 1, splitling: 1 }
  };

  function plan(s) {
    var acts = [], gold = s.gold, i;
    var tier = [], typ = [];
    for (i = 0; i < 16; i++) { var t = s.slots[i].turret; tier.push(t ? t.tier : 0); typ.push(t ? t.type : null); }
    var minT = 1e9;
    for (i = 0; i < s.enemies.length; i++) { var e = s.enemies[i], tl = e.remaining / (SPD[e.type] || 10); if (tl < minT) minT = tl; }
    var reserve = (minT > P.safeT && s.baseHp >= 10) ? P.hoard : 0;

      else if (tier[sl] === 1) c = COST[typ[sl]];

      if (gold - c < reserve) break;

      for (i = 0; i < 16 && acts.length < 28; i++) {
        var t2 = P.types2[i];
        if (!t2 || typ[i] === t2 || tier[i] !== 3) continue;
        var need = 4 * COST[t2] - Math.floor(4 * COST[typ[i]] * 70 / 100);
        if (gold - need < 0) continue;
        acts.push({ op: 'sell', slot: i }, { op: 'build', slot: i, type: t2 }, { op: 'upgrade', slot: i }, { op: 'upgrade', slot: i });
        gold -= need; typ[i] = t2;

      }
    }

  }
  function target(tu, cs) {
    var n = cs.length;
    if (n === 1) return cs[0].id;
    var type = tu.type, d = DMG[type][tu.tier - 1], best = -1, bestS = -1e18, i, j, c, sc, o, dm, v;

        if (sc > bestS) { bestS = sc; best = c.id; }

      c = cs[i];
      if (splash) {
        sc = 0;
        for (j = 0; j < n; j++) { o = cs[j]; var dx = o.x - c.x, dy = o.y - c.y; if (dx * dx + dy * dy <= splash) sc += val[j]; }

<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks) {

  function mulberry32(a) { return function () {
    a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a);

    var p = pts.map(function (q) { return [q[0] * 100 + 50, q[1] * 100 + 50]; });
    var cum = [0];
    for (var i = 1; i < p.length; i++) cum.push(cum[i - 1] + Math.abs(p[i][0] - p[i - 1][0]) + Math.abs(p[i][1] - p[i - 1][1]));

  }
  var GROUND = mkRoute([[0, 2], [6, 2], [6, 10], [12, 10], [12, 3], [18, 3], [18, 11], [23, 11]]);
  var AIR = mkRoute([[0, 6], [21, 6], [21, 11], [23, 11]]);

  var TUR = {
    bolt: { idx: 0, cost: 50, dmg: 26, period: 8, range: 300, splash: 0, slow: 0, pierce: 0, ground: 1, air: 1 },
    cannon: { idx: 1, cost: 90, dmg: 60, period: 24, range: 260, splash: 90, slow: 0, pierce: 0, ground: 1, air: 0 },
    frost: { idx: 2, cost: 70, dmg: 10, period: 12, range: 240, splash: 0, slow: 30, pierce: 0, ground: 1, air: 1 },
    lance: { idx: 3, cost: 120, dmg: 180, period: 36, range: 360, splash: 0, slow: 0, pierce: 1, ground: 1, air: 0 },
    flak: { idx: 4, cost: 80, dmg: 40, period: 10, range: 320, splash: 70, slow: 0, pierce: 0, ground: 0, air: 1 }
  };
  var ENEMY = {

    runner: { hp: 40, speed: 20, bounty: 4, leak: 1, air: 0, first: 2, weight: 4 },
    wisp: { hp: 50, speed: 12, bounty: 6, leak: 2, air: 1, first: 3, weight: 3 },
    brute: { hp: 150, speed: 6, bounty: 9, leak: 3, air: 0, first: 4, weight: 3 },
    splitter: { hp: 90, speed: 8, bounty: 6, leak: 2, air: 0, first: 6, weight: 2 },
    mender: { hp: 70, speed: 8, bounty: 7, leak: 2, air: 0, first: 8, weight: 1 },

    let towerUp = true;
    for (const b of keepBlocks) {
      const m = b.mesh;
      if (t < b.removeAt) { m.position.set(b.home[0], b.home[1], b.home[2]); m.rotation.set(0, 0, 0); m.scale.setScalar(1); }
      else {
        const dt = t - b.removeAt; ballistic(b.home[0], b.home[1], b.home[2], b.ang, b.spd, b.vy, dt, bo);
        m.position.set(bo[0], bo[1] + 0.04, bo[2]); m.rotation.set(b.rot[0] * bo[3], b.rot[1] * bo[3], b.rot[2] * bo[3]); m.scale.setScalar(b.tower ? 0.6 : 0.8);
        if (b.tower) towerUp = false;
      }
    }
    banner.visible = flag.visible = towerUp;
    banner.position.set(KEEP[0], 1.95, KEEP[1]); flag.position.set(KEEP[0] + 0.18, 2.08 + 0.015 * Math.sin(tw * 5), KEEP[1]); flag.rotation.y = 0.15 * Math.sin(tw * 3.1);
    let desat = 0;
    if (t >= FALL_T) {
      const dt = t - FALL_T;
      desat = clamp(dt / 1.0, 0, 1) * 0.92;
      if (dt < 1.2) { const e = dt / 1.2, ee = 1 - (1 - e) * (1 - e); addRing(KEEP[0], 0.2, KEEP[1], 0.5 + 9 * ee, cShock, 2.2 * (1 - e)); addRing(KEEP[0], 0.2, KEEP[1], 0.3 + 6 * ee, cRed, 1.5 * (1 - e)); addDisc(KEEP[0], 0.18, KEEP[1], 0.5 + 9 * ee, cShock, 0.07 * (1 - e)); }
      if (dt < 0.4) addGlow(KEEP[0], 0.7, KEEP[1], 0.8 + dt * 3, cShock, 0.55 * (1 - dt / 0.4));
      for (let q = 0; q < 40; q++) {   // extra seeded rubble burst
        const hq = (q * 97 + 13) & (HN - 1); ballistic(KEEP[0], 0.5 + H3[hq], KEEP[1], H1[hq] * 6.283, 0.5 + H2[hq] * 2.6, 2.5 + H3[hq] * 4, dt, bo);
        addDebris(bo[0], bo[1], bo[2], 0.07 + 0.1 * H2[hq], H1[hq] * 6 + bo[3] * 8, H2[hq] * 6 + bo[3] * 5, cStone, 0.6 + 0.5 * H1[hq]);
      }
    }
    // air-lane flow markers
    for (let i = 0; i < LANE_DOTS; i++) {
      const d = ((i + (tw * 0.6) % 1) / LANE_DOTS) * 26; routePoint(1, d + 0.1); const ax = rp[0], az = rp[1]; routePoint(1, d);
      tmpE.set(0, Math.atan2(-(az - rp[1]), ax - rp[0]), 0); tmpQ.setFromEuler(tmpE); tmpV.set(rp[0], 0.79, rp[1]); tmpS.set(1, 1, 1); tmpM.compose(tmpV, tmpQ, tmpS); laneDots.setMatrixAt(i, tmpM);
    }
    laneDots.instanceMatrix.needsUpdate = true;
    laneMat.opacity = 0.12 + 0.03 * Math.sin(tw * 1.7);

    for (const pr of [[glowS, nGlow], [rings, nRing], [discs, nDisc], [beams, nBeam], [debris, nDeb]]) { pr[0].count = pr[1]; pr[0].instanceMatrix.needsUpdate = true; pr[0].instanceColor.needsUpdate = true; }

    updateHud(t, VW, VH);
    renderer.clear();
    renderer.render(scene, camera);
    desatPass(desat);
    renderer.clearDepth();
    renderer.render(hudScene, hudCam);
  }

  /* ============================== audio ============================== */
  const AudioCtor = window.AudioContext || window.webkitAudioContext;
  let actx = null, master = null, noiseBuf = null, windGain = null, audible = false;
  const live = new Set();
  const arand = mulberry(4242);
  function tryResume() { if (actx && actx.state !== 'running') { try { const p = actx.resume(); if (p && p.catch) p.catch(function () {}); } catch (e) {} } }
  try {
    actx = new AudioCtor();
    master = actx.createGain(); master.gain.value = 0;
    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 8; comp.attack.value = 0.003; comp.release.value = 0.2;
    const outG = actx.createGain(); outG.gain.value = 0.8;
    master.connect(comp); comp.connect(outG); outG.connect(actx.destination);
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
    const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = arand() * 2 - 1;
    // low wind bed (only audible after the fall while PLAYING)
    windGain = actx.createGain(); windGain.gain.value = 0;
    const ws = actx.createBufferSource(); ws.buffer = noiseBuf; ws.loop = true;
    const wf = actx.createBiquadFilter(); wf.type = 'bandpass'; wf.frequency.value = 260; wf.Q.value = 0.7;
    const lfo = actx.createOscillator(); lfo.frequency.value = 0.13; const lg = actx.createGain(); lg.gain.value = 110; lfo.connect(lg); lg.connect(wf.frequency);
    ws.connect(wf); wf.connect(windGain); windGain.connect(master); ws.start(); lfo.start();
    tryResume();
  } catch (err) { actx = null; }
  window.addEventListener('pointerdown', tryResume); window.addEventListener('keydown', tryResume);
  function panFor(x) { return clamp((x / 24) * 2 - 1, -1, 1) * 0.8; }
  function outNode(x, gain) {
    const g = actx.createGain(); g.gain.value = gain; let last = g;
    if (actx.createStereoPanner) { const p = actx.createStereoPanner(); p.pan.value = panFor(x); g.connect(p); last = p; }
    last.connect(master); return g;
  }
  function track(src, stopAt) { live.add(src); src.onended = function () { live.delete(src); }; src.stop(stopAt); }
  function tone(type, f0, f1, dur, gain, x, delay, filt) {
    const t0 = actx.currentTime + (delay || 0), o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(1, t0 + Math.min(0.01, dur * 0.2)); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    let n = o; if (filt) { const fl = actx.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = filt; o.connect(fl); n = fl; }
    n.connect(g); g.connect(outNode(x, gain)); o.start(t0); track(o, t0 + dur + 0.02);
  }
  function noise(ftype, freq, q, dur, gain, x, delay, attack) {
    const t0 = actx.currentTime + (delay || 0), s = actx.createBufferSource(), fl = actx.createBiquadFilter(), g = actx.createGain();
    s.buffer = noiseBuf; fl.type = ftype; fl.frequency.value = freq; fl.Q.value = q;
    g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(1, t0 + (attack || 0.004)); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    s.loop = true; s.connect(fl); fl.connect(g); g.connect(outNode(x, gain)); s.start(t0, arand() * 1.5); track(s, t0 + dur + 0.02);
  }
  const SFX = {
    shot: function (type, x) {
      const v = 0.94 + arand() * 0.12;
      if (type === 0) tone('square', 1100 * v, 520 * v, 0.05, 0.05, x, 0, 3000);
      else if (type === 1) { tone('sine', 130 * v, 45, 0.2, 0.3, x); noise('lowpass', 500, 0.6, 0.16, 0.22, x); }
      else if (type === 2) { tone('sine', 1900 * v, 2700 * v, 0.09, 0.035, x); tone('triangle', 2850 * v, 3300 * v, 0.07, 0.02, x); }
      else if (type === 3) { tone('sawtooth', 340 * v, 70, 0.24, 0.17, x, 0, 1800); noise('bandpass', 2400, 1.5, 0.08, 0.08, x); }
      else { noise('highpass', 1800, 0.7, 0.07, 0.1, x); tone('square', 520 * v, 300, 0.06, 0.05, x, 0, 2000); }
    },
    kill: function (x) { const v = 0.85 + arand() * 0.3; tone('sine', 520 * v, 190 * v, 0.07, 0.07, x); },
    horn: function () { tone('sawtooth', 98, 147, 0.7, 0.13, 2, 0, 700); tone('sawtooth', 147, 220, 0.7, 0.09, 2, 0.02, 900); tone('triangle', 196, 294, 0.7, 0.06, 2, 0.04); },
    leak: function () { noise('bandpass', 1300, 0.9, 0.16, 0.34, 23.5); noise('lowpass', 300, 0.7, 0.3, 0.3, 23.5); tone('square', 660, 660, 0.14, 0.09, 23.5, 0.05, 2400); tone('square', 880, 880, 0.2, 0.09, 23.5, 0.2, 2400); },
    fall: function () { tone('sine', 70, 24, 2.6, 0.6, 23.5); noise('lowpass', 160, 0.8, 3.2, 0.6, 23.5, 0, 0.05); noise('bandpass', 900, 0.6, 0.6, 0.35, 23.5); tone('sawtooth', 110, 30, 1.4, 0.2, 23.5, 0, 500); }
  };
  const SHOT_PRI = [3, 1, 4, 0, 2];   // loudest types first
  const shotStamp = [], killStamp = [];
  function allow(stamps, max) { const now = actx.currentTime; while (stamps.length && stamps[0] < now - 1) stamps.shift(); if (stamps.length >= max) return false; stamps.push(now); return true; }
  function audioAdvance(t0, t1) {     // forward playback crossed (t0, t1]
    if (!actx || actx.state !== 'running' || t1 <= t0) return;
    const k0 = Math.floor(t0 * TPS + 1e-7) + 1, k1 = Math.floor(t1 * TPS + 1e-7);
    if (k1 < k0) return;
    const inR = function (arr, fn) { for (let i = lowerBound(arr, k0); i < arr.length && arr[i].tick <= k1; i++) fn(arr[i]); };
    const batch = []; inR(R.shots, function (s) { batch.push(s); });
    batch.sort(function (a, b) { return SHOT_PRI.indexOf(a.type) - SHOT_PRI.indexOf(b.type); });
    for (const s of batch) { if (!allow(shotStamp, 12)) break; SFX.shot(s.type, s.sx); }
    inR(R.kills, function (kl) { if (allow(killStamp, 8)) SFX.kill(kl.x); });
    inR(R.waves, function () { SFX.horn(); });
    inR(R.leaks, function () { SFX.leak(); });
    if (R.fallTick >= k0 && R.fallTick <= k1) SFX.fall();
  }
  function setAudible(on, t) {
    if (!actx) return;
    const now = actx.currentTime;
    if (on !== audible) {
      audible = on;
      master.gain.cancelScheduledValues(now); master.gain.setValueAtTime(master.gain.value, now); master.gain.linearRampToValueAtTime(on ? 0.9 : 0, now + 0.04);
      if (!on) { live.forEach(function (s) { try { s.stop(now + 0.05); } catch (e) {} }); }
    }
    const w = (on && t >= FALL_T + 0.3) ? 0.16 : 0;
    windGain.gain.setTargetAtTime(w, now, on ? 0.6 : 0.01);
  }

  /* ============================== playback state machine ============================== */
  const elCount = document.getElementById('countdown'), elScrub = document.getElementById('scrubber'), elToggle = document.getElementById('btn-toggle'),
    elRefire = document.getElementById('btn-refire'), icPause = document.getElementById('icon-pause'), icPlay = document.getElementById('icon-play');
  const pills = Array.prototype.slice.call(document.querySelectorAll('.speed-pill'));
  let state = 'INIT', simTime = 0, playbackSpeed = 1.0, countdownElapsed = 0, holdElapsed = 0, lastTs = -1;
  let fpsT = 0, fpsN = 0;
  function showPauseIcon(p) { icPause.style.display = p ? '' : 'none'; icPlay.style.display = p ? 'none' : ''; elToggle.setAttribute('aria-label', p ? 'Pause' : 'Play'); }
  function hideCountdown() { elCount.style.display = 'none'; elCount.textContent = ''; }
  function setCountdown(txt) { elCount.style.display = 'block'; if (elCount.textContent !== txt) elCount.textContent = txt; }

  elToggle.addEventListener('click', function () {
    if (state === 'PLAYING') { state = 'PAUSED'; showPauseIcon(false); }
    else if (state === 'COUNTDOWN' || state === 'REFIRE_HOLD' || state === 'INIT') { hideCountdown(); simTime = 0; state = 'PAUSED'; showPauseIcon(false); }
    else if (state === 'PAUSED') { state = 'PLAYING'; showPauseIcon(true); }
    else if (state === 'ENDED') { simTime = 0; elScrub.value = '0'; hideCountdown(); state = 'PLAYING'; showPauseIcon(true); }
    setAudible(state === 'PLAYING', simTime);
  });
  pills.forEach(function (p) {
    p.addEventListener('click', function () {
      playbackSpeed = parseFloat(p.getAttribute('data-speed'));
      pills.forEach(function (q) { const on = q === p; q.classList.toggle('is-active', on); q.setAttribute('aria-checked', on ? 'true' : 'false'); });
    });
  });
  elScrub.addEventListener('input', function () {
    hideCountdown();
    simTime = clamp(parseFloat(elScrub.value) || 0, 0, DURATION);
    state = 'PAUSED'; showPauseIcon(false); setAudible(false, simTime);
    renderAt(simTime);
  });
  elRefire.addEventListener('click', function () {
    hideCountdown(); simTime = 0; elScrub.value = '0';
    setAudible(false, 0);
    renderAt(0); showPauseIcon(true);
    state = 'REFIRE_HOLD'; holdElapsed = 0;
  });
  window.addEventListener('resize', function () { fitCamera(); renderAt(simTime); });

  function frame(ts) {
    requestAnimationFrame(frame);
    const rawDt = lastTs < 0 ? 0 : (ts - lastTs) / 1000; lastTs = ts;
    const dt = Math.min(Math.max(rawDt, 0), 0.1);
    if (state === 'INIT') { state = 'COUNTDOWN'; countdownElapsed = 0; setCountdown('3'); }
    else if (state === 'COUNTDOWN') {
      countdownElapsed += dt;
      if (countdownElapsed >= 3) { hideCountdown(); state = 'PLAYING'; showPauseIcon(true); }
      else setCountdown(countdownElapsed < 1 ? '3' : countdownElapsed < 2 ? '2' : '1');
    } else if (state === 'REFIRE_HOLD') {
      holdElapsed += dt;
      if (holdElapsed >= 1) { state = 'PLAYING'; showPauseIcon(true); }
    } else if (state === 'PLAYING') {
      const prevT = simTime;
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      elScrub.value = simTime.toFixed(3);
      setAudible(true, simTime);
      audioAdvance(prevT, simTime);
      if (rawDt > 0 && rawDt < 0.25) { fpsT += rawDt; fpsN++; if (fpsT >= 2) { window.BENCH_REPORT.measuredFps = Math.round(fpsN / fpsT * 10) / 10; fpsT = 0; fpsN = 0; } }
      if (simTime >= DURATION) { simTime = DURATION; elScrub.value = DURATION.toFixed(3); state = 'ENDED'; showPauseIcon(false); }
    }
    if (state !== 'PLAYING') setAudible(false, simTime);
    renderAt(simTime);
  }

  fitCamera();
  elScrub.value = '0';
  renderAt(0);                       // initial resting scene
  requestAnimationFrame(frame);      // countdown starts on the first frame after it
})();
</script>
