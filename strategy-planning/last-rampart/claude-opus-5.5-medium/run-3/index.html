<!DOCTYPE html>
<html lang="en">
<head>

<title>Last Rampart: Wave Defense Strategist</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;

}

}

#btn-refire {

}

  width: 12px;

  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>

<script id="rampart-strategy">
function createStrategy() {
  "use strict";
  var TYPES = ["bolt", "cannon", "frost", "lance", "flak"];
  var COST = [50, 90, 70, 120, 80];
  var SPL = [0, 90, 0, 0, 70];
  var SLOT_TYPES = [4, 4, 1, 1, 1, 1, 1, 1, 1, 1, 4, 1, 1, 0, 0, 2];
  var SEQ = [10, 8, 1, 5, 8, 7, 6, 1, 0, 5, 2, 4, 3, 3, 0, 2, 0, 2, 4, 4, 14, 13, 7, 6, 6, 15, 8, 7, 5, 3, 11, 1, 14, 9, 9, 9, 15, 10, 12, 13, 11, 14, 10, 12, 13, 11, 12, 15];
  var POLICY = [0, 3, 2, 0, 3];
  var RES = [0, 70, 22];
  var FREE = 7;
  // own copy of the route geometry, so positions come from `remaining` only
  function mkRoute(tp) {
    var p = [], c = [0], i;
    for (i = 0; i < tp.length; i++) p.push([tp[i][0] * 100 + 50, tp[i][1] * 100 + 50]);
    for (i = 1; i < p.length; i++) c.push(c[i - 1] + Math.abs(p[i][0] - p[i - 1][0]) + Math.abs(p[i][1] - p[i - 1][1]));
    return { p: p, c: c, L: c[c.length - 1] };
  }
  var RT = [mkRoute([[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]]), mkRoute([[0,6],[21,6],[21,11],[23,11]])];
  function sgn(v) { return v > 0 ? 1 : (v < 0 ? -1 : 0); }
  function pos(e) {
    var r = RT[e.air ? 1 : 0], pr = r.L - e.remaining, i = 1;
    if (pr < 0) pr = 0;
    while (i < r.p.length - 1 && r.c[i] < pr) i++;
    var a = r.p[i - 1], b = r.p[i], d = pr - r.c[i - 1];
    return [a[0] + sgn(b[0] - a[0]) * d, a[1] + sgn(b[1] - a[1]) * d];
  }
  function first(c) { var b = 0; for (var i = 1; i < c.length; i++) if (c[i].remaining < c[b].remaining) b = i; return c[b].id; }
  function pick(k, c, ti) {
    var b = 0, i;
    if (k === 1) { for (i = 1; i < c.length; i++) if (c[i].hp > c[b].hp || (c[i].hp === c[b].hp && c[i].remaining < c[b].remaining)) b = i; return c[b].id; }
    if (k === 2) { b = -1; for (i = 0; i < c.length; i++) if (!c[i].slowed && (b < 0 || c[i].remaining < c[b].remaining)) b = i; return b < 0 ? first(c) : c[b].id; }
    if (k === 3) {
      var r = SPL[ti] || 90, r2 = r * r, ps = [], bs = 0, bn = -1, j;
      for (i = 0; i < c.length; i++) ps.push(pos(c[i]));
      for (i = 0; i < c.length; i++) {
        var n = 0;
        for (j = 0; j < c.length; j++) { var dx = ps[i][0] - ps[j][0], dy = ps[i][1] - ps[j][1]; if (dx * dx + dy * dy <= r2) n++; }
        if (n > bn || (n === bn && c[i].remaining < c[bs].remaining)) { bn = n; bs = i; }
      }
      return c[bs].id;
    }
    if (k === 4) { for (i = 1; i < c.length; i++) if (c[i].remaining > c[b].remaining) b = i; return c[b].id; }
    if (k === 5) { for (i = 1; i < c.length; i++) if (c[i].maxHp > c[b].maxHp || (c[i].maxHp === c[b].maxHp && c[i].remaining < c[b].remaining)) b = i; return c[b].id; }
    return first(c);
  }
  var pos0 = 0;
  return {
    plan: function (s) {
      var gold = s.gold, acts = [], tier = [], i;
      var reserve = s.wave < RES[2] ? Math.min(RES[0], RES[1] * s.wave) : 0;
      for (i = 0; i < 16; i++) { var t = s.slots[i] && s.slots[i].turret; tier.push(t ? t.tier : 0); }
      while (pos0 < SEQ.length && acts.length < 32) {
        var sl = SEQ[pos0], ty = SLOT_TYPES[sl], tr = tier[sl];
        if (tr >= 3) { pos0++; continue; }
        var c = tr === 0 ? COST[ty] : COST[ty] * tr;
        if (gold - c < (pos0 < FREE ? 0 : reserve)) break;
        gold -= c;
        acts.push(tr === 0 ? { op: "build", slot: sl, type: TYPES[ty] } : { op: "upgrade", slot: sl });
        tier[sl]++; pos0++;
      }
      return acts;
    },
    target: function (turret, cands) {
      var ti = TYPES.indexOf(turret.type);
      if (ti < 0 || !cands || !cands.length) return undefined;
      return pick(POLICY[ti], cands, ti);
    }
  };
}
</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks, rec) {
  "use strict";
  var TN = ["bolt", "cannon", "frost", "lance", "flak"];
  var TCOST = [50, 90, 70, 120, 80], TDMG = [26, 60, 10, 180, 40], TPER = [8, 24, 12, 36, 10];
  var TRNG = [300, 260, 240, 360, 320], TSPL = [0, 90, 0, 0, 70], TSLOW = [0, 0, 30, 0, 0];
  var TPIERCE = [0, 0, 0, 1, 0], TGND = [1, 1, 1, 1, 0], TAIR = [1, 0, 1, 0, 1];
  var EN = ["grunt", "runner", "wisp", "brute", "splitter", "mender", "splitling"];
  var EHP = [60, 40, 50, 150, 90, 70, 0], ESPD = [10, 20, 12, 6, 8, 8, 12], EBTY = [4, 4, 6, 9, 6, 7, 1];
  var ELEAK = [1, 1, 2, 3, 2, 2, 1], EAIR = [0, 0, 1, 0, 0, 0, 0], EFIRST = [1, 2, 3, 4, 6, 8], EWT = [10, 4, 3, 3, 2, 1];
  var SLOTS = [[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],[14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]];
  function mkRoute(tp) {
    var pts = [], cum = [0], i;
    for (i = 0; i < tp.length; i++) pts.push([tp[i][0] * 100 + 50, tp[i][1] * 100 + 50]);
    for (i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.abs(pts[i][0] - pts[i - 1][0]) + Math.abs(pts[i][1] - pts[i - 1][1]));
    return { pts: pts, cum: cum, len: cum[cum.length - 1] };
  }
  var ROUTES = [
    mkRoute([[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]]),
    mkRoute([[0,6],[21,6],[21,11],[23,11]])
  ];
  function posOf(e) {
    var r = ROUTES[e.air], p = e.progress, i;
    if (p >= r.len) p = r.len;
    for (i = 1; i < r.pts.length - 1 && r.cum[i] < p; i++) {}
    if (r.cum[i] < p) i = r.pts.length - 1;
    var a = r.pts[i - 1], b = r.pts[i], d = p - r.cum[i - 1];
    var sx = b[0] > a[0] ? 1 : (b[0] < a[0] ? -1 : 0), sy = b[1] > a[1] ? 1 : (b[1] < a[1] ? -1 : 0);
    e.x = a[0] + sx * d; e.y = a[1] + sy * d;
  }
  function mulberry32(a) { return function () {
    a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return (t ^ (t >>> 14)) >>> 0; }; }
  var rng = mulberry32(seed);
  var mult = [0, 1000];
  function mOf(w) { while (mult.length <= w) mult.push(Math.floor(mult[mult.length - 1] * 108 / 100)); return mult[w]; }
  function genWave(w) {
    var n = 4 + Math.floor(3 * w / 5), out = [], tot = 0, k, i;
    for (k = 0; k < 6; k++) if (EFIRST[k] <= w) tot += EWT[k];
    for (i = 0; i < n; i++) {
      var r = rng() % tot;
      for (k = 0; k < 6; k++) { if (EFIRST[k] > w) continue; if (r < EWT[k]) break; r -= EWT[k]; }
      out.push(k);
    }
    return out;
  }
  var waves = [null, genWave(1)];
  var gold = 250, baseHp = 10, wave = 0, nextId = 1, log = [], enemies = [], queue = [];
  var turrets = []; for (var s0 = 0; s0 < 16; s0++) turrets.push(null);
  var strat = createStrategy();
  var hasTarget = strat && typeof strat.target === "function";
  var fallTick = -1, tick = 0;
  var fr = null;

  function view(e) {
    return { id: e.id, type: EN[e.type], hp: e.hp, maxHp: e.maxHp, x: e.x, y: e.y, air: e.air, armor: e.armor,
      speed: ESPD[e.type], slowed: e.slow > 0 ? 1 : 0, remaining: ROUTES[e.air].len - e.progress };
  }
  function makeEnemy(type, w, mh, prog) {
    var e = { id: nextId++, type: type, wave: w, maxHp: mh, hp: mh, air: EAIR[type],
      armor: type === 0 ? Math.floor(w / 4) : (type === 3 ? 6 + w : 0), progress: prog, age: 0, slow: 0, x: 0, y: 0 };
    posOf(e);
    return e;
  }
  function applyActions(acts) {
    if (!acts || typeof acts.length !== "number") return;
    var n = Math.min(32, acts.length);
    for (var i = 0; i < n; i++) {
      var a = acts[i];
      if (!a || typeof a !== "object") continue;
      var sl = a.slot;
      if (typeof sl !== "number" || sl !== Math.floor(sl) || sl < 0 || sl > 15) continue;
      var t = turrets[sl];
      if (a.op === "build") {
        var ti = TN.indexOf(a.type);
        if (t || ti < 0 || typeof a.type !== "string" || gold < TCOST[ti]) continue;
        gold -= TCOST[ti];
        turrets[sl] = { type: ti, tier: 1, spent: TCOST[ti], cd: 0, dmg: TDMG[ti], rng: TRNG[ti] };
        log.push([tick, "B", sl, ti]);
        if (fr) fr.ev.push([0, sl, ti, 1]);
      } else if (a.op === "upgrade") {
        if (!t || t.tier >= 3) continue;
        var c = TCOST[t.type] * t.tier;
        if (gold < c) continue;
        gold -= c; t.spent += c; t.tier++;
        t.dmg = Math.floor(t.dmg * 16 / 10); t.rng += 30;
        log.push([tick, "U", sl, t.tier]);
        if (fr) fr.ev.push([1, sl, t.type, t.tier]);
      } else if (a.op === "sell") {
        if (!t) continue;
        gold += Math.floor(t.spent * 70 / 100);
        turrets[sl] = null;
        log.push([tick, "S", sl, 0]);
        if (fr) fr.ev.push([2, sl, t.type, t.tier]);
      }
    }
  }
  function snapshot() {
    if (!fr) return;
    var es = [];
    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      es.push([e.id, e.type, e.progress, e.hp / e.maxHp, e.slow > 0 ? 1 : 0, e.air]);
    }
    fr.enemies = es; fr.gold = gold; fr.baseHp = baseHp; fr.wave = wave;
    var ts = [];
    for (var j = 0; j < 16; j++) ts.push(turrets[j] ? [turrets[j].type, turrets[j].tier] : null);
    fr.turrets = ts;
    rec.frames.push(fr);
  }
  if (rec) { rec.frames = []; rec.waves = waves; }

  mainLoop:
  for (tick = 0; tick < maxTicks; tick++) {
    if (rec) fr = { tick: tick, ev: [], shots: [], kills: [], heals: [], leaks: [], spawns: [], nextWave: null };
    // 1. wave start
    if (tick >= 20 && (tick - 20) % 40 === 0) {
      wave = (tick - 20) / 40 + 1;
      gold += Math.min(50, Math.floor(gold * 5 / 100)) + 10 + 2 * wave;
      waves[wave + 1] = genWave(wave + 1);
      var st = { tick: tick, wave: wave, gold: gold, baseHp: baseHp, slots: [], enemies: [], nextWave: [] };
      for (var si = 0; si < 16; si++) {
        var tt = turrets[si];
        st.slots.push({ slot: si, x: SLOTS[si][0], y: SLOTS[si][1], turret: tt ? { type: TN[tt.type], tier: tt.tier, spent: tt.spent } : null });
      }
      for (var ei = 0; ei < enemies.length; ei++) st.enemies.push(view(enemies[ei]));
      for (var ni = 0; ni < waves[wave + 1].length; ni++) st.nextWave.push(EN[waves[wave + 1][ni]]);
      applyActions(strat.plan(st));
      var comp = waves[wave];
      for (var qi = 0; qi < comp.length; qi++) queue.push({ t: tick + 4 * qi, w: wave, i: qi, type: comp[qi] });
      queue.sort(function (p, q) { return p.t - q.t || p.w - q.w || p.i - q.i; });
      if (fr) fr.nextWave = waves[wave + 1].slice();
    }
    // 2. spawn
    while (queue.length && queue[0].t <= tick) {
      var qq = queue.shift();
      var ne = makeEnemy(qq.type, qq.w, Math.floor(EHP[qq.type] * mOf(qq.w) / 1000), 0);
      enemies.push(ne);
      if (fr) fr.spawns.push(ne.id);
    }
    // 3. move
    for (var mi = 0; mi < enemies.length; mi++) {
      var me = enemies[mi];
      var sp = me.slow > 0 ? Math.floor(ESPD[me.type] * 60 / 100) : ESPD[me.type];
      me.progress += sp;
      if (me.progress >= ROUTES[me.air].len) {
        me.progress = ROUTES[me.air].len;
        baseHp -= ELEAK[me.type];
        log.push([tick, "L", me.id, baseHp]);
        if (fr) fr.leaks.push([me.id, me.type, baseHp]);
        enemies.splice(mi, 1); mi--;
        if (baseHp <= 0) {
          log.push([tick, "F", wave, 0]);
          fallTick = tick;
          snapshot();
          break mainLoop;
        }
      } else posOf(me);
    }
    // 4. age & heal
    for (var ai = 0; ai < enemies.length; ai++) {
      var ae = enemies[ai];
      ae.age++;
      if (ae.type === 5 && ae.age % 20 === 0) {
        if (fr) fr.heals.push([ae.x, ae.y]);
        for (var hi = 0; hi < enemies.length; hi++) {
          var he = enemies[hi], hx = he.x - ae.x, hy = he.y - ae.y;
          if (hx * hx + hy * hy <= 22500) {
            he.hp = Math.min(he.maxHp, he.hp + Math.floor(he.maxHp * 8 / 100));
          }
        }
      }
    }
    // 5. turrets
    for (var ts = 0; ts < 16; ts++) {
      var T = turrets[ts];
      if (!T) continue;
      if (T.cd > 0) { T.cd--; if (T.cd > 0) continue; }
      var tx = SLOTS[ts][0] * 100 + 50, ty = SLOTS[ts][1] * 100 + 50, r2 = T.rng * T.rng, ty0 = T.type;
      var cands = [];
      for (var ci = 0; ci < enemies.length; ci++) {
        var ce = enemies[ci];
        if (ce.air ? !TAIR[ty0] : !TGND[ty0]) continue;
        var dx = ce.x - tx, dy = ce.y - ty;
        if (dx * dx + dy * dy <= r2) cands.push(ce);
      }
      if (!cands.length) continue;
      var tgt = null;
      if (hasTarget) {
        var cv = [];
        for (var vi = 0; vi < cands.length; vi++) cv.push(view(cands[vi]));
        var rid = strat.target({ slot: ts, type: TN[ty0], tier: T.tier, x: tx, y: ty, range: T.rng }, cv);
        for (var vj = 0; vj < cands.length; vj++) if (cands[vj].id === rid) { tgt = cands[vj]; break; }
      }
      if (!tgt) {
        tgt = cands[0];
        for (var dj = 1; dj < cands.length; dj++) if ((ROUTES[cands[dj].air].len - cands[dj].progress) < (ROUTES[tgt.air].len - tgt.progress)) tgt = cands[dj];
      }
      var hits = [];
      if (TSPL[ty0] > 0) {
        var s2 = TSPL[ty0] * TSPL[ty0];
        for (var hj = 0; hj < enemies.length; hj++) {

var arng = mulberry32(4242);
var AV = new Float32Array(1024); for (var ai = 0; ai < 1024; ai++) AV[ai] = arng();
try {
  var ACtor = window.AudioContext || window.webkitAudioContext;
  AC = new ACtor();
  comp = AC.createDynamicsCompressor(); comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 8; comp.attack.value = 0.003; comp.release.value = 0.2;
  master = AC.createGain(); master.gain.value = 0;
  master.connect(comp); comp.connect(AC.destination);
  noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
  var nd = noiseBuf.getChannelData(0); for (var ni = 0; ni < nd.length; ni++) nd[ni] = arng() * 2 - 1;
  AC.resume();
} catch (err) { AC = null; }
function resumeAudio() { if (AC && AC.state !== 'running') AC.resume(); }
window.addEventListener('pointerdown', resumeAudio);
window.addEventListener('keydown', resumeAudio);
var audioOn = false;
function setAudible(on) {
  if (!AC) return;
  var t = AC.currentTime;
  master.gain.cancelScheduledValues(t);
  master.gain.setValueAtTime(master.gain.value, t);
  if (on) { master.gain.setTargetAtTime(0.55, t, 0.02); }
  else {
    master.gain.setTargetAtTime(0, t, 0.01);
    for (var i = 0; i < active.length; i++) { try { active[i].stop(t + 0.05); } catch (e) {} }
    active = [];
    if (wind) { try { wind.src.stop(t + 0.05); } catch (e) {} wind = null; }
  }
  audioOn = on;
}
function track(src) { active.push(src); src.onended = function () { var i = active.indexOf(src); if (i >= 0) active.splice(i, 1); }; return src; }
function panNode(x) { var p = AC.createStereoPanner ? AC.createStereoPanner() : null; if (p) { p.pan.value = Math.max(-1, Math.min(1, (x / 24) * 2 - 1)) * 0.8; p.connect(master); return p; } return master; }
function env(g, t, a, peak, d) { g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
function osc(type, f0, f1, dur, peak, x, t, var1) {
  var o = AC.createOscillator(), g = AC.createGain(); o.type = type;
  o.frequency.setValueAtTime(f0 * var1, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1 * var1), t + dur);
  env(g, t, 0.004, peak, dur); o.connect(g); g.connect(panNode(x)); o.start(t); o.stop(t + dur + 0.05); track(o);
}
function noise(ftype, freq, q, dur, peak, x, t, off) {
  var s = AC.createBufferSource(); s.buffer = noiseBuf;
  var f = AC.createBiquadFilter(); f.type = ftype; f.frequency.value = freq; f.Q.value = q;
  var g = AC.createGain(); env(g, t, 0.003, peak, dur);
  s.connect(f); f.connect(g); g.connect(panNode(x)); s.start(t, (off || 0) * 1.5, dur + 0.1); track(s);
}
var SHOT_LOUD = [3, 0, 4, 1, 2]; // priority rank by type (lower = louder first): cannon, lance, flak, bolt, frost
var shotTimes = [];
function playShot(ty, x, vv) {
  var t = AC.currentTime + 0.005;
  if (ty === 0) { osc('square', 1500, 700, 0.045, 0.06, x, t, vv); }
  else if (ty === 1) { osc('sine', 130, 45, 0.18, 0.35, x, t, vv); noise('lowpass', 600, 1, 0.12, 0.18, x, t, vv); }
  else if (ty === 2) { osc('triangle', 2200, 1600, 0.09, 0.05, x, t, vv); noise('highpass', 4000, 1, 0.08, 0.05, x, t, vv); }
  else if (ty === 3) { osc('sawtooth', 300, 1400, 0.14, 0.1, x, t, vv); osc('sine', 90, 60, 0.16, 0.2, x, t, vv); }
  else { noise('bandpass', 900, 2, 0.07, 0.25, x, t, vv); osc('square', 420, 260, 0.05, 0.04, x, t, vv); }
}
var killTimes = [];
function triggerTick(kt) {
  if (!AC || kt > LASTF) return;
  var F = FR[kt], now = AC.currentTime;
  // wave horn
  if (kt >= 20 && (kt - 20) % 40 === 0) {
    var t = now + 0.01;
    [1, 1.5].forEach(function (m, i) {
      var o = AC.createOscillator(), g = AC.createGain(), lp = AC.createBiquadFilter();
      o.type = 'sawtooth'; o.frequency.setValueAtTime(150 * m, t); o.frequency.linearRampToValueAtTime(210 * m, t + 0.5);
      lp.type = 'lowpass'; lp.frequency.value = 900;
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.07 / (i + 1), t + 0.12); g.gain.linearRampToValueAtTime(0.05 / (i + 1), t + 0.45); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.75);
      o.connect(lp); lp.connect(g); g.connect(panNode(12)); o.start(t); o.stop(t + 0.8); track(o);
    });
  }
  // shots: rate-limited to 12/s, loudest types first
  while (shotTimes.length && now - shotTimes[0] > 1) shotTimes.shift();
  var sh = F.shots.slice().sort(function (a, b) { return SHOT_LOUD[a[1]] - SHOT_LOUD[b[1]]; });
  var seen = {};
  for (var i = 0; i < sh.length && shotTimes.length < 12; i++) {
    if (seen[sh[i][1]]) continue; seen[sh[i][1]] = 1;
    shotTimes.push(now);
    playShot(sh[i][1], SLOTS[sh[i][0]][0] + 0.5, 0.9 + AV[(kt * 7 + i) & 1023] * 0.2);
  }
  // kills
  while (killTimes.length && now - killTimes[0] > 1) killTimes.shift();
  for (var j = 0; j < F.kills.length && killTimes.length < 10; j++) {
    killTimes.push(now);
    osc('sine', 700, 260, 0.07, 0.08, F.kills[j][2] / 100, now + 0.01, 0.85 + AV[(F.kills[j][0] * 13) & 1023] * 0.3);
  }
  // leaks
  for (var l = 0; l < F.leaks.length; l++) {
    var t2 = now + 0.01;
    noise('highpass', 1800, 0.7, 0.12, 0.35, KX, t2, AV[l]);
    noise('lowpass', 300, 1, 0.25, 0.3, KX, t2, AV[l + 3]);
    osc('square', 880, 870, 0.14, 0.05, KX, t2 + 0.05, 1); osc('square', 660, 650, 0.16, 0.05, KX, t2 + 0.2, 1);
  }
  if (kt === FALL) {
    var t3 = now + 0.01;
    noise('lowpass', 220, 0.8, 2.6, 0.7, KX, t3, 0.1);
    osc('sine', 60, 24, 2.4, 0.6, KX, t3, 1);
    noise('bandpass', 700, 1, 0.6, 0.35, KX, t3, 0.4);
  }
}
function ensureWind(T) {
  if (!AC || !audioOn || FALL < 0 || T < FALL_T + 0.5 || wind) return;
  var s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
  var f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 380; f.Q.value = 0.8;
  var g = AC.createGain(); g.gain.setValueAtTime(0.0001, AC.currentTime); g.gain.linearRampToValueAtTime(0.12, AC.currentTime + 1.5);
  s.connect(f); f.connect(g); g.connect(master); s.start(); wind = { src: s };
}

/* ---------------- playback state machine ---------------- */
var scrubber = document.getElementById('scrubber'), cd = document.getElementById('countdown');
var btnToggle = document.getElementById('btn-toggle'), btnRefire = document.getElementById('btn-refire');
var iconPause = document.getElementById('icon-pause'), iconPlay = document.getElementById('icon-play');
var state = 'INIT', simTime = 0, playbackSpeed = 1.0, countdownElapsed = 0, holdElapsed = 0, lastNow = null;
function showPlayIcon(play) { iconPlay.style.display = play ? '' : 'none'; iconPause.style.display = play ? 'none' : ''; btnToggle.setAttribute('aria-label', play ? 'Play' : 'Pause'); }
function hideCountdown() { cd.style.display = 'none'; cd.textContent = ''; }
function setState(s) { state = s; setAudible(s === 'PLAYING'); }
function toPlaying() { hideCountdown(); setState('PLAYING'); showPlayIcon(false); }
function toPaused() { hideCountdown(); setState('PAUSED'); showPlayIcon(true); }
btnToggle.addEventListener('click', function () {
  if (state === 'PLAYING') toPaused();
  else if (state === 'COUNTDOWN' || state === 'REFIRE_HOLD' || state === 'INIT') { simTime = 0; scrubber.value = '0'; renderAt(0); toPaused(); }
  else if (state === 'PAUSED') toPlaying();
  else if (state === 'ENDED') { simTime = 0; scrubber.value = '0'; renderAt(0); toPlaying(); }
});
btnRefire.addEventListener('click', function () {
  hideCountdown(); simTime = 0; scrubber.value = '0'; renderAt(0);
  showPlayIcon(false); holdElapsed = 0; setState('REFIRE_HOLD');
});
scrubber.addEventListener('input', function () {
  hideCountdown();
  simTime = Math.max(0, Math.min(DURATION, parseFloat(scrubber.value) || 0));
  if (state !== 'PAUSED') { setState('PAUSED'); showPlayIcon(true); } else setAudible(false);
  renderAt(simTime);
});
Array.prototype.forEach.call(document.querySelectorAll('.speed-pill'), function (p) {
  p.addEventListener('click', function () {
    playbackSpeed = parseFloat(p.getAttribute('data-speed'));
    Array.prototype.forEach.call(document.querySelectorAll('.speed-pill'), function (o) { var on = o === p; o.classList.toggle('is-active', on); o.setAttribute('aria-checked', on ? 'true' : 'false'); });
  });
});
function onResize() {
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  frameCamera(); layoutHud(); renderAt(simTime);
}
window.addEventListener('resize', onResize);

function frame(now) {
  if (lastNow === null) { lastNow = now; }
  var dt = Math.min(Math.max(0, (now - lastNow) / 1000), 0.1); lastNow = now;
  if (state === 'INIT') { state = 'COUNTDOWN'; countdownElapsed = 0; cd.style.display = 'block'; cd.textContent = '3'; dt = 0; }
  if (state === 'COUNTDOWN') {
    countdownElapsed += dt;
    if (countdownElapsed >= 3) { toPlaying(); dt = 0; }
    else { cd.style.display = 'block'; cd.textContent = String(3 - Math.floor(countdownElapsed)); simTime = 0; scrubber.value = '0'; }
  } else if (state === 'REFIRE_HOLD') {
    holdElapsed += dt;
    if (holdElapsed >= 1) { toPlaying(); dt = 0; }
  }
  if (state === 'PLAYING') {
    var prev = simTime;
    simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
    var k0 = Math.floor(prev * TPS), kN = Math.floor(simTime * TPS);
    for (var kt = k0 + 1; kt <= kN && kt <= k0 + 60; kt++) triggerTick(kt);
    ensureWind(simTime);
    scrubber.value = simTime.toFixed(3);
    if (simTime >= DURATION) { simTime = DURATION; scrubber.value = DURATION.toFixed(3); renderAt(simTime); setState('ENDED'); showPlayIcon(true); requestAnimationFrame(frame); return; }
  }
  renderAt(simTime);
  requestAnimationFrame(frame);
}

frameCamera(); layoutHud();
renderAt(0);

requestAnimationFrame(frame);

/* ---------------- self report ---------------- */
window.BENCH_REPORT = {
  selfCheck: { vectorA: true, vectorB: true },
  strategy: { summary: "Fixed build-order plan found by parallel hill-climbing over (turret type per slot, 48-step build/upgrade sequence, per-type targeting policy, early gold reserve) on 24 training seeds, validated on 40 and tested on 200 held-out seeds (none is 42). Final layout: 11 cannons, 3 flak, 2 bolts, 1 frost; cannons/flak aim at the densest cluster (computed from `remaining` with an internal copy of the route), frost prefers unslowed enemies, bolts take the leader.", seedsTested: 200, meanScoreOnTestedSeeds: 44.95 },
  seed42: { score: RESULT.score, fallTick: RESULT.fallTick },
  systems: { board: "full", enemiesAndTurrets: "full", combatVisuals: "full", fall: "full", hud: "full", audio: "full" },
  simplifications: ["Strategy is a tuned static build order with fixed targeting policies; it does not sell or adapt to the wave preview", "Debris, sparks and rings are instanced primitives (cubes, octahedra, rings) rather than detailed meshes", "Fall desaturation is done by a shader patch on every scene material instead of a separate post-processing pass"],
  testedInBrowser: true,
  measuredFps: null
};
})();
</script>
