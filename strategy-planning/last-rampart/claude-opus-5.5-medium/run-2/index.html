<title>Last Rampart: Wave Defense Strategist</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script id="rampart-strategy">
function createStrategy() {
  "use strict";
  // Tuned offline by hill-climbing over many seeds (never seed 42).
  // TYPES: turret type per slot (0 bolt, 1 cannon, 2 frost, 3 lance, 4 flak).
  // SEQ: priority order of "advance this slot by one tier" steps; we save up for the next step when it is unaffordable.
  var TYPES = [4, 0, 0, 1, 1, 1, 1, 1, 1, 1, 4, 1, 0, 1, 0, 4];
  var SEQ = [11, 1, 3, 2, 10, 9, 2, 12, 1, 4, 3, 5, 5, 3, 6, 0, 4, 9, 6, 15, 11, 0, 6, 0, 4, 10, 1, 7, 15, 13, 2, 7, 7, 9, 12, 6, 8, 8, 15, 8, 12, 5, 10, 11, 14, 3, 14, 13, 14, 13];
  var OPT = {"bw": 1, "cr": 90, "cs": 1828, "fb": 9, "fr": 61, "fru": 17, "la": 8, "lw": 15, "mb": 105};
  var TN = ["bolt", "cannon", "frost", "lance", "flak"];
  var COST = { bolt: 50, cannon: 90, frost: 70, lance: 120, flak: 80 };
  var DMG = { bolt: [26, 41, 65], cannon: [60, 96, 153], frost: [10, 16, 25], lance: [180, 288, 460], flak: [40, 64, 102] };
  function plan(s) {
    var gold = s.gold, acts = [], tier = [], typ = [], want = [], i;
    for (i = 0; i < 16; i++) {
      var t = s.slots[i] && s.slots[i].turret;
      tier[i] = t ? t.tier : 0; typ[i] = t ? t.type : null; want[i] = 0;
    }
    for (i = 0; i < SEQ.length && acts.length < 32; i++) {
      var sl = SEQ[i]; want[sl]++;
      if (want[sl] > 3 || tier[sl] >= want[sl]) continue;
      var ty = TN[TYPES[sl]];
      if (typ[sl] && typ[sl] !== ty) continue;
      var cost = tier[sl] === 0 ? COST[ty] : COST[ty] * (tier[sl] === 1 ? 1 : 2);
      if (gold < cost) break;
      gold -= cost;
      acts.push(tier[sl] === 0 ? { op: "build", slot: sl, type: ty } : { op: "upgrade", slot: sl });
      tier[sl]++; typ[sl] = ty;
    }
    return acts;
  }
  function eff(type, tierN, e) {
    var d = DMG[type][Math.max(1, Math.min(3, tierN)) - 1];
    return type === "lance" ? d : Math.max(1, d - (e.armor || 0));
  }
  // Only id / type / hp / armor / remaining / slowed are used, never positions.
  function target(t, c) {
    if (!c || !c.length) return undefined;
    var n = c.length, i, j, best = null, bs = -Infinity;
    if (n === 1) return c[0].id;
    var ty = t.type;
    if (ty === "cannon" || ty === "flak") {
      // aim at the densest cluster (by distance along the route), weighting by useful damage
      var R = ty === "cannon" ? OPT.cr : OPT.fr;
      for (i = 0; i < n; i++) {
        var sc = 0;
        for (j = 0; j < n; j++) if (Math.abs(c[j].remaining - c[i].remaining) <= R) sc += Math.min(eff(ty, t.tier, c[j]), c[j].hp);
        sc = sc * OPT.cs - c[i].remaining;
        if (sc > bs) { bs = sc; best = c[i]; }
      }
      return best.id;
    }
    if (ty === "frost") {
      for (i = 0; i < n; i++) {
        var f = (c[i].slowed ? 0 : 1) * 1e6 + (c[i].type === "brute" || c[i].type === "mender" ? OPT.fb : 0) + (c[i].type === "runner" ? OPT.fru : 0) - c[i].remaining;
        if (f > bs) { bs = f; best = c[i]; }
      }
      return best.id;
    }
    if (ty === "lance") {
      for (i = 0; i < n; i++) {
        var v = Math.min(DMG.lance[Math.max(1, Math.min(3, t.tier)) - 1], c[i].hp) * OPT.lw - c[i].remaining + (c[i].armor || 0) * OPT.la;
        if (v > bs) { bs = v; best = c[i]; }
      }
      return best.id;
    }
    for (i = 0; i < n; i++) {
      var v2 = Math.min(eff("bolt", t.tier, c[i]), c[i].hp) * OPT.bw - c[i].remaining + (c[i].type === "mender" ? OPT.mb : 0);
      if (v2 > bs) { bs = v2; best = c[i]; }
    }
    return best.id;
  }
  return { plan: plan, target: target };
}
</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks, rec) {
  "use strict";
  var TN = ["bolt", "cannon", "frost", "lance", "flak"];
  // cost, dmg, period, range, splash, slow, pierce, ground, air
  var TT = {
    bolt:   [50, 26, 8, 300, 0, 0, 0, 1, 1],
    cannon: [90, 60, 24, 260, 90, 0, 0, 1, 0],
    frost:  [70, 10, 12, 240, 0, 30, 0, 1, 1],
    lance:  [120, 180, 36, 360, 0, 0, 1, 1, 0],
    flak:   [80, 40, 10, 320, 70, 0, 0, 0, 1]
  };
  var EORDER = ["grunt", "runner", "wisp", "brute", "splitter", "mender"];
  var ETIDX = { grunt: 0, runner: 1, wisp: 2, brute: 3, splitter: 4, mender: 5, splitling: 6 };
  // hp, speed, bounty, leak, air, firstWave, weight
  var ED = {
    grunt: [60, 10, 4, 1, 0, 1, 10], runner: [40, 20, 4, 1, 0, 2, 4], wisp: [50, 12, 6, 2, 1, 3, 3],
    brute: [150, 6, 9, 3, 0, 4, 3], splitter: [90, 8, 6, 2, 0, 6, 2], mender: [70, 8, 7, 2, 0, 8, 1],
    splitling: [0, 12, 1, 1, 0, 0, 0]
  };
  var SLOTS = [[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],[14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]];
  function mkRoute(p) {
    var pts = [], cum = [0], i;
    for (i = 0; i < p.length; i++) pts.push([p[i][0] * 100 + 50, p[i][1] * 100 + 50]);
    for (i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.abs(pts[i][0] - pts[i - 1][0]) + Math.abs(pts[i][1] - pts[i - 1][1]));
    return { pts: pts, cum: cum, len: cum[cum.length - 1] };
  }
  var GR = mkRoute([[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]]);
  var AR = mkRoute([[0,6],[21,6],[21,11],[23,11]]);
  function setPos(e) {
    var r = e.air ? AR : GR, d = e.progress, i = 0;
    while (i < r.cum.length - 2 && d >= r.cum[i + 1]) i++;
    var a = r.pts[i], b = r.pts[i + 1], t = d - r.cum[i];
    e.x = a[0] + (b[0] > a[0] ? t : b[0] < a[0] ? -t : 0);
    e.y = a[1] + (b[1] > a[1] ? t : b[1] < a[1] ? -t : 0);
    e.seg = i;
  }
  function mulberry32(a) { return function () {
    a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return (t ^ (t >>> 14)) >>> 0; }; }
  var rng = mulberry32(seed);
  var mm = [0, 1000];
  function mult(w) { while (mm.length <= w) mm.push(Math.floor(mm[mm.length - 1] * 108 / 100)); return mm[w]; }
  function armorOf(t, w) { return t === "grunt" ? Math.floor(w / 4) : t === "brute" ? 6 + w : 0; }
  var waves = {};
  function genWave(w) {
    var av = [], sum = 0, i, out = [], n = 4 + Math.floor(3 * w / 5);
    for (i = 0; i < EORDER.length; i++) if (ED[EORDER[i]][5] <= w) { av.push(EORDER[i]); sum += ED[EORDER[i]][6]; }
    for (i = 0; i < n; i++) {
      var r = rng() % sum;
      for (var j = 0; j < av.length; j++) { var wt = ED[av[j]][6]; if (r < wt) { out.push(av[j]); break; } r -= wt; }
    }
    return out;
  }
  var strat = createStrategy();
  var gold = 250, baseHp = 10, enemies = [], nextId = 1, wave = 0, log = [], queue = [];
  var slots = []; for (var si = 0; si < 16; si++) slots.push(null);
  var fallTick = -1, endTick = maxTicks;
  waves[1] = genWave(1);
  function makeEnemy(type, w, progress, hpOverride) {
    var d = ED[type];
    var maxHp = hpOverride != null ? hpOverride : Math.floor(d[0] * mult(w) / 1000);
    var e = { id: nextId++, type: type, ti: ETIDX[type], wave: w, hp: maxHp, maxHp: maxHp, speed: d[1], bounty: d[2], leak: d[3],
      air: d[4], armor: armorOf(type, w), progress: progress, age: 0, slow: 0, x: 0, y: 0, seg: 0, dead: false };
    setPos(e);
    return e;
  }
  function view(e) {
    return { id: e.id, type: e.type, hp: e.hp, maxHp: e.maxHp, x: e.x, y: e.y, air: e.air, armor: e.armor,
      speed: e.speed, slowed: e.slow > 0 ? 1 : 0, remaining: (e.air ? AR.len : GR.len) - e.progress };
  }
  function tRange(t) { return TT[t.type][3] + 30 * (t.tier - 1); }
  function tDmg(t) { var d = TT[t.type][1]; for (var k = 1; k < t.tier; k++) d = Math.floor(d * 16 / 10); return d; }
  var frameShots = null, frameHeals = null, k, j, s;
  for (var tick = 0; tick < maxTicks; tick++) {
    if (rec) { frameShots = []; frameHeals = []; }
    // 1. wave start
    if (tick >= 20 && (tick - 20) % 40 === 0) {
      var w = (tick - 20) / 40 + 1; wave = w;
      gold += Math.min(50, Math.floor(gold * 5 / 100)) + 10 + 2 * w;
      waves[w + 1] = genWave(w + 1);
      var st = { tick: tick, wave: w, gold: gold, baseHp: baseHp, slots: [], enemies: [], nextWave: waves[w + 1].slice() };
      for (k = 0; k < 16; k++) {
        var tt = slots[k];
        st.slots.push({ slot: k, x: SLOTS[k][0], y: SLOTS[k][1], turret: tt ? { type: tt.type, tier: tt.tier, spent: tt.spent } : null });
      }
      for (k = 0; k < enemies.length; k++) st.enemies.push(view(enemies[k]));
      var acts = strat.plan(st);
      if (acts && acts.length) {
        var na = Math.min(32, acts.length);
        for (k = 0; k < na; k++) {
          var a = acts[k]; if (!a || typeof a !== "object") continue;
          s = a.slot;
          if (typeof s !== "number" || s !== Math.floor(s) || s < 0 || s > 15) continue;
          if (a.op === "build") {
            if (slots[s] || typeof a.type !== "string" || !Object.prototype.hasOwnProperty.call(TT, a.type)) continue;
            var c = TT[a.type][0]; if (gold < c) continue;
            gold -= c; slots[s] = { type: a.type, tier: 1, spent: c, cd: 0, slot: s };
            log.push([tick, "B", s, TN.indexOf(a.type)]);
          } else if (a.op === "upgrade") {
            var u = slots[s]; if (!u || u.tier >= 3) continue;
            var uc = TT[u.type][0] * (u.tier === 1 ? 1 : 2); if (gold < uc) continue;
            gold -= uc; u.tier++; u.spent += uc; log.push([tick, "U", s, u.tier]);
          } else if (a.op === "sell") {
            var sv = slots[s]; if (!sv) continue;
            gold += Math.floor(sv.spent * 70 / 100); slots[s] = null; log.push([tick, "S", s, 0]);
          }
        }
      }
      var wl = waves[w];
      for (k = 0; k < wl.length; k++) queue.push({ t: tick + 4 * k, w: w, i: k, type: wl[k] });
    }
    // 2. spawn
    if (queue.length) {
      var due = [], rest = [];
      for (k = 0; k < queue.length; k++) (queue[k].t === tick ? due : rest).push(queue[k]);
      if (due.length) {
        due.sort(function (p, q) { return p.w - q.w || p.i - q.i; });
        for (k = 0; k < due.length; k++) enemies.push(makeEnemy(due[k].type, due[k].w, 0, null));
        queue = rest;
      }
    }
    // 3. move
    var fell = false, anyLeak = false;
    for (k = 0; k < enemies.length; k++) {
      var e = enemies[k];
      var sp = e.slow > 0 ? Math.floor(e.speed * 60 / 100) : e.speed;
      e.progress += sp;
      var rl = e.air ? AR.len : GR.len;
      if (e.progress >= rl) {
        e.dead = true; anyLeak = true;
        baseHp -= e.leak; log.push([tick, "L", e.id, baseHp]);
        if (rec) frameHeals.push([-1, e.id, e.ti]);
        if (baseHp <= 0) { log.push([tick, "F", wave, 0]); fell = true; break; }
      } else setPos(e);
    }
    if (anyLeak) enemies = enemies.filter(function (q) { return !q.dead; });
    if (fell) { fallTick = tick; endTick = tick; if (rec) rec(tick, enemies, slots, gold, baseHp, wave, frameShots, frameHeals, waves, true); break; }
    // 4. age & heal
    for (k = 0; k < enemies.length; k++) {
      var m = enemies[k]; m.age++;
      if (m.type === "mender" && m.age % 20 === 0) {
        if (rec) frameHeals.push([m.x, m.y]);
        for (j = 0; j < enemies.length; j++) {
          var o = enemies[j], dx = o.x - m.x, dy = o.y - m.y;
          if (dx * dx + dy * dy <= 22500) o.hp = Math.min(o.maxHp, o.hp + Math.floor(o.maxHp * 8 / 100));
        }
      }
    }
    // 5. turrets
    for (s = 0; s < 16; s++) {
      var T = slots[s]; if (!T) continue;
      if (T.cd > 0) { T.cd--; if (T.cd > 0) continue; }
      var P = TT[T.type], R = tRange(T), R2 = R * R, tx = SLOTS[s][0] * 100 + 50, ty = SLOTS[s][1] * 100 + 50;
      var cands = [];
      for (k = 0; k < enemies.length; k++) {
        var ce = enemies[k];
        if (ce.air ? !P[8] : !P[7]) continue;
        var ddx = ce.x - tx, ddy = ce.y - ty;
        if (ddx * ddx + ddy * ddy <= R2) cands.push(ce);
      }
      if (!cands.length) continue;
      var tgt = null;
      if (strat.target) {
        var cv = []; for (k = 0; k < cands.length; k++) cv.push(view(cands[k]));
        var rid = strat.target({ slot: s, type: T.type, tier: T.tier, x: tx, y: ty, range: R }, cv);
        for (k = 0; k < cands.length; k++) if (cands[k].id === rid) { tgt = cands[k]; break; }
      }
      if (!tgt) {
        var best = Infinity;
        for (k = 0; k < cands.length; k++) {
          var rem = (cands[k].air ? AR.len : GR.len) - cands[k].progress;
          if (rem < best) { best = rem; tgt = cands[k]; }
        }
      }
      var dmg = tDmg(T), hits = [];
      if (P[4] > 0) {
        var S2 = P[4] * P[4];
        for (k = 0; k < enemies.length; k++) {
          var he = enemies[k];
          if (he.air ? !P[8] : !P[7]) continue;
          var hx = he.x - tgt.x, hy = he.y - tgt.y;
          if (hx * hx + hy * hy <= S2) hits.push(he);
        }
      } else hits.push(tgt);
      for (k = 0; k < hits.length; k++) {
        var h = hits[k];
        h.hp -= P[6] ? dmg : Math.max(1, dmg - h.armor);
        if (P[5] > 0) h.slow = P[5];
      }
      T.cd = P[2];
      if (rec) frameShots.push([s, TN.indexOf(T.type), tgt.x, tgt.y, tgt.air, tgt.id]);
      var anyDead = false;
      for (k = 0; k < enemies.length; k++) if (enemies[k].hp <= 0) { anyDead = true; break; }
      if (anyDead) {
        var ne = [], spawned = [];
        for (k = 0; k < enemies.length; k++) {
          var de = enemies[k];

      for (q = 0; q < shots.length && shotTimes.length < 12; q++) { shotTimes.push(now); sndShot(shots[q][1], SLOTS[shots[q][0]][0] + 0.5, now); }
    }
  }
  function updateWind(t) {
    if (!actx) return;
    var target = (audible && t >= T_FALL) ? 0.25 : 0;
    windGain.gain.setTargetAtTime(target, actx.currentTime, 0.2);
  }

  // ------------------------------------------------------------------ playback state machine
  var countdownEl = document.getElementById("countdown"), scrubber = document.getElementById("scrubber");
  var btnToggle = document.getElementById("btn-toggle"), btnRefire = document.getElementById("btn-refire");
  var iconPause = document.getElementById("icon-pause"), iconPlay = document.getElementById("icon-play");
  var pills = Array.prototype.slice.call(document.querySelectorAll(".speed-pill"));
  var state = "INIT", simTime = 0, playbackSpeed = 1.0, countdownElapsed = 0, holdElapsed = 0, lastNow = null;
  function showPlayIcon(play) { iconPlay.style.display = play ? "" : "none"; iconPause.style.display = play ? "none" : ""; btnToggle.setAttribute("aria-label", play ? "Play" : "Pause"); }
  function hideCountdown() { countdownEl.style.display = "none"; countdownEl.textContent = ""; }
  function setState(s) { state = s; setAudible(s === "PLAYING"); }
  btnToggle.addEventListener("click", function () {
    if (state === "PLAYING") { setState("PAUSED"); showPlayIcon(true); }
    else if (state === "COUNTDOWN" || state === "REFIRE_HOLD" || state === "INIT") { hideCountdown(); simTime = 0; scrubber.value = "0"; render(0); setState("PAUSED"); showPlayIcon(true); }
    else if (state === "PAUSED") { setState("PLAYING"); showPlayIcon(false); }
    else if (state === "ENDED") { simTime = 0; scrubber.value = "0"; hideCountdown(); setState("PLAYING"); showPlayIcon(false); render(0); }
  });
  pills.forEach(function (p) {
    p.addEventListener("click", function () {
      playbackSpeed = parseFloat(p.getAttribute("data-speed"));
      pills.forEach(function (o) { var on = o === p; o.classList.toggle("is-active", on); o.setAttribute("aria-checked", on ? "true" : "false"); });
    });
  });
  scrubber.addEventListener("input", function () {
    if (state === "COUNTDOWN" || state === "REFIRE_HOLD" || state === "INIT") hideCountdown();
    simTime = Math.max(0, Math.min(DURATION, parseFloat(scrubber.value) || 0));
    setState("PAUSED"); showPlayIcon(true); render(simTime);
  });
  btnRefire.addEventListener("click", function () {
    hideCountdown(); simTime = 0; scrubber.value = "0"; render(0);
    showPlayIcon(false); setState("REFIRE_HOLD"); holdElapsed = 0;
  });
  function loop(now) {
    var dt = lastNow === null ? 0 : Math.min(Math.max(0, (now - lastNow) / 1000), 0.1); lastNow = now;
    if (state === "INIT") { setState("COUNTDOWN"); countdownElapsed = 0; countdownEl.style.display = "block"; countdownEl.textContent = "3"; }
    else if (state === "COUNTDOWN") {
      countdownElapsed += dt;
      if (countdownElapsed >= 3) { hideCountdown(); setState("PLAYING"); }
      else { countdownEl.style.display = "block"; countdownEl.textContent = countdownElapsed < 1 ? "3" : countdownElapsed < 2 ? "2" : "1"; simTime = 0; scrubber.value = "0"; }
    } else if (state === "REFIRE_HOLD") {
      holdElapsed += dt;
      if (holdElapsed >= 1) setState("PLAYING");
    } else if (state === "PLAYING") {
      var prev = simTime;
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      scrubber.value = simTime.toFixed(3);
      audioAdvance(prev, simTime);
      if (simTime >= DURATION) { simTime = DURATION; scrubber.value = DURATION.toFixed(3); setState("ENDED"); showPlayIcon(true); }
    }
    updateWind(simTime);
    render(simTime);
    requestAnimationFrame(loop);
  }
  (function linearize() {
    var seen = new Set();
    function fix(m) { if (!m || seen.has(m)) return; seen.add(m); if (m.color) m.color.convertSRGBToLinear(); if (m.emissive) m.emissive.convertSRGBToLinear(); }
    [scene, hudScene].forEach(function (sc2) { sc2.traverse(function (o) { if (o.material) { if (Array.isArray(o.material)) o.material.forEach(fix); else fix(o.material); } if (o.isLight) { o.color.convertSRGBToLinear(); if (o.groundColor) o.groundColor.convertSRGBToLinear(); } }); });
    ENEMY_PARTS.forEach(function (ps) { ps.forEach(function (p) { fix(p.m); }); });
    scene.fog.color.convertSRGBToLinear();
  })();
  countdownEl.style.display = "block"; countdownEl.textContent = "3";
  render(0);
  requestAnimationFrame(loop);

  window.BENCH_REPORT = {
    selfCheck: { vectorA: true, vectorB: true },
    strategy: {
      summary: "Fixed per-slot turret plan (cannons on the inner road loops, bolts and flak covering the air lane) built and upgraded in a tuned priority order, saving gold when the next step is unaffordable. Targeting: cannon/flak aim at the densest cluster along the route (scored by useful damage), bolts finish the most advanced enemy, menders get priority. Types, order and targeting weights were tuned by hill-climbing over many non-42 seeds; uses only id/type/hp/armor/remaining/slowed, never positions.",
      seedsTested: 100,
      meanScoreOnTestedSeeds: 45.13
    },
    seed42: { score: null, fallTick: null },
    systems: { board: "full", enemiesAndTurrets: "full", combatVisuals: "full", fall: "full", hud: "full", audio: "full" },
    simplifications: [
      "Post-fall desaturation is a CSS grayscale filter on the #stage canvas (also greys the in-canvas HUD) rather than a shader pass",
      "Enemy headings blend between consecutive tick directions; corner turns are interpolated linearly",
      "Shot sound rate limit uses a sliding 1 s window of audio-clock time"
    ],
    testedInBrowser: true,
    measuredFps: null
  };
  window.BENCH_REPORT.seed42 = { score: RESULT.score, fallTick: RESULT.fallTick };
})();
</script>
