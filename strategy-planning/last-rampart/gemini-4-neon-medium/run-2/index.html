  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">

<script id="rampart-strategy">
function createStrategy() {
  const COSTS = { bolt: 50, cannon: 90, frost: 70, lance: 120, flak: 80 };
  const LAYOUT = [
    "flak", "frost", "flak", "bolt",
    "cannon", "cannon", "cannon", "cannon",
    "cannon", "cannon", "cannon", "cannon",
    "cannon", "bolt", "flak", "flak"
  ];
  const PRIO = [4, 8, 12, 13, 6, 3, 11, 10, 14, 1, 7, 2, 0, 5, 15, 9];

  return {
    plan(state) {
      const actions = [];
      let g = state.gold;
      const map = state.slots.map(s => s.turret ? { type: s.turret.type, tier: s.turret.tier } : null);

      let minGroundRem = 9999, minAirRem = 9999, airCount = 0;
      for (let i = 0; i < state.enemies.length; i++) {
        const e = state.enemies[i];
        if (e.air) {
          airCount++;
          if (e.remaining < minAirRem) minAirRem = e.remaining;
        } else {
          if (e.remaining < minGroundRem) minGroundRem = e.remaining;
        }
      }
      let nextAir = 0;
      for (let i = 0; i < state.nextWave.length; i++) {
        if (state.nextWave[i] === "wisp") nextAir++;
      }

      const groundDanger = minGroundRem < 1100;
      const airDanger = minAirRem < 800;
      const hpDanger = state.baseHp < 10;

      let reserve = 0;
      if (state.wave >= 2 && state.wave < 32 && !groundDanger && !airDanger && !hpDanger) {
        reserve = 800;
      }

      const mustHave = [[4, 1]];
      if (state.wave >= 3 || nextAir > 0) mustHave.push([12, 1]);
      if (state.wave >= 6) mustHave.push([8, 1]);
      if (state.wave >= 10) mustHave.push([13, 1]);
      if (state.wave >= 13) mustHave.push([6, 1]);
      if (state.wave >= 15) mustHave.push([14, 1]);
      if (state.wave >= 17) mustHave.push([3, 1], [10, 1]);
      if (state.wave >= 20) mustHave.push([4, 2], [8, 2], [12, 2]);
      if (state.wave >= 24) mustHave.push([11, 1], [7, 1], [13, 2]);

      for (let i = 0; i < mustHave.length; i++) {
        const sl = mustHave[i][0], reqTier = mustHave[i][1], tp = LAYOUT[sl];
        const cur = map[sl];
        if (!cur) {
          if (g >= COSTS[tp]) {
            actions.push({ op: "build", slot: sl, type: tp });
            g -= COSTS[tp];
            map[sl] = { type: tp, tier: 1 };
          }
        } else if (cur.tier < reqTier) {
          const cost = cur.tier === 1 ? COSTS[cur.type] : COSTS[cur.type] * 2;
          if (g >= cost) {
            actions.push({ op: "upgrade", slot: sl });
            g -= cost;
            cur.tier += 1;
          }
        }
      }

      if (airDanger || airCount >= 6) {
        for (let i = 0; i < PRIO.length; i++) {
          const sl = PRIO[i], tp = LAYOUT[sl];
          if (tp !== "flak") continue;
          const cur = map[sl];
          if (!cur && g >= COSTS.flak) {
            actions.push({ op: "build", slot: sl, type: "flak" });
            g -= COSTS.flak;
            map[sl] = { type: "flak", tier: 1 };
          } else if (cur && cur.tier < 3) {
            const cost = cur.tier === 1 ? COSTS.flak : COSTS.flak * 2;
            if (g >= cost) {
              actions.push({ op: "upgrade", slot: sl });
              g -= cost;
              cur.tier += 1;
            }
          }
        }
      }

      for (let i = 0; i < PRIO.length; i++) {
        const sl = PRIO[i], tp = LAYOUT[sl];
        if (tp === "flak" && state.wave < 2) continue;
        if (!map[sl] && g - COSTS[tp] >= reserve) {
          actions.push({ op: "build", slot: sl, type: tp });
          g -= COSTS[tp];
          map[sl] = { type: tp, tier: 1 };
        }
      }

      for (let tier = 2; tier <= 3; tier++) {
        for (let i = 0; i < PRIO.length; i++) {
          const sl = PRIO[i], cur = map[sl];
          if (!cur || cur.type === "frost" || cur.tier >= tier) continue;
          const cost = cur.tier === 1 ? COSTS[cur.type] : COSTS[cur.type] * 2;
          if (g - cost >= reserve) {
            actions.push({ op: "upgrade", slot: sl });
            g -= cost;
            cur.tier += 1;
          }
        }
      }

      for (let tier = 2; tier <= 3; tier++) {
        for (let i = 0; i < PRIO.length; i++) {
          const sl = PRIO[i], cur = map[sl];
          if (!cur || cur.type !== "frost" || cur.tier >= tier) continue;
          const cost = cur.tier === 1 ? COSTS.frost : COSTS.frost * 2;
          if (g - cost >= reserve) {
            actions.push({ op: "upgrade", slot: sl });
            g -= cost;
            cur.tier += 1;
          }
        }
      }

      return actions;
    },

    target(turret, candidates) {
      if (candidates.length === 1) return candidates[0].id;
      const type = turret.type;
      if (type === "frost") {
        let best = candidates[0], bestScore = -1e18;
        for (let i = 0; i < candidates.length; i++) {
          const c = candidates[i];
          const unslowed = c.slowed <= 4 ? 100000 : (30 - c.slowed) * 1500;
          const airB = c.air ? 18000 : 0;
          const spd = c.slowed > 0 ? Math.floor(c.speed * 0.6) : c.speed;
          const tte = c.remaining / spd;
          const score = unslowed + airB + c.speed * 600 - tte * 250;
          if (score > bestScore) { bestScore = score; best = c; }
        }
        return best.id;
      }
      if (type === "cannon") {
        let best = candidates[0], bestScore = -1e18;
        const sp2 = 8100;
        const dmg = turret.tier === 1 ? 60 : (turret.tier === 2 ? 96 : 153);
        for (let i = 0; i < candidates.length; i++) {
          const c = candidates[i];
          let effDmg = 0, urg = 0;
          for (let j = 0; j < candidates.length; j++) {
            const o = candidates[j], dx = o.x - c.x, dy = o.y - c.y;
            if (dx * dx + dy * dy <= sp2) {
              const d = Math.max(1, dmg - o.armor);
              effDmg += Math.min(o.hp, d);
              if (o.type === "mender") effDmg += 200;
              const spd = o.slowed > 0 ? Math.floor(o.speed * 0.6) : o.speed;
              const tte = o.remaining / spd;
              if (tte < 75) urg += (75 - tte) * 12;
            }
          }
          const spd = c.slowed > 0 ? Math.floor(c.speed * 0.6) : c.speed;
          const tte = c.remaining / spd;
          const score = effDmg * 12 + urg * 10 - tte * 6;
          if (score > bestScore) { bestScore = score; best = c; }
        }
        return best.id;
      }
      if (type === "flak") {
        let best = candidates[0], bestScore = -1e18;
        const sp2 = 4900;
        const dmg = turret.tier === 1 ? 40 : (turret.tier === 2 ? 64 : 102);
        for (let i = 0; i < candidates.length; i++) {
          const c = candidates[i];
          let effDmg = 0;
          for (let j = 0; j < candidates.length; j++) {
            const o = candidates[j], dx = o.x - c.x, dy = o.y - c.y;
            if (dx * dx + dy * dy <= sp2) effDmg += Math.min(o.hp, dmg);
          }
          const urg = c.remaining < 500 ? (500 - c.remaining) * 20 : 0;
          const score = effDmg * 15 + urg - c.remaining * 2;
          if (score > bestScore) { bestScore = score; best = c; }
        }
        return best.id;
      }
      let best = candidates[0], bestRem = candidates[0].remaining;
      for (let i = 1; i < candidates.length; i++) {
        if (candidates[i].remaining < bestRem) { bestRem = candidates[i].remaining; best = candidates[i]; }
      }
      return best.id;
    }
  };
}
</script>

<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks, recorder) {
  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return (t ^ (t >>> 14)) >>> 0;
    };
  }

  const GROUND_PTS = [
    [50, 250], [650, 250], [650, 1050], [1250, 1050],
    [1250, 350], [1850, 350], [1850, 1150], [2350, 1150]
  ];
  const AIR_PTS = [
    [50, 650], [2150, 650], [2150, 1150], [2350, 1150]
  ];

  function buildRoute(pts) {
    const segs = [];
    let total = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const x0 = pts[i][0], y0 = pts[i][1];
      const x1 = pts[i + 1][0], y1 = pts[i + 1][1];
      const dx = x1 - x0, dy = y1 - y0;
      const len = Math.abs(dx) + Math.abs(dy);
      segs.push({ x0, y0, dx: Math.sign(dx), dy: Math.sign(dy), start: total, len });
      total += len;
    }
    return { segs, total };
  }

  const GROUND_ROUTE = buildRoute(GROUND_PTS);
  const AIR_ROUTE = buildRoute(AIR_PTS);

  function posOnRoute(route, progress) {
    if (progress <= 0) return [route.segs[0].x0, route.segs[0].y0];
    for (let i = 0; i < route.segs.length; i++) {
      const s = route.segs[i];
      if (progress <= s.start + s.len) {
        const d = progress - s.start;
        return [s.x0 + s.dx * d, s.y0 + s.dy * d];
      }
    }
    const last = route.segs[route.segs.length - 1];
    return [last.x0 + last.dx * last.len, last.y0 + last.dy * last.len];
  }

  const SLOT_TILES = [
    [3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],
    [14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]
  ];
  const SLOTS = SLOT_TILES.map((t, i) => ({
    slot: i, x: t[0] * 100 + 50, y: t[1] * 100 + 50, turret: null
  }));

  const TURRET_TYPES = {
    bolt:   { idx: 0, cost: 50,  dmg: 26,  period: 8,  range: 300, splash: 0,  slow: 0,  pierce: false, ground: true,  air: true  },
    cannon: { idx: 1, cost: 90,  dmg: 60,  period: 24, range: 260, splash: 90, slow: 0,  pierce: false, ground: true,  air: false },
    frost:  { idx: 2, cost: 70,  dmg: 10,  period: 12, range: 240, splash: 0,  slow: 30, pierce: false, ground: true,  air: true  },
    lance:  { idx: 3, cost: 120, dmg: 180, period: 36, range: 360, splash: 0,  slow: 0,  pierce: true,  ground: true,  air: false },
    flak:   { idx: 4, cost: 80,  dmg: 40,  period: 10, range: 320, splash: 70, slow: 0,  pierce: false, ground: false, air: true  }
  };

  function turretDamage(def, tier) {
    let d = def.dmg;
    for (let t = 2; t <= tier; t++) d = Math.floor(d * 16 / 10);
    return d;
  }

  const ENEMY_ORDER = [
    { type: "grunt",    baseHp: 60,  speed: 10, bounty: 4, leak: 1, air: 0, firstWave: 1, weight: 10 },
    { type: "runner",   baseHp: 40,  speed: 20, bounty: 4, leak: 1, air: 0, firstWave: 2, weight: 4  },
    { type: "wisp",     baseHp: 50,  speed: 12, bounty: 6, leak: 2, air: 1, firstWave: 3, weight: 3  },
    { type: "brute",    baseHp: 150, speed: 6,  bounty: 9, leak: 3, air: 0, firstWave: 4, weight: 3  },
    { type: "splitter", baseHp: 90,  speed: 8,  bounty: 6, leak: 2, air: 0, firstWave: 6, weight: 2  },
    { type: "mender",   baseHp: 70,  speed: 8,  bounty: 7, leak: 2, air: 0, firstWave: 8, weight: 1  }
  ];
  const ENEMY_MAP = {};
  for (const e of ENEMY_ORDER) ENEMY_MAP[e.type] = e;

  const hpMultCache = [0, 1000];
  function getHpMult(w) {
    while (hpMultCache.length <= w) {
      const prev = hpMultCache[hpMultCache.length - 1];
      hpMultCache.push(Math.floor(prev * 108 / 100));
    }
    return hpMultCache[w];
  }

  function enemyArmor(type, w) {
    if (type === "grunt") return Math.floor(w / 4);
    if (type === "brute") return 6 + w;
    return 0;
  }

  const rng = mulberry32(seed);
  function genWave(w) {
    const count = 4 + Math.floor(3 * w / 5);
    const avail = [];
    let totalW = 0;
    for (const e of ENEMY_ORDER) {
      if (e.firstWave <= w) {
        avail.push(e);
        totalW += e.weight;
      }
    }
    const comp = [];
    for (let i = 0; i < count; i++) {
      let r = rng() % totalW;
      let chosen = avail[avail.length - 1].type;
      for (let j = 0; j < avail.length; j++) {
        if (r < avail[j].weight) {
          chosen = avail[j].type;
          break;
        }
        r -= avail[j].weight;
      }
      comp.push(chosen);
    }
    return comp;
  }

  const strategy = createStrategy();
  let gold = 250;
  let baseHp = 10;
  let nextEnemyId = 1;
  let currentWave = 0;
  let fallTick = -1;
  const log = [];
  let enemies = [];
  const spawnQueue = [];

  const waves = {};
  waves[1] = genWave(1);

  function makeEnemyView(e) {
    const route = e.air ? AIR_ROUTE : GROUND_ROUTE;
    return {
      id: e.id,
      type: e.type,
      hp: e.hp,
      maxHp: e.maxHp,
      x: e.x,
      y: e.y,
      air: e.air,
      armor: e.armor,
      speed: e.speed,
      slowed: e.slowed,
      remaining: route.total - e.progress
    };
  }

  function spawnEnemy(type, w, progress, customMaxHp) {
    let air = 0, speed = 12, armor = 0, bounty = 1, leak = 1, maxHp = customMaxHp;
    if (type !== "splitling") {
      const def = ENEMY_MAP[type];
      air = def.air;
      speed = def.speed;
      armor = enemyArmor(type, w);
      bounty = def.bounty;
      leak = def.leak;
      maxHp = Math.floor(def.baseHp * getHpMult(w) / 1000);
    }
    const route = air ? AIR_ROUTE : GROUND_ROUTE;
    const pos = posOnRoute(route, progress);
    const e = {
      id: nextEnemyId++,
      type,
      wave: w,
      hp: maxHp,
      maxHp,
      progress,
      x: pos[0],
      y: pos[1],
      air,
      armor,
      speed,
      bounty,
      leak,
      slowed: 0,
      age: 0
    };
    enemies.push(e);
    return e;
  }

  function fnv1aHex(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return (h >>> 0).toString(16).padStart(8, "0");
  }

  function finish() {
    const endTick = fallTick !== -1 ? fallTick : maxTicks;
    const score = Math.round(((endTick - 20) / 40) * 100) / 100;
    const hash = fnv1aHex(JSON.stringify(log));
    return { score, fallTick, log, hash };
  }

  for (let tick = 0; tick < maxTicks; tick++) {
    // 1. Wave start
    if (tick >= 20 && (tick - 20) % 40 === 0) {
      const w = 1 + (tick - 20) / 40;
      currentWave = w;
      gold += Math.min(50, Math.floor(gold * 5 / 100)) + 10 + 2 * w;
      waves[w + 1] = genWave(w + 1);
      if (recorder && recorder.onWave) recorder.onWave(tick, w, waves[w + 1]);

      const state = {
        tick,
        wave: w,
        gold,
        baseHp,
        slots: SLOTS.map(s => ({
          slot: s.slot,
          x: s.x,
          y: s.y,
          turret: s.turret ? { type: s.turret.type, tier: s.turret.tier, spent: s.turret.spent } : null
        })),
        enemies: enemies.map(makeEnemyView),
        nextWave: waves[w + 1].slice()
      };

      const actions = strategy.plan(state);
      if (Array.isArray(actions)) {
        const lim = Math.min(32, actions.length);
        for (let i = 0; i < lim; i++) {
          const act = actions[i];
          if (!act || typeof act !== "object") continue;
          const slotIdx = act.slot;
          if (!Number.isInteger(slotIdx) || slotIdx < 0 || slotIdx >= 16) continue;
          const sl = SLOTS[slotIdx];
          if (act.op === "build") {
            const def = TURRET_TYPES[act.type];
            if (!sl.turret && def && gold >= def.cost) {
              gold -= def.cost;
              sl.turret = {
                type: act.type,
                tier: 1,
                spent: def.cost,
                cooldown: 0,
                def,
                dmg: turretDamage(def, 1),
                range: def.range
              };
              log.push([tick, "B", slotIdx, def.idx]);
              if (recorder && recorder.onBuild) recorder.onBuild(tick, slotIdx, act.type, sl.x, sl.y);
            }
          } else if (act.op === "upgrade") {
            if (sl.turret && sl.turret.tier < 3) {
              const cost = sl.turret.tier === 1 ? sl.turret.def.cost : sl.turret.def.cost * 2;
              if (gold >= cost) {
                gold -= cost;
                sl.turret.tier += 1;
                sl.turret.spent += cost;
                sl.turret.dmg = turretDamage(sl.turret.def, sl.turret.tier);
                sl.turret.range = sl.turret.def.range + 30 * (sl.turret.tier - 1);
                log.push([tick, "U", slotIdx, sl.turret.tier]);
                if (recorder && recorder.onUpgrade) recorder.onUpgrade(tick, slotIdx, sl.turret.tier, sl.x, sl.y);
              }
            }
          } else if (act.op === "sell") {
            if (sl.turret) {
              gold += Math.floor(sl.turret.spent * 70 / 100);
              sl.turret = null;
              log.push([tick, "S", slotIdx, 0]);
              if (recorder && recorder.onSell) recorder.onSell(tick, slotIdx, sl.x, sl.y);
            }
          }
        }
      }

      const comp = waves[w];
      for (let i = 0; i < comp.length; i++) {
        spawnQueue.push({ tick: tick + 4 * i, wave: w, idx: i, type: comp[i] });
      }
      spawnQueue.sort((a, b) => (a.tick - b.tick) || (a.wave - b.wave) || (a.idx - b.idx));
    }

    // 2. Spawn
    while (spawnQueue.length > 0 && spawnQueue[0].tick === tick) {
      const item = spawnQueue.shift();
      spawnEnemy(item.type, item.wave, 0, 0);
    }

    // 3. Move
    for (let i = 0; i < enemies.length; ) {
      const e = enemies[i];
      const step = e.slowed > 0 ? Math.floor(e.speed * 60 / 100) : e.speed;
      e.progress += step;
      const route = e.air ? AIR_ROUTE : GROUND_ROUTE;
      if (e.progress >= route.total) {
        const prevHp = baseHp;
        baseHp -= e.leak;
        log.push([tick, "L", e.id, baseHp]);
        if (recorder && recorder.onLeak) recorder.onLeak(tick, e.id, e.leak, prevHp, baseHp);
        enemies.splice(i, 1);
        if (baseHp <= 0) {
          log.push([tick, "F", currentWave, 0]);
          fallTick = tick;
          if (recorder && recorder.onTick) recorder.onTick(tick, currentWave, gold, baseHp, SLOTS, enemies, waves[currentWave + 1] || waves[1]);
          if (recorder && recorder.onFall) recorder.onFall(tick, currentWave);
          return finish();
        }
      } else {
        const pos = posOnRoute(route, e.progress);
        e.x = pos[0];
        e.y = pos[1];
        i++;
      }
    }

    // 4. Age & heal
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      e.age += 1;
      if (e.type === "mender" && e.age % 20 === 0) {
        const mx = e.x, my = e.y;
        if (recorder && recorder.onHeal) recorder.onHeal(tick, mx, my);
        for (let j = 0; j < enemies.length; j++) {
          const o = enemies[j];
          const dx = o.x - mx, dy = o.y - my;
          if (dx * dx + dy * dy <= 150 * 150) {
            const heal = Math.floor(o.maxHp * 8 / 100);
            o.hp = Math.min(o.maxHp, o.hp + heal);
          }
        }
      }
    }

    // 5. Turrets fire
    for (let sIdx = 0; sIdx < 16; sIdx++) {
      const sl = SLOTS[sIdx];
      const t = sl.turret;
      if (!t) continue;
      if (t.cooldown > 0) {
        t.cooldown -= 1;
        if (t.cooldown > 0) continue;
      }
      const r2 = t.range * t.range;
      const def = t.def;
      const cands = [];
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (e.air ? !def.air : !def.ground) continue;
        const dx = e.x - sl.x, dy = e.y - sl.y;
        if (dx * dx + dy * dy <= r2) {
          cands.push(e);
        }
      }
      if (cands.length === 0) continue;

      let chosen = null;
      if (typeof strategy.target === "function") {
        const tView = { slot: sIdx, type: t.type, tier: t.tier, x: sl.x, y: sl.y, range: t.range };
        const cViews = cands.map(makeEnemyView);
        const pickedId = strategy.target(tView, cViews);
        for (let i = 0; i < cands.length; i++) {
          if (cands[i].id === pickedId) {
            chosen = cands[i];
            break;
          }
        }
      }
      if (!chosen) {
        chosen = cands[0];
        let bestRem = (chosen.air ? AIR_ROUTE.total : GROUND_ROUTE.total) - chosen.progress;
        for (let i = 1; i < cands.length; i++) {
          const c = cands[i];
          const rem = (c.air ? AIR_ROUTE.total : GROUND_ROUTE.total) - c.progress;
          if (rem < bestRem) {
            bestRem = rem;
            chosen = c;
          }
        }
      }

      if (recorder && recorder.onShot) {
        recorder.onShot(tick, sIdx, t.type, t.tier, sl.x, sl.y, chosen.x, chosen.y, chosen.air);
      }

      if (def.splash > 0) {
        const sp2 = def.splash * def.splash;
        const tx = chosen.x, ty = chosen.y;
        for (let i = 0; i < enemies.length; i++) {
          const e = enemies[i];
          if (e.air ? !def.air : !def.ground) continue;
          const dx = e.x - tx, dy = e.y - ty;
          if (dx * dx + dy * dy <= sp2) {
            const dmg = def.pierce ? t.dmg : Math.max(1, t.dmg - e.armor);
            e.hp -= dmg;
            if (def.slow > 0) e.slowed = def.slow;
          }
        }
      } else {
        const dmg = def.pierce ? t.dmg : Math.max(1, t.dmg - chosen.armor);
        chosen.hp -= dmg;
        if (def.slow > 0) chosen.slowed = def.slow;
      }

      t.cooldown = def.period;

      const newlySpawned = [];
      for (let i = 0; i < enemies.length; ) {
        const e = enemies[i];
        if (e.hp <= 0) {
          gold += e.bounty;
          log.push([tick, "K", e.id, sIdx]);
          if (recorder && recorder.onKill) recorder.onKill(tick, e.id, e.type, e.x, e.y, e.air);
          if (e.type === "splitter") {
            const sHp = Math.max(1, Math.floor(e.maxHp / 4));
            newlySpawned.push({ w: e.wave, progress: e.progress, hp: sHp });
          }
          enemies.splice(i, 1);
        } else {
          i++;
        }
      }
      for (let i = 0; i < newlySpawned.length; i++) {
        const sp = newlySpawned[i];
        for (let k = 0; k < 3; k++) {
          spawnEnemy("splitling", sp.w, sp.progress, sp.hp);
        }
      }
    }

    // 6. Slow timers
    for (let i = 0; i < enemies.length; i++) {
      if (enemies[i].slowed > 0) enemies[i].slowed -= 1;
    }

    if (recorder && recorder.onTick) {
      recorder.onTick(tick, currentWave, gold, baseHp, SLOTS, enemies, waves[currentWave + 1] || waves[1]);
    }
  }

  return finish();
}
</script>

<script>
(function () {
  "use strict";

  const DURATION = 100;
  const TICKS_PER_SEC = 20;
  const MAX_TICKS = 2020;

  // Deterministic PRNG for purely visual randomness (seed 42)
  function makeRng(seed) {
    let a = seed | 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const visRng = makeRng(42);
  const audioRng = makeRng(4242);

  // =========================================================================
  // 1. PRECOMPUTE REPLAY (Seed 42, ticks 0..2019) via rampartSimulate
  // =========================================================================
  const SLOT_TILES = [
    [3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],
    [14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]
  ];
  const GROUND_WAYPOINTS = [
    [0.5, 2.5], [6.5, 2.5], [6.5, 10.5], [12.5, 10.5],
    [12.5, 3.5], [18.5, 3.5], [18.5, 11.5], [23.5, 11.5]
  ];
  const AIR_WAYPOINTS = [
    [0.5, 6.5], [21.5, 6.5], [21.5, 11.5], [23.5, 11.5]
  ];

  const ENEMY_TYPES = ["grunt", "runner", "wisp", "brute", "splitter", "mender", "splitling"];
  const ENEMY_IDX = { grunt: 0, runner: 1, wisp: 2, brute: 3, splitter: 4, mender: 5, splitling: 6 };
  const TURRET_IDX = { bolt: 0, cannon: 1, frost: 2, lance: 3, flak: 4 };

  const replay = {
    ticks: new Array(MAX_TICKS),
    shots: [],      // { t, slot, typeIdx, tier, x0, z0, x1, z1, air }
    kills: [],      // { t, typeIdx, x, z, air, seed }
    heals: [],      // { t, x, z }
    builds: [],     // { t, op, slot, x, z, tier }  op: 0=build, 1=upgrade, 2=sell
    leaks: [],      // { t, dmg, prevHp, newHp }
    waves: [],      // { t, wave }
    fallTick: -1,
    fallTime: 9999,
    lastTick: 0
  };

  let killSeedCounter = 1;
  const lastTurretAim = new Float32Array(16);

  const recorder = {
    onWave(tick, w) {
      replay.waves.push({ t: tick / TICKS_PER_SEC, tick, wave: w });
    },
    onBuild(tick, slot, type, x, y) {
      replay.builds.push({ t: tick / TICKS_PER_SEC, tick, op: 0, slot, x: x / 100, z: y / 100, tier: 1 });
    },
    onUpgrade(tick, slot, tier, x, y) {
      replay.builds.push({ t: tick / TICKS_PER_SEC, tick, op: 1, slot, x: x / 100, z: y / 100, tier });
    },
    onSell(tick, slot, x, y) {
      replay.builds.push({ t: tick / TICKS_PER_SEC, tick, op: 2, slot, x: x / 100, z: y / 100, tier: 0 });
    },
    onShot(tick, slot, type, tier, x0, y0, x1, y1, air) {
      const wx0 = x0 / 100, wz0 = y0 / 100, wx1 = x1 / 100, wz1 = y1 / 100;
      lastTurretAim[slot] = Math.atan2(wx1 - wx0, wz1 - wz0);
      replay.shots.push({
        t: tick / TICKS_PER_SEC, tick, slot,
        typeIdx: TURRET_IDX[type], tier,
        x0: wx0, z0: wz0, x1: wx1, z1: wz1, air: air ? 1 : 0
      });
    },
    onKill(tick, id, type, x, y, air) {
      replay.kills.push({
        t: tick / TICKS_PER_SEC, tick,
        typeIdx: ENEMY_IDX[type],
        x: x / 100, z: y / 100, air: air ? 1 : 0,
        seed: killSeedCounter++
      });
    },
    onHeal(tick, x, y) {
      replay.heals.push({ t: tick / TICKS_PER_SEC, tick, x: x / 100, z: y / 100 });
    },
    onLeak(tick, id, dmg, prevHp, newHp) {
      replay.leaks.push({ t: tick / TICKS_PER_SEC, tick, dmg, prevHp, newHp });
    },
    onFall(tick) {
      replay.fallTick = tick;
      replay.fallTime = tick / TICKS_PER_SEC;
    },
    onTick(tick, wave, gold, baseHp, slots, enemies, nextWave) {
      // Compact enemy map for O(1) interpolation between tick k and k+1
      const eMap = new Map();
      const eArr = new Array(enemies.length);
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        const obj = {
          id: e.id,
          typeIdx: ENEMY_IDX[e.type],
          x: e.x / 100,
          z: e.y / 100,
          hp: e.hp,
          maxHp: e.maxHp,
          air: e.air,
          slowed: e.slowed > 0 ? 1 : 0,
          progress: e.progress
        };
        eArr[i] = obj;
        eMap.set(e.id, obj);
      }
      const tArr = new Array(16);
      for (let i = 0; i < 16; i++) {
        const t = slots[i].turret;
        tArr[i] = t ? { typeIdx: TURRET_IDX[t.type], tier: t.tier, aim: lastTurretAim[i] } : null;
      }
      // Count nextWave composition by enemy type
      const nwCounts = [0, 0, 0, 0, 0, 0];
      if (nextWave) {
        for (let i = 0; i < nextWave.length; i++) {
          const idx = ENEMY_IDX[nextWave[i]];
          if (idx < 6) nwCounts[idx]++;
        }
      }
      replay.ticks[tick] = {
        tick, wave, gold, baseHp: Math.max(0, baseHp),
        turrets: tArr,
        enemies: eArr,
        enemyMap: eMap,
        nextWaveCounts: nwCounts
      };
      replay.lastTick = tick;
    }
  };

  const simResult = rampartSimulate(createStrategy, 42, MAX_TICKS, recorder);
  // Fill remaining ticks after fallTick with frozen final state
  if (replay.fallTick !== -1) {
    const frozen = replay.ticks[replay.fallTick];
    for (let t = replay.fallTick + 1; t < MAX_TICKS; t++) {
      replay.ticks[t] = frozen;
    }
  }

  // Compute enemy facing angle along polyline
  function routeHeading(air, progress) {
    if (air) {
      if (progress < 2100) return Math.PI * 0.5;   // +X
      if (progress < 2600) return 0;               // +Z
      return Math.PI * 0.5;                        // +X
    }
    if (progress < 600) return Math.PI * 0.5;      // +X
    if (progress < 1400) return 0;                 // +Z
    if (progress < 2000) return Math.PI * 0.5;     // +X
    if (progress < 2700) return Math.PI;           // -Z
    if (progress < 3300) return Math.PI * 0.5;     // +X
    if (progress < 4100) return 0;                 // +Z
    return Math.PI * 0.5;                          // +X
  }

  // Closed-form trauma at simTime
  function getTrauma(simTime) {
    let trauma = 0;
    let lastT = 0;
    for (let i = 0; i < replay.leaks.length; i++) {
      const lt = replay.leaks[i].t;
      if (lt > simTime) break;
      trauma = Math.max(0, trauma - (lt - lastT));
      trauma = Math.min(1, trauma + 0.3);
      lastT = lt;
    }
    if (replay.fallTick !== -1 && replay.fallTime <= simTime) {
      trauma = Math.max(0, trauma - (replay.fallTime - lastT));
      trauma = 1.0;
      lastT = replay.fallTime;
    }
    return Math.max(0, trauma - (simTime - lastT));
  }

  // Smooth deterministic noise of simTime
  function shakeNoise(t, phase) {
    return (
      Math.sin(t * 29.3 + phase) * 0.5 +
      Math.sin(t * 53.7 + phase * 1.7) * 0.3 +
      Math.cos(t * 89.1 + phase * 2.3) * 0.2
    );
  }

  // =========================================================================
  // 2. THREE.JS RENDERER, SCENE, POST-DESATURATION & CAMERA FRAMING
  // =========================================================================
  const canvas = document.getElementById("stage");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.12;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.autoClear = false;

  const scene = new THREE.Scene();

  // Render target for closed-form post-fall desaturation
  let rtWidth = 1, rtHeight = 1;
  const renderTarget = new THREE.WebGLRenderTarget(1, 1, {
    minFilter: THREE.LinearFilter,
    magFilter: THREE.LinearFilter,
    format: THREE.RGBAFormat
  });

  const postScene = new THREE.Scene();
  const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const postMat = new THREE.ShaderMaterial({
    transparent: true,
    depthTest: false,
    depthWrite: false,
    uniforms: {
      tDiffuse: { value: renderTarget.texture },
      uDesat: { value: 0.0 }
    },
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position.xy, 0.0, 1.0);
      }
    `,
    fragmentShader: `
      uniform sampler2D tDiffuse;
      uniform float uDesat;
      varying vec2 vUv;
      void main() {
        vec4 c = texture2D(tDiffuse, vUv);
        float lum = dot(c.rgb, vec3(0.299, 0.587, 0.114));
        vec3 gray = vec3(lum * 0.92);
        vec3 col = mix(c.rgb, gray, uDesat * 0.88);
        gl_FragColor = vec4(col, c.a);
      }
    `
  });
  const postQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat);
  postScene.add(postQuad);

  // Camera
  const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 500);
  const camBasePos = new THREE.Vector3();
  const camBaseTarget = new THREE.Vector3();
  const ELEV_RAD = 55 * Math.PI / 180;
  const COS_E = Math.cos(ELEV_RAD);
  const SIN_E = Math.sin(ELEV_RAD);

  function updateCameraAndSize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    renderer.setPixelRatio(dpr);
    renderer.setSize(w, h, false);
    rtWidth = Math.max(1, Math.floor(w * dpr));
    rtHeight = Math.max(1, Math.floor(h * dpr));
    renderTarget.setSize(rtWidth, rtHeight);

    camera.aspect = w / h;
    camera.updateProjectionMatrix();

    // Exact bounding-box framing for 24x14 board with >= 0.7 tile margin & bottom 96px dock clearance
    const pad = 0.75;
    const corners = [
      new THREE.Vector3(-pad, 0, -pad),
      new THREE.Vector3(24 + pad, 0, -pad),
      new THREE.Vector3(-pad, 0, 14 + pad),
      new THREE.Vector3(24 + pad, 0, 14 + pad),
      new THREE.Vector3(23.5, 2.2, 11.5) // keep top
    ];
    const dockNdcBottom = -1 + (2 * 98) / Math.max(200, h);
    const topNdcLimit = 0.94;
    const sideNdcLimit = 0.96;

    // Solve lookZ and dist by binary search so board fits snugly in [dockNdcBottom, topNdcLimit]
    let lo = 14, hi = 65;
    let bestDist = 30, bestLookZ = 7.6;
    for (let iter = 0; iter < 22; iter++) {
      const mid = (lo + hi) * 0.5;
      // Compute vertical shift in Z so board center maps to midpoint of [dockNdcBottom, topNdcLimit]
      const targetMidNdc = (dockNdcBottom + topNdcLimit) * 0.5;
      const halfHWorld = mid * Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5));
      // Moving lookZ +delta moves board UP in screen (positive NDC)
      const lookZ = 7.0 + (targetMidNdc * halfHWorld) / SIN_E;
      camera.position.set(12, mid * SIN_E, lookZ + mid * COS_E);
      camera.lookAt(12, 0, lookZ);
      camera.updateMatrixWorld();

      let fits = true;
      for (let i = 0; i < corners.length; i++) {
        const p = corners[i].clone().project(camera);
        if (Math.abs(p.x) > sideNdcLimit || p.y < dockNdcBottom || p.y > topNdcLimit) {
          fits = false;
          break;
        }
      }
      if (fits) {
        bestDist = mid;
        bestLookZ = lookZ;
        hi = mid;
      } else {
        lo = mid;
      }
    }
    camBasePos.set(12, bestDist * SIN_E, bestLookZ + bestDist * COS_E);
    camBaseTarget.set(12, 0, bestLookZ);
    camera.position.copy(camBasePos);
    camera.lookAt(camBaseTarget);
    camera.updateMatrixWorld();

    if (typeof resizeHud === "function") resizeHud(w, h);
  }

  // Dusk lighting with warm key light and shadows
  const hemiLight = new THREE.HemisphereLight(0x6d7fa8, 0x1d1c24, 0.72);
  scene.add(hemiLight);

  const keyLight = new THREE.DirectionalLight(0xffb878, 1.45);
  keyLight.position.set(18, 26, 19);

  keyLight.shadow.mapSize.height = 2048;
  keyLight.shadow.camera.near = 5;
  keyLight.shadow.camera.far = 65;
  keyLight.shadow.camera.left = -16;
  keyLight.shadow.camera.right = 16;
  keyLight.shadow.camera.top = 12;
  keyLight.shadow.camera.bottom = -12;
  keyLight.shadow.bias = -0.0005;
  keyLight.target.position.set(12, 0, 7);
  scene.add(keyLight);
  scene.add(keyLight.target);

  const rimLight = new THREE.DirectionalLight(0x5588dd, 0.48);
  rimLight.position.set(-8, 14, -6);
  scene.add(rimLight);

  // =========================================================================
  // 3. PROCEDURAL TEXTURES & FORTIFIED WORLD
  // =========================================================================
  function makeTerrainTexture() {
    const c = document.createElement("canvas");
    c.width = 512; c.height = 512;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#222826";
    ctx.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 4200; i++) {
      const x = visRng() * 512, y = visRng() * 512;
      const r = 1 + visRng() * 4;
      const v = Math.floor(28 + visRng() * 24);
      const g = Math.floor(v + 4 + visRng() * 10);
      ctx.fillStyle = `rgb(${v},${g},${v})`;
      ctx.fillRect(x, y, r, r);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(6, 4);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  function makeRoadTexture() {
    const c = document.createElement("canvas");
    c.width = 256; c.height = 256;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#1d2028";
    ctx.fillRect(0, 0, 256, 256);
    for (let row = 0; row < 16; row++) {
      const off = (row % 2) * 16;
      for (let col = -1; col < 9; col++) {
        const shade = Math.floor(42 + visRng() * 22);
        ctx.fillStyle = `rgb(${shade},${shade + 2},${shade + 7})`;
        ctx.fillRect(col * 32 + off + 2, row * 16 + 2, 28, 12);
      }
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;

  // Seeded terrain rocks (avoiding road, pads, keep)
  function isClearTerrain(x, z) {
    if (x < 0.6 || x > 23.4 || z < 0.6 || z > 13.4) return false;
    if (Math.hypot(x - 23.5, z - 11.5) < 1.8) return false;
    for (let i = 0; i < 16; i++) {
      if (Math.hypot(x - (SLOT_TILES[i][0] + 0.5), z - (SLOT_TILES[i][1] + 0.5)) < 1.05) return false;
    }
    for (let i = 0; i < GROUND_WAYPOINTS.length - 1; i++) {
      const a = GROUND_WAYPOINTS[i], b = GROUND_WAYPOINTS[i + 1];
      const minX = Math.min(a[0], b[0]) - 0.9, maxX = Math.max(a[0], b[0]) + 0.9;
      const minZ = Math.min(a[1], b[1]) - 0.9, maxZ = Math.max(a[1], b[1]) + 0.9;
      if (x >= minX && x <= maxX && z >= minZ && z <= maxZ) return false;
    }
    return true;
  }
  const rockGeo = new THREE.DodecahedronGeometry(0.22, 0);
  const rockMat = new THREE.MeshStandardMaterial({ color: 0x393f48, roughness: 0.9, metalness: 0.05 });
  const rockPositions = [];

    const rx = 0.8 + visRng() * 22.4, rz = 0.8 + visRng() * 12.4;
    if (isClearTerrain(rx, rz)) {
      rockPositions.push({ x: rx, z: rz, s: 0.55 + visRng() * 1.1, ry: visRng() * Math.PI * 2 });
    }
  }
  const rockInst = new THREE.InstancedMesh(rockGeo, rockMat, Math.max(1, rockPositions.length));
  rockInst.castShadow = true; rockInst.receiveShadow = true;
  const dummy = new THREE.Object3D();
  for (let i = 0; i < rockPositions.length; i++) {
    const rp = rockPositions[i];
    dummy.position.set(rp.x, 0.08 * rp.s, rp.z);
    dummy.rotation.set(0.3, rp.ry, 0.2);
    dummy.scale.set(rp.s * 1.2, rp.s * 0.7, rp.s);
    dummy.updateMatrix();
    rockInst.setMatrixAt(i, dummy.matrix);

  // =========================================================================

    const mesh = new THREE.Mesh(geo, i % 2 === 0 ? keepStoneMat : keepTrimMat);
    if (i === 6 || i === 7) mesh.rotation.y = Math.PI * 0.5;
    mesh.castShadow = true; mesh.receiveShadow = true;

    keepChunks.push({

    const lk = replay.leaks[i];

    for (let hpIdx = toHp; hpIdx < fromHp; hpIdx++) {

  const MAX_TOTAL_ENEMIES = 260;

  const ENEMY_BASE_COLORS = [
    new THREE.Color(0x7c9473), // 0 grunt
