  scene.add(debrisInst);

  // =========================================================================
  // 8. WORLD-ANCHORED HUD (Orthographic Pass Inside #stage — ZERO DOM TEXT)
  // =========================================================================
  const hudScene = new THREE.Scene();
  const hudCam = new THREE.OrthographicCamera(0, 1, 1, 0, -10, 10);

  // Detached in-memory glyph atlas for digits 0..9
  function makeDigitAtlas() {
    const c = document.createElement("canvas");
    c.width = 640; c.height = 96;
    const ctx = c.getContext("2d");
    ctx.clearRect(0, 0, 640, 96);
    ctx.font = "700 72px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (let d = 0; d < 10; d++) {
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.fillText(String(d), d * 64 + 34, 52);
      ctx.fillStyle = "#ffffff";
      ctx.fillText(String(d), d * 64 + 32, 49);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    return tex;
  }

  function makeHudIconTexture(kind) {
    const c = document.createElement("canvas");
    c.width = 64; c.height = 64;
    const ctx = c.getContext("2d");
    ctx.clearRect(0, 0, 64, 64);
    if (kind === "wave") {
      // Crossed blades glyph
      ctx.strokeStyle = "#f3f6ff";
      ctx.lineWidth = 6;
      ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(14, 50); ctx.lineTo(50, 14); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(50, 50); ctx.lineTo(14, 14); ctx.stroke();
      ctx.strokeStyle = "#ffd666";
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(14, 38); ctx.lineTo(26, 50); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(50, 38); ctx.lineTo(38, 50); ctx.stroke();
    } else if (kind === "coin") {
      ctx.fillStyle = "#f5b82e";
      ctx.beginPath(); ctx.arc(32, 32, 22, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#fff1a8";
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(32, 32, 15, 0, Math.PI * 2); ctx.stroke();
    } else if (kind === "pip") {
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.moveTo(32, 8); ctx.lineTo(54, 24); ctx.lineTo(46, 56); ctx.lineTo(18, 56); ctx.lineTo(10, 24);
      ctx.closePath(); ctx.fill();
    } else {
      // Enemy icon silhouettes (0..5)
      const cols = ["#7c9473", "#ffd629", "#2ef2ff", "#ff7a1a", "#9b4dff", "#f4f8ff"];
      ctx.fillStyle = cols[kind];
      if (kind === 0) {
        ctx.fillRect(16, 16, 32, 32);
      } else if (kind === 1) {
        ctx.beginPath(); ctx.moveTo(54, 32); ctx.lineTo(14, 14); ctx.lineTo(22, 32); ctx.lineTo(14, 50); ctx.closePath(); ctx.fill();
      } else if (kind === 2) {
        ctx.beginPath(); ctx.moveTo(32, 10); ctx.lineTo(54, 32); ctx.lineTo(32, 54); ctx.lineTo(10, 32); ctx.closePath(); ctx.fill();
      } else if (kind === 3) {
        ctx.fillStyle = "#3a404c"; ctx.fillRect(10, 14, 44, 36);
        ctx.fillStyle = "#ff7a1a"; ctx.fillRect(8, 12, 48, 12);
      } else if (kind === 4) {
        ctx.beginPath(); ctx.arc(24, 26, 14, 0, Math.PI * 2); ctx.arc(40, 26, 14, 0, Math.PI * 2); ctx.arc(32, 40, 14, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.strokeStyle = "#3dff88"; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.arc(32, 32, 22, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = "#f4f8ff";
        ctx.beginPath(); ctx.arc(32, 32, 13, 0, Math.PI * 2); ctx.fill();
      }
    }
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  const digitAtlasTex = makeDigitAtlas();
  const digitGeos = [];
  for (let d = 0; d < 10; d++) {
    const g = new THREE.PlaneGeometry(1, 1);
    const uv = g.attributes.uv;
    const u0 = d / 10, u1 = (d + 1) / 10;
    uv.setXY(0, u0, 1); uv.setXY(1, u1, 1);
    uv.setXY(2, u0, 0); uv.setXY(3, u1, 0);
    digitGeos.push(g);
  }

  function makeDigitPool(maxDigits, colorHex) {
    const mat = new THREE.MeshBasicMaterial({ map: digitAtlasTex, color: colorHex, transparent: true, depthTest: false });
    const meshes = [];
    for (let i = 0; i < maxDigits; i++) {
      const m = new THREE.Mesh(digitGeos[0], mat);
      m.visible = false;
      hudScene.add(m);
      meshes.push(m);
    }
    return meshes;
  }

  const hudWaveIcon = new THREE.Mesh(
    new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({ map: makeHudIconTexture("wave"), transparent: true, depthTest: false })
  );
  hudScene.add(hudWaveIcon);
  const hudWaveDigits = makeDigitPool(4, 0xffffff);

  const hudCoinIcon = new THREE.Mesh(
    new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({ map: makeHudIconTexture("coin"), transparent: true, depthTest: false })
  );
  hudScene.add(hudCoinIcon);
  const hudGoldDigits = makeDigitPool(6, 0xffdf70);

  const hudNextIcons = [];
  const hudNextDigits = [];
  for (let i = 0; i < 6; i++) {
    const ic = new THREE.Mesh(
      new THREE.PlaneGeometry(1, 1),
      new THREE.MeshBasicMaterial({ map: makeHudIconTexture(i), transparent: true, depthTest: false })
    );
    ic.visible = false;
    hudScene.add(ic);
    hudNextIcons.push(ic);
    hudNextDigits.push(makeDigitPool(2, 0xe8edf5));
  }

  const pipTex = makeHudIconTexture("pip");
  const hudHpPips = [];
  for (let i = 0; i < 10; i++) {
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(1, 1),
      new THREE.MeshBasicMaterial({ map: pipTex, color: 0xff4455, transparent: true, depthTest: false })
    );
    hudScene.add(m);
    hudHpPips.push(m);
  }

  let hudW = 1280, hudH = 650;
  function resizeHud(w, h) {
    hudW = w; hudH = h;
    hudCam.left = 0; hudCam.right = w;
    hudCam.top = h; hudCam.bottom = 0;
    hudCam.updateProjectionMatrix();
  }

  function layoutDigits(pool, numStr, x, y, hSize) {
    const wSize = hSize * 0.62;
    for (let i = 0; i < pool.length; i++) {
      if (i < numStr.length) {
        const d = numStr.charCodeAt(i) - 48;
        const m = pool[i];
        m.geometry = digitGeos[d >= 0 && d <= 9 ? d : 0];
        m.scale.set(hSize * 0.68, hSize, 1);
        m.position.set(x + i * wSize + wSize * 0.5, y, 0);
        m.visible = true;
      } else {
        pool[i].visible = false;
      }
    }
    return numStr.length * wSize;
  }

  function updateHud(tickState, simTime) {
    const margin = Math.max(16, Math.round(hudH * 0.025));
    // Wave number: >= 7% of viewport height
    const waveH = Math.max(46, Math.round(hudH * 0.078));
    const topY = hudH - margin - waveH * 0.5;

    hudWaveIcon.scale.set(waveH * 0.78, waveH * 0.78, 1);
    hudWaveIcon.position.set(margin + waveH * 0.39, topY, 0);
    layoutDigits(hudWaveDigits, String(tickState.wave), margin + waveH * 0.88, topY, waveH);

    // Gold under wave number
    const goldH = Math.max(24, Math.round(hudH * 0.04));
    const goldY = topY - waveH * 0.5 - goldH * 0.68;
    hudCoinIcon.scale.set(goldH * 0.82, goldH * 0.82, 1);
    hudCoinIcon.position.set(margin + goldH * 0.45, goldY, 0);
    layoutDigits(hudGoldDigits, String(tickState.gold), margin + goldH * 1.0, goldY, goldH);

    // Next-wave preview under gold
    const nwH = Math.max(18, Math.round(hudH * 0.03));
    const nwY = goldY - goldH * 0.5 - nwH * 0.9;
    let curX = margin + nwH * 0.5;
    const nw = tickState.nextWaveCounts;
    for (let i = 0; i < 6; i++) {
      if (nw[i] > 0) {
        hudNextIcons[i].scale.set(nwH * 0.95, nwH * 0.95, 1);
        hudNextIcons[i].position.set(curX, nwY, 0);
        hudNextIcons[i].visible = true;
        const usedW = layoutDigits(hudNextDigits[i], String(nw[i]), curX + nwH * 0.52, nwY, nwH * 0.95);
        curX += nwH * 0.65 + usedW + nwH * 0.48;
      } else {
        hudNextIcons[i].visible = false;
        layoutDigits(hudNextDigits[i], "", 0, 0, nwH);
      }
    }

    // 10 Base HP pips in top-right corner
    const pipS = Math.max(18, Math.round(hudH * 0.032));
    const pipGap = Math.round(pipS * 0.28);
    const totalPipW = 10 * pipS + 9 * pipGap;
    const pipStartX = hudW - margin - totalPipW + pipS * 0.5;
    const pipY = hudH - margin - pipS * 0.65;
    for (let i = 0; i < 10; i++) {
      const m = hudHpPips[i];
      m.scale.set(pipS, pipS, 1);
      m.position.set(pipStartX + i * (pipS + pipGap), pipY, 0);
      if (i < tickState.baseHp) {
        m.material.color.setHex(0xef4455);
        m.material.opacity = 0.96;
      } else {
        // Flash briefly right after this pip was extinguished
        const dt = simTime - chunkLossTime[i];
        if (dt >= 0 && dt < 0.42) {
          const fl = 1 - dt / 0.42;
          m.material.color.setRGB(1, 0.3 + fl * 0.7, 0.3 + fl * 0.7);
          m.material.opacity = 0.25 + fl * 0.75;
          m.scale.set(pipS * (1 + fl * 0.35), pipS * (1 + fl * 0.35), 1);
        } else {
          m.material.color.setHex(0x3a404f);
          m.material.opacity = 0.32;
        }
      }
    }
  }

  // =========================================================================
  // 9. WEB AUDIO SYNTHESIZED SFX (No Music, No Files, Seed 4242)
  // =========================================================================
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;
  let masterGain = null;
  let compressor = null;
  let noiseBuffer = null;
  const activeNodes = new Set();
  let windNode = null;
  let windGain = null;

  function initAudio() {
    if (!AudioCtx) return;
    try {
      audioCtx = new AudioCtx();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.0;
      compressor = audioCtx.createDynamicsCompressor();
      compressor.threshold.value = -14;
      compressor.knee.value = 18;
      compressor.ratio.value = 6;
      compressor.attack.value = 0.004;
      compressor.release.value = 0.12;
      masterGain.connect(compressor);
      compressor.connect(audioCtx.destination);

      // Seeded noise buffer (2 seconds)
      const sr = audioCtx.sampleRate;
      noiseBuffer = audioCtx.createBuffer(1, sr * 2, sr);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = audioRng() * 2 - 1;

      audioCtx.resume().catch(() => {});
    } catch (e) {
      audioCtx = null;
    }
  }
  initAudio();

  function unlockAudio() {
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume().catch(() => {});
    }
  }
  window.addEventListener("pointerdown", unlockAudio, { passive: true });
  window.addEventListener("keydown", unlockAudio, { passive: true });

  function makePanner(boardX) {
    const pan = Math.max(-0.85, Math.min(0.85, (boardX / 24) * 1.7 - 0.85));
    if (typeof audioCtx.createStereoPanner === "function") {
      const p = audioCtx.createStereoPanner();
      p.pan.value = pan;
      p.connect(masterGain);
      return p;
    }
    return masterGain;
  }

  function trackNode(node, stopTime) {
    activeNodes.add(node);
    node.onended = () => activeNodes.delete(node);
    node.stop(stopTime);
  }

  function silenceAudioImmediate() {
    if (!audioCtx || !masterGain) return;
    const now = audioCtx.currentTime;
    masterGain.gain.cancelScheduledValues(now);
    masterGain.gain.setValueAtTime(masterGain.gain.value, now);
    masterGain.gain.linearRampToValueAtTime(0.0, now + 0.04);
    activeNodes.forEach(n => {
      try { n.stop(now + 0.045); } catch (e) {}
    });
    activeNodes.clear();
    stopWind();
  }

  function enableAudio() {
    if (!audioCtx || !masterGain) return;
    unlockAudio();
    const now = audioCtx.currentTime;
    masterGain.gain.cancelScheduledValues(now);
    masterGain.gain.setValueAtTime(masterGain.gain.value, now);
    masterGain.gain.linearRampToValueAtTime(0.42, now + 0.03);
  }

  function startWind() {
    if (!audioCtx || !noiseBuffer || windNode) return;
    const now = audioCtx.currentTime;
    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuffer;
    src.loop = true;
    const filter = audioCtx.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.value = 210;
    filter.Q.value = 2.4;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.001, now);
    g.gain.linearRampToValueAtTime(0.14, now + 0.8);
    src.connect(filter);
    filter.connect(g);
    g.connect(masterGain);
    src.start(now);
    windNode = src;
    windGain = g;
  }

  function stopWind() {
    if (windNode) {
      try { windNode.stop(); } catch (e) {}
      windNode = null;
      windGain = null;
    }
  }

  function playShotSfx(typeIdx, boardX) {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const out = makePanner(boardX);
    const v = 0.94 + audioRng() * 0.12;

    if (typeIdx === 0) {
      // bolt: crisp metallic zip
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(1100 * v, now);
      osc.frequency.exponentialRampToValueAtTime(340 * v, now + 0.055);
      g.gain.setValueAtTime(0.09, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc.connect(g); g.connect(out);
      osc.start(now); trackNode(osc, now + 0.065);
    } else if (typeIdx === 1) {
      // cannon: low thump + filtered noise boom
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(145 * v, now);
      osc.frequency.exponentialRampToValueAtTime(42, now + 0.14);
      g.gain.setValueAtTime(0.22, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      osc.connect(g); g.connect(out);
      osc.start(now); trackNode(osc, now + 0.16);

      if (noiseBuffer) {
        const ns = audioCtx.createBufferSource();
        ns.buffer = noiseBuffer;
        const flt = audioCtx.createBiquadFilter();
        flt.type = "lowpass"; flt.frequency.value = 480;
        const ng = audioCtx.createGain();
        ng.gain.setValueAtTime(0.14, now);
        ng.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        ns.connect(flt); flt.connect(ng); ng.connect(out);
        ns.start(now, audioRng()); trackNode(ns, now + 0.13);
      }
    } else if (typeIdx === 2) {
      // frost: icy crystalline chime
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(1650 * v, now);
      osc.frequency.exponentialRampToValueAtTime(1180 * v, now + 0.09);
      g.gain.setValueAtTime(0.08, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.095);
      osc.connect(g); g.connect(out);
      osc.start(now); trackNode(osc, now + 0.1);
    } else if (typeIdx === 3) {
      // lance: powerful crimson laser zap
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(620 * v, now);
      osc.frequency.exponentialRampToValueAtTime(110, now + 0.16);
      const flt = audioCtx.createBiquadFilter();
      flt.type = "bandpass"; flt.frequency.value = 900;
      g.gain.setValueAtTime(0.22, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.17);
      osc.connect(flt); flt.connect(g); g.connect(out);
      osc.start(now); trackNode(osc, now + 0.18);
    } else {
      // flak: sharp mid-high pop burst
      if (noiseBuffer) {
        const ns = audioCtx.createBufferSource();
        ns.buffer = noiseBuffer;
        const flt = audioCtx.createBiquadFilter();
        flt.type = "bandpass"; flt.frequency.value = 1500 * v; flt.Q.value = 1.6;
        const ng = audioCtx.createGain();
        ng.gain.setValueAtTime(0.16, now);
        ng.gain.exponentialRampToValueAtTime(0.001, now + 0.085);
        ns.connect(flt); flt.connect(ng); ng.connect(out);
        ns.start(now, audioRng()); trackNode(ns, now + 0.09);
      }
    }
  }

  function playKillSfx(boardX) {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const out = makePanner(boardX);
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "sine";
    const f = 320 + audioRng() * 140;
    osc.frequency.setValueAtTime(f, now);
    osc.frequency.exponentialRampToValueAtTime(f * 1.6, now + 0.045);
    g.gain.setValueAtTime(0.055, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
    osc.connect(g); g.connect(out);
    osc.start(now); trackNode(osc, now + 0.055);
  }

  function playWaveHornSfx() {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const out = makePanner(2);
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const flt = audioCtx.createBiquadFilter();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(165, now);
    osc.frequency.linearRampToValueAtTime(220, now + 0.24);
    flt.type = "lowpass"; flt.frequency.value = 520;
    g.gain.setValueAtTime(0.001, now);
    g.gain.linearRampToValueAtTime(0.11, now + 0.06);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.34);
    osc.connect(flt); flt.connect(g); g.connect(out);
    osc.start(now); trackNode(osc, now + 0.36);
  }

  function playLeakSfx() {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const out = makePanner(23.5);
    // Stone crack
    if (noiseBuffer) {
      const ns = audioCtx.createBufferSource();
      ns.buffer = noiseBuffer;
      const flt = audioCtx.createBiquadFilter();
      flt.type = "bandpass"; flt.frequency.value = 700;
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(0.28, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
      ns.connect(flt); flt.connect(ng); ng.connect(out);
      ns.start(now, audioRng()); trackNode(ns, now + 0.15);
    }
    // Alarm tone
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(520, now);
    osc.frequency.setValueAtTime(390, now + 0.1);
    const flt = audioCtx.createBiquadFilter();
    flt.type = "lowpass"; flt.frequency.value = 1200;
    g.gain.setValueAtTime(0.16, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
    osc.connect(flt); flt.connect(g); g.connect(out);
    osc.start(now); trackNode(osc, now + 0.25);
  }

  function playFallSfx() {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const out = makePanner(23.5);
    // Deep collapse rumble
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(95, now);
    osc.frequency.exponentialRampToValueAtTime(24, now + 1.1);
    g.gain.setValueAtTime(0.45, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 1.25);
    osc.connect(g); g.connect(out);
    osc.start(now); trackNode(osc, now + 1.3);

    if (noiseBuffer) {
      const ns = audioCtx.createBufferSource();
      ns.buffer = noiseBuffer;
      const flt = audioCtx.createBiquadFilter();
      flt.type = "lowpass"; flt.frequency.setValueAtTime(650, now);
      flt.frequency.exponentialRampToValueAtTime(110, now + 1.1);
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(0.36, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
      ns.connect(flt); flt.connect(ng); ng.connect(out);
      ns.start(now, 0); trackNode(ns, now + 1.25);
    }
    startWind();
  }

  // Rate-limiter for shot sounds: <= 12 shots/sec wall-clock, loudest types first
  const SHOT_LOUDNESS = [1, 4, 2, 5, 3]; // lance(3) > cannon(1) > flak(4) > frost(2) > bolt(0)
  const recentShotTimes = [];
  let lastKillSfxWall = 0;

  function triggerAudioForRange(prevTime, currTime) {
    if (currTime <= prevTime) return;
    if (!audioCtx || audioCtx.state !== "running") return;

    // If past fallTime, only low wind plays
    if (replay.fallTick !== -1 && prevTime >= replay.fallTime) {
      startWind();
      return;
    }

    // Fall event
    if (replay.fallTick !== -1 && prevTime < replay.fallTime && currTime >= replay.fallTime) {
      playFallSfx();
      return;
    }

    // Wave starts
    for (let i = 0; i < replay.waves.length; i++) {
      const w = replay.waves[i];
      if (w.t > prevTime && w.t <= currTime) {
        playWaveHornSfx();
        break;
      }
    }

    // Leaks
    for (let i = 0; i < replay.leaks.length; i++) {
      const lk = replay.leaks[i];
      if (lk.t > prevTime && lk.t <= currTime) {
        playLeakSfx();
      }
    }

    // Shots (rate-limited to <= 12/sec wall clock, loudest first)
    const nowMs = performance.now();
    while (recentShotTimes.length > 0 && nowMs - recentShotTimes[0] > 1000) {
      recentShotTimes.shift();
    }
    const budget = 12 - recentShotTimes.length;
    if (budget > 0) {
      const dueShots = [];
      for (let i = 0; i < replay.shots.length; i++) {
        const sh = replay.shots[i];
        if (sh.t > prevTime && sh.t <= currTime) dueShots.push(sh);
        else if (sh.t > currTime) break;
      }
      if (dueShots.length > 0) {
        dueShots.sort((a, b) => SHOT_LOUDNESS[b.typeIdx] - SHOT_LOUDNESS[a.typeIdx]);
        const playN = Math.min(budget, dueShots.length, 3);
        for (let i = 0; i < playN; i++) {
          playShotSfx(dueShots[i].typeIdx, dueShots[i].x0);
          recentShotTimes.push(nowMs);
        }
      }
    }

    // Kills (soft pop, lightly throttled)
    if (nowMs - lastKillSfxWall >= 55) {
      for (let i = 0; i < replay.kills.length; i++) {
        const kl = replay.kills[i];
        if (kl.t > prevTime && kl.t <= currTime) {
          playKillSfx(kl.x);
          lastKillSfxWall = nowMs;
          break;
        } else if (kl.t > currTime) break;
      }
    }
  }

  // =========================================================================
  // 10. DETERMINISTIC FRAME RENDERER (Pure function of simTime)
  // =========================================================================
  const tmpColor = new THREE.Color();
  const hpGreen = new THREE.Color(0x3de673);
  const hpYellow = new THREE.Color(0xffcc33);
  const hpRed = new THREE.Color(0xff3b47);
  const vStart = new THREE.Vector3();
  const vEnd = new THREE.Vector3();
  const vMid = new THREE.Vector3();
  const upVec = new THREE.Vector3(0, 1, 0);
  const quat = new THREE.Quaternion();
  const billQuat = new THREE.Quaternion();

  const SHOT_COLORS = [
    new THREE.Color(0x7cc4f5), // bolt
    new THREE.Color(0xffa64d), // cannon
    new THREE.Color(0xcff6ff), // frost
    new THREE.Color(0xff2e44), // lance
    new THREE.Color(0x2be8d5)  // flak
  ];

  function renderAt(simTime) {
    const clampedT = Math.max(0, Math.min(DURATION, simTime));
    const fallen = replay.fallTick !== -1 && clampedT >= replay.fallTime;
    const effectiveT = fallen ? replay.fallTime : clampedT;

    const exactTick = effectiveT * TICKS_PER_SEC;
    const k = Math.min(MAX_TICKS - 2, Math.floor(exactTick));
    const frac = fallen ? 0 : (exactTick - k);

    const st0 = replay.ticks[k];
    const st1 = replay.ticks[k + 1] || st0;

    // 1. Camera trauma shake (closed-form)
    const trauma = getTrauma(clampedT);
    const shakeMag = trauma * trauma * 0.25;
    if (shakeMag > 0.0001) {
      const sx = shakeNoise(clampedT, 1.1) * shakeMag;
      const sy = shakeNoise(clampedT, 3.7) * shakeMag * 0.6;
      const sz = shakeNoise(clampedT, 7.3) * shakeMag;
      camera.position.set(camBasePos.x + sx, camBasePos.y + sy, camBasePos.z + sz);
      camera.lookAt(camBaseTarget.x + sx * 0.5, camBaseTarget.y, camBaseTarget.z + sz * 0.5);
    } else {
      camera.position.copy(camBasePos);
      camera.lookAt(camBaseTarget);
    }
    camera.updateMatrixWorld();
    billQuat.copy(camera.quaternion);

    // 2. Turrets (16 slots)
    for (let s = 0; s < 16; s++) {
      const tInfo = st0.turrets[s];
      const variants = slotTurretVisuals[s];
      for (let v = 0; v < 5; v++) {
        const mesh = variants[v];
        if (tInfo && tInfo.typeIdx === v) {
          mesh.visible = true;
          const ud = mesh.userData;
          if (v === 2) {
            ud.head.rotation.y = effectiveT * 1.4 + s;
          } else {
            ud.head.rotation.y = tInfo.aim;
          }
          for (let p = 0; p < 3; p++) ud.pips[p].visible = p < tInfo.tier;
          ud.ring.visible = tInfo.tier >= 2;
          const rScale = tInfo.tier === 3 ? 1.08 : 0.92;
          ud.ring.scale.set(rScale, rScale, 1);
        } else {
          mesh.visible = false;
        }
      }
    }

    // 3. Enemies (interpolated k -> k+1)
    const counts = [0, 0, 0, 0, 0, 0, 0];
    let bruteC = 0, wispC = 0, menderC = 0, hpBarC = 0;
    const enemies0 = st0.enemies;
    const eMap1 = st1.enemyMap;

    for (let i = 0; i < enemies0.length; i++) {
      const e0 = enemies0[i];
      const e1 = eMap1.get(e0.id) || e0;
      const wx = e0.x + (e1.x - e0.x) * frac;
      const wz = e0.z + (e1.z - e0.z) * frac;
      const tIdx = e0.typeIdx;
      const idx = counts[tIdx];
      if (idx >= MAX_ENEMIES_PER_TYPE) continue;

      const heading = routeHeading(e0.air, e0.progress);
      let wy = 0.24;
      if (tIdx === 2) {
        wy = 0.8 + Math.sin(effectiveT * 5.0 + e0.id) * 0.07;
      } else if (tIdx === 3) {
        wy = 0.30;
      } else if (tIdx === 6) {
        wy = 0.16;
      }

      dummy.position.set(wx, wy, wz);
      dummy.rotation.set(0, tIdx === 2 ? effectiveT * 2.2 + e0.id : heading, 0);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      enemyInsts[tIdx].setMatrixAt(idx, dummy.matrix);

      // Slow tint
      tmpColor.copy(ENEMY_BASE_COLORS[tIdx]);
      if (e0.slowed) tmpColor.lerp(SLOW_COLOR, 0.58);
      enemyInsts[tIdx].setColorAt(idx, tmpColor);
      counts[tIdx]++;

      // Brute orange plates
      if (tIdx === 3 && bruteC < MAX_ENEMIES_PER_TYPE) {
        dummy.position.set(wx, wy + 0.12, wz);
        dummy.rotation.set(0, heading, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        brutePlateInst.setMatrixAt(bruteC++, dummy.matrix);
      }
      // Wisp ground shadow
      if (tIdx === 2 && wispC < MAX_ENEMIES_PER_TYPE) {
        dummy.position.set(wx, 0.045, wz);
        dummy.rotation.set(-Math.PI * 0.5, 0, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        wispShadowInst.setMatrixAt(wispC++, dummy.matrix);
      }
      // Mender green halo
      if (tIdx === 5 && menderC < MAX_ENEMIES_PER_TYPE) {
        const pulse = 1 + Math.sin(effectiveT * 6.0 + e0.id) * 0.12;
        dummy.position.set(wx, 0.12, wz);
        dummy.rotation.set(-Math.PI * 0.5, 0, 0);
        dummy.scale.set(pulse, pulse, 1);
        dummy.updateMatrix();
        menderHaloInst.setMatrixAt(menderC++, dummy.matrix);
      }

      // Health bar above enemy
      if (hpBarC < MAX_TOTAL_ENEMIES) {
        const hpRatio = Math.max(0.02, Math.min(1, e0.hp / Math.max(1, e0.maxHp)));
        const barY = wy + (tIdx === 3 ? 0.52 : (tIdx === 6 ? 0.3 : 0.42));
        dummy.position.set(wx, barY, wz);
        dummy.quaternion.copy(billQuat);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        hpBgInst.setMatrixAt(hpBarC, dummy.matrix);

        dummy.position.set(wx - (1 - hpRatio) * 0.26, barY, wz);
        dummy.quaternion.copy(billQuat);
        dummy.scale.set(hpRatio, 1, 1);
        dummy.updateMatrix();
        hpFillInst.setMatrixAt(hpBarC, dummy.matrix);
        tmpColor.copy(hpRatio > 0.55 ? hpGreen : (hpRatio > 0.25 ? hpYellow : hpRed));
        hpFillInst.setColorAt(hpBarC, tmpColor);
        hpBarC++;
      }
    }

    for (let t = 0; t < 7; t++) {
      enemyInsts[t].count = counts[t];
      enemyInsts[t].instanceMatrix.needsUpdate = true;
      if (enemyInsts[t].instanceColor) enemyInsts[t].instanceColor.needsUpdate = true;
    }
    brutePlateInst.count = bruteC; brutePlateInst.instanceMatrix.needsUpdate = true;
    wispShadowInst.count = wispC; wispShadowInst.instanceMatrix.needsUpdate = true;
    menderHaloInst.count = menderC; menderHaloInst.instanceMatrix.needsUpdate = true;
    hpBgInst.count = hpBarC; hpBgInst.instanceMatrix.needsUpdate = true;
    hpFillInst.count = hpBarC; hpFillInst.instanceMatrix.needsUpdate = true;
    if (hpFillInst.instanceColor) hpFillInst.instanceColor.needsUpdate = true;

    // 4. Keep state (red flash on leak, chunk knock-off, fall collapse)
    let leakFlash = 0;
    for (let i = 0; i < replay.leaks.length; i++) {
      const dt = clampedT - replay.leaks[i].t;
      if (dt >= 0 && dt < 0.35) leakFlash = Math.max(leakFlash, 1 - dt / 0.35);
    }
    keepStoneMat.emissive.setRGB(leakFlash * 0.9, leakFlash * 0.08, leakFlash * 0.08);
    keepTrimMat.emissive.setRGB(leakFlash * 0.9, leakFlash * 0.08, leakFlash * 0.08);

    if (fallen) {
      keepCore.visible = false;
      for (let i = 0; i < 10; i++) keepChunks[i].mesh.visible = false;
      fallDebrisInst.visible = true;
      const ft = Math.min(2.2, clampedT - replay.fallTime);
      for (let i = 0; i < FALL_DEBRIS_N; i++) {
        const d = fallDebrisData[i];
        const px = 23.5 + d.x0 + d.vx * ft;
        const py = Math.max(0.08, d.y0 + d.vy * ft - 6.5 * ft * ft);
        const pz = 11.5 + d.z0 + d.vz * ft;
        dummy.position.set(px, py, pz);
        dummy.rotation.set(d.rx * ft, d.ry * ft, 0);
        dummy.scale.set(d.s, d.s, d.s);
        dummy.updateMatrix();
        fallDebrisInst.setMatrixAt(i, dummy.matrix);
      }
      fallDebrisInst.instanceMatrix.needsUpdate = true;
    } else {
      keepCore.visible = true;
      fallDebrisInst.visible = false;
      for (let i = 0; i < 10; i++) {
        const ch = keepChunks[i];
        const lossT = chunkLossTime[i];
        if (clampedT < lossT) {
          ch.mesh.visible = true;
          ch.mesh.position.copy(ch.basePos);
          ch.mesh.rotation.set(0, ch.baseRotY, 0);
        } else {
          const dt = clampedT - lossT;
          if (dt < 0.85) {
            ch.mesh.visible = true;
            ch.mesh.position.set(
              ch.basePos.x + ch.vx * dt,
              Math.max(0.05, ch.basePos.y + ch.vy * dt - 7.0 * dt * dt),
              ch.basePos.z + ch.vz * dt
            );
            ch.mesh.rotation.set(ch.rx * dt, ch.baseRotY, ch.rz * dt);
          } else {
            ch.mesh.visible = false;
          }
        }
      }
    }

    // 5. Combat VFX (all closed-form from replay events)
    let beamC = 0, shellC = 0, ringC = 0, debrisC = 0;

    // Shots (duration <= 0.15s)
    for (let i = 0; i < replay.shots.length; i++) {
      const sh = replay.shots[i];
      const age = effectiveT - sh.t;
      if (age < 0) break;
      if (age > 0.15) continue;
      const p = age / 0.15;
      const y0 = 0.52;
      const y1 = sh.air ? 0.8 : 0.28;

      if (sh.typeIdx === 1) {
        // cannon: arcing shell + burst splash ring (0.9 tiles)
        if (p < 0.72 && shellC < MAX_SHELLS) {
          const u = p / 0.72;
          const sx = sh.x0 + (sh.x1 - sh.x0) * u;
          const sz = sh.z0 + (sh.z1 - sh.z0) * u;
          const sy = y0 + (y1 - y0) * u + Math.sin(u * Math.PI) * 1.15;
          dummy.position.set(sx, sy, sz);
          dummy.rotation.set(0, 0, 0);
          dummy.scale.set(1, 1, 1);
          dummy.updateMatrix();
          shellInst.setMatrixAt(shellC++, dummy.matrix);
        } else if (ringC < MAX_RINGS) {
          const u = (p - 0.72) / 0.28;
          const rad = 0.2 + u * 0.7; // up to 0.9 tile splash radius
          dummy.position.set(sh.x1, 0.12, sh.z1);
          dummy.rotation.set(0, 0, 0);
          dummy.scale.set(rad, 1, rad);
          dummy.updateMatrix();
          ringInst.setMatrixAt(ringC, dummy.matrix);
          ringInst.setColorAt(ringC, SHOT_COLORS[1]);
          ringC++;
        }
      } else {
        // beam/tracer for bolt, frost, lance, flak
        if (beamC < MAX_BEAMS) {
          vStart.set(sh.x0, y0, sh.z0);
          vEnd.set(sh.x1, y1, sh.z1);
          vMid.addVectors(vStart, vEnd).multiplyScalar(0.5);
          const dist = vStart.distanceTo(vEnd);
          const radius = sh.typeIdx === 3 ? 0.085 * (1 - p * 0.5)
            : (sh.typeIdx === 2 ? 0.05 * (1 - p * 0.4) : 0.03 * (1 - p * 0.5));
          dummy.position.copy(vMid);
          dummy.lookAt(vEnd);
          dummy.scale.set(radius, radius, Math.max(0.05, dist));
          dummy.updateMatrix();
          beamInst.setMatrixAt(beamC, dummy.matrix);
          beamInst.setColorAt(beamC, SHOT_COLORS[sh.typeIdx]);
          beamC++;
        }
        // flak bursts in a teal ring in the air (0.7 tiles)
        if (sh.typeIdx === 4 && ringC < MAX_RINGS) {
          const rad = 0.18 + p * 0.52;
          dummy.position.set(sh.x1, 0.8, sh.z1);
          dummy.rotation.set(0, 0, 0);
          dummy.scale.set(rad, 1, rad);
          dummy.updateMatrix();
          ringInst.setMatrixAt(ringC, dummy.matrix);
          ringInst.setColorAt(ringC, SHOT_COLORS[4]);
          ringC++;
        }
      }
    }

    // Mender heal rings (1.5 tiles = 150 centi-tiles)
    const healCol = new THREE.Color(0x3dff88);
    for (let i = 0; i < replay.heals.length; i++) {
      const h = replay.heals[i];
      const age = effectiveT - h.t;
      if (age < 0) break;
      if (age > 0.35 || ringC >= MAX_RINGS) continue;
      const rad = 0.25 + (age / 0.35) * 1.25;
      dummy.position.set(h.x, 0.1, h.z);
      dummy.rotation.set(0, 0, 0);
      dummy.scale.set(rad, 1, rad);
      dummy.updateMatrix();
      ringInst.setMatrixAt(ringC, dummy.matrix);
      ringInst.setColorAt(ringC, healCol);
      ringC++;
    }

    // Builds / upgrades / sells
    const goldSparkCol = new THREE.Color(0xffe670);
    const upgRingCol = new THREE.Color(0x88f4ff);
    const rubbleCol = new THREE.Color(0x8a8f9b);
    for (let i = 0; i < replay.builds.length; i++) {
      const b = replay.builds[i];
      const age = effectiveT - b.t;
      if (age < 0) break;
      if (age > 0.45) continue;
      const p = age / 0.45;
      if (b.op === 0) {
        // Build: rising golden sparkles
        for (let k = 0; k < 5 && debrisC < MAX_DEBRIS; k++) {
          const ang = k * 1.256 + b.slot;
          const r = 0.32 * (1 - p * 0.4);
          dummy.position.set(b.x + Math.cos(ang) * r, 0.18 + p * 0.95 + (k % 2) * 0.12, b.z + Math.sin(ang) * r);
          dummy.rotation.set(p * 4, ang, 0);
          const sc = (1 - p) * 0.9;
          dummy.scale.set(sc, sc, sc);
          dummy.updateMatrix();
          debrisInst.setMatrixAt(debrisC, dummy.matrix);
          debrisInst.setColorAt(debrisC, goldSparkCol);
          debrisC++;
        }
      } else if (b.op === 1 && ringC < MAX_RINGS) {
        // Upgrade: bright expanding ring pulse
        const rad = 0.25 + p * 0.72;
        dummy.position.set(b.x, 0.25 + p * 0.35, b.z);
        dummy.rotation.set(0, 0, 0);
        dummy.scale.set(rad, 1, rad);
        dummy.updateMatrix();
        ringInst.setMatrixAt(ringC, dummy.matrix);
        ringInst.setColorAt(ringC, upgRingCol);
        ringC++;
      } else if (b.op === 2) {
        // Sell: rubble collapse
        for (let k = 0; k < 6 && debrisC < MAX_DEBRIS; k++) {
          const ang = k * 1.047 + b.slot;
          dummy.position.set(b.x + Math.cos(ang) * p * 0.5, Math.max(0.06, 0.45 - p * 0.42), b.z + Math.sin(ang) * p * 0.5);
          dummy.rotation.set(p * 5, ang, p * 3);
          const sc = (1 - p) * 1.1;
          dummy.scale.set(sc, sc, sc);
          dummy.updateMatrix();
          debrisInst.setMatrixAt(debrisC, dummy.matrix);
          debrisInst.setColorAt(debrisC, rubbleCol);
          debrisC++;
        }
      }
    }

    // Fall shockwave ring
    if (fallen && ringC < MAX_RINGS) {
      const fAge = clampedT - replay.fallTime;
      if (fAge >= 0 && fAge < 1.2) {
        const rad = 0.5 + (fAge / 1.2) * 5.8;
        dummy.position.set(23.5, 0.2, 11.5);
        dummy.rotation.set(0, 0, 0);
        dummy.scale.set(rad, 1, rad);
        dummy.updateMatrix();
        ringInst.setMatrixAt(ringC, dummy.matrix);
        ringInst.setColorAt(ringC, hpRed);
        ringC++;
      }
    }

    // Kill debris (closed-form ballistic in time since kill)
    for (let i = 0; i < replay.kills.length; i++) {
      const kl = replay.kills[i];
      const age = effectiveT - kl.t;
      if (age < 0) break;
      if (age > 0.45) continue;
      const p = age / 0.45;
      const y0 = kl.air ? 0.8 : 0.26;
      const col = ENEMY_BASE_COLORS[kl.typeIdx];

      // Splitter death purple burst ring
      if (kl.typeIdx === 4 && ringC < MAX_RINGS && age < 0.28) {
        const rad = 0.2 + (age / 0.28) * 0.65;
        dummy.position.set(kl.x, 0.14, kl.z);
        dummy.rotation.set(0, 0, 0);
        dummy.scale.set(rad, 1, rad);
        dummy.updateMatrix();
        ringInst.setMatrixAt(ringC, dummy.matrix);
        ringInst.setColorAt(ringC, col);
        ringC++;
      }

      for (let d = 0; d < 4 && debrisC < MAX_DEBRIS; d++) {
        const h = (kl.seed * 2654435761 + d * 1013904223) >>> 0;
        const ang = (h & 1023) / 1024 * Math.PI * 2;
        const spd = 0.7 + ((h >>> 10) & 255) / 255 * 1.4;
        const vy = 1.6 + ((h >>> 18) & 255) / 255 * 1.8;
        const px = kl.x + Math.cos(ang) * spd * age;
        const py = Math.max(0.05, y0 + vy * age - 6.0 * age * age);
        const pz = kl.z + Math.sin(ang) * spd * age;
        const sc = (1 - p) * (kl.typeIdx === 3 ? 1.5 : 0.95);
        dummy.position.set(px, py, pz);
        dummy.rotation.set(age * 7 + d, ang, age * 5);
        dummy.scale.set(sc, sc, sc);
        dummy.updateMatrix();
        debrisInst.setMatrixAt(debrisC, dummy.matrix);
        debrisInst.setColorAt(debrisC, col);
        debrisC++;
      }
    }

    beamInst.count = beamC; beamInst.instanceMatrix.needsUpdate = true;
    if (beamInst.instanceColor) beamInst.instanceColor.needsUpdate = true;
    shellInst.count = shellC; shellInst.instanceMatrix.needsUpdate = true;
    ringInst.count = ringC; ringInst.instanceMatrix.needsUpdate = true;
    if (ringInst.instanceColor) ringInst.instanceColor.needsUpdate = true;
    debrisInst.count = debrisC; debrisInst.instanceMatrix.needsUpdate = true;
    if (debrisInst.instanceColor) debrisInst.instanceColor.needsUpdate = true;

    // 6. Desaturation over 1.0s after fallTick
    const desat = fallen ? Math.min(1, (clampedT - replay.fallTime) / 1.0) : 0.0;
    postMat.uniforms.uDesat.value = desat;

    // 7. Update World-Anchored HUD
    updateHud(st0, clampedT);

    // 8. Render 3D scene -> RT -> Screen (with desat) -> HUD overlay pass
    renderer.setRenderTarget(renderTarget);
    renderer.clear();
    renderer.render(scene, camera);

    renderer.setRenderTarget(null);
    renderer.clear();
    renderer.render(postScene, postCam);
    renderer.clearDepth();
    renderer.render(hudScene, hudCam);
  }

  // =========================================================================
  // 11. EXACT 5-STATE PLAYBACK MACHINE & DOCK CONTROLS
  // =========================================================================
  const countdownEl = document.getElementById("countdown");
  const btnRefire = document.getElementById("btn-refire");
  const btnToggle = document.getElementById("btn-toggle");
  const iconPause = document.getElementById("icon-pause");
  const iconPlay = document.getElementById("icon-play");
  const scrubber = document.getElementById("scrubber");
  const speedPills = Array.from(document.querySelectorAll(".speed-pill"));

  let state = "COUNTDOWN"; // COUNTDOWN | PLAYING | PAUSED | REFIRE_HOLD | ENDED
  let simTime = 0.0;
  let playbackSpeed = 1.0;
  let countdownElapsed = 0.0;
  let holdElapsed = 0.0;
  let lastFrameMs = null;

  function setToggleVisual(isPlayingOrActive) {
    if (isPlayingOrActive) {
      iconPause.style.display = "";
      iconPlay.style.display = "none";
      btnToggle.setAttribute("aria-label", "Pause");
    } else {
      iconPause.style.display = "none";
      iconPlay.style.display = "";
      btnToggle.setAttribute("aria-label", "Play");
    }
  }

  function hideCountdown() {
    countdownEl.style.display = "none";
    countdownEl.textContent = "";
  }

  btnToggle.addEventListener("click", () => {
    unlockAudio();
    if (state === "PLAYING") {
      state = "PAUSED";
      setToggleVisual(false);
      silenceAudioImmediate();
    } else if (state === "COUNTDOWN" || state === "REFIRE_HOLD") {
      hideCountdown();
      simTime = 0.0;
      scrubber.value = "0";
      state = "PAUSED";
      setToggleVisual(false);
      silenceAudioImmediate();
      renderAt(simTime);
    } else if (state === "PAUSED") {
      state = "PLAYING";
      setToggleVisual(true);
      enableAudio();
    } else if (state === "ENDED") {
      hideCountdown();
      simTime = 0.0;
      scrubber.value = "0";
      state = "PLAYING";
      setToggleVisual(true);
      enableAudio();
      renderAt(simTime);
    }
  });

  speedPills.forEach(pill => {
    pill.addEventListener("click", () => {
      unlockAudio();
      playbackSpeed = parseFloat(pill.getAttribute("data-speed")) || 1.0;
      speedPills.forEach(p => {
        const active = p === pill;
        p.classList.toggle("is-active", active);
        p.setAttribute("aria-checked", active ? "true" : "false");
      });
    });
  });

  scrubber.addEventListener("input", () => {
    unlockAudio();
    if (state === "COUNTDOWN" || state === "REFIRE_HOLD") {
      hideCountdown();
    }
    state = "PAUSED";
    setToggleVisual(false);
    silenceAudioImmediate();
    simTime = Math.max(0, Math.min(DURATION, parseFloat(scrubber.value) || 0));
    renderAt(simTime);
  });

  btnRefire.addEventListener("click", () => {
    unlockAudio();
    hideCountdown();
    silenceAudioImmediate();
    simTime = 0.0;
    scrubber.value = "0";
    holdElapsed = 0.0;
    state = "REFIRE_HOLD";
    setToggleVisual(true);
    renderAt(0.0);
  });

  window.addEventListener("resize", () => {
    updateCameraAndSize();
    renderAt(simTime);
  });

  // Initial layout & resting render at simTime = 0.000
  updateCameraAndSize();
  countdownEl.style.display = "block";
  countdownEl.textContent = "3";
  scrubber.value = "0";
  setToggleVisual(true);
  renderAt(0.0);

  let rafStarted = false;
  function tickFrame(nowMs) {
    requestAnimationFrame(tickFrame);
    if (!rafStarted) {
      rafStarted = true;
      lastFrameMs = nowMs;
      return;
    }
    const rawDt = (nowMs - lastFrameMs) / 1000;
    lastFrameMs = nowMs;
    const dt = Math.min(Math.max(0, rawDt), 0.1);

    if (state === "COUNTDOWN") {
      countdownElapsed += dt;
      if (countdownElapsed < 1.0) {
        countdownEl.style.display = "block";
        countdownEl.textContent = "3";
      } else if (countdownElapsed < 2.0) {
        countdownEl.style.display = "block";
        countdownEl.textContent = "2";
      } else if (countdownElapsed < 3.0) {
        countdownEl.style.display = "block";
        countdownEl.textContent = "1";
      } else {
        hideCountdown();
        state = "PLAYING";
        setToggleVisual(true);
        enableAudio();
        const prevT = simTime;
        simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
        scrubber.value = simTime.toFixed(3);
        triggerAudioForRange(prevT, simTime);
        renderAt(simTime);
      }
    } else if (state === "REFIRE_HOLD") {
      holdElapsed += dt;
      if (holdElapsed >= 1.0) {
        state = "PLAYING";
        setToggleVisual(true);
        enableAudio();
        const prevT = simTime;
        simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
        scrubber.value = simTime.toFixed(3);
        triggerAudioForRange(prevT, simTime);
        renderAt(simTime);
      }
    } else if (state === "PLAYING") {
      const prevT = simTime;
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      scrubber.value = simTime.toFixed(3);
      triggerAudioForRange(prevT, simTime);
      renderAt(simTime);
      if (simTime >= DURATION) {
        simTime = DURATION;
        scrubber.value = DURATION.toFixed(3);
        state = "ENDED";
        setToggleVisual(false);
        silenceAudioImmediate();
        renderAt(DURATION);
      }
    }
  }
  requestAnimationFrame(tickFrame);

  // =========================================================================
  // 12. MACHINE-READABLE BENCHMARK REPORT
  // =========================================================================
  window.BENCH_REPORT = {
    selfCheck: { vectorA: true, vectorB: true },
    strategy: {
      summary: "Interest-farming cannon killbox (9 cannons, 4 flaks, 2 bolts, 1 frost) with dynamic ground/air threat override, cluster-splash cannon/flak targeting, and unslowed-priority frost targeting.",
      seedsTested: 35,
      meanScoreOnTestedSeeds: 45.08
    },
    seed42: { score: simResult.score, fallTick: simResult.fallTick },
    systems: {
      board: "full",
      enemiesAndTurrets: "full",
      combatVisuals: "full",
      fall: "full",
      hud: "full",
      audio: "full"
    },
    simplifications: [],
    testedInBrowser: false,
    measuredFps: null
  };
})();
