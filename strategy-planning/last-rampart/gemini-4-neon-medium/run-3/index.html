<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Last Rampart</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

  justify-content: space-between;

  padding: 0 14px;

  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

  appearance: none;

  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;

  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;

  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;

  padding: 0;

  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;

#speed-group {

<script id="rampart-strategy">
function createStrategy() {
  const SLOT_TYPES = [
    "flak",   // 0 (3,3)
    "cannon", // 1 (5,5)
    "cannon", // 2 (7,4)
    "cannon", // 3 (7,8)
    "cannon", // 4 (9,9)
    "cannon", // 5 (10,5)
    "cannon", // 6 (11,8)
    "cannon", // 7 (13,8)
    "frost",  // 8 (14,5)
    "cannon", // 9 (15,2)
    "flak",   // 10 (16,7)
    "cannon", // 11 (17,4)
    "flak",   // 12 (19,8)
    "cannon", // 13 (20,10)
    "bolt",   // 14 (22,9)
    "flak"    // 15 (3,7)
  ];
  const BUILD_ORDER = [3, 12, 6, 11, 8, 13, 14, 4, 15, 5, 2, 7, 10, 1, 9, 0];
  const COSTS = { bolt: 50, cannon: 90, frost: 70, lance: 120, flak: 80 };

  return {
    plan(state) {
      const actions = [];
      let g = state.gold;
      const w = state.wave;
      const hp = state.baseHp;

      let builtCount = 0;
      let hasFlak = false;
      for (let i = 0; i < 16; i++) {
        const t = state.slots[i].turret;
        if (t) {
          builtCount++;
          if (t.type === "flak") hasFlak = true;
        }
      }

      let airCount = 0;
      for (let i = 0; i < state.nextWave.length; i++) {
        if (state.nextWave[i] === "wisp") airCount++;
      }
      for (let i = 0; i < state.enemies.length; i++) {
        if (state.enemies[i].air) airCount++;
      }

      let reserve = 0;
      if (w >= 5 && w < 28 && hp === 10) {
        reserve = Math.min(1000, (w - 4) * 120);
      }
      let urgent = hp < 10;
      if (!urgent) {
        for (let i = 0; i < state.enemies.length; i++) {
          if (state.enemies[i].remaining < 1100) {
            urgent = true;
            break;
          }
        }
      }
      if (urgent) reserve = 0;

      if (!hasFlak && (airCount > 0 || w >= 3)) {
        for (let k = 0; k < BUILD_ORDER.length; k++) {
          const s = BUILD_ORDER[k];
          if (SLOT_TYPES[s] === "flak" && !state.slots[s].turret && g >= COSTS.flak) {
            actions.push({ op: "build", slot: s, type: "flak" });
            g -= COSTS.flak;
            hasFlak = true;
            builtCount++;
            break;
          }
        }
      }

      for (let k = 0; k < BUILD_ORDER.length; k++) {
        const s = BUILD_ORDER[k];
        const type = SLOT_TYPES[s];
        if (state.slots[s].turret) continue;
        if (type === "flak" && !hasFlak && w < 3 && airCount === 0) continue;
        if (type === "flak" && hasFlak && w < 8) continue;
        const c = COSTS[type];
        const reqRes = builtCount < 4 ? 0 : reserve;
        if (g - c >= reqRes) {
          actions.push({ op: "build", slot: s, type: type });
          g -= c;
          builtCount++;
          if (type === "flak") hasFlak = true;
        }
      }

      for (let targetTier = 2; targetTier <= 3; targetTier++) {
        for (let k = 0; k < BUILD_ORDER.length; k++) {
          const s = BUILD_ORDER[k];
          const sl = state.slots[s];
          if (!sl.turret || sl.turret.tier !== targetTier - 1) continue;
          if (sl.turret.type === "frost" && w < 35) continue;
          const c = COSTS[sl.turret.type] * (targetTier === 2 ? 1 : 2);
          const reqRes = (targetTier === 2 && k < 4) ? 0 : reserve;
          if (g - c >= reqRes) {
            actions.push({ op: "upgrade", slot: s });
            g -= c;
          }
        }
      }

      return actions;
    },

    target(turret, candidates) {
      if (candidates.length === 1) return candidates[0].id;
      const type = turret.type;

      if (type === "frost") {
        let best = candidates[0], bestS = -1e18;
        for (let i = 0; i < candidates.length; i++) {
          const e = candidates[i];
          const slScore = e.slowed === 0 ? 100000 : (30 - e.slowed) * 2500;
          const prio = e.type === "wisp" ? 2000 : (e.type === "runner" ? 1200 : (e.type === "mender" ? 900 : 0));
          const s = slScore + (5000 - e.remaining) + prio;
          if (s > bestS) { bestS = s; best = e; }
        }
        return best.id;
      }

      if (type === "cannon" || type === "flak") {
        const sp = type === "cannon" ? 90 : 70;
        const sp2 = sp * sp;
        let dmg = type === "cannon" ? 60 : 40;
        for (let t = 2; t <= turret.tier; t++) dmg = Math.floor((dmg * 16) / 10);
        let best = candidates[0], bestS = -1e18;
        for (let i = 0; i < candidates.length; i++) {
          const c = candidates[i];
          let val = 0, minRem = c.remaining, killBonus = 0;
          for (let j = 0; j < candidates.length; j++) {
            const o = candidates[j];
            const dx = o.x - c.x, dy = o.y - c.y;
            if (dx * dx + dy * dy <= sp2) {
              const deal = Math.max(1, dmg - o.armor);
              const eff = Math.min(o.hp, deal);
              const mult = o.type === "mender" ? 2.0 : (o.type === "brute" ? 1.2 : (o.type === "runner" ? 1.1 : 1.0));
              val += eff * mult;
              if (o.hp <= deal) killBonus += 20;
              if (o.remaining < minRem) minRem = o.remaining;
            }
          }
          const urg = minRem < 650 ? (650 - minRem) * 4 : 0;
          const s = val + killBonus + (5000 - minRem) * 0.12 + urg;
          if (s > bestS) { bestS = s; best = c; }
        }
        return best.id;
      }

      let best = candidates[0];
      for (let i = 1; i < candidates.length; i++) {
        if (candidates[i].remaining < best.remaining) best = candidates[i];
      }
      return best.id;
    }
  };
}
</script>

<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks, recorder) {
  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return (t ^ (t >>> 14)) >>> 0;
    };
  }

  const GROUND_PTS = [
    [50, 250], [650, 250], [650, 1050], [1250, 1050],
    [1250, 350], [1850, 350], [1850, 1150], [2350, 1150]
  ];
  const AIR_PTS = [
    [50, 650], [2150, 650], [2150, 1150], [2350, 1150]
  ];

  function buildRoute(pts) {
    const segs = [];
    let total = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const x0 = pts[i][0], y0 = pts[i][1];
      const x1 = pts[i + 1][0], y1 = pts[i + 1][1];
      const dx = x1 - x0, dy = y1 - y0;
      const len = Math.abs(dx) + Math.abs(dy);
      const sx = dx === 0 ? 0 : (dx > 0 ? 1 : -1);
      const sy = dy === 0 ? 0 : (dy > 0 ? 1 : -1);
      segs.push({ x0, y0, sx, sy, start: total, end: total + len });
      total += len;
    }
    return { segs, len: total };
  }

  const GROUND_ROUTE = buildRoute(GROUND_PTS);
  const AIR_ROUTE = buildRoute(AIR_PTS);

  function posOnRoute(route, progress) {
    const segs = route.segs;
    for (let i = 0; i < segs.length; i++) {
      const s = segs[i];
      if (progress <= s.end || i === segs.length - 1) {
        const d = progress - s.start;
        return [s.x0 + s.sx * d, s.y0 + s.sy * d];
      }
    }
    const last = segs[segs.length - 1];
    return [last.x0 + last.sx * (last.end - last.start), last.y0 + last.sy * (last.end - last.start)];
  }

  const SLOT_COORDS = [
    [3, 3], [5, 5], [7, 4], [7, 8], [9, 9], [10, 5], [11, 8], [13, 8],
    [14, 5], [15, 2], [16, 7], [17, 4], [19, 8], [20, 10], [22, 9], [3, 7]
  ];
  const SLOTS = SLOT_COORDS.map((c, i) => ({
    slot: i,
    x: c[0] * 100 + 50,
    y: c[1] * 100 + 50,
    turret: null
  }));

  const TURRET_TYPES = {
    bolt:   { idx: 0, cost: 50,  dmg: 26,  period: 8,  range: 300, splash: 0,  slow: 0,  pierce: false, ground: true,  air: true  },
    cannon: { idx: 1, cost: 90,  dmg: 60,  period: 24, range: 260, splash: 90, slow: 0,  pierce: false, ground: true,  air: false },
    frost:  { idx: 2, cost: 70,  dmg: 10,  period: 12, range: 240, splash: 0,  slow: 30, pierce: false, ground: true,  air: true  },
    lance:  { idx: 3, cost: 120, dmg: 180, period: 36, range: 360, splash: 0,  slow: 0,  pierce: true,  ground: true,  air: false },
    flak:   { idx: 4, cost: 80,  dmg: 40,  period: 10, range: 320, splash: 70, slow: 0,  pierce: false, ground: false, air: true  }
  };

  const ENEMY_LIST = [
    { type: "grunt",    baseHp: 60,  speed: 10, bounty: 4, leak: 1, air: 0, firstWave: 1, weight: 10 },
    { type: "runner",   baseHp: 40,  speed: 20, bounty: 4, leak: 1, air: 0, firstWave: 2, weight: 4  },
    { type: "wisp",     baseHp: 50,  speed: 12, bounty: 6, leak: 2, air: 1, firstWave: 3, weight: 3  },
    { type: "brute",    baseHp: 150, speed: 6,  bounty: 9, leak: 3, air: 0, firstWave: 4, weight: 3  },
    { type: "splitter", baseHp: 90,  speed: 8,  bounty: 6, leak: 2, air: 0, firstWave: 6, weight: 2  },
    { type: "mender",   baseHp: 70,  speed: 8,  bounty: 7, leak: 2, air: 0, firstWave: 8, weight: 1  }
  ];
  const ENEMY_MAP = {};
  for (let i = 0; i < ENEMY_LIST.length; i++) ENEMY_MAP[ENEMY_LIST[i].type] = ENEMY_LIST[i];

  function turretDamage(type, tier) {
    let d = TURRET_TYPES[type].dmg;
    for (let t = 2; t <= tier; t++) d = Math.floor((d * 16) / 10);
    return d;
  }

  function turretRange(type, tier) {
    return TURRET_TYPES[type].range + (tier - 1) * 30;
  }

  const rng = mulberry32(seed >>> 0);
  const strat = createStrategy();

  const waveMults = [0, 1000];
  function getWaveMult(w) {
    while (waveMults.length <= w) {
      waveMults.push(Math.floor((waveMults[waveMults.length - 1] * 108) / 100));
    }
    return waveMults[w];
  }

  function generateWave(w) {
    const count = 4 + Math.floor((3 * w) / 5);
    const avail = [];
    let totalW = 0;
    for (let i = 0; i < ENEMY_LIST.length; i++) {
      if (ENEMY_LIST[i].firstWave <= w) {
        avail.push(ENEMY_LIST[i]);
        totalW += ENEMY_LIST[i].weight;
      }
    }
    const comp = [];
    for (let i = 0; i < count; i++) {
      let r = rng() % totalW;
      for (let j = 0; j < avail.length; j++) {
        if (r < avail[j].weight) {
          comp.push(avail[j].type);
          break;
        }
        r -= avail[j].weight;
      }
    }
    return comp;
  }

  const waves = {};
  waves[1] = generateWave(1);

  let baseHp = 10;
  let gold = 250;
  let currentWave = 0;
  let nextEnemyId = 1;
  let enemies = [];
  let spawnQueue = [];
  const log = [];
  let fallTick = -1;

  function makeEnemyView(e) {
    const route = e.air ? AIR_ROUTE : GROUND_ROUTE;
    return {
      id: e.id,
      type: e.type,
      hp: e.hp,
      maxHp: e.maxHp,
      x: e.x,
      y: e.y,
      air: e.air,
      armor: e.armor,
      speed: e.speed,
      slowed: e.slow,
      remaining: route.len - e.progress
    };
  }

  function spawnEnemy(type, wave, progress, overrideMaxHp) {
    let air = 0, speed = 12, armor = 0, bounty = 1, leak = 1, maxHp = 1;
    if (type === "splitling") {
      maxHp = overrideMaxHp;
    } else {
      const def = ENEMY_MAP[type];
      air = def.air;
      speed = def.speed;
      bounty = def.bounty;
      leak = def.leak;
      if (type === "grunt") armor = Math.floor(wave / 4);
      else if (type === "brute") armor = 6 + wave;
      maxHp = Math.floor((def.baseHp * getWaveMult(wave)) / 1000);
    }
    const route = air ? AIR_ROUTE : GROUND_ROUTE;
    const pos = posOnRoute(route, progress);
    const e = {
      id: nextEnemyId++,
      type,
      wave,
      hp: maxHp,
      maxHp,
      progress,
      x: pos[0],
      y: pos[1],
      air,
      armor,
      speed,
      bounty,
      leak,
      age: 0,
      slow: 0
    };
    enemies.push(e);
    return e;
  }

  for (let tick = 0; tick < maxTicks; tick++) {
    // 1. Wave start
    if (tick >= 20 && (tick - 20) % 40 === 0) {
      const w = 1 + (tick - 20) / 40;
      currentWave = w;
      const interest = Math.min(50, Math.floor((gold * 5) / 100));
      gold += interest + 10 + 2 * w;
      if (!waves[w]) waves[w] = generateWave(w);
      waves[w + 1] = generateWave(w + 1);
      if (recorder && recorder.onWaveStart) recorder.onWaveStart(tick, w, gold, waves[w + 1]);

      const state = {
        tick,
        wave: w,
        gold,
        baseHp,
        slots: SLOTS.map(s => ({
          slot: s.slot,
          x: s.x,
          y: s.y,
          turret: s.turret ? { type: s.turret.type, tier: s.turret.tier, spent: s.turret.spent } : null
        })),
        enemies: enemies.map(makeEnemyView),
        nextWave: waves[w + 1].slice()
      };

      const actions = strat.plan(state);
      if (Array.isArray(actions)) {
        const lim = Math.min(32, actions.length);
        for (let i = 0; i < lim; i++) {
          const act = actions[i];
          if (!act || typeof act !== "object") continue;
          const slIdx = act.slot;
          if (!Number.isInteger(slIdx) || slIdx < 0 || slIdx >= 16) continue;
          const sl = SLOTS[slIdx];
          if (act.op === "build") {
            const def = TURRET_TYPES[act.type];
            if (!sl.turret && def && gold >= def.cost) {
              gold -= def.cost;
              sl.turret = {
                type: act.type,
                tier: 1,
                spent: def.cost,
                cooldown: 0,
                dmg: turretDamage(act.type, 1),
                range: turretRange(act.type, 1)
              };
              log.push([tick, "B", slIdx, def.idx]);
              if (recorder && recorder.onAction) recorder.onAction(tick, "B", slIdx, def.idx, 1, sl.x, sl.y);
            }
          } else if (act.op === "upgrade") {
            if (sl.turret && sl.turret.tier < 3) {
              const def = TURRET_TYPES[sl.turret.type];
              const upCost = sl.turret.tier === 1 ? def.cost : def.cost * 2;
              if (gold >= upCost) {
                gold -= upCost;
                sl.turret.tier += 1;
                sl.turret.spent += upCost;
                sl.turret.dmg = turretDamage(sl.turret.type, sl.turret.tier);
                sl.turret.range = turretRange(sl.turret.type, sl.turret.tier);
                log.push([tick, "U", slIdx, sl.turret.tier]);
                if (recorder && recorder.onAction) recorder.onAction(tick, "U", slIdx, def.idx, sl.turret.tier, sl.x, sl.y);
              }
            }
          } else if (act.op === "sell") {
            if (sl.turret) {
              const def = TURRET_TYPES[sl.turret.type];
              gold += Math.floor((sl.turret.spent * 70) / 100);
              sl.turret = null;
              log.push([tick, "S", slIdx, 0]);
              if (recorder && recorder.onAction) recorder.onAction(tick, "S", slIdx, def.idx, 0, sl.x, sl.y);
            }
          }
        }
      }

      const comp = waves[w];
      for (let i = 0; i < comp.length; i++) {
        spawnQueue.push({ tick: tick + 4 * i, wave: w, idx: i, type: comp[i] });
      }
      spawnQueue.sort((a, b) => (a.tick - b.tick) || (a.wave - b.wave) || (a.idx - b.idx));
    }

    // 2. Spawn
    let sqIdx = 0;
    while (sqIdx < spawnQueue.length && spawnQueue[sqIdx].tick === tick) {
      const item = spawnQueue[sqIdx];
      spawnEnemy(item.type, item.wave, 0, 0);
      sqIdx++;
    }
    if (sqIdx > 0) spawnQueue.splice(0, sqIdx);

    // 3. Move
    let fell = false;
    const survivors = [];
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      const route = e.air ? AIR_ROUTE : GROUND_ROUTE;
      const step = e.slow > 0 ? Math.floor((e.speed * 60) / 100) : e.speed;
      e.progress += step;
      if (e.progress >= route.len) {
        baseHp -= e.leak;
        log.push([tick, "L", e.id, baseHp]);
        if (recorder && recorder.onLeak) recorder.onLeak(tick, e.id, e.type, e.x, e.y, baseHp, e.leak);
        if (baseHp <= 0) {
          log.push([tick, "F", currentWave, 0]);
          fallTick = tick;
          fell = true;
          if (recorder && recorder.onFall) recorder.onFall(tick, currentWave);
          break;
        }
      } else {
        const pos = posOnRoute(route, e.progress);
        e.x = pos[0];
        e.y = pos[1];
        survivors.push(e);
      }
    }
    enemies = survivors;
    if (fell) {
      if (recorder && recorder.onTickEnd) {
        recorder.onTickEnd(tick, currentWave, gold, Math.max(0, baseHp), waves[currentWave + 1] || waves[1], SLOTS, enemies);
      }
      break;
    }

    // 4. Age & heal
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      e.age += 1;
      if (e.type === "mender" && e.age % 20 === 0) {
        if (recorder && recorder.onHeal) recorder.onHeal(tick, e.x, e.y);
        for (let j = 0; j < enemies.length; j++) {
          const o = enemies[j];
          const dx = o.x - e.x, dy = o.y - e.y;
          if (dx * dx + dy * dy <= 150 * 150) {
            const healAmt = Math.floor((o.maxHp * 8) / 100);
            o.hp = Math.min(o.maxHp, o.hp + healAmt);
          }
        }
      }
    }

    // 5. Turrets fire
    for (let sIdx = 0; sIdx < 16; sIdx++) {
      const sl = SLOTS[sIdx];
      const t = sl.turret;
      if (!t) continue;
      if (t.cooldown > 0) {
        t.cooldown -= 1;
        if (t.cooldown > 0) continue;
      }
      const def = TURRET_TYPES[t.type];
      const r2 = t.range * t.range;
      const cands = [];
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (e.air ? !def.air : !def.ground) continue;
        const dx = e.x - sl.x, dy = e.y - sl.y;
        if (dx * dx + dy * dy <= r2) cands.push(e);
      }
      if (cands.length === 0) continue;

      let chosen = null;
      if (typeof strat.target === "function") {
        const tView = { slot: sIdx, type: t.type, tier: t.tier, x: sl.x, y: sl.y, range: t.range };
        const cViews = cands.map(makeEnemyView);
        const pickedId = strat.target(tView, cViews);
        for (let i = 0; i < cands.length; i++) {
          if (cands[i].id === pickedId) {
            chosen = cands[i];
            break;
          }
        }
      }
      if (!chosen) {
        chosen = cands[0];
        let bestRem = (chosen.air ? AIR_ROUTE.len : GROUND_ROUTE.len) - chosen.progress;
        for (let i = 1; i < cands.length; i++) {
          const e = cands[i];
          const rem = (e.air ? AIR_ROUTE.len : GROUND_ROUTE.len) - e.progress;
          if (rem < bestRem) {
            bestRem = rem;
            chosen = e;
          }
        }
      }

      if (recorder && recorder.onShot) {
        recorder.onShot(tick, sIdx, def.idx, t.tier, sl.x, sl.y, chosen.x, chosen.y, def.splash, chosen.air);
      }

      if (def.splash > 0) {
        const sp2 = def.splash * def.splash;
        const tx = chosen.x, ty = chosen.y;
        for (let i = 0; i < enemies.length; i++) {
          const e = enemies[i];
          if (e.air ? !def.air : !def.ground) continue;
          const dx = e.x - tx, dy = e.y - ty;
          if (dx * dx + dy * dy <= sp2) {
            const dmg = def.pierce ? t.dmg : Math.max(1, t.dmg - e.armor);
            e.hp -= dmg;
            if (def.slow > 0) e.slow = def.slow;
          }
        }
      } else {
        const dmg = def.pierce ? t.dmg : Math.max(1, t.dmg - chosen.armor);
        chosen.hp -= dmg;
        if (def.slow > 0) chosen.slow = def.slow;
      }

      t.cooldown = def.period;

      const alive = [];
      const toSplit = [];
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (e.hp <= 0) {
          log.push([tick, "K", e.id, sIdx]);
          gold += e.bounty;
          if (recorder && recorder.onKill) {
            recorder.onKill(tick, e.id, e.type, e.x, e.y, e.air, e.type === "splitter");
          }
          if (e.type === "splitter") toSplit.push(e);
        } else {
          alive.push(e);
        }
      }
      enemies = alive;
      for (let i = 0; i < toSplit.length; i++) {
        const sp = toSplit[i];
        const sHp = Math.max(1, Math.floor(sp.maxHp / 4));
        for (let k = 0; k < 3; k++) {
          spawnEnemy("splitling", sp.wave, sp.progress, sHp);
        }
      }
    }

    // 6. Slow timers
    for (let i = 0; i < enemies.length; i++) {
      if (enemies[i].slow > 0) enemies[i].slow -= 1;
    }

    if (recorder && recorder.onTickEnd) {
      recorder.onTickEnd(tick, currentWave, gold, baseHp, waves[currentWave + 1] || waves[1], SLOTS, enemies);
    }
  }

  const endTick = fallTick >= 0 ? fallTick : maxTicks;
  const score = Math.round(((endTick - 20) / 40) * 100) / 100;

  const str = JSON.stringify(log);
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  const hash = (h >>> 0).toString(16).padStart(8, "0");

  return { score, fallTick, log, hash };
}

    onWaveStart(tick, wave, gold, nextWave) {

        const e = enemies[i];
        const obj = {

          typeIdx: ENEMY_TYPE_TO_IDX[e.type],

  const simResult = rampartSimulate(createStrategy, 42, MAX_TICKS, recorder);
  const lastRecordedTick = simResult.fallTick >= 0 ? simResult.fallTick : MAX_TICKS - 1;
  // Fill any ticks after fallTick with the frozen fall frame
  for (let t = lastRecordedTick + 1; t < MAX_TICKS; t++) {
    replay.frames[t] = replay.frames[lastRecordedTick];
  }
  const FALL_TIME = simResult.fallTick >= 0 ? simResult.fallTick / TICKS_PER_SEC : 9999;

  // =========================================================================
  // 2. THREE.JS SCENE, POST-DESATURATION BLIT & CAMERA FRAMING
  // =========================================================================
  const canvas = document.getElementById("stage");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });

  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.autoClear = false;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 500);

  // Offscreen render target for closed-form desaturation after fall
  let rtWidth = Math.max(1, Math.floor(window.innerWidth * renderer.getPixelRatio()));
  let rtHeight = Math.max(1, Math.floor(window.innerHeight * renderer.getPixelRatio()));
  const sceneRT = new THREE.WebGLRenderTarget(rtWidth, rtHeight, {
    minFilter: THREE.LinearFilter,
    magFilter: THREE.LinearFilter,

  });

  const postScene = new THREE.Scene();
  const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const postMat = new THREE.ShaderMaterial({
    transparent: true,
    depthTest: false,
    depthWrite: false,
    uniforms: {
      tDiffuse: { value: sceneRT.texture },
      uDesat: { value: 0.0 }
    },
    vertexShader: `

      void main() {

    `,
    fragmentShader: `
      uniform sampler2D tDiffuse;
      uniform float uDesat;

      void main() {
        vec4 tex = texture2D(tDiffuse, vUv);
        float lum = dot(tex.rgb, vec3(0.299, 0.587, 0.114));

  postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat));

  function updateCameraFraming() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
    const pr = renderer.getPixelRatio();
    sceneRT.setSize(Math.max(1, Math.floor(w * pr)), Math.max(1, Math.floor(h * pr)));

    camera.aspect = w / h;
    camera.updateProjectionMatrix();

    const pitch = 55 * Math.PI / 180;
    const sinP = Math.sin(pitch);
    const cosP = Math.cos(pitch);

    // Safe viewport margins in NDC
    const ndcLeft = -0.95;
    const ndcRight = 0.95;
    const ndcTop = 0.93;
    const dockPx = 96; // clear of 90px dock with extra breathing room
    const ndcBottom = -1.0 + (2.0 * dockPx) / Math.max(200, h);

    // Shift lookAt slightly down in Z so board sits slightly higher on screen (clearing bottom dock)
    const ndcCenterY = 0.5 * (ndcTop + ndcBottom);

    const corners = [
      new THREE.Vector3(-0.7, 0, -0.7),
      new THREE.Vector3(24.7, 0, -0.7),

      new THREE.Vector3(24.7, 0, 14.7),
      new THREE.Vector3(-0.7, 1.8, -0.7),
      new THREE.Vector3(24.7, 1.8, -0.7),
      new THREE.Vector3(-0.7, 1.8, 14.7),
      new THREE.Vector3(24.7, 1.8, 14.7)
    ];

    function fits(dist, zBias) {
      const lx = 12.0, ly = 0.0, lz = 7.0 + zBias;
      camera.position.set(lx, dist * sinP, lz + dist * cosP);
      camera.lookAt(lx, ly, lz);
      camera.updateMatrixWorld(true);
      for (let i = 0; i < corners.length; i++) {
        const p = corners[i].clone().project(camera);
        if (p.x < ndcLeft || p.x > ndcRight || p.y < ndcBottom || p.y > ndcTop) return false;
      }
      return true;
    }

    // Estimate zBias to center board vertically in safe region
    const zBias = 1.15;
    let lo = 16, hi = 65;
    for (let it = 0; it < 22; it++) {
      const mid = 0.5 * (lo + hi);
      if (fits(mid, zBias)) hi = mid;

    const finalDist = hi;
    camBaseLook.set(12.0, 0.0, 7.0 + zBias);
    camBasePos.set(12.0, finalDist * sinP, 7.0 + zBias + finalDist * cosP);
    camera.position.copy(camBasePos);

  const worldGroup = new THREE.Group();
  scene.add(worldGroup);

  // Main fortified terrain plinth
  const groundTex = makeGroundTexture();
  const terrainGeo = new THREE.BoxGeometry(25.2, 0.8, 15.2);
  const terrainMat = new THREE.MeshStandardMaterial({

  const rimTop = new THREE.Mesh(new THREE.BoxGeometry(25.6, 0.35, 0.4), frameMat);
  rimTop.position.set(12, 0.02, -0.6); worldGroup.add(rimTop);
  const rimBot = new THREE.Mesh(new THREE.BoxGeometry(25.6, 0.35, 0.4), frameMat);
  rimBot.position.set(12, 0.02, 14.6); worldGroup.add(rimBot);
  const rimLeft = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.35, 15.6), frameMat);
  rimLeft.position.set(-0.6, 0.02, 7); worldGroup.add(rimLeft);
  const rimRight = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.35, 15.6), frameMat);
  rimRight.position.set(24.6, 0.02, 7); worldGroup.add(rimRight);

  // Dark stone road along ground path
  const roadTex = makeRoadTexture();
  const roadMat = new THREE.MeshStandardMaterial({ map: roadTex, roughness: 0.85, metalness: 0.12 });
  const curbMat = new THREE.MeshStandardMaterial({ color: 0x3a4052, roughness: 0.78, metalness: 0.15 });

  for (let i = 0; i < GROUND_WAYPOINTS.length - 1; i++) {
    const x0 = GROUND_WAYPOINTS[i][0] + 0.5, z0 = GROUND_WAYPOINTS[i][1] + 0.5;
    const x1 = GROUND_WAYPOINTS[i + 1][0] + 0.5, z1 = GROUND_WAYPOINTS[i + 1][1] + 0.5;
    const dx = x1 - x0, dz = z1 - z0;
    const len = Math.hypot(dx, dz) + 0.92;
    const isH = Math.abs(dx) > Math.abs(dz);
    const segW = isH ? len : 0.92;
    const segD = isH ? 0.92 : len;
    const seg = new THREE.Mesh(new THREE.BoxGeometry(segW, 0.06, segD), roadMat);
    seg.position.set(0.5 * (x0 + x1), 0.03, 0.5 * (z0 + z1));

  // Entry gate marker at (0, 2)

  gatePillarL.position.set(0.25, 0.475, 1.9); gatePillarL.castShadow = true; worldGroup.add(gatePillarL);
  const gatePillarR = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.95, 0.26), gateMat);

  gateBeam.position.set(0.25, 0.98, 2.5); gateBeam.castShadow = true; worldGroup.add(gateBeam);

  // Faint glowing air lane ribbon at y = 0.85
  const airLaneUniforms = { uTime: { value: 0.0 } };
  const airLaneMat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    uniforms: airLaneUniforms,
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform float uTime;
      varying vec2 vUv;
      void main() {
        float edge = 1.0 - abs(vUv.y - 0.5) * 2.0;
        float dash = smoothstep(0.25, 0.65, sin(vUv.x * 28.0 - uTime * 4.5) * 0.5 + 0.5);
        float alpha = (0.09 + 0.14 * dash) * pow(edge, 1.3);
        gl_FragColor = vec4(0.22, 0.92, 1.0, alpha);
      }
    `
  });
  for (let i = 0; i < AIR_WAYPOINTS.length - 1; i++) {
    const x0 = AIR_WAYPOINTS[i][0] + 0.5, z0 = AIR_WAYPOINTS[i][1] + 0.5;

  // Decorative low-poly boulders on rough terrain (avoiding road, slots, and keep)
  function isTileOccupied(tx, tz) {
    if (tx >= 22 && tz >= 10) return true;
    for (let i = 0; i < SLOT_COORDS.length; i++) {
      if (Math.abs(SLOT_COORDS[i][0] - tx) <= 1 && Math.abs(SLOT_COORDS[i][1] - tz) <= 1) return true;
    }
    for (let i = 0; i < GROUND_WAYPOINTS.length - 1; i++) {
      const ax = GROUND_WAYPOINTS[i][0], az = GROUND_WAYPOINTS[i][1];
      const bx = GROUND_WAYPOINTS[i + 1][0], bz = GROUND_WAYPOINTS[i + 1][1];
      const minX = Math.min(ax, bx) - 0.6, maxX = Math.max(ax, bx) + 0.6;
      const minZ = Math.min(az, bz) - 0.6, maxZ = Math.max(az, bz) + 0.6;
      if (tx >= minX && tx <= maxX && tz >= minZ && tz <= maxZ) return true;
    }
    return false;
  }
  const rockGeo = new THREE.DodecahedronGeometry(0.28, 0);
  const rockMat = new THREE.MeshStandardMaterial({ color: 0x2c3240, roughness: 0.92, metalness: 0.06, flatShading: true });
  const rockPositions = [];
  for (let i = 0; i < 55; i++) {
    const rx = 0.6 + vRand() * 22.8;
    const rz = 0.6 + vRand() * 12.8;
    if (!isTileOccupied(rx - 0.5, rz - 0.5)) {
      rockPositions.push({ x: rx, z: rz, s: 0.55 + vRand() * 0.95, ry: vRand() * Math.PI * 2 });
    }
  }
  const rockInst = new THREE.InstancedMesh(rockGeo, rockMat, rockPositions.length);
  rockInst.castShadow = true;
  rockInst.receiveShadow = true;
  const dummy = new THREE.Object3D();
  for (let i = 0; i < rockPositions.length; i++) {
    const rp = rockPositions[i];
    dummy.position.set(rp.x, 0.12 * rp.s, rp.z);
    dummy.rotation.set(vRand() * 0.6, rp.ry, vRand() * 0.6);
    dummy.scale.set(rp.s * 1.15, rp.s * 0.72, rp.s);
    dummy.updateMatrix();
    rockInst.setMatrixAt(i, dummy.matrix);
  }
  rockInst.instanceMatrix.needsUpdate = true;
  worldGroup.add(rockInst);

  // 16 Build pads (low stone platforms)
  const padBaseGeo = new THREE.CylinderGeometry(0.46, 0.52, 0.14, 8);
  const padMat = new THREE.MeshStandardMaterial({ color: 0x434a5c, roughness: 0.8, metalness: 0.2 });
  const padRimGeo = new THREE.CylinderGeometry(0.36, 0.38, 0.16, 8);
  const padRimMat = new THREE.MeshStandardMaterial({ color: 0x2c313f, roughness: 0.75, metalness: 0.25 });
  for (let i = 0; i < 16; i++) {

    pb.castShadow = true;

    pr.position.set(px, 0.085, pz);
    pr.receiveShadow = true;
    worldGroup.add(pr);

  // =========================================================================

  // =========================================================================

  function createTurretVisual(typeIdx) {
    const root = new THREE.Group();
    const head = new THREE.Group();
    root.add(head);

    const col = TURRET_COLORS[typeIdx];
    const mainMat = new THREE.MeshStandardMaterial({ color: col, roughness: 0.42, metalness: 0.45 });
    const darkMat = new THREE.MeshStandardMaterial({ color: 0x252a36, roughness: 0.65, metalness: 0.35 });
    const accentMat = new THREE.MeshStandardMaterial({
      color: col, emissive: new THREE.Color(col), emissiveIntensity: 0.45, roughness: 0.3

    // Pedestal
    const ped = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.34, 0.28, 8), darkMat);
    ped.position.y = 0.28; ped.castShadow = true; ped.receiveShadow = true;
    root.add(ped);

    if (typeIdx === 0) {
      // BOLT: steel-blue twin-rail repeater spire
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.32, 0.46), mainMat);
      body.position.set(0, 0.58, 0); body.castShadow = true; head.add(body);
      const railL = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.09, 0.56), accentMat);
      railL.position.set(-0.14, 0.64, 0.22); head.add(railL);

      railR.position.set(0.14, 0.64, 0.22); head.add(railR);
      const core = new THREE.Mesh(new THREE.OctahedronGeometry(0.12, 0), accentMat);
      core.position.set(0, 0.82, -0.02); head.add(core);
    } else if (typeIdx === 1) {
      // CANNON: bronze heavy mortar / howitzer
      const dome = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.34, 0.34, 10), mainMat);
      dome.position.set(0, 0.56, 0); dome.castShadow = true; head.add(dome);
      const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.18, 0.64, 10), darkMat);
      barrel.rotation.x = Math.PI / 2 - 0.22;
      barrel.position.set(0, 0.66, 0.3); barrel.castShadow = true; head.add(barrel);
      const muzzle = new THREE.Mesh(new THREE.TorusGeometry(0.14, 0.04, 6, 12), mainMat);
      muzzle.position.set(0, 0.72, 0.58); head.add(muzzle);
    } else if (typeIdx === 2) {
      // FROST: ice-white crystalline obelisk + floating ring
      const crystal = new THREE.Mesh(new THREE.OctahedronGeometry(0.3, 0), accentMat);
      crystal.scale.set(0.85, 1.75, 0.85);
      crystal.position.set(0, 0.82, 0); crystal.castShadow = true; head.add(crystal);
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.36, 0.045, 6, 16), mainMat);
      ring.rotation.x = Math.PI / 2;
      ring.position.set(0, 0.76, 0); head.add(ring);
    } else if (typeIdx === 3) {
      // LANCE: crimson tall rail-lance needle
      const base = new THREE.Mesh(new THREE.ConeGeometry(0.28, 0.45, 6), darkMat);
      base.position.set(0, 0.6, 0); base.castShadow = true; head.add(base);
      const needle = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.11, 0.98, 8), mainMat);
      needle.rotation.x = Math.PI / 2;
      needle.position.set(0, 0.72, 0.34); needle.castShadow = true; head.add(needle);
      const fin = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.14, 0.14), accentMat);
      fin.position.set(0, 0.72, -0.05); head.add(fin);
    } else {
      // FLAK: teal elevated quad-barrel AA battery

      housing.position.set(0, 0.62, 0); housing.castShadow = true; head.add(housing);

    for (let p = 0; p < 3; p++) {

    root.visible = false;
    return { root, head, pips, typeIdx };
  }
