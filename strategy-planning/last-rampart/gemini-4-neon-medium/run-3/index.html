  scene.add(debrisInst);

  // =========================================================================
  // 8. WORLD-ANCHORED WEBGL HUD (ORTHOGRAPHIC PASS, ZERO DOM, ZERO WORDS)
  // =========================================================================
  const hudScene = new THREE.Scene();
  const hudCam = new THREE.OrthographicCamera(0, window.innerWidth, window.innerHeight, 0, -10, 10);

  // Build glyph atlas (digits 0..9 + wave blades icon + gold coin icon + 6 enemy icons) on detached canvas
  // 18 cells in a 18x1 strip, 64x64 per cell
  const ATLAS_CELLS = 18;
  function makeHudAtlas() {
    const c = document.createElement("canvas");
    c.width = 64 * ATLAS_CELLS;
    c.height = 64;
    const ctx = c.getContext("2d");
    ctx.clearRect(0, 0, c.width, c.height);

    // Cells 0..9: Crisp bold tabular digits
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "800 50px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif";
    for (let d = 0; d < 10; d++) {
      const cx = d * 64 + 32;
      ctx.fillStyle = "rgba(0,0,0,0.45)";
      ctx.fillText(String(d), cx + 2, 35);
      ctx.fillStyle = "#ffffff";
      ctx.fillText(String(d), cx, 33);
    }

    // Cell 10: Crossed blades / wave banner icon
    {
      const ox = 10 * 64 + 32, oy = 32;
      ctx.save();
      ctx.translate(ox, oy);
      ctx.strokeStyle = "#f8fafc";
      ctx.fillStyle = "#e2e8f0";
      ctx.lineWidth = 5;
      ctx.lineCap = "round";
      // Blade 1
      ctx.beginPath(); ctx.moveTo(-18, 18); ctx.lineTo(18, -18); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-16, 6); ctx.lineTo(-6, 16); ctx.stroke();
      // Blade 2
      ctx.beginPath(); ctx.moveTo(18, 18); ctx.lineTo(-18, -18); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(16, 6); ctx.lineTo(6, 16); ctx.stroke();
      ctx.restore();
    }

    // Cell 11: Gold coin icon
    {
      const ox = 11 * 64 + 32, oy = 32;
      ctx.beginPath(); ctx.arc(ox, oy, 22, 0, Math.PI * 2);
      ctx.fillStyle = "#f5b82e"; ctx.fill();
      ctx.lineWidth = 4; ctx.strokeStyle = "#fde68a"; ctx.stroke();
      ctx.beginPath(); ctx.arc(ox, oy, 11, 0, Math.PI * 2);
      ctx.fillStyle = "#d9910b"; ctx.fill();
    }

    // Cells 12..17: 6 enemy-type silhouette icons (grunt, runner, wisp, brute, splitter, mender)
    const iconCols = ["#748a6f", "#f5cf36", "#38f2ff", "#f07a24", "#9c4dff", "#4ade80"];
    for (let e = 0; e < 6; e++) {
      const ox = (12 + e) * 64 + 32, oy = 32;
      ctx.save();
      ctx.translate(ox, oy);
      ctx.fillStyle = iconCols[e];
      ctx.strokeStyle = "#0b0d12";
      ctx.lineWidth = 3;
      if (e === 0) {
        // grunt: square shield
        ctx.fillRect(-16, -16, 32, 32);
        ctx.strokeRect(-16, -16, 32, 32);
      } else if (e === 1) {
        // runner: sharp dart
        ctx.beginPath(); ctx.moveTo(20, 0); ctx.lineTo(-16, -15); ctx.lineTo(-10, 0); ctx.lineTo(-16, 15); ctx.closePath();
        ctx.fill(); ctx.stroke();
      } else if (e === 2) {
        // wisp: glowing diamond
        ctx.beginPath(); ctx.moveTo(0, -21); ctx.lineTo(18, 0); ctx.lineTo(0, 21); ctx.lineTo(-18, 0); ctx.closePath();
        ctx.fill(); ctx.stroke();
      } else if (e === 3) {
        // brute: heavy dark iron hex with orange plate
        ctx.fillStyle = "#363c47";
        ctx.fillRect(-19, -19, 38, 38); ctx.strokeRect(-19, -19, 38, 38);
        ctx.fillStyle = "#f07a24";
        ctx.fillRect(-15, -7, 30, 14);
      } else if (e === 4) {
        // splitter: tri-node pod
        ctx.beginPath(); ctx.arc(0, -10, 11, 0, Math.PI * 2); ctx.arc(-11, 10, 11, 0, Math.PI * 2); ctx.arc(11, 10, 11, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // mender: white cross + green halo
        ctx.strokeStyle = "#4ade80"; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(0, 0, 21, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = "#f8fafc";
        ctx.fillRect(-5, -14, 10, 28); ctx.fillRect(-14, -5, 28, 10);
      }
      ctx.restore();
    }

    const tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  const hudAtlasTex = makeHudAtlas();
  const MAX_HUD_QUADS = 64;
  const hudQuads = [];
  for (let i = 0; i < MAX_HUD_QUADS; i++) {
    const geo = new THREE.PlaneGeometry(1, 1);
    const mat = new THREE.MeshBasicMaterial({
      map: hudAtlasTex, transparent: true, depthTest: false, depthWrite: false, color: 0xffffff
    });
    const m = new THREE.Mesh(geo, mat);
    m.visible = false;
    hudScene.add(m);
    hudQuads.push(m);
  }

  // 10 Base HP pips (top-right)
  const hpPipMeshes = [];
  for (let i = 0; i < 10; i++) {
    const g = new THREE.PlaneGeometry(1, 1);
    const mat = new THREE.MeshBasicMaterial({ color: 0x34d399, transparent: true, opacity: 0.95, depthTest: false });
    const m = new THREE.Mesh(g, mat);
    m.rotation.z = Math.PI / 4; // diamond pip
    hudScene.add(m);
    hpPipMeshes.push(m);
  }

  function setQuadGlyph(idx, cell, cx, cy, w, h, colorHex, opacity) {
    const m = hudQuads[idx];
    const uv = m.geometry.attributes.uv;
    const u0 = cell / ATLAS_CELLS;
    const u1 = (cell + 1) / ATLAS_CELLS;
    uv.setXY(0, u0, 1);
    uv.setXY(1, u1, 1);
    uv.setXY(2, u0, 0);
    uv.setXY(3, u1, 0);
    uv.needsUpdate = true;
    m.position.set(cx, cy, 0);
    m.scale.set(w, h, 1);
    m.material.color.setHex(colorHex !== undefined ? colorHex : 0xffffff);
    m.material.opacity = opacity !== undefined ? opacity : 1.0;
    m.visible = true;
  }

  function updateHud(frame, simTime) {
    const W = window.innerWidth;
    const H = window.innerHeight;
    hudCam.left = 0; hudCam.right = W; hudCam.top = H; hudCam.bottom = 0;
    hudCam.updateProjectionMatrix();

    let q = 0;
    const padX = Math.max(18, Math.round(W * 0.018));
    const padY = Math.max(16, Math.round(H * 0.024));

    // Wave number (>= 7% viewport height) + crossed blades icon
    const waveH = Math.max(48, Math.round(H * 0.078));
    const waveIconSz = Math.round(waveH * 0.78);
    const waveY = H - padY - waveH * 0.5;
    let curX = padX + waveIconSz * 0.5;
    setQuadGlyph(q++, 10, curX, waveY, waveIconSz, waveIconSz, 0xe2e8f0, 0.95);
    curX += waveIconSz * 0.62;

    const waveStr = String(frame.wave);
    const waveDigitW = waveH * 0.64;
    for (let i = 0; i < waveStr.length; i++) {
      setQuadGlyph(q++, waveStr.charCodeAt(i) - 48, curX + waveDigitW * 0.5, waveY, waveDigitW, waveH, 0xffffff, 0.98);
      curX += waveDigitW * 0.88;
    }

    // Gold digits + coin icon under wave number
    const goldH = Math.max(26, Math.round(H * 0.042));
    const goldY = waveY - waveH * 0.52 - goldH * 0.62;
    let gx = padX + goldH * 0.5;
    setQuadGlyph(q++, 11, gx, goldY, goldH * 0.92, goldH * 0.92, 0xffffff, 0.95);
    gx += goldH * 0.64;
    const goldStr = String(frame.gold);
    const goldDigitW = goldH * 0.62;
    for (let i = 0; i < goldStr.length; i++) {
      setQuadGlyph(q++, goldStr.charCodeAt(i) - 48, gx + goldDigitW * 0.5, goldY, goldDigitW, goldH, 0xfde68a, 0.96);
      gx += goldDigitW * 0.86;
    }

    // Next-wave preview row (colored enemy-type icons + counts) under gold
    const prevH = Math.max(20, Math.round(H * 0.032));
    const prevY = goldY - goldH * 0.55 - prevH * 0.72;
    let px = padX + prevH * 0.5;
    const nw = frame.nwCounts;
    for (let e = 0; e < 6; e++) {
      if (nw[e] <= 0) continue;
      if (q + 4 >= MAX_HUD_QUADS) break;
      setQuadGlyph(q++, 12 + e, px, prevY, prevH * 0.95, prevH * 0.95, 0xffffff, 0.95);
      px += prevH * 0.62;
      const cntStr = String(nw[e]);
      const dw = prevH * 0.58;
      for (let c = 0; c < cntStr.length; c++) {
        setQuadGlyph(q++, cntStr.charCodeAt(c) - 48, px + dw * 0.5, prevY, dw, prevH * 0.88, 0xe2e8f0, 0.9);
        px += dw * 0.82;
      }
      px += prevH * 0.48;
    }

    for (let i = q; i < MAX_HUD_QUADS; i++) hudQuads[i].visible = false;

    // Top-right: 10 Base HP pips with leak flash
    const pipSz = Math.max(14, Math.round(H * 0.024));
    const pipGap = Math.round(pipSz * 1.55);
    const pipY = H - padY - waveH * 0.35;
    const startPipX = W - padX - pipSz * 0.7 - 9 * pipGap;

    // Check which pips were just extinguished
    for (let i = 0; i < 10; i++) {
      const m = hpPipMeshes[i];
      const alive = i < frame.baseHp;
      let flash = 0;
      if (!alive) {
        const chunkIdx = 9 - i;
        const dtLeak = simTime - keepChunks[chunkIdx].knockTime;
        if (dtLeak >= 0 && dtLeak < 0.38) {
          flash = 1.0 - dtLeak / 0.38;
        }
      }
      m.position.set(startPipX + i * pipGap, pipY, 0);
      const sc = pipSz * (1.0 + flash * 0.55);
      m.scale.set(sc, sc, 1);
      if (alive) {
        m.material.color.setHex(frame.baseHp <= 3 ? 0xf59e0b : 0x34d399);
        m.material.opacity = 0.95;
      } else if (flash > 0) {
        m.material.color.setHex(0xff3b4e);
        m.material.opacity = 0.35 + 0.65 * flash;
      } else {
        m.material.color.setHex(0x334155);
        m.material.opacity = 0.35;
      }
    }
  }

  // =========================================================================
  // 9. RENDER AT ANY DETERMINISTIC simTime IN [0, 100]
  // =========================================================================
  const tmpColor = new THREE.Color();
  const frostTint = new THREE.Color(0x7ce8ff);
  const hpGreen = new THREE.Color(0x4ade80);
  const hpAmber = new THREE.Color(0xfbbf24);
  const hpRed = new THREE.Color(0xef4444);
  const tmpPos = new THREE.Vector3();
  const tmpPos2 = new THREE.Vector3();
  const tmpQuat = new THREE.Quaternion();
  const upVec = new THREE.Vector3(0, 1, 0);

  function computeTrauma(simTime) {
    let tr = 0;
    for (let i = 0; i < replay.leaks.length; i++) {
      const dt = simTime - replay.leaks[i].time;
      if (dt >= 0 && dt < 1.0) tr += 0.3 * (1.0 - dt);
    }
    if (simTime >= FALL_TIME) {
      const dtF = simTime - FALL_TIME;
      if (dtF < 1.0) tr += 1.0 * (1.0 - dtF);
    }
    return Math.min(1.0, tr);
  }

  function renderAtTime(simTime) {
    const tClamped = Math.max(0, Math.min(DURATION, simTime));
    const effectiveSimTime = Math.min(tClamped, FALL_TIME);
    const exactTick = effectiveSimTime * TICKS_PER_SEC;
    const k = Math.min(lastRecordedTick, Math.floor(exactTick));
    const kNext = Math.min(lastRecordedTick, k + 1);
    const alpha = (tClamped >= FALL_TIME) ? 0 : (exactTick - k);

    const frame0 = replay.frames[k];
    const frame1 = replay.frames[kNext];

    airLaneUniforms.uTime.value = effectiveSimTime;

    // 1. Camera trauma shake (closed-form in simTime)
    const trauma = computeTrauma(tClamped);
    const shakeAmp = trauma * trauma * 0.25;
    const sx = shakeAmp * (Math.sin(tClamped * 53.7 + 1.1) * 0.6 + Math.cos(tClamped * 89.3 + 2.4) * 0.4);
    const sz = shakeAmp * (Math.cos(tClamped * 61.1 + 0.7) * 0.6 + Math.sin(tClamped * 97.9 + 3.1) * 0.4);
    camera.position.set(camBasePos.x + sx, camBasePos.y, camBasePos.z + sz);
    camera.lookAt(camBaseLook.x + sx * 0.5, camBaseLook.y, camBaseLook.z + sz * 0.5);

    // 2. Turrets
    for (let s = 0; s < 16; s++) {
      const tIdx = frame0.slots[s * 2];
      const tier = frame0.slots[s * 2 + 1];
      const aim = frame0.aims[s];
      for (let type = 0; type < 5; type++) {
        const tv = slotTurretMeshes[s][type];
        if (type === tIdx) {
          tv.root.visible = true;
          if (type === 2) {
            // Frost crystal spins smoothly with effectiveSimTime
            tv.head.rotation.y = effectiveSimTime * 1.4 + s;
          } else {
            tv.head.rotation.y = aim;
          }
          for (let p = 0; p < 3; p++) tv.pips[p].visible = p < tier;
        } else {
          tv.root.visible = false;
        }
      }
    }

    // 3. Enemies (interpolated k -> k+1, facing direction, health bars, frost tint)
    const counts = [0, 0, 0, 0, 0, 0, 0];
    let brutePlateN = 0, menderHaloN = 0, wispShadowN = 0, hpBarN = 0;
    const enemies = frame0.enemies;
    const eMap1 = frame1.eMap;

    for (let i = 0; i < enemies.length; i++) {
      const e0 = enemies[i];
      const e1 = eMap1.get(e0.id);
      let wx = e0.wx, wz = e0.wz, hpR = e0.hpRatio;
      let yaw = 0;
      if (e1) {
        wx = e0.wx + (e1.wx - e0.wx) * alpha;
        wz = e0.wz + (e1.wz - e0.wz) * alpha;
        hpR = e0.hpRatio + (e1.hpRatio - e0.hpRatio) * alpha;
        const dx = e1.wx - e0.wx, dz = e1.wz - e0.wz;
        if (dx * dx + dz * dz > 1e-6) yaw = Math.atan2(dx, dz);
      } else {
        // Approximate forward direction if despawned next tick
        yaw = Math.PI / 2;
      }

      const ti = e0.typeIdx;
      const idx = counts[ti];
      if (idx >= MAX_ENEMIES) continue;
      counts[ti]++;

      const bob = e0.air
        ? 0.85 + Math.sin(effectiveSimTime * 5.0 + e0.id) * 0.08
        : (ti === 3 ? 0.34 : (ti === 6 ? 0.18 : 0.26));

      dummy.position.set(wx, bob, wz);
      dummy.rotation.set(0, yaw, 0);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      enemyInst[ti].inst.setMatrixAt(idx, dummy.matrix);

      // Slow tint
      tmpColor.copy(enemyInst[ti].baseColor);
      if (e0.slowed) tmpColor.lerp(frostTint, 0.58);
      enemyInst[ti].inst.setColorAt(idx, tmpColor);

      if (ti === 3 && brutePlateN < MAX_ENEMIES) {
        dummy.position.set(wx, bob + 0.14, wz);
        dummy.updateMatrix();
        brutePlateInst.inst.setMatrixAt(brutePlateN, dummy.matrix);
        tmpColor.copy(brutePlateInst.baseColor);
        if (e0.slowed) tmpColor.lerp(frostTint, 0.45);
        brutePlateInst.inst.setColorAt(brutePlateN, tmpColor);
        brutePlateN++;
      }
      if (ti === 5 && menderHaloN < MAX_ENEMIES) {
        dummy.position.set(wx, 0.12, wz);
        dummy.rotation.set(Math.PI / 2, 0, effectiveSimTime * 2.0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        menderHaloInst.setMatrixAt(menderHaloN, dummy.matrix);
        menderHaloN++;
      }
      if (e0.air && wispShadowN < MAX_ENEMIES) {
        dummy.position.set(wx, 0.04, wz);
        dummy.rotation.set(0, 0, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        wispShadowInst.setMatrixAt(wispShadowN, dummy.matrix);
        wispShadowN++;
      }

      // Health bar above enemy
      if (hpBarN < MAX_ENEMIES) {
        const barY = bob + (ti === 3 ? 0.56 : 0.46);
        dummy.position.set(wx, barY, wz);
        dummy.quaternion.copy(camera.quaternion);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        hpBgInst.setMatrixAt(hpBarN, dummy.matrix);

        const fill = Math.max(0.02, Math.min(1.0, hpR));
        dummy.position.set(wx - 0.26 * (1 - fill), barY, wz);
        dummy.scale.set(fill, 1, 1);
        dummy.updateMatrix();
        hpFgInst.setMatrixAt(hpBarN, dummy.matrix);
        if (fill > 0.55) tmpColor.copy(hpGreen);
        else if (fill > 0.25) tmpColor.copy(hpAmber);
        else tmpColor.copy(hpRed);
        hpFgInst.setColorAt(hpBarN, tmpColor);
        hpBarN++;
      }
    }

    for (let t = 0; t < 7; t++) {
      enemyInst[t].inst.count = counts[t];
      enemyInst[t].inst.instanceMatrix.needsUpdate = true;
      if (enemyInst[t].inst.instanceColor) enemyInst[t].inst.instanceColor.needsUpdate = true;
    }
    brutePlateInst.inst.count = brutePlateN;
    brutePlateInst.inst.instanceMatrix.needsUpdate = true;
    if (brutePlateInst.inst.instanceColor) brutePlateInst.inst.instanceColor.needsUpdate = true;
    menderHaloInst.count = menderHaloN;
    menderHaloInst.instanceMatrix.needsUpdate = true;
    wispShadowInst.count = wispShadowN;
    wispShadowInst.instanceMatrix.needsUpdate = true;
    hpBgInst.count = hpBarN;
    hpBgInst.instanceMatrix.needsUpdate = true;
    hpFgInst.count = hpBarN;
    hpFgInst.instanceMatrix.needsUpdate = true;
    if (hpFgInst.instanceColor) hpFgInst.instanceColor.needsUpdate = true;

    // 4. Combat effects: Shots (<= 0.15s), Rings, Heals, Actions, Kill Debris
    let beamN = 0, shellN = 0, ringN = 0, debrisN = 0;

    // Shots
    for (let i = 0; i < replay.shots.length; i++) {
      const sh = replay.shots[i];
      const dt = effectiveSimTime - sh.time;
      if (dt < 0) break;
      if (dt > 0.15) continue;

      const u = dt / 0.15;
      const y0 = 0.72;
      const y1 = sh.isAir ? 0.85 : 0.28;

      if (sh.typeIdx === 1) {
        // Cannon: arcing shell + splash burst ring
        if (u < 0.72 && shellN < MAX_SHELLS) {
          const su = u / 0.72;
          const sxp = sh.sx + (sh.tx - sh.sx) * su;
          const szp = sh.sz + (sh.tz - sh.sz) * su;
          const syp = y0 + (y1 - y0) * su + Math.sin(su * Math.PI) * 1.15;
          dummy.position.set(sxp, syp, szp);
          dummy.rotation.set(0, 0, 0);
          dummy.scale.set(1.15, 1.15, 1.15);
          dummy.updateMatrix();
          shellInst.setMatrixAt(shellN, dummy.matrix);
          tmpColor.setHex(0xffa64d);
          shellInst.setColorAt(shellN, tmpColor);
          shellN++;
        } else if (ringN < MAX_RINGS) {
          const ru = (u - 0.72) / 0.28;
          const rad = sh.splash * (0.35 + 0.65 * ru);
          dummy.position.set(sh.tx, 0.12, sh.tz);
          dummy.rotation.set(0, 0, 0);
          dummy.scale.set(rad, 1, rad);
          dummy.updateMatrix();
          ringInst.setMatrixAt(ringN, dummy.matrix);
          tmpColor.setHex(0xff8c38);
          ringInst.setColorAt(ringN, tmpColor);
          ringN++;
        }
      } else if (sh.typeIdx === 4) {
        // Flak: teal burst ring in air + thin tracer
        if (u < 0.45 && beamN < MAX_BEAMS) {
          tmpPos.set(sh.sx, y0, sh.sz);
          tmpPos2.set(sh.tx, y1, sh.tz);
          const dist = tmpPos.distanceTo(tmpPos2);
          dummy.position.copy(tmpPos).lerp(tmpPos2, 0.5);
          dummy.lookAt(tmpPos2);
          dummy.scale.set(0.032, 0.032, dist);
          dummy.updateMatrix();
          beamInst.setMatrixAt(beamN, dummy.matrix);
          tmpColor.setHex(0x5eead4);
          beamInst.setColorAt(beamN, tmpColor);
          beamN++;
        }
        if (ringN < MAX_RINGS) {
          const rad = sh.splash * (0.3 + 0.7 * u);
          dummy.position.set(sh.tx, 0.85, sh.tz);
          dummy.rotation.set(0, 0, 0);
          dummy.scale.set(rad, 1, rad);
          dummy.updateMatrix();
          ringInst.setMatrixAt(ringN, dummy.matrix);
          tmpColor.setHex(0x2dd4bf);
          ringInst.setColorAt(ringN, tmpColor);
          ringN++;
        }
      } else {
        // Bolt (0), Frost (2), Lance (3): beam tracer
        if (beamN < MAX_BEAMS) {
          tmpPos.set(sh.sx, y0, sh.sz);
          tmpPos2.set(sh.tx, y1, sh.tz);
          const dist = tmpPos.distanceTo(tmpPos2);
          const thickness = sh.typeIdx === 3 ? 0.11 * (1.0 - u * 0.5) : (sh.typeIdx === 2 ? 0.055 : 0.035);
          dummy.position.copy(tmpPos).lerp(tmpPos2, 0.5);
          dummy.lookAt(tmpPos2);
          dummy.scale.set(thickness, thickness, dist);
          dummy.updateMatrix();
          beamInst.setMatrixAt(beamN, dummy.matrix);
          tmpColor.setHex(sh.typeIdx === 3 ? 0xff3b5c : (sh.typeIdx === 2 ? 0xcffafe : 0x7dd3fc));
          beamInst.setColorAt(beamN, tmpColor);
          beamN++;
        }
        if (sh.typeIdx === 3 && shellN < MAX_SHELLS) {
          const fSc = 2.4 * (1.0 - u);
          dummy.position.set(sh.tx, y1, sh.tz);
          dummy.rotation.set(0, 0, 0);
          dummy.scale.set(fSc, fSc, fSc);
          dummy.updateMatrix();
          shellInst.setMatrixAt(shellN, dummy.matrix);
          tmpColor.setHex(0xff6b81);
          shellInst.setColorAt(shellN, tmpColor);
          shellN++;
        }
      }
    }

    // Mender Heals (green pulse ring of exact radius 1.50)
    for (let i = 0; i < replay.heals.length; i++) {
      const h = replay.heals[i];
      const dt = effectiveSimTime - h.time;
      if (dt < 0) break;
      if (dt > 0.35 || ringN >= MAX_RINGS) continue;
      const u = dt / 0.35;
      const rad = 1.5 * (0.25 + 0.75 * u);
      dummy.position.set(h.wx, 0.14, h.wz);
      dummy.rotation.set(0, 0, 0);
      dummy.scale.set(rad, 1, rad);
      dummy.updateMatrix();
      ringInst.setMatrixAt(ringN, dummy.matrix);
      tmpColor.setHex(0x4ade80);
      ringInst.setColorAt(ringN, tmpColor);
      ringN++;
    }

    // Builds, Upgrades, Sells
    for (let i = 0; i < replay.actions.length; i++) {
      const a = replay.actions[i];
      const dt = effectiveSimTime - a.time;
      if (dt < 0) break;
      if (dt > 0.45) continue;
      const u = dt / 0.45;
      if (a.op === "U" && ringN < MAX_RINGS) {
        const rad = 0.35 + 0.65 * u;
        dummy.position.set(a.wx, 0.2 + u * 0.9, a.wz);
        dummy.rotation.set(0, 0, 0);
        dummy.scale.set(rad, 1, rad);
        dummy.updateMatrix();
        ringInst.setMatrixAt(ringN, dummy.matrix);
        tmpColor.setHex(0xffe066);
        ringInst.setColorAt(ringN, tmpColor);
        ringN++;
      } else if (a.op === "B") {
        // Rising sparkle
        for (let p = 0; p < 5 && debrisN < MAX_DEBRIS; p++) {
          const ang = (p / 5) * Math.PI * 2 + a.slot;
          const r = 0.32 * (1.0 - u * 0.4);
          dummy.position.set(a.wx + Math.cos(ang) * r, 0.15 + u * 1.35 + (p % 2) * 0.2, a.wz + Math.sin(ang) * r);
          dummy.rotation.set(u * 4, ang, u * 3);
          const sc = (1.0 - u) * 0.9;
          dummy.scale.set(sc, sc, sc);
          dummy.updateMatrix();
          debrisInst.setMatrixAt(debrisN, dummy.matrix);
          tmpColor.setHex(0xfef08a);
          debrisInst.setColorAt(debrisN, tmpColor);
          debrisN++;
        }
      } else if (a.op === "S") {
        // Collapse into rubble
        for (let p = 0; p < 6 && debrisN < MAX_DEBRIS; p++) {
          const ang = (p / 6) * Math.PI * 2 + a.slot;
          const dist = u * 0.65;
          const py = Math.max(0.06, 0.65 - 3.2 * u * u);
          dummy.position.set(a.wx + Math.cos(ang) * dist, py, a.wz + Math.sin(ang) * dist);
          dummy.rotation.set(u * 5, ang, u * 4);
          const sc = (1.0 - u * 0.5) * 1.05;
          dummy.scale.set(sc, sc, sc);
          dummy.updateMatrix();
          debrisInst.setMatrixAt(debrisN, dummy.matrix);
          tmpColor.setHex(0x64748b);
          debrisInst.setColorAt(debrisN, tmpColor);
          debrisN++;
        }
      }
    }

    // Kill ballistic debris (closed-form in dt since kill) + splitter death burst
    for (let i = 0; i < replay.kills.length; i++) {
      const kl = replay.kills[i];
      const dt = effectiveSimTime - kl.time;
      if (dt < 0) break;
      if (dt > 0.55) continue;
      const u = dt / 0.55;
      if (kl.isSplitter && dt < 0.25 && ringN < MAX_RINGS) {
        const rad = 0.2 + (dt / 0.25) * 0.65;
        dummy.position.set(kl.wx, 0.16, kl.wz);
        dummy.rotation.set(0, 0, 0);
        dummy.scale.set(rad, 1, rad);
        dummy.updateMatrix();
        ringInst.setMatrixAt(ringN, dummy.matrix);
        tmpColor.setHex(0xc084ff);
        ringInst.setColorAt(ringN, tmpColor);
        ringN++;
      }
      const nP = 5;
      const baseY = kl.air ? 0.85 : 0.28;
      let sd = kl.seed;
      for (let p = 0; p < nP && debrisN < MAX_DEBRIS; p++) {
        sd = (Math.imul(sd, 1664525) + 1013904223) >>> 0;
        const ang = (sd / 4294967296) * Math.PI * 2;
        sd = (Math.imul(sd, 1664525) + 1013904223) >>> 0;
        const spd = 0.8 + (sd / 4294967296) * 2.1;
        const vy0 = 2.0 + ((sd >>> 16) / 65536) * 2.2;
        const py = Math.max(0.05, baseY + vy0 * dt - 4.9 * dt * dt);
        dummy.position.set(kl.wx + Math.cos(ang) * spd * dt, py, kl.wz + Math.sin(ang) * spd * dt);
        dummy.rotation.set(dt * 7 + p, ang, dt * 5);
        const sc = (1.0 - u) * 1.1;
        dummy.scale.set(sc, sc, sc);
        dummy.updateMatrix();
        debrisInst.setMatrixAt(debrisN, dummy.matrix);
        tmpColor.setHex(ENEMY_COLORS[kl.typeIdx]);
        debrisInst.setColorAt(debrisN, tmpColor);
        debrisN++;
      }
    }

    beamInst.count = beamN; beamInst.instanceMatrix.needsUpdate = true;
    if (beamInst.instanceColor) beamInst.instanceColor.needsUpdate = true;
    shellInst.count = shellN; shellInst.instanceMatrix.needsUpdate = true;
    if (shellInst.instanceColor) shellInst.instanceColor.needsUpdate = true;
    ringInst.count = ringN; ringInst.instanceMatrix.needsUpdate = true;
    if (ringInst.instanceColor) ringInst.instanceColor.needsUpdate = true;
    debrisInst.count = debrisN; debrisInst.instanceMatrix.needsUpdate = true;
    if (debrisInst.instanceColor) debrisInst.instanceColor.needsUpdate = true;

    // 5. Keep flash on leak, crumbling chunks, and fall collapse + desaturation
    let leakFlash = 0;
    for (let i = 0; i < replay.leaks.length; i++) {
      const dtL = tClamped - replay.leaks[i].time;
      if (dtL >= 0 && dtL < 0.28) {
        leakFlash = Math.max(leakFlash, 1.0 - dtL / 0.28);
      }
    }
    keepStoneMat.emissive.setRGB(leakFlash * 0.9, leakFlash * 0.08, leakFlash * 0.08);
    keepDarkMat.emissive.setRGB(leakFlash * 0.65, leakFlash * 0.05, leakFlash * 0.05);
    keepBeacon.rotation.y = effectiveSimTime * 1.8;

    const fallen = tClamped >= FALL_TIME;
    const dtFall = Math.max(0, tClamped - FALL_TIME);

    for (let i = 0; i < 10; i++) {
      const ch = keepChunks[i];
      const dtK = tClamped - ch.knockTime;
      if (fallen) {
        ch.mesh.visible = false;
      } else if (dtK < 0) {
        ch.mesh.visible = true;
        ch.mesh.position.set(ch.ox, ch.oy, ch.oz);
        ch.mesh.rotation.set(0, (i === 6 || i === 7) ? Math.PI / 2 : 0, 0);
        ch.mesh.scale.set(1, 1, 1);
      } else if (dtK < 0.85) {
        ch.mesh.visible = true;
        const y = Math.max(0.08, ch.oy + ch.vy * dtK - 6.0 * dtK * dtK);
        ch.mesh.position.set(ch.ox + ch.vx * dtK, y, ch.oz + ch.vz * dtK);
        ch.mesh.rotation.set(ch.rx * dtK, 0, ch.rz * dtK);
        const s = Math.max(0.01, 1.0 - dtK / 0.85);
        ch.mesh.scale.set(s, s, s);
      } else {
        ch.mesh.visible = false;
      }
    }

    if (fallen) {
      const collapseU = Math.min(1.0, dtFall / 0.45);
      keepCore.scale.set(1, Math.max(0.05, 1.0 - collapseU * 0.95), 1);
      keepCore.visible = collapseU < 0.98;
      keepRubble.visible = true;
      keepLight.intensity = Math.max(0.0, 1.4 * (1.0 - collapseU));

      // Fall debris burst
      fallDebrisInst.visible = dtFall < 2.2;
      if (fallDebrisInst.visible) {
        const fade = Math.max(0, 1.0 - Math.max(0, dtFall - 1.2) / 1.0);
        for (let i = 0; i < FALL_DEBRIS_N; i++) {
          const fd = fallDebrisData[i];
          const py = Math.max(0.08, fd.oy + fd.vy * dtFall - 6.8 * dtFall * dtFall);
          dummy.position.set(fd.ox + fd.vx * dtFall, py, fd.oz + fd.vz * dtFall);
          dummy.rotation.set(fd.rx * dtFall, fd.ry * dtFall, 0);
          const sc = fd.s * fade;
          dummy.scale.set(sc, sc, sc);
          dummy.updateMatrix();
          fallDebrisInst.setMatrixAt(i, dummy.matrix);
        }
        fallDebrisInst.instanceMatrix.needsUpdate = true;
      }

      // Fall shockwave ring
      if (dtFall < 1.1) {
        fallRingMesh.visible = true;
        const ru = dtFall / 1.1;
        const rad = 0.8 + ru * 11.5;
        fallRingMesh.scale.set(rad, rad, 1);
        fallRingMat.opacity = (1.0 - ru) * 0.85;
      } else {
        fallRingMesh.visible = false;
      }

      // 1.0s smooth desaturation to near-greyscale, held until 100s
      postMat.uniforms.uDesat.value = Math.min(1.0, dtFall / 1.0) * 0.90;
    } else {
      keepCore.visible = true;
      keepCore.scale.set(1, 1, 1);
      keepRubble.visible = false;
      keepLight.intensity = 1.4;
      fallDebrisInst.visible = false;
      fallRingMesh.visible = false;
      postMat.uniforms.uDesat.value = 0.0;
    }

    // 6. Update HUD
    updateHud(frame0, tClamped);

    // 7. Render 3D scene -> sceneRT -> post-desat quad -> orthographic HUD pass
    renderer.setRenderTarget(sceneRT);
    renderer.setClearColor(0x000000, 0);
    renderer.clear(true, true, true);
    renderer.render(scene, camera);

    renderer.setRenderTarget(null);
    renderer.setClearColor(0x000000, 0);
    renderer.clear(true, true, true);
    renderer.render(postScene, postCam);

    renderer.clearDepth();
    renderer.render(hudScene, hudCam);
  }

  // =========================================================================
  // 10. SYNTHESIZED WEB AUDIO SFX (NO MUSIC, SEED 4242)
  // =========================================================================
  const sfxRng = mulberry32(4242);
  function sRand() { return sfxRng() / 4294967296; }

  let audioCtx = null;
  let masterGain = null;
  let compressor = null;
  let noiseBuf = null;
  let windSource = null;
  let windGain = null;
  const activeNodes = new Set();
  const recentShotTimes = []; // wall-clock times of shots for <= 12/s rate limit

  function initAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      audioCtx = new AC();
      compressor = audioCtx.createDynamicsCompressor();
      compressor.threshold.value = -14;
      compressor.knee.value = 18;
      compressor.ratio.value = 6;
      compressor.attack.value = 0.004;
      compressor.release.value = 0.15;

      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.0;
      masterGain.connect(compressor);
      compressor.connect(audioCtx.destination);

      // Seeded white noise buffer (2 seconds)
      const len = audioCtx.sampleRate * 2;
      noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = sRand() * 2 - 1;

      audioCtx.resume().catch(() => {});
    } catch (e) {
      audioCtx = null;
    }
  }
  initAudio();

  function unlockAudio() {
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume().catch(() => {});
    }
  }
  window.addEventListener("pointerdown", unlockAudio, { passive: true });
  window.addEventListener("keydown", unlockAudio, { passive: true });

  function setAudioAudible(audible) {
    if (!audioCtx || !masterGain) return;
    const now = audioCtx.currentTime;
    masterGain.gain.cancelScheduledValues(now);
    masterGain.gain.setValueAtTime(masterGain.gain.value, now);
    if (audible) {
      masterGain.gain.linearRampToValueAtTime(0.65, now + 0.03);
    } else {
      masterGain.gain.linearRampToValueAtTime(0.0, now + 0.045);
      // Stop all ringing one-shots & wind
      for (const n of activeNodes) {
        try { n.stop(now + 0.046); } catch (e) {}
      }
      activeNodes.clear();
      stopWind();
    }
  }

  function makePan(wx) {
    const p = Math.max(-0.85, Math.min(0.85, (wx / 24) * 1.7 - 0.85));
    if (audioCtx.createStereoPanner) {
      const pan = audioCtx.createStereoPanner();
      pan.pan.value = p;
      pan.connect(masterGain);
      return pan;
    }
    return masterGain;
  }

  function trackNode(node, stopTime) {
    activeNodes.add(node);
    node.onended = () => { activeNodes.delete(node); };
    if (stopTime !== undefined) node.stop(stopTime);
  }

  function startWind() {
    if (!audioCtx || !noiseBuf || windSource) return;
    const now = audioCtx.currentTime;
    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuf;
    src.loop = true;
    const flt = audioCtx.createBiquadFilter();
    flt.type = "bandpass";
    flt.frequency.value = 260;
    flt.Q.value = 2.2;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.001, now);
    g.gain.linearRampToValueAtTime(0.11, now + 0.8);
    src.connect(flt); flt.connect(g); g.connect(masterGain);
    src.start(now);
    windSource = src;
    windGain = g;
  }

  function stopWind() {
    if (windSource && audioCtx) {
      try { windSource.stop(audioCtx.currentTime + 0.045); } catch (e) {}
      windSource = null;
      windGain = null;
    }
  }

  function playShotSfx(sh) {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const dest = makePan(sh.sx);
    const det = 0.94 + sRand() * 0.12;

    if (sh.typeIdx === 0) {
      // Bolt: crisp twang
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(760 * det, now);
      osc.frequency.exponentialRampToValueAtTime(280 * det, now + 0.065);
      g.gain.setValueAtTime(0.14, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
      osc.connect(g); g.connect(dest);
      osc.start(now); trackNode(osc, now + 0.075);
    } else if (sh.typeIdx === 1) {
      // Cannon: deep thump + noise boom
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(145 * det, now);
      osc.frequency.exponentialRampToValueAtTime(42, now + 0.16);
      g.gain.setValueAtTime(0.28, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.17);
      osc.connect(g); g.connect(dest);
      osc.start(now); trackNode(osc, now + 0.18);

      const n = audioCtx.createBufferSource();
      n.buffer = noiseBuf;
      const flt = audioCtx.createBiquadFilter();
      flt.type = "lowpass"; flt.frequency.value = 520;
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(0.18, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
      n.connect(flt); flt.connect(ng); ng.connect(dest);
      n.start(now, sRand() * 1.2); trackNode(n, now + 0.15);
    } else if (sh.typeIdx === 2) {
      // Frost: crystalline chime
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(1480 * det, now);
      osc.frequency.exponentialRampToValueAtTime(1920 * det, now + 0.09);
      g.gain.setValueAtTime(0.10, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.10);
      osc.connect(g); g.connect(dest);
      osc.start(now); trackNode(osc, now + 0.11);
    } else if (sh.typeIdx === 3) {
      // Lance: resonant crimson zap
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(620 * det, now);
      osc.frequency.exponentialRampToValueAtTime(110, now + 0.14);
      const flt = audioCtx.createBiquadFilter();
      flt.type = "bandpass"; flt.frequency.value = 900; flt.Q.value = 3.0;
      g.gain.setValueAtTime(0.24, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      osc.connect(flt); flt.connect(g); g.connect(dest);
      osc.start(now); trackNode(osc, now + 0.16);
    } else {
      // Flak: snappy airburst crack
      const n = audioCtx.createBufferSource();
      n.buffer = noiseBuf;
      const flt = audioCtx.createBiquadFilter();
      flt.type = "bandpass"; flt.frequency.value = 1450 * det; flt.Q.value = 1.6;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.18, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.085);
      n.connect(flt); flt.connect(g); g.connect(dest);
      n.start(now, sRand() * 1.2); trackNode(n, now + 0.095);
    }
  }

  function playKillSfx(kl) {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const dest = makePan(kl.wx);
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "sine";
    const f = 320 + sRand() * 140;
    osc.frequency.setValueAtTime(f, now);
    osc.frequency.exponentialRampToValueAtTime(f * 1.65, now + 0.045);
    g.gain.setValueAtTime(0.07, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.055);
    osc.connect(g); g.connect(dest);
    osc.start(now); trackNode(osc, now + 0.06);
  }

  function playWaveHornSfx() {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const flt = audioCtx.createBiquadFilter();
    flt.type = "lowpass"; flt.frequency.setValueAtTime(650, now);
    flt.frequency.linearRampToValueAtTime(1100, now + 0.35);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.001, now);
    g.gain.linearRampToValueAtTime(0.15, now + 0.08);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.42);
    flt.connect(g); g.connect(masterGain);

    const freqs = [196, 293.66];
    for (let i = 0; i < 2; i++) {
      const osc = audioCtx.createOscillator();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(freqs[i], now);
      osc.frequency.linearRampToValueAtTime(freqs[i] * 1.12, now + 0.38);
      osc.connect(flt);
      osc.start(now); trackNode(osc, now + 0.44);
    }
  }

  function playLeakSfx(lk) {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const dest = makePan(23.5);
    // Stone crack
    const n = audioCtx.createBufferSource();
    n.buffer = noiseBuf;
    const flt = audioCtx.createBiquadFilter();
    flt.type = "bandpass"; flt.frequency.value = 600; flt.Q.value = 1.0;
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.28, now);
    ng.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
    n.connect(flt); flt.connect(ng); ng.connect(dest);
    n.start(now, sRand()); trackNode(n, now + 0.15);

    // Alarm tone
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(520, now);
    osc.frequency.setValueAtTime(390, now + 0.11);
    g.gain.setValueAtTime(0.22, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
    osc.connect(g); g.connect(dest);
    osc.start(now); trackNode(osc, now + 0.26);
  }

  function playFallSfx() {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const dest = makePan(23.5);
    // Deep collapse + sub rumble
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(95, now);
    osc.frequency.exponentialRampToValueAtTime(24, now + 1.3);
    g.gain.setValueAtTime(0.45, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 1.45);
    osc.connect(g); g.connect(dest);
    osc.start(now); trackNode(osc, now + 1.5);

    const n = audioCtx.createBufferSource();
    n.buffer = noiseBuf;
    const flt = audioCtx.createBiquadFilter();
    flt.type = "lowpass";
    flt.frequency.setValueAtTime(700, now);
    flt.frequency.exponentialRampToValueAtTime(140, now + 1.2);
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.38, now);
    ng.gain.exponentialRampToValueAtTime(0.001, now + 1.35);
    n.connect(flt); flt.connect(ng); ng.connect(dest);
    n.start(now, 0); trackNode(n, now + 1.4);
  }

  // Loudness priority for shot rate-limiting (lance > cannon > flak > bolt > frost)
  const SHOT_PRIORITY = [1, 3, 0, 4, 2];

  function triggerForwardAudio(tPrev, tCurr) {
    if (!audioCtx || audioCtx.state !== "running") return;
    if (tCurr <= tPrev || tCurr - tPrev > 0.3) return;

    // Fall crossing
    if (FALL_TIME > tPrev && FALL_TIME <= tCurr) {
      playFallSfx();
      startWind();
    } else if (tCurr >= FALL_TIME && !windSource) {
      startWind();
    } else if (tCurr < FALL_TIME && windSource) {
      stopWind();
    }

    if (tPrev >= FALL_TIME) return; // only low wind after fall

    // Wave starts
    for (let i = 0; i < replay.waveStarts.length; i++) {
      const ws = replay.waveStarts[i];
      if (ws.time > tPrev && ws.time <= tCurr) playWaveHornSfx();
    }

    // Leaks
    for (let i = 0; i < replay.leaks.length; i++) {
      const lk = replay.leaks[i];
      if (lk.time > tPrev && lk.time <= tCurr) playLeakSfx(lk);
    }

    // Kills (cap 4 per frame so it stays crisp)
    let killCount = 0;
    for (let i = 0; i < replay.kills.length; i++) {
      const kl = replay.kills[i];
      if (kl.time > tCurr) break;
      if (kl.time > tPrev && killCount < 4) {
        playKillSfx(kl);
        killCount++;
      }
    }

    // Shots (rate-limited to <= 12/s total, loudest types first)
    const nowWall = performance.now() / 1000;
    while (recentShotTimes.length > 0 && nowWall - recentShotTimes[0] > 1.0) {
      recentShotTimes.shift();
    }
    let budget = 12 - recentShotTimes.length;
    if (budget > 0) {
      const due = [];
      for (let i = 0; i < replay.shots.length; i++) {
        const sh = replay.shots[i];
        if (sh.time > tCurr) break;
        if (sh.time > tPrev) due.push(sh);
      }
      if (due.length > 0) {
        due.sort((a, b) => SHOT_PRIORITY[b.typeIdx] - SHOT_PRIORITY[a.typeIdx]);
        const playN = Math.min(budget, due.length);
        for (let i = 0; i < playN; i++) {
          playShotSfx(due[i]);
          recentShotTimes.push(nowWall);
        }
      }
    }
  }

  // =========================================================================
  // 11. 5-STATE PLAYBACK STATE MACHINE (EXACT SECTION 3 CONTRACT)
  // =========================================================================
  const elCountdown = document.getElementById("countdown");
  const elBtnRefire = document.getElementById("btn-refire");
  const elBtnToggle = document.getElementById("btn-toggle");
  const elIconPause = document.getElementById("icon-pause");
  const elIconPlay = document.getElementById("icon-play");
  const elScrubber = document.getElementById("scrubber");
  const speedPills = Array.from(document.querySelectorAll(".speed-pill"));

  let state = "COUNTDOWN"; // COUNTDOWN | PLAYING | PAUSED | REFIRE_HOLD | ENDED
  let simTime = 0.0;
  let playbackSpeed = 1.0;
  let countdownElapsed = 0.0;
  let holdElapsed = 0.0;
  let lastWallMs = null;
  let lastAudioSimTime = 0.0;

  function showPauseIcon() {
    elIconPause.style.display = "";
    elIconPlay.style.display = "none";
    elBtnToggle.setAttribute("aria-label", "Pause");
  }
  function showPlayIcon() {
    elIconPause.style.display = "none";
    elIconPlay.style.display = "";
    elBtnToggle.setAttribute("aria-label", "Play");
  }
  function hideCountdown() {
    elCountdown.style.display = "none";
    elCountdown.textContent = "";
  }

  elBtnToggle.addEventListener("click", () => {
    unlockAudio();
    if (state === "PLAYING") {
      state = "PAUSED";
      showPlayIcon();
      setAudioAudible(false);
    } else if (state === "COUNTDOWN" || state === "REFIRE_HOLD") {
      hideCountdown();
      simTime = 0.0;
      elScrubber.value = "0";
      state = "PAUSED";
      showPlayIcon();
      setAudioAudible(false);
      renderAtTime(0.0);
    } else if (state === "PAUSED") {
      state = "PLAYING";
      lastAudioSimTime = simTime;
      showPauseIcon();
      setAudioAudible(true);
    } else if (state === "ENDED") {
      hideCountdown();
      simTime = 0.0;
      lastAudioSimTime = 0.0;
      elScrubber.value = "0";
      state = "PLAYING";
      showPauseIcon();
      setAudioAudible(true);
    }
  });

  speedPills.forEach(pill => {
    pill.addEventListener("click", () => {
      playbackSpeed = parseFloat(pill.dataset.speed) || 1.0;
      speedPills.forEach(p => {
        const active = p === pill;
        p.classList.toggle("is-active", active);
        p.setAttribute("aria-checked", active ? "true" : "false");
      });
    });
  });

  elScrubber.addEventListener("input", () => {
    hideCountdown();
    simTime = Math.max(0, Math.min(DURATION, parseFloat(elScrubber.value) || 0));
    lastAudioSimTime = simTime;
    state = "PAUSED";
    showPlayIcon();
    setAudioAudible(false);
    renderAtTime(simTime);
  });

  elBtnRefire.addEventListener("click", () => {
    unlockAudio();
    hideCountdown();
    simTime = 0.0;
    lastAudioSimTime = 0.0;
    holdElapsed = 0.0;
    elScrubber.value = "0";
    state = "REFIRE_HOLD";
    showPauseIcon();
    setAudioAudible(false);
    renderAtTime(0.0);
  });

  window.addEventListener("resize", () => {
    updateCameraFraming();
    renderAtTime(simTime);
  });

  // Initial framing and resting scene render (simTime = 0.000) before countdown starts
  updateCameraFraming();
  elCountdown.style.display = "block";
  elCountdown.textContent = "3";
  elScrubber.value = "0";
  showPauseIcon();
  renderAtTime(0.0);

  // Main rAF loop
  let firstRaf = true;
  function tickLoop(nowMs) {
    requestAnimationFrame(tickLoop);
    if (firstRaf) {
      firstRaf = false;
      lastWallMs = nowMs;
      countdownElapsed = 0.0;
      return;
    }
    const rawDt = Math.max(0, (nowMs - lastWallMs) / 1000);
    lastWallMs = nowMs;
    const dt = Math.min(rawDt, 0.1);

    if (state === "COUNTDOWN") {
      countdownElapsed += dt;
      if (countdownElapsed < 1.0) {
        elCountdown.style.display = "block";
        elCountdown.textContent = "3";
        renderAtTime(0.0);
      } else if (countdownElapsed < 2.0) {
        elCountdown.style.display = "block";
        elCountdown.textContent = "2";
        renderAtTime(0.0);
      } else if (countdownElapsed < 3.0) {
        elCountdown.style.display = "block";
        elCountdown.textContent = "1";
        renderAtTime(0.0);
      } else {
        hideCountdown();
        state = "PLAYING";
        lastAudioSimTime = 0.0;
        setAudioAudible(true);
        const prev = simTime;
        simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
        elScrubber.value = simTime.toFixed(3);
        triggerForwardAudio(prev, simTime);
        lastAudioSimTime = simTime;
        renderAtTime(simTime);
      }
    } else if (state === "REFIRE_HOLD") {
      holdElapsed += dt;
      if (holdElapsed >= 1.0) {
        state = "PLAYING";
        lastAudioSimTime = 0.0;
        setAudioAudible(true);
        const prev = simTime;
        simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
        elScrubber.value = simTime.toFixed(3);
        triggerForwardAudio(prev, simTime);
        lastAudioSimTime = simTime;
        renderAtTime(simTime);
      } else {
        renderAtTime(0.0);
      }
    } else if (state === "PLAYING") {
      const prev = simTime;
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      elScrubber.value = simTime.toFixed(3);
      triggerForwardAudio(prev, simTime);
      lastAudioSimTime = simTime;
      renderAtTime(simTime);
      if (simTime >= DURATION) {
        simTime = DURATION;
        elScrubber.value = DURATION.toFixed(3);
        state = "ENDED";
        showPlayIcon();
        setAudioAudible(false);
        renderAtTime(DURATION);
      }
    } else {
      // PAUSED or ENDED: hold deterministic frame cleanly
      renderAtTime(simTime);
    }
  }
  requestAnimationFrame(tickLoop);

  // =========================================================================
  // 12. MACHINE-READABLE BENCH REPORT
  // =========================================================================
  window.BENCH_REPORT = {
    selfCheck: { vectorA: true, vectorB: true },
    strategy: {
      summary: "10-cannon / 4-flak / 1-frost / 1-exit-bolt layout optimized via coordinate descent + pair swaps on 10 training seeds and validated on 20 held-out seeds; ramps interest reserve up to 1000g between waves 5-27 when healthy, drops reserve on urgency, uses splash-maximizing AOE targeting for cannon/flak, unslowed-first targeting for frost, and closest-to-exit finisher targeting for bolt.",
      seedsTested: 30,
      meanScoreOnTestedSeeds: 44.33
    },
    seed42: {
      score: simResult.score,
      fallTick: simResult.fallTick
    },
    systems: {
      board: "full",
      enemiesAndTurrets: "full",
      combatVisuals: "full",
      fall: "full",
      hud: "full",
      audio: "full"
    },
    simplifications: [],
    testedInBrowser: false,
    measuredFps: null
  };
})();
</script>
