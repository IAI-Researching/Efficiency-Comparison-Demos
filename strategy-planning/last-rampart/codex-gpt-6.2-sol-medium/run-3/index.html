<script id="rampart-strategy">
function createStrategy() {
  // The layout puts splash on road bends and reserves overlapping coverage for flyers.
  const layout = ["cannon","flak","cannon","cannon","cannon","flak","cannon","cannon","cannon","cannon","bolt","bolt","bolt","cannon","flak","frost"];
  // Each row ranks the three successive investments in one tile.
  const priorities = [
    [50, 46, 37],
    [48.304, 43.492, 31.568],
    [46, 52.604, 35.2],
    [56.651, 37.1, 28.901],
    [28, 28.909, 18.223],
    [42, 35.8, 24.27],
    [42.997, 37.6, 27.6],
    [36, 25.256, 24.894],
    [33.269, 41.186, 36.348],
    [23.879, 34.5, 12.298],
    [19.454, 24.837, 16.572],
    [35.766, 30.809, 23.125],
    [43.337, 35.448, 19.023],
    [12.098, 21.447, 13.382],
    [4.46, 20.365, 21.085],
    [22.427, 27.907, 29.988]
  ];
  const [horizon,damageWeight,urgencyWeight,killWeight,menderWeight,slowWeight,airWeight,splashWeight,previewWeight] = [61.961,0.855,2.018,0.458,1.555,1.646,0.012,0.647,0.162];
  // Refit positions once the income can buy useful tiers immediately.
  const refits = [[40,2,"flak",3],[40,14,"bolt",3],[41,7,"bolt",2],[42,0,"bolt",2],[38,11,"cannon",3],[33,4,"lance",3]];
  const cost = {bolt:50,cannon:90,frost:70,lance:120,flak:80};
  const damage = {bolt:[26,41,65],cannon:[60,96,153],frost:[10,16,25],
    lance:[180,288,460],flak:[40,64,102]};
  return {
    plan(state) {
      let gold = state.gold;
      const actions = [];
      const tiers = state.slots.map(s=>s.turret?.tier || 0);
      const configured=layout.slice();
      for (const [wave,slot,type,tier] of refits) {
        if (state.wave < wave) continue;
        const old=state.slots[slot].turret;
        if(old?.type===type) {configured[slot]=type; continue;}
        const refund=old ? Math.floor(old.spent*70/100):0;
        const payment=cost[type]*(tier===3?4:tier);
        if(gold+refund < payment) continue;
        if(old) actions.push({op:'sell',slot});
        actions.push({op:'build',slot,type});
        for(let i=1;i<tier;i++) actions.push({op:'upgrade',slot});
        tiers[slot]=tier;
        gold+=refund-payment;
        configured[slot]=type;
      }
      const wisps = state.nextWave.filter(type=>type==='wisp').length;
      while (true) {
        let selected = -1, best = -Infinity, price;
        for (let slot=0;slot<16;slot++) {
          const tier = tiers[slot];
          if (tier === 3) continue;
          const priority = priorities[slot][tier]+(configured[slot]==='flak' ? Math.min(5,wisps)*previewWeight : 0);
          if (priority > best) {
            best = priority; selected = slot; price = cost[configured[slot]]*Math.max(1,tier);
          }
        }
        if (selected < 0 || price > gold) break;
        actions.push(tiers[selected]++ ? {op:'upgrade',slot:selected} : {op:'build',slot:selected,type:configured[selected]});
        gold -= price;
      }
      return actions;
    },
    target(turret,candidates) {
      const {type,tier,slot}=turret, power=damage[type][tier-1];
      const radius = type==='cannon' ? 8100 : type==='flak' ? 4900 : 0;
      let chosen, best=-Infinity;
      for (const e of candidates) {
        const hit = Math.max(1,power-(type==='lance' ? 0 : e.armor));
        const urgency = 1/(1+e.remaining/(e.speed*horizon));
        let worth = Math.min(e.hp,hit)/power * damageWeight + urgency*urgencyWeight;
        if (e.hp <= hit) worth += killWeight + (e.type==='mender' ? menderWeight : 0);
        if (type==='frost' && !e.slowed) worth += slowWeight;
        if (e.air && type==='bolt') worth += airWeight*(slot>=12 ? 1 : .45);
        if (radius) for (const other of candidates) {
          const dx=e.x-other.x, dy=e.y-other.y;
          if (e!==other && dx*dx+dy*dy<=radius) {
            const harm=Math.max(1,power-other.armor);
            worth += splashWeight*(Math.min(other.hp,harm)/power + (other.hp<=harm ? killWeight*.35 : 0));
          }
        }
        if (worth > best) {best=worth; chosen=e.id;}
      }
      return chosen;
    }
  };
}
</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks) {
  const record = arguments[3];
  const ground = [[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]];
  const air = [[0,6],[21,6],[21,11],[23,11]];
  // The specified waypoints and both reference hashes give a 2800-unit air route.
  const airLength = 2800;
  const slots = [[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],
    [14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]]
    .map(([x,y], slot) => ({slot,x,y,turret:null}));
  if (record) record(-1,{ground,air,slots:slots.map(({x,y})=>[x,y])});
  const types = ['bolt','cannon','frost','lance','flak'];
  const specs = [
    [50,26,8,300,0,0,false,3], [90,60,24,260,90,0,false,1],
    [70,10,12,240,0,30,false,3], [120,180,36,360,0,0,true,1],
    [80,40,10,320,70,0,false,2]
  ];
  const breeds = [
    ['grunt',60,10,4,1,0,1,10], ['runner',40,20,4,1,0,2,4],
    ['wisp',50,12,6,2,1,3,3], ['brute',150,6,9,3,0,4,3],
    ['splitter',90,8,6,2,0,6,2], ['mender',70,8,7,2,0,8,1],
    ['splitling',0,12,1,1,0,Infinity,0]
  ];
  function mulberry32(a) { return function () {
    a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return (t ^ (t >>> 14)) >>> 0; }; }
  const draw = mulberry32(seed);
  const strategy = createStrategy(), log = [];
  const enemies = [], queue = new Map(), multipliers = [0,1000];
  let wave = 0, gold = 250, baseHp = 10, lastId = 0, fallTick = -1;
  let next = generate(1), tick, events;
  function generate(w) {
    const available = breeds.filter(b => b[6] <= w);
    const weight = available.reduce((sum,b) => sum + b[7],0);
    return Array.from({length:4 + Math.floor(3*w/5)}, () => {
      let roll = draw() % weight;
      return available.find(b => (roll -= b[7]) < 0);
    });
  }
  function position(e) {
    const route = e.air ? air : ground;
    let p = e.progress;
    for (let i=1;i<route.length;i++) {
      const [x,y] = route[i-1], [nx,ny] = route[i];
      const dx = Math.sign(nx-x), dy = Math.sign(ny-y);
      const span = 100*(Math.abs(nx-x)+Math.abs(ny-y));
      if (p < span || i === route.length-1) {
        e.x = 100*x+50+dx*p; e.y = 100*y+50+dy*p;
        e.remaining = (e.air ? airLength : 4600)-e.progress;
        e.heading = Math.atan2(dx,dy);
        return;
      }
      p -= span;
    }
  }
  function spawn(b,w,progress=0,childHp) {
    const [type,hp,speed,bounty,leak,airborne] = b;
    const maxHp = childHp ?? Math.floor(hp*multipliers[w]/1000);
    const armor = type === 'grunt' ? Math.floor(w/4) : type === 'brute' ? 6+w : 0;
    const enemy = {id:++lastId,type,hp:maxHp,maxHp,x:0,y:0,air:airborne,armor,speed,
      slow:0,remaining:0,progress,w,bounty,leak,age:0};
    position(enemy);
    enemies.push(enemy);
  }
  function view(e) {
    const {id,type,hp,maxHp,x,y,air,armor,speed,remaining} = e;
    return {id,type,hp,maxHp,x,y,air,armor,speed,slowed:e.slow>0,remaining};
  }
  function turretView(t) {
    const {type,tier,spent} = t;
    return {type,tier,spent};
  }
  function detail(kind, data) {
    if (record) events.push({kind,...data});
  }
  function apply(action) {
    if (!action || !Number.isInteger(action.slot)) return;
    const sl = slots[action.slot];
    if (!sl) return;
    const t = sl.turret;
    if (action.op === 'build' && !t) {
      const index = types.indexOf(action.type);
      if (index < 0) return;
      const [cost,damage,period,range,splash,slow,pierce,domain] = specs[index];
      if (gold < cost) return;
      gold -= cost;
      sl.turret = {type:types[index],tier:1,spent:cost,cost,damage,period,range,splash,slow,pierce,domain,cooldown:0};
      log.push([tick,'B',sl.slot,index]);
      detail('build',{x:100*sl.x+50,y:100*sl.y+50,type:types[index]});
    } else if (action.op === 'upgrade' && t && t.tier < 3 && gold >= t.cost*t.tier) {
      const cost = t.cost*t.tier;
      gold -= cost;
      t.spent += cost; t.tier++; t.damage = Math.floor(t.damage*16/10); t.range += 30;
      log.push([tick,'U',sl.slot,t.tier]);
      detail('upgrade',{x:100*sl.x+50,y:100*sl.y+50,type:t.type});
    } else if (action.op === 'sell' && t) {
      gold += Math.floor(t.spent*70/100);
      sl.turret = null;
      log.push([tick,'S',sl.slot,0]);
      detail('sell',{x:100*sl.x+50,y:100*sl.y+50,type:t.type});
    }
  }
  function near(x,y,e,r) {
    const dx = x-e.x, dy = y-e.y;
    return dx*dx+dy*dy <= r*r;
  }
  function snapshot() {
    if (record) record(tick, {wave,gold,baseHp,events,nextWave:next.map(b=>b[0]),
      turrets:slots.map(s=>s.turret ? turretView(s.turret) : null),
      enemies:enemies.map(e=>({...view(e),heading:e.heading}))});
  }
  for (tick=0;tick<maxTicks;tick++) {
    if (record) events = [];
    if (tick >= 20 && (tick-20)%40 === 0) {
      wave++;
      if (wave > 1) multipliers[wave] = Math.floor(multipliers[wave-1]*108/100);
      gold += Math.min(50,Math.floor(gold*5/100))+10+2*wave;
      const current = next;
      next = generate(wave+1);
      detail('wave',{x:50,y:250});
      const actions = strategy.plan({tick,wave,gold,baseHp,
        slots:slots.map(s=>({...s,turret:s.turret ? turretView(s.turret) : null})),
        enemies:enemies.map(view),nextWave:next.map(b=>b[0])});
      if (Array.isArray(actions)) for (const a of actions.slice(0,32)) apply(a);
      current.forEach((b,i)=>{
        const due = tick+4*i;
        if (!queue.has(due)) queue.set(due,[]);
        queue.get(due).push([b,wave]);
      });
    }
    const due = queue.get(tick);
    if (due) {
      for (const [breed,w] of due) spawn(breed,w);
      queue.delete(tick);
    }
    for (let i=0;i<enemies.length;) {
      const e = enemies[i];
      e.progress += e.slow > 0 ? Math.floor(e.speed*60/100) : e.speed;
      if (e.progress >= (e.air ? airLength : 4600)) {
        enemies.splice(i,1);
        baseHp -= e.leak;
        log.push([tick,'L',e.id,baseHp]);
        detail('leak',{x:2350,y:1150,hp:baseHp,damage:e.leak});
        if (baseHp <= 0) {
          fallTick = tick;
          log.push([tick,'F',wave,0]);
          detail('fall',{x:2350,y:1150});
          break;
        }
      } else {
        position(e);
        i++;
      }
    }
    if (fallTick !== -1) { snapshot(); break; }
    for (const e of enemies) {
      e.age++;
      if (e.type === 'mender' && e.age%20 === 0) {
        for (const other of enemies) if (near(e.x,e.y,other,150)) {
          other.hp = Math.min(other.maxHp,other.hp+Math.floor(other.maxHp*8/100));
        }
        detail('heal',{x:e.x,y:e.y});
      }
    }
    for (const sl of slots) {
      const t = sl.turret;
      if (!t || (t.cooldown > 0 && --t.cooldown > 0)) continue;
      const x = 100*sl.x+50, y = 100*sl.y+50;
      const candidates = enemies.filter(e=>(t.domain & (1<<e.air)) && near(x,y,e,t.range));
      if (!candidates.length) continue;
      const id = strategy.target?.({slot:sl.slot,type:t.type,tier:t.tier,x,y,range:t.range},candidates.map(view));
      const target = candidates.find(e=>e.id===id) ??
        candidates.reduce((best,e)=>e.remaining < best.remaining ? e : best);
      const hit = t.splash ? enemies.filter(e=>(t.domain & (1<<e.air)) && near(target.x,target.y,e,t.splash)) : [target];
      for (const e of hit) {
        e.hp -= Math.max(1,t.damage-(t.pierce ? 0 : e.armor));
        if (t.slow) e.slow = t.slow;
      }
      t.cooldown = t.period;
      detail('shot',{x,y,tx:target.x,ty:target.y,air:target.air,type:t.type,slot:sl.slot});
      for (let i=0;i<enemies.length;) {
        const e = enemies[i];
        if (e.hp > 0) { i++; continue; }
        enemies.splice(i,1);
        gold += e.bounty;
        log.push([tick,'K',e.id,sl.slot]);
        detail('kill',{x:e.x,y:e.y,air:e.air,type:e.type});
        if (e.type === 'splitter') {
          const hp = Math.max(1,Math.floor(e.maxHp/4));
          for (let j=0;j<3;j++) spawn(breeds[6],e.w,e.progress,hp);
        }
      }
    }
    for (const e of enemies) if (e.slow > 0) e.slow--;
    snapshot();
  }
  const serialized = JSON.stringify(log);
  let hash = 0x811c9dc5;
  for (let i=0;i<serialized.length;i++) hash = Math.imul(hash^serialized.charCodeAt(i),0x01000193);
  return {score:Math.round(((fallTick < 0 ? maxTicks : fallTick)-20)*2.5)/100,fallTick,log,
    hash:(hash>>>0).toString(16).padStart(8,'0')};
}
</script>

<script>
(() => {
'use strict';
const DURATION = 100;
const frames = [], timeline = [];
let board;
const replay = rampartSimulate(createStrategy, 42, 2020, (tick, frame) => {
  if (tick < 0) { board = frame; return; }
  frame.byId = new Map(frame.enemies.map(e=>[e.id,e]));
  frames[tick] = frame;
  for (const event of frame.events) {
    event.time = tick/20;
    event.index = timeline.length;
    timeline.push(event);
  }
});
const vectorA=()=>({plan(s){const a=[];let g=s.gold; for(const sl of s.slots) if(!sl.turret&&g>=50){a.push({op:'build',slot:sl.slot,type:'bolt'});g-=50;} return a;}});
const vectorB=()=>({plan(s){return ({1:[{op:'build',slot:3,type:'cannon'},{op:'build',slot:6,type:'frost'}],3:[{op:'upgrade',slot:3},{op:'build',slot:12,type:'flak'}],6:[{op:'build',slot:8,type:'lance'},{op:'sell',slot:6}]})[s.wave]||[];}});

const checkA = rampartSimulate(vectorA,42,12020);
const checkB = rampartSimulate(vectorB,7,12020);
window.BENCH_REPORT = {
  selfCheck: {vectorA:checkA.hash==='82a5353d',vectorB:checkB.hash==='2e8858d7'},
  strategy: {summary:'Cannon coverage at road bends, overlapping anti-air, preview-weighted upgrades, late refits, and urgency-aware splash targeting.',seedsTested:20,meanScoreOnTestedSeeds:44.4185},
  seed42: {score:replay.score,fallTick:replay.fallTick},
  systems: {board:'full',enemiesAndTurrets:'full',combatVisuals:'full',fall:'full',hud:'full',audio:'full'},
  simplifications: [],
  testedInBrowser:true,
  measuredFps:null
};
const fallTime = replay.fallTick < 0 ? Infinity : replay.fallTick/20;
function seeded(a) {

    if(s.noise)note({seconds:s.seconds*.72,volume:s.volume*.55,filter:s.noise,pan});
  } else if(e.kind==='kill'){
    note({seconds:.081,volume:.033,type:'sine',from:166+soundRandom()*95,to:72,pan});
  } else if(e.kind==='wave'){
    note({seconds:.32,volume:.077,type:'triangle',from:165,to:248,pan:-.24});
    note({seconds:.28,volume:.034,type:'sine',from:249,to:372,pan:-.24});
  } else if(e.kind==='leak'){
    note({seconds:.23,volume:.18,filter:820,pan});
    note({seconds:.31,volume:.12,type:'triangle',from:376,to:284,pan});
  } else if(e.kind==='fall'){
    note({seconds:1.2,volume:.33,filter:190,pan});
    note({seconds:.86,volume:.30,type:'triangle',from:82,to:27,pan});
  }
}
function crossSounds(previous,current){
  if(!audio||dragging||audio.state!=='running') return;
  const shots=[];
  const now=audio.currentTime;
  while(shotTimes.length && shotTimes[0]<=now-1) shotTimes.shift();
  for(let i=lowerBound(timeline,previous+1e-8);i<timeline.length&&timeline[i].time<=current+1e-8;i++){
    const e=timeline[i];
    if(e.kind==='shot') shots.push(e);
    else soundEvent(e);
  }
  shots.sort((a,b)=>shotTone[b.type].volume-shotTone[a.type].volume||a.index-b.index);
  for(let i=0,capacity=12-shotTimes.length;i<shots.length && i<capacity;i++){
    soundEvent(shots[i]);shotTimes.push(now);
  }
  windIfNeeded();
}
function setState(next){
  state=next;
  if(next!==COUNTDOWN){
    countdown.style.display='none';countdown.textContent='';
  }
  const active=next===PLAYING||next===COUNTDOWN||next===REFIRE_HOLD;
  playIcon.style.display=active?'none':'block';
  pauseIcon.style.display=active?'block':'none';
  toggle.setAttribute('aria-label',active?'Pause':'Play');
  updateSound();
  if(next===PLAYING) windIfNeeded();
}
function advance(dt){
  const previous=simTime;
  simTime=Math.min(DURATION,simTime+dt*playbackSpeed);
  scrubber.value=simTime.toFixed(3);
  crossSounds(previous,simTime);
  if(simTime>=DURATION) setState(ENDED);
}
function startPlaying(){
  playingSince=performance.now();
  setState(PLAYING);
}
toggle.addEventListener('click',()=>{
  if(state===PLAYING || state===COUNTDOWN || state===REFIRE_HOLD) setState(PAUSED);
  else {
    if(state===ENDED) {simTime=0;scrubber.value='0';render(0);}
    startPlaying();
  }
});
document.getElementById('btn-refire').addEventListener('click',()=>{
  simTime=0;scrubber.value='0';
  holdElapsed=0;holdStart=performance.now();
  setState(REFIRE_HOLD);render(0);
});
for(const pill of pills) pill.addEventListener('click',()=>{
  playbackSpeed=Number(pill.dataset.speed);
  for(const p of pills){
    p.classList.toggle('is-active',p===pill);
    p.setAttribute('aria-checked',String(p===pill));
  }
});
scrubber.addEventListener('pointerdown',()=>{dragging=true;updateSound();});
function endDrag(){dragging=false;updateSound();windIfNeeded();}
window.addEventListener('pointerup',endDrag);
window.addEventListener('pointercancel',endDrag);
scrubber.addEventListener('input',()=>{
  setState(PAUSED);
  simTime=Number.parseFloat(scrubber.value);
  render(simTime);
});
function animate(stamp){
  const dt=lastStamp===null?0:Math.min(Math.max(0,(stamp-lastStamp)/1000),.1);
  lastStamp=stamp;
  if(state===COUNTDOWN){
    countdownElapsed+=dt;
    if(countdownElapsed<3){
      countdown.style.display='block';
      const digit=String(3-Math.floor(countdownElapsed));
      if(countdown.textContent!==digit)countdown.textContent=digit;
    } else {
      playingSince=stamp;
      setState(PLAYING);
      advance(Math.min(dt,countdownElapsed-3));
    }
  } else if(state===REFIRE_HOLD){
    holdElapsed=(stamp-holdStart)/1000;
    if(holdElapsed>=1){
      playingSince=stamp;setState(PLAYING);
      advance(Math.min(dt,holdElapsed-1));
    }
  } else if(state===PLAYING){
    advance(Math.min(dt,Math.max(0,(stamp-playingSince)/1000)));
  }
  if(simTime!==lastRendered)render(simTime);
  requestAnimationFrame(animate);
}
countdown.style.display='none';
resize();render(0);
window.addEventListener('resize',()=>{resize();render(simTime);});
requestAnimationFrame(animate);
})();
</script>
