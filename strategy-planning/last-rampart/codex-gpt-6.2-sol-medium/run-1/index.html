<script id="rampart-strategy">
function createStrategy() {
  const layout = [
    "cannon", "cannon", "cannon", "cannon", "cannon", "flak", "cannon", "cannon",
    "flak", "frost", "flak", "cannon", "bolt", "bolt", "bolt", "flak"
  ];
  const rebuilds = [[46,13,"lance"],[37,9,"cannon"],[42,2,"flak"]];
  // Each purchase encodes its slot plus 16 times its current tier.
  const order = [
    1, 15, 2, 3, 12, 5, 9, 19, 4, 7, 18, 23,
    10, 14, 11, 34, 0, 31, 8, 16, 32, 35, 24, 27,
    17, 13, 26, 33, 6, 22, 38, 21, 30, 39, 20, 28,
    36, 42, 43, 37, 44, 29, 40, 25, 46, 47, 45, 41
  ];
  const prices = {bolt:50,cannon:90,frost:70,lance:120,flak:80};
  const profiles = {bolt:[26,41,65,8,0],cannon:[60,96,153,24,90],frost:[10,16,25,12,0],
    lance:[180,288,460,36,0],flak:[40,64,102,10,70]};
  function plan(s) {
    const actions=[];
    let gold=s.gold;
    const tiers=s.slots.map(p=>p.turret?.tier||0);
    const active = layout.slice();
    for (const [from, slot, type] of rebuilds) {
      if (s.wave<from) continue;
      if (tiers[slot] && s.slots[slot].turret.type!==type) {
        if (gold+Math.floor(s.slots[slot].turret.spent*.7)<prices[type]) continue;
        actions.push({op:"sell",slot});
        gold+=Math.floor(s.slots[slot].turret.spent*.7);
        actions.push({op:"build",slot,type});
        gold-=prices[type];
        tiers[slot]=1;
      }
      active[slot]=type;
    }
    for (const step of order) {
      const slot=step%16, wanted=1+Math.floor(step/16), type=active[slot];
      if (tiers[slot]!==wanted-1) continue;
      const cost=prices[type]*Math.max(1,tiers[slot]);
      if (gold<cost) break;
      actions.push(wanted===1?{op:"build",slot,type}:{op:"upgrade",slot});
      tiers[slot]++;
      gold-=cost;
    }
    return actions;
  }
  function target(t,c) {
    if (c.length===1) return c[0].id;
    const profile=profiles[t.type];
    const period=profile[3], splash=profile[4], damage=profile[t.tier-1];
    const splash2=splash*splash, pierce=t.type==="lance";
    let best=-Infinity, id=c[0].id;
    function value(e) {
      const hit=Math.max(1,damage-(pierce?0:e.armor));
      const time=e.remaining/e.speed;
      const danger=1+6.25/(1+time/40);
      const heal=e.type==="mender"?5.53131103515625:1;
      const kill=e.hp<=hit?0.45+Math.min(0.20,(hit-e.hp)/hit*0.1):0;
      const finish=period>15 ? Math.min(0.35,hit/e.hp*0.13) : Math.min(0.5,hit/e.hp*0.25);
      return danger*heal*(Math.min(1,e.hp/hit) + kill + finish + (t.type==="frost"&&!e.slowed?2.25:0));
    }
    const values=c.map(value);
    for (let i=0;i<c.length;i++) {
      const e=c[i];
      let v=values[i];
      if (splash) for (let j=0;j<c.length;j++) {
        if (i!==j&&(e.x-c[j].x)**2+(e.y-c[j].y)**2<=splash2) v+=values[j];
      }
      if (v>best) {best=v; id=e.id;}
    }
    return id;
  }
  return {plan,target};
}
</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks, record = null) {
  // The air waypoints total 2800, which reproduces both reference vectors.
  const routes = [
    [[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]],
    [[0,6],[21,6],[21,11],[23,11]]
  ].map(points => {
    let length=0;
    return points.slice(1).map(([x,y],i) => {
      const [a,b]=points[i], start=length;
      length+=100*(Math.abs(x-a)+Math.abs(y-b));
      return {start,end:length,x:a*100+50,y:b*100+50,dx:Math.sign(x-a),dy:Math.sign(y-b)};
    });
  });
  const slots=[[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],[14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]]
    .map(([x,y],slot)=>({slot,x:x*100+50,y:y*100+50,turret:null}));
  const weapons=[
    ["bolt",50,26,8,300,0,0,false,3],["cannon",90,60,24,260,90,0,false,1],
    ["frost",70,10,12,240,0,30,false,3],["lance",120,180,36,360,0,0,true,1],["flak",80,40,10,320,70,0,false,2]
  ].map(([type,cost,damage,period,range,splash,slow,pierce,domains],index)=>({type,cost,damage,period,range,splash,slow,pierce,domains,index}));
  const monsters=[
    ["grunt",60,10,4,1,0,1,10],["runner",40,20,4,1,0,2,4],["wisp",50,12,6,2,1,3,3],
    ["brute",150,6,9,3,0,4,3],["splitter",90,8,6,2,0,6,2],["mender",70,8,7,2,0,8,1],
    ["splitling",0,12,1,1,0,Infinity,0]
  ].map(([type,hp,speed,bounty,leak,air,first,weight])=>({type,hp,speed,bounty,leak,air,first,weight}));
  function mulberry32(a) { return function () {
    a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return (t ^ (t >>> 14)) >>> 0; }; }
  const draw=mulberry32(seed), strategy=createStrategy(), log=[], enemies=[], spawns=new Map(), multipliers=[0,1000];
  let wave=0, gold=250, baseHp=10, tick=0, fallTick=-1, nextId=1;
  function compose(w) {
    const pool=monsters.filter(e=>e.first<=w), total=pool.reduce((a,e)=>a+e.weight,0);
    return Array.from({length:4+Math.floor(3*w/5)},()=>{
      let r=draw()%total;
      for (const e of pool) { if (r<e.weight) return e; r-=e.weight; }
    });
  }
  let upcoming=compose(1);
  function position(e) {
    const route=routes[e.air], last=route[route.length-1];
    const s=route.find(s=>e.progress<s.end)||last, offset=Math.min(e.progress,s.end)-s.start;
    e.x=s.x+s.dx*offset; e.y=s.y+s.dy*offset;
    e.dx=s.dx; e.dy=s.dy; e.remaining=last.end-e.progress;
  }
  function spawn(kind,w,progress=0,maxHp=Math.floor(kind.hp*multipliers[w]/1000)) {
    const {type,speed,bounty,leak,air}=kind;
    const e={id:nextId++,type,speed,bounty,leak,air,w,progress,maxHp,hp:maxHp,age:0,slow:0,
      armor:type==="grunt"?Math.floor(w/4):type==="brute"?6+w:0};
    position(e);
    enemies.push(e);
  }
  function view({id,type,hp,maxHp,x,y,air,armor,speed,slow,remaining}) {
    return {id,type,hp,maxHp,x,y,air,armor,speed,slowed:slow>0,remaining};
  }
  const d2=(a,b)=>(a.x-b.x)**2+(a.y-b.y)**2;
  const hits=(t,e)=>t.domains&(1<<e.air);
  for (;tick<maxTicks;tick++) {
    const effects=record?[]:null;
    if (tick>=20 && (tick-20)%40===0) {
      wave++;
      if (wave>1) multipliers[wave]=Math.floor(multipliers[wave-1]*108/100);
      gold+=Math.min(50,Math.floor(gold*5/100))+10+2*wave;
      const current=upcoming;
      upcoming=compose(wave+1);
      const actions=strategy.plan({tick,wave,gold,baseHp,
        slots:slots.map(({slot,x,y,turret})=>({slot,x,y,turret:turret?{type:turret.type,tier:turret.tier,spent:turret.spent}:null})),
        enemies:enemies.map(view),nextWave:upcoming.map(e=>e.type)});
      effects?.push({kind:"wave"});
      if (Array.isArray(actions)) for (const a of actions.slice(0,32)) {
        if (!a || !Number.isInteger(a.slot) || !slots[a.slot]) continue;
        const pad=slots[a.slot], t=pad.turret;
        if (a.op==="build" && !t) {
          const weapon=weapons.find(w=>w.type===a.type);
          if (!weapon || gold<weapon.cost) continue;
          gold-=weapon.cost;
          pad.turret={...weapon,tier:1,spent:weapon.cost,cooldown:0,aim:Math.PI};
          log.push([tick,"B",pad.slot,weapon.index]);
          effects?.push({kind:"build",x:pad.x,y:pad.y,type:weapon.type});
        } else if (a.op==="upgrade" && t && t.tier<3) {
          const cost=t.cost*t.tier;
          if (gold<cost) continue;
          gold-=cost; t.spent+=cost; t.tier++; t.range+=30;
          t.damage=Math.floor(t.damage*16/10);
          log.push([tick,"U",pad.slot,t.tier]);
          effects?.push({kind:"upgrade",x:pad.x,y:pad.y,type:t.type});
        } else if (a.op==="sell" && t) {
          gold+=Math.floor(t.spent*70/100);
          pad.turret=null;
          log.push([tick,"S",pad.slot,0]);
          effects?.push({kind:"sell",x:pad.x,y:pad.y,type:t.type});
        }
      }
      current.forEach((kind,i)=>{
        const due=tick+4*i;
        if (!spawns.has(due)) spawns.set(due,[]);
        spawns.get(due).push([kind,wave]);
      });
    }
    const due=spawns.get(tick);
    if (due) { for (const [kind,w] of due) spawn(kind,w); spawns.delete(tick); }
    for (let i=0;i<enemies.length;) {
      const e=enemies[i];
      e.progress+=e.slow?Math.floor(e.speed*60/100):e.speed;
      position(e);
      if (e.remaining>0) { i++; continue; }
      enemies.splice(i,1);
      baseHp-=e.leak;
      log.push([tick,"L",e.id,baseHp]);
      effects?.push({kind:"leak",x:e.x,y:e.y,hp:baseHp,damage:e.leak});
      if (baseHp<=0) {
        fallTick=tick;
        log.push([tick,"F",wave,0]);
        effects?.push({kind:"fall",x:e.x,y:e.y});
        break;
      }
    }
    if (fallTick<0) {
      for (const e of enemies) {
        if (++e.age%20!==0 || e.type!=="mender") continue;
        for (const ally of enemies) if (d2(e,ally)<=22500) ally.hp=Math.min(ally.maxHp,ally.hp+Math.floor(ally.maxHp*8/100));
        effects?.push({kind:"heal",x:e.x,y:e.y});
      }
      for (const pad of slots) {
        const t=pad.turret;
        if (!t || (t.cooldown>0 && --t.cooldown>0)) continue;
        const candidates=enemies.filter(e=>hits(t,e)&&d2(pad,e)<=t.range**2);
        if (!candidates.length) continue;
        const id=strategy.target?.({slot:pad.slot,type:t.type,tier:t.tier,x:pad.x,y:pad.y,range:t.range},candidates.map(view));
        const target=candidates.find(e=>e.id===id)||candidates.reduce((a,b)=>b.remaining<a.remaining?b:a);
        t.cooldown=t.period;
        if (effects) t.aim=Math.atan2(target.x-pad.x,target.y-pad.y);
        effects?.push({kind:"shot",type:t.type,x:pad.x,y:pad.y,tx:target.x,ty:target.y,air:target.air});
        const victims=t.splash?enemies.filter(e=>hits(t,e)&&d2(target,e)<=t.splash**2):[target];
        for (const e of victims) {
          e.hp-=Math.max(1,t.damage-(t.pierce?0:e.armor));
          if (t.slow) e.slow=t.slow;
        }
        for (let i=0;i<enemies.length;) {
          const e=enemies[i];
          if (e.hp>0) { i++; continue; }
          enemies.splice(i,1);
          gold+=e.bounty;
          log.push([tick,"K",e.id,pad.slot]);
          effects?.push({kind:"kill",type:e.type,x:e.x,y:e.y,air:e.air});
          if (e.type==="splitter") for (let j=0;j<3;j++) spawn(monsters[6],e.w,e.progress,Math.max(1,Math.floor(e.maxHp/4)));
        }
      }
      for (const e of enemies) if (e.slow>0) e.slow--;
    }
    if (record) record(tick,{wave,gold,baseHp,next:upcoming.map(e=>e.type),
      turrets:slots.map(p=>p.turret&&{type:p.turret.type,tier:p.turret.tier,aim:p.turret.aim}),
      enemies:enemies.map(e=>({...view(e),dx:e.dx,dy:e.dy,age:e.age})),effects});
    if (fallTick>=0) break;
  }
  const data=JSON.stringify(log);
  let hash=0x811c9dc5;
  for (let i=0;i<data.length;i++) hash=Math.imul(hash^data.charCodeAt(i),0x01000193);
  return {score:Math.round(((fallTick<0?maxTicks:fallTick)-20)*2.5)/100,fallTick,log,hash:(hash>>>0).toString(16).padStart(8,"0")};
}
</script>

<script>
(() => {
  "use strict";
  const DURATION = 100;
  const frames = [];
  const replay = rampartSimulate(createStrategy,42,2020,(tick,state)=>{frames[tick]=state;});
  const fallTime = replay.fallTick < 0 ? Infinity : replay.fallTick/20;
  const vectorA = () => ({plan(s) {
    const actions=[]; let gold=s.gold;
    for (const pad of s.slots) if (!pad.turret && gold>=50) {
      gold-=50; actions.push({op:"build",slot:pad.slot,type:"bolt"});
    }
    return actions;
  }});
  const vectorB = () => ({plan({wave}) {
    switch (wave) {
      case 1: return [{op:"build",slot:3,type:"cannon"},{op:"build",slot:6,type:"frost"}];
      case 3: return [{op:"upgrade",slot:3},{op:"build",slot:12,type:"flak"}];
      case 6: return [{op:"build",slot:8,type:"lance"},{op:"sell",slot:6}];
      default: return [];
    }
  }});
  const checkA=rampartSimulate(vectorA,42,12020), checkB=rampartSimulate(vectorB,7,12020);
  // Playback measured in WebKit at 1920 × 1080, DPR 2, over 2.6 s of late-wave combat.
  window.BENCH_REPORT = {
    selfCheck:{vectorA:checkA.hash==="82a5353d",vectorB:checkB.hash==="2e8858d7"},
    strategy:{summary:"Route-specific spending and late rebuilds, with splash-aware targeting that favors urgent threats and menders.",seedsTested:20,meanScoreOnTestedSeeds:46.265},
    seed42:{score:replay.score,fallTick:replay.fallTick},
    systems:{board:"full",enemiesAndTurrets:"full",combatVisuals:"full",fall:"full",hud:"full",audio:"full"},
    simplifications:[],testedInBrowser:true,measuredFps:60
  };

  const T=THREE;
  const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('stage'), antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.0;
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=T.PCFSoftShadowMap;
  renderer.autoClear=false;
  const scene=new T.Scene(), camera=new T.PerspectiveCamera(36,1,0.1,500);
  const hud=new T.Scene(), hudCamera=new T.OrthographicCamera(0,1,1,0,.1,30);
  hudCamera.position.z=10;
  const key=new T.DirectionalLight(0xffc38b,2.0);
  key.position.set(4,17,4);
  key.target.position.set(12,0,7);
  key.castShadow=true;
  Object.assign(key.shadow.camera,{left:-16,right:16,top:14,bottom:-14,near:1,far:44});
  key.shadow.mapSize.set(2048,2048);
  key.shadow.camera.updateProjectionMatrix();
  key.shadow.bias=-.00023;

  function voice(source,n,duration,gain,pan,filter=null) {
    const env=audio.createGain(), stereo=audio.createStereoPanner();
    stereo.pan.value=pan;
    env.gain.setValueAtTime(.0001,n);
    env.gain.exponentialRampToValueAtTime(gain,n+Math.min(.022,duration*.16));
    env.gain.exponentialRampToValueAtTime(.0001,n+duration);
    if (filter) source.connect(filter).connect(env); else source.connect(env);
    env.connect(stereo).connect(master);
    sounding.add(source);
    source.onended=()=>{
      sounding.delete(source);
      source.disconnect(); filter?.disconnect(); env.disconnect(); stereo.disconnect();
    };
    return source;
  }
  function tone(n,length,pitch,end,level,kind,pan) {
    const source=audio.createOscillator();
    source.type=kind;
    source.frequency.setValueAtTime(pitch,n);
    source.frequency.exponentialRampToValueAtTime(end,n+length*.84);
    voice(source,n,length,level,pan).start(n);
    source.stop(n+length+.005);
  }
  function grain(n,length,freq,level,pan,offset) {
    const source=audio.createBufferSource(), filter=audio.createBiquadFilter();
    source.buffer=soundNoise;
    filter.type="lowpass";
    filter.frequency.value=freq;
    voice(source,n,length,level,pan,filter).start(n,offset);
    source.stop(n+length+.006);
  }
  const shotVoices={
    bolt:[.071,450,155,.045,"triangle",0], cannon:[.16,112,41,.17,"sine",860],
    frost:[.115,1070,380,.054,"sine",1900], lance:[.187,510,72,.137,"triangle",2100],
    flak:[.12,171,63,.106,"triangle",1240]
  };
  function playSound(e,stamp) {
    const n=audio.currentTime, pan=e.x===undefined?0:clamp((e.x/2400-.5)*1.7,-.85,.85);
    const offset=generator(4242+stamp*433)()*.52;
    switch (e.kind) {
      case "shot": {
        const [length,pitch,end,level,kind,filter]=shotVoices[e.type];
        tone(n,length,pitch,end,level,kind,pan);
        if (filter) grain(n,length*.82,filter,level*.47,pan,offset);
        break;
      }
      case "kill":
        tone(n,.077,165+79*offset,59,.023,"sine",pan);
        break;
      case "wave":
        tone(n,.34,134,224,.095,"triangle",pan);
        tone(n+.08,.29,202,335,.064,"sine",pan);
        break;
      case "leak":
        grain(n,.31,1150,.135,pan,offset);
        tone(n+.04,.35,344,259,.085,"triangle",pan);
        break;
      case "fall":
        tone(n,.97,84,23,.24,"sine",pan);
        grain(n,1.55,570,.28,pan,offset);
        grain(n+.18,1.26,110,.24,pan,offset);
        break;
    }
  }
  function startWind() {
    if (wind||!audio) return;
    wind=audio.createBufferSource();
    const filter=audio.createBiquadFilter(), gain=audio.createGain();
    wind.buffer=soundNoise; wind.loop=true; wind.playbackRate.value=.76;
    filter.type="bandpass"; filter.frequency.value=176; filter.Q.value=.58;
    gain.gain.setValueAtTime(.0001,audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(.033,audio.currentTime+.65);
    wind.connect(filter).connect(gain).connect(master);
    sounding.add(wind);
    wind.onended=({target})=>{sounding.delete(target);target.disconnect();filter.disconnect();gain.disconnect();};
    wind.start();
  }
  function audioAcross(start,end) {
    if (!audio||audio.state!=="running"||scrubbing) return;
    const now=audio.currentTime;
    while (shotClock.length&&shotClock[0]<=now-1) shotClock.shift();
    const pending=[];
    for (let k=Math.floor(start*20+1e-8)+1;k<=Math.min(Math.floor(end*20+1e-8),frames.length-1);k++) {
      frames[k].effects.forEach((e,index)=>{
        const stamp=k*103+index;
        if (e.kind==="shot") pending.push([e,stamp]);
        else playSound(e,stamp);
      });
    }
    pending.sort(([a],[b])=>shotVoices[b.type][3]-shotVoices[a.type][3]);
    for (const [e,stamp] of pending) {
      if (shotClock.length>=12) break;
      playSound(e,stamp);
      shotClock.push(now);
    }
    if (end>=fallTime+1.45) startWind();
  }

  const COUNTDOWN="COUNTDOWN", PLAYING="PLAYING", PAUSED="PAUSED", REFIRE_HOLD="REFIRE_HOLD", ENDED="ENDED";
  const countdown=document.getElementById("countdown"), slider=document.getElementById("scrubber");
  const toggle=document.getElementById("btn-toggle"), refire=document.getElementById("btn-refire");
  const iconPlay=document.getElementById("icon-play"), iconPause=document.getElementById("icon-pause");
  const pills=Array.from(document.querySelectorAll(".speed-pill"));
  let state=COUNTDOWN, simTime=0, playbackSpeed=1, countdownElapsed=0, holdElapsed=0, lastWall=null, scrubbing=false;
  function hideCountdown() {countdown.style.display="none";countdown.textContent="";}
  function controls() {
    const running=state===COUNTDOWN||state===PLAYING||state===REFIRE_HOLD;
    iconPlay.style.display=running?"none":"block";
    iconPause.style.display=running?"block":"none";
    toggle.setAttribute("aria-label",running?"Pause":"Play");
  }
  function transition(to) {
    if (to!==COUNTDOWN) hideCountdown();
    if ((state===PLAYING)!==(to===PLAYING)) activateAudio(to===PLAYING&&!scrubbing);
    state=to;
    controls();
  }
  function advance(dt) {
    const prior=simTime;
    simTime=Math.min(DURATION,simTime+dt*playbackSpeed);
    slider.value=simTime.toFixed(3);
    if (simTime>prior) audioAcross(prior,simTime);
    if (simTime>=DURATION) transition(ENDED);
  }
  function tick(wall) {
    const rawDt=lastWall===null?0:Math.max(0,(wall-lastWall)/1000);
    const dt=Math.min(rawDt,.1);
    lastWall=wall;
    if (state===COUNTDOWN) {
      countdownElapsed+=dt;
      if (countdownElapsed>=3) {
        transition(PLAYING);
        advance(countdownElapsed-3);
      } else {
        const digit=String(3-Math.floor(countdownElapsed));
        if (countdown.textContent!==digit) {
          countdown.style.display="block";
          countdown.textContent=digit;
        }
      }
    } else if (state===REFIRE_HOLD) {
      holdElapsed+=rawDt;
      if (holdElapsed>=1) {
        transition(PLAYING);
        advance(Math.min(dt,holdElapsed-1));
      }
    } else if (state===PLAYING) advance(dt);
    if (simTime!==lastRender) render(simTime);
    requestAnimationFrame(tick);
  }
  toggle.addEventListener("click",()=>{
    if (state===PLAYING||state===COUNTDOWN||state===REFIRE_HOLD) {
      transition(PAUSED);
    } else {
      if (state===ENDED) {
        simTime=0; slider.value="0"; render(0);
      }
      lastWall=performance.now();
      transition(PLAYING);
    }
  });
  refire.addEventListener("click",()=>{
    simTime=0; slider.value="0"; holdElapsed=0;
    lastWall=performance.now();
    transition(REFIRE_HOLD);
    render(0);
  });
  for (const pill of pills) pill.addEventListener("click",()=>{
    playbackSpeed=Number(pill.dataset.speed);
    for (const other of pills) {
      other.classList.toggle("is-active",other===pill);
      other.setAttribute("aria-checked",String(other===pill));
    }
  });
  slider.addEventListener("pointerdown",()=>{
    scrubbing=true;
    activateAudio(false);
  });
  function releaseScrubber() {
    if (!scrubbing) return;
    scrubbing=false;
    if (state===PLAYING) activateAudio(true);
  }
  window.addEventListener("pointerup",releaseScrubber);
  window.addEventListener("pointercancel",releaseScrubber);
  slider.addEventListener("input",()=>{
    transition(PAUSED);
    simTime=parseFloat(slider.value);
    render(simTime);
  });
  window.addEventListener("resize",()=>{
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    fitCamera(); resizeHud(); render(simTime);
  });
  hideCountdown();
  fitCamera();
  resizeHud();
  render(0);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
