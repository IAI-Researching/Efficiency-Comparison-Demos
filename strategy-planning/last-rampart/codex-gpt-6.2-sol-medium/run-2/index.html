<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last Rampart</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>

  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>

  <input id="scrubber" type="range" min="0" max="100" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script id="rampart-strategy">
function createStrategy() {
  const profile = {"layout": "4304111111112044", "early": 2.45, "splash": 2.47, "lance": 1.6, "flak": 2.05, "frost": 1.02, "open": [], "openType": 0, "up2": 1, "up3": 1.38, "flex": 0.87, "wait": 0.55, "openWave": 8.02, "swap": 12.5, "urgency": 2.7, "horizon": 20, "finish": 0.7, "brute": 1.82, "mender": 1.35, "air": 1.26, "cluster": 0.65};
  const types = ["bolt","cannon","frost","lance","flak"];
  const costs = [50,90,70,120,80];
  const damage = [[26,41,65],[60,96,153],[10,16,25],[180,288,460],[40,64,102]];
  const slots = [[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],
    [14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]];
  const route = [
    [[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]],
    [[0,6],[21,6],[21,11],[23,11]]
  ].map(points => {
    const tiles = [];
    for (let i=1;i<points.length;i++) {
      const [x,y]=points[i-1], [nx,ny]=points[i];
      const size=Math.abs(x-nx)+Math.abs(y-ny);
      for (let j=0;j<size*4;j++) tiles.push([x+(nx-x)*j/(size*4),y+(ny-y)*j/(size*4)]);
    }
    return tiles;
  });
  const ranges = [3,2.6,2.4,3.6,3.2];
  const coverage = slots.map(([x,y])=>ranges.map(r=>[0,1,2].map(up=>
    route.map(path=>path.reduce((sum,[px,py],i)=>{
      const dx=x-px,dy=y-py;
      return sum+((dx*dx+dy*dy <= (r+.3*up)**2) ? 1+profile.early*(1-i/path.length)**3 : 0);
    },0)/4))));
  const preferred = Array.from(profile.layout).map(c=>+c);
  let airPressure = 0;
  function plan(state) {
    const {wave, enemies, nextWave}=state;
    let gold=state.gold;
    const actions=[];
    const board=state.slots.map(s=>s.turret && {type:types.indexOf(s.turret.type),tier:s.turret.tier});
    let airWork=0, groundWork=0;
    for (let s=0;s<16;s++) if (board[s]) {
      const {type,tier}=board[s];
      if (type===0 || type===4) airWork+=coverage[s][type][tier-1][1]*damage[type][tier-1]/(type===4?8:8);
      if (type!==4) groundWork+=coverage[s][type][tier-1][0]*damage[type][tier-1]/[8,14,15,25][type];
    }
    const forecast=nextWave.filter(e=>e==="wisp").length/nextWave.length;
    const airAlive=enemies.filter(e=>e.air);
    const lateAir=airAlive.filter(e=>e.remaining<650).length;
    airPressure = wave<2 ? .015 : .18+forecast*.42+Math.min(.65,lateAir*.12);
    const opening = wave<=profile.openWave;
    function value(slot,type,tier) {
      if (!tier) return 0;
      const [ground,air]=coverage[slot][type][tier-1];
      const power=damage[type][tier-1];
      const dps=(power-(type===3?0:Math.min(12,wave*.25)))/[8,24,12,36,10][type];
      const groundFactor=[1,profile.splash,.25,profile.lance,0][type];
      const airFactor=[1,0,.31,0,profile.flak][type];
      const needAir=airPressure*Math.max(.55,Math.min(3,groundWork/(airWork+55)*.58));
      return (ground*groundFactor + air*airFactor*needAir)*dps +
        (type===2 ? profile.frost*ground*(1+.1*tier) : 0);
    }
    if (wave===1) for (const slot of profile.open) {
      const type=profile.openType;
      gold-=costs[type];
      board[slot]={type,tier:1};
      actions.push({op:"build",slot,type:types[type]});
    }
    while(actions.length<30) {
      let best=null, bestScore=-1;
      for(let slot=0;slot<16;slot++){
        const turret=board[slot];
        const options=turret ? [turret.type] : opening ? [...new Set([preferred[slot],0,1])] : [preferred[slot]];
        for(const type of options) {
          const tier=turret ? turret.tier+1 : 1;
          if(tier>3) continue;
          const cost=costs[type]*Math.max(1,tier-1);
          let merit=(value(slot,type,tier)-value(slot,type,tier-1))/cost;
          if(tier>1) merit*=tier===2?profile.up2:profile.up3;
          if(!turret && type!==preferred[slot]) merit*=profile.flex;
          if(slot===0 && wave<7 && type===0) merit*=1.8;
          if(type===4 && airWork<90 && wave>=4) merit*=1.5;
          if (gold<cost) merit*=profile.wait;
          if(merit>bestScore) {bestScore=merit; best={slot,type,tier,cost};}
        }
        if(turret && !opening && turret.type!==preferred[slot] && wave>=profile.swap) {
          const type=preferred[slot];
          const cost=costs[type]-Math.floor(costs[turret.type]*[0,1,2,4][turret.tier]*.7);
          const merit=(value(slot,type,1)-value(slot,turret.type,turret.tier))/Math.max(cost,20)*.9;
          if(cost<=gold && merit>bestScore){bestScore=merit; best={slot,type,tier:1,cost,sell:true};}
        }
      }
      if(!best || best.cost>gold || bestScore<=0) break;
      const {slot,type,tier,cost,sell}=best;
      if(sell) actions.push({op:"sell",slot});
      actions.push(tier===1?{op:"build",slot,type:types[type]}:{op:"upgrade",slot});
      gold-=cost;
      board[slot]={type,tier};
      if(type===0 || type===4) airWork+=coverage[slot][type][tier-1][1]*damage[type][tier-1]/10;
    }
    return actions;
  }
  function target(turret, candidates) {
    if(candidates.length===1) return candidates[0].id;
    const type=types.indexOf(turret.type), power=damage[type][turret.tier-1];
    const splash=type===1 ? 8100 : type===4 ? 4900 : 0;
    let best=-Infinity,id=candidates[0].id;
    function priority(e) {
      const hit=Math.max(1,power-(type===3?0:e.armor));
      const time=e.remaining/e.speed;
      const urgency=1+profile.urgency/(1+time/profile.horizon);
      const effective=Math.min(e.hp,hit)/power;
      const finish=e.hp<=hit ? profile.finish : 0;
      const armor=type===3 && e.type==="brute" ? profile.brute : 1;
      const heal=e.type==="mender" ? profile.mender : 1;
      return urgency * (effective+finish) * armor * heal *
        (e.air ? profile.air : 1) * (type===2 && !e.slowed ? 3.2 : 1);
    }
    const weights=candidates.map(priority);
    for(let i=0;i<candidates.length;i++) {
      const enemy=candidates[i];
      let score=weights[i];
      if(splash) for(let j=0;j<candidates.length;j++) if(j!==i){
        const ally=candidates[j],dx=enemy.x-ally.x,dy=enemy.y-ally.y;
        if(dx*dx+dy*dy<=splash) score+=weights[j]*profile.cluster;
      }
      if(score>best){best=score;id=enemy.id;}
    }
    return id;
  }
  return {plan,target};
}
</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks) {
  // Optional replay sink observes events and end-of-tick snapshots.
  const replay = arguments[3], strategy = createStrategy();
  const types = ["bolt","cannon","frost","lance","flak"];
  const weapons = {
    bolt:[50,26,8,300,0,0,3], cannon:[90,60,24,260,90,0,1],
    frost:[70,10,12,240,0,30,3], lance:[120,180,36,360,0,0,1], flak:[80,40,10,320,70,0,2]
  };
  const species = {
    grunt:[60,10,4,1,0,1,10], runner:[40,20,4,1,0,2,4],
    wisp:[50,12,6,2,1,3,3], brute:[150,6,9,3,0,4,3], splitter:[90,8,6,2,0,6,2],
    mender:[70,8,7,2,0,8,1], splitling:[0,12,1,1,0,Infinity,0]
  };
  const slots = [[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],
    [14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]].map(
    ([x,y],slot) => ({slot,x:x*100+50,y:y*100+50,turret:null})
  );
  const points = [
    [[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]],
    [[0,6],[21,6],[21,11],[23,11]]
  ];
  const routes = points.map(path => {
    let distance = 0;
    return path.slice(1).map(([x,y],i) => {
      const [ax,ay] = path[i], start = distance;
      distance += 100*(Math.abs(x-ax)+Math.abs(y-ay));
      return [start,distance,ax*100+50,ay*100+50,Math.sign(x-ax),Math.sign(y-ay)];
    });
  });
  // The air waypoints total 2800. Both reference hashes use their full length.
  const lengths = routes.map(route=>route[route.length-1][1]);
  if (replay) replay.board(points);
  function mulberry32(a) { return function () {
    a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return (t ^ (t >>> 14)) >>> 0;
  }; }
  const random = mulberry32(seed), enemyTypes = Object.keys(species), multipliers = [0,1000];
  function composition(wave) {
    const eligible = enemyTypes.filter(type => species[type][5] <= wave);
    const total = eligible.reduce((sum,type) => sum+species[type][6],0);
    return Array.from({length:4+Math.floor(3*wave/5)}, () => {
      let roll = random()%total;
      return eligible.find(type => (roll -= species[type][6]) < 0);
    });
  }
  let tick = 0, wave = 0, fallTick = -1, gold = 250, baseHp = 10, id = 0;
  let nextWave = composition(1), enemies = [];
  const spawnQueue = new Map(), log = [];
  function emit(code,a,b,detail) {
    log.push([tick,code,a,b]);
    if (replay) replay.event(tick,code,detail);
  }
  function locate(enemy) {
    const route = routes[enemy.air];
    const seg = route.find(segment => enemy.progress < segment[1]) || route[route.length-1];
    const offset = enemy.progress-seg[0];
    enemy.x = seg[2]+seg[4]*offset;
    enemy.y = seg[3]+seg[5]*offset;
    enemy.dx = seg[4];
    enemy.dy = seg[5];
    enemy.remaining = lengths[enemy.air]-enemy.progress;
  }
  function spawn(type,w,progress=0,childHp=0) {
    const [hp,speed,bounty,leak,air] = species[type];
    const maxHp = childHp || Math.floor(hp*multipliers[w]/1000);
    const armor = type === "brute" ? 6+w : type === "grunt" ? Math.floor(w/4) : 0;
    const enemy = {id:++id,type,hp:maxHp,maxHp,speed,bounty,leak,air,armor,
      wave:w,progress,age:0,slow:0,x:0,y:0,dx:0,dy:0,remaining:0};
    locate(enemy);
    enemies.push(enemy);
  }
  function view(e) {
    const {id,type,hp,maxHp,x,y,air,armor,speed,remaining} = e;
    return {id,type,hp,maxHp,x,y,air,armor,speed,slowed:e.slow>0,remaining};
  }
  function layout() {
    return slots.map(({slot,x,y,turret}) => ({
      slot,x,y,turret:turret ? {type:turret.type,tier:turret.tier,spent:turret.spent} : null
    }));
  }
  function within(a,b,r) {
    const dx = a.x-b.x, dy = a.y-b.y;
    return dx*dx+dy*dy <= r*r;
  }
  function startWave() {
    wave++;
    gold += Math.min(50,Math.floor(gold*5/100))+10+2*wave;
    if (wave > 1) multipliers[wave] = Math.floor(multipliers[wave-1]*108/100);
    const current = nextWave;
    nextWave = composition(wave+1);
    if (replay) replay.event(tick,"W",{wave});
    const actions = strategy.plan({tick,wave,gold,baseHp,slots:layout(),
      enemies:enemies.map(view),nextWave:nextWave.slice()});
    if (Array.isArray(actions)) for (const action of actions.slice(0,32)) {
      if (!action || !Number.isInteger(action.slot)) continue;
      const slot = slots[action.slot];
      if (!slot) continue;
      const turret = slot.turret;
      if (action.op === "build" && !turret && types.includes(action.type)) {
        const [cost,damage] = weapons[action.type];
        if (gold < cost) continue;
        gold -= cost;
        slot.turret = {type:action.type,damage,tier:1,spent:cost,cooldown:0};
        emit("B",slot.slot,types.indexOf(action.type),replay && {...slot.turret,x:slot.x,y:slot.y});
      } else if (action.op === "upgrade" && turret && turret.tier < 3) {
        const cost = weapons[turret.type][0]*turret.tier;
        if (gold < cost) continue;
        gold -= cost;
        turret.spent += cost;
        turret.tier++;
        turret.damage = Math.floor(turret.damage*16/10);
        emit("U",slot.slot,turret.tier,replay && {...turret,x:slot.x,y:slot.y});
      } else if (action.op === "sell" && turret) {
        gold += Math.floor(turret.spent*70/100);
        slot.turret = null;
        emit("S",slot.slot,0,replay && {...turret,x:slot.x,y:slot.y});
      }
    }
    current.forEach((type,i) => {
      const due = tick+4*i;
      if (!spawnQueue.has(due)) spawnQueue.set(due,[]);
      spawnQueue.get(due).push([type,wave]);
    });
  }
  function snapshot() {
    if (replay) replay.frame(tick,{wave,gold,baseHp,slots:layout(),nextWave:nextWave.slice(),
      enemies:enemies.map(e=>({...view(e),dx:e.dx,dy:e.dy}))});
  }
  for (; tick < maxTicks; tick++) {
    if (tick >= 20 && (tick-20)%40 === 0) startWave();
    const spawns = spawnQueue.get(tick);
    if (spawns) {
      for (const [type,w] of spawns) spawn(type,w);
      spawnQueue.delete(tick);
    }
    for (let i=0;i<enemies.length;i++) {
      const enemy = enemies[i];
      enemy.progress += enemy.slow > 0 ? Math.floor(enemy.speed*60/100) : enemy.speed;
      locate(enemy);
      if (enemy.remaining > 0) continue;
      enemies.splice(i--,1);
      baseHp -= enemy.leak;
      emit("L",enemy.id,baseHp,replay && {...view(enemy),baseHp});
      if (baseHp <= 0) {
        fallTick = tick;
        emit("F",wave,0);
        break;
      }
    }
    if (fallTick >= 0) {
      snapshot();
      break;
    }
    for (const enemy of enemies) {
      enemy.age++;
      if (enemy.type !== "mender" || enemy.age%20 !== 0) continue;
      for (const ally of enemies) if (within(enemy,ally,150))
        ally.hp = Math.min(ally.maxHp,ally.hp+Math.floor(ally.maxHp*8/100));
      if (replay) replay.event(tick,"H",view(enemy));
    }
    for (const slot of slots) {
      const turret = slot.turret;
      if (!turret || (turret.cooldown > 0 && --turret.cooldown > 0)) continue;
      const [, ,period,baseRange,splash,slow,domain] = weapons[turret.type];
      const range = baseRange+30*(turret.tier-1);
      const canHit = enemy => domain & (enemy.air ? 2 : 1);
      const candidates = enemies.filter(e=>canHit(e) && within(slot,e,range));
      if (!candidates.length) continue;
      const chosen = strategy.target?.({slot:slot.slot,type:turret.type,tier:turret.tier,
        x:slot.x,y:slot.y,range},candidates.map(view));
      const target = candidates.find(e=>e.id === chosen) ||
        candidates.reduce((first,e)=>e.remaining < first.remaining ? e : first);
      if (replay) replay.event(tick,"T",{x:slot.x,y:slot.y,slot:slot.slot,type:turret.type,
        target:view(target),splash});
      const affected = splash ? enemies.filter(e=>canHit(e) && within(target,e,splash)) : [target];
      for (const e of affected) {
        e.hp -= Math.max(1,turret.damage-(turret.type === "lance" ? 0 : e.armor));
        if (slow) e.slow = slow;
      }
      turret.cooldown = period;
      const killed = affected.filter(e=>e.hp<=0);
      if (killed.length) {
        enemies = enemies.filter(e=>e.hp>0);
        for (const e of killed) {
          gold += e.bounty;

    const impact=impacts[upperBound(impacts,tick)-1];

    turretsAt(frame,battleTick);
    effectsAt(time,tick);
    for(const p of pools.values())flush(p.mesh,p.count);
    for(const p of Object.values(fxPools))flush(p.mesh,p.count);
    flush(shadow.mesh,shadow.count);flush(glow.mesh,glow.count);

    const gray=.93*clamp(time-fallTime,0,1);

    renderer.setClearColor(0x090b11,0);
    renderer.clear();
    renderer.render(scene,camera);
    renderer.clearDepth();
    renderer.render(hud,hudCam);
  }
  const AudioClass=window.AudioContext||window.webkitAudioContext;
  const audio=AudioClass ? new AudioClass() : null;
  let master,noiseBuffer,wind=null,windAfter=0;
  const voices=new Set(),shotTimes=[];
  const audioRandom=seeded(4242);
  if(audio) {
    master=audio.createGain();
    master.gain.value=0;
    const compressor=audio.createDynamicsCompressor();
    compressor.threshold.value=-15;compressor.knee.value=21;compressor.ratio.value=7;
    master.connect(compressor).connect(audio.destination);
    noiseBuffer=audio.createBuffer(1,Math.ceil(audio.sampleRate*2),audio.sampleRate);
    const samples=noiseBuffer.getChannelData(0);
    for(let i=0;i<samples.length;i++)samples[i]=audioRandom()*2-1;
    const enable=()=>{
      audio.resume().catch(()=>{});
      window.removeEventListener("pointerdown",enable,true);
      window.removeEventListener("keydown",enable,true);
    };
    audio.resume().catch(()=>{});
    window.addEventListener("pointerdown",enable,true);
    window.addEventListener("keydown",enable,true);
  }
  const variation=events.map(()=>.91+audioRandom()*.19);
  function voice({x=12,shape="sine",f0=330,f1=140,gain=.11,duration=.12,
    delay=0,filter=0,filterType="lowpass",attack=.008,loop=false}) {
    if(!audio || audio.state!=="running")return null;
    const when=audio.currentTime+delay;
    const level=audio.createGain(),pan=audio.createStereoPanner();
    pan.pan.value=clamp((x-12)/13,-.91,.91);
    const source=shape==="noise" ? audio.createBufferSource() : audio.createOscillator();
    const node={source,level,pan,filter:null};
    if(shape==="noise"){
      source.buffer=noiseBuffer;
      source.loop=loop;
    } else {
      source.type=shape;
      source.frequency.setValueAtTime(f0,when);
      source.frequency.exponentialRampToValueAtTime(f1,when+duration);
    }
    if(filter) {
      node.filter=audio.createBiquadFilter();
      node.filter.type=filterType;node.filter.frequency.value=filter;
      source.connect(node.filter).connect(level);
    } else source.connect(level);
    level.connect(pan).connect(master);
    level.gain.setValueAtTime(.0001,when);
    level.gain.exponentialRampToValueAtTime(gain,when+attack);
    if(!loop)level.gain.exponentialRampToValueAtTime(.0001,when+duration);
    voices.add(node);
    source.onended=()=>{
      voices.delete(node);
      source.disconnect();level.disconnect();pan.disconnect();node.filter?.disconnect();
    };
    source.start(when);
    if(!loop)source.stop(when+duration+.01);
    return node;
  }
  function soundState(active) {
    if(!audio)return;
    const t=audio.currentTime;
    master.gain.cancelScheduledValues(t);
    master.gain.setTargetAtTime(active?.67:0,t,.008);
    if(!active) {

      wind=null;
      windAfter=0;
    }
  }
  const shotSound={
    lance:[5,"sawtooth",560,135,.105,.14,1300],
    cannon:[4,"noise",0,0,.16,.15,560,"lowpass"],
    flak:[3,"noise",0,0,.085,.11,1950,"bandpass"],
    frost:[2,"triangle",1240,700,.064,.13,0],
    bolt:[1,"square",540,195,.045,.086,1550]
  };
  function trigger(e) {
    const x=e.data?.x/100||12,p=variation[e.index],d=e.data;
    if(e.code==="T") {
      const [,shape,start,end,gain,duration,filter,filterType]=shotSound[d.type];

      if(d.type==="cannon")voice({x,f0:113*p,f1:41*p,gain:.099,duration:.15});
    } else if(e.code==="K") {
      voice({x,f0:400*p,f1:150*p,gain:.037,duration:.067,shape:"triangle"});
    } else if(e.code==="W") {
      voice({shape:"triangle",f0:133,f1:196,gain:.085,duration:.40,attack:.037});
      voice({shape:"sine",f0:201,f1:263,gain:.074,duration:.27,delay:.10,attack:.025});
    } else if(e.code==="L") {
      voice({x:23.5,shape:"noise",gain:.18,duration:.21,filter:1350,filterType:"bandpass"});

      const event=events[index];
      if(event.code==="T")shots.push(event);
      else trigger(event);
    }
    while(shotTimes.length&&shotTimes[0]<=elapsed-1)shotTimes.shift();
    shots.sort((a,b)=>shotSound[b.data.type][0]-shotSound[a.data.type][0] || a.index-b.index);
    for(let i=0;i<shots.length&&shotTimes.length<12;i++){
      trigger(shots[i]);shotTimes.push(elapsed);
    }
    if(to>=fallTime+1 && elapsed>=windAfter && !wind)
      wind=voice({shape:"noise",gain:.033,duration:1,filter:245,filterType:"lowpass",attack:.36,loop:true});
  }

  const byId=id=>document.getElementById(id);
  const countdown=byId("countdown"),toggle=byId("btn-toggle"),scrubber=byId("scrubber");
  const pauseIcon=byId("icon-pause"),playIcon=byId("icon-play");
  const pills=[...document.querySelectorAll(".speed-pill")];
  const COUNTDOWN="COUNTDOWN",PLAYING="PLAYING",PAUSED="PAUSED",REFIRE_HOLD="REFIRE_HOLD",ENDED="ENDED";
  let state=COUNTDOWN,simTime=0,playbackSpeed=1;
  let countdownElapsed=0,holdElapsed=0,lastWall=null,dragging=false;
  function hideCount() { countdown.style.display="none"; countdown.textContent=""; }
  function showCount() {
    countdown.style.display="block";
    countdown.textContent=String(3-Math.floor(countdownElapsed));
  }
  function transition(next) {
    state=next;
    if(state!==COUNTDOWN)hideCount();
    const running=state===PLAYING||state===COUNTDOWN||state===REFIRE_HOLD;
    pauseIcon.style.display=running?"":"none";
    playIcon.style.display=running?"none":"";
    toggle.setAttribute("aria-label",running?"Pause":"Play");
    soundState(state===PLAYING&&!dragging);
  }
  toggle.addEventListener("click",()=>{
    lastWall=performance.now();
    if(state===PLAYING||state===COUNTDOWN||state===REFIRE_HOLD)transition(PAUSED);
    else {
      if(state===ENDED){simTime=0;scrubber.value="0";render(0);}
      transition(PLAYING);
    }
  });
  for(const pill of pills) pill.addEventListener("click",()=>{
    playbackSpeed=Number(pill.dataset.speed);
    for(const p of pills) {
      const active=p===pill;
      p.classList.toggle("is-active",active);
      p.setAttribute("aria-checked",String(active));
    }
  });
  scrubber.addEventListener("pointerdown",()=>{dragging=true;soundState(false);});
  function endDrag(){if(dragging){dragging=false;soundState(state===PLAYING);}}
  window.addEventListener("pointerup",endDrag);
  window.addEventListener("pointercancel",endDrag);
  scrubber.addEventListener("input",()=>{
    transition(PAUSED);
    simTime=parseFloat(scrubber.value);
    render(simTime);
  });
  byId("btn-refire").addEventListener("click",()=>{
    simTime=0;holdElapsed=0;countdownElapsed=0;scrubber.value="0";
    transition(REFIRE_HOLD);
    render(0);
    lastWall=performance.now();
  });
  function animate(now) {
    const dt=lastWall===null?0:clamp((now-lastWall)/1000,0,.1);
    lastWall=now;
    let advance=dt;
    if(state===COUNTDOWN){
      const prev=countdownElapsed;
      countdownElapsed+=dt;
      if(countdownElapsed>=3){advance=Math.max(0,dt-(3-prev));transition(PLAYING);}
      else showCount();
    } else if(state===REFIRE_HOLD){
      const prev=holdElapsed;
      holdElapsed+=dt;
      if(holdElapsed>=1){advance=Math.max(0,dt-(1-prev));transition(PLAYING);}
    }
    if(state===PLAYING){
      const before=simTime;
      simTime=Math.min(DURATION,simTime+advance*playbackSpeed);
      scrubber.value=simTime.toFixed(3);
      if(!dragging)advanceAudio(before,simTime);
      render(simTime);
      if(simTime>=DURATION)transition(ENDED);
    }
    requestAnimationFrame(animate);
  }
  window.addEventListener("resize",()=>{resize();render(simTime);});
  hideCount();
  resize();
  render(0);
  requestAnimationFrame(animate);
