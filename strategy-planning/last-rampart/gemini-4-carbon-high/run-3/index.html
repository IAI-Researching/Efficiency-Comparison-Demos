<script id="rampart-strategy">
function createStrategy() {
  const COSTS = { bolt: 50, cannon: 90, frost: 70, lance: 120, flak: 80 };
  const COMP = [
    "cannon", "cannon", "cannon", "cannon", "cannon", "flak", "cannon", "cannon",
    "cannon", "cannon", "frost",  "cannon", "flak",   "cannon", "flak", "flak"
  ];

  const BUILDS = [
    { s: 3,  w: 1,  u: true,  earlyBolt: false },
    { s: 0,  w: 1,  u: true,  earlyBolt: true  },
    { s: 12, w: 2,  u: true,  earlyBolt: false },
    { s: 6,  w: 3,  u: true,  earlyBolt: false },
    { s: 8,  w: 5,  u: true,  earlyBolt: false },
    { s: 10, w: 6,  u: true,  earlyBolt: false },
    { s: 13, w: 7,  u: true,  earlyBolt: false },
    { s: 14, w: 9,  u: true,  earlyBolt: false },
    { s: 11, w: 10, u: false, earlyBolt: false },
    { s: 4,  w: 11, u: false, earlyBolt: false },
    { s: 15, w: 12, u: false, earlyBolt: false },
    { s: 7,  w: 13, u: false, earlyBolt: false },
    { s: 1,  w: 14, u: false, earlyBolt: false },
    { s: 5,  w: 15, u: false, earlyBolt: false },
    { s: 9,  w: 16, u: false, earlyBolt: false },
    { s: 2,  w: 17, u: false, earlyBolt: false }
  ];

  const UPGS = [
    { s: 12, t: 2 }, { s: 4, t: 2 }, { s: 8, t: 2 }, { s: 3, t: 2 }, { s: 6, t: 2 },
    { s: 14, t: 2 }, { s: 13, t: 2 }, { s: 11, t: 2 },
    { s: 4,  t: 3 }, { s: 12, t: 3 },
    { s: 5,  t: 2 }, { s: 15, t: 2 }, { s: 7, t: 2 }, { s: 1, t: 2 }, { s: 9, t: 2 }, { s: 2, t: 2 }, { s: 0, t: 2 },
    { s: 8,  t: 3 }, { s: 14, t: 3 }, { s: 3, t: 3 }, { s: 6, t: 3 }, { s: 13, t: 3 }, { s: 11, t: 3 },
    { s: 5,  t: 3 }, { s: 15, t: 3 }, { s: 1, t: 3 }, { s: 7, t: 3 }, { s: 9, t: 3 }, { s: 2, t: 3 }, { s: 0, t: 3 },
    { s: 10, t: 2 }, { s: 10, t: 3 }
  ];

  return {
    plan(s) {
      const acts = [];
      let g = s.gold;
      const sim = [];
      for (let i = 0; i < 16; i++) {
        const sl = s.slots[i];
        sim.push(sl && sl.turret ? { type: sl.turret.type, tier: sl.turret.tier, spent: sl.turret.spent } : null);
      }

      function build(sl, type, keep) {
        if (acts.length >= 32 || sim[sl]) return true;
        const c = COSTS[type];
        if (g - c < keep) return false;
        acts.push({ op: "build", slot: sl, type: type });
        g -= c;
        sim[sl] = { type: type, tier: 1, spent: c };
        return true;
      }

      function upg(sl, targetTier, keep) {
        if (acts.length >= 32 || !sim[sl]) return true;
        while (acts.length < 32 && sim[sl].tier < targetTier) {
          const c = sim[sl].tier === 1 ? COSTS[sim[sl].type] : COSTS[sim[sl].type] * 2;
          if (g - c < keep) return false;
          acts.push({ op: "upgrade", slot: sl });
          g -= c;
          sim[sl].tier += 1;
          sim[sl].spent += c;
        }
        return true;
      }

      function sell(sl) {
        if (acts.length >= 32 || !sim[sl]) return false;
        g += Math.floor(sim[sl].spent * 70 / 100);
        acts.push({ op: "sell", slot: sl });
        sim[sl] = null;
        return true;
      }

      let airNow = 0;
      let airNext = 0;
      for (let i = 0; i < s.enemies.length; i++) {
        if (s.enemies[i].air) airNow += 1;
      }
      for (let i = 0; i < s.nextWave.length; i++) {
        if (s.nextWave[i] === "wisp") airNext += 1;
      }

      let reserve = 0;
      if (s.wave >= 6 && s.wave < 26 && s.baseHp >= 10) {
        reserve = Math.min(700, (s.wave - 5) * 75);
        for (let i = 0; i < s.enemies.length; i++) {
          if (s.enemies[i].remaining < 1000) {
            reserve = 0;
            break;
          }
        }
      }

      if (airNow + airNext >= 5 && s.wave >= 8) {
        if (!sim[14]) build(14, "flak", 0);
        if (airNow + airNext >= 8 && sim[12] && sim[12].tier < 2) upg(12, 2, 0);
      }

      for (let i = 0; i < BUILDS.length; i++) {
        const b = BUILDS[i];
        if (s.wave < b.w) continue;
        if (sim[b.s]) continue;
        const tName = b.earlyBolt ? "bolt" : COMP[b.s];
        if (!build(b.s, tName, b.u ? 0 : reserve)) return acts;
      }

      if (s.wave >= 18 && sim[0] && sim[0].type === "bolt") {
        const ref = Math.floor(sim[0].spent * 70 / 100);
        if (g + ref - COSTS.cannon >= reserve) {
          sell(0);
          build(0, "cannon", reserve);
        } else {
          return acts;
        }
      }

      for (let i = 0; i < UPGS.length; i++) {
        const u = UPGS[i];
        if (!upg(u.s, u.t, reserve)) return acts;
      }

      let allT3 = true;
      for (let i = 0; i < 16; i++) {
        if (!sim[i] || sim[i].tier < 3) {
          allT3 = false;
          break;
        }
      }

      if (allT3) {
        let lateAirHp = 0;
        let lateGroundHp = 0;
        let lateBruteHp = 0;
        for (let i = 0; i < s.enemies.length; i++) {
          const e = s.enemies[i];
          if (e.air && e.remaining < 1700) {
            lateAirHp += e.hp;
          } else if (!e.air && e.remaining < 2600) {
            lateGroundHp += e.hp;
            if (e.type === "brute") lateBruteHp += e.hp;
          }
        }
        if (s.wave >= 40 && lateBruteHp > 1500 && sim[9] && sim[9].type === "cannon") {
          const ref = Math.floor(sim[9].spent * 70 / 100);
          if (g + ref >= 480 && acts.length + 4 <= 32) {
            sell(9);
            build(9, "lance", 0);
            upg(9, 3, 0);
          }
        }
        if (lateAirHp > 3500 && airNext >= 5 && sim[1] && sim[1].type !== "flak") {
          const ref = Math.floor(sim[1].spent * 70 / 100);
          if (g + ref >= 320 && acts.length + 4 <= 32) {
            sell(1);
            build(1, "flak", 0);
            upg(1, 3, 0);
          }
        } else if (lateAirHp < 600 && airNext <= 2 && lateGroundHp > 8000 && sim[1] && sim[1].type === "flak") {
          const ref = Math.floor(sim[1].spent * 70 / 100);
          if (g + ref >= 360 && acts.length + 4 <= 32) {
            sell(1);
            build(1, "cannon", 0);
            upg(1, 3, 0);
          }
        }
      }

      return acts;
    },

    target(t, cands) {
      const n = cands.length;
      if (n === 1) return cands[0].id;

      if (t.type === "frost") {
        let best = cands[0];
        let bestS = -1e18;
        for (let i = 0; i < n; i++) {
          const c = cands[i];
          const spd = c.slowed > 0 ? Math.floor(c.speed * 60 / 100) : c.speed;
          const ttl = c.remaining / Math.max(1, spd);
          let s = (c.slowed > 0 ? 0 : 1e7) - ttl * 45;
          if (c.type === "runner") s += 3500;
          else if (c.air) s += 2800;
          else if (c.type === "mender") s += 1400;
          else if (c.type === "splitter") s += 1100;
          else if (c.type === "brute") s -= 1500;
          if (s > bestS) {
            bestS = s;
            best = c;
          }
        }
        return best.id;
      }

      if (t.type === "cannon") {
        const dmg = t.tier === 1 ? 60 : t.tier === 2 ? 96 : 153;
        let best = cands[0];
        let bestS = -1e18;
        for (let i = 0; i < n; i++) {
          const ci = cands[i];
          let s = 0;
          for (let j = 0; j < n; j++) {
            const cj = cands[j];
            const dx = cj.x - ci.x;
            const dy = cj.y - ci.y;
            if (dx * dx + dy * dy <= 8100) {
              const armor = cj.armor !== undefined ? cj.armor : (cj.armour || 0);
              const hit = Math.max(1, dmg - armor);
              const eff = cj.hp < hit ? cj.hp : hit;
              const spd = cj.slowed > 0 ? Math.floor(cj.speed * 60 / 100) : cj.speed;
              const ttl = cj.remaining / Math.max(1, spd);
              let mult = 1.0 + 65.0 / (ttl + 25.0);
              if (cj.type === "mender") mult *= 1.5;
              else if (cj.type === "runner") mult *= 1.4;
              else if (cj.type === "splitter") {
                mult *= 1.18;
                if (cj.hp <= hit && t.slot !== 13) mult *= 1.35;
              }
              let v = eff * mult;
              if (ttl < 45) {
                const lk = cj.type === "brute" ? 3 : (cj.type === "splitter" || cj.type === "mender") ? 2 : 1;
                if (cj.hp <= hit) v += (48 - ttl) * 40 * lk;
                else v += eff * 2.2;
              }
              s += v;
            }
          }
          if (s > bestS) {
            bestS = s;
            best = ci;
          }
        }
        return best.id;
      }

      if (t.type === "flak") {
        const dmg = t.tier === 1 ? 40 : t.tier === 2 ? 64 : 102;
        let best = cands[0];
        let bestS = -1e18;
        for (let i = 0; i < n; i++) {
          const ci = cands[i];
          let s = 0;
          for (let j = 0; j < n; j++) {
            const cj = cands[j];
            const dx = cj.x - ci.x;
            const dy = cj.y - ci.y;
            if (dx * dx + dy * dy <= 4900) {
              const eff = cj.hp < dmg ? cj.hp : dmg;
              const spd = cj.slowed > 0 ? 7 : 12;
              const ttl = cj.remaining / spd;
              let v = eff * (1.0 + 45.0 / (ttl + 20.0));
              if (ttl < 45 && cj.hp <= dmg) v += (50 - ttl) * 35;
              s += v;
            }
          }
          if (s > bestS) {
            bestS = s;
            best = ci;
          }
        }
        return best.id;
      }

      if (t.type === "lance") {
        const dmg = t.tier === 1 ? 180 : t.tier === 2 ? 288 : 460;
        let best = cands[0];
        let bestS = -1e18;
        for (let i = 0; i < n; i++) {
          const c = cands[i];
          const armor = c.armor !== undefined ? c.armor : (c.armour || 0);
          const eff = c.hp < dmg ? c.hp : dmg;
          const spd = c.slowed > 0 ? Math.floor(c.speed * 60 / 100) : c.speed;
          const ttl = c.remaining / Math.max(1, spd);
          let s = eff * 12 + armor * 220 - ttl * 20;
          if (c.type === "brute") s += 6000;
          else if (c.type === "mender") s += 5000;
          else if (c.type === "splitling") s -= 8000;
          if (ttl < 40 && c.hp <= dmg) s += (45 - ttl) * 450;
          if (s > bestS) {
            bestS = s;
            best = c;
          }
        }
        return best.id;
      }

      const dmg = t.tier === 1 ? 26 : t.tier === 2 ? 41 : 65;
      let best = cands[0];
      let bestS = -1e18;
      for (let i = 0; i < n; i++) {
        const c = cands[i];
        const armor = c.armor !== undefined ? c.armor : (c.armour || 0);
        const hit = Math.max(1, dmg - armor);
        const eff = c.hp < hit ? c.hp : hit;
        const spd = c.slowed > 0 ? Math.floor(c.speed * 60 / 100) : c.speed;
        const ttl = c.remaining / Math.max(1, spd);
        let s = eff * 90 - ttl * 60 + (c.hp <= hit ? 2500 : 0) + (c.air ? 1200 : 0);
        if (ttl < 40) s += (45 - ttl) * 500;
        if (s > bestS) {
          bestS = s;
          best = c;
        }
      }
      return best.id;
    }
  };
}
</script>

<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks) {
  const obs = arguments.length > 3 ? arguments[3] : null;

  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return (t ^ (t >>> 14)) >>> 0;
    };
  }

  const GROUND_TILES = [[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]];
  const AIR_TILES = [[0,6],[21,6],[21,11],[23,11]];

  function buildRoute(tiles) {
    const pts = tiles.map(function (p) { return [p[0] * 100 + 50, p[1] * 100 + 50]; });
    const segs = [];
    let total = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const x0 = pts[i][0], y0 = pts[i][1];
      const x1 = pts[i + 1][0], y1 = pts[i + 1][1];
      const dx = x1 - x0;
      const dy = y1 - y0;
      const len = Math.abs(dx) + Math.abs(dy);
      segs.push({ x0: x0, y0: y0, dx: Math.sign(dx), dy: Math.sign(dy), start: total, len: len });
      total += len;
    }
    return { pts: pts, segs: segs, length: total };
  }

  const GROUND_ROUTE = buildRoute(GROUND_TILES);
  const AIR_ROUTE = buildRoute(AIR_TILES);

  function posAt(route, progress) {
    if (progress <= 0) return [route.pts[0][0], route.pts[0][1]];
    if (progress >= route.length) {
      const last = route.pts[route.pts.length - 1];
      return [last[0], last[1]];
    }
    for (let i = 0; i < route.segs.length; i++) {
      const s = route.segs[i];
      if (progress <= s.start + s.len) {
        const d = progress - s.start;
        return [s.x0 + s.dx * d, s.y0 + s.dy * d];
      }
    }
    const last = route.pts[route.pts.length - 1];
    return [last[0], last[1]];
  }

  const SLOT_TILES = [
    [3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],
    [14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]
  ];

  const TURRET_DEFS = {
    bolt:   { idx: 0, cost: 50,  damage: 26,  period: 8,  range: 300, splash: 0,  slow: 0,  pierce: false, ground: true,  air: true  },
    cannon: { idx: 1, cost: 90,  damage: 60,  period: 24, range: 260, splash: 90, slow: 0,  pierce: false, ground: true,  air: false },
    frost:  { idx: 2, cost: 70,  damage: 10,  period: 12, range: 240, splash: 0,  slow: 30, pierce: false, ground: true,  air: true  },
    lance:  { idx: 3, cost: 120, damage: 180, period: 36, range: 360, splash: 0,  slow: 0,  pierce: true,  ground: true,  air: false },
    flak:   { idx: 4, cost: 80,  damage: 40,  period: 10, range: 320, splash: 70, slow: 0,  pierce: false, ground: false, air: true  }
  };

  const ENEMY_ORDER = [
    { type: "grunt",    baseHp: 60,  speed: 10, bounty: 4, leak: 1, air: 0, firstWave: 1, weight: 10 },
    { type: "runner",   baseHp: 40,  speed: 20, bounty: 4, leak: 1, air: 0, firstWave: 2, weight: 4  },
    { type: "wisp",     baseHp: 50,  speed: 12, bounty: 6, leak: 2, air: 1, firstWave: 3, weight: 3  },
    { type: "brute",    baseHp: 150, speed: 6,  bounty: 9, leak: 3, air: 0, firstWave: 4, weight: 3  },
    { type: "splitter", baseHp: 90,  speed: 8,  bounty: 6, leak: 2, air: 0, firstWave: 6, weight: 2  },
    { type: "mender",   baseHp: 70,  speed: 8,  bounty: 7, leak: 2, air: 0, firstWave: 8, weight: 1  }
  ];
  const ENEMY_DEFS = {};
  for (let i = 0; i < ENEMY_ORDER.length; i++) ENEMY_DEFS[ENEMY_ORDER[i].type] = ENEMY_ORDER[i];
  ENEMY_DEFS.splitling = { type: "splitling", baseHp: 0, speed: 12, bounty: 1, leak: 1, air: 0, firstWave: 999, weight: 0 };

  const hpMultCache = [0, 1000];
  function getHpMult(w) {
    while (hpMultCache.length <= w) {
      hpMultCache.push(Math.floor(hpMultCache[hpMultCache.length - 1] * 108 / 100));
    }
    return hpMultCache[w];
  }

  function getEnemyArmor(type, w) {
    if (type === "grunt") return Math.floor(w / 4);
    if (type === "brute") return 6 + w;
    return 0;
  }

  function turretDamage(def, tier) {
    let d = def.damage;
    for (let t = 1; t < tier; t++) d = Math.floor(d * 16 / 10);
    return d;
  }

  function turretRange(def, tier) {
    return def.range + 30 * (tier - 1);
  }

  const rng = mulberry32(seed >>> 0);

  function generateWave(w) {
    const count = 4 + Math.floor(3 * w / 5);
    const eligible = [];
    let sumW = 0;
    for (let i = 0; i < ENEMY_ORDER.length; i++) {
      if (ENEMY_ORDER[i].firstWave <= w) {
        eligible.push(ENEMY_ORDER[i]);
        sumW += ENEMY_ORDER[i].weight;
      }
    }
    const list = [];
    for (let i = 0; i < count; i++) {
      let r = rng() % sumW;
      for (let j = 0; j < eligible.length; j++) {
        if (r < eligible[j].weight) {
          list.push(eligible[j].type);
          break;
        }
        r -= eligible[j].weight;
      }
    }
    return list;
  }

  const slots = SLOT_TILES.map(function (pt, idx) {
    return {
      slot: idx,
      x: pt[0] * 100 + 50,
      y: pt[1] * 100 + 50,
      turret: null
    };
  });

  const strategy = createStrategy();
  let gold = 250;
  let baseHp = 10;
  let currentWave = 0;
  let nextId = 1;
  const enemies = [];
  const spawnQueue = [];
  const log = [];
  let fallTick = -1;

  let upcomingWave = generateWave(1);

  if (obs && obs.onInit) {
    obs.onInit({
      groundRoute: GROUND_ROUTE,
      airRoute: AIR_ROUTE,
      slotTiles: SLOT_TILES,
      initialPreview: upcomingWave.slice()
    });
  }

  function makeEnemyView(e) {
    const route = e.air ? AIR_ROUTE : GROUND_ROUTE;
    return {
      id: e.id,
      type: e.type,
      hp: e.hp,
      maxHp: e.maxHp,
      x: e.x,
      y: e.y,
      air: e.air,
      armor: e.armor,
      speed: e.speed,
      slowed: e.slow > 0 ? 1 : 0,
      remaining: route.length - e.progress
    };
  }

  function recordSnapshot(tick) {
    if (!obs || !obs.onTick) return;
    obs.onTick({
      tick: tick,
      wave: currentWave,
      gold: gold,
      baseHp: Math.max(0, baseHp),
      nextWave: upcomingWave.slice(),
      slots: slots.map(function (s) {
        return s.turret ? { type: s.turret.type, tier: s.turret.tier, cooldown: s.turret.cooldown } : null;
      }),
      enemies: enemies.map(function (e) {
        return {
          id: e.id,
          type: e.type,
          hp: e.hp,
          maxHp: e.maxHp,
          progress: e.progress,
          x: e.x,
          y: e.y,
          air: e.air,
          slowed: e.slow > 0 ? 1 : 0
        };
      })
    });
  }

  for (let tick = 0; tick < maxTicks; tick++) {
    // 1. Wave start
    if (tick >= 20 && (tick - 20) % 40 === 0) {
      const w = 1 + Math.floor((tick - 20) / 40);
      currentWave = w;
      gold += Math.min(50, Math.floor(gold * 5 / 100)) + 10 + 2 * w;
      const thisWave = upcomingWave;
      upcomingWave = generateWave(w + 1);
      if (obs && obs.onWaveStart) obs.onWaveStart({ tick: tick, wave: w });

      const state = {
        tick: tick,
        wave: w,
        gold: gold,
        baseHp: baseHp,
        slots: slots.map(function (s) {
          return {
            slot: s.slot,
            x: s.x,
            y: s.y,
            turret: s.turret ? { type: s.turret.type, tier: s.turret.tier, spent: s.turret.spent } : null
          };
        }),
        enemies: enemies.map(makeEnemyView),
        nextWave: upcomingWave.slice()
      };

      const actions = strategy && typeof strategy.plan === "function" ? strategy.plan(state) : [];
      if (Array.isArray(actions)) {
        const limit = Math.min(actions.length, 32);
        for (let i = 0; i < limit; i++) {
          const act = actions[i];
          if (!act || typeof act !== "object") continue;
          const slIdx = act.slot;
          if (!Number.isInteger(slIdx) || slIdx < 0 || slIdx >= 16) continue;
          const sl = slots[slIdx];
          if (act.op === "build") {
            if (sl.turret !== null) continue;
            const def = TURRET_DEFS[act.type];
            if (!def || gold < def.cost) continue;
            gold -= def.cost;
            sl.turret = {
              type: act.type,
              def: def,
              tier: 1,
              spent: def.cost,
              cooldown: 0,
              damage: turretDamage(def, 1),
              range: turretRange(def, 1)
            };
            log.push([tick, "B", slIdx, def.idx]);
            if (obs && obs.onSlotOp) obs.onSlotOp({ tick: tick, op: "B", slot: slIdx, type: act.type, tier: 1 });
          } else if (act.op === "upgrade") {
            if (!sl.turret || sl.turret.tier >= 3) continue;
            const def = sl.turret.def;
            const upgCost = sl.turret.tier === 1 ? def.cost : def.cost * 2;
            if (gold < upgCost) continue;
            gold -= upgCost;
            sl.turret.tier += 1;
            sl.turret.spent += upgCost;
            sl.turret.damage = turretDamage(def, sl.turret.tier);
            sl.turret.range = turretRange(def, sl.turret.tier);
            log.push([tick, "U", slIdx, sl.turret.tier]);
            if (obs && obs.onSlotOp) obs.onSlotOp({ tick: tick, op: "U", slot: slIdx, type: sl.turret.type, tier: sl.turret.tier });
          } else if (act.op === "sell") {
            if (!sl.turret) continue;
            const prevType = sl.turret.type;
            const prevTier = sl.turret.tier;
            gold += Math.floor(sl.turret.spent * 70 / 100);
            sl.turret = null;
            log.push([tick, "S", slIdx, 0]);
            if (obs && obs.onSlotOp) obs.onSlotOp({ tick: tick, op: "S", slot: slIdx, type: prevType, tier: prevTier });
          }
        }
      }

      for (let i = 0; i < thisWave.length; i++) {
        spawnQueue.push({ tick: tick + 4 * i, wave: w, idx: i, type: thisWave[i] });
      }
      spawnQueue.sort(function (a, b) {
        return (a.tick - b.tick) || (a.wave - b.wave) || (a.idx - b.idx);
      });
    }

    // 2. Spawn
    while (spawnQueue.length > 0 && spawnQueue[0].tick === tick) {
      const sp = spawnQueue.shift();
      const def = ENEMY_DEFS[sp.type];
      const route = def.air ? AIR_ROUTE : GROUND_ROUTE;
      const maxHp = Math.floor(def.baseHp * getHpMult(sp.wave) / 1000);
      const pt = posAt(route, 0);
      const enemyObj = {
        id: nextId++,
        type: sp.type,
        wave: sp.wave,
        hp: maxHp,
        maxHp: maxHp,
        progress: 0,
        x: pt[0],
        y: pt[1],
        air: def.air,
        armor: getEnemyArmor(sp.type, sp.wave),
        speed: def.speed,
        bounty: def.bounty,
        leak: def.leak,
        age: 0,
        slow: 0
      };
      enemies.push(enemyObj);
      if (obs && obs.onSpawn) obs.onSpawn({ tick: tick, id: enemyObj.id, type: enemyObj.type, air: enemyObj.air, progress: 0 });
    }

    // 3. Move
    let fell = false;
    for (let i = 0; i < enemies.length; ) {
      const e = enemies[i];
      const route = e.air ? AIR_ROUTE : GROUND_ROUTE;
      const step = e.slow > 0 ? Math.floor(e.speed * 60 / 100) : e.speed;
      e.progress += step;
      if (e.progress >= route.length) {
        const hpBefore = baseHp;
        baseHp -= e.leak;
        enemies.splice(i, 1);
        log.push([tick, "L", e.id, baseHp]);
        if (obs && obs.onLeak) {
          obs.onLeak({ tick: tick, id: e.id, type: e.type, air: e.air, leak: e.leak, hpBefore: hpBefore, hpAfter: Math.max(0, baseHp) });
        }
        if (baseHp <= 0) {
          log.push([tick, "F", currentWave, 0]);
          fallTick = tick;
          fell = true;
          if (obs && obs.onFall) obs.onFall({ tick: tick, wave: currentWave });
          recordSnapshot(tick);
          break;
        }
      } else {
        const pt = posAt(route, e.progress);
        e.x = pt[0];
        e.y = pt[1];
        i++;
      }
    }
    if (fell) break;

    // 4. Age & heal
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      e.age += 1;
      if (e.type === "mender" && e.age % 20 === 0) {
        const r2 = 150 * 150;
        for (let j = 0; j < enemies.length; j++) {
          const o = enemies[j];
          const dx = o.x - e.x;
          const dy = o.y - e.y;
          if (dx * dx + dy * dy <= r2) {
            const heal = Math.floor(o.maxHp * 8 / 100);
            if (o.hp + heal > o.maxHp) o.hp = o.maxHp;
            else o.hp += heal;
          }
        }
        if (obs && obs.onHeal) obs.onHeal({ tick: tick, id: e.id, x: e.x, y: e.y });
      }
    }

    // 5. Turrets fire
    for (let sIdx = 0; sIdx < 16; sIdx++) {
      const sl = slots[sIdx];
      const t = sl.turret;
      if (!t) continue;
      if (t.cooldown > 0) {
        t.cooldown -= 1;
        if (t.cooldown > 0) continue;
      }
      const def = t.def;
      const r2 = t.range * t.range;
      const cands = [];
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (e.air ? !def.air : !def.ground) continue;
        const dx = e.x - sl.x;
        const dy = e.y - sl.y;
        if (dx * dx + dy * dy <= r2) cands.push(e);
      }
      if (cands.length === 0) continue;

      let chosen = null;
      if (strategy && typeof strategy.target === "function") {
        const tView = { slot: sIdx, type: t.type, tier: t.tier, x: sl.x, y: sl.y, range: t.range };
        const cViews = cands.map(makeEnemyView);
        const chosenId = strategy.target(tView, cViews);
        for (let i = 0; i < cands.length; i++) {
          if (cands[i].id === chosenId) {
            chosen = cands[i];
            break;
          }
        }
      }
      if (!chosen) {
        let bestRem = Infinity;
        for (let i = 0; i < cands.length; i++) {
          const e = cands[i];
          const route = e.air ? AIR_ROUTE : GROUND_ROUTE;
          const rem = route.length - e.progress;
          if (rem < bestRem) {
            bestRem = rem;
            chosen = e;
          }
        }
      }

      if (obs && obs.onShot) {
        obs.onShot({
          tick: tick,
          slot: sIdx,
          type: t.type,
          tier: t.tier,
          x0: sl.x,
          y0: sl.y,
          x1: chosen.x,
          y1: chosen.y,
          targetAir: chosen.air,
          splash: def.splash
        });
      }

      if (def.splash > 0) {
        const sp2 = def.splash * def.splash;
        const tx = chosen.x;
        const ty = chosen.y;
        for (let i = 0; i < enemies.length; i++) {
          const e = enemies[i];
          if (e.air ? !def.air : !def.ground) continue;
          const dx = e.x - tx;
          const dy = e.y - ty;
          if (dx * dx + dy * dy <= sp2) {
            const dmg = def.pierce ? t.damage : Math.max(1, t.damage - e.armor);
            e.hp -= dmg;
            if (def.slow > 0) e.slow = def.slow;
          }
        }
      } else {
        const dmg = def.pierce ? t.damage : Math.max(1, t.damage - chosen.armor);
        chosen.hp -= dmg;
        if (def.slow > 0) chosen.slow = def.slow;
      }

      t.cooldown = def.period;

      const spawnedSplitlings = [];
      for (let i = 0; i < enemies.length; ) {
        const e = enemies[i];
        if (e.hp <= 0) {
          enemies.splice(i, 1);
          gold += e.bounty;
          log.push([tick, "K", e.id, sIdx]);
          if (obs && obs.onKill) {
            obs.onKill({ tick: tick, id: e.id, type: e.type, x: e.x, y: e.y, air: e.air, progress: e.progress, slot: sIdx });
          }
          if (e.type === "splitter") {
            const spMaxHp = Math.max(1, Math.floor(e.maxHp / 4));
            for (let k = 0; k < 3; k++) {
              const child = {
                id: nextId++,
                type: "splitling",
                wave: e.wave,
                hp: spMaxHp,
                maxHp: spMaxHp,
                progress: e.progress,
                x: e.x,
                y: e.y,
                air: 0,
                armor: 0,
                speed: 12,
                bounty: 1,
                leak: 1,
                age: 0,
                slow: 0
              };
              spawnedSplitlings.push(child);
              if (obs && obs.onSpawn) obs.onSpawn({ tick: tick, id: child.id, type: "splitling", air: 0, progress: e.progress });
            }
          }
        } else {
          i++;
        }
      }
      for (let k = 0; k < spawnedSplitlings.length; k++) {
        enemies.push(spawnedSplitlings[k]);
      }
    }

    // 6. Slow timers
    for (let i = 0; i < enemies.length; i++) {
      if (enemies[i].slow > 0) enemies[i].slow -= 1;
    }

    recordSnapshot(tick);
  }

  const endTick = fallTick === -1 ? maxTicks : fallTick;
  const score = Math.round((endTick - 20) * 5 / 2) / 100;

  const str = JSON.stringify(log);
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  const hash = (h >>> 0).toString(16).padStart(8, "0");

  return { score: score, fallTick: fallTick, log: log, hash: hash };
}

  if (replay.fall) {

  // Smooth deterministic 1D noise table seeded with 42
  const NOISE_LEN = 512;
  const noiseX = new Float32Array(NOISE_LEN);
  const noiseY = new Float32Array(NOISE_LEN);
  const noiseZ = new Float32Array(NOISE_LEN);
  for (let i = 0; i < NOISE_LEN; i++) {
    noiseX[i] = visRng() * 2 - 1;
    noiseY[i] = visRng() * 2 - 1;
    noiseZ[i] = visRng() * 2 - 1;
  }
  function sampleSmoothNoise(arr, u) {
    const x = ((u % NOISE_LEN) + NOISE_LEN) % NOISE_LEN;
    const i0 = Math.floor(x);
    const i1 = (i0 + 1) % NOISE_LEN;
    const f = x - i0;
    const s = f * f * (3 - 2 * f);
    return arr[i0] + (arr[i1] - arr[i0]) * s;
  }

    let tr = 0;

      tr = Math.max(0, tr - (ev.time - prevT));
      tr = Math.min(1, tr + ev.amount);
      prevT = ev.time;
    }
    tr = Math.max(0, tr - (simTime - prevT));
    return tr;
  }

      if (clamped <= s.start + s.len || i === route.segs.length - 1) {

        const wx = (s.x0 + s.dx * d) / 100;
        const wz = (s.y0 + s.dy * d) / 100;
        const yaw = Math.atan2(s.dx, s.dy);
        return { x: wx, z: wz, yaw: yaw };
      }

    return { x: 0.5, z: 2.5, yaw: Math.PI * 0.5 };

  function makeTerrainTexture() {
    const c = document.createElement("canvas");
    c.width = 512;
    c.height = 256;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#2b3029";
    ctx.fillRect(0, 0, 512, 256);
    for (let i = 0; i < 4500; i++) {
      const x = visRng() * 512;
      const y = visRng() * 256;
      const r = 1 + visRng() * 4.5;
      const v = visRng();
      ctx.fillStyle = v > 0.6 ? "rgba(62,72,54,0.28)" : (v > 0.25 ? "rgba(31,35,31,0.32)" : "rgba(78,72,58,0.20)");
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    // Subtle tile grid lines (24x14)
    ctx.strokeStyle = "rgba(255,255,255,0.035)";
    ctx.lineWidth = 1;
    for (let gx = 0; gx <= 24; gx++) {
      const px = (gx / 24) * 512;
      ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, 256); ctx.stroke();
    }
    for (let gy = 0; gy <= 14; gy++) {
      const py = (gy / 14) * 256;
      ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(512, py); ctx.stroke();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  function getTurretAimAndRecoil(slotIdx, simTime) {
    const arr = slotShots[slotIdx];
    if (arr.length === 0) return { yaw: 0, recoil: 0 };
    let lo = 0, hi = arr.length - 1, ans = -1;
    while (lo <= hi) {
      const mid = (lo + hi) >>> 1;
      if (arr[mid].time <= simTime) { ans = mid; lo = mid + 1; }
      else hi = mid - 1;
    }
    if (ans === -1) return { yaw: arr[0].yaw, recoil: 0 };
    const dt = simTime - arr[ans].time;
    const recoil = dt >= 0 && dt < 0.12 ? (1 - dt / 0.12) : 0;
    return { yaw: arr[ans].yaw, recoil: recoil };
