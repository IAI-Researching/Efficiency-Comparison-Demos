  // Detached glyph atlas containing ONLY digits 0-9 + geometric HUD icons (zero words/letters!)
  function createHudAtlas() {
    const c = document.createElement("canvas");
    c.width = 1024;
    c.height = 256;
    const ctx = c.getContext("2d");
    ctx.clearRect(0, 0, 1024, 256);

    // Row 0 (y=0..128): Crisp bold digits 0..9 in 10 cells of 96x128
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "800 92px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
    for (let d = 0; d < 10; d++) {
      const cx = d * 96 + 48;
      const cy = 66;
      ctx.lineWidth = 10;
      ctx.strokeStyle = "rgba(8, 10, 16, 0.85)";
      ctx.strokeText(String(d), cx, cy);
      ctx.fillStyle = "#ffffff";
      ctx.fillText(String(d), cx, cy);
    }

    // Row 1 (y=128..256): Geometric icons in 96x128 cells (indices 0..9):
    // 0: Wave crossed blades
    // 1: Gold coin
    // 2: Base HP shield pip
    // 3..8: Enemy preview icons (grunt, runner, wisp, brute, splitter, mender)
    function cellCenter(idx) { return [idx * 96 + 48, 192]; }

    // Icon 0: Crossed blades
    {
      const [cx, cy] = cellCenter(0);
      ctx.save();
      ctx.translate(cx, cy);
      for (const sgn of [-1, 1]) {
        ctx.save();
        ctx.rotate(sgn * 0.68);
        ctx.fillStyle = "#dce6f7";
        ctx.strokeStyle = "#0b0e15";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(0, -42);
        ctx.lineTo(8, 12);
        ctx.lineTo(-8, 12);
        ctx.closePath();
        ctx.stroke(); ctx.fill();
        ctx.fillStyle = "#f2b644";
        ctx.fillRect(-15, 10, 30, 7);
        ctx.fillStyle = "#8a5a2b";
        ctx.fillRect(-4, 17, 8, 18);
        ctx.restore();
      }
      ctx.restore();
    }

    // Icon 1: Coin
    {
      const [cx, cy] = cellCenter(1);
      ctx.lineWidth = 6;
      ctx.strokeStyle = "#0b0e15";
      ctx.fillStyle = "#ffca3a";
      ctx.beginPath(); ctx.arc(cx, cy, 34, 0, Math.PI * 2); ctx.stroke(); ctx.fill();
      ctx.strokeStyle = "#ffe98a";
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(cx, cy, 23, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = "#fff1a8";
      ctx.beginPath();
      ctx.moveTo(cx, cy - 13); ctx.lineTo(cx + 11, cy); ctx.lineTo(cx, cy + 13); ctx.lineTo(cx - 11, cy);
      ctx.closePath(); ctx.fill();
    }

    // Icon 2: Shield Pip (white base so vertex/material color tints it!)
    {
      const [cx, cy] = cellCenter(2);
      ctx.lineWidth = 6;
      ctx.strokeStyle = "#0b0e15";
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.moveTo(cx - 26, cy - 30);
      ctx.lineTo(cx + 26, cy - 30);
      ctx.lineTo(cx + 26, cy + 2);
      ctx.quadraticCurveTo(cx + 24, cy + 24, cx, cy + 36);
      ctx.quadraticCurveTo(cx - 24, cy + 24, cx - 26, cy + 2);
      ctx.closePath();
      ctx.stroke();
      ctx.fill();
    }

    // Icon 3: Grunt (grey-green square shield)
    {
      const [cx, cy] = cellCenter(3);
      ctx.lineWidth = 6; ctx.strokeStyle = "#0b0e15"; ctx.fillStyle = "#77996e";
      ctx.beginPath(); ctx.rect(cx - 26, cy - 26, 52, 52); ctx.stroke(); ctx.fill();
      ctx.fillStyle = "#a5c49b";
      ctx.fillRect(cx - 18, cy - 18, 36, 12);
    }

    // Icon 4: Runner (yellow forward chevron/dart)
    {
      const [cx, cy] = cellCenter(4);
      ctx.lineWidth = 6; ctx.strokeStyle = "#0b0e15"; ctx.fillStyle = "#ffd829";
      ctx.beginPath();
      ctx.moveTo(cx + 32, cy);
      ctx.lineTo(cx - 26, cy - 28);
      ctx.lineTo(cx - 12, cy);
      ctx.lineTo(cx - 26, cy + 28);
      ctx.closePath();
      ctx.stroke(); ctx.fill();
    }

    // Icon 5: Wisp (glowing cyan diamond)
    {
      const [cx, cy] = cellCenter(5);
      const g = ctx.createRadialGradient(cx, cy, 4, cx, cy, 38);
      g.addColorStop(0, "rgba(120,252,255,0.95)");
      g.addColorStop(1, "rgba(61,245,255,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cx, cy, 38, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 5; ctx.strokeStyle = "#0b0e15"; ctx.fillStyle = "#57f8ff";
      ctx.beginPath();
      ctx.moveTo(cx, cy - 30); ctx.lineTo(cx + 26, cy); ctx.lineTo(cx, cy + 30); ctx.lineTo(cx - 26, cy);
      ctx.closePath();
      ctx.stroke(); ctx.fill();
    }

    // Icon 6: Brute (dark iron octagon with orange armor plates)
    {
      const [cx, cy] = cellCenter(6);
      ctx.lineWidth = 6; ctx.strokeStyle = "#0b0e15"; ctx.fillStyle = "#323742";
      ctx.beginPath();
      for (let k = 0; k < 8; k++) {
        const a = (k + 0.5) * Math.PI / 4;
        const px = cx + Math.cos(a) * 32, py = cy + Math.sin(a) * 32;
        if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.stroke(); ctx.fill();
      ctx.fillStyle = "#ff7d1a";
      ctx.fillRect(cx - 22, cy - 10, 44, 20);
    }

    // Icon 7: Splitter (purple 3-lobe cluster)
    {
      const [cx, cy] = cellCenter(7);
      ctx.lineWidth = 5; ctx.strokeStyle = "#0b0e15"; ctx.fillStyle = "#b457ff";
      const lobes = [[0, -16], [-16, 12], [16, 12]];
      for (let k = 0; k < 3; k++) {
        ctx.beginPath(); ctx.arc(cx + lobes[k][0], cy + lobes[k][1], 16, 0, Math.PI * 2); ctx.stroke(); ctx.fill();
      }
    }

    // Icon 8: Mender (white core with soft green halo ring)
    {
      const [cx, cy] = cellCenter(8);
      ctx.strokeStyle = "#4dff88"; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.arc(cx, cy, 30, 0, Math.PI * 2); ctx.stroke();
      ctx.lineWidth = 5; ctx.strokeStyle = "#0b0e15"; ctx.fillStyle = "#f5f9ff";
      ctx.beginPath(); ctx.arc(cx, cy, 19, 0, Math.PI * 2); ctx.stroke(); ctx.fill();
    }

    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    return tex;
  }

  const hudAtlas = createHudAtlas();

  function makeHudQuad(cellCol, cellRow, tintHex) {
    const geo = new THREE.PlaneGeometry(1, 1);
    const u0 = (cellCol * 96) / 1024;
    const u1 = ((cellCol + 1) * 96) / 1024;
    const v1 = 1 - (cellRow * 128) / 256;
    const v0 = 1 - ((cellRow + 1) * 128) / 256;
    const uv = geo.attributes.uv;
    uv.setXY(0, u0, v1);
    uv.setXY(1, u1, v1);
    uv.setXY(2, u0, v0);
    uv.setXY(3, u1, v0);
    uv.needsUpdate = true;
    const mat = new THREE.MeshBasicMaterial({
      map: hudAtlas,
      color: tintHex !== undefined ? tintHex : 0xffffff,
      transparent: true,
      depthTest: false,
      depthWrite: false
    });
    const mesh = new THREE.Mesh(geo, mat);
    hudScene.add(mesh);
    return { mesh: mesh, geo: geo, mat: mat };
  }

  function setQuadCell(q, cellCol, cellRow) {
    const u0 = (cellCol * 96) / 1024;
    const u1 = ((cellCol + 1) * 96) / 1024;
    const v1 = 1 - (cellRow * 128) / 256;
    const v0 = 1 - ((cellRow + 1) * 128) / 256;
    const uv = q.geo.attributes.uv;
    uv.setXY(0, u0, v1);
    uv.setXY(1, u1, v1);
    uv.setXY(2, u0, v0);
    uv.setXY(3, u1, v0);
    uv.needsUpdate = true;
  }

  // Pre-allocate HUD quads (zero runtime allocations!)
  const hudWaveIcon = makeHudQuad(0, 1, 0xffffff);
  const hudWaveDigits = [makeHudQuad(0, 0, 0xf2f6ff), makeHudQuad(0, 0, 0xf2f6ff), makeHudQuad(0, 0, 0xf2f6ff)];

  const hudCoinIcon = makeHudQuad(1, 1, 0xffffff);
  const hudGoldDigits = [];
  for (let i = 0; i < 6; i++) hudGoldDigits.push(makeHudQuad(0, 0, 0xffdc6b));

  const PREVIEW_TYPES = [
    { type: "grunt", iconCol: 3 },
    { type: "runner", iconCol: 4 },
    { type: "wisp", iconCol: 5 },
    { type: "brute", iconCol: 6 },
    { type: "splitter", iconCol: 7 },
    { type: "mender", iconCol: 8 }
  ];
  const hudPreviewSlots = [];
  for (let i = 0; i < 6; i++) {
    hudPreviewSlots.push({
      icon: makeHudQuad(PREVIEW_TYPES[i].iconCol, 1, 0xffffff),
      d0: makeHudQuad(0, 0, 0xd8e2f4),
      d1: makeHudQuad(0, 0, 0xd8e2f4)
    });
  }

  const hudHpPips = [];
  for (let i = 0; i < 10; i++) {
    hudHpPips.push(makeHudQuad(2, 1, 0xff4252));
  }

  function placeQuad(q, leftPx, topPx, widthPx, heightPx, vpH) {
    q.mesh.position.set(leftPx + widthPx * 0.5, vpH - topPx - heightPx * 0.5, 0);
    q.mesh.scale.set(widthPx, heightPx, 1);
    q.mesh.visible = true;
  }

  function updateHud(snap, simTime) {
    const vpW = window.innerWidth;
    const vpH = window.innerHeight;
    const padX = Math.max(16, Math.round(vpW * 0.016));
    const padY = Math.max(12, Math.round(vpH * 0.018));

    // 1. Wave number (>= 7% of viewport height -> 7.8% of vpH)
    const waveH = Math.max(46, Math.round(vpH * 0.078));
    const waveW = Math.round(waveH * 0.68);
    placeQuad(hudWaveIcon, padX, padY, waveH * 0.85, waveH * 0.85, vpH);

    const waveStr = String(snap.wave);
    let wx = padX + Math.round(waveH * 0.88);
    for (let i = 0; i < hudWaveDigits.length; i++) {
      if (i < waveStr.length) {
        const d = waveStr.charCodeAt(i) - 48;
        setQuadCell(hudWaveDigits[i], d, 0);
        placeQuad(hudWaveDigits[i], wx, padY, waveW, waveH, vpH);
        wx += Math.round(waveW * 0.78);
      } else {
        hudWaveDigits[i].mesh.visible = false;
      }
    }

    // 2. Gold under wave number
    const goldTop = padY + waveH + Math.round(vpH * 0.008);
    const goldH = Math.max(28, Math.round(vpH * 0.044));
    const goldW = Math.round(goldH * 0.68);
    placeQuad(hudCoinIcon, padX + 2, goldTop, goldH * 0.88, goldH * 0.88, vpH);

    const goldStr = String(snap.gold);
    let gx = padX + Math.round(goldH * 0.96);
    for (let i = 0; i < hudGoldDigits.length; i++) {
      if (i < goldStr.length) {
        const d = goldStr.charCodeAt(i) - 48;
        setQuadCell(hudGoldDigits[i], d, 0);
        placeQuad(hudGoldDigits[i], gx, goldTop, goldW, goldH, vpH);
        gx += Math.round(goldW * 0.78);
      } else {
        hudGoldDigits[i].mesh.visible = false;
      }
    }

    // 3. Next-wave preview under gold (colored enemy icons + counts as digits)
    const prevTop = goldTop + goldH + Math.round(vpH * 0.010);
    const prevH = Math.max(22, Math.round(vpH * 0.034));
    const prevDigitW = Math.round(prevH * 0.66);
    const counts = { grunt: 0, runner: 0, wisp: 0, brute: 0, splitter: 0, mender: 0 };
    if (snap.nextWave) {
      for (let i = 0; i < snap.nextWave.length; i++) {
        const t = snap.nextWave[i];
        if (counts[t] !== undefined) counts[t] += 1;
      }
    }
    let px = padX + 2;
    for (let i = 0; i < PREVIEW_TYPES.length; i++) {
      const pt = PREVIEW_TYPES[i];
      const cnt = counts[pt.type];
      const slot = hudPreviewSlots[i];
      if (cnt > 0) {
        placeQuad(slot.icon, px, prevTop, prevH * 0.90, prevH * 0.90, vpH);
        px += Math.round(prevH * 0.88);
        const cs = String(cnt);
        setQuadCell(slot.d0, cs.charCodeAt(0) - 48, 0);
        placeQuad(slot.d0, px, prevTop + prevH * 0.06, prevDigitW, prevH * 0.88, vpH);
        px += Math.round(prevDigitW * 0.76);
        if (cs.length > 1) {
          setQuadCell(slot.d1, cs.charCodeAt(1) - 48, 0);
          placeQuad(slot.d1, px, prevTop + prevH * 0.06, prevDigitW, prevH * 0.88, vpH);
          px += Math.round(prevDigitW * 0.76);
        } else {
          slot.d1.mesh.visible = false;
        }
        px += Math.round(prevH * 0.36);
      } else {
        slot.icon.mesh.visible = false;
        slot.d0.mesh.visible = false;
        slot.d1.mesh.visible = false;
      }
    }

    // 4. Base HP: 10 pips in top-right corner with leak flash
    const pipH = Math.max(26, Math.round(vpH * 0.042));
    const pipW = Math.round(pipH * 0.78);
    const pipGap = Math.max(4, Math.round(pipW * 0.16));
    const totalPipsW = 10 * pipW + 9 * pipGap;
    const startPipX = vpW - padX - totalPipsW;

    for (let i = 0; i < 10; i++) {
      const pip = hudHpPips[i];
      placeQuad(pip, startPipX + i * (pipW + pipGap), padY + Math.round((waveH - pipH) * 0.25), pipW, pipH, vpH);
      if (i < snap.baseHp) {
        pip.mat.color.setHex(0xff3d4d);
        pip.mat.opacity = 0.96;
      } else {
        // Check if this pip was extinguished recently for a short bright flash
        let flash = 0;
        for (let k = 0; k < replay.leaks.length; k++) {
          const lk = replay.leaks[k];
          if (i >= lk.hpAfter && i < lk.hpBefore) {
            const dt = simTime - lk.time;
            if (dt >= 0 && dt < 0.38) {
              flash = Math.max(flash, 1 - dt / 0.38);
            }
          }
        }
        if (flash > 0) {
          pip.mat.color.setRGB(1.0, 0.55 + 0.45 * flash, 0.55 + 0.45 * flash);
          pip.mat.opacity = 0.35 + 0.65 * flash;
        } else {
          pip.mat.color.setHex(0x282d3a);
          pip.mat.opacity = 0.48;
        }
      }
    }
  }

  // =========================================================================
  // EXACT CAMERA FRAMING (55° ELEVATION, FULL BOARD + MARGIN, CLEAR 90PX DOCK)
  // =========================================================================
  const camBasePos = new THREE.Vector3();
  const camBaseTarget = new THREE.Vector3();
  const CAM_ELEV = 55 * Math.PI / 180;

  function updateCameraFraming() {
    const w = Math.max(1, window.innerWidth);
    const h = Math.max(1, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);

    camera.aspect = w / h;
    camera.updateProjectionMatrix();

    hudCam.left = 0;
    hudCam.right = w;
    hudCam.top = h;
    hudCam.bottom = 0;
    hudCam.updateProjectionMatrix();

    // Solve camera distance & slight Z target offset so [-0.65, 24.65] x [0, 1.5] x [-0.65, 14.65]
    // stays strictly inside [-0.95, 0.95] horizontally and above bottom 94px dock vertically!
    const minNdcY = -1 + 2 * (96 / h);
    const maxNdcY = 0.86;
    const corners = [
      new THREE.Vector3(-0.65, 0.0, -0.65),
      new THREE.Vector3(24.65, 0.0, -0.65),
      new THREE.Vector3(-0.65, 0.0, 14.65),
      new THREE.Vector3(24.65, 0.0, 14.65),
      new THREE.Vector3(-0.65, 1.5, -0.65),
      new THREE.Vector3(24.65, 1.5, -0.65),
      new THREE.Vector3(-0.65, 1.5, 14.65),
      new THREE.Vector3(24.65, 1.5, 14.65)
    ];
    const tmpV = new THREE.Vector3();

    let zCenter = 7.4;
    let bestDist = 26.0;
    for (let pass = 0; pass < 4; pass++) {
      let lo = 14.0, hi = 65.0;
      for (let it = 0; it < 20; it++) {
        const mid = (lo + hi) * 0.5;
        camera.position.set(12.0, Math.sin(CAM_ELEV) * mid, zCenter + Math.cos(CAM_ELEV) * mid);
        camera.lookAt(12.0, 0.0, zCenter);
        camera.updateMatrixWorld(true);

        let fits = true;
        let yLow = 9, yHigh = -9;
        for (let c = 0; c < corners.length; c++) {
          tmpV.copy(corners[c]).project(camera);
          if (Math.abs(tmpV.x) > 0.955) fits = false;
          if (tmpV.y < yLow) yLow = tmpV.y;
          if (tmpV.y > yHigh) yHigh = tmpV.y;
        }
        if (yLow < minNdcY || yHigh > maxNdcY) fits = false;
        if (fits) hi = mid;
        else lo = mid;
      }
      bestDist = hi;
      // Center vertical span between [minNdcY, maxNdcY]
      camera.position.set(12.0, Math.sin(CAM_ELEV) * bestDist, zCenter + Math.cos(CAM_ELEV) * bestDist);
      camera.lookAt(12.0, 0.0, zCenter);
      camera.updateMatrixWorld(true);
      let yLow = 9, yHigh = -9;
      for (let c = 0; c < corners.length; c++) {
        tmpV.copy(corners[c]).project(camera);
        if (tmpV.y < yLow) yLow = tmpV.y;
        if (tmpV.y > yHigh) yHigh = tmpV.y;
      }
      const curMid = (yLow + yHigh) * 0.5;
      const wantMid = (minNdcY + maxNdcY) * 0.5;
      zCenter += (curMid - wantMid) * 3.2;
    }

    camBaseTarget.set(12.0, 0.0, zCenter);
    camBasePos.set(12.0, Math.sin(CAM_ELEV) * bestDist, zCenter + Math.cos(CAM_ELEV) * bestDist);
  }

  window.addEventListener("resize", function () {
    updateCameraFraming();
    renderAtSimTime(simTime);
  });

  // =========================================================================
  // SYNTHESIZED WEB AUDIO ENGINE (SECTION 6 — SEED 4242, NO EXTERNAL AUDIO)
  // =========================================================================
  const audioRng = makeRng(4242);
  let audioCtx = null;
  let masterGain = null;
  let compressor = null;
  let noiseBuf = null;
  let windSource = null;
  let windGain = null;
  const activeOneShots = new Set();
  const shotStamps = []; // wall-clock timestamps for <= 12 shots/sec rate limiter

  function initAudio() {
    if (audioCtx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      audioCtx = new AC();
      compressor = audioCtx.createDynamicsCompressor();
      compressor.threshold.value = -16;
      compressor.knee.value = 18;
      compressor.ratio.value = 6;
      compressor.attack.value = 0.003;
      compressor.release.value = 0.15;

      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.0;
      masterGain.connect(compressor);
      compressor.connect(audioCtx.destination);

      // Deterministic noise buffer seeded with 4242
      const len = audioCtx.sampleRate * 2;
      noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const ch = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) {
        ch[i] = audioRng() * 2 - 1;
      }

      if (audioCtx.state === "suspended") {
        audioCtx.resume().catch(function () {});
      }
    } catch (e) {
      audioCtx = null;
    }
  }

  function resumeAudioGesture() {
    if (!audioCtx) initAudio();
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume().catch(function () {});
    }
  }
  window.addEventListener("pointerdown", resumeAudioGesture, { passive: true });
  window.addEventListener("keydown", resumeAudioGesture, { passive: true });
  initAudio();

  function makePannedDest(worldX) {
    const panVal = Math.max(-0.85, Math.min(0.85, ((worldX / 24) * 2 - 1) * 0.8));
    if (audioCtx.createStereoPanner) {
      const p = audioCtx.createStereoPanner();
      p.pan.value = panVal;
      p.connect(masterGain);
      return p;
    }
    return masterGain;
  }

  function regOneShot(node, stopTime) {
    activeOneShots.add(node);
    node.onended = function () { activeOneShots.delete(node); };
    try { node.stop(stopTime); } catch (e) {}
  }

  function stopWind() {
    if (windSource) {
      try { windSource.stop(); } catch (e) {}
      windSource = null;
      windGain = null;
    }
  }

  function ensureWindPlaying() {
    if (!audioCtx || !noiseBuf || windSource) return;
    const now = audioCtx.currentTime;
    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuf;
    src.loop = true;

    const filt = audioCtx.createBiquadFilter();
    filt.type = "bandpass";
    filt.frequency.value = 190;
    filt.Q.value = 2.4;

    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.001, now);
    g.gain.linearRampToValueAtTime(0.09, now + 0.4);

    src.connect(filt);
    filt.connect(g);
    g.connect(masterGain);
    src.start(now);
    windSource = src;
    windGain = g;
  }

  function setAudioActive(isPlayingState) {
    if (!audioCtx || !masterGain) return;
    const now = audioCtx.currentTime;
    masterGain.gain.cancelScheduledValues(now);
    if (isPlayingState) {
      if (audioCtx.state === "suspended") audioCtx.resume().catch(function () {});
      masterGain.gain.setValueAtTime(masterGain.gain.value, now);
      masterGain.gain.linearRampToValueAtTime(0.68, now + 0.03);
    } else {
      masterGain.gain.setValueAtTime(masterGain.gain.value, now);
      masterGain.gain.linearRampToValueAtTime(0.0, now + 0.035);
      activeOneShots.forEach(function (node) {
        try { node.stop(now + 0.04); } catch (e) {}
      });
      activeOneShots.clear();
      stopWind();
    }
  }

  function playTurretShot(type, worldX) {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const dest = makePannedDest(worldX);
    const jitter = 0.96 + audioRng() * 0.08;

    if (type === "lance") {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(680 * jitter, now);
      osc.frequency.exponentialRampToValueAtTime(115, now + 0.13);
      g.gain.setValueAtTime(0.16, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
      osc.connect(g); g.connect(dest);
      osc.start(now);
      regOneShot(osc, now + 0.145);
    } else if (type === "cannon") {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(155 * jitter, now);
      osc.frequency.exponentialRampToValueAtTime(42, now + 0.13);
      g.gain.setValueAtTime(0.20, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
      osc.connect(g); g.connect(dest);
      osc.start(now);
      regOneShot(osc, now + 0.145);

      const n = audioCtx.createBufferSource();
      n.buffer = noiseBuf;
      const f = audioCtx.createBiquadFilter();
      f.type = "lowpass"; f.frequency.value = 420;
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(0.10, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + 0.10);
      n.connect(f); f.connect(ng); ng.connect(dest);
      n.start(now, audioRng() * 1.2, 0.11);
      regOneShot(n, now + 0.11);
    } else if (type === "flak") {
      const n = audioCtx.createBufferSource();
      n.buffer = noiseBuf;
      const f = audioCtx.createBiquadFilter();
      f.type = "bandpass"; f.frequency.value = 950 * jitter; f.Q.value = 2.2;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.13, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.085);
      n.connect(f); f.connect(g); g.connect(dest);
      n.start(now, audioRng() * 1.2, 0.09);
      regOneShot(n, now + 0.09);
    } else if (type === "frost") {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(1320 * jitter, now);
      osc.frequency.exponentialRampToValueAtTime(1880 * jitter, now + 0.09);
      g.gain.setValueAtTime(0.08, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.095);
      osc.connect(g); g.connect(dest);
      osc.start(now);
      regOneShot(osc, now + 0.10);
    } else {
      // bolt
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(520 * jitter, now);
      osc.frequency.exponentialRampToValueAtTime(210, now + 0.06);
      g.gain.setValueAtTime(0.09, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.065);
      osc.connect(g); g.connect(dest);
      osc.start(now);
      regOneShot(osc, now + 0.07);
    }
  }

  function playKillPop(worldX) {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const dest = makePannedDest(worldX);
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "sine";
    const base = 280 + audioRng() * 120;
    osc.frequency.setValueAtTime(base, now);
    osc.frequency.exponentialRampToValueAtTime(base * 1.65, now + 0.05);
    g.gain.setValueAtTime(0.065, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.055);
    osc.connect(g); g.connect(dest);
    osc.start(now);
    regOneShot(osc, now + 0.06);
  }

  function playWaveHorn() {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const dest = makePannedDest(2.0);
    const freqs = [196, 293.66];
    for (let i = 0; i < freqs.length; i++) {
      const osc = audioCtx.createOscillator();
      const f = audioCtx.createBiquadFilter();
      const g = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(freqs[i] * 0.92, now);
      osc.frequency.exponentialRampToValueAtTime(freqs[i], now + 0.14);
      f.type = "lowpass";
      f.frequency.value = 720;
      g.gain.setValueAtTime(0.001, now);
      g.gain.linearRampToValueAtTime(0.075, now + 0.06);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
      osc.connect(f); f.connect(g); g.connect(dest);
      osc.start(now);
      regOneShot(osc, now + 0.37);
    }
  }

  function playLeakAlarm() {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const dest = makePannedDest(23.0);
    // Stone crack
    const n = audioCtx.createBufferSource();
    n.buffer = noiseBuf;
    const f = audioCtx.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = 650; f.Q.value = 1.4;
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.24, now);
    ng.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
    n.connect(f); f.connect(ng); ng.connect(dest);
    n.start(now, audioRng() * 0.8, 0.20);
    regOneShot(n, now + 0.20);

    // Alarm tone
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(440, now);
    osc.frequency.setValueAtTime(330, now + 0.11);
    g.gain.setValueAtTime(0.11, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
    osc.connect(g); g.connect(dest);
    osc.start(now);
    regOneShot(osc, now + 0.26);
  }

  function playFallCollapse() {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const dest = makePannedDest(22.5);

    const sub = audioCtx.createOscillator();
    const sg = audioCtx.createGain();
    sub.type = "sine";
    sub.frequency.setValueAtTime(95, now);
    sub.frequency.exponentialRampToValueAtTime(28, now + 1.25);
    sg.gain.setValueAtTime(0.36, now);
    sg.gain.exponentialRampToValueAtTime(0.001, now + 1.35);
    sub.connect(sg); sg.connect(dest);
    sub.start(now);
    regOneShot(sub, now + 1.38);

    const n = audioCtx.createBufferSource();
    n.buffer = noiseBuf;
    const f = audioCtx.createBiquadFilter();
    f.type = "lowpass";
    f.frequency.setValueAtTime(850, now);
    f.frequency.exponentialRampToValueAtTime(140, now + 1.3);
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.30, now);
    ng.gain.exponentialRampToValueAtTime(0.001, now + 1.4);
    n.connect(f); f.connect(ng); ng.connect(dest);
    n.start(now, 0, 1.45);
    regOneShot(n, now + 1.45);
  }

  const SHOT_PRIO = { lance: 5, cannon: 4, flak: 3, frost: 2, bolt: 1 };
  let lastKillSoundWall = 0;

  function triggerAudioWindow(tPrev, tCurr) {
    if (!audioCtx || state !== "PLAYING" || tCurr <= tPrev || tCurr - tPrev > 0.35) return;

    const fallTime = replay.fall ? replay.fall.time : Infinity;

    if (tPrev < fallTime && tCurr >= fallTime) {
      playFallCollapse();
      ensureWindPlaying();
      return;
    }
    if (tCurr > fallTime) {
      ensureWindPlaying();
      return;
    }
    stopWind();

    // Wave horns
    for (let i = 0; i < replay.waveStarts.length; i++) {
      const wt = replay.waveStarts[i].time;
      if (wt > tPrev && wt <= tCurr) playWaveHorn();
    }

    // Leaks
    for (let i = 0; i < replay.leaks.length; i++) {
      const lt = replay.leaks[i].time;
      if (lt > tPrev && lt <= tCurr) playLeakAlarm();
    }

    // Shots (rate-limited <= 12 per wall-clock second, loudest types first)
    const nowSec = performance.now() / 1000;
    while (shotStamps.length > 0 && nowSec - shotStamps[0] > 1.0) shotStamps.shift();

    const crossedShots = [];
    for (let i = 0; i < replay.shots.length; i++) {
      const sh = replay.shots[i];
      if (sh.time > tCurr) break;
      if (sh.time > tPrev) crossedShots.push(sh);
    }
    if (crossedShots.length > 0 && shotStamps.length < 12) {
      crossedShots.sort(function (a, b) { return (SHOT_PRIO[b.type] || 0) - (SHOT_PRIO[a.type] || 0); });
      const budget = Math.min(crossedShots.length, 12 - shotStamps.length);
      for (let i = 0; i < budget; i++) {
        playTurretShot(crossedShots[i].type, crossedShots[i].x0);
        shotStamps.push(nowSec);
      }
    }

    // Kills (soft pop)
    if (nowSec - lastKillSoundWall >= 0.055) {
      for (let i = 0; i < replay.kills.length; i++) {
        const kl = replay.kills[i];
        if (kl.time > tCurr) break;
        if (kl.time > tPrev) {
          playKillPop(kl.x);
          lastKillSoundWall = nowSec;
          break;
        }
      }
    }
  }

  // =========================================================================
  // DETERMINISTIC FRAME RENDERER AT ARBITRARY simTime IN [0, 100]
  // =========================================================================
  let lastAppliedDesat = -1;
  const workColor = new THREE.Color();
  const workColor2 = new THREE.Color();
  const qBill = new THREE.Quaternion();
  const upVec = new THREE.Vector3(0, 1, 0);
  const dirVec = new THREE.Vector3();

  function renderAtSimTime(t) {
    const clampedT = Math.max(0, Math.min(DURATION, t));
    const fallTime = replay.fall ? replay.fall.time : Infinity;

    // 1. Post-fall desaturation factor (0 before fallTime, ramps 0 -> 0.90 over 1.0s, holds to 100s)
    const desat = clampedT > fallTime ? Math.min(1.0, (clampedT - fallTime) / 1.0) * 0.90 : 0.0;
    if (Math.abs(desat - lastAppliedDesat) > 0.0005) {
      lastAppliedDesat = desat;
      for (let i = 0; i < desatMats.length; i++) {
        const entry = desatMats[i];
        if (entry.baseColor && entry.mat.color) {
          applyColorDesat(entry.mat.color, entry.baseColor, desat);
        }
        if (entry.baseEmissive && entry.mat.emissive) {
          applyColorDesat(entry.mat.emissive, entry.baseEmissive, desat);
        }
      }
      applyColorDesat(keyLight.color, baseKeyColor, desat);
      applyColorDesat(hemiLight.color, baseHemiSky, desat);
      applyColorDesat(hemiLight.groundColor, baseHemiGnd, desat);
    }

    // 2. Closed-form trauma camera shake
    const trauma = getTraumaAt(clampedT);
    const shakeMag = trauma * trauma * 0.25;
    const sx = shakeMag * sampleSmoothNoise(noiseX, clampedT * 26.0);
    const sy = shakeMag * sampleSmoothNoise(noiseY, clampedT * 29.0) * 0.6;
    const sz = shakeMag * sampleSmoothNoise(noiseZ, clampedT * 24.0);
    camera.position.set(camBasePos.x + sx, camBasePos.y + sy, camBasePos.z + sz);
    camera.lookAt(camBaseTarget.x + sx * 0.65, camBaseTarget.y, camBaseTarget.z + sz * 0.65);
    camera.updateMatrixWorld();
    qBill.copy(camera.quaternion);

    // Effective combat clock freezes at fallTime once Keep falls!
    const effTime = Math.min(clampedT, fallTime);
    const exactTick = effTime * TICKS_PER_SEC;
    const k = Math.floor(exactTick);
    const frac = exactTick - k;
    const snapA = getSnap(k);
    const snapB = getSnap(k + 1);
    const hudSnap = clampedT >= fallTime ? getSnap(replay.fall.tick) : snapA;

    // Animate faint air lane chevrons (freezes after fall)
    for (let i = 0; i < airChevrons.length; i++) {
      const pulse = 0.25 + 0.30 * (0.5 + 0.5 * Math.sin(effTime * 5.0 - i * 0.7));
      airChevrons[i].mesh.scale.setScalar(0.88 + pulse * 0.28);
    }

    // 3. Keep state: red leak flash, progressive 10-chunk crumbling, and collapse at fallTick
    const isFallen = clampedT >= fallTime;
    keepIntact.visible = !isFallen;
    keepRuins.visible = isFallen;
    if (!isFallen) {
      const curHp = hudSnap.baseHp;
      for (let i = 0; i < 10; i++) {
        keepChunks[i].visible = i < curHp;
      }
      let leakFlash = 0;
      for (let i = 0; i < replay.leaks.length; i++) {
        const dt = clampedT - replay.leaks[i].time;
        if (dt >= 0 && dt < 0.30) leakFlash = Math.max(leakFlash, 1 - dt / 0.30);
      }
      applyColorDesat(workColor, keepBaseStone, desat);
      if (leakFlash > 0) workColor.lerp(keepFlashColor, leakFlash * 0.75);
      keepStoneMat.color.copy(workColor);
    }

    // 4. Update 16 Turrets (type, tier pips/rings, target rotation, recoil, build pop)
    for (let sIdx = 0; sIdx < 16; sIdx++) {
      const sv = slotVisuals[sIdx];
      const st = hudSnap.slots[sIdx];
      for (const tKey in sv.models) {
        sv.models[tKey].root.visible = !!(st && st.type === tKey);
      }
      for (let r = 0; r < 3; r++) {
        const showTier = !!(st && r < st.tier);
        sv.rings[r].visible = showTier;
        sv.pips[r].visible = showTier;
      }
      if (st) {
        const model = sv.models[st.type];
        const aim = getTurretAimAndRecoil(sIdx, effTime);
        if (st.type === "frost") {
          model.head.rotation.set(0, effTime * 1.8 + sIdx, 0);
          model.head.position.y = 0.82 + Math.sin(effTime * 3.5 + sIdx) * 0.03;
        } else {
          model.head.rotation.set(0, aim.yaw, 0);
          const recZ = -aim.recoil * 0.065;
          model.head.position.set(Math.sin(aim.yaw) * recZ, st.type === "lance" ? 0.38 : 0.34, Math.cos(aim.yaw) * recZ);
        }
        // Subtle scale-in pop right after build
        let scalePop = 1.0;
        for (let i = replay.slotOps.length - 1; i >= 0; i--) {
          const op = replay.slotOps[i];
          if (op.slot === sIdx && op.op === "B" && op.time <= effTime) {
            const dt = effTime - op.time;
            if (dt < 0.25) {
              const u = dt / 0.25;
              scalePop = 0.3 + 0.7 * (1 - Math.pow(1 - u, 3));
            }
            break;
          }
        }
        model.root.scale.setScalar(scalePop);
      }
    }

    // 5. Interpolate living enemies from tick k (snapA) toward tick k + 1 (snapB)
    const mapB = {};
    for (let i = 0; i < snapB.enemies.length; i++) {
      mapB[snapB.enemies[i].id] = snapB.enemies[i];
    }

    const liveList = [];
    for (let i = 0; i < snapA.enemies.length; i++) {
      const ea = snapA.enemies[i];
      const eb = mapB[ea.id];
      if (eb) {
        liveList.push({
          id: ea.id,
          type: ea.type,
          hp: Math.max(0, ea.hp + (eb.hp - ea.hp) * frac),
          maxHp: ea.maxHp,
          progress: ea.progress + (eb.progress - ea.progress) * frac,
          air: ea.air,
          slowed: ea.slowed
        });
      } else if (!isFallen && frac < 1) {
        const dRec = replay.deaths[ea.id];
        if (dRec && dRec.tick === k + 1) {
          const endP = dRec.isLeak ? (ea.air ? replay.airRoute.length : replay.groundRoute.length) : dRec.progress;
          liveList.push({
            id: ea.id,
            type: ea.type,
            hp: ea.hp,
            maxHp: ea.maxHp,
            progress: ea.progress + (endP - ea.progress) * frac,
            air: ea.air,
            slowed: ea.slowed
          });
        }
      }
    }

    let cGrunt = 0, cBrute = 0, cRunner = 0, cWisp = 0, cSplitter = 0, cSplitling = 0, cMender = 0, cHp = 0;

    for (let i = 0; i < liveList.length && cHp < MAX_ENEMIES; i++) {
      const e = liveList[i];
      const route = e.air ? replay.airRoute : replay.groundRoute;
      const rw = routePointWorld(route, e.progress);
      const bob = isFallen ? 0 : Math.sin(effTime * 10.0 + e.id * 1.7) * 0.028;
      let headY = 0.62;

      if (e.type === "grunt" && cGrunt < MAX_ENEMIES) {
        dummy.position.set(rw.x, 0.21 + Math.abs(bob), rw.z);
        dummy.rotation.set(0, rw.yaw, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        gruntMesh.setMatrixAt(cGrunt, dummy.matrix);
        tintColor(workColor, ENEMY_COLORS.grunt, e.slowed, desat);
        gruntMesh.setColorAt(cGrunt, workColor);

        dummy.position.set(rw.x, 0.36 + Math.abs(bob), rw.z);
        dummy.updateMatrix();
        gruntCrestMesh.setMatrixAt(cGrunt, dummy.matrix);
        tintColor(workColor, ENEMY_COLORS.gruntSub, e.slowed, desat);
        gruntCrestMesh.setColorAt(cGrunt, workColor);
        cGrunt++;
        headY = 0.62;
      } else if (e.type === "brute" && cBrute < MAX_ENEMIES) {
        dummy.position.set(rw.x, 0.29 + Math.abs(bob) * 0.6, rw.z);
        dummy.rotation.set(0, rw.yaw, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        bruteMesh.setMatrixAt(cBrute, dummy.matrix);
        tintColor(workColor, ENEMY_COLORS.bruteBody, e.slowed, desat);
        bruteMesh.setColorAt(cBrute, workColor);

        dummy.position.set(rw.x, 0.36 + Math.abs(bob) * 0.6, rw.z);
        dummy.updateMatrix();
        brutePlateMesh.setMatrixAt(cBrute, dummy.matrix);
        tintColor(workColor, ENEMY_COLORS.brutePlt, e.slowed, desat);
        brutePlateMesh.setColorAt(cBrute, workColor);
        cBrute++;
        headY = 0.78;
      } else if (e.type === "runner" && cRunner < MAX_ENEMIES) {
        dummy.position.set(rw.x, 0.20 + Math.abs(bob) * 1.2, rw.z);
        dummy.rotation.set(0, rw.yaw, 0);
        dummy.scale.set(1, 0.78, 1.15);
        dummy.updateMatrix();
        runnerMesh.setMatrixAt(cRunner, dummy.matrix);
        tintColor(workColor, ENEMY_COLORS.runner, e.slowed, desat);
        runnerMesh.setColorAt(cRunner, workColor);
        cRunner++;
        headY = 0.54;
      } else if (e.type === "wisp" && cWisp < MAX_ENEMIES) {
        const wy = 0.80 + (isFallen ? 0 : Math.sin(effTime * 5.5 + e.id) * 0.05);
        dummy.position.set(rw.x, wy, rw.z);
        dummy.rotation.set(0, effTime * 2.5 + e.id, 0);
        dummy.scale.set(1, 1.25, 1);
        dummy.updateMatrix();
        wispMesh.setMatrixAt(cWisp, dummy.matrix);
        tintColor(workColor, ENEMY_COLORS.wisp, e.slowed, desat);
        wispMesh.setColorAt(cWisp, workColor);

        dummy.position.set(rw.x, wy, rw.z);
        dummy.quaternion.copy(qBill);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        wispGlowMesh.setMatrixAt(cWisp, dummy.matrix);
        wispGlowMesh.setColorAt(cWisp, workColor);

        dummy.position.set(rw.x, 0.025, rw.z);
        dummy.rotation.set(0, 0, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        wispShadowMesh.setMatrixAt(cWisp, dummy.matrix);
        cWisp++;
        headY = 1.18;
      } else if (e.type === "splitter" && cSplitter < MAX_ENEMIES) {
        dummy.position.set(rw.x, 0.28 + Math.abs(bob), rw.z);
        dummy.rotation.set(effTime * 1.4, rw.yaw, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        splitterMesh.setMatrixAt(cSplitter, dummy.matrix);
        tintColor(workColor, ENEMY_COLORS.splitter, e.slowed, desat);
        splitterMesh.setColorAt(cSplitter, workColor);

        tintColor(workColor2, ENEMY_COLORS.splitPod, e.slowed, desat);
        for (let p = 0; p < 3; p++) {
          const a = effTime * 2.4 + e.id + (p * Math.PI * 2) / 3;
          dummy.position.set(rw.x + Math.cos(a) * 0.24, 0.28 + Math.abs(bob), rw.z + Math.sin(a) * 0.24);
          dummy.rotation.set(0, 0, 0);
          dummy.scale.set(1, 1, 1);
          dummy.updateMatrix();
          splitterPodMesh.setMatrixAt(cSplitter * 3 + p, dummy.matrix);
          splitterPodMesh.setColorAt(cSplitter * 3 + p, workColor2);
        }
        cSplitter++;
        headY = 0.68;
      } else if (e.type === "splitling" && cSplitling < MAX_ENEMIES) {
        dummy.position.set(rw.x, 0.16 + Math.abs(bob), rw.z);
        dummy.rotation.set(0, rw.yaw + effTime * 3.0, 0);
        dummy.scale.set(0.95, 0.95, 1.25);
        dummy.updateMatrix();
        splitlingMesh.setMatrixAt(cSplitling, dummy.matrix);
        tintColor(workColor, ENEMY_COLORS.splitling, e.slowed, desat);
        splitlingMesh.setColorAt(cSplitling, workColor);
        cSplitling++;
        headY = 0.44;
      } else if (e.type === "mender" && cMender < MAX_ENEMIES) {
        dummy.position.set(rw.x, 0.26 + Math.abs(bob) * 0.5, rw.z);
        dummy.rotation.set(0, rw.yaw, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        menderMesh.setMatrixAt(cMender, dummy.matrix);
        tintColor(workColor, ENEMY_COLORS.mender, e.slowed, desat);
        menderMesh.setColorAt(cMender, workColor);

        dummy.position.set(rw.x, 0.05, rw.z);
        dummy.rotation.set(0, 0, 0);
        const hScale = 0.95 + 0.12 * Math.sin(effTime * 4.5 + e.id);
        dummy.scale.set(hScale, 1, hScale);
        dummy.updateMatrix();
        menderHaloMesh.setMatrixAt(cMender, dummy.matrix);
        cMender++;
        headY = 0.68;
      }

      // Floating billboard health bar
      const ratio = Math.max(0.02, Math.min(1.0, e.hp / Math.max(1, e.maxHp)));
      dummy.position.set(rw.x, headY, rw.z);
      dummy.quaternion.copy(qBill);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      hpBgMesh.setMatrixAt(cHp, dummy.matrix);

      // Shift foreground bar left in billboard right-axis so it shrinks left-aligned
      const shift = -(1 - ratio) * 0.21;
      dummy.position.set(rw.x + shift, headY, rw.z);
      dummy.quaternion.copy(qBill);
      dummy.scale.set(ratio, 1, 1);
      dummy.updateMatrix();
      hpFgMesh.setMatrixAt(cHp, dummy.matrix);

      const baseHpCol = ratio > 0.55 ? COL_HP_HIGH : (ratio > 0.25 ? COL_HP_MID : COL_HP_LOW);
      applyColorDesat(workColor, baseHpCol, desat);
      hpFgMesh.setColorAt(cHp, workColor);
      cHp++;
    }

    function commitInst(im, cnt) {
      im.count = cnt;
      if (cnt > 0) {
        im.instanceMatrix.needsUpdate = true;
        if (im.instanceColor) im.instanceColor.needsUpdate = true;
      }
    }
    commitInst(gruntMesh, cGrunt);
    commitInst(gruntCrestMesh, cGrunt);
    commitInst(bruteMesh, cBrute);
    commitInst(brutePlateMesh, cBrute);
    commitInst(runnerMesh, cRunner);
    commitInst(wispMesh, cWisp);
    commitInst(wispGlowMesh, cWisp);
    commitInst(wispShadowMesh, cWisp);
    commitInst(splitterMesh, cSplitter);
    commitInst(splitterPodMesh, cSplitter * 3);
    commitInst(splitlingMesh, cSplitling);
    commitInst(menderMesh, cMender);
    commitInst(menderHaloMesh, cMender);
    commitInst(hpBgMesh, cHp);
    commitInst(hpFgMesh, cHp);

    // 6. Combat Visuals (Shots <= 0.15s, Mender Heal Rings, Build/Upg/Sell FX, Kill/Leak/Fall Debris & Shockwave)
    let cBeam = 0, cRing = 0, cSphere = 0, cDebris = 0;

    function addBeam(x0, y0, z0, x1, y1, z1, radius, hex) {
      if (cBeam >= 128) return;
      dirVec.set(x1 - x0, y1 - y0, z1 - z0);
      const len = dirVec.length();
      if (len < 0.01) return;
      dummy.position.set(x0, y0, z0);
      dummy.lookAt(x1, y1, z1);
      dummy.scale.set(radius, radius, len);
      dummy.updateMatrix();
      beamInst.setMatrixAt(cBeam, dummy.matrix);
      workColor.setHex(hex);
      applyColorDesat(workColor, workColor, desat);
      beamInst.setColorAt(cBeam, workColor);
      cBeam++;
    }

    function addRing(x, y, z, radius, hex) {
      if (cRing >= 128 || radius <= 0.01) return;
      dummy.position.set(x, y, z);
      dummy.rotation.set(0, 0, 0);
      dummy.scale.set(radius, 1, radius);
      dummy.updateMatrix();
      ringInst.setMatrixAt(cRing, dummy.matrix);
      workColor.setHex(hex);
      applyColorDesat(workColor, workColor, desat);
      ringInst.setColorAt(cRing, workColor);
      cRing++;
    }

    function addSphere(x, y, z, radius, hex) {
      if (cSphere >= 128 || radius <= 0.005) return;
      dummy.position.set(x, y, z);
      dummy.rotation.set(0, 0, 0);
      dummy.scale.setScalar(radius);
      dummy.updateMatrix();
      sphereInst.setMatrixAt(cSphere, dummy.matrix);
      workColor.setHex(hex);
      applyColorDesat(workColor, workColor, desat);
      sphereInst.setColorAt(cSphere, workColor);
      cSphere++;
    }

    function addDebris(x, y, z, sz, rot, hex) {
      if (cDebris >= 600 || sz <= 0.005) return;
      dummy.position.set(x, Math.max(0.04, y), z);
      dummy.rotation.set(rot, rot * 0.7, rot * 1.3);
      dummy.scale.setScalar(sz);
      dummy.updateMatrix();
      debrisInst.setMatrixAt(cDebris, dummy.matrix);
      workColor.setHex(hex);
      applyColorDesat(workColor, workColor, desat);
      debrisInst.setColorAt(cDebris, workColor);
      cDebris++;
    }

    if (!isFallen) {
      // Shots (duration <= 0.14s <= 0.15s)
      const SHOT_DUR = 0.14;
      for (let i = 0; i < replay.shots.length; i++) {
        const sh = replay.shots[i];
        if (sh.time > effTime) break;
        const dt = effTime - sh.time;
        if (dt < 0 || dt > SHOT_DUR) continue;
        const u = dt / SHOT_DUR;
        const y0 = sh.type === "frost" ? 0.80 : 0.44;
        const y1 = sh.targetAir ? 0.80 : 0.24;

        if (sh.type === "bolt") {
          const pA = Math.max(0, u - 0.45);
          const pB = Math.min(1, u * 1.45);
          addBeam(
            sh.x0 + (sh.x1 - sh.x0) * pA, y0 + (y1 - y0) * pA, sh.z0 + (sh.z1 - sh.z0) * pA,
            sh.x0 + (sh.x1 - sh.x0) * pB, y0 + (y1 - y0) * pB, sh.z0 + (sh.z1 - sh.z0) * pB,
            0.032, 0x6cb6ff
          );
        } else if (sh.type === "cannon") {
          if (u < 0.58) {
            const fu = u / 0.58;
            const sx = sh.x0 + (sh.x1 - sh.x0) * fu;
            const sz = sh.z0 + (sh.z1 - sh.z0) * fu;
            const sy = y0 + (y1 - y0) * fu + Math.sin(fu * Math.PI) * 0.72;
            addSphere(sx, sy, sz, 0.11, 0xffaa44);
          } else {
            const bu = (u - 0.58) / 0.42;
            addRing(sh.x1, 0.06, sh.z1, sh.splash * (0.35 + 0.65 * bu), 0xff9238);
            addSphere(sh.x1, 0.18, sh.z1, 0.24 * (1 - bu), 0xffcf70);
          }
        } else if (sh.type === "frost") {
          addBeam(sh.x0, y0, sh.z0, sh.x1, y1, sh.z1, 0.042 * (1 - u * 0.5), 0xc4f6ff);
          addSphere(sh.x1, y1, sh.z1, 0.16 * (1 - u), 0x8aefff);
        } else if (sh.type === "lance") {
          const fade = 1 - u;
          addBeam(sh.x0, y0, sh.z0, sh.x1, y1, sh.z1, 0.095 * fade, 0xff2948);
          addSphere(sh.x0, y0, sh.z0, 0.19 * fade, 0xff7088);
          addSphere(sh.x1, y1, sh.z1, 0.26 * fade, 0xff4060);
        } else if (sh.type === "flak") {
          if (u < 0.40) {
            const fu = u / 0.40;
            addBeam(sh.x0, y0, sh.z0, sh.x0 + (sh.x1 - sh.x0) * fu, y0 + (y1 - y0) * fu, sh.z0 + (sh.z1 - sh.z0) * fu, 0.036, 0x3bf5de);
          }
          const ru = Math.min(1, Math.max(0, (u - 0.2) / 0.8));
          addRing(sh.x1, 0.80, sh.z1, sh.splash * (0.28 + 0.72 * ru), 0x3bf5de);
        }
      }

      // Mender heal pulse rings (radius 1.50 tiles)
      for (let i = 0; i < replay.heals.length; i++) {
        const hl = replay.heals[i];
        if (hl.time > effTime) break;
        const dt = effTime - hl.time;
        if (dt >= 0 && dt < 0.45) {
          const u = dt / 0.45;
          addRing(hl.x, 0.06, hl.z, 1.50 * (0.15 + 0.85 * u), 0x4dff88);
        }
      }

      // Slot Build / Upgrade / Sell FX
      for (let i = 0; i < replay.slotOps.length; i++) {
        const op = replay.slotOps[i];
        if (op.time > effTime) break;
        const dt = effTime - op.time;
        if (dt < 0 || dt > 0.55) continue;
        const u = dt / 0.55;
        const sv = slotVisuals[op.slot];
        if (op.op === "B") {
          addRing(sv.wx, 0.12 + u * 0.55, sv.wz, 0.48 * (1 - u * 0.35), 0x8ef5ff);
          for (let p = 0; p < op.particles.length; p++) {
            const pt = op.particles[p];
            addSphere(
              sv.wx + Math.cos(pt.phase + dt * 6) * 0.32 * (1 - u * 0.4),
              0.12 + pt.vy * dt * 0.55,
              sv.wz + Math.sin(pt.phase + dt * 6) * 0.32 * (1 - u * 0.4),
              pt.s * (1 - u), 0xfff099
            );
          }
        } else if (op.op === "U") {
          addRing(sv.wx, 0.12, sv.wz, 0.35 + u * 0.65, 0xffdf6b);
          addBeam(sv.wx, 0.1, sv.wz, sv.wx, 1.25 * (1 - u * 0.3), sv.wz, 0.18 * (1 - u), 0xffe885);
        } else if (op.op === "S") {
          for (let p = 0; p < op.particles.length; p++) {
            const pt = op.particles[p];
            const py = Math.max(0.05, 0.32 + pt.vy * dt - 9.5 * dt * dt);
            addDebris(sv.wx + pt.vx * dt * 0.45, py, sv.wz + pt.vz * dt * 0.45, pt.s * 1.3 * (1 - u * 0.7), dt * 6 + p, 0x6c7385);
          }
        }
      }

      // Kill debris + Splitter 3-way burst
      const KILL_COLOR_HEX = {
        grunt: 0x7da174, brute: 0xff7d1a, runner: 0xffd829,
        wisp: 0x4bf7ff, splitter: 0xb659ff, splitling: 0xc978ff, mender: 0x7affaa
      };
      for (let i = 0; i < replay.kills.length; i++) {
        const kl = replay.kills[i];
        if (kl.time > effTime) break;
        const dt = effTime - kl.time;
        if (dt < 0 || dt > 0.50) continue;
        const u = dt / 0.50;
        const col = KILL_COLOR_HEX[kl.type] || 0xffffff;
        if (kl.isSplitter && dt < 0.32) {
          addRing(kl.x, 0.12, kl.z, 0.25 + (dt / 0.32) * 0.75, 0xc46eff);
        }
        for (let s = 0; s < kl.shards.length; s++) {
          const sh = kl.shards[s];
          let py = kl.y + sh.vy * dt - 13.5 * dt * dt;
          if (py < 0.05) py = 0.05 + Math.abs(py - 0.05) * 0.25;
          addDebris(kl.x + sh.vx * dt, py, kl.z + sh.vz * dt, sh.sz * (1 - u), sh.rot + dt * 9, col);
        }
      }
    }

    // Leak flying Keep wall chunks (visible even right around fall)
    for (let i = 0; i < replay.leaks.length; i++) {
      const lk = replay.leaks[i];
      if (lk.time > clampedT) break;
      const dt = clampedT - lk.time;
      if (dt < 0 || dt > 0.75) continue;
      const u = dt / 0.75;
      addRing(23.35, 0.10, 11.5, 0.5 + u * 1.4, 0xff3b3b);
      for (let d = 0; d < lk.debris.length; d++) {
        const ch = lk.debris[d];
        let py = ch.oy + ch.vy * dt - 12.0 * dt * dt;
        if (py < 0.06) py = 0.06;
        addDebris(23.35 + ch.ox + ch.vx * dt, py, 11.5 + ch.oz + ch.vz * dt, ch.sz * (1 - u * 0.5), dt * 7 + d, 0x868e9e);
      }
    }

    // Fall Keep collapse burst & giant shockwave ring
    if (replay.fall && clampedT >= fallTime) {
      const dt = clampedT - fallTime;
      if (dt < 1.35) {
        const u = dt / 1.35;
        addRing(23.35, 0.12, 11.5, 0.6 + u * 14.0, 0xff9d5c);
        if (dt < 0.7) addSphere(23.35, 0.65, 11.5, 1.35 * (1 - dt / 0.7), 0xffb36b);
      }
      const bDt = Math.min(dt, 1.25);
      for (let i = 0; i < replay.fall.burst.length; i++) {
        const b = replay.fall.burst[i];
        let py = b.oy + b.vy * bDt - 11.5 * bDt * bDt;
        if (py < 0.06) py = 0.06;
        addDebris(
          23.35 + b.ox + b.vx * bDt * 0.85,
          py,
          11.5 + b.oz + b.vz * bDt * 0.85,
          b.sz,
          bDt * 5 + i,
          b.warm ? 0xd97538 : 0x79808f
        );
      }
    }

    commitInst(beamInst, cBeam);
    commitInst(ringInst, cRing);
    commitInst(sphereInst, cSphere);
    commitInst(debrisInst, cDebris);

    // 7. Update HUD & render two-pass WebGL frame
    updateHud(hudSnap, clampedT);

    renderer.clear();
    renderer.render(scene, camera);
    renderer.clearDepth();
    renderer.render(hudScene, hudCam);
  }

  // =========================================================================
  // 5-STATE TIMELINE & PLAYBACK CONTROLS (SECTION 3 & 4)
  // =========================================================================
  const countdownEl = document.getElementById("countdown");
  const btnRefire = document.getElementById("btn-refire");
  const btnToggle = document.getElementById("btn-toggle");
  const iconPause = document.getElementById("icon-pause");
  const iconPlay = document.getElementById("icon-play");
  const scrubber = document.getElementById("scrubber");
  const speedPills = Array.prototype.slice.call(document.querySelectorAll(".speed-pill"));

  let state = "COUNTDOWN";
  let simTime = 0.0;
  let playbackSpeed = 1.0;
  let countdownElapsed = 0.0;
  let holdElapsed = 0.0;
  let firstRafAfterInit = true;
  let lastWallMs = 0;

  function setToggleVisual(showPause) {
    if (showPause) {
      iconPause.style.display = "";
      iconPlay.style.display = "none";
      btnToggle.setAttribute("aria-label", "Pause");
    } else {
      iconPause.style.display = "none";
      iconPlay.style.display = "";
      btnToggle.setAttribute("aria-label", "Play");
    }
  }

  function hideCountdown() {
    countdownEl.style.display = "none";
    countdownEl.textContent = "";
  }

  function enterState(nextState) {
    state = nextState;
    setAudioActive(nextState === "PLAYING");
    if (nextState === "PLAYING" || nextState === "COUNTDOWN" || nextState === "REFIRE_HOLD") {
      setToggleVisual(true);
    } else {
      setToggleVisual(false);
    }
  }

  btnToggle.addEventListener("click", function () {
    resumeAudioGesture();
    if (state === "PLAYING") {
      enterState("PAUSED");
    } else if (state === "COUNTDOWN" || state === "REFIRE_HOLD") {
      hideCountdown();
      simTime = 0.0;
      scrubber.value = "0";
      renderAtSimTime(0.0);
      enterState("PAUSED");
    } else if (state === "PAUSED") {
      enterState("PLAYING");
    } else if (state === "ENDED") {
      hideCountdown();
      simTime = 0.0;
      scrubber.value = "0.000";
      shotStamps.length = 0;
      renderAtSimTime(0.0);
      enterState("PLAYING");
    }
  });

  btnRefire.addEventListener("click", function () {
    resumeAudioGesture();
    hideCountdown();
    simTime = 0.0;
    scrubber.value = "0";
    holdElapsed = 0.0;
    shotStamps.length = 0;
    enterState("REFIRE_HOLD");
    renderAtSimTime(0.0);
  });

  speedPills.forEach(function (pill) {
    pill.addEventListener("click", function () {
      resumeAudioGesture();
      const spd = parseFloat(pill.getAttribute("data-speed"));
      if (!isNaN(spd)) playbackSpeed = spd;
      speedPills.forEach(function (p) {
        const active = p === pill;
        p.classList.toggle("is-active", active);
        p.setAttribute("aria-checked", active ? "true" : "false");
      });
    });
  });

  scrubber.addEventListener("input", function () {
    resumeAudioGesture();
    hideCountdown();
    const v = parseFloat(scrubber.value);
    simTime = isNaN(v) ? 0.0 : Math.max(0.0, Math.min(DURATION, v));
    enterState("PAUSED");
    renderAtSimTime(simTime);
  });

  // Initial resting scene render at simTime = 0.000 before starting rAF loop
  updateCameraFraming();
  countdownEl.style.display = "block";
  countdownEl.textContent = "3";
  scrubber.value = "0";
  setToggleVisual(true);
  renderAtSimTime(0.0);

  function onFrame(nowMs) {
    if (firstRafAfterInit) {
      firstRafAfterInit = false;
      lastWallMs = nowMs;
      countdownElapsed = 0.0;
      requestAnimationFrame(onFrame);
      return;
    }

    const rawDt = Math.max(0, (nowMs - lastWallMs) / 1000);
    lastWallMs = nowMs;
    const dt = Math.min(rawDt, 0.1);

    if (state === "COUNTDOWN") {
      countdownElapsed += dt;
      if (countdownElapsed < 1.0) {
        countdownEl.style.display = "block";
        countdownEl.textContent = "3";
        simTime = 0.0;
        scrubber.value = "0";
        renderAtSimTime(0.0);
      } else if (countdownElapsed < 2.0) {
        countdownEl.style.display = "block";
        countdownEl.textContent = "2";
        simTime = 0.0;
        scrubber.value = "0";
        renderAtSimTime(0.0);
      } else if (countdownElapsed < 3.0) {
        countdownEl.style.display = "block";
        countdownEl.textContent = "1";
        simTime = 0.0;
        scrubber.value = "0";
        renderAtSimTime(0.0);
      } else {
        hideCountdown();
        const over = Math.max(0, countdownElapsed - 3.0);
        simTime = 0.0;
        enterState("PLAYING");
        const nextT = Math.min(DURATION, over * playbackSpeed);
        triggerAudioWindow(0.0, nextT);
        simTime = nextT;
        scrubber.value = simTime.toFixed(3);
        renderAtSimTime(simTime);
      }
    } else if (state === "REFIRE_HOLD") {
      hideCountdown();
      holdElapsed += dt;
      if (holdElapsed >= 1.0) {
        const over = Math.max(0, holdElapsed - 1.0);
        simTime = 0.0;
        enterState("PLAYING");
        const nextT = Math.min(DURATION, over * playbackSpeed);
        triggerAudioWindow(0.0, nextT);
        simTime = nextT;
        scrubber.value = simTime.toFixed(3);
        renderAtSimTime(simTime);
      } else {
        renderAtSimTime(0.0);
      }
    } else if (state === "PLAYING") {
      const prevT = simTime;
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      scrubber.value = simTime.toFixed(3);
      triggerAudioWindow(prevT, simTime);
      renderAtSimTime(simTime);
      if (simTime >= DURATION) {
        simTime = DURATION;
        scrubber.value = DURATION.toFixed(3);
        renderAtSimTime(DURATION);
        enterState("ENDED");
      }
    }

    requestAnimationFrame(onFrame);
  }

  requestAnimationFrame(onFrame);
})();
</script>
</body>
</html>
