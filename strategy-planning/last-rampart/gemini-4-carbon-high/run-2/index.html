  function updateHUD(frame, simTime) {
    const W = Math.max(1, window.innerWidth);
    const H = Math.max(1, window.innerHeight);
    hudCamera.left = 0;
    hudCamera.right = W;
    hudCamera.top = H;
    hudCamera.bottom = 0;
    hudCamera.updateProjectionMatrix();

    const padX = Math.max(16, W * 0.016);
    const padY = Math.max(14, H * 0.018);

    // 1. Wave number (>= 7% of viewport height)
    const waveH = Math.max(46, H * 0.076);
    const iconSize = waveH * 0.72;
    waveIconGroup.position.set(padX + iconSize * 0.5, H - (padY + waveH * 0.5), 1);
    waveIconGroup.scale.set(iconSize, iconSize, 1);
    layoutDigits(waveDigits, frame.wave, padX + iconSize * 1.12, padY, waveH, H);

    // 2. Gold under wave number
    const goldY = padY + waveH + Math.max(6, H * 0.008);
    const goldH = Math.max(24, H * 0.041);
    const coinSz = goldH * 0.78;
    coinIconGroup.position.set(padX + iconSize * 0.5, H - (goldY + goldH * 0.5), 1);
    coinIconGroup.scale.set(coinSz, coinSz, 1);
    layoutDigits(goldDigits, frame.gold, padX + iconSize * 1.12, goldY, goldH, H);

    // 3. Next-wave preview under gold
    const prevY = goldY + goldH + Math.max(7, H * 0.010);
    const prevH = Math.max(19, H * 0.031);
    const counts = { grunt: 0, runner: 0, wisp: 0, brute: 0, splitter: 0, mender: 0 };
    if (frame.nextWave) {
      for (let i = 0; i < frame.nextWave.length; i++) {
        const ty = frame.nextWave[i];
        if (counts[ty] !== undefined) counts[ty]++;
      }
    }
    let curX = padX + prevH * 0.4;
    for (let i = 0; i < previewSlots.length; i++) {
      const ps = previewSlots[i];
      const cnt = counts[ps.type];
      if (cnt > 0) {
        ps.grp.visible = true;
        const icSz = prevH * 0.85;
        ps.grp.position.set(curX + icSz * 0.45, H - (prevY + prevH * 0.5), 1);
        ps.grp.scale.set(icSz, icSz, 1);
        curX = layoutDigits(ps.digits, cnt, curX + icSz * 1.0, prevY, prevH, H) + prevH * 0.48;
      } else {
        ps.grp.visible = false;
        for (let d = 0; d < ps.digits.length; d++) ps.digits[d].mesh.visible = false;
      }
    }

    // 4. Base HP (10 pips in top-right corner, with leak flash)
    const pipSz = Math.max(20, H * 0.034);
    const pipGap = pipSz * 1.16;
    const totalPipW = 9 * pipGap + pipSz;
    const startPipX = W - padX - totalPipW + pipSz * 0.5;
    const pipY = H - (padY + waveH * 0.38);
    const curHp = Math.max(0, frame.baseHp);

    for (let i = 0; i < 10; i++) {
      const p = hpPips[i];
      p.grp.position.set(startPipX + i * pipGap, pipY, 1);
      const dtLost = simTime - pipLostTime[i];
      if (i < curHp) {
        p.fill.visible = true;
        p.grp.scale.set(pipSz, pipSz, 1);
        p.fillMat.color.setHex(curHp <= 3 ? 0xff4958 : (curHp <= 6 ? 0xffb838 : 0x45f089));
        p.fillMat.opacity = 1.0;
      } else if (dtLost >= 0 && dtLost < 0.32) {
        const u = 1 - dtLost / 0.32;
        p.fill.visible = true;
        const boost = 1 + u * 0.45;
        p.grp.scale.set(pipSz * boost, pipSz * boost, 1);
        p.fillMat.color.setHex(dtLost < 0.10 ? 0xffffff : 0xff3b3b);
        p.fillMat.opacity = u;
      } else {
        p.fill.visible = false;
        p.grp.scale.set(pipSz, pipSz, 1);
      }
    }
  }

  // =========================================================================
  // Master Deterministic Render Function (Pure Function of simTime!)
  // =========================================================================
  const tmpMat = new THREE.Matrix4();
  const tmpPos = new THREE.Vector3();
  const tmpEnd = new THREE.Vector3();
  const tmpUp = new THREE.Vector3(0, 1, 0);
  const tmpQuat = new THREE.Quaternion();
  const tmpScale = new THREE.Vector3();
  const tmpEuler = new THREE.Euler();
  const tmpColor = new THREE.Color();
  const slowTintColor = new THREE.Color(0x52d4ff);

  function renderAtSimTime(simTime) {
    const clampedT = Math.max(0, Math.min(DURATION, simTime));
    const effectiveT = fallTick >= 0 ? Math.min(clampedT, fallTime) : clampedT;
    const scaled = effectiveT * 20;
    const k = Math.min(MAX_TICKS - 2, Math.floor(scaled));
    const alpha = fallTick >= 0 && clampedT >= fallTime ? 0 : (scaled - k);

    const frameA = replay.frames[k];
    const frameB = replay.frames[k + 1];

    // Desaturation after fall (ramps smoothly over 1.0s and holds until simTime = 100)
    const desat = (fallTick >= 0 && clampedT > fallTime)
      ? Math.min(0.92, (clampedT - fallTime) / 1.0)
      : 0.0;
    sharedUniforms.uDesat.value = desat;

    // Closed-form camera trauma shake
    const trauma = getTraumaAt(clampedT);
    const shakeAmp = trauma * trauma * 0.25;
    const sx = shakeAmp * smoothNoise(clampedT * 29.0, 11.3);
    const sy = shakeAmp * smoothNoise(clampedT * 31.0, 47.9) * 0.6;
    const sz = shakeAmp * smoothNoise(clampedT * 27.0, 93.1);
    camera.position.set(baseCamPos.x + sx, baseCamPos.y + sy, baseCamPos.z + sz);
    camera.lookAt(baseCamTarget.x + sx * 0.7, baseCamTarget.y, baseCamTarget.z + sz * 0.7);
    camera.updateMatrixWorld();

    // Animate Air Lane chevrons from simTime
    for (let i = 0; i < AIR_CHEVRON_COUNT; i++) {
      const prog = (((i / AIR_CHEVRON_COUNT) * AIR_WROUTE.length) + effectiveT * 220) % AIR_WROUTE.length;
      const pt = sampleRouteWorld(AIR_WROUTE, prog);
      tmpPos.set(pt.x, 0.79, pt.z);
      tmpEuler.set(0, pt.yaw, 0);
      tmpQuat.setFromEuler(tmpEuler);
      tmpScale.set(1, 1, 1);
      tmpMat.compose(tmpPos, tmpQuat, tmpScale);
      airChevrons.setMatrixAt(i, tmpMat);
    }
    airChevrons.instanceMatrix.needsUpdate = true;

    // Update 16 Turret Slots
    for (let s = 0; s < 16; s++) {
      const rig = slotTurretRigs[s];
      const st = frameA.slots[s];
      for (const ty of ["bolt", "cannon", "frost", "lance", "flak"]) {
        const m = rig.models[ty];
        if (st && st.type === ty) {
          m.root.visible = true;
          const sc = 1.0 + (st.tier - 1) * 0.09;
          m.root.scale.set(sc, sc, sc);
          m.head.rotation.y = slotAim[s][k];
          for (let r = 0; r < 3; r++) m.rings[r].visible = r < st.tier;
        } else {
          m.root.visible = false;
        }
      }
    }

    // Update Instanced Enemies & Health Bars
    let cGrunt = 0, cBrute = 0, cRunner = 0, cWisp = 0, cSplitter = 0, cSplitling = 0, cMender = 0, cHp = 0;
    const camQuat = camera.quaternion;

    for (let i = 0; i < frameA.enemies.length; i++) {
      const e0 = frameA.enemies[i];
      const e1 = frameB.enemyMap.get(e0.id);
      let prog = e0.progress;
      if (e1) {
        prog = e0.progress + (e1.progress - e0.progress) * alpha;
      } else if (alpha > 0) {
        const step = e0.slow > 0 ? Math.floor(e0.speed * 60 / 100) : e0.speed;
        prog = e0.progress + step * alpha;
      }
      const route = e0.air ? AIR_WROUTE : GROUND_WROUTE;
      const sample = sampleRouteWorld(route, prog);
      const isSlowed = e0.slow > 0;
      tmpColor.setHex(0xffffff);
      if (isSlowed) tmpColor.lerp(slowTintColor, 0.65);

      const bob = Math.sin(effectiveT * 10 + e0.id * 1.7) * 0.025;
      let headHeight = 0.56;

      if (e0.type === "grunt" && cGrunt < MAX_ENEMY_INST) {
        tmpPos.set(sample.x, 0.20 + Math.abs(bob), sample.z);
        tmpEuler.set(0, sample.yaw, 0);
        tmpQuat.setFromEuler(tmpEuler);
        tmpScale.set(1, 1, 1);
        tmpMat.compose(tmpPos, tmpQuat, tmpScale);
        gruntInst.setMatrixAt(cGrunt, tmpMat);
        gruntInst.setColorAt(cGrunt, tmpColor);
        cGrunt++;
        headHeight = 0.54;
      } else if (e0.type === "brute" && cBrute < MAX_ENEMY_INST) {
        tmpPos.set(sample.x, 0.29 + Math.abs(bob) * 0.6, sample.z);
        tmpEuler.set(0, sample.yaw, 0);
        tmpQuat.setFromEuler(tmpEuler);
        tmpScale.set(1, 1, 1);
        tmpMat.compose(tmpPos, tmpQuat, tmpScale);
        bruteBodyInst.setMatrixAt(cBrute, tmpMat);
        bruteBodyInst.setColorAt(cBrute, tmpColor);
        tmpPos.y += 0.08;
        tmpMat.compose(tmpPos, tmpQuat, tmpScale);
        brutePlateInst.setMatrixAt(cBrute, tmpMat);
        brutePlateInst.setColorAt(cBrute, tmpColor);
        cBrute++;
        headHeight = 0.76;
      } else if (e0.type === "runner" && cRunner < MAX_ENEMY_INST) {
        tmpPos.set(sample.x, 0.16, sample.z);
        tmpEuler.set(0, sample.yaw, 0);
        tmpQuat.setFromEuler(tmpEuler);
        tmpScale.set(1, 0.78, 1);
        tmpMat.compose(tmpPos, tmpQuat, tmpScale);
        runnerInst.setMatrixAt(cRunner, tmpMat);
        runnerInst.setColorAt(cRunner, tmpColor);
        cRunner++;
        headHeight = 0.44;
      } else if (e0.type === "wisp" && cWisp < MAX_ENEMY_INST) {
        const wy = 0.80 + Math.sin(effectiveT * 6.5 + e0.id) * 0.06;
        tmpPos.set(sample.x, wy, sample.z);
        tmpEuler.set(0, effectiveT * 2.8 + e0.id, 0);
        tmpQuat.setFromEuler(tmpEuler);
        tmpScale.set(1, 1.25, 1);
        tmpMat.compose(tmpPos, tmpQuat, tmpScale);
        wispInst.setMatrixAt(cWisp, tmpMat);
        wispInst.setColorAt(cWisp, tmpColor);

        tmpPos.set(sample.x, 0.015, sample.z);
        tmpQuat.identity();
        tmpScale.set(1, 1, 1);
        tmpMat.compose(tmpPos, tmpQuat, tmpScale);
        wispShadowInst.setMatrixAt(cWisp, tmpMat);
        cWisp++;
        headHeight = wy + 0.38;
      } else if (e0.type === "splitter" && cSplitter < MAX_ENEMY_INST) {
        tmpPos.set(sample.x, 0.28 + Math.abs(bob), sample.z);
        tmpEuler.set(effectiveT * 1.5, sample.yaw, 0);
        tmpQuat.setFromEuler(tmpEuler);
        tmpScale.set(1, 1, 1);
        tmpMat.compose(tmpPos, tmpQuat, tmpScale);
        splitterInst.setMatrixAt(cSplitter, tmpMat);
        splitterInst.setColorAt(cSplitter, tmpColor);
        cSplitter++;
        headHeight = 0.68;
      } else if (e0.type === "splitling" && cSplitling < MAX_ENEMY_INST) {
        tmpPos.set(sample.x, 0.15 + Math.abs(bob), sample.z);
        tmpEuler.set(0, sample.yaw + effectiveT * 4, 0);
        tmpQuat.setFromEuler(tmpEuler);
        tmpScale.set(1, 1, 1);
        tmpMat.compose(tmpPos, tmpQuat, tmpScale);
        splitlingInst.setMatrixAt(cSplitling, tmpMat);
        splitlingInst.setColorAt(cSplitling, tmpColor);
        cSplitling++;
        headHeight = 0.40;
      } else if (e0.type === "mender" && cMender < MAX_ENEMY_INST) {
        tmpPos.set(sample.x, 0.27 + Math.abs(bob), sample.z);
        tmpEuler.set(0, sample.yaw, 0);
        tmpQuat.setFromEuler(tmpEuler);
        tmpScale.set(1, 1, 1);
        tmpMat.compose(tmpPos, tmpQuat, tmpScale);
        menderInst.setMatrixAt(cMender, tmpMat);
        menderInst.setColorAt(cMender, tmpColor);

        tmpPos.set(sample.x, 0.08, sample.z);
        tmpQuat.identity();
        const pulse = 1.0 + 0.12 * Math.sin(effectiveT * 7 + e0.id);
        tmpScale.set(pulse, 1, pulse);
        tmpMat.compose(tmpPos, tmpQuat, tmpScale);
        menderHaloInst.setMatrixAt(cMender, tmpMat);
        cMender++;
        headHeight = 0.68;
      }

      // Billboarded Health Bar above every living enemy
      if (cHp < MAX_ENEMY_INST) {
        const frac = Math.max(0.02, Math.min(1, e0.hp / Math.max(1, e0.maxHp)));
        tmpPos.set(sample.x, headHeight, sample.z);
        tmpScale.set(1, 1, 1);
        tmpMat.compose(tmpPos, camQuat, tmpScale);
        hpBgInst.setMatrixAt(cHp, tmpMat);

        // Shift fill bar left in camera-right space so it shrinks left-to-right cleanly
        const shift = -(1 - frac) * 0.195;
        tmpPos.set(sample.x + shift, headHeight, sample.z);
        tmpScale.set(frac, 1, 1);
        tmpMat.compose(tmpPos, camQuat, tmpScale);
        hpFgInst.setMatrixAt(cHp, tmpMat);
        if (isSlowed) tmpColor.setHex(0x5ae2ff);
        else if (frac > 0.55) tmpColor.setHex(0x4eff7b);
        else if (frac > 0.25) tmpColor.setHex(0xffbe3b);
        else tmpColor.setHex(0xff424e);
        hpFgInst.setColorAt(cHp, tmpColor);
        cHp++;
      }
    }

    function commitInst(inst, count, hasColors) {
      inst.count = count;
      if (count > 0) {
        inst.instanceMatrix.needsUpdate = true;
        if (hasColors && inst.instanceColor) inst.instanceColor.needsUpdate = true;
      }
    }
    commitInst(gruntInst, cGrunt, true);
    commitInst(bruteBodyInst, cBrute, true);
    commitInst(brutePlateInst, cBrute, true);
    commitInst(runnerInst, cRunner, true);
    commitInst(wispInst, cWisp, true);
    commitInst(wispShadowInst, cWisp, false);
    commitInst(splitterInst, cSplitter, true);
    commitInst(splitlingInst, cSplitling, true);
    commitInst(menderInst, cMender, true);
    commitInst(menderHaloInst, cMender, false);
    commitInst(hpBgInst, cHp, false);
    commitInst(hpFgInst, cHp, true);

    // Shots (at most 0.15s = 3 ticks window, closed-form in simTime!)
    let cBeam = 0, cShell = 0, cRing = 0, cPart = 0;
    const minShotTick = Math.max(0, Math.floor((clampedT - 0.15) * 20));
    const maxShotTick = Math.min(MAX_TICKS - 1, Math.floor(clampedT * 20));

    if (clampedT < fallTime) {
      for (let tk = minShotTick; tk <= maxShotTick; tk++) {
        const list = shotsByTick[tk];
        const dt = clampedT - tk / 20;
        if (dt < 0 || dt > 0.15) continue;
        const u = dt / 0.15;

        for (let j = 0; j < list.length; j++) {
          const sh = list[j];
          const sx = SLOT_TILES[sh.slot][0] + 0.5;
          const sz = SLOT_TILES[sh.slot][1] + 0.5;
          const sy = 0.44;
          const ex = sh.tx * 0.01;
          const ez = sh.ty * 0.01;
          const ey = sh.air ? 0.80 : 0.24;

          if (sh.type === "cannon") {
            if (u < 0.65 && cShell < MAX_SHELLS) {
              const su = u / 0.65;
              tmpPos.set(
                sx + (ex - sx) * su,
                sy + (ey - sy) * su + 4 * 0.95 * su * (1 - su),
                sz + (ez - sz) * su
              );
              tmpQuat.identity();
              tmpScale.set(1.15, 1.15, 1.15);
              tmpMat.compose(tmpPos, tmpQuat, tmpScale);
              shellInst.setMatrixAt(cShell, tmpMat);
              tmpColor.setHex(0xffb454);
              shellInst.setColorAt(cShell, tmpColor);
              cShell++;
            }
            if (u >= 0.35 && cRing < MAX_RINGS) {
              const ru = (u - 0.35) / 0.65;
              const rad = 0.90 * (0.25 + 0.75 * ru); // exact 90 centi-tile splash radius!
              tmpPos.set(ex, 0.04, ez);
              tmpQuat.identity();
              tmpScale.set(rad, 1, rad);
              tmpMat.compose(tmpPos, tmpQuat, tmpScale);
              ringInst.setMatrixAt(cRing, tmpMat);
              tmpColor.setHex(0xff9238).multiplyScalar(1 - ru * 0.65);
              ringInst.setColorAt(cRing, tmpColor);
              cRing++;
            }
          } else if (sh.type === "flak") {
            if (u < 0.5 && cBeam < MAX_BEAMS) {
              const dx = ex - sx, dy = ey - sy, dz = ez - sz;
              const dist = Math.hypot(dx, dy, dz);
              tmpPos.set(sx, sy, sz);
              tmpEnd.set(ex, ey, ez);
              tmpMat.lookAt(tmpEnd, tmpPos, tmpUp);
              tmpQuat.setFromRotationMatrix(tmpMat);
              tmpScale.set(0.032, 0.032, dist);
              tmpMat.compose(tmpPos, tmpQuat, tmpScale);
              beamInst.setMatrixAt(cBeam, tmpMat);
              tmpColor.setHex(0x2ef5cc);
              beamInst.setColorAt(cBeam, tmpColor);
              cBeam++;
            }
            if (cRing < MAX_RINGS) {
              const rad = 0.70 * (0.3 + 0.7 * u); // exact 70 centi-tile flak splash radius in air!
              tmpPos.set(ex, 0.80, ez);
              tmpQuat.identity();
              tmpScale.set(rad, 1, rad);
              tmpMat.compose(tmpPos, tmpQuat, tmpScale);
              ringInst.setMatrixAt(cRing, tmpMat);
              tmpColor.setHex(0x28f0c8).multiplyScalar(1 - u * 0.55);
              ringInst.setColorAt(cRing, tmpColor);
              cRing++;
            }
          } else {
            // bolt (thin steel-blue tracer), frost (pale beam), lance (thick crimson beam + flash)
            if (cBeam < MAX_BEAMS) {
              const dx = ex - sx, dy = ey - sy, dz = ez - sz;
              const dist = Math.max(0.05, Math.hypot(dx, dy, dz));
              let thick = 0.030;
              let hex = 0x74b9ff;
              if (sh.type === "frost") { thick = 0.048 * (1 - u * 0.5); hex = 0xcbf3ff; }
              else if (sh.type === "lance") { thick = 0.105 * (1 - u * 0.45); hex = 0xff2e46; }
              else { thick = 0.028 * (1 - u * 0.5); }

              tmpPos.set(sx, sy, sz);
              tmpEnd.set(ex, ey, ez);
              tmpMat.lookAt(tmpEnd, tmpPos, tmpUp);
              tmpQuat.setFromRotationMatrix(tmpMat);
              tmpScale.set(thick, thick, dist);
              tmpMat.compose(tmpPos, tmpQuat, tmpScale);
              beamInst.setMatrixAt(cBeam, tmpMat);
              tmpColor.setHex(hex);
              beamInst.setColorAt(cBeam, tmpColor);
              cBeam++;
            }
            if (sh.type === "lance" && cShell < MAX_SHELLS) {
              const flashS = 2.1 * (1 - u);
              tmpPos.set(ex, ey, ez);
              tmpQuat.identity();
              tmpScale.set(flashS, flashS, flashS);
              tmpMat.compose(tmpPos, tmpQuat, tmpScale);
              shellInst.setMatrixAt(cShell, tmpMat);
              tmpColor.setHex(0xff5e70);
              shellInst.setColorAt(cShell, tmpColor);
              cShell++;
            }
          }
        }
      }
    }

    // Mender Heal Pulse Rings (exact 1.50 tile radius = 150 centi-tiles)
    for (let i = 0; i < replay.heals.length; i++) {
      const h = replay.heals[i];
      const dt = clampedT - h.tick / 20;
      if (dt < 0 || dt > 0.45) continue;
      if (cRing >= MAX_RINGS) break;
      const u = dt / 0.45;
      const rad = 1.50 * (0.2 + 0.8 * u);
      tmpPos.set(h.x * 0.01, 0.05, h.y * 0.01);
      tmpQuat.identity();
      tmpScale.set(rad, 1, rad);
      tmpMat.compose(tmpPos, tmpQuat, tmpScale);
      ringInst.setMatrixAt(cRing, tmpMat);
      tmpColor.setHex(0x42ff96).multiplyScalar(1 - u * 0.7);
      ringInst.setColorAt(cRing, tmpColor);
      cRing++;
    }

    // Kill Ballistic Debris + Splitter Burst Rings (closed-form in dt!)
    for (let i = 0; i < killBursts.length; i++) {
      const kb = killBursts[i];
      const dt = clampedT - kb.t0;
      if (dt < 0 || dt > 0.50) continue;
      const u = dt / 0.50;
      if (kb.isSplitter && dt < 0.35 && cRing < MAX_RINGS) {
        const ru = dt / 0.35;
        tmpPos.set(kb.wx, 0.06, kb.wz);
        tmpQuat.identity();
        const rad = 0.65 * (0.25 + 0.75 * ru);
        tmpScale.set(rad, 1, rad);
        tmpMat.compose(tmpPos, tmpQuat, tmpScale);
        ringInst.setMatrixAt(cRing, tmpMat);
        tmpColor.setHex(0xc864ff).multiplyScalar(1 - ru * 0.6);
        ringInst.setColorAt(cRing, tmpColor);
        cRing++;
      }
      for (let p = 0; p < kb.parts.length; p++) {
        if (cPart >= MAX_PARTICLES) break;
        const pt = kb.parts[p];
        const px = kb.wx + pt.vx * dt;
        const py = Math.max(0.03, kb.wy + pt.vy * dt - 0.5 * 11.5 * dt * dt);
        const pz = kb.wz + pt.vz * dt;
        const sc = pt.sz * (1 - u * 0.85);
        tmpPos.set(px, py, pz);
        tmpEuler.set(pt.rx * dt, 0, pt.rz * dt);
        tmpQuat.setFromEuler(tmpEuler);
        tmpScale.set(sc, sc, sc);
        tmpMat.compose(tmpPos, tmpQuat, tmpScale);
        partInst.setMatrixAt(cPart, tmpMat);
        tmpColor.setHex(kb.col);
        partInst.setColorAt(cPart, tmpColor);
        cPart++;
      }
    }

    // Build Sparkles, Upgrade Ring Pulses & Sell Rubble Collapses
    for (let i = 0; i < buildBursts.length; i++) {
      const bb = buildBursts[i];
      const dt = clampedT - bb.t0;
      if (dt < 0 || dt > 0.65) continue;
      const u = dt / 0.65;
      if ((bb.op === "B" || bb.op === "U") && cRing < MAX_RINGS) {
        const rad = (bb.op === "U" ? 0.72 : 0.55) * (0.3 + 0.7 * u);
        tmpPos.set(bb.wx, 0.14 + (bb.op === "B" ? u * 0.45 : 0.05), bb.wz);
        tmpQuat.identity();
        tmpScale.set(rad, 1, rad);
        tmpMat.compose(tmpPos, tmpQuat, tmpScale);
        ringInst.setMatrixAt(cRing, tmpMat);
        tmpColor.setHex(bb.col).multiplyScalar(1 - u * 0.65);
        ringInst.setColorAt(cRing, tmpColor);
        cRing++;
      }
      for (let p = 0; p < bb.parts.length; p++) {
        if (cPart >= MAX_PARTICLES) break;
        const pt = bb.parts[p];
        let px, py, pz;
        if (bb.op === "S") {
          px = bb.wx + pt.ox + pt.vx * dt;
          py = Math.max(0.03, 0.28 + pt.vy * dt - 0.5 * 12.0 * dt * dt);
          pz = bb.wz + pt.oz + pt.vz * dt;
        } else {
          px = bb.wx + pt.ox * (1 - u * 0.35);
          py = 0.15 + pt.vy * dt;
          pz = bb.wz + pt.oz * (1 - u * 0.35);
        }
        const sc = pt.sz * (1 - u * 0.75);
        tmpPos.set(px, py, pz);
        tmpEuler.set(dt * 5, dt * 4, 0);
        tmpQuat.setFromEuler(tmpEuler);
        tmpScale.set(sc, sc, sc);
        tmpMat.compose(tmpPos, tmpQuat, tmpScale);
        partInst.setMatrixAt(cPart, tmpMat);
        tmpColor.setHex(bb.col);
        partInst.setColorAt(cPart, tmpColor);
        cPart++;
      }
    }

    commitInst(beamInst, cBeam, true);
    commitInst(shellInst, cShell, true);
    commitInst(ringInst, cRing, true);
    commitInst(partInst, cPart, true);

    // Keep Leak Flash, Progressive Crumbling Wall Chunks & Final Fall Collapse
    let leakFlash = 0;
    for (let i = 0; i < replay.leaks.length; i++) {
      const dtL = clampedT - replay.leaks[i].tick / 20;
      if (dtL >= 0 && dtL < 0.28) {
        leakFlash = Math.max(leakFlash, 1 - dtL / 0.28);
      }
    }
    keepStoneMat.emissive.setRGB(leakFlash * 0.85, leakFlash * 0.08, leakFlash * 0.05);

    for (let i = 0; i < 10; i++) {
      const ch = keepWallChunks[i];
      const dtChunk = clampedT - pipLostTime[i];
      if (dtChunk < 0) {
        ch.mesh.visible = true;
        ch.mesh.position.set(ch.ox, ch.oy, ch.oz);
        ch.mesh.rotation.set(0, 0, 0);
      } else {
        const flyT = Math.min(0.65, dtChunk);
        const py = Math.max(0.12 - ch.oy, ch.vy * flyT - 0.5 * 13.0 * flyT * flyT);
        ch.mesh.visible = clampedT < fallTime;
        ch.mesh.position.set(ch.ox + ch.vx * flyT, ch.oy + py, ch.oz + ch.vz * flyT);
        ch.mesh.rotation.set(ch.rx * flyT, 0, ch.rz * flyT);
      }
    }

    if (fallTick >= 0 && clampedT >= fallTime) {
      const dtFall = clampedT - fallTime;
      const sink = Math.min(1.0, dtFall / 0.55);
      keepIntactGroup.position.y = -sink * 1.15;
      keepIntactGroup.rotation.z = sink * 0.22;
      keepIntactGroup.visible = sink < 0.98;

      // Keep collapse ballistic rubble (settles on ground permanently until simTime = 100)
      fallDebrisInst.count = FALL_DEBRIS_COUNT;
      for (let i = 0; i < FALL_DEBRIS_COUNT; i++) {
        const d = fallDebrisData[i];
        const tPhys = Math.min(1.15, dtFall);
        let py = d.oy + d.vy * tPhys - 0.5 * 12.5 * tPhys * tPhys;
        let settleT = tPhys;
        if (py < 0.08 * d.sc) {
          py = 0.08 * d.sc;
          // Solve approximate ground impact time so horizontal slide stops cleanly on ground!
          const disc = d.vy * d.vy + 2 * 12.5 * Math.max(0, d.oy - 0.08 * d.sc);
          settleT = Math.min(tPhys, (d.vy + Math.sqrt(disc)) / 12.5);
        }
        tmpPos.set(d.ox + d.vx * settleT, py, d.oz + d.vz * settleT);
        tmpEuler.set(d.rx * settleT, 0.5 * i, d.rz * settleT);
        tmpQuat.setFromEuler(tmpEuler);
        tmpScale.set(d.sc, d.sc * 0.75, d.sc);
        tmpMat.compose(tmpPos, tmpQuat, tmpScale);
        fallDebrisInst.setMatrixAt(i, tmpMat);
      }
      fallDebrisInst.instanceMatrix.needsUpdate = true;

      if (dtFall < 1.35) {
        const ru = dtFall / 1.35;
        fallRingMesh.visible = true;
        const rad = 0.8 + ru * 18.0;
        fallRingMesh.scale.set(rad, 1, rad);
        fallRingMat.opacity = (1 - ru) * 0.88;
      } else {
        fallRingMesh.visible = false;
      }
    } else {
      keepIntactGroup.visible = true;
      keepIntactGroup.position.set(0, 0, 0);
      keepIntactGroup.rotation.set(0, 0, 0);
      fallDebrisInst.count = 0;
      fallRingMesh.visible = false;
    }

    // Update Wordless HUD
    updateHUD(frameA, clampedT);

    // Render 3D scene + HUD orthographic overlay inside #stage
    renderer.clear();
    renderer.render(scene, camera);
    renderer.clearDepth();
    renderer.render(hudScene, hudCamera);
  }

  // =========================================================================
  // Section 6: Synthesized Web Audio SFX (No Music, Seed 4242, State-Synced)
  // =========================================================================
  const sfxRng = mulberry32(4242);
  let audioCtx = null;
  let masterGain = null;
  let windGain = null;
  const activeNodes = new Set();
  let noiseBuffer = null;

  function initAudio() {
    if (audioCtx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      audioCtx = new AC();
      const comp = audioCtx.createDynamicsCompressor();
      comp.threshold.value = -14;
      comp.knee.value = 18;
      comp.ratio.value = 6;
      comp.attack.value = 0.003;
      comp.release.value = 0.15;
      comp.connect(audioCtx.destination);

      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.0;
      masterGain.connect(comp);

      // Prebuild deterministic white-noise buffer from seed 4242
      const len = audioCtx.sampleRate * 2;
      noiseBuffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = rand01(sfxRng) * 2 - 1;

      // Continuous low desolate wind node (audible only during PLAYING after fallTick!)
      const windSrc = audioCtx.createBufferSource();
      windSrc.buffer = noiseBuffer;
      windSrc.loop = true;
      const windFilter = audioCtx.createBiquadFilter();
      windFilter.type = "bandpass";
      windFilter.frequency.value = 230;
      windFilter.Q.value = 2.8;
      windGain = audioCtx.createGain();
      windGain.gain.value = 0.0;
      windSrc.connect(windFilter);
      windFilter.connect(windGain);
      windGain.connect(masterGain);
      windSrc.start();

      audioCtx.resume().catch(function () {});
    } catch (_e) {
      audioCtx = null;
    }
  }

  function resumeAudioOnGesture() {
    if (!audioCtx) initAudio();
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume().catch(function () {});
    }
  }
  window.addEventListener("pointerdown", resumeAudioOnGesture, { passive: true });
  window.addEventListener("keydown", resumeAudioOnGesture, { passive: true });
  initAudio();

  function trackNode(node) {
    activeNodes.add(node);
    node.onended = function () { activeNodes.delete(node); };
  }

  function silenceAllOneShots() {
    if (!audioCtx || !masterGain) return;
    const now = audioCtx.currentTime;
    masterGain.gain.cancelScheduledValues(now);
    masterGain.gain.setValueAtTime(masterGain.gain.value, now);
    masterGain.gain.linearRampToValueAtTime(0.0, now + 0.035);
    if (windGain) {
      windGain.gain.cancelScheduledValues(now);
      windGain.gain.setValueAtTime(windGain.gain.value, now);
      windGain.gain.linearRampToValueAtTime(0.0, now + 0.035);
    }
    activeNodes.forEach(function (n) {
      try { n.stop(now + 0.04); } catch (_e) {}
    });
    activeNodes.clear();
  }

  function makePanOut(worldX) {
    if (audioCtx.createStereoPanner) {
      const p = audioCtx.createStereoPanner();
      p.pan.value = Math.max(-0.9, Math.min(0.9, ((worldX / 24) * 2 - 1) * 0.85));
      p.connect(masterGain);
      return p;
    }
    return masterGain;
  }

  function playShotSound(type, worldX) {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const dest = makePanOut(worldX);
    const jitter = 0.94 + rand01(sfxRng) * 0.12;

    if (type === "lance") {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(680 * jitter, now);
      osc.frequency.exponentialRampToValueAtTime(105, now + 0.095);
      g.gain.setValueAtTime(0.18, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.10);
      osc.connect(g); g.connect(dest);
      osc.start(now); osc.stop(now + 0.105);
      trackNode(osc);
    } else if (type === "cannon") {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(155 * jitter, now);
      osc.frequency.exponentialRampToValueAtTime(42, now + 0.12);
      g.gain.setValueAtTime(0.22, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
      osc.connect(g); g.connect(dest);
      osc.start(now); osc.stop(now + 0.135);
      trackNode(osc);

      const nSrc = audioCtx.createBufferSource();
      nSrc.buffer = noiseBuffer;
      const lp = audioCtx.createBiquadFilter();
      lp.type = "lowpass"; lp.frequency.value = 380;
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(0.14, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
      nSrc.connect(lp); lp.connect(ng); ng.connect(dest);
      nSrc.start(now, rand01(sfxRng) * 1.2, 0.12);
      trackNode(nSrc);
    } else if (type === "flak") {
      const nSrc = audioCtx.createBufferSource();
      nSrc.buffer = noiseBuffer;
      const bp = audioCtx.createBiquadFilter();
      bp.type = "bandpass"; bp.frequency.value = 620 * jitter; bp.Q.value = 1.8;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.15, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.075);
      nSrc.connect(bp); bp.connect(g); g.connect(dest);
      nSrc.start(now, rand01(sfxRng) * 1.2, 0.08);
      trackNode(nSrc);
    } else if (type === "frost") {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(1480 * jitter, now);
      osc.frequency.exponentialRampToValueAtTime(2150 * jitter, now + 0.085);
      g.gain.setValueAtTime(0.09, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
      osc.connect(g); g.connect(dest);
      osc.start(now); osc.stop(now + 0.095);
      trackNode(osc);
    } else {
      // bolt
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(920 * jitter, now);
      osc.frequency.exponentialRampToValueAtTime(250, now + 0.045);
      g.gain.setValueAtTime(0.09, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
      osc.connect(g); g.connect(dest);
      osc.start(now); osc.stop(now + 0.055);
      trackNode(osc);
    }
  }

  function playKillPop(worldX) {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const dest = makePanOut(worldX);
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(290 + rand01(sfxRng) * 80, now);
    osc.frequency.exponentialRampToValueAtTime(115, now + 0.055);
    g.gain.setValueAtTime(0.085, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
    osc.connect(g); g.connect(dest);
    osc.start(now); osc.stop(now + 0.065);
    trackNode(osc);
  }

  function playWaveHorn() {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const dest = makePanOut(2.0);
    const osc = audioCtx.createOscillator();
    const lp = audioCtx.createBiquadFilter();
    const g = audioCtx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(196, now);
    osc.frequency.setValueAtTime(293.66, now + 0.14);
    lp.type = "lowpass";
    lp.frequency.setValueAtTime(750, now);
    g.gain.setValueAtTime(0.001, now);
    g.gain.linearRampToValueAtTime(0.14, now + 0.05);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.42);
    osc.connect(lp); lp.connect(g); g.connect(dest);
    osc.start(now); osc.stop(now + 0.44);
    trackNode(osc);
  }

  function playLeakAlarm() {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const dest = makePanOut(23.0);

    // Stone crack
    const nSrc = audioCtx.createBufferSource();
    nSrc.buffer = noiseBuffer;
    const bp = audioCtx.createBiquadFilter();
    bp.type = "bandpass"; bp.frequency.value = 950; bp.Q.value = 1.2;
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.25, now);
    ng.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
    nSrc.connect(bp); bp.connect(ng); ng.connect(dest);
    nSrc.start(now, rand01(sfxRng), 0.18);
    trackNode(nSrc);

    // Alarm tone
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(540, now);
    osc.frequency.setValueAtTime(405, now + 0.11);
    g.gain.setValueAtTime(0.11, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
    osc.connect(g); g.connect(dest);
    osc.start(now); osc.stop(now + 0.26);
    trackNode(osc);
  }

  function playFallCollapse() {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const dest = makePanOut(22.5);

    const sub = audioCtx.createOscillator();
    const sg = audioCtx.createGain();
    sub.type = "sine";
    sub.frequency.setValueAtTime(86, now);
    sub.frequency.exponentialRampToValueAtTime(24, now + 1.35);
    sg.gain.setValueAtTime(0.38, now);
    sg.gain.exponentialRampToValueAtTime(0.001, now + 1.45);
    sub.connect(sg); sg.connect(dest);
    sub.start(now); sub.stop(now + 1.5);
    trackNode(sub);

    const nSrc = audioCtx.createBufferSource();
    nSrc.buffer = noiseBuffer;
    const lp = audioCtx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.setValueAtTime(520, now);
    lp.frequency.exponentialRampToValueAtTime(95, now + 1.4);
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.34, now);
    ng.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
    nSrc.connect(lp); lp.connect(ng); ng.connect(dest);
    nSrc.start(now, 0, 1.55);
    trackNode(nSrc);
  }

  // Shot rate limiter: strictly <= 12 shot sounds per wall-clock second, loudest priority first
  const SHOT_PRIORITY = { lance: 5, cannon: 4, flak: 3, frost: 2, bolt: 1 };
  const recentShotWallTimes = [];
  let lastKillWallTime = -1;

  // Index events by tick for fast forward-playback audio triggering
  const killsByTick = Array.from({ length: MAX_TICKS }, () => []);
  for (let i = 0; i < replay.kills.length; i++) {
    if (replay.kills[i].tick < MAX_TICKS) killsByTick[replay.kills[i].tick].push(replay.kills[i]);
  }
  const leaksByTick = new Uint8Array(MAX_TICKS);
  for (let i = 0; i < replay.leaks.length; i++) {
    if (replay.leaks[i].tick < MAX_TICKS) leaksByTick[replay.leaks[i].tick] = 1;
  }
  const wavesByTick = new Uint8Array(MAX_TICKS);
  for (let i = 0; i < replay.waves.length; i++) {
    if (replay.waves[i].tick < MAX_TICKS) wavesByTick[replay.waves[i].tick] = 1;
  }

  function stepAudioForward(prevSim, nextSim, wallNowSec) {
    if (!audioCtx || !masterGain) return;
    const now = audioCtx.currentTime;
    masterGain.gain.setTargetAtTime(0.72, now, 0.015);

    // Post-fall wind vs combat sounds
    if (fallTick >= 0 && nextSim > fallTime) {
      if (windGain) windGain.gain.setTargetAtTime(0.16, now, 0.12);
    } else if (windGain) {
      windGain.gain.setTargetAtTime(0.0, now, 0.02);
    }

    const tStart = Math.floor(prevSim * 20) + 1;
    const tEnd = Math.min(MAX_TICKS - 1, Math.floor(nextSim * 20));
    if (tEnd < tStart) return;

    while (recentShotWallTimes.length > 0 && wallNowSec - recentShotWallTimes[0] >= 1.0) {
      recentShotWallTimes.shift();
    }

    const candidateShots = [];
    for (let tk = tStart; tk <= tEnd; tk++) {
      if (fallTick >= 0 && tk > fallTick) break;
      if (tk === fallTick) {
        playFallCollapse();
        break;
      }
      if (wavesByTick[tk]) playWaveHorn();
      if (leaksByTick[tk]) playLeakAlarm();
      if (killsByTick[tk].length > 0 && wallNowSec - lastKillWallTime >= 0.055) {
        playKillPop(killsByTick[tk][0].x * 0.01);
        lastKillWallTime = wallNowSec;
      }
      const shs = shotsByTick[tk];
      for (let j = 0; j < shs.length; j++) candidateShots.push(shs[j]);
    }

    if (candidateShots.length > 0 && recentShotWallTimes.length < 12) {
      candidateShots.sort((a, b) => SHOT_PRIORITY[b.type] - SHOT_PRIORITY[a.type]);
      const budget = Math.min(2, 12 - recentShotWallTimes.length, candidateShots.length);
      for (let i = 0; i < budget; i++) {
        const sh = candidateShots[i];
        playShotSound(sh.type, SLOT_TILES[sh.slot][0] + 0.5);
        recentShotWallTimes.push(wallNowSec);
      }
    }
  }

  // =========================================================================
  // Section 3: Exact 5-State Playback State Machine & Controls
  // =========================================================================
  const countdownEl = document.getElementById("countdown");
  const btnRefire = document.getElementById("btn-refire");
  const btnToggle = document.getElementById("btn-toggle");
  const iconPause = document.getElementById("icon-pause");
  const iconPlay = document.getElementById("icon-play");
  const speedPills = Array.from(document.querySelectorAll(".speed-pill"));
  const scrubber = document.getElementById("scrubber");

  let playbackState = "INIT"; // transitions to COUNTDOWN on first rAF after resting render
  let simTime = 0.000;
  let playbackSpeed = 1.0;
  let countdownElapsed = 0.000;
  let holdElapsed = 0.000;
  let isScrubDragging = false;
  let lastWallMs = null;

  function setToggleIcon(showPause) {
    iconPause.style.display = showPause ? "" : "none";
    iconPlay.style.display = showPause ? "none" : "";
    btnToggle.setAttribute("aria-label", showPause ? "Pause" : "Play");
  }

  function hideCountdown() {
    countdownEl.style.display = "none";
    countdownEl.textContent = "";
  }

  // Toggle button (#btn-toggle)
  btnToggle.addEventListener("click", function () {
    resumeAudioOnGesture();
    if (playbackState === "PLAYING") {
      playbackState = "PAUSED";
      setToggleIcon(false);
      silenceAllOneShots();
    } else if (playbackState === "COUNTDOWN" || playbackState === "REFIRE_HOLD" || playbackState === "INIT") {
      hideCountdown();
      simTime = 0.000;
      scrubber.value = "0";
      playbackState = "PAUSED";
      setToggleIcon(false);
      silenceAllOneShots();
      renderAtSimTime(0.000);
    } else if (playbackState === "PAUSED") {
      playbackState = "PLAYING";
      setToggleIcon(true);
    } else if (playbackState === "ENDED") {
      hideCountdown();
      simTime = 0.000;
      scrubber.value = "0.000";
      playbackState = "PLAYING";
      setToggleIcon(true);
      renderAtSimTime(0.000);
    }
  });

  // Silent Re-fire (#btn-refire -> REFIRE_HOLD 1.000s)
  btnRefire.addEventListener("click", function () {
    resumeAudioOnGesture();
    hideCountdown();
    simTime = 0.000;
    scrubber.value = "0";
    holdElapsed = 0.000;
    playbackState = "REFIRE_HOLD";
    setToggleIcon(true);
    silenceAllOneShots();
    renderAtSimTime(0.000);
  });

  // Speed selector pills (.speed-pill)
  speedPills.forEach(function (pill) {
    pill.addEventListener("click", function () {
      resumeAudioOnGesture();
      playbackSpeed = parseFloat(pill.getAttribute("data-speed")) || 1.0;
      speedPills.forEach(function (p) {
        const active = p === pill;
        p.classList.toggle("is-active", active);
        p.setAttribute("aria-checked", active ? "true" : "false");
      });
    });
  });

  // Scrubber (#scrubber)
  scrubber.addEventListener("pointerdown", function () {
    isScrubDragging = true;
    silenceAllOneShots();
  });
  window.addEventListener("pointerup", function () {
    isScrubDragging = false;
  });
  scrubber.addEventListener("input", function () {
    hideCountdown();
    simTime = Math.max(0, Math.min(DURATION, parseFloat(scrubber.value) || 0));
    playbackState = "PAUSED";
    setToggleIcon(false);
    silenceAllOneShots();
    renderAtSimTime(simTime);
  });

  window.addEventListener("resize", function () {
    updateCameraFraming();
    renderAtSimTime(simTime);
  });

  // Initial resting scene render at simTime = 0.000 BEFORE starting COUNTDOWN on first rAF
  updateCameraFraming();
  countdownEl.style.display = "block";
  countdownEl.textContent = "3";
  scrubber.value = "0";
  setToggleIcon(true);
  renderAtSimTime(0.000);

  function onFrame(nowMs) {
    requestAnimationFrame(onFrame);

    if (playbackState === "INIT") {
      playbackState = "COUNTDOWN";
      countdownElapsed = 0.000;
      lastWallMs = nowMs;
      countdownEl.style.display = "block";
      countdownEl.textContent = "3";
      return;
    }

    const rawDt = lastWallMs === null ? 0 : (nowMs - lastWallMs) / 1000;
    lastWallMs = nowMs;
    const dt = Math.min(Math.max(0, rawDt), 0.1);

    if (playbackState === "COUNTDOWN") {
      countdownElapsed += dt;
      if (countdownElapsed < 1.000) {
        countdownEl.style.display = "block";
        countdownEl.textContent = "3";
        simTime = 0.000;
        scrubber.value = "0";
      } else if (countdownElapsed < 2.000) {
        countdownEl.style.display = "block";
        countdownEl.textContent = "2";
        simTime = 0.000;
        scrubber.value = "0";
      } else if (countdownElapsed < 3.000) {
        countdownEl.style.display = "block";
        countdownEl.textContent = "1";
        simTime = 0.000;
        scrubber.value = "0";
      } else {
        hideCountdown();
        playbackState = "PLAYING";
        const prev = 0.000;
        simTime = Math.min(DURATION, dt * playbackSpeed);
        if (!isScrubDragging) stepAudioForward(prev, simTime, nowMs / 1000);
        scrubber.value = simTime.toFixed(3);
        renderAtSimTime(simTime);
      }
      return;
    }

    if (playbackState === "REFIRE_HOLD") {
      hideCountdown();
      holdElapsed += dt;
      if (holdElapsed >= 1.000) {
        playbackState = "PLAYING";
      }
      return;
    }

    if (playbackState === "PLAYING") {
      const prev = simTime;
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      if (!isScrubDragging) {
        stepAudioForward(prev, simTime, nowMs / 1000);
      } else {
        silenceAllOneShots();
      }
      if (simTime >= DURATION) {
        simTime = DURATION;
        scrubber.value = DURATION.toFixed(3);
        renderAtSimTime(DURATION);
        playbackState = "ENDED";
        setToggleIcon(false);
        silenceAllOneShots();
      } else {
        scrubber.value = simTime.toFixed(3);
        renderAtSimTime(simTime);
      }
    }
  }

  requestAnimationFrame(onFrame);
})();
</script>
</body>
</html>
