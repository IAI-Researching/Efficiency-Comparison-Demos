<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last Rampart</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="100" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script id="rampart-strategy">
function createStrategy() {
  var P = {"endW": 2.867, "spl": 1.259, "fr": 0.702, "maxFrost": 0, "bBolt": 0.448, "bCannon": 1.832, "bFrost": 1.345, "bLance": 0.363, "bFlak": 1.024, "upB": 1.813, "airMin": 1.742};
  var TT = {
    bolt:   {cost:50,  dmg:26,  per:8,  rng:300, spl:0,  pierce:0, g:1, a:1},
    cannon: {cost:90,  dmg:60,  per:24, rng:260, spl:90, pierce:0, g:1, a:0},
    frost:  {cost:70,  dmg:10,  per:12, rng:240, spl:0,  pierce:0, g:1, a:1},
    lance:  {cost:120, dmg:180, per:36, rng:360, spl:0,  pierce:1, g:1, a:0},
    flak:   {cost:80,  dmg:40,  per:10, rng:320, spl:70, pierce:0, g:0, a:1}
  };
  var BIAS = { bolt: P.bBolt, cannon: P.bCannon, frost: P.bFrost, lance: P.bLance, flak: P.bFlak };
  var HP = { grunt: 60, runner: 40, wisp: 50, brute: 150, splitter: 90, mender: 70 };
  var SX = [[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],[14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]];
  function mkRoute(pts) {
    var out = [], i, p, q, k;
    for (i = 1; i < pts.length; i++) {
      p = pts[i - 1]; q = pts[i];
      var len = Math.abs(q[0] - p[0]) + Math.abs(q[1] - p[1]);
      var sx = Math.sign(q[0] - p[0]), sy = Math.sign(q[1] - p[1]);
      for (k = 0; k < len * 100; k += 20) out.push([p[0] * 100 + 50 + sx * k, p[1] * 100 + 50 + sy * k]);
    }
    out.push([pts[pts.length - 1][0] * 100 + 50, pts[pts.length - 1][1] * 100 + 50]);
    return out;
  }
  var RT = [mkRoute([[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]]), mkRoute([[0,6],[21,6],[21,11],[23,11]])];
  var covCache = {};
  function cov(slot, range, air) {
    var key = slot * 10000 + range * 2 + air;
    if (covCache[key] !== undefined) return covCache[key];
    var R = RT[air], n = R.length, sum = 0, tot = 0, px = SX[slot][0] * 100 + 50, py = SX[slot][1] * 100 + 50, rr = range * range;
    for (var i = 0; i < n; i++) {
      var wgt = 1 + P.endW * i / n; tot += wgt;
      var dx = R[i][0] - px, dy = R[i][1] - py;
      if (dx * dx + dy * dy <= rr) sum += wgt;
    }
    return (covCache[key] = sum / tot * (air ? 1 : 1));
  }
  var M = [0, 1000];
  function mw(w) { while (M.length <= w) M.push(Math.floor(M[M.length - 1] * 108 / 100)); return M[w]; }
  function arm(type, w) { return type === 'grunt' ? Math.floor(w / 4) : type === 'brute' ? 6 + w : 0; }
  var prevNext = null;

  function dmgAt(type, tier) { var d = TT[type].dmg; for (var i = 1; i < tier; i++) d = Math.floor(d * 16 / 10); return d; }

  function poolValue(type, tier, slot, L, totHp) {
    var t = TT[type], d = dmgAt(type, tier), r = t.rng + 30 * (tier - 1), v = 0, i;
    var cg = t.g ? cov(slot, r, 0) : 0, ca = t.a ? cov(slot, r, 1) : 0;
    for (i = 0; i < L.length; i++) {
      var e = L[i];
      var c = e.air ? ca : cg;
      if (c === 0) continue;
      var dd = t.pierce ? d : Math.max(1, d - e.arm);
      v += e.hp * c * dd / t.per;
    }
    v = v / totHp;
    if (t.spl) v *= 1 + P.spl;
    return v;
  }

  return {
    plan: function (state) {
      var w = state.wave, i, L = [], tot = 0;
      for (i = 0; i < state.enemies.length; i++) { var en = state.enemies[i]; L.push({ hp: en.hp, arm: en.armor, air: en.air }); }
      var cur = prevNext || ['grunt', 'grunt', 'grunt', 'grunt'];
      for (i = 0; i < cur.length; i++) L.push({ hp: Math.floor(HP[cur[i]] * mw(w) / 1000), arm: arm(cur[i], w), air: cur[i] === 'wisp' ? 1 : 0 });
      for (i = 0; i < state.nextWave.length; i++) { var ty = state.nextWave[i]; L.push({ hp: Math.floor(HP[ty] * mw(w + 1) / 1000), arm: arm(ty, w + 1), air: ty === 'wisp' ? 1 : 0 }); }
      prevNext = state.nextWave;
      for (i = 0; i < L.length; i++) tot += L[i].hp;
      var airHp = 0; for (i = 0; i < L.length; i++) if (L[i].air) airHp += L[i].hp;
      var airShare = airHp / tot;
      var slots = state.slots.map(function (s) { return s.turret ? { type: s.turret.type, tier: s.turret.tier } : null; });
      var gold = state.gold, acts = [];
      var types = ['bolt', 'cannon', 'frost', 'lance', 'flak'];
      for (var iter = 0; iter < 32; iter++) {
        var bestScore = 0, bestAct = null, bestCost = 0, s, k;
        var nFrost = 0, others = 0, anyAir = 0;
        for (s = 0; s < 16; s++) if (slots[s]) {
          if (slots[s].type === 'frost') nFrost++;
          else others += poolValue(slots[s].type, slots[s].tier, s, L, tot);
          if (TT[slots[s].type].a) anyAir++;
        }
        for (s = 0; s < 16; s++) {
          var cs = slots[s];
          if (!cs) {
            for (k = 0; k < 5; k++) {
              var ty2 = types[k], c = TT[ty2].cost;
              if (c > gold) continue;
              if (ty2 === 'frost' && nFrost >= P.maxFrost) continue;
              var val = ty2 === 'frost' ? P.fr * cov(s, TT.frost.rng, 0) * (0.02 + others) : poolValue(ty2, 1, s, L, tot);
              var sc = val / c * BIAS[ty2];
              if (!anyAir && airShare > 0 && TT[ty2].a && ty2 !== 'frost') sc *= P.airMin;
              if (sc > bestScore) { bestScore = sc; bestAct = { op: 'build', slot: s, type: ty2 }; bestCost = c; }
            }
          } else if (cs.tier < 3) {
            var c2 = TT[cs.type].cost * (cs.tier === 1 ? 1 : 2);
            if (c2 > gold) continue;
            var v0, v1;
            if (cs.type === 'frost') { v0 = cov(s, 240 + 30 * (cs.tier - 1), 0); v1 = cov(s, 240 + 30 * cs.tier, 0); v0 *= P.fr * (0.02 + others); v1 *= P.fr * (0.02 + others); }
            else { v0 = poolValue(cs.type, cs.tier, s, L, tot); v1 = poolValue(cs.type, cs.tier + 1, s, L, tot); }
            var sc2 = (v1 - v0) / c2 * BIAS[cs.type] * P.upB;
            if (sc2 > bestScore) { bestScore = sc2; bestAct = { op: 'upgrade', slot: s }; bestCost = c2; }
          }
        }
        if (!bestAct) break;
        acts.push(bestAct); gold -= bestCost;
        if (bestAct.op === 'build') slots[bestAct.slot] = { type: bestAct.type, tier: 1 };
        else slots[bestAct.slot].tier++;
      }
      return acts;
    }
  };
}

</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks, rec) {
  'use strict';
  var SX = [[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],[14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]];
  var TNAMES = ['bolt','cannon','frost','lance','flak'];
  var TT = {
    bolt:   {cost:50,  dmg:26,  per:8,  rng:300, spl:0,  slow:0,  pierce:0, g:1, a:1},
    cannon: {cost:90,  dmg:60,  per:24, rng:260, spl:90, slow:0,  pierce:0, g:1, a:0},
    frost:  {cost:70,  dmg:10,  per:12, rng:240, spl:0,  slow:30, pierce:0, g:1, a:1},
    lance:  {cost:120, dmg:180, per:36, rng:360, spl:0,  slow:0,  pierce:1, g:1, a:0},
    flak:   {cost:80,  dmg:40,  per:10, rng:320, spl:70, slow:0,  pierce:0, g:0, a:1}
  };
  var ENAMES = ['grunt','runner','wisp','brute','splitter','mender','splitling'];
  var ET = {
    grunt:{hp:60,sp:10,bounty:4,leak:1,route:0,first:1,wt:10},
    runner:{hp:40,sp:20,bounty:4,leak:1,route:0,first:2,wt:4},
    wisp:{hp:50,sp:12,bounty:6,leak:2,route:1,first:3,wt:3},
    brute:{hp:150,sp:6,bounty:9,leak:3,route:0,first:4,wt:3},
    splitter:{hp:90,sp:8,bounty:6,leak:2,route:0,first:6,wt:2},
    mender:{hp:70,sp:8,bounty:7,leak:2,route:0,first:8,wt:1},
    splitling:{hp:0,sp:12,bounty:1,leak:1,route:0,first:99,wt:0}
  };
  var GEN = ['grunt','runner','wisp','brute','splitter','mender'];
  var AIRPTS = [[0,6],[21,6],[21,11],[23,11]];
  function mkRoute(pts) {
    var P = pts.map(function (p) { return [p[0] * 100 + 50, p[1] * 100 + 50]; });
    var cum = [0];
    for (var i = 1; i < P.length; i++) cum.push(cum[i - 1] + Math.abs(P[i][0] - P[i - 1][0]) + Math.abs(P[i][1] - P[i - 1][1]));
    return { P: P, cum: cum, len: cum[cum.length - 1] };
  }
  var ROUTES = [mkRoute([[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]]), mkRoute(AIRPTS)];
  function setPos(e) {
    var R = ROUTES[e.route], p = e.prog;
    if (p > R.len) p = R.len;
    for (var i = 1; i < R.P.length; i++) {
      if (p <= R.cum[i] || i === R.P.length - 1) {
        var a = R.P[i - 1], b = R.P[i], d = p - R.cum[i - 1];
        var sx = Math.sign(b[0] - a[0]), sy = Math.sign(b[1] - a[1]);
        e.x = a[0] + sx * d; e.y = a[1] + sy * d;
        e.dir = Math.atan2(sx, sy);
        return;
      }
    }
  }
  function mulberry32(a) { return function () {
    a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return (t ^ (t >>> 14)) >>> 0; }; }
  var M = [0, 1000];
  function mw(w) { while (M.length <= w) M.push(Math.floor(M[M.length - 1] * 108 / 100)); return M[w]; }
  function armour(type, w) { return type === 'grunt' ? Math.floor(w / 4) : type === 'brute' ? 6 + w : 0; }

  var rnd = mulberry32(seed);
  var waves = {};
  function genWave(w) {
    var n = 4 + Math.floor(3 * w / 5), types = [], sum = 0, i, k;
    for (i = 0; i < GEN.length; i++) if (ET[GEN[i]].first <= w) { types.push(GEN[i]); sum += ET[GEN[i]].wt; }
    var comp = [];
    for (i = 0; i < n; i++) {
      var r = rnd() % sum;
      for (k = 0; k < types.length; k++) { var wt = ET[types[k]].wt; if (r < wt) break; r -= wt; }
      comp.push(types[k]);
    }
    waves[w] = comp;
  }
  var strat = createStrategy();
  var gold = 250, base = 10, nextId = 1, enemies = [], log = [];
  var turrets = []; for (var si = 0; si < 16; si++) turrets.push(null);
  var spawnQ = {};
  genWave(1);
  var fallTick = -1, curWave = 0, ev = null;
  if (rec) { rec.frames = []; rec.fallTick = -1; }

  function newEnemy(type, w, hp, prog) {
    var d = ET[type];
    var e = { id: nextId++, type: type, w: w, hp: hp, mhp: hp, prog: prog, age: 0, slow: 0, route: d.route,
      air: d.route, arm: armour(type, w), sp: d.sp, x: 0, y: 0, dir: 0 };
    setPos(e); return e;
  }
  function view(e) {
    var R = ROUTES[e.route];
    return { id: e.id, type: e.type, hp: e.hp, maxHp: e.mhp, x: e.x, y: e.y, air: e.air, armor: e.arm,
      speed: e.slow > 0 ? Math.floor(e.sp * 60 / 100) : e.sp, slowed: e.slow > 0 ? 1 : 0, remaining: R.len - e.prog };
  }
  function tstats(T) {
    var d = TT[T.type].dmg, i; for (i = 1; i < T.tier; i++) d = Math.floor(d * 16 / 10);
    T.dmg = d; T.rng = TT[T.type].rng + 30 * (T.tier - 1);
  }
  function applyActions(acts, t) {
    if (!Array.isArray(acts)) return;
    var n = Math.min(32, acts.length);
    for (var i = 0; i < n; i++) {
      var a = acts[i];
      if (!a) continue;
      var s = a.slot;
      if (!(Number.isInteger(s) && s >= 0 && s < 16)) continue;
      if (a.op === 'build') {
        if (typeof a.type !== 'string' || !Object.prototype.hasOwnProperty.call(TT, a.type)) continue;
        var d = TT[a.type];
        if (turrets[s] || gold < d.cost) continue;
        gold -= d.cost;
        var T = { type: a.type, tier: 1, spent: d.cost, cd: 0, dmg: 0, rng: 0 }; tstats(T); turrets[s] = T;
        log.push([t, 'B', s, TNAMES.indexOf(a.type)]);
        if (ev) ev.acts.push([s, 'B']);
      } else if (a.op === 'upgrade') {
        var T2 = turrets[s]; if (!T2 || T2.tier >= 3) continue;
        var c = TT[T2.type].cost * (T2.tier === 1 ? 1 : 2);
        if (gold < c) continue;
        gold -= c; T2.spent += c; T2.tier++; tstats(T2);
        log.push([t, 'U', s, T2.tier]);
        if (ev) ev.acts.push([s, 'U']);
      } else if (a.op === 'sell') {
        var T3 = turrets[s]; if (!T3) continue;
        gold += Math.floor(T3.spent * 70 / 100); turrets[s] = null;
        log.push([t, 'S', s, 0]);
        if (ev) ev.acts.push([s, 'S']);
      }
    }
  }
  function removeDead(t, slot) {
    var any = false, i;
    for (i = 0; i < enemies.length; i++) if (enemies[i].hp <= 0) { any = true; break; }
    if (!any) return;
    var alive = [], born = [];
    for (i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      if (e.hp > 0) { alive.push(e); continue; }
      gold += ET[e.type].bounty;
      log.push([t, 'K', e.id, slot]);
      if (ev) ev.kills.push([e.id, ENAMES.indexOf(e.type), e.x, e.y, e.air]);
      if (e.type === 'splitter') {
        for (var k = 0; k < 3; k++) born.push(newEnemy('splitling', e.w, Math.max(1, Math.floor(e.mhp / 4)), e.prog));
      }
    }
    enemies = alive.concat(born);
  }
  function pushFrame(t, fe) {
    rec.frames.push({ t: t, gold: gold, base: base, wave: curWave,
      en: enemies.map(function (e) { return [e.id, ENAMES.indexOf(e.type), e.x, e.y, e.hp, e.mhp, e.slow > 0 ? 1 : 0, e.dir]; }),
      tu: turrets.map(function (T) { return T ? [TNAMES.indexOf(T.type), T.tier] : null; }),
      ev: ev, next: fe ? fe.next : null });
  }

  for (var t = 0; t < maxTicks; t++) {
    ev = rec ? { shots: [], kills: [], leaks: [], heals: [], acts: [] } : null;
    var frameExtra = null;
    if (t >= 20 && (t - 20) % 40 === 0) {

    if (age <= 0.9) for (const a of ev.acts) {
      const sl = SXY[a[0]], x0 = sl[0] + 0.5, z0 = sl[1] + 0.5;
      if (a[1] !== 'S') {
        const q = age / 0.9, rr = 0.2 + 0.7 * Math.min(1, age / 0.4);
        put(poolRing, x0, 0.2, z0, rr, 1, rr, 0, 1 - q, 0.9 * (1 - q), 0.4 * (1 - q));
        for (let c = 0; c < 6; c++) { const a2 = c * 1.047 + 0.5, y = 0.2 + q * 1.1 + (c % 2) * 0.1; put(poolGlow, x0 + Math.cos(a2) * 0.3, y, z0 + Math.sin(a2) * 0.3, 0.05 * (1 - q), 0.05 * (1 - q), 0.05 * (1 - q), 0, 1, 0.9, 0.4); }
      } else {
        const q = age / 0.9;
        for (let c = 0; c < 8; c++) { const v = DV[(a[0] * 11 + c * 17) & 255]; let y = 0.5 + v[1] * 0.3 * age - 4 * age * age; if (y < 0.1) y = 0.1; const s = 0.12 * (1 - q * 0.5); put(poolChip, x0 + v[0] * age * 0.4, y, z0 + v[2] * age * 0.4, s, s, s, c, 0.5, 0.45, 0.42); }
        put(poolRing, x0, 0.1, z0, 0.3 + q, 1, 0.3 + q, 0, 0.35 * (1 - q), 0.3 * (1 - q), 0.25 * (1 - q));
      }
    }
  }
  for (const l of leakList) {
    const age = t - l.t; if (age < 0 || age > 1.2) continue;
    for (let c = 0; c < 4; c++) { const v = DV[(Math.round(l.t * 20) * 5 + c * 29) & 255]; let y = 0.8 + v[1] * age * 0.9 - 5 * age * age; if (y < 0.1) y = 0.1; const s = 0.2 * (1 - age / 1.4); put(poolChip, KX + v[0] * age, y, KZ + v[2] * age, s, s, s, age * 4 + c, 0.55, 0.53, 0.58); }
    if (age < 0.4) { const q = age / 0.4; put(poolRing, KX, 0.1, KZ, 0.5 + q * 1.2, 1, 0.5 + q * 1.2, 0, 1 - q, 0.1 * (1 - q), 0.1 * (1 - q)); }
  }
  if (FALL >= 0 && t >= FT) {
    const age = t - FT;
    for (let c = 0; c < 40; c++) {
      const v = DV[(c * 6 + 3) & 255]; const sp = 1 + (c % 5) * 0.45; let y = 0.6 + v[1] * sp * 0.6 * age - 4.5 * age * age; if (y < 0.06) y = 0.06;
      const s = 0.1 + (c % 4) * 0.05, g = 0.45 + (c % 3) * 0.1;
      put(poolChip, KX + v[0] * sp * age, y, KZ + v[2] * sp * age, s, s, s, age * 3 + c, g, g * 0.97, g * 1.05);
    }
    if (age < 1.5) { const q = age / 1.5, rr = 0.5 + 6 * q; put(poolRing, KX, 0.12, KZ, rr, 1, rr, 0, 1 - q, 0.7 * (1 - q), 0.4 * (1 - q)); put(poolRing, KX, 0.14, KZ, rr * 0.7, 1, rr * 0.7, 0, 0.8 * (1 - q), 0.5 * (1 - q), 0.3 * (1 - q)); }
    if (age < 0.5) { const q = age / 0.5; put(poolGlow, KX, 0.8, KZ, 1.2 * (0.5 + q), 1.2 * (0.5 + q), 1.2 * (0.5 + q), 0, 1 - q, 0.7 * (1 - q), 0.3 * (1 - q)); }
  }
  for (const p of poolEn) p.end();
  poolBeam.end(); poolRing.end(); poolGlow.end(); poolChip.end(); poolBlob.end(); poolHbBg.end(); poolHbFg.end();

  renderer.clear();
  renderer.render(scene, camera);
  drawHud(t, f0);
  renderer.clearDepth();
  renderer.render(hudScene, hudCam);
}

/* ---------- audio ---------- */
const AC = new (window.AudioContext || window.webkitAudioContext)();
const master = AC.createGain(); master.gain.value = 0;
const comp = AC.createDynamicsCompressor(); comp.threshold.value = -16; comp.knee.value = 20; comp.ratio.value = 6; comp.attack.value = 0.003; comp.release.value = 0.15;
master.connect(comp); comp.connect(AC.destination);
const ar = mb(4242);
const noiseBuf = (() => { const b = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = ar() * 2 - 1; return b; })();
let active = [], audioOn = false, windOn = false, shotTimes = [];
function tryResume() { if (AC.state !== 'running') AC.resume().catch(() => {}); }
tryResume();
window.addEventListener('pointerdown', tryResume); window.addEventListener('keydown', tryResume);
function out(pan) { const p = AC.createStereoPanner ? AC.createStereoPanner() : null; if (p) { p.pan.value = clamp(pan, -0.9, 0.9); p.connect(master); return p; } return master; }
function env(g, t0, a, d, peak) { g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(peak, t0 + a); g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d); }
function tone(type, f0, f1, dur, peak, pan, delay) {
  const t0 = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  env(g, t0, 0.004, dur, peak); o.connect(g); const p = out(pan); g.connect(p); o.start(t0); o.stop(t0 + dur + 0.05); active.push(o);
}
function noise(filt, f, q, dur, peak, pan, delay) {
  const t0 = AC.currentTime + (delay || 0), s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; fl.type = filt; fl.frequency.value = f; fl.Q.value = q; env(g, t0, 0.003, dur, peak);
  s.connect(fl); fl.connect(g); g.connect(out(pan)); s.start(t0, ar() * 1.5); s.stop(t0 + dur + 0.05); active.push(s);
}
const SHOT_PRI = [3, 1, 4, 0, 2];
function playShot(ty, pan) {
  if (ty === 0) tone('square', 1000, 520, 0.06, 0.05, pan);
  else if (ty === 1) { noise('lowpass', 500, 1, 0.16, 0.2, pan); tone('sine', 140, 45, 0.2, 0.22, pan); }
  else if (ty === 2) tone('triangle', 1500, 900, 0.12, 0.04, pan);
  else if (ty === 3) { tone('sawtooth', 380, 90, 0.22, 0.12, pan); noise('bandpass', 2500, 1, 0.12, 0.1, pan); }
  else { noise('bandpass', 1800, 2, 0.08, 0.08, pan); tone('square', 520, 210, 0.07, 0.04, pan); }
}
function stopAll() { for (const n of active) { try { n.stop(); } catch (e) {} try { n.disconnect(); } catch (e) {} } active = []; windOn = false; }
function gate(on) {
  if (on === audioOn) return; audioOn = on; tryResume();
  const t = AC.currentTime; master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(master.gain.value, t);
  if (on) master.gain.linearRampToValueAtTime(0.8, t + 0.03);
  else { master.gain.linearRampToValueAtTime(0, t + 0.04); setTimeout(() => { if (!audioOn) stopAll(); }, 60); }
}
function startWind() {
  windOn = true; const t0 = AC.currentTime, s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain(), lfo = AC.createOscillator(), lg = AC.createGain();
  s.buffer = noiseBuf; s.loop = true; fl.type = 'lowpass'; fl.frequency.value = 260; g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(0.12, t0 + 1.5);
  lfo.frequency.value = 0.2; lg.gain.value = 0.05; lfo.connect(lg); lg.connect(g.gain); s.connect(fl); fl.connect(g); g.connect(master); s.start(t0); lfo.start(t0); active.push(s, lfo);
}
function audioStep(prev, now) {
  if (!audioOn) return;
  if (now - prev > 0.5 || now < prev) return;
  const a = Math.floor(prev * 20 + 1e-9) + 1, b = Math.min(Math.floor(now * 20 + 1e-9), NF - 1);
  const cand = [];
  for (let te = a; te <= b; te++) {
    const f = FR[te]; if (!f) continue;
    if (f.next) { tone('sawtooth', 130, 200, 0.55, 0.12, 0); tone('sawtooth', 195, 300, 0.55, 0.07, 0); }
    for (const s of f.ev.shots) cand.push(s);
    for (const kl of f.ev.kills) tone('sine', 420, 130, 0.07, 0.06, kl[2] / 1200 - 1);
    if (f.ev.leaks.length) { noise('highpass', 900, 1, 0.16, 0.2, 0.8); tone('square', 880, 880, 0.14, 0.07, 0.8); tone('square', 620, 620, 0.16, 0.07, 0.8, 0.16); }
    if (te === FALL) { tone('sine', 70, 24, 1.8, 0.4, 0); noise('lowpass', 180, 1, 2.0, 0.3, 0); }
  }
  if (cand.length) {
    const nowT = AC.currentTime; shotTimes = shotTimes.filter(x => nowT - x < 1);
    cand.sort((p, q) => SHOT_PRI.indexOf(p[1]) - SHOT_PRI.indexOf(q[1]));
    for (const s of cand) { if (shotTimes.length >= 12) break; shotTimes.push(nowT); playShot(s[1], (SXY[s[0]][0] + 0.5) / 12 - 1); }
  }
  if (FALL >= 0 && now >= FT + 1.2 && !windOn) startWind();
}

/* ---------- state machine / UI ---------- */
const $ = (id) => document.getElementById(id);
const cd = $('countdown'), scrub = $('scrubber'), btnToggle = $('btn-toggle'), iconPause = $('icon-pause'), iconPlay = $('icon-play');
let state = 'COUNTDOWN', simTime = 0, cdElapsed = 0, holdElapsed = 0, speed = 1, started = false, lastTs = null;
function showCd(txt) { cd.style.display = 'block'; if (cd.textContent !== txt) cd.textContent = txt; }
function hideCd() { cd.style.display = 'none'; cd.textContent = ''; }
function setIcons(playing) {
  iconPause.style.display = playing ? '' : 'none'; iconPlay.style.display = playing ? 'none' : '';
  btnToggle.setAttribute('aria-label', playing ? 'Pause' : 'Play');
}
function setState(s) { state = s; gate(s === 'PLAYING'); }
btnToggle.addEventListener('click', () => {
  tryResume();
  if (state === 'PLAYING') { setState('PAUSED'); setIcons(false); }
  else if (state === 'COUNTDOWN' || state === 'REFIRE_HOLD') { hideCd(); simTime = 0; scrub.value = '0'; setState('PAUSED'); setIcons(false); }
  else if (state === 'PAUSED') { setState('PLAYING'); setIcons(true); }
  else if (state === 'ENDED') { simTime = 0; scrub.value = '0'; hideCd(); setState('PLAYING'); setIcons(true); }
});
document.querySelectorAll('.speed-pill').forEach((b) => b.addEventListener('click', () => {
  speed = parseFloat(b.dataset.speed);
  document.querySelectorAll('.speed-pill').forEach((o) => { const on = o === b; o.classList.toggle('is-active', on); o.setAttribute('aria-checked', on ? 'true' : 'false'); });
}));
scrub.addEventListener('input', () => {
  hideCd(); simTime = clamp(parseFloat(scrub.value) || 0, 0, DURATION); setState('PAUSED'); setIcons(false); gate(false); render(simTime);
});
$('btn-refire').addEventListener('click', () => {
  tryResume(); hideCd(); simTime = 0; scrub.value = '0'; holdElapsed = 0; setIcons(true); setState('REFIRE_HOLD'); stopAll(); render(0);
});
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2)); renderer.setSize(W, H, false);
  frameCamera(); layoutHud(); render(simTime);
}
window.addEventListener('resize', resize);
resize();
render(0);

function loop(ts) {
  const raw = lastTs === null ? 0 : (ts - lastTs) / 1000; lastTs = ts;
  const dt = Math.min(raw, 0.1), prev = simTime;
  if (state === 'COUNTDOWN') {
    if (!started) { started = true; cdElapsed = 0; showCd('3'); }
    else {
      cdElapsed += dt;
      if (cdElapsed >= 3) { hideCd(); setState('PLAYING'); }
      else showCd(String(3 - Math.floor(cdElapsed)));
    }
  } else if (state === 'REFIRE_HOLD') {
    holdElapsed += dt; if (holdElapsed >= 1) setState('PLAYING');
  } else if (state === 'PLAYING') {
    simTime = Math.min(DURATION, simTime + dt * speed);
    scrub.value = simTime.toFixed(3);
    audioStep(prev, simTime);
    if (simTime >= DURATION) { simTime = DURATION; scrub.value = DURATION.toFixed(3); setState('ENDED'); setIcons(false); }
  }
  render(simTime);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
