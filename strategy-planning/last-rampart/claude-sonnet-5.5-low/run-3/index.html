<script id="rampart-strategy">
function createStrategy() {
  const P = { frost: 56.8, airW: 0.66, splash: 1.7, maxFrost: 1, maxFlak: 2, reserve: 0 };
  const SL = [[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],[14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]];
  const TT = { bolt: { c: 50, d: 26, p: 8, r: 300, sp: 0, pi: 0, g: 1, a: 1 }, cannon: { c: 90, d: 60, p: 24, r: 260, sp: 1, pi: 0, g: 1, a: 0 },
    frost: { c: 70, d: 10, p: 12, r: 240, sp: 0, pi: 0, g: 1, a: 1 }, lance: { c: 120, d: 180, p: 36, r: 360, sp: 0, pi: 1, g: 1, a: 0 },
    flak: { c: 80, d: 40, p: 10, r: 320, sp: 1, pi: 0, g: 0, a: 1 } };
  const TYPES = Object.keys(TT);
  const sample = (pts) => { const out = []; for (let i = 0; i < pts.length - 1; i++) { const a = pts[i], b = pts[i + 1]; const n = Math.abs(b[0] - a[0]) + Math.abs(b[1] - a[1]);
    for (let j = 0; j < n * 4; j++) out.push([(a[0] + (b[0] - a[0]) * j / (n * 4)) * 100 + 50, (a[1] + (b[1] - a[1]) * j / (n * 4)) * 100 + 50]); } return out; };
  const GS = sample([[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]]), AS = sample([[0,6],[21,6],[21,11],[23,11]]);
  const cov = (s, range, pts) => { const x = SL[s][0] * 100 + 50, y = SL[s][1] * 100 + 50; let n = 0; for (const p of pts) { const dx = p[0] - x, dy = p[1] - y; if (dx * dx + dy * dy <= range * range) n++; } return n / 100 * 25 / 4 * 4 / 4; };
  const dmgAt = (t, tier) => { let d = TT[t].d; for (let i = 1; i < tier; i++) d = Math.floor(d * 16 / 10); return d; };
  const value = (s, t, tier, w) => {
    const T = TT[t], r = T.r + 30 * (tier - 1); const arm = 0.75 * Math.floor(w / 4) + 0.25 * (6 + w);
    const d = T.pi ? dmgAt(t, tier) : Math.max(1, dmgAt(t, tier) - arm);
    let dps = d / T.p; if (T.sp) dps *= P.splash; if (t === 'frost') dps = P.frost / T.p;
    let c = 0; if (T.g) c += cov(s, r, GS); if (T.a) c += P.airW * cov(s, r, AS);
    return dps * c;
  };
  return {
    plan(state) {
      const w = state.wave, acts = []; let g = state.gold - P.reserve;
      const tur = state.slots.map(s => s.turret ? { type: s.turret.type, tier: s.turret.tier } : null);
      for (let it = 0; it < 30; it++) {
        const nf = tur.filter(t => t && t.type === 'frost').length, nk = tur.filter(t => t && t.type === 'flak').length;
        let best = null, bv = 0;
        for (let s = 0; s < 16; s++) {
          const t = tur[s];
          if (!t) { for (const ty of TYPES) { const c = TT[ty].c; if (c > g) continue; if (ty === 'frost' && nf >= P.maxFrost) continue; if (ty === 'flak' && (nk >= P.maxFlak || w < 3)) continue;
            const v = value(s, ty, 1, w) / c; if (v > bv) { bv = v; best = { op: 'build', slot: s, type: ty, c }; } } }
          else if (t.tier < 3) { const c = t.tier === 1 ? TT[t.type].c : 2 * TT[t.type].c; if (c > g) continue; const v = (value(s, t.type, t.tier + 1, w) - value(s, t.type, t.tier, w)) / c; if (v > bv) { bv = v; best = { op: 'upgrade', slot: s, c }; } }
        }
        if (!best) break; g -= best.c; acts.push({ op: best.op, slot: best.slot, type: best.type });
        if (best.op === 'build') tur[best.slot] = { type: best.type, tier: 1 }; else tur[best.slot].tier++;
      }
      return acts;
    }
  };
}

<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks) {
  const hook = rampartSimulate.hook;
  const mk = (pts) => { const p = pts.map(q => [q[0] * 100 + 50, q[1] * 100 + 50]); const segs = []; let L = 0;
    for (let i = 0; i < p.length - 1; i++) { const dx = p[i + 1][0] - p[i][0], dy = p[i + 1][1] - p[i][1]; const l = Math.abs(dx) + Math.abs(dy);
      segs.push({ x: p[i][0], y: p[i][1], dx: Math.sign(dx), dy: Math.sign(dy), s: L, l }); L += l; }
    return { segs, L, last: p[p.length - 1] }; };
  const ROUTES = [mk([[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]]), mk([[0,6],[21,6],[21,11],[23,11]])];
  ROUTES[1].L = 2800;
  function posAt(r, p) { const sg = r.segs; let i = 0; while (i < sg.length - 1 && p >= sg[i].s + sg[i].l) i++;
    const s = sg[i]; const d = Math.min(p - s.s, s.l); return [s.x + s.dx * d, s.y + s.dy * d]; }
  const SLOTS = [[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],[14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]];
  const TT = { bolt: { c: 50, d: 26, p: 8, r: 300, sp: 0, sl: 0, pi: 0, g: 1, a: 1, i: 0 }, cannon: { c: 90, d: 60, p: 24, r: 260, sp: 90, sl: 0, pi: 0, g: 1, a: 0, i: 1 },
    frost: { c: 70, d: 10, p: 12, r: 240, sp: 0, sl: 30, pi: 0, g: 1, a: 1, i: 2 }, lance: { c: 120, d: 180, p: 36, r: 360, sp: 0, sl: 0, pi: 1, g: 1, a: 0, i: 3 },
    flak: { c: 80, d: 40, p: 10, r: 320, sp: 70, sl: 0, pi: 0, g: 0, a: 1, i: 4 } };
  const ET = { grunt: { hp: 60, sp: 10, b: 4, lk: 1, air: 0, f: 1, w: 10 }, runner: { hp: 40, sp: 20, b: 4, lk: 1, air: 0, f: 2, w: 4 }, wisp: { hp: 50, sp: 12, b: 6, lk: 2, air: 1, f: 3, w: 3 },
    brute: { hp: 150, sp: 6, b: 9, lk: 3, air: 0, f: 4, w: 3 }, splitter: { hp: 90, sp: 8, b: 6, lk: 2, air: 0, f: 6, w: 2 }, mender: { hp: 70, sp: 8, b: 7, lk: 2, air: 0, f: 8, w: 1 },
    splitling: { hp: 0, sp: 12, b: 1, lk: 1, air: 0, f: 99, w: 0 } };
  const ORDER = ['grunt', 'runner', 'wisp', 'brute', 'splitter', 'mender'];
  const mm = [0, 1000]; const mult = (w) => { while (mm.length <= w) mm.push(Math.floor(mm[mm.length - 1] * 108 / 100)); return mm[w]; };
  const armor = (e) => e.type === 'grunt' ? Math.floor(e.wave / 4) : e.type === 'brute' ? 6 + e.wave : 0;
  let ra = seed | 0; const rnd = () => { ra = (ra + 0x6D2B79F5) | 0; let t = Math.imul(ra ^ (ra >>> 15), 1 | ra);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return (t ^ (t >>> 14)) >>> 0; };
  const comp = []; let genTo = 0;
  const gen = (w) => { while (genTo < w) { genTo++; const ww = genTo; const av = ORDER.filter(t => ET[t].f <= ww); const sum = av.reduce((a, t) => a + ET[t].w, 0); const n = 4 + Math.floor(3 * ww / 5); const arr = [];
    for (let i = 0; i < n; i++) { let r = rnd() % sum; for (const t of av) { if (r < ET[t].w) { arr.push(t); break; } r -= ET[t].w; } } comp[ww] = arr; } };
  const strat = createStrategy();
  let gold = 250, baseHp = 10, enemies = [], nextId = 1, queue = [], turrets = new Array(16).fill(null), log = [], fall = -1, curWave = 0;
  const tdmg = (t) => { let d = TT[t.type].d; for (let i = 1; i < t.tier; i++) d = Math.floor(d * 16 / 10); return d; };
  const trange = (t) => TT[t.type].r + 30 * (t.tier - 1);
  const epos = (e) => posAt(ROUTES[e.air], e.progress);
  const view = (e) => { const p = epos(e); return { id: e.id, type: e.type, hp: e.hp, maxHp: e.maxHp, x: p[0], y: p[1], air: e.air, armor: armor(e), speed: e.slow > 0 ? Math.floor(ET[e.type].sp * 60 / 100) : ET[e.type].sp, slowed: e.slow > 0 ? 1 : 0, remaining: ROUTES[e.air].L - e.progress }; };
  const mkEnemy = (type, wave, maxHp, progress) => ({ id: nextId++, type, wave, hp: maxHp, maxHp, progress, age: 0, slow: 0, air: ET[type].air });
  const ctx = () => ({ enemies, turrets, gold, baseHp, wave: curWave, comp, posAt, ROUTES, ev, SLOTS, armor });
  let ev = null;
  gen(1);
  for (let tick = 0; tick < maxTicks; tick++) {
    ev = hook ? [] : null;
    if (tick >= 20 && (tick - 20) % 40 === 0) {
      const w = (tick - 20) / 40 + 1; curWave = w;
      gold += Math.min(50, Math.floor(gold * 5 / 100)) + 10 + 2 * w;
      gen(w + 1);
      if (ev) ev.push({ t: 'wave', w });
      const state = { tick, wave: w, gold, baseHp, slots: SLOTS.map((s, i) => ({ slot: i, x: s[0], y: s[1], turret: turrets[i] ? { type: turrets[i].type, tier: turrets[i].tier, spent: turrets[i].spent } : null })),
        enemies: enemies.map(view), nextWave: comp[w + 1].slice() };
      let acts = strat.plan(state); if (!Array.isArray(acts)) acts = [];
      for (const a of acts.slice(0, 32)) {
        if (!a || typeof a.slot !== 'number' || !(a.slot >= 0 && a.slot < 16) || a.slot !== Math.floor(a.slot)) continue;
        const s = a.slot, t = turrets[s];
        if (a.op === 'build') { if (t || !Object.prototype.hasOwnProperty.call(TT, a.type)) continue; const c = TT[a.type].c; if (gold < c) continue;
          gold -= c; turrets[s] = { type: a.type, tier: 1, spent: c, cd: 0 }; log.push([tick, 'B', s, TT[a.type].i]); if (ev) ev.push({ t: 'B', slot: s, type: a.type }); }
        else if (a.op === 'upgrade') { if (!t || t.tier >= 3) continue; const c = t.tier === 1 ? TT[t.type].c : 2 * TT[t.type].c; if (gold < c) continue;
          gold -= c; t.spent += c; t.tier++; log.push([tick, 'U', s, t.tier]); if (ev) ev.push({ t: 'U', slot: s }); }
        else if (a.op === 'sell') { if (!t) continue; gold += Math.floor(t.spent * 70 / 100); turrets[s] = null; log.push([tick, 'S', s, 0]); if (ev) ev.push({ t: 'S', slot: s, type: t.type }); }
      }
      const n = 4 + Math.floor(3 * w / 5);
      for (let i = 0; i < n; i++) queue.push({ t: tick + 4 * i, w, i, type: comp[w][i] });
      queue.sort((a, b) => a.t - b.t || a.w - b.w || a.i - b.i);
    }
    while (queue.length && queue[0].t <= tick) { const q = queue.shift(); enemies.push(mkEnemy(q.type, q.w, Math.max(1, Math.floor(ET[q.type].hp * mult(q.w) / 1000)), 0)); }
    for (let k = 0; k < enemies.length; k++) { const e = enemies[k]; const sp = e.slow > 0 ? Math.floor(ET[e.type].sp * 60 / 100) : ET[e.type].sp; e.progress += sp;
      if (e.progress >= ROUTES[e.air].L) { baseHp -= ET[e.type].lk; log.push([tick, 'L', e.id, baseHp]); if (ev) ev.push({ t: 'L', id: e.id });
        enemies.splice(k, 1); k--; if (baseHp <= 0) { fall = tick; log.push([tick, 'F', curWave, 0]); if (ev) ev.push({ t: 'F' }); break; } } }
    if (fall >= 0) { if (hook) hook(tick, ctx()); break; }
    for (let k = 0; k < enemies.length; k++) { const e = enemies[k]; e.age++;
      if (e.type === 'mender' && e.age % 20 === 0) { const p = epos(e); if (ev) ev.push({ t: 'H', x: p[0], y: p[1] });
        for (const o of enemies) { const q = epos(o); const dx = q[0] - p[0], dy = q[1] - p[1]; if (dx * dx + dy * dy <= 22500) o.hp = Math.min(o.maxHp, o.hp + Math.floor(o.maxHp * 8 / 100)); } } }
    for (let s = 0; s < 16; s++) { const t = turrets[s]; if (!t) continue; if (t.cd > 0) t.cd--; if (t.cd > 0) continue;
      const D = TT[t.type], rg = trange(t), sx = SLOTS[s][0] * 100 + 50, sy = SLOTS[s][1] * 100 + 50; const cands = [], cp = [];
      for (const e of enemies) { if (e.hp <= 0) continue; if (e.air ? !D.a : !D.g) continue; const p = epos(e); const dx = p[0] - sx, dy = p[1] - sy; if (dx * dx + dy * dy <= rg * rg) { cands.push(e); cp.push(p); } }
      if (!cands.length) continue;
      let ti = 0, best = Infinity; for (let i = 0; i < cands.length; i++) { const rem = ROUTES[cands[i].air].L - cands[i].progress; if (rem < best) { best = rem; ti = i; } }
      if (typeof strat.target === 'function') { const id = strat.target({ slot: s, type: t.type, tier: t.tier, x: sx, y: sy, range: rg }, cands.map(view)); const j = cands.findIndex(e => e.id === id); if (j >= 0) ti = j; }
      const tg = cands[ti], tp = cp[ti], dm = tdmg(t); const hit = (e) => { e.hp -= D.pi ? dm : Math.max(1, dm - armor(e)); if (D.sl) e.slow = D.sl; };
      if (D.sp) { for (const e of enemies) { if (e.hp <= 0) continue; if (e.air ? !D.a : !D.g) continue; const p = e === tg ? tp : epos(e); const dx = p[0] - tp[0], dy = p[1] - tp[1]; if (dx * dx + dy * dy <= D.sp * D.sp) hit(e); } } else hit(tg);
      t.cd = D.p; if (ev) ev.push({ t: 'shot', slot: s, type: t.type, tx: tp[0], ty: tp[1], air: tg.air, tid: tg.id });
      for (let k = 0; k < enemies.length; k++) { const e = enemies[k]; if (e.hp > 0) continue; gold += ET[e.type].b; log.push([tick, 'K', e.id, s]);
        const p = epos(e); if (ev) ev.push({ t: 'K', x: p[0], y: p[1], type: e.type, air: e.air, id: e.id });
        enemies.splice(k, 1); k--;
        if (e.type === 'splitter') { for (let j = 0; j < 3; j++) enemies.push(mkEnemy('splitling', e.wave, Math.max(1, Math.floor(e.maxHp / 4)), e.progress)); if (ev) ev.push({ t: 'sp', x: p[0], y: p[1] }); } }
    }
    for (const e of enemies) if (e.slow > 0) e.slow--;
    if (hook) hook(tick, ctx());
  }
  const endTick = fall >= 0 ? fall : maxTicks;
  let h = 0x811c9dc5; const js = JSON.stringify(log); for (let i = 0; i < js.length; i++) { h ^= js.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return { score: Math.round((endTick - 20) / 40 * 100) / 100, fallTick: fall, log, hash: (h >>> 0).toString(16).padStart(8, '0') };
}

<script>
(function () {
'use strict';
const DURATION = 100, NT = 2020;
const TNAMES = ['grunt', 'runner', 'wisp', 'brute', 'splitter', 'mender', 'splitling'];
const TI = { grunt: 0, runner: 1, wisp: 2, brute: 3, splitter: 4, mender: 5, splitling: 6 };
const TUR = ['bolt', 'cannon', 'frost', 'lance', 'flak'];

    shots.sort((a, b) => PRI[a.type] - PRI[b.type]); const nowT = AC.currentTime; while (recentShots.length && recentShots[0] < nowT - 1) recentShots.shift();
    for (const e of shots) { if (recentShots.length >= 12) break; recentShots.push(nowT); playShot(e.type, SLOTS[e.slot][0] + 0.5); } }
  if (AC && playing && audioOn && t >= FALLT + 2 && !wind) startWind(); lastAudioK = kN; }

/* ---------- state machine ---------- */
const $ = (id) => document.getElementById(id); const cd = $('countdown'), scrub = $('scrubber'), bt = $('btn-toggle'), ip = $('icon-pause'), iplay = $('icon-play');
let state = 'COUNTDOWN', speed = 1, cdEl = 0, holdEl = 0, lastTs = null;
function icons() { const playing = state === 'PLAYING' || state === 'COUNTDOWN' || state === 'REFIRE_HOLD'; ip.style.display = playing ? '' : 'none'; iplay.style.display = playing ? 'none' : ''; bt.setAttribute('aria-label', playing ? 'Pause' : 'Play'); }
function hideCd() { cd.style.display = 'none'; cd.textContent = ''; }
function setSim(t) { simTime = t; scrub.value = t === 0 ? '0' : t.toFixed(3); }
bt.addEventListener('click', () => { if (state === 'PLAYING') state = 'PAUSED'; else if (state === 'COUNTDOWN' || state === 'REFIRE_HOLD') { hideCd(); setSim(0); state = 'PAUSED'; } else if (state === 'PAUSED') state = 'PLAYING'; else if (state === 'ENDED') { hideCd(); setSim(0); state = 'PLAYING'; lastAudioK = 0; } icons(); });
document.querySelectorAll('.speed-pill').forEach(b => b.addEventListener('click', () => { speed = parseFloat(b.dataset.speed); document.querySelectorAll('.speed-pill').forEach(o => { const on = o === b; o.classList.toggle('is-active', on); o.setAttribute('aria-checked', on ? 'true' : 'false'); }); }));
scrub.addEventListener('input', () => { hideCd(); simTime = clamp(parseFloat(scrub.value) || 0, 0, DURATION); state = 'PAUSED'; icons(); setAudio(false); render(simTime); lastAudioK = Math.floor(simTime * 20); });
$('btn-refire').addEventListener('click', () => { hideCd(); setSim(0); holdEl = 0; state = 'REFIRE_HOLD'; icons(); setAudio(false); lastAudioK = 0; render(0); });
function frame(ts) {
  requestAnimationFrame(frame); const raw = lastTs === null ? 0 : (ts - lastTs) / 1000; lastTs = ts; const dt = Math.min(Math.max(raw, 0), 0.1);
  if (state === 'COUNTDOWN') { cdEl += dt; if (cdEl >= 3) { hideCd(); state = 'PLAYING'; icons(); } else { cd.style.display = 'block'; cd.textContent = String(3 - Math.floor(cdEl)); } }
  else if (state === 'REFIRE_HOLD') { holdEl += dt; if (holdEl >= 1) { state = 'PLAYING'; icons(); } }
  else if (state === 'PLAYING') { simTime = Math.min(DURATION, simTime + dt * speed); scrub.value = simTime.toFixed(3); if (simTime >= DURATION) { simTime = DURATION; scrub.value = DURATION.toFixed(3); state = 'ENDED'; icons(); } }
  const playing = state === 'PLAYING'; setAudio(playing); render(simTime); audioTick(simTime, playing);
  if (!playing) lastAudioK = Math.floor(simTime * 20);
}
resize(); icons(); render(0); requestAnimationFrame(frame);
})();
</script>
