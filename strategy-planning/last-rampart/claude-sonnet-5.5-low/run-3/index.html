<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Last Rampart</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>

<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">

<script id="rampart-strategy">
function createStrategy() {
  const P = {};
  const airMul = P.airMul !== undefined ? P.airMul : 1.5, splB = 3.5, frostV = 6;
  const wait = P.wait !== undefined ? P.wait : 1, eps = P.eps !== undefined ? P.eps : 40;
  const SLOTS = [[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],[14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]];
  const GP = [[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]], AP = [[0,6],[21,6],[21,11],[23,11]];
  const TY = {
    bolt: { cost: 50, dmg: 26, per: 8, rng: 300, spl: 0, pierce: 0, g: 1, a: 1 },
    cannon: { cost: 90, dmg: 60, per: 24, rng: 260, spl: 90, pierce: 0, g: 1, a: 0 },
    frost: { cost: 70, dmg: 10, per: 12, rng: 240, spl: 0, pierce: 0, g: 1, a: 1 },
    lance: { cost: 120, dmg: 180, per: 36, rng: 360, spl: 0, pierce: 1, g: 1, a: 0 },
    flak: { cost: 80, dmg: 40, per: 10, rng: 320, spl: 70, pierce: 0, g: 0, a: 1 } };
  const HP = { grunt: 60, runner: 40, wisp: 50, brute: 150, splitter: 90, mender: 70, splitling: 22 };
  const NAMES = ['bolt', 'cannon', 'frost', 'lance', 'flak'];
  function pts(route) { // sample points every 20 units
    const out = []; for (let i = 0; i < route.length - 1; i++) {
      const a = route[i], b = route[i + 1], n = (Math.abs(b[0] - a[0]) + Math.abs(b[1] - a[1])) * 5;
      for (let k = 0; k < n; k++) out.push([a[0] * 100 + 50 + (b[0] - a[0]) * 100 * k / n, a[1] * 100 + 50 + (b[1] - a[1]) * 100 * k / n]);
    } return out; }
  const SP = [pts(GP), pts(AP)];
  const covCache = {};
  function cov(slot, r, rng) {
    const key = slot + ',' + r + ',' + rng; if (covCache[key] !== undefined) return covCache[key];
    const cx = SLOTS[slot][0] * 100 + 50, cy = SLOTS[slot][1] * 100 + 50; let c = 0;
    for (const p of SP[r]) { const dx = p[0] - cx, dy = p[1] - cy; if (dx * dx + dy * dy <= rng * rng) c += 20; }
    return covCache[key] = c;
  }
  function dmgAt(type, tier) { let d = TY[type].dmg; for (let k = 1; k < tier; k++) d = Math.floor(d * 16 / 10); return d; }
  // returns [groundPower, airPower] of a turret
  function power(slot, type, tier, mix) {
    const T = TY[type], d = dmgAt(type, tier), rng = T.rng + 30 * (tier - 1);
    let eff = 0;
    if (T.pierce) eff = d; else { for (const m of mix.g) eff += m.w * Math.max(1, d - m.a); eff /= mix.gw || 1; }
    const sp = T.spl ? splB : 1;
    let g = 0, a = 0;
    if (T.g) g = eff / T.per * sp * cov(slot, 0, rng);
    if (T.a) a = d / T.per * sp * cov(slot, 1, rng) * airMul;
    if (type === 'frost') { g = frostV * cov(slot, 0, rng); a = frostV * cov(slot, 1, rng) * 0.5; }
    return [g, a];
  }
  return {
    plan(s) {
      const w = s.wave;
      // threat mix
      const gm = {}, am = { w: 0 };
      let gT = 0, aT = 0;
      const types = s.nextWave.concat(s.enemies.map(e => e.type));
      const cnt = {};
      for (const t of types) cnt[t] = (cnt[t] || 0) + 1;
      const gA = { grunt: Math.floor((w + 1) / 4), brute: 6 + w + 1 };
      const mix = { g: [], gw: 0 };
      for (const t in cnt) {
        const hp = HP[t] * cnt[t];
        if (t === 'wisp') aT += hp;
        else { const a = gA[t] || 0; mix.g.push({ w: hp, a }); mix.gw += hp; gT += hp; }
      }
      if (!gT) { gT = 1; }
      const slots = s.slots.map(x => x.turret ? { type: x.turret.type, tier: x.turret.tier, spent: x.turret.spent } : null);
      const D = [0, 0];
      for (let i = 0; i < 16; i++) if (slots[i]) { const p = power(i, slots[i].type, slots[i].tier, mix); D[0] += p[0]; D[1] += p[1]; }
      const acts = []; let gold = s.gold;
      const T = [gT, aT * (P.airT !== undefined ? P.airT : 1.3)];
      for (let it = 0; it < 30; it++) {
        let best = null, bv = 0;
        for (let i = 0; i < 16; i++) {
          const cur = slots[i];
          const opts = [];
          if (!cur) { for (const ty of NAMES) opts.push([ty, 1, TY[ty].cost]); }
          else if (cur.tier < 3) opts.push([cur.type, cur.tier + 1, TY[cur.type].cost * (cur.tier === 1 ? 1 : 2)]);
          for (const [ty, tier, cost] of opts) {
            const np = power(i, ty, tier, mix), op = cur ? power(i, cur.type, cur.tier, mix) : [0, 0];
            let v = 0;
            for (let r = 0; r < 2; r++) v += T[r] * (np[r] - op[r]) / (D[r] + eps);
            v /= cost;
            if (v > bv) { bv = v; best = { i, ty, tier, cost, np, op, cur }; }
          }
        }
        if (!best) break;
        if (best.cost > gold) { if (wait) break; else break; }
        gold -= best.cost;
        D[0] += best.np[0] - best.op[0]; D[1] += best.np[1] - best.op[1];
        if (best.cur) { acts.push({ op: 'upgrade', slot: best.i }); slots[best.i].tier++; }
        else { acts.push({ op: 'build', slot: best.i, type: best.ty }); slots[best.i] = { type: best.ty, tier: 1, spent: best.cost }; }
      }
      return acts;
    }
  };
}
</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks, observer) {
  const GP = [[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]].map(p => [p[0]*100+50, p[1]*100+50]);
  const AP = [[0,6],[21,6],[21,11],[23,11]].map(p => [p[0]*100+50, p[1]*100+50]);
  const ROUTES = [GP, AP], RLEN = [4600, 2800];
  const SLOTS = [[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],[14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]];
  const TT = { bolt:{i:0,cost:50,dmg:26,per:8,rng:300,spl:0,slow:0,pierce:0,g:1,a:1},
    cannon:{i:1,cost:90,dmg:60,per:24,rng:260,spl:90,slow:0,pierce:0,g:1,a:0},
    frost:{i:2,cost:70,dmg:10,per:12,rng:240,spl:0,slow:30,pierce:0,g:1,a:1},
    lance:{i:3,cost:120,dmg:180,per:36,rng:360,spl:0,slow:0,pierce:1,g:1,a:0},
    flak:{i:4,cost:80,dmg:40,per:10,rng:320,spl:70,slow:0,pierce:0,g:0,a:1} };
  const ET = { grunt:{hp:60,sp:10,bo:4,lk:1,air:0,fw:1,wt:10}, runner:{hp:40,sp:20,bo:4,lk:1,air:0,fw:2,wt:4},
    wisp:{hp:50,sp:12,bo:6,lk:2,air:1,fw:3,wt:3}, brute:{hp:150,sp:6,bo:9,lk:3,air:0,fw:4,wt:3},
    splitter:{hp:90,sp:8,bo:6,lk:2,air:0,fw:6,wt:2}, mender:{hp:70,sp:8,bo:7,lk:2,air:0,fw:8,wt:1},
    splitling:{hp:0,sp:12,bo:1,lk:1,air:0,fw:99,wt:0} };
  const ORDER = ['grunt','runner','wisp','brute','splitter','mender'];
  function mulberry32(a) { return function () {
    a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return (t ^ (t >>> 14)) >>> 0; }; }
  function posAt(r, p) {
    const pts = ROUTES[r]; let rem = p;
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i+1], len = Math.abs(b[0]-a[0]) + Math.abs(b[1]-a[1]);
      if (rem <= len || i === pts.length - 2) {
        const f = Math.min(rem, len);
        return [a[0] + Math.sign(b[0]-a[0]) * f, a[1] + Math.sign(b[1]-a[1]) * f];
      }
      rem -= len;
    }
  }
  const mm = [0, 1000]; function mult(w) { while (mm.length <= w) mm.push(Math.floor(mm[mm.length-1] * 108 / 100)); return mm[w]; }
  const rnd = mulberry32(seed);
  const waves = {};
  function genWave(w) {
    const n = 4 + Math.floor(3 * w / 5), types = ORDER.filter(t => ET[t].fw <= w);
    const sum = types.reduce((s, t) => s + ET[t].wt, 0), out = [];
    for (let i = 0; i < n; i++) { let r = rnd() % sum, k = 0; while (r >= ET[types[k]].wt) { r -= ET[types[k]].wt; k++; } out.push(types[k]); }
    waves[w] = out;
  }
  const strat = createStrategy();
  const log = [];
  let gold = 250, baseHp = 10, nextId = 1, fallTick = -1, curWave = 0;
  const turrets = new Array(16).fill(null);
  let enemies = [];
  const spawnAt = {};
  genWave(1);
  function tstat(t) {
    const T = TT[t.type]; let d = T.dmg;
    for (let k = 1; k < t.tier; k++) d = Math.floor(d * 16 / 10);
    return { dmg: d, rng: T.rng + 30 * (t.tier - 1) };
  }
  function view(e) {
    const p = posAt(e.r, e.progress), sp = e.slow > 0 ? Math.floor(e.sp * 60 / 100) : e.sp;
    return { id: e.id, type: e.type, hp: e.hp, maxHp: e.maxHp, x: p[0], y: p[1], air: e.r, armor: e.armor, speed: sp, slowed: e.slow > 0 ? 1 : 0, remaining: RLEN[e.r] - e.progress };
  }
  function addEnemy(type, wave, progress, maxHp) {
    const E = ET[type];
    const armor = type === 'grunt' ? Math.floor(wave / 4) : type === 'brute' ? 6 + wave : 0;
    const e = { id: nextId++, type, wave, r: E.air, progress, age: 0, slow: 0, sp: E.sp, armor, maxHp, hp: maxHp };
    return e;
  }
  const obs = observer || null;
  let ev = null;
  for (let tick = 0; tick < maxTicks; tick++) {
    if (obs) ev = { shots: [], kills: [], heals: [], leaks: [], acts: [], splits: [] };
    if (tick >= 20 && (tick - 20) % 40 === 0) {
      const w = (tick - 20) / 40 + 1; curWave = w;
      gold += Math.min(50, Math.floor(gold * 5 / 100)) + 10 + 2 * w;
      genWave(w + 1);
      const state = { tick, wave: w, gold, baseHp,
        slots: SLOTS.map((s, i) => ({ slot: i, x: s[0], y: s[1], turret: turrets[i] ? { type: turrets[i].type, tier: turrets[i].tier, spent: turrets[i].spent } : null })),
        enemies: enemies.map(view), nextWave: waves[w + 1].slice() };
      let acts = strat.plan(state);
      if (!Array.isArray(acts)) acts = [];
      acts = acts.slice(0, 32);
      for (const a of acts) {
        if (!a) continue;
        const s = a.slot;
        if (!Number.isInteger(s) || s < 0 || s > 15) continue;
        if (a.op === 'build') {
          const T = TT[a.type];
          if (!T || !Object.prototype.hasOwnProperty.call(TT, a.type) || turrets[s] || gold < T.cost) continue;
          gold -= T.cost; turrets[s] = { type: a.type, tier: 1, spent: T.cost, cd: 0 };
          log.push([tick, 'B', s, T.i]); if (obs) ev.acts.push(['B', s]);
        } else if (a.op === 'upgrade') {
          const t = turrets[s]; if (!t || t.tier >= 3) continue;
          const c = TT[t.type].cost * (t.tier === 1 ? 1 : 2); if (gold < c) continue;
          gold -= c; t.spent += c; t.tier++; log.push([tick, 'U', s, t.tier]); if (obs) ev.acts.push(['U', s]);
        } else if (a.op === 'sell') {
          const t = turrets[s]; if (!t) continue;
          gold += Math.floor(t.spent * 70 / 100); turrets[s] = null; log.push([tick, 'S', s, 0]); if (obs) ev.acts.push(['S', s]);
        }
      }
      const q = waves[w], n = q.length;
      for (let i = 0; i < n; i++) { const t = tick + 4 * i; (spawnAt[t] || (spawnAt[t] = [])).push([q[i], w]); }
    }
    if (spawnAt[tick]) {
      for (const [type, w] of spawnAt[tick]) enemies.push(addEnemy(type, w, 0, Math.floor(ET[type].hp * mult(w) / 1000)));
      delete spawnAt[tick];
    }
    const alive = [];
    let fell = false;
    for (const e of enemies) {
      e.progress += e.slow > 0 ? Math.floor(e.sp * 60 / 100) : e.sp;
      if (e.progress >= RLEN[e.r]) {
        baseHp -= ET[e.type].lk; log.push([tick, 'L', e.id, baseHp]);
        if (obs) ev.leaks.push(e.id);
        if (baseHp <= 0) { fell = true; break; }
      } else alive.push(e);
    }
    if (fell) {
      fallTick = tick; log.push([tick, 'F', curWave, 0]);
      if (obs) { enemies = alive; obs(tick, { enemies, turrets, gold, baseHp, wave: curWave, nextWave: waves[curWave + 1] || [], ev, posAt, fell: true }); }
      break;
    }
    enemies = alive;
    for (const e of enemies) {
      e.age++;
      if (e.type === 'mender' && e.age % 20 === 0) {
        const p = posAt(e.r, e.progress);
        if (obs) ev.heals.push([p[0], p[1]]);
        for (const o of enemies) {
          const q = posAt(o.r, o.progress), dx = q[0] - p[0], dy = q[1] - p[1];
          if (dx*dx + dy*dy <= 150*150) o.hp = Math.min(o.maxHp, o.hp + Math.floor(o.maxHp * 8 / 100));
        }
      }
    }
    for (let s = 0; s < 16; s++) {
      const t = turrets[s]; if (!t) continue;
      if (t.cd > 0) t.cd--;
      if (t.cd > 0) continue;
      const T = TT[t.type], st = tstat(t), tx = SLOTS[s][0]*100+50, ty = SLOTS[s][1]*100+50;
      const cands = [];
      for (const e of enemies) {
        if (e.hp <= 0) continue;
        if (e.r ? !T.a : !T.g) continue;
        const p = posAt(e.r, e.progress), dx = p[0]-tx, dy = p[1]-ty;
        if (dx*dx + dy*dy <= st.rng*st.rng) cands.push(e);
      }
      if (!cands.length) continue;
      let tgt = null;
      if (strat.target) {
        const id = strat.target({ slot: s, type: t.type, tier: t.tier, x: tx, y: ty, range: st.rng }, cands.map(view));
        tgt = cands.find(c => c.id === id) || null;
      }
      if (!tgt) { tgt = cands[0]; for (const c of cands) if (RLEN[c.r] - c.progress < RLEN[tgt.r] - tgt.progress) tgt = c; }
      const tp = posAt(tgt.r, tgt.progress);
      let hit = [tgt];
      if (T.spl) {
        hit = [];
        for (const e of enemies) {
          if (e.hp <= 0) continue;
          if (e.r ? !T.a : !T.g) continue;
          const p = posAt(e.r, e.progress), dx = p[0]-tp[0], dy = p[1]-tp[1];
          if (dx*dx + dy*dy <= T.spl*T.spl) hit.push(e);
        }
      }
      for (const e of hit) {
        e.hp -= T.pierce ? st.dmg : Math.max(1, st.dmg - e.armor);
        if (T.slow) e.slow = T.slow;
      }
      if (obs) ev.shots.push([s, t.type, tp[0], tp[1], tgt.id]);
