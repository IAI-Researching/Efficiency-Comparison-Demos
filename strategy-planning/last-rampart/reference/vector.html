<!DOCTYPE html><html><body><script src="engine.js"></script><script>
function createStrategy() { return { plan(s) { const a = []; let g = s.gold;
  for (const sl of s.slots) if (!sl.turret && g >= 50) { a.push({ op: "build", slot: sl.slot, type: "bolt" }); g -= 50; }
  return a; } }; }
const a = RampartEngine.simulate(createStrategy(), 42, 2020), b = RampartEngine.simulate(createStrategy(), 42, 12020);
const c = RampartEngine.simulate({ plan(s){ return s.wave===1?[{op:"build",slot:3,type:"cannon"},{op:"build",slot:6,type:"frost"}]:s.wave===3?[{op:"upgrade",slot:3},{op:"build",slot:12,type:"flak"}]:s.wave===6?[{op:"build",slot:8,type:"lance"},{op:"sell",slot:6}]:[]; } }, 7, 12020);
document.body.innerHTML = "<pre id=r>" + JSON.stringify({ d100: [a.score, a.fallTick, a.log.length, a.hash], full: [b.score, b.fallTick, b.log.length, b.hash],
  mix7: [c.score, c.fallTick, c.log.length, c.hash], first: b.log.slice(0, 6) }) + "</pre>";
</script></body></html>
