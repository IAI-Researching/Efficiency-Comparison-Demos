<!DOCTYPE html><html><body><script src="engine.js"></script><script src="baselines.js"></script><script>
// random-restart hill climb over a parameterised build plan: estimates the score ceiling a strong strategy can reach
const E = RampartEngine, TY = ["bolt","cannon","frost","lance","flak"], N = 16;
const seeds = [42, 7, 1234, 99991, 31337];
let s0 = 12345; const R = () => { s0 = (s0 * 1103515245 + 12345) & 0x7fffffff; return s0 / 0x7fffffff; };
function make(g) {
  return { plan(s) { const acts = []; let gold = s.gold;
      const built = s.slots.filter(x => x.turret).length;
      for (const i of g.order) { if (s.slots[i].turret || g.types[i] < 0) continue; const c = E.TURRETS[TY[g.types[i]]].cost;
        if (gold - c < g.reserve) break; acts.push({ op: "build", slot: i, type: TY[g.types[i]] }); gold -= c; }
      if (built >= g.upAfter) for (const tier of [1, 2]) for (const i of g.order) { const t = s.slots[i].turret;
        if (!t || t.tier !== tier) continue; const c = E.upgradeCost(t.type, t.tier); if (gold - c >= g.reserve) { acts.push({ op: "upgrade", slot: i }); gold -= c; } }
      return acts; },
    target(t, c) { const m = c.find(e => e.type === "mender"); if (m && g.mender) return m.id;
      let b = c[0]; if (t.type === "lance") { for (const e of c) if (e.hp > b.hp) b = e; } else for (const e of c) if (e.remaining < b.remaining) b = e; return b.id; } };
}
const fit = g => seeds.reduce((a, sd) => a + E.simulate(make(g), sd, 20 + 300 * 40).score, 0) / seeds.length;
let best = null, bf = -1; const t0 = performance.now(); let evals = 0;
for (let restart = 0; restart < 4; restart++) {
  let g = { types: Array.from({length: N}, () => Math.floor(R() * 5)), order: [...Array(N).keys()].sort(() => R() - 0.5), upAfter: 4 + Math.floor(R() * 12), reserve: 0, mender: 1 };
  let f = fit(g); evals++;
  for (let it = 0; it < 120; it++) {
    const h = JSON.parse(JSON.stringify(g)); const k = Math.floor(R() * 4);
    if (k === 0) h.types[Math.floor(R() * N)] = Math.floor(R() * 6) - 1;
    else if (k === 1) { const a = Math.floor(R() * N), b = Math.floor(R() * N); [h.order[a], h.order[b]] = [h.order[b], h.order[a]]; }
    else if (k === 2) h.upAfter = Math.max(0, Math.min(16, h.upAfter + (R() < .5 ? -1 : 1)));
    else h.reserve = Math.max(0, h.reserve + (R() < .5 ? -50 : 50));
    const fh = fit(h); evals++; if (fh >= f) { g = h; f = fh; }
  }
  if (f > bf) { bf = f; best = g; }
}
const base = {};
for (const n of ["naive","decent","strong"]) base[n] = (seeds.reduce((a, sd) => a + E.simulate(RampartBaselines[n], sd, 20 + 300 * 40).score, 0) / 5).toFixed(2);
const per = seeds.map(sd => E.simulate(make(best), sd, 20 + 300 * 40).score);
document.body.innerHTML = "<pre id=r>" + JSON.stringify({ base, best: bf.toFixed(2), per, g: best, evals, ms: Math.round(performance.now() - t0) }) + "</pre>";
</script></body></html>
