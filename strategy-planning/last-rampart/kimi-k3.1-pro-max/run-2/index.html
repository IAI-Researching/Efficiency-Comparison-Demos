<script id="rampart-strategy">
function createStrategy() {
  const buildOrder = [[0,"bolt"],[3,"cannon"],[15,"flak"],[5,"cannon"],[1,"cannon"],[8,"cannon"],[6,"cannon"],[11,"cannon"],[12,"cannon"],[13,"bolt"],[10,"flak"],[9,"cannon"],[4,"lance"],[14,"bolt"],[2,"bolt"],[7,"cannon"]];
  const conversions = [[35,4,"flak"],[35,7,"flak"],[40,2,"frost"]];
  const costs = { bolt: 50, cannon: 90, frost: 70, lance: 120, flak: 80 };
  return {
    plan(s) {
      const actions = [];
      const built = [];
      let gold = s.gold;
      for (let i = 0; i < s.slots.length; i++) if (s.slots[i].turret) built[s.slots[i].slot] = true;
      for (let i = 0; i < conversions.length; i++) {
        const cv = conversions[i], slotState = s.slots[cv[1]];
        if (s.wave >= cv[0] && slotState.turret && slotState.turret.type !== cv[2]) {
          actions.push({ op: "sell", slot: cv[1] });
          gold += Math.floor(slotState.turret.spent * 70 / 100);
          slotState.turret = null;
          built[cv[1]] = false;
        }
      }
      if (s.wave >= 12) {
        for (let pass = 0; pass < 2; pass++) {
          for (let i = 0; i < buildOrder.length; i++) {
            const slot = buildOrder[i][0], turret = s.slots[slot].turret;
            if (!turret || turret.tier !== pass + 1) continue;
            const cost = costs[turret.type] * turret.tier;
            if (gold >= cost) {
              actions.push({ op: "upgrade", slot: slot });
              gold -= cost;
              turret.tier++;
            }
          }
        }
      }
      for (let i = 0; i < buildOrder.length; i++) {
        const slot = buildOrder[i][0];
        let type = buildOrder[i][1];
        for (let j = 0; j < conversions.length; j++) if (conversions[j][1] === slot && s.wave >= conversions[j][0]) type = conversions[j][2];
        if (built[slot]) continue;
        const cost = costs[type];
        if (gold >= cost) {
          actions.push({ op: "build", slot: slot, type: type });
          gold -= cost;
          built[slot] = true;
        }
      }
      return actions;
    },
    target(turret, candidates) {
      let best = candidates[0], bestScore = -Infinity;
      for (let i = 0; i < candidates.length; i++) {
        const enemy = candidates[i];
        let score = -enemy.remaining * 0.01 - enemy.remaining * 0.02 / enemy.speed;
        if (enemy.type === "mender") score += 80;
        if (turret.type === "lance") {
          score += enemy.maxHp * 0.015 + enemy.armor * 2;
          if (enemy.type === "brute") score += 70;
        } else if (turret.type === "frost") {
          score += enemy.speed * 2 + (enemy.slowed > 0 ? -120 : 40);
          if (enemy.type === "brute") score += 20;
        } else if (turret.type === "cannon" || turret.type === "flak") {
          let cluster = 0;
          const radius = turret.type === "cannon" ? 90 : 70;
          for (let j = 0; j < candidates.length; j++) {
            const other = candidates[j], dx = other.x - enemy.x, dy = other.y - enemy.y;
            if (dx * dx + dy * dy <= radius * radius) cluster += 1 + Math.min(other.hp, 150) / 100;
          }
          score += cluster * (turret.type === "flak" ? 25 : 12);
        } else {
          const damage = turret.tier === 1 ? 26 : turret.tier === 2 ? 41 : 65;
          if (enemy.hp <= damage) score += 25;
          if (enemy.type === "wisp") score += 8;
        }
        if (score > bestScore) { bestScore = score; best = enemy; }
      }
      return best.id;
    }
  };
}
</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks) {
  function mulberry32(a) { return function () {
    a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return (t ^ (t >>> 14)) >>> 0; }; }
  const draw = mulberry32(seed);
  const types = ["grunt", "runner", "wisp", "brute", "splitter", "mender"];
  const first = [1, 2, 3, 4, 6, 8];
  const weights = [10, 4, 3, 3, 2, 1];
  const baseHp = { grunt: 60, runner: 40, wisp: 50, brute: 150, splitter: 90, mender: 70, splitling: 0 };
  const speeds = { grunt: 10, runner: 20, wisp: 12, brute: 6, splitter: 8, mender: 8, splitling: 12 };
  const bounties = { grunt: 4, runner: 4, wisp: 6, brute: 9, splitter: 6, mender: 7, splitling: 1 };
  const leaks = { grunt: 1, runner: 1, wisp: 2, brute: 3, splitter: 2, mender: 2, splitling: 1 };
  const turretNames = ["bolt", "cannon", "frost", "lance", "flak"];
  const costs = { bolt: 50, cannon: 90, frost: 70, lance: 120, flak: 80 };
  const damages = { bolt: 26, cannon: 60, frost: 10, lance: 180, flak: 40 };
  const periods = { bolt: 8, cannon: 24, frost: 12, lance: 36, flak: 10 };
  const ranges = { bolt: 300, cannon: 260, frost: 240, lance: 360, flak: 320 };
  const splashes = { bolt: 0, cannon: 90, frost: 0, lance: 0, flak: 70 };
  const groundRoute = [[0, 2], [6, 2], [6, 10], [12, 10], [12, 3], [18, 3], [18, 11], [23, 11]];
  const airRoute = [[0, 6], [21, 6], [21, 11], [23, 11]];
  const groundLength = 4600, airLength = 2800;
  const slotTiles = [[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],[14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]];
  const slots = slotTiles.map(function (p, i) { return { slot: i, x: p[0] * 100 + 50, y: p[1] * 100 + 50, turret: null }; });
  let enemies = [], spawnQueue = [], nextId = 1, gold = 250, base = 10, wave = 0, fallTick = -1;
  const log = [];
  const replay = { frames: [], events: [], seed: seed, maxTicks: maxTicks };
  const recording = seed === 42 && maxTicks === 2020, noEvents = [];
  const hpScales = [1000, 1000];
  const strategy = createStrategy();
  function makeWave(w) {
    const out = [], available = [];
    let total = 0;
    for (let i = 0; i < types.length; i++) if (first[i] <= w) { available.push(i); total += weights[i]; }
    const count = 4 + Math.floor(3 * w / 5);
    for (let n = 0; n < count; n++) {
      let r = draw() % total, picked = available[available.length - 1];
      for (let j = 0; j < available.length; j++) {
        const idx = available[j];
        if (r < weights[idx]) { picked = idx; break; }
        r -= weights[idx];
      }
      out.push(types[picked]);
    }
    return out;
  }
  let queuedWave = makeWave(1), preview = queuedWave.slice();
  function routeLength(air) { return air ? airLength : groundLength; }
  function pointAt(progress, air) {
    const route = air ? airRoute : groundRoute;
    let left = progress;
    for (let i = 0; i < route.length - 1; i++) {
      const a = route[i], b = route[i + 1], dx = (b[0] - a[0]) * 100, dy = (b[1] - a[1]) * 100;
      const len = Math.abs(dx) + Math.abs(dy);
      if (left <= len) return { x: a[0] * 100 + 50 + dx * left / len, y: a[1] * 100 + 50 + dy * left / len };
      left -= len;
    }
    const p = route[route.length - 1];
    return { x: p[0] * 100 + 50, y: p[1] * 100 + 50 };
  }
  function hpScale(w) {
    while (hpScales.length <= w) hpScales.push(Math.floor(hpScales[hpScales.length - 1] * 108 / 100));
    return hpScales[w];
  }
  function spawn(type, w, progress) {
    const hp = Math.max(1, Math.floor(baseHp[type] * hpScale(w) / 1000));
    const enemy = { id: nextId++, type: type, wave: w, hp: hp, maxHp: hp, progress: progress || 0, age: 0, slow: 0, air: type === "wisp" ? 1 : 0 };
    enemies.push(enemy);
    return enemy;
  }
  function view(enemy) {
    const p = pointAt(enemy.progress, enemy.air);
    const armor = enemy.type === "grunt" ? Math.floor(enemy.wave / 4) : enemy.type === "brute" ? 6 + enemy.wave : 0;
    return { id: enemy.id, type: enemy.type, hp: enemy.hp, maxHp: enemy.maxHp, x: p.x, y: p.y, air: enemy.air, armor: armor, speed: speeds[enemy.type], slowed: enemy.slow, remaining: routeLength(enemy.air) - enemy.progress };
  }
  function stateView() {
    return { tick: tick, wave: wave, gold: gold, baseHp: base,
      slots: slots.map(function (s) { return { slot: s.slot, x: s.x, y: s.y, turret: s.turret ? { type: s.turret.type, tier: s.turret.tier, spent: s.turret.spent } : null }; }),
      enemies: enemies.slice().sort(function (a,b) { return a.id-b.id; }).map(view), nextWave: preview.slice() };
  }
  function eventList(t) {
    if (!recording) return noEvents;
    if (!replay.events[t]) replay.events[t] = [];
    return replay.events[t];
  }
  function frame() {
    return { tick: tick, wave: wave, gold: gold, baseHp: base, nextWave: preview.slice(),
      enemies: enemies.slice().sort(function (a,b) { return a.id-b.id; }).map(function (e) { const v = view(e); v.progress = e.progress; return v; }),
      turrets: slots.filter(function (s) { return !!s.turret; }).map(function (s) { return { slot: s.slot, type: s.turret.type, tier: s.turret.tier, cooldown: s.turret.cooldown }; }) };
  }
  function removeDead(killer, events) {
    const dead = enemies.filter(function (e) { return e.hp <= 0; }).sort(function (a,b) { return a.id-b.id; });
    if (!dead.length) return;
    const deadIds = dead.map(function (e) { return e.id; });
    enemies = enemies.filter(function (e) { return deadIds.indexOf(e.id) < 0; });
    for (let i = 0; i < dead.length; i++) {
      const enemy = dead[i], p = pointAt(enemy.progress, enemy.air);
      gold += bounties[enemy.type];
      log.push([tick, "K", enemy.id, killer]);
      events.push({ kind: "kill", id: enemy.id, type: enemy.type, wave: enemy.wave, x: p.x, y: p.y, air: enemy.air, slot: killer });
      if (enemy.type === "splitter") {
        const childHp = Math.max(1, Math.floor(enemy.maxHp / 4));
        for (let n = 0; n < 3; n++) {
          const child = spawn("splitling", enemy.wave, enemy.progress);
          child.hp = childHp; child.maxHp = childHp;
          events.push({ kind: "split", id: child.id, parent: enemy.id, x: p.x, y: p.y });
        }
      }
    }
  }
  function result(endTick) {
    const score = Math.round((endTick - 20) / 40 * 100) / 100, text = JSON.stringify(log);
    let h = 0x811c9dc5;
    for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 0x01000193); }
    const out = { score: score, fallTick: fallTick, log: log, hash: (h >>> 0).toString(16).padStart(8, "0") };
    Object.defineProperty(out, "replay", { value: replay, enumerable: false });
    return out;
  }
  let tick = 0;
  for (tick = 0; tick < maxTicks; tick++) {
    const events = eventList(tick);
    const start = tick >= 20 && (tick - 20) % 40 === 0 ? 1 + Math.floor((tick - 20) / 40) : 0;
    if (start) {
      wave = start;
      gold += Math.min(50, Math.floor(gold * 5 / 100)) + 10 + 2 * wave;
      preview = makeWave(wave + 1);
      events.push({ kind: "wave", wave: wave });
      const actions = strategy.plan(stateView());
      if (Array.isArray(actions)) {
        const count = Math.min(32, actions.length);
        for (let ai = 0; ai < count; ai++) {
          const action = actions[ai];
          if (!action || typeof action.slot !== "number" || action.slot < 0 || action.slot >= 16 || Math.floor(action.slot) !== action.slot) continue;
          const slot = slots[action.slot];
          if (action.op === "build" && !slot.turret && costs[action.type] !== undefined && gold >= costs[action.type]) {
            const type = action.type;
            gold -= costs[type];
            slot.turret = { type: type, tier: 1, spent: costs[type], damage: damages[type], range: ranges[type], cooldown: 0 };
            log.push([tick, "B", action.slot, turretNames.indexOf(type)]);
            events.push({ kind: "build", slot: action.slot, type: type, x: slot.x, y: slot.y });
          } else if (action.op === "upgrade" && slot.turret && slot.turret.tier < 3) {
            const turret = slot.turret, cost = costs[turret.type] * turret.tier;
            if (gold >= cost) {
              gold -= cost;
              turret.spent += cost; turret.tier++;
              turret.damage = Math.floor(turret.damage * 16 / 10); turret.range += 30;
              log.push([tick, "U", action.slot, turret.tier]);
              events.push({ kind: "upgrade", slot: action.slot, type: turret.type, tier: turret.tier, x: slot.x, y: slot.y });
            }
          } else if (action.op === "sell" && slot.turret) {
            const turret = slot.turret;
            gold += Math.floor(turret.spent * 70 / 100);
            log.push([tick, "S", action.slot, 0]);
            events.push({ kind: "sell", slot: action.slot, type: turret.type, tier: turret.tier, x: slot.x, y: slot.y });
            slot.turret = null;
          }
        }
      }
      const current = queuedWave;
      for (let i = 0; i < current.length; i++) spawnQueue.push({ tick: tick + 4 * i, wave: wave, index: i, type: current[i] });
      spawnQueue.sort(function (a,b) { return a.tick-b.tick || a.wave-b.wave || a.index-b.index; });
      queuedWave = preview;
    }
    while (spawnQueue.length && spawnQueue[0].tick === tick) {
      const queued = spawnQueue.shift(), enemy = spawn(queued.type, queued.wave, 0), p = pointAt(0, enemy.air);
      events.push({ kind: "spawn", id: enemy.id, type: queued.type, wave: queued.wave, x: p.x, y: p.y, air: enemy.air });
    }
    enemies.sort(function (a,b) { return a.id-b.id; });
    for (let i = 0; i < enemies.length; i++) {
      const enemy = enemies[i];
      enemy.progress += enemy.slow > 0 ? Math.floor(speeds[enemy.type] * 60 / 100) : speeds[enemy.type];
      if (enemy.progress >= routeLength(enemy.air)) {
        const p = pointAt(routeLength(enemy.air), enemy.air);
        base -= leaks[enemy.type];
        log.push([tick, "L", enemy.id, base]);
        events.push({ kind: "leak", id: enemy.id, type: enemy.type, x: p.x, y: p.y, hp: base });
        enemies.splice(i, 1);
        if (base <= 0) {
          fallTick = tick;
          log.push([tick, "F", wave, 0]);
          events.push({ kind: "fall", wave: wave, x: 2350, y: 1150 });
          if (recording) replay.frames[tick] = frame();
          replay.endTick = tick;
          return result(tick);
        }
        i--;
      }
    }
    enemies.sort(function (a,b) { return a.id-b.id; });
    for (let i = 0; i < enemies.length; i++) {
      const enemy = enemies[i];
      enemy.age++;
      if (enemy.type === "mender" && enemy.age % 20 === 0) {
        const p = pointAt(enemy.progress, false);
        for (let j = 0; j < enemies.length; j++) {
          const other = enemies[j], q = pointAt(other.progress, other.air);
          const dx = p.x - q.x, dy = p.y - q.y;
          if (dx * dx + dy * dy <= 150 * 150) other.hp = Math.min(other.maxHp, other.hp + Math.floor(other.maxHp * 8 / 100));
        }
        events.push({ kind: "heal", id: enemy.id, x: p.x, y: p.y, radius: 150 });
      }
    }
    for (let si = 0; si < slots.length; si++) {
      const slot = slots[si], turret = slot.turret;
      if (!turret) continue;
      if (turret.cooldown > 0) {
        turret.cooldown--;
        if (turret.cooldown > 0) continue;
      }
      const candidates = [];
      for (let i = 0; i < enemies.length; i++) {
        const enemy = enemies[i];
        if (enemy.hp <= 0) continue;
        if (turret.type === "cannon" || turret.type === "lance" ? enemy.air : turret.type === "flak" ? !enemy.air : false) continue;
        const p = pointAt(enemy.progress, enemy.air), dx = p.x - slot.x, dy = p.y - slot.y;
        if (dx * dx + dy * dy <= turret.range * turret.range) candidates.push(enemy);
      }
      candidates.sort(function (a,b) { return a.id-b.id; });
      if (!candidates.length) continue;
