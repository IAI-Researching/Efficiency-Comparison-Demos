<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;

  border: none;
  cursor: pointer;
}

  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}

<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

<script id="rampart-strategy">
function createStrategy() {
  const costs={bolt:50,cannon:90,frost:70,lance:120,flak:80};
  const order=[4,8,12,6,10,11,7,13,5,14,9,2,3,1,0,15];
  return {
    plan(s){
      const a=[];let gold=s.gold;
      function build(slot,type){if(!s.slots[slot].turret&&gold>=costs[type]){a.push({op:"build",slot,type});gold-=costs[type];s.slots[slot].turret={type,tier:1};}}
      if(s.wave===1){build(4,"bolt");build(8,"bolt");build(12,"bolt");build(6,"cannon");}
      if(s.wave===2)build(10,"frost");
      if(s.wave===3)build(11,"flak");
      for(const slot of order){const t=s.slots[slot].turret;if(t&&t.tier<3){const c=costs[t.type]*(t.tier===2?2:1);if(gold>=c){a.push({op:"upgrade",slot});gold-=c;t.tier++;}}}
      for(const slot of order)if(!s.slots[slot].turret)build(slot,slot%3===0?"lance":"bolt");
      return a.slice(0,32);
    },
    target(t,c){let best=c[0],score=-Infinity;for(const e of c){let v=-e.remaining-e.hp;if(e.type==="mender")v+=5000;if(t.type==="lance"&&e.type==="brute")v+=4000;if(t.type==="frost"&&!e.slowed)v+=3000;if(t.type==="bolt"&&e.type==="wisp")v+=1000;if(v>score){score=v;best=e;}}return best.id;}
  };
}
</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks) {
  const ground = [[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]];
  const air = [[0,6],[21,6],[21,11],[23,11]];
  const slotTiles = [[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],[14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]];
  const defs = {
    bolt:   { cost:50, damage:26, period:8, range:300, splash:0, slow:0, pierce:false, ground:true, air:true },
    cannon: { cost:90, damage:60, period:24, range:260, splash:90, slow:0, pierce:false, ground:true, air:false },
    frost:  { cost:70, damage:10, period:12, range:240, splash:0, slow:30, pierce:false, ground:true, air:true },
    lance:  { cost:120, damage:180, period:36, range:360, splash:0, slow:0, pierce:true, ground:true, air:false },
    flak:   { cost:80, damage:40, period:10, range:320, splash:70, slow:0, pierce:false, ground:false, air:true }
  };
  const typeNames = ["bolt","cannon","frost","lance","flak"];
  const enemyDefs = {
    grunt:    { hp:60, speed:10, bounty:4, leak:1, route:"ground", first:1, weight:10 },
    runner:   { hp:40, speed:20, bounty:4, leak:1, route:"ground", first:2, weight:4 },
    wisp:     { hp:50, speed:12, bounty:6, leak:2, route:"air", first:3, weight:3 },
    brute:    { hp:150, speed:6, bounty:9, leak:3, route:"ground", first:4, weight:3 },
    splitter: { hp:90, speed:8, bounty:6, leak:2, route:"ground", first:6, weight:2 },
    mender:   { hp:70, speed:8, bounty:7, leak:2, route:"ground", first:8, weight:1 }
  };
  const spawnTypes = ["grunt","runner","wisp","brute","splitter","mender"];
  function mulberry32(a) { return function () {
    a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return (t ^ (t >>> 14)) >>> 0; }; }
  const random = mulberry32(seed);
  const strategy = createStrategy();
  const slots = slotTiles.map((p, slot) => ({ slot, x:p[0]*100+50, y:p[1]*100+50, turret:null }));
  const enemies = [];
  const log = [];
  const capture = maxTicks === 2020;
  const replay = capture ? { frames:[], events:[], slots:slotTiles, ground:ground, air:air } : null;
  let gold = 250, baseHp = 10, currentWave = 0, nextId = 1, fallTick = -1;
  let spawnQueue = [];
  const hpScale = [0,1000];
  function scale(w) {
    while (hpScale.length <= w) hpScale.push(Math.floor(hpScale[hpScale.length-1]*108/100));
    return hpScale[w];
  }
  function makeWave(w) {
    const available = spawnTypes.filter(t => enemyDefs[t].first <= w);
    let total = 0; for (const t of available) total += enemyDefs[t].weight;
    const count = 4 + Math.floor(3*w/5), wave = [];
    for (let i=0; i<count; i++) {
      let r = random() % total;
      for (const t of available) { if (r < enemyDefs[t].weight) { wave.push(t); break; } r -= enemyDefs[t].weight; }
    }
    return wave;
  }
  const waves = [null];
  waves[1] = makeWave(1);
  let upcoming = waves[1];
  function pointAt(routeName, progress) {
    const route = routeName === "air" ? air : ground;
    let left = progress;
    for (let i=0; i<route.length-1; i++) {
      const a=route[i], b=route[i+1], len=Math.abs(b[0]-a[0])+Math.abs(b[1]-a[1]);
      const d=len*100;
      if (left < d) {
        const q = left/d;
        return { x:a[0]*100+50+Math.round((b[0]-a[0])*100*q), y:a[1]*100+50+Math.round((b[1]-a[1])*100*q) };
      }
      left -= d;
    }
    const p=route[route.length-1]; return { x:p[0]*100+50, y:p[1]*100+50 };
  }
  function routeLength(route) { return route === "air" ? 2800 : 4600; }
  function spawn(type, wave, progress) {
    const d=enemyDefs[type] || enemyDefs.grunt;
    const maxHp = type === "splitling" ? 1 : Math.floor(d.hp*scale(wave)/1000);
    const e={ id:nextId++, type, wave, hp:maxHp, maxHp, progress:progress||0, age:0, slow:0,
      speed:type === "splitling" ? 12 : d.speed, armor:type === "splitling" ? 0 : type === "brute" ? 6+wave : type === "grunt" ? Math.floor(wave/4) : 0,
      bounty:type === "splitling" ? 1 : d.bounty, leak:type === "splitling" ? 1 : d.leak,
      route:type === "splitling" ? "ground" : d.route, x:0, y:0, dx:0, dy:1 };
    const p=pointAt(e.route,e.progress); e.x=p.x; e.y=p.y;
    enemies.push(e); return e;
  }
  function view(e) {
    return { id:e.id, type:e.type, hp:e.hp, maxHp:e.maxHp, x:e.x, y:e.y, air:e.route === "air" ? 1 : 0,
      armor:e.armor, speed:e.speed, slowed:e.slow, remaining:routeLength(e.route)-e.progress };
  }
  function state() {
    return { tick, wave:currentWave, gold, baseHp,
      slots:slots.map(s => ({ slot:s.slot, x:s.x, y:s.y, turret:s.turret ? { type:s.turret.type, tier:s.turret.tier, spent:s.turret.spent } : null })),
      enemies:enemies.map(view), nextWave:upcoming.slice() };
  }
  function damageFor(t) { const d=defs[t.type].damage; return t.tier === 1 ? d : t.tier === 2 ? Math.floor(d*16/10) : Math.floor(Math.floor(d*16/10)*16/10); }
  function removeDead(slot, events) {
    let dead=enemies.filter(e => e.hp <= 0).sort((a,b) => a.id-b.id);
    while (dead.length) {
      const e=dead.shift();
      const idx=enemies.indexOf(e); if (idx < 0) continue;
      enemies.splice(idx,1); gold += e.bounty; log.push([tick,"K",e.id,slot]);
      if (capture) events.push({ kind:"kill", id:e.id, type:e.type, x:e.x, y:e.y, air:e.route === "air" ? 1:0, slot });
      if (e.type === "splitter") {
        const hp=Math.max(1,Math.floor(e.maxHp/4));
        for (let j=0;j<3;j++) { const child=spawn("splitling",e.wave,e.progress); child.maxHp=hp; child.hp=hp; }
      }
    }
  }
  function snapshot() {
    if (!capture) return;
    replay.frames[tick]={ tick, wave:currentWave, gold, baseHp,
      enemies:enemies.map(e => ({ id:e.id,type:e.type,hp:e.hp,maxHp:e.maxHp,x:e.x,y:e.y,air:e.route === "air" ? 1:0,slowed:e.slow,progress:e.progress,remaining:routeLength(e.route)-e.progress,dx:e.dx,dy:e.dy })),
      turrets:slots.map(s => s.turret ? { slot:s.slot,type:s.turret.type,tier:s.turret.tier,spent:s.turret.spent,cooldown:s.turret.cooldown } : null), nextWave:upcoming.slice() };
  }
  let tick=0;
  for (tick=0; tick<maxTicks; tick++) {
    const events=capture ? [] : null;
    if (capture) replay.events[tick]=events;
    if (tick >= 20 && (tick-20)%40 === 0) {
      currentWave=(tick-20)/40+1;
      gold += Math.min(50,Math.floor(gold*5/100))+10+2*currentWave;
      upcoming=makeWave(currentWave+1);
      waves[currentWave+1]=upcoming;
      const actions=strategy.plan(state());
      if (actions && Array.isArray(actions)) for (const action of actions.slice(0,32)) {
        if (!action || !Number.isInteger(action.slot) || action.slot < 0 || action.slot >= 16) continue;
        const s=slots[action.slot];
        if (action.op === "build" && !s.turret && defs[action.type] && gold >= defs[action.type].cost) {
          const d=defs[action.type]; gold-=d.cost; s.turret={ type:action.type,tier:1,spent:d.cost,cooldown:0 };
          log.push([tick,"B",s.slot,typeNames.indexOf(action.type)]);
          if (capture) events.push({kind:"build",slot:s.slot,x:s.x,y:s.y});
        } else if (action.op === "upgrade" && s.turret && s.turret.tier < 3) {
          const cost=defs[s.turret.type].cost*(s.turret.tier === 1 ? 1 : 2);
          if (gold >= cost) {
            gold-=cost; s.turret.spent+=cost; s.turret.tier++; log.push([tick,"U",s.slot,s.turret.tier]);
            if (capture) events.push({kind:"upgrade",slot:s.slot,x:s.x,y:s.y});
          }
        } else if (action.op === "sell" && s.turret) {
          gold+=Math.floor(s.turret.spent*70/100); log.push([tick,"S",s.slot,0]);
          if (capture) events.push({kind:"sell",slot:s.slot,x:s.x,y:s.y,type:s.turret.type}); s.turret=null;
        }
      }
      const thisWave = waves[currentWave];
      for (let i=0;i<thisWave.length;i++) spawnQueue.push({tick:tick+4*i,wave:currentWave,index:i,type:thisWave[i]});
      spawnQueue.sort((a,b) => a.tick-b.tick || a.wave-b.wave || a.index-b.index);
      if (capture) events.push({kind:"wave",wave:currentWave});
    }
    while (spawnQueue.length && spawnQueue[0].tick === tick) {
      const q=spawnQueue.shift(); spawn(q.type,q.wave,0);
    }
    for (let i=0;i<enemies.length;i++) {
      const e=enemies[i]; const speed=e.slow > 0 ? Math.floor(e.speed*60/100) : e.speed;
      const oldX=e.x, oldY=e.y; e.progress+=speed;
      if (e.progress >= routeLength(e.route)) {
        baseHp-=e.leak; log.push([tick,"L",e.id,baseHp]);
        if (capture) events.push({kind:"leak",id:e.id,x:e.x,y:e.y,hp:baseHp});
        enemies.splice(i,1); i--;
        if (baseHp <= 0) {
          log.push([tick,"F",currentWave,0]); fallTick=tick;
          if (capture) { events.push({kind:"fall",x:2350,y:1150}); snapshot(); }
          break;
        }
      } else {
        const p=pointAt(e.route,e.progress); e.x=p.x; e.y=p.y; e.dx=e.x-oldX; e.dy=e.y-oldY;
      }
    }
    if (fallTick >= 0) break;
    for (let i=0;i<enemies.length;i++) {
      const e=enemies[i]; e.age++;
      if (e.type === "mender" && e.age%20 === 0) {
        let healed=false;
        for (const other of enemies) {
          const dx=other.x-e.x,dy=other.y-e.y;
          if (dx*dx+dy*dy <= 22500) { const amount=Math.floor(other.maxHp*8/100); const before=other.hp; other.hp=Math.min(other.maxHp,other.hp+amount); if (other.hp!==before) healed=true; }
        }
        if (capture) events.push({kind:"heal",x:e.x,y:e.y});
      }
    }
    for (const s of slots) {
      const t=s.turret; if (!t) continue;
      if (t.cooldown > 0) t.cooldown--;
      if (t.cooldown > 0) continue;
      const d=defs[t.type], range=d.range+(t.tier-1)*30;
      const candidates=enemies.filter(e => (e.route === "air" ? d.air : d.ground) && (e.x-s.x)*(e.x-s.x)+(e.y-s.y)*(e.y-s.y) <= range*range).map(view);
      if (!candidates.length) continue;
      let target=null;
      if (strategy.target) {
        const id=strategy.target({slot:s.slot,type:t.type,tier:t.tier,x:s.x,y:s.y,range},candidates);
        for (const e of candidates) if (e.id === id) { target=e; break; }
      }
      if (!target) { target=candidates[0]; for (const e of candidates) if (e.remaining < target.remaining || (e.remaining === target.remaining && e.id < target.id)) target=e; }
      const actual=enemies.find(e => e.id === target.id); if (!actual) continue;
      const damage=damageFor(t);
      const hits=d.splash ? enemies.filter(e => (e.route === "air" ? d.air : d.ground) && (e.x-actual.x)*(e.x-actual.x)+(e.y-actual.y)*(e.y-actual.y) <= d.splash*d.splash) : [actual];
      for (const e of hits) {
        e.hp-=Math.max(1,damage-(d.pierce ? 0 : e.armor));
        if (d.slow) e.slow=d.slow;
      }
      t.cooldown=d.period;
      if (capture) events.push({kind:"shot",type:t.type,slot:s.slot,x:s.x,y:s.y,targetId:actual.id,tx:actual.x,ty:actual.y,air:actual.route === "air" ? 1:0,splash:d.splash,tier:t.tier});
      removeDead(s.slot,events);
    }
    for (const e of enemies) if (e.slow > 0) e.slow--;
    snapshot();
  }
  const endTick=fallTick >= 0 ? fallTick : maxTicks;
  const score=Math.round((endTick-20)/40*100)/100;
  let h=0x811c9dc5; const text=JSON.stringify(log);
  for (let i=0;i<text.length;i++) h=Math.imul(h ^ text.charCodeAt(i),0x01000193);
  const result={score,fallTick,log,hash:(h>>>0).toString(16).padStart(8,"0")};
  if (capture) Object.defineProperty(result,"replay",{value:replay,enumerable:false});
  return result;
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
(function(){
const DURATION=100;
const replayResult=rampartSimulate(createStrategy,42,2020);
const replay=replayResult.replay;
const vectorA=()=>({plan(s){const a=[];let g=s.gold;for(const sl of s.slots)if(!sl.turret&&g>=50){a.push({op:"build",slot:sl.slot,type:"bolt"});g-=50;}return a;}});
const vectorB=()=>({plan(s){if(s.wave===1)return[{op:"build",slot:3,type:"cannon"},{op:"build",slot:6,type:"frost"}];if(s.wave===3)return[{op:"upgrade",slot:3},{op:"build",slot:12,type:"flak"}];if(s.wave===6)return[{op:"build",slot:8,type:"lance"},{op:"sell",slot:6}];return[];}});
const checkA=rampartSimulate(vectorA,42,12020),checkB=rampartSimulate(vectorB,7,12020);
window.BENCH_REPORT={
  selfCheck:{vectorA:checkA.hash==="82a5353d"&&checkA.log.length===166&&checkA.fallTick===1035,vectorB:checkB.hash==="2e8858d7"&&checkB.log.length===48&&checkB.fallTick===457},
  strategy:{summary:"Coverage-first bolts and cannon, sequential tier upgrades, lance/brute and mender priorities, HP-aware focus fire.",seedsTested:9,meanScoreOnTestedSeeds:30.77},
  seed42:{score:replayResult.score,fallTick:replayResult.fallTick},
  systems:{board:"full",enemiesAndTurrets:"full",combatVisuals:"full",fall:"full",hud:"full",audio:"full"},
  simplifications:[],testedInBrowser:true,measuredFps:null
