<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="100" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script id="rampart-strategy">
function createStrategy() {
  const cannonSlots = [3, 6, 8, 12];
  function nearest(list) {
    let best = list[0];
    for (let i = 1; i < list.length; i++) if (list[i].remaining < best.remaining) best = list[i];
    return best;
  }
  return {
    plan(state) {
      const actions = [];
      let gold = state.gold;
      for (const slot of state.slots) {
        if (!slot.turret && gold >= 50) {
          actions.push({ op: "build", slot: slot.slot, type: "bolt" });
          gold -= 50;
        }
      }
      if (state.wave >= 8) {
        for (const slot of state.slots) {
          if (slot.turret && slot.turret.type === "bolt" && slot.turret.tier === 1 && gold >= 50) {
            actions.push({ op: "upgrade", slot: slot.slot });
            gold -= 50;
          }
        }
      }
      if (state.wave >= 12) {
        for (const index of cannonSlots) {
          const turret = state.slots[index].turret;
          if (turret && turret.type === "bolt") {
            const refund = Math.floor(turret.spent * 70 / 100);
            if (gold + refund >= 90) {
              actions.push({ op: "sell", slot: index });
              gold += refund;
              actions.push({ op: "build", slot: index, type: "cannon" });
              gold -= 90;
            }
          }
        }
        for (const index of cannonSlots) {
          const turret = state.slots[index].turret;
          if (turret && turret.type === "cannon" && turret.tier === 1 && gold >= 90) {
            actions.push({ op: "upgrade", slot: index });
            gold -= 90;
          }
        }
      }
      if (state.wave >= 20) {
        for (const slot of state.slots) {
          const turret = slot.turret;
          if (turret && turret.tier === 2) {
            const cost = turret.type === "cannon" ? 180 : 100;
            if (gold >= cost) {
              actions.push({ op: "upgrade", slot: slot.slot });
              gold -= cost;
            }
          }
        }
      }
      return actions;
    },
    target(turret, candidates) {
      if (!candidates.length) return -1;
      const menders = candidates.filter(e => e.type === "mender");
      if (menders.length) return nearest(menders).id;
      if (turret.type === "cannon") {
        let best = candidates[0], bestScore = -1;
        for (const e of candidates) {
          let count = 0;
          for (const other of candidates) {
            const dx = e.x - other.x, dy = e.y - other.y;
            if (dx * dx + dy * dy <= 8100) count++;
          }
          const score = count * 100000 - e.remaining;
          if (score > bestScore) { bestScore = score; best = e; }
        }
        return best.id;
      }
      if (turret.type === "bolt") {
        const soft = candidates.filter(e => e.type !== "brute");
        if (soft.length) return nearest(soft).id;
      }
      return nearest(candidates).id;
    }
  };
}
</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks) {
  const TYPES = ["bolt", "cannon", "frost", "lance", "flak"];
  const COST = [50, 90, 70, 120, 80];
  const DAMAGE = [26, 60, 10, 180, 40];
  const PERIOD = [8, 24, 12, 36, 10];
  const RANGE = [300, 260, 240, 360, 320];
  const SPLASH = [0, 90, 0, 0, 70];
  const SLOW = [0, 0, 30, 0, 0];
  const AIR = [1, 0, 1, 0, 1];
  const GROUND = [1, 1, 1, 1, 0];
  const SLOT_XY = [[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],[14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]];
  const ENEMY_TYPES = ["grunt", "runner", "wisp", "brute", "splitter", "mender", "splitling"];
  const BASE_HP = [60, 40, 50, 150, 90, 70, 0];
  const SPEED = [10, 20, 12, 6, 8, 8, 12];
  const BOUNTY = [4, 4, 6, 9, 6, 7, 1];
  const LEAK = [1, 1, 2, 3, 2, 2, 1];
  const FIRST = [1, 2, 3, 4, 6, 8];
  const WEIGHT = [10, 4, 3, 3, 2, 1];
  const HP_SCALE = [1000];
  const GROUND_ROUTE = [[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]];
  const AIR_ROUTE = [[0,6],[21,6],[21,11],[23,11]];
  const recordFrames = maxTicks <= 2500;
  const frames = recordFrames ? [] : null;
  let random = mulberry32(seed);
  let strategy = createStrategy();
  let gold = 250;
  let baseHp = 10;
  let wave = 0;
  let nextId = 1;
  let enemies = [];
  let spawnQueue = [];
  let log = [];
  let fallTick = -1;
  let endTick = maxTicks;
  let slots = SLOT_XY.map((p, slot) => ({ slot, x: p[0] * 100 + 50, y: p[1] * 100 + 50, turret: null }));
  let currentWave = makeWave(1);
  let upcomingWave = [];

  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return (t ^ (t >>> 14)) >>> 0;
    };
  }
  function makeWave(w) {
    const count = 4 + Math.floor(3 * w / 5);
    const result = [];
    let total = 0;
    const available = [];
    for (let i = 0; i < 6; i++) {
      if (FIRST[i] <= w) {
        available.push(i);
        total += WEIGHT[i];
      }
    }
    for (let n = 0; n < count; n++) {
      let r = random() % total;
      let chosen = available[available.length - 1];
      for (const i of available) {
        if (r < WEIGHT[i]) { chosen = i; break; }
        r -= WEIGHT[i];
      }
      result.push(ENEMY_TYPES[chosen]);
    }
    return result;
  }
  function hpScale(w) {
    for (let i = HP_SCALE.length; i < w; i++) HP_SCALE[i] = Math.floor(HP_SCALE[i - 1] * 108 / 100);
    return HP_SCALE[w - 1];
  }
  function position(enemy) {
    const route = enemy.air ? AIR_ROUTE : GROUND_ROUTE;
    let left = enemy.progress;
    for (let i = 0; i < route.length - 1; i++) {
      const a = route[i], b = route[i + 1];
      const len = Math.abs(b[0] - a[0]) * 100 + Math.abs(b[1] - a[1]) * 100;
      if (left <= len) {
        return [a[0] * 100 + 50 + (b[0] === a[0] ? 0 : (b[0] > a[0] ? left : -left)),
          a[1] * 100 + 50 + (b[1] === a[1] ? 0 : (b[1] > a[1] ? left : -left))];
      }
      left -= len;
    }
    const p = route[route.length - 1];
    return [p[0] * 100 + 50, p[1] * 100 + 50];
  }
  function routeLength(air) { return air ? 2800 : 4600; }
  function armorFor(type, w) {
    if (type === 0) return Math.floor(w / 4);
    if (type === 3) return 6 + w;
    return 0;
  }
  function addEnemy(type, w, progress) {
    const air = type === 2 ? 1 : 0;
    const maxHp = type === 6 ? 1 : Math.floor(BASE_HP[type] * hpScale(w) / 1000);
    const e = { id: nextId++, type, wave: w, hp: maxHp, maxHp, progress: progress || 0,
      air, armor: armorFor(type, w), speed: SPEED[type], slow: 0, age: 0, x: 0, y: 0 };
    const p = position(e);
    e.x = p[0]; e.y = p[1];
    enemies.push(e);
    return e;
  }
  function view(e) {
    return { id: e.id, type: ENEMY_TYPES[e.type], hp: e.hp, maxHp: e.maxHp, x: e.x, y: e.y,
      air: e.air, armor: e.armor, speed: e.speed, slowed: e.slow > 0 ? 1 : 0,
      remaining: routeLength(e.air) - e.progress };
  }
  function stateView(tick) {
    return { tick, wave, gold, baseHp,
      slots: slots.map(s => ({ slot: s.slot, x: s.x, y: s.y,
        turret: s.turret ? { type: TYPES[s.turret.type], tier: s.turret.tier, spent: s.turret.spent } : null })),
      enemies: enemies.slice().sort((a,b) => a.id - b.id).map(view), nextWave: upcomingWave.slice() };
  }
  function turretDamage(t) {
    if (t.tier === 1) return DAMAGE[t.type];
    if (t.tier === 2) return Math.floor(DAMAGE[t.type] * 16 / 10);
    return Math.floor(Math.floor(DAMAGE[t.type] * 16 / 10) * 16 / 10);
  }
  function defaultTarget(candidates) {
    let chosen = candidates[0];
    for (let i = 1; i < candidates.length; i++) {
      if (candidates[i].remaining < chosen.remaining) chosen = candidates[i];
    }
    return chosen.id;
  }
  function damageEnemy(e, amount) { e.hp -= amount; }
  function removeDead(frame, firingSlot) {
    const dead = enemies.filter(e => e.hp <= 0).sort((a,b) => a.id - b.id);
    for (const e of dead) {
      gold += BOUNTY[e.type];
      log.push([currentTick, "K", e.id, firingSlot]);
      if (frame) frame.events.push({ kind: "kill", id: e.id, type: e.type, x: e.x, y: e.y, air: e.air, slot: firingSlot });
      if (e.type === 4) {
        const childHp = Math.max(1, Math.floor(e.maxHp / 4));
        for (let n = 0; n < 3; n++) {
          const child = addEnemy(6, e.wave, e.progress);
          child.maxHp = childHp;
          child.hp = childHp;
          if (frame) frame.events.push({ kind: "split", id: child.id, parent: e.id, x: child.x, y: child.y });
        }
      }
    }
    if (dead.length) {
      const ids = new Set(dead.map(e => e.id));
      enemies = enemies.filter(e => !ids.has(e.id));
    }
  }
  function snapshot(tick) {
    return { tick, wave, gold, baseHp,
      slots: slots.map(s => ({ slot: s.slot, turret: s.turret ? { type: s.turret.type, tier: s.turret.tier } : null })),
      enemies: enemies.slice().sort((a,b) => a.id-b.id).map(e => ({ id: e.id, type: e.type, hp: e.hp, maxHp: e.maxHp,
        x: e.x, y: e.y, air: e.air, slow: e.slow, age: e.age, progress: e.progress, wave: e.wave })),
      nextWave: upcomingWave.slice(), events: [] };
  }
  let currentTick = 0;
  if (recordFrames) frames.push(snapshot(0));
  for (currentTick = 0; currentTick < maxTicks; currentTick++) {
    const frame = recordFrames ? frames[currentTick] : null;
    if (currentTick >= 20 && (currentTick - 20) % 40 === 0) {
      wave = Math.floor((currentTick - 20) / 40) + 1;
      gold += Math.min(50, Math.floor(gold * 5 / 100)) + 10 + 2 * wave;
      upcomingWave = makeWave(wave + 1);
      const actions = strategy.plan(stateView(currentTick)) || [];
      for (let i = 0; i < Math.min(32, actions.length); i++) {
        const a = actions[i];
        if (!a) continue;
        const s = slots[a.slot];
        if (!s) continue;
        if (a.op === "build" && !s.turret) {
          const type = TYPES.indexOf(a.type);
          if (type >= 0 && gold >= COST[type]) {
            gold -= COST[type];
            s.turret = { type, tier: 1, spent: COST[type], cooldown: 0 };
            log.push([currentTick, "B", s.slot, type]);
            if (frame) frame.events.push({ kind: "build", slot: s.slot, x: s.x, y: s.y });
          }
        } else if (a.op === "upgrade" && s.turret && s.turret.tier < 3) {
          const cost = COST[s.turret.type] * (s.turret.tier === 1 ? 1 : 2);
          if (gold >= cost) {
            gold -= cost;
            s.turret.spent += cost;
            s.turret.tier++;
            log.push([currentTick, "U", s.slot, s.turret.tier]);
            if (frame) frame.events.push({ kind: "upgrade", slot: s.slot, x: s.x, y: s.y });
          }
        } else if (a.op === "sell" && s.turret) {
          gold += Math.floor(s.turret.spent * 70 / 100);
          log.push([currentTick, "S", s.slot, 0]);
          if (frame) frame.events.push({ kind: "sell", slot: s.slot, x: s.x, y: s.y });
          s.turret = null;
        }
      }
      for (let i = 0; i < currentWave.length; i++) spawnQueue.push({ tick: currentTick + 4 * i, wave, index: i, type: ENEMY_TYPES.indexOf(currentWave[i]) });
      spawnQueue.sort((a, b) => a.tick - b.tick || a.wave - b.wave || a.index - b.index);
      currentWave = upcomingWave;
      if (frame) frame.events.push({ kind: "wave", wave });
    }
    if (spawnQueue.length && spawnQueue[0].tick === currentTick) {
      while (spawnQueue.length && spawnQueue[0].tick === currentTick) {
        const q = spawnQueue.shift();
        addEnemy(q.type, q.wave, 0);
      }
    }
    enemies.sort((a,b) => a.id - b.id);
    let fell = false;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      const speed = e.slow > 0 ? Math.floor(e.speed * 60 / 100) : e.speed;
      e.progress += speed;
      if (e.progress >= routeLength(e.air)) {
        e.progress = routeLength(e.air);
        const p = position(e); e.x = p[0]; e.y = p[1];
        baseHp -= LEAK[e.type];
        log.push([currentTick, "L", e.id, baseHp]);
        if (frame) frame.events.push({ kind: "leak", id: e.id, type: e.type, hp: baseHp });
        enemies.splice(i, 1);
        i--;
        if (baseHp <= 0) {
          fallTick = currentTick;
          endTick = currentTick;
          log.push([currentTick, "F", wave, 0]);
          if (frame) frame.events.push({ kind: "fall", wave });
          fell = true;
          break;
        }
      } else {
        const p = position(e); e.x = p[0]; e.y = p[1];
      }
    }
    if (fell) {
      if (recordFrames) frames.push(snapshot(currentTick));
      break;
    }
    enemies.sort((a,b) => a.id - b.id);
    for (const e of enemies) {
      e.age++;
      if (e.type === 5 && e.age % 20 === 0) {
        let healed = false;
        for (const other of enemies) {
          const dx = other.x - e.x, dy = other.y - e.y;
          if (dx * dx + dy * dy <= 150 * 150) {
            const amount = Math.floor(other.maxHp * 8 / 100);
            const before = other.hp;
            other.hp = Math.min(other.maxHp, other.hp + amount);
            if (other.hp > before) healed = true;
          }
        }
        if (frame) frame.events.push({ kind: "heal", id: e.id, x: e.x, y: e.y, healed });
      }
    }
    for (const s of slots) {
      const t = s.turret;
      if (!t) continue;
      if (t.cooldown > 0) t.cooldown--;
      if (t.cooldown > 0) continue;
      const range = RANGE[t.type] + 30 * (t.tier - 1);
      const candidates = [];
      for (const e of enemies) {
        if ((e.air && !AIR[t.type]) || (!e.air && !GROUND[t.type])) continue;
        const dx = e.x - s.x, dy = e.y - s.y;
        if (dx * dx + dy * dy <= range * range) candidates.push(e);
      }
      if (!candidates.length) continue;
      const candidateViews = candidates.map(view);
      let targetId;
      if (typeof strategy.target === "function") targetId = strategy.target({ slot: s.slot, type: TYPES[t.type], tier: t.tier,
        x: s.x, y: s.y, range }, candidateViews);
      if (!candidates.some(e => e.id === targetId)) targetId = defaultTarget(candidateViews);
      const targetEnemy = candidates.find(e => e.id === targetId);
      const damage = turretDamage(t);
      const hit = [];
      if (SPLASH[t.type] > 0) {
        for (const e of enemies) {
          if ((e.air && !AIR[t.type]) || (!e.air && !GROUND[t.type])) continue;
          const dx = e.x - targetEnemy.x, dy = e.y - targetEnemy.y;
          if (dx * dx + dy * dy <= SPLASH[t.type] * SPLASH[t.type]) hit.push(e);
        }
      } else hit.push(targetEnemy);
      for (const e of hit) {
        damageEnemy(e, t.type === 3 ? damage : Math.max(1, damage - e.armor));
        if (SLOW[t.type]) e.slow = SLOW[t.type];
      }
      t.cooldown = PERIOD[t.type];
      if (frame) frame.events.push({ kind: "shot", slot: s.slot, type: t.type, tier: t.tier, id: targetEnemy.id,

    } else if (playbackState === PLAYING) simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
    if (playbackState === PLAYING) scrubber.value = simTime.toFixed(3);
    if (simTime >= DURATION && playbackState === PLAYING) {
      simTime = DURATION; scrubber.value = DURATION.toFixed(3); playbackState = ENDED; icons(false);
    }
    render(simTime); updateAudio(playbackState, oldTime, simTime);
    requestAnimationFrame(frame);
  }
  fitCamera(); icons(true); countdown.style.display = "block"; countdown.textContent = "3";
  render(0); requestAnimationFrame(frame);
})();
</script>
</body>
