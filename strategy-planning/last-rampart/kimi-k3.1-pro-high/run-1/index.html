<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last Rampart</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

  font-family: inherit;

  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>

<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script id="rampart-strategy">
function createStrategy() {
  const buildOrder = [
    [3, "lance"], [0, "bolt"], [5, "flak"], [6, "frost"],
    [4, "cannon"], [8, "lance"], [10, "flak"], [2, "cannon"],
    [12, "cannon"], [14, "flak"], [1, "frost"], [7, "lance"],
    [9, "lance"], [11, "cannon"], [13, "bolt"], [15, "bolt"]
  ];
  const costs = { bolt: 50, cannon: 90, frost: 70, lance: 120, flak: 80 };
  const upgradeOrder = [3, 8, 5, 10, 4, 12, 7, 9, 2, 11, 14, 6, 0, 1, 13, 15];
  return {
    plan(s) {
      const actions = [];
      let gold = s.gold;
      let missing = 0;
      for (let i = 0; i < buildOrder.length; i++) {
        const slot = buildOrder[i][0];
        const type = buildOrder[i][1];
        if (!s.slots[slot].turret) {
          if (gold < costs[type]) break;
          actions.push({ op: "build", slot, type });
          gold -= costs[type];
          missing++;
        }
      }
      for (let i = 0; i < buildOrder.length; i++) if (!s.slots[buildOrder[i][0]].turret) missing++;
      if (missing > 0) return actions;
      for (let tier = 1; tier < 3; tier++) {
        for (let i = 0; i < upgradeOrder.length; i++) {
          const slot = upgradeOrder[i];
          const t = s.slots[slot].turret;
          if (t && t.tier === tier) {
            const cost = costs[t.type] * tier;
            if (gold >= cost) {
              actions.push({ op: "upgrade", slot });
              gold -= cost;
            }
          }
        }
      }
      return actions;
    },
    target(t, candidates) {
      let best = candidates[0];
      let bestScore = -Infinity;
      for (let i = 0; i < candidates.length; i++) {
        const e = candidates[i];
        let score = 100000 - e.remaining;
        if (e.type === "mender") score += t.type === "frost" ? 10000 : 1000000;
        if (t.type === "bolt" && e.type === "runner") score += 40000;
        if (t.type === "lance") {
          if (e.type === "runner") score += 40000;
        } else if (t.type === "cannon") {
          let crowd = 0;
          for (let j = 0; j < candidates.length; j++) {
            const o = candidates[j];
            const dx = o.x - e.x, dy = o.y - e.y;
            if (!o.air && dx * dx + dy * dy <= 8100) crowd++;
          }
          score += crowd * 200000 - e.armor * 5000;
        } else if (t.type === "frost") {
          score = e.remaining + e.speed * 1000 + (e.slowed ? 0 : 500000);
          if (e.type === "mender") score += 1000000;
        } else if (t.type === "flak") {
          score += e.hp * 2;
        }
        if (score > bestScore) {
          bestScore = score;
          best = e;
        }
      }
      return best.id;
    }
  };
}
</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks, record) {
  const TYPES = ["grunt", "runner", "wisp", "brute", "splitter", "mender", "splitling"];
  const BASE_HP = [60, 40, 50, 150, 90, 70, 0];
  const SPEEDS = [10, 20, 12, 6, 8, 8, 12];
  const BOUNTIES = [4, 4, 6, 9, 6, 7, 1];
  const LEAKS = [1, 1, 2, 3, 2, 2, 1];
  const FIRST = [1, 2, 3, 4, 6, 8];
  const WEIGHTS = [10, 4, 3, 3, 2, 1];
  const TURRET_TYPES = ["bolt", "cannon", "frost", "lance", "flak"];
  const COSTS = [50, 90, 70, 120, 80];
  const DAMAGES = [26, 60, 10, 180, 40];
  const PERIODS = [8, 24, 12, 36, 10];
  const RANGES = [300, 260, 240, 360, 320];
  const SPLASH = [0, 90, 0, 0, 70];
  const SLOWS = [0, 0, 30, 0, 0];
  const AIR = [1, 0, 1, 0, 1];
  const GROUND = [1, 1, 1, 1, 0];
  const PIERCE = [0, 0, 0, 1, 0];
  const SLOT_XY = [[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],[14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]];
  const GROUND_ROUTE = [[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]];
  const AIR_ROUTE = [[0,6],[21,6],[21,11],[23,11]];
  const rng = (function(a) { return function() {
    a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return (t ^ (t >>> 14)) >>> 0;
  }; })(seed);
  const multipliers = [0, 1000];
  function multiplier(w) {
    while (multipliers.length <= w) multipliers.push(Math.floor(multipliers[multipliers.length - 1] * 108 / 100));
    return multipliers[w];
  }
  function generateWave(w) {
    const available = [];
    let total = 0;
    for (let i = 0; i < 6; i++) if (FIRST[i] <= w) {
      available.push(i);
      total += WEIGHTS[i];
    }
    const count = 4 + Math.floor(3 * w / 5);
    const wave = [];
    for (let n = 0; n < count; n++) {
      let r = rng() % total;
      let type = available[0];
      for (let j = 0; j < available.length; j++) {
        type = available[j];
        if (r < WEIGHTS[type]) break;
        r -= WEIGHTS[type];
      }
      wave.push(type);
    }
    return wave;
  }
  function routePosition(air, progress) {
    const route = air ? AIR_ROUTE : GROUND_ROUTE;
    let left = progress;
    for (let i = 0; i < route.length - 1; i++) {
      const a = route[i], b = route[i + 1];
      const length = Math.abs(b[0] - a[0]) + Math.abs(b[1] - a[1]);
      const centi = length * 100;
      if (left <= centi) {
        const horizontal = a[0] !== b[0];
        const sign = horizontal ? Math.sign(b[0] - a[0]) : Math.sign(b[1] - a[1]);
        return horizontal ? [a[0] * 100 + 50 + sign * left, a[1] * 100 + 50] : [a[0] * 100 + 50, a[1] * 100 + 50 + sign * left];
      }
      left -= centi;
    }
    const end = route[route.length - 1];
    return [end[0] * 100 + 50, end[1] * 100 + 50];
  }
  function hpFor(type, wave, splitHp) {
    return type === 6 ? splitHp : Math.floor((type === 6 ? 0 : BASE_HP[type]) * multiplier(wave) / 1000);
  }
  function armorFor(type, wave) {
    return type === 0 ? Math.floor(wave / 4) : type === 3 ? 6 + wave : 0;
  }
  function view(e) {
    const p = routePosition(e.air, e.progress);
    return { id: e.id, type: TYPES[e.type], hp: e.hp, maxHp: e.maxHp, x: p[0], y: p[1], air: e.air,
      armor: armorFor(e.type, e.wave), speed: e.slow > 0 ? Math.floor(SPEEDS[e.type] * 60 / 100) : SPEEDS[e.type], slowed: e.slow, remaining: (e.air ? 2800 : 4600) - e.progress };
  }
  const strategy = createStrategy();
  const slots = SLOT_XY.map(function(p, i) { return { slot: i, x: p[0] * 100 + 50, y: p[1] * 100 + 50, turret: null }; });
  const log = [], frames = [];
  let tickFx = [];
  function emit(fx) { if (record) tickFx.push(fx); }
  function capture(tick) {
    if (!record) return;
    frames[tick] = { tick, wave: currentWave, gold, baseHp,
      slots: slots.map(function(s) { return { slot: s.slot, x: s.x, y: s.y, turret: s.turret ? { type: TURRET_TYPES[s.turret.type], tier: s.turret.tier } : null }; }),
      enemies: enemies.map(view), nextWave: nextWave.map(function(t) { return TYPES[t]; }), fx: tickFx };
  }
  let gold = 250, baseHp = 10, nextId = 1, currentWave = 0;
  let enemies = [], queue = [], nextWave = generateWave(1);
  let fallTick = -1;
  function spawn(type, wave, progress, splitHp) {
    const hp = hpFor(type, wave, splitHp);
    enemies.push({ id: nextId++, type, wave, maxHp: hp, hp, progress: progress || 0, age: 0, slow: 0, air: type === 2 ? 1 : 0 });
  }
  function stateCopy(tick) {
    return { tick, wave: currentWave, gold, baseHp,
      slots: slots.map(function(s) { return { slot: s.slot, x: s.x, y: s.y, turret: s.turret ? { type: TURRET_TYPES[s.turret.type], tier: s.turret.tier, spent: s.turret.spent } : null }; }),
      enemies: enemies.map(view), nextWave: nextWave.map(function(t) { return TYPES[t]; }) };
  }
  function applyPlan(tick) {
    const actions = strategy.plan(stateCopy(tick));
    if (!Array.isArray(actions)) return;
    const count = Math.min(32, actions.length);
    for (let i = 0; i < count; i++) {
      const a = actions[i];
      if (!a || (a.op !== "build" && a.op !== "upgrade" && a.op !== "sell")) continue;
      const slot = a.slot;
      if (!Number.isInteger(slot) || slot < 0 || slot >= 16) continue;
      const s = slots[slot];
      if (a.op === "sell") {
        if (!s.turret) continue;
        gold += Math.floor(s.turret.spent * 70 / 100);
        s.turret = null;
        log.push([tick, "S", slot, 0]);
        emit({ kind: "sell", slot, x: s.x, y: s.y });
      } else if (a.op === "build") {
        const type = TURRET_TYPES.indexOf(a.type);
        if (s.turret || type < 0 || gold < COSTS[type]) continue;
        gold -= COSTS[type];
        s.turret = { type, tier: 1, spent: COSTS[type], cooldown: 0 };
        log.push([tick, "B", slot, type]);
        emit({ kind: "build", slot, x: s.x, y: s.y });
      } else {
        const t = s.turret;
        if (!t || t.tier >= 3) continue;
        const cost = COSTS[t.type] * t.tier;
        if (gold < cost) continue;
        gold -= cost;
        t.spent += cost;
        t.tier++;
        log.push([tick, "U", slot, t.tier]);
        emit({ kind: "upgrade", slot, x: s.x, y: s.y });
      }
    }
  }
  function removeDead(slot) {
    const dead = enemies.filter(function(e) { return e.hp <= 0; }).sort(function(a, b) { return a.id - b.id; });
    if (!dead.length) return;
    for (let i = 0; i < dead.length; i++) {
      const e = dead[i];
      gold += BOUNTIES[e.type];
      log.push([arguments[1], "K", e.id, slot]);
      const kp = routePosition(e.air, e.progress);
      emit({ kind: "kill", id: e.id, type: TYPES[e.type], x: kp[0], y: kp[1], air: e.air });
      if (e.type === 4) for (let n = 0; n < 3; n++) spawn(6, e.wave, e.progress, Math.max(1, Math.floor(e.maxHp / 4)));
    }
    if (dead.length) enemies = enemies.filter(function(e) { return e.hp > 0; });
  }
  for (let tick = 0; tick < maxTicks; tick++) {
    tickFx = [];
    if (tick >= 20 && (tick - 20) % 40 === 0) {
      currentWave = (tick - 20) / 40 + 1;
      gold += Math.min(50, Math.floor(gold * 5 / 100)) + 10 + 2 * currentWave;
      const thisWave = nextWave;
      nextWave = generateWave(currentWave + 1);
      applyPlan(tick);
      for (let i = 0; i < thisWave.length; i++) queue.push({ tick: tick + 4 * i, wave: currentWave, index: i, type: thisWave[i] });
      queue.sort(function(a, b) { return a.tick - b.tick || a.wave - b.wave || a.index - b.index; });
    }
    while (queue.length && queue[0].tick === tick) {
      const q = queue.shift();
      spawn(q.type, q.wave, 0, 0);
    }
    let fell = false;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      const speed = e.slow > 0 ? Math.floor(SPEEDS[e.type] * 60 / 100) : SPEEDS[e.type];
      e.progress += speed;
      const length = e.air ? 2800 : 4600;
      if (e.progress >= length) {
        baseHp -= e.type === 6 ? 1 : LEAKS[e.type];
        log.push([tick, "L", e.id, baseHp]);
        emit({ kind: "leak", id: e.id, x: 2350, y: 1150, hp: baseHp });
        enemies.splice(i, 1);
        i--;
        if (baseHp <= 0) {
          fallTick = tick;
          log.push([tick, "F", currentWave, 0]);
          emit({ kind: "fall", x: 2350, y: 1150 });
          fell = true;
          break;
        }
      }
    }
    if (fell) { capture(tick); break; }
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      e.age++;
      if (e.type === 5 && e.age % 20 === 0) {
        const p = routePosition(e.air, e.progress);
        emit({ kind: "heal", id: e.id, x: p[0], y: p[1] });
        for (let j = 0; j < enemies.length; j++) {
          const o = enemies[j], op = routePosition(o.air, o.progress);
          const dx = op[0] - p[0], dy = op[1] - p[1];
          if (dx * dx + dy * dy <= 22500) o.hp = Math.min(o.maxHp, o.hp + Math.floor(o.maxHp * 8 / 100));
        }
      }
    }
    for (let slot = 0; slot < 16; slot++) {
      const t = slots[slot].turret;
      if (!t) continue;
      if (t.cooldown > 0) t.cooldown--;
      if (t.cooldown > 0) continue;
      const range = RANGES[t.type] + 30 * (t.tier - 1);
      const candidates = [];
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if ((e.air && !AIR[t.type]) || (!e.air && !GROUND[t.type])) continue;
        const p = routePosition(e.air, e.progress);
        const dx = p[0] - slots[slot].x, dy = p[1] - slots[slot].y;
        if (dx * dx + dy * dy <= range * range) candidates.push(e);
      }
      if (!candidates.length) continue;
      let target = candidates[0];
      for (let i = 1; i < candidates.length; i++) {
        const rem = (candidates[i].air ? 2800 : 4600) - candidates[i].progress;
        const bestRem = (target.air ? 2800 : 4600) - target.progress;
        if (rem < bestRem) target = candidates[i];
      }
      if (typeof strategy.target === "function") {
        const cv = candidates.map(view);
        const tv = { slot, type: TURRET_TYPES[t.type], tier: t.tier, x: slots[slot].x, y: slots[slot].y, range };
        const picked = strategy.target(tv, cv);
        for (let i = 0; i < candidates.length; i++) if (cv[i].id === picked) { target = candidates[i]; break; }
      }
      let damage = DAMAGES[t.type];
      if (t.tier >= 2) damage = Math.floor(damage * 16 / 10);
      if (t.tier >= 3) damage = Math.floor(Math.floor(DAMAGES[t.type] * 16 / 10) * 16 / 10);
      const tp = routePosition(target.air, target.progress);
      emit({ kind: "shot", slot, type: TURRET_TYPES[t.type], tier: t.tier, target: target.id,
        x: slots[slot].x, y: slots[slot].y, tx: tp[0], ty: tp[1], air: target.air });
      const hits = [];
      if (SPLASH[t.type] > 0) {
        for (let i = 0; i < enemies.length; i++) {
          const e = enemies[i];
          if ((e.air && !AIR[t.type]) || (!e.air && !GROUND[t.type])) continue;
          const p = routePosition(e.air, e.progress);
          const dx = p[0] - tp[0], dy = p[1] - tp[1];
          if (dx * dx + dy * dy <= SPLASH[t.type] * SPLASH[t.type]) hits.push(e);
        }
      } else hits.push(target);
      for (let i = 0; i < hits.length; i++) {
        const e = hits[i];
        e.hp -= Math.max(1, damage - (PIERCE[t.type] ? 0 : armorFor(e.type, e.wave)));
        if (SLOWS[t.type]) e.slow = SLOWS[t.type];
      }
      t.cooldown = PERIODS[t.type];
      removeDead(slot, tick);
    }
    for (let i = 0; i < enemies.length; i++) if (enemies[i].slow > 0) enemies[i].slow--;
    capture(tick);
  }
  if (record) record(frames);
  const endTick = fallTick >= 0 ? fallTick : maxTicks;
  const score = Math.round((endTick - 20) / 40 * 100) / 100;
  const text = JSON.stringify(log);
  let h = 0x811c9dc5;

  scrubber.addEventListener("input", function () {
    if (playbackState === COUNTDOWN || playbackState === REFIRE_HOLD) hideCountdown();
    simTime = parseFloat(scrubber.value); playbackState = PAUSED; icons(false); stopSounds(); render(simTime); syncAudio();
  });

  render(0); icons(true); countdown.style.display = "block"; countdown.textContent = "3";
  let lastNow = null;
  function frame(now) {
    const rawDt = lastNow === null ? 0 : Math.max(0, (now - lastNow) / 1000), dt = Math.min(rawDt, 0.1); lastNow = now;
    const previous = simTime;
    if (playbackState === COUNTDOWN) {
      countdownElapsed += dt; simTime = 0; scrubber.value = "0";
      if (countdownElapsed >= 3) { hideCountdown(); playbackState = PLAYING; simTime = Math.min(DURATION, dt * playbackSpeed); }
      else { countdown.style.display = "block"; countdown.textContent = countdownElapsed < 1 ? "3" : countdownElapsed < 2 ? "2" : "1"; }
    } else if (playbackState === REFIRE_HOLD) {
      holdElapsed += dt; simTime = 0; scrubber.value = "0";
      if (holdElapsed >= 1) { playbackState = PLAYING; simTime = Math.min(DURATION, dt * playbackSpeed); }
    } else if (playbackState === PLAYING) {
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      if (simTime >= DURATION) { simTime = DURATION; playbackState = ENDED; icons(false); }
    }
    if (playbackState === PLAYING || playbackState === ENDED) scrubber.value = simTime.toFixed(3);
    if (playbackState === PLAYING) playCrossed(previous, simTime);
    syncAudio(); render(simTime); requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
