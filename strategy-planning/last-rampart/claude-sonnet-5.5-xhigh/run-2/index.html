<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last Rampart</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="100" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script id="rampart-strategy">
// Last Rampart strategy.
// A priority-ordered build / upgrade / swap plan (executed step by step as gold allows, never more than
// 32 actions per wave; the plan format also allows flexible build steps and a reactive air rule, which the
// tuned plan below does not use), plus a per-turret-type target scorer:
//   score = w0*splash_value + w1*progress + w2*log(hp) + per-enemy-type bonus + unslowed bonus + kill bonus + leak weight,
// where the weights were tuned offline by simulation (299 training seeds, validated on 600 unseen seeds).
// It is fully self-contained and deterministic (it only reads the state it is given).
function createStrategy() {
  const P = {
    plan: [
    [3,1,1], [13,0,1], [12,0,2], [5,4,1], [15,1,3], [4,1,1],
    [3,1,3], [11,1,1], [0,0,1], [10,0,2], [7,1,1], [8,4,1],
    [6,1,1], [0,0,3], [9,1,1], [3,1,2], [2,0,2], [1,1,3],
    [4,1,2], [11,1,2], [5,4,2], [14,0,1], [2,0,1], [2,0,3],
    [7,1,2], [9,1,2], [8,4,2], [15,1,1], [6,1,2], [12,0,3],
    [6,1,3], [5,4,3], [4,1,3], [0,0,3], [10,0,3], [11,1,3],
    [7,1,3], [9,1,3], [10,0,2], [13,0,3], [2,4,3], [15,1,3],
    [14,4,2], [14,4,3], [15,3,2], [3,4,3], [8,4,3], [1,1,2],
    [4,1,3], [10,1,3], [15,2,1], [7,4,3], [1,2,2], [6,4,3],
    [4,3,3], [14,3,3], [4,2,2], [12,1,3], [13,3,3]
  ],
    tw: [
    [2.259,3.382,0,2.955,-2.201,2.326,0.2,-2.197,-0.101,0.0,0.0,0.0,-0.361],
    [0.999,1.217,-0.039,6.725,-0.203,0.256,0.1,-0.44,0.0,-0.015,0.0,0.0,-0.071],
    [-0.233,-0.196,-2.011,-0.416,0.274,3.159,-5.888,0.713,-0.412,-0.35,0.162,0.061,0.0],
    [0.048,1.235,0.018,-0.277,0.0,2.794,-1.567,2.928,-0.073,0.403,-0.661,0.199,0.237],
    [1.683,1.137,0.0,0.754,0.0,0.617,-0.681,1.625,4.213,-0.836,-1.316,0.288,0.723]
  ],
    dg: [
    [-0.914,0.281,-0.771,-1.745,-0.093,0.21,-0.158,0.062,0.141,-0.373,0.0,-3.445,0.834],
    [-0.393,0.357,1.115,-0.224,0.037,0.138,0.156,0.684,0.141,0.017,0.0,-2.253,1.341],
    [0.404,0.204,0.0,0.367,-1.925,-1.024,0.027,1.36,0.212,0.041,0.0,-0.211,0.017],
    [-0.337,4.529,0.154,0.734,-0.051,0.151,-0.012,0.0,-0.376,-0.281,0.398,-0.04,-0.29],
    [-0.282,-0.319,-0.497,-0.052,0.152,0.114,0.679,0.197,0.386,-0.46,0.0,0.553,0.35]
  ],
    skip: 0, cap: 80, prior: 40
  };
  const NAMES = ['bolt', 'cannon', 'frost', 'lance', 'flak'];
  const COST = [50, 90, 70, 120, 80];
  const DMG = [26, 60, 10, 180, 40];
  const SPL = [0, 90, 0, 0, 70];
  const TIDX = { bolt: 0, cannon: 1, frost: 2, lance: 3, flak: 4 };
  const LEAK = { grunt: 1, runner: 1, wisp: 2, brute: 3, splitter: 2, mender: 2, splitling: 1 };
  const BONUS = { mender: 3, brute: 7, grunt: 8, runner: 9, wisp: 10, splitter: 11, splitling: 12 };
  const done = [];
  let hpNow = 10, seenWave = 0, seenAir = 0, seenAll = 0;

  function tierDmg(t, tier) { let d = DMG[t]; for (let i = 1; i < tier; i++) d = Math.floor(d * 16 / 10); return d; }

  return {
    plan(state) {
      try {
        hpNow = state.baseHp;
        // learn the air share of the revealed wave compositions
        const nextWave = state.nextWave || [];
        const alive = state.enemies || [];
        if (state.wave + 1 > seenWave) {
          seenWave = state.wave + 1;
          for (let i = 0; i < nextWave.length; i++) { seenAll++; if (nextWave[i] === 'wisp') seenAir++; }
        }
        const prior = P.prior == null ? 40 : P.prior;
        const airShare = (seenAir + 0.13 * prior) / (seenAll + prior);
        const acts = [];
        let gold = state.gold;
        const cur = state.slots.map(s => s.turret ? { type: TIDX[s.turret.type], tier: s.turret.tier, spent: s.turret.spent } : null);
        // reactive rule: a burst of air units on the field lets pending flak steps jump the queue
        let airAlive = 0;
        for (let i = 0; i < alive.length; i++) if (alive[i].air) airAlive++;
        const urgent = !!P.air && airAlive >= P.air[0] + P.air[1] * state.wave;
        for (let pass = urgent ? 1 : 0; pass >= 0; pass--) {
          for (let i = 0; i < P.plan.length; i++) {
            if (done[i]) continue;
            const st = P.plan[i];
            const slot = st[0], tier = st[2];
            let type = st[1];
            let c = cur[slot];
            if (type < 0) {                       // follow-up upgrade of whatever stands on the slot
              if (!c) { if (P.skip || pass) continue; break; }
              type = c.type;
            } else if (st.length > 3) {           // flexible build: pick by the observed air share
              if (c) { done[i] = 1; continue; }
              type = airShare >= st[4] ? st[1] : st[3];
            }
            if (pass && type !== 4) continue;
            if (c && c.type === type && c.tier >= tier) { done[i] = 1; continue; }
            let avail = gold;
            let needSell = false;
            if (c && c.type !== type) { avail += Math.floor(c.spent * 70 / 100); needSell = true; }
            let cost = 0;
            let t0 = needSell || !c ? 0 : c.tier;
            if (t0 === 0) { cost += COST[type]; t0 = 1; }
            while (t0 < tier) { cost += t0 === 1 ? COST[type] : 2 * COST[type]; t0++; }
            if (cost > avail) {
              if (P.skip || pass) continue;
              break;
            }
            if (acts.length + (needSell ? 1 : 0) + (c ? 0 : 1) + Math.max(0, tier - (c ? c.tier : 1)) > 32) break;
            if (needSell) { acts.push({ op: 'sell', slot }); gold += Math.floor(c.spent * 70 / 100); c = null; }
            gold -= cost;
            let have = c ? c.tier : 0;
            if (!c) { acts.push({ op: 'build', slot, type: NAMES[type] }); cur[slot] = { type, tier: 1, spent: COST[type] }; have = 1; }
            let spent = cur[slot].spent;
            while (have < tier) { acts.push({ op: 'upgrade', slot }); spent += have === 1 ? COST[type] : 2 * COST[type]; have++; }
            cur[slot] = { type, tier: have, spent };
            done[i] = 1;
          }
        }
        return acts.slice(0, 32);
      } catch (e) { return []; }
    },
    target(turret, cands) {
      try {
        const t = TIDX[turret.type];
        const n = cands.length;
        if (n === 1) return cands[0].id;
        const W0 = P.tw[t], DG = P.dg ? P.dg[t] : null;
        const danger = (10 - hpNow) / 10;
        const W = [];
        for (let i = 0; i < 13; i++) W.push((W0[i] || 0) + (DG ? (DG[i] || 0) * danger : 0));
        const dmg = tierDmg(t, turret.tier);
        const spl = SPL[t], spl2 = spl * spl;
        const pierce = t === 3;
        const lim = Math.min(n, P.cap || 80);
        let best = -1, bestV = -1e18;
        for (let i = 0; i < n; i++) {
          const e = cands[i];
          const eff = pierce ? dmg : Math.max(1, dmg - e.armor);
          let f1;
          if (spl > 0 && i < lim) {
            f1 = 0;
            for (let j = 0; j < lim; j++) {
              const o = cands[j];
              const dx = o.x - e.x, dy = o.y - e.y;
              if (dx * dx + dy * dy <= spl2) f1 += Math.min(o.hp, pierce ? dmg : Math.max(1, dmg - o.armor)) / dmg;
            }
          } else f1 = Math.min(e.hp, eff) / dmg;
          const prog = 1 - e.remaining / (e.air ? 2800 : 4600);
          const v = W[0] * f1 + W[1] * prog + W[2] * Math.log(1 + e.hp) + W[BONUS[e.type]]
            + (e.slowed ? 0 : W[4]) + (eff >= e.hp ? W[5] : 0) + W[6] * LEAK[e.type];
          if (v > bestV) { bestV = v; best = e.id; }
        }
        return best;
      } catch (e) { return -1; }
    }
  };
}
</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks, trace) {
  'use strict';
  // ---- static rule tables (section 2) ----
  var TYPE_NAMES = ['bolt', 'cannon', 'frost', 'lance', 'flak'];
  var T_COST = [50, 90, 70, 120, 80];
  var T_DMG = [26, 60, 10, 180, 40];
  var T_PER = [8, 24, 12, 36, 10];
  var T_RNG = [300, 260, 240, 360, 320];
  var T_SPL = [0, 90, 0, 0, 70];
  var T_SLOW = [0, 0, 30, 0, 0];
  var T_PIERCE = [0, 0, 0, 1, 0];
  var T_GROUND = [1, 1, 1, 1, 0];
  var T_AIR = [1, 0, 1, 0, 1];
  var E_NAMES = ['grunt', 'runner', 'wisp', 'brute', 'splitter', 'mender', 'splitling'];
  var E_HP = [60, 40, 50, 150, 90, 70, 0];
  var E_SPD = [10, 20, 12, 6, 8, 8, 12];
  var E_BOUNTY = [4, 4, 6, 9, 6, 7, 1];
  var E_LEAK = [1, 1, 2, 3, 2, 2, 1];
  var E_AIR = [0, 0, 1, 0, 0, 0, 0];
  var E_FIRST = [1, 2, 3, 4, 6, 8, 0];
  var E_WEIGHT = [10, 4, 3, 3, 2, 1, 0];
  var SLOT_TILES = [[3, 3], [5, 5], [7, 4], [7, 8], [9, 9], [10, 5], [11, 8], [13, 8], [14, 5], [15, 2], [16, 7], [17, 4], [19, 8], [20, 10], [22, 9], [3, 7]];
  var GROUND_PTS = [[0, 2], [6, 2], [6, 10], [12, 10], [12, 3], [18, 3], [18, 11], [23, 11]];
  var AIR_PTS = [[0, 6], [21, 6], [21, 11], [23, 11]];

  function buildRoute(pts) {
    var xs = [], ys = [];
    for (var i = 0; i < pts.length - 1; i++) {
      var ax = pts[i][0] * 100 + 50, ay = pts[i][1] * 100 + 50;
      var bx = pts[i + 1][0] * 100 + 50, by = pts[i + 1][1] * 100 + 50;
      var n = Math.abs(bx - ax) + Math.abs(by - ay);
      var dx = bx > ax ? 1 : bx < ax ? -1 : 0, dy = by > ay ? 1 : by < ay ? -1 : 0;
      for (var k = 0; k < n; k++) { xs.push(ax + dx * k); ys.push(ay + dy * k); }
    }
    var last = pts[pts.length - 1];
    xs.push(last[0] * 100 + 50); ys.push(last[1] * 100 + 50);
    return { xs: xs, ys: ys, len: xs.length - 1 };
  }
  var ROUTES = [buildRoute(GROUND_PTS), buildRoute(AIR_PTS)];

  // tier tables
  var DMG_T = [], RNG_T = [];
  for (var ty = 0; ty < 5; ty++) {
    var d1 = T_DMG[ty], d2 = Math.floor(d1 * 16 / 10), d3 = Math.floor(d2 * 16 / 10);
    DMG_T.push([0, d1, d2, d3]);
    RNG_T.push([0, T_RNG[ty], T_RNG[ty] + 30, T_RNG[ty] + 60]);
  }

  // hp multiplier m(w)
  var MULT = [0, 1000];
  function mult(w) { while (MULT.length <= w) MULT.push(Math.floor(MULT[MULT.length - 1] * 108 / 100)); return MULT[w]; }

  // ---- composition generator ----
  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return (t ^ (t >>> 14)) >>> 0;
    };
  }
  var rng = mulberry32(seed);
  var waves = [null];
  function ensureWave(w) {
    while (waves.length <= w) {
      var wn = waves.length, avail = [], sum = 0;
      for (var t = 0; t < 6; t++) if (E_FIRST[t] <= wn) { avail.push(t); sum += E_WEIGHT[t]; }
      var n = 4 + Math.floor(3 * wn / 5), comp = [];
      for (var i = 0; i < n; i++) {
        var r = rng() % sum;
        for (var j = 0; j < avail.length; j++) {
          if (r < E_WEIGHT[avail[j]]) { comp.push(avail[j]); break; }
          r -= E_WEIGHT[avail[j]];
        }
      }
      waves.push(comp);
    }
  }

  // ---- game state ----
  var baseHp = 10, gold = 250, nextId = 1;
  var enemies = [];            // living enemies, ascending id
  var turrets = new Array(16); // null or {type,tier,spent,cd}
  for (var s0 = 0; s0 < 16; s0++) turrets[s0] = null;
  var spawnQueue = {};         // tick -> [ [type, wave], ... ] in (wave, index) order
  var log = [];
  var strat = createStrategy();
  var fallTick = -1, curWave = 0;

  function armorOf(e) { return e.type === 0 ? Math.floor(e.wave / 4) : e.type === 3 ? 6 + e.wave : 0; }
  function view(e) {
    var r = ROUTES[E_AIR[e.type]];
    return {
      id: e.id, type: E_NAMES[e.type], hp: e.hp, maxHp: e.maxHp,
      x: r.xs[e.progress], y: r.ys[e.progress], air: E_AIR[e.type], armor: armorOf(e),
      speed: e.slow > 0 ? Math.floor(E_SPD[e.type] * 60 / 100) : E_SPD[e.type],
      slowed: e.slow > 0 ? 1 : 0, remaining: r.len - e.progress
    };
  }
  function makeEnemy(type, wave, hp) {
    var e = { id: nextId++, type: type, wave: wave, hp: hp, maxHp: hp, progress: 0, age: 0, slow: 0 };
    if (trace) trace.born[e.id] = tick;
    return e;
  }

  if (trace) {
    trace.frames = []; trace.shots = []; trace.kills = []; trace.leaks = []; trace.heals = [];
    trace.waves = []; trace.routes = ROUTES; trace.born = {};
  }

  function applyActions(acts, tick) {
    if (!Array.isArray(acts)) return;
    var n = Math.min(32, acts.length);
    for (var i = 0; i < n; i++) {
      var a = acts[i];
      if (!a || typeof a !== 'object') continue;
      var slot = a.slot;
      if (typeof slot !== 'number' || slot !== Math.floor(slot) || slot < 0 || slot > 15) continue;
      if (a.op === 'build') {
        var ti = TYPE_NAMES.indexOf(a.type);
        if (ti < 0 || turrets[slot] || gold < T_COST[ti]) continue;
        gold -= T_COST[ti];
        turrets[slot] = { type: ti, tier: 1, spent: T_COST[ti], cd: 0 };
        log.push([tick, 'B', slot, ti]);
      } else if (a.op === 'upgrade') {
        var t = turrets[slot];
        if (!t || t.tier >= 3) continue;
        var cost = t.tier === 1 ? T_COST[t.type] : 2 * T_COST[t.type];
        if (gold < cost) continue;
        gold -= cost; t.spent += cost; t.tier++;
        log.push([tick, 'U', slot, t.tier]);
      } else if (a.op === 'sell') {
        var t2 = turrets[slot];
        if (!t2) continue;
        gold += Math.floor(t2.spent * 70 / 100);
        turrets[slot] = null;
        log.push([tick, 'S', slot, 0]);
      }
    }
  }

  // optional recorder used only by the replay renderer (never affects the rules or the hash)
  function snapshot() {
    var list = [];

// ================================================================= camera framing
function fitCamera() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.fov = 38;
  camera.updateProjectionMatrix();
  const pitch = 55 * Math.PI / 180;
  const dir = new THREE.Vector3(0, Math.sin(pitch), Math.cos(pitch));
  const bottom = -1 + 2 * 104 / h, top = 1 - 2 * 6 / h, side = 0.012;
  const corners = [[-0.5, 0, -0.5], [24.5, 0, -0.5], [24.5, 0, 14.5], [-0.5, 0, 14.5], [23.5, 1.9, 11.5], [4, 1.2, 3]];
  const T = new THREE.Vector3(12, 0, 7), P = new THREE.Vector3(), V = new THREE.Vector3();
  const tanHalf = Math.tan(camera.fov * Math.PI / 360);
  function measure(d) {
    let tz = 7, tx = 12, res = null;
    for (let it = 0; it < 14; it++) {
      T.set(tx, 0, tz);
      P.copy(T).addScaledVector(dir, d);
      camera.position.copy(P); camera.lookAt(T); camera.updateMatrixWorld(true);
      let x0 = 9, x1 = -9, y0 = 9, y1 = -9;
      for (const c of corners) { V.set(c[0], c[1], c[2]).project(camera); x0 = Math.min(x0, V.x); x1 = Math.max(x1, V.x); y0 = Math.min(y0, V.y); y1 = Math.max(y1, V.y); }
      const cy = (y0 + y1) / 2, wantY = (bottom + top) / 2;
      const cx = (x0 + x1) / 2;
      res = { x0: x0, x1: x1, y0: y0, y1: y1 };
      tz -= (cy - wantY) * d * tanHalf / Math.sin(pitch) * 0.9;
      tx += cx * d * tanHalf * camera.aspect * 0.9;
    }
    return res;
  }
  let lo = 8, hi = 90;
  for (let i = 0; i < 26; i++) {
    const mid = (lo + hi) / 2, r = measure(mid);
    const fits = (r.x1 - r.x0) <= 2 * (1 - side) && (r.y1 - r.y0) <= (top - bottom);
    if (fits) hi = mid; else lo = mid;
  }
  measure(hi);
  camState.pos = camera.position.clone();
  camState.target = T.clone();
  camState.dist = hi;
  camState.right = new THREE.Vector3(); camState.up = new THREE.Vector3();
  camera.matrixWorld.extractBasis(camState.right, camState.up, new THREE.Vector3());
  // HUD camera (pixel space)
  hudCamera.left = 0; hudCamera.right = w; hudCamera.top = h; hudCamera.bottom = 0;
  hudCamera.updateProjectionMatrix();
}

let dummy = null, DEB = null, slotAim0 = null;
const fxN = { beam: 0, ring: 0, glow: 0, deb: 0, shell: 0, pip: 0 };
const TORCHES = [[0.35, 1.95, 1.55], [0.35, 1.95, 3.45], [0.3, 1.3, 5.9], [0.3, 1.3, 7.1], [22.75, 1.0, 10.85], [22.75, 1.0, 12.15]];

const DEBRIS_COL = [0x7d8f72, 0xf2cf2e, 0x7ff6ff, 0x4a4c56, 0xa070e0, 0xf0f0f0, 0xb98cff];
const DEBRIS_COL2 = [0x4c5e44, 0xc99a00, 0x35cfe6, 0xe8742c, 0x5f2fa0, 0x58e07a, 0x8a5cd0];

function initDynamic() {
  dummy = new THREE.Object3D();
  const R = visRng(42);
  DEB = [];
  for (let i = 0; i < 128; i++) DEB.push([R() * 2 - 1, 2 + R() * 3.2, R() * 2 - 1, R() * 10 - 5, R() * 10 - 5, 0.05 + R() * 0.07, R()]);
  slotAim0 = [];
  const g = ROUTES[0];
  for (let s = 0; s < 16; s++) {
    const sx = SLOT_TILES[s][0] * 100 + 50, sy = SLOT_TILES[s][1] * 100 + 50;
    let best = 1e18, bi = 0;
    for (let p = 0; p <= g.len; p += 10) { const d = (g.xs[p] - sx) * (g.xs[p] - sx) + (g.ys[p] - sy) * (g.ys[p] - sy); if (d < best) { best = d; bi = p; } }
    slotAim0.push(Math.atan2(g.xs[bi] - sx, g.ys[bi] - sy));
  }
}

function addBeam(x0, y0, z0, x1, y1, z1, w, c) {
  if (fxN.beam >= 700) return;
  const dx = x1 - x0, dy = y1 - y0, dz = z1 - z0, len = Math.sqrt(dx * dx + dy * dy + dz * dz);
  if (len < 1e-4) return;
  dummy.position.set(x0, y0, z0); dummy.quaternion.identity(); dummy.lookAt(x1, y1, z1);
  dummy.scale.set(w, w, len); dummy.updateMatrix();
  W.beams.setMatrixAt(fxN.beam, dummy.matrix); W.beams.instanceColor.setXYZ(fxN.beam, c[0], c[1], c[2]); fxN.beam++;
}
function addRing(x, y, z, radius, c, k) {
  if (fxN.ring >= 700 || radius <= 0.001) return;
  dummy.position.set(x, y, z); dummy.quaternion.identity(); dummy.scale.set(radius, 1, radius); dummy.updateMatrix();
  W.rings.setMatrixAt(fxN.ring, dummy.matrix); W.rings.instanceColor.setXYZ(fxN.ring, c[0] * k, c[1] * k, c[2] * k); fxN.ring++;
}
function addGlow(x, y, z, size, c, k) {
  if (fxN.glow >= 1400 || size <= 0.001) return;
  dummy.position.set(x, y, z); dummy.quaternion.copy(camera.quaternion); dummy.scale.set(size, size, 1); dummy.updateMatrix();
  W.glow.setMatrixAt(fxN.glow, dummy.matrix); W.glow.instanceColor.setXYZ(fxN.glow, c[0] * k, c[1] * k, c[2] * k); fxN.glow++;
}
const _dc = HAS_GL ? new THREE.Color() : null;
function addDebris(x0, y0, z0, vx, vy, vz, size, hex, a, life, sx, sy, rest) {
  if (fxN.deb >= 2600 || a < 0) return;
  if (!rest && a > life) return;
  const gy = size * 0.5, g = 9.8;
  const disc = vy * vy + 2 * g * (y0 - gy);
  const tl = disc > 0 ? (vy + Math.sqrt(disc)) / g : 0;
  const tt = Math.min(a, tl);
  const x = x0 + vx * tt, z = z0 + vz * tt, y = Math.max(gy, y0 + vy * tt - 0.5 * g * tt * tt);
  let s = size;
  if (!rest && a > life * 0.7) s *= 1 - (a - life * 0.7) / (life * 0.3);
  dummy.position.set(x, y, z); dummy.rotation.set(sx * tt, sy * tt, sx * tt * 0.5); dummy.scale.set(s, s * 0.8, s); dummy.updateMatrix();
  W.debris.setMatrixAt(fxN.deb, dummy.matrix);
  _dc.setHex(hex).convertSRGBToLinear();
  W.debris.instanceColor.setXYZ(fxN.deb, _dc.r, _dc.g, _dc.b); fxN.deb++;
}

function snoise(x, seed) { return vnoise(x, 0.37, seed) * 2 - 1; }

function renderAt(t) {
  if (!HAS_GL || !renderer) return;
  t = clamp(t, 0, DURATION);
  const ts = Math.min(t, fallTime);
  const tk = ts * TPS;
  let k = Math.floor(tk), f = tk - k;
  if (k >= lastTick) { k = lastTick; f = 0; }
  const A = frames[k], B = frames[Math.min(k + 1, lastTick)];
  fxN.beam = fxN.ring = fxN.glow = fxN.deb = fxN.shell = fxN.pip = 0;

  // ---- camera shake (trauma^2 * seeded noise of simTime)
  const tr = traumaAt(t), amp = tr * tr * 0.25;
  const ox = amp * snoise(t * 26, 1), oy = amp * snoise(t * 26, 2);
  camera.position.copy(camState.pos).addScaledVector(camState.right, ox).addScaledVector(camState.up, oy);
  camera.updateMatrixWorld(true);
  const qCam = camera.quaternion;
  const rx = camState.right.x, ry = camState.right.y, rz = camState.right.z;

  W.laneTex.offset.x = -ts * 0.7;
  DESAT.value = fallTick >= 0 ? smooth01((t - fallTime) / 1.0) * 0.93 : 0;

  // ---- enemies
  const cnt = [0, 0, 0, 0, 0, 0, 0];
  let nBar = 0, nBlob = 0;
  const na = A.length, nb = B.length;
  let ia = 3, ib = 3;
  while (ia < na || ib < nb) {
    const ida = ia < na ? A[ia] : 1e18, idb = ib < nb ? B[ib] : 1e18;
    let id, type, p, hp, mhp, slow;
    if (ida === idb) {
      id = ida; type = A[ia + 1]; p = lerp(A[ia + 2], B[ib + 2], f); hp = lerp(A[ia + 3], B[ib + 3], f); mhp = A[ia + 4]; slow = f < 0.5 ? A[ia + 5] : B[ib + 5];
      ia += 6; ib += 6;
    } else if (ida < idb) {
      id = ida; type = A[ia + 1]; p = A[ia + 2]; hp = A[ia + 3]; mhp = A[ia + 4]; slow = A[ia + 5];
      ia += 6;
    } else {
      id = idb; type = B[ib + 1]; p = B[ib + 2]; hp = B[ib + 3]; mhp = B[ib + 4]; slow = B[ib + 5];
      ib += 6;
      if (type === 6) continue;          // splitlings appear when their splitter pops
      p = p * f;
    }
    const air = type === 2, route = ROUTES[air ? 1 : 0];
    const head = routeHead(route, air ? 1 : 0, p);
    let x = routeX(route, p), z = routeZ(route, p);
    const jit = (hash01(id) - 0.5) * (type === 3 ? 0.3 : 0.34);
    x += Math.cos(head) * jit; z -= Math.sin(head) * jit;
    let y = 0;
    if (air) y = 0.8 + 0.06 * Math.sin(ts * 3 + id);
    else y = 0.02 * Math.abs(Math.sin(ts * 9 + id));
    const scale = ENEMY_SCALE[type];
    if (type === 6) {
      const age = ts - (trace.born[id] || 0) / TPS;
      if (age < 0.4) {
        const u = Math.sin(Math.PI * Math.max(0, age) / 0.4), ang = (id % 3) * 2.094 + hash01(id + 5) * 1.2;
        x += Math.cos(ang) * 0.3 * u; z += Math.sin(ang) * 0.3 * u; y += 0.25 * u;
      }
    }
    const m = W.enemy[type];
    const i = cnt[type];
    if (i < m.userData.cap) {
      dummy.position.set(x, y, z); dummy.rotation.set(0, head, 0); dummy.scale.setScalar(scale); dummy.updateMatrix();
      m.setMatrixAt(i, dummy.matrix);
      if (slow) m.instanceColor.setXYZ(i, 0.5, 0.85, 1.9); else m.instanceColor.setXYZ(i, air ? 1.5 : 1, air ? 1.5 : 1, air ? 1.5 : 1);
      cnt[type]++;
    }
    if (air && nBlob < 500) {
      dummy.position.set(x, 0.035, z); dummy.quaternion.identity(); dummy.scale.set(1, 1, 1); dummy.updateMatrix();
      W.blobs.setMatrixAt(nBlob++, dummy.matrix);
      addGlow(x, y, z, 0.95, [0.2, 0.9, 1.0], 0.8 + 0.2 * Math.sin(ts * 7 + id));
    } else if (type === 5) {
      addGlow(x, 0.3, z, 1.5, [0.2, 0.85, 0.4], 0.55);
    }
    // health bar
    if (nBar < 1500) {
      const frac = clamp(hp / Math.max(1, mhp), 0, 1), bw = ENEMY_BAR_W[type] * 1.3;
      const by = y + ENEMY_BAR_Y[type] * ENEMY_SCALE[type] + (air ? 0.05 : 0.04);
      dummy.position.set(x, by, z); dummy.quaternion.copy(qCam); dummy.scale.set(bw + 0.05, 0.11, 1); dummy.updateMatrix();
      W.hpBg.setMatrixAt(nBar, dummy.matrix);
      const fw = Math.max(0.001, bw * frac), shift = -bw / 2 + fw / 2;
      dummy.position.set(x + rx * shift, by + ry * shift, z + rz * shift); dummy.scale.set(fw, 0.075, 1); dummy.updateMatrix();
      W.hpFg.setMatrixAt(nBar, dummy.matrix);
      if (frac > 0.6) W.hpFg.instanceColor.setXYZ(nBar, 0.12, 0.75, 0.2); else if (frac > 0.3) W.hpFg.instanceColor.setXYZ(nBar, 0.9, 0.65, 0.05); else W.hpFg.instanceColor.setXYZ(nBar, 0.9, 0.1, 0.08);
      nBar++;
    }
  }
  for (let ty = 0; ty < 7; ty++) { const m = W.enemy[ty]; m.count = cnt[ty]; m.instanceMatrix.needsUpdate = true; m.instanceColor.needsUpdate = true; }
  W.blobs.count = nBlob; W.blobs.instanceMatrix.needsUpdate = true;
  W.hpBg.count = nBar; W.hpFg.count = nBar;
  W.hpBg.instanceMatrix.needsUpdate = true; W.hpFg.instanceMatrix.needsUpdate = true; W.hpFg.instanceColor.needsUpdate = true;

  // ---- turrets
  const frozen = t >= fallTime;
  for (let s = 0; s < 16; s++) {
    const ty = slotType[k * 16 + s], tier = slotTier[k * 16 + s];
    const sx = SLOT_TILES[s][0] + 0.5, sz = SLOT_TILES[s][1] + 0.5;
    let ghost = -1, ghostA = 0;
    // recent actions on this slot (build/upgrade pop, sell collapse)
    let popA = 9, sellA = 9, sellType = -1;
    for (let kk = Math.max(0, k - 15); kk <= k; kk++) {
      const acts = actsAt[kk]; if (!acts) continue;
      for (let ai = 0; ai < acts.length; ai++) {
        const e = acts[ai]; if (e[2] !== s) continue;
        const a = ts - kk / TPS;
        if (e[1] === 'S') { if (a < sellA) { sellA = a; sellType = slotType[Math.max(0, kk - 1) * 16 + s]; } }
        else if (a < popA) popA = a;
        const cc = e[1] === 'S' ? [0.8, 0.8, 0.85] : e[1] === 'B' ? [1.0, 0.85, 0.35] : [0.55, 1.0, 0.9];
        if (a >= 0 && a < 0.75) {
          if (e[1] === 'S') {
            for (let j = 0; j < 8; j++) { const d = DEB[(s * 13 + j * 5 + kk) & 127]; addDebris(sx, 0.45, sz, d[0] * 1.3, d[1] * 0.4, d[2] * 1.3, d[5] * 2.4, 0x6d6e78, a, 0.75, d[3], d[4], false); }
            addRing(sx, 0.08, sz, lerp(0.3, 0.9, a / 0.75), [0.8, 0.8, 0.85], 1 - a / 0.75);
          } else {
            addRing(sx, 0.08, sz, lerp(0.25, 1.15, smooth01(a / 0.5)), cc, clamp(1 - a / 0.5, 0, 1));
            for (let j = 0; j < 7; j++) {
              const h = hash01(s * 31 + j * 7 + kk), ang = h * 6.283, rad = 0.2 + 0.25 * hash01(j + kk * 3), u = a / 0.75;
              addGlow(sx + Math.cos(ang) * rad, 0.15 + u * 1.3 * (0.7 + 0.5 * hash01(j + 9)), sz + Math.sin(ang) * rad, 0.2 * (1 - u * 0.6), cc, 1.4 * (1 - u));
            }
          }
        }
      }
    }
    for (let tt = 0; tt < 5; tt++) W.turrets[s][tt].root.visible = false;
    let activeType = ty, scaleY = 1, scaleXZ = 1;
    if (ty >= 0) {
      if (popA >= 0 && popA < 0.35) { const u = popA / 0.35; scaleXZ = 0.75 + 0.25 * smooth01(u) + 0.12 * Math.sin(Math.PI * u); scaleY = scaleXZ; }
    } else if (sellType >= 0 && sellA >= 0 && sellA < 0.45) {
      activeType = sellType; scaleY = Math.max(0.03, 1 - sellA / 0.45); scaleXZ = 1 + 0.2 * (sellA / 0.45);
    } else activeType = -1;
    if (activeType >= 0) {
      const obj = W.turrets[s][activeType];
      obj.root.visible = true; obj.root.scale.set(scaleXZ, scaleY, scaleXZ);
      const shot = lastShotOf(s, k);
      let aim = slotAim0[s];
      if (shot && shot[5] === activeType) aim = Math.atan2(shot[3] / 100 - sx, shot[4] / 100 - sz);
      if (activeType === 2) aim = ts * 0.8 + s;
      obj.head.rotation.y = aim;

function updateKeep(t, ts) {

function drawHud(t, ts, k) {

    if (!counts[ty]) continue;
    hq(px, py, ph, ph, CELL.ENEMY0 + ty, 1, 1, 1, 1);
    const w2 = hNum(String(counts[ty]), px + ph * 1.02, py, ph * 0.9, 0.95, 0.95, 0.98, 1, true);
    px += ph * 1.02 + w2 + ph * 0.32;
  }
  // ---- base hp: 10 pips top-right, flash when lost
  const ps = Math.max(0.036 * Hd, 17), gap = ps * 1.14, xr = Wd - m - 10 * gap + (gap - ps);
  const py2 = Hd - m - ps;
  for (let i = 0; i < 10; i++) {
    let lit = i < hp, r, g, b, a = 1, sc = 1;
    if (lit) { if (hp > 6) { r = 0.35; g = 0.95; b = 0.5; } else if (hp > 3) { r = 1.0; g = 0.78; b = 0.25; } else { r = 1.0; g = 0.3; b = 0.28; } }
    else { r = 0.2; g = 0.22; b = 0.28; a = 0.85; }
    for (let j = 0; j < leakInfo.length; j++) {
      const L = leakInfo[j], aa = t - L.time;
      if (aa >= 0 && aa < 0.7 && i >= L.after && i < L.before) {
        const kf = 1 - aa / 0.7, pulse = 0.5 + 0.5 * Math.sin(aa * 38);
        r = lerp(r, 1.0, kf); g = lerp(g, 0.25 + 0.6 * pulse, kf); b = lerp(b, 0.25 + 0.6 * pulse, kf); sc = 1 + 0.55 * kf; a = 1;
      }
    }
    const sz = ps * sc;
    hq(xr + i * gap - (sz - ps) / 2, py2 - (sz - ps) / 2, sz, sz, CELL.PIP, r, g, b, a);
  }
  HUD.geo.setDrawRange(0, HUD.n * 6);
  HUD.geo.attributes.position.needsUpdate = true; HUD.geo.attributes.uv.needsUpdate = true; HUD.geo.attributes.aColor.needsUpdate = true;
}


// ================================================================= synthesized sound (Web Audio, no files, no music)
const AUDIO = {
  ctx: null, master: null, comp: null, noiseBuf: null, live: new Set(), audible: false, wind: null,
  rng: visRng(4242), shotTimes: [], popTimes: [], lastSimT: 0, lastTick: 0
};

function audioInit() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC();
    AUDIO.ctx = ctx;
    AUDIO.master = ctx.createGain(); AUDIO.master.gain.value = 0;
    AUDIO.comp = ctx.createDynamicsCompressor();
    AUDIO.comp.threshold.value = -22; AUDIO.comp.knee.value = 20; AUDIO.comp.ratio.value = 8; AUDIO.comp.attack.value = 0.003; AUDIO.comp.release.value = 0.25;
    AUDIO.master.connect(AUDIO.comp); AUDIO.comp.connect(ctx.destination);
    const n = ctx.sampleRate * 2, buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = AUDIO.rng() * 2 - 1;
    AUDIO.noiseBuf = buf;
    const res = function () { try { const p = ctx.resume(); if (p && p.catch) p.catch(function () {}); } catch (e) {} };
    res();
    const once = function () { res(); };
    window.addEventListener('pointerdown', once); window.addEventListener('keydown', once);
  } catch (e) { AUDIO.ctx = null; }
}

function aTrack(node) { AUDIO.live.add(node); node.onended = function () { AUDIO.live.delete(node); }; }
function aOut(pan, vol) {
  const ctx = AUDIO.ctx, g = ctx.createGain(); g.gain.value = vol;
  if (ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = clamp(pan, -0.9, 0.9); g.connect(p); p.connect(AUDIO.master); }
  else g.connect(AUDIO.master);
  return g;
}
function aOsc(type, f0, f1, t0, dur, vol, pan, atk) {
  const ctx = AUDIO.ctx, o = ctx.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
  const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + (atk || 0.004)); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(aOut(pan, 1));
  o.start(t0); o.stop(t0 + dur + 0.03); aTrack(o);
}
function aNoise(t0, dur, ftype, f0, f1, q, vol, pan) {
  const ctx = AUDIO.ctx, src = ctx.createBufferSource(); src.buffer = AUDIO.noiseBuf;
  const bq = ctx.createBiquadFilter(); bq.type = ftype; bq.Q.value = q;
  bq.frequency.setValueAtTime(f0, t0); bq.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(bq); bq.connect(g); g.connect(aOut(pan, 1));
  src.start(t0, AUDIO.rng() * 1.5); src.stop(t0 + dur + 0.03); aTrack(src);
}
function aPan(xTiles) { return clamp(xTiles / 24 * 2 - 1, -1, 1) * 0.85; }

function playShot(type, pan) {
  const t = AUDIO.ctx.currentTime + 0.004, v = 1 + (AUDIO.rng() - 0.5) * 0.14;
  if (type === 0) { aOsc('square', 1500 * v, 700 * v, t, 0.07, 0.035, pan); aNoise(t, 0.04, 'highpass', 3200, 3200, 0.7, 0.04, pan); }
  else if (type === 1) { aOsc('sine', 150 * v, 42, t, 0.24, 0.2, pan, 0.006); aNoise(t, 0.2, 'lowpass', 1100, 180, 0.7, 0.14, pan); }
  else if (type === 2) { aNoise(t, 0.13, 'bandpass', 4200, 1900, 3, 0.07, pan); aOsc('sine', 2600 * v, 1900, t, 0.09, 0.03, pan, 0.01); }
  else if (type === 3) { aOsc('sawtooth', 1100 * v, 150, t, 0.24, 0.065, pan); aNoise(t, 0.2, 'bandpass', 2600, 380, 1.6, 0.08, pan); }
  else { aNoise(t, 0.11, 'bandpass', 1300 * v, 600, 1.1, 0.1, pan); aOsc('triangle', 520 * v, 220, t, 0.1, 0.05, pan); }
}
function playPop(pan) {
  const t = AUDIO.ctx.currentTime + 0.004, v = 1 + (AUDIO.rng() - 0.5) * 0.3;
  aOsc('sine', 520 * v, 230, t, 0.08, 0.06, pan, 0.005); aNoise(t, 0.04, 'lowpass', 1800, 600, 0.6, 0.03, pan);
}
function playHorn() {
  const ctx = AUDIO.ctx, t = ctx.currentTime + 0.004, dur = 0.75;
  [[1, 'sawtooth', 0.05], [1.5, 'sawtooth', 0.03], [0.5, 'square', 0.03]].forEach(function (p) {
    const o = ctx.createOscillator(); o.type = p[1];
    o.frequency.setValueAtTime(130 * p[0], t); o.frequency.linearRampToValueAtTime(196 * p[0], t + dur * 0.8);
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(500, t); f.frequency.linearRampToValueAtTime(1500, t + dur * 0.7); f.Q.value = 1.2;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(p[2], t + 0.1); g.gain.setValueAtTime(p[2], t + dur * 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f); f.connect(g); g.connect(aOut(0, 1)); o.start(t); o.stop(t + dur + 0.03); aTrack(o);
  });
}
function playLeak() {
  const t = AUDIO.ctx.currentTime + 0.004;
  aNoise(t, 0.16, 'highpass', 900, 900, 0.8, 0.16, 0.55); aOsc('sine', 120, 50, t, 0.16, 0.12, 0.55, 0.003);
  aOsc('square', 740, 740, t + 0.05, 0.12, 0.045, 0.55); aOsc('square', 554, 554, t + 0.2, 0.14, 0.045, 0.55);
}
function playFall() {
  const t = AUDIO.ctx.currentTime + 0.004;
  aOsc('sine', 95, 22, t, 2.0, 0.34, 0.5, 0.01); aOsc('sawtooth', 58, 28, t, 1.5, 0.1, 0.5, 0.02);
  aNoise(t, 2.4, 'lowpass', 500, 60, 0.8, 0.3, 0.5); aNoise(t, 0.4, 'highpass', 700, 700, 0.7, 0.2, 0.5);
}
function startWind() {
  if (AUDIO.wind) return;
  const ctx = AUDIO.ctx, src = ctx.createBufferSource(); src.buffer = AUDIO.noiseBuf; src.loop = true;
  const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 340; f.Q.value = 0.9;
  const g = ctx.createGain(); g.gain.value = 0.07;
  const lfo = ctx.createOscillator(); lfo.frequency.value = 0.17; const lg = ctx.createGain(); lg.gain.value = 0.04; lfo.connect(lg); lg.connect(g.gain);
  const lf2 = ctx.createOscillator(); lf2.frequency.value = 0.11; const lg2 = ctx.createGain(); lg2.gain.value = 120; lf2.connect(lg2); lg2.connect(f.frequency);
  src.connect(f); f.connect(g); g.connect(aOut(0, 1));
  src.start(0, 0.3); lfo.start(); lf2.start();
  AUDIO.wind = [src, lfo, lf2];
}
function stopWind(when) { if (!AUDIO.wind) return; AUDIO.wind.forEach(function (n) { try { n.stop(when); } catch (e) {} }); AUDIO.wind = null; }

function audioSetAudible(on) {
  const ctx = AUDIO.ctx; if (!ctx || on === AUDIO.audible) return;
  AUDIO.audible = on;
  const g = AUDIO.master.gain, now = ctx.currentTime;
  g.cancelScheduledValues(now); g.setValueAtTime(g.value, now);
  if (on) g.linearRampToValueAtTime(0.6, now + 0.03);
  else {
    g.linearRampToValueAtTime(0, now + 0.04);
    AUDIO.live.forEach(function (n) { try { n.stop(now + 0.045); } catch (e) {} });
    AUDIO.live.clear(); stopWind(now + 0.045);
  }
}
const SHOT_RANK = { 3: 0, 1: 1, 4: 2, 0: 3, 2: 4 };
function rateOk(list, now, limit) {
  while (list.length && list[0] < now - 1.0) list.shift();
  if (list.length >= limit) return false;
  list.push(now); return true;
}
// called every frame; plays one-shots only when forward playback carries simTime across an event tick
function audioFrame(playing, simT) {
  const ctx = AUDIO.ctx; if (!ctx) return;
  audioSetAudible(playing);
  const cur = Math.min(lastTick, Math.floor(Math.min(simT, fallTime) * TPS));
  const fwd = simT >= AUDIO.lastSimT && simT - AUDIO.lastSimT < 0.4;
  if (playing && fwd && ctx.state === 'running') {
    const now = ctx.currentTime, shots = [];
    for (let k = AUDIO.lastTick + 1; k <= cur; k++) {
      const ws = waveStartAt[k]; if (ws) playHorn();
      const lk = leaksAt[k]; if (lk) for (let i = 0; i < lk.length; i++) playLeak();
      const sh = shotsAt[k]; if (sh) for (let i = 0; i < sh.length; i++) shots.push(sh[i]);
      const kl = killsAt[k]; if (kl) for (let i = 0; i < kl.length; i++) if (rateOk(AUDIO.popTimes, now, 14)) playPop(aPan(kl[i][3] / 100));
      if (k === fallTick) playFall();
    }
    shots.sort(function (a, b) { return SHOT_RANK[a[5]] - SHOT_RANK[b[5]]; });
    for (let i = 0; i < shots.length; i++) if (rateOk(AUDIO.shotTimes, now, 12)) playShot(shots[i][5], aPan(SLOT_TILES[shots[i][1]][0] + 0.5));
    if (fallTick >= 0 && simT >= fallTime + 1.8) startWind();
  }
  AUDIO.lastSimT = simT; AUDIO.lastTick = cur;
}


// ================================================================= playback shell (state machine) and boot
const elCountdown = document.getElementById('countdown');
const elToggle = document.getElementById('btn-toggle');
const elPause = document.getElementById('icon-pause');
const elPlay = document.getElementById('icon-play');
const elScrub = document.getElementById('scrubber');
const elRefire = document.getElementById('btn-refire');
const pills = Array.prototype.slice.call(document.querySelectorAll('.speed-pill'));

let state = 'COUNTDOWN';          // COUNTDOWN | PLAYING | PAUSED | REFIRE_HOLD | ENDED
let simTime = 0;
let playbackSpeed = 1.0;
let countdownElapsed = 0, holdElapsed = 0, lastNow = null;

function showCountdown(txt) { elCountdown.style.display = 'block'; elCountdown.textContent = txt; }
function hideCountdown() { elCountdown.style.display = 'none'; elCountdown.textContent = ''; }
function setToggleUI(showPause) {
  elPause.style.display = showPause ? 'inline' : 'none';
  elPlay.style.display = showPause ? 'none' : 'inline';
  elToggle.setAttribute('aria-label', showPause ? 'Pause' : 'Play');
}
function setScrub(v) { elScrub.value = v === 0 ? '0' : v.toFixed(3); }
function toPlaying() { state = 'PLAYING'; setToggleUI(true); }
function toPaused() { state = 'PAUSED'; setToggleUI(false); }

function onFrame(now) {
  const raw = lastNow === null ? 0 : (now - lastNow) / 1000;
  lastNow = now;
  const dt = Math.min(Math.max(raw, 0), 0.1);
  if (state === 'COUNTDOWN') {
    countdownElapsed += dt;
    if (countdownElapsed >= 3.0) { hideCountdown(); simTime = 0; setScrub(0); toPlaying(); }
    else showCountdown(String(3 - Math.floor(countdownElapsed)));
  } else if (state === 'REFIRE_HOLD') {
    holdElapsed += dt;
    if (holdElapsed >= 1.0) toPlaying();
  } else if (state === 'PLAYING') {
    simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
    setScrub(simTime);
    if (simTime >= DURATION) { simTime = DURATION; elScrub.value = DURATION.toFixed(3); state = 'ENDED'; setToggleUI(false); }
  }
  try { renderAt(simTime); } catch (err) { console.error(err); }
  audioFrame(state === 'PLAYING', simTime);
  requestAnimationFrame(onFrame);
}

elToggle.addEventListener('click', function () {
  if (state === 'PLAYING') toPaused();
  else if (state === 'COUNTDOWN' || state === 'REFIRE_HOLD') { hideCountdown(); simTime = 0; setScrub(0); toPaused(); }
  else if (state === 'PAUSED') toPlaying();
  else if (state === 'ENDED') { hideCountdown(); simTime = 0; setScrub(0); toPlaying(); }
});
pills.forEach(function (p) {
  p.addEventListener('click', function () {
    playbackSpeed = parseFloat(p.getAttribute('data-speed'));
    pills.forEach(function (q) {
      const on = q === p;
      q.classList.toggle('is-active', on);
      q.setAttribute('aria-checked', on ? 'true' : 'false');
    });
  });
});
elScrub.addEventListener('input', function () {
  hideCountdown();
  simTime = clamp(parseFloat(elScrub.value) || 0, 0, DURATION);
  toPaused();
  try { renderAt(simTime); } catch (err) { console.error(err); }
});
elRefire.addEventListener('click', function () {
  hideCountdown();
  simTime = 0; setScrub(0);
  holdElapsed = 0; state = 'REFIRE_HOLD'; setToggleUI(true);
  try { renderAt(0); } catch (err) { console.error(err); }
});
function onResize() {
  if (!HAS_GL || !renderer) return;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  fitCamera();
  renderAt(simTime);
}
window.addEventListener('resize', onResize);

// ---------------------------------------------------------------- self report
window.BENCH_REPORT = {
  selfCheck: { vectorA: SELF.vectorA, vectorB: SELF.vectorB },
  strategy: {"summary": "Priority-ordered build/upgrade/swap plan (cannon-heavy, with late swaps to flak and lance and a few frost builds) plus per-turret target scoring (splash-density for cannon/flak, mender and brute priority, urgency, kill bonus), tuned offline by hill-climbing in the simulator on 299 seeds (1-300 without 42). Mean waves held on 600 never-used seeds (400-999): 46.64, worst 40.2.", "seedsTested": 600, "meanScoreOnTestedSeeds": 46.64},
  seed42: { score: simResult.score, fallTick: simResult.fallTick },
  systems: { board: 'full', enemiesAndTurrets: 'full', combatVisuals: 'full', fall: 'full', hud: 'full', audio: 'full' },
  simplifications: [
    'Enemy and turret models are low-poly procedural meshes kept readable at quarter size rather than detailed.',
    'Keep damage shows one knocked-off wall chunk per leak, a lowering/leaning tower and a red flash; no separate crack decals.',
    'HUD pips for base hp are plain gem discs; there are no backing plates behind HUD digits (drop shadows only).'
  ],
  testedInBrowser: true,
  measuredFps: 60
};

// ---------------------------------------------------------------- boot
(function boot() {
  audioInit();
  if (HAS_GL) {
    try {
      buildWorld();
      buildHud();
      initDynamic();
      fitCamera();
      renderAt(0);                  // initial resting scene, simTime = 0
    } catch (err) { console.error(err); }
  }
  requestAnimationFrame(onFrame);
})();

</script>
