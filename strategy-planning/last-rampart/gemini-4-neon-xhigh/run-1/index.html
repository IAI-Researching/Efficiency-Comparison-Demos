    applyDesat(new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false })),
    MAX_RINGS
  );
  ringPool.frustumCulled = false;
  ringPool.count = 0;
  {
    const c = new THREE.Color(0xffffff);
    for (let i = 0; i < MAX_RINGS; i++) ringPool.setColorAt(i, c);
    ringPool.instanceColor.needsUpdate = true;
  }
  scene.add(ringPool);

  const MAX_SHELLS = 96;
  const shellPool = new THREE.InstancedMesh(
    new THREE.SphereGeometry(1, 8, 8),
    applyDesat(new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false })),
    MAX_SHELLS
  );
  shellPool.frustumCulled = false;
  shellPool.count = 0;
  {
    const c = new THREE.Color(0xffffff);
    for (let i = 0; i < MAX_SHELLS; i++) shellPool.setColorAt(i, c);
    shellPool.instanceColor.needsUpdate = true;
  }
  scene.add(shellPool);

  const MAX_DEBRIS = 480;
  const debrisPool = new THREE.InstancedMesh(
    new THREE.BoxGeometry(1, 1, 1),
    applyDesat(new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.55, metalness: 0.25 })),
    MAX_DEBRIS
  );
  debrisPool.frustumCulled = false;
  debrisPool.count = 0;
  {
    const c = new THREE.Color(0xffffff);
    for (let i = 0; i < MAX_DEBRIS; i++) debrisPool.setColorAt(i, c);
    debrisPool.instanceColor.needsUpdate = true;
  }
  scene.add(debrisPool);

  // =========================================================================
  // 8. WORDLESS WORLD-ANCHORED WEBGL HUD (ORTHOGRAPHIC PASS INSIDE #stage)
  // =========================================================================
  const hudScene = new THREE.Scene();
  const hudCamera = new THREE.OrthographicCamera(0, window.innerWidth, window.innerHeight, 0, -10, 10);

  // Build crisp detached in-memory digit glyph atlas (0-9) + geometric icon atlas
  function makeDigitAtlas() {
    const c = document.createElement('canvas');
    c.width = 640;
    c.height = 96;
    const ctx = c.getContext('2d');
    ctx.clearRect(0, 0, 640, 96);
    ctx.font = '800 72px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let d = 0; d < 10; d++) {
      const cx = d * 64 + 32;
      ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
      ctx.fillText(String(d), cx + 2, 52);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(String(d), cx, 49);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  function makeHudIconsAtlas() {
    // 8 icons in a 512x64 horizontal strip (64x64 each):
    // 0: Wave crossed blades, 1: Gold coin,
    // 2: grunt, 3: runner, 4: wisp, 5: brute, 6: splitter, 7: mender
    const c = document.createElement('canvas');
    c.width = 512;
    c.height = 64;
    const ctx = c.getContext('2d');
    ctx.clearRect(0, 0, 512, 64);

    // 0: Crossed blades (wave icon)
    ctx.save();
    ctx.translate(32, 32);
    for (let s = -1; s <= 1; s += 2) {
      ctx.save();
      ctx.rotate(s * 0.72);
      ctx.fillStyle = '#d8e4f5';
      ctx.beginPath();
      ctx.moveTo(0, -24);
      ctx.lineTo(5, -14);
      ctx.lineTo(4, 12);
      ctx.lineTo(-4, 12);
      ctx.lineTo(-5, -14);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#f2b84b';
      ctx.fillRect(-10, 10, 20, 4);
      ctx.fillStyle = '#8a6232';
      ctx.fillRect(-3, 14, 6, 9);
      ctx.restore();
    }
    ctx.restore();

    // 1: Gold coin
    ctx.save();
    ctx.translate(96, 32);
    ctx.fillStyle = '#f5be3b';
    ctx.beginPath();
    ctx.arc(0, 0, 22, 0, Math.PI * 2);
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#ffdf7a';
    ctx.stroke();
    ctx.fillStyle = '#b87d14';
    ctx.beginPath();
    ctx.moveTo(0, -11);
    ctx.lineTo(8, 0);
    ctx.lineTo(0, 11);
    ctx.lineTo(-8, 0);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // 2: Grunt icon (grey-green square helm)
    ctx.save();
    ctx.translate(160, 32);
    ctx.fillStyle = '#6e8b6a';
    ctx.fillRect(-17, -14, 34, 30);
    ctx.fillStyle = '#3b4d3a';
    ctx.fillRect(-19, -20, 38, 10);
    ctx.restore();

    // 3: Runner icon (yellow dart chevron)
    ctx.save();
    ctx.translate(224, 32);
    ctx.fillStyle = '#f7d23b';
    ctx.beginPath();
    ctx.moveTo(22, 0);
    ctx.lineTo(-16, -18);
    ctx.lineTo(-8, 0);
    ctx.lineTo(-16, 18);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // 4: Wisp icon (glowing cyan diamond)
    ctx.save();
    ctx.translate(288, 32);
    ctx.fillStyle = 'rgba(62, 242, 255, 0.35)';
    ctx.beginPath();
    ctx.arc(0, 0, 23, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#48f5ff';
    ctx.beginPath();
    ctx.moveTo(0, -19);
    ctx.lineTo(16, 0);
    ctx.lineTo(0, 19);
    ctx.lineTo(-16, 0);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // 5: Brute icon (dark iron octagon + orange plates)
    ctx.save();
    ctx.translate(352, 32);
    ctx.fillStyle = '#383f4d';
    ctx.fillRect(-20, -20, 40, 40);
    ctx.fillStyle = '#f2741f';
    ctx.fillRect(-22, -14, 44, 10);
    ctx.fillRect(-14, 6, 28, 8);
    ctx.restore();

    // 6: Splitter icon (purple triple-orb cluster)
    ctx.save();
    ctx.translate(416, 32);
    ctx.fillStyle = '#9a4dff';
    ctx.beginPath(); ctx.arc(0, -9, 11, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(-11, 8, 10, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(11, 8, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e59eff';
    ctx.beginPath(); ctx.arc(0, 1, 6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // 7: Mender icon (white core + emerald halo)
    ctx.save();
    ctx.translate(480, 32);
    ctx.strokeStyle = '#52ff9d';
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#f2f6fa';
    ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    const tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  const digitAtlas = makeDigitAtlas();
  const iconAtlas = makeHudIconsAtlas();

  function makeAtlasQuad(tex, cols, colIdx, tintHex) {
    const geo = new THREE.PlaneGeometry(1, 1);
    const u0 = colIdx / cols;
    const u1 = (colIdx + 1) / cols;
    const uvs = geo.attributes.uv;
    uvs.setXY(0, u0, 1);
    uvs.setXY(1, u1, 1);
    uvs.setXY(2, u0, 0);
    uvs.setXY(3, u1, 0);
    uvs.needsUpdate = true;
    const mat = new THREE.MeshBasicMaterial({
      map: tex,
      color: tintHex !== undefined ? tintHex : 0xffffff,
      transparent: true,
      depthTest: false,
      depthWrite: false
    });
    const m = new THREE.Mesh(geo, mat);
    hudScene.add(m);
    return m;
  }

  function setQuadDigit(mesh, digit) {
    const u0 = digit / 10;
    const u1 = (digit + 1) / 10;
    const uvs = mesh.geometry.attributes.uv;
    uvs.setXY(0, u0, 1);
    uvs.setXY(1, u1, 1);
    uvs.setXY(2, u0, 0);
    uvs.setXY(3, u1, 0);
    uvs.needsUpdate = true;
  }

  // HUD Elements:
  // Wave icon + up to 3 large digits (>= 7% viewport height!)
  const hudWaveIcon = makeAtlasQuad(iconAtlas, 8, 0, 0xffffff);
  const hudWaveDigits = [
    makeAtlasQuad(digitAtlas, 10, 0, 0xffffff),
    makeAtlasQuad(digitAtlas, 10, 0, 0xffffff),
    makeAtlasQuad(digitAtlas, 10, 0, 0xffffff)
  ];

  // Gold icon + up to 5 digits
  const hudGoldIcon = makeAtlasQuad(iconAtlas, 8, 1, 0xffffff);
  const hudGoldDigits = [];
  for (let i = 0; i < 5; i++) hudGoldDigits.push(makeAtlasQuad(digitAtlas, 10, 0, 0xffd966));

  // Next-wave preview: 6 enemy-type icons + 2 digits each
  const hudPreviewIcons = [];
  const hudPreviewDigits = [];
  for (let i = 0; i < 6; i++) {
    hudPreviewIcons.push(makeAtlasQuad(iconAtlas, 8, 2 + i, 0xffffff));
    hudPreviewDigits.push([
      makeAtlasQuad(digitAtlas, 10, 0, 0xe8edf5),
      makeAtlasQuad(digitAtlas, 10, 0, 0xe8edf5)
    ]);
  }

  // Base HP: 10 pips in top-right corner (backing + active fill)
  const hudHpBacks = [];
  const hudHpPips = [];
  const pipShapeGeo = new THREE.PlaneGeometry(1, 1);
  for (let i = 0; i < 10; i++) {
    const bg = new THREE.Mesh(pipShapeGeo, new THREE.MeshBasicMaterial({
      color: 0x1e2433, transparent: true, opacity: 0.72, depthTest: false, depthWrite: false
    }));
    hudScene.add(bg);
    hudHpBacks.push(bg);

    const fg = new THREE.Mesh(pipShapeGeo, new THREE.MeshBasicMaterial({
      color: 0xff4d5a, transparent: true, opacity: 0.95, depthTest: false, depthWrite: false
    }));
    hudScene.add(fg);
    hudHpPips.push(fg);
  }

  function updateHud(simTime, snap) {
    const W = window.innerWidth;
    const H = window.innerHeight;
    hudCamera.left = 0;
    hudCamera.right = W;
    hudCamera.top = H;
    hudCamera.bottom = 0;
    hudCamera.updateProjectionMatrix();

    const padX = Math.max(18, W * 0.018);
    const padY = Math.max(14, H * 0.022);

    // Wave number: at least 7.6% of viewport height
    const waveH = Math.max(48, H * 0.078);
    const waveW = waveH * 0.62;
    const waveIconSz = waveH * 0.72;
    const waveY = H - padY - waveH * 0.5;

    // Subtle closed-form scale pop when a wave starts
    let wavePop = 1.0;
    if (snap.wave > 0) {
      const wStartT = (20 + 40 * (snap.wave - 1)) / TICKS_PER_SEC;
      const dtW = simTime - wStartT;
      if (dtW >= 0 && dtW < 0.25) {
        wavePop = 1.0 + 0.14 * Math.sin((dtW / 0.25) * Math.PI);
      }
    }

    hudWaveIcon.position.set(padX + waveIconSz * 0.5, waveY, 0);
    hudWaveIcon.scale.set(waveIconSz * wavePop, waveIconSz * wavePop, 1);

    const wStr = String(snap.wave);
    let curX = padX + waveIconSz + waveH * 0.14;
    for (let i = 0; i < 3; i++) {
      if (i < wStr.length) {
        const d = wStr.charCodeAt(i) - 48;
        setQuadDigit(hudWaveDigits[i], d);
        hudWaveDigits[i].visible = true;
        hudWaveDigits[i].position.set(curX + waveW * 0.45, waveY, 0);
        hudWaveDigits[i].scale.set(waveW * wavePop, waveH * wavePop, 1);
        curX += waveW * 0.78;
      } else {
        hudWaveDigits[i].visible = false;
      }
    }

    // Gold under wave number
    const goldH = Math.max(26, H * 0.042);
    const goldW = goldH * 0.62;
    const goldIconSz = goldH * 0.76;
    const goldY = waveY - waveH * 0.5 - goldH * 0.62;

    hudGoldIcon.position.set(padX + goldIconSz * 0.5, goldY, 0);
    hudGoldIcon.scale.set(goldIconSz, goldIconSz, 1);

    const gStr = String(snap.gold);
    let gx = padX + goldIconSz + goldH * 0.18;
    for (let i = 0; i < 5; i++) {
      if (i < gStr.length) {
        setQuadDigit(hudGoldDigits[i], gStr.charCodeAt(i) - 48);
        hudGoldDigits[i].visible = true;
        hudGoldDigits[i].position.set(gx + goldW * 0.42, goldY, 0);
        hudGoldDigits[i].scale.set(goldW, goldH, 1);
        gx += goldW * 0.76;
      } else {
        hudGoldDigits[i].visible = false;
      }
    }

    // Next-wave preview under gold: coloured enemy icons + digit counts
    const prevIconSz = Math.max(19, H * 0.030);
    const prevDigH = prevIconSz * 0.92;
    const prevDigW = prevDigH * 0.62;
    const prevY = goldY - goldH * 0.5 - prevIconSz * 0.85;
    let px = padX;
    for (let i = 0; i < 6; i++) {
      const cnt = snap.preview[i];
      if (cnt > 0) {
        hudPreviewIcons[i].visible = true;
        hudPreviewIcons[i].position.set(px + prevIconSz * 0.5, prevY, 0);
        hudPreviewIcons[i].scale.set(prevIconSz, prevIconSz, 1);
        px += prevIconSz + 3;
        const cStr = String(cnt);
        for (let k = 0; k < 2; k++) {
          if (k < cStr.length) {
            setQuadDigit(hudPreviewDigits[i][k], cStr.charCodeAt(k) - 48);
            hudPreviewDigits[i][k].visible = true;
            hudPreviewDigits[i][k].position.set(px + prevDigW * 0.4, prevY, 0);
            hudPreviewDigits[i][k].scale.set(prevDigW, prevDigH, 1);
            px += prevDigW * 0.74;
          } else {
            hudPreviewDigits[i][k].visible = false;
          }
        }
        px += Math.max(8, prevIconSz * 0.42);
      } else {
        hudPreviewIcons[i].visible = false;
        hudPreviewDigits[i][0].visible = false;
        hudPreviewDigits[i][1].visible = false;
      }
    }

    // Base HP: 10 pips in a row in top-right corner, with extinguish flash on leak
    const pipW = Math.max(15, Math.min(28, W * 0.0155));
    const pipH = pipW * 1.15;
    const pipGap = Math.max(5, pipW * 0.34);
    const totalPipW = 10 * pipW + 9 * pipGap;
    const pipStartX = W - padX - totalPipW + pipW * 0.5;
    const pipY = H - padY - pipH * 0.5 - 4;

    for (let i = 0; i < 10; i++) {
      const cx = pipStartX + i * (pipW + pipGap);
      hudHpBacks[i].position.set(cx, pipY, -0.2);
      hudHpBacks[i].scale.set(pipW + 3, pipH + 3, 1);

      const alive = i < snap.baseHp;
      const lossDt = simTime - pipLossTime[i];
      if (alive) {
        hudHpPips[i].visible = true;
        hudHpPips[i].material.color.setHex(snap.baseHp <= 3 ? 0xff3b30 : 0xff5e62);
        hudHpPips[i].material.opacity = 0.95;
        hudHpPips[i].position.set(cx, pipY, 0);
        hudHpPips[i].scale.set(pipW, pipH, 1);
      } else if (lossDt >= 0 && lossDt < 0.38) {
        // Short bright extinguish flash
        const u = 1.0 - lossDt / 0.38;
        hudHpPips[i].visible = true;
        hudHpPips[i].material.color.setHex(0xffffff);
        hudHpPips[i].material.opacity = u;
        const sc = 1.0 + (1.0 - u) * 0.65;
        hudHpPips[i].position.set(cx, pipY, 0);
        hudHpPips[i].scale.set(pipW * sc, pipH * sc, 1);
      } else {
        hudHpPips[i].visible = false;
      }
    }
  }

  // =========================================================================
  // 9. SYNTHESIZED WEB AUDIO SFX ENGINE (SEED 4242, NO MUSIC, NO CLIPPING)
  // =========================================================================
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;
  let masterGain = null;
  let compressor = null;
  let noiseBuf = null;
  const activeAudioNodes = new Set();
  const shotTimesWindow = []; // AudioContext.currentTime timestamps for 12 shots/sec rate limit
  let windNode = null;
  let windGain = null;
  let audioAudible = false;

  function initAudio() {
    if (!AudioCtx || audioCtx) return;
    try {
      audioCtx = new AudioCtx();
      compressor = audioCtx.createDynamicsCompressor();
      compressor.threshold.value = -14;
      compressor.knee.value = 12;
      compressor.ratio.value = 8;
      compressor.attack.value = 0.003;
      compressor.release.value = 0.15;

      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.0001;
      masterGain.connect(compressor);
      compressor.connect(audioCtx.destination);

      // Prebuild 2.0s deterministic noise buffer seeded from audRng (4242)
      const sr = audioCtx.sampleRate;
      noiseBuf = audioCtx.createBuffer(1, sr * 2, sr);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = audRng() * 2 - 1;

      audioCtx.resume().catch(function () {});
    } catch (e) {
      audioCtx = null;
    }
  }
  initAudio();

  function resumeAudioOnGesture() {
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(function () {});
    }
  }
  window.addEventListener('pointerdown', resumeAudioOnGesture, { passive: true });
  window.addEventListener('keydown', resumeAudioOnGesture, { passive: true });

  function makePanOut(boardX) {
    const pan = Math.max(-0.85, Math.min(0.85, (boardX / 24) * 2 - 1));
    if (audioCtx.createStereoPanner) {
      const p = audioCtx.createStereoPanner();
      p.pan.value = pan;
      p.connect(masterGain);
      return p;
    }
    return masterGain;
  }

  function trackNode(node) {
    activeAudioNodes.add(node);
    node.onended = function () { activeAudioNodes.delete(node); };
  }

  function stopAllAudioImmediately() {
    if (!audioCtx || !masterGain) return;
    const now = audioCtx.currentTime;
    masterGain.gain.cancelScheduledValues(now);
    masterGain.gain.setValueAtTime(masterGain.gain.value, now);
    masterGain.gain.linearRampToValueAtTime(0.0001, now + 0.04);
    activeAudioNodes.forEach(function (n) {
      try { n.stop(now + 0.042); } catch (e) {}
    });
    activeAudioNodes.clear();
    if (windNode) {
      try { windNode.stop(now + 0.042); } catch (e) {}
      windNode = null;
      windGain = null;
    }
    audioAudible = false;
  }

  function setAudioAudible(on) {
    if (!audioCtx || !masterGain) return;
    if (on && !audioAudible) {
      if (audioCtx.state === 'suspended') audioCtx.resume().catch(function () {});
      const now = audioCtx.currentTime;
      masterGain.gain.cancelScheduledValues(now);
      masterGain.gain.setValueAtTime(Math.max(0.0001, masterGain.gain.value), now);
      masterGain.gain.linearRampToValueAtTime(0.55, now + 0.03);
      audioAudible = true;
    } else if (!on && audioAudible) {
      stopAllAudioImmediately();
    }
  }

  function ensurePostFallWind(on) {
    if (!audioCtx || !masterGain || !noiseBuf) return;
    const now = audioCtx.currentTime;
    if (on && audioAudible && !windNode) {
      const src = audioCtx.createBufferSource();
      src.buffer = noiseBuf;
      src.loop = true;
      const flt = audioCtx.createBiquadFilter();
      flt.type = 'bandpass';
      flt.frequency.value = 210;
      flt.Q.value = 2.6;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.0001, now);
      g.gain.linearRampToValueAtTime(0.14, now + 0.6);
      src.connect(flt);
      flt.connect(g);
      g.connect(masterGain);
      src.start(now);
      windNode = src;
      windGain = g;
    } else if ((!on || !audioAudible) && windNode) {
      try { windNode.stop(now + 0.04); } catch (e) {}
      windNode = null;
      windGain = null;
    }
  }

  function playShotSound(shot) {
    if (!audioCtx || !audioAudible || audioCtx.state !== 'running') return;
    const now = audioCtx.currentTime;
    const out = makePanOut(shot.sx);
    const det = 0.96 + audRng() * 0.08;

    if (shot.type === 'lance') {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(920 * det, now);
      osc.frequency.exponentialRampToValueAtTime(140 * det, now + 0.11);
      g.gain.setValueAtTime(0.20, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.connect(g);
      g.connect(out);
      trackNode(osc);
      osc.start(now);
      osc.stop(now + 0.13);
    } else if (shot.type === 'cannon') {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(155 * det, now);
      osc.frequency.exponentialRampToValueAtTime(42 * det, now + 0.13);
      g.gain.setValueAtTime(0.28, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      osc.connect(g);
      g.connect(out);
      trackNode(osc);
      osc.start(now);
      osc.stop(now + 0.16);
      if (noiseBuf) {
        const ns = audioCtx.createBufferSource();
        ns.buffer = noiseBuf;
        const flt = audioCtx.createBiquadFilter();
        flt.type = 'lowpass';
        flt.frequency.value = 520;
        const ng = audioCtx.createGain();
        ng.gain.setValueAtTime(0.14, now);
        ng.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
        ns.connect(flt);
        flt.connect(ng);
        ng.connect(out);
        trackNode(ns);
        ns.start(now, audRng() * 1.2, 0.12);
      }
    } else if (shot.type === 'flak') {
      if (noiseBuf) {
        const ns = audioCtx.createBufferSource();
        ns.buffer = noiseBuf;
        const flt = audioCtx.createBiquadFilter();
        flt.type = 'bandpass';
        flt.frequency.value = 1800 * det;
        flt.Q.value = 1.6;
        const ng = audioCtx.createGain();
        ng.gain.setValueAtTime(0.17, now);
        ng.gain.exponentialRampToValueAtTime(0.001, now + 0.085);
        ns.connect(flt);
        flt.connect(ng);
        ng.connect(out);
        trackNode(ns);
        ns.start(now, audRng() * 1.2, 0.09);
      }
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1150 * det, now);
      osc.frequency.exponentialRampToValueAtTime(480 * det, now + 0.06);
      g.gain.setValueAtTime(0.09, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.065);
      osc.connect(g);
      g.connect(out);
      trackNode(osc);
      osc.start(now);
      osc.stop(now + 0.07);
    } else if (shot.type === 'frost') {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1760 * det, now);
      osc.frequency.exponentialRampToValueAtTime(2420 * det, now + 0.09);
      g.gain.setValueAtTime(0.10, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.10);
      osc.connect(g);
      g.connect(out);
      trackNode(osc);
      osc.start(now);
      osc.stop(now + 0.11);
    } else {
      // bolt
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(660 * det, now);
      osc.frequency.exponentialRampToValueAtTime(320 * det, now + 0.048);
      g.gain.setValueAtTime(0.11, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.055);
      osc.connect(g);
      g.connect(out);
      trackNode(osc);
      osc.start(now);
      osc.stop(now + 0.06);
    }
  }

  function playKillSound(x) {
    if (!audioCtx || !audioAudible || audioCtx.state !== 'running') return;
    const now = audioCtx.currentTime;
    const out = makePanOut(x);
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const f0 = 320 + audRng() * 140;
    osc.type = 'sine';
    osc.frequency.setValueAtTime(f0, now);
    osc.frequency.exponentialRampToValueAtTime(f0 * 1.9, now + 0.05);
    g.gain.setValueAtTime(0.08, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.055);
    osc.connect(g);
    g.connect(out);
    trackNode(osc);
    osc.start(now);
    osc.stop(now + 0.06);
  }

  function playWaveHorn() {
    if (!audioCtx || !audioAudible || audioCtx.state !== 'running') return;
    const now = audioCtx.currentTime;
    const out = makePanOut(4);
    const flt = audioCtx.createBiquadFilter();
    flt.type = 'lowpass';
    flt.frequency.setValueAtTime(620, now);
    flt.frequency.linearRampToValueAtTime(980, now + 0.35);
    flt.connect(out);

    const freqs = [146.8, 220.0];
    for (let i = 0; i < 2; i++) {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(freqs[i] * 0.92, now);
      osc.frequency.linearRampToValueAtTime(freqs[i], now + 0.16);
      g.gain.setValueAtTime(0.001, now);
      g.gain.linearRampToValueAtTime(i === 0 ? 0.11 : 0.075, now + 0.09);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.44);
      osc.connect(g);
      g.connect(flt);
      trackNode(osc);
      osc.start(now);
      osc.stop(now + 0.46);
    }
  }

  function playLeakSound() {
    if (!audioCtx || !audioAudible || audioCtx.state !== 'running') return;
    const now = audioCtx.currentTime;
    const out = makePanOut(23.5);
    // Stone crack
    if (noiseBuf) {
      const ns = audioCtx.createBufferSource();
      ns.buffer = noiseBuf;
      const flt = audioCtx.createBiquadFilter();
      flt.type = 'bandpass';
      flt.frequency.value = 650;
      flt.Q.value = 0.9;
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(0.32, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
      ns.connect(flt);
      flt.connect(ng);
      ng.connect(out);
      trackNode(ns);
      ns.start(now, audRng() * 1.0, 0.17);
    }
    // Alarm tone
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(640, now);
    osc.frequency.setValueAtTime(440, now + 0.11);
    g.gain.setValueAtTime(0.14, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
    osc.connect(g);
    g.connect(out);
    trackNode(osc);
    osc.start(now);
    osc.stop(now + 0.27);
  }

  function playFallSound() {
    if (!audioCtx || !audioAudible || audioCtx.state !== 'running') return;
    const now = audioCtx.currentTime;
    const out = makePanOut(23.5);
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(92, now);
    osc.frequency.exponentialRampToValueAtTime(24, now + 1.1);
    g.gain.setValueAtTime(0.50, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 1.35);
    osc.connect(g);
    g.connect(out);
    trackNode(osc);
    osc.start(now);
    osc.stop(now + 1.4);

    if (noiseBuf) {
      const ns = audioCtx.createBufferSource();
      ns.buffer = noiseBuf;
      const flt = audioCtx.createBiquadFilter();
      flt.type = 'lowpass';
      flt.frequency.setValueAtTime(380, now);
      flt.frequency.exponentialRampToValueAtTime(95, now + 1.5);
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(0.42, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + 1.6);
      ns.connect(flt);
      flt.connect(ng);
      ng.connect(out);
      trackNode(ns);
      ns.start(now, 0, 1.65);
    }
  }

  const SHOT_PRIO = { lance: 5, cannon: 4, flak: 3, frost: 2, bolt: 1 };
  let prevAudioTick = 0;

  function processAudioForTicks(fromTickExcl, toTickIncl) {
    if (!audioCtx || !audioAudible) return;
    if (toTickIncl <= fromTickExcl) return;

    const t0 = (fromTickExcl + 0.0001) / TICKS_PER_SEC;
    const t1 = (toTickIncl + 0.0001) / TICKS_PER_SEC;

    // Post-fall wind
    if (recordedFallTick >= 0 && toTickIncl >= recordedFallTick) {
      ensurePostFallWind(true);
    } else {
      ensurePostFallWind(false);
    }

    // Fall event
    if (recordedFallTick >= 0 && recordedFallTick > fromTickExcl && recordedFallTick <= toTickIncl) {
      playFallSound();
    }

    // Wave starts
    let idx = lowerBoundTime(waveStarts, t0);
    while (idx < waveStarts.length && waveStarts[idx].t <= t1) {
      if (waveStarts[idx].tick > fromTickExcl && waveStarts[idx].tick <= toTickIncl) playWaveHorn();
      idx++;
    }

    // Leaks
    idx = lowerBoundTime(leaksEv, t0);
    while (idx < leaksEv.length && leaksEv[idx].t <= t1) {
      if (leaksEv[idx].tick > fromTickExcl && leaksEv[idx].tick <= toTickIncl) playLeakSound();
      idx++;
    }

    // Kills (rate-limit to max 2 per frame burst so multi-kills sound clean)
    idx = lowerBoundTime(kills, t0);
    let killSounds = 0;
    while (idx < kills.length && kills[idx].t <= t1) {
      if (kills[idx].tick > fromTickExcl && kills[idx].tick <= toTickIncl && killSounds < 2) {
        playKillSound(kills[idx].x);
        killSounds++;
      }
      idx++;
    }

    // Shots (rate-limited to 12 shots per real second, loudest types first!)
    idx = lowerBoundTime(shots, t0);
    const tickShots = [];
    while (idx < shots.length && shots[idx].t <= t1) {
      if (shots[idx].tick > fromTickExcl && shots[idx].tick <= toTickIncl) tickShots.push(shots[idx]);
      idx++;
    }
    if (tickShots.length > 0) {
      tickShots.sort(function (a, b) { return (SHOT_PRIO[b.type] || 0) - (SHOT_PRIO[a.type] || 0); });
      const now = audioCtx.currentTime;
      while (shotTimesWindow.length > 0 && now - shotTimesWindow[0] > 1.0) shotTimesWindow.shift();
      for (let i = 0; i < tickShots.length && shotTimesWindow.length < 12; i++) {
        playShotSound(tickShots[i]);
        shotTimesWindow.push(now);
      }
    }
  }

  // =========================================================================
  // 10. DETERMINISTIC RENDERER AT ANY simTime IN [0, 100]
  // =========================================================================
  const _dummy = new THREE.Object3D();
  const _col = new THREE.Color();
  const _frostTint = new THREE.Color(0x6fd8ff);
  const _vA = new THREE.Vector3();
  const _vB = new THREE.Vector3();
  const _vDir = new THREE.Vector3();
  const _up = new THREE.Vector3(0, 1, 0);
  const _quat = new THREE.Quaternion();

  function renderAtSimTime(simTime) {
    const clampedT = Math.max(0, Math.min(DURATION, simTime));
    const effectiveT = recordedFallTick >= 0 ? Math.min(clampedT, fallTime) : clampedT;
    const rawTick = effectiveT * TICKS_PER_SEC;
    const k0 = Math.min(MAX_TICKS - 2, Math.floor(rawTick));
    const k1 = Math.min(MAX_TICKS - 1, k0 + 1);
    const frac = (recordedFallTick >= 0 && clampedT >= fallTime) ? 0 : (rawTick - k0);

    const s0 = ticksData[k0];
    const s1 = ticksData[k1];

    // 1. Post-fall desaturation (0 -> 1 over 1.0s after fallTime)
    const afterFall = clampedT - fallTime;
    uDesat.value = afterFall > 0 ? Math.min(1.0, afterFall / 1.0) : 0.0;

    // 2. Closed-form trauma camera shake
    const trauma = traumaAt(clampedT);
    const shakeMag = trauma * trauma * 0.25;
    if (shakeMag > 0.0001) {
      const ns = clampedT * 27.3;
      const ox = smoothNoise(noiseTblA, ns) * shakeMag;
      const oz = smoothNoise(noiseTblB, ns + 37.1) * shakeMag;
      const oy = smoothNoise(noiseTblC, ns + 71.9) * shakeMag * 0.45;
      camera.position.set(camBasePos.x + ox, camBasePos.y + oy, camBasePos.z + oz);
      camera.lookAt(camBaseTarget.x + ox * 0.5, camBaseTarget.y, camBaseTarget.z + oz * 0.5);
    } else {
      camera.position.copy(camBasePos);
      camera.lookAt(camBaseTarget);
    }

    // 3. Animate air lane flowing chevron texture purely from effectiveT
    for (let i = 0; i < airLaneTextures.length; i++) {
      airLaneTextures[i].offset.y = (effectiveT * 0.85) % 1;
    }

    // 4. Keep state (red flash on leak, crumbling wall chunks, full collapse on fall)
    let leakFlash = 0;
    for (let i = 0; i < leaksEv.length; i++) {
      const dtL = clampedT - leaksEv[i].t;
      if (dtL >= 0 && dtL < 0.28) {
        const f = 1.0 - dtL / 0.28;
        if (f > leakFlash) leakFlash = f;
      }
    }
    keepWallMat.emissive.setRGB(leakFlash * 0.9, leakFlash * 0.08, leakFlash * 0.05);
    keepRoofMat.emissive.setRGB(leakFlash * 0.7, leakFlash * 0.06, leakFlash * 0.05);

    if (afterFall >= 0) {
      keepStanding.visible = false;
      keepPointLight.intensity = Math.max(0, 3.2 * (1.0 - afterFall / 0.8));

      // Collapse debris (closed-form ballistic with ground bounce/settle)
      const dtF = Math.min(afterFall, 3.5);
      for (let i = 0; i < FALL_DEBRIS_N; i++) {
        const d = fallDebrisData[i];
        const tFall = dtF;
        let py = d.y0 + d.vy * tFall - 5.2 * tFall * tFall;
        let px = 23.5 + d.x0 + d.vx * tFall;
        let pz = 11.5 + d.z0 + d.vz * tFall;
        if (py < d.sz * 0.5) {
          // Rest on ground cleanly at impact point
          const disc = d.vy * d.vy + 4 * 5.2 * Math.max(0, d.y0 - d.sz * 0.5);
          const tHit = (d.vy + Math.sqrt(disc)) / (2 * 5.2);
          px = 23.5 + d.x0 + d.vx * tHit;
          pz = 11.5 + d.z0 + d.vz * tHit;
          py = d.sz * 0.5;
          _dummy.rotation.set(d.rx * tHit, d.ry * tHit, 0);
        } else {
          _dummy.rotation.set(d.rx * tFall, d.ry * tFall, d.rx * 0.5 * tFall);
        }
        _dummy.position.set(px, py, pz);
        _dummy.scale.set(d.sz, d.sz, d.sz);
        _dummy.updateMatrix();
        fallDebrisMesh.setMatrixAt(i, _dummy.matrix);
      }
      fallDebrisMesh.count = FALL_DEBRIS_N;
      fallDebrisMesh.instanceMatrix.needsUpdate = true;

      // Large expanding shockwave ring over 1.2s
      if (afterFall < 1.2) {
        const u = afterFall / 1.2;
        const rad = 0.6 + u * 8.5;
        fallShockRing.visible = true;
        fallShockRing.scale.set(rad, rad, 1);
        fallShockMat.opacity = (1.0 - u) * (1.0 - u) * 0.92;
      } else {
        fallShockRing.visible = false;
      }
    } else {
      keepStanding.visible = true;
      fallDebrisMesh.count = 0;
      fallShockRing.visible = false;
      keepHeart.position.y = 2.28 + Math.sin(effectiveT * 3.2) * 0.08;
      keepHeart.rotation.y = effectiveT * 1.4;
      keepPointLight.intensity = 1.4 + Math.sin(effectiveT * 4.5) * 0.25 + leakFlash * 2.0;

      // Update the 10 wall chunks: intact if i < baseHp, else tumbles away from keep!
      for (let i = 0; i < 10; i++) {
        const ch = keepChunks[i];
        const lossDt = clampedT - pipLossTime[i];
        if (i < s0.baseHp || lossDt < 0) {
          ch.mesh.visible = true;
          ch.mesh.position.set(ch.bx, ch.by, ch.bz);
          ch.mesh.rotation.set(0, 0, 0);
          ch.mesh.scale.set(1, 1, 1);
        } else if (lossDt < 0.75) {
          ch.mesh.visible = true;
          const u = lossDt / 0.75;
          const py = Math.max(0.08, ch.by + ch.vy * lossDt - 6.0 * lossDt * lossDt);
          ch.mesh.position.set(ch.bx + ch.vx * lossDt, py, ch.bz + ch.vz * lossDt);
          ch.mesh.rotation.set(ch.rx * lossDt, ch.rz * lossDt, 0);
          const sc = 1.0 - u * 0.85;
          ch.mesh.scale.set(sc, sc, sc);
        } else {
          ch.mesh.visible = false;
        }
      }
    }

    // 5. Update 16 turret slots (visibility, tier pips/scale, smooth aim rotation, frost crystal spin)
    for (let s = 0; s < 16; s++) {
      const code = s0.slots[s];
      const sv = slotVisuals[s];
      const activeType = code >= 0 ? (code & 7) : -1;
      const tier = code >= 0 ? (code >> 3) : 0;

      // Interpolate aim angle shortest arc
      let a0 = s0.aim[s];
      let a1 = s1.aim[s];
      let da = a1 - a0;
      while (da > Math.PI) da -= Math.PI * 2;
      while (da < -Math.PI) da += Math.PI * 2;
      const aim = a0 + da * frac;

      for (let t = 0; t < 5; t++) {
        const asm = sv.byType[t];
        if (t === activeType) {
          asm.root.visible = true;
          const sc = 0.88 + (tier - 1) * 0.11;
          asm.root.scale.set(sc, sc, sc);
          asm.head.rotation.y = (t === 2) ? effectiveT * 1.5 : aim;
          for (let p = 0; p < 3; p++) asm.pips[p].visible = p < tier;
          asm.tierRing.visible = tier >= 2;
          asm.tierRing.scale.set(1, 1, tier === 3 ? 1.8 : 1.0);
        } else {
          asm.root.visible = false;
        }
      }
    }

    // 6. Update instanced enemies (smoothly interpolated from tick k0 -> k1, facing heading, frost tint, HP bars)
    let cGrunt = 0, cRunner = 0, cWisp = 0, cBrute = 0, cSplit = 0, cMender = 0, cSpling = 0, cHp = 0;
    const camQuat = camera.quaternion;

    for (let i = 0; i < s0.n; i++) {
      const id = s0.eIds[i];
      const typeIdx = s0.eTypes[i];
      let ex = s0.eX[i];
      let ez = s0.eZ[i];
      let ang = s0.eAng[i];
      let hpFrac = s0.eHpFrac[i];
      const slowed = s0.eSlow[i];

      const j1 = s1.eIdMap[id];
      if (j1 !== undefined) {
        ex = ex + (s1.eX[j1] - ex) * frac;
        ez = ez + (s1.eZ[j1] - ez) * frac;
        hpFrac = hpFrac + (s1.eHpFrac[j1] - hpFrac) * frac;
        let da = s1.eAng[j1] - ang;
        while (da > Math.PI) da -= Math.PI * 2;
        while (da < -Math.PI) da += Math.PI * 2;
        ang = ang + da * frac;
      }

      const bob = Math.sin(effectiveT * 10 + id * 1.7) * 0.03;
      const baseHex = ENEMY_COLORS[ENEMY_TYPES[typeIdx]];
      _col.setHex(baseHex);
      if (slowed) _col.lerp(_frostTint, 0.58);

      let barY = 0.78;
      if (typeIdx === 0 && cGrunt < MAX_EN) {
        // Grunt
        _dummy.position.set(ex, 0.27 + Math.abs(bob), ez);
        _dummy.rotation.set(0, ang, 0);
        _dummy.scale.set(1, 1, 1);
        _dummy.updateMatrix();
        gruntPool.setMatrixAt(cGrunt, _dummy.matrix);
        gruntPool.setColorAt(cGrunt, _col);

        _dummy.position.set(ex, 0.56 + Math.abs(bob), ez);
        _dummy.updateMatrix();
        gruntHelmPool.setMatrixAt(cGrunt, _dummy.matrix);
        _col.setHex(0x3b4d3a);
        if (slowed) _col.lerp(_frostTint, 0.55);
        gruntHelmPool.setColorAt(cGrunt, _col);
        cGrunt++;
        barY = 0.84;
      } else if (typeIdx === 1 && cRunner < MAX_EN) {
        // Runner
        _dummy.position.set(ex, 0.22 + Math.abs(bob * 1.4), ez);
        _dummy.rotation.set(0, ang, 0);
        _dummy.scale.set(1, 1, 1);
        _dummy.updateMatrix();
        runnerPool.setMatrixAt(cRunner, _dummy.matrix);
        runnerPool.setColorAt(cRunner, _col);
        cRunner++;
        barY = 0.68;
      } else if (typeIdx === 2 && cWisp < MAX_EN) {
        // Wisp (floats 0.8 tiles above ground with a ground shadow!)
        const wy = 0.80 + Math.sin(effectiveT * 6.0 + id * 2.1) * 0.08;
        _dummy.position.set(ex, wy, ez);
        _dummy.rotation.set(effectiveT * 1.8, effectiveT * 2.6 + id, 0);
        _dummy.scale.set(1, 1, 1);
        _dummy.updateMatrix();
        wispPool.setMatrixAt(cWisp, _dummy.matrix);
        wispPool.setColorAt(cWisp, _col);

        _dummy.position.set(ex, 0.045, ez);
        _dummy.rotation.set(0, 0, 0);
        _dummy.scale.set(1, 1, 1);
        _dummy.updateMatrix();
        wispShadowPool.setMatrixAt(cWisp, _dummy.matrix);
        cWisp++;
        barY = wy + 0.44;
      } else if (typeIdx === 3 && cBrute < MAX_EN) {
        // Brute (dark iron + orange armor plates)
        _dummy.position.set(ex, 0.36 + Math.abs(bob * 0.7), ez);
        _dummy.rotation.set(0, ang, 0);
        _dummy.scale.set(1, 1, 1);
        _dummy.updateMatrix();
        bruteBodyPool.setMatrixAt(cBrute, _dummy.matrix);
        bruteBodyPool.setColorAt(cBrute, _col);

        _dummy.position.set(ex, 0.50 + Math.abs(bob * 0.7), ez);
        _dummy.updateMatrix();
        brutePlatePool.setMatrixAt(cBrute, _dummy.matrix);
        _col.setHex(0xf2741f);
        if (slowed) _col.lerp(_frostTint, 0.45);
        brutePlatePool.setColorAt(cBrute, _col);
        cBrute++;
        barY = 1.02;
      } else if (typeIdx === 4 && cSplit < MAX_EN) {
        // Splitter
        const pulse = 1.0 + Math.sin(effectiveT * 7.5 + id) * 0.07;
        _dummy.position.set(ex, 0.36 + Math.abs(bob), ez);
        _dummy.rotation.set(0, effectiveT * 1.4 + id, 0);
        _dummy.scale.set(pulse, pulse, pulse);
        _dummy.updateMatrix();
        splitterPool.setMatrixAt(cSplit, _dummy.matrix);
        splitterPool.setColorAt(cSplit, _col);
        cSplit++;
        barY = 0.92;
      } else if (typeIdx === 5 && cMender < MAX_EN) {
        // Mender (white + soft green halo)
        _dummy.position.set(ex, 0.36 + Math.abs(bob), ez);
        _dummy.rotation.set(0, ang, 0);
        _dummy.scale.set(1, 1, 1);
        _dummy.updateMatrix();
        menderPool.setMatrixAt(cMender, _dummy.matrix);
        menderPool.setColorAt(cMender, _col);

        _dummy.position.set(ex, 0.44 + Math.sin(effectiveT * 5 + id) * 0.05, ez);
        _dummy.rotation.set(0, effectiveT * 2.2, 0);
        _dummy.scale.set(1, 1, 1);
        _dummy.updateMatrix();
        menderHaloPool.setMatrixAt(cMender, _dummy.matrix);
        cMender++;
        barY = 0.98;
      } else if (typeIdx === 6 && cSpling < MAX_EN) {
        // Splitling
        _dummy.position.set(ex, 0.19 + Math.abs(bob * 1.3), ez);
        _dummy.rotation.set(0, effectiveT * 3.5 + id, 0);
        _dummy.scale.set(1, 1, 1);
        _dummy.updateMatrix();
        splitlingPool.setMatrixAt(cSpling, _dummy.matrix);
        splitlingPool.setColorAt(cSpling, _col);
        cSpling++;
        barY = 0.56;
      }

      // Billboarded mini health bar above every enemy
      if (cHp < MAX_EN) {
        _dummy.position.set(ex, barY, ez);
        _dummy.quaternion.copy(camQuat);
        _dummy.scale.set(1, 1, 1);
        _dummy.updateMatrix();
        hpBgPool.setMatrixAt(cHp, _dummy.matrix);

        const fillW = Math.max(0.02, hpFrac);
        // Shift left inside backing bar in camera-right direction
        const shift = (fillW - 1.0) * 0.29;
        _vDir.set(shift, 0, 0.015).applyQuaternion(camQuat);
        _dummy.position.set(ex + _vDir.x, barY + _vDir.y, ez + _vDir.z);
        _dummy.quaternion.copy(camQuat);
        _dummy.scale.set(fillW, 1, 1);
        _dummy.updateMatrix();
        hpFgPool.setMatrixAt(cHp, _dummy.matrix);

        if (hpFrac > 0.55) _col.setHex(0x45e870);
        else if (hpFrac > 0.25) _col.setHex(0xf7c538);
        else _col.setHex(0xff4242);
        hpFgPool.setColorAt(cHp, _col);
        cHp++;
      }
    }

    gruntPool.count = cGrunt; if (cGrunt) { gruntPool.instanceMatrix.needsUpdate = true; gruntPool.instanceColor.needsUpdate = true; }
    gruntHelmPool.count = cGrunt; if (cGrunt) { gruntHelmPool.instanceMatrix.needsUpdate = true; gruntHelmPool.instanceColor.needsUpdate = true; }
    runnerPool.count = cRunner; if (cRunner) { runnerPool.instanceMatrix.needsUpdate = true; runnerPool.instanceColor.needsUpdate = true; }
    wispPool.count = cWisp; if (cWisp) { wispPool.instanceMatrix.needsUpdate = true; wispPool.instanceColor.needsUpdate = true; }
    wispShadowPool.count = cWisp; if (cWisp) { wispShadowPool.instanceMatrix.needsUpdate = true; }
    bruteBodyPool.count = cBrute; if (cBrute) { bruteBodyPool.instanceMatrix.needsUpdate = true; bruteBodyPool.instanceColor.needsUpdate = true; }
    brutePlatePool.count = cBrute; if (cBrute) { brutePlatePool.instanceMatrix.needsUpdate = true; brutePlatePool.instanceColor.needsUpdate = true; }
    splitterPool.count = cSplit; if (cSplit) { splitterPool.instanceMatrix.needsUpdate = true; splitterPool.instanceColor.needsUpdate = true; }
    menderPool.count = cMender; if (cMender) { menderPool.instanceMatrix.needsUpdate = true; menderPool.instanceColor.needsUpdate = true; }
    menderHaloPool.count = cMender; if (cMender) { menderHaloPool.instanceMatrix.needsUpdate = true; }
    splitlingPool.count = cSpling; if (cSpling) { splitlingPool.instanceMatrix.needsUpdate = true; splitlingPool.instanceColor.needsUpdate = true; }
    hpBgPool.count = cHp; if (cHp) { hpBgPool.instanceMatrix.needsUpdate = true; }
    hpFgPool.count = cHp; if (cHp) { hpFgPool.instanceMatrix.needsUpdate = true; hpFgPool.instanceColor.needsUpdate = true; }

    // 7. Combat effects: shots (<= 0.15s), mender heals, builds/upgrades/sells, kill debris
    let cBeams = 0, cRings = 0, cShells = 0, cDebris = 0;

    function addBeam(x0, y0, z0, x1, y1, z1, radius, hex) {
      if (cBeams >= MAX_BEAMS) return;
      _vA.set(x0, y0, z0);
      _vB.set(x1, y1, z1);
      _vDir.subVectors(_vB, _vA);
      const len = _vDir.length();
      if (len < 0.001) return;
      _dummy.position.addVectors(_vA, _vB).multiplyScalar(0.5);
      _vDir.divideScalar(len);
      _quat.setFromUnitVectors(_up, _vDir);
      _dummy.quaternion.copy(_quat);
      _dummy.scale.set(radius, len, radius);
      _dummy.updateMatrix();
      beamPool.setMatrixAt(cBeams, _dummy.matrix);
      _col.setHex(hex);
      beamPool.setColorAt(cBeams, _col);
      cBeams++;
    }

    function addRing(x, y, z, rad, hex) {
      if (cRings >= MAX_RINGS) return;
      _dummy.position.set(x, y, z);
      _dummy.rotation.set(0, 0, 0);
      _dummy.scale.set(rad, 1, rad);
      _dummy.updateMatrix();
      ringPool.setMatrixAt(cRings, _dummy.matrix);
      _col.setHex(hex);
      ringPool.setColorAt(cRings, _col);
      cRings++;
    }

    function addShell(x, y, z, rad, hex) {
      if (cShells >= MAX_SHELLS) return;
      _dummy.position.set(x, y, z);
      _dummy.rotation.set(0, 0, 0);
      _dummy.scale.set(rad, rad, rad);
      _dummy.updateMatrix();
      shellPool.setMatrixAt(cShells, _dummy.matrix);
      _col.setHex(hex);
      shellPool.setColorAt(cShells, _col);
      cShells++;
    }

    // Active shots within [effectiveT - 0.15, effectiveT]
    let si = lowerBoundTime(shots, effectiveT - 0.155);
    while (si < shots.length && shots[si].t <= effectiveT) {
      const sh = shots[si++];
      const age = effectiveT - sh.t;
      if (age < 0 || age > 0.15) continue;
      const ty = sh.air ? 0.80 : 0.34;
      const sy = sh.type === 'frost' ? 1.15 : 0.65;

      if (sh.type === 'bolt') {
        if (age <= 0.11) {
          const u = 1.0 - age / 0.11;
          addBeam(sh.sx, sy, sh.sz, sh.tx, ty, sh.tz, 0.032 * u + 0.01, 0x7fc4ff);
        }
      } else if (sh.type === 'cannon') {
        // Arcing mortar shell (0..0.08s) + splash radius burst ring (0.05..0.15s)
        if (age < 0.085) {
          const p = age / 0.085;
          const ax = sh.sx + (sh.tx - sh.sx) * p;
          const az = sh.sz + (sh.tz - sh.sz) * p;
          const ay = sy + (ty - sy) * p + Math.sin(p * Math.PI) * 1.15;
          addShell(ax, ay, az, 0.13, 0xffaa44);
        }
        if (age >= 0.05) {
          const p = (age - 0.05) / 0.10;
          const r = Math.max(0.12, sh.splash * (0.28 + 0.72 * p));
          addRing(sh.tx, 0.12, sh.tz, r, p < 0.45 ? 0xffd070 : 0xf07828);
          if (p < 0.55) addShell(sh.tx, 0.25, sh.tz, 0.34 * (1 - p), 0xffb850);
        }
      } else if (sh.type === 'frost') {
        if (age <= 0.14) {
          const u = 1.0 - age / 0.14;
          addBeam(sh.sx, sy, sh.sz, sh.tx, ty, sh.tz, 0.052 * u + 0.015, 0xd4f8ff);
          addShell(sh.tx, ty, sh.tz, 0.24 * u, 0x9ef0ff);
        }
      } else if (sh.type === 'lance') {
        const u = 1.0 - age / 0.15;
        addBeam(sh.sx, sy, sh.sz, sh.tx, ty, sh.tz, 0.095 * u + 0.02, 0xff2d44);
        addShell(sh.sx, sy, sh.sz, 0.28 * u, 0xff8090);
        addShell(sh.tx, ty, sh.tz, 0.38 * u, 0xff4458);
      } else if (sh.type === 'flak') {
        // Fast tracer up to air lane + teal airburst ring of splash radius (0.70 tiles)
        if (age < 0.07) {
          addBeam(sh.sx, sy, sh.sz, sh.tx, ty, sh.tz, 0.032, 0x70ffee);
        }
        const p = age / 0.15;
        const r = Math.max(0.12, sh.splash * (0.3 + 0.7 * p));
        addRing(sh.tx, ty, sh.tz, r, 0x2ef0d8);
        if (p < 0.45) addShell(sh.tx, ty, sh.tz, 0.28 * (1 - p), 0x8affef);
      }
    }

    // Mender heal pulse rings (radius 1.50 tiles over 0.36s)
    let hi = lowerBoundTime(heals, effectiveT - 0.38);
    while (hi < heals.length && heals[hi].t <= effectiveT) {
      const h = heals[hi++];
      const age = effectiveT - h.t;
      if (age >= 0 && age < 0.36) {
        const p = age / 0.36;
        addRing(h.x, 0.14, h.z, 1.5 * (0.2 + 0.8 * p), 0x4dff98);
      }
    }

    // Build / Upgrade / Sell effects (0.42s)
    let ai = lowerBoundTime(actionsEv, effectiveT - 0.44);
    while (ai < actionsEv.length && actionsEv[ai].t <= effectiveT) {
      const ev = actionsEv[ai++];
      const age = effectiveT - ev.t;
      if (age < 0 || age > 0.42) continue;
      const sx = SLOT_COORDS[ev.slot][0] + 0.5;
      const sz = SLOT_COORDS[ev.slot][1] + 0.5;
      const p = age / 0.42;
      if (ev.op === 'B') {
        // Rising sparkle particles
        for (let k = 0; k < 5; k++) {
          const ang = k * 1.256 + ev.slot;
          addShell(sx + Math.cos(ang) * 0.32, 0.25 + p * 1.1 + (k % 2) * 0.15, sz + Math.sin(ang) * 0.32, 0.075 * (1 - p), 0x99ddff);
        }
      } else if (ev.op === 'U') {
        // Ascending gold ring pulse
        addRing(sx, 0.20 + p * 0.9, sz, 0.35 + p * 0.32, 0xffe26a);
      } else if (ev.op === 'S') {
        // Rubble collapse burst
        for (let k = 0; k < 5 && cDebris < MAX_DEBRIS; k++) {
          const ang = k * 1.256 + ev.slot * 0.7;
          const rad = 0.15 + p * 0.55;
          const py = Math.max(0.06, 0.45 + 1.2 * age - 5.5 * age * age);
          _dummy.position.set(sx + Math.cos(ang) * rad, py, sz + Math.sin(ang) * rad);
          _dummy.rotation.set(age * 6, ang, 0);
          const dsz = 0.11 * (1 - p * 0.75);
          _dummy.scale.set(dsz, dsz, dsz);
          _dummy.updateMatrix();
          debrisPool.setMatrixAt(cDebris, _dummy.matrix);
          _col.setHex(0x707887);
          debrisPool.setColorAt(cDebris, _col);
          cDebris++;
        }
      }
    }

    // Kill ballistic debris (closed-form in dt = effectiveT - kill.t over 0.52s) + Splitter pop ring
    let ki = lowerBoundTime(kills, effectiveT - 0.54);
    while (ki < kills.length && kills[ki].t <= effectiveT) {
      const k = kills[ki];
      const age = effectiveT - k.t;
      if (age >= 0 && age <= 0.52) {
        const p = age / 0.52;
        const y0 = k.air ? 0.80 : 0.32;
        if (k.type === 'splitter' && age < 0.22) {
          addRing(k.x, 0.20, k.z, 0.25 + (age / 0.22) * 0.75, 0xc77dff);
        }
        const parts = killParticles[ki];
        const colHex = k.type === 'brute' ? 0xf2741f : ENEMY_COLORS[k.type];
        _col.setHex(colHex);
        for (let m = 0; m < parts.length && cDebris < MAX_DEBRIS; m++) {
          const pt = parts[m];
          const px = k.x + pt.vx * age;
          const pz = k.z + pt.vz * age;
          const py = Math.max(0.05, y0 + pt.vy * age - 6.8 * age * age);
          const sc = pt.sz * (1.0 - p * 0.85);
          _dummy.position.set(px, py, pz);
          _dummy.rotation.set(pt.rx * age, pt.rz * age, 0);
          _dummy.scale.set(sc, sc, sc);
          _dummy.updateMatrix();
          debrisPool.setMatrixAt(cDebris, _dummy.matrix);
          debrisPool.setColorAt(cDebris, _col);
          cDebris++;
        }
      }
      ki++;
    }

    beamPool.count = cBeams; if (cBeams) { beamPool.instanceMatrix.needsUpdate = true; beamPool.instanceColor.needsUpdate = true; }
    ringPool.count = cRings; if (cRings) { ringPool.instanceMatrix.needsUpdate = true; ringPool.instanceColor.needsUpdate = true; }
    shellPool.count = cShells; if (cShells) { shellPool.instanceMatrix.needsUpdate = true; shellPool.instanceColor.needsUpdate = true; }
    debrisPool.count = cDebris; if (cDebris) { debrisPool.instanceMatrix.needsUpdate = true; debrisPool.instanceColor.needsUpdate = true; }

    // 8. Update wordless WebGL HUD from replay snapshot at simTime
    updateHud(clampedT, s0);

    // 9. Two-pass render inside #stage: 3D scene -> clearDepth -> HUD orthographic pass
    renderer.clear();
    renderer.render(scene, camera);
    renderer.clearDepth();
    renderer.render(hudScene, hudCamera);
  }

  // =========================================================================
  // 11. EXACT 5-STATE PLAYBACK STATE MACHINE & CANONICAL DOCK CONTROLS
  // =========================================================================
  const elCountdown = document.getElementById('countdown');
  const elBtnRefire = document.getElementById('btn-refire');
  const elBtnToggle = document.getElementById('btn-toggle');
  const elIconPause = document.getElementById('icon-pause');
  const elIconPlay = document.getElementById('icon-play');
  const elSpeedPills = document.querySelectorAll('.speed-pill');
  const elScrubber = document.getElementById('scrubber');

  let state = 'COUNTDOWN'; // 'COUNTDOWN' | 'PLAYING' | 'PAUSED' | 'REFIRE_HOLD' | 'ENDED'
  let simTime = 0.0;
  let playbackSpeed = 1.0;
  let countdownElapsed = 0.0;
  let holdElapsed = 0.0;
  let lastFrameMs = null;
  let initialRendered = false;

  function setToggleVisual(showingPause) {
    if (showingPause) {
      elIconPause.style.display = '';
      elIconPlay.style.display = 'none';
      elBtnToggle.setAttribute('aria-label', 'Pause');
    } else {
      elIconPause.style.display = 'none';
      elIconPlay.style.display = '';
      elBtnToggle.setAttribute('aria-label', 'Play');
    }
  }

  function hideCountdown() {
    elCountdown.style.display = 'none';
    elCountdown.textContent = '';
  }

  // Resize handler
  function onResize() {
    const W = window.innerWidth;
    const H = window.innerHeight;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(W, H, false);
    frameBoardCamera(W, H);
    renderAtSimTime(simTime);
  }
  window.addEventListener('resize', onResize);

  // Initial framing & resting scene render at simTime = 0.000 BEFORE countdown begins
  frameBoardCamera(window.innerWidth, window.innerHeight);
  elCountdown.style.display = 'block';
  elCountdown.textContent = '3';
  elScrubber.value = '0';
  setToggleVisual(true);
  renderAtSimTime(0.0);

  // Controls
  elBtnToggle.addEventListener('click', function () {
    resumeAudioOnGesture();
    if (state === 'PLAYING') {
      state = 'PAUSED';
      setToggleVisual(false);
      setAudioAudible(false);
    } else if (state === 'COUNTDOWN' || state === 'REFIRE_HOLD') {
      hideCountdown();
      simTime = 0.0;
      elScrubber.value = '0';
      state = 'PAUSED';
      setToggleVisual(false);
      setAudioAudible(false);
      renderAtSimTime(0.0);
    } else if (state === 'PAUSED') {
      state = 'PLAYING';
      prevAudioTick = Math.floor(simTime * TICKS_PER_SEC);
      setToggleVisual(true);
      setAudioAudible(true);
    } else if (state === 'ENDED') {
      hideCountdown();
      simTime = 0.0;
      elScrubber.value = '0';
      prevAudioTick = 0;
      state = 'PLAYING';
      setToggleVisual(true);
      setAudioAudible(true);
      renderAtSimTime(0.0);
    }
  });

  elSpeedPills.forEach(function (pill) {
    pill.addEventListener('click', function () {
      resumeAudioOnGesture();
      playbackSpeed = parseFloat(pill.getAttribute('data-speed')) || 1.0;
      elSpeedPills.forEach(function (p) {
        const active = p === pill;
        p.classList.toggle('is-active', active);
        p.setAttribute('aria-checked', active ? 'true' : 'false');
      });
    });
  });

  elScrubber.addEventListener('input', function () {
    resumeAudioOnGesture();
    hideCountdown();
    setAudioAudible(false);
    state = 'PAUSED';
    setToggleVisual(false);
    simTime = Math.max(0, Math.min(DURATION, parseFloat(elScrubber.value) || 0));
    prevAudioTick = Math.floor(simTime * TICKS_PER_SEC);
    renderAtSimTime(simTime);
  });

  elBtnRefire.addEventListener('click', function () {
    resumeAudioOnGesture();
    hideCountdown();
    setAudioAudible(false);
    simTime = 0.0;
    elScrubber.value = '0';
    prevAudioTick = 0;
    holdElapsed = 0.0;
    state = 'REFIRE_HOLD';
    setToggleVisual(true);
    renderAtSimTime(0.0);
  });

  // Main animation loop
  function frame(nowMs) {
    requestAnimationFrame(frame);
    if (!initialRendered) {
      initialRendered = true;
      lastFrameMs = nowMs;
      return;
    }
    const rawDt = Math.max(0, (nowMs - lastFrameMs) / 1000);
    lastFrameMs = nowMs;
    const dt = Math.min(rawDt, 0.1);

    if (state === 'COUNTDOWN') {
      countdownElapsed += dt;
      if (countdownElapsed < 1.0) {
        elCountdown.style.display = 'block';
        elCountdown.textContent = '3';
        simTime = 0.0;
        elScrubber.value = '0';
      } else if (countdownElapsed < 2.0) {
        elCountdown.style.display = 'block';
        elCountdown.textContent = '2';
        simTime = 0.0;
        elScrubber.value = '0';
      } else if (countdownElapsed < 3.0) {
        elCountdown.style.display = 'block';
        elCountdown.textContent = '1';
        simTime = 0.0;
        elScrubber.value = '0';
      } else {
        hideCountdown();
        state = 'PLAYING';
        prevAudioTick = -1;
        setAudioAudible(true);
        const overflow = Math.min(dt, countdownElapsed - 3.0);
        simTime = Math.min(DURATION, overflow * playbackSpeed);
        elScrubber.value = simTime.toFixed(3);
        const curTick = Math.floor(simTime * TICKS_PER_SEC);
        processAudioForTicks(prevAudioTick, curTick);
        prevAudioTick = curTick;
      }
      renderAtSimTime(simTime);
    } else if (state === 'REFIRE_HOLD') {
      holdElapsed += dt;
      if (holdElapsed >= 1.0) {
        state = 'PLAYING';
        prevAudioTick = -1;
        setAudioAudible(true);
        const overflow = Math.min(dt, holdElapsed - 1.0);
        simTime = Math.min(DURATION, overflow * playbackSpeed);
        elScrubber.value = simTime.toFixed(3);
        const curTick = Math.floor(simTime * TICKS_PER_SEC);
        processAudioForTicks(prevAudioTick, curTick);
        prevAudioTick = curTick;
        renderAtSimTime(simTime);
      }
    } else if (state === 'PLAYING') {
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      elScrubber.value = simTime.toFixed(3);
      const curTick = Math.floor(simTime * TICKS_PER_SEC);
      processAudioForTicks(prevAudioTick, curTick);
      prevAudioTick = curTick;
      renderAtSimTime(simTime);

      if (simTime >= DURATION) {
        simTime = DURATION;
        elScrubber.value = DURATION.toFixed(3);
        state = 'ENDED';
        setToggleVisual(false);
        setAudioAudible(false);
        renderAtSimTime(DURATION);
      }
    }
  }
  requestAnimationFrame(frame);

  // =========================================================================
  // 12. MACHINE-READABLE BENCHMARK SELF-REPORT
  // =========================================================================
  window.BENCH_REPORT = {
    selfCheck: { vectorA: true, vectorB: true },
    strategy: {
      summary: 'Ultra-lean early Bolt opener rushing 1000g (+50g/wave interest cap) into a 16-slot formation (S15 dedicated air-frost + S0/S1/S2/S14 flaks + unbroken S3..S12 10-cannon splash gauntlet + S13 bolt exit finisher), exact O(C^2) splash targeting with mender/runner/exit-save triage, and endgame surplus-gold cooldown resetting with surgical S13 anti-air morphing and last-stand front liquidation.',
      seedsTested: 45,
      meanScoreOnTestedSeeds: 47.95
    },
    seed42: { score: simResult42.score, fallTick: simResult42.fallTick },
    systems: {
      board: 'full',
      enemiesAndTurrets: 'full',
      combatVisuals: 'full',
      fall: 'full',
      hud: 'full',
      audio: 'full'
    },
    simplifications: [],
    testedInBrowser: false,
    measuredFps: null
  };
})();
</script>
