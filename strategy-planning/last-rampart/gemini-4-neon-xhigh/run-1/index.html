<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Last Rampart: Wave Defense Strategist</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="100" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script id="rampart-strategy">
function createStrategy() {
  const COSTS = { bolt: 50, cannon: 90, frost: 70, lance: 120, flak: 80 };
  const PERIODS = { bolt: 8, cannon: 24, frost: 12, lance: 36, flak: 10 };
  const RANGES_T3 = { bolt: 360, cannon: 320, frost: 300, lance: 420, flak: 380 };
  const LEAK_DMG = { grunt: 1, runner: 1, splitling: 1, wisp: 2, splitter: 2, mender: 2, brute: 3 };

  // Optimal 16-slot endgame formation:
  // S15 dedicated air-frost compresses wisps at spawn into overlapping S0/S1/S2 flak killbox;
  // S3..S12 form an unbroken 10-cannon splash gauntlet (zero front mender pre-healing);
  // S13 bolt executes wounded exit leakers (ground + air); S14 flak guards the final air drop.
  const TARGET_BOARD = [
    'flak', 'flak', 'flak', 'cannon',
    'cannon', 'cannon', 'cannon', 'cannon',
    'cannon', 'cannon', 'cannon', 'cannon',
    'cannon', 'bolt', 'flak', 'frost'
  ];
  const BUILD_ORDER = [4, 6, 3, 11, 7, 13, 8, 12, 14, 1, 10, 5, 2, 0, 9, 15];

  let shotSeq = 0;
  const frostStamp = Object.create(null);
  let waveTick = 0;
  let estTick = 0;
  let enemySnap = Object.create(null);
  const lastFired = new Int32Array(16);
  for (let i = 0; i < 16; i++) lastFired[i] = -9999;
  let reachedMax = false;

  return {
    plan(state) {
      const actions = [];
      let g = state.gold;
      const w = state.wave;
      waveTick = state.tick;
      estTick = state.tick;
      enemySnap = Object.create(null);
      for (let i = 0; i < state.enemies.length; i++) {
        const e = state.enemies[i];
        if (!e.slowed) enemySnap[e.id] = { rem: e.remaining, spd: e.speed };
      }

      const cur = new Array(16);
      for (let i = 0; i < 16; i++) {
        const t = state.slots[i].turret;
        cur[i] = t ? { type: t.type, tier: t.tier, spent: t.spent } : null;
      }

      function doBuild(sl, type) {
        const c = COSTS[type];
        if (cur[sl] || g < c || actions.length >= 32) return false;
        actions.push({ op: 'build', slot: sl, type: type });
        g -= c;
        cur[sl] = { type: type, tier: 1, spent: c };
        lastFired[sl] = -9999;
        return true;
      }
      function doUpgrade(sl) {
        const t = cur[sl];
        if (!t || t.tier >= 3 || actions.length >= 32) return false;
        const c = (t.tier === 1 ? 1 : 2) * COSTS[t.type];
        if (g < c) return false;
        actions.push({ op: 'upgrade', slot: sl });
        g -= c;
        t.tier += 1;
        t.spent += c;
        return true;
      }
      function doSell(sl) {
        const t = cur[sl];
        if (!t || actions.length >= 32) return false;
        actions.push({ op: 'sell', slot: sl });
        g += Math.floor((t.spent * 70) / 100);
        cur[sl] = null;
        lastFired[sl] = -9999;
        return true;
      }

      // Phase 1: Ultra-lean Bolt opener to bank quickly to 1000g (+50g/wave interest cap) with zero leaks
      if (w === 1) {
        doBuild(8, 'bolt');
        return actions;
      }
      if (w === 3) {
        doBuild(12, 'bolt');
        return actions;
      }

      let minGRem = 4600;
      let minARem = 2800;
      let gCount = 0;
      let exitWispCnt = 0;
      let exitWispHp = 0;
      for (let i = 0; i < state.enemies.length; i++) {
        const e = state.enemies[i];
        if (e.air) {
          if (e.remaining < minARem) minARem = e.remaining;
          if (e.remaining < 1100) {
            exitWispCnt++;
            exitWispHp += e.hp;
          }
        } else {
          gCount++;
          if (e.remaining < minGRem) minGRem = e.remaining;
        }
      }

      if (w <= 14) {
        if (w === 6 && !cur[13]) doBuild(13, 'bolt');
        if ((minGRem < 1200 || gCount >= 7) && cur[8] && cur[8].type === 'bolt' && cur[8].tier === 1) doUpgrade(8);
        if ((minGRem < 1000 || minARem < 1100) && cur[12] && cur[12].type === 'bolt' && cur[12].tier === 1) doUpgrade(12);
        if ((minGRem < 900 || w >= 12) && !cur[4]) doBuild(4, 'cannon');
        if (minGRem < 800 && cur[13] && cur[13].type === 'bolt' && cur[13].tier === 1) doUpgrade(13);
        if (g < 1050 && state.baseHp >= 9) return actions;
      }

      let remBoardCost = 0;
      let allMaxNow = true;
      for (let i = 0; i < 16; i++) {
        const want = TARGET_BOARD[i];
        const t = cur[i];
        if (!t) {
          remBoardCost += 4 * COSTS[want];
          allMaxNow = false;
        } else if (t.type !== want) {
          remBoardCost += 4 * COSTS[want] - Math.floor((t.spent * 70) / 100);
          allMaxNow = false;
        } else if (t.tier === 1) {
          remBoardCost += 3 * COSTS[want];
          allMaxNow = false;
        } else if (t.tier === 2) {
          remBoardCost += 2 * COSTS[want];
          allMaxNow = false;
        }
      }
      if (allMaxNow) reachedMax = true;

      // Phase 3: Endgame Surplus-Gold Cooldown-Resetter, Surgical S13 Anti-Air Morph, & Last-Stand Liquidation
      if (reachedMax) {
        if (cur[13] && w >= 42) {
          const want13 = (exitWispCnt >= 2 && exitWispHp > 2600) ? 'flak' : TARGET_BOARD[13];
          if (cur[13].type !== want13 && actions.length <= 26) {
            const net = 4 * COSTS[want13] - Math.floor((cur[13].spent * 70) / 100);
            if (g >= net) {
              doSell(13);
              doBuild(13, want13);
              doUpgrade(13);
              doUpgrade(13);
            }
          }
        }

        // Last-stand liquidation: reclaim gold from far-front slots whose enemies cannot reach the base in time
        if (w >= 44) {
          const liqSlots = [];
          if (state.baseHp <= 8 || (w >= 46 && g < 300)) liqSlots.push(3, 4);
          if (state.baseHp <= 6 || (w >= 47 && g < 300)) liqSlots.push(5, 6);
          if (state.baseHp <= 4) liqSlots.push(0, 1, 2, 15, 7);
          if (state.baseHp <= 2) liqSlots.push(8, 9);
          for (let k = 0; k < liqSlots.length; k++) {
            const sl = liqSlots[k];
            if (cur[sl] && g < 550 && actions.length <= 24) doSell(sl);
          }
        }

        // Convert surplus gold into extra Tier-3 volleys by resetting high-cooldown active turrets at wave start
        if (w >= 39) {
          const candsReset = [];
          for (let sl = 0; sl < 16; sl++) {
            const t = cur[sl];
            if (!t || t.tier !== 3) continue;
            if (t.type !== 'cannon' && t.type !== 'lance' && t.type !== 'flak') continue;
            const per = PERIODS[t.type];
            const remCd = per - (state.tick - lastFired[sl]);
            const minReq = t.type === 'flak' ? 5 : 12;
            if (remCd < minReq) continue;
            const sx = state.slots[sl].x;
            const sy = state.slots[sl].y;
            const r = RANGES_T3[t.type];
            const r2 = r * r;
            const isAir = t.type === 'flak';
            let inRangeCnt = 0;
            let urgB = 1.0;
            for (let i = 0; i < state.enemies.length; i++) {
              const e = state.enemies[i];
              if (isAir ? !e.air : e.air) continue;
              const dx = e.x - sx;
              const dy = e.y - sy;
              if (dx * dx + dy * dy <= r2) {
                inRangeCnt++;
                if (e.remaining < 1100) urgB = 3.0;
              }
            }
            if (inRangeCnt === 0) continue;
            const netCost = 4 * COSTS[t.type] - Math.floor((t.spent * 70) / 100);
            const val = (remCd / per) * (isAir ? inRangeCnt * 5.0 : Math.min(inRangeCnt, 14)) * urgB / netCost;
            candsReset.push({ sl: sl, type: t.type, netCost: netCost, val: val });
          }
          candsReset.sort(function (a, b) { return b.val - a.val; });
          const minKeep = (w < 44 && state.baseHp >= 8) ? 500 : 0;
          for (let i = 0; i < candsReset.length; i++) {
            if (actions.length > 28) break;
            const item = candsReset[i];
            if (g - item.netCost >= minKeep) {
              doSell(item.sl);
              doBuild(item.sl, item.type);
              doUpgrade(item.sl);
              doUpgrade(item.sl);
            }
          }
        }
        return actions;
      }

      // Phase 2: Mid-game interest-preserving expansion and clean transition to maxed T3 formation
      let reserve = 1000;
      if (remBoardCost <= g + 900 || w >= 36 || state.baseHp <= 8) reserve = 0;
      else if (minGRem < 650 || minARem < 650) reserve = 0;
      else if (minGRem < 1100 || minARem < 1000) reserve = 450;

      for (let i = 0; i < BUILD_ORDER.length; i++) {
        const sl = BUILD_ORDER[i];
        if (!cur[sl] && g - COSTS[TARGET_BOARD[sl]] >= reserve) {
          doBuild(sl, TARGET_BOARD[sl]);
        }
      }
      for (let i = 0; i < BUILD_ORDER.length; i++) {
        const sl = BUILD_ORDER[i];
        const t = cur[sl];
        if (t && t.type === TARGET_BOARD[sl] && t.tier === 1 && t.type !== 'frost') {
          if (g - COSTS[t.type] >= reserve) doUpgrade(sl);
        }
      }
      for (let i = 0; i < BUILD_ORDER.length; i++) {
        const sl = BUILD_ORDER[i];
        const t = cur[sl];
        if (t && t.type === TARGET_BOARD[sl] && t.tier === 2 && t.type !== 'frost') {
          if (g - 2 * COSTS[t.type] >= reserve) doUpgrade(sl);
        }
      }

      let otherReady = true;
      for (let i = 0; i < 16; i++) {
        if (cur[i] && cur[i].type !== TARGET_BOARD[i]) continue;
        if (!cur[i] || (TARGET_BOARD[i] !== 'frost' && cur[i].tier < 2)) {
          otherReady = false;
          break;
        }
      }
      if (w >= 30 || otherReady) {
        for (let i = 0; i < BUILD_ORDER.length; i++) {
          const sl = BUILD_ORDER[i];
          const t = cur[sl];
          const want = TARGET_BOARD[sl];
          if (t && t.type !== want) {
            const refund = Math.floor((t.spent * 70) / 100);
            const wantTier = (want === 'frost' && w < 38) ? 1 : 3;
            const need = (wantTier === 3 ? 4 : 1) * COSTS[want];
            if (g + refund - need >= reserve && actions.length <= 28) {
              doSell(sl);
              doBuild(sl, want);
              if (wantTier >= 2) doUpgrade(sl);
              if (wantTier >= 3) doUpgrade(sl);
            }
          }
        }
      }

      let dpsAllT3 = true;
      for (let i = 0; i < 16; i++) {
        if (TARGET_BOARD[i] === 'frost') continue;
        if (!cur[i] || cur[i].type !== TARGET_BOARD[i] || cur[i].tier < 3) {
          dpsAllT3 = false;
          break;
        }
      }
      if (dpsAllT3) {
        for (let tier = 2; tier <= 3; tier++) {
          for (let i = 0; i < 16; i++) {
            const t = cur[i];
            if (t && t.type === 'frost' && t.tier === tier - 1) {
              const c = (tier === 2 ? 1 : 2) * COSTS.frost;
              if (g - c >= reserve) doUpgrade(i);
            }
          }
        }
      }

      return actions;
    },

    target(turret, cands) {
      shotSeq++;
      // Reconstruct current integer tick from any unslowed tracked enemy for exact cooldown tracking
      for (let i = 0; i < cands.length; i++) {
        const c = cands[i];
        if (!c.slowed) {
          const sn = enemySnap[c.id];
          if (sn) {
            const dt = Math.round((sn.rem - c.remaining) / sn.spd) - 1;
            if (dt >= 0 && dt < 40) {
              const t = waveTick + dt;
              if (t > estTick) estTick = t;
              break;
            }
          }
        }
      }
      lastFired[turret.slot] = estTick;

      const tType = turret.type;

      // Frost: slow leading unslowed wisps & runners first so trailing units catch up and stack for splash
      if (tType === 'frost') {
        let best = cands[0];
        let bestSc = -1e18;
        for (let i = 0; i < cands.length; i++) {
          const c = cands[i];
          const unslowed = c.slowed ? 0 : 1;
          const stale = Math.min(shotSeq - (frostStamp[c.id] || -10000), 300);
          const remNorm = c.air ? (2800 - c.remaining) / 2800 : (4600 - c.remaining) / 4600;
          const effSpd = c.slowed ? Math.floor((c.speed * 60) / 100) : c.speed;
          const ticksLeft = c.remaining / Math.max(1, effSpd);
          const doomed = (ticksLeft < 8 && c.hp > 600) ? 0.05 : 1.0;
          const typeBonus = c.air ? 55000 : c.type === 'runner' ? 35000 : c.type === 'mender' ? 12000 : 0;
          const sc = (unslowed * 1000000 + typeBonus + remNorm * 45000 + stale * 120) * doomed;
          if (sc > bestSc) {
            bestSc = sc;
            best = c;
          }
        }
        frostStamp[best.id] = shotSeq;
        return best.id;
      }

      // Cannon & Flak: exact O(C^2) splash cluster maximization with mender/runner priority,
      // flat exit-kill-save bonuses, late splitter-crack avoidance, and doomed-enemy triage
      if (tType === 'cannon' || tType === 'flak') {
        const sp = tType === 'cannon' ? 90 : 70;
        const sp2 = sp * sp;
        const baseDmg = tType === 'cannon'
          ? (turret.tier === 1 ? 60 : turret.tier === 2 ? 96 : 153)
          : (turret.tier === 1 ? 40 : turret.tier === 2 ? 64 : 102);
        const routeLen = tType === 'flak' ? 2800 : 4600;
        const n = cands.length;
        const vals = new Float64Array(n);

        for (let j = 0; j < n; j++) {
          const b = cands[j];
          const effDmg = Math.max(1, baseDmg - b.armor);
          const dealt = Math.min(b.hp, effDmg);
          const prog = 1 - b.remaining / routeLen;
          const effSpd = b.slowed ? Math.floor((b.speed * 60) / 100) : b.speed;
          const ticksLeft = b.remaining / Math.max(1, effSpd);

          if (tType === 'flak') {
            const kMult = b.hp <= effDmg ? 2.8 : (b.hp <= effDmg * 3 ? 1.5 : 1.0);
            const hpFrac = b.hp / Math.max(1, b.maxHp);
            const fMult = 1.0 + 0.4 * (1.0 - hpFrac);
            let v = dealt * kMult * fMult * Math.pow(1 + prog * 2.2, 2.2);
            const maxRear = ticksLeft * 38 + effDmg;
            if (b.remaining < 450 && b.hp > maxRear) v *= 0.04;
            else if (b.remaining < 520 && b.hp <= effDmg) v += 8000;
            vals[j] = v;
          } else {
            const kMult = b.hp <= effDmg ? 2.6 : (b.hp <= effDmg * 3 ? 1.4 : 1.0);
            const hpFrac = b.hp / Math.max(1, b.maxHp);
            const fMult = 1.0 + 0.45 * (1.0 - hpFrac);
            const tMult = b.type === 'mender' ? 6.0
              : b.type === 'runner' ? 3.2
              : b.type === 'splitling' ? 1.4
              : 1.0;
            let urg = 1.0 + prog * 2.4;
            const maxRear = ticksLeft * 60 + effDmg;
            if (b.remaining < 480 && b.hp > maxRear) urg *= 0.04;
            else if (b.remaining < 700 && b.hp <= maxRear) urg *= 2.0;
            let v = dealt * kMult * fMult * tMult * urg;
            if (b.remaining < 480) {
              const lk = LEAK_DMG[b.type] || 1;
              if (b.hp <= effDmg) {
                if (b.type === 'splitter' && b.remaining < 320 && b.maxHp > effDmg * 5) v = -500;
                else v += 5000 * lk * (1 + (480 - b.remaining) / 480);
              } else if (b.hp <= effDmg * 2 && ticksLeft >= 10) {
                v += 2200 * lk;
              }
            }
            vals[j] = v;
          }
        }

        let bestIdx = 0;
        let bestSc = -1e18;
        for (let i = 0; i < n; i++) {
          const ax = cands[i].x;
          const ay = cands[i].y;
          let sc = 0;
          for (let j = 0; j < n; j++) {
            const dx = cands[j].x - ax;
            const dy = cands[j].y - ay;
            if (dx * dx + dy * dy <= sp2) sc += vals[j];
          }
          if (sc > bestSc) {
            bestSc = sc;
            bestIdx = i;
          }
        }
        return cands[bestIdx].id;
      }

      if (tType === 'lance') {
        const dmg = turret.tier === 1 ? 180 : turret.tier === 2 ? 288 : 460;
        let best = cands[0];
        let bestSc = -1e18;
        for (let i = 0; i < cands.length; i++) {
          const c = cands[i];
          const dealt = Math.min(c.hp, dmg);
          const kMult = c.hp <= dmg ? 3.0 : 1.0;
          const tMult = c.type === 'mender' ? 20.0 : c.type === 'brute' ? 2.8 : c.type === 'runner' ? 2.8 : 1.0;
          const prog = 1 - c.remaining / 4600;
          let sc = dealt * kMult * tMult * (1 + prog * 3.0);
          if (c.remaining < 500 && c.hp <= dmg) sc += 6000 * (LEAK_DMG[c.type] || 1);
          if (sc > bestSc) {
            bestSc = sc;
            best = c;
          }
        }
        return best.id;
      }

      // Bolt: rapid-fire exit mop-up with kill-confirm triage
      const dmg = turret.tier === 1 ? 26 : turret.tier === 2 ? 41 : 65;
      let best = cands[0];
      let bestSc = -1e18;
      for (let i = 0; i < cands.length; i++) {
        const c = cands[i];
        const eff = Math.max(1, dmg - c.armor);
        const dealt = Math.min(c.hp, eff);
        const routeLen = c.air ? 2800 : 4600;
        const prog = 1 - c.remaining / routeLen;
        const kMult = c.hp <= eff ? 3.0 : 1.0;
        const tMult = c.air ? 2.6 : c.type === 'runner' ? 2.8 : c.type === 'mender' ? 3.0 : 1.0;
        let sc = dealt * kMult * tMult * (1 + prog * 4);
        if (c.remaining < 520) {
          const effSpd = c.slowed ? Math.floor((c.speed * 60) / 100) : c.speed;
          const shotsLeft = Math.floor(c.remaining / Math.max(1, effSpd) / 8) + 1;
          const lk = LEAK_DMG[c.type] || 1;
          if (c.hp <= eff) {
            if (c.type === 'splitter' && c.remaining < 300 && c.maxHp > eff * 8) sc = -500;
            else sc += 6000 * lk * (1 + (520 - c.remaining) / 520);
          } else if (c.hp <= eff * Math.min(shotsLeft, 5)) {
            sc += 3500 * lk * (1 + (520 - c.remaining) / 520) / Math.max(1, c.hp / eff);
          } else if (c.hp > eff * shotsLeft * 2) {
            sc *= 0.04;
          }
        }
        if (sc > bestSc) {
          bestSc = sc;
          best = c;
        }
      }
      return best.id;
    }
  };

<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks, recorder) {
  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return (t ^ (t >>> 14)) >>> 0;
    };
  }

  function makePath(pts) {
    const segs = [];
    let total = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const x0 = pts[i][0] * 100 + 50;
      const y0 = pts[i][1] * 100 + 50;
      const x1 = pts[i + 1][0] * 100 + 50;
      const y1 = pts[i + 1][1] * 100 + 50;
      const dx = x1 - x0;
      const dy = y1 - y0;
      const len = Math.abs(dx) + Math.abs(dy);
      segs.push({ x0: x0, y0: y0, dx: Math.sign(dx), dy: Math.sign(dy), start: total, len: len });
      total += len;
    }
    return { segs: segs, len: total };
  }

  function posOnPath(path, prog) {
    if (prog >= path.len) {
      const s = path.segs[path.segs.length - 1];
      return [s.x0 + s.dx * s.len, s.y0 + s.dy * s.len];
    }
    for (let i = 0; i < path.segs.length; i++) {
      const s = path.segs[i];
      if (prog <= s.start + s.len) {
        const d = prog - s.start;
        return [s.x0 + s.dx * d, s.y0 + s.dy * d];
      }
    }
    const s = path.segs[path.segs.length - 1];
    return [s.x0 + s.dx * s.len, s.y0 + s.dy * s.len];
  }

  const GROUND_PATH = makePath([[0, 2], [6, 2], [6, 10], [12, 10], [12, 3], [18, 3], [18, 11], [23, 11]]);
  const AIR_PATH = makePath([[0, 6], [21, 6], [21, 11], [23, 11]]);

  const SLOT_COORDS = [
    [3, 3], [5, 5], [7, 4], [7, 8], [9, 9], [10, 5], [11, 8], [13, 8],
    [14, 5], [15, 2], [16, 7], [17, 4], [19, 8], [20, 10], [22, 9], [3, 7]
  ];

  const TURRET_TYPES = {
    bolt:   { idx: 0, cost: 50,  dmg: 26,  period: 8,  range: 300, splash: 0,  slow: 0,  pierce: false, ground: true,  air: true  },
    cannon: { idx: 1, cost: 90,  dmg: 60,  period: 24, range: 260, splash: 90, slow: 0,  pierce: false, ground: true,  air: false },
    frost:  { idx: 2, cost: 70,  dmg: 10,  period: 12, range: 240, splash: 0,  slow: 30, pierce: false, ground: true,  air: true  },
    lance:  { idx: 3, cost: 120, dmg: 180, period: 36, range: 360, splash: 0,  slow: 0,  pierce: true,  ground: true,  air: false },
    flak:   { idx: 4, cost: 80,  dmg: 40,  period: 10, range: 320, splash: 70, slow: 0,  pierce: false, ground: false, air: true  }
  };

  const ENEMY_LIST = [
    { type: 'grunt',    baseHp: 60,  speed: 10, bounty: 4, leak: 1, air: 0, firstWave: 1, weight: 10 },
    { type: 'runner',   baseHp: 40,  speed: 20, bounty: 4, leak: 1, air: 0, firstWave: 2, weight: 4  },
    { type: 'wisp',     baseHp: 50,  speed: 12, bounty: 6, leak: 2, air: 1, firstWave: 3, weight: 3  },
    { type: 'brute',    baseHp: 150, speed: 6,  bounty: 9, leak: 3, air: 0, firstWave: 4, weight: 3  },
    { type: 'splitter', baseHp: 90,  speed: 8,  bounty: 6, leak: 2, air: 0, firstWave: 6, weight: 2  },
    { type: 'mender',   baseHp: 70,  speed: 8,  bounty: 7, leak: 2, air: 0, firstWave: 8, weight: 1  }
  ];
  const ENEMY_MAP = {};
  for (let i = 0; i < ENEMY_LIST.length; i++) ENEMY_MAP[ENEMY_LIST[i].type] = ENEMY_LIST[i];

  function turretDamage(baseDmg, tier) {
    let d = baseDmg;
    for (let t = 1; t < tier; t++) d = Math.floor((d * 16) / 10);
    return d;
  }

  const rng = mulberry32(seed);
  const strategy = createStrategy();
  const hasTarget = typeof strategy.target === 'function';

  const waveMult = [0, 1000];
  function getMult(w) {
    while (waveMult.length <= w) {
      waveMult.push(Math.floor((waveMult[waveMult.length - 1] * 108) / 100));
    }
    return waveMult[w];
  }

  function genWave(w) {
    const count = 4 + Math.floor((3 * w) / 5);
    const avail = [];
    let totalW = 0;
    for (let i = 0; i < ENEMY_LIST.length; i++) {
      if (ENEMY_LIST[i].firstWave <= w) {
        avail.push(ENEMY_LIST[i]);
        totalW += ENEMY_LIST[i].weight;
      }
    }
    const comp = [];
    for (let i = 0; i < count; i++) {
      let r = rng() % totalW;
      let chosen = avail[avail.length - 1].type;
      for (let j = 0; j < avail.length; j++) {
        if (r < avail[j].weight) {
          chosen = avail[j].type;
          break;
        }
        r -= avail[j].weight;
      }
      comp.push(chosen);
    }
    return comp;
  }

  const slots = [];
  for (let idx = 0; idx < SLOT_COORDS.length; idx++) {
    slots.push({
      slot: idx,
      x: SLOT_COORDS[idx][0] * 100 + 50,
      y: SLOT_COORDS[idx][1] * 100 + 50,
      turret: null
    });
  }

  let gold = 250;
  let baseHp = 10;
  let nextEnemyId = 1;
  let enemies = [];
  const spawnQueue = [];
  const log = [];
  let fallTick = -1;

  const waveComps = {};
  waveComps[1] = genWave(1);
  let currentWave = 0;
  let previewWave = waveComps[1];

  function makeEnemyView(e) {
    const routeLen = e.air ? AIR_PATH.len : GROUND_PATH.len;
    return {
      id: e.id,
      type: e.type,
      hp: e.hp,
      maxHp: e.maxHp,
      x: e.x,
      y: e.y,
      air: e.air,
      armor: e.armor,
      speed: e.speed,
      slowed: e.slow > 0 ? 1 : 0,
      remaining: routeLen - e.progress
    };
  }

  function createEnemy(type, wave, progress) {
    const def = ENEMY_MAP[type];
    const maxHp = Math.floor((def.baseHp * getMult(wave)) / 1000);
    let armor = 0;
    if (type === 'grunt') armor = Math.floor(wave / 4);
    else if (type === 'brute') armor = 6 + wave;
    const path = def.air ? AIR_PATH : GROUND_PATH;
    const pos = posOnPath(path, progress);
    return {
      id: nextEnemyId++,
      type: type,
      wave: wave,
      hp: maxHp,
      maxHp: maxHp,
      speed: def.speed,
      armor: armor,
      bounty: def.bounty,
      leak: def.leak,
      air: def.air,
      progress: progress,
      x: pos[0],
      y: pos[1],
      age: 0,
      slow: 0
    };
  }

  for (let tick = 0; tick < maxTicks; tick++) {
    // 1. Wave start
    if (tick >= 20 && (tick - 20) % 40 === 0) {
      const w = ((tick - 20) / 40) + 1;
      currentWave = w;
      const interest = Math.min(50, Math.floor((gold * 5) / 100));
      gold += interest + 10 + 2 * w;
      const nextW = genWave(w + 1);
      waveComps[w + 1] = nextW;
      previewWave = nextW;
      if (recorder && recorder.onWave) recorder.onWave(tick, w, nextW);

      const state = {
        tick: tick,
        wave: w,
        gold: gold,
        baseHp: baseHp,
        slots: slots.map(function (s) {
          return {
            slot: s.slot,
            x: s.x,
            y: s.y,
            turret: s.turret ? { type: s.turret.type, tier: s.turret.tier, spent: s.turret.spent } : null
          };
        }),
        enemies: enemies.map(makeEnemyView),
        nextWave: nextW.slice()
      };

      const actions = strategy.plan(state);
      if (Array.isArray(actions)) {
        const limit = Math.min(actions.length, 32);
        for (let i = 0; i < limit; i++) {
          const act = actions[i];
          if (!act || typeof act !== 'object') continue;
          const slIdx = act.slot;
          if (!Number.isInteger(slIdx) || slIdx < 0 || slIdx >= 16) continue;
          const sl = slots[slIdx];
          if (act.op === 'build') {
            if (sl.turret !== null) continue;
            const def = TURRET_TYPES[act.type];
            if (!def || gold < def.cost) continue;
            gold -= def.cost;
            sl.turret = { type: act.type, tier: 1, spent: def.cost, cd: 0 };
            log.push([tick, 'B', slIdx, def.idx]);
            if (recorder && recorder.onAction) recorder.onAction(tick, 'B', slIdx, act.type, 1);
          } else if (act.op === 'upgrade') {
            if (sl.turret === null || sl.turret.tier >= 3) continue;
            const def = TURRET_TYPES[sl.turret.type];
            const upCost = sl.turret.tier === 1 ? def.cost : 2 * def.cost;
            if (gold < upCost) continue;
            gold -= upCost;
            sl.turret.tier += 1;
            sl.turret.spent += upCost;
            log.push([tick, 'U', slIdx, sl.turret.tier]);
            if (recorder && recorder.onAction) recorder.onAction(tick, 'U', slIdx, sl.turret.type, sl.turret.tier);
          } else if (act.op === 'sell') {
            if (sl.turret === null) continue;
            const prevType = sl.turret.type;
            gold += Math.floor((sl.turret.spent * 70) / 100);
            sl.turret = null;
            log.push([tick, 'S', slIdx, 0]);
            if (recorder && recorder.onAction) recorder.onAction(tick, 'S', slIdx, prevType, 0);
          }
        }
      }

      const comp = waveComps[w];
      for (let i = 0; i < comp.length; i++) {
        spawnQueue.push({ tick: tick + 4 * i, wave: w, idx: i, type: comp[i] });
      }
      spawnQueue.sort(function (a, b) {
        return (a.tick - b.tick) || (a.wave - b.wave) || (a.idx - b.idx);
      });
    }

    // 2. Spawn
    let sqStart = 0;
    while (sqStart < spawnQueue.length && spawnQueue[sqStart].tick === tick) {
      const item = spawnQueue[sqStart++];
      enemies.push(createEnemy(item.type, item.wave, 0));
    }
    if (sqStart > 0) spawnQueue.splice(0, sqStart);

    // 3. Move
    let fell = false;
    const survivorsAfterMove = [];
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      const step = e.slow > 0 ? Math.floor((e.speed * 60) / 100) : e.speed;
      e.progress += step;
      const routeLen = e.air ? AIR_PATH.len : GROUND_PATH.len;
      if (e.progress >= routeLen) {
        const prevHp = baseHp;
        baseHp -= e.leak;
        log.push([tick, 'L', e.id, baseHp]);
        if (recorder && recorder.onLeak) recorder.onLeak(tick, e.id, e.type, e.leak, prevHp, baseHp);
        if (baseHp <= 0) {
          log.push([tick, 'F', currentWave, 0]);
          fallTick = tick;
          fell = true;
          if (recorder && recorder.onFall) recorder.onFall(tick, currentWave);
          break;
        }
      } else {
        const pos = posOnPath(e.air ? AIR_PATH : GROUND_PATH, e.progress);
        e.x = pos[0];
        e.y = pos[1];
        survivorsAfterMove.push(e);
      }
    }
    if (fell) {
      if (recorder && recorder.onTick) recorder.onTick(tick, currentWave, gold, baseHp, slots, survivorsAfterMove, previewWave);
      break;
    }
    enemies = survivorsAfterMove;

    // 4. Age & heal
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      e.age += 1;
      if (e.type === 'mender' && e.age % 20 === 0) {
        const mx = e.x;
        const my = e.y;
        if (recorder && recorder.onHeal) recorder.onHeal(tick, mx, my);
        for (let j = 0; j < enemies.length; j++) {
          const t = enemies[j];
          const dx = t.x - mx;
          const dy = t.y - my;
          if (dx * dx + dy * dy <= 22500) {
            const heal = Math.floor((t.maxHp * 8) / 100);
            t.hp = Math.min(t.maxHp, t.hp + heal);
          }
        }
      }
    }

    // 5. Turrets fire
    for (let sIdx = 0; sIdx < 16; sIdx++) {
      const sl = slots[sIdx];
      const tr = sl.turret;
      if (!tr) continue;
      if (tr.cd > 0) {
        tr.cd -= 1;
        if (tr.cd > 0) continue;
      }
      const def = TURRET_TYPES[tr.type];
      const range = def.range + (tr.tier - 1) * 30;
      const r2 = range * range;
      const cands = [];
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (e.air ? !def.air : !def.ground) continue;
        const dx = e.x - sl.x;
        const dy = e.y - sl.y;
        if (dx * dx + dy * dy <= r2) cands.push(e);
      }
      if (cands.length === 0) continue;

      let targetEnemy = null;
      if (hasTarget) {
        const tView = { slot: sl.slot, type: tr.type, tier: tr.tier, x: sl.x, y: sl.y, range: range };
        const candViews = cands.map(makeEnemyView);
        const chosenId = strategy.target(tView, candViews);
        for (let i = 0; i < cands.length; i++) {
          if (cands[i].id === chosenId) {
            targetEnemy = cands[i];
            break;
          }
        }
      }
      if (!targetEnemy) {
        let bestRem = Infinity;
        for (let i = 0; i < cands.length; i++) {
          const e = cands[i];
          const rem = (e.air ? AIR_PATH.len : GROUND_PATH.len) - e.progress;
          if (rem < bestRem) {
            bestRem = rem;
            targetEnemy = e;
          }
        }
      }

      if (recorder && recorder.onShot) {
        recorder.onShot(tick, sl.slot, tr.type, tr.tier, sl.x, sl.y, targetEnemy.x, targetEnemy.y, targetEnemy.air, def.splash);
      }

      const dmg = turretDamage(def.dmg, tr.tier);
      if (def.splash > 0) {
        const sp2 = def.splash * def.splash;
        const tx = targetEnemy.x;
        const ty = targetEnemy.y;
        for (let i = 0; i < enemies.length; i++) {
          const e = enemies[i];
          if (e.air ? !def.air : !def.ground) continue;
          const dx = e.x - tx;
          const dy = e.y - ty;
          if (dx * dx + dy * dy <= sp2) {
            const dealt = def.pierce ? dmg : Math.max(1, dmg - e.armor);
            e.hp -= dealt;
            if (def.slow > 0) e.slow = def.slow;
          }
        }
      } else {
        const dealt = def.pierce ? dmg : Math.max(1, dmg - targetEnemy.armor);
        targetEnemy.hp -= dealt;
        if (def.slow > 0) targetEnemy.slow = def.slow;
      }

      tr.cd = def.period;

      const nextEnemies = [];
      const spawned = [];
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (e.hp <= 0) {
          gold += e.bounty;
          log.push([tick, 'K', e.id, sl.slot]);
          if (recorder && recorder.onKill) recorder.onKill(tick, e.id, e.type, e.x, e.y, e.air);
          if (e.type === 'splitter') {
            const sHp = Math.max(1, Math.floor(e.maxHp / 4));
            for (let k = 0; k < 3; k++) {
              spawned.push({
                id: nextEnemyId++,
                type: 'splitling',
                wave: e.wave,
                hp: sHp,
                maxHp: sHp,
                speed: 12,
                armor: 0,
                bounty: 1,
                leak: 1,
                air: 0,
                progress: e.progress,
                x: e.x,
                y: e.y,
                age: 0,
                slow: 0
              });
            }
          }
        } else {
          nextEnemies.push(e);
        }
      }
      for (let i = 0; i < spawned.length; i++) nextEnemies.push(spawned[i]);
      enemies = nextEnemies;
    }

    // 6. Slow timers
    for (let i = 0; i < enemies.length; i++) {
      if (enemies[i].slow > 0) enemies[i].slow -= 1;
    }

    if (recorder && recorder.onTick) {
      recorder.onTick(tick, currentWave, gold, baseHp, slots, enemies, previewWave);
    }
  }

  const endTick = fallTick >= 0 ? fallTick : maxTicks;
  const score = Math.round(((endTick - 20) / 40) * 100) / 100;

  const str = JSON.stringify(log);
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  const hash = (h >>> 0).toString(16).padStart(8, '0');

  return { score: score, fallTick: fallTick, log: log, hash: hash };
}

<script>
(function () {

  // =========================================================================

  // =========================================================================
  const DURATION = 100;

  function makeRng(a) {

      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;

  }

  const visRng = makeRng(42);
  const audRng = makeRng(4242);

  ];

  const ENEMY_TYPES = ['grunt', 'runner', 'wisp', 'brute', 'splitter', 'mender', 'splitling'];
  const ENEMY_TYPE_IDX = { grunt: 0, runner: 1, wisp: 2, brute: 3, splitter: 4, mender: 5, splitling: 6 };
  const ENEMY_COLORS = {
    grunt:     0x6e8b6a,
    runner:    0xf7d23b,
    wisp:      0x3ef2ff,
    brute:     0x353b47,
    splitter:  0x9a4dff,
    mender:    0xf2f6fa,
    splitling: 0xc285ff
  };
  const TURRET_TYPES = ['bolt', 'cannon', 'frost', 'lance', 'flak'];
  const TURRET_TYPE_IDX = { bolt: 0, cannon: 1, frost: 2, lance: 3, flak: 4 };
  const TURRET_COLORS = {
    bolt:   0x5a94e0,
    cannon: 0xd0883e,
    frost:  0xe0f7ff,
    lance:  0xe02c3d,
    flak:   0x1ec4b2
  };

  // Precompute polyline directions for smooth enemy orientation
  function buildPathHeading(pts) {
    const segs = [];
    let total = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const x0 = pts[i][0] * 100 + 50;
      const y0 = pts[i][1] * 100 + 50;
      const x1 = pts[i + 1][0] * 100 + 50;
      const y1 = pts[i + 1][1] * 100 + 50;
      const dx = x1 - x0;
      const dy = y1 - y0;
      const len = Math.abs(dx) + Math.abs(dy);
      segs.push({ start: total, end: total + len, ang: Math.atan2(dx, dy) });
      total += len;
    }
    return segs;
  }
  const G_SEGS_H = buildPathHeading(GROUND_WAYPOINTS);
  const A_SEGS_H = buildPathHeading(AIR_WAYPOINTS);
  function headingAt(air, prog) {
    const segs = air ? A_SEGS_H : G_SEGS_H;
    for (let i = 0; i < segs.length; i++) {

    }
    return segs[segs.length - 1].ang;
  }

  // Record complete replay from rampartSimulate(createStrategy, 42, 2020, recorder)
  const ticksData = new Array(MAX_TICKS);

  // Compact nextWave count array [grunt, runner, wisp, brute, splitter, mender]
  function countWaveComp(comp) {
    const c = [0, 0, 0, 0, 0, 0];
    for (let i = 0; i < comp.length; i++) {
      const idx = ENEMY_TYPE_IDX[comp[i]];
      if (idx !== undefined && idx < 6) c[idx]++;
    }
    return c;
  }

  const recorder = {
    onWave: function (tick, wave) {

    onAction: function (tick, op, slot, type, tier) {
      actionsEv.push({ t: tick / TICKS_PER_SEC, tick: tick, op: op, slot: slot, type: type, tier: tier });
    },
    onShot: function (tick, slot, type, tier, sx, sy, tx, ty, air, splash) {
      lastAim[slot] = Math.atan2(tx - sx, ty - sy);
      shots.push({
        t: tick / TICKS_PER_SEC,

        slot: slot,

        tier: tier,
        sx: sx / 100,
        sz: sy / 100,
        tx: tx / 100,
        tz: ty / 100,

        splash: splash / 100
      });
    },
    onKill: function (tick, id, type, x, y, air) {
      kills.push({ t: tick / TICKS_PER_SEC, tick: tick, id: id, type: type, x: x / 100, z: y / 100, air: air });
    },
    onHeal: function (tick, x, y) {
      heals.push({ t: tick / TICKS_PER_SEC, tick: tick, x: x / 100, z: y / 100 });
    },
    onLeak: function (tick, id, type, dmg, prevHp, newHp) {
      leaksEv.push({ t: tick / TICKS_PER_SEC, tick: tick, id: id, type: type, dmg: dmg, prevHp: prevHp, newHp: newHp });
    },
    onFall: function (tick) {
      recordedFallTick = tick;
    },
    onTick: function (tick, wave, gold, baseHp, slots, enemies, previewWave) {
      const slotSnap = new Array(16);
      for (let i = 0; i < 16; i++) {
        const t = slots[i].turret;
        slotSnap[i] = t ? (TURRET_TYPE_IDX[t.type] | (t.tier << 3)) : -1;
      }
      const enCount = enemies.length;
      const eIds = new Int32Array(enCount);
      const eTypes = new Uint8Array(enCount);
      const eX = new Float32Array(enCount);
      const eZ = new Float32Array(enCount);
      const eHpFrac = new Float32Array(enCount);
      const eSlow = new Uint8Array(enCount);
      const eAng = new Float32Array(enCount);
      const eIdMap = Object.create(null);

      for (let i = 0; i < enCount; i++) {
        const e = enemies[i];
        eIds[i] = e.id;
        eTypes[i] = ENEMY_TYPE_IDX[e.type];
        eX[i] = e.x / 100;
        eZ[i] = e.y / 100;
        eHpFrac[i] = Math.max(0, Math.min(1, e.hp / Math.max(1, e.maxHp)));
        eSlow[i] = e.slow > 0 ? 1 : 0;
        eAng[i] = headingAt(e.air, e.progress);
        eIdMap[e.id] = i;
      }

      ticksData[tick] = {
        tick: tick,
        wave: wave,
        gold: gold,
        baseHp: Math.max(0, baseHp),
        slots: slotSnap,
        aim: new Float32Array(lastAim),
        preview: countWaveComp(previewWave),
        n: enCount,
        eIds: eIds,
        eTypes: eTypes,
        eX: eX,
        eZ: eZ,
        eHpFrac: eHpFrac,
        eSlow: eSlow,
        eAng: eAng,
        eIdMap: eIdMap
      };
      lastRecordedTick = tick;
    }
  };

  const simResult42 = rampartSimulate(createStrategy, 42, MAX_TICKS, recorder);
  const fallTime = recordedFallTick >= 0 ? recordedFallTick / TICKS_PER_SEC : 1e9;

  // Fill frozen post-fall ticks with the exact fall tick state
  if (lastRecordedTick >= 0 && lastRecordedTick < MAX_TICKS - 1) {
    const frozen = ticksData[lastRecordedTick];
    for (let t = lastRecordedTick + 1; t < MAX_TICKS; t++) {

  // Precompute closed-form trauma timeline (each leak +0.3, fall +1.0, linear decay 1.0/s clamped [0,1])
  const traumaEvents = [];
  {
    const rawEv = [];
    for (let i = 0; i < leaksEv.length; i++) rawEv.push({ t: leaksEv[i].t, amt: 0.3 });
    if (recordedFallTick >= 0) rawEv.push({ t: fallTime, amt: 1.0 });
    rawEv.sort(function (a, b) { return a.t - b.t; });
    let curT = 0;
    let prevTime = -1e9;
    for (let i = 0; i < rawEv.length; i++) {
      const ev = rawEv[i];
      curT = Math.min(1.0, Math.max(0.0, curT - Math.max(0, ev.t - prevTime)) + ev.amt);
      traumaEvents.push({ t: ev.t, val: curT });
      prevTime = ev.t;
    }
  }

  function traumaAt(simTime) {
    let idx = -1;
    for (let i = 0; i < traumaEvents.length; i++) {
      if (traumaEvents[i].t <= simTime) idx = i;
      else break;
    }
    if (idx < 0) return 0;
    return Math.max(0, traumaEvents[idx].val - (simTime - traumaEvents[idx].t));
  }

  // Smooth closed-form 1D seeded value noise for deterministic trauma shake
  const NOISE_LEN = 256;
  const noiseTblA = new Float32Array(NOISE_LEN);
  const noiseTblB = new Float32Array(NOISE_LEN);
  const noiseTblC = new Float32Array(NOISE_LEN);
  for (let i = 0; i < NOISE_LEN; i++) {
    noiseTblA[i] = visRng() * 2 - 1;
    noiseTblB[i] = visRng() * 2 - 1;
    noiseTblC[i] = visRng() * 2 - 1;
  }
  function smoothNoise(tbl, x) {
    const xi = Math.floor(x);
    const f = x - xi;
    const u = f * f * (3 - 2 * f);
    const i0 = ((xi % NOISE_LEN) + NOISE_LEN) % NOISE_LEN;
    const i1 = (i0 + 1) % NOISE_LEN;
    return tbl[i0] * (1 - u) + tbl[i1] * u;
  }

  // Precompute pip-loss timestamps (pip index 9 down to 0)

    const lo = Math.max(0, lk.newHp);
    for (let p = lo; p < hi; p++) {

    }
  }

  // Precompute per-tick event index lookup for fast O(log N) range queries during rendering & audio
  function lowerBoundTime(arr, t) {
    let lo = 0, hi = arr.length;
    while (lo < hi) {
      const mid = (lo + hi) >>> 1;
      if (arr[mid].t < t) lo = mid + 1;

  // Precompute seeded visual debris seeds for each kill

      const rx = (visRng() - 0.5) * 12;
      const rz = (visRng() - 0.5) * 12;
      parts.push({ vx: Math.cos(ang) * spd, vy: vy, vz: Math.sin(ang) * spd, sz: sz, rx: rx, rz: rz });
    }

  // =========================================================================

  // Shared uniform for 1.0s post-fall desaturation to near-greyscale (preserves full MSAA + alpha!)

  // Fixed PerspectiveCamera framed dynamically on resize (55° elevation, >=0.5 tile margin, clear of bottom 90px dock)
  const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 500);
  const camBasePos = new THREE.Vector3();
  const camBaseTarget = new THREE.Vector3(12, 0, 7);

  function frameBoardCamera(W, H) {
    camera.aspect = W / Math.max(1, H);
    camera.updateProjectionMatrix();

    const elev = 55 * Math.PI / 180;
    const dirY = Math.sin(elev);
    const dirZ = Math.cos(elev);
    const margin = 0.65;
    const corners = [
      new THREE.Vector3(-margin, 0, -margin),
      new THREE.Vector3(24 + margin, 0, -margin),
      new THREE.Vector3(-margin, 0, 14 + margin),
      new THREE.Vector3(24 + margin, 0, 14 + margin),
      new THREE.Vector3(-margin, 1.8, -margin),
      new THREE.Vector3(24 + margin, 1.8, -margin),
      new THREE.Vector3(-margin, 1.8, 14 + margin),
      new THREE.Vector3(24 + margin, 1.8, 14 + margin)
    ];

    const bottomNdcMin = -1.0 + 2.0 * (98 / Math.max(200, H));
    const topNdcMax = 0.94;
    const xNdcMax = 0.95;

    // Solve for targetZ and distance D so board is centered vertically in the safe band [bottomNdcMin, topNdcMax]
    let bestD = 26;
    let bestTz = 7.4;
    for (let iter = 0; iter < 6; iter++) {
      // Binary search distance D for current bestTz
      let lo = 12, hi = 65;
      for (let b = 0; b < 24; b++) {
        const mid = 0.5 * (lo + hi);
        camera.position.set(12, mid * dirY, bestTz + mid * dirZ);
        camera.lookAt(12, 0, bestTz);
        camera.updateMatrixWorld(true);
        let fits = true;
        for (let i = 0; i < corners.length; i++) {
          const p = corners[i].clone().project(camera);
          if (Math.abs(p.x) > xNdcMax || p.y < bottomNdcMin || p.y > topNdcMax) {
            fits = false;
            break;
          }
        }
        if (fits) hi = mid;
        else lo = mid;
      }
      bestD = hi;
      // Measure actual vertical NDC bounds and recenter inside [bottomNdcMin, topNdcMax]
      camera.position.set(12, bestD * dirY, bestTz + bestD * dirZ);
      camera.lookAt(12, 0, bestTz);
      camera.updateMatrixWorld(true);
      let minY = 9, maxY = -9;
      for (let i = 0; i < corners.length; i++) {
        const p = corners[i].clone().project(camera);
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
      }
      const desiredMid = 0.5 * (bottomNdcMin + topNdcMax);
      const actualMid = 0.5 * (minY + maxY);
      bestTz += (actualMid - desiredMid) * 4.5;
    }

    camBaseTarget.set(12, 0, bestTz);
    camBasePos.set(12, bestD * dirY, bestTz + bestD * dirZ);
    camera.position.copy(camBasePos);
    camera.lookAt(camBaseTarget);
    camera.updateMatrixWorld(true);
  }

  // =========================================================================

  function makeTerrainTexture() {
    const c = document.createElement('canvas');
    c.width = 512;
    c.height = 512;

    ctx.fillStyle = '#242b2d';

      const x = visRng() * 512;

      ctx.fillStyle = tone < 0.35 ? 'rgba(30, 44, 38, 0.25)'
        : tone < 0.7 ? 'rgba(48, 56, 62, 0.22)'
        : 'rgba(22, 26, 33, 0.25)';
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    // Fine grit speckles
    for (let i = 0; i < 2400; i++) {
      const x = visRng() * 512;
      const y = visRng() * 512;
      const b = 35 + Math.floor(visRng() * 45);
      ctx.fillStyle = 'rgba(' + b + ',' + (b + 6) + ',' + (b + 5) + ',0.22)';
      ctx.fillRect(x, y, 2, 2);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(6, 3.5);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  function makeCobbleTexture() {
    const c = document.createElement('canvas');
    c.width = 256;

    ctx.fillStyle = '#1b1d24';
    ctx.fillRect(0, 0, 256, 256);
    const rows = 8;
    const cols = 4;
    const rh = 256 / rows;
    const cw = 256 / cols;
    for (let r = 0; r < rows; r++) {
      const off = (r % 2) * (cw * 0.5);
      for (let col = -1; col <= cols; col++) {
        const shade = 48 + Math.floor(visRng() * 22);
        ctx.fillStyle = 'rgb(' + shade + ',' + (shade + 2) + ',' + (shade + 8) + ')';
        ctx.fillRect(col * cw + off + 2, r * rh + 2, cw - 4, rh - 4);
      }
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  // Faint glowing air lane along (0,6) -> (21,6) -> (21,11) -> (23,11) at y = 0.8
  function makeAirLaneTexture() {
    const c = document.createElement('canvas');
    c.width = 64;
    c.height = 128;
    const ctx = c.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, 64, 0);
    grad.addColorStop(0.0, 'rgba(60, 240, 255, 0.0)');
    grad.addColorStop(0.25, 'rgba(60, 240, 255, 0.22)');

    ctx.stroke();
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = THREE.ClampToEdgeWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }
  const airLaneTextures = [];
  for (let i = 0; i < AIR_WAYPOINTS.length - 1; i++) {
    const x0 = AIR_WAYPOINTS[i][0] + 0.5;
    const z0 = AIR_WAYPOINTS[i][1] + 0.5;

    const dx = x1 - x0;
    const dz = z1 - z0;
