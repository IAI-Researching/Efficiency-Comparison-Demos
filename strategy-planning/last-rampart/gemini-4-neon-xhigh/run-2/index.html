<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Last Rampart: Wave Defense Strategist</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="100" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script id="rampart-strategy">
function createStrategy() {
  const COST = { bolt: 50, cannon: 90, frost: 70, lance: 120, flak: 80 };
  const DMG = {
    bolt:   [0, 26, 41, 65],
    cannon: [0, 60, 96, 153],
    frost:  [0, 10, 16, 25],
    lance:  [0, 180, 288, 460],
    flak:   [0, 40, 64, 102]
  };
  const SPEED = { grunt: 10, runner: 20, wisp: 12, brute: 6, splitter: 8, mender: 8, splitling: 12 };
  const LEAK = { grunt: 1, runner: 1, wisp: 2, brute: 3, splitter: 2, mender: 2, splitling: 1 };
  const RANGE3 = { bolt: 360, cannon: 320, frost: 300, lance: 420, flak: 380 };
  const SLOT_VALUE_G = [820,820,650,850,1030,490,850,650,890,630,490,810,820,850,350,230];
  const SLOT_VALUE_A = [470,730,650,650,470,730,650,650,730,0,730,650,1060,670,840,670];

  // Optimal 16-slot architecture:
  // - Slot 15: Tier-2 Frost (range 270 -> 100% dedicated to slowing wisps at air spawn [0..660], zero ground distraction)
  // - Slots 0..3: Four overlapping Flak T3s over the frost-clumped air kill-zone [70..1020]
  // - Slots 4..11, 13: Nine rear-concentrated Cannon T3s covering [1190..4600] where ground packs threaten the keep
  // - Slots 12, 14: Dual Bolt T3 finishers at the base covering both rear air and fast ground leaks with triage
  const SLOT_TYPES = [
    "flak", "flak", "flak", "flak",
    "cannon", "cannon", "cannon", "cannon",
    "cannon", "cannon", "cannon", "cannon",
    "bolt", "cannon", "bolt", "frost"
  ];

  const BUILD_SLOTS = [];
  for (let i = 0; i < 16; i++) BUILD_SLOTS.push(i);
  BUILD_SLOTS.sort((a, b) => {
    const scoreOf = (s, t) => {
      if (t === "cannon") return SLOT_VALUE_G[s] * 1.2 + (s >= 6 ? 180 : 0) + (s === 4 || s === 8 || s === 13 ? 250 : 0);
      if (t === "flak") return SLOT_VALUE_A[s] * 1.1 + (s >= 12 ? 300 : 0);
      if (t === "bolt") return SLOT_VALUE_G[s] * 0.9 + SLOT_VALUE_A[s] * 0.7 + (s >= 12 ? 250 : 0);
      if (t === "lance") return SLOT_VALUE_G[s] * 0.95;
      return 650;
    };
    return scoreOf(b, SLOT_TYPES[b]) - scoreOf(a, SLOT_TYPES[a]);
  });
  const DPS_SLOTS = BUILD_SLOTS.filter(s => SLOT_TYPES[s] !== "frost");
  const FROST_SLOTS = BUILD_SLOTS.filter(s => SLOT_TYPES[s] === "frost");

  let slowSeq = 0;
  const lastSlow = new Map();
  let lastPlanTick = 0;
  const remAtPlan = new Map();
  const lastFireTick = new Int32Array(16);
  for (let i = 0; i < 16; i++) lastFireTick[i] = -999;
  const everSlowed = new Set();
  let liquidated = false;

  return {
    plan(state) {
      const actions = [];
      let g = state.gold;
      const w = state.wave;
      lastPlanTick = state.tick;

      remAtPlan.clear();
      for (let i = 0; i < state.enemies.length; i++) {
        const e = state.enemies[i];
        if (!e.air && !e.slowed && !everSlowed.has(e.id)) {
          remAtPlan.set(e.id, e.remaining);
        }
      }
      if (everSlowed.size > 500) everSlowed.clear();

      const cur = state.slots.map(s =>
        s.turret ? { type: s.turret.type, tier: s.turret.tier, spent: s.turret.spent } : null
      );

      function doBuild(slot, type) {
        const c = COST[type];
        if (cur[slot] || g < c || actions.length >= 32) return false;
        actions.push({ op: "build", slot, type });
        g -= c;
        cur[slot] = { type, tier: 1, spent: c };
        lastFireTick[slot] = -999;
        return true;
      }
      function doUpgrade(slot) {
        const t = cur[slot];
        if (!t || t.tier >= 3 || actions.length >= 32) return false;
        const c = t.tier === 1 ? COST[t.type] : COST[t.type] * 2;
        if (g < c) return false;
        actions.push({ op: "upgrade", slot });
        g -= c;
        t.tier += 1;
        t.spent += c;
        return true;
      }
      function doSell(slot) {
        const t = cur[slot];
        if (!t || actions.length >= 32) return false;
        actions.push({ op: "sell", slot });
        g += Math.floor(t.spent * 70 / 100);
        cur[slot] = null;
        lastFireTick[slot] = -999;
        return true;
      }

      let minTtlG = 99999;
      let minTtlA = 99999;
      let airCnt = 0;
      for (let i = 0; i < state.enemies.length; i++) {
        const e = state.enemies[i];
        const spd = SPEED[e.type] || 10;
        const ttl = e.remaining / spd;
        if (e.air) {
          airCnt++;
          if (ttl < minTtlA) minTtlA = ttl;
        } else {
          if (ttl < minTtlG) minTtlG = ttl;
        }
      }

      const firstAirSlot = 12;
      const rearGroundSlot = 13;

      if (!liquidated) {
        if (minTtlG < 115 && !cur[rearGroundSlot]) doBuild(rearGroundSlot, SLOT_TYPES[rearGroundSlot]);
        if (minTtlA < 135 && !cur[firstAirSlot]) doBuild(firstAirSlot, SLOT_TYPES[firstAirSlot]);
        if (w <= 6 && minTtlG > 110 && minTtlA > 130) return actions;
      }

      // Bank toward 1000 gold for maximum +50/wave interest while safely holding
      let reserve = 0;
      if (w < 34) {
        if (state.baseHp === 10 && minTtlG > 75 && minTtlA > 75) reserve = 1000;
        else if (state.baseHp >= 9 && minTtlG > 55 && minTtlA > 55) reserve = 500;
      }
      if (minTtlG < 50 || minTtlA < 50) reserve = 0;

      if (!liquidated) {
        if (minTtlG < 65 && cur[rearGroundSlot] && cur[rearGroundSlot].tier < 3) doUpgrade(rearGroundSlot);
        if (minTtlA < 75 && cur[firstAirSlot] && cur[firstAirSlot].tier < 3) doUpgrade(firstAirSlot);
      }

      const maxTierFor = s => (s === 15 ? 2 : 3);

      if (!liquidated) {
        let flaksBuilt = 0;
        for (let i = 0; i < 16; i++) if (cur[i] && cur[i].type === "flak") flaksBuilt++;

        for (let k = 0; k < BUILD_SLOTS.length; k++) {
          const s = BUILD_SLOTS[k];
          const t = SLOT_TYPES[s];
          if (cur[s]) continue;
          if (t === "flak" && w < 3 && airCnt === 0) continue;
          if (t === "flak" && flaksBuilt >= 1 && w < 14 && minTtlA > 90) continue;
          if (t === "flak" && flaksBuilt >= 2 && w < 22 && minTtlA > 85) continue;
          if (t === "flak" && flaksBuilt >= 3 && w < 28 && minTtlA > 85) continue;
          if (t === "flak" && flaksBuilt >= 4 && w < 32 && minTtlA > 85) continue;
          if (g - COST[t] >= reserve) {
            if (doBuild(s, t) && t === "flak") flaksBuilt++;
          } else {
            break;
          }
        }
        for (let k = 0; k < DPS_SLOTS.length; k++) {
          const s = DPS_SLOTS[k];
          if (!cur[s] || cur[s].tier >= Math.min(2, maxTierFor(s))) continue;
          if (g - COST[cur[s].type] >= reserve) doUpgrade(s);
          else break;
        }
        for (let k = 0; k < DPS_SLOTS.length; k++) {
          const s = DPS_SLOTS[k];
          if (!cur[s] || cur[s].tier >= Math.min(3, maxTierFor(s))) continue;
          if (g - COST[cur[s].type] * 2 >= reserve) doUpgrade(s);
          else break;
        }
        for (let tier = 2; tier <= 3; tier++) {
          for (let k = 0; k < FROST_SLOTS.length; k++) {
            const s = FROST_SLOTS[k];
            if (!cur[s] || cur[s].tier >= Math.min(tier, maxTierFor(s))) continue;
            const c = tier === 2 ? COST.frost : COST.frost * 2;
            if (g - c >= reserve) doUpgrade(s);
            else break;
          }
        }
      }

      let allMax = true;
      if (!liquidated) {
        for (let i = 0; i < 16; i++) {
          if (!cur[i] || cur[i].tier < maxTierFor(i)) {
            allMax = false;
            break;
          }
        }
      }

      // Last-stand front liquidation: sell early-lane turrets whose targets won't arrive before fall to fund rear resets
      if ((allMax || liquidated) && w >= 45 && state.baseHp <= 6 && g < 400) {
        const liqOrder = [15, 0, 1, 2, 3, 4];
        for (let i = 0; i < liqOrder.length; i++) {
          const s = liqOrder[i];
          if (cur[s] && g < 450 && actions.length < 24) {
            doSell(s);
            liquidated = true;
          }
        }
      }

      // Exact-cooldown-tracked cannon reset using surplus gold
      if (allMax || liquidated) {
        const desperate = state.baseHp <= 8 || minTtlG < 45 || w >= 43;
        const keep = desperate ? 0 : 1000;
        const minCd = desperate ? 10 : 16;
        const resetCands = [];

        for (let s = 0; s < 16; s++) {
          const t = cur[s];
          if (!t || (t.type !== "cannon" && t.type !== "lance")) continue;
          const period = t.type === "cannon" ? 24 : 36;
          const exactCd = Math.max(0, lastFireTick[s] + period - state.tick);
          if (exactCd < minCd) continue;

          const sx = state.slots[s].x;
          const sy = state.slots[s].y;
          const r = RANGE3[t.type];
          const r2 = r * r;
          const inRange = [];
          for (let j = 0; j < state.enemies.length; j++) {
            const e = state.enemies[j];
            if (e.air) continue;
            const dx = e.x - sx;
            const dy = e.y - sy;
            if (dx * dx + dy * dy <= r2) inRange.push(e);
          }
          if (inRange.length === 0) continue;

          let bestHitVal = 0;
          if (t.type === "cannon") {
            for (let a = 0; a < inRange.length; a++) {
              const cx = inRange[a].x;
              const cy = inRange[a].y;
              let v = 0;
              for (let b = 0; b < inRange.length; b++) {
                const e = inRange[b];
                const dx = e.x - cx;
                const dy = e.y - cy;
                if (dx * dx + dy * dy <= 8100) {
                  const eff = Math.max(1, 153 - e.armor);
                  v += Math.min(e.hp, eff) * (1 + 2500 / (e.remaining + 300));
                }
              }
              if (v > bestHitVal) bestHitVal = v;
            }
          } else {
            bestHitVal = 1380;
          }
          const netCost = t.spent - Math.floor(t.spent * 70 / 100);
          resetCands.push({ s, t, netCost, roi: (bestHitVal * exactCd) / netCost });
        }

        resetCands.sort((a, b) => b.roi - a.roi);
        for (let i = 0; i < resetCands.length; i++) {
          if (actions.length + 4 > 32) break;
          const rc = resetCands[i];
          if (g - rc.netCost >= keep) {
            const ty = rc.t.type;
            doSell(rc.s);
            doBuild(rc.s, ty);
            doUpgrade(rc.s);
            doUpgrade(rc.s);
          }
        }
      }

      return actions;
    },

    target(turret, candidates) {
      // Infer exact simulation tick from any tracked unslowed ground enemy
      let inferredTick = -1;
      for (let i = 0; i < candidates.length; i++) {
        const e = candidates[i];
        if (!e.air && !e.slowed) {
          const r0 = remAtPlan.get(e.id);
          if (r0 !== undefined) {
            const spd = SPEED[e.type];
            if (spd) {
              const dt = Math.round((r0 - e.remaining) / spd);
              if (dt >= 0 && dt <= 40) {
                inferredTick = lastPlanTick + dt;
                break;
              }
            }
          }
        } else if (e.slowed) {
          everSlowed.add(e.id);
        }
      }
      if (inferredTick >= 0) {
        lastFireTick[turret.slot] = inferredTick;
      } else if (lastFireTick[turret.slot] < lastPlanTick) {
        lastFireTick[turret.slot] = lastPlanTick + 20;
      }

      const type = turret.type;
      const dmg = DMG[type][turret.tier];

      if (type === "frost") {
        let bestId = candidates[0].id;
        let bestScore = -1e18;
        for (let i = 0; i < candidates.length; i++) {
          const e = candidates[i];
          const spd = SPEED[e.type] || 10;
          const ttl = e.remaining / spd;
          const unslowed = !e.slowed ? 1 : 0;
          const leakW = LEAK[e.type] || 1;
          const recency = lastSlow.get(e.id) || 0;
          let sc = unslowed * 10000000 - (unslowed ? 0 : recency * 200);
          if (e.type === "wisp") sc += 600000;
          else if (e.type === "runner") sc += 400000;
          sc += (80000 / (ttl + 10)) * leakW;
          if (sc > bestScore) {
            bestScore = sc;
            bestId = e.id;
          }
        }
        lastSlow.set(bestId, ++slowSeq);
        if (lastSlow.size > 600) {
          const cut = slowSeq - 300;
          for (const [k, v] of lastSlow) if (v < cut) lastSlow.delete(k);
        }
        return bestId;
      }

      if (type === "flak") {
        const spR2 = 4900;
        let bestId = candidates[0].id;
        let bestScore = -1e18;
        for (let i = 0; i < candidates.length; i++) {
          const c = candidates[i];
          const cx = c.x;
          const cy = c.y;
          let sc = 0;
          for (let j = 0; j < candidates.length; j++) {
            const e = candidates[j];
            const dx = e.x - cx;
            const dy = e.y - cy;
            if (dx * dx + dy * dy <= spR2) {
              const dealt = e.hp < dmg ? e.hp : dmg;
              const spd = e.slowed ? 7 : 12;
              const ttl = e.remaining / spd;
              const progFrac = 1 - e.remaining / 2800;
              let w = 0.5 + 1.5 * progFrac * progFrac;
              if (ttl < 55) w += 600 / (ttl + 5);
              if (e.hp <= dmg) w *= 2.2;
              w *= 1 + 1.5 * (1 - e.hp / e.maxHp);
              sc += dealt * w;
            }
          }
          if (sc > bestScore) {
            bestScore = sc;
            bestId = c.id;
          }
        }
        return bestId;
      }

      if (type === "cannon") {
        const spR2 = 8100;
        const rearBoost = turret.slot === 13 ? 2.0 : 1.0;
        let bestId = candidates[0].id;
        let bestScore = -1e18;
        for (let i = 0; i < candidates.length; i++) {
          const c = candidates[i];
          const cx = c.x;
          const cy = c.y;
          let sc = 0;
          for (let j = 0; j < candidates.length; j++) {
            const e = candidates[j];
            const dx = e.x - cx;
            const dy = e.y - cy;
            if (dx * dx + dy * dy <= spR2) {
              const eff = Math.max(1, dmg - e.armor);
              const dealt = e.hp < eff ? e.hp : eff;
              const spd = e.slowed ? Math.floor((SPEED[e.type] || 10) * 60 / 100) : (SPEED[e.type] || 10);
              const ttl = e.remaining / spd;
              const leakW = LEAK[e.type] || 1;
              const progFrac = 1 - e.remaining / 4600;
              let w = 0.5 + 2.2 * progFrac * progFrac;
              let unkillable = false;
              if (turret.slot === 13 && ttl < 24) {
                const boltHelp = (1 + Math.floor(Math.max(0, ttl - 1) / 8)) * Math.max(1, 65 - e.armor);
                if (e.hp > eff + boltHelp) unkillable = true;
              }
              if (unkillable) {
                w *= 0.05;
              } else {
                if (ttl < 48) w += (300 * leakW) / (ttl + 5);
                if (e.type === "mender") w *= 3.5;
                if (e.type === "runner") w *= 1.6 * rearBoost;
                if (e.type === "splitter" && e.remaining > 1200) w *= 1.3;
                if (e.hp <= eff) w *= 1.8;
              }
              sc += dealt * w;
            }
          }
          if (sc > bestScore) {
            bestScore = sc;
            bestId = c.id;
          }
        }
        return bestId;
      }

      if (type === "bolt") {
        let bestId = candidates[0].id;
        let bestScore = -1e18;
        for (let i = 0; i < candidates.length; i++) {
          const e = candidates[i];
          const eff = Math.max(1, dmg - e.armor);
          const dealt = e.hp < eff ? e.hp : eff;
          const spd = e.slowed ? Math.floor((SPEED[e.type] || 10) * 60 / 100) : (SPEED[e.type] || 10);
          const ttl = e.remaining / spd;
          const leakW = LEAK[e.type] || 1;

          let maxDmg = (1 + Math.floor(Math.max(0, ttl - 1) / 8)) * eff;
          if (turret.slot === 14) {
            if (!e.air && ttl >= 12) maxDmg += Math.max(1, 153 - e.armor);
            if ((e.air && e.remaining > 170) || (!e.air && e.remaining > 290)) {
              const remIn12 = e.air ? (e.remaining - 170) : (e.remaining - 290);
              maxDmg += (1 + Math.floor((remIn12 / spd) / 8)) * eff;
            }
          } else if (turret.slot === 12) {
            maxDmg += (1 + Math.floor(Math.max(0, ttl - 1) / 8)) * eff;
            if (!e.air) maxDmg += (1 + Math.floor(ttl / 24)) * Math.max(1, 153 - e.armor);
          }
          if (e.hp > maxDmg) {
            const fallback = dealt * 0.0001;
            if (fallback > bestScore) {
              bestScore = fallback;
              bestId = e.id;
            }
            continue;
          }

          let sc = dealt * (1 + 300 / (ttl + 10)) * leakW;
          if (e.type === "mender") sc *= 3.0;
          if (e.hp <= eff) sc *= 3.5;
          if (ttl < 55) sc += 150000 * leakW / (ttl + 2);
          if (sc > bestScore) {
            bestScore = sc;
            bestId = e.id;
          }
        }
        return bestId;
      }

      if (type === "lance") {
        let bestId = candidates[0].id;
        let bestScore = -1e18;
        for (let i = 0; i < candidates.length; i++) {
          const e = candidates[i];
          const spd = e.slowed ? Math.floor((SPEED[e.type] || 10) * 60 / 100) : (SPEED[e.type] || 10);
          const ttl = e.remaining / spd;
          const leakW = LEAK[e.type] || 1;
          const dealt = e.hp < dmg ? e.hp : dmg;
          let sc = dealt * (1 + 200 / (ttl + 15));
          if (e.type === "mender") sc *= 4.0;
          else if (e.type === "brute") sc *= 2.5;
          if (e.hp <= dmg) sc *= 2.0;
          if (ttl < 45) sc += 200000 * leakW / (ttl + 2);
          if (sc > bestScore) {
            bestScore = sc;
            bestId = e.id;
          }
        }
        return bestId;
      }

      return candidates[0].id;
    }
  };

<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks) {
  const rec = arguments[3];

  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return (t ^ (t >>> 14)) >>> 0;
    };
  }

  const GROUND_PTS = [
    [50, 250], [650, 250], [650, 1050], [1250, 1050],
    [1250, 350], [1850, 350], [1850, 1150], [2350, 1150]
  ];
  const AIR_PTS = [
    [50, 650], [2150, 650], [2150, 1150], [2350, 1150]
  ];

  function buildRoute(pts) {
    const segs = [];
    let total = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const x0 = pts[i][0], y0 = pts[i][1];
      const x1 = pts[i + 1][0], y1 = pts[i + 1][1];
      const dx = x1 - x0, dy = y1 - y0;
      const len = Math.abs(dx) + Math.abs(dy);
      const sx = dx === 0 ? 0 : (dx > 0 ? 1 : -1);
      const sy = dy === 0 ? 0 : (dy > 0 ? 1 : -1);
      segs.push({ x0, y0, sx, sy, start: total, len });
      total += len;
    }
    return { segs, len: total };
  }

  const GROUND_ROUTE = buildRoute(GROUND_PTS);
  const AIR_ROUTE = buildRoute(AIR_PTS);
  const GROUND_LEN = GROUND_ROUTE.len;
  const AIR_LEN = AIR_ROUTE.len;

  function posOnRoute(route, progress) {
    const segs = route.segs;
    for (let i = 0; i < segs.length; i++) {
      const s = segs[i];
      if (progress <= s.start + s.len) {
        const d = progress - s.start;
        return [s.x0 + s.sx * d, s.y0 + s.sy * d, s.sx, s.sy];
      }
    }
    const last = segs[segs.length - 1];
    return [last.x0 + last.sx * last.len, last.y0 + last.sy * last.len, last.sx, last.sy];
  }

  const SLOT_COORDS = [
    [3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],
    [14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]
  ];

  const TURRET_SPECS = {
    bolt:   { idx: 0, cost: 50,  dmg: 26,  period: 8,  range: 300, splash: 0,  slow: 0,  pierce: false, ground: true,  air: true  },
    cannon: { idx: 1, cost: 90,  dmg: 60,  period: 24, range: 260, splash: 90, slow: 0,  pierce: false, ground: true,  air: false },
    frost:  { idx: 2, cost: 70,  dmg: 10,  period: 12, range: 240, splash: 0,  slow: 30, pierce: false, ground: true,  air: true  },
    lance:  { idx: 3, cost: 120, dmg: 180, period: 36, range: 360, splash: 0,  slow: 0,  pierce: true,  ground: true,  air: false },
    flak:   { idx: 4, cost: 80,  dmg: 40,  period: 10, range: 320, splash: 70, slow: 0,  pierce: false, ground: false, air: true  }
  };

  const ENEMY_ORDER = ["grunt", "runner", "wisp", "brute", "splitter", "mender"];
  const ENEMY_SPECS = {
    grunt:     { idx: 0, baseHp: 60,  speed: 10, bounty: 4, leak: 1, air: 0, firstWave: 1,   weight: 10 },
    runner:    { idx: 1, baseHp: 40,  speed: 20, bounty: 4, leak: 1, air: 0, firstWave: 2,   weight: 4  },
    wisp:      { idx: 2, baseHp: 50,  speed: 12, bounty: 6, leak: 2, air: 1, firstWave: 3,   weight: 3  },
    brute:     { idx: 3, baseHp: 150, speed: 6,  bounty: 9, leak: 3, air: 0, firstWave: 4,   weight: 3  },
    splitter:  { idx: 4, baseHp: 90,  speed: 8,  bounty: 6, leak: 2, air: 0, firstWave: 6,   weight: 2  },
    mender:    { idx: 5, baseHp: 70,  speed: 8,  bounty: 7, leak: 2, air: 0, firstWave: 8,   weight: 1  },
    splitling: { idx: 6, baseHp: 0,   speed: 12, bounty: 1, leak: 1, air: 0, firstWave: 999, weight: 0  }
  };

  function turretDamage(spec, tier) {
    let d = spec.dmg;
    for (let t = 1; t < tier; t++) d = Math.floor(d * 16 / 10);
    return d;
  }

  function turretRange(spec, tier) {
    return spec.range + 30 * (tier - 1);
  }

  function enemyArmor(type, wave) {
    if (type === "grunt") return Math.floor(wave / 4);
    if (type === "brute") return 6 + wave;
    return 0;
  }

  const rng = mulberry32(seed);
  function genWave(w) {
    const count = 4 + Math.floor(3 * w / 5);
    const avail = [];
    let totalW = 0;
    for (let i = 0; i < ENEMY_ORDER.length; i++) {
      const t = ENEMY_ORDER[i];
      const sp = ENEMY_SPECS[t];
      if (sp.firstWave <= w) {
        avail.push([t, sp.weight]);
        totalW += sp.weight;
      }
    }
    const comp = [];
    for (let i = 0; i < count; i++) {
      let r = rng() % totalW;
      for (let j = 0; j < avail.length; j++) {
        if (r < avail[j][1]) {
          comp.push(avail[j][0]);
          break;
        }
        r -= avail[j][1];
      }
    }
    return comp;
  }

  const hpMults = [0, 1000];
  function getHpMult(w) {
    while (hpMults.length <= w) {
      hpMults.push(Math.floor(hpMults[hpMults.length - 1] * 108 / 100));
    }
    return hpMults[w];
  }

  const strat = createStrategy();
  const hasTargetFn = strat && typeof strat.target === "function";

  let baseHp = 10;
  let gold = 250;
  let currentWave = 0;
  let nextEnemyId = 1;
  let fallTick = -1;
  const log = [];

  const slots = [];
  for (let i = 0; i < 16; i++) {
    slots.push({
      slot: i,
      x: SLOT_COORDS[i][0] * 100 + 50,
      y: SLOT_COORDS[i][1] * 100 + 50,
      turret: null
    });
  }

  let enemies = [];
  const spawnQueue = [];
  const waveComps = {};
  waveComps[1] = genWave(1);

  function makeEnemyView(e) {
    const routeLen = e.air ? AIR_LEN : GROUND_LEN;
    return {
      id: e.id,
      type: e.type,
      hp: e.hp,
      maxHp: e.maxHp,
      x: e.x,
      y: e.y,
      air: e.air,
      armor: e.armor,
      speed: e.speed,
      slowed: e.slow,
      remaining: routeLen - e.progress
    };
  }

  function updateEnemyPos(e) {
    const p = posOnRoute(e.air ? AIR_ROUTE : GROUND_ROUTE, e.progress);
    e.x = p[0];
    e.y = p[1];
    e.dx = p[2];
    e.dy = p[3];
  }

  for (let tick = 0; tick < maxTicks; tick++) {
    // 1. Wave start
    if (tick >= 20 && (tick - 20) % 40 === 0) {
      const w = 1 + (tick - 20) / 40;
      currentWave = w;
      gold += Math.min(50, Math.floor(gold * 5 / 100)) + 10 + 2 * w;
      waveComps[w + 1] = genWave(w + 1);
      if (rec && rec.onWaveStart) rec.onWaveStart(tick, w, waveComps[w + 1]);

      const stateView = {
        tick,
        wave: w,
        gold,
        baseHp,
        slots: slots.map(s => ({
          slot: s.slot,
          x: s.x,
          y: s.y,
          turret: s.turret ? { type: s.turret.type, tier: s.turret.tier, spent: s.turret.spent } : null
        })),
        enemies: enemies.map(makeEnemyView),
        nextWave: waveComps[w + 1].slice()
      };

      const actions = strat.plan(stateView);
      if (Array.isArray(actions)) {
        const lim = Math.min(actions.length, 32);
        for (let i = 0; i < lim; i++) {
          const act = actions[i];
          if (!act || typeof act !== "object") continue;
          const slIdx = act.slot;
          if (typeof slIdx !== "number" || !Number.isInteger(slIdx) || slIdx < 0 || slIdx >= 16) continue;
          const sl = slots[slIdx];
          if (act.op === "build") {
            if (sl.turret !== null) continue;
            const spec = TURRET_SPECS[act.type];
            if (!spec || gold < spec.cost) continue;
            gold -= spec.cost;
            sl.turret = {
              type: act.type,
              spec,
              tier: 1,
              spent: spec.cost,
              cooldown: 0,
              dmg: turretDamage(spec, 1),
              range: turretRange(spec, 1)
            };
            log.push([tick, "B", slIdx, spec.idx]);
            if (rec && rec.onSlotAction) rec.onSlotAction(tick, slIdx, "B", spec.idx, 1);
          } else if (act.op === "upgrade") {
            if (sl.turret === null || sl.turret.tier >= 3) continue;
            const cost = sl.turret.tier === 1 ? sl.turret.spec.cost : sl.turret.spec.cost * 2;
            if (gold < cost) continue;
            gold -= cost;
            sl.turret.tier += 1;
            sl.turret.spent += cost;
            sl.turret.dmg = turretDamage(sl.turret.spec, sl.turret.tier);
            sl.turret.range = turretRange(sl.turret.spec, sl.turret.tier);
            log.push([tick, "U", slIdx, sl.turret.tier]);
            if (rec && rec.onSlotAction) rec.onSlotAction(tick, slIdx, "U", sl.turret.spec.idx, sl.turret.tier);
          } else if (act.op === "sell") {
            if (sl.turret === null) continue;
            const oldIdx = sl.turret.spec.idx;
            const oldTier = sl.turret.tier;
            gold += Math.floor(sl.turret.spent * 70 / 100);
            sl.turret = null;
            log.push([tick, "S", slIdx, 0]);
            if (rec && rec.onSlotAction) rec.onSlotAction(tick, slIdx, "S", oldIdx, oldTier);
          }
        }
      }

      const comp = waveComps[w];
      for (let i = 0; i < comp.length; i++) {
        spawnQueue.push({ tick: tick + 4 * i, wave: w, idx: i, type: comp[i] });
      }
      spawnQueue.sort((a, b) => (a.tick - b.tick) || (a.wave - b.wave) || (a.idx - b.idx));
    }

    // 2. Spawn
    let sqStart = 0;
    while (sqStart < spawnQueue.length && spawnQueue[sqStart].tick === tick) {
      const item = spawnQueue[sqStart++];
      const sp = ENEMY_SPECS[item.type];
      const maxHp = Math.floor(sp.baseHp * getHpMult(item.wave) / 1000);
      const e = {
        id: nextEnemyId++,
        type: item.type,
        typeIdx: sp.idx,
        wave: item.wave,
        hp: maxHp,
        maxHp,
        speed: sp.speed,
        armor: enemyArmor(item.type, item.wave),
        bounty: sp.bounty,
        leak: sp.leak,
        air: sp.air,
        progress: 0,
        x: 0,
        y: 0,
        dx: 1,
        dy: 0,
        age: 0,
        slow: 0
      };
      updateEnemyPos(e);
      enemies.push(e);
    }
    if (sqStart > 0) spawnQueue.splice(0, sqStart);

    // 3. Move
    let fell = false;
    const survivors = [];
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      const step = e.slow > 0 ? Math.floor(e.speed * 60 / 100) : e.speed;
      e.progress += step;
      const routeLen = e.air ? AIR_LEN : GROUND_LEN;
      if (e.progress >= routeLen) {
        baseHp -= e.leak;
        log.push([tick, "L", e.id, baseHp]);
        if (rec && rec.onLeak) rec.onLeak(tick, e.id, e.leak, baseHp, e.air);
        if (baseHp <= 0) {
          log.push([tick, "F", currentWave, 0]);
          fallTick = tick;
          fell = true;
          if (rec && rec.onFall) rec.onFall(tick, currentWave);
          break;
        }
      } else {
        updateEnemyPos(e);
        survivors.push(e);
      }
    }
    if (fell) {
      if (rec && rec.onTick) rec.onTick(tick, currentWave, gold, baseHp, slots, survivors, waveComps[currentWave + 1] || waveComps[1]);
      break;
    }
    enemies = survivors;

    // 4. Age & heal
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      e.age += 1;
      if (e.type === "mender" && e.age % 20 === 0) {
        const mx = e.x, my = e.y;
        if (rec && rec.onHeal) rec.onHeal(tick, mx, my);
        for (let j = 0; j < enemies.length; j++) {
          const t = enemies[j];
          const dx = t.x - mx, dy = t.y - my;
          if (dx * dx + dy * dy <= 22500) {
            const heal = Math.floor(t.maxHp * 8 / 100);
            t.hp = Math.min(t.maxHp, t.hp + heal);
          }
        }
      }
    }

    // 5. Turrets fire
    for (let si = 0; si < 16; si++) {
      const sl = slots[si];
      const tur = sl.turret;
      if (!tur) continue;
      if (tur.cooldown > 0) {
        tur.cooldown -= 1;
        if (tur.cooldown > 0) continue;
      }
      const spec = tur.spec;
      const rangeSq = tur.range * tur.range;
      const cands = [];
      for (let j = 0; j < enemies.length; j++) {
        const e = enemies[j];
        if (e.air ? !spec.air : !spec.ground) continue;
        const dx = e.x - sl.x, dy = e.y - sl.y;
        if (dx * dx + dy * dy <= rangeSq) cands.push(e);
      }
      if (cands.length === 0) continue;

      let chosen = null;
      if (hasTargetFn) {
        const turView = { slot: si, type: tur.type, tier: tur.tier, x: sl.x, y: sl.y, range: tur.range };
        const candViews = cands.map(makeEnemyView);
        const chosenId = strat.target(turView, candViews);
        for (let j = 0; j < cands.length; j++) {
          if (cands[j].id === chosenId) {
            chosen = cands[j];
            break;
          }
        }
      }
      if (!chosen) {
        let bestRem = Infinity;
        for (let j = 0; j < cands.length; j++) {
          const e = cands[j];
          const rem = (e.air ? AIR_LEN : GROUND_LEN) - e.progress;
          if (rem < bestRem) {
            bestRem = rem;
            chosen = e;
          }
        }
      }

      if (rec && rec.onShot) {
        rec.onShot(tick, si, spec.idx, tur.tier, sl.x, sl.y, chosen.x, chosen.y, spec.splash, chosen.air);
      }

      const dmg = tur.dmg;
      if (spec.splash > 0) {
        const spSq = spec.splash * spec.splash;
        const tx = chosen.x, ty = chosen.y;
        for (let j = 0; j < enemies.length; j++) {
          const e = enemies[j];
          if (e.air ? !spec.air : !spec.ground) continue;
          const dx = e.x - tx, dy = e.y - ty;
          if (dx * dx + dy * dy <= spSq) {
            const dealt = spec.pierce ? dmg : Math.max(1, dmg - e.armor);
            e.hp -= dealt;
            if (spec.slow > 0) e.slow = spec.slow;
          }
        }
      } else {
        const dealt = spec.pierce ? dmg : Math.max(1, dmg - chosen.armor);
        chosen.hp -= dealt;
        if (spec.slow > 0) chosen.slow = spec.slow;
      }

      tur.cooldown = spec.period;

      const alive = [];
      const spawned = [];
      for (let j = 0; j < enemies.length; j++) {
        const e = enemies[j];
        if (e.hp <= 0) {
          gold += e.bounty;
          log.push([tick, "K", e.id, si]);
          if (rec && rec.onKill) rec.onKill(tick, e.id, e.typeIdx, e.x, e.y, e.air);
          if (e.type === "splitter") {
            if (rec && rec.onSplit) rec.onSplit(tick, e.x, e.y);
            const sHp = Math.max(1, Math.floor(e.maxHp / 4));
            for (let k = 0; k < 3; k++) {
              spawned.push({
                id: nextEnemyId++,
                type: "splitling",
                typeIdx: 6,
                wave: e.wave,
                hp: sHp,
                maxHp: sHp,
                speed: 12,
                armor: 0,
                bounty: 1,
                leak: 1,
                air: 0,
                progress: e.progress,
                x: e.x,
                y: e.y,
                dx: e.dx,
                dy: e.dy,
                age: 0,
                slow: 0
              });
            }
          }
        } else {
          alive.push(e);
        }
      }
      for (let j = 0; j < spawned.length; j++) alive.push(spawned[j]);
      enemies = alive;
    }

    // 6. Slow timers
    for (let i = 0; i < enemies.length; i++) {
      if (enemies[i].slow > 0) enemies[i].slow -= 1;
    }

    if (rec && rec.onTick) {
      rec.onTick(tick, currentWave, gold, baseHp, slots, enemies, waveComps[currentWave + 1] || waveComps[1]);
    }
  }

  const endTick = fallTick >= 0 ? fallTick : maxTicks;
  const score = Math.round(((endTick - 20) / 40) * 100) / 100;
  const json = JSON.stringify(log);
  let h = 0x811c9dc5;
  for (let i = 0; i < json.length; i++) {
    h ^= json.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  const hash = (h >>> 0).toString(16).padStart(8, "0");
  return { score, fallTick, log, hash };
}

    const rng = makeRng(4201);

    ctx.fillStyle = "#232a27";

      const x = rng() * c.width;
      const y = rng() * c.height;

      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      const tone = rng();
      if (tone < 0.4) {
        g.addColorStop(0, "rgba(44, 54, 44, 0.28)");
      } else if (tone < 0.75) {
        g.addColorStop(0, "rgba(28, 33, 38, 0.30)");
      } else {
        g.addColorStop(0, "rgba(58, 52, 42, 0.22)");
      }
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    // Subtle stone grain
    for (let i = 0; i < 3200; i++) {
      const x = rng() * c.width;
      const y = rng() * c.height;
      const s = 1 + rng() * 2.5;
      ctx.fillStyle = rng() > 0.5 ? "rgba(255,255,255,0.035)" : "rgba(0,0,0,0.08)";
      ctx.fillRect(x, y, s, s);
    }

    // Subtle tile grid lines (24 x 14)
    ctx.strokeStyle = "rgba(180, 200, 220, 0.065)";
    ctx.lineWidth = 1;
    const tx = c.width / BOARD_W;
    const ty = c.height / BOARD_H;
    for (let x = 0; x <= BOARD_W; x++) {
      ctx.beginPath();
      ctx.moveTo(x * tx, 0);
      ctx.lineTo(x * tx, c.height);
      ctx.stroke();
    }
    for (let y = 0; y <= BOARD_H; y++) {
      ctx.beginPath();
      ctx.moveTo(0, y * ty);
      ctx.lineTo(c.width, y * ty);
      ctx.stroke();
    }

    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = 4;
    return tex;
  }

  function createRoadTexture() {
    const c = document.createElement("canvas");
    c.width = 256;
    c.height = 256;
    const ctx = c.getContext("2d");
    const rng = makeRng(4202);

    ctx.fillStyle = "#1c1f27";
    ctx.fillRect(0, 0, 256, 256);

    // Dark stone cobbles
    const rows = 8;
    const rh = 256 / rows;
    for (let r = 0; r < rows; r++) {
      const cols = 4;
      const cw = 256 / cols;
      const off = (r % 2) * (cw * 0.5);
      for (let col = -1; col <= cols; col++) {
        const bx = col * cw + off + 3;
        const by = r * rh + 3;
        const shade = 34 + Math.floor(rng() * 18);
        ctx.fillStyle = `rgb(${shade},${shade + 3},${shade + 9})`;
        ctx.fillRect(bx, by, cw - 6, rh - 6);
        ctx.fillStyle = "rgba(255,255,255,0.05)";
        ctx.fillRect(bx, by, cw - 6, 3);
      }
    }
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    tex.anisotropy = 4;
    return tex;
  }

  // Merge multi-part geometries with baked vertex colors for single-draw-call instanced silhouettes
  function mergeColoredParts(parts) {
    const prepared = [];
    let totalVerts = 0;
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      const g = p.geo.index ? p.geo.toNonIndexed() : p.geo.clone();
      if (p.mat4) g.applyMatrix4(p.mat4);
      g.computeVertexNormals();
      const pos = g.attributes.position;
      const norm = g.attributes.normal;
      const col = new THREE.Color(p.color);
      prepared.push({ pos, norm, col, count: pos.count });
      totalVerts += pos.count;
    }
    const positions = new Float32Array(totalVerts * 3);
    const normals = new Float32Array(totalVerts * 3);
    const colors = new Float32Array(totalVerts * 3);
    let offset = 0;
    for (let i = 0; i < prepared.length; i++) {
      const pr = prepared[i];
      positions.set(pr.pos.array, offset * 3);
      normals.set(pr.norm.array, offset * 3);
      for (let v = 0; v < pr.count; v++) {
        const idx = (offset + v) * 3;
        colors[idx] = pr.col.r;
        colors[idx + 1] = pr.col.g;
        colors[idx + 2] = pr.col.b;
      }
      offset += pr.count;
    }
    const out = new THREE.BufferGeometry();
    out.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    out.setAttribute("normal", new THREE.BufferAttribute(normals, 3));
    out.setAttribute("color", new THREE.BufferAttribute(colors, 3));
    return out;
  }

      q,
      new THREE.Vector3(sx || 1, sy || 1, sz || 1)
    );
    return m;
  }

  // Generate crisp high-res digit glyph atlas ("0".."9") on a detached canvas
  function createDigitAtlas() {
    const c = document.createElement("canvas");
    c.width = 640;
    c.height = 96;
    const ctx = c.getContext("2d");
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.font = "700 74px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (let d = 0; d < 10; d++) {
      const cx = d * 64 + 32;
      ctx.fillStyle = "rgba(0,0,0,0.45)";
      ctx.fillText(String(d), cx + 2, 52);
      ctx.fillStyle = "#ffffff";
      ctx.fillText(String(d), cx, 50);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    return tex;
  }
  const digitAtlasTex = createDigitAtlas();

  function makeDigitQuad(colorHex) {

      depthTest: false,

    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.visible = false;
    hudScene.add(mesh);
    return { mesh, geo, mat };
  }

  }

  // =========================================================================
  // 10. CAMERA FRAMING & RESIZE HANDLING
  // =========================================================================
  let viewW = window.innerWidth;
  let viewH = window.innerHeight;

  function fitBoardCamera() {
    viewW = window.innerWidth;
    viewH = window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    renderer.setPixelRatio(dpr);
    renderer.setSize(viewW, viewH, false);
    postRT.setSize(Math.max(1, Math.floor(viewW * dpr)), Math.max(1, Math.floor(viewH * dpr)));

    camera.aspect = viewW / viewH;
    camera.updateProjectionMatrix();

    // Update HUD orthographic camera in pixel space (origin bottom-left, y up)
    hudCam.left = 0;
    hudCam.right = viewW;
    hudCam.top = viewH;
    hudCam.bottom = 0;
    hudCam.updateProjectionMatrix();

    // Binary search exact distance so padded board [-0.65..24.65] x [-0.65..14.65] fits cleanly
    // inside viewport AND stays above bottom 96px (dock) at 16:9 AND 1280x650!
    const dockNdcBottom = -1.0 + (2.0 * 96) / Math.max(200, viewH);
    const padCorners = [
      new THREE.Vector3(-0.65, 0, -0.65),
      new THREE.Vector3(24.65, 0, -0.65),
      new THREE.Vector3(-0.65, 0, 14.65),
      new THREE.Vector3(24.65, 0, 14.65),
      new THREE.Vector3(-0.65, 1.5, -0.65),
      new THREE.Vector3(24.65, 1.5, -0.65),
      new THREE.Vector3(-0.65, 1.5, 14.65),
      new THREE.Vector3(24.65, 1.5, 14.65)
    ];

    // Shift lookAt slightly toward +Z so board centers cleanly in the space ABOVE the bottom dock
    const targetZ = 7.0 + (96 / Math.max(200, viewH)) * 6.5;
    BASE_CAM_TARGET.set(12.0, 0.0, targetZ);

    let lo = 12, hi = 90;
    const tmpV = new THREE.Vector3();
    for (let it = 0; it < 22; it++) {
      const mid = (lo + hi) * 0.5;
      camera.position.copy(BASE_CAM_TARGET).addScaledVector(CAM_DIR, mid);
      camera.lookAt(BASE_CAM_TARGET);
      camera.updateMatrixWorld();

      let fits = true;
      for (let i = 0; i < padCorners.length; i++) {
        tmpV.copy(padCorners[i]).project(camera);
        if (tmpV.x < -0.945 || tmpV.x > 0.945 || tmpV.y < dockNdcBottom || tmpV.y > 0.92) {
          fits = false;
          break;
        }
      }
      if (fits) hi = mid;
      else lo = mid;
    }
    baseCamPos.copy(BASE_CAM_TARGET).addScaledVector(CAM_DIR, hi);
    camera.position.copy(baseCamPos);
    camera.lookAt(BASE_CAM_TARGET);
  }

  fitBoardCamera();
