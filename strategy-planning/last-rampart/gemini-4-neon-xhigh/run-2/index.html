  // =========================================================================
  // 11. SYNTHESIZED WEB AUDIO ENGINE (NO MUSIC, SEED 4242, STRICT STATE SYNC)
  // =========================================================================
  const audioRng = makeRng(4242);
  let audioCtx = null;
  let masterGain = null;
  let compressor = null;
  let noiseBuf = null;
  let windNode = null;
  let windGain = null;
  const activeVoices = new Set();
  const shotTimestamps = []; // wall-clock seconds of recent shot SFX (cap <= 12/s)
  let lastKillSfxWall = 0;

  function initAudio() {
    if (audioCtx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      compressor = audioCtx.createDynamicsCompressor();
      compressor.threshold.setValueAtTime(-14, audioCtx.currentTime);
      compressor.knee.setValueAtTime(18, audioCtx.currentTime);
      compressor.ratio.setValueAtTime(6, audioCtx.currentTime);
      compressor.attack.setValueAtTime(0.004, audioCtx.currentTime);
      compressor.release.setValueAtTime(0.12, audioCtx.currentTime);
      masterGain.connect(compressor);
      compressor.connect(audioCtx.destination);

      // Seeded noise buffer (2 seconds)
      const sr = audioCtx.sampleRate;
      const len = sr * 2;
      noiseBuf = audioCtx.createBuffer(1, len, sr);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = audioRng() * 2 - 1;

      audioCtx.resume().catch(() => {});
    } catch (e) {
      audioCtx = null;
    }
  }

  initAudio();
  function resumeAudioOnGesture() {
    if (!audioCtx) initAudio();
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume().catch(() => {});
    }
  }
  window.addEventListener("pointerdown", resumeAudioOnGesture);
  window.addEventListener("keydown", resumeAudioOnGesture);

  function stopAllAudioImmediately() {
    if (!audioCtx || !masterGain) return;
    const now = audioCtx.currentTime;
    masterGain.gain.cancelScheduledValues(now);
    masterGain.gain.setValueAtTime(Math.max(0.0001, masterGain.gain.value), now);
    masterGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.035);
    for (const v of activeVoices) {
      try { v.stop(now + 0.04); } catch (e) {}
    }
    activeVoices.clear();
    if (windNode) {
      try { windNode.stop(now + 0.04); } catch (e) {}
      windNode = null;
      windGain = null;
    }
  }

  function setAudioAudible(audible) {
    if (!audioCtx || !masterGain) return;
    const now = audioCtx.currentTime;
    if (audible) {
      if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
      masterGain.gain.cancelScheduledValues(now);
      masterGain.gain.setValueAtTime(Math.max(0.0001, masterGain.gain.value), now);
      masterGain.gain.linearRampToValueAtTime(0.52, now + 0.03);
    } else {
      stopAllAudioImmediately();
    }
  }

  function makePanner(worldX) {
    const pan = Math.max(-0.85, Math.min(0.85, (worldX / BOARD_W) * 2 - 1));
    if (audioCtx.createStereoPanner) {
      const p = audioCtx.createStereoPanner();
      p.pan.setValueAtTime(pan, audioCtx.currentTime);
      p.connect(masterGain);
      return p;
    }
    return masterGain;
  }

  function trackVoice(src, stopAt) {
    activeVoices.add(src);
    src.onended = () => activeVoices.delete(src);
    src.stop(stopAt);
  }

  function playShotSfx(ev) {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const dest = makePanner(ev.sx);
    const v = 0.94 + audioRng() * 0.12;

    if (ev.typeIdx === 0) {
      // Bolt: crisp steel-blue snap
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(760 * v, now);
      osc.frequency.exponentialRampToValueAtTime(240 * v, now + 0.055);
      g.gain.setValueAtTime(0.11, now);
      g.gain.exponentialRampToValueAtTime(0.0008, now + 0.06);
      osc.connect(g); g.connect(dest);
      osc.start(now); trackVoice(osc, now + 0.065);
    } else if (ev.typeIdx === 1) {
      // Cannon: deep booming mortar thump
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(155 * v, now);
      osc.frequency.exponentialRampToValueAtTime(38 * v, now + 0.16);
      g.gain.setValueAtTime(0.24, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.17);
      osc.connect(g); g.connect(dest);
      osc.start(now); trackVoice(osc, now + 0.18);

      if (noiseBuf) {
        const ns = audioCtx.createBufferSource();
        ns.buffer = noiseBuf;
        const flt = audioCtx.createBiquadFilter();
        flt.type = "lowpass";
        flt.frequency.setValueAtTime(520, now);
        const ng = audioCtx.createGain();
        ng.gain.setValueAtTime(0.16, now);
        ng.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
        ns.connect(flt); flt.connect(ng); ng.connect(dest);
        ns.start(now, audioRng() * 1.2); trackVoice(ns, now + 0.15);
      }
    } else if (ev.typeIdx === 2) {
      // Frost: icy crystalline chime
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(1440 * v, now);
      osc.frequency.exponentialRampToValueAtTime(1880 * v, now + 0.09);
      g.gain.setValueAtTime(0.075, now);
      g.gain.exponentialRampToValueAtTime(0.0008, now + 0.10);
      osc.connect(g); g.connect(dest);
      osc.start(now); trackVoice(osc, now + 0.11);
    } else if (ev.typeIdx === 3) {
      // Lance: searing crimson rail beam
      const osc = audioCtx.createOscillator();
      const flt = audioCtx.createBiquadFilter();
      const g = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(540 * v, now);
      osc.frequency.exponentialRampToValueAtTime(190 * v, now + 0.15);
      flt.type = "bandpass";
      flt.frequency.setValueAtTime(980, now);
      flt.Q.setValueAtTime(3.2, now);
      g.gain.setValueAtTime(0.22, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
      osc.connect(flt); flt.connect(g); g.connect(dest);
      osc.start(now); trackVoice(osc, now + 0.17);
    } else {
      // Flak: snappy aerial burst pop
      if (noiseBuf) {
        const ns = audioCtx.createBufferSource();
        ns.buffer = noiseBuf;
        const flt = audioCtx.createBiquadFilter();
        flt.type = "bandpass";
        flt.frequency.setValueAtTime(1600 * v, now);
        flt.Q.setValueAtTime(1.4, now);
        const ng = audioCtx.createGain();
        ng.gain.setValueAtTime(0.15, now);
        ng.gain.exponentialRampToValueAtTime(0.001, now + 0.085);
        ns.connect(flt); flt.connect(ng); ng.connect(dest);
        ns.start(now, audioRng() * 1.2); trackVoice(ns, now + 0.09);
      }
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(420 * v, now);
      osc.frequency.exponentialRampToValueAtTime(140 * v, now + 0.075);
      g.gain.setValueAtTime(0.10, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      osc.connect(g); g.connect(dest);
      osc.start(now); trackVoice(osc, now + 0.085);
    }
  }

  function playKillSfx(ev) {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    if (now - lastKillSfxWall < 0.055) return;
    lastKillSfxWall = now;
    const dest = makePanner(ev.x);
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "sine";
    const f = 310 + audioRng() * 90;
    osc.frequency.setValueAtTime(f, now);
    osc.frequency.exponentialRampToValueAtTime(f * 1.75, now + 0.045);
    g.gain.setValueAtTime(0.065, now);
    g.gain.exponentialRampToValueAtTime(0.0008, now + 0.055);
    osc.connect(g); g.connect(dest);
    osc.start(now); trackVoice(osc, now + 0.06);
  }

  function playWaveHornSfx() {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const dest = makePanner(3.0);
    const flt = audioCtx.createBiquadFilter();
    flt.type = "lowpass";
    flt.frequency.setValueAtTime(680, now);
    flt.frequency.linearRampToValueAtTime(1120, now + 0.25);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.001, now);
    g.gain.linearRampToValueAtTime(0.11, now + 0.05);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
    flt.connect(g); g.connect(dest);
    const freqs = [196, 197.2];
    for (let i = 0; i < 2; i++) {
      const osc = audioCtx.createOscillator();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(freqs[i], now);
      osc.frequency.exponentialRampToValueAtTime(freqs[i] * 1.498, now + 0.22);
      osc.connect(flt);
      osc.start(now); trackVoice(osc, now + 0.38);
    }
  }

  function playLeakSfx() {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const dest = makePanner(23.5);
    // Stone crack
    if (noiseBuf) {
      const ns = audioCtx.createBufferSource();
      ns.buffer = noiseBuf;
      const flt = audioCtx.createBiquadFilter();
      flt.type = "bandpass";
      flt.frequency.setValueAtTime(750, now);
      flt.Q.setValueAtTime(1.2, now);
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(0.28, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
      ns.connect(flt); flt.connect(ng); ng.connect(dest);
      ns.start(now, audioRng()); trackVoice(ns, now + 0.15);
    }
    // Urgent alarm tone
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(640, now);
    osc.frequency.setValueAtTime(480, now + 0.10);
    g.gain.setValueAtTime(0.16, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
    osc.connect(g); g.connect(dest);
    osc.start(now); trackVoice(osc, now + 0.25);
  }

  function ensurePostFallWind() {
    if (!audioCtx || audioCtx.state !== "running" || !noiseBuf || windNode) return;
    const now = audioCtx.currentTime;
    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuf;
    src.loop = true;
    const flt = audioCtx.createBiquadFilter();
    flt.type = "bandpass";
    flt.frequency.setValueAtTime(210, now);
    flt.Q.setValueAtTime(2.4, now);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.001, now);
    g.gain.linearRampToValueAtTime(0.10, now + 0.4);
    src.connect(flt); flt.connect(g); g.connect(masterGain);
    src.start(now);
    windNode = src;
    windGain = g;
  }

  function playFallSfx() {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const dest = makePanner(23.5);
    // Deep collapse sub-rumble
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(92, now);
    osc.frequency.exponentialRampToValueAtTime(24, now + 1.1);
    g.gain.setValueAtTime(0.45, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 1.25);
    osc.connect(g); g.connect(dest);
    osc.start(now); trackVoice(osc, now + 1.3);

    if (noiseBuf) {
      const ns = audioCtx.createBufferSource();
      ns.buffer = noiseBuf;
      const flt = audioCtx.createBiquadFilter();
      flt.type = "lowpass";
      flt.frequency.setValueAtTime(420, now);
      flt.frequency.exponentialRampToValueAtTime(90, now + 1.3);
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(0.42, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + 1.35);
      ns.connect(flt); flt.connect(ng); ng.connect(dest);
      ns.start(now, 0.1); trackVoice(ns, now + 1.4);
    }
    ensurePostFallWind();
  }

  // Trigger audio events strictly when forward PLAYING carries simTime across event ticks
  const SHOT_LOUDNESS = [2, 4, 1, 5, 3]; // lance(3) > cannon(1) > flak(4) > bolt(0) > frost(2)
  function triggerForwardAudio(prevT, currT) {
    if (!audioCtx || audioCtx.state !== "running" || currT <= prevT) return;
    const fallT = replay.fallEvent ? replay.fallEvent.t : Infinity;

    // If past fall, only maintain low wind
    if (prevT >= fallT) {
      ensurePostFallWind();
      return;
    }

    // Fall event
    if (replay.fallEvent && prevT < fallT && fallT <= currT) {
      playFallSfx();
    }

    // Wave starts
    for (let i = 0; i < replay.waveStarts.length; i++) {
      const ev = replay.waveStarts[i];
      if (ev.t > currT) break;
      if (ev.t > prevT) playWaveHornSfx();
    }

    // Leaks
    for (let i = 0; i < replay.leaks.length; i++) {
      const ev = replay.leaks[i];
      if (ev.t > currT) break;
      if (ev.t > prevT) playLeakSfx();
    }

    // Kills
    for (let i = 0; i < replay.kills.length; i++) {
      const ev = replay.kills[i];
      if (ev.t > currT) break;
      if (ev.t > prevT) playKillSfx(ev);
    }

    // Shots (rate-limited to <= 12/sec total, loudest turret types prioritized!)
    const crossedShots = [];
    for (let i = 0; i < replay.shots.length; i++) {
      const ev = replay.shots[i];
      if (ev.t > currT) break;
      if (ev.t > prevT) crossedShots.push(ev);
    }
    if (crossedShots.length > 0) {
      crossedShots.sort((a, b) => SHOT_LOUDNESS[b.typeIdx] - SHOT_LOUDNESS[a.typeIdx]);
      const nowWall = audioCtx.currentTime;
      while (shotTimestamps.length > 0 && nowWall - shotTimestamps[0] > 1.0) {
        shotTimestamps.shift();
      }
      for (let i = 0; i < crossedShots.length && shotTimestamps.length < 12; i++) {
        playShotSfx(crossedShots[i]);
        shotTimestamps.push(nowWall);
      }
    }
  }

  // =========================================================================
  // 12. CLOSED-FORM TRAUMA NOISE & DETERMINISTIC RENDER(simTime)
  // =========================================================================
  function computeTrauma(t) {
    let tr = 0;
    let lastT = 0;
    const evs = replay.traumaEvents;
    for (let i = 0; i < evs.length; i++) {
      const ev = evs[i];
      if (ev.t > t) break;
      tr = Math.max(0, tr - (ev.t - lastT));
      tr = Math.min(1, tr + ev.amount);
      lastT = ev.t;
    }
    return Math.max(0, tr - (t - lastT));
  }

  function smoothNoise(t, phase) {
    return (
      Math.sin(t * 27.3 + phase) * 0.52 +
      Math.sin(t * 43.7 + phase * 1.9) * 0.31 +
      Math.cos(t * 67.1 + phase * 0.7) * 0.17
    );
  }

  const tmpMat = new THREE.Matrix4();
  const tmpPos = new THREE.Vector3();
  const tmpPos2 = new THREE.Vector3();
  const tmpQuat = new THREE.Quaternion();
  const tmpScale = new THREE.Vector3();
  const tmpEuler = new THREE.Euler();
  const tmpColor = new THREE.Color();
  const UP_VEC = new THREE.Vector3(0, 1, 0);

  function renderHud(snap, t, wavePop) {
    const W = viewW;
    const H = viewH;
    const padX = Math.max(18, Math.round(W * 0.018));
    const padY = Math.max(16, Math.round(H * 0.022));

    // Wave number: at least 7.5% of viewport height (spec >= 7%)
    const waveH = Math.max(48, Math.round(H * 0.082));
    const waveW = Math.round(waveH * 0.64);
    const popScale = 1.0 + wavePop * 0.16;

    // Top-left panel backing
    const goldH = Math.max(24, Math.round(H * 0.040));
    const goldW = Math.round(goldH * 0.62);
    const prevIconS = Math.max(16, Math.round(H * 0.028));
    const prevDigH = Math.max(18, Math.round(H * 0.030));
    const prevDigW = Math.round(prevDigH * 0.60);

    const panelW = Math.max(waveH * 2.9, prevIconS * 11.5);
    const panelH = waveH + goldH + prevDigH + 34;
    hudLeftBg.position.set(padX + panelW * 0.5 - 8, H - padY - panelH * 0.5 + 4, -2);
    hudLeftBg.scale.set(panelW + 16, panelH + 12, 1);

    // Wave icon + digits
    const waveCy = H - padY - waveH * 0.5;
    waveIconGroup.position.set(padX + waveH * 0.38, waveCy, 0);
    waveIconGroup.scale.set(waveH * 0.72 * popScale, waveH * 0.72 * popScale, 1);

    const waveStr = String(snap.wave);
    const waveX0 = padX + waveH * 0.92;
    for (let i = 0; i < 3; i++) {
      const dq = waveDigits[i];
      if (i < waveStr.length) {
        setDigitChar(dq, waveStr.charCodeAt(i) - 48);
        dq.mesh.visible = true;
        dq.mesh.position.set(waveX0 + i * waveW * 0.88 + waveW * 0.45, waveCy, 0);
        dq.mesh.scale.set(waveW * popScale, waveH * popScale, 1);
      } else {
        dq.mesh.visible = false;
      }
    }

    // Gold coin icon + digits under wave number
    const goldCy = H - padY - waveH - 12 - goldH * 0.5;
    coinIconGroup.position.set(padX + goldH * 0.46, goldCy, 0);
    coinIconGroup.scale.set(goldH * 0.86, goldH * 0.86, 1);

    const goldStr = String(snap.gold);
    const goldX0 = padX + goldH * 1.12;
    for (let i = 0; i < 5; i++) {
      const dq = goldDigits[i];
      if (i < goldStr.length) {
        setDigitChar(dq, goldStr.charCodeAt(i) - 48);
        dq.mesh.visible = true;
        dq.mesh.position.set(goldX0 + i * goldW * 0.86 + goldW * 0.42, goldCy, 0);
        dq.mesh.scale.set(goldW, goldH, 1);
      } else {
        dq.mesh.visible = false;
      }
    }

    // Next-wave preview row under gold
    const prevCy = H - padY - waveH - 12 - goldH - 14 - prevDigH * 0.5;
    let curX = padX + prevIconS * 0.5;
    const nc = snap.nextCounts;
    for (let i = 0; i < 6; i++) {
      const item = previewItems[i];
      const cnt = nc[i];
      if (cnt > 0) {
        item.icon.visible = true;
        item.icon.position.set(curX, prevCy, 0);
        item.icon.scale.set(prevIconS, prevIconS, 1);
        curX += prevIconS * 0.72;

        const s = String(cnt);
        for (let d = 0; d < 2; d++) {
          const dq = item.digits[d];
          if (d < s.length) {
            setDigitChar(dq, s.charCodeAt(d) - 48);
            dq.mesh.visible = true;
            dq.mesh.position.set(curX + d * prevDigW * 0.82 + prevDigW * 0.35, prevCy, 0);
            dq.mesh.scale.set(prevDigW, prevDigH, 1);
          } else {
            dq.mesh.visible = false;
          }
        }
        curX += s.length * prevDigW * 0.84 + prevIconS * 0.65;
      } else {
        item.icon.visible = false;
        item.digits[0].mesh.visible = false;
        item.digits[1].mesh.visible = false;
      }
    }

    // Top-right Base HP: 10 pips in a row
    const pipR = Math.max(13, Math.round(H * 0.023));
    const pipStep = Math.round(pipR * 1.62);
    const hpRowW = 9 * pipStep + pipR * 2;
    const hpCy = H - padY - pipR * 1.1;
    const hpStartX = W - padX - hpRowW + pipR;

    hudRightBg.position.set(W - padX - hpRowW * 0.5, hpCy, -2);
    hudRightBg.scale.set(hpRowW + 22, pipR * 2.2 + 12, 1);

    const hpClamped = Math.max(0, Math.min(10, snap.baseHp));
    const litColor = hpClamped <= 3 ? 0xff4c40 : (hpClamped <= 6 ? 0xffb338 : 0x4be88d);
    for (let i = 0; i < 10; i++) {
      const pip = hpPips[i];
      pip.group.position.set(hpStartX + i * pipStep, hpCy, 0);
      pip.group.scale.set(pipR, pipR, 1);
      const alive = i < hpClamped;
      if (alive) {
        pip.fillMat.color.setHex(litColor);
        pip.fillMat.opacity = 0.96;
        pip.borderMat.opacity = 0.55;
      } else {
        pip.fillMat.color.setHex(0x1f2430);
        pip.fillMat.opacity = 0.72;
        pip.borderMat.opacity = 0.22;
      }
      const dtExt = t - pip.extinguishTime;
      if (dtExt >= 0 && dtExt < 0.36) {
        const k = 1 - dtExt / 0.36;
        pip.flash.visible = true;
        pip.flashMat.opacity = k * 0.95;
        const sc = 0.9 + (1 - k) * 0.9;
        pip.flash.scale.set(sc, sc, 1);
      } else {
        pip.flash.visible = false;
      }
    }
  }

  function renderAtTime(t) {
    const fallT = replay.fallEvent ? replay.fallEvent.t : Infinity;
    const isFallen = t >= fallT;
    const effT = isFallen ? fallT : t;
    const exactTickF = effT * TPS;
    const k = Math.max(0, Math.min(lastRecordedTick, Math.floor(exactTickF)));
    const frac = isFallen ? 0 : Math.max(0, Math.min(1, exactTickF - k));
    const snap = replay.ticks[k];
    if (!snap) return;

    // 1. Trauma shake (closed-form in simTime!)
    const trauma = computeTrauma(t);
    const shakeMag = trauma * trauma * 0.25;
    if (shakeMag > 0.0001) {
      const ox = smoothNoise(t, 1.3) * shakeMag;
      const oy = smoothNoise(t, 4.7) * shakeMag * 0.65;
      const oz = smoothNoise(t, 8.1) * shakeMag;
      camera.position.set(baseCamPos.x + ox, baseCamPos.y + oy, baseCamPos.z + oz);
      camera.lookAt(BASE_CAM_TARGET.x + ox * 0.4, BASE_CAM_TARGET.y, BASE_CAM_TARGET.z + oz * 0.4);
    } else {
      camera.position.copy(baseCamPos);
      camera.lookAt(BASE_CAM_TARGET);
    }

    // 2. Ambient air-lane chevron flow & portal animation (driven purely by effT)
    const totalAirLen = 28.0;
    for (let i = 0; i < airChevrons.length; i++) {
      const dist = ((i / airChevrons.length) * totalAirLen + effT * 1.8) % totalAirLen;
      let rem = dist;
      for (let s = 0; s < airSegMeta.length; s++) {
        const seg = airSegMeta[s];
        if (rem <= seg.len || s === airSegMeta.length - 1) {
          const d = Math.min(rem, seg.len);
          airChevrons[i].position.set(seg.x0 + seg.sx * d, 0.80, seg.z0 + seg.sz * d);
          airChevrons[i].rotation.y = Math.atan2(seg.sx, seg.sz);
          break;
        }
        rem -= seg.len;
      }
    }
    airRift.rotation.z = effT * 1.4;
    keepCrystal.rotation.y = effT * 1.6;
    keepCrystal.position.y = 2.38 + Math.sin(effT * 3.0) * 0.07;

    // 3. Keep state: red leak flash, 10 crumbling wall chunks, and fall collapse!
    let leakFlash = 0;
    for (let i = 0; i < replay.leaks.length; i++) {
      const dt = t - replay.leaks[i].t;
      if (dt >= 0 && dt < 0.35) {
        const f = 1 - dt / 0.35;
        if (f > leakFlash) leakFlash = f;
      }
    }
    if (leakFlash > 0) {
      keepStoneMat.emissive.setRGB(leakFlash * 0.95, leakFlash * 0.08, leakFlash * 0.04);
      keepDarkMat.emissive.setRGB(leakFlash * 0.85, leakFlash * 0.06, leakFlash * 0.04);
    } else {
      keepStoneMat.emissive.setRGB(0, 0, 0);
      keepDarkMat.emissive.setRGB(0, 0, 0);
    }

    keepCoreGroup.visible = !isFallen;
    rubbleGroup.visible = isFallen;
    keepLight.intensity = isFallen ? Math.max(0, 2.2 * (1 - (t - fallT) * 1.4)) : (2.2 + leakFlash * 2.5);

    for (let i = 0; i < wallChunks.length; i++) {
      const ch = wallChunks[i];
      if (t < ch.knockTime && !isFallen) {
        ch.mesh.visible = true;
        ch.mesh.position.copy(ch.home);
        ch.mesh.rotation.set(0, 0, 0);
        ch.mesh.scale.set(1, 1, 1);
      } else {
        const dt = t - Math.min(ch.knockTime, fallT);
        if (dt >= 0 && dt < 0.95) {
          ch.mesh.visible = true;
          const y = Math.max(0.12, ch.home.y + ch.vy * dt - 4.9 * dt * dt);
          ch.mesh.position.set(ch.home.x + ch.vx * dt, y, ch.home.z + ch.vz * dt);
          ch.mesh.rotation.set(ch.rx * dt, ch.ry * dt, ch.rx * 0.5 * dt);
          const fadeSc = dt > 0.65 ? Math.max(0.01, 1 - (dt - 0.65) / 0.30) : 1;
          ch.mesh.scale.set(fadeSc, fadeSc, fadeSc);
        } else {
          ch.mesh.visible = false;
        }
      }
    }

    // 4. Turrets on the 16 slots
    for (let i = 0; i < 16; i++) {
      const sv = slotVisuals[i];
      const st = snap.slots[i];
      if (!st) {
        if (sv.activeType >= 0) {
          sv.meshes[sv.activeType].root.visible = false;
          sv.activeType = -1;
        }
        continue;
      }
      if (sv.activeType !== st.typeIdx) {
        if (sv.activeType >= 0) sv.meshes[sv.activeType].root.visible = false;
        if (!sv.meshes[st.typeIdx]) {
          sv.meshes[st.typeIdx] = createTurretVisual(st.typeIdx);
          sv.group.add(sv.meshes[st.typeIdx].root);
        }
        sv.meshes[st.typeIdx].root.visible = true;
        sv.activeType = st.typeIdx;
      }
      const tv = sv.meshes[st.typeIdx];
      // Tier pips (1..3)
      for (let p = 0; p < 3; p++) tv.tierPips[p].visible = p < st.tier;
      // Aim & subtle recoil pulse
      const dtRec = effT - st.recoilT;
      const rec = (dtRec >= 0 && dtRec < 0.14) ? Math.sin((1 - dtRec / 0.14) * Math.PI) * 0.08 : 0;
      if (st.typeIdx === 2) {
        tv.head.rotation.y = effT * 1.4;
        tv.head.position.y = rec * 0.6;
      } else {
        tv.head.rotation.y = st.aim;
        tv.head.position.set(-Math.sin(st.aim) * rec, 0, -Math.cos(st.aim) * rec);
      }
    }

    // 5. Instanced Enemies + Wisp Shadows + Health Bars
    const counts = [0, 0, 0, 0, 0, 0, 0];
    let wispShadowCount = 0;
    let barCount = 0;
    const camQuat = camera.quaternion;

    for (let i = 0; i < snap.enemies.length; i++) {
      const e = snap.enemies[i];
      const typeIdx = e.typeIdx;
      const idx = counts[typeIdx];
      if (idx >= MAX_ENEMIES_PER_TYPE) continue;
      counts[typeIdx]++;

      const wx = e.x + (e.nx - e.x) * frac;
      const wz = e.z + (e.nz - e.z) * frac;
      const wy = e.air ? (0.80 + Math.sin(effT * 6.0 + e.id * 1.7) * 0.06) : 0.03;

      const yaw = Math.atan2(e.dx, e.dz);
      tmpEuler.set(0, yaw, 0);
      tmpQuat.setFromEuler(tmpEuler);
      const bob = e.air ? 0 : Math.abs(Math.sin(effT * 11.0 + e.id * 2.1)) * 0.04;
      tmpPos.set(wx, wy + bob, wz);
      tmpScale.set(1, 1, 1);
      tmpMat.compose(tmpPos, tmpQuat, tmpScale);

      const inst = enemyInstMeshes[typeIdx];
      inst.setMatrixAt(idx, tmpMat);
      inst.setColorAt(idx, e.slowed ? FROST_TINT : WHITE_COL);

      // Wisp ground shadow directly underneath
      if (e.air && wispShadowCount < MAX_ENEMIES_PER_TYPE) {
        tmpPos.set(wx, 0.035, wz);
        tmpQuat.identity();
        tmpScale.set(1, 1, 1);
        tmpMat.compose(tmpPos, tmpQuat, tmpScale);
        wispShadowInst.setMatrixAt(wispShadowCount++, tmpMat);
      }

      // Health bar above enemy
      if (barCount < MAX_TOTAL_ENEMIES) {
        const barY = e.air ? wy + 0.44 : (typeIdx === 3 ? 0.98 : (typeIdx === 5 ? 0.90 : (typeIdx === 6 ? 0.45 : 0.74)));
        const hpRatio = Math.max(0.01, Math.min(1, e.hp / e.maxHp));
        tmpPos.set(wx, barY, wz);
        tmpScale.set(1, 1, 1);
        tmpMat.compose(tmpPos, camQuat, tmpScale);
        hpBgInst.setMatrixAt(barCount, tmpMat);

        // Shift fill left edge along camera right axis
        tmpPos2.set(-0.26, 0, 0.008).applyQuaternion(camQuat).add(tmpPos);
        tmpScale.set(hpRatio, 1, 1);
        tmpMat.compose(tmpPos2, camQuat, tmpScale);
        hpFillInst.setMatrixAt(barCount, tmpMat);
        if (hpRatio > 0.55) tmpColor.setHex(0x47e878);
        else if (hpRatio > 0.25) tmpColor.setHex(0xffbe33);
        else tmpColor.setHex(0xff4238);
        hpFillInst.setColorAt(barCount, tmpColor);
        barCount++;
      }
    }

    for (let tIdx = 0; tIdx < 7; tIdx++) {
      const inst = enemyInstMeshes[tIdx];
      inst.count = counts[tIdx];
      inst.instanceMatrix.needsUpdate = true;
      if (inst.instanceColor) inst.instanceColor.needsUpdate = true;
    }
    wispShadowInst.count = wispShadowCount;
    wispShadowInst.instanceMatrix.needsUpdate = true;
    hpBgInst.count = barCount;
    hpBgInst.instanceMatrix.needsUpdate = true;
    hpFillInst.count = barCount;
    hpFillInst.instanceMatrix.needsUpdate = true;
    if (hpFillInst.instanceColor) hpFillInst.instanceColor.needsUpdate = true;

    // 6. Combat Effects (Closed-form in effT & t)
    let beamCount = 0;
    let ringCount = 0;
    let orbCount = 0;
    let debrisCount = 0;

    function pushBeam(x0, y0, z0, x1, y1, z1, radius, colorHex) {
      if (beamCount >= MAX_BEAMS) return;
      tmpPos.set(x0, y0, z0);
      tmpPos2.set(x1, y1, z1);
      const len = tmpPos.distanceTo(tmpPos2);
      if (len < 0.001) return;
      const horiz = Math.abs(x1 - x0) + Math.abs(z1 - z0);
      tmpMat.lookAt(tmpPos2, tmpPos, horiz < 0.001 ? new THREE.Vector3(1, 0, 0) : UP_VEC);
      tmpQuat.setFromRotationMatrix(tmpMat);
      tmpScale.set(radius, radius, len);
      tmpMat.compose(tmpPos, tmpQuat, tmpScale);
      beamInst.setMatrixAt(beamCount, tmpMat);
      tmpColor.setHex(colorHex);
      beamInst.setColorAt(beamCount, tmpColor);
      beamCount++;
    }

    function pushRing(x, y, z, radius, colorHex) {
      if (ringCount >= MAX_RINGS || radius < 0.01) return;
      tmpPos.set(x, y, z);
      tmpQuat.identity();
      tmpScale.set(radius, 1, radius);
      tmpMat.compose(tmpPos, tmpQuat, tmpScale);
      ringInst.setMatrixAt(ringCount, tmpMat);
      tmpColor.setHex(colorHex);
      ringInst.setColorAt(ringCount, tmpColor);
      ringCount++;
    }

    function pushOrb(x, y, z, sc, colorHex) {
      if (orbCount >= MAX_ORB_FX || sc < 0.01) return;
      tmpPos.set(x, y, z);
      tmpQuat.identity();
      tmpScale.set(sc, sc, sc);
      tmpMat.compose(tmpPos, tmpQuat, tmpScale);
      orbInst.setMatrixAt(orbCount, tmpMat);
      tmpColor.setHex(colorHex);
      orbInst.setColorAt(orbCount, tmpColor);
      orbCount++;
    }

    function pushDebris(x, y, z, rx, ry, sc, colorHex) {
      if (debrisCount >= MAX_DEBRIS || sc < 0.01) return;
      tmpPos.set(x, y, z);
      tmpEuler.set(rx, ry, rx * 0.6);
      tmpQuat.setFromEuler(tmpEuler);
      tmpScale.set(sc, sc, sc);
      tmpMat.compose(tmpPos, tmpQuat, tmpScale);
      debrisInst.setMatrixAt(debrisCount, tmpMat);
      tmpColor.setHex(colorHex);
      debrisInst.setColorAt(debrisCount, tmpColor);
      debrisCount++;
    }

    // 6a. Shots (each lasts at most 0.145s <= 0.15s)
    // Binary search start index for shots near effT
    let lo = 0, hi = replay.shots.length;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (replay.shots[mid].t < effT - 0.15) lo = mid + 1;
      else hi = mid;
    }
    for (let i = lo; i < replay.shots.length; i++) {
      const sh = replay.shots[i];
      if (sh.t > effT) break;
      const dt = effT - sh.t;
      if (dt < 0 || dt > 0.145) continue;
      const p = dt / 0.145;
      const sy = sh.typeIdx === 2 ? 1.15 : 0.72;
      const ty = sh.air ? 0.80 : 0.34;

      if (sh.typeIdx === 0) {
        // Bolt: thin steel-blue/white tracer
        pushBeam(sh.sx, sy, sh.sz, sh.tx, ty, sh.tz, 0.032 * (1 - p * 0.7), 0x8ad0ff);
        pushOrb(sh.tx, ty, sh.tz, 0.55 * (1 - p), 0xd8f0ff);
      } else if (sh.typeIdx === 1) {
        // Cannon: arcing shell (0..0.065s) then splash ring of exact splash radius (0.90 tiles)
        if (dt < 0.065) {
          const ap = dt / 0.065;
          const ax = sh.sx + (sh.tx - sh.sx) * ap;
          const az = sh.sz + (sh.tz - sh.sz) * ap;
          const ay = sy + (ty - sy) * ap + Math.sin(ap * Math.PI) * 1.15;
          pushOrb(ax, ay, az, 0.95, 0xffaa42);
        } else {
          const bp = (dt - 0.065) / 0.08;
          const rad = sh.splashR * (0.28 + 0.72 * bp);
          pushRing(sh.tx, 0.08, sh.tz, rad, 0xff8c30);
          pushOrb(sh.tx, 0.25, sh.tz, 1.35 * (1 - bp), 0xffcc66);
        }
      } else if (sh.typeIdx === 2) {
        // Frost: pale ice-white beam
        pushBeam(sh.sx, sy, sh.sz, sh.tx, ty, sh.tz, 0.052 * (1 - p * 0.5), 0xdff8ff);
        pushOrb(sh.tx, ty, sh.tz, 0.85 * (1 - p), 0x8ce8ff);
      } else if (sh.typeIdx === 3) {
        // Lance: thick crimson beam + bright flash
        pushBeam(sh.sx, sy, sh.sz, sh.tx, ty, sh.tz, 0.115 * (1 - p * 0.6), 0xff2840);
        pushOrb(sh.tx, ty, sh.tz, 1.6 * (1 - p), 0xff7080);
      } else {
        // Flak: short tracer + bursting teal air ring of exact splash radius (0.70 tiles)
        if (dt < 0.055) {
          pushBeam(sh.sx, 0.85, sh.sz, sh.tx, 0.80, sh.tz, 0.03, 0x52fff0);
        }
        const bp = Math.min(1, dt / 0.145);
        pushRing(sh.tx, 0.80, sh.tz, sh.splashR * (0.25 + 0.75 * bp), 0x28f0d8);
        pushOrb(sh.tx, 0.80, sh.tz, 1.0 * (1 - bp), 0x8afff2);
      }
    }

    // 6b. Mender Heals (green pulse ring of radius 1.50 tiles, 0.45s)
    for (let i = 0; i < replay.heals.length; i++) {
      const h = replay.heals[i];
      if (h.t > effT) break;
      const dt = effT - h.t;
      if (dt >= 0 && dt < 0.45) {
        const p = dt / 0.45;
        pushRing(h.x, 0.09, h.z, 1.50 * (0.18 + 0.82 * p), 0x3ef57c);
      }
    }

    // 6c. Splitter bursts (purple shock ring, 0.35s)
    for (let i = 0; i < replay.splits.length; i++) {
      const sp = replay.splits[i];
      if (sp.t > effT) break;
      const dt = effT - sp.t;
      if (dt >= 0 && dt < 0.35) {
        const p = dt / 0.35;
        pushRing(sp.x, 0.14, sp.z, 0.65 * (0.2 + 0.8 * p), 0xc575ff);
        pushOrb(sp.x, 0.32, sp.z, 1.2 * (1 - p), 0xe6a8ff);
      }
    }

    // 6d. Builds, Upgrades & Sells FX
    for (let i = 0; i < replay.slotActions.length; i++) {
      const sa = replay.slotActions[i];
      if (sa.t > effT) break;
      const dt = effT - sa.t;
      if (dt < 0 || dt > 0.55) continue;
      const col = TURRET_COLORS[sa.typeIdx] || 0xffd75e;
      if (sa.op === "B" && dt < 0.50) {
        const p = dt / 0.50;
        pushRing(sa.x, 0.22 + p * 0.75, sa.z, 0.45 * (1 - p * 0.35), 0xffe278);
        for (let k = 0; k < 4; k++) {
          const ang = k * 1.57 + p * 3.0;
          pushOrb(sa.x + Math.cos(ang) * 0.35, 0.25 + p * 1.15, sa.z + Math.sin(ang) * 0.35, 0.36 * (1 - p), 0xfff0a0);
        }
      } else if (sa.op === "U" && dt < 0.45) {
        const p = dt / 0.45;
        pushRing(sa.x, 0.24 + p * 0.6, sa.z, 0.35 + p * 0.65, col);
        pushRing(sa.x, 0.16, sa.z, 0.3 + p * 0.85, 0xffe278);
      } else if (sa.op === "S" && dt < 0.55) {
        const p = dt / 0.55;
        for (let k = 0; k < 6; k++) {
          const ang = k * 1.047 + sa.slot * 0.7;
          const r = 0.15 + p * 0.85;
          const y = Math.max(0.06, 0.55 + 1.8 * dt - 4.9 * dt * dt);
          pushDebris(sa.x + Math.cos(ang) * r, y, sa.z + Math.sin(ang) * r, dt * 8, dt * 6, 0.13 * (1 - p * 0.7), 0x767d8e);
        }
      }
    }

    // 6e. Kill Debris (seeded, ballistic, closed-form in dt, 0.65s)
    lo = 0; hi = replay.kills.length;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (replay.kills[mid].t < effT - 0.65) lo = mid + 1;
      else hi = mid;
    }
    for (let i = lo; i < replay.kills.length; i++) {
      const kl = replay.kills[i];
      if (kl.t > effT) break;
      const dt = effT - kl.t;
      if (dt < 0 || dt > 0.65) continue;
      const p = dt / 0.65;
      const col = kl.typeIdx === 3 ? 0xff7a22 : ENEMY_COLORS[kl.typeIdx];
      const baseY = kl.air ? 0.80 : 0.28;
      // 5 deterministic pieces per kill via fast integer hash of kl.id
      for (let m = 0; m < 5; m++) {
        let h = Math.imul(kl.id * 73856093 ^ (m * 19349663), 0x27d4eb2d);
        h = (h ^ (h >>> 15)) >>> 0;
        const ang = (h & 1023) / 1024 * Math.PI * 2;
        const spd = 0.8 + ((h >>> 10) & 255) / 255 * 1.9;
        const vy = 1.6 + ((h >>> 18) & 255) / 255 * 2.4;
        const dx = kl.x + Math.cos(ang) * spd * dt;
        const dz = kl.z + Math.sin(ang) * spd * dt;
        const dy = Math.max(0.05, baseY + vy * dt - 4.9 * dt * dt);
        const sc = (kl.typeIdx === 3 ? 0.14 : 0.095) * (1 - p * 0.8);
        pushDebris(dx, dy, dz, dt * 10 + m, dt * 8 + ang, sc, col);
      }
    }

    // 6f. Fall Collapse Shockwave & Masonry Burst (runs in real post-fall time t - fallT!)
    if (isFallen) {
      const fdt = t - fallT;
      if (fdt >= 0 && fdt < 1.6) {
        const fp = fdt / 1.6;
        pushRing(23.5, 0.22, 11.5, 0.6 + fp * 7.5, 0xff6b2e);
        pushRing(23.5, 0.35, 11.5, 0.4 + fp * 5.0, 0xffd078);
        if (fdt < 0.5) {
          pushOrb(23.5, 1.1, 11.5, 4.5 * (1 - fdt / 0.5), 0xffb352);
        }
      }
      if (fdt >= 0 && fdt < 2.2) {
        const fp = fdt / 2.2;
        for (let i = 0; i < FALL_DEBRIS_N; i++) {
          const d = fallDebrisData[i];
          const y = Math.max(0.10, d.oy + d.vy * fdt - 5.2 * fdt * fdt);
          const sc = d.sc * (fdt > 1.5 ? Math.max(0.01, 1 - (fdt - 1.5) / 0.7) : 1);
          pushDebris(d.ox + d.vx * fdt, y, d.oz + d.vz * fdt, d.rx * fdt, d.ry * fdt, sc, d.col);
        }
      }
    }

    beamInst.count = beamCount;
    beamInst.instanceMatrix.needsUpdate = true;
    if (beamInst.instanceColor) beamInst.instanceColor.needsUpdate = true;

    ringInst.count = ringCount;
    ringInst.instanceMatrix.needsUpdate = true;
    if (ringInst.instanceColor) ringInst.instanceColor.needsUpdate = true;

    orbInst.count = orbCount;
    orbInst.instanceMatrix.needsUpdate = true;
    if (orbInst.instanceColor) orbInst.instanceColor.needsUpdate = true;

    debrisInst.count = debrisCount;
    debrisInst.instanceMatrix.needsUpdate = true;
    if (debrisInst.instanceColor) debrisInst.instanceColor.needsUpdate = true;

    // 7. HUD update (wave pop decay)
    let wavePop = 0;
    for (let i = replay.waveStarts.length - 1; i >= 0; i--) {
      const dtW = effT - replay.waveStarts[i].t;
      if (dtW >= 0 && dtW < 0.28) {
        wavePop = 1 - dtW / 0.28;
        break;
      }
      if (replay.waveStarts[i].t < effT - 0.3) break;
    }
    renderHud(snap, t, wavePop);

    // 8. Final WebGL Render (Direct MSAA normally; Desaturation post-pass over 1.0s after fall)
    const desat = isFallen ? Math.max(0, Math.min(1, (t - fallT) / 1.0)) : 0;
    if (desat > 0.001) {
      renderer.setRenderTarget(postRT);
      renderer.clear(true, true, true);
      renderer.render(scene, camera);
      renderer.setRenderTarget(null);
      renderer.clear(true, true, true);
      postMat.uniforms.uDesat.value = desat;
      renderer.render(postScene, postCam);
    } else {
      renderer.setRenderTarget(null);
      renderer.clear(true, true, true);
      renderer.render(scene, camera);
    }
    // Draw Wordless HUD as final orthographic pass inside #stage
    renderer.clearDepth();
    renderer.render(hudScene, hudCam);
  }

  // =========================================================================
  // 13. EXACT 5-STATE PLAYBACK STATE MACHINE & DOCK CONTROLS (SECTION 3 & 4)
  // =========================================================================
  const countdownEl = document.getElementById("countdown");
  const btnRefire = document.getElementById("btn-refire");
  const btnToggle = document.getElementById("btn-toggle");
  const iconPause = document.getElementById("icon-pause");
  const iconPlay = document.getElementById("icon-play");
  const speedPills = Array.from(document.querySelectorAll(".speed-pill"));
  const scrubber = document.getElementById("scrubber");

  let state = "COUNTDOWN"; // COUNTDOWN | PLAYING | PAUSED | REFIRE_HOLD | ENDED
  let simTime = 0.000;
  let playbackSpeed = 1.0;
  let countdownElapsed = 0.0;
  let holdElapsed = 0.0;
  let lastFrameMs = null;

  function setToggleUI(isPauseIcon) {
    if (isPauseIcon) {
      iconPause.style.display = "";
      iconPlay.style.display = "none";
      btnToggle.setAttribute("aria-label", "Pause");
    } else {
      iconPause.style.display = "none";
      iconPlay.style.display = "";
      btnToggle.setAttribute("aria-label", "Play");
    }
  }

  function hideCountdown() {
    countdownEl.style.display = "none";
    countdownEl.textContent = "";
  }

  // Render initial resting scene (simTime = 0.000) before starting COUNTDOWN on first rAF
  scrubber.value = "0";
  countdownEl.style.display = "block";
  countdownEl.textContent = "3";
  setToggleUI(true);
  renderAtTime(0.000);

  btnToggle.addEventListener("click", () => {
    if (state === "PLAYING") {
      state = "PAUSED";
      setToggleUI(false);
      setAudioAudible(false);
    } else if (state === "COUNTDOWN" || state === "REFIRE_HOLD") {
      hideCountdown();
      simTime = 0.000;
      scrubber.value = "0";
      state = "PAUSED";
      setToggleUI(false);
      setAudioAudible(false);
      renderAtTime(0.000);
    } else if (state === "PAUSED") {
      state = "PLAYING";
      setToggleUI(true);
      setAudioAudible(true);
    } else if (state === "ENDED") {
      hideCountdown();
      simTime = 0.000;
      scrubber.value = "0";
      state = "PLAYING";
      setToggleUI(true);
      setAudioAudible(true);
      renderAtTime(0.000);
    }
  });

  speedPills.forEach(pill => {
    pill.addEventListener("click", () => {
      const spd = parseFloat(pill.getAttribute("data-speed"));
      if (!isNaN(spd) && spd > 0) playbackSpeed = spd;
      speedPills.forEach(p => {
        const active = p === pill;
        p.classList.toggle("is-active", active);
        p.setAttribute("aria-checked", active ? "true" : "false");
      });
    });
  });

  scrubber.addEventListener("input", () => {
    hideCountdown();
    simTime = Math.max(0, Math.min(DURATION, parseFloat(scrubber.value) || 0));
    state = "PAUSED";
    setToggleUI(false);
    setAudioAudible(false);
    renderAtTime(simTime);
  });

  btnRefire.addEventListener("click", () => {
    hideCountdown();
    simTime = 0.000;
    scrubber.value = "0";
    holdElapsed = 0.0;
    countdownElapsed = 0.0;
    state = "REFIRE_HOLD";
    setToggleUI(true);
    setAudioAudible(false);
    renderAtTime(0.000);
  });

  function frame(nowMs) {
    requestAnimationFrame(frame);
    if (lastFrameMs === null) {
      lastFrameMs = nowMs;
      // First rAF: start COUNTDOWN at 0.000 after initial render
      renderAtTime(simTime);
      return;
    }
    const rawDt = (nowMs - lastFrameMs) / 1000;
    lastFrameMs = nowMs;
    const dt = Math.max(0, Math.min(rawDt, 0.1));

    if (state === "COUNTDOWN") {
      countdownElapsed += dt;
      if (countdownElapsed < 3.0 - 1e-6) {
        countdownEl.style.display = "block";
        if (countdownElapsed < 1.0 - 1e-6) countdownEl.textContent = "3";
        else if (countdownElapsed < 2.0 - 1e-6) countdownEl.textContent = "2";
        else countdownEl.textContent = "1";
        simTime = 0.000;
        scrubber.value = "0";
        renderAtTime(0.000);
      } else {
        hideCountdown();
        state = "PLAYING";
        setToggleUI(true);
        setAudioAudible(true);
        const prevT = simTime;
        simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
        scrubber.value = simTime.toFixed(3);
        triggerForwardAudio(prevT, simTime);
        renderAtTime(simTime);
      }
    } else if (state === "REFIRE_HOLD") {
      holdElapsed += dt;
      if (holdElapsed >= 1.0 - 1e-6) {
        state = "PLAYING";
        setToggleUI(true);
        setAudioAudible(true);
      }
      renderAtTime(0.000);
    } else if (state === "PLAYING") {
      const prevT = simTime;
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      scrubber.value = simTime.toFixed(3);
      triggerForwardAudio(prevT, simTime);
      renderAtTime(simTime);
      if (simTime >= DURATION) {
        simTime = DURATION;
        scrubber.value = DURATION.toFixed(3);
        state = "ENDED";
        setToggleUI(false);
        setAudioAudible(false);
        renderAtTime(DURATION);
      }
    }
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
