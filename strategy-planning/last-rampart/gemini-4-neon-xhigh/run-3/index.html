<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Last Rampart: Wave Defense Strategist</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>

<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="100" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script id="rampart-strategy">
function createStrategy() {
  const SPD = { grunt: 10, runner: 20, wisp: 12, brute: 6, splitter: 8, mender: 8, splitling: 12 };
  const LEAK = { grunt: 1, runner: 1, wisp: 2, brute: 3, splitter: 2, mender: 2, splitling: 1 };
  const COST = { bolt: 50, cannon: 90, frost: 70, lance: 120, flak: 80 };
  const MID_LAY = [
    "flak", "cannon", "cannon", "cannon", "cannon", "cannon", "cannon", "cannon",
    "cannon", "frost", "frost", "cannon", "flak", "cannon", "bolt", "frost"
  ];
  const PIV_LAY = [
    "flak", "flak", "flak", "flak", "frost", "cannon", "cannon", "cannon",
    "cannon", "cannon", "flak", "cannon", "flak", "cannon", "lance", "frost"
  ];
  const AIR_PRIO = [15, 12, 14, 10, 5, 1, 2, 3, 8, 13, 0, 6, 7, 11, 4, 9];
  const GND_PRIO = [4, 3, 6, 8, 11, 13, 1, 2, 7, 5, 0, 14, 9, 10, 12, 15];
  const UPG_PRIO = [4, 12, 3, 6, 8, 14, 11, 13, 1, 2, 7, 5, 0, 10, 9, 15];
  const PIV_PRIO = [10, 1, 2, 3, 12, 14, 0, 9, 4, 5, 6, 7, 8, 11, 13, 15];

  const frostSeq = Object.create(null);
  let seq = 1;
  let curWave = 1;
  let hitBank = false;
  const firedWave = new Int32Array(16);

  return {
    plan(state) {
      curWave = state.wave;
      const w = state.wave;
      let g = state.gold;
      const acts = [];
      if (g >= 1000) hitBank = true;

      const simSlots = new Array(16);
      for (let i = 0; i < 16; i++) {
        const sl = state.slots[i];
        simSlots[i] = {
          x: sl.x,
          y: sl.y,
          turret: sl.turret ? { type: sl.turret.type, tier: sl.turret.tier, spent: sl.turret.spent } : null
        };
      }

      function sell(si) {
        const t = simSlots[si].turret;
        if (!t || acts.length >= 32) return false;
        acts.push({ op: "sell", slot: si });
        g += Math.floor(t.spent * 70 / 100);
        simSlots[si].turret = null;
        return true;
      }

      function build(si, type, res) {
        const c = COST[type];
        if (simSlots[si].turret || g - c < res || acts.length >= 32) return false;
        acts.push({ op: "build", slot: si, type: type });
        g -= c;
        simSlots[si].turret = { type: type, tier: 1, spent: c };
        return true;
      }

      function upgrade(si, res) {
        const t = simSlots[si].turret;
        if (!t || t.tier >= 3 || acts.length >= 32) return false;
        const c = t.tier === 1 ? COST[t.type] : COST[t.type] * 2;
        if (g - c < res) return false;
        acts.push({ op: "upgrade", slot: si });
        g -= c;
        t.tier += 1;
        t.spent += c;
        return true;
      }

      function replaceT(si, type, tier, res) {
        const t = simSlots[si].turret;
        const refund = t ? Math.floor(t.spent * 70 / 100) : 0;
        const need = COST[type] * (tier === 3 ? 4 : (tier === 2 ? 2 : 1));
        const ops = (t ? 1 : 0) + tier;
        if (g + refund - need < res || acts.length + ops > 32) return false;
        if (t) sell(si);
        build(si, type, 0);
        for (let k = 2; k <= tier; k++) upgrade(si, 0);
        return true;
      }

      let minGTTL = 999;
      let minATTL = 999;
      let gHp = 0;
      let aHp = 0;
      let deepA = 0;
      for (let i = 0; i < state.enemies.length; i++) {
        const e = state.enemies[i];
        const spd = SPD[e.type] || 10;
        const effSpd = e.slowed ? Math.floor(spd * 60 / 100) : spd;
        const ttl = e.remaining / effSpd;
        if (e.air) {
          aHp += e.hp;
          if (ttl < minATTL) minATTL = ttl;
          if (e.remaining < 1100) deepA += e.hp;
        } else {
          gHp += e.hp;
          if (ttl < minGTTL) minGTTL = ttl;
        }
      }

      let nextAir = 0;
      for (let i = 0; i < state.nextWave.length; i++) {
        if (state.nextWave[i] === "wisp") nextAir++;
      }

      // Phase 1: Lean compound-interest opener to hit 1000g bank rapidly with zero early leaks
      if (!hitBank && w <= 22) {
        if (w === 1 && !simSlots[1].turret) build(1, "bolt", 0);
        if (!simSlots[3].turret && (minGTTL < 145 || gHp > 240)) build(3, "cannon", 0);
        if (!simSlots[12].turret && (minATTL < 95 || aHp > 130 || (w >= 4 && nextAir >= 2))) build(12, "flak", 0);
        if (!simSlots[15].turret && (minATTL < 80 || aHp > 220)) build(15, "frost", 0);
        if (!simSlots[6].turret && (minGTTL < 110 || gHp > 700)) build(6, "cannon", 0);
        if (!simSlots[4].turret && (minGTTL < 95 || gHp > 1200)) build(4, "cannon", 0);
        if (!simSlots[14].turret && (minGTTL < 65 || minATTL < 60)) build(14, "bolt", 0);
        if (simSlots[12].turret && simSlots[12].turret.tier === 1 && (minATTL < 65 || aHp > 350)) upgrade(12, 0);
        if (simSlots[3].turret && simSlots[3].turret.tier === 1 && (minGTTL < 75 || gHp > 1650)) upgrade(3, 0);
        firedWave.fill(0);
        return acts;
      }

      // Phase 2: Interest-backed scaling & late-game front-to-air pivot
      const inPivot = (w >= 39);
      const lay = inPivot ? PIV_LAY : MID_LAY;

      let resG = (w < 35) ? 1000 : 0;
      let resA = (w < 35) ? 1000 : 0;
      if (w >= 26 && w < 35) {
        resG = resA = Math.floor(1000 * (35 - w) / 9);
      }

      let emergG = 0;
      let emergA = 0;
      if (minGTTL < 55 || state.baseHp < 10) emergG = (minGTTL < 45 ? 4 : 2);
      if (minATTL < 55 || state.baseHp < 10) emergA = (minATTL < 45 ? 4 : 2);
      if (state.baseHp <= 6 && w < 38) {
        resG = 0;
        resA = 0;
      }

      if (simSlots[1].turret && simSlots[1].turret.type === "bolt" && lay[1] !== "bolt" && w >= 18) {
        const ref = Math.floor(simSlots[1].turret.spent * 70 / 100);
        if (g + ref - COST[lay[1]] >= resG || w >= 25) {
          sell(1);
          build(1, lay[1], 0);
        }
      }

      const earlyAirCrisis = (!inPivot && w >= 22 && (minATTL < 52 || (deepA > 850 && minATTL < 72)));
      if (earlyAirCrisis && simSlots[10].turret && simSlots[10].turret.type === "frost" && g >= 280) {
        replaceT(10, "flak", 3, 0);
      }

      const airUrg = (minATTL < 85 || deepA > 350 || emergA > 0);

      for (let pass = 0; pass < 2; pass++) {
        const list = pass === 0 ? (airUrg ? AIR_PRIO : GND_PRIO) : (airUrg ? GND_PRIO : AIR_PRIO);
        for (let i = 0; i < 16; i++) {
          const s = list[i];
          const want = lay[s];
          const isAir = (want === "flak" || want === "frost" || (want === "bolt" && s === 14));
          if (pass === 0 && airUrg && !isAir) continue;
          if (pass === 0 && !airUrg && isAir && s !== 12 && s !== 15 && s !== 14) continue;
          const res = isAir ? resA : resG;
          const t = simSlots[s].turret;
          if (!t) {
            if (!build(s, want, res)) {
              if (isAir && emergA > 0 && build(s, want, 0)) emergA--;
              else if (!isAir && emergG > 0 && build(s, want, 0)) emergG--;
            }
          } else if (inPivot && t.type !== want) {
            replaceT(s, want, want === "frost" ? 1 : 3, 0);
          }
        }
      }

      for (let targetTier = 2; targetTier <= 3; targetTier++) {
        const list = airUrg ? AIR_PRIO : UPG_PRIO;
        for (let i = 0; i < 16; i++) {
          const s = list[i];
          const want = lay[s];
          if (want === "frost" && w < 45) continue;
          const isAir = (want === "flak" || want === "frost" || (want === "bolt" && s === 14));
          const res = isAir ? resA : resG;
          const t = simSlots[s].turret;
          if (t && t.type === want && t.tier < targetTier) {
            if (!upgrade(s, res)) {
              if (isAir && emergA > 0 && upgrade(s, 0)) emergA--;
              else if (!isAir && emergG > 0 && upgrade(s, 0)) emergG--;
            }
          }
        }
      }

      if (inPivot) {
        for (let i = 0; i < 16; i++) {
          const s = PIV_PRIO[i];
          const want = lay[s];
          const t = simSlots[s].turret;
          if (!t) build(s, want, 0);
          else if (t.type !== want) replaceT(s, want, want === "frost" ? 1 : 3, 0);
          else if (t.tier < 3 && (want !== "frost" || g >= 350)) upgrade(s, 0);
        }
      }

      let allMax = true;
      for (let i = 0; i < 16; i++) {
        const t = simSlots[i].turret;
        if (!t || (t.type !== "frost" && t.tier < 3)) {
          allMax = false;
          break;
        }
      }

      // Phase 3: Endgame frost range expansion & wave-start cooldown resets
      if (allMax && w >= 36) {
        for (let i = 0; i < 16; i++) {
          const t = simSlots[i].turret;
          if (t && t.type === "frost" && t.tier < 3) upgrade(i, 0);
        }
        const cdRes = (w >= 40) ? 0 : 1000;
        if (g > cdRes + 108) {
          const cands = [];
          for (let i = 0; i < 16; i++) {
            const t = simSlots[i].turret;
            if (!t || t.tier < 3) continue;
            if (t.type !== "cannon" && t.type !== "lance") continue;
            if (firedWave[i] === 0) continue;
            const sl = simSlots[i];
            const rng = t.type === "lance" ? 420 : 320;
            let nearVal = 0;
            for (let j = 0; j < state.enemies.length; j++) {
              const e = state.enemies[j];
              if (e.air) continue;
              const dx = e.x - sl.x;
              const dy = e.y - sl.y;
              if (dx * dx + dy * dy <= rng * rng) {
                const spd = SPD[e.type] || 10;
                const ttl = e.remaining / (e.slowed ? Math.floor(spd * 60 / 100) : spd);
                nearVal += Math.exp(-ttl / 32) * (e.type === "runner" ? 2.5 : 1.0) + 0.1;
              }
            }
            if (nearVal > 0) {
              cands.push({ slot: i, type: t.type, score: nearVal * (t.type === "lance" ? 2.5 : 1.0) });
            }
          }
          cands.sort(function (a, b) { return b.score - a.score; });
          for (let k = 0; k < cands.length; k++) {
            if (acts.length + 4 > 32) break;
            const c = cands[k];
            const net = c.type === "lance" ? 144 : 108;
            if (g - net < cdRes) break;
            replaceT(c.slot, c.type, 3, cdRes);
          }
        }
      }

      firedWave.fill(0);
      return acts;
    },

    target(turret, candidates) {
      firedWave[turret.slot]++;
      const n = candidates.length;
      if (n === 1) return candidates[0].id;

      if (turret.type === "frost") {
        let best = null;
        let bestSc = -1e18;
        for (let i = 0; i < n; i++) {
          const c = candidates[i];
          const spd = SPD[c.type] || 10;
          const ttl = c.remaining / spd;
          const unslowed = c.slowed ? 0 : 1;
          const last = frostSeq[c.id] || 0;
          let typePrio = 0;
          if (c.type === "wisp") typePrio = 12000;
          else if (c.type === "runner") typePrio = 12000;
          else if (c.type === "splitling") typePrio = 5000;
          else if (ttl < 75) typePrio = 10000;
          const sc = unslowed * 1e9 - (unslowed ? 0 : last * 1e4) + typePrio - ttl * 160;
          if (sc > bestSc) {
            bestSc = sc;
            best = c;
          }
        }
        if (best) {
          frostSeq[best.id] = seq++;
          return best.id;
        }
      }

      if (turret.type === "cannon" || turret.type === "flak") {
        const isCannon = turret.type === "cannon";
        const r2 = isCannon ? 8100 : 4900;
        const dmgBase = isCannon
          ? (turret.tier === 3 ? 153 : (turret.tier === 2 ? 96 : 60))
          : (turret.tier === 3 ? 102 : (turret.tier === 2 ? 64 : 40));

        const late = curWave >= 38;
        const val = new Float64Array(n);
        for (let j = 0; j < n; j++) {
          const o = candidates[j];
          const effDmg = Math.max(1, dmgBase - o.armor);
          const spd = SPD[o.type] || 10;
          const effSpd = o.slowed ? Math.floor(spd * 60 / 100) : spd;
          const ttl = o.remaining / effSpd;
          const leak = LEAK[o.type] || 1;

          const tau = isCannon ? (late ? 14 : 28) : (late ? 21 : 28);
          const expW = late ? 2800 : 450;
          const urg = 1.0 + expW * Math.exp(-ttl / tau);
          const killBoost = (o.hp <= effDmg)
            ? ((o.type === "splitter" && o.remaining < 850) ? 0.12 : 3.4)
            : (1.0 + 2.5 * (1 - o.hp / o.maxHp));
          const baseVal = (o.hp <= effDmg ? effDmg : Math.min(o.hp, effDmg));
          const typeW = (o.type === "mender") ? 12.0 : ((o.type === "runner" && late) ? 4.0 : 1.0);
          const splitHold = (late && o.type === "splitter" && o.remaining < 1600) ? 0.2 : 1.0;
          const maxShots = (ttl / (isCannon ? 24 : 10)) * (isCannon ? 3.5 : 2.5) + 1.1;
          const tri = (ttl < 45 && o.hp > effDmg * maxShots) ? 0.08 : 1.0;

          val[j] = baseVal * urg * killBoost * typeW * splitHold * tri * (0.6 + 0.4 * leak);
        }

        let best = 0;
        let bestSc = -1e18;
        for (let i = 0; i < n; i++) {
          const cx = candidates[i].x;
          const cy = candidates[i].y;
          let sc = 0;
          for (let j = 0; j < n; j++) {
            const dx = candidates[j].x - cx;
            const dy = candidates[j].y - cy;
            if (dx * dx + dy * dy <= r2) sc += val[j];
          }
          if (sc > bestSc) {
            bestSc = sc;
            best = i;
          }
        }
        return candidates[best].id;
      }

      if (turret.type === "lance" || turret.type === "bolt") {
        const isLance = turret.type === "lance";
        const dmgBase = isLance
          ? (turret.tier === 3 ? 460 : (turret.tier === 2 ? 288 : 180))
          : (turret.tier === 3 ? 65 : (turret.tier === 2 ? 41 : 26));
        let best = 0;
        let bestSc = -1e18;
        for (let j = 0; j < n; j++) {
          const o = candidates[j];
          const effDmg = isLance ? dmgBase : Math.max(1, dmgBase - o.armor);
          const spd = SPD[o.type] || 10;
          const effSpd = o.slowed ? Math.floor(spd * 60 / 100) : spd;
          const ttl = o.remaining / effSpd;
          const leak = LEAK[o.type] || 1;
          const urg = 1.0 + 3000 * Math.exp(-ttl / 18);
          const killBoost = (o.hp <= effDmg)
            ? ((o.type === "splitter" && o.remaining < 850) ? 0.1 : 4.2)
            : (1.0 + 1.5 * (1 - o.hp / o.maxHp));
          const typeW = o.type === "mender" ? 2.8 : (o.type === "runner" ? 2.6 : (o.type === "wisp" ? 2.8 : (o.type === "brute" ? 1.4 : 1.0)));
          const sc = effDmg * urg * killBoost * typeW * (0.6 + 0.4 * leak);
          if (sc > bestSc) {
            bestSc = sc;
            best = j;
          }
        }
        return candidates[best].id;
      }

      return -1;
    }
  };
}
</script>

<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks) {
  const recorder = arguments.length > 3 ? arguments[3] : null;

  const GROUND_PTS = [
    [50, 250], [650, 250], [650, 1050], [1250, 1050],
    [1250, 350], [1850, 350], [1850, 1150], [2350, 1150]
  ];
  const AIR_PTS = [
    [50, 650], [2150, 650], [2150, 1150], [2350, 1150]
  ];

  function buildRoute(pts) {
    const segs = [];
    let total = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const x0 = pts[i][0], y0 = pts[i][1];
      const x1 = pts[i + 1][0], y1 = pts[i + 1][1];
      const dx = x1 - x0, dy = y1 - y0;
      const len = Math.abs(dx) + Math.abs(dy);
      const sx = dx === 0 ? 0 : (dx > 0 ? 1 : -1);
      const sy = dy === 0 ? 0 : (dy > 0 ? 1 : -1);
      segs.push({ x0: x0, y0: y0, sx: sx, sy: sy, start: total, end: total + len });
      total += len;
    }
    return { segs: segs, len: total };
  }

  const GROUND_ROUTE = buildRoute(GROUND_PTS);
  const AIR_ROUTE = buildRoute(AIR_PTS);

  function posOnRoute(route, progress) {
    const segs = route.segs;
    for (let i = 0; i < segs.length; i++) {
      const s = segs[i];
      if (progress <= s.end || i === segs.length - 1) {
        const d = progress - s.start;
        return [s.x0 + s.sx * d, s.y0 + s.sy * d];
      }
    }
    const last = segs[segs.length - 1];
    return [last.x0, last.y0];
  }

  const SLOTS_XY = [
    [3, 3], [5, 5], [7, 4], [7, 8], [9, 9], [10, 5], [11, 8], [13, 8],
    [14, 5], [15, 2], [16, 7], [17, 4], [19, 8], [20, 10], [22, 9], [3, 7]
  ];

  const TURRET_TYPES = {
    bolt:   { idx: 0, cost: 50,  dmg: 26,  period: 8,  range: 300, splash: 0,  slow: 0,  pierce: false, ground: true,  air: true  },
    cannon: { idx: 1, cost: 90,  dmg: 60,  period: 24, range: 260, splash: 90, slow: 0,  pierce: false, ground: true,  air: false },
    frost:  { idx: 2, cost: 70,  dmg: 10,  period: 12, range: 240, splash: 0,  slow: 30, pierce: false, ground: true,  air: true  },
    lance:  { idx: 3, cost: 120, dmg: 180, period: 36, range: 360, splash: 0,  slow: 0,  pierce: true,  ground: true,  air: false },
    flak:   { idx: 4, cost: 80,  dmg: 40,  period: 10, range: 320, splash: 70, slow: 0,  pierce: false, ground: false, air: true  }
  };

  const ENEMY_LIST = [
    { type: "grunt",    idx: 0, baseHp: 60,  speed: 10, bounty: 4, leak: 1, air: 0, firstWave: 1, weight: 10 },
    { type: "runner",   idx: 1, baseHp: 40,  speed: 20, bounty: 4, leak: 1, air: 0, firstWave: 2, weight: 4  },
    { type: "wisp",     idx: 2, baseHp: 50,  speed: 12, bounty: 6, leak: 2, air: 1, firstWave: 3, weight: 3  },
    { type: "brute",    idx: 3, baseHp: 150, speed: 6,  bounty: 9, leak: 3, air: 0, firstWave: 4, weight: 3  },
    { type: "splitter", idx: 4, baseHp: 90,  speed: 8,  bounty: 6, leak: 2, air: 0, firstWave: 6, weight: 2  },
    { type: "mender",   idx: 5, baseHp: 70,  speed: 8,  bounty: 7, leak: 2, air: 0, firstWave: 8, weight: 1  }
  ];
  const ENEMY_DEF = {};
  for (let i = 0; i < ENEMY_LIST.length; i++) ENEMY_DEF[ENEMY_LIST[i].type] = ENEMY_LIST[i];
  ENEMY_DEF.splitling = { type: "splitling", idx: 6, baseHp: 0, speed: 12, bounty: 1, leak: 1, air: 0, firstWave: 999, weight: 0 };

  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return (t ^ (t >>> 14)) >>> 0;
    };
  }

  const rng = mulberry32(seed);
  const hpMult = [0, 1000];
  function getHpMult(w) {
    while (hpMult.length <= w) {
      hpMult.push(Math.floor(hpMult[hpMult.length - 1] * 108 / 100));
    }
    return hpMult[w];
  }

  function genWave(w) {
    const count = 4 + Math.floor(3 * w / 5);
    const avail = [];
    let totalW = 0;
    for (let i = 0; i < ENEMY_LIST.length; i++) {
      if (ENEMY_LIST[i].firstWave <= w) {
        avail.push(ENEMY_LIST[i]);
        totalW += ENEMY_LIST[i].weight;
      }
    }
    const comp = [];
    for (let i = 0; i < count; i++) {
      let r = rng() % totalW;
      let chosen = avail[avail.length - 1].type;
      for (let j = 0; j < avail.length; j++) {
        if (r < avail[j].weight) {
          chosen = avail[j].type;
          break;
        }
        r -= avail[j].weight;
      }
      comp.push(chosen);
    }
    return comp;
  }

  function makeEnemyView(e) {
    const routeLen = e.air ? AIR_ROUTE.len : GROUND_ROUTE.len;
    return {
      id: e.id,
      type: e.type,
      hp: e.hp,
      maxHp: e.maxHp,
      x: e.x,
      y: e.y,
      air: e.air,
      armor: e.armor,
      speed: e.speed,
      slowed: e.slow,
      remaining: routeLen - e.progress
    };
  }

  function fnv1a(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return (h >>> 0).toString(16).padStart(8, "0");
  }

  const strat = createStrategy();
  const hasTarget = strat && typeof strat.target === "function";

  let gold = 250;
  let baseHp = 10;
  let wave = 0;
  let nextEnemyId = 1;
  let fallTick = -1;
  const log = [];

  const slots = [];
  for (let i = 0; i < 16; i++) {
    slots.push({
      slot: i,
      x: SLOTS_XY[i][0] * 100 + 50,
      y: SLOTS_XY[i][1] * 100 + 50,
      turret: null
    });
  }

  let enemies = [];
  const spawnQueue = [];
  let curWaveComp = genWave(1);
  let nextWaveComp = null;

  function insertSpawn(item) {
    let pos = spawnQueue.length;
    while (pos > 0) {
      const prev = spawnQueue[pos - 1];
      if (
        prev.tick < item.tick ||
        (prev.tick === item.tick && (prev.wave < item.wave || (prev.wave === item.wave && prev.idx <= item.idx)))
      ) {
        break;
      }
      pos--;
    }
    spawnQueue.splice(pos, 0, item);
  }

  let spawnCursor = 0;

  for (let tick = 0; tick < maxTicks; tick++) {
    // 1. Wave start
    if (tick >= 20 && (tick - 20) % 40 === 0) {
      wave = 1 + (tick - 20) / 40;
      const interest = Math.min(50, Math.floor(gold * 5 / 100));
      gold += interest + 10 + 2 * wave;

      if (wave > 1) curWaveComp = nextWaveComp;
      nextWaveComp = genWave(wave + 1);

      if (recorder && recorder.onWave) recorder.onWave(tick, wave, nextWaveComp);

      const state = {
        tick: tick,
        wave: wave,
        gold: gold,
        baseHp: baseHp,
        slots: slots.map(function (s) {
          return {
            slot: s.slot,
            x: s.x,
            y: s.y,
            turret: s.turret ? { type: s.turret.type, tier: s.turret.tier, spent: s.turret.spent } : null
          };
        }),
        enemies: enemies.map(makeEnemyView),
        nextWave: nextWaveComp.slice()
      };

      const actions = strat.plan(state);
      if (Array.isArray(actions)) {
        const limit = Math.min(32, actions.length);
        for (let i = 0; i < limit; i++) {
          const act = actions[i];
          if (!act || typeof act !== "object") continue;
          const si = act.slot;
          if (!Number.isInteger(si) || si < 0 || si >= 16) continue;
          const sl = slots[si];
          if (act.op === "build") {
            if (sl.turret !== null) continue;
            const def = TURRET_TYPES[act.type];
            if (!def || gold < def.cost) continue;
            gold -= def.cost;
            sl.turret = {
              type: act.type,
              idx: def.idx,
              tier: 1,
              spent: def.cost,
              dmg: def.dmg,
              period: def.period,
              range: def.range,
              splash: def.splash,
              slow: def.slow,
              pierce: def.pierce,
              ground: def.ground,
              air: def.air,
              cd: 0
            };
            log.push([tick, "B", si, def.idx]);
            if (recorder && recorder.onBuild) recorder.onBuild(tick, "B", si, def.idx, 1);
          } else if (act.op === "upgrade") {
            const t = sl.turret;
            if (!t || t.tier >= 3) continue;
            const def = TURRET_TYPES[t.type];
            const cost = t.tier === 1 ? def.cost : def.cost * 2;
            if (gold < cost) continue;
            gold -= cost;
            t.tier += 1;
            t.spent += cost;
            t.dmg = Math.floor(t.dmg * 16 / 10);
            t.range += 30;
            log.push([tick, "U", si, t.tier]);
            if (recorder && recorder.onBuild) recorder.onBuild(tick, "U", si, t.idx, t.tier);
          } else if (act.op === "sell") {
            const t = sl.turret;
            if (!t) continue;
            const prevIdx = t.idx;
            gold += Math.floor(t.spent * 70 / 100);
            sl.turret = null;
            log.push([tick, "S", si, 0]);
            if (recorder && recorder.onBuild) recorder.onBuild(tick, "S", si, prevIdx, 0);
          }
        }
      }

      for (let i = 0; i < curWaveComp.length; i++) {
        insertSpawn({ tick: tick + 4 * i, wave: wave, idx: i, type: curWaveComp[i] });
      }
    }

    // 2. Spawn
    while (spawnCursor < spawnQueue.length && spawnQueue[spawnCursor].tick === tick) {
      const sp = spawnQueue[spawnCursor++];
      const def = ENEMY_DEF[sp.type];
      const maxHp = Math.floor(def.baseHp * getHpMult(sp.wave) / 1000);
      let armor = 0;
      if (sp.type === "grunt") armor = Math.floor(sp.wave / 4);
      else if (sp.type === "brute") armor = 6 + sp.wave;
      const route = def.air ? AIR_ROUTE : GROUND_ROUTE;
      const p = posOnRoute(route, 0);
      enemies.push({
        id: nextEnemyId++,
        type: sp.type,
        typeIdx: def.idx,
        wave: sp.wave,
        hp: maxHp,
        maxHp: maxHp,
        speed: def.speed,
        armor: armor,
        bounty: def.bounty,
        leak: def.leak,
        air: def.air,
        progress: 0,
        x: p[0],
        y: p[1],
        age: 0,
        slow: 0
      });
    }

    // 3. Move
    let fell = false;
    const survivors = [];
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      const step = e.slow > 0 ? Math.floor(e.speed * 60 / 100) : e.speed;
      e.progress += step;
      const route = e.air ? AIR_ROUTE : GROUND_ROUTE;
      if (e.progress >= route.len) {
        baseHp -= e.leak;
        log.push([tick, "L", e.id, baseHp]);
        if (recorder && recorder.onLeak) recorder.onLeak(tick, e.id, e.leak, baseHp, e.air);
        if (baseHp <= 0) {
          fallTick = tick;
          log.push([tick, "F", wave, 0]);
          fell = true;
          for (let j = i + 1; j < enemies.length; j++) survivors.push(enemies[j]);
          break;
        }
      } else {
        const p = posOnRoute(route, e.progress);
        e.x = p[0];
        e.y = p[1];
        survivors.push(e);
      }
    }
    enemies = survivors;
    if (fell) {
      if (recorder && recorder.onTick) {
        recorder.onTick(tick, wave, gold, baseHp, slots, enemies, nextWaveComp || curWaveComp);
      }
      break;
    }

    // 4. Age & heal
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      e.age += 1;
      if (e.type === "mender" && e.age % 20 === 0) {
        const mx = e.x, my = e.y;
        if (recorder && recorder.onHeal) recorder.onHeal(tick, mx, my);
        for (let j = 0; j < enemies.length; j++) {
          const o = enemies[j];
          const dx = o.x - mx, dy = o.y - my;
          if (dx * dx + dy * dy <= 150 * 150) {
            const heal = Math.floor(o.maxHp * 8 / 100);
            o.hp = Math.min(o.maxHp, o.hp + heal);
          }
        }
      }
    }

    // 5. Turrets fire
    for (let si = 0; si < 16; si++) {
      const sl = slots[si];
      const t = sl.turret;
      if (!t) continue;
      if (t.cd > 0) {
        t.cd -= 1;
        if (t.cd > 0) continue;
      }
      const r2 = t.range * t.range;
      const cands = [];
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (e.air ? !t.air : !t.ground) continue;
        const dx = e.x - sl.x, dy = e.y - sl.y;
        if (dx * dx + dy * dy <= r2) cands.push(e);
      }
      if (cands.length === 0) continue;

      let chosen = null;
      if (hasTarget) {
        const tView = { slot: si, type: t.type, tier: t.tier, x: sl.x, y: sl.y, range: t.range };
        const cViews = cands.map(makeEnemyView);
        const tid = strat.target(tView, cViews);
        for (let i = 0; i < cands.length; i++) {
          if (cands[i].id === tid) { chosen = cands[i]; break; }
        }
      }
      if (!chosen) {
        let best = cands[0];
        let bestRem = (best.air ? AIR_ROUTE.len : GROUND_ROUTE.len) - best.progress;
        for (let i = 1; i < cands.length; i++) {
          const c = cands[i];
          const rem = (c.air ? AIR_ROUTE.len : GROUND_ROUTE.len) - c.progress;
          if (rem < bestRem) { best = c; bestRem = rem; }
        }
        chosen = best;
      }

      if (recorder && recorder.onShot) {
        recorder.onShot(tick, si, t.idx, t.tier, sl.x, sl.y, chosen.x, chosen.y, t.splash, chosen.air);
      }

      if (t.splash > 0) {
        const sp2 = t.splash * t.splash;
        const tx = chosen.x, ty = chosen.y;
        for (let i = 0; i < enemies.length; i++) {
          const e = enemies[i];
          if (e.air ? !t.air : !t.ground) continue;
          const dx = e.x - tx, dy = e.y - ty;
          if (dx * dx + dy * dy <= sp2) {
            const dmg = t.pierce ? t.dmg : Math.max(1, t.dmg - e.armor);
            e.hp -= dmg;
            if (t.slow > 0) e.slow = t.slow;
          }
        }
      } else {
        const dmg = t.pierce ? t.dmg : Math.max(1, t.dmg - chosen.armor);
        chosen.hp -= dmg;
        if (t.slow > 0) chosen.slow = t.slow;
      }

      t.cd = t.period;

      let anyDead = false;
      for (let i = 0; i < enemies.length; i++) {
        if (enemies[i].hp <= 0) { anyDead = true; break; }
      }
      if (anyDead) {
        const alive = [];
        const spawned = [];
        for (let i = 0; i < enemies.length; i++) {
          const e = enemies[i];
          if (e.hp <= 0) {
            gold += e.bounty;
            log.push([tick, "K", e.id, si]);
            if (recorder && recorder.onKill) {
              recorder.onKill(tick, e.id, e.typeIdx, e.x, e.y, e.air, e.progress);
            }
            if (e.type === "splitter") {
              const sMaxHp = Math.max(1, Math.floor(e.maxHp / 4));
              for (let k = 0; k < 3; k++) {
                spawned.push({
                  id: nextEnemyId++,
                  type: "splitling",
                  typeIdx: 6,
                  wave: e.wave,
                  hp: sMaxHp,
                  maxHp: sMaxHp,
                  speed: 12,
                  armor: 0,
                  bounty: 1,
                  leak: 1,
                  air: 0,
                  progress: e.progress,
                  x: e.x,
                  y: e.y,
                  age: 0,
                  slow: 0
                });
              }
            }
          } else {
            alive.push(e);
          }
        }
        for (let k = 0; k < spawned.length; k++) alive.push(spawned[k]);
        enemies = alive;
      }
    }

    // 6. Slow timers
    for (let i = 0; i < enemies.length; i++) {
      if (enemies[i].slow > 0) enemies[i].slow -= 1;
    }

    if (recorder && recorder.onTick) {
      recorder.onTick(tick, wave, gold, baseHp, slots, enemies, nextWaveComp || curWaveComp);
    }
  }

  const endTick = fallTick >= 0 ? fallTick : maxTicks;
  const score = Math.round(((endTick - 20) * 100) / 40) / 100;
  const hash = fnv1a(JSON.stringify(log));
  return { score: score, fallTick: fallTick, log: log, hash: hash };
}

<script>
(function () {

    let a = seed | 0;

      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

  // Board geometry constants (matching section 2.1 exactly)
  const GROUND_TILES = [[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]];
  const AIR_TILES = [[0,6],[21,6],[21,11],[23,11]];

    [3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],

  ];
  const KEEP_X = 23.5, KEEP_Z = 11.5;

  function buildWorldRoute(tiles) {

    for (let i = 0; i < tiles.length - 1; i++) {
      const x0 = tiles[i][0] + 0.5, z0 = tiles[i][1] + 0.5;
      const x1 = tiles[i + 1][0] + 0.5, z1 = tiles[i + 1][1] + 0.5;
      const dx = x1 - x0, dz = z1 - z0;
      const len = Math.abs(dx) + Math.abs(dz);
      const sx = dx === 0 ? 0 : (dx > 0 ? 1 : -1);
      const sz = dz === 0 ? 0 : (dz > 0 ? 1 : -1);
      segs.push({ x0: x0, z0: z0, sx: sx, sz: sz, start: total, end: total + len });

    return { segs: segs, len: total };
  }
  const W_GROUND = buildWorldRoute(GROUND_TILES);

  function sampleRoute(route, progressTiles) {

    const segs = route.segs;
    for (let i = 0; i < segs.length; i++) {
      const s = segs[i];
      if (p <= s.end || i === segs.length - 1) {
        const d = p - s.start;
        return { x: s.x0 + s.sx * d, z: s.z0 + s.sz * d, dx: s.sx, dz: s.sz };
      }
    }
    const last = segs[segs.length - 1];
    return { x: last.x0, z: last.z0, dx: last.sx, dz: last.sz };

  // =========================================================================
  // 1. PRECOMPUTE DETERMINISTIC REPLAY (SEED 42, TICKS 0..2019)

  const ENEMY_TYPE_TO_IDX = { grunt: 0, runner: 1, wisp: 2, brute: 3, splitter: 4, mender: 5, splitling: 6 };

    for (let i = 0; i < comp.length; i++) {

  const replayTicks = [];

  const leakByTickId = Object.create(null);  // key: tick + ":" + id -> { air }
  const lastAim = new Array(16).fill(null);

  const recorder = {
    onWave: function (tick, wave) {
      waveStarts.push({ tick: tick, t: tick / TICKS_PER_SEC, wave: wave });
    },
    onBuild: function (tick, op, slot, typeIdx, tier) {
      builds.push({ tick: tick, t: tick / TICKS_PER_SEC, op: op, slot: slot, typeIdx: typeIdx, tier: tier });
      if (op === "S") lastAim[slot] = null;
    },
    onShot: function (tick, slot, typeIdx, tier, x0, y0, x1, y1, splash, targetAir) {
      const wx0 = x0 / 100, wz0 = y0 / 100;
      const wx1 = x1 / 100, wz1 = y1 / 100;

        tick: tick, t: tick / TICKS_PER_SEC, slot: slot, typeIdx: typeIdx, tier: tier,

      });

      kills.push({
        tick: tick, t: tick / TICKS_PER_SEC, id: id, typeIdx: typeIdx,
        x: x / 100, z: y / 100, air: air
      });
      deathByTickId[tick + ":" + id] = progress / 100;
    },
    onHeal: function (tick, x, y) {
      heals.push({ tick: tick, t: tick / TICKS_PER_SEC, x: x / 100, z: y / 100 });
    },
    onLeak: function (tick, id, leakDmg, baseHpAfter, air) {
      leaks.push({ tick: tick, t: tick / TICKS_PER_SEC, id: id, dmg: leakDmg, hpAfter: baseHpAfter, air: air });
      leakByTickId[tick + ":" + id] = true;
    },
    onTick: function (tick, wave, gold, baseHp, slots, enemies, nextWaveComp) {
      const tArr = new Array(16);
      for (let i = 0; i < 16; i++) {
        const t = slots[i].turret;
        tArr[i] = t ? { idx: t.idx, tier: t.tier, yaw: lastAim[i] !== null ? lastAim[i] : 0 } : null;
      }
      const n = enemies.length;
      const eIds = new Int32Array(n);
      const eTypes = new Uint8Array(n);
      const eProg = new Float32Array(n);
      const eHpFrac = new Float32Array(n);
      const eSlow = new Uint8Array(n);
      const eAir = new Uint8Array(n);

    const minNdcY = -1 + 2 * (96 / Math.max(300, h));
    const maxNdcY = 1 - 2 * (34 / Math.max(300, h));
    const maxNdcX = 0.96;
    const midNdcY = 0.5 * (minNdcY + maxNdcY);

    let dist = 28;
    const p = new THREE.Vector3();

    // Exact 14-step fit for cz (vertical centering in safe rect) and dist (bounding box fit)

      camera.position.set(12, dist * SIN_EL, cz + dist * COS_EL);
      camera.lookAt(12, 0, cz);
      camera.updateMatrixWorld(true);

      let loX = 1e9, hiX = -1e9, loY = 1e9, hiY = -1e9;
      for (let i = 0; i < boardCorners.length; i++) {
        p.copy(boardCorners[i]).project(camera);
        if (p.x < loX) loX = p.x;
        if (p.x > hiX) hiX = p.x;
        if (p.y < loY) loY = p.y;
        if (p.y > hiY) hiY = p.y;

      const spanY = (hiY - loY) * 0.5;
      const allowY = (maxNdcY - minNdcY) * 0.5;
      const scaleNeeded = Math.max(spanX / maxNdcX, spanY / allowY);
      dist *= (0.5 + 0.5 * scaleNeeded);
