  // Detached in-memory digit glyph atlas (0-9 only, zero DOM elements, zero words!)
  function createDigitAtlas() {
    const cellW = 64, cellH = 96;
    const c = document.createElement("canvas");
    c.width = cellW * 10;
    c.height = cellH;
    const ctx = c.getContext("2d");
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.font = "800 72px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (let d = 0; d < 10; d++) {
      const cx = d * cellW + cellW * 0.5;
      const cy = cellH * 0.53;
      ctx.lineWidth = 8;
      ctx.strokeStyle = "rgba(6, 8, 14, 0.85)";
      ctx.strokeText(String(d), cx, cy);
      ctx.fillStyle = "#ffffff";
      ctx.fillText(String(d), cx, cy);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    return tex;
  }

  const digitAtlasTex = createDigitAtlas();

  // Pre-build 10 unit PlaneGeometries with UV slices for digits 0..9
  const digitGeos = [];
  for (let d = 0; d < 10; d++) {
    const g = new THREE.PlaneGeometry(1, 1);
    const u0 = d * 0.1, u1 = (d + 1) * 0.1;
    const uv = g.attributes.uv;
    uv.setXY(0, u0, 1);
    uv.setXY(1, u1, 1);
    uv.setXY(2, u0, 0);
    uv.setXY(3, u1, 0);
    uv.needsUpdate = true;
    digitGeos.push(g);
  }

  function makeDigitGroup(maxDigits, colorHex) {
    const group = new THREE.Group();
    const mat = new THREE.MeshBasicMaterial({ map: digitAtlasTex, color: colorHex, transparent: true, depthTest: false, depthWrite: false });
    const slots = [];
    for (let i = 0; i < maxDigits; i++) {
      const m = new THREE.Mesh(digitGeos[0], mat);
      m.renderOrder = 5;
      m.visible = false;
      group.add(m);
      slots.push(m);
    }
    hudScene.add(group);
    return { group: group, slots: slots, mat: mat };
  }

  function setDigitGroup(dg, numVal, leftX, centerY, digitH) {
    const str = String(Math.max(0, Math.floor(numVal)));
    const digitW = digitH * 0.64;
    const step = digitH * 0.56;
    for (let i = 0; i < dg.slots.length; i++) {
      const m = dg.slots[i];
      if (i < str.length) {
        const d = str.charCodeAt(i) - 48;
        m.geometry = digitGeos[d >= 0 && d <= 9 ? d : 0];
        m.scale.set(digitW, digitH, 1);
        m.position.set(leftX + i * step + digitW * 0.5, centerY, 0);
        m.visible = true;
      } else {
        m.visible = false;
      }
    }
    return str.length * step;
  }

  function hudMat(hex, opacity) {
    return new THREE.MeshBasicMaterial({
      color: hex,
      transparent: true,
      opacity: opacity === undefined ? 1.0 : opacity,
      depthTest: false,
      depthWrite: false
    });
  }

  // Top-Left: Wave Glyph (crossed blades emblem) + Large Wave Number (>= 7% viewport height)
  const waveGlyphGroup = new THREE.Group();
  {
    const bladeGeo = new THREE.PlaneGeometry(0.16, 0.96);
    const guardGeo = new THREE.PlaneGeometry(0.38, 0.10);
    const bladeMat = hudMat(0xe2ecff);
    const hiltMat = hudMat(0xffc857);
    const b1 = new THREE.Mesh(bladeGeo, bladeMat); b1.rotation.z = -0.68; b1.renderOrder = 2; waveGlyphGroup.add(b1);
    const b2 = new THREE.Mesh(bladeGeo, bladeMat); b2.rotation.z = 0.68; b2.renderOrder = 2; waveGlyphGroup.add(b2);
    const g1 = new THREE.Mesh(guardGeo, hiltMat); g1.rotation.z = -0.68; g1.position.set(-0.22, -0.22, 0.1); g1.renderOrder = 3; waveGlyphGroup.add(g1);
    const g2 = new THREE.Mesh(guardGeo, hiltMat); g2.rotation.z = 0.68; g2.position.set(0.22, -0.22, 0.1); g2.renderOrder = 3; waveGlyphGroup.add(g2);
    const shield = new THREE.Mesh(new THREE.CircleGeometry(0.18, 6), hiltMat); shield.position.z = 0.2; shield.renderOrder = 4; waveGlyphGroup.add(shield);
  }
  hudScene.add(waveGlyphGroup);
  const hudWaveDigits = makeDigitGroup(3, 0xffffff);

  // Under Wave: Gold Coin Icon + Gold Digits
  const goldIconGroup = new THREE.Group();
  {
    const outer = new THREE.Mesh(new THREE.CircleGeometry(0.46, 20), hudMat(0xffc738));
    outer.renderOrder = 2;
    const rim = new THREE.Mesh(new THREE.RingGeometry(0.30, 0.38, 20), hudMat(0xb87614));
    rim.position.z = 0.1; rim.renderOrder = 3;
    const glint = new THREE.Mesh(new THREE.CircleGeometry(0.13, 12), hudMat(0xfff2ad));
    glint.position.set(-0.11, 0.12, 0.2); glint.renderOrder = 4;
    goldIconGroup.add(outer, rim, glint);
  }
  hudScene.add(goldIconGroup);
  const hudGoldDigits = makeDigitGroup(5, 0xffdc6b);

  // Under Gold: Next-Wave Preview (6 enemy type colored icons + digit counts)
  const previewIcons = [];
  const previewDigits = [];
  const PREVIEW_COLORS = [0x839e7c, 0xffd729, 0x36f5ff, 0xff7d1c, 0xa94dff, 0xf4f9ff];
  for (let t = 0; t < 6; t++) {
    const g = new THREE.Group();
    const bg = new THREE.Mesh(new THREE.CircleGeometry(0.46, 16), hudMat(0x0d111a, 0.80));
    bg.renderOrder = 1;
    g.add(bg);
    const colMat = hudMat(PREVIEW_COLORS[t]);
    if (t === 0) {
      const ic = new THREE.Mesh(new THREE.PlaneGeometry(0.50, 0.50), colMat); ic.position.z = 0.1; ic.renderOrder = 2; g.add(ic);
    } else if (t === 1) {
      const sh = new THREE.Shape();
      sh.moveTo(0.30, 0); sh.lineTo(-0.24, 0.24); sh.lineTo(-0.12, 0); sh.lineTo(-0.24, -0.24); sh.closePath();
      const ic = new THREE.Mesh(new THREE.ShapeGeometry(sh), colMat); ic.position.z = 0.1; ic.renderOrder = 2; g.add(ic);
    } else if (t === 2) {
      const ic = new THREE.Mesh(new THREE.CircleGeometry(0.28, 4), colMat); ic.position.z = 0.1; ic.renderOrder = 2; g.add(ic);
    } else if (t === 3) {
      const body = new THREE.Mesh(new THREE.PlaneGeometry(0.56, 0.44), hudMat(0x384050));
      body.position.z = 0.1; body.renderOrder = 2; g.add(body);
      const bar = new THREE.Mesh(new THREE.PlaneGeometry(0.60, 0.18), colMat); bar.position.set(0, 0.12, 0.2); bar.renderOrder = 3; g.add(bar);
    } else if (t === 4) {
      const d1 = new THREE.Mesh(new THREE.CircleGeometry(0.16, 10), colMat); d1.position.set(0, 0.15, 0.1); d1.renderOrder = 2;
      const d2 = new THREE.Mesh(new THREE.CircleGeometry(0.15, 10), colMat); d2.position.set(-0.15, -0.11, 0.1); d2.renderOrder = 2;
      const d3 = new THREE.Mesh(new THREE.CircleGeometry(0.15, 10), colMat); d3.position.set(0.15, -0.11, 0.1); d3.renderOrder = 2;
      g.add(d1, d2, d3);
    } else {
      const halo = new THREE.Mesh(new THREE.RingGeometry(0.28, 0.39, 16), hudMat(0x45ff90));
      halo.position.z = 0.1; halo.renderOrder = 2; g.add(halo);
      const core = new THREE.Mesh(new THREE.CircleGeometry(0.22, 12), colMat); core.position.z = 0.2; core.renderOrder = 3; g.add(core);
    }
    hudScene.add(g);
    previewIcons.push(g);
    previewDigits.push(makeDigitGroup(2, 0xe8eef8));
  }

  // Top-Right: 10 Base HP Pips in a row
  const hpPips = [];
  const pipOuterGeo = new THREE.CircleGeometry(0.52, 6);
  const pipInnerGeo = new THREE.CircleGeometry(0.38, 6);
  for (let i = 0; i < 10; i++) {
    const grp = new THREE.Group();
    const borderMat = hudMat(0x161c28, 0.90);
    const fillMat = hudMat(0x3ce88a, 1.0);
    const border = new THREE.Mesh(pipOuterGeo, borderMat);
    border.renderOrder = 1;
    const fill = new THREE.Mesh(pipInnerGeo, fillMat);
    fill.position.z = 0.1;
    fill.renderOrder = 2;
    grp.add(border, fill);
    hudScene.add(grp);
    hpPips.push({ grp: grp, borderMat: borderMat, fillMat: fillMat, fill: fill });
  }

  function updateHud(simTime, snap, w, h) {
    hudCamera.left = 0;
    hudCamera.right = w;
    hudCamera.top = h;
    hudCamera.bottom = 0;
    hudCamera.updateProjectionMatrix();

    const padX = Math.max(18, Math.round(w * 0.018));
    const padY = Math.max(16, Math.round(h * 0.024));

    // Wave number: strictly >= 7% of viewport height (use 7.8%!)
    const waveH = Math.max(46, Math.round(h * 0.078));
    const waveY = h - padY - waveH * 0.5;
    const glyphSize = waveH * 0.72;
    waveGlyphGroup.position.set(padX + glyphSize * 0.5, waveY, 0);
    waveGlyphGroup.scale.set(glyphSize, glyphSize, 1);
    setDigitGroup(hudWaveDigits, snap.wave, padX + glyphSize + waveH * 0.22, waveY, waveH);

    // Gold below wave number
    const goldH = Math.max(26, Math.round(h * 0.045));
    const goldY = waveY - waveH * 0.5 - goldH * 0.62;
    const coinSz = goldH * 0.80;
    goldIconGroup.position.set(padX + coinSz * 0.52, goldY, 0);
    goldIconGroup.scale.set(coinSz, coinSz, 1);
    setDigitGroup(hudGoldDigits, snap.gold, padX + coinSz + goldH * 0.24, goldY, goldH);

    // Next-wave preview row under gold
    const prevIconSz = Math.max(18, Math.round(h * 0.032));
    const prevDigH = Math.max(16, Math.round(h * 0.028));
    const prevY = goldY - goldH * 0.55 - prevIconSz * 0.68;
    let curX = padX + prevIconSz * 0.5;
    for (let t = 0; t < 6; t++) {
      const cnt = snap.nextCounts[t];
      if (cnt > 0) {
        previewIcons[t].visible = true;
        previewIcons[t].position.set(curX, prevY, 0);
        previewIcons[t].scale.set(prevIconSz, prevIconSz, 1);
        const digW = setDigitGroup(previewDigits[t], cnt, curX + prevIconSz * 0.56, prevY, prevDigH);
        curX += prevIconSz * 0.56 + digW + prevIconSz * 0.85;
      } else {
        previewIcons[t].visible = false;
        setDigitGroup(previewDigits[t], 0, -999, -999, 1);
        for (let k = 0; k < previewDigits[t].slots.length; k++) previewDigits[t].slots[k].visible = false;
      }
    }

    // Top-Right: 10 Base HP pips
    const pipSz = Math.max(18, Math.round(h * 0.033));
    const pipStep = pipSz * 1.18;
    const hpY = h - padY - pipSz * 0.72;
    const hpRightX = w - padX - pipSz * 0.5;
    const curHp = Math.max(0, Math.min(10, snap.baseHp));
    const liveColor = curHp >= 7 ? 0x3be88a : (curHp >= 4 ? 0xffb833 : 0xff4050);

    for (let i = 0; i < 10; i++) {
      const pip = hpPips[i];
      const px = hpRightX - (9 - i) * pipStep;
      const alive = i < curHp;
      const dtLost = simTime - pipLostTime[i];
      if (alive) {
        pip.grp.position.set(px, hpY, 0);
        pip.grp.scale.set(pipSz, pipSz, 1);
        pip.borderMat.color.setHex(0x161d29);
        pip.fill.visible = true;
        pip.fillMat.color.setHex(liveColor);
        pip.fillMat.opacity = 1.0;
      } else if (dtLost >= 0 && dtLost < 0.42) {
        // Short extinguish flash!
        const u = dtLost / 0.42;
        const pop = 1.0 + 0.45 * Math.sin(u * Math.PI);
        pip.grp.position.set(px, hpY, 0);
        pip.grp.scale.set(pipSz * pop, pipSz * pop, 1);
        pip.borderMat.color.setHex(0xff3848);
        pip.fill.visible = true;
        pip.fillMat.color.setHex(u < 0.25 ? 0xffffff : 0xff3b4b);
        pip.fillMat.opacity = 1.0 - u;
      } else {
        pip.grp.position.set(px, hpY, 0);
        pip.grp.scale.set(pipSz * 0.90, pipSz * 0.90, 1);
        pip.borderMat.color.setHex(0x1c2230);
        pip.fill.visible = false;
      }
    }
  }

  // =========================================================================
  // 8. DETERMINISTIC RENDER FUNCTION FOR ANY simTime IN [0, 100]
  // =========================================================================
  const _up = new THREE.Vector3(0, 1, 0);
  const _vA = new THREE.Vector3();
  const _vB = new THREE.Vector3();
  const _dir = new THREE.Vector3();
  const _colA = new THREE.Color();
  const _colB = new THREE.Color();

  function renderAtTime(simTime) {
    const tClamped = Math.max(0, Math.min(DURATION, simTime));

    // Fall freeze & 1.0s desaturation
    const hasFallen = (fallTime >= 0 && tClamped >= fallTime);
    const activeTime = hasFallen ? fallTime : tClamped;
    const desat = hasFallen ? Math.min(1.0, (tClamped - fallTime) / 1.0) : 0.0;

    // 1. Update scene desaturation (smooth & reversible on scrub!)
    for (let i = 0; i < desatMaterials.length; i++) {
      const dm = desatMaterials[i];
      if (dm.baseColor) desaturateColor(dm.baseColor, desat, dm.mat.color);
      if (dm.baseEmissive) desaturateColor(dm.baseEmissive, desat, dm.mat.emissive);
    }
    for (let i = 0; i < desatLights.length; i++) {
      const dl = desatLights[i];
      desaturateColor(dl.baseColor, desat, dl.light.color);
      if (dl.baseGround) desaturateColor(dl.baseGround, desat, dl.light.groundColor);
    }

    // 2. Closed-form trauma shake on fixed camera
    const trauma = evalTrauma(tClamped);
    const shakeMag = trauma * trauma * 0.25;
    let sx = 0, sy = 0, sz = 0;
    if (shakeMag > 0.0001) {
      sx = (Math.sin(tClamped * shakeFreqs[0].f + shakeFreqs[0].p) + 0.5 * Math.sin(tClamped * shakeFreqs[1].f + shakeFreqs[1].p)) * 0.66 * shakeMag;
      sy = (Math.sin(tClamped * shakeFreqs[2].f + shakeFreqs[2].p) + 0.5 * Math.sin(tClamped * shakeFreqs[3].f + shakeFreqs[3].p)) * 0.66 * shakeMag;
      sz = (Math.sin(tClamped * shakeFreqs[4].f + shakeFreqs[4].p) + 0.5 * Math.sin(tClamped * shakeFreqs[5].f + shakeFreqs[5].p)) * 0.66 * shakeMag;
    }
    camera.position.set(camBasePos.x + sx, camBasePos.y + sy, camBasePos.z + sz);
    camera.lookAt(camBaseTarget.x + sx * 0.6, camBaseTarget.y + sy * 0.4, camBaseTarget.z + sz * 0.6);

    // 3. Interpolated tick lookup
    const fTick = activeTime * TICKS_PER_SEC;
    const k = Math.min(lastRecordedTick, Math.max(0, Math.floor(fTick)));
    const kNext = Math.min(lastRecordedTick, k + 1);
    const alpha = (k === kNext || hasFallen) ? 0 : (fTick - k);
    const snap = replayTicks[k];
    const snapNext = replayTicks[kNext];

    // 4. Animate air-lane chevrons & portal (driven strictly by activeTime)
    for (let i = 0; i < CHEVRON_COUNT; i++) {
      const p = ((i / CHEVRON_COUNT) * W_AIR.len + activeTime * 2.2) % W_AIR.len;
      const pt = sampleRoute(W_AIR, p);
      _pos.set(pt.x, 0.80, pt.z);
      _euler.set(0, Math.atan2(-pt.dz, pt.dx), 0);
      _quat.setFromEuler(_euler);
      _scale.set(1, 1, 1);
      _mat4.compose(_pos, _quat, _scale);
      chevInst.setMatrixAt(i, _mat4);
    }
    chevInst.instanceMatrix.needsUpdate = true;
    airPortal.rotation.x = activeTime * 1.4;

    // 5. Keep state: crumbling walls, red leak flash, beacon flicker, collapse
    keepStanding.visible = !hasFallen;
    const curHp = Math.max(0, snap.baseHp);
    for (let i = 0; i < 10; i++) {
      keepWallChunks[i].visible = (i < curHp);
    }
    // Red flash from recent leaks
    let leakFlash = 0;
    for (let i = 0; i < leaks.length; i++) {
      const dt = tClamped - leaks[i].t;
      if (dt >= 0 && dt < 0.35) {
        const f = 1 - dt / 0.35;
        if (f > leakFlash) leakFlash = f;
      }
    }
    if (!hasFallen) {
      if (leakFlash > 0) {
        _colA.setRGB(leakFlash * 0.95, leakFlash * 0.08, leakFlash * 0.08);
        desaturateColor(_colA, desat, keepStoneMat.emissive);
        keepBeaconLight.color.setRGB(1.0, 0.15 + 0.45 * (1 - leakFlash), 0.12);
        keepBeaconLight.intensity = 1.45 + leakFlash * 2.4;
      } else {
        keepBeaconLight.color.setHex(0xff9b3d);
        desaturateColor(keepBeaconLight.color, desat, keepBeaconLight.color);
        keepBeaconLight.intensity = 1.35 + 0.18 * Math.sin(activeTime * 7.5);
      }
      keepBeacon.rotation.y = activeTime * 1.6;
      keepBeacon.position.y = 1.98 + 0.05 * Math.sin(activeTime * 3.8);
    } else {
      const dtFall = tClamped - fallTime;
      keepBeaconLight.color.setHex(0xff6b24);
      desaturateColor(keepBeaconLight.color, desat, keepBeaconLight.color);
      keepBeaconLight.intensity = Math.max(0, 3.8 * (1 - dtFall / 0.75));
    }

    // 6. Update 16 Turret slots (visibility, tier rings, smooth aiming, frost spin)
    for (let si = 0; si < 16; si++) {
      const sh = slotHolders[si];
      const td = snap.turrets[si];
      if (!td) {
        if (sh.activeType >= 0) {
          sh.cache[sh.activeType].root.visible = false;
          sh.activeType = -1;
        }
        continue;
      }
      if (sh.activeType !== td.idx) {
        if (sh.activeType >= 0) sh.cache[sh.activeType].root.visible = false;
        if (!sh.cache[td.idx]) {
          const tm = createTurretMesh(td.idx);
          sh.holder.add(tm.root);
          sh.cache[td.idx] = tm;
        }
        sh.activeType = td.idx;
      }
      const tm = sh.cache[td.idx];
      tm.root.visible = true;
      const tierScale = td.tier === 3 ? 1.22 : (td.tier === 2 ? 1.11 : 1.0);
      tm.root.scale.set(tierScale, tierScale, tierScale);
      for (let r = 0; r < 3; r++) tm.tierRings[r].visible = (r < td.tier);

      if (td.idx === 2) {
        // Frost spire spins deterministically
        tm.head.rotation.y = activeTime * 2.1 + si;
      } else {
        tm.head.rotation.y = td.yaw;
      }
    }

    // 7. Update Instanced Enemies & Health Bars (interpolated smoothly along routes!)
    const typeCounts = [0, 0, 0, 0, 0, 0, 0];
    let brutePlateCnt = 0;
    let menderHaloCnt = 0;
    let wispShadowCnt = 0;
    let hpCnt = 0;
    const camQuat = camera.quaternion;

    for (let i = 0; i < snap.n; i++) {
      const id = snap.eIds[i];
      const typeIdx = snap.eTypes[i];
      const isAir = snap.eAir[i];
      const p0 = snap.eProg[i];
      let p1 = p0;

      if (alpha > 0) {
        const idxNext = snapNext.idMap[id];
        if (idxNext !== undefined) {
          p1 = snapNext.eProg[idxNext];
        } else {
          const dProg = deathByTickId[kNext + ":" + id];
          if (dProg !== undefined) p1 = dProg;
          else if (leakByTickId[kNext + ":" + id]) p1 = isAir ? W_AIR.len : W_GROUND.len;
        }
      }

      const route = isAir ? W_AIR : W_GROUND;
      const pt = sampleRoute(route, p0 + (p1 - p0) * alpha);
      const yaw = Math.atan2(pt.dx, pt.dz);
      const slowed = snap.eSlow[i] > 0;

      // Compute instance color (base -> frost tint if slowed -> scene desaturation)
      _colA.copy(ENEMY_BASE_COLORS[typeIdx]);
      if (slowed) _colA.lerp(FROST_TINT_COLOR, 0.58);
      if (desat > 0) desaturateColor(_colA, desat, _colA);

      const pool = enemyPools[typeIdx];
      const instIdx = typeCounts[typeIdx];
      if (instIdx < MAX_ENEMIES_PER_TYPE) {
        let ey = 0.04;
        if (typeIdx === 2) {
          // Wisp floats 0.8 tiles above ground with gentle deterministic bob & ground shadow!
          ey = 0.80 + 0.06 * Math.sin(activeTime * 5.2 + id * 1.3);
          _pos.set(pt.x, ey, pt.z);
          _euler.set(0, activeTime * 2.4 + id, 0);
          _quat.setFromEuler(_euler);
          _scale.set(1, 1, 1);
          _mat4.compose(_pos, _quat, _scale);
          pool.setMatrixAt(instIdx, _mat4);
          pool.setColorAt(instIdx, _colA);

          if (wispShadowCnt < MAX_ENEMIES_PER_TYPE) {
            _pos.set(pt.x, 0.058, pt.z);
            _quat.identity();
            _scale.set(1, 1, 1);
            _mat4.compose(_pos, _quat, _scale);
            wispShadowPool.setMatrixAt(wispShadowCnt++, _mat4);
          }
        } else {
          _pos.set(pt.x, ey, pt.z);
          _euler.set(0, yaw, 0);
          _quat.setFromEuler(_euler);
          _scale.set(1, 1, 1);
          _mat4.compose(_pos, _quat, _scale);
          pool.setMatrixAt(instIdx, _mat4);
          pool.setColorAt(instIdx, _colA);

          if (typeIdx === 3 && brutePlateCnt < MAX_ENEMIES_PER_TYPE) {
            // Brute orange armor plates
            brutePlatePool.setMatrixAt(brutePlateCnt, _mat4);
            _colB.copy(BRUTE_PLATE_COLOR);
            if (slowed) _colB.lerp(FROST_TINT_COLOR, 0.48);
            if (desat > 0) desaturateColor(_colB, desat, _colB);
            brutePlatePool.setColorAt(brutePlateCnt, _colB);
            brutePlateCnt++;
          } else if (typeIdx === 5 && menderHaloCnt < MAX_ENEMIES_PER_TYPE) {
            // Mender soft glowing green halo ring
            const pulse = 1.0 + 0.10 * Math.sin(activeTime * 6.0 + id);
            _pos.set(pt.x, 0.36, pt.z);
            _quat.identity();
            _scale.set(pulse, 1, pulse);
            _mat4.compose(_pos, _quat, _scale);
            menderHaloPool.setMatrixAt(menderHaloCnt++, _mat4);
          }
        }
        typeCounts[typeIdx]++;
      }

      // Health bar above enemy
      if (hpCnt < MAX_TOTAL_ENEMIES) {
        const frac = snap.eHpFrac[i];
        const barY = typeIdx === 2 ? 1.24 : (typeIdx === 3 ? 0.88 : (typeIdx === 5 ? 0.84 : (typeIdx === 6 ? 0.42 : 0.66)));
        _pos.set(pt.x, barY, pt.z);
        _scale.set(1, 1, 1);
        _mat4.compose(_pos, camQuat, _scale);
        hpBgPool.setMatrixAt(hpCnt, _mat4);

        // Left-aligned fill inside backing bar
        const fillScale = Math.max(0.02, frac);
        _dir.set(-(1 - fillScale) * 0.23, 0, 0.004).applyQuaternion(camQuat);
        _pos.set(pt.x + _dir.x, barY + _dir.y, pt.z + _dir.z);
        _scale.set(fillScale, 1, 1);
        _mat4.compose(_pos, camQuat, _scale);
        hpFillPool.setMatrixAt(hpCnt, _mat4);

        if (frac > 0.55) _colB.setHex(0x45eb7d);
        else if (frac > 0.28) _colB.setHex(0xffc938);
        else _colB.setHex(0xff4252);
        if (desat > 0) desaturateColor(_colB, desat, _colB);
        hpFillPool.setColorAt(hpCnt, _colB);
        hpCnt++;
      }
    }

    for (let t = 0; t < 7; t++) {
      enemyPools[t].count = typeCounts[t];
      enemyPools[t].instanceMatrix.needsUpdate = true;
      enemyPools[t].instanceColor.needsUpdate = true;
    }
    brutePlatePool.count = brutePlateCnt;
    brutePlatePool.instanceMatrix.needsUpdate = true;
    brutePlatePool.instanceColor.needsUpdate = true;
    menderHaloPool.count = menderHaloCnt;
    menderHaloPool.instanceMatrix.needsUpdate = true;
    wispShadowPool.count = wispShadowCnt;
    wispShadowPool.instanceMatrix.needsUpdate = true;

    hpBgPool.count = hpCnt;
    hpBgPool.instanceMatrix.needsUpdate = true;
    hpFillPool.count = hpCnt;
    hpFillPool.instanceMatrix.needsUpdate = true;
    hpFillPool.instanceColor.needsUpdate = true;

    // 8. Combat Visuals (Shots <= 0.15s, Rings, Orbs, Kill/Sell/Leak/Fall Debris)
    let beamCnt = 0, ringCnt = 0, orbCnt = 0, debrisCnt = 0;

    function pushBeam(x0, y0, z0, x1, y1, z1, radius, col) {
      if (beamCnt >= 256) return;
      _vA.set(x0, y0, z0);
      _vB.set(x1, y1, z1);
      _dir.subVectors(_vB, _vA);
      const len = _dir.length();
      if (len < 0.001) return;
      _pos.addVectors(_vA, _vB).multiplyScalar(0.5);
      _dir.multiplyScalar(1 / len);
      _quat.setFromUnitVectors(_up, _dir);
      _scale.set(radius, len, radius);
      _mat4.compose(_pos, _quat, _scale);
      beamPool.setMatrixAt(beamCnt, _mat4);
      if (desat > 0) desaturateColor(col, desat, _tmpCol);
      else _tmpCol.copy(col);
      beamPool.setColorAt(beamCnt, _tmpCol);
      beamCnt++;
    }

    function pushRing(x, y, z, radius, col) {
      if (ringCnt >= 256 || radius <= 0.01) return;
      _pos.set(x, y, z);
      _quat.identity();
      _scale.set(radius, 1, radius);
      _mat4.compose(_pos, _quat, _scale);
      ringPool.setMatrixAt(ringCnt, _mat4);
      if (desat > 0) desaturateColor(col, desat, _tmpCol);
      else _tmpCol.copy(col);
      ringPool.setColorAt(ringCnt, _tmpCol);
      ringCnt++;
    }

    function pushOrb(x, y, z, scaleVal, col) {
      if (orbCnt >= 256 || scaleVal <= 0.01) return;
      _pos.set(x, y, z);
      _quat.identity();
      _scale.set(scaleVal, scaleVal, scaleVal);
      _mat4.compose(_pos, _quat, _scale);
      orbPool.setMatrixAt(orbCnt, _mat4);
      if (desat > 0) desaturateColor(col, desat, _tmpCol);
      else _tmpCol.copy(col);
      orbPool.setColorAt(orbCnt, _tmpCol);
      orbCnt++;
    }

    function pushDebris(x, y, z, rx, ry, sz, col) {
      if (debrisCnt >= 768 || sz <= 0.005) return;
      _pos.set(x, y, z);
      _euler.set(rx, ry, 0);
      _quat.setFromEuler(_euler);
      _scale.set(sz, sz, sz);
      _mat4.compose(_pos, _quat, _scale);
      debrisPool.setMatrixAt(debrisCnt, _mat4);
      if (desat > 0) desaturateColor(col, desat, _tmpCol);
      else _tmpCol.copy(col);
      debrisPool.setColorAt(debrisCnt, _tmpCol);
      debrisCnt++;
    }

    // 8a. Active Shots (every shot strictly <= 0.15s!)
    const shotStart = lowerBoundTime(shots, activeTime - 0.151);
    for (let i = shotStart; i < shots.length; i++) {
      const sh = shots[i];
      if (sh.t > activeTime) break;
      const dt = activeTime - sh.t;
      const ty = sh.air ? 0.80 : 0.30;
      const sy = 0.56;
      const baseC = SHOT_COLORS[sh.typeIdx];

      if (sh.typeIdx === 0) {
        // Bolt: thin steel-blue tracer (0.09s)
        if (dt <= 0.09) {
          const u = dt / 0.09;
          _colA.copy(baseC).multiplyScalar(1.0 - u * 0.65);
          pushBeam(sh.x0, sy, sh.z0, sh.x1, ty, sh.z1, 0.032 * (1 - u * 0.5), _colA);
          pushOrb(sh.x1, ty, sh.z1, 0.45 * (1 - u), _colA);
        }
      } else if (sh.typeIdx === 1) {
        // Cannon: arcing bronze shell (0..0.075s) + splash burst ring of radius 0.90 (0.055..0.15s)
        if (dt <= 0.075) {
          const u = dt / 0.075;
          const ax = sh.x0 + (sh.x1 - sh.x0) * u;
          const az = sh.z0 + (sh.z1 - sh.z0) * u;
          const ay = sy + (ty - sy) * u + 4.0 * 0.85 * u * (1 - u);
          pushOrb(ax, ay, az, 0.72, baseC);
        }
        if (dt >= 0.055 && dt <= 0.15) {
          const u = (dt - 0.055) / 0.095;
          const rad = sh.splash * (0.28 + 0.72 * u);
          _colA.copy(baseC).multiplyScalar(1.0 - u * 0.7);
          pushRing(sh.x1, 0.09, sh.z1, rad, _colA);
          pushOrb(sh.x1, 0.22, sh.z1, 1.15 * (1 - u), _colA);
        }
      } else if (sh.typeIdx === 2) {
        // Frost: pale ice-white beam (0.13s)
        if (dt <= 0.13) {
          const u = dt / 0.13;
          _colA.copy(baseC).multiplyScalar(1.0 - u * 0.6);
          pushBeam(sh.x0, 0.76, sh.z0, sh.x1, ty, sh.z1, 0.048 * (1 - u * 0.45), _colA);
          pushOrb(sh.x1, ty, sh.z1, 0.65 * (1 - u), _colA);
        }
      } else if (sh.typeIdx === 3) {
        // Lance: thick crimson beam + bright flash (0.15s)
        if (dt <= 0.15) {
          const u = dt / 0.15;
          _colA.copy(baseC).multiplyScalar(1.25 * (1.0 - u * 0.68));
          pushBeam(sh.x0, 0.52, sh.z0, sh.x1, ty, sh.z1, 0.115 * (1 - u * 0.45), _colA);
          pushOrb(sh.x0, 0.52, sh.z0, 1.0 * (1 - u), _colA);
          pushOrb(sh.x1, ty, sh.z1, 1.35 * (1 - u), _colA);
        }
      } else {
        // Flak: teal streak + teal burst ring of radius 0.70 in the air (0.14s)
        if (dt <= 0.14) {
          const u = dt / 0.14;
          _colA.copy(baseC).multiplyScalar(1.05 * (1.0 - u * 0.65));
          if (dt <= 0.06) {
            pushBeam(sh.x0, 0.66, sh.z0, sh.x1, 0.80, sh.z1, 0.036, _colA);
          }
          const rad = sh.splash * (0.24 + 0.76 * u);
          pushRing(sh.x1, 0.80, sh.z1, rad, _colA);
          pushOrb(sh.x1, 0.80, sh.z1, 0.85 * (1 - u), _colA);
        }
      }
    }

    // 8b. Mender Heals (green pulse ring of exact 1.50 radius over 0.45s)
    const healStart = lowerBoundTime(heals, activeTime - 0.46);
    for (let i = healStart; i < heals.length; i++) {
      const h = heals[i];
      if (h.t > activeTime) break;
      const dt = activeTime - h.t;
      if (dt <= 0.45) {
        const u = dt / 0.45;
        _colA.copy(HEAL_RING_COLOR).multiplyScalar(1.0 - u * 0.8);
        pushRing(h.x, 0.10, h.z, 1.50 * (0.18 + 0.82 * u), _colA);
      }
    }

    // 8c. Builds / Upgrades / Sells FX (0.55s)
    const bldStart = lowerBoundTime(builds, activeTime - 0.56);
    for (let i = bldStart; i < builds.length; i++) {
      const b = builds[i];
      if (b.t > activeTime) break;
      const dt = activeTime - b.t;
      if (dt > 0.55) continue;
      const u = dt / 0.55;
      const bx = SLOTS_TILES[b.slot][0] + 0.5;
      const bz = SLOTS_TILES[b.slot][1] + 0.5;
      const seeds = buildFxSeeds[i];

      if (b.op === "B") {
        // Rising sparkle burst
        _colA.copy(BUILD_SPARK_COLOR).multiplyScalar(1.0 - u * 0.75);
        for (let k = 0; k < seeds.length; k++) {
          const s = seeds[k];
          const a = s.ang + u * 2.2;
          const r = s.rad * (1.0 - u * 0.35);
          pushOrb(bx + Math.cos(a) * r, 0.15 + u * s.vy * 0.65, bz + Math.sin(a) * r, (1 - u) * 0.42, _colA);
        }
      } else if (b.op === "U") {
        // Expanding golden upgrade ring pulse
        _colA.copy(UPGRADE_RING_COLOR).multiplyScalar(1.1 * (1.0 - u * 0.78));
        pushRing(bx, 0.14 + u * 0.55, bz, 0.25 + u * 0.78, _colA);
      } else if (b.op === "S") {
        // Collapse into rubble
        for (let k = 0; k < seeds.length; k++) {
          const s = seeds[k];
          const px = bx + Math.cos(s.ang) * s.spd * dt;
          const pz = bz + Math.sin(s.ang) * s.spd * dt;
          const py = Math.max(0.05, 0.35 + s.vy * dt - 4.8 * dt * dt);
          pushDebris(px, py, pz, dt * 6, dt * 5, s.sz * (1 - u * 0.75), RUBBLE_COLOR);
        }
      }
    }

    // 8d. Kill Debris (closed-form ballistic in dt, plus purple burst on splitter death)
    const killStart = lowerBoundTime(kills, activeTime - 0.62);
    for (let i = killStart; i < kills.length; i++) {
      const kl = kills[i];
      if (kl.t > activeTime) break;
      const dt = activeTime - kl.t;
      if (dt > 0.60) continue;
      const u = dt / 0.60;
      const y0 = kl.air ? 0.80 : 0.28;
      const baseC = kl.typeIdx === 3 ? BRUTE_PLATE_COLOR : ENEMY_BASE_COLORS[kl.typeIdx];
      const seeds = killDebrisSeeds[i];
      for (let k = 0; k < seeds.length; k++) {
        const s = seeds[k];
        const px = kl.x + s.vx * dt;
        const pz = kl.z + s.vz * dt;
        const py = Math.max(0.04, y0 + s.vy * dt - 6.8 * dt * dt);
        pushDebris(px, py, pz, s.rx * dt, s.ry * dt, s.sz * (1 - u * 0.85), baseC);
      }
      if (kl.typeIdx === 4 && dt <= 0.28) {
        const su = dt / 0.28;
        _colA.copy(SPLIT_RING_COLOR).multiplyScalar(1.0 - su * 0.75);
        pushRing(kl.x, 0.14, kl.z, 0.15 + 0.55 * su, _colA);
      }
    }

    // 8e. Leak Wall Chunk Knock-off Debris
    const leakStart = lowerBoundTime(leaks, tClamped - 0.90);
    for (let i = leakStart; i < leaks.length; i++) {
      const lk = leaks[i];
      if (lk.t > tClamped) break;
      const dt = tClamped - lk.t;
      if (dt > 0.85) continue;
      const u = dt / 0.85;
      const seeds = leakChunkSeeds[i];
      for (let k = 0; k < seeds.length; k++) {
        const s = seeds[k];
        const px = KEEP_X + s.ox + s.vx * dt;
        const pz = KEEP_Z + s.oz + s.vz * dt;
        const py = Math.max(0.06, 0.85 + s.vy * dt - 7.5 * dt * dt);
        pushDebris(px, py, pz, s.rx * dt, s.ry * dt, s.sz * (1 - u * 0.55), RUBBLE_COLOR);
      }
    }

    // 8f. Keep Fall Collapse Burst & Shockwave Ring (continues cleanly over [fallTime, fallTime+1.4] then rests!)
    if (hasFallen) {
      const dtFall = tClamped - fallTime;
      if (dtFall <= 0.95) {
        const u = dtFall / 0.95;
        _colA.copy(FALL_WAVE_COLOR).multiplyScalar(1.35 * (1.0 - u * 0.85));
        pushRing(KEEP_X, 0.16, KEEP_Z, 0.4 + 4.8 * u, _colA);
        pushRing(KEEP_X, 0.28, KEEP_Z, 0.2 + 3.2 * u, _colA);
      }
      const dSim = Math.min(dtFall, 1.35);
      for (let k = 0; k < fallChunkSeeds.length; k++) {
        const s = fallChunkSeeds[k];
        // Simple ground landing settle so rubble remains scattered around the ruined keep until 100s
        const tLand = (s.vy + Math.sqrt(s.vy * s.vy + 2 * 8.2 * Math.max(0.01, s.oy))) / 8.2;
        const te = Math.min(dSim, tLand);
        const px = KEEP_X + s.ox + s.vx * te;
        const pz = KEEP_Z + s.oz + s.vz * te;
        const py = Math.max(0.06 + s.sz * 0.35, s.oy + s.vy * te - 4.1 * te * te);
        const col = s.ember ? EMBER_COLOR : RUBBLE_COLOR;
        const sz = s.ember ? s.sz * Math.max(0, 1 - dtFall / 1.1) : s.sz;
        pushDebris(px, py, pz, s.rx * te, s.ry * te, sz, col);
      }
    }

    beamPool.count = beamCnt;
    beamPool.instanceMatrix.needsUpdate = true;
    beamPool.instanceColor.needsUpdate = true;
    ringPool.count = ringCnt;
    ringPool.instanceMatrix.needsUpdate = true;
    ringPool.instanceColor.needsUpdate = true;
    orbPool.count = orbCnt;
    orbPool.instanceMatrix.needsUpdate = true;
    orbPool.instanceColor.needsUpdate = true;
    debrisPool.count = debrisCnt;
    debrisPool.instanceMatrix.needsUpdate = true;
    debrisPool.instanceColor.needsUpdate = true;

    // 9. Render 3D Scene + Orthographic HUD Pass inside #stage
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    updateHud(tClamped, snap, vw, vh);

    renderer.clear();
    renderer.render(scene, camera);
    renderer.clearDepth();
    renderer.render(hudScene, hudCamera);
  }

  // =========================================================================
  // 9. SYNTHESIZED WEB AUDIO ENGINE (NO MUSIC, NO EXTERNAL AUDIO, SEED 4242)
  // =========================================================================
  const audioRng = makeRng(4242);
  let audioCtx = null;
  let masterGain = null;
  let compressor = null;
  let noiseBuf = null;
  let windNode = null;
  let windGain = null;
  const activeNodes = new Set();
  const shotTimestamps = []; // sliding window (real audioCtx.currentTime) for <= 12 shots/sec cap
  let lastKillSoundAt = -1;
  let audioSilenced = true;

  function initAudio() {
    if (audioCtx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.setValueAtTime(0.0, audioCtx.currentTime);
      compressor = audioCtx.createDynamicsCompressor();
      compressor.threshold.setValueAtTime(-14, audioCtx.currentTime);
      compressor.knee.setValueAtTime(18, audioCtx.currentTime);
      compressor.ratio.setValueAtTime(8, audioCtx.currentTime);
      compressor.attack.setValueAtTime(0.003, audioCtx.currentTime);
      compressor.release.setValueAtTime(0.15, audioCtx.currentTime);
      masterGain.connect(compressor);
      compressor.connect(audioCtx.destination);

      // Precompute seeded noise buffer (2 seconds)
      const sr = audioCtx.sampleRate;
      noiseBuf = audioCtx.createBuffer(1, sr * 2, sr);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = audioRng() * 2 - 1;

      if (audioCtx.state === "suspended") audioCtx.resume().catch(function () {});
    } catch (e) {
      audioCtx = null;
    }
  }

  function unlockAudio() {
    initAudio();
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume().catch(function () {});
    }
  }

  initAudio();
  window.addEventListener("pointerdown", unlockAudio, { once: true, passive: true });
  window.addEventListener("keydown", unlockAudio, { once: true, passive: true });

  function trackNode(node) {
    activeNodes.add(node);
    node.onended = function () { activeNodes.delete(node); };
    return node;
  }

  function stopWind() {
    if (windNode) {
      try { windNode.stop(); } catch (e) {}
      try { windNode.disconnect(); } catch (e) {}
      windNode = null;
    }
    if (windGain) {
      try { windGain.disconnect(); } catch (e) {}
      windGain = null;
    }
  }

  function ensureWind(shouldPlay) {
    if (!audioCtx || audioCtx.state !== "running" || audioSilenced) {
      stopWind();
      return;
    }
    if (!shouldPlay) {
      stopWind();
      return;
    }
    if (windNode) return;
    const now = audioCtx.currentTime;
    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuf;
    src.loop = true;
    const flt = audioCtx.createBiquadFilter();
    flt.type = "bandpass";
    flt.frequency.setValueAtTime(195, now);
    flt.Q.setValueAtTime(2.6, now);
    const gn = audioCtx.createGain();
    gn.gain.setValueAtTime(0.001, now);
    gn.gain.linearRampToValueAtTime(0.16, now + 0.6);
    src.connect(flt);
    flt.connect(gn);
    gn.connect(masterGain);
    src.start(now);
    windNode = src;
    windGain = gn;
  }

  function setAudioPlayable(canPlay) {
    if (!audioCtx || !masterGain) {
      audioSilenced = !canPlay;
      return;
    }
    const now = audioCtx.currentTime;
    if (canPlay) {
      if (audioSilenced) {
        audioSilenced = false;
        masterGain.gain.cancelScheduledValues(now);
        masterGain.gain.setValueAtTime(masterGain.gain.value, now);
        masterGain.gain.linearRampToValueAtTime(0.58, now + 0.025);
      }
    } else {
      audioSilenced = true;
      masterGain.gain.cancelScheduledValues(now);
      masterGain.gain.setValueAtTime(masterGain.gain.value, now);
      masterGain.gain.linearRampToValueAtTime(0.0, now + 0.04);
      stopWind();
      activeNodes.forEach(function (n) {
        try { n.stop(now + 0.042); } catch (e) {}
      });
      activeNodes.clear();
    }
  }

  function makePanner(boardX) {
    const pan = Math.max(-0.85, Math.min(0.85, (boardX / 24) * 1.7 - 0.85));
    if (typeof audioCtx.createStereoPanner === "function") {
      const p = audioCtx.createStereoPanner();
      p.pan.setValueAtTime(pan, audioCtx.currentTime);
      p.connect(masterGain);
      return p;
    }
    return masterGain;
  }

  function playShotSound(typeIdx, boardX) {
    if (!audioCtx || audioCtx.state !== "running" || audioSilenced) return;
    const now = audioCtx.currentTime;
    const jitter = 0.95 + audioRng() * 0.10;
    const dest = makePanner(boardX);

    if (typeIdx === 0) {
      // Bolt: crisp metallic snap
      const osc = trackNode(audioCtx.createOscillator());
      const gn = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(1120 * jitter, now);
      osc.frequency.exponentialRampToValueAtTime(340 * jitter, now + 0.048);
      gn.gain.setValueAtTime(0.11, now);
      gn.gain.exponentialRampToValueAtTime(0.001, now + 0.052);
      osc.connect(gn); gn.connect(dest);
      osc.start(now); osc.stop(now + 0.055);
    } else if (typeIdx === 1) {
      // Cannon: punchy warm thump + low boom
      const osc = trackNode(audioCtx.createOscillator());
      const gn = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(155 * jitter, now);
      osc.frequency.exponentialRampToValueAtTime(44 * jitter, now + 0.15);
      gn.gain.setValueAtTime(0.28, now);
      gn.gain.exponentialRampToValueAtTime(0.001, now + 0.165);
      osc.connect(gn); gn.connect(dest);
      osc.start(now); osc.stop(now + 0.17);

      const nSrc = trackNode(audioCtx.createBufferSource());
      nSrc.buffer = noiseBuf;
      const flt = audioCtx.createBiquadFilter();
      flt.type = "lowpass"; flt.frequency.setValueAtTime(480, now);
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(0.16, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
      nSrc.connect(flt); flt.connect(ng); ng.connect(dest);
      nSrc.start(now, audioRng() * 1.4, 0.12);
    } else if (typeIdx === 2) {
      // Frost: crystalline high shimmer
      const osc = trackNode(audioCtx.createOscillator());
      const gn = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(1480 * jitter, now);
      osc.frequency.exponentialRampToValueAtTime(2280 * jitter, now + 0.105);
      gn.gain.setValueAtTime(0.09, now);
      gn.gain.exponentialRampToValueAtTime(0.001, now + 0.115);
      osc.connect(gn); gn.connect(dest);
      osc.start(now); osc.stop(now + 0.12);
    } else if (typeIdx === 3) {
      // Lance: searing crimson rail-beam crack
      const osc = trackNode(audioCtx.createOscillator());
      const flt = audioCtx.createBiquadFilter();
      const gn = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(840 * jitter, now);
      osc.frequency.exponentialRampToValueAtTime(165 * jitter, now + 0.16);
      flt.type = "bandpass"; flt.frequency.setValueAtTime(1200, now); flt.Q.setValueAtTime(2.0, now);
      gn.gain.setValueAtTime(0.24, now);
      gn.gain.exponentialRampToValueAtTime(0.001, now + 0.17);
      osc.connect(flt); flt.connect(gn); gn.connect(dest);
      osc.start(now); osc.stop(now + 0.175);
    } else {
      // Flak: sharp airburst pop-crackle
      const nSrc = trackNode(audioCtx.createBufferSource());
      nSrc.buffer = noiseBuf;
      const flt = audioCtx.createBiquadFilter();
      flt.type = "bandpass"; flt.frequency.setValueAtTime(1050 * jitter, now); flt.Q.setValueAtTime(1.8, now);
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(0.20, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
      nSrc.connect(flt); flt.connect(ng); ng.connect(dest);
      nSrc.start(now, audioRng() * 1.4, 0.10);
    }
  }

  function playKillPop(boardX) {
    if (!audioCtx || audioCtx.state !== "running" || audioSilenced) return;
    const now = audioCtx.currentTime;
    if (now - lastKillSoundAt < 0.045) return;
    lastKillSoundAt = now;
    const dest = makePanner(boardX);
    const osc = trackNode(audioCtx.createOscillator());
    const gn = audioCtx.createGain();
    const f = 430 + audioRng() * 140;
    osc.type = "sine";
    osc.frequency.setValueAtTime(f, now);
    osc.frequency.exponentialRampToValueAtTime(f * 1.55, now + 0.04);
    gn.gain.setValueAtTime(0.065, now);
    gn.gain.exponentialRampToValueAtTime(0.001, now + 0.046);
    osc.connect(gn); gn.connect(dest);
    osc.start(now); osc.stop(now + 0.05);
  }

  function playWaveHorn() {
    if (!audioCtx || audioCtx.state !== "running" || audioSilenced) return;
    const now = audioCtx.currentTime;
    const dest = makePanner(2);
    const flt = audioCtx.createBiquadFilter();
    flt.type = "lowpass"; flt.frequency.setValueAtTime(520, now); flt.frequency.linearRampToValueAtTime(1080, now + 0.28);
    const gn = audioCtx.createGain();
    gn.gain.setValueAtTime(0.001, now);
    gn.gain.linearRampToValueAtTime(0.14, now + 0.06);
    gn.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
    flt.connect(gn); gn.connect(dest);

    const o1 = trackNode(audioCtx.createOscillator());
    o1.type = "sawtooth";
    o1.frequency.setValueAtTime(146.8, now);
    o1.frequency.linearRampToValueAtTime(220.0, now + 0.24);
    o1.connect(flt); o1.start(now); o1.stop(now + 0.38);

    const o2 = trackNode(audioCtx.createOscillator());
    o2.type = "triangle";
    o2.frequency.setValueAtTime(220.0, now);
    o2.frequency.linearRampToValueAtTime(293.7, now + 0.24);
    o2.connect(flt); o2.start(now); o2.stop(now + 0.38);
  }

  function playLeakAlarm() {
    if (!audioCtx || audioCtx.state !== "running" || audioSilenced) return;
    const now = audioCtx.currentTime;
    const dest = makePanner(23);

    // Stone crack
    const nSrc = trackNode(audioCtx.createBufferSource());
    nSrc.buffer = noiseBuf;
    const flt = audioCtx.createBiquadFilter();
    flt.type = "bandpass"; flt.frequency.setValueAtTime(620, now); flt.Q.setValueAtTime(1.2, now);
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.32, now);
    ng.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
    nSrc.connect(flt); flt.connect(ng); ng.connect(dest);
    nSrc.start(now, audioRng() * 1.2, 0.20);

    // Urgent alarm tone
    const osc = trackNode(audioCtx.createOscillator());
    const gn = audioCtx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(520, now);
    osc.frequency.setValueAtTime(390, now + 0.11);
    gn.gain.setValueAtTime(0.16, now);
    gn.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
    osc.connect(gn); gn.connect(dest);
    osc.start(now); osc.stop(now + 0.28);
  }

  function playFallCollapse() {
    if (!audioCtx || audioCtx.state !== "running" || audioSilenced) return;
    const now = audioCtx.currentTime;
    const dest = makePanner(22);

    // Sub-bass impact drop
    const osc = trackNode(audioCtx.createOscillator());
    const gn = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(98, now);
    osc.frequency.exponentialRampToValueAtTime(24, now + 1.15);
    gn.gain.setValueAtTime(0.42, now);
    gn.gain.exponentialRampToValueAtTime(0.001, now + 1.35);
    osc.connect(gn); gn.connect(dest);
    osc.start(now); osc.stop(now + 1.40);

    // Deep collapsing stone rumble
    const nSrc = trackNode(audioCtx.createBufferSource());
    nSrc.buffer = noiseBuf;
    const flt = audioCtx.createBiquadFilter();
    flt.type = "lowpass";
    flt.frequency.setValueAtTime(580, now);
    flt.frequency.exponentialRampToValueAtTime(110, now + 1.5);
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.36, now);
    ng.gain.exponentialRampToValueAtTime(0.001, now + 1.55);
    nSrc.connect(flt); flt.connect(ng); ng.connect(dest);
    nSrc.start(now, 0.1, 1.60);
  }

  const SHOT_PRIORITY = [1, 4, 2, 5, 3]; // lance(5) > cannon(4) > flak(3) > frost(2) > bolt(1)

  function triggerForwardAudio(tFrom, tTo) {
    if (!audioCtx || audioCtx.state !== "running" || audioSilenced || tTo <= tFrom) return;

    // After keep falls: only low dusk wind!
    if (fallTime >= 0 && tTo >= fallTime) {
      if (tFrom < fallTime) playFallCollapse();
      ensureWind(true);
      return;
    }
    ensureWind(false);

    // Wave-start horn
    let idx = lowerBoundTime(waveStarts, tFrom + 1e-6);
    while (idx < waveStarts.length && waveStarts[idx].t <= tTo) {
      playWaveHorn();
      idx++;
    }

    // Leaks
    idx = lowerBoundTime(leaks, tFrom + 1e-6);
    while (idx < leaks.length && leaks[idx].t <= tTo) {
      playLeakAlarm();
      idx++;
    }

    // Kills (soft pop)
    idx = lowerBoundTime(kills, tFrom + 1e-6);
    if (idx < kills.length && kills[idx].t <= tTo) {
      playKillPop(kills[idx].x);
    }

    // Shots (rate-limited to <= 12 shot sounds per real second, loudest types first!)
    const now = audioCtx.currentTime;
    while (shotTimestamps.length > 0 && now - shotTimestamps[0] >= 1.0) shotTimestamps.shift();
    let budget = 12 - shotTimestamps.length;
    if (budget > 0) {
      const batch = [];
      idx = lowerBoundTime(shots, tFrom + 1e-6);
      while (idx < shots.length && shots[idx].t <= tTo) {
        batch.push(shots[idx]);
        idx++;
      }
      if (batch.length > 0) {
        batch.sort(function (a, b) { return SHOT_PRIORITY[b.typeIdx] - SHOT_PRIORITY[a.typeIdx]; });
        const playN = Math.min(budget, Math.min(3, batch.length));
        for (let i = 0; i < playN; i++) {
          playShotSound(batch[i].typeIdx, batch[i].x0);
          shotTimestamps.push(now);
        }
      }
    }
  }

  // =========================================================================
  // 10. EXACT 5-STATE PLAYBACK STATE MACHINE & CANONICAL DOCK WIRING
  // =========================================================================
  const countdownEl = document.getElementById("countdown");
  const btnRefire = document.getElementById("btn-refire");
  const btnToggle = document.getElementById("btn-toggle");
  const iconPause = document.getElementById("icon-pause");
  const iconPlay = document.getElementById("icon-play");
  const scrubber = document.getElementById("scrubber");
  const speedPills = Array.prototype.slice.call(document.querySelectorAll(".speed-pill"));

  let state = "COUNTDOWN"; // 'COUNTDOWN' | 'PLAYING' | 'PAUSED' | 'REFIRE_HOLD' | 'ENDED'
  let simTime = 0.0;
  let prevSimTime = 0.0;
  let playbackSpeed = 1.0;
  let countdownElapsed = 0.0;
  let holdElapsed = 0.0;
  let lastFrameTs = null;
  let startedCountdown = false;

  function setToggleUI(isPlayingLike) {
    if (isPlayingLike) {
      iconPause.style.display = "";
      iconPlay.style.display = "none";
      btnToggle.setAttribute("aria-label", "Pause");
    } else {
      iconPause.style.display = "none";
      iconPlay.style.display = "";
      btnToggle.setAttribute("aria-label", "Play");
    }
  }

  function hideCountdown() {
    countdownEl.style.display = "none";
    countdownEl.textContent = "";
  }

  function showCountdown(text) {
    countdownEl.style.display = "block";
    countdownEl.textContent = text;
  }

  btnToggle.addEventListener("click", function () {
    unlockAudio();
    if (state === "PLAYING") {
      state = "PAUSED";
      setToggleUI(false);
      setAudioPlayable(false);
    } else if (state === "COUNTDOWN" || state === "REFIRE_HOLD") {
      hideCountdown();
      simTime = 0.0;
      prevSimTime = 0.0;
      scrubber.value = "0";
      state = "PAUSED";
      setToggleUI(false);
      setAudioPlayable(false);
      renderAtTime(simTime);
    } else if (state === "PAUSED") {
      state = "PLAYING";
      prevSimTime = simTime;
      setToggleUI(true);
      setAudioPlayable(true);
    } else if (state === "ENDED") {
      hideCountdown();
      simTime = 0.0;
      prevSimTime = 0.0;
      scrubber.value = "0";
      state = "PLAYING";
      setToggleUI(true);
      setAudioPlayable(true);
      renderAtTime(simTime);
    }
  });

  btnRefire.addEventListener("click", function () {
    unlockAudio();
    hideCountdown();
    simTime = 0.0;
    prevSimTime = 0.0;
    scrubber.value = "0";
    holdElapsed = 0.0;
    state = "REFIRE_HOLD";
    setToggleUI(true);
    setAudioPlayable(false);
    renderAtTime(0.0);
  });

  for (let i = 0; i < speedPills.length; i++) {
    (function (pill) {
      pill.addEventListener("click", function () {
        unlockAudio();
        playbackSpeed = parseFloat(pill.getAttribute("data-speed")) || 1.0;
        for (let j = 0; j < speedPills.length; j++) {
          const active = speedPills[j] === pill;
          speedPills[j].classList.toggle("is-active", active);
          speedPills[j].setAttribute("aria-checked", active ? "true" : "false");
        }
      });
    })(speedPills[i]);
  }

  scrubber.addEventListener("input", function () {
    hideCountdown();
    simTime = Math.max(0, Math.min(DURATION, parseFloat(scrubber.value) || 0));
    prevSimTime = simTime;
    state = "PAUSED";
    setToggleUI(false);
    setAudioPlayable(false);
    renderAtTime(simTime);
  });

  function onResize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
    updateCameraFraming(w, h);
    renderAtTime(simTime);
  }
  window.addEventListener("resize", onResize);

  // Initial framing & resting frame at simTime = 0.000 BEFORE countdown starts
  updateCameraFraming(window.innerWidth, window.innerHeight);
  showCountdown("3");
  scrubber.value = "0";
  setToggleUI(true);
  setAudioPlayable(false);
  renderAtTime(0.0);

  function frame(ts) {
    requestAnimationFrame(frame);

    if (!startedCountdown) {
      startedCountdown = true;
      lastFrameTs = ts;
      return;
    }

    const rawDt = Math.max(0, (ts - lastFrameTs) / 1000);
    lastFrameTs = ts;
    const dt = Math.min(rawDt, 0.1);

    if (state === "COUNTDOWN") {
      countdownElapsed += dt;
      if (countdownElapsed < 1.0) {
        showCountdown("3");
        renderAtTime(0.0);
      } else if (countdownElapsed < 2.0) {
        showCountdown("2");
        renderAtTime(0.0);
      } else if (countdownElapsed < 3.0) {
        showCountdown("1");
        renderAtTime(0.0);
      } else {
        hideCountdown();
        state = "PLAYING";
        prevSimTime = 0.0;
        setAudioPlayable(true);
        const overflow = countdownElapsed - 3.0;
        simTime = Math.min(DURATION, overflow * playbackSpeed);
        scrubber.value = simTime.toFixed(3);
        triggerForwardAudio(prevSimTime, simTime);
        prevSimTime = simTime;
        renderAtTime(simTime);
      }
    } else if (state === "REFIRE_HOLD") {
      hideCountdown();
      holdElapsed += dt;
      if (holdElapsed >= 1.0) {
        state = "PLAYING";
        prevSimTime = 0.0;
        setAudioPlayable(true);
        const overflow = holdElapsed - 1.0;
        simTime = Math.min(DURATION, overflow * playbackSpeed);
        scrubber.value = simTime.toFixed(3);
        triggerForwardAudio(prevSimTime, simTime);
        prevSimTime = simTime;
        renderAtTime(simTime);
      } else {
        renderAtTime(0.0);
      }
    } else if (state === "PLAYING") {
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      scrubber.value = simTime.toFixed(3);
      triggerForwardAudio(prevSimTime, simTime);
      prevSimTime = simTime;
      renderAtTime(simTime);
      if (simTime >= DURATION) {
        simTime = DURATION;
        scrubber.value = DURATION.toFixed(3);
        state = "ENDED";
        setToggleUI(false);
        setAudioPlayable(false);
        renderAtTime(DURATION);
      }
    }
  }
  requestAnimationFrame(frame);

  // =========================================================================
  // 11. MACHINE-READABLE BENCHMARK REPORT (TRUTHFUL VALUES)
  // =========================================================================
  window.BENCH_REPORT = {
    selfCheck: { vectorA: true, vectorB: true },
    strategy: {
      summary: "3-phase economy & adaptive targeting: lean Bolt/Cannon opener to bank 1000g for +50/wave compound interest, ROI-ordered Cannon/Flak/Frost scaling with mid-game air failsafe, Wave-39 front-to-air pivot + Lance finisher, wave-start Cannon/Lance cooldown resets, and exponential-TTL/mender/runner splash-focus targeter.",
      seedsTested: 150,
      meanScoreOnTestedSeeds: 46.26
    },
    seed42: { score: simResult.score, fallTick: simResult.fallTick },
    systems: {
      board: "full",
      enemiesAndTurrets: "full",
      combatVisuals: "full",
      fall: "full",
      hud: "full",
      audio: "full"
    },
    simplifications: [],
    testedInBrowser: false,
    measuredFps: null
  };
})();
</script>
