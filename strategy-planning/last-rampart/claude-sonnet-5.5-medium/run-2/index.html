<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last Rampart</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;

  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;

}

  background: rgba(255, 255, 255, 0.16);
}

  border-radius: 9999px;

  font-size: 11px;
  font-weight: 500;

  -webkit-appearance: none;

<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script id="rampart-strategy">
function createStrategy() {
  // Build/upgrade/sell order found by offline hill-climbing over many seeds; executed in order, as gold allows.
  const SCRIPT = [["u",3],["b",1,"cannon"],["b",3,"cannon"],["b",2,"cannon"],["b",14,"flak"],["u",13],["b",13,"bolt"],["u",2],["u",14],["u",9],["u",1],["u",4],["u",4],["u",3],["u",14],["b",6,"cannon"],["b",7,"cannon"],["u",5],["u",9],["u",4],["u",0],["b",11,"flak"],["u",13],["u",8],["u",2],["b",12,"bolt"],["u",0],["u",10],["b",9,"cannon"],["u",14],["s",7],["b",8,"cannon"],["u",6],["u",5],["u",2],["u",3],["b",4,"cannon"],["u",1],["b",7,"cannon"],["u",11],["u",7],["u",0],["u",12],["u",12],["b",10,"bolt"],["u",7],["b",11,"frost"],["u",4],["u",4],["u",13],["u",6],["u",7],["u",8],["u",11],["b",5,"cannon"],["u",3],["u",14],["u",5],["b",0,"flak"],["u",2],["s",2],["u",3],["b",2,"flak"],["b",15,"frost"],["u",9],["u",9],["u",2],["s",13],["u",2],["u",1],["b",13,"cannon"],["u",12],["u",10],["u",15],["u",8],["u",5],["u",1],["u",9],["u",0],["u",4],["u",14],["u",14],["u",10],["u",5],["u",13],["u",8],["u",2],["u",13],["u",8]];
  const COST = { bolt: 50, cannon: 90, frost: 70, lance: 120, flak: 80 };
  let ptr = 0;
  return {
    plan(s) {
      const acts = []; let g = s.gold;
      const occ = s.slots.map(x => x.turret ? { type: x.turret.type, tier: x.turret.tier, spent: x.turret.spent } : null);
      let guard = 0;
      while (ptr < SCRIPT.length && acts.length < 32 && guard++ < 200) {
        const e = SCRIPT[ptr];
        if (e[0] === 'b') {
          if (occ[e[1]]) { ptr++; continue; }
          if (g < COST[e[2]]) break;
          g -= COST[e[2]]; occ[e[1]] = { type: e[2], tier: 1, spent: COST[e[2]] };
          acts.push({ op: 'build', slot: e[1], type: e[2] }); ptr++;
        } else if (e[0] === 'u') {
          const t = occ[e[1]]; if (!t || t.tier >= 3) { ptr++; continue; }
          const c = COST[t.type] * (t.tier === 1 ? 1 : 2);
          if (g < c) break;
          g -= c; t.tier++; t.spent += c; acts.push({ op: 'upgrade', slot: e[1] }); ptr++;
        } else {
          const t = occ[e[1]]; if (!t) { ptr++; continue; }
          g += Math.floor(t.spent * 70 / 100); occ[e[1]] = null; acts.push({ op: 'sell', slot: e[1] }); ptr++;
        }
      }
      return acts;
    },
    target(t, c) {
      for (const e of c) if (e.type === 'mender') return e.id;          // menders first
      if (t.type === 'cannon' || t.type === 'flak') {                    // splash turrets: densest cluster
        const r2 = t.type === 'cannon' ? 8100 : 4900; let b = c[0], bs = -1;
        for (const e of c) {
          let n = 0;
          for (const o of c) { const dx = o.x - e.x, dy = o.y - e.y; if (dx * dx + dy * dy <= r2) n++; }
          if (n > bs || (n === bs && e.remaining < b.remaining)) { bs = n; b = e; }
        }
        return b.id;
      }
      return -1;                                                          // others: default (closest to base)
    }
  };
}
</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks, hook) {
  function mulberry32(a) { return function () {
    a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return (t ^ (t >>> 14)) >>> 0; }; }
  function mkRoute(tiles) {
    const pts = tiles.map(p => [p[0] * 100 + 50, p[1] * 100 + 50]);
    const segs = []; let acc = 0;
    for (let i = 0; i + 1 < pts.length; i++) {
      const dx = pts[i + 1][0] - pts[i][0], dy = pts[i + 1][1] - pts[i][1];
      const len = Math.abs(dx) + Math.abs(dy);
      segs.push({ x0: pts[i][0], y0: pts[i][1], dx: Math.sign(dx), dy: Math.sign(dy), start: acc, len });
      acc += len;
    }
    return { segs, total: acc };
  }
  const ROUTES = [
    mkRoute([[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]]),
    mkRoute([[0,6],[21,6],[21,11],[23,11]])
  ];
  const SLOTS = [[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],[14,5],[15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]];
  const TT = {
    bolt:   { idx: 0, cost: 50,  dmg: 26,  per: 8,  range: 300, splash: 0,  slow: 0,  pierce: 0, ground: 1, air: 1 },
    cannon: { idx: 1, cost: 90,  dmg: 60,  per: 24, range: 260, splash: 90, slow: 0,  pierce: 0, ground: 1, air: 0 },
    frost:  { idx: 2, cost: 70,  dmg: 10,  per: 12, range: 240, splash: 0,  slow: 30, pierce: 0, ground: 1, air: 1 },
    lance:  { idx: 3, cost: 120, dmg: 180, per: 36, range: 360, splash: 0,  slow: 0,  pierce: 1, ground: 1, air: 0 },
    flak:   { idx: 4, cost: 80,  dmg: 40,  per: 10, range: 320, splash: 70, slow: 0,  pierce: 0, ground: 0, air: 1 }
  };
  const ET = {
    grunt:    { hp: 60,  speed: 10, bounty: 4, leak: 1, air: 0, first: 1, weight: 10 },
    runner:   { hp: 40,  speed: 20, bounty: 4, leak: 1, air: 0, first: 2, weight: 4 },
    wisp:     { hp: 50,  speed: 12, bounty: 6, leak: 2, air: 1, first: 3, weight: 3 },
    brute:    { hp: 150, speed: 6,  bounty: 9, leak: 3, air: 0, first: 4, weight: 3 },
    splitter: { hp: 90,  speed: 8,  bounty: 6, leak: 2, air: 0, first: 6, weight: 2 },
    mender:   { hp: 70,  speed: 8,  bounty: 7, leak: 2, air: 0, first: 8, weight: 1 },
    splitling:{ hp: 0,   speed: 12, bounty: 1, leak: 1, air: 0, first: 99, weight: 0 }
  };
  const ORDER = ['grunt', 'runner', 'wisp', 'brute', 'splitter', 'mender'];
  const mult = [0, 1000];
  function m(w) { while (mult.length <= w) mult.push(Math.floor(mult[mult.length - 1] * 108 / 100)); return mult[w]; }
  function armorOf(type, w) { return type === 'grunt' ? Math.floor(w / 4) : type === 'brute' ? 6 + w : 0; }
  function posAt(route, p) {
    const s = route.segs;
    for (let i = 0; i < s.length; i++) {
      if (p <= s[i].start + s[i].len || i === s.length - 1) {
        const d = Math.min(p - s[i].start, s[i].len);
        return [s[i].x0 + s[i].dx * d, s[i].y0 + s[i].dy * d, s[i].dx, s[i].dy];
      }
    }
  }
  function setPos(e) { const r = posAt(ROUTES[e.air], e.progress); e.x = r[0]; e.y = r[1]; e.hx = r[2]; e.hy = r[3]; }
  function tierDmg(t, tier) { let d = t.dmg; for (let i = 1; i < tier; i++) d = Math.floor(d * 16 / 10); return d; }

  const rng = mulberry32(seed);
  const waves = {};
  function genWave(w) {
    const avail = ORDER.filter(t => ET[t].first <= w);
    let sum = 0; for (const t of avail) sum += ET[t].weight;
    const n = 4 + Math.floor(3 * w / 5), list = [];
    for (let i = 0; i < n; i++) {
      let r = rng() % sum;
      for (const t of avail) { if (r < ET[t].weight) { list.push(t); break; } r -= ET[t].weight; }
    }
    waves[w] = list;
  }
  genWave(1);
  if (hook) hook('init', { next: waves[1].slice() });

  const strat = createStrategy();
  let gold = 250, baseHp = 10, nextId = 1, enemies = [];
  const turrets = SLOTS.map(() => null);
  const queue = []; let qi = 0;
  const log = [];
  let fallTick = -1;

  function spawn(type, w, hp, progress) {
    const d = ET[type];
    const e = { id: nextId++, type, wave: w, maxHp: hp, hp, progress, air: d.air, slow: 0, age: 0, armor: armorOf(type, w), x: 0, y: 0, hx: 1, hy: 0 };
    setPos(e); enemies.push(e); return e;
  }
  function view(e) {
    return { id: e.id, type: e.type, hp: e.hp, maxHp: e.maxHp, x: e.x, y: e.y, air: e.air, armor: e.armor,
      speed: ET[e.type].speed, slowed: e.slow > 0 ? 1 : 0, remaining: ROUTES[e.air].total - e.progress };
  }
  function range(t) { return TT[t.type].range + 30 * (t.tier - 1); }

  function plan(w, tick) {
    const state = { tick, wave: w, gold, baseHp,
      slots: SLOTS.map((s, i) => ({ slot: i, x: s[0], y: s[1], turret: turrets[i] ? { type: turrets[i].type, tier: turrets[i].tier, spent: turrets[i].spent } : null })),
      enemies: enemies.map(view), nextWave: waves[w + 1].slice() };
    const acts = strat.plan(state);
    if (!Array.isArray(acts)) return;
    const n = Math.min(32, acts.length);
    for (let i = 0; i < n; i++) {
      const a = acts[i]; if (!a) continue;
      const s = a.slot;
      if (!(s >= 0 && s < 16) || s !== Math.floor(s)) continue;
      if (a.op === 'build') {
        if (!Object.prototype.hasOwnProperty.call(TT, a.type)) continue;
        const t = TT[a.type];
        if (turrets[s] || gold < t.cost) continue;
        gold -= t.cost; turrets[s] = { type: a.type, tier: 1, spent: t.cost, cd: 0 };
        log.push([tick, 'B', s, t.idx]);
        if (hook) hook('build', { slot: s, type: t.idx, tier: 1 });
      } else if (a.op === 'upgrade') {
        const T = turrets[s]; if (!T || T.tier >= 3) continue;
        const c = TT[T.type].cost * (T.tier === 1 ? 1 : 2);
        if (gold < c) continue;
        gold -= c; T.spent += c; T.tier++;
        log.push([tick, 'U', s, T.tier]);
        if (hook) hook('upgrade', { slot: s, type: TT[T.type].idx, tier: T.tier });
      } else if (a.op === 'sell') {
        const T = turrets[s]; if (!T) continue;
        gold += Math.floor(T.spent * 70 / 100); turrets[s] = null;
        log.push([tick, 'S', s, 0]);
        if (hook) hook('sell', { slot: s, type: TT[T.type].idx, tier: T.tier });
      }
    }
  }

  let tick = 0;
  for (; tick < maxTicks; tick++) {
    if (tick >= 20 && (tick - 20) % 40 === 0) {
      const w = (tick - 20) / 40 + 1;
      gold += Math.min(50, Math.floor(gold * 5 / 100)) + 10 + 2 * w;
      genWave(w + 1);
      if (hook) hook('wave', { w, next: waves[w + 1].slice() });
      plan(w, tick);
      const list = waves[w];
      for (let i = 0; i < list.length; i++) queue.push({ tick: tick + 4 * i, wave: w, idx: i, type: list[i] });
      queue.splice(0, qi); qi = 0; const rest = queue.splice(0);
      rest.sort((a, b) => a.tick - b.tick || a.wave - b.wave || a.idx - b.idx);
      for (const q of rest) queue.push(q);
    }
    while (qi < queue.length && queue[qi].tick <= tick) {
      const q = queue[qi++];
      spawn(q.type, q.wave, Math.floor(ET[q.type].hp * m(q.wave) / 1000), 0);
    }
    const alive = [];
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      let sp = ET[e.type].speed; if (e.slow > 0) sp = Math.floor(sp * 60 / 100);
      e.progress += sp;
      if (e.progress >= ROUTES[e.air].total) {
        baseHp -= ET[e.type].leak;
        log.push([tick, 'L', e.id, baseHp]);
        if (hook) hook('leak', { id: e.id, hp: baseHp });
        if (baseHp <= 0) {
          fallTick = tick;
          log.push([tick, 'F', Math.floor((tick - 20) / 40) + 1, 0]);
          if (hook) {
            enemies = alive.concat(enemies.slice(i + 1));
            hook('fall', { tick });
            hook('tick', { tick, enemies, baseHp: 0, gold, turrets, wave: Math.floor((tick - 20) / 40) + 1 });
          }
          return finish();
        }
        continue;
      }
      setPos(e); alive.push(e);
    }
    enemies = alive;
    for (const e of enemies) {
      e.age++;
      if (e.type === 'mender' && e.age % 20 === 0) {
        for (const o of enemies) {
          const dx = o.x - e.x, dy = o.y - e.y;
          if (dx * dx + dy * dy <= 22500) o.hp = Math.min(o.maxHp, o.hp + Math.floor(o.maxHp * 8 / 100));
        }
        if (hook) hook('heal', { x: e.x, y: e.y });
      }
    }
    for (let s = 0; s < 16; s++) {
      const T = turrets[s]; if (!T) continue;
      const D = TT[T.type];
      if (T.cd > 0) T.cd--;
      if (T.cd > 0) continue;
      const r = range(T), r2 = r * r, tx = SLOTS[s][0] * 100 + 50, ty = SLOTS[s][1] * 100 + 50;
      const cands = [];
      for (const e of enemies) {
        if (e.hp <= 0) continue;
        if (e.air ? !D.air : !D.ground) continue;
        const dx = e.x - tx, dy = e.y - ty;
        if (dx * dx + dy * dy <= r2) cands.push(e);
      }
      if (!cands.length) continue;
      let tgt = null;
      if (strat.target) {
        const id = strat.target({ slot: s, type: T.type, tier: T.tier, x: tx, y: ty, range: r }, cands.map(view));
        for (const c of cands) if (c.id === id) { tgt = c; break; }
      }
      if (!tgt) {
        let best = Infinity;
        for (const c of cands) { const rem = ROUTES[c.air].total - c.progress; if (rem < best) { best = rem; tgt = c; } }
      }
      const dmg = tierDmg(D, T.tier);
      let hits = [tgt];
      if (D.splash) {
        hits = [];
        const r2s = D.splash * D.splash;
        for (const e of enemies) {
          if (e.hp <= 0) continue;
          if (e.air ? !D.air : !D.ground) continue;
          const dx = e.x - tgt.x, dy = e.y - tgt.y;
          if (dx * dx + dy * dy <= r2s) hits.push(e);
        }
      }
      for (const e of hits) {
        e.hp -= D.pierce ? dmg : Math.max(1, dmg - e.armor);
        if (D.slow) e.slow = D.slow;
      }
      T.cd = D.per;
      if (hook) hook('shot', { tick, slot: s, type: D.idx, tier: T.tier, tx: tgt.x, ty: tgt.y, air: tgt.air, id: tgt.id, splash: D.splash });
      if (enemies.some(e => e.hp <= 0)) {
        const dead = enemies.filter(e => e.hp <= 0);
        enemies = enemies.filter(e => e.hp > 0);
        for (const e of dead) {
          gold += ET[e.type].bounty;
          log.push([tick, 'K', e.id, s]);
          if (hook) hook('kill', { id: e.id, type: e.type === 'splitling' ? 6 : ORDER.indexOf(e.type), x: e.x, y: e.y, air: e.air, slot: s });
          if (e.type === 'splitter') for (let k = 0; k < 3; k++) spawn('splitling', e.wave, Math.max(1, Math.floor(e.maxHp / 4)), e.progress);
        }
      }
    }
    for (const e of enemies) if (e.slow > 0) e.slow--;
    if (hook) hook('tick', { tick, enemies, baseHp, gold, turrets, wave: Math.max(0, Math.floor((tick - 20) / 40) + 1) });
  }
  return finish();
