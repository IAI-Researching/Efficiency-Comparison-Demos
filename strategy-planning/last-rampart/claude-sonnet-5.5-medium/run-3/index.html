<!DOCTYPE html>
<html lang="en">
<head>

<title>Last Rampart</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;

  gap: 10px;
  padding: 0 14px;

  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;

  align-items: center;
  justify-content: center;

  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;

  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;

  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;

}

  background: rgba(255, 255, 255, 0.16);
}

#speed-group {

}

  width: 42px;

  border-radius: 9999px;

  font-weight: 500;

.speed-pill.is-active {

}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;

  width: 12px;

  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;

</style>

<div id="dock" role="toolbar" aria-label="Simulation Controls">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script id="rampart-strategy">
function createStrategy() {
  // Build / upgrade / sell order found by offline search over many seeds (never on seed 42),
  // executed greedily as gold allows; plus a per-turret-type targeting rule.
  var PLAN = {"order":[["b",10,"bolt"],["b",11,"cannon"],["s",7],["u",14],["b",13,"bolt"],["u",10],["b",8,"cannon"],["u",1],["u",8],["u",12],["b",5,"cannon"],["u",3],["b",14,"bolt"],["s",2],["b",6,"cannon"],["u",6],["b",8,"frost"],["u",9],["b",8,"bolt"],["b",7,"cannon"],["u",7],["b",14,"cannon"],["b",4,"flak"],["u",7],["u",2],["b",2,"flak"],["u",2],["u",15],["u",7],["b",11,"lance"],["b",9,"cannon"],["u",5],["b",15,"flak"],["b",8,"bolt"],["b",6,"lance"],["u",5],["b",14,"frost"],["u",9],["u",6],["b",3,"flak"],["u",0],["u",11],["b",9,"bolt"],["b",7,"frost"],["b",10,"lance"],["b",4,"lance"],["b",15,"frost"],["u",10],["b",1,"flak"],["b",12,"cannon"],["b",0,"flak"],["b",8,"cannon"],["b",1,"flak"],["u",8],["b",15,"frost"],["b",5,"frost"],["b",10,"flak"],["u",11],["b",12,"bolt"],["u",9],["u",7],["u",5],["u",11],["u",9],["u",2],["b",6,"bolt"],["b",1,"frost"],["u",4],["b",6,"flak"],["u",12],["u",0],["u",5],["u",13],["u",8],["u",11],["u",3],["u",13],["u",14],["u",2],["u",12],["u",14],["u",13],["u",0],["u",3],["u",3],["s",0],["s",1],["b",5,"flak"],["u",12],["u",14]],"modes":[3,0,3,5,3]};
  var ORDER = PLAN.order, MODES = PLAN.modes;
  var TYPES = ['bolt', 'cannon', 'frost', 'lance', 'flak'];
  var COST = { bolt: 50, cannon: 90, frost: 70, lance: 120, flak: 80 };
  var ptr = 0;
  return {
    plan: function (s) {
      var acts = [];
      var g = s.gold;
      var occ = s.slots.map(function (x) { return x.turret ? { type: x.turret.type, tier: x.turret.tier, spent: x.turret.spent } : null; });
      while (ptr < ORDER.length && acts.length < 32) {
        var it = ORDER[ptr];
        if (it[0] === 'b') {
          if (occ[it[1]]) { ptr++; continue; }
          var c = COST[it[2]];
          if (g < c) break;
          g -= c; occ[it[1]] = { type: it[2], tier: 1, spent: c };
          acts.push({ op: 'build', slot: it[1], type: it[2] });
        } else if (it[0] === 'u') {
          var o = occ[it[1]];
          if (!o || o.tier >= 3) { ptr++; continue; }
          var uc = COST[o.type] * (o.tier === 1 ? 1 : 2);
          if (g < uc) break;
          g -= uc; o.tier++; o.spent += uc;
          acts.push({ op: 'upgrade', slot: it[1] });
        } else {
          var o2 = occ[it[1]];
          if (o2) { g += Math.floor(o2.spent * 70 / 100); occ[it[1]] = null; acts.push({ op: 'sell', slot: it[1] }); }
        }
        ptr++;
      }
      return acts;
    },
    target: function (t, cs) {
      var m = MODES[TYPES.indexOf(t.type)];
      if (!m) return -1;
      var best = -1, bv = -Infinity;
      for (var i = 0; i < cs.length; i++) {
        var e = cs[i], v;
        if (m === 1) v = e.hp;
        else if (m === 2) v = -e.hp;
        else if (m === 3) v = (e.slowed ? 0 : 1e6) - e.remaining;
        else if (m === 4) v = e.armor * 1e6 - e.remaining;
        else if (m === 5) v = e.maxHp * 1e6 - e.remaining;
        else v = -e.remaining;
        if (v > bv) { bv = v; best = e.id; }
      }
      return best;
    }
  };
}

</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks, obs) {
  var TT = ['bolt', 'cannon', 'frost', 'lance', 'flak'];
  var TD = {
    bolt: { cost: 50, dmg: 26, per: 8, range: 300, splash: 0, slow: 0, pierce: 0, ground: 1, air: 1 },
    cannon: { cost: 90, dmg: 60, per: 24, range: 260, splash: 90, slow: 0, pierce: 0, ground: 1, air: 0 },
    frost: { cost: 70, dmg: 10, per: 12, range: 240, splash: 0, slow: 30, pierce: 0, ground: 1, air: 1 },
    lance: { cost: 120, dmg: 180, per: 36, range: 360, splash: 0, slow: 0, pierce: 1, ground: 1, air: 0 },
    flak: { cost: 80, dmg: 40, per: 10, range: 320, splash: 70, slow: 0, pierce: 0, ground: 0, air: 1 }
  };
  var ET = {
    grunt: { hp: 60, sp: 10, bounty: 4, leak: 1, air: 0, first: 1, wt: 10 },
    runner: { hp: 40, sp: 20, bounty: 4, leak: 1, air: 0, first: 2, wt: 4 },
    wisp: { hp: 50, sp: 12, bounty: 6, leak: 2, air: 1, first: 3, wt: 3 },
    brute: { hp: 150, sp: 6, bounty: 9, leak: 3, air: 0, first: 4, wt: 3 },
    splitter: { hp: 90, sp: 8, bounty: 6, leak: 2, air: 0, first: 6, wt: 2 },
    mender: { hp: 70, sp: 8, bounty: 7, leak: 2, air: 0, first: 8, wt: 1 },
    splitling: { hp: 0, sp: 12, bounty: 1, leak: 1, air: 0, first: 99, wt: 0 }
  };
  var ORDER = ['grunt', 'runner', 'wisp', 'brute', 'splitter', 'mender'];
  var SLOTS = [[3, 3], [5, 5], [7, 4], [7, 8], [9, 9], [10, 5], [11, 8], [13, 8], [14, 5], [15, 2], [16, 7], [17, 4], [19, 8], [20, 10], [22, 9], [3, 7]];
    function mkRoute(pts) {
    var p = pts.map(function (q) { return [q[0] * 100 + 50, q[1] * 100 + 50]; });
    var cum = [0];
    for (var i = 1; i < p.length; i++) cum.push(cum[i - 1] + Math.abs(p[i][0] - p[i - 1][0]) + Math.abs(p[i][1] - p[i - 1][1]));
    return { p: p, cum: cum, len: cum[cum.length - 1] };
  }
  var ROUTES = [
    mkRoute([[0, 2], [6, 2], [6, 10], [12, 10], [12, 3], [18, 3], [18, 11], [23, 11]]),
    mkRoute([[0, 6], [21, 6], [21, 11], [23, 11]])
  ];
  function mulberry32(a) { return function () {
    a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return (t ^ (t >>> 14)) >>> 0; }; }
  function posAt(r, prog) {
    var i = 1;
    while (i < r.cum.length - 1 && prog > r.cum[i]) i++;
    var a = r.p[i - 1], b = r.p[i], d = r.cum[i] - r.cum[i - 1];
    var f = Math.min(prog - r.cum[i - 1], d);
    if (f < 0) f = 0;
    var dx = b[0] - a[0], dy = b[1] - a[1];
    return [a[0] + (dx > 0 ? f : dx < 0 ? -f : 0), a[1] + (dy > 0 ? f : dy < 0 ? -f : 0)];
  }
  var mArr = [0, 1000];
  function mult(w) { while (mArr.length <= w) mArr.push(Math.floor(mArr[mArr.length - 1] * 108 / 100)); return mArr[w]; }
  var rng = mulberry32(seed);
  var waves = [];
  function genWave(w) {
    var list = [], types = [], sum = 0, i;
    for (i = 0; i < ORDER.length; i++) if (ET[ORDER[i]].first <= w) { types.push(ORDER[i]); sum += ET[ORDER[i]].wt; }
    var n = 4 + Math.floor(3 * w / 5);
    for (i = 0; i < n; i++) {
      var r = rng() % sum, k = 0;
      while (r >= ET[types[k]].wt) { r -= ET[types[k]].wt; k++; }
      list.push(types[k]);
    }
    return list;
  }
  var strat = createStrategy();
  var log = [];
  var gold = 250, baseHp = 10, nextId = 1, curWave = 0, fallTick = -1;
  var turrets = new Array(16).fill(null);
  var enemies = [];
  var spawnQ = {};
  function mkEnemy(type, wave, maxHp, prog) {
    var d = ET[type];
    var armor = type === 'grunt' ? Math.floor(wave / 4) : type === 'brute' ? 6 + wave : 0;
    return { id: nextId++, type: type, wave: wave, hp: maxHp, maxHp: maxHp, prog: prog, age: 0, slow: 0, air: d.air, armor: armor, sp: d.sp, route: ROUTES[d.air] };
  }
  function view(e) {
    var p = posAt(e.route, e.prog);
    return { id: e.id, type: e.type, hp: e.hp, maxHp: e.maxHp, x: p[0], y: p[1], air: e.air, armor: e.armor, speed: e.slow > 0 ? Math.floor(e.sp * 60 / 100) : e.sp, slowed: e.slow > 0 ? 1 : 0, remaining: e.route.len - e.prog };
  }
  function hash(l) {
    var s = JSON.stringify(l), h = 0x811c9dc5;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
    return ('00000000' + (h >>> 0).toString(16)).slice(-8);
  }
  function tdmg(t) { var d = TD[t.type].dmg; for (var i = 1; i < t.tier; i++) d = Math.floor(d * 16 / 10); return d; }
  function trange(t) { return TD[t.type].range + 30 * (t.tier - 1); }
  waves[1] = genWave(1);
  var done = false;
  for (var tick = 0; tick < maxTicks && !done; tick++) {
    if (tick >= 20 && (tick - 20) % 40 === 0) {
      var w = (tick - 20) / 40 + 1;
      curWave = w;
      gold += Math.min(50, Math.floor(gold * 5 / 100)) + 10 + 2 * w;
      waves[w + 1] = genWave(w + 1);
      var st = { tick: tick, wave: w, gold: gold, baseHp: baseHp, slots: [], enemies: enemies.map(view), nextWave: waves[w + 1].slice() };
      for (var s = 0; s < 16; s++) {
        var t0 = turrets[s];
        st.slots.push({ slot: s, x: SLOTS[s][0], y: SLOTS[s][1], turret: t0 ? { type: t0.type, tier: t0.tier, spent: t0.spent } : null });
      }
      var acts = strat.plan(st);
      if (obs && obs.wave) obs.wave(tick, w);
      if (Array.isArray(acts)) {
        if (acts.length > 32) acts = acts.slice(0, 32);
        for (var ai = 0; ai < acts.length; ai++) {
          var a = acts[ai];
          if (!a || typeof a !== 'object') continue;
          var sl = a.slot;
          if (!(sl >= 0 && sl < 16) || Math.floor(sl) !== sl) continue;
          var tu = turrets[sl];
          if (a.op === 'build') {
            var ti = TT.indexOf(a.type);
            if (tu || ti < 0) continue;
            var c = TD[a.type].cost;
            if (gold < c) continue;
            gold -= c;
            turrets[sl] = { type: a.type, tier: 1, spent: c, cd: 0 };
            log.push([tick, 'B', sl, ti]);
            if (obs && obs.build) obs.build(tick, sl, ti);
          } else if (a.op === 'upgrade') {
            if (!tu || tu.tier >= 3) continue;
            var uc = TD[tu.type].cost * (tu.tier === 1 ? 1 : 2);
            if (gold < uc) continue;
            gold -= uc; tu.spent += uc; tu.tier++;
            log.push([tick, 'U', sl, tu.tier]);
            if (obs && obs.upgrade) obs.upgrade(tick, sl, tu.tier);
          } else if (a.op === 'sell') {
            if (!tu) continue;
            gold += Math.floor(tu.spent * 70 / 100);
            turrets[sl] = null;
            log.push([tick, 'S', sl, 0]);
            if (obs && obs.sell) obs.sell(tick, sl);
          }
        }
      }
      var comp = waves[w];
      for (var i = 0; i < comp.length; i++) {
        var tt = tick + 4 * i;
        (spawnQ[tt] || (spawnQ[tt] = [])).push([w, comp[i]]);
      }
    }
    var sq = spawnQ[tick];
    if (sq) {
      for (var i = 0; i < sq.length; i++) {
        var wv = sq[i][0], ty = sq[i][1];
        enemies.push(mkEnemy(ty, wv, Math.floor(ET[ty].hp * mult(wv) / 1000), 0));
      }
      delete spawnQ[tick];
    }
    var alive = [];
    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      e.prog += e.slow > 0 ? Math.floor(e.sp * 60 / 100) : e.sp;
      if (e.prog >= e.route.len) {
        baseHp -= ET[e.type].leak;
        log.push([tick, 'L', e.id, baseHp]);
        if (obs && obs.leak) obs.leak(tick, e);
        if (baseHp <= 0) { fallTick = tick; log.push([tick, 'F', curWave, 0]); done = true; break; }
      } else alive.push(e);
    }
    if (done) break;
    enemies = alive;
    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      e.age++;
      if (e.type === 'mender' && e.age % 20 === 0) {
        var mp = posAt(e.route, e.prog);
        for (var j = 0; j < enemies.length; j++) {
          var o = enemies[j];
          var op = posAt(o.route, o.prog);
          var dx = op[0] - mp[0], dy = op[1] - mp[1];
          if (dx * dx + dy * dy <= 150 * 150) o.hp = Math.min(o.maxHp, o.hp + Math.floor(o.maxHp * 8 / 100));
        }
        if (obs && obs.heal) obs.heal(tick, mp[0], mp[1], e.id);
      }
    }
    for (var s = 0; s < 16; s++) {
      var tu = turrets[s];
      if (!tu) continue;
      if (tu.cd > 0) tu.cd--;
      if (tu.cd > 0) continue;
      var td = TD[tu.type], rg = trange(tu), r2 = rg * rg;
      var tp = SLOTS[s], tx = tp[0] * 100 + 50, ty2 = tp[1] * 100 + 50;
      var cands = [], cpos = [];
      for (var i = 0; i < enemies.length; i++) {
        var e = enemies[i];
        if (e.hp <= 0) continue;
        if (e.air ? !td.air : !td.ground) continue;
        var p = posAt(e.route, e.prog);
        var dx = p[0] - tx, dy = p[1] - ty2;
        if (dx * dx + dy * dy <= r2) { cands.push(e); cpos.push(p); }
      }
      if (!cands.length) continue;
      var pick = -1;
      if (strat.target) {
        var tv = { slot: s, type: tu.type, tier: tu.tier, x: tx, y: ty2, range: rg };
        var cv = cands.map(view);
        var rid = strat.target(tv, cv);
        for (var i = 0; i < cands.length; i++) if (cands[i].id === rid) { pick = i; break; }
      }
      if (pick < 0) {
        pick = 0;
        var best = cands[0].route.len - cands[0].prog;
        for (var i = 1; i < cands.length; i++) { var rm = cands[i].route.len - cands[i].prog; if (rm < best) { best = rm; pick = i; } }
      }
      var tg = cands[pick], tgp = cpos[pick];
      var dm = tdmg(tu);
      var hit = [];
      if (td.splash > 0) {
        var sr = td.splash * td.splash;
        for (var i = 0; i < enemies.length; i++) {
          var e = enemies[i];
          if (e.hp <= 0) continue;
          if (e.air ? !td.air : !td.ground) continue;
          var p = posAt(e.route, e.prog);
          var dx = p[0] - tgp[0], dy = p[1] - tgp[1];
          if (dx * dx + dy * dy <= sr) hit.push(e);
        }
      } else hit.push(tg);
      for (var i = 0; i < hit.length; i++) {
        var e = hit[i];
        e.hp -= td.pierce ? dm : Math.max(1, dm - e.armor);
        if (td.slow) e.slow = td.slow;
      }
      tu.cd = td.per;
      if (obs && obs.shot) obs.shot(tick, s, tu.type, tu.tier, tg.id, tgp[0], tgp[1], rg, tg.air);
      var rem = [], spawned = [];
      for (var i = 0; i < enemies.length; i++) {
        var e = enemies[i];

            var yy = 0.2 + 1.6 * ((uu + q / np) % 1) * uu;
            addGlow(bx + Math.cos(an2) * rad, yy, bz + Math.sin(an2) * rad, 0.14 * (1 - uu), col[0], col[1], col[2], 1.6);
          }
          addRing(bx, 0.18, bz, 0.35 + 0.8 * uu, col[0], col[1], col[2], 1.6 * (1 - uu));
        }
      }
    }
    /* leaks + keep state */
    var leakCount = lowerBound(rec.leaks, Math.floor(now) + 1);
    while (leakCount > 0 && rec.leaks[leakCount - 1].t > now) leakCount--;
    var flash = 0, fell = FALL_T >= 0 && t >= FALL_T;
    i0 = lowerBound(rec.leaks, Math.floor(now) - 20);
    for (i = i0; i < rec.leaks.length; i++) {
      var lk = rec.leaks[i]; if (lk.t > now) break;
      var la = (now - lk.t) / TPS;
      if (la < 0.4) flash = Math.max(flash, 1 - la / 0.4);
      var cidx = i % 8, cd = chunkDefs[cidx];
      if (la < 1.3 && !(fell && lk.t === rec.fallTick)) debrisBurst(lk.t * 7 + i, 5, 23.5 + cd[0], 0.8, 11.5 + cd[1], lk.t, now, 26, 1.8, 3, 0.2, [0.6, 0.57, 0.5], 0.2);
      if (la < 0.5) addRing(23.5, 0.2, 11.5, 0.5 + 1.8 * la / 0.5, 1, 0.2, 0.15, 1.3 * (1 - la / 0.5));
    }
    var hpNow = rec.hp[k];
    for (i = 0; i < 8; i++) keepParts[i].visible = !fell && i >= Math.min(leakCount, 8) && (leakCount < 8 || false);
    for (i = 0; i < 8; i++) keepParts[i].visible = !fell && i >= leakCount;
    keepCore.visible = !fell;
    var crum = Math.max(0, (10 - hpNow)) / 10;
    keepCore.scale.set(1, 1 - 0.3 * crum, 1); keepCore.rotation.z = 0.05 * crum;
    keepMat.emissiveIntensity = flash * 1.2;
    rubbleGroup.visible = fell;
    if (fell) {
      var fa = (t - FALL_T);
      debrisBurst(777, 70, 23.5, 0.9, 11.5, FALL_T * TPS, now, 1000, 3.0, 5, 0.22, [0.6, 0.57, 0.5], 0.8);
      debrisBurst(778, 40, 23.5, 1.2, 11.5, FALL_T * TPS, now, 1000, 1.4, 6.5, 0.16, [0.45, 0.42, 0.38], 0.6);
      if (fa < 1.6) { var wv = fa / 1.6; addRing(23.5, 0.2, 11.5, 0.5 + 9 * wv, 1, 0.55, 0.3, 2 * (1 - wv)); addRing(23.5, 0.2, 11.5, 0.3 + 6 * wv, 1, 0.9, 0.7, 1.4 * (1 - wv)); }
      if (fa < 0.8) addGlow(23.5, 0.9, 11.5, 3.2 * (1 - fa / 0.8) + 0.3, 1, 0.55, 0.2, 1.3 * (1 - fa / 0.8));
    }
    /* lane scroll */
    laneTex.forEach(function (lt) { lt.tex.offset.x = -at * 0.6; });

    fx.hb = 0;
    var pools = [[ringPool, fx.ring], [beamPool, fx.beam], [glowPool, fx.glow], [debrisPool, fx.deb], [haloPool, fx.halo], [hbBg, fx.hbBg], [hbFg, fx.hbFg]];
    pools.forEach(function (p) { p[0].count = p[1]; p[0].instanceMatrix.needsUpdate = true; p[0].instanceColor.needsUpdate = true; });

    /* shake */
    var tr = trauma(t), amp = tr * tr * 0.25;
    camera.position.copy(baseCamPos);
    if (amp > 0) { camera.position.x += noise(t, 0) * amp; camera.position.z += noise(t, 1) * amp; camera.position.y += noise(t + 31.7, 1) * amp * 0.5; }
    camera.updateMatrixWorld();

    var grey = FALL_T >= 0 ? Math.max(0, Math.min(1, (t - FALL_T) / 1.0)) : 0;
    drawHUD(t, k);
    renderer.setRenderTarget(null);
    renderer.clear();
    if (grey > 0) {
      var rt = getRT();
      renderer.setRenderTarget(rt); renderer.setClearColor(0x000000, 0); renderer.clear(); renderer.render(scene, camera);
      renderer.setRenderTarget(null); postMat.uniforms.tex.value = rt.texture; postMat.uniforms.grey.value = grey;
      renderer.clear(); renderer.render(postScene, postCam);
    } else renderer.render(scene, camera);
    renderer.clearDepth();
    renderer.render(hudScene, hudCam);
  };
  renderAt(0);
}

/* ---------- audio ---------- */
(function () {
  var AC = window.AudioContext || window.webkitAudioContext, ctx = null, master = null, comp = null, noiseBuf = null, wind = null, windGain = null;
  var active = [], audible = false, prevT = 0, shotTimes = [], killTimes = [];
  var ar = mulberry32(4242);
  function arand() { return ar() / 4294967296; }
  try {
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0;
    comp = ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 6; comp.attack.value = 0.003; comp.release.value = 0.15;
    master.connect(comp); comp.connect(ctx.destination);
    var len = ctx.sampleRate * 2; noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    var d = noiseBuf.getChannelData(0); for (var i = 0; i < len; i++) d[i] = arand() * 2 - 1;
    ctx.resume();
  } catch (e) { ctx = null; }
  function resume() { if (ctx && ctx.state !== 'running') { try { ctx.resume(); } catch (e) {} } }
  window.addEventListener('pointerdown', resume); window.addEventListener('keydown', resume);
  function pan(x) {
    if (ctx.createStereoPanner) { var p = ctx.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, (x / 24) * 2 - 1)) * 0.8; return p; }
    return ctx.createGain();
  }
  function out(x, nodes) { var p = pan(x); p.connect(master); return p; }
  function track(src, dur) { var o = { src: src }; active.push(o); src.onended = function () { var ix = active.indexOf(o); if (ix >= 0) active.splice(ix, 1); }; }
  function osc(type, f0, f1, dur, vol, x, delay) {
    var t0 = ctx.currentTime + (delay || 0), o = ctx.createOscillator(), g = ctx.createGain(), p = out(x);
    o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(p); o.start(t0); o.stop(t0 + dur + 0.02); track(o);
  }
  function noise(dur, vol, fType, f0, f1, x, delay, Q) {
    var t0 = ctx.currentTime + (delay || 0), s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain(), p = out(x);
    s.buffer = noiseBuf; f.type = fType; f.frequency.setValueAtTime(f0, t0); f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur); f.Q.value = Q || 1;
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(p); s.start(t0, arand() * 1.5, dur + 0.02); track(s);
  }
  var PRI = [0, 3, 2, 4, 1];
  function shotSound(type, x) {
    if (type === 0) osc('square', 1500 + arand() * 200, 700, 0.06, 0.05, x);
    else if (type === 1) { osc('sine', 150, 45, 0.22, 0.28, x); noise(0.14, 0.18, 'lowpass', 900, 200, x); }
    else if (type === 2) { osc('sine', 2400, 1700, 0.12, 0.05, x); osc('triangle', 3300, 2500, 0.1, 0.03, x); }
    else if (type === 3) { osc('sawtooth', 1100, 120, 0.2, 0.09, x); osc('square', 220, 70, 0.2, 0.06, x); }
    else noise(0.1, 0.12, 'bandpass', 2600, 900, x, 0, 2);
  }
  function killSound(x) { osc('sine', 340 + arand() * 60, 90, 0.09, 0.07, x); }
  function hornSound() { osc('sawtooth', 130, 190, 0.7, 0.08, 12); osc('sawtooth', 196, 286, 0.7, 0.06, 12, 0.05); osc('square', 261, 380, 0.6, 0.03, 12, 0.1); }
  function leakSound(x) { noise(0.25, 0.3, 'lowpass', 1800, 150, x); osc('square', 880, 880, 0.12, 0.06, x); osc('square', 660, 660, 0.14, 0.06, x, 0.13); }
  function fallSound() { osc('sine', 80, 25, 1.6, 0.5, 22); noise(2.0, 0.45, 'lowpass', 700, 60, 22); osc('sawtooth', 55, 30, 1.8, 0.12, 22); }
  function startWind() {
    if (wind) return;
    wind = ctx.createBufferSource(); wind.buffer = noiseBuf; wind.loop = true;
    var f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 380; f.Q.value = 0.8;
    var lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = 0.18; lg.gain.value = 0.02; lfo.connect(lg);
    windGain = ctx.createGain(); windGain.gain.value = 0.05; lg.connect(windGain.gain);

    var t = ctx.currentTime; master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(master.gain.value, t);

    if (!ctx) return;

    if (cur < prevT) { prevT = cur; return; }

    if (b - a > 0.35) { prevT = cur; return; }

    batch.forEach(function (e) {
      shotTimes = shotTimes.filter(function (x) { return x > b - 1; });
      if (shotTimes.length < 12) { shotTimes.push(b); shotSound(e.type, SLOT_XY[e.slot][0] + 0.5); }
    });
    var kc = 0;
    between(rec.kills, a, b, function (e) { if (kc++ < 4) { killTimes = killTimes.filter(function (x) { return x > b - 0.5; }); if (killTimes.length < 8) { killTimes.push(b); killSound(e.x / 100); } } });

    else if (windGain) windGain.gain.value = 0;

  };
})();

/* ---------- main loop ---------- */
function frame(ts) {
  requestAnimationFrame(frame);
  var raw = lastTs === null ? 0 : (ts - lastTs) / 1000; lastTs = ts;
  var dt = Math.max(0, Math.min(raw, 0.1));
  if (firstFrame) { firstFrame = false; if (state === 'COUNTDOWN') { countdownElapsed = 0; el.countdown.style.display = 'block'; el.countdown.textContent = '3'; } dt = 0; }
  if (state === 'COUNTDOWN') {
    countdownElapsed += dt;
    if (countdownElapsed >= 3) { hideCountdown(); setState('PLAYING'); }
    else { el.countdown.style.display = 'block'; el.countdown.textContent = String(3 - Math.floor(countdownElapsed)); }
  } else if (state === 'REFIRE_HOLD') {
    holdElapsed += dt;
    if (holdElapsed >= 1) { setState('PLAYING'); audioReset(0); }
  } else if (state === 'PLAYING') {
    simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
    setScrub(simTime.toFixed(3));
    if (simTime >= DURATION) { simTime = DURATION; setScrub(DURATION.toFixed(3)); setState('ENDED'); }
  }
  if (glReady) { try { renderAt(simTime); } catch (e) { if (window.console) console.error(e); } }
  audioFrame(simTime, state === 'PLAYING', dt);
}
setIcons(true);
requestAnimationFrame(frame);
})();
