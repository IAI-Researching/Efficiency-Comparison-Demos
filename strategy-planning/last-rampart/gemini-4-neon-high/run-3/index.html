<!DOCTYPE html>

<style>

<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">

  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script id="rampart-strategy">
function createStrategy() {
  const COST = { bolt: 50, cannon: 90, frost: 70, lance: 120, flak: 80 };
  const DMG = {
    bolt:   [0, 26,  41,  65],
    cannon: [0, 60,  96,  153],
    frost:  [0, 10,  16,  25],
    lance:  [0, 180, 288, 460],
    flak:   [0, 40,  64,  102]
  };
  const BOARD = [
    'lance', 'cannon', 'lance', 'cannon', 'cannon', 'flak', 'cannon', 'cannon',
    'cannon', 'cannon', 'flak', 'cannon', 'flak', 'cannon', 'flak', 'flak'
  ];
  const BUILD_ORDER = [3, 6, 12, 13, 11, 8, 4, 1, 0, 14, 7, 10, 5, 2, 9, 15];
  const UP2_ORDER   = [4, 6, 8, 3, 11, 13, 12, 1, 0, 14, 7, 10, 2, 9, 5, 15];
  const UP3_ORDER   = [4, 6, 8, 3, 11, 13, 1, 0, 12, 14, 10, 5, 7, 2, 9, 15];
  const AIR_SLOTS   = [12, 14, 10, 5, 15];

  const frostSeq = new Map();
  let seq = 0;

  return {
    plan(s) {
      const actions = [];
      let g = s.gold;
      const vSlots = new Array(16);
      for (let i = 0; i < 16; i++) {
        const sl = s.slots[i];
        vSlots[i] = sl.turret
          ? { type: sl.turret.type, tier: sl.turret.tier, spent: sl.turret.spent }
          : null;
      }

      function doBuild(slot, type) {
        const c = COST[type];
        if (vSlots[slot] || g < c || actions.length >= 32) return false;
        actions.push({ op: 'build', slot: slot, type: type });
        vSlots[slot] = { type: type, tier: 1, spent: c };
        g -= c;
        return true;
      }
      function doUpgrade(slot) {
        const tr = vSlots[slot];
        if (!tr || tr.tier >= 3 || actions.length >= 32) return false;
        const c = tr.tier === 1 ? COST[tr.type] : COST[tr.type] * 2;
        if (g < c) return false;
        actions.push({ op: 'upgrade', slot: slot });
        tr.tier += 1;
        tr.spent += c;
        g -= c;
        return true;
      }
      function doSell(slot) {
        const tr = vSlots[slot];
        if (!tr || actions.length >= 32) return false;
        actions.push({ op: 'sell', slot: slot });
        g += Math.floor(tr.spent * 70 / 100);
        vSlots[slot] = null;
        return true;
      }

      if (s.wave === 1) {
        doBuild(3, 'cannon');
        return actions;
      }

      let airCount = 0, groundCount = 0, minAirRem = 9999, minGroundRem = 9999;
      let closeGround = 0, closeAir = 0;
      for (let i = 0; i < s.enemies.length; i++) {
        const e = s.enemies[i];
        if (e.air) {
          airCount++;
          if (e.remaining < minAirRem) minAirRem = e.remaining;
          if (e.remaining < 1400) closeAir++;
        } else {
          groundCount++;
          if (e.remaining < minGroundRem) minGroundRem = e.remaining;
          if (e.remaining < 1600) closeGround++;
        }
      }
      let nextAir = 0;
      for (let i = 0; i < s.nextWave.length; i++) {
        if (s.nextWave[i] === 'wisp') nextAir++;
      }

      let remCost = 0;
      for (let i = 0; i < 16; i++) {
        const want = BOARD[i];
        const tr = vSlots[i];
        const fullC = COST[want] * 4;
        if (!tr) remCost += fullC;
        else if (tr.type !== want) remCost += fullC - Math.floor(tr.spent * 70 / 100);
        else if (tr.tier === 1) remCost += COST[want] * 3;
        else if (tr.tier === 2) remCost += COST[want] * 2;
      }

      const earlyDanger = (s.baseHp <= 8) || (s.wave >= 10 && (minGroundRem < 1000 || minAirRem < 850 || closeGround >= 8 || closeAir >= 3));
      const pressured = s.wave >= 23 && (
        groundCount >= 95 || closeGround >= 12 || closeAir >= 4 ||
        minGroundRem < 900 || minAirRem < 700 || s.baseHp <= 8
      );
      const cashingOut = (s.wave >= 32) || (g >= remCost) || pressured || earlyDanger;
      const reserve = cashingOut ? 0 : 1000;

      if (!cashingOut) {
        let flaksT = 0, groundT = 0;
        for (let i = 0; i < 16; i++) {
          const tr = vSlots[i];
          if (!tr) continue;
          if (tr.type === 'flak') flaksT += tr.tier;
          else if (tr.type === 'cannon' || tr.type === 'lance') groundT += tr.tier;
        }
        const wantAirT = (airCount === 0 && nextAir === 0 && s.wave < 5) ? 0
          : s.wave < 11 ? 1 : s.wave < 17 ? 2 : s.wave < 23 ? 3 : 4;
        if (flaksT < wantAirT || (airCount > 0 && minAirRem < 1150)) {
          let acted = false;
          for (let i = 0; i < AIR_SLOTS.length; i++) {
            const sl = AIR_SLOTS[i];
            if (!vSlots[sl] && doBuild(sl, 'flak')) { acted = true; break; }
          }
          if (!acted && minAirRem < 1050) {
            for (let i = 0; i < AIR_SLOTS.length; i++) {
              const sl = AIR_SLOTS[i];
              if (vSlots[sl] && vSlots[sl].type === 'flak' && vSlots[sl].tier < 3 && doUpgrade(sl)) break;
            }
          }
        }

        const wantGroundT = s.wave < 7 ? 1 : s.wave < 12 ? 2 : s.wave < 17 ? 3 : s.wave < 22 ? 5 : 7;
        if (groundT < wantGroundT || minGroundRem < 1150) {
          let acted = false;
          for (let i = 0; i < BUILD_ORDER.length; i++) {
            const sl = BUILD_ORDER[i];
            if ((BOARD[sl] === 'cannon' || BOARD[sl] === 'lance') && !vSlots[sl] && doBuild(sl, BOARD[sl])) {
              acted = true; break;
            }
          }
          if (!acted && minGroundRem < 1250) {
            for (let i = 0; i < UP2_ORDER.length; i++) {
              const sl = UP2_ORDER[i];
              const tr = vSlots[sl];
              if (tr && (tr.type === 'cannon' || tr.type === 'lance') && tr.tier < 3 && doUpgrade(sl)) break;
            }
          }
        }
        if (minGroundRem < 950) {
          for (let i = 0; i < BUILD_ORDER.length; i++) {
            const sl = BUILD_ORDER[i];
            if (BOARD[sl] === 'cannon' && !vSlots[sl] && doBuild(sl, 'cannon')) break;
          }
        }
      }

      for (let i = 0; i < 16; i++) {
        const tr = vSlots[i];
        if (tr && tr.type !== BOARD[i] && (s.wave >= 16 || cashingOut)) {
          const need = COST[BOARD[i]] - Math.floor(tr.spent * 70 / 100);
          if (g - reserve >= need) { doSell(i); doBuild(i, BOARD[i]); }
        }
      }
      for (let i = 0; i < BUILD_ORDER.length; i++) {
        const sl = BUILD_ORDER[i];
        if (vSlots[sl]) continue;
        const want = BOARD[sl];
        if (want === 'flak' && s.wave < 3) continue;
        if (g - reserve >= COST[want]) doBuild(sl, want);
      }
      for (let i = 0; i < UP2_ORDER.length; i++) {
        const sl = UP2_ORDER[i];
        const tr = vSlots[sl];
        if (!tr || tr.type !== BOARD[sl] || tr.tier >= 2) continue;
        if (g - reserve >= COST[tr.type]) doUpgrade(sl);
      }
      for (let i = 0; i < UP3_ORDER.length; i++) {
        const sl = UP3_ORDER[i];
        const tr = vSlots[sl];
        if (!tr || tr.type !== BOARD[sl] || tr.tier >= 3) continue;
        const c = tr.tier === 1 ? COST[tr.type] : COST[tr.type] * 2;
        if (g - reserve >= c) doUpgrade(sl);
      }

      return actions;
    },

    target(turret, cands) {
      if (cands.length === 1) return cands[0].id;
      const t = turret.type;
      const dmg = DMG[t][turret.tier];

      if (t === 'flak') {
        const sp2 = 4900;
        let best = cands[0], bestScore = -1e18;
        for (let i = 0; i < cands.length; i++) {
          const c = cands[i];
          let sc = 0;
          for (let j = 0; j < cands.length; j++) {
            const e = cands[j];
            const dx = e.x - c.x, dy = e.y - c.y;
            if (dx * dx + dy * dy <= sp2) {
              const eff = e.hp < dmg ? e.hp : dmg;
              const effSpd = e.slowed ? 7 : 12;
              const ttl = e.remaining / effSpd;
              let urg = 1 + 260 / (ttl > 8 ? ttl : 8);
              if (ttl < 55) urg *= 5.0;
              if (ttl < 25) urg *= 4.0;
              const hpFrac = e.hp / (e.maxHp > 1 ? e.maxHp : 1);
              const finW = (e.hp <= eff) ? 2.8 : (1.0 + (1.0 - hpFrac) * 0.9);
              sc += eff * urg * finW;
            }
          }
          if (sc > bestScore) { bestScore = sc; best = c; }
        }
        return best.id;
      }

      if (t === 'cannon') {
        const sp2 = 8100;
        const isBack = turret.slot >= 11;
        let best = cands[0], bestScore = -1e18;
        for (let i = 0; i < cands.length; i++) {
          const c = cands[i];
          let sc = 0;
          for (let j = 0; j < cands.length; j++) {
            const e = cands[j];
            const dx = e.x - c.x, dy = e.y - c.y;
            if (dx * dx + dy * dy <= sp2) {
              const raw = dmg - e.armor;
              const hit = raw > 1 ? raw : 1;
              const eff = e.hp < hit ? e.hp : hit;
              const effSpd = e.slowed ? Math.floor(e.speed * 60 / 100) : e.speed;
              const ttl = e.remaining / (effSpd > 1 ? effSpd : 1);
              let urg = 1 + (isBack ? 500 : 120) / (ttl > 8 ? ttl : 8);
              if (ttl < 50) urg *= 5.0;
              if (ttl < 24) urg *= 4.0;
              const prio = e.type === 'mender' ? 2.2 : e.type === 'runner' ? 2.4 : 1.0;
              const hpFrac = e.hp / (e.maxHp > 1 ? e.maxHp : 1);
              const killW = (e.hp <= eff) ? 2.2 : (1.0 + (1.0 - hpFrac) * 0.5);
              const splitPen = (e.type === 'splitter' && e.remaining < 420 && e.hp <= eff) ? 0.25 : 1.0;
              sc += eff * urg * prio * killW * splitPen;
            }
          }
          if (sc > bestScore) { bestScore = sc; best = c; }
        }
        return best.id;
      }

      if (t === 'lance') {
        let best = cands[0], bestScore = -1e18;
        for (let i = 0; i < cands.length; i++) {
          const e = cands[i];
          const eff = e.hp < dmg ? e.hp : dmg;
          const effSpd = e.slowed ? Math.floor(e.speed * 60 / 100) : e.speed;
          const ttl = e.remaining / (effSpd > 1 ? effSpd : 1);
          let urg = 1 + 200 / (ttl > 8 ? ttl : 8);
          if (ttl < 50) urg *= 4.0;
          const prio = e.type === 'mender' ? 2.6 : e.type === 'brute' ? 1.5 : e.type === 'runner' ? 1.6 : 1.0;
          const killW = e.hp <= eff ? 2.0 : 1.0;
          const sc = eff * urg * prio * killW;
          if (sc > bestScore) { bestScore = sc; best = e; }
        }
        return best.id;
      }

      if (t === 'frost') {
        let best = cands[0], bestScore = -1e18;
        for (let i = 0; i < cands.length; i++) {
          const e = cands[i];
          const isUnslowed = !e.slowed ? 1 : 0;
          const effSpd = e.slowed ? Math.floor(e.speed * 60 / 100) : e.speed;
          const ttl = e.remaining / (effSpd > 1 ? effSpd : 1);
          const last = frostSeq.get(e.id) || 0;
          const typeBonus = e.air ? 60000 : e.type === 'runner' ? 50000 : e.type === 'mender' ? 8000 : 0;
          const sc = isUnslowed ? (1e9 + typeBonus - ttl * 50) : (typeBonus * 0.2 - last * 200 - ttl);
          if (sc > bestScore) { bestScore = sc; best = e; }
        }
        frostSeq.set(best.id, ++seq);
        return best.id;
      }

      let best = cands[0], bestScore = -1e18;
      for (let i = 0; i < cands.length; i++) {
        const e = cands[i];
        const raw = dmg - e.armor;
        const hit = raw > 1 ? raw : 1;
        const eff = e.hp < hit ? e.hp : hit;
        const effSpd = e.slowed ? Math.floor(e.speed * 60 / 100) : e.speed;
        const ttl = e.remaining / (effSpd > 1 ? effSpd : 1);
        const sc = eff * (1 + 220 / (ttl > 5 ? ttl : 5)) * (e.hp <= eff ? 2.2 : 1.0);
        if (sc > bestScore) { bestScore = sc; best = e; }
      }
      return best.id;
    }
  };
}
</script>

<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks, _rec) {
  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return (t ^ (t >>> 14)) >>> 0;
    };
  }

  const GROUND_PTS = [
    [50, 250], [650, 250], [650, 1050], [1250, 1050],
    [1250, 350], [1850, 350], [1850, 1150], [2350, 1150]
  ];
  const AIR_PTS = [
    [50, 650], [2150, 650], [2150, 1150], [2350, 1150]
  ];

  function buildPath(pts) {
    const segs = [];
    let total = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const x0 = pts[i][0], y0 = pts[i][1];
      const x1 = pts[i + 1][0], y1 = pts[i + 1][1];
      const dx = x1 - x0, dy = y1 - y0;
      const len = Math.abs(dx) + Math.abs(dy);
      segs.push({ x0, y0, dx: Math.sign(dx), dy: Math.sign(dy), start: total, len });
      total += len;
    }
    return { segs, len: total };
  }

  const GROUND_PATH = buildPath(GROUND_PTS);
  const AIR_PATH = buildPath(AIR_PTS);

  function posAndDir(path, progress) {
    const segs = path.segs;
    for (let i = 0; i < segs.length; i++) {
      const s = segs[i];
      if (progress <= s.start + s.len || i === segs.length - 1) {
        const d = progress - s.start;
        return [s.x0 + s.dx * d, s.y0 + s.dy * d, s.dx, s.dy];
      }
    }
    return [0, 0, 1, 0];
  }

  const SLOTS_COORDS = [
    [3,3], [5,5], [7,4], [7,8], [9,9], [10,5], [11,8], [13,8],
    [14,5], [15,2], [16,7], [17,4], [19,8], [20,10], [22,9], [3,7]
  ];

  const TURRET_TYPES = {
    bolt:   { idx: 0, cost: 50,  dmg: 26,  period: 8,  range: 300, splash: 0,  slow: 0,  pierce: false, ground: true,  air: true  },
    cannon: { idx: 1, cost: 90,  dmg: 60,  period: 24, range: 260, splash: 90, slow: 0,  pierce: false, ground: true,  air: false },
    frost:  { idx: 2, cost: 70,  dmg: 10,  period: 12, range: 240, splash: 0,  slow: 30, pierce: false, ground: true,  air: true  },
    lance:  { idx: 3, cost: 120, dmg: 180, period: 36, range: 360, splash: 0,  slow: 0,  pierce: true,  ground: true,  air: false },
    flak:   { idx: 4, cost: 80,  dmg: 40,  period: 10, range: 320, splash: 70, slow: 0,  pierce: false, ground: false, air: true  }
  };

  const ENEMY_ORDER = [
    { type: 'grunt',    idx: 0, baseHp: 60,  speed: 10, bounty: 4, leak: 1, air: 0, firstWave: 1, weight: 10 },
    { type: 'runner',   idx: 1, baseHp: 40,  speed: 20, bounty: 4, leak: 1, air: 0, firstWave: 2, weight: 4  },
    { type: 'wisp',     idx: 2, baseHp: 50,  speed: 12, bounty: 6, leak: 2, air: 1, firstWave: 3, weight: 3  },
    { type: 'brute',    idx: 3, baseHp: 150, speed: 6,  bounty: 9, leak: 3, air: 0, firstWave: 4, weight: 3  },
    { type: 'splitter', idx: 4, baseHp: 90,  speed: 8,  bounty: 6, leak: 2, air: 0, firstWave: 6, weight: 2  },
    { type: 'mender',   idx: 5, baseHp: 70,  speed: 8,  bounty: 7, leak: 2, air: 0, firstWave: 8, weight: 1  }
  ];
  const ENEMY_MAP = {};
  for (let i = 0; i < ENEMY_ORDER.length; i++) ENEMY_MAP[ENEMY_ORDER[i].type] = ENEMY_ORDER[i];

  const hpMults = [0, 1000];
  function getHpMult(w) {
    while (hpMults.length <= w) {
      hpMults.push(Math.floor(hpMults[hpMults.length - 1] * 108 / 100));
    }
    return hpMults[w];
  }

  function genWave(w) {

    let totalW = 0;
    const avail = [];
    for (let i = 0; i < ENEMY_ORDER.length; i++) {
      if (ENEMY_ORDER[i].firstWave <= w) {
        avail.push(ENEMY_ORDER[i]);
        totalW += ENEMY_ORDER[i].weight;
      }
    }
    const comp = [];
    for (let i = 0; i < count; i++) {
      let r = rng() % totalW;
      for (let j = 0; j < avail.length; j++) {
        if (r < avail[j].weight) {
          comp.push(avail[j].type);
          break;
        }
        r -= avail[j].weight;
      }
    }

  }

  const slots = SLOTS_COORDS.map((c, idx) => ({
    slot: idx,
    x: c[0] * 100 + 50,
    y: c[1] * 100 + 50,
    turret: null
  }));

  let gold = 250;
  let baseHp = 10;
  let currentWave = 0;
  let nextEnemyId = 1;
  let enemies = [];
  let spawnQueue = [];
  const log = [];
  let fallTick = -1;

  const strategy = createStrategy();
  let curWaveComp = genWave(1);
  let nextWaveComp = null;

  function makeEnemyView(e) {
    const routeLen = e.air ? AIR_PATH.len : GROUND_PATH.len;

  function spawnEnemy(type, wave, progressOverride, maxHpOverride) {
    const id = nextEnemyId++;

    if (type === 'splitling') {

    } else {

      maxHp = Math.floor(def.baseHp * getHpMult(wave) / 1000);
      speed = def.speed;

      id, type, typeIdx, wave, hp: maxHp, maxHp, speed, armor, bounty, leak, air,

  for (let tick = 0; tick < maxTicks; tick++) {

        tr.cd -= 1;

      }

      const cands = [];

        const candViews = cands.map(makeEnemyView);
        const tid = strategy.target(tView, candViews);
        for (let i = 0; i < cands.length; i++) {
          if (cands[i].id === tid) { chosen = cands[i]; break; }
        }
      }
      if (!chosen) {
        chosen = cands[0];
        let bestRem = (chosen.air ? AIR_PATH.len : GROUND_PATH.len) - chosen.progress;
        for (let i = 1; i < cands.length; i++) {
          const e = cands[i];
          const rem = (e.air ? AIR_PATH.len : GROUND_PATH.len) - e.progress;
          if (rem < bestRem) { bestRem = rem; chosen = e; }
        }
      }

      if (_rec && _rec.onShot) {
        _rec.onShot(tick, s, spec.idx, tr.tier, sl.x, sl.y, chosen.x, chosen.y, chosen.air, spec.splash);
      }

      if (spec.splash > 0) {
        const sp2 = spec.splash * spec.splash;
        const cx = chosen.x, cy = chosen.y;
        for (let i = 0; i < enemies.length; i++) {
          const e = enemies[i];
          if (e.air ? !spec.air : !spec.ground) continue;
          const dx = e.x - cx, dy = e.y - cy;
          if (dx * dx + dy * dy <= sp2) {
            const dmg = spec.pierce ? tr.dmg : Math.max(1, tr.dmg - e.armor);
            e.hp -= dmg;
            if (spec.slow > 0) e.slow = spec.slow;
          }
        }
      } else {
        const dmg = spec.pierce ? tr.dmg : Math.max(1, tr.dmg - chosen.armor);
        chosen.hp -= dmg;
        if (spec.slow > 0) chosen.slow = spec.slow;
      }
      tr.cd = spec.period;

      let anyDead = false;
      for (let i = 0; i < enemies.length; i++) {
        if (enemies[i].hp <= 0) { anyDead = true; break; }
      }
      if (anyDead) {
        const alive = [];
        const newSplitlings = [];
        for (let i = 0; i < enemies.length; i++) {
          const e = enemies[i];
          if (e.hp <= 0) {
            log.push([tick, 'K', e.id, s]);
            gold += e.bounty;
            if (_rec && _rec.onKill) _rec.onKill(tick, e.x, e.y, e.air, e.typeIdx, s);
            if (e.type === 'splitter') {
              const shp = Math.max(1, Math.floor(e.maxHp / 4));
              for (let k = 0; k < 3; k++) {
                newSplitlings.push({ wave: e.wave, progress: e.progress, maxHp: shp });
              }
            }
          } else {
            alive.push(e);
          }
        }
        enemies = alive;
        for (let i = 0; i < newSplitlings.length; i++) {
          const sp = newSplitlings[i];
          spawnEnemy('splitling', sp.wave, sp.progress, sp.maxHp);
        }
      }
    }

    for (let i = 0; i < enemies.length; i++) {
      if (enemies[i].slow > 0) enemies[i].slow -= 1;
    }

    if (_rec && _rec.onTick) {
      _rec.onTick(tick, currentWave, gold, baseHp, countComp(nextWaveComp || curWaveComp), slots, enemies);
    }
  }

  const endTick = fallTick >= 0 ? fallTick : maxTicks;
  const score = Math.round(((endTick - 20) / 40) * 100) / 100;
  const json = JSON.stringify(log);
  let h = 0x811c9dc5;
  for (let i = 0; i < json.length; i++) {
    h ^= json.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  const hash = (h >>> 0).toString(16).padStart(8, '0');
  return { score, fallTick, log, hash };
}

  // Compute mathematically exact camera distance so padded board + keep stays in view
  // at 16:9, 1280x650, etc. and completely clear of the bottom 90px dock!
  function updateCameraFraming() {
    const w = Math.max(1, window.innerWidth);
    const h = Math.max(1, window.innerHeight);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();

    // Padded board corners (at least 0.65 tile margin on all sides)
    const corners = [
      new THREE.Vector3(-0.7, 0.0, -0.7),
      new THREE.Vector3(24.7, 0.0, -0.7),
      new THREE.Vector3(-0.7, 0.0, 14.7),
      new THREE.Vector3(24.7, 0.0, 14.7),
      new THREE.Vector3(-0.7, 1.7, -0.7),
      new THREE.Vector3(24.7, 1.7, -0.7),
      new THREE.Vector3(-0.7, 1.7, 14.7),
      new THREE.Vector3(24.7, 1.7, 14.7)
    ];

    const dockNdcBottom = -1 + (2 * Math.min(h * 0.35, 98) / h);
    const topNdcLimit = 0.93;
    const sideNdcLimit = 0.95;

    // Shift look target slightly in +Z so board centers vertically in the safe zone above the dock
    const safeMidNdc = (dockNdcBottom + topNdcLimit) * 0.5;
    BASE_TARGET.set(12.0, 0.0, 7.0 + Math.max(0, safeMidNdc) * 7.5);

    const tmp = new THREE.Vector3();
    function fits(dist) {
      camera.position.copy(BASE_TARGET).addScaledVector(CAM_DIR, dist);
      camera.lookAt(BASE_TARGET);
      camera.updateMatrixWorld(true);
      for (let i = 0; i < corners.length; i++) {
        tmp.copy(corners[i]).project(camera);
        if (tmp.x < -sideNdcLimit || tmp.x > sideNdcLimit) return false;
        if (tmp.y < dockNdcBottom || tmp.y > topNdcLimit) return false;
      }
      return true;
    }

    let lo = 12, hi = 65;
    for (let it = 0; it < 22; it++) {
      const mid = (lo + hi) * 0.5;
      if (fits(mid)) hi = mid;
      else lo = mid;
    }
    baseCamPos.copy(BASE_TARGET).addScaledVector(CAM_DIR, hi);
    camera.position.copy(baseCamPos);
    camera.lookAt(BASE_TARGET);
    camera.updateMatrixWorld(true);
  }

  // =========================================================================

  function makeTerrainTexture() {
    const c = document.createElement('canvas');
    c.width = 512;
    c.height = 300;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#222830';
    ctx.fillRect(0, 0, c.width, c.height);
    const trng = makeRng(4201);
    for (let i = 0; i < 4200; i++) {
      const x = trng() * c.width;
      const y = trng() * c.height;
      const r = 1 + trng() * 5;
      const v = 26 + Math.floor(trng() * 22);
      const g = v + Math.floor(trng() * 6);
      const b = v + 5 + Math.floor(trng() * 8);
      ctx.fillStyle = 'rgba(' + v + ',' + g + ',' + b + ',0.35)';
      ctx.fillRect(x, y, r, r);
    }
    // Subtle tile grid lines
    ctx.strokeStyle = 'rgba(255,255,255,0.032)';
    ctx.lineWidth = 1;
    const sx = c.width / 24, sy = c.height / 14;
    for (let x = 0; x <= 24; x++) {
      ctx.beginPath(); ctx.moveTo(x * sx, 0); ctx.lineTo(x * sx, c.height); ctx.stroke();
    }
    for (let y = 0; y <= 14; y++) {
      ctx.beginPath(); ctx.moveTo(0, y * sy); ctx.lineTo(c.width, y * sy); ctx.stroke();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = 4;
    return tex;
  }

  function makeRoadTexture() {
    const c = document.createElement('canvas');
    c.width = 128;
    c.height = 128;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#333844';
    ctx.fillRect(0, 0, 128, 128);
    const rrng = makeRng(4202);
    for (let row = 0; row < 8; row++) {
      const y = row * 16;
      const off = (row % 2) * 16;
      for (let col = -1; col < 5; col++) {
        const x = col * 32 + off;
        const shade = 52 + Math.floor(rrng() * 20);
        ctx.fillStyle = 'rgb(' + shade + ',' + (shade + 4) + ',' + (shade + 12) + ')';
        ctx.fillRect(x + 2, y + 2, 28, 12);
      }
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  // Detached in-memory glyph atlas for crisp digits 0..9
  function makeDigitAtlas() {
    const c = document.createElement('canvas');
    c.width = 640;
    c.height = 96;
    const ctx = c.getContext('2d');
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.font = '700 72px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let d = 0; d < 10; d++) {
      const cx = d * 64 + 32;
      ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
      ctx.fillText(String(d), cx + 2, 52);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(String(d), cx, 49);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    return tex;
  }
  const digitAtlasTex = makeDigitAtlas();

  function createDigitSprite(colorHex) {
    const geo = new THREE.PlaneGeometry(1, 1);
    const mat = new THREE.MeshBasicMaterial({
      map: digitAtlasTex, color: colorHex, transparent: true, depthTest: false
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.visible = false;
    hudScene.add(mesh);
    return { mesh, uvAttr: geo.attributes.uv };
  }

  function setDigitChar(ds, digit, x, y, h) {
    const w = h * 0.62;
    const u0 = digit / 10, u1 = (digit + 1) / 10;
    const uv = ds.uvAttr;
    uv.setXY(0, u0, 1);
    uv.setXY(1, u1, 1);
    uv.setXY(2, u0, 0);
    uv.setXY(3, u1, 0);
    uv.needsUpdate = true;
    ds.mesh.position.set(x, y, 1);
    ds.mesh.scale.set(w, h, 1);
    ds.mesh.visible = true;
  }

  function renderNumber(pool, value, startX, centerY, digitH) {
    const str = String(Math.max(0, Math.floor(value)));
    const step = digitH * 0.56;
    for (let i = 0; i < pool.length; i++) {
      if (i < str.length) {
        setDigitChar(pool[i], str.charCodeAt(i) - 48, startX + i * step + step * 0.5, centerY, digitH);
      } else {
        pool[i].mesh.visible = false;
      }
    }
    return str.length * step;
  }

  function updateHud(simTime, snap) {
    const W = window.innerWidth;
    const H = window.innerHeight;
    hudCamera.right = W;
    hudCamera.top = H;
    hudCamera.updateProjectionMatrix();

    const marginX = Math.max(18, W * 0.018);
    const marginTop = Math.max(16, H * 0.022);

    // Wave number (>= 7.5% of viewport height!)
    const waveH = Math.max(46, H * 0.078);
    const waveY = H - marginTop - waveH * 0.5;
    const iconSize = waveH * 0.74;
    waveIconGroup.position.set(marginX + iconSize * 0.5, waveY, 1);
    waveIconGroup.scale.set(iconSize, iconSize, 1);
    renderNumber(waveDigits, snap.wave, marginX + iconSize + waveH * 0.16, waveY, waveH);

    // Gold below wave number
    const goldH = Math.max(24, H * 0.042);
    const goldY = waveY - waveH * 0.5 - goldH * 0.72;
    const coinS = goldH * 0.72;
    coinGroup.position.set(marginX + coinS * 0.55, goldY, 1);
    coinGroup.scale.set(coinS, coinS, 1);
    renderNumber(goldDigits, snap.gold, marginX + coinS + goldH * 0.25, goldY, goldH);

    // Next-wave preview row below gold
    const prevH = Math.max(17, H * 0.028);
    const prevY = goldY - goldH * 0.55 - prevH * 0.9;
    let curX = marginX + prevH * 0.45;
    const counts = snap.nextCounts;
    for (let i = 0; i < 6; i++) {
      const cnt = counts ? counts[i] : 0;
      if (cnt > 0) {
        previewIcons[i].visible = true;
        previewIcons[i].position.set(curX, prevY, 1);
        previewIcons[i].scale.set(prevH * 0.86, prevH * 0.86, 1);
        const nw = renderNumber(previewDigits[i], cnt, curX + prevH * 0.54, prevY, prevH * 0.92);
        curX += prevH * 0.54 + nw + prevH * 0.72;
      } else {
        previewIcons[i].visible = false;
        previewDigits[i][0].mesh.visible = false;
        previewDigits[i][1].mesh.visible = false;
      }
    }

    // Base HP: 10 pips in top-right corner
    const pipW = Math.max(14, Math.min(28, W * 0.015));
    const pipH = Math.max(22, Math.min(40, H * 0.036));
    const pipGap = Math.max(4, pipW * 0.26);
    const totalW = 10 * pipW + 9 * pipGap;
    const startX = W - marginX - totalW + pipW * 0.5;
    const pipY = H - marginTop - pipH * 0.55;
    const hp = snap.baseHp;

    for (let i = 0; i < 10; i++) {
      const p = hpPips[i];
      const px = startX + i * (pipW + pipGap);
      p.back.position.set(px, pipY, 0.5);
      p.back.scale.set(pipW + 3, pipH + 3, 1);
      p.fill.position.set(px, pipY, 1);

      const alive = i < hp;
      const lossT = chunkLossTime[9 - i]; // right-to-left extinguish as HP drops!
      const dtLoss = simTime - lossT;
      if (alive) {
        const col = hp <= 3 ? 0xff4d4d : hp <= 6 ? 0xffb833 : 0x45e680;
        p.fillMat.color.setHex(col);
        p.fill.scale.set(pipW - 2, pipH - 2, 1);
      } else if (dtLoss >= 0 && dtLoss < 0.35) {
        const flash = 1 - dtLoss / 0.35;
        p.fillMat.color.setRGB(1.0, 0.25 + 0.75 * flash, 0.25 + 0.75 * flash);
        const s = 1 + flash * 0.35;
        p.fill.scale.set((pipW - 2) * s, (pipH - 2) * s, 1);
      } else {
        p.fillMat.color.setHex(0x282d38);
        p.fill.scale.set(pipW - 4, pipH - 6, 1);
      }
    }
  }

  // =========================================================================
  // 9. SYNTHESIZED WEB AUDIO SFX ENGINE (SEED 4242, NO MUSIC, NO CLIPPING)
  // =========================================================================
  const audioRng = makeRng(4242);
  let audioCtx = null;
  let masterGain = null;
  let sfxBus = null;
  let noiseBuf = null;
  let activeNodes = [];
  let windNode = null;
  let windGain = null;
  let soundAllowed = false;
  let shotBudgetTokens = 12;
  let lastAudioWall = 0;

  function initAudio() {
    if (audioCtx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      audioCtx = new AC();
      const comp = audioCtx.createDynamicsCompressor();
      comp.threshold.value = -14;
      comp.knee.value = 18;
      comp.ratio.value = 8;
      comp.attack.value = 0.003;
      comp.release.value = 0.12;

      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.0001;

      sfxBus = audioCtx.createGain();
      sfxBus.gain.value = 0.65;

      sfxBus.connect(masterGain);
      masterGain.connect(comp);
      comp.connect(audioCtx.destination);

      // Seeded white noise buffer (2 seconds)
      const len = audioCtx.sampleRate * 2;
      noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = audioRng() * 2 - 1;

      audioCtx.resume().catch(function () {});
    } catch (e) {
      audioCtx = null;
    }
  }

  function resumeAudio() {
    if (!audioCtx) initAudio();
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(function () {});
    }
  }

  initAudio();
  window.addEventListener('pointerdown', resumeAudio, { passive: true });
  window.addEventListener('keydown', resumeAudio, { passive: true });

  function makePanner(boardX) {
    const pan = Math.max(-0.85, Math.min(0.85, (boardX / 24) * 2 - 1));
    if (audioCtx.createStereoPanner) {
      const p = audioCtx.createStereoPanner();
      p.pan.value = pan;
      p.connect(sfxBus);
      return p;
    }
    return sfxBus;
  }

  function trackNode(node, stopTime) {
    activeNodes.push(node);
    node.onended = function () {
      const idx = activeNodes.indexOf(node);
      if (idx >= 0) activeNodes.splice(idx, 1);
    };
    if (stopTime !== undefined) node.stop(stopTime);
  }

  function setAudioPlayState(isPlaying, afterFall) {
    soundAllowed = isPlaying;
    if (!audioCtx || !masterGain) return;
    const now = audioCtx.currentTime;
    masterGain.gain.cancelScheduledValues(now);
    masterGain.gain.setValueAtTime(Math.max(0.0001, masterGain.gain.value), now);
    if (isPlaying) {
      masterGain.gain.linearRampToValueAtTime(0.82, now + 0.035);
      if (afterFall) startWind();
      else stopWind();
    } else {
      masterGain.gain.linearRampToValueAtTime(0.0001, now + 0.04);
      stopAllOneShots();
      stopWind();
    }
  }

  function stopAllOneShots() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const copy = activeNodes.slice();
    activeNodes.length = 0;
    for (let i = 0; i < copy.length; i++) {
      try { copy[i].stop(now + 0.04); } catch (e) {}
    }
  }

  function startWind() {
    if (!audioCtx || !noiseBuf || windNode || !soundAllowed) return;
    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuf;
    src.loop = true;
    const flt = audioCtx.createBiquadFilter();
    flt.type = 'bandpass';
    flt.frequency.value = 180;
    flt.Q.value = 2.8;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(0.11, audioCtx.currentTime + 0.45);
    src.connect(flt);
    flt.connect(g);
    g.connect(sfxBus);
    src.start();
    windNode = src;
    windGain = g;
  }

  function stopWind() {
    if (!windNode || !audioCtx) return;
    const n = windNode, g = windGain;
    windNode = null;
    windGain = null;
    try {
      const now = audioCtx.currentTime;
      g.gain.cancelScheduledValues(now);
      g.gain.setValueAtTime(Math.max(0.0001, g.gain.value), now);
      g.gain.linearRampToValueAtTime(0.0001, now + 0.04);
      n.stop(now + 0.045);
    } catch (e) {}
  }

  function playShotSfx(typeIdx, boardX) {
    if (!audioCtx || !soundAllowed || audioCtx.state !== 'running') return;
    const now = audioCtx.currentTime;
    const out = makePanner(boardX);
    const jitter = 0.94 + audioRng() * 0.12;

    if (typeIdx === 3) {
      // Lance: crimson rail-beam crack
      const osc = audioCtx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(920 * jitter, now);
      osc.frequency.exponentialRampToValueAtTime(160 * jitter, now + 0.13);
      const flt = audioCtx.createBiquadFilter();
      flt.type = 'bandpass';
      flt.frequency.value = 1200;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.18, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
      osc.connect(flt); flt.connect(g); g.connect(out);
      osc.start(now);
      trackNode(osc, now + 0.145);
    } else if (typeIdx === 1) {
      // Cannon: deep mortar thump + boom
      const osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(135 * jitter, now);
      osc.frequency.exponentialRampToValueAtTime(38, now + 0.15);
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.22, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
      osc.connect(g); g.connect(out);
      osc.start(now);
      trackNode(osc, now + 0.17);

      const n = audioCtx.createBufferSource();
      n.buffer = noiseBuf;
      const flt = audioCtx.createBiquadFilter();
      flt.type = 'lowpass';
      flt.frequency.value = 420;
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(0.14, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      n.connect(flt); flt.connect(ng); ng.connect(out);
      n.start(now, audioRng() * 1.5, 0.13);
      trackNode(n);
    } else if (typeIdx === 4) {
      // Flak: snappy AA pop
      const n = audioCtx.createBufferSource();
      n.buffer = noiseBuf;
      const flt = audioCtx.createBiquadFilter();
      flt.type = 'bandpass';
      flt.frequency.value = 1850 * jitter;
      flt.Q.value = 2.2;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.15, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      n.connect(flt); flt.connect(g); g.connect(out);
      n.start(now, audioRng() * 1.5, 0.09);
      trackNode(n);
    } else if (typeIdx === 2) {
      // Frost: icy crystalline chime
      const osc = audioCtx.createOscillator();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(1550 * jitter, now);
      osc.frequency.exponentialRampToValueAtTime(980 * jitter, now + 0.09);
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.09, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.10);
      osc.connect(g); g.connect(out);
      osc.start(now);
      trackNode(osc, now + 0.105);
    } else {
      // Bolt: crisp metallic zip
      const osc = audioCtx.createOscillator();
      osc.type = 'square';
      osc.frequency.setValueAtTime(680 * jitter, now);
      osc.frequency.exponentialRampToValueAtTime(240 * jitter, now + 0.055);
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.075, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc.connect(g); g.connect(out);
      osc.start(now);
      trackNode(osc, now + 0.065);
    }
  }

  function playKillSfx(boardX) {
    if (!audioCtx || !soundAllowed || audioCtx.state !== 'running') return;
    const now = audioCtx.currentTime;
    const out = makePanner(boardX);
    const osc = audioCtx.createOscillator();
    osc.type = 'triangle';
    const f0 = 380 + audioRng() * 140;
    osc.frequency.setValueAtTime(f0, now);
    osc.frequency.exponentialRampToValueAtTime(140, now + 0.06);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.065, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.065);
    osc.connect(g); g.connect(out);
    osc.start(now);
    trackNode(osc, now + 0.07);
  }

  function playWaveHornSfx() {
    if (!audioCtx || !soundAllowed || audioCtx.state !== 'running') return;
    const now = audioCtx.currentTime;
    const out = makePanner(2);
    const osc = audioCtx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(146.8, now);
    osc.frequency.linearRampToValueAtTime(220.0, now + 0.28);
    const flt = audioCtx.createBiquadFilter();
    flt.type = 'lowpass';
    flt.frequency.setValueAtTime(520, now);
    flt.frequency.linearRampToValueAtTime(980, now + 0.28);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.001, now);
    g.gain.linearRampToValueAtTime(0.12, now + 0.08);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.44);
    osc.connect(flt); flt.connect(g); g.connect(out);
    osc.start(now);
    trackNode(osc, now + 0.46);
  }

  function playLeakSfx() {
    if (!audioCtx || !soundAllowed || audioCtx.state !== 'running') return;
    const now = audioCtx.currentTime;
    const out = makePanner(23.5);
    // Stone crack
    const n = audioCtx.createBufferSource();
    n.buffer = noiseBuf;
    const flt = audioCtx.createBiquadFilter();
    flt.type = 'bandpass';
    flt.frequency.value = 650;
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.28, now);
    ng.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
    n.connect(flt); flt.connect(ng); ng.connect(out);
    n.start(now, audioRng() * 1.4, 0.20);
    trackNode(n);
    // Alarm tone
    const osc = audioCtx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(520, now);
    osc.frequency.setValueAtTime(390, now + 0.10);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.14, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
    osc.connect(g); g.connect(out);
    osc.start(now);
    trackNode(osc, now + 0.25);
  }

  function playFallSfx() {
    if (!audioCtx || !soundAllowed || audioCtx.state !== 'running') return;
    const now = audioCtx.currentTime;
    const out = makePanner(23.5);
    // Deep collapse rumble
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(95, now);
    osc.frequency.exponentialRampToValueAtTime(24, now + 1.15);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.42, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 1.25);
    osc.connect(g); g.connect(out);
    osc.start(now);
    trackNode(osc, now + 1.28);

    const n = audioCtx.createBufferSource();
    n.buffer = noiseBuf;
    const flt = audioCtx.createBiquadFilter();
    flt.type = 'lowpass';
    flt.frequency.setValueAtTime(850, now);
    flt.frequency.exponentialRampToValueAtTime(140, now + 1.05);
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.36, now);
    ng.gain.exponentialRampToValueAtTime(0.001, now + 1.15);
    n.connect(flt); flt.connect(ng); ng.connect(out);
    n.start(now, 0.1, 1.2);
    trackNode(n);

    startWind();
  }

  // Trigger audio events strictly when forward PLAYING carries simTime across event ticks
  const SHOT_LOUDNESS = [0, 3, 1, 4, 2]; // lance(4) > cannon(3) > flak(2) > frost(1) > bolt(0)
  function triggerAudioSpan(prevT, curT, wallNow) {
    if (!soundAllowed || curT <= prevT) return;
    const dtWall = Math.min(0.1, Math.max(0, (wallNow - lastAudioWall) * 0.001));
    lastAudioWall = wallNow;
    shotBudgetTokens = Math.min(12, shotBudgetTokens + dtWall * 12);

    // Fall event
    if (replay.fallTick >= 0 && prevT < fallTime && curT >= fallTime) {
      playFallSfx();
      return;
    }
    if (curT >= fallTime) {
      startWind();
      return;
    }

    // Wave horns
    const [w0, w1] = findRange(replay.waves, prevT + 1e-6, curT);
    if (w1 > w0) playWaveHornSfx();

    // Leaks
    const [l0, l1] = findRange(replay.leaks, prevT + 1e-6, curT);
    for (let i = l0; i < Math.min(l1, l0 + 2); i++) playLeakSfx();

    // Kills (rate-limited subtly so bursts stay pleasant)
    const [k0, k1] = findRange(replay.kills, prevT + 1e-6, curT);
    if (k1 > k0) {
      const kCount = Math.min(2, k1 - k0);
      for (let i = 0; i < kCount; i++) playKillSfx(replay.kills[k0 + i].x);
    }

    // Shots (rate-limited to <= 12/sec, loudest turret types first!)
    const [s0, s1] = findRange(replay.shots, prevT + 1e-6, curT);
    if (s1 > s0 && shotBudgetTokens >= 1) {
      const cand = [];
      for (let i = s0; i < s1; i++) cand.push(replay.shots[i]);
      cand.sort((a, b) => SHOT_LOUDNESS[b.typeIdx] - SHOT_LOUDNESS[a.typeIdx]);
      for (let i = 0; i < cand.length && shotBudgetTokens >= 1; i++) {
        playShotSfx(cand[i].typeIdx, cand[i].sx);
        shotBudgetTokens -= 1;
      }
    }
  }

  // =========================================================================
  // 10. DETERMINISTIC SCENE RENDERER AT ANY simTime IN [0, 100]
  // =========================================================================
  const tmpColor = new THREE.Color();
  const tmpColor2 = new THREE.Color();
  const tmpVecA = new THREE.Vector3();
  const tmpVecB = new THREE.Vector3();
  const tmpQuat = new THREE.Quaternion();
  const zAxis = new THREE.Vector3(0, 0, 1);

  function desatColor(col, amount) {
    if (amount <= 0) return col;
    const luma = col.r * 0.299 + col.g * 0.587 + col.b * 0.114;
    const f = amount * 0.92;
    col.r = col.r + (luma - col.r) * f;
    col.g = col.g + (luma - col.g) * f;
    col.b = col.b + (luma - col.b) * f;
    return col;
  }

  function applySceneDesat(desat) {
    for (let i = 0; i < trackedMats.length; i++) {
      const m = trackedMats[i];
      if (m.userData.baseColor) {
        m.color.copy(m.userData.baseColor);
        desatColor(m.color, desat);
      }
      if (m.userData.baseEmissive) {
        m.emissive.copy(m.userData.baseEmissive);
        desatColor(m.emissive, desat);
      }
    }
    hemiLight.color.copy(baseHemiSky); desatColor(hemiLight.color, desat);
    hemiLight.groundColor.copy(baseHemiGnd); desatColor(hemiLight.groundColor, desat);
    keyLight.color.copy(baseKeyCol); desatColor(keyLight.color, desat);
    rimLight.color.copy(baseRimCol); desatColor(rimLight.color, desat);
  }

  function airLanePos(dist) {
    if (dist <= 21) return [0.5 + dist, 6.5, 0];
    if (dist <= 26) return [21.5, 6.5 + (dist - 21), -Math.PI / 2];
    return [21.5 + (dist - 26), 11.5, 0];
  }

  function renderAt(simTime) {
    const clampedT = Math.max(0, Math.min(DURATION, simTime));
    const fell = replay.fallTick >= 0 && clampedT >= fallTime;
    const effTime = fell ? fallTime : clampedT;
    const desat = fell ? Math.min(1, (clampedT - fallTime) / 1.0) : 0;

    applySceneDesat(desat);

    // Trauma camera shake (closed-form smooth seeded harmonics)
    const trauma = getTraumaAt(clampedT);
    const shakeMag = trauma * trauma * 0.25;
    const sx = shakeMag * (Math.sin(clampedT * 43.7 + 0.5) * 0.6 + Math.sin(clampedT * 71.3 + 2.1) * 0.4);
    const sy = shakeMag * (Math.sin(clampedT * 51.9 + 1.4) * 0.6 + Math.cos(clampedT * 83.1 + 0.8) * 0.4);
    const sz = shakeMag * (Math.cos(clampedT * 37.3 + 3.2) * 0.6 + Math.sin(clampedT * 64.7 + 1.7) * 0.4);
    camera.position.set(baseCamPos.x + sx, baseCamPos.y + sy, baseCamPos.z + sz);
    camera.lookAt(BASE_TARGET.x + sx * 0.35, BASE_TARGET.y, BASE_TARGET.z + sz * 0.35);
    camera.updateMatrixWorld(true);

    // Tick interpolation indices
    const tickFloat = effTime * TICKS_PER_SEC;
    const k = Math.min(lastRecordedTick, Math.max(0, Math.floor(tickFloat)));
    const k1 = Math.min(lastRecordedTick, k + 1);
    const alpha = fell ? 0 : (tickFloat - k);
    const snap0 = replay.ticks[k];
    const snap1 = replay.ticks[k1];

    // Animate air lane chevrons (frozen on fall)
    for (let i = 0; i < 14; i++) {
      const dist = ((i * 2.0 + effTime * 2.4) % 28);
      const ap = airLanePos(dist);
      dummy.position.set(ap[0], 0.84, ap[1]);
      dummy.rotation.set(0, ap[2], 0);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      airChevrons.setMatrixAt(i, dummy.matrix);
    }
    airChevrons.instanceMatrix.needsUpdate = true;

    // Update Keep state (leak red flash, crumbling chunks, collapse on fall)
    let leakFlash = 0;
    for (let i = replay.leaks.length - 1; i >= 0; i--) {
      const dtL = clampedT - replay.leaks[i].t;
      if (dtL >= 0 && dtL < 0.36) {
        leakFlash = Math.max(leakFlash, 1 - dtL / 0.36);
      } else if (dtL > 0.5) break;
    }
    if (leakFlash > 0 && !fell) {
      keepStoneMat.emissive.setRGB(leakFlash * 0.9, leakFlash * 0.08, leakFlash * 0.05);
    } else if (!fell) {
      keepStoneMat.emissive.setRGB(0, 0, 0);
    }

    keepCore.visible = !fell;
    coreBeacon.rotation.y = effTime * 2.2;
    keepGlowLight.intensity = fell ? Math.max(0, 3.2 * (1 - (clampedT - fallTime) * 1.4)) : (1.15 + Math.sin(effTime * 4.5) * 0.25 + leakFlash * 2.0);

    for (let i = 0; i < 10; i++) {
      const ch = keepChunks[i];
      const lostT = chunkLossTime[i];
      if (fell) {
        ch.mesh.visible = false;
      } else if (clampedT < lostT) {
        ch.mesh.visible = true;
        ch.mesh.position.set(ch.ox, ch.oy, ch.oz);
        ch.mesh.rotation.set(0, 0, 0);
        ch.mesh.scale.set(1, 1, 1);
      } else {
        const dtC = clampedT - lostT;
        if (dtC < 0.85) {
          ch.mesh.visible = true;
          const y = Math.max(0.12, ch.oy + ch.vy * dtC - 6.5 * dtC * dtC);
          const tMove = y <= 0.12 ? Math.min(dtC, 0.55) : dtC;
          ch.mesh.position.set(ch.ox + ch.vx * tMove * 0.55, y, ch.oz + ch.vz * tMove * 0.55);
          ch.mesh.rotation.set(ch.rx * tMove, 0, ch.rz * tMove);
          const sc = Math.max(0.01, 1 - dtC / 0.9);
          ch.mesh.scale.set(sc, sc, sc);
        } else {
          ch.mesh.visible = false;
        }
      }
    }

    // Fall collapse debris + shockwave ring
    if (fell) {
      const dtF = clampedT - fallTime;
      const ringT = Math.min(1, dtF / 1.15);
      fallRingMesh.visible = dtF < 1.25;
      if (fallRingMesh.visible) {
        const rad = 0.8 + ringT * 6.8;
        fallRingMesh.scale.set(rad, 1, rad);
        fallRingMat.opacity = Math.max(0, (1 - ringT) * 0.85);
      }
      let fCount = 0;
      for (let i = 0; i < FALL_DEBRIS_N; i++) {
        const d = fallDebrisData[i];
        const tSim = Math.min(dtF, 1.35);
        let py = d.oy + d.vy * tSim - 6.2 * tSim * tSim;
        let tH = tSim;
        if (py < 0.10) {
          py = 0.10;
          tH = Math.min(tSim, (d.vy + Math.sqrt(d.vy * d.vy + 24.8 * (d.oy - 0.10))) / 12.4);
        }
        dummy.position.set(d.ox + d.vx * tH * 0.55, py, d.oz + d.vz * tH * 0.55);
        dummy.rotation.set(d.rx * tH, d.ry * tH, 0);
        dummy.scale.set(d.s, d.s, d.s);
        dummy.updateMatrix();
        fallDebrisInst.setMatrixAt(fCount, dummy.matrix);
        tmpColor.copy(d.col);
        desatColor(tmpColor, desat);
        fallDebrisInst.setColorAt(fCount, tmpColor);
        fCount++;
      }
      fallDebrisInst.count = fCount;
      fallDebrisInst.instanceMatrix.needsUpdate = true;
      if (fallDebrisInst.instanceColor) fallDebrisInst.instanceColor.needsUpdate = true;
    } else {
      fallRingMesh.visible = false;
      fallDebrisInst.count = 0;
    }

    // Update Turrets (16 slots, type, tier pips, aim toward latest shot, build pop)
    for (let s = 0; s < 16; s++) {
      const code = snap0.turrets[s];
      const byType = slotTurretModels[s];
      const activeType = code > 0 ? Math.floor(code / 4) : -1;
      const tier = code > 0 ? (code % 4) : 0;

      // Find latest shot for aiming
      let aimYaw = 0;
      const shList = slotShots[s];
      if (activeType >= 0 && shList.length > 0) {
        let lo = 0, hi = shList.length - 1, idx = -1;
        while (lo <= hi) {
          const mid = (lo + hi) >> 1;
          if (shList[mid].t <= effTime) { idx = mid; lo = mid + 1; }
          else hi = mid - 1;
        }
        if (idx >= 0) {
          const sh = shList[idx];
          aimYaw = Math.atan2(sh.tx - sh.sx, sh.tz - sh.sz);
        }
      }

      for (let t = 0; t < 5; t++) {
        const m = byType[t];
        if (t === activeType) {
          m.root.visible = true;
          const tierScale = 0.92 + tier * 0.08;
          m.root.scale.set(tierScale, tierScale, tierScale);
          if (t === 2) m.head.rotation.y = effTime * 1.4;
          else m.head.rotation.y = aimYaw;
          for (let p = 0; p < 3; p++) m.pips[p].visible = p < tier;
        } else {
          m.root.visible = false;
        }
      }
    }

    // Update Instanced Enemies (interpolated between tick k and k+1)
    const eCounts = [0, 0, 0, 0, 0, 0, 0];
    let brutePCount = 0, menderHCount = 0, wispSCount = 0, hpBarCount = 0;
    const camQuat = camera.quaternion;

    for (let i = 0; i < snap0.n; i++) {
      const id = snap0.eIds[i];
      const tIdx = snap0.eType[i];
      if (eCounts[tIdx] >= MAX_ENEMIES_PER_TYPE) continue;

      let ex = snap0.eX[i], ez = snap0.eZ[i], hpFrac = snap0.eHpFrac[i], yaw = snap0.eYaw[i];
      const flags = snap0.eFlags[i];
      const slowed = (flags & 1) !== 0;
      const isAir = (flags & 2) !== 0;

      const idx1 = snap1.idMap.get(id);
      if (idx1 !== undefined && alpha > 0) {
        ex = ex + (snap1.eX[idx1] - ex) * alpha;
        ez = ez + (snap1.eZ[idx1] - ez) * alpha;
        hpFrac = hpFrac + (snap1.eHpFrac[idx1] - hpFrac) * alpha;
        let dyaw = snap1.eYaw[idx1] - yaw;
        while (dyaw > Math.PI) dyaw -= Math.PI * 2;
        while (dyaw < -Math.PI) dyaw += Math.PI * 2;
        yaw += dyaw * alpha;
      }

      const bob = isAir ? Math.sin(effTime * 6 + id) * 0.06 : Math.abs(Math.sin(effTime * 10 + id)) * 0.04;
      const baseH = tIdx === 2 ? 0.85 : tIdx === 3 ? 0.36 : tIdx === 5 ? 0.33 : tIdx === 6 ? 0.16 : 0.26;
      const ey = baseH + bob;

      dummy.position.set(ex, ey, ez);
      dummy.rotation.set(0, yaw, 0);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();

      const inst = enemyInsts[tIdx];
      const slotI = eCounts[tIdx]++;
      inst.setMatrixAt(slotI, dummy.matrix);
      tmpColor.copy(ENEMY_BASE_COLORS[tIdx]);
      if (slowed) tmpColor.lerp(FROST_TINT, 0.58);
      desatColor(tmpColor, desat);
      inst.setColorAt(slotI, tmpColor);

      // Extra silhouette parts: brute orange plates, mender green halo, wisp shadow
      if (tIdx === 3 && brutePCount < 120) {
        dummy.position.set(ex, ey + 0.14, ez);
        dummy.rotation.set(0, yaw, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        brutePlateInst.setMatrixAt(brutePCount, dummy.matrix);
        tmpColor.setHex(0xff7b24);
        if (slowed) tmpColor.lerp(FROST_TINT, 0.45);
        desatColor(tmpColor, desat);
        brutePlateInst.setColorAt(brutePCount, tmpColor);
        brutePCount++;
      } else if (tIdx === 5 && menderHCount < 80) {
        dummy.position.set(ex, ey + 0.36, ez);
        dummy.rotation.set(0, effTime * 2.5, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        menderHaloInst.setMatrixAt(menderHCount++, dummy.matrix);
      } else if (tIdx === 2 && wispSCount < 120) {
        dummy.position.set(ex, 0.04, ez);
        dummy.rotation.set(0, 0, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        wispShadInst.setMatrixAt(wispSCount++, dummy.matrix);
      }

      // Enemy health bar (billboarded toward camera)
      if (hpBarCount < MAX_TOTAL_ENEMIES) {
        const barY = ey + (tIdx === 3 ? 0.56 : tIdx === 2 ? 0.46 : 0.44);
        dummy.position.set(ex, barY, ez);
        dummy.quaternion.copy(camQuat);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        hpBgInst.setMatrixAt(hpBarCount, dummy.matrix);

        // Shift left-aligned fill bar along camera local -X by 0.25
        tmpVecA.set(-0.25, 0, 0.005).applyQuaternion(camQuat);
        dummy.position.set(ex + tmpVecA.x, barY + tmpVecA.y, ez + tmpVecA.z);
        dummy.quaternion.copy(camQuat);
        dummy.scale.set(Math.max(0.02, hpFrac), 1, 1);
        dummy.updateMatrix();
        hpFgInst.setMatrixAt(hpBarCount, dummy.matrix);
        if (hpFrac > 0.5) tmpColor.setRGB((1 - hpFrac) * 2 * 0.95 + 0.15, 0.92, 0.30);
        else tmpColor.setRGB(0.96, hpFrac * 2 * 0.82 + 0.10, 0.16);
        desatColor(tmpColor, desat);
        hpFgInst.setColorAt(hpBarCount, tmpColor);
        hpBarCount++;
      }
    }

    for (let t = 0; t < 7; t++) {
      enemyInsts[t].count = eCounts[t];
      enemyInsts[t].instanceMatrix.needsUpdate = true;
      if (enemyInsts[t].instanceColor) enemyInsts[t].instanceColor.needsUpdate = true;
    }
    brutePlateInst.count = brutePCount;
    brutePlateInst.instanceMatrix.needsUpdate = true;
    if (brutePlateInst.instanceColor) brutePlateInst.instanceColor.needsUpdate = true;
    menderHaloInst.count = menderHCount;
    menderHaloInst.instanceMatrix.needsUpdate = true;
    wispShadInst.count = wispSCount;
    wispShadInst.instanceMatrix.needsUpdate = true;
    hpBgInst.count = hpBarCount;
    hpBgInst.instanceMatrix.needsUpdate = true;
    hpFgInst.count = hpBarCount;
    hpFgInst.instanceMatrix.needsUpdate = true;
    if (hpFgInst.instanceColor) hpFgInst.instanceColor.needsUpdate = true;

    // =========================================================================
    // Combat VFX: Shots (<= 0.14s), Splash Rings, Heals, Kills, Build/Upgrade/Sell
    // =========================================================================
    let beamCount = 0, orbCount = 0, ringCount = 0, partCount = 0;

    // 1. Shots (max duration 0.14s <= 0.15s)
    const [sStart, sEnd] = findRange(replay.shots, effTime - 0.14, effTime);
    for (let i = sStart; i < sEnd; i++) {
      const sh = replay.shots[i];
      const dtS = effTime - sh.t;
      const u = dtS / 0.14;
      const sy = 0.65;
      const ty = sh.tAir ? 0.85 : 0.30;

      if (sh.typeIdx === 1) {
        // Cannon: arcing shell for first half, splash burst ring (radius 0.90) for second half!
        if (u < 0.55 && orbCount < MAX_ORBS) {
          const p = u / 0.55;
          const px = sh.sx + (sh.tx - sh.sx) * p;
          const pz = sh.sz + (sh.tz - sh.sz) * p;
          const py = sy + (ty - sy) * p + 4 * p * (1 - p) * 0.95;
          dummy.position.set(px, py, pz);
          dummy.rotation.set(0, 0, 0);
          dummy.scale.set(0.95, 0.95, 0.95);
          dummy.updateMatrix();
          orbInst.setMatrixAt(orbCount, dummy.matrix);
          tmpColor.setHex(0xffb84d); desatColor(tmpColor, desat);
          orbInst.setColorAt(orbCount, tmpColor);
          orbCount++;
        }
        if (u >= 0.38 && ringCount < MAX_RINGS) {
          const p = (u - 0.38) / 0.62;
          const rad = Math.max(0.12, sh.splash * (0.25 + 0.75 * p));
          dummy.position.set(sh.tx, 0.14, sh.tz);
          dummy.rotation.set(0, 0, 0);
          dummy.scale.set(rad, 1, rad);
          dummy.updateMatrix();
          ringInst.setMatrixAt(ringCount, dummy.matrix);
          tmpColor.setRGB(1.0, 0.58 * (1 - p * 0.4), 0.16); desatColor(tmpColor, desat);
          ringInst.setColorAt(ringCount, tmpColor);
          ringCount++;
        }
      } else if (sh.typeIdx === 4) {
        // Flak: tracer + teal burst ring in the air (radius 0.70 at Y = 0.85)
        if (u < 0.45 && beamCount < MAX_BEAMS) {
          tmpVecA.set(sh.sx, sy, sh.sz);
          tmpVecB.set(sh.tx, ty, sh.tz).sub(tmpVecA);
          const dist = tmpVecB.length();
          if (dist > 0.01) {
            tmpQuat.setFromUnitVectors(zAxis, tmpVecB.normalize());
            dummy.position.copy(tmpVecA);
            dummy.quaternion.copy(tmpQuat);
            dummy.scale.set(0.032, 0.032, dist);
            dummy.updateMatrix();
            beamInst.setMatrixAt(beamCount, dummy.matrix);
            tmpColor.setHex(0x45f2dc); desatColor(tmpColor, desat);
            beamInst.setColorAt(beamCount, tmpColor);
            beamCount++;
          }
        }
        if (ringCount < MAX_RINGS) {
          const rad = Math.max(0.14, sh.splash * (0.3 + 0.7 * u));
          dummy.position.set(sh.tx, 0.85, sh.tz);
          dummy.rotation.set(0, 0, 0);
          dummy.scale.set(rad, 1, rad);
          dummy.updateMatrix();
          ringInst.setMatrixAt(ringCount, dummy.matrix);
          tmpColor.setHex(0x28edd6); desatColor(tmpColor, desat);
          ringInst.setColorAt(ringCount, tmpColor);
          ringCount++;
        }
      } else {
        // Bolt (thin steel-blue tracer), Frost (pale ice beam), Lance (thick crimson beam + flash)
        if (beamCount < MAX_BEAMS) {
          tmpVecA.set(sh.sx, sy, sh.sz);
          tmpVecB.set(sh.tx, ty, sh.tz).sub(tmpVecA);
          const dist = tmpVecB.length();
          if (dist > 0.01) {
            tmpQuat.setFromUnitVectors(zAxis, tmpVecB.normalize());
            const r = (sh.typeIdx === 3 ? 0.095 : sh.typeIdx === 2 ? 0.052 : 0.032) * (1 - u * 0.55);
            dummy.position.copy(tmpVecA);
            dummy.quaternion.copy(tmpQuat);
            dummy.scale.set(r, r, dist);
            dummy.updateMatrix();
            beamInst.setMatrixAt(beamCount, dummy.matrix);
            tmpColor.setHex(sh.typeIdx === 3 ? 0xff2b4c : sh.typeIdx === 2 ? 0xc2f6ff : 0x7cb8ff);
            desatColor(tmpColor, desat);
            beamInst.setColorAt(beamCount, tmpColor);
            beamCount++;
          }
        }
        if (sh.typeIdx === 3 && orbCount < MAX_ORBS) {
          const fl = Math.max(0.1, (1 - u) * 1.9);
          dummy.position.set(sh.tx, ty, sh.tz);
          dummy.rotation.set(0, 0, 0);
          dummy.scale.set(fl, fl, fl);
          dummy.updateMatrix();
          orbInst.setMatrixAt(orbCount, dummy.matrix);
          tmpColor.setHex(0xff6b82); desatColor(tmpColor, desat);
          orbInst.setColorAt(orbCount, tmpColor);
          orbCount++;
        }
      }
    }

    // 2. Mender heal rings (exact radius 1.50 tiles)
    const [hStart, hEnd] = findRange(replay.heals, effTime - 0.45, effTime);
    for (let i = hStart; i < hEnd && ringCount < MAX_RINGS; i++) {
      const hl = replay.heals[i];
      const u = (effTime - hl.t) / 0.45;
      const rad = 0.25 + u * 1.25;
      dummy.position.set(hl.x, 0.16, hl.z);
      dummy.rotation.set(0, 0, 0);
      dummy.scale.set(rad, 1, rad);
      dummy.updateMatrix();
      ringInst.setMatrixAt(ringCount, dummy.matrix);
      tmpColor.setHex(0x4dff88); desatColor(tmpColor, desat);
      ringInst.setColorAt(ringCount, tmpColor);
      ringCount++;
    }

    // 3. Kill debris (seeded ballistic, closed-form in dt since kill) + splitter burst ring
    const [kStart, kEnd] = findRange(replay.kills, effTime - 0.55, effTime);
    for (let i = kStart; i < kEnd; i++) {
      const kl = replay.kills[i];
      const dtK = effTime - kl.t;
      const u = dtK / 0.55;
      if (kl.typeIdx === 4 && u < 0.45 && ringCount < MAX_RINGS) {
        const rad = 0.2 + (u / 0.45) * 0.75;
        dummy.position.set(kl.x, 0.22, kl.z);
        dummy.rotation.set(0, 0, 0);
        dummy.scale.set(rad, 1, rad);
        dummy.updateMatrix();
        ringInst.setMatrixAt(ringCount, dummy.matrix);
        tmpColor.setHex(0xc978ff); desatColor(tmpColor, desat);
        ringInst.setColorAt(ringCount, tmpColor);
        ringCount++;
      }
      const pN = kl.typeIdx === 3 ? 6 : 4;
      const baseY = kl.air ? 0.85 : 0.28;
      for (let p = 0; p < pN && partCount < MAX_PARTICLES; p++) {
        // Deterministic hash per (killIndex, particleIndex)
        const h1 = Math.sin((i * 73.1 + p * 19.7) * 12.9898) * 43758.5453;
        const f1 = h1 - Math.floor(h1);
        const h2 = Math.sin((i * 37.3 + p * 41.3) * 78.233) * 24634.6345;
        const f2 = h2 - Math.floor(h2);
        const ang = f1 * Math.PI * 2;
        const spd = 1.0 + f2 * 2.1;
        const vy = 2.0 + f1 * 2.4;
        const px = kl.x + Math.cos(ang) * spd * dtK;
        const pz = kl.z + Math.sin(ang) * spd * dtK;
        const py = Math.max(0.07, baseY + vy * dtK - 6.0 * dtK * dtK);
        const sc = Math.max(0.01, (1 - u) * (kl.typeIdx === 3 ? 1.35 : 0.95));
        dummy.position.set(px, py, pz);
        dummy.rotation.set(dtK * 8 * f1, dtK * 9 * f2, 0);
        dummy.scale.set(sc, sc, sc);
        dummy.updateMatrix();
        partInst.setMatrixAt(partCount, dummy.matrix);
        tmpColor.copy(ENEMY_BASE_COLORS[kl.typeIdx]);
        if (kl.typeIdx === 3 && p % 2 === 0) tmpColor.setHex(0xff7b24);
        desatColor(tmpColor, desat);
        partInst.setColorAt(partCount, tmpColor);
        partCount++;
      }
    }

    // 4. Build sparkles, upgrade ring pulses, and sell rubble
    const [aStart, aEnd] = findRange(replay.actions, effTime - 0.55, effTime);
    for (let i = aStart; i < aEnd; i++) {
      const act = replay.actions[i];
      const dtA = effTime - act.t;
      const u = dtA / 0.55;
      const sx = SLOTS_TILE[act.slot][0] + 0.5;
      const sz = SLOTS_TILE[act.slot][1] + 0.5;
      if (act.op === 'U' && ringCount < MAX_RINGS) {
        const rad = 0.35 + u * 0.85;
        dummy.position.set(sx, 0.25 + u * 0.45, sz);
        dummy.rotation.set(0, 0, 0);
        dummy.scale.set(rad, 1, rad);
        dummy.updateMatrix();
        ringInst.setMatrixAt(ringCount, dummy.matrix);
        tmpColor.setHex(0xffdc5e); desatColor(tmpColor, desat);
        ringInst.setColorAt(ringCount, tmpColor);
        ringCount++;
      } else if (act.op === 'B') {
        for (let p = 0; p < 7 && partCount < MAX_PARTICLES; p++) {
          const ang = (p / 7) * Math.PI * 2 + dtA * 3.5;
          const r = 0.35 * (1 - u * 0.4);
          const sc = Math.max(0.01, (1 - u) * 0.85);
          dummy.position.set(sx + Math.cos(ang) * r, 0.22 + u * 1.15 + (p % 3) * 0.12, sz + Math.sin(ang) * r);
          dummy.rotation.set(dtA * 6, ang, 0);
          dummy.scale.set(sc, sc, sc);
          dummy.updateMatrix();
          partInst.setMatrixAt(partCount, dummy.matrix);
          tmpColor.setHex(0xffe066); desatColor(tmpColor, desat);
          partInst.setColorAt(partCount, tmpColor);
          partCount++;
        }
      } else if (act.op === 'S') {
        for (let p = 0; p < 7 && partCount < MAX_PARTICLES; p++) {
          const ang = (p / 7) * Math.PI * 2 + 0.4;
          const spd = 1.2 + (p % 3) * 0.4;
          const py = Math.max(0.08, 0.55 + 1.4 * dtA - 5.8 * dtA * dtA);
          const sc = Math.max(0.01, (1 - u) * 1.1);
          dummy.position.set(sx + Math.cos(ang) * spd * dtA, py, sz + Math.sin(ang) * spd * dtA);
          dummy.rotation.set(dtA * 7, dtA * 5, 0);
          dummy.scale.set(sc, sc, sc);
          dummy.updateMatrix();
          partInst.setMatrixAt(partCount, dummy.matrix);
          tmpColor.setHex(0x6c7585); desatColor(tmpColor, desat);
          partInst.setColorAt(partCount, tmpColor);
          partCount++;
        }
      }
    }

    beamInst.count = beamCount;
    beamInst.instanceMatrix.needsUpdate = true;
    if (beamInst.instanceColor) beamInst.instanceColor.needsUpdate = true;
    orbInst.count = orbCount;
    orbInst.instanceMatrix.needsUpdate = true;
    if (orbInst.instanceColor) orbInst.instanceColor.needsUpdate = true;
    ringInst.count = ringCount;
    ringInst.instanceMatrix.needsUpdate = true;
    if (ringInst.instanceColor) ringInst.instanceColor.needsUpdate = true;
    partInst.count = partCount;
    partInst.instanceMatrix.needsUpdate = true;
    if (partInst.instanceColor) partInst.instanceColor.needsUpdate = true;

    // Update WebGL HUD
    updateHud(clampedT, snap0);

    // Final 2-pass WebGL render (3D board + orthographic HUD)
    renderer.clear();
    renderer.render(scene, camera);
    renderer.clearDepth();
    renderer.render(hudScene, hudCamera);
  }

  // =========================================================================
  // 11. EXACT 5-STATE PLAYBACK MACHINE & CANONICAL DOCK CONTROLS
  // =========================================================================
  const elCountdown = document.getElementById('countdown');
  const btnRefire = document.getElementById('btn-refire');
  const btnToggle = document.getElementById('btn-toggle');
  const iconPause = document.getElementById('icon-pause');
  const iconPlay = document.getElementById('icon-play');
  const speedPills = Array.from(document.querySelectorAll('.speed-pill'));
  const scrubber = document.getElementById('scrubber');

  let state = 'COUNTDOWN';
  let simTime = 0;
  let playbackSpeed = 1.0;
  let countdownElapsed = 0;
  let holdElapsed = 0;
  let countdownStarted = false;
  let lastFrameWall = null;

  function setToggleIcon(showPause) {
    if (showPause) {
      iconPause.style.display = '';
      iconPlay.style.display = 'none';
      btnToggle.setAttribute('aria-label', 'Pause');
    } else {
      iconPause.style.display = 'none';
      iconPlay.style.display = '';
      btnToggle.setAttribute('aria-label', 'Play');
    }
  }

  function hideCountdown() {
    elCountdown.style.display = 'none';
    elCountdown.textContent = '';
  }

  btnToggle.addEventListener('click', function () {
    resumeAudio();
    if (state === 'PLAYING') {
      state = 'PAUSED';
      setToggleIcon(false);
      setAudioPlayState(false, false);
    } else if (state === 'COUNTDOWN' || state === 'REFIRE_HOLD') {
      hideCountdown();
      simTime = 0;
      scrubber.value = '0';
      state = 'PAUSED';
      setToggleIcon(false);
      setAudioPlayState(false, false);
      renderAt(0);
    } else if (state === 'PAUSED') {
      state = 'PLAYING';
      setToggleIcon(true);
      lastAudioWall = performance.now();
      setAudioPlayState(true, replay.fallTick >= 0 && simTime >= fallTime);
    } else if (state === 'ENDED') {
      hideCountdown();
      simTime = 0;
      scrubber.value = '0';
      state = 'PLAYING';
      setToggleIcon(true);
      lastAudioWall = performance.now();
      setAudioPlayState(true, false);
      renderAt(0);
    }
  });

  for (let i = 0; i < speedPills.length; i++) {
    speedPills[i].addEventListener('click', function () {
      const sp = parseFloat(this.getAttribute('data-speed'));
      if (!isNaN(sp)) playbackSpeed = sp;
      for (let j = 0; j < speedPills.length; j++) {
        const active = speedPills[j] === this;
        speedPills[j].classList.toggle('is-active', active);
        speedPills[j].setAttribute('aria-checked', active ? 'true' : 'false');
      }
    });
  }

  scrubber.addEventListener('input', function () {
    if (state === 'COUNTDOWN' || state === 'REFIRE_HOLD') {
      hideCountdown();
    }
    simTime = Math.max(0, Math.min(DURATION, parseFloat(scrubber.value) || 0));
    state = 'PAUSED';
    setToggleIcon(false);
    setAudioPlayState(false, false);
    renderAt(simTime);
  });

  btnRefire.addEventListener('click', function () {
    resumeAudio();
    hideCountdown();
    simTime = 0;
    scrubber.value = '0';
    holdElapsed = 0;
    state = 'REFIRE_HOLD';
    setToggleIcon(true);
    setAudioPlayState(false, false);
    renderAt(0);
  });

  window.addEventListener('resize', function () {
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    updateCameraFraming();
    renderAt(simTime);
  });

  // Initial framing + resting frame render BEFORE countdown starts
  updateCameraFraming();
  elCountdown.style.display = 'block';
  elCountdown.textContent = '3';
  scrubber.value = '0';
  setToggleIcon(true);
  renderAt(0);

  function frameLoop(now) {
    requestAnimationFrame(frameLoop);
    if (lastFrameWall === null) {
      lastFrameWall = now;
      if (!countdownStarted && state === 'COUNTDOWN') {
        countdownStarted = true;
        countdownElapsed = 0;
      }
      return;
    }
    const rawDt = Math.max(0, (now - lastFrameWall) * 0.001);
    const dt = Math.min(rawDt, 0.1);
    lastFrameWall = now;

    if (state === 'COUNTDOWN') {
      countdownElapsed += dt;
      if (countdownElapsed < 1.0) {
        elCountdown.style.display = 'block';
        elCountdown.textContent = '3';
      } else if (countdownElapsed < 2.0) {
        elCountdown.style.display = 'block';
        elCountdown.textContent = '2';
      } else if (countdownElapsed < 3.0) {
        elCountdown.style.display = 'block';
        elCountdown.textContent = '1';
      } else {
        hideCountdown();
        state = 'PLAYING';
        lastAudioWall = now;
        setAudioPlayState(true, false);
        const over = countdownElapsed - 3.0;
        const prevT = simTime;
        simTime = Math.min(DURATION, simTime + over * playbackSpeed);
        scrubber.value = simTime.toFixed(3);
        triggerAudioSpan(prevT, simTime, now);
        renderAt(simTime);
        return;
      }
      simTime = 0;
      scrubber.value = '0';
      renderAt(0);
    } else if (state === 'REFIRE_HOLD') {
      holdElapsed += dt;
      if (holdElapsed >= 1.0) {
        state = 'PLAYING';
        lastAudioWall = now;
        setAudioPlayState(true, false);
      }
      renderAt(0);
    } else if (state === 'PLAYING') {
      const prevT = simTime;
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      scrubber.value = simTime.toFixed(3);
      triggerAudioSpan(prevT, simTime, now);
      renderAt(simTime);
      if (simTime >= DURATION) {
        simTime = DURATION;
        scrubber.value = DURATION.toFixed(3);
        state = 'ENDED';
        setToggleIcon(false);
        setAudioPlayState(false, false);
        renderAt(DURATION);
      }
    }
  }

  requestAnimationFrame(frameLoop);
})();
</script>
</body>
</html>
