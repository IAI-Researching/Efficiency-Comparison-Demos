  const MAX_DEBRIS = 600;
  const debrisGeo = new THREE.BoxGeometry(0.13, 0.13, 0.13);
  const debrisMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.65, metalness: 0.25 });
  const debrisInst = new THREE.InstancedMesh(debrisGeo, debrisMat, MAX_DEBRIS);
  debrisInst.count = 0;
  debrisInst.frustumCulled = false;
  primeInstColor(debrisInst);
  scene.add(debrisInst);

  // Precomputed fall citadel debris table (deterministic seeded)
  const fallDebris = [];
  for (let i = 0; i < 44; i++) {
    const a = visRng() * Math.PI * 2;
    const spd = 1.6 + visRng() * 4.8;
    fallDebris.push({
      ox: (visRng() - 0.5) * 0.9,
      oy: 0.3 + visRng() * 1.3,
      oz: (visRng() - 0.5) * 0.9,
      vx: Math.cos(a) * spd,
      vy: 3.2 + visRng() * 4.4,
      vz: Math.sin(a) * spd,
      rx: (visRng() - 0.5) * 12,
      ry: (visRng() - 0.5) * 12,
      sc: 0.9 + visRng() * 1.4,
      col: i % 5 === 0 ? 0xff9e3c : (i % 2 === 0 ? 0x7b8394 : 0x454c5c)
    });
  }

  // =========================================================================
  // 7. WORLD-ANCHORED WORDLESS HUD (ORTHOGRAPHIC WEBGL PASS, ZERO DOM TEXT)
  // =========================================================================
  const hudScene = new THREE.Scene();
  const hudCam = new THREE.OrthographicCamera(0, window.innerWidth, window.innerHeight, 0, -10, 10);

  // Build crisp digit glyph atlas (0..9) on a detached in-memory canvas
  function createDigitAtlas() {
    const cellW = 96, cellH = 128;
    const c = document.createElement("canvas");
    c.width = cellW * 10;
    c.height = cellH;
    const ctx = c.getContext("2d");
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.font = "700 94px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (let d = 0; d < 10; d++) {
      const cx = d * cellW + cellW * 0.5;
      const cy = cellH * 0.54;
      // Subtle dark drop-shadow for readability on any background
      ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
      ctx.fillText(String(d), cx + 3, cy + 4);
      ctx.fillStyle = "#ffffff";
      ctx.fillText(String(d), cx, cy);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    return tex;
  }
  const digitAtlasTex = createDigitAtlas();

  // Pre-create 10 PlaneGeometries with UV slices for digits 0..9
  const digitGeos = [];
  for (let d = 0; d < 10; d++) {
    const g = new THREE.PlaneGeometry(0.75, 1.0);
    const uv = g.attributes.uv;
    const u0 = d / 10, u1 = (d + 1) / 10;
    uv.setXY(0, u0, 1);
    uv.setXY(1, u1, 1);
    uv.setXY(2, u0, 0);
    uv.setXY(3, u1, 0);
    uv.needsUpdate = true;
    digitGeos.push(g);
  }

  function makeHudNumber(maxDigits, colorHex) {
    const group = new THREE.Group();
    const mat = new THREE.MeshBasicMaterial({ map: digitAtlasTex, color: colorHex, transparent: true, depthTest: false });
    const slots = [];
    for (let i = 0; i < maxDigits; i++) {
      const m = new THREE.Mesh(digitGeos[0], mat);
      m.visible = false;
      group.add(m);
      slots.push(m);
    }
    hudScene.add(group);
    return {
      group: group,
      set(val, x, y, heightPx) {
        const str = String(Math.max(0, Math.floor(val)));
        const adv = heightPx * 0.60;
        for (let i = 0; i < maxDigits; i++) {
          const m = slots[i];
          if (i < str.length) {
            const d = str.charCodeAt(i) - 48;
            m.geometry = digitGeos[d >= 0 && d <= 9 ? d : 0];
            m.scale.set(heightPx, heightPx, 1);
            m.position.set(x + i * adv + heightPx * 0.32, y, 1);
            m.visible = true;
          } else {
            m.visible = false;
          }
        }
        return str.length * adv;
      }
    };
  }

  // Wave-glyph icon (crossed blades) built purely from Three.js shapes
  const waveGlyphGroup = new THREE.Group();
  const bladeMat = new THREE.MeshBasicMaterial({ color: 0xe6edf8, transparent: true, opacity: 0.92, depthTest: false });
  const hiltMat = new THREE.MeshBasicMaterial({ color: 0xf0b84c, transparent: true, opacity: 0.95, depthTest: false });
  for (let side = -1; side <= 1; side += 2) {
    const sw = new THREE.Group();
    const blade = new THREE.Mesh(new THREE.PlaneGeometry(0.18, 0.95), bladeMat);
    blade.position.y = 0.14;
    const tip = new THREE.Mesh(new THREE.CircleGeometry(0.13, 3), bladeMat);
    tip.rotation.z = Math.PI / 6;
    tip.position.y = 0.65;
    const guard = new THREE.Mesh(new THREE.PlaneGeometry(0.42, 0.10), hiltMat);
    guard.position.y = -0.26;
    const pommel = new THREE.Mesh(new THREE.PlaneGeometry(0.12, 0.22), hiltMat);
    pommel.position.y = -0.40;
    sw.add(blade, tip, guard, pommel);
    sw.rotation.z = side * 0.72;
    waveGlyphGroup.add(sw);
  }
  hudScene.add(waveGlyphGroup);

  // Coin icon for gold
  const coinGroup = new THREE.Group();
  const coinOuter = new THREE.Mesh(new THREE.CircleGeometry(0.48, 12), new THREE.MeshBasicMaterial({ color: 0xf7c948, depthTest: false }));
  const coinInner = new THREE.Mesh(new THREE.CircleGeometry(0.32, 12), new THREE.MeshBasicMaterial({ color: 0xd99b26, depthTest: false }));
  coinInner.position.z = 0.1;
  const coinDiamond = new THREE.Mesh(new THREE.PlaneGeometry(0.24, 0.24), new THREE.MeshBasicMaterial({ color: 0xfff3b0, depthTest: false }));
  coinDiamond.rotation.z = Math.PI / 4;
  coinDiamond.position.z = 0.2;
  coinGroup.add(coinOuter, coinInner, coinDiamond);
  hudScene.add(coinGroup);

  const hudWaveNum = makeHudNumber(4, 0xf6f8fc);
  const hudGoldNum = makeHudNumber(6, 0xffd75e);

  // Next-wave preview icons + digit counts (6 wave enemy types: grunt, runner, wisp, brute, splitter, mender)
  const PREVIEW_TYPES = [0, 1, 2, 3, 4, 6]; // indices into ENEMY_TYPES
  const previewItems = [];
  for (let i = 0; i < PREVIEW_TYPES.length; i++) {
    const eIdx = PREVIEW_TYPES[i];
    const tp = ENEMY_TYPES[eIdx];
    const iconGroup = new THREE.Group();
    const bgRing = new THREE.Mesh(new THREE.CircleGeometry(0.54, 16), new THREE.MeshBasicMaterial({ color: 0x0b0e16, transparent: true, opacity: 0.78, depthTest: false }));
    iconGroup.add(bgRing);

    const col = ENEMY_COLORS[tp];
    let shape;
    if (tp === "grunt") {
      shape = new THREE.Mesh(new THREE.CircleGeometry(0.38, 6), new THREE.MeshBasicMaterial({ color: col, depthTest: false }));
    } else if (tp === "runner") {
      shape = new THREE.Mesh(new THREE.CircleGeometry(0.40, 3), new THREE.MeshBasicMaterial({ color: col, depthTest: false }));
    } else if (tp === "wisp") {
      shape = new THREE.Mesh(new THREE.PlaneGeometry(0.50, 0.50), new THREE.MeshBasicMaterial({ color: col, depthTest: false }));
      shape.rotation.z = Math.PI / 4;
    } else if (tp === "brute") {
      shape = new THREE.Group();
      const b1 = new THREE.Mesh(new THREE.PlaneGeometry(0.66, 0.62), new THREE.MeshBasicMaterial({ color: 0x3b4354, depthTest: false }));
      const b2 = new THREE.Mesh(new THREE.PlaneGeometry(0.68, 0.24), new THREE.MeshBasicMaterial({ color: 0xff7a22, depthTest: false }));
      b2.position.set(0, 0.14, 0.05);
      shape.add(b1, b2);
    } else if (tp === "splitter") {
      shape = new THREE.Mesh(new THREE.CircleGeometry(0.40, 5), new THREE.MeshBasicMaterial({ color: col, depthTest: false }));
    } else {
      // mender: white core + green halo
      shape = new THREE.Group();
      const h = new THREE.Mesh(new THREE.RingGeometry(0.32, 0.44, 16), new THREE.MeshBasicMaterial({ color: 0x4cff8c, depthTest: false }));
      const c = new THREE.Mesh(new THREE.CircleGeometry(0.28, 12), new THREE.MeshBasicMaterial({ color: 0xf4f8ff, depthTest: false }));
      c.position.z = 0.05;
      shape.add(h, c);
    }
    shape.position.z = 0.1;
    iconGroup.add(shape);
    hudScene.add(iconGroup);

    const num = makeHudNumber(3, 0xe8edf7);
    previewItems.push({ eIdx: eIdx, icon: iconGroup, num: num });
  }

  // Base HP: 10 pips in top-right corner
  const hpPips = [];
  const hpPipGeo = new THREE.PlaneGeometry(1, 1);
  for (let i = 0; i < 10; i++) {
    const bg = new THREE.Mesh(hpPipGeo, new THREE.MeshBasicMaterial({ color: 0x0b0e16, transparent: true, opacity: 0.78, depthTest: false }));
    const fillMat = new THREE.MeshBasicMaterial({ color: 0xf4c44e, transparent: true, opacity: 0.95, depthTest: false });
    const fill = new THREE.Mesh(hpPipGeo, fillMat);
    fill.position.z = 0.1;
    hudScene.add(bg);
    hudScene.add(fill);
    hpPips.push({ bg: bg, fill: fill, mat: fillMat });
  }

  function updateHud(simTime, snap) {
    const W = window.innerWidth;
    const H = window.innerHeight;
    hudCam.left = 0;
    hudCam.right = W;
    hudCam.top = H;
    hudCam.bottom = 0;
    hudCam.updateProjectionMatrix();

    const marginX = Math.max(18, Math.round(W * 0.018));
    const marginTop = Math.max(16, Math.round(H * 0.024));

    // Wave number: at least 7% of viewport height (use 8% for crisp quarter-size readability!)
    const waveH = Math.max(46, Math.round(H * 0.080));
    const waveY = H - marginTop - waveH * 0.5;
    const glyphSize = waveH * 0.76;
    waveGlyphGroup.position.set(marginX + glyphSize * 0.5, waveY, 1);
    waveGlyphGroup.scale.set(glyphSize, glyphSize, 1);
    hudWaveNum.set(snap.wave, marginX + glyphSize + waveH * 0.22, waveY, waveH);

    // Gold directly beneath wave number
    const goldH = Math.max(24, Math.round(H * 0.042));
    const goldY = waveY - waveH * 0.58 - goldH * 0.52;
    const coinSz = goldH * 0.74;
    coinGroup.position.set(marginX + coinSz * 0.55, goldY, 1);
    coinGroup.scale.set(coinSz, coinSz, 1);
    hudGoldNum.set(snap.gold, marginX + coinSz * 1.25 + goldH * 0.15, goldY, goldH);

    // Next-wave preview row under gold
    const prevH = Math.max(18, Math.round(H * 0.030));
    const prevY = goldY - goldH * 0.62 - prevH * 0.65;
    let curX = marginX + prevH * 0.55;
    const counts = snap.nextCounts;
    for (let i = 0; i < previewItems.length; i++) {
      const it = previewItems[i];
      const c = counts[it.eIdx];
      if (c > 0) {
        it.icon.visible = true;
        it.icon.position.set(curX, prevY, 1);
        it.icon.scale.set(prevH * 0.92, prevH * 0.92, 1);
        const wUsed = it.num.set(c, curX + prevH * 0.54, prevY, prevH * 0.92);
        curX += prevH * 0.54 + wUsed + prevH * 0.85;
      } else {
        it.icon.visible = false;
        it.num.set(0, -500, -500, 1);
        for (let k = 0; k < it.num.group.children.length; k++) it.num.group.children[k].visible = false;
      }
    }

    // Base HP: 10 pips top-right (each leak extinguishes with a short crimson-white flash)
    const pipW = Math.max(14, Math.round(H * 0.025));
    const pipH = Math.max(22, Math.round(H * 0.042));
    const pipGap = Math.max(5, Math.round(pipW * 0.32));
    const totalRowW = 10 * pipW + 9 * pipGap;
    const startX = W - marginX - totalRowW + pipW * 0.5;
    const pipY = H - marginTop - pipH * 0.55;

    const hp = Math.max(0, snap.baseHp);
    for (let i = 0; i < 10; i++) {
      const p = hpPips[i];
      const px = startX + i * (pipW + pipGap);
      p.bg.position.set(px, pipY, 0.5);
      p.bg.scale.set(pipW + 4, pipH + 4, 1);
      p.fill.position.set(px, pipY, 1.0);
      p.fill.scale.set(pipW, pipH, 1);

      // Pips extinguish from right to left (index 9 = 10th HP -> chunkFallTimes[0], index 0 = 1st HP -> chunkFallTimes[9])
      const chunkIdx = 9 - i;
      const extTime = chunkFallTimes[chunkIdx];
      if (i < hp) {
        p.mat.color.setHex(hp <= 3 ? 0xff7043 : 0xf6c94d);
        p.mat.opacity = 0.96;
      } else if (simTime >= extTime && simTime - extTime < 0.38) {
        const u = (simTime - extTime) / 0.38;
        p.mat.color.setHex(u < 0.35 ? 0xffffff : 0xff2b3d);
        p.mat.opacity = 1.0 - u * 0.72;
        const pop = 1.0 + Math.sin(u * Math.PI) * 0.25;
        p.fill.scale.set(pipW * pop, pipH * pop, 1);
      } else {
        p.mat.color.setHex(0x232836);
        p.mat.opacity = 0.65;
      }
    }
  }

  // =========================================================================
  // 8. DETERMINISTIC VISUAL STATE RENDERER (PURE FUNCTION OF simTime)
  // =========================================================================
  const colorTmp = new THREE.Color();
  const frostColor = new THREE.Color(0x7fd8ff);
  const orangeColor = new THREE.Color(0xff7a22);
  const upVec = new THREE.Vector3(0, 1, 0);
  const zAxis = new THREE.Vector3(0, 0, 1);
  const vecA = new THREE.Vector3();
  const vecB = new THREE.Vector3();
  const vecDir = new THREE.Vector3();
  const quatTmp = new THREE.Quaternion();
  const matTmp = new THREE.Matrix4();
  const scaleTmp = new THREE.Vector3();

  // Smooth deterministic value noise of simTime for closed-form trauma camera shake
  function seededNoise1D(t, seedOffset) {
    const i0 = Math.floor(t);
    const f = t - i0;
    const u = f * f * (3 - 2 * f);
    function h(n) {
      let x = Math.imul((n + seedOffset) | 0, 0x27d4eb2d);
      x = Math.imul(x ^ (x >>> 15), 0x85ebca6b);
      return (((x ^ (x >>> 13)) >>> 0) / 4294967296) * 2 - 1;
    }
    return h(i0) * (1 - u) + h(i0 + 1) * u;
  }

  function getLatestAimAngle(slot, t) {
    const hist = turretAimHistory[slot];
    if (hist.length === 0) return 0;
    let lo = 0, hi = hist.length - 1, idx = -1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (hist[mid].t <= t) { idx = mid; lo = mid + 1; }
      else hi = mid - 1;
    }
    return idx >= 0 ? hist[idx].angle : 0;
  }

  function findFirstEventIndex(arr, minTime) {
    let lo = 0, hi = arr.length;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (arr[mid].t < minTime) lo = mid + 1;
      else hi = mid;
    }
    return lo;
  }

  function renderAtSimTime(simTime) {
    // Freeze world simulation at fallTime, while allowing fall debris/shockwave/desat to progress cleanly!
    const effSimTime = Math.min(simTime, fallTime);
    const exactTick = effSimTime * TICKS_PER_SEC;
    const k0 = Math.min(freezeTick, Math.max(0, Math.floor(exactTick)));
    const k1 = Math.min(freezeTick, k0 + 1);
    const frac = (simTime >= fallTime) ? 0 : (exactTick - k0);

    const snap0 = ticks[k0];
    const snap1 = ticks[k1];

    // 1. Camera trauma shake (closed-form in simTime)
    const trauma = getTraumaAt(simTime);
    if (trauma > 0.0001) {
      const amp = trauma * trauma * 0.25;
      const sx = seededNoise1D(simTime * 22.0, 101) * amp;
      const sy = seededNoise1D(simTime * 22.0, 313) * amp * 0.65;
      const sz = seededNoise1D(simTime * 22.0, 709) * amp;
      camera.position.set(baseCamPos.x + sx, baseCamPos.y + sy, baseCamPos.z + sz);
      camera.lookAt(baseCamTarget.x + sx * 0.5, baseCamTarget.y, baseCamTarget.z + sz * 0.5);
    } else {
      camera.position.copy(baseCamPos);
      camera.lookAt(baseCamTarget);
    }
    camera.updateMatrixWorld();

    // 2. Animated air lane chevrons (frozen at fall)
    for (let i = 0; i < AIR_CHEV_COUNT; i++) {
      const d = ((i / AIR_CHEV_COUNT) * 28.0 + effSimTime * 2.2) % 28.0;
      const pt = sampleAirLane(d);
      vecA.set(pt.x, 0.80, pt.z);
      tmpEuler.set(0, pt.ang, 0);
      quatTmp.setFromEuler(tmpEuler);
      scaleTmp.set(1, 1, 1);
      matTmp.compose(vecA, quatTmp, scaleTmp);
      airChevInst.setMatrixAt(i, matTmp);
    }
    airChevInst.instanceMatrix.needsUpdate = true;

    // 3. Keep state (leak red flash, crumbling wall chunks, fall collapse)
    let leakFlash = 0;
    const lkIdxStart = findFirstEventIndex(leaks, simTime - 0.30);
    for (let i = lkIdxStart; i < leaks.length && leaks[i].t <= simTime; i++) {
      const age = simTime - leaks[i].t;
      if (age >= 0 && age < 0.30) {
        leakFlash = Math.max(leakFlash, 1.0 - age / 0.30);
      }
    }
    keepStoneMat.emissive.setRGB(leakFlash * 0.95, leakFlash * 0.08, leakFlash * 0.08);
    keepDarkMat.emissive.setRGB(leakFlash * 0.65, leakFlash * 0.05, leakFlash * 0.05);

    const hasFallen = simTime >= fallTime;
    const sinceFall = hasFallen ? (simTime - fallTime) : -1;
    citadelGroup.visible = !hasFallen;
    if (!hasFallen) {
      beaconOrb.rotation.y = effSimTime * 1.8;
      beaconOrb.position.y = 2.02 + Math.sin(effSimTime * 3.0) * 0.06;
    }

    for (let i = 0; i < 10; i++) {
      const ch = keepChunks[i];
      const ft = Math.min(chunkFallTimes[i], fallTime);
      if (simTime < ft) {
        ch.mesh.visible = true;
        ch.mesh.position.copy(ch.basePos);
        ch.mesh.rotation.set(0, 0, 0);
        ch.mesh.scale.set(1, 1, 1);
      } else {
        const dt = simTime - ft;
        if (dt < 0.95) {
          ch.mesh.visible = true;
          ch.mesh.position.set(
            ch.basePos.x + ch.vel.x * dt,
            Math.max(0.12, ch.basePos.y + ch.vel.y * dt - 4.8 * dt * dt),
            ch.basePos.z + ch.vel.z * dt
          );
          ch.mesh.rotation.set(ch.spin.x * dt, ch.spin.y * dt, ch.spin.z * dt);
          const sc = Math.max(0.01, 1.0 - Math.max(0, dt - 0.55) / 0.40);
          ch.mesh.scale.setScalar(sc);
        } else {
          ch.mesh.visible = false;
        }
      }
    }

    // 4. Turrets on all 16 slots
    for (let sl = 0; sl < 16; sl++) {
      const code = snap0.slots[sl];
      const map = slotTurrets[sl];
      const activeType = code >= 0 ? TURRET_TYPES[code >> 2] : null;
      const tier = code >= 0 ? (code & 3) : 0;

      for (let ti = 0; ti < TURRET_TYPES.length; ti++) {
        const tp = TURRET_TYPES[ti];
        const obj = map[tp];
        if (tp === activeType) {
          obj.root.visible = true;
          const sc = 0.92 + (tier - 1) * 0.09;
          obj.root.scale.set(sc, sc, sc);
          if (tp === "frost") {
            obj.head.rotation.y = effSimTime * 1.4;
          } else {
            obj.head.rotation.y = getLatestAimAngle(sl, effSimTime);
          }
          for (let p = 0; p < 3; p++) {
            obj.pips[p].visible = p < tier;
            obj.tierRings[p].visible = p < tier;
          }
        } else {
          obj.root.visible = false;
        }
      }
    }

    // 5. Enemies (smoothly interpolated between k0 and k1, facing travel direction, health bars & frost tint)
    const typeCounts = [0, 0, 0, 0, 0, 0, 0];
    let brutePlateCount = 0;
    let wispShadowCount = 0;
    let menderHaloCount = 0;
    let hbCount = 0;

    const camQuat = camera.quaternion;
    const eCount = snap0.eCount;
    for (let i = 0; i < eCount; i++) {
      const id = snap0.eIds[i];
      const tpIdx = snap0.eTypes[i];
      const tp = ENEMY_TYPES[tpIdx];
      let x = snap0.eX[i];
      let z = snap0.eZ[i];
      let hp = snap0.eHp[i];
      const maxHp = snap0.eMaxHp[i];
      const slowed = snap0.eSlow[i];
      const isAir = snap0.eAir[i];

      let ang = Math.PI / 2;
      const j = snap1.eMap.get(id);
      if (j !== undefined) {
        const nx = snap1.eX[j];
        const nz = snap1.eZ[j];
        const dx = nx - x;
        const dz = nz - z;
        if (dx * dx + dz * dz > 1e-6) {
          ang = Math.atan2(dx, dz);
        }
        x += dx * frac;
        z += dz * frac;
        hp = hp + (snap1.eHp[j] - hp) * frac;
      } else {
        // Fallback direction from segment when enemy dies/leaks on next tick
        if (isAir) ang = z > 6.6 && x < 21.8 ? 0 : Math.PI / 2;
        else if (Math.abs(x - 6.5) < 0.25 && z > 2.6 && z < 10.4) ang = 0;
        else if (Math.abs(x - 12.5) < 0.25 && z > 3.6 && z < 10.4) ang = Math.PI;
        else if (Math.abs(x - 18.5) < 0.25 && z > 3.6 && z < 11.4) ang = 0;
      }

      const y = isAir ? (0.80 + Math.sin(effSimTime * 5.2 + id * 1.7) * 0.06) : 0.02;
      const idx = typeCounts[tpIdx];
      if (idx < MAX_ENEMIES_PER_TYPE) {
        vecA.set(x, y, z);
        if (isAir) tmpEuler.set(effSimTime * 1.5 + id, effSimTime * 2.4 + id, 0);
        else tmpEuler.set(0, ang, 0);
        quatTmp.setFromEuler(tmpEuler);
        scaleTmp.set(1, 1, 1);
        matTmp.compose(vecA, quatTmp, scaleTmp);
        enemyInst[tp].setMatrixAt(idx, matTmp);

        colorTmp.setHex(ENEMY_COLORS[tp]);
        if (slowed) colorTmp.lerp(frostColor, 0.58);
        enemyInst[tp].setColorAt(idx, colorTmp);
        typeCounts[tpIdx] = idx + 1;

        if (tp === "brute" && brutePlateCount < MAX_ENEMIES_PER_TYPE) {
          brutePlateInst.setMatrixAt(brutePlateCount, matTmp);
          colorTmp.copy(orangeColor);
          if (slowed) colorTmp.lerp(frostColor, 0.45);
          brutePlateInst.setColorAt(brutePlateCount, colorTmp);
          brutePlateCount++;
        } else if (tp === "wisp" && wispShadowCount < MAX_ENEMIES_PER_TYPE) {
          vecB.set(x, 0.03, z);
          quatTmp.identity();
          matTmp.compose(vecB, quatTmp, scaleTmp);
          wispShadowInst.setMatrixAt(wispShadowCount, matTmp);
          wispShadowCount++;
        } else if (tp === "mender" && menderHaloCount < MAX_ENEMIES_PER_TYPE) {
          vecB.set(x, 0.14 + Math.sin(effSimTime * 4.0 + id) * 0.03, z);
          quatTmp.identity();
          const pulse = 1.0 + Math.sin(effSimTime * 4.0 + id) * 0.10;
          scaleTmp.set(pulse, 1, pulse);
          matTmp.compose(vecB, quatTmp, scaleTmp);
          menderHaloInst.setMatrixAt(menderHaloCount, matTmp);
          menderHaloCount++;
        }
      }

      // Health bar above enemy
      if (hbCount < MAX_TOTAL_ENEMIES) {
        const hpRatio = Math.max(0.02, Math.min(1.0, hp / Math.max(1, maxHp)));
        const barY = isAir ? (y + 0.42) : (tp === "brute" ? 0.78 : (tp === "splitling" ? 0.42 : 0.64));
        vecA.set(x, barY, z);
        scaleTmp.set(1, 1, 1);
        matTmp.compose(vecA, camQuat, scaleTmp);
        hbBackInst.setMatrixAt(hbCount, matTmp);

        // Shift fill bar to left edge of backing in camera-right axis
        vecDir.set(-0.26, 0, 0).applyQuaternion(camQuat);
        vecB.copy(vecA).add(vecDir);
        scaleTmp.set(hpRatio, 1, 1);
        matTmp.compose(vecB, camQuat, scaleTmp);
        hbFillInst.setMatrixAt(hbCount, matTmp);

        if (hpRatio > 0.55) colorTmp.setHex(0x4ee87a);
        else if (hpRatio > 0.25) colorTmp.setHex(0xf7c948);
        else colorTmp.setHex(0xff4646);
        hbFillInst.setColorAt(hbCount, colorTmp);
        hbCount++;
      }
    }

    for (let i = 0; i < ENEMY_TYPES.length; i++) {
      const inst = enemyInst[ENEMY_TYPES[i]];
      inst.count = typeCounts[i];
      inst.instanceMatrix.needsUpdate = true;
      if (inst.instanceColor) inst.instanceColor.needsUpdate = true;
    }
    brutePlateInst.count = brutePlateCount;
    brutePlateInst.instanceMatrix.needsUpdate = true;
    if (brutePlateInst.instanceColor) brutePlateInst.instanceColor.needsUpdate = true;

    wispShadowInst.count = wispShadowCount;
    wispShadowInst.instanceMatrix.needsUpdate = true;

    menderHaloInst.count = menderHaloCount;
    menderHaloInst.instanceMatrix.needsUpdate = true;

    hbBackInst.count = hbCount;
    hbBackInst.instanceMatrix.needsUpdate = true;
    hbFillInst.count = hbCount;
    hbFillInst.instanceMatrix.needsUpdate = true;
    if (hbFillInst.instanceColor) hbFillInst.instanceColor.needsUpdate = true;

    // 6. Combat Effects (shots <= 0.15s, heals, kills, slot events, fall shockwave & debris)
    let beamCount = 0;
    let shellCount = 0;
    let ringCount = 0;
    let debrisCount = 0;

    function pushBeam(x0, y0, z0, x1, y1, z1, radius, colHex) {
      if (beamCount >= MAX_BEAMS) return;
      vecA.set(x0, y0, z0);
      vecB.set(x1, y1, z1);
      vecDir.subVectors(vecB, vecA);
      const len = vecDir.length();
      if (len < 0.01) return;
      vecDir.divideScalar(len);
      quatTmp.setFromUnitVectors(zAxis, vecDir);
      vecA.addScaledVector(vecDir, len * 0.5);
      scaleTmp.set(radius, radius, len);
      matTmp.compose(vecA, quatTmp, scaleTmp);
      beamInst.setMatrixAt(beamCount, matTmp);
      colorTmp.setHex(colHex);
      beamInst.setColorAt(beamCount, colorTmp);
      beamCount++;
    }

    function pushRing(x, y, z, radius, colHex) {
      if (ringCount >= MAX_RINGS) return;
      vecA.set(x, y, z);
      quatTmp.identity();
      scaleTmp.set(radius, 1, radius);
      matTmp.compose(vecA, quatTmp, scaleTmp);
      ringInst.setMatrixAt(ringCount, matTmp);
      colorTmp.setHex(colHex);
      ringInst.setColorAt(ringCount, colorTmp);
      ringCount++;
    }

    function pushShell(x, y, z, sc, colHex) {
      if (shellCount >= MAX_SHELLS) return;
      vecA.set(x, y, z);
      quatTmp.identity();
      scaleTmp.set(sc, sc, sc);
      matTmp.compose(vecA, quatTmp, scaleTmp);
      shellInst.setMatrixAt(shellCount, matTmp);
      colorTmp.setHex(colHex);
      shellInst.setColorAt(shellCount, colorTmp);
      shellCount++;
    }

    function pushDebris(x, y, z, rx, ry, sc, colHex) {
      if (debrisCount >= MAX_DEBRIS) return;
      vecA.set(x, y, z);
      tmpEuler.set(rx, ry, 0);
      quatTmp.setFromEuler(tmpEuler);
      scaleTmp.set(sc, sc, sc);
      matTmp.compose(vecA, quatTmp, scaleTmp);
      debrisInst.setMatrixAt(debrisCount, matTmp);
      colorTmp.setHex(colHex);
      debrisInst.setColorAt(debrisCount, colorTmp);
      debrisCount++;
    }

    // Active shots in [effSimTime - 0.15, effSimTime]
    const shotStart = findFirstEventIndex(shots, effSimTime - 0.15);
    for (let i = shotStart; i < shots.length && shots[i].t <= effSimTime; i++) {
      const sh = shots[i];
      const age = effSimTime - sh.t;
      if (age < 0 || age > 0.15) continue;
      const u = age / 0.15;
      const y0 = 0.62;
      const y1 = sh.air ? 0.80 : 0.25;

      if (sh.type === "bolt") {
        // Thin steel-blue tracer
        const t0 = Math.max(0, u - 0.45);
        const t1 = Math.min(1, u * 1.45);
        const ax = sh.x0 + (sh.x1 - sh.x0) * t0, ay = y0 + (y1 - y0) * t0, az = sh.z0 + (sh.z1 - sh.z0) * t0;
        const bx = sh.x0 + (sh.x1 - sh.x0) * t1, by = y0 + (y1 - y0) * t1, bz = sh.z0 + (sh.z1 - sh.z0) * t1;
        pushBeam(ax, ay, az, bx, by, bz, 0.032 * (1 - u * 0.4), 0x86c8ff);
      } else if (sh.type === "cannon") {
        // Arcing bronze shell then splash burst ring of exact splash radius (0.90)
        if (age < 0.075) {
          const fu = age / 0.075;
          const sx = sh.x0 + (sh.x1 - sh.x0) * fu;
          const sz = sh.z0 + (sh.z1 - sh.z0) * fu;
          const sy = y0 + (y1 - y0) * fu + Math.sin(fu * Math.PI) * 0.85;
          pushShell(sx, sy, sz, 1.15, 0xffaa44);
        } else {
          const bu = (age - 0.075) / 0.075;
          const rad = 0.18 + bu * (sh.splash - 0.18);
          pushRing(sh.x1, 0.09, sh.z1, rad, bu < 0.45 ? 0xffd166 : 0xff7b29);
          if (bu < 0.5) pushShell(sh.x1, 0.22, sh.z1, 1.6 * (1 - bu * 2), 0xffe494);
        }
      } else if (sh.type === "frost") {
        // Pale ice-white beam
        pushBeam(sh.x0, y0 + 0.12, sh.z0, sh.x1, y1, sh.z1, 0.055 * (1 - u * 0.55), 0xdff8ff);
        pushRing(sh.x1, y1, sh.z1, 0.16 + u * 0.30, 0x9be8ff);
      } else if (sh.type === "lance") {
        // Thick crimson beam + flash
        pushBeam(sh.x0, y0 + 0.06, sh.z0, sh.x1, y1, sh.z1, 0.11 * (1 - u * 0.65), u < 0.35 ? 0xff7888 : 0xe81e36);
        if (u < 0.55) {
          pushShell(sh.x0, y0 + 0.06, sh.z0, 1.5 * (1 - u * 1.8), 0xff4c5e);
          pushShell(sh.x1, y1, sh.z1, 2.0 * (1 - u * 1.8), 0xff929d);
        }
      } else if (sh.type === "flak") {
        // Tracer up to air + teal airburst ring of exact splash radius (0.70)
        if (age < 0.055) {
          const fu = age / 0.055;
          pushBeam(sh.x0, y0, sh.z0, sh.x0 + (sh.x1 - sh.x0) * fu, y0 + (y1 - y0) * fu, sh.z0 + (sh.z1 - sh.z0) * fu, 0.036, 0x52f2df);
        } else {
          const bu = (age - 0.055) / 0.095;
          const rad = 0.16 + bu * (sh.splash - 0.16);
          pushRing(sh.x1, 0.80, sh.z1, rad, bu < 0.4 ? 0xa4fff5 : 0x1fd1be);
        }
      }
    }

    // Mender heal pulse rings (exact heal radius 1.50 tiles)
    const healStart = findFirstEventIndex(heals, effSimTime - 0.48);
    for (let i = healStart; i < heals.length && heals[i].t <= effSimTime; i++) {
      const h = heals[i];
      const age = effSimTime - h.t;
      if (age < 0 || age > 0.48) continue;
      const u = age / 0.48;
      pushRing(h.x, 0.08, h.z, 0.20 + u * 1.30, u < 0.5 ? 0x7effa8 : 0x2cd96b);
    }

    // Build / Upgrade / Sell visual effects at wave start
    const seStart = findFirstEventIndex(slotEvents, effSimTime - 0.52);
    for (let i = seStart; i < slotEvents.length && slotEvents[i].t <= effSimTime; i++) {
      const se = slotEvents[i];
      const age = effSimTime - se.t;
      if (age < 0 || age > 0.52) continue;
      const u = age / 0.52;
      const sx = SLOT_TILES[se.slot][0] + 0.5;
      const sz = SLOT_TILES[se.slot][1] + 0.5;
      if (se.kind === "B") {
        // Rising sparkles
        const col = TURRET_COLORS[se.type] || 0xffe484;
        for (let k = 0; k < 6; k++) {
          const ang = (k / 6) * Math.PI * 2 + u * 2.5;
          const r = 0.36 * (1 - u * 0.4);
          pushDebris(sx + Math.cos(ang) * r, 0.18 + u * 1.15 + (k % 2) * 0.15, sz + Math.sin(ang) * r, u * 6, ang, 0.7 * (1 - u), col);
        }
      } else if (se.kind === "U") {
        // Golden expanding/rising ring pulse
        pushRing(sx, 0.16 + u * 0.72, sz, 0.35 + u * 0.45, 0xffe26a);
      } else if (se.kind === "S") {
        // Rubble collapse burst
        for (let k = 0; k < 8; k++) {
          const ang = (k / 8) * Math.PI * 2 + se.slot;
          const spd = 0.9 + (k % 3) * 0.45;
          const py = Math.max(0.06, 0.45 + 1.8 * age - 4.8 * age * age);
          pushDebris(sx + Math.cos(ang) * spd * age, py, sz + Math.sin(ang) * spd * age, age * 8, ang, 0.9 * (1 - u), 0x7c8290);
        }
      }
    }

    // Enemy kill debris bursts (closed-form ballistic in time since kill)
    const killStart = findFirstEventIndex(kills, effSimTime - 0.55);
    for (let i = killStart; i < kills.length && kills[i].t <= effSimTime; i++) {
      const kl = kills[i];
      const age = effSimTime - kl.t;
      if (age < 0 || age > 0.55) continue;
      const u = age / 0.55;
      const baseY = kl.air ? 0.80 : 0.24;
      const col = kl.type === "brute" ? 0xff7a22 : ENEMY_COLORS[kl.type];
      const pieces = kl.type === "brute" ? 8 : (kl.type === "splitling" ? 3 : 5);
      for (let p = 0; p < pieces; p++) {
        // Deterministic hash per (kill.seed, p)
        let h = Math.imul(kl.seed * 31 + p * 17, 0x27d4eb2d);
        const a = (((h >>> 0) % 360) * Math.PI) / 180;
        h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
        const spd = 0.85 + (((h >>> 0) % 100) / 100) * 1.85;
        const vy = 1.6 + (((h >>> 8) % 100) / 100) * 2.1;
        const py = Math.max(0.06, baseY + vy * age - 5.2 * age * age);
        pushDebris(
          kl.x + Math.cos(a) * spd * age,
          py,
          kl.z + Math.sin(a) * spd * age,
          age * 10 + p,
          a,
          (kl.type === "brute" ? 1.15 : 0.72) * (1 - u),
          col
        );
      }
      // Splitter death burst ring
      if (kl.type === "splitter" && age < 0.28) {
        const su = age / 0.28;
        pushRing(kl.x, 0.14, kl.z, 0.18 + su * 0.65, 0xd47cff);
      }
    }

    // Fall event: massive keep debris explosion + expanding shockwave ring + 1.0s desaturation
    if (hasFallen) {
      if (sinceFall < 1.25) {
        const su = sinceFall / 1.25;
        pushRing(23.5, 0.22, 11.5, 0.5 + su * 7.5, su < 0.35 ? 0xffdd88 : 0xff3b30);
        if (sinceFall < 0.70) {
          pushRing(23.5, 0.36, 11.5, 0.4 + (sinceFall / 0.70) * 4.2, 0xffffff);
        }
      }
      if (sinceFall < 1.6) {
        const du = sinceFall / 1.6;
        for (let i = 0; i < fallDebris.length; i++) {
          const fd = fallDebris[i];
          const py = Math.max(0.08, fd.oy + fd.vy * sinceFall - 4.9 * sinceFall * sinceFall);
          pushDebris(
            23.5 + fd.ox + fd.vx * sinceFall,
            py,
            11.5 + fd.oz + fd.vz * sinceFall,
            fd.rx * sinceFall,
            fd.ry * sinceFall,
            fd.sc * Math.max(0.05, 1 - du * 0.85),
            fd.col
          );
        }
      }
      postMat.uniforms.uDesat.value = Math.min(0.92, (sinceFall / 1.0) * 0.92);
    } else {
      postMat.uniforms.uDesat.value = 0.0;
    }

    beamInst.count = beamCount;
    beamInst.instanceMatrix.needsUpdate = true;
    if (beamInst.instanceColor) beamInst.instanceColor.needsUpdate = true;

    shellInst.count = shellCount;
    shellInst.instanceMatrix.needsUpdate = true;
    if (shellInst.instanceColor) shellInst.instanceColor.needsUpdate = true;

    ringInst.count = ringCount;
    ringInst.instanceMatrix.needsUpdate = true;
    if (ringInst.instanceColor) ringInst.instanceColor.needsUpdate = true;

    debrisInst.count = debrisCount;
    debrisInst.instanceMatrix.needsUpdate = true;
    if (debrisInst.instanceColor) debrisInst.instanceColor.needsUpdate = true;

    // 7. Update HUD elements for current tick
    updateHud(simTime, snap0);

    // 8. Render 3D world (native MSAA when active; RT desaturation pass after fall) + Orthographic HUD pass
    if (postMat.uniforms.uDesat.value > 0.001) {
      renderer.setRenderTarget(sceneRT);
      renderer.setClearColor(0x000000, 0);
      renderer.clear(true, true, true);
      renderer.render(scene, camera);

      renderer.setRenderTarget(null);
      renderer.setClearColor(0x000000, 0);
      renderer.clear(true, true, true);
      renderer.render(postScene, postCam);
    } else {
      renderer.setRenderTarget(null);
      renderer.setClearColor(0x000000, 0);
      renderer.clear(true, true, true);
      renderer.render(scene, camera);
    }
    renderer.clearDepth();
    renderer.render(hudScene, hudCam);
  }

  // =========================================================================
  // 9. SYNTHESIZED WEB AUDIO SFX ENGINE (SEED 4242, NO MUSIC, NO EXTRA UI)
  // =========================================================================
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  const audioRng = makeRng(4242);
  let audioCtx = null;
  let masterGain = null;
  let compressor = null;
  let noiseBuf = null;
  let windNode = null;
  let windGain = null;
  const activeNodes = new Set();
  const shotTimestamps = [];

  const SHOT_PRIORITY = { lance: 5, cannon: 4, flak: 3, bolt: 2, frost: 1 };

  function initAudio() {
    if (!AudioCtx || audioCtx) return;
    try {
      audioCtx = new AudioCtx();
      compressor = audioCtx.createDynamicsCompressor();
      compressor.threshold.value = -14;
      compressor.knee.value = 18;
      compressor.ratio.value = 8;
      compressor.attack.value = 0.004;
      compressor.release.value = 0.14;

      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.0001;
      masterGain.connect(compressor);
      compressor.connect(audioCtx.destination);

      // Seeded white noise buffer (1.5s)
      const len = Math.floor(audioCtx.sampleRate * 1.5);
      noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = audioRng() * 2 - 1;

      audioCtx.resume().catch(function () {});
    } catch (e) {
      audioCtx = null;
    }
  }

  function resumeAudio() {
    if (!audioCtx) initAudio();
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume().catch(function () {});
    }
  }

  initAudio();
  window.addEventListener("pointerdown", resumeAudio, { passive: true });
  window.addEventListener("keydown", resumeAudio, { passive: true });

  function stopAllAudio() {
    if (!audioCtx || !masterGain) return;
    const now = audioCtx.currentTime;
    try {
      masterGain.gain.cancelScheduledValues(now);
      masterGain.gain.setValueAtTime(Math.max(0.0001, masterGain.gain.value), now);
      masterGain.gain.linearRampToValueAtTime(0.0001, now + 0.045);
    } catch (e) {}
    activeNodes.forEach(function (node) {
      try { node.stop(now + 0.048); } catch (e) {}
    });
    activeNodes.clear();
    if (windNode) {
      try { windNode.stop(now + 0.048); } catch (e) {}
      windNode = null;
      windGain = null;
    }
  }

  function enableAudio() {
    if (!audioCtx || !masterGain) return;
    if (audioCtx.state === "suspended") audioCtx.resume().catch(function () {});
    const now = audioCtx.currentTime;
    try {
      masterGain.gain.cancelScheduledValues(now);
      masterGain.gain.setValueAtTime(Math.max(0.0001, masterGain.gain.value), now);
      masterGain.gain.linearRampToValueAtTime(0.42, now + 0.03);
    } catch (e) {}
  }

  function trackNode(node) {
    activeNodes.add(node);
    node.onended = function () { activeNodes.delete(node); };
  }

  function makePanner(boardX) {
    const pan = Math.max(-0.85, Math.min(0.85, (boardX / 24) * 1.7 - 0.85));
    if (audioCtx.createStereoPanner) {
      const p = audioCtx.createStereoPanner();
      p.pan.value = pan;
      p.connect(masterGain);
      return p;
    }
    return masterGain;
  }

  function playShotSfx(sh) {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const dest = makePanner(sh.x0);
    const jitter = 0.94 + audioRng() * 0.12;

    if (sh.type === "bolt") {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(1150 * jitter, now);
      osc.frequency.exponentialRampToValueAtTime(360 * jitter, now + 0.055);
      g.gain.setValueAtTime(0.11, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc.connect(g); g.connect(dest);
      osc.start(now); osc.stop(now + 0.065);
      trackNode(osc);
    } else if (sh.type === "cannon") {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(155 * jitter, now);
      osc.frequency.exponentialRampToValueAtTime(42 * jitter, now + 0.16);
      g.gain.setValueAtTime(0.28, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
      osc.connect(g); g.connect(dest);
      osc.start(now); osc.stop(now + 0.19);
      trackNode(osc);

      const ns = audioCtx.createBufferSource();
      ns.buffer = noiseBuf;
      const flt = audioCtx.createBiquadFilter();
      flt.type = "lowpass"; flt.frequency.value = 520;
      const ng = audioCtx.createGain();
      ng.gain.setValueAtTime(0.16, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
      ns.connect(flt); flt.connect(ng); ng.connect(dest);
      ns.start(now, audioRng() * 0.5, 0.15);
      trackNode(ns);
    } else if (sh.type === "frost") {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(1750 * jitter, now);
      osc.frequency.exponentialRampToValueAtTime(2450 * jitter, now + 0.09);
      g.gain.setValueAtTime(0.08, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.10);
      osc.connect(g); g.connect(dest);
      osc.start(now); osc.stop(now + 0.11);
      trackNode(osc);
    } else if (sh.type === "lance") {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(920 * jitter, now);
      osc.frequency.exponentialRampToValueAtTime(140 * jitter, now + 0.18);
      const flt = audioCtx.createBiquadFilter();
      flt.type = "bandpass"; flt.frequency.value = 1100; flt.Q.value = 1.4;
      g.gain.setValueAtTime(0.24, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.19);
      osc.connect(flt); flt.connect(g); g.connect(dest);
      osc.start(now); osc.stop(now + 0.20);
      trackNode(osc);
    } else if (sh.type === "flak") {
      const ns = audioCtx.createBufferSource();
      ns.buffer = noiseBuf;
      const flt = audioCtx.createBiquadFilter();
      flt.type = "bandpass"; flt.frequency.value = 1550 * jitter; flt.Q.value = 2.0;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.19, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.085);
      ns.connect(flt); flt.connect(g); g.connect(dest);
      ns.start(now, audioRng() * 0.5, 0.09);
      trackNode(ns);
    }
  }

  function playKillSfx(kl) {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const dest = makePanner(kl.x);
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "sine";
    const f0 = (kl.type === "brute" ? 260 : 520) * (0.9 + audioRng() * 0.2);
    osc.frequency.setValueAtTime(f0, now);
    osc.frequency.exponentialRampToValueAtTime(f0 * 0.45, now + 0.045);
    g.gain.setValueAtTime(0.065, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
    osc.connect(g); g.connect(dest);
    osc.start(now); osc.stop(now + 0.055);
    trackNode(osc);
  }

  function playWaveHornSfx() {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const dest = makePanner(2);
    const freqs = [196, 293.66];
    for (let i = 0; i < freqs.length; i++) {
      const osc = audioCtx.createOscillator();
      const flt = audioCtx.createBiquadFilter();
      const g = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(freqs[i] * 0.96, now);
      osc.frequency.linearRampToValueAtTime(freqs[i] * 1.04, now + 0.34);
      flt.type = "lowpass"; flt.frequency.value = 680;
      g.gain.setValueAtTime(0.001, now);
      g.gain.linearRampToValueAtTime(0.08, now + 0.08);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.42);
      osc.connect(flt); flt.connect(g); g.connect(dest);
      osc.start(now); osc.stop(now + 0.44);
      trackNode(osc);
    }
  }

  function playLeakSfx() {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const dest = makePanner(23.5);
    // Stone crack
    const ns = audioCtx.createBufferSource();
    ns.buffer = noiseBuf;
    const flt = audioCtx.createBiquadFilter();
    flt.type = "bandpass"; flt.frequency.value = 820; flt.Q.value = 1.2;
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.32, now);
    ng.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
    ns.connect(flt); flt.connect(ng); ng.connect(dest);
    ns.start(now, audioRng() * 0.4, 0.18);
    trackNode(ns);
    // Alarm tone
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(620, now);
    osc.frequency.setValueAtTime(440, now + 0.09);
    g.gain.setValueAtTime(0.14, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
    osc.connect(g); g.connect(dest);
    osc.start(now); osc.stop(now + 0.25);
    trackNode(osc);
  }

  function playFallCollapseSfx() {
    if (!audioCtx || audioCtx.state !== "running") return;
    const now = audioCtx.currentTime;
    const dest = makePanner(23.5);
    // Deep sub collapse
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(110, now);
    osc.frequency.exponentialRampToValueAtTime(26, now + 1.15);
    g.gain.setValueAtTime(0.55, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 1.25);
    osc.connect(g); g.connect(dest);
    osc.start(now); osc.stop(now + 1.3);
    trackNode(osc);

    // Masonry crumble rumble
    const ns = audioCtx.createBufferSource();
    ns.buffer = noiseBuf;
    const flt = audioCtx.createBiquadFilter();
    flt.type = "lowpass";
    flt.frequency.setValueAtTime(620, now);
    flt.frequency.exponentialRampToValueAtTime(120, now + 1.35);
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.42, now);
    ng.gain.exponentialRampToValueAtTime(0.001, now + 1.45);
    ns.connect(flt); flt.connect(ng); ng.connect(dest);
    ns.start(now, 0, 1.5);
    trackNode(ns);
  }

  function ensureWindLoop(playingAfterFall) {
    if (!audioCtx || audioCtx.state !== "running") return;
    if (playingAfterFall && !windNode) {
      const now = audioCtx.currentTime;
      const src = audioCtx.createBufferSource();
      src.buffer = noiseBuf;
      src.loop = true;
      const flt = audioCtx.createBiquadFilter();
      flt.type = "bandpass";
      flt.frequency.value = 185;
      flt.Q.value = 2.8;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.001, now);
      g.gain.linearRampToValueAtTime(0.11, now + 0.6);
      src.connect(flt); flt.connect(g); g.connect(masterGain);
      src.start(now);
      windNode = src;
      windGain = g;
    } else if (!playingAfterFall && windNode) {
      const now = audioCtx.currentTime;
      try { windNode.stop(now + 0.05); } catch (e) {}
      windNode = null;
      windGain = null;
    }
  }

  let lastKillAudioWall = 0;

  function triggerForwardAudio(prevT, curT) {
    if (!audioCtx || audioCtx.state !== "running") return;
    if (curT <= prevT) return;

    // After fall: only low wind
    if (prevT >= fallTime) {
      ensureWindLoop(true);
      return;
    }

    // Fall event
    if (fallEvent && prevT < fallTime && curT >= fallTime) {
      playFallCollapseSfx();
      ensureWindLoop(true);
    }

    const endT = Math.min(curT, fallTime);
    const nowWall = performance.now() * 0.001;

    // Wave starts
    const wStart = findFirstEventIndex(waveEvents, prevT + 1e-6);
    for (let i = wStart; i < waveEvents.length && waveEvents[i].t <= endT; i++) {
      if (waveEvents[i].t > prevT) playWaveHornSfx();
    }

    // Leaks
    const lStart = findFirstEventIndex(leaks, prevT + 1e-6);
    for (let i = lStart; i < leaks.length && leaks[i].t <= endT; i++) {
      if (leaks[i].t > prevT) playLeakSfx();
    }

    // Shots (rate-limited to at most 12 shots/sec total, loudest types first!)
    const sStart = findFirstEventIndex(shots, prevT + 1e-6);
    const frameShots = [];
    for (let i = sStart; i < shots.length && shots[i].t <= endT; i++) {
      if (shots[i].t > prevT) frameShots.push(shots[i]);
    }
    if (frameShots.length > 0) {
      frameShots.sort(function (a, b) {
        return (SHOT_PRIORITY[b.type] || 0) - (SHOT_PRIORITY[a.type] || 0);
      });
      // Prune shot timestamps older than 1.0s
      while (shotTimestamps.length > 0 && nowWall - shotTimestamps[0] > 1.0) {
        shotTimestamps.shift();
      }
      for (let i = 0; i < frameShots.length && shotTimestamps.length < 12; i++) {
        playShotSfx(frameShots[i]);
        shotTimestamps.push(nowWall);
      }
    }

    // Kills (soft pop, gently rate-limited so multi-kills stay clean)
    const kStart = findFirstEventIndex(kills, prevT + 1e-6);
    for (let i = kStart; i < kills.length && kills[i].t <= endT; i++) {
      if (kills[i].t > prevT && nowWall - lastKillAudioWall >= 0.07) {
        playKillSfx(kills[i]);
        lastKillAudioWall = nowWall;
        break;
      }
    }
  }

  // =========================================================================
  // 10. 5-STATE TIMELINE STATE MACHINE & CANONICAL DOCK CONTROLS
  // =========================================================================
  const elCountdown = document.getElementById("countdown");
  const elRefire = document.getElementById("btn-refire");
  const elToggle = document.getElementById("btn-toggle");
  const elIconPause = document.getElementById("icon-pause");
  const elIconPlay = document.getElementById("icon-play");
  const elScrubber = document.getElementById("scrubber");
  const speedPills = Array.prototype.slice.call(document.querySelectorAll(".speed-pill"));

  let playState = "COUNTDOWN"; // COUNTDOWN | PLAYING | PAUSED | REFIRE_HOLD | ENDED
  let simTime = 0.0;
  let playbackSpeed = 1.0;
  let countdownElapsed = 0.0;
  let holdElapsed = 0.0;
  let countdownStarted = false;
  let lastFrameMs = null;

  function setToggleVisual(isPlayingLike) {
    if (isPlayingLike) {
      elIconPause.style.display = "";
      elIconPlay.style.display = "none";
      elToggle.setAttribute("aria-label", "Pause");
    } else {
      elIconPause.style.display = "none";
      elIconPlay.style.display = "";
      elToggle.setAttribute("aria-label", "Play");
    }
  }

  function hideCountdown() {
    elCountdown.style.display = "none";
    elCountdown.textContent = "";
  }

  function showCountdownDigit(digitStr) {
    elCountdown.style.display = "block";
    if (elCountdown.textContent !== digitStr) {
      elCountdown.textContent = digitStr;
    }
  }

  function enterPaused() {
    playState = "PAUSED";
    hideCountdown();
    setToggleVisual(false);
    stopAllAudio();
  }

  function enterPlaying() {
    playState = "PLAYING";
    hideCountdown();
    setToggleVisual(true);
    enableAudio();
  }

  function enterEnded() {
    playState = "ENDED";
    simTime = DURATION;
    elScrubber.value = DURATION.toFixed(3);
    hideCountdown();
    setToggleVisual(false);
    stopAllAudio();
    renderAtSimTime(simTime);
  }

  elToggle.addEventListener("click", function () {
    resumeAudio();
    if (playState === "PLAYING") {
      enterPaused();
    } else if (playState === "COUNTDOWN" || playState === "REFIRE_HOLD") {
      simTime = 0.0;
      elScrubber.value = "0";
      enterPaused();
      renderAtSimTime(0.0);
    } else if (playState === "PAUSED") {
      enterPlaying();
    } else if (playState === "ENDED") {
      simTime = 0.0;
      elScrubber.value = "0";
      renderAtSimTime(0.0);
      enterPlaying();
    }
  });

  elRefire.addEventListener("click", function () {
    resumeAudio();
    hideCountdown();
    stopAllAudio();
    simTime = 0.0;
    elScrubber.value = "0";
    holdElapsed = 0.0;
    countdownElapsed = 0.0;
    playState = "REFIRE_HOLD";
    setToggleVisual(true);
    renderAtSimTime(0.0);
  });

  speedPills.forEach(function (pill) {
    pill.addEventListener("click", function () {
      const spd = parseFloat(pill.getAttribute("data-speed"));
      if (!isNaN(spd) && spd > 0) playbackSpeed = spd;
      speedPills.forEach(function (other) {
        const active = other === pill;
        other.classList.toggle("is-active", active);
        other.setAttribute("aria-checked", active ? "true" : "false");
      });
    });
  });

  elScrubber.addEventListener("input", function () {
    const val = parseFloat(elScrubber.value);
    simTime = isNaN(val) ? 0.0 : Math.max(0.0, Math.min(DURATION, val));
    enterPaused();
    renderAtSimTime(simTime);
  });

  window.addEventListener("resize", function () {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    renderer.setPixelRatio(dpr);
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    rtWidth = Math.max(1, Math.floor(window.innerWidth * dpr));
    rtHeight = Math.max(1, Math.floor(window.innerHeight * dpr));
    sceneRT.setSize(rtWidth, rtHeight);
    fitCamera();
    renderAtSimTime(simTime);
  });

  // Initial layout & resting frame at simTime = 0.000 BEFORE countdown starts
  fitCamera();
  showCountdownDigit("3");
  setToggleVisual(true);
  elScrubber.value = "0";
  renderAtSimTime(0.0);

  function frameLoop(nowMs) {
    requestAnimationFrame(frameLoop);

    if (lastFrameMs === null) {
      lastFrameMs = nowMs;
      if (playState === "COUNTDOWN" && !countdownStarted) {
        countdownStarted = true;
        countdownElapsed = 0.0;
        showCountdownDigit("3");
        renderAtSimTime(0.0);
      }
      return;
    }

    const rawDt = Math.max(0, (nowMs - lastFrameMs) * 0.001);
    lastFrameMs = nowMs;
    const dt = Math.min(rawDt, 0.1);

    if (playState === "COUNTDOWN") {
      countdownElapsed += dt;
      if (countdownElapsed < 1.0) {
        showCountdownDigit("3");
      } else if (countdownElapsed < 2.0) {
        showCountdownDigit("2");
      } else if (countdownElapsed < 3.0) {
        showCountdownDigit("1");
      } else {
        enterPlaying();
        const over = (countdownElapsed - 3.0) * playbackSpeed;
        const prevT = simTime;
        simTime = Math.min(DURATION, over);
        elScrubber.value = simTime.toFixed(3);
        triggerForwardAudio(prevT, simTime);
        renderAtSimTime(simTime);
        return;
      }
      simTime = 0.0;
      elScrubber.value = "0";
      renderAtSimTime(0.0);
    } else if (playState === "REFIRE_HOLD") {
      hideCountdown();
      holdElapsed += dt;
      if (holdElapsed >= 1.0) {
        enterPlaying();
        const over = (holdElapsed - 1.0) * playbackSpeed;
        const prevT = simTime;
        simTime = Math.min(DURATION, over);
        elScrubber.value = simTime.toFixed(3);
        triggerForwardAudio(prevT, simTime);
        renderAtSimTime(simTime);
        return;
      }
      simTime = 0.0;
      elScrubber.value = "0";
      renderAtSimTime(0.0);
    } else if (playState === "PLAYING") {
      const prevT = simTime;
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      elScrubber.value = simTime.toFixed(3);
      triggerForwardAudio(prevT, simTime);
      if (simTime >= DURATION) {
        enterEnded();
      } else {
        renderAtSimTime(simTime);
      }
    } else {
      // PAUSED or ENDED: hold deterministic frame cleanly
      renderAtSimTime(simTime);
    }
  }

  requestAnimationFrame(frameLoop);
})();
</script>
</body>
</html>
