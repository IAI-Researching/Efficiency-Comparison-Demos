<script id="rampart-strategy">
function createStrategy() {
  const COST = { bolt: 50, cannon: 90, frost: 70, lance: 120, flak: 80 };
  const DMG = {
    bolt:   [0, 26, 41, 65],
    cannon: [0, 60, 96, 153],
    frost:  [0, 10, 16, 25],
    lance:  [0, 180, 288, 460],
    flak:   [0, 40, 64, 102]
  };
  const LEAK = {
    grunt: 1, runner: 1, wisp: 2, brute: 3, splitter: 2, mender: 2, splitling: 1
  };
  // Optimal 16-slot composition: 9 Cannons (dense ground AoE), 6 Flaks (full air lane AoE), 1 Lance (armor-pierce / mender sniper)
  const BOARD = [
    "flak", "lance", "flak", "cannon", "cannon", "cannon", "cannon", "cannon",
    "cannon", "cannon", "flak", "cannon", "flak", "cannon", "flak", "flak"
  ];
  // Build & upgrade priority ordered by path coverage and defensive impact
  const PRIO = [4, 8, 12, 3, 6, 13, 14, 11, 10, 1, 7, 5, 9, 2, 15, 0];
  const BANK_CAP = 1000;
  const BREAK_WAVE = 30;

  let lastHp = 10;

  return {
    plan(state) {
      const actions = [];
      let g = state.gold;
      const w = state.wave;
      const cur = new Array(16);
      for (let i = 0; i < 16; i++) {
        const t = state.slots[i].turret;
        cur[i] = t ? { type: t.type, tier: t.tier, spent: t.spent } : null;
      }
      const leaked = state.baseHp < lastHp;
      lastHp = state.baseHp;

      function tryBuild(sl, type) {
        const c = COST[type];
        if (cur[sl] || g < c || actions.length >= 32) return false;
        actions.push({ op: "build", slot: sl, type: type });
        g -= c;
        cur[sl] = { type: type, tier: 1, spent: c };
        return true;
      }

      function tryUpgrade(sl) {
        const t = cur[sl];
        if (!t || t.tier >= 3 || actions.length >= 32) return false;
        const up = t.tier === 1 ? COST[t.type] : COST[t.type] * 2;
        if (g < up) return false;
        actions.push({ op: "upgrade", slot: sl });
        g -= up;
        t.tier += 1;
        t.spent += up;
        return true;
      }

      function trySell(sl) {
        const t = cur[sl];
        if (!t || actions.length >= 32) return false;
        actions.push({ op: "sell", slot: sl });
        g += Math.floor(t.spent * 70 / 100);
        cur[sl] = null;
        return true;
      }

      // Wave 1 lean opener: strong central Cannon + backline Bolt (covers early runners & air while banking interest)
      if (w === 1) {
        tryBuild(4, "cannon");
        tryBuild(12, "bolt");
        return actions;
      }

      // Live threat evaluation
      let maxProgG = 0, maxProgA = 0, minEtaG = 999, minEtaA = 999, cntA = 0;
      for (let i = 0; i < state.enemies.length; i++) {
        const e = state.enemies[i];
        const effSpd = e.slowed > 0 ? Math.floor(e.speed * 60 / 100) : e.speed;
        const eta = e.remaining / (effSpd > 0 ? effSpd : 1);
        if (e.air) {
          cntA++;
          const p = 2800 - e.remaining;
          if (p > maxProgA) maxProgA = p;
          if (eta < minEtaA) minEtaA = eta;
        } else {
          const p = 4600 - e.remaining;
          if (p > maxProgG) maxProgG = p;
          if (eta < minEtaG) minEtaG = eta;
        }
      }
      let nextAirCount = 0;
      for (let i = 0; i < state.nextWave.length; i++) {
        if (state.nextWave[i] === "wisp") nextAirCount++;
      }

      const dangerG = (minEtaG < 115) || (maxProgG > 3150);
      const dangerA = (minEtaA < 100) || (maxProgA > 1650);
      const danger = dangerG || dangerA || leaked;

      // Interest-banking reserve policy: hold up to 1000g for +50g/wave interest while safe,
      // dipping cleanly when pressure mounts and releasing fully at BREAK_WAVE.
      let reserve = 0;
      if (w < BREAK_WAVE) {
        if (!danger) {
          reserve = BANK_CAP;
        } else if (w < 20) {
          reserve = Math.max(0, Math.min(BANK_CAP, g - 180));
        } else {
          reserve = Math.max(0, Math.min(BANK_CAP, g - 360));
        }
      }

      // Proactive anti-air hardening
      if ((cntA > 0 && minEtaA < 115) || (w === 2 && nextAirCount > 0)) {
        if (!cur[12]) {
          tryBuild(12, "flak");
        } else if (cur[12].type === "bolt" && w >= 5 && g >= 100) {
          trySell(12);
          tryBuild(12, "flak");
        } else if (cur[12].type === "flak" && cur[12].tier === 1 && minEtaA < 105 && g >= 80) {
          tryUpgrade(12);
        } else if (dangerA && !cur[14] && g >= 80) {
          tryBuild(14, "flak");
        }
      }

      // Proactive ground reinforcement against early runners/clumps
      if (dangerG && w < 26) {
        const coreG = [4, 8, 13, 3, 6];
        for (let i = 0; i < coreG.length; i++) {
          const sl = coreG[i];
          const tp = BOARD[sl];
          if (tp === "flak") continue;
          if (!cur[sl] && g >= COST[tp]) { tryBuild(sl, tp); break; }
          if (cur[sl] && cur[sl].type === tp && cur[sl].tier < 2 && g >= COST[tp]) { tryUpgrade(sl); break; }
        }
      }

      // Transition opener Bolt on slot 12 to Flak
      if (cur[12] && cur[12].type === "bolt" && BOARD[12] !== "bolt" && (w >= 10 || g >= BANK_CAP + 100)) {
        const ref = Math.floor(cur[12].spent * 70 / 100);
        if (g + ref - COST[BOARD[12]] >= reserve) {
          trySell(12);
          tryBuild(12, BOARD[12]);
        }
      }

      // Tier-by-tier expansion across all 16 slots above reserve
      for (let pTier = 1; pTier <= 3; pTier++) {
        for (let i = 0; i < PRIO.length; i++) {
          const sl = PRIO[i];
          const tp = BOARD[sl];
          if (tp === "flak" && w < 2) continue;
          const t = cur[sl];
          if (!t) {
            if (g - COST[tp] >= reserve) tryBuild(sl, tp);
            else return actions;
          } else if (t.type === tp && t.tier < pTier) {
            const up = t.tier === 1 ? COST[tp] : COST[tp] * 2;
            if (g - up >= reserve) tryUpgrade(sl);
            else return actions;
          }
        }
      }

      return actions;
    },

    target(turret, cands) {
      const n = cands.length;
      if (n === 1) return cands[0].id;
      const type = turret.type;
      const dmg = DMG[type][turret.tier];

      if (type === "cannon" || type === "flak") {
        const sr2 = type === "cannon" ? 8100 : 4900;
        const isBack = (turret.slot === 13 || turret.slot === 12 || turret.slot === 14);
        const backMult = isBack ? 1.5 : 1.0;

        let best = cands[0];
        let bestScore = -1e18;
        for (let i = 0; i < n; i++) {
          const a = cands[i];
          let val = 0;
          for (let j = 0; j < n; j++) {
            const b = cands[j];
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            if (dx * dx + dy * dy <= sr2) {
              const rawDmg = dmg > b.armor ? (dmg - b.armor) : 1;
              const eff = b.hp < rawDmg ? b.hp : rawDmg;
              const effSpd = b.slowed > 0 ? Math.floor(b.speed * 60 / 100) : b.speed;
              const eta = b.remaining / (effSpd > 0 ? effSpd : 1);

              // Doomed-leaker gate: avoid wasting splash shots on unkillable enemies inches from exit
              const maxDps = b.air ? 22 : 26;
              if (eta < 25 && b.hp > rawDmg + eta * maxDps) {
                val += eff * 0.1;
                continue;
              }

              // Flat kill-save bonus: finishing an imminent leaker saves actual base HP
              if (b.hp <= rawDmg && eta < 55) {
                if (b.type === "splitter" && b.remaining < 180) {
                  val -= 200;
                } else {
                  const lk = LEAK[b.type] || 1;
                  val += 1200 * lk * (1.0 + (55 - eta) / 55);
                  continue;
                }
              }

              let w = 1.0;
              if (b.type === "mender") w = 2.8;
              else if (b.type === "runner") w = 2.2;
              else if (b.type === "splitter" && b.remaining < 220) w = 0.25;
              else if (b.type === "brute") w = 1.15;

              const ratio = 85 / (eta + 10);
              w *= (1.0 + ratio * ratio * backMult);
              if (eta < 70 && b.hp <= rawDmg * 2) w *= 1.5;

              val += eff * w;
            }
          }
          val += (4600 - a.remaining) * 0.002;
          if (val > bestScore) {
            bestScore = val;
            best = a;
          }
        }
        return best.id;
      }

      if (type === "lance") {
        let best = cands[0];
        let bestScore = -1e18;
        for (let i = 0; i < n; i++) {
          const e = cands[i];
          const eff = e.hp < dmg ? e.hp : dmg;
          const effSpd = e.slowed > 0 ? Math.floor(e.speed * 60 / 100) : e.speed;
          const eta = e.remaining / (effSpd > 0 ? effSpd : 1);
          if (eta < 25 && e.hp > dmg + eta * 22) {
            const scDoom = eff * 0.1;
            if (scDoom > bestScore) { bestScore = scDoom; best = e; }
            continue;
          }
          let sc = 0;
          if (e.hp <= dmg && eta < 65) {
            if (e.type === "splitter" && e.remaining < 180) sc = -200;
            else sc = 2500 * (LEAK[e.type] || 1) + (65 - eta) * 40;
          } else {
            let mult = 1.0;
            if (e.type === "mender") mult = 3.5;
            else if (e.type === "brute") mult = 2.4;
            else if (e.type === "runner") mult = 2.3;
            const ratio = 95 / (eta + 10);
            mult *= (1.0 + ratio * ratio);
            sc = eff * mult + (4600 - e.remaining) * 0.04;
          }
          if (sc > bestScore) { bestScore = sc; best = e; }
        }
        return best.id;
      }

      if (type === "frost") {
        let best = cands[0];
        let bestScore = -1e18;
        for (let i = 0; i < n; i++) {
          const e = cands[i];
          const effSpd = e.slowed > 0 ? Math.floor(e.speed * 60 / 100) : e.speed;
          const eta = e.remaining / (effSpd > 0 ? effSpd : 1);
          const slowScore = e.slowed === 0 ? 100000 : (e.slowed <= 4 ? 70000 - e.slowed * 5000 : -e.slowed * 4000);
          const typeW = e.type === "runner" ? 30000 : (e.air ? 25000 : e.speed * 900);
          const sc = slowScore + typeW + 35000 / (eta + 8);
          if (sc > bestScore) { bestScore = sc; best = e; }
        }
        return best.id;
      }

      // Bolt targeting
      let best = cands[0];
      let bestScore = -1e18;
      for (let i = 0; i < n; i++) {
        const e = cands[i];
        const rawDmg = dmg > e.armor ? (dmg - e.armor) : 1;
        const eff = e.hp < rawDmg ? e.hp : rawDmg;
        const effSpd = e.slowed > 0 ? Math.floor(e.speed * 60 / 100) : e.speed;
        const eta = e.remaining / (effSpd > 0 ? effSpd : 1);
        const ratio = 90 / (eta + 10);
        let sc = eff * (e.air ? 2.2 : (e.type === "runner" ? 1.8 : 1.0)) * (1.0 + ratio * ratio);
        if (e.hp <= rawDmg && eta < 45) sc += 1500 * (LEAK[e.type] || 1);
        if (sc > bestScore) { bestScore = sc; best = e; }
      }
      return best.id;
    }
  };
}
</script>

<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks, _recorder) {
  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return (t ^ (t >>> 14)) >>> 0;
    };
  }

  const GROUND_PTS = [
    [50, 250], [650, 250], [650, 1050], [1250, 1050],
    [1250, 350], [1850, 350], [1850, 1150], [2350, 1150]
  ];
  const AIR_PTS = [
    [50, 650], [2150, 650], [2150, 1150], [2350, 1150]
  ];

  function buildPath(pts) {
    const segs = [];
    let total = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const x0 = pts[i][0], y0 = pts[i][1];
      const x1 = pts[i + 1][0], y1 = pts[i + 1][1];
      const dx = x1 - x0, dy = y1 - y0;
      const len = Math.abs(dx) + Math.abs(dy);
      segs.push({ x0: x0, y0: y0, dx: Math.sign(dx), dy: Math.sign(dy), start: total, len: len });
      total += len;
    }
    return { segs: segs, len: total };
  }

  const GROUND_PATH = buildPath(GROUND_PTS);
  const AIR_PATH = buildPath(AIR_PTS);

  function posAlong(path, progress) {
    const segs = path.segs;
    for (let i = 0; i < segs.length; i++) {
      const s = segs[i];
      if (progress <= s.start + s.len || i === segs.length - 1) {
        const d = progress - s.start;
        return [s.x0 + s.dx * d, s.y0 + s.dy * d];
      }
    }
    return [0, 0];
  }

  const SLOTS_XY = [
    [3, 3], [5, 5], [7, 4], [7, 8], [9, 9], [10, 5], [11, 8], [13, 8],
    [14, 5], [15, 2], [16, 7], [17, 4], [19, 8], [20, 10], [22, 9], [3, 7]
  ].map(function (p) { return [p[0] * 100 + 50, p[1] * 100 + 50]; });

  const TURRET_DEF = {
    bolt:   { idx: 0, cost: 50,  dmg: 26,  period: 8,  range: 300, splash: 0,  slow: 0,  pierce: false, ground: true,  air: true  },
    cannon: { idx: 1, cost: 90,  dmg: 60,  period: 24, range: 260, splash: 90, slow: 0,  pierce: false, ground: true,  air: false },
    frost:  { idx: 2, cost: 70,  dmg: 10,  period: 12, range: 240, splash: 0,  slow: 30, pierce: false, ground: true,  air: true  },
    lance:  { idx: 3, cost: 120, dmg: 180, period: 36, range: 360, splash: 0,  slow: 0,  pierce: true,  ground: true,  air: false },
    flak:   { idx: 4, cost: 80,  dmg: 40,  period: 10, range: 320, splash: 70, slow: 0,  pierce: false, ground: false, air: true  }
  };

  const WAVE_ENEMIES = [
    { type: "grunt",    baseHp: 60,  speed: 10, bounty: 4, leak: 1, air: 0, firstWave: 1, weight: 10 },
    { type: "runner",   baseHp: 40,  speed: 20, bounty: 4, leak: 1, air: 0, firstWave: 2, weight: 4  },
    { type: "wisp",     baseHp: 50,  speed: 12, bounty: 6, leak: 2, air: 1, firstWave: 3, weight: 3  },
    { type: "brute",    baseHp: 150, speed: 6,  bounty: 9, leak: 3, air: 0, firstWave: 4, weight: 3  },
    { type: "splitter", baseHp: 90,  speed: 8,  bounty: 6, leak: 2, air: 0, firstWave: 6, weight: 2  },
    { type: "mender",   baseHp: 70,  speed: 8,  bounty: 7, leak: 2, air: 0, firstWave: 8, weight: 1  }
  ];
  const ENEMY_DEF = {};
  for (let i = 0; i < WAVE_ENEMIES.length; i++) ENEMY_DEF[WAVE_ENEMIES[i].type] = WAVE_ENEMIES[i];
  ENEMY_DEF.splitling = { type: "splitling", baseHp: 0, speed: 12, bounty: 1, leak: 1, air: 0 };

  const hpMultCache = [0, 1000];
  function getHpMult(w) {
    while (hpMultCache.length <= w) {
      const prev = hpMultCache[hpMultCache.length - 1];
      hpMultCache.push(Math.floor(prev * 108 / 100));
    }
    return hpMultCache[w];
  }

  function turretDamage(baseDmg, tier) {
    let d = baseDmg;
    for (let i = 1; i < tier; i++) d = Math.floor(d * 16 / 10);
    return d;
  }

  const rng = mulberry32(seed >>> 0);
  const strat = createStrategy();

  function genWave(w) {
    const count = 4 + Math.floor(3 * w / 5);
    const eligible = [];
    let totalW = 0;
    for (let i = 0; i < WAVE_ENEMIES.length; i++) {
      if (WAVE_ENEMIES[i].firstWave <= w) {
        eligible.push(WAVE_ENEMIES[i]);
        totalW += WAVE_ENEMIES[i].weight;
      }
    }
    const list = [];
    for (let i = 0; i < count; i++) {
      let r = rng() % totalW;
      for (let j = 0; j < eligible.length; j++) {
        r -= eligible[j].weight;
        if (r < 0) {
          list.push(eligible[j].type);
          break;
        }
      }
    }
    return list;
  }

  let gold = 250;
  let baseHp = 10;
  let currentWave = 0;
  let nextEnemyId = 1;
  let fallTick = -1;
  const log = [];
  const slots = new Array(16).fill(null);
  let enemies = [];
  let spawnQueue = [];
  const waves = {};
  waves[1] = genWave(1);

  function makeEnemyView(e) {
    return {
      id: e.id,
      type: e.type,
      hp: e.hp,
      maxHp: e.maxHp,
      x: e.x,
      y: e.y,
      air: e.air,
      armor: e.armor,
      speed: e.speed,
      slowed: e.slow,
      remaining: e.routeLen - e.progress
    };
  }

  const rec = typeof _recorder === "object" && _recorder !== null ? _recorder : null;

  for (let tick = 0; tick < maxTicks; tick++) {
    // 1. Wave start
    if (tick >= 20 && (tick - 20) % 40 === 0) {
      const w = ((tick - 20) / 40) + 1;
      currentWave = w;
      gold += Math.min(50, Math.floor(gold * 5 / 100)) + 10 + 2 * w;
      waves[w + 1] = genWave(w + 1);
      if (rec && rec.onWave) rec.onWave(tick, w, waves[w + 1]);

      const state = {
        tick: tick,
        wave: w,
        gold: gold,
        baseHp: baseHp,
        slots: SLOTS_XY.map(function (xy, idx) {
          return {
            slot: idx,
            x: xy[0],
            y: xy[1],
            turret: slots[idx] ? { type: slots[idx].type, tier: slots[idx].tier, spent: slots[idx].spent } : null
          };
        }),
        enemies: enemies.map(makeEnemyView),
        nextWave: waves[w + 1].slice()
      };

      const actions = strat.plan(state);
      if (Array.isArray(actions)) {
        const limit = Math.min(32, actions.length);
        for (let i = 0; i < limit; i++) {
          const act = actions[i];
          if (!act || typeof act !== "object") continue;
          const sl = act.slot;
          if (!Number.isInteger(sl) || sl < 0 || sl >= 16) continue;
          if (act.op === "build") {
            const def = TURRET_DEF[act.type];
            if (!def || slots[sl] !== null || gold < def.cost) continue;
            gold -= def.cost;
            slots[sl] = {
              slot: sl,
              type: act.type,
              tier: 1,
              spent: def.cost,
              dmg: def.dmg,
              period: def.period,
              range: def.range,
              splash: def.splash,
              slow: def.slow,
              pierce: def.pierce,
              ground: def.ground,
              air: def.air,
              cd: 0,
              x: SLOTS_XY[sl][0],
              y: SLOTS_XY[sl][1]
            };
            log.push([tick, "B", sl, def.idx]);
            if (rec && rec.onBuild) rec.onBuild(tick, sl, act.type);
          } else if (act.op === "upgrade") {
            const t = slots[sl];
            if (!t || t.tier >= 3) continue;
            const def = TURRET_DEF[t.type];
            const upCost = t.tier === 1 ? def.cost : def.cost * 2;
            if (gold < upCost) continue;
            gold -= upCost;
            t.tier += 1;
            t.spent += upCost;
            t.dmg = turretDamage(def.dmg, t.tier);
            t.range = def.range + (t.tier - 1) * 30;
            log.push([tick, "U", sl, t.tier]);
            if (rec && rec.onUpgrade) rec.onUpgrade(tick, sl, t.tier, t.type);
          } else if (act.op === "sell") {
            const t = slots[sl];
            if (!t) continue;
            const soldType = t.type;
            gold += Math.floor(t.spent * 70 / 100);
            slots[sl] = null;
            log.push([tick, "S", sl, 0]);
            if (rec && rec.onSell) rec.onSell(tick, sl, soldType);
          }
        }
      }

      const curWave = waves[w];
      for (let i = 0; i < curWave.length; i++) {
        spawnQueue.push({ tick: tick + 4 * i, wave: w, idx: i, type: curWave[i] });
      }
      spawnQueue.sort(function (a, b) {
        return (a.tick - b.tick) || (a.wave - b.wave) || (a.idx - b.idx);
      });
    }

    // 2. Spawn
    let sqStart = 0;
    while (sqStart < spawnQueue.length && spawnQueue[sqStart].tick === tick) {
      const sq = spawnQueue[sqStart++];
      const def = ENEMY_DEF[sq.type];
      const maxHp = Math.floor(def.baseHp * getHpMult(sq.wave) / 1000);
      let armor = 0;
      if (sq.type === "grunt") armor = Math.floor(sq.wave / 4);
      else if (sq.type === "brute") armor = 6 + sq.wave;
      const path = def.air ? AIR_PATH : GROUND_PATH;
      const pos = posAlong(path, 0);
      enemies.push({
        id: nextEnemyId++,
        type: sq.type,
        wave: sq.wave,
        hp: maxHp,
        maxHp: maxHp,
        speed: def.speed,
        armor: armor,
        bounty: def.bounty,
        leak: def.leak,
        air: def.air,
        path: path,
        routeLen: path.len,
        progress: 0,
        x: pos[0],
        y: pos[1],
        age: 0,
        slow: 0
      });
    }
    if (sqStart > 0) spawnQueue = spawnQueue.slice(sqStart);

    // 3. Move
    let fell = false;
    const afterMove = [];
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      const step = e.slow > 0 ? Math.floor(e.speed * 60 / 100) : e.speed;
      e.progress += step;
      if (e.progress >= e.routeLen) {
        const prevHp = baseHp;
        baseHp -= e.leak;
        log.push([tick, "L", e.id, baseHp]);
        if (rec && rec.onLeak) rec.onLeak(tick, e.id, e.type, e.air, prevHp, baseHp);
        if (baseHp <= 0) {
          log.push([tick, "F", currentWave, 0]);
          fallTick = tick;
          fell = true;
          if (rec && rec.onFall) rec.onFall(tick, currentWave);
          break;
        }
      } else {
        const pos = posAlong(e.path, e.progress);
        e.x = pos[0];
        e.y = pos[1];
        afterMove.push(e);
      }
    }
    if (fell) {
      if (rec && rec.onTick) rec.onTick(tick, currentWave, gold, Math.max(0, baseHp), slots, afterMove, waves[currentWave + 1] || waves[1]);
      break;
    }
    enemies = afterMove;

    // 4. Age & heal
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      e.age += 1;
      if (e.type === "mender" && e.age % 20 === 0) {
        if (rec && rec.onHeal) rec.onHeal(tick, e.x, e.y);
        for (let j = 0; j < enemies.length; j++) {
          const o = enemies[j];
          const dx = o.x - e.x, dy = o.y - e.y;
          if (dx * dx + dy * dy <= 22500) {
            const heal = Math.floor(o.maxHp * 8 / 100);
            o.hp = Math.min(o.maxHp, o.hp + heal);
          }
        }
      }
    }

    // 5. Turrets fire
    for (let sl = 0; sl < 16; sl++) {
      const t = slots[sl];
      if (!t) continue;
      if (t.cd > 0) {
        t.cd -= 1;
        if (t.cd > 0) continue;
      }
      const r2 = t.range * t.range;
      const cands = [];
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (e.air ? !t.air : !t.ground) continue;
        const dx = e.x - t.x, dy = e.y - t.y;
        if (dx * dx + dy * dy <= r2) cands.push(e);
      }
      if (cands.length === 0) continue;

      let chosen = null;
      if (typeof strat.target === "function") {
        const tView = { slot: t.slot, type: t.type, tier: t.tier, x: t.x, y: t.y, range: t.range };
        const cViews = cands.map(makeEnemyView);
        const pickedId = strat.target(tView, cViews);
        for (let i = 0; i < cands.length; i++) {
          if (cands[i].id === pickedId) { chosen = cands[i]; break; }
        }
      }
      if (!chosen) {
        chosen = cands[0];
        let bestRem = chosen.routeLen - chosen.progress;
        for (let i = 1; i < cands.length; i++) {
          const rem = cands[i].routeLen - cands[i].progress;
          if (rem < bestRem) {
            bestRem = rem;
            chosen = cands[i];
          }
        }
      }

      if (rec && rec.onShot) rec.onShot(tick, sl, t.type, t.tier, t.x, t.y, chosen.x, chosen.y, chosen.air, t.splash);

      if (t.splash > 0) {
        const sr2 = t.splash * t.splash;
        const tx = chosen.x, ty = chosen.y;
        for (let i = 0; i < enemies.length; i++) {
          const e = enemies[i];
          if (e.air ? !t.air : !t.ground) continue;
          const dx = e.x - tx, dy = e.y - ty;
          if (dx * dx + dy * dy <= sr2) {
            const dmg = t.pierce ? t.dmg : Math.max(1, t.dmg - e.armor);
            e.hp -= dmg;
            if (t.slow > 0) e.slow = t.slow;
          }
        }
      } else {
        const dmg = t.pierce ? t.dmg : Math.max(1, t.dmg - chosen.armor);
        chosen.hp -= dmg;
        if (t.slow > 0) chosen.slow = t.slow;
      }
      t.cd = t.period;

      let anyDead = false;
      for (let i = 0; i < enemies.length; i++) {
        if (enemies[i].hp <= 0) { anyDead = true; break; }
      }
      if (anyDead) {
        const survivors = [];
        const spawned = [];
        for (let i = 0; i < enemies.length; i++) {
          const e = enemies[i];
          if (e.hp <= 0) {
            gold += e.bounty;
            log.push([tick, "K", e.id, sl]);
            if (rec && rec.onKill) rec.onKill(tick, e.id, e.type, e.x, e.y, e.air);
            if (e.type === "splitter") {
              const shp = Math.max(1, Math.floor(e.maxHp / 4));
              const pos = posAlong(GROUND_PATH, e.progress);
              for (let k = 0; k < 3; k++) {
                spawned.push({
                  id: nextEnemyId++,
                  type: "splitling",
                  wave: e.wave,
                  hp: shp,
                  maxHp: shp,
                  speed: 12,
                  armor: 0,
                  bounty: 1,
                  leak: 1,
                  air: 0,
                  path: GROUND_PATH,
                  routeLen: GROUND_PATH.len,
                  progress: e.progress,
                  x: pos[0],
                  y: pos[1],
                  age: 0,
                  slow: 0
                });
              }
            }
          } else {
            survivors.push(e);
          }
        }
        for (let k = 0; k < spawned.length; k++) survivors.push(spawned[k]);
        enemies = survivors;
      }
    }

    // 6. Slow timers
    for (let i = 0; i < enemies.length; i++) {
      if (enemies[i].slow > 0) enemies[i].slow -= 1;
    }

    if (rec && rec.onTick) {
      rec.onTick(tick, currentWave, gold, baseHp, slots, enemies, waves[currentWave + 1] || waves[1]);
    }
  }

  const endTick = fallTick >= 0 ? fallTick : maxTicks;
  const score = Math.round(((endTick - 20) / 40) * 100) / 100;
  const s = JSON.stringify(log);
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  const hash = (h >>> 0).toString(16).padStart(8, "0");
  return { score: score, fallTick: fallTick, log: log, hash: hash };
}

<script>
(function () {
  "use strict";

  const DURATION = 100;

  const MAX_REPLAY_TICKS = 2020;

  // Deterministic PRNG helper for visuals (seed 42) and audio (seed 4242)
  function makeRng(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Board definitions (matching section 2.1 exactly)
  const GROUND_WAYPOINTS = [
    [0, 2], [6, 2], [6, 10], [12, 10], [12, 3], [18, 3], [18, 11], [23, 11]
  ];
  const AIR_WAYPOINTS = [
    [0, 6], [21, 6], [21, 11], [23, 11]
  ];
  const SLOT_TILES = [
    [3, 3], [5, 5], [7, 4], [7, 8], [9, 9], [10, 5], [11, 8], [13, 8],
    [14, 5], [15, 2], [16, 7], [17, 4], [19, 8], [20, 10], [22, 9], [3, 7]
  ];

  const ENEMY_TYPES = ["grunt", "runner", "wisp", "brute", "splitter", "splitling", "mender"];
  const ENEMY_TYPE_IDX = { grunt: 0, runner: 1, wisp: 2, brute: 3, splitter: 4, splitling: 5, mender: 6 };
  const ENEMY_COLORS = {
    grunt:     0x72916f,
    runner:    0xf7d636,
    wisp:      0x34f0ff,
    brute:     0x323947,
    splitter:  0xa44aff,
    splitling: 0xd07bff,
    mender:    0xf2f7fc
  };
  const TURRET_TYPES = ["bolt", "cannon", "frost", "lance", "flak"];
  const TURRET_TYPE_IDX = { bolt: 0, cannon: 1, frost: 2, lance: 3, flak: 4 };
  const TURRET_COLORS = {
    bolt:   0x5b9dd9,
    cannon: 0xcf843c,
    frost:  0xd8f4ff,
    lance:  0xdc283c,
    flak:   0x20bfae
  };

  // =========================================================================
  // 1. PRECOMPUTE DETERMINISTIC REPLAY ON SEED 42 USING rampartSimulate()
  // =========================================================================
  const ticks = new Array(MAX_REPLAY_TICKS);
  const shots = [];       // { t, tick, slot, type, tier, x0, z0, x1, z1, air, splash }
  const kills = [];       // { t, tick, id, type, x, z, air, seed }
  const heals = [];       // { t, tick, x, z }
  const leaks = [];       // { t, tick, id, type, air, prevHp, newHp }
  const slotEvents = [];  // { t, tick, kind, slot, type, tier }
  const waveEvents = [];  // { t, tick, wave }
  const traumaEvents = []; // { t, add, level }
  const turretAimHistory = []; // per slot array of { t, angle }
  for (let i = 0; i < 16; i++) turretAimHistory.push([]);

  let fallEvent = null;
  let killSeedCounter = 1;
  let lastRecordedTick = -1;

  function addTraumaEvent(timeSec, addAmount) {
    let prevLevel = 0;
    if (traumaEvents.length > 0) {
      const prev = traumaEvents[traumaEvents.length - 1];
      prevLevel = Math.max(0, prev.level - (timeSec - prev.t));
    }
    const level = Math.min(1, prevLevel + addAmount);
    traumaEvents.push({ t: timeSec, add: addAmount, level: level });
  }

  function getTraumaAt(simTime) {
    if (traumaEvents.length === 0) return 0;
    // Binary search last traumaEvent with t <= simTime
    let lo = 0, hi = traumaEvents.length - 1, idx = -1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (traumaEvents[mid].t <= simTime) { idx = mid; lo = mid + 1; }
      else hi = mid - 1;
    }
    if (idx < 0) return 0;
    const ev = traumaEvents[idx];
    return Math.max(0, ev.level - (simTime - ev.t));
  }

    const c = [0, 0, 0, 0, 0, 0, 0];
    if (!list) return c;
    for (let i = 0; i < list.length; i++) {
      const k = ENEMY_TYPE_IDX[list[i]];
      if (k !== undefined) c[k]++;

    onWave(tick, wave) {

      slotEvents.push({ t: tick / TICKS_PER_SEC, tick: tick, kind: "B", slot: slot, type: type, tier: 1 });

    onUpgrade(tick, slot, tier, type) {
      slotEvents.push({ t: tick / TICKS_PER_SEC, tick: tick, kind: "U", slot: slot, type: type, tier: tier });

    onSell(tick, slot, type) {
      slotEvents.push({ t: tick / TICKS_PER_SEC, tick: tick, kind: "S", slot: slot, type: type, tier: 0 });

    onShot(tick, slot, type, tier, x0, y0, x1, y1, air, splash) {
      const t = tick / TICKS_PER_SEC;

        t: tick / TICKS_PER_SEC, tick: tick, id: id, type: type,

      });
    },
    onHeal(tick, x, y) {
      heals.push({ t: tick / TICKS_PER_SEC, tick: tick, x: x / 100, z: y / 100 });

      const t = tick / TICKS_PER_SEC;
      leaks.push({ t: t, tick: tick, id: id, type: type, air: air, prevHp: prevHp, newHp: newHp });
      addTraumaEvent(t, 0.3);
    },
    onFall(tick, wave) {
      const t = tick / TICKS_PER_SEC;
      fallEvent = { t: t, tick: tick, wave: wave };
      addTraumaEvent(t, 1.0);
    },
    onTick(tick, wave, gold, baseHp, slotsArr, enemiesArr, nextWaveArr) {
      lastRecordedTick = tick;
      const sSnap = new Array(16);
      for (let i = 0; i < 16; i++) {
        const sl = slotsArr[i];
        sSnap[i] = sl ? ((TURRET_TYPE_IDX[sl.type] << 2) | sl.tier) : -1;
      }
      const eCount = enemiesArr.length;
      const eIds = new Int32Array(eCount);
      const eTypes = new Uint8Array(eCount);
      const eX = new Float32Array(eCount);
      const eZ = new Float32Array(eCount);
      const eHp = new Float32Array(eCount);
      const eMaxHp = new Float32Array(eCount);
      const eSlow = new Uint8Array(eCount);
      const eAir = new Uint8Array(eCount);
      const eMap = new Map();
      for (let i = 0; i < eCount; i++) {
        const e = enemiesArr[i];
        eIds[i] = e.id;
        eTypes[i] = ENEMY_TYPE_IDX[e.type];
        eX[i] = e.x / 100;
        eZ[i] = e.y / 100;
        eHp[i] = e.hp;
        eMaxHp[i] = e.maxHp;
        eSlow[i] = e.slow > 0 ? 1 : 0;
        eAir[i] = e.air ? 1 : 0;
        eMap.set(e.id, i);
      }
      ticks[tick] = {
        wave: wave,
        gold: gold,
        baseHp: baseHp,
        slots: sSnap,
        nextCounts: countWaveTypes(nextWaveArr),
        eCount: eCount,
        eIds: eIds,
        eTypes: eTypes,
        eX: eX,
        eZ: eZ,
        eHp: eHp,
        eMaxHp: eMaxHp,
        eSlow: eSlow,
        eAir: eAir,
        eMap: eMap
      };
    }
  };

  const simResult = rampartSimulate(createStrategy, 42, MAX_REPLAY_TICKS, recorder);
  const fallTime = fallEvent ? fallEvent.t : Infinity;
  const freezeTick = fallEvent ? fallEvent.tick : (MAX_REPLAY_TICKS - 1);

  // Fill remaining ticks after fall with frozen final snapshot
  if (lastRecordedTick >= 0 && lastRecordedTick < MAX_REPLAY_TICKS - 1) {
    const finalSnap = ticks[lastRecordedTick];
    for (let t = lastRecordedTick + 1; t < MAX_REPLAY_TICKS; t++) {
      ticks[t] = finalSnap;

  // Precompute wall chunk leak trigger time for each of the 10 keep HP chunks (index 0..9 -> HP 10->9 .. 1->0)

    strategy: {

      seedsTested: 50,

    },

  };

  // =========================================================================
  // 2. THREE.JS SCENE, RENDER TARGET (FOR FALL DESATURATION) & CAMERA FRAMING
  // =========================================================================
  const canvas = document.getElementById("stage");
  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true, powerPreference: "high-performance" });
  renderer.outputEncoding = THREE.sRGBEncoding;

  keyLight.position.set(22, 24, 18);

  keyLight.castShadow = true;
  keyLight.shadow.mapSize.width = 2048;
  keyLight.shadow.mapSize.height = 2048;
  keyLight.shadow.camera.near = 4;
  keyLight.shadow.camera.far = 65;
  keyLight.shadow.camera.left = -16;
  keyLight.shadow.camera.right = 16;
  keyLight.shadow.camera.top = 12;
  keyLight.shadow.camera.bottom = -12;
  keyLight.shadow.bias = -0.0005;
  scene.add(keyLight);
  scene.add(keyLight.target);

  const rimLight = new THREE.DirectionalLight(0x5288d8, 0.55);
  rimLight.position.set(-8, 14, -6);
  scene.add(rimLight);

  // Camera: fixed perspective ~55 deg above horizon, auto-framed cleanly on resize
  const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 500);
  const baseCamPos = new THREE.Vector3();
  const baseCamTarget = new THREE.Vector3(12, 0, 7.55);

  const BOARD_CORNERS = [
    new THREE.Vector3(-0.65, 0.0, -0.65),
    new THREE.Vector3(24.65, 0.0, -0.65),
    new THREE.Vector3(-0.65, 0.0, 14.65),
    new THREE.Vector3(24.65, 0.0, 14.65),
    new THREE.Vector3(-0.65, 1.8, -0.65),
    new THREE.Vector3(24.65, 1.8, -0.65),
    new THREE.Vector3(-0.65, 1.8, 14.65),
    new THREE.Vector3(24.65, 1.8, 14.65)
  ];

  // Offscreen RenderTarget for smooth post-fall desaturation while preserving transparent backdrop
  let rtWidth = Math.max(1, Math.floor(window.innerWidth * renderer.getPixelRatio()));
  let rtHeight = Math.max(1, Math.floor(window.innerHeight * renderer.getPixelRatio()));
  const sceneRT = new THREE.WebGLRenderTarget(rtWidth, rtHeight, {
    minFilter: THREE.LinearFilter,
    magFilter: THREE.LinearFilter,
    format: THREE.RGBAFormat
  });
  const postScene = new THREE.Scene();
  const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const postMat = new THREE.ShaderMaterial({
    transparent: true,
    depthTest: false,
    depthWrite: false,
    uniforms: {
      tDiffuse: { value: sceneRT.texture },
      uDesat: { value: 0.0 }
    },
    vertexShader: [
      "varying vec2 vUv;",
      "void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }"
    ].join("\n"),
    fragmentShader: [
      "uniform sampler2D tDiffuse;",
      "uniform float uDesat;",
      "varying vec2 vUv;",
      "vec3 acesFilm(vec3 x) {",
      "  x *= 1.15 / 0.6;",
      "  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);",
      "}",
      "void main() {",
      "  vec4 c = texture2D(tDiffuse, vUv);",
      "  vec3 mapped = pow(acesFilm(c.rgb), vec3(1.0 / 2.2));",
      "  float luma = dot(mapped, vec3(0.299, 0.587, 0.114));",
      "  vec3 gray = vec3(luma) * 0.90;",
      "  gl_FragColor = vec4(mix(mapped, gray, uDesat), c.a);",
      "}"
    ].join("\n")
  });
  const postQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat);
  postScene.add(postQuad);

  function fitCamera() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    camera.aspect = w / Math.max(1, h);
    camera.updateProjectionMatrix();

    // Reserve bottom 94px for dock and top 18px safety margin
    const bottomNdc = -1.0 + (2.0 * 96) / Math.max(200, h);
    const topNdc = 0.94;
    const sideNdc = 0.95;

    // Slight vertical shift of look-at so the board centers in the usable region above the dock
    const elevRad = 55 * Math.PI / 180;
    const cosE = Math.cos(elevRad);
    const sinE = Math.sin(elevRad);

    // Target slightly toward +Z so board sits slightly higher, clearing bottom 90px dock
    const shiftZ = h < 720 ? 0.95 : 0.72;
    baseCamTarget.set(12.0, 0.0, 7.0 + shiftZ);

    let lo = 14, hi = 60;
    const tmp = new THREE.Vector3();
    for (let iter = 0; iter < 16; iter++) {
      const mid = 0.5 * (lo + hi);
      camera.position.set(baseCamTarget.x, mid * sinE, baseCamTarget.z + mid * cosE);
      camera.lookAt(baseCamTarget);
      camera.updateMatrixWorld(true);
      let fits = true;
      for (let i = 0; i < BOARD_CORNERS.length; i++) {
        tmp.copy(BOARD_CORNERS[i]).project(camera);
        if (tmp.x < -sideNdc || tmp.x > sideNdc || tmp.y < bottomNdc || tmp.y > topNdc) {
          fits = false;
          break;
        }
      }
      if (fits) hi = mid;
      else lo = mid;
    }
    const finalDist = hi * 1.01;
    baseCamPos.set(baseCamTarget.x, finalDist * sinE, baseCamTarget.z + finalDist * cosE);
    camera.position.copy(baseCamPos);
    camera.lookAt(baseCamTarget);
  }

  // =========================================================================
  // 3. PROCEDURAL BOARD TERRAIN, STONE ROAD, AIR LANE, PADS & FORTIFIED KEEP
  // =========================================================================
  const visRng = makeRng(42);

  // Build procedural board texture on a detached in-memory canvas
  function createBoardTexture() {
    const cw = 1536, ch = 896; // 64 px per tile (24x14)
    const c = document.createElement("canvas");
    c.width = cw;
    c.height = ch;
    const ctx = c.getContext("2d");

    // Base dusk rough terrain
    ctx.fillStyle = "#252a2e";
    ctx.fillRect(0, 0, cw, ch);

    // Terrain variation & subtle rocky patches
    for (let i = 0; i < 650; i++) {
      const rx = visRng() * cw;
      const ry = visRng() * ch;
      const rr = 14 + visRng() * 52;
      const shade = visRng() > 0.5 ? "rgba(56, 66, 62, 0.14)" : "rgba(18, 22, 28, 0.18)";
      ctx.fillStyle = shade;
      ctx.beginPath();
      ctx.arc(rx, ry, rr, 0, Math.PI * 2);
      ctx.fill();
    }

    // Subtle tile grid lines
    ctx.strokeStyle = "rgba(255, 255, 255, 0.035)";
    ctx.lineWidth = 1;
    for (let x = 0; x <= 24; x++) {
      ctx.beginPath(); ctx.moveTo(x * 64, 0); ctx.lineTo(x * 64, ch); ctx.stroke();
    }
    for (let y = 0; y <= 14; y++) {
      ctx.beginPath(); ctx.moveTo(0, y * 64); ctx.lineTo(cw, y * 64); ctx.stroke();
    }

    // Dark stone road along exact ground path
    ctx.lineCap = "square";
    ctx.lineJoin = "miter";

    // Outer curb border
    ctx.strokeStyle = "#4c515c";
    ctx.lineWidth = 58;
    ctx.beginPath();
    for (let i = 0; i < GROUND_WAYPOINTS.length; i++) {
      const px = (GROUND_WAYPOINTS[i][0] + 0.5) * 64;
      const py = (GROUND_WAYPOINTS[i][1] + 0.5) * 64;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();

    // Inner dark cobble bed
    ctx.strokeStyle = "#1d2028";
    ctx.lineWidth = 48;
    ctx.stroke();

    // Cobblestone flagstone blocks along each ground segment
    for (let s = 0; s < GROUND_WAYPOINTS.length - 1; s++) {
      const x0 = (GROUND_WAYPOINTS[s][0] + 0.5) * 64;
      const y0 = (GROUND_WAYPOINTS[s][1] + 0.5) * 64;
      const x1 = (GROUND_WAYPOINTS[s + 1][0] + 0.5) * 64;
      const y1 = (GROUND_WAYPOINTS[s + 1][1] + 0.5) * 64;
      const dist = Math.hypot(x1 - x0, y1 - y0);
      const steps = Math.floor(dist / 22);
      for (let k = 0; k <= steps; k++) {
        const f = k / Math.max(1, steps);
        const mx = x0 + (x1 - x0) * f;
        const my = y0 + (y1 - y0) * f;
        for (let row = -1; row <= 1; row++) {
          const ox = (x1 === x0) ? row * 14 : (visRng() - 0.5) * 4;
          const oy = (y1 === y0) ? row * 14 : (visRng() - 0.5) * 4;
          const v = 34 + Math.floor(visRng() * 14);
          ctx.fillStyle = "rgb(" + v + "," + (v + 2) + "," + (v + 7) + ")";
          ctx.fillRect(mx + ox - 7, my + oy - 6, 14, 12);
        }
      }
    }

    // Subtle ground glow projection under the air lane
    ctx.save();
    ctx.strokeStyle = "rgba(56, 232, 255, 0.14)";
    ctx.lineWidth = 12;
    ctx.setLineDash([14, 14]);
    ctx.beginPath();
    for (let i = 0; i < AIR_WAYPOINTS.length; i++) {
      const px = (AIR_WAYPOINTS[i][0] + 0.5) * 64;
      const py = (AIR_WAYPOINTS[i][1] + 0.5) * 64;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.restore();

    // Subtle spawn gate markers on left edge (ground & air entry)
    ctx.fillStyle = "rgba(255, 130, 68, 0.25)";
    ctx.fillRect(4, 2 * 64 + 8, 22, 48);
    ctx.fillStyle = "rgba(56, 240, 255, 0.28)";
    ctx.fillRect(4, 6 * 64 + 10, 22, 44);

    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    return tex;
  }

  // Board tabletop & beveled stone foundation
  const boardTex = createBoardTexture();
  const boardGeo = new THREE.PlaneGeometry(24, 14);
  boardGeo.rotateX(-Math.PI / 2);
  const boardMat = new THREE.MeshStandardMaterial({
    map: boardTex,
    roughness: 0.88,
    metalness: 0.08
  });
  const boardMesh = new THREE.Mesh(boardGeo, boardMat);
  boardMesh.position.set(12, 0, 7);
  boardMesh.receiveShadow = true;
  scene.add(boardMesh);

  // Fortified stone plinth rim beneath board
  const plinthGeo = new THREE.BoxGeometry(24.7, 0.75, 14.7);
  const plinthMat = new THREE.MeshStandardMaterial({ color: 0x1d212a, roughness: 0.9, metalness: 0.12 });
  const plinthMesh = new THREE.Mesh(plinthGeo, plinthMat);
  plinthMesh.position.set(12, -0.39, 7);
  plinthMesh.receiveShadow = true;
  scene.add(plinthMesh);

  // Subtle decorative rocky terrain outcrops on unused tiles (never overlapping road/slots/keep)
  const occupiedTiles = new Set();
  for (let s = 0; s < GROUND_WAYPOINTS.length - 1; s++) {
    const [x0, y0] = GROUND_WAYPOINTS[s];
    const [x1, y1] = GROUND_WAYPOINTS[s + 1];
    const dx = Math.sign(x1 - x0), dy = Math.sign(y1 - y0);
    let cx = x0, cy = y0;
    while (true) {
      occupiedTiles.add(cx + "," + cy);
      if (cx === x1 && cy === y1) break;
      cx += dx; cy += dy;
    }
  }
  for (let i = 0; i < SLOT_TILES.length; i++) {
    occupiedTiles.add(SLOT_TILES[i][0] + "," + SLOT_TILES[i][1]);
  }
  for (let dx = -1; dx <= 1; dx++) {
    for (let dy = -1; dy <= 1; dy++) {
      occupiedTiles.add((23 + dx) + "," + (11 + dy));
    }
  }
  const rockGeo = new THREE.DodecahedronGeometry(0.28, 0);
  const rockMat = new THREE.MeshStandardMaterial({ color: 0x353c47, roughness: 0.92, metalness: 0.05 });
  const rockMatrices = [];
  const tmpMat = new THREE.Matrix4();
  const tmpPos = new THREE.Vector3();
  const tmpQuat = new THREE.Quaternion();
  const tmpScale = new THREE.Vector3();
  const tmpEuler = new THREE.Euler();

  for (let tx = 0; tx < 24; tx++) {
    for (let ty = 0; ty < 14; ty++) {
      if (occupiedTiles.has(tx + "," + ty)) continue;
      if (visRng() < 0.24) {
        const cnt = 1 + (visRng() < 0.4 ? 1 : 0);
        for (let k = 0; k < cnt; k++) {
          const rx = tx + 0.22 + visRng() * 0.56;
          const rz = ty + 0.22 + visRng() * 0.56;
          const sc = 0.55 + visRng() * 0.75;
          tmpPos.set(rx, sc * 0.14, rz);
          tmpEuler.set(visRng() * 3, visRng() * 3, visRng() * 3);
          tmpQuat.setFromEuler(tmpEuler);
          tmpScale.set(sc * (0.9 + visRng() * 0.4), sc * (0.55 + visRng() * 0.35), sc * (0.9 + visRng() * 0.4));
          tmpMat.compose(tmpPos, tmpQuat, tmpScale);
          rockMatrices.push(tmpMat.clone());
        }
      }
    }
  }
  const rockInst = new THREE.InstancedMesh(rockGeo, rockMat, rockMatrices.length);
  rockInst.castShadow = true;
  rockInst.receiveShadow = true;
  for (let i = 0; i < rockMatrices.length; i++) rockInst.setMatrixAt(i, rockMatrices[i]);
  rockInst.instanceMatrix.needsUpdate = true;
  scene.add(rockInst);

  // Subtle low entrance portal arch at ground start (0,2)
  const gateGroup = new THREE.Group();
  const gateMat = new THREE.MeshStandardMaterial({ color: 0x3d4350, roughness: 0.85, metalness: 0.2 });
  const gp1 = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.72, 0.18), gateMat);
  gp1.position.set(0.12, 0.36, 2.05);
  const gp2 = gp1.clone();
  gp2.position.set(0.12, 0.36, 2.95);
  const gTop = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.16, 1.12), gateMat);
  gTop.position.set(0.12, 0.76, 2.5);
  gateGroup.add(gp1, gp2, gTop);
  scene.add(gateGroup);

  // Glowing Air Lane ribbon at y = 0.78 + animated chevron beacons
  const airRibbonGroup = new THREE.Group();
  const airMat = new THREE.MeshBasicMaterial({
    color: 0x3cf0ff,
    transparent: true,
    opacity: 0.18,
    side: THREE.DoubleSide,
    depthWrite: false
  });
  const airEdgeMat = new THREE.MeshBasicMaterial({
    color: 0x7df8ff,
    transparent: true,
    opacity: 0.34,

    depthWrite: false
  });
  for (let i = 0; i < AIR_WAYPOINTS.length - 1; i++) {
    const x0 = AIR_WAYPOINTS[i][0] + 0.5, z0 = AIR_WAYPOINTS[i][1] + 0.5;
    const x1 = AIR_WAYPOINTS[i + 1][0] + 0.5, z1 = AIR_WAYPOINTS[i + 1][1] + 0.5;
    const len = Math.hypot(x1 - x0, z1 - z0);
    const ang = Math.atan2(x1 - x0, z1 - z0);
    const strip = new THREE.Mesh(new THREE.PlaneGeometry(0.46, len), airMat);
    strip.rotation.x = -Math.PI / 2;
    strip.rotation.z = ang;
    strip.position.set(0.5 * (x0 + x1), 0.78, 0.5 * (z0 + z1));
    airRibbonGroup.add(strip);

    const center = new THREE.Mesh(new THREE.PlaneGeometry(0.06, len), airEdgeMat);
    center.rotation.x = -Math.PI / 2;
    center.rotation.z = ang;
    center.position.set(0.5 * (x0 + x1), 0.79, 0.5 * (z0 + z1));
    airRibbonGroup.add(center);
  }
  scene.add(airRibbonGroup);

  // Animated air lane flow chevrons (driven purely by simTime)
  const airChevGeo = new THREE.ConeGeometry(0.13, 0.24, 3);
  airChevGeo.rotateX(Math.PI / 2);
  const airChevMat = new THREE.MeshBasicMaterial({ color: 0x62f6ff, transparent: true, opacity: 0.45, depthWrite: false });
  const AIR_CHEV_COUNT = 14;

  scene.add(airChevInst);

  function sampleAirLane(dist) {
    if (dist <= 21) return { x: 0.5 + dist, z: 6.5, ang: Math.PI / 2 };
    if (dist <= 26) return { x: 21.5, z: 6.5 + (dist - 21), ang: 0 };
    return { x: 21.5 + (dist - 26), z: 11.5, ang: Math.PI / 2 };
  }

  // 16 Stone Build Pads
  const padGeo = new THREE.CylinderGeometry(0.44, 0.50, 0.12, 8);
  const padMat = new THREE.MeshStandardMaterial({ color: 0x4b5262, roughness: 0.78, metalness: 0.18 });
  const padRingGeo = new THREE.RingGeometry(0.32, 0.39, 8);
  padRingGeo.rotateX(-Math.PI / 2);
  const padRingMat = new THREE.MeshBasicMaterial({ color: 0x8ea4c8, transparent: true, opacity: 0.35 });

  for (let i = 0; i < 16; i++) {
    const px = SLOT_TILES[i][0] + 0.5;
    const pz = SLOT_TILES[i][1] + 0.5;
    const pad = new THREE.Mesh(padGeo, padMat);

  // Fortified Keep at tile (23, 11) -> world (23.5, 0, 11.5), ~1.5 tiles across
  const keepGroup = new THREE.Group();
  keepGroup.position.set(23.5, 0, 11.5);

  const keepStoneMat = new THREE.MeshStandardMaterial({ color: 0x70788a, roughness: 0.72, metalness: 0.22, emissive: new THREE.Color(0x000000) });
  const keepDarkMat = new THREE.MeshStandardMaterial({ color: 0x3b4150, roughness: 0.82, metalness: 0.25, emissive: new THREE.Color(0x000000) });
  const keepCoreMat = new THREE.MeshStandardMaterial({ color: 0xffd275, emissive: new THREE.Color(0xff9e2c), emissiveIntensity: 1.2, roughness: 0.25 });

  // Permanent keep foundation slab
  const keepBase = new THREE.Mesh(new THREE.BoxGeometry(1.68, 0.22, 1.68), keepDarkMat);
  keepBase.position.y = 0.11;

  // Inner citadel tower (collapses at fallTick)

  towerBody.position.y = 0.78;

  towerRoof.position.y = 1.66;

  citadelGroup.add(towerRoof);

  const beaconOrb = new THREE.Mesh(new THREE.OctahedronGeometry(0.20, 0), keepCoreMat);
  beaconOrb.position.y = 2.02;
  citadelGroup.add(beaconOrb);
  keepGroup.add(citadelGroup);

  // 10 modular wall/turret chunks around the keep perimeter — each leak knocks off one chunk!
  const chunkOffsets = [
    [-0.68, 0.50, -0.68, 0.34, 0.76, 0.34], // corner NW tower
    [ 0.68, 0.50, -0.68, 0.34, 0.76, 0.34], // corner NE tower
    [-0.68, 0.50,  0.68, 0.34, 0.76, 0.34], // corner SW tower
    [ 0.68, 0.50,  0.68, 0.34, 0.76, 0.34], // corner SE tower

    [-0.72, 0.44,  0.00, 0.24, 0.58, 0.88], // W gate wall
    [ 0.00, 0.44,  0.72, 0.88, 0.58, 0.24], // S wall
    [ 0.72, 0.44,  0.00, 0.24, 0.58, 0.88], // E wall
    [-0.42, 0.86, -0.42, 0.30, 0.34, 0.30], // inner rampart 1
    [ 0.42, 0.86,  0.42, 0.30, 0.34, 0.30]  // inner rampart 2

  const keepChunks = [];
  for (let i = 0; i < 10; i++) {
    const o = chunkOffsets[i];

    m.castShadow = true;

    m.position.copy(basePos);
    keepGroup.add(m);
    keepChunks.push({ mesh: m, basePos: basePos, vel: vel, spin: spin });
  }

  // =========================================================================
  // 4. TURRET MESHES (DISTINCT SILHOUETTES + COLOURS + 1-3 TIER RINGS/PIPS)
  // =========================================================================
  function createTurretMesh(type) {
    const root = new THREE.Group();
    const col = TURRET_COLORS[type];
    const mainMat = new THREE.MeshStandardMaterial({ color: col, roughness: 0.42, metalness: 0.45 });
    const darkMat = new THREE.MeshStandardMaterial({ color: 0x282e3a, roughness: 0.75, metalness: 0.35 });
    const glowMat = new THREE.MeshStandardMaterial({ color: col, emissive: new THREE.Color(col), emissiveIntensity: 0.65, roughness: 0.3 });

    // Pedestal base
    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.30, 0.36, 0.24, 8), darkMat);
    base.position.y = 0.24;
    base.castShadow = true;
    base.receiveShadow = true;
    root.add(base);

    // Rotating head group
    const head = new THREE.Group();
    head.position.y = 0.46;
    root.add(head);

    if (type === "bolt") {
      // Steel-blue twin-rail repeater
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.22, 0.44), mainMat);
      body.castShadow = true;
      head.add(body);
      const b1 = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.52, 8), glowMat);
      b1.rotation.x = Math.PI / 2; b1.position.set(-0.10, 0.03, 0.30);
      const b2 = b1.clone(); b2.position.x = 0.10;
      head.add(b1, b2);
      const bow = new THREE.Mesh(new THREE.BoxGeometry(0.56, 0.06, 0.08), mainMat);
      bow.position.set(0, 0.05, 0.22);
      head.add(bow);
    } else if (type === "cannon") {
      // Bronze heavy mortar/howitzer
      const cradle = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.32, 0.24, 10), mainMat);
      cradle.castShadow = true;
      head.add(cradle);
      const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.17, 0.56, 10), mainMat);
      barrel.rotation.x = Math.PI / 2 - 0.32;
      barrel.position.set(0, 0.14, 0.24);
      barrel.castShadow = true;
      head.add(barrel);
      const rim = new THREE.Mesh(new THREE.TorusGeometry(0.13, 0.035, 6, 12), darkMat);
      rim.position.set(0, 0.23, 0.49);
      head.add(rim);
    } else if (type === "frost") {
      // Ice-white tall crystal obelisk + floating ring
      const spire = new THREE.Mesh(new THREE.OctahedronGeometry(0.24, 0), glowMat);
      spire.scale.set(0.85, 1.85, 0.85);
      spire.position.y = 0.24;
      spire.castShadow = true;
      head.add(spire);
      const cryoRing = new THREE.Mesh(new THREE.TorusGeometry(0.32, 0.04, 6, 12), mainMat);
      cryoRing.rotation.x = Math.PI / 2;
      cryoRing.position.y = 0.14;
      head.add(cryoRing);
    } else if (type === "lance") {
      // Crimson long sniper rail-spire
      const housing = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.28, 0.50), darkMat);
      housing.castShadow = true;
      head.add(housing);
      const rail = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.09, 0.86, 8), mainMat);
      rail.rotation.x = Math.PI / 2;
      rail.position.set(0, 0.06, 0.42);
      rail.castShadow = true;
      head.add(rail);
      const core = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.14, 0.68), glowMat);
      core.position.set(0, 0.14, 0.16);
      head.add(core);
    } else if (type === "flak") {
      // Teal upward-angled quad AA battery
      const drum = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.30, 0.22, 8), mainMat);
      drum.castShadow = true;
      head.add(drum);
      const offsets = [[-0.12, 0.08], [0.12, 0.08], [-0.12, -0.04], [0.12, -0.04]];
      for (let i = 0; i < 4; i++) {
        const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.048, 0.50, 6), glowMat);
        tube.rotation.x = Math.PI / 2 - 0.68;
        tube.position.set(offsets[i][0], 0.16 + offsets[i][1] * 0.6, 0.18);
        tube.castShadow = true;
        head.add(tube);
      }
    }

    // 3 bright tier pips/rings around pedestal front (visibility toggled for tier 1/2/3)
    const pipMat = new THREE.MeshBasicMaterial({ color: 0xffe97d });
    const pipGeo = new THREE.BoxGeometry(0.11, 0.09, 0.09);
    const pips = [];
    for (let p = 0; p < 3; p++) {
      const pip = new THREE.Mesh(pipGeo, pipMat);
      pip.position.set((p - 1) * 0.16, 0.28, 0.36);
      root.add(pip);
      pips.push(pip);
    }

    // Tier collar rings for extra silhouette clarity at quarter size
    const tierRings = [];
    for (let r = 0; r < 3; r++) {
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(0.35 - r * 0.03, 0.025, 6, 16),
        pipMat
      );
      ring.rotation.x = Math.PI / 2;
      ring.position.y = 0.16 + r * 0.08;
      root.add(ring);
      tierRings.push(ring);
    }

    root.visible = false;
    return { root: root, head: head, pips: pips, tierRings: tierRings };
  }

  // Pre-create one mesh per turret type on each of the 16 slots (80 tiny lightweight groups -> zero runtime allocations!)
  const slotTurrets = [];
  for (let sl = 0; sl < 16; sl++) {
    const px = SLOT_TILES[sl][0] + 0.5;
    const pz = SLOT_TILES[sl][1] + 0.5;
    const map = {};
    for (let ti = 0; ti < TURRET_TYPES.length; ti++) {
      const tp = TURRET_TYPES[ti];
      const obj = createTurretMesh(tp);
      obj.root.position.set(px, 0, pz);
      scene.add(obj.root);
      map[tp] = obj;
    }
    slotTurrets.push(map);
  }

  // =========================================================================
  // 5. INSTANCED ENEMIES (DISTINCT SILHOUETTES + COLOURS + HEALTH BARS + WISP SHADOWS)
  // =========================================================================
  const MAX_ENEMIES_PER_TYPE = 220;
  const MAX_TOTAL_ENEMIES = 320;

  // Build distinctive silhouette geometries for each of the 7 enemy types
  function makeGruntGeo() {
    const g = new THREE.CylinderGeometry(0.14, 0.21, 0.42, 6);
    g.translate(0, 0.21, 0);
    return g;
  }
  function makeRunnerGeo() {
    // Sleek forward-pointing yellow dart/wedge
    const g = new THREE.ConeGeometry(0.16, 0.54, 4);
    g.rotateX(Math.PI / 2);
    g.scale(1.0, 0.72, 1.0);
    g.translate(0, 0.16, 0);
    return g;
  }
  function makeWispGeo() {
    // Glowing cyan octahedron crystal
    return new THREE.OctahedronGeometry(0.24, 0);
  }
  function makeBruteGeo() {
    // Bulky wide iron juggernaut hull
    const g = new THREE.BoxGeometry(0.56, 0.54, 0.52);
    g.translate(0, 0.27, 0);
    return g;
  }
  function makeSplitterGeo() {
    // Bulbous faceted purple pod
    const g = new THREE.IcosahedronGeometry(0.30, 0);
    g.scale(1.12, 0.88, 1.12);

  function makeSplitlingGeo() {

  function makeMenderGeo() {
    // Tall white spire
    const g = new THREE.ConeGeometry(0.20, 0.58, 8);
    g.translate(0, 0.29, 0);

  }

  const enemyGeos = {
    grunt:     makeGruntGeo(),
    runner:    makeRunnerGeo(),
    wisp:      makeWispGeo(),
    brute:     makeBruteGeo(),
    splitter:  makeSplitterGeo(),
    splitling: makeSplitlingGeo(),
    mender:    makeMenderGeo()
  };

  const initWhite = new THREE.Color(0xffffff);
  function primeInstColor(inst) {
    inst.setColorAt(0, initWhite);
    inst.instanceColor.needsUpdate = true;
  }

  const enemyInst = {};
  for (let i = 0; i < ENEMY_TYPES.length; i++) {
    const tp = ENEMY_TYPES[i];
    const isGlow = (tp === "wisp");
    const mat = isGlow
      ? new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: new THREE.Color(0x28e5ff), emissiveIntensity: 0.95, roughness: 0.2 })
      : new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: tp === "brute" ? 0.55 : 0.48, metalness: tp === "brute" ? 0.65 : 0.2 });
    const inst = new THREE.InstancedMesh(enemyGeos[tp], mat, MAX_ENEMIES_PER_TYPE);
    inst.castShadow = !isGlow;
    inst.receiveShadow = true;
    inst.count = 0;
    inst.frustumCulled = false;
    primeInstColor(inst);
    scene.add(inst);
    enemyInst[tp] = inst;
  }

  // Brute bright orange shoulder/chest plates (instanced secondary accent!)
  const brutePlateGeo = new THREE.BoxGeometry(0.64, 0.20, 0.34);
  brutePlateGeo.translate(0, 0.44, 0.06);
  const brutePlateMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: new THREE.Color(0x3a1400), roughness: 0.38, metalness: 0.35 });
  const brutePlateInst = new THREE.InstancedMesh(brutePlateGeo, brutePlateMat, MAX_ENEMIES_PER_TYPE);
  brutePlateInst.count = 0;
  brutePlateInst.frustumCulled = false;
  primeInstColor(brutePlateInst);
  scene.add(brutePlateInst);

  // Wisp ground shadows (dark disc on y = 0.03 beneath floating wisps)
  const wispShadowGeo = new THREE.CircleGeometry(0.24, 12);
  wispShadowGeo.rotateX(-Math.PI / 2);
  const wispShadowMat = new THREE.MeshBasicMaterial({ color: 0x05080f, transparent: true, opacity: 0.55, depthWrite: false });
  const wispShadowInst = new THREE.InstancedMesh(wispShadowGeo, wispShadowMat, MAX_ENEMIES_PER_TYPE);
  wispShadowInst.count = 0;
  wispShadowInst.frustumCulled = false;
  scene.add(wispShadowInst);

  // Mender soft green halo rings
  const menderHaloGeo = new THREE.RingGeometry(0.26, 0.38, 18);
  menderHaloGeo.rotateX(-Math.PI / 2);
  const menderHaloMat = new THREE.MeshBasicMaterial({ color: 0x4cff8c, transparent: true, opacity: 0.72, side: THREE.DoubleSide, depthWrite: false });
  const menderHaloInst = new THREE.InstancedMesh(menderHaloGeo, menderHaloMat, MAX_ENEMIES_PER_TYPE);
  menderHaloInst.count = 0;
  menderHaloInst.frustumCulled = false;
  scene.add(menderHaloInst);

  // Instanced enemy health bars (background + colored fill)
  const hbBackGeo = new THREE.PlaneGeometry(0.56, 0.085);
  const hbBackMat = new THREE.MeshBasicMaterial({ color: 0x0a0d14, transparent: true, opacity: 0.85, depthTest: false });
  const hbBackInst = new THREE.InstancedMesh(hbBackGeo, hbBackMat, MAX_TOTAL_ENEMIES);
  hbBackInst.renderOrder = 20;
  hbBackInst.count = 0;
  hbBackInst.frustumCulled = false;
  scene.add(hbBackInst);

  const hbFillGeo = new THREE.PlaneGeometry(0.52, 0.055);
  hbFillGeo.translate(0.26, 0, 0); // anchor left edge at x=0 for clean horizontal scaling
  const hbFillMat = new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false });
  const hbFillInst = new THREE.InstancedMesh(hbFillGeo, hbFillMat, MAX_TOTAL_ENEMIES);
  hbFillInst.renderOrder = 21;
  hbFillInst.count = 0;
  hbFillInst.frustumCulled = false;
  primeInstColor(hbFillInst);
  scene.add(hbFillInst);

  // =========================================================================
  // 6. INSTANCED COMBAT VISUALS (BEAMS, SHELLS, RINGS, DEBRIS, SPARKLES)
  // =========================================================================
  const MAX_BEAMS = 180;
  const beamGeo = new THREE.CylinderGeometry(1, 1, 1, 6);
  beamGeo.rotateX(Math.PI / 2);
  const beamMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.92, depthWrite: false });

  const MAX_SHELLS = 90;

  shellInst.count = 0;

  const MAX_RINGS = 160;
  const ringGeo = new THREE.RingGeometry(0.80, 1.0, 24);

  const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85, side: THREE.DoubleSide, depthWrite: false });
