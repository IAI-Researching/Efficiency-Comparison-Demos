<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last Rampart</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#countdown { display: none; }
</style>

<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script id="rampart-strategy">
function createStrategy() {
  const costs = { bolt:50, cannon:90, frost:70, lance:120, flak:80 };
  const damage = {
    bolt:[26,41,65], cannon:[60,96,153], frost:[10,16,25],
    lance:[180,288,460], flak:[40,64,102]
  };
  const defense = ["bolt","bolt","cannon","cannon","cannon","cannon","cannon","cannon",
    "cannon","bolt","flak","cannon","bolt","flak","flak","flak"];
  const placementOrder = [0,2,1,4,3,12,7,6,11,10,15,8,5,14,13,9];
  let currentWave = 0;
  let reinforcedAir = false, reinforcedArmor = false, frozenGate = false;

  function plan({wave,gold,slots,enemies,nextWave,baseHp}) {
    currentWave = wave;
    const actions = [];
    const living = slots.map(({turret}) => turret);
    if (wave === 1) {
      for (const slot of [0,2]) {
        actions.push({op:"build",slot,type:"bolt"});
        living[slot] = {type:"bolt",tier:1,spent:50};
        gold -= 50;
      }
    }

    const wisps = nextWave.filter(type => type === "wisp").length;
    let airAtRear = 0, airApproaching = 0, gateWisps = 0, dangerousWisp = false, ironColumn = 0;
    for (const e of enemies) {
      if (e.air) {
        if (e.remaining < 900) airAtRear += e.hp;
        else if (e.remaining < 1750) airApproaching += e.hp*.35;
        if (e.remaining < 650) gateWisps++;
        if (e.remaining < 377 && e.hp > 175) dangerousWisp = true;
      } else if (e.type === "brute" && e.hp > 450 && e.x > 1200 && e.x < 1830 && e.y < 510) {
        ironColumn++;
      }
    }
    const airPressure = airAtRear+airApproaching;
    if (wave >= 33 && gold >= 135 &&
        (airPressure+wisps*45 >= 1350 || (baseHp <= 4 && airPressure >= 400))) {
      reinforcedAir = true;
    }
    if (wave >= 35 && gold >= 230 && ironColumn >= 3 && airPressure < 1900) reinforcedArmor = true;
    if (gold >= 55 && baseHp <= 2 && dangerousWisp && gateWisps <= 5) frozenGate = true;

    // Buy the best affordable improvement, then rescore with the updated budget.
    for (;;) {
      let best = null;
      for (let i=0;i<placementOrder.length;i++) {
        const slot = placementOrder[i], turret = living[slot];
        const converted = slot === 1 && reinforcedAir;
        const ward = slot === 14 && frozenGate;
        const pierce = slot === 9 && reinforcedArmor;
        const type = converted ? "flak" : ward ? "frost" : pierce ? "lance" : defense[slot];
        const replace = turret && turret.type !== type;
        if (replace && wave < 11) continue;
        const tier = turret && !replace ? turret.tier : 0;
        if (tier === 3) continue;
        const refund = replace ? Math.floor(turret.spent*70/100) : 0;
        const cost = costs[type]*Math.max(1,tier)-refund;
        if (cost > gold) continue;

        let priority = 24-i*.86-[0,5.3,11][tier]-(replace ? 5 : 0);
        if (type === "flak") {
          if (wave < 3 || (wave < 6 && !wisps)) continue;
          priority += Math.min(4,wisps*.45+airAtRear/250);
          if (tier > 0 && wave >= 17) priority += -3+Math.min(8,airAtRear*.001);
        }
        if (converted) priority += [17,10,6][tier];
        if (ward) priority += 13;
        if (pierce) priority += 6;
        if (!best || priority > best.priority) best = {slot,type,tier,cost,replace,priority};
      }
      if (!best) return actions;
      const {slot,type,tier,cost,replace} = best;
      if (replace) actions.push({op:"sell",slot});
      actions.push(tier ? {op:"upgrade",slot} : {op:"build",slot,type});
      gold -= cost;
      living[slot] = {type,tier:tier+1,spent:costs[type]*(tier===2 ? 4 : tier+1)};
    }
  }

  function target(turret,candidates) {
    if (candidates.length === 1) return candidates[0].id;
    const {type,tier,slot} = turret;
    const shot = damage[type][tier-1];
    const splash = type === "cannon" ? 8100 : type === "flak" ? 4900 : 0;
    const splashWeight = type === "flak" ? .85 : 1.15;
    const values = candidates.map(e => {
      const harm = Math.max(1,shot-(type === "lance" ? 0 : e.armor));
      const eta = e.remaining/e.speed;
      const urgent = 1+360/(eta+50)+(currentWave >= 41 ? 450/(eta+18) : 0);
      if (type === "frost") return urgent*(e.air ? 1.45 : 1)*(e.slowed > 8 ? .26 : 1);
      const healing = e.type === "mender" ? 3.5 : 1;
      const finish = e.hp <= harm ? .5+.5*harm/shot : 0;
      const progress = 1-e.hp/e.maxHp;
      const focus = currentWave >= 41 ? 1-.2*progress : 1;
      const airBias = e.air && type === "bolt" ? .3 : 1;
      const airUrgency = e.air ? (1+.3*progress)*(1+52/(eta+10)) : 1;
      // At the last pads, discount wisps that cannot plausibly be finished in time.
      const almostGone = e.air && slot >= 13 && e.remaining < 650 && eta < 40;
      const catchable = almostGone ? .06+.94*Math.min(1,(13*eta+harm)/e.hp) : 1;
      return urgent*healing*airBias*(Math.min(harm,e.hp)/shot+finish)*focus*airUrgency*catchable;
    });
    let best = -Infinity, id = candidates[0].id;
    for (let i=0;i<candidates.length;i++) {
      const e = candidates[i];
      let utility = values[i];
      if (splash) {
        for (let j=0;j<candidates.length;j++) {
          if (i===j) continue;
          const dx = e.x-candidates[j].x, dy = e.y-candidates[j].y;
          if (dx*dx+dy*dy <= splash) utility += splashWeight*values[j];
        }
      }
      if (utility > best) { best = utility; id = e.id; }
    }
    return id;
  }

  return {plan,target};
}
</script>
<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks) {
  const observe = arguments[3];
  const types = [
    ["grunt",60,10,4,1,0,1,10], ["runner",40,20,4,1,0,2,4],
    ["wisp",50,12,6,2,1,3,3], ["brute",150,6,9,3,0,4,3],
    ["splitter",90,8,6,2,0,6,2], ["mender",70,8,7,2,0,8,1],
    ["splitling",0,12,1,1,0,Infinity,0]
  ];
  const guns = [
    ["bolt",50,26,8,300,0,0,false,3], ["cannon",90,60,24,260,90,0,false,1],
    ["frost",70,10,12,240,0,30,false,3], ["lance",120,180,36,360,0,0,true,1],
    ["flak",80,40,10,320,70,0,false,2]
  ];
  const coords = [[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],[14,5],
    [15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]];
  const paths = [
    [[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]],
    [[0,6],[21,6],[21,11],[23,11]]
  ];
  const routes = paths.map(route => {
    let length = 0;
    const segments = route.slice(1).map(([x,y], i) => {
      const [sx,sy] = route[i];
      const segment = [length, sx*100+50, sy*100+50, Math.sign(x-sx), Math.sign(y-sy)];
      length += 100 * (Math.abs(x-sx) + Math.abs(y-sy));
      return segment;
    });
    return { length, segments };
  });

  function mulberry32(a) { return function () {
    a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return (t ^ (t >>> 14)) >>> 0; }; }
  const draw = mulberry32(seed);
  const strategy = createStrategy();
  const slots = coords.map(([x,y], slot) => ({ slot, x:100*x+50, y:100*y+50, turret:null }));
  const log = [];
  let events = [], enemies = [], queue = [], nextId = 1;
  let wave = 0, tick = 0, gold = 250, baseHp = 10, fallTick = -1;
  let multiplier = 1000;
  let next = generate(1);

  function generate(w) {
    const eligible = types.filter(type => type[6] <= w);
    const total = eligible.reduce((sum, type) => sum + type[7], 0);
    return Array.from({ length:4+Math.floor(3*w/5) }, () => {
      let r = draw() % total;
      return eligible.find(type => (r -= type[7]) < 0);
    });
  }
  function place(e) {
    const segments = routes[e.air].segments;
    let i = segments.length-1;
    while (segments[i][0] > e.progress) i--;
    const [from,x,y,dx,dy] = segments[i];
    e.x = x + (e.progress-from)*dx;
    e.y = y + (e.progress-from)*dy;
    e.dx = dx;
    e.dy = dy;
  }
  function spawn(type,w,maxHp,progress = 0) {
    const air = type[5];
    const armor = type[0] === "grunt" ? Math.floor(w/4) : type[0] === "brute" ? 6+w : 0;
    const e = { id:nextId++, type:type[0], hp:maxHp, maxHp, air, armor,
      speed:type[2], bounty:type[3], leak:type[4], wave:w, progress,
      length:routes[air].length, slow:0, age:0 };
    place(e);
    enemies.push(e);
  }
  function view(e) {
    return { id:e.id, type:e.type, hp:e.hp, maxHp:e.maxHp, x:e.x, y:e.y, air:e.air,
      armor:e.armor, speed:e.speed, slowed:e.slow, remaining:e.length-e.progress };
  }
  function emit(kind,values) {
    events.push({ kind, tick, ...values });
  }
  function apply(actions) {
    for (const a of (Array.isArray(actions) ? actions.slice(0,32) : [])) {
      if (!a || !Number.isInteger(a.slot) || a.slot < 0 || a.slot >= slots.length) continue;
      const s = slots[a.slot], t = s.turret;
      if (a.op === "build" && !t) {
        const index = guns.findIndex(gun => gun[0] === a.type);
        const gun = guns[index];
        if (!gun || gold < gun[1]) continue;
        gold -= gun[1];
        s.turret = { gun, tier:1, spent:gun[1], damage:gun[2], range:gun[4], cooldown:0 };
        log.push([tick,"B",s.slot,index]);
        if (observe) emit("build",{ slot:s.slot, type:gun[0] });
      } else if (a.op === "upgrade" && t && t.tier < 3) {
        const cost = t.gun[1]*t.tier;
        if (gold < cost) continue;
        gold -= cost;
        t.spent += cost;
        t.tier++;
        t.damage = Math.floor(t.damage*16/10);
        t.range += 30;
        log.push([tick,"U",s.slot,t.tier]);
        if (observe) emit("upgrade",{ slot:s.slot, type:t.gun[0] });
      } else if (a.op === "sell" && t) {
        gold += Math.floor(t.spent*70/100);
        s.turret = null;
        log.push([tick,"S",s.slot,0]);
        if (observe) emit("sell",{ slot:s.slot, type:t.gun[0] });
      }
    }
  }
  function distanceSquared(x,y,e) {
    const dx = x-e.x, dy = y-e.y;
    return dx*dx+dy*dy;
  }
  function record() {
    observe(tick,{
      gold, baseHp, wave, nextWave:next.map(type => type[0]),
      turrets:slots.map(s => s.turret && { type:s.turret.gun[0], tier:s.turret.tier }),
      enemies:enemies.map(e => ({ ...view(e), dx:e.dx, dy:e.dy, age:e.age })),
      events,
      board:tick === 0 ? { slots:coords, paths } : undefined
    });
    events = [];
  }

  for (; tick < maxTicks; tick++) {
    if (tick >= 20 && (tick-20)%40 === 0) {
      gold += Math.min(50,Math.floor(gold*5/100)) + 10 + 2*(++wave);
      if (wave > 1) multiplier = Math.floor(multiplier*108/100);
      const composition = next;
      next = generate(wave+1);
      if (observe) emit("wave",{ wave });
      apply(strategy.plan({
        tick, wave, gold, baseHp,
        slots:slots.map(({slot,x,y,turret:t}) => ({
          slot,x,y,turret:t && { type:t.gun[0], tier:t.tier, spent:t.spent }
        })),
        enemies:enemies.map(view), nextWave:next.map(type => type[0])
      }));
      for (let i = 0; i < composition.length; i++) {
        const type = composition[i];
        queue.push({ tick:tick+4*i, wave, i, type, hp:Math.floor(type[1]*multiplier/1000) });
      }
      queue.sort((a,b) => a.tick-b.tick || a.wave-b.wave || a.i-b.i);
    }
    while (queue.length && queue[0].tick === tick) {
      const entry = queue.shift();
      spawn(entry.type,entry.wave,entry.hp);
    }
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      e.progress += e.slow > 0 ? Math.floor(e.speed*60/100) : e.speed;
      if (e.progress < e.length) {
        place(e);
        continue;
      }
      baseHp -= e.leak;
      enemies.splice(i--,1);
      log.push([tick,"L",e.id,baseHp]);
      if (observe) emit("leak",{ type:e.type, baseHp });
      if (baseHp <= 0) {
        fallTick = tick;
        log.push([tick,"F",wave,0]);
        if (observe) emit("fall",{ wave });
        break;
      }
    }
    if (fallTick >= 0) {
      if (observe) record();
      break;
    }
    for (const e of enemies) {
      e.age++;
      if (e.type !== "mender" || e.age%20 !== 0) continue;
      for (const ally of enemies) {
        if (distanceSquared(e.x,e.y,ally) <= 150*150)
          ally.hp = Math.min(ally.maxHp,ally.hp+Math.floor(ally.maxHp*8/100));
      }
      if (observe) emit("heal",{ x:e.x, y:e.y });
    }
    for (const s of slots) {
      const t = s.turret;
      if (!t) continue;
      if (t.cooldown > 0 && --t.cooldown > 0) continue;
      const [type,,,period,,splash,slow,pierce,domain] = t.gun;
      const r2 = t.range*t.range;
      const candidates = enemies.filter(e => (domain & (1 << e.air)) && distanceSquared(s.x,s.y,e) <= r2);
      if (!candidates.length) continue;
      let target;
      if (strategy.target) {
        const id = strategy.target({ slot:s.slot, type, tier:t.tier, x:s.x, y:s.y, range:t.range },candidates.map(view));
        target = candidates.find(e => e.id === id);
      }
      if (!target) {
        target = candidates[0];
        for (const e of candidates)
          if (e.length-e.progress < target.length-target.progress) target = e;
      }
      if (observe) emit("shot",{ slot:s.slot, type, x:target.x, y:target.y, air:target.air, splash });
      const struck = splash ? enemies.filter(e => (domain & (1 << e.air)) &&
        distanceSquared(target.x,target.y,e) <= splash*splash) : [target];
      for (const e of struck) {
        e.hp -= Math.max(1,t.damage-(pierce ? 0 : e.armor));
        if (slow) e.slow = slow;
      }
      t.cooldown = period;
      for (let i = 0; i < enemies.length; i++) {
        const e = enemies[i];
        if (e.hp > 0) continue;
        gold += e.bounty;
        log.push([tick,"K",e.id,s.slot]);
        if (observe) emit("kill",{ type:e.type, x:e.x, y:e.y, air:e.air });
        enemies.splice(i--,1);
        if (e.type === "splitter") {
          const hp = Math.max(1,Math.floor(e.maxHp/4));
          for (let n = 0; n < 3; n++) spawn(types[6],e.wave,hp,e.progress);
        }
      }
    }
    for (const e of enemies) if (e.slow > 0) e.slow--;
    if (observe) record();
  }

  let hash = 0x811c9dc5;
  const json = JSON.stringify(log);
  for (let i = 0; i < json.length; i++) hash = Math.imul(hash ^ json.charCodeAt(i),0x01000193);
  const score = Math.round(((fallTick < 0 ? maxTicks : fallTick)-20)/40*100)/100;
  return { score, fallTick, log, hash:(hash>>>0).toString(16).padStart(8,"0") };
}
</script>
<script>
(() => {
  "use strict";

  const DURATION = 100;
  const TICKS = 20;
  const frames = [];

    }
    for (const [x,y,z,color] of lampPositions) {
      const flicker=.79+.13*Math.sin(worldTime*7.1+x*7)+.08*Math.sin(worldTime*17.1+z*9);
      airGlow(x,y,z,.51,color,flicker*.83);
      groundGlow(x,.108,z,.74,color,flicker*.27);
    }
    for (let i=0;i<motes.length;i++) {
      const p=motes[i];
      const shimmer=.28+.26*Math.sin(worldTime*1.42+p.phase);
      airGlow(p.x+Math.sin(worldTime*.15+p.phase)*.38,p.y+.12*Math.cos(worldTime*.8+p.phase),
        p.z+.24*Math.sin(worldTime*.25+p.phase),p.s*3.9,i%3 ? 0xeeaf70 : 0x79a1b3,shimmer,dust);
    }
    for (const batch of batches) flush(batch);
    const gray=.94*ease(clamp(time-fallTime));
    if (gray!==lastGray) {
      stage.style.filter=gray ? "grayscale("+gray+")" : "";
      lastGray=gray;
    }
    showHud(a,time);
    renderer.clear();
    renderer.render(scene,camera);
    renderer.clearDepth();
    renderer.render(hudScene,hudCamera);
  }

  const countdown=document.getElementById("countdown");
  const scrubber=document.getElementById("scrubber");
  const toggle=document.getElementById("btn-toggle");
  const refire=document.getElementById("btn-refire");
  const pauseIcon=document.getElementById("icon-pause");
  const playIcon=document.getElementById("icon-play");
  const pills=Array.from(document.querySelectorAll(".speed-pill"));
  const COUNTDOWN="COUNTDOWN", PLAYING="PLAYING", PAUSED="PAUSED", REFIRE_HOLD="REFIRE_HOLD", ENDED="ENDED";
  let state=COUNTDOWN, simTime=0, countdownElapsed=0, holdElapsed=0, playbackSpeed=1;
  let previousWall, lastRendered=-1, dragging=false;

  function setState(next) {
    state=next;
    if (next!==COUNTDOWN) {
      countdown.style.display="none";
      countdown.textContent="";
    }
    const showPause=next===PLAYING || next===COUNTDOWN || next===REFIRE_HOLD;
    pauseIcon.style.display=showPause ? "" : "none";
    playIcon.style.display=showPause ? "none" : "";
    toggle.setAttribute("aria-label",showPause ? "Pause" : "Play");
    audio.active(next===PLAYING && !dragging);
  }
  function paint(time,force=false) {
    if (force || time!==lastRendered) {
      render(time);
      lastRendered=time;
    }
  }
  function resetTime() {
    simTime=0;
    scrubber.value="0";
    paint(0,true);
  }
  function onResize() {
    resize();
    paint(simTime,true);
  }
  window.addEventListener("resize",onResize);
  toggle.addEventListener("click",()=>{
    if (state===PLAYING || state===COUNTDOWN || state===REFIRE_HOLD) {
      setState(PAUSED);
    } else {
      if (state===ENDED) resetTime();
      previousWall=performance.now();
      setState(PLAYING);
    }
  });
  refire.addEventListener("click",()=>{
    setState(REFIRE_HOLD);
    holdElapsed=0;
    resetTime();
    previousWall=performance.now();
  });
  scrubber.addEventListener("input",()=>{
    setState(PAUSED);
    simTime=Number.parseFloat(scrubber.value);
    paint(simTime,true);
  });
  scrubber.addEventListener("pointerdown",()=>{
    dragging=true;
    audio.active(false);
  });
  function finishDrag() {
    if (!dragging) return;
    dragging=false;
    audio.active(state===PLAYING);
  }
  window.addEventListener("pointerup",finishDrag);
  window.addEventListener("pointercancel",finishDrag);
  for (const pill of pills) pill.addEventListener("click",()=>{
    playbackSpeed=Number(pill.dataset.speed);
    for (const p of pills) {
      p.classList.toggle("is-active",p===pill);
      p.setAttribute("aria-checked",String(p===pill));
    }
  });

  function playFrame(dt) {
    const before=Math.floor(simTime*TICKS+1e-9);
    simTime=Math.min(DURATION,simTime+dt*playbackSpeed);
    const after=Math.min(frames.length-1,Math.floor(simTime*TICKS+1e-9));
    scrubber.value=simTime.toFixed(3);
    paint(simTime);
    if (simTime>=DURATION) {
      setState(ENDED);
      return;
    }
    if (!dragging && after>before) {
      const group=[];
      for (let i=before+1;i<=after;i++) group.push(...frames[i].events);
      audio.play(group);
    }
    audio.wind(simTime);
  }
  function animate(wall) {
    const dt=previousWall === undefined ? 0 : Math.min(Math.max(0,(wall-previousWall)/1000),.1);
    previousWall=wall;
    if (state===COUNTDOWN) {
      countdownElapsed+=dt;
      if (countdownElapsed<3) {
        countdown.style.display="block";
        const count=String(3-Math.floor(countdownElapsed));
        if (countdown.textContent!==count) countdown.textContent=count;
      } else {
        setState(PLAYING);
        playFrame(countdownElapsed-3);
      }
    } else if (state===REFIRE_HOLD) {
      holdElapsed+=dt;
      if (holdElapsed>=1) {
        setState(PLAYING);
        playFrame(holdElapsed-1);
      }
    } else if (state===PLAYING) {
      playFrame(dt);
    }
    requestAnimationFrame(animate);
  }

  onResize();
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
