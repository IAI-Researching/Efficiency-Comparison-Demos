<html lang="en">
<head>

<title>Last Rampart</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;

  display: block;

<script id="rampart-strategy">
function createStrategy() {
  const types = ["bolt","cannon","frost","lance","flak"];
  const cost = [50,90,70,120,80];
  const damage = [[26,41,65],[60,96,153],[10,16,25],[180,288,460],[40,64,102]];
  // Cannons cover the road bends. Flak overlaps along the flight lane and at the keep.
  const layout = [1,0,1,1,0,4,1,1,4,1,1,4,1,4,1,2];
  const investment = [2.158,1.260,2.330,1.537,1.382,1.000,2.137,1.120,
    1.659,1.622,1.029,1.650,1.270,.947,1.004,.262];
  const tierWeight = [1,.722,.519];
  let recentWisps = 1;

  function preferredType(slot,wave) {
    if (slot === 2 && wave < 7) return 0;
    if (slot === 10 && wave < 33) return 3;
    return layout[slot];
  }

  return {
    plan(state) {
      const actions = [];
      let gold = state.gold;
      const pads = state.slots.map(({slot,turret}) => ({
        slot, tier:turret?.tier || 0, spent:turret?.spent || 0,
        current:turret ? types.indexOf(turret.type) : -1, desired:preferredType(slot,state.wave)
      }));
      const flyers = state.nextWave.filter(type => type === "wisp").length;
      recentWisps = .8*recentWisps + .2*flyers;
      const antiAirValue = state.wave < 3 && flyers === 0 ? .13 :
        Math.min(1.45,.72+.1*recentWisps+.06*flyers);

      while (actions.length < 28) {
        let choice = null;
        let bestValue = 0;
        for (const pad of pads) {
          const {slot,tier,current,desired,spent} = pad;
          const swap = tier > 0 && current !== desired;
          if (tier === 3 && !swap) continue;
          const price = swap ? cost[desired]-Math.floor(spent*70/100) : cost[desired]*Math.max(1,tier);
          if (price > gold) continue;
          let value = investment[slot];
          // Reserve a frost position for slowing flyers and a lance for armoured units.
          if (!tier && state.wave >= 17 && slot === 15) value = Math.max(.94,value);
          if (!tier && state.wave >= 17 && slot === 10) value = Math.max(1.4,value);
          value *= swap ? 1.8 : tierWeight[tier];
          if (desired === 4) value *= antiAirValue;
          if (!tier && state.wave === 1) {
            if (slot === 0) value *= 4;
            if (slot === 2) value *= 2;
          }
          if (value > bestValue) {
            bestValue = value;
            choice = {pad,swap,price};
          }
        }
        if (!choice) break;
        const {pad,swap,price} = choice;
        if (swap) {
          actions.push({op:"sell",slot:pad.slot});
          pad.tier = 0;
          pad.spent = 0;
        }
        if (pad.tier) {
          actions.push({op:"upgrade",slot:pad.slot});
          pad.spent += cost[pad.current]*pad.tier;
        } else {
          pad.current = pad.desired;
          pad.spent = cost[pad.desired];
          actions.push({op:"build",slot:pad.slot,type:types[pad.desired]});
        }
        pad.tier++;
        gold -= price;
      }
      return actions;
    },

    target(turret,candidates) {
      if (candidates.length === 1) return candidates[0].id;
      const type = types.indexOf(turret.type);
      const raw = damage[type][turret.tier-1];
      const splashSquared = type === 1 ? 8100 : type === 4 ? 4900 : 0;
      let best = -Infinity;
      let id = candidates[0].id;
      for (const target of candidates) {
        const useful = type === 3 ? raw : Math.max(1,raw-target.armor);
        const routeProgress = 1-target.remaining/(target.air ? 2600 : 4600);
        const urgency = routeProgress**5 * 4.692 * (target.type === "brute" ? 1.18 : 1);
        let value = (Math.min(useful,target.hp)/raw+.13*(target.hp<=useful)+.13*(target.type === "mender"))*(1+urgency);
        if (type === 2 && !target.slowed) value += .95*(1+urgency);
        if (type === 3) value += .012*target.armor;
        if (type === 0 && target.air) value *= 1.12;
        if (splashSquared) {
          for (const other of candidates) {
            if (other.id === target.id) continue;
            const dx = target.x-other.x, dy = target.y-other.y;
            if (dx*dx+dy*dy > splashSquared) continue;
            const areaDamage = Math.max(1,raw-other.armor);
            value += .914*(Math.min(areaDamage,other.hp)/raw+.1*(other.hp<=areaDamage));
          }
        }
        if (value > best) {
          best = value;
          id = target.id;
        }
      }
      return id;
    }
  };
}
</script>

<script id="rampart-sim">
function rampartSimulate(createStrategy, seed, maxTicks) {
  const pads = [[3,3],[5,5],[7,4],[7,8],[9,9],[10,5],[11,8],[13,8],[14,5],
    [15,2],[16,7],[17,4],[19,8],[20,10],[22,9],[3,7]];
  const towers = {
    bolt:   { cost:50, damage:26, period:8, range:300, splash:0, slow:0, domains:3 },
    cannon: { cost:90, damage:60, period:24, range:260, splash:90, slow:0, domains:1 },
    frost:  { cost:70, damage:10, period:12, range:240, splash:0, slow:30, domains:3 },
    lance:  { cost:120, damage:180, period:36, range:360, splash:0, slow:0, domains:1 },
    flak:   { cost:80, damage:40, period:10, range:320, splash:70, slow:0, domains:2 }
  };
  const towerNames = Object.keys(towers);
  const roster = [
    { type:"grunt",   hp:60,  speed:10, bounty:4, leak:1, air:0, first:1, weight:10 },
    { type:"runner",  hp:40,  speed:20, bounty:4, leak:1, air:0, first:2, weight:4 },
    { type:"wisp",    hp:50,  speed:12, bounty:6, leak:2, air:1, first:3, weight:3 },
    { type:"brute",   hp:150, speed:6,  bounty:9, leak:3, air:0, first:4, weight:3 },
    { type:"splitter",hp:90,  speed:8,  bounty:6, leak:2, air:0, first:6, weight:2 },
    { type:"mender",  hp:70,  speed:8,  bounty:7, leak:2, air:0, first:8, weight:1 }
  ];
  const child = { type:"splitling", speed:12, bounty:1, leak:1, air:0 };
  const slots = pads.map(([x,y],slot) => ({ slot, x:100*x+50, y:100*y+50, turret:null }));
  const strategy = createStrategy();
  const observer = createStrategy.observe;
  const log = [];
  const enemies = [];
  const queue = [];
  let gold = 250, baseHp = 10, wave = 0, tick = 0, nextId = 1, fallTick = -1, multiplier = 1000;

  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return (t ^ (t >>> 14)) >>> 0;
    };
  }
  const random = mulberry32(seed);
  function compose(number) {
    const available = roster.filter(unit => unit.first <= number);
    const weight = available.reduce((total, unit) => total + unit.weight, 0);
    return Array.from({ length:4 + Math.floor(3*number/5) }, () => {
      let roll = random() % weight;
      for (const unit of available) {
        if (roll < unit.weight) return unit;
        roll -= unit.weight;
      }
    });
  }
  let preview = compose(1);

  function routeSamples(points) {
    const samples = [];
    for (let i = 1; i < points.length; i++) {
      const [x,y] = points[i-1];
      const dx = points[i][0]-x;
      const dy = points[i][1]-y;
      const length = 100*(Math.abs(dx)+Math.abs(dy));
      for (let p = 0; p < length; p++) {
        samples.push([x*100+50 + Math.sign(dx)*p, y*100+50 + Math.sign(dy)*p]);
      }
    }
    return samples;
  }
  const paths = [
    [[0,2],[6,2],[6,10],[12,10],[12,3],[18,3],[18,11],[23,11]],
    [[0,6],[21,6],[21,11],[23,11]]
  ];
  const routes = paths.map(routeSamples);
  if (observer?.board) observer.board(paths);
  function position(enemy) {
    [enemy.x, enemy.y] = routes[enemy.air][enemy.progress];
  }
  function spawn(unit, number, hp, progress) {
    const armor = unit.type === "grunt" ? Math.floor(number/4) : unit.type === "brute" ? 6+number : 0;
    const enemy = {
      id:nextId++, type:unit.type, hp, maxHp:hp, air:unit.air, armor, speed:unit.speed,
      bounty:unit.bounty, leak:unit.leak, wave:number, age:0, slow:0, progress, x:0, y:0
    };
    position(enemy);
    enemies.push(enemy);
  }
  function view(enemy) {
    return {
      id:enemy.id, type:enemy.type, hp:enemy.hp, maxHp:enemy.maxHp, x:enemy.x, y:enemy.y,
      air:enemy.air, armor:enemy.armor, speed:enemy.speed, slowed:enemy.slow > 0,
      remaining:routes[enemy.air].length-enemy.progress
    };
  }
  function state() {
    return {
      tick, wave, gold, baseHp,
      slots:slots.map(({slot,x,y,turret}) => ({
        slot,x,y,turret:turret && { type:turret.type, tier:turret.tier, spent:turret.spent }
      })),
      enemies:enemies.map(view), nextWave:preview.map(unit => unit.type)
    };
  }
  function event(code, x, y, type, radius = 0, fromX = x, fromY = y, id = 0) {
    if (observer) observer.event({ tick, code, x, y, type, radius, fromX, fromY, id });
  }
  function apply(actions) {
    if (!Array.isArray(actions)) return;
    for (const action of actions.slice(0,32)) {
      if (!action || !Number.isInteger(action.slot) || !slots[action.slot]) continue;
      const pad = slots[action.slot];
      const turret = pad.turret;
      if (action.op === "build" && !turret && towerNames.includes(action.type)) {
        const spec = towers[action.type];
        if (gold < spec.cost) continue;
        gold -= spec.cost;
        pad.turret = { type:action.type, tier:1, spent:spec.cost, damage:spec.damage, range:spec.range, cooldown:0 };
        log.push([tick,"B",pad.slot,towerNames.indexOf(action.type)]);
        event("B",pad.x,pad.y,action.type);
      } else if (action.op === "upgrade" && turret && turret.tier < 3) {
        const cost = turret.tier * towers[turret.type].cost;
        if (gold < cost) continue;
        gold -= cost;
        turret.spent += cost;
        turret.tier++;
        turret.range += 30;
        turret.damage = Math.floor(turret.damage*16/10);
        log.push([tick,"U",pad.slot,turret.tier]);
        event("U",pad.x,pad.y,turret.type);
      } else if (action.op === "sell" && turret) {
        gold += Math.floor(turret.spent*70/100);
        pad.turret = null;
        log.push([tick,"S",pad.slot,0]);
        event("S",pad.x,pad.y,turret.type);
      }
    }
  }
  function startWave() {
    wave++;
    if (wave > 1) multiplier = Math.floor(multiplier*108/100);
    gold += Math.min(50,Math.floor(gold*5/100)) + 10 + 2*wave;
    const composition = preview;
    preview = compose(wave+1);
    event("W",1200,700,null);
    apply(strategy.plan(state()));
    composition.forEach((unit,index) => queue.push({
      unit, wave, tick:tick+4*index, index, hp:Math.floor(unit.hp*multiplier/1000)
    }));
    queue.sort((a,b) => a.tick-b.tick || a.wave-b.wave || a.index-b.index);
  }
  function within(entity, x, y, radiusSquared) {
    const dx = entity.x-x;
    const dy = entity.y-y;
    return dx*dx+dy*dy <= radiusSquared;
  }
  function fire(pad) {
    const turret = pad.turret;
    if (!turret) return;
    if (turret.cooldown > 0 && --turret.cooldown > 0) return;
    const spec = towers[turret.type];
    const candidates = enemies.filter(enemy =>
      (spec.domains & (1 << enemy.air)) && within(enemy,pad.x,pad.y,turret.range*turret.range));
    if (!candidates.length) return;
    const pick = typeof strategy.target === "function" && strategy.target(
      {slot:pad.slot,type:turret.type,tier:turret.tier,x:pad.x,y:pad.y,range:turret.range},
      candidates.map(view)
    );
    let target = candidates.find(enemy => enemy.id === pick);
    if (!target) {
      target = candidates[0];
      for (const candidate of candidates) {
        if (routes[candidate.air].length-candidate.progress < routes[target.air].length-target.progress) {
          target = candidate;
        }
      }
    }
    event("T",target.x,target.y,turret.type,spec.splash,pad.x,pad.y,target.id);
    turret.cooldown = spec.period;
    const victims = spec.splash ? enemies.filter(enemy =>
      (spec.domains & (1 << enemy.air)) && within(enemy,target.x,target.y,spec.splash*spec.splash)) : [target];
    for (const enemy of victims) {
      enemy.hp -= turret.type === "lance" ? turret.damage : Math.max(1,turret.damage-enemy.armor);
      if (spec.slow) enemy.slow = spec.slow;
    }
    const defeated = victims.filter(enemy => enemy.hp <= 0);
    for (const enemy of defeated) {
      enemies.splice(enemies.indexOf(enemy),1);
      gold += enemy.bounty;
      log.push([tick,"K",enemy.id,pad.slot]);
      event("K",enemy.x,enemy.y,enemy.type,0,enemy.x,enemy.y,enemy.id);
      if (enemy.type === "splitter") {
        const hp = Math.max(1,Math.floor(enemy.maxHp/4));
        for (let n = 0; n < 3; n++) spawn(child,enemy.wave,hp,enemy.progress);
      }
    }
  }

  for (; tick < maxTicks; tick++) {
    if (tick >= 20 && (tick-20)%40 === 0) startWave();
    while (queue.length && queue[0].tick === tick) {
      const entry = queue.shift();
      spawn(entry.unit,entry.wave,entry.hp,0);
    }
    for (let index = 0; index < enemies.length; index++) {
      const enemy = enemies[index];
      enemy.progress += enemy.slow ? Math.floor(enemy.speed*60/100) : enemy.speed;
      if (enemy.progress >= routes[enemy.air].length) {
        baseHp -= enemy.leak;
        enemies.splice(index--,1);
        log.push([tick,"L",enemy.id,baseHp]);
        event("L",2350,1150,enemy.type,0,2350,1150,enemy.id);
        if (baseHp <= 0) {
          fallTick = tick;
          log.push([tick,"F",wave,0]);
          event("F",2350,1150,enemy.type);
          break;
        }
      } else position(enemy);
    }
    if (fallTick < 0) {
      for (const enemy of enemies) {
        if (++enemy.age % 20 === 0 && enemy.type === "mender") {
          event("H",enemy.x,enemy.y,enemy.type,150);
          for (const healed of enemies) {
            if (within(healed,enemy.x,enemy.y,150*150)) {
              healed.hp = Math.min(healed.maxHp,healed.hp+Math.floor(healed.maxHp*8/100));
            }
          }
        }
      }
      for (const pad of slots) fire(pad);
      for (const enemy of enemies) if (enemy.slow > 0) enemy.slow--;
    }
    if (observer) observer.frame(state());
    if (fallTick >= 0) break;
  }
  let hash = 0x811c9dc5;
  const json = JSON.stringify(log);
  for (let i = 0; i < json.length; i++) hash = Math.imul(hash ^ json.charCodeAt(i),0x01000193);
  return {
    score:Math.round(((fallTick < 0 ? maxTicks : fallTick)-20)*100/40)/100,
    fallTick, log, hash:(hash >>> 0).toString(16).padStart(8,"0")
  };
}
</script>

<script>
(() => {
  "use strict";

  const DURATION = 100;
  const TPS = 20;
  const frames = [];
  const events = Array.from({length:2020}, () => []);
  const allEvents = [];
  const births = new Map();
  let paths;
  function recordedStrategy() { return createStrategy(); }
  recordedStrategy.observe = {
    board(data) { paths = data; },
    frame(frame) {
      frame.byId = new Map();
      for (const enemy of frame.enemies) {
        frame.byId.set(enemy.id, enemy);
        if (!births.has(enemy.id)) births.set(enemy.id,frame.tick);
      }
      frames.push(frame);
    },
    event(event) {
      events[event.tick].push(event);
      allEvents.push(event);
    }
  };
  const replay = rampartSimulate(recordedStrategy, 42, 2020);
  const fallTime = replay.fallTick < 0 ? Infinity : replay.fallTick/TPS;

  for (let i=0;i<10;i++) pen.fillText(String(i),i*64+32,78);
  const glyphMap = new THREE.CanvasTexture(glyphAtlas);
  glyphMap.encoding = THREE.sRGBEncoding;
  glyphMap.minFilter = THREE.LinearFilter;
  const glyphGeometry = Array.from({length:10},(_,n) => {
    const g = hudQuad.clone(), uv = g.attributes.uv;
    for (let i=0;i<uv.count;i++) uv.setX(i,(n*64+.5+uv.getX(i)*63)/640);
    return g;
  });
  let widgets = 0;
  function widget(g,color,x,y,w,h,order,opacity=1,angle=0,map=null) {
    let mesh = hudMeshes[widgets++];
    if (!mesh) {
      mesh = new THREE.Mesh(g,new THREE.MeshBasicMaterial({
        transparent:true,depthTest:false,depthWrite:false,toneMapped:false,map
      }));
      hudMeshes.push(mesh);
      hud.add(mesh);
    }
    if (mesh.material.map !== map) {
      mesh.material.map = map;
      mesh.material.needsUpdate = true;
    }
    mesh.geometry = g;
    mesh.visible = true;
    mesh.material.color.copy(rgb(color));
    mesh.material.opacity = opacity;
    mesh.position.set(x,height-y,0);
    mesh.scale.set(w,h,1);
    mesh.rotation.z = angle;
    mesh.renderOrder = order;
  }
  function numeral(number,x,y,size,color,step=.53) {
    for (const char of String(number)) {
      widget(glyphGeometry[Number(char)],color,x+size*.333,y,size*64/96,size,4,1,0,glyphMap);
      x += size*step;
    }
    return x;
  }
  const previewIcons = {
    grunt:hexIcon, runner:arrowIcon, wisp:diamondIcon, brute:shieldIcon, splitter:diamondIcon, mender:circleIcon
  };
  const pipLoss = [];
  for (const [tick,code,,hp] of replay.log) {
    if (code !== "L") continue;
    for (let n=Math.max(0,hp);n<(pipLoss.previousHp ?? 10);n++) pipLoss[n] = tick/TPS;
    pipLoss.previousHp = hp;
  }
  function drawHud(frame,time) {
    widgets = 0;
    const ui = clamp(height/650,.85,1.38);
    const margin = Math.max(21,Math.round(width*.026));
    const top = 24*ui;
    const waveSize = Math.max(height*.115,59*ui);
    const waveY = top+waveSize*.39;
    const plateWidth = 28*ui;
    const emblemX = margin+plateWidth/2;
    const goldY = top+waveSize*.86+13*ui;
    const previewY = goldY+26*ui;
    widget(shieldIcon,0x45524f,emblemX,waveY+3*ui,plateWidth,32*ui,1,.78);
    widget(shieldIcon,0x202f36,emblemX,waveY+3*ui,plateWidth-3*ui,28*ui,2);
    for (const direction of [-1,1]) {
      widget(hudQuad,0xe1b971,emblemX,waveY+2*ui,2.7*ui,18*ui,3,1,direction*.61);
      widget(hudQuad,0xc49353,emblemX+direction*4*ui,waveY+8*ui,7*ui,1.6*ui,3,1,direction*.61);
    }
    numeral(frame.wave,margin+37*ui,waveY,waveSize,0xf1ede0);
    widget(hudQuad,0x967d58,margin+42*ui,goldY-15*ui,84*ui,1*ui,1,.58);
    widget(circleIcon,0xf2c67b,margin+8*ui,goldY,15*ui,15*ui,2);
    widget(circleIcon,0x6d553a,margin+8*ui,goldY,10*ui,10*ui,3);
    widget(diamondIcon,0xf9d899,margin+8*ui,goldY,4*ui,7*ui,4);
    numeral(frame.gold,margin+19*ui,goldY,27*ui,0xf2c67b);
    const counts = Object.create(null);
    for (const type of frame.nextWave) counts[type] = (counts[type] || 0)+1;
    let previewX = margin;
    for (const type of Object.keys(previewIcons)) {
      if (!counts[type]) continue;
      const count = counts[type];
      const tileWidth = (count >= 10 ? 46 : 37)*ui;
      widget(badge,0x101b26,previewX+tileWidth/2,previewY,tileWidth,20*ui,1,.8);
      widget(previewIcons[type],palette[type],previewX+10*ui,previewY,10*ui,10*ui,3);
      if (type === "splitter") widget(diamondIcon,0xe6a4ff,previewX+10*ui,previewY,3.6*ui,5.4*ui,4);
      if (type === "mender") {
        widget(hudQuad,0x559b66,previewX+10*ui,previewY,1.5*ui,6*ui,4);
        widget(hudQuad,0x559b66,previewX+10*ui,previewY,6*ui,1.5*ui,4);
      }
      numeral(count,previewX+18*ui,previewY+.5*ui,17*ui,0xdfe6df,.46);
      previewX += tileWidth+4*ui;
    }
    const right = width-margin, pipStep = 17*ui, pipY = top+14*ui;
    widget(badge,0x18232c,right-5*pipStep,pipY,10*pipStep+14*ui,32*ui,1,.85);
    for (let i=0;i<10;i++) {
      const cx = right-(9.5-i)*pipStep;
      const age = time-(pipLoss[i] ?? Infinity);
      const flash = age >= 0 && age < .30;
      const intact = i < frame.baseHp;
      widget(shieldIcon,intact ? 0xaf9563 : 0x35414a,cx,pipY,13*ui,16*ui,2);
      widget(shieldIcon,flash?0xff765b:intact?0xe6bd77:0x202a35,cx,pipY,9*ui,12*ui,3,flash ? 1-age*.9 : 1);
      if (intact) widget(hudQuad,0xffebbe,cx,pipY-4.1*ui,6*ui,1.2*ui,4);
    }
    for (let i=widgets;i<hudMeshes.length;i++) hudMeshes[i].visible = false;
  }

  const stage = document.getElementById("stage");
  const eye = new THREE.Vector3();
  const focus = new THREE.Vector3(12,0,7);
  const viewDirection = new THREE.Vector3(-.11,Math.sin(55*Math.PI/180),Math.cos(55*Math.PI/180)).normalize();
  const bounds = [];
  for (const x of [-.5,24.62]) for (const z of [-.48,14.5]) {
    bounds.push(new THREE.Vector3(x,0,z),new THREE.Vector3(x,-1.21,z));
  }
  bounds.push(new THREE.Vector3(.25,1.52,2.5),new THREE.Vector3(23.5,1.99,11.5));
  const projected = new THREE.Vector3();
  function fitCamera() {
    width = window.innerWidth;
    height = window.innerHeight;
    camera.aspect = width/height;
    camera.updateProjectionMatrix();
    camera.projectionMatrix.elements[9] -= Math.min(106,height*.17)/height;
    camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
    const lower = 2*Math.min(102,height*.31)/height - 1;
    const upper = 1 - 2*Math.min(28,height*.075)/height;
    const right = 1 - 2*Math.min(39,width*.075)/width;
    let lo = 8, hi = 160;
    for (let i=0;i<24;i++) {
      const distance = (lo+hi)/2;
      camera.position.copy(focus).addScaledVector(viewDirection,distance);
      camera.lookAt(focus);
      camera.updateMatrixWorld(true);
      const fits = bounds.every(point => {
        projected.copy(point).project(camera);
        return Math.abs(projected.x) <= right && projected.y >= lower && projected.y <= upper && projected.z < 1;
      });
      if (fits) hi = distance; else lo = distance;
    }
    eye.copy(focus).addScaledVector(viewDirection,hi);
    camera.position.copy(eye);
    camera.lookAt(focus);
    camera.updateMatrixWorld(true);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    hudCamera.right = width;
    hudCamera.top = height;
    hudCamera.updateProjectionMatrix();
  }
  const shakeNoise = Array.from({length:2408},() => [random()*2-1,random()*2-1,random()*2-1]);
  function shake(time) {
    let lo=0,hi=traumaEvents.length;
    while (lo<hi) {
      const mid=(lo+hi)>>1;
      if (traumaEvents[mid].time <= time) lo=mid+1; else hi=mid;
    }
    const last=traumaEvents[lo-1];
    const strength=last ? Math.max(0,last.trauma-(time-last.time)) : 0;
    camera.position.copy(eye);
    if (strength > 0) {
      const p = time*24, k = Math.floor(p), u = smooth(p-k);
      const a=shakeNoise[k], b=shakeNoise[k+1], magnitude=.25*strength*strength/Math.sqrt(3);
      camera.position.x += magnitude*lerp(a[0],b[0],u);
      camera.position.y += magnitude*lerp(a[1],b[1],u);
      camera.position.z += magnitude*lerp(a[2],b[2],u);
    }
    camera.updateMatrixWorld(true);
  }

  function render(time) {
    const activeTime = Math.min(time,fallTime);
    const q = activeTime*TPS;
    const k = Math.min(finalTick,Math.floor(q));
    const next = frames[Math.min(finalTick,k+1)];
    const frame = frames[k];
    const mix = next === frame ? 0 : q-k;
    shake(time);
    for (const mesh of dynamicGroups.values()) mesh.count = 0;
    drawKeep(time,frame);
    for (const pad of frame.slots) drawTurret(pad,shotAims[k][pad.slot],activeTime);
    for (const enemy of frame.enemies) drawEnemy(enemy,next.byId.get(enemy.id),mix,activeTime,q,events[k+1]);
    drawEvents(time,Math.min(finalTick,Math.floor(time*TPS)));
    atmosphere(activeTime);
    for (const mesh of dynamicGroups.values()) {
      mesh.visible = mesh.count > 0;
      if (!mesh.visible) continue;
      mesh.instanceMatrix.updateRange.count = mesh.count*16;
      mesh.instanceColor.updateRange.count = mesh.count*3;
      mesh.instanceMatrix.needsUpdate = true;
      mesh.instanceColor.needsUpdate = true;
    }
    stage.style.filter = time < fallTime ? "" : "grayscale("+(.94*smooth(clamp(time-fallTime,0,1)))+")";
    renderer.clear();
    renderer.render(scene,camera);
    drawHud(frame,time);
    renderer.clearDepth();
    renderer.render(hud,hudCamera);
  }

  const audioVariation = new Map(allEvents.map(event => [event,audioRandom()]));
  const shotVolumeRank = {lance:5,cannon:4,flak:3,bolt:2,frost:1};
  const AudioEngine = window.AudioContext || window.webkitAudioContext;
  const audio = AudioEngine ? new AudioEngine() : null;
  const sources = new Set();
  const heardShots = [];
  let master, noise, wind;
  let audioActive = false;
  if (audio) {
    master = audio.createGain();
    master.gain.value = 0;
    const compressor = audio.createDynamicsCompressor();
    compressor.threshold.value = -15;
    compressor.knee.value = 15;
    compressor.ratio.value = 5;
    compressor.attack.value = .004;
    compressor.release.value = .16;
    master.connect(compressor).connect(audio.destination);
    noise = audio.createBuffer(1,Math.floor(audio.sampleRate*2.4),audio.sampleRate);
    const samples = noise.getChannelData(0);
    for (let i=0;i<samples.length;i++) samples[i] = audioRandom()*2-1;
    const resumeAudio = () => audio.resume().catch(() => {});
    resumeAudio();
    function unlock() {
      resumeAudio();
      window.removeEventListener("pointerdown",unlock,true);
      window.removeEventListener("keydown",unlock,true);
    }
    window.addEventListener("pointerdown",unlock,true);
    window.addEventListener("keydown",unlock,true);
  }
  function panner(x) {
    const node = audio.createStereoPanner();
    node.pan.value = clamp((x/2400-.5)*1.65,-.82,.82);
    node.connect(master);
    return node;
  }
  function track(source,nodes) {
    sources.add(source);
    source.onended = () => {
      sources.delete(source);
      source.disconnect();
      for (const node of nodes) node.disconnect();
    };
  }
  function note(x,kind,from,to,duration,peak,offset=0,attack=.006) {
    const t = audio.currentTime+offset;
    const oscillator = audio.createOscillator();
    oscillator.type = kind;
    oscillator.frequency.setValueAtTime(from,t);
    oscillator.frequency.exponentialRampToValueAtTime(Math.max(1,to),t+duration);
    const gain = audio.createGain();
    gain.gain.setValueAtTime(.0001,t);
    gain.gain.exponentialRampToValueAtTime(peak,t+attack);
    gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
    const pan = panner(x);
    oscillator.connect(gain).connect(pan);
    track(oscillator,[gain,pan]);
    oscillator.start(t);
    oscillator.stop(t+duration+.01);
  }
  function noiseBurst(x,filterType,frequency,duration,volume,variation,offset=0) {
    const t = audio.currentTime+offset;
    const source = audio.createBufferSource();
    source.buffer = noise;
    const filter = audio.createBiquadFilter();
    filter.type = filterType;
    filter.frequency.setValueAtTime(frequency,t);
    filter.frequency.exponentialRampToValueAtTime(Math.max(55,frequency*.27),t+duration);
    filter.Q.value = .68;
    const gain = audio.createGain();
    gain.gain.setValueAtTime(.0001,t);
    gain.gain.exponentialRampToValueAtTime(volume,t+.007);
    gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
    const pan = panner(x);
    source.connect(filter).connect(gain).connect(pan);
    track(source,[filter,gain,pan]);
    source.start(t,variation*.86);
    source.stop(t+duration+.01);
  }
  function startWind() {
    if (wind) return;
    const source = audio.createBufferSource();
    source.buffer = noise;
    source.loop = true;
    const low = audio.createBiquadFilter();
    low.type = "lowpass";
    low.frequency.value = 260;
    const gain = audio.createGain();
    gain.gain.setValueAtTime(0,audio.currentTime);
    gain.gain.linearRampToValueAtTime(.095,audio.currentTime+.7);
    source.connect(low).connect(gain).connect(master);
    wind = source;
    track(source,[low,gain]);
    source.start();
  }
  function activateAudio(on) {
    if (!audio || on === audioActive) return;
    audioActive = on;
    const t = audio.currentTime;
    if (master.gain.cancelAndHoldAtTime) master.gain.cancelAndHoldAtTime(t);
    else {
      const gain = master.gain.value;
      master.gain.cancelScheduledValues(t);
      master.gain.setValueAtTime(gain,t);
    }
    master.gain.linearRampToValueAtTime(on ? .61 : 0,t+(on ? .024 : .036));
    if (!on) {
      for (const source of sources) source.stop(t+.04);
      wind = null;
    }
  }
  function sound(event) {
    const x = event.code === "T" ? .64*event.fromX+.36*event.x : event.x;
    const v = audioVariation.get(event);
    const detune = .91+v*.19;
    if (event.code === "T") {
      switch (event.type) {
        case "bolt":
          note(x,"triangle",980*detune,330,.071,.07);
          noiseBurst(x,"highpass",2600,.046,.026,v);
          break;
        case "cannon":
          note(x,"sine",115*detune,41,.19,.18);
          noiseBurst(x,"lowpass",1190,.16,.16,v);
          break;
        case "frost":
          noiseBurst(x,"bandpass",3400,.12,.083,v);
          note(x,"sine",1400*detune,1015,.105,.032);
          break;
        case "lance":
          note(x,"sawtooth",325*detune,68,.155,.059);
          noiseBurst(x,"bandpass",1650,.12,.074,v);
          break;
        case "flak":
          noiseBurst(x,"highpass",2100,.122,.11,v);
          note(x,"square",207*detune,97,.087,.026);
          break;
      }
    } else if (event.code === "K") {
      note(x,"sine",212*detune,71,.084,.055);
    } else if (event.code === "W") {
      note(x,"triangle",122,185,.33,.12,0,.097);
      note(x,"sine",185,278,.38,.062,.06,.14);
    } else if (event.code === "L") {
      noiseBurst(x,"highpass",2080,.23,.22,v);
      note(x,"triangle",500,278,.35,.12);
    } else if (event.code === "F") {
      noiseBurst(x,"lowpass",750,1.19,.39,v);
      noiseBurst(x,"bandpass",1400,.43,.23,1-v,.045);
      note(x,"sine",84,27,1.23,.32,0,.022);
    }
  }
  function playAudioRange(from,to) {
    if (!audio || !audioActive || audio.state !== "running") return;
    const shots = [];
    for (let tick=Math.floor(from*TPS)+1;tick<=Math.min(finalTick,Math.floor(to*TPS));tick++) {
      for (const event of events[tick]) {
        if (event.code === "T") shots.push(event);
        else if (event.code === "K" || event.code === "W" || event.code === "L" || event.code === "F") sound(event);
      }
    }
    const now = audio.currentTime;
    while (heardShots.length && now-heardShots[0] >= 1) heardShots.shift();
    shots.sort((a,b) => shotVolumeRank[b.type]-shotVolumeRank[a.type] || a.tick-b.tick);
    for (const event of shots) {
      const rank = shotVolumeRank[event.type];
      if (heardShots.length >= (rank < 3 ? 8 : 12)) continue;
      sound(event);
      heardShots.push(now);
    }
    if (to >= fallTime+.78) startWind();
  }

  const COUNTDOWN = "COUNTDOWN", PLAYING = "PLAYING", PAUSED = "PAUSED";
  const REFIRE_HOLD = "REFIRE_HOLD", ENDED = "ENDED";
  const countdown = document.getElementById("countdown");
  const scrubber = document.getElementById("scrubber");
  const toggle = document.getElementById("btn-toggle");
  const iconPause = document.getElementById("icon-pause");
  const iconPlay = document.getElementById("icon-play");
  const speedPills = document.querySelectorAll(".speed-pill");
  let state = COUNTDOWN;
  let simTime = 0, playbackSpeed = 1;
  let countdownElapsed = 0, holdElapsed = 0;
  let dragging = false;
  let clockPrimed = false;
  let previousRaf = null;

  function hideCountdown() {
    countdown.style.display = "none";
    countdown.textContent = "";
  }
  function setState(next) {
    state = next;
    if (next !== COUNTDOWN) hideCountdown();
    const running = next === PLAYING || next === COUNTDOWN || next === REFIRE_HOLD;
    iconPause.style.display = running ? "" : "none";
    iconPlay.style.display = running ? "none" : "";
    toggle.setAttribute("aria-label",running ? "Pause" : "Play");
    activateAudio(next === PLAYING && !dragging);
  }
  function drawTime() {
    render(simTime);
  }
  function advance(dt) {
    const previous = simTime;
    simTime = Math.min(DURATION,simTime+dt*playbackSpeed);
    scrubber.value = simTime.toFixed(3);
    playAudioRange(previous,simTime);
    if (simTime !== previous && (previous < fallTime+1.25 || simTime === DURATION)) drawTime();
    if (simTime === DURATION) setState(ENDED);
  }
  function animate(stamp) {
    const dt = previousRaf === null ? 0 : Math.min(Math.max(0,(stamp-previousRaf)/1000),.1);
    previousRaf = stamp;
    if (state === COUNTDOWN) {
      if (clockPrimed) countdownElapsed += dt;
      clockPrimed = true;
      if (countdownElapsed < 3) {
        countdown.style.display = "block";
        countdown.textContent = String(3-Math.floor(countdownElapsed));
      } else {
        setState(PLAYING);
        advance(dt);
      }
    } else if (state === REFIRE_HOLD) {
      holdElapsed += dt;
      if (holdElapsed >= 1) setState(PLAYING);
    } else if (state === PLAYING) {
      advance(dt);
    }
    requestAnimationFrame(animate);
  }
  toggle.addEventListener("click",() => {
    if (state === PAUSED) {
      previousRaf = performance.now();
      setState(PLAYING);
    } else if (state === ENDED) {
      simTime = 0;
      scrubber.value = "0";
      drawTime();
      previousRaf = performance.now();
      setState(PLAYING);
    } else setState(PAUSED);
  });
  document.getElementById("btn-refire").addEventListener("click",() => {
    holdElapsed = 0;
    simTime = 0;
    scrubber.value = "0";
    previousRaf = performance.now();
    setState(REFIRE_HOLD);
    drawTime();
  });
  for (const pill of speedPills) {
    pill.addEventListener("click",() => {
      playbackSpeed = Number(pill.dataset.speed);
      for (const button of speedPills) {
        button.classList.toggle("is-active",button === pill);
        button.setAttribute("aria-checked",String(button === pill));
      }
    });
  }
  scrubber.addEventListener("pointerdown",() => {
    dragging = true;
    activateAudio(false);
  });
  function releaseScrub() {
    dragging = false;
    activateAudio(state === PLAYING);
  }
  window.addEventListener("pointerup",releaseScrub);
  window.addEventListener("pointercancel",releaseScrub);
  scrubber.addEventListener("input",() => {
    simTime = Number.parseFloat(scrubber.value);
    setState(PAUSED);
    drawTime();
  });
  window.addEventListener("resize",() => {
    fitCamera();
    drawTime();
  });
  hideCountdown();
  fitCamera();
  drawTime();
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
